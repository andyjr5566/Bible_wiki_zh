- title: 亞伯拉罕
  path: link_folder/人物/亞伯拉罕.md
  summary: 亞伯拉罕已經去世，本章卻處處是他的影子。第1節開頭就把兩代人的饑荒並排：「在亞伯拉罕的日子，那地有一次饑荒；這時又有饑荒」（1節）。第3節神向以撒重申的，是「我必堅定我向你父亞伯拉罕所起的誓」，第5節給出理由：「都因亞伯拉罕聽從我的話，遵守我的吩咐和我的命令、律例、法度。」CT 註第5節指出，聽從神的話本身就包含了遵守祂的吩咐、命令、律例、法度：「這些不同的詞，是在表明亞伯拉罕對神旨意的順服是完全的」。
  relation: 本章讓亞伯拉罕之約傳到第二代，也讓亞伯拉罕的失敗傳到第二代。GT《創世記雷氏研讀本》說明約的性質：「雖然神與亞伯拉罕所立的約是出於神無條件的恩典，但祂也樂於承認亞伯拉罕的美德（如在二二16一樣），並向以撒確認這約。」另一面，以撒稱妻為妹是重蹈覆轍——CT：「以撒重蹈他父親亞伯拉罕的覆轍，指出一般人常有一種傾向，對於我們所敬重的人，不但是他們的長處，連他們的缺點也喜歡模倣。」同樣是遇上饑荒，兩人的帶領卻不一樣，CT 由此讀出一句話：「神容讓亞伯拉罕下到埃及，卻阻止以撒下埃及，可見神對每一個人的帶領是不一樣的。」
