organization: '本章是《創世記》中唯一以以撒為獨立主角的篇章——他一生從未離開應許之地（不像亞伯拉罕曾下埃及），卻在饑荒考驗中走到西南邊界的基拉耳，一路重走父親走過的腳蹤，也一路親身經歷神的信實引領。


  ### 一、饑荒、遷居與約的重申（1-6節）


  經文開頭記載「這時又有[[饑荒]]」（רָעָב，H7458）。在聖經中，[[饑荒]]常是神用來試驗人心的過程，顯明人在困境中究竟倚靠什麼（創12:10；得1:1）。以撒因此前往[[基拉耳]]（גְּרָר，H1642；位於[[非利士人]]
  פְּלִשְׁתִּים，H6430G 的領域），來到邊界地帶的亞比米勒（אֲבִימֶלֶךְ，H40G）那裡。此時耶和華向以撒顯現，明確吩咐他「不要下[[埃及]]去」（מִצְרָיְמָה，H4714G），要住在他所指示的土地上。神命令他「寄居在這地」（גּוּר，H1481A），並親自向他重申[[亞伯拉罕之約|亞伯拉罕之約]]的核心應許：神必與他同在、賜福給他、將土地賜給他和後裔、使後裔如天星增多，並使萬國因其後裔得福（3-4節）。神指出這些福分「都因亞伯拉罕聽從我的話，遵守我的吩咐（מִשְׁמַרְתִּי，H4931）和我的命令（מִצְוֺתַי，H4687）、律例（חֻקּוֹתַי，H2708）、法度（תוֹרֹתָי，H8451）」（5節），表明上一代的順服能成為下一代蒙福的堅實基礎。


  > [!note] 神的准許 ≠ 神的旨意

  > CT 指出：神阻止以撒下埃及，卻「准許」他寄居在基拉耳——這在當時是一種過渡性的安排。信徒應當專心尋求神完全的心意，而不僅僅以得到神最低限度的容許為滿足。


  GT 華爾頓《創世記背景註釋》為本章開頭提供了兩個關鍵的歷史地理背景。關於饑荒：古代巴勒斯坦因依賴季節雨水，降雨時節與雨量極不穩定，經常發生旱災與饑荒；經文特意說明這是在亞伯拉罕年代之後發生的另一次饑荒，顯明這是兩次獨立的歷史事件，而非同一事件的重複敘述。關於非利士人：歷史上大量非利士人是在主前
  1200 年海上民族入侵、打破埃及控制後才全面定居迦南南部平原，並建立五城聯盟（迦薩、迦特、亞實突、以革倫、亞實基倫）；創世記此處提及的非利士人，可能是早在主前
  1200 年前就已在此定居的早期移民，或者是聖經作者採用「今名古用」的地理表達方式，讓後世讀者清楚辨認出該區域即後來的非利士境內。這與創世記第 21 章的歷史背景考證相同，註釋家採取並陳各方客觀證據的立場。


  ### 二、重蹈稱妻為妹的過犯（7-11節）


  以撒因為懼怕當地人加害，稱妻子[[利百加]]為妹子（אֲחֹתִי，H269；不敢認作 אִשְׁתִּי，H802H）——[[稱妻說謊|重蹈了父親亞伯拉罕兩次的覆轍]]（創
  12、20 章），這顯出人在危難時往往因眼前的恐懼而忽略了神「我必與你同在」的應許。然而經文記載以撒在那裡「住了許久」都平平安安，客觀事實證明當初的懼怕多半來自人內心的焦慮。


  GT 華爾頓《創世記背景註釋》指出，妻子／姊妹的敘事主題在創世記族長歷史中一共出現過三次（創 12、20、26 章）；而「亞比米勒」（אֲבִימֶלֶךְ，字面意為「我父是王」）在古代近東通常是君王的尊稱或世襲王朝頭銜。華爾頓進一步分析，本次事件的結局與前兩次被驅逐出境不同，以撒夫婦獲得了非利士王室的公開法律保護（11節），並獲准在基拉耳境內耕種與放牧，這也為第
  12 節隨後的農業收成提供了合法的社會背景。


  後來[[亞比米勒]]從窗戶往外觀看，赫然看見以撒與利百加有夫妻間的親密舉動（經文使用動詞 מְצַחֵק，H6711，字根與「以撒」יִצְחָק 諧音雙關），因而當面揭穿謊言。亞比米勒嚴肅責備以撒差點讓百姓陷在道德的過犯中——神的子民因隱瞞真相而受到外邦君王的指責，是一件值得深刻省思的事。


  ### 三、蒙福、嫉妒與挖井（12-22節）


  以撒在那地耕種，那一年蒙神特別看顧，獲得了「百倍的收成」（מֵאָה שְׁעָרִים，H3967、H8180；[[百倍收成]]），家產日漸增長，成了大富戶。這份興盛引起了周圍人的忌恨，[[非利士人的嫉妒|非利士人就嫉妒他]]（וַיְקַנְאוּ，H7065），動手把亞伯拉罕在世時僕人所挖的水井全部用泥土[[塞井|填滿塞住]]（סִתְּמוּם，H5640）——在乾旱地區，塞住水源等於切斷他人的生存基礎。面對衝突，亞比米勒要求以撒離開，以撒便退讓遷往[[基拉耳谷]][[支搭帳棚]]，並在那裡[[挖井|重新挖出]]父親遺留的井，依然沿用父親當年為井所起的名字。


  對於以撒從事耕種是否代表從遊牧完全轉為定居，GT 華爾頓《創世記背景註釋》指出：遊牧族群在既定的放牧路線上順應季節種植穀物或收成作物，在古代近東是常見的生活型態，這可能是定居過程的階段之一，但並不意味著他徹底放棄了客旅寄居的身分。


  關於水源的衝突，華爾頓進一步說明：古代水井多由特定家族或村落耗費龐大人力挖掘與維護，在乾旱地帶，水是人畜與作物存活的最關鍵資產，因此常引發所有權的激烈爭端。非利士人塞井不僅是排擠，更是藉此消除亞伯拉罕家族對當地的土地使用宣稱；而以撒重新疏通並沿用父親的舊井名，在古代法律習俗上就是重新確立合法的權利。華爾頓在第
  20 節註釋中指出，在古代近東為水源或天然地產命名，是公開宣告其合法所有權的通用方式，既能確立產權，也能在爭議發生時提供歷史佐證。


  以撒面對步步逼迫，採取退讓與和平的態度，連續挖了三口水井，展現了屬靈生命的成熟進程：


  | 井名 | 原文依據與意義 | 實際經歷與解經意涵 |

  |---|---|---|

  | [[埃色（相爭）]] | `עֵשֶׂק`（H6230），動詞見 `הִֽתְעַשְּׂק֖וּ`（H6229，相爭／爭吵） | 相爭——基拉耳的牧人前來爭吵說「這水是我們的」，以撒退讓不相爭。
  |

  | [[西提拿（為敵）]] | `שִׂטְנָה`（H7856，意為「為敵／敵對」） | 為敵——衝突加劇、敵意升高，以撒再度選擇和平離開。 |

  | [[利河伯（寬闊）]] | `רְחֹבוֹת`（H7344G），動詞見 `הִרְחִיב`（H7337，開闊／擴大） | 寬闊——眾人不再爭競，以撒宣告「耶和華現在給我們寬闊之地（הִרְחִיב
  יְהוָה לָנוּ），我們必在這地昌盛（וּפָרִינוּ）」。 |


  > [!quote] KC

  > 水井在屬靈象徵上常被比擬為神話語的活水泉源；父輩辛勤挖出的井若被世俗的泥土（世事紛擾）堵塞，信徒必須親自將泥土清除，才能重新得著活水的湧流。我們一方面要珍惜歷代先賢留下來的屬靈遺產，另一方面也必須親自經歷神的恩典，持守真理的原意，而不隨意更改或曲解神話語的真實內涵。


  ### 四、別是巴的顯現與立約（23-33節）


  以撒隨後前往[[別是巴]]（בְּאֵר שָׁבַע，H884；亞伯拉罕昔日立約居住之地），當夜耶和華第二次向他顯現，親自宣告：「我是你父親亞伯拉罕的神，不要懼怕！因為我與你同在，要賜福給你，並要為我僕人亞伯拉罕的緣故，使你的後裔繁多。」以撒隨即在那裡[[築壇]]（וַיִּבֶן
  מִזְבֵּחַ，H1129、H4196）、[[求告耶和華的名]]（וַיִּקְרָא בְּשֵׁם יְהוָה，H7121G、H8034、H3068G）、[[支搭帳棚]]（וַיֶּט
  אָהֳלוֹ，H5186、H168），僕人也在那裡挖井——這呈現了屬靈生活的四重次序：先敬拜神、信靠交託，再持守寄居的身分，並在生活中尋求神的供應。


  GT 華爾頓《創世記背景註釋》指出，第 25 節的四個動作在古代近東文化中具有明確的產權與盟約意涵：築壇是公開承認神顯現之地的聖潔，而支搭帳棚與挖掘水井則是古代公認在無主土地上確立實際居住權與生活權的合法途徑。屬靈生命的敬拜與生活領域的落實，在此形成了緊密的呼應。


  以撒與非利士人分別並退讓之後，反而贏得了對方的敬畏與承認：[[亞比米勒]]帶著同伴[[亞戶撒]]與軍長[[非各]]親自前來求和立約，坦言：「我們明明的看見耶和華與你同在（רָאוֹ
  רָאִינוּ כִּי הָיָה יְהוָה עִמָּךְ）」（28節；[[神的同在被人看見]]）。這生動印證了箴言 16:7 所說的原則：人所行的若蒙耶和華喜悅，神就使他的仇敵與他和好。


  GT 華爾頓《創世記背景註釋》進一步說明：第 28 至 31 節雙方舉行的筵席（מִשְׁתֶּה，H4960）與起誓（וַיִּשָּׁבְעוּ，H7650），構成古代近東正式訂立和平盟約（בְּרִית，H1285；[[立約]]）的法定程序，使以撒在當地的和平居住權獲得鄰邦君王的法律認可。


  針對第 33 節以撒為該井命名為示巴（שִׁבְעָה，H7656，意為「誓約／七」）並使該城名為別是巴，是否與創世記 21:31 亞伯拉罕當年的命名有所重複，華爾頓指出：在古代近東，重述一個地名往往是為既有的地名賦予新的歷史紀念與深刻意義，正如人名與地名常在不同時代的重大事件中被再次重申一樣。同一天，以撒的僕人前來報告挖井得水（מָצָאנוּ
  מָיִם，H4672、H4325G），水井的開啟與和平誓約的確立在同一天成就，成為神賜福的鮮明記號。


  ### 五、以掃娶外邦女子（34-35節）


  [[以掃]]四十歲時（以撒此時約一百歲），自行娶了[[赫人]][[比利]]的女兒[[猶滴]]，以及赫人[[以倫]]的女兒[[巴實抹]]為妻（[[以掃娶外邦女子]]）。KC
  指出，以掃像該隱一樣純憑個人喜好自行娶妻，與亞當和以撒由神引領預備妻子的態度截然不同；這反映出他對屬靈傳承與長子名分的輕忽（呼應創 25 章出賣名分的態度）。這兩位外邦媳婦在家庭中崇拜偶像、風俗各異，常使以撒和利百加心裡愁煩（經文使用
  מֹרַת רוּחַ，H4786、H7307G，指「心靈的苦痛與愁苦」）。


  關於本節的妻子名字與創世記 36:2-3 的名單對照問題，是研讀此處常見的譜系討論（[[以掃有幾個妻子]]）。GT 賈斯樂與郝威在《聖經難解經文詮釋手冊》〈命題50〉，以及
  GT 艾基斯在《舊約聖經難題彙編》中皆指出：古代近東一人擁有多個名字是極為普遍的現象（例如巴實抹可能又名亞大），且創世記 36 章的族譜側重記載有繁衍後代的妻子。艾基斯更指出以東文化中重名現象相當頻繁；GT《啟導本聖經創世記註釋》則採取開放的學術角度，認為兩處記錄可能反映同一人有不同稱號，或包含其他妻子。整章經文生動呈現了神的信實：即使人的生命歷程伴隨軟弱與波折，神與人所立的聖約應許卻永遠堅定不移。'
