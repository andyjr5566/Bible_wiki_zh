organization: "本章是約瑟一生的轉折點：從囚犯到宰相，從監牢到副車。約瑟因**自己的夢**被賣（創37），因**別人的夢**下監又出監（創40-41）——神一路藉著夢掌管歷史。\n\
  \n### 經文大綱\n\n1. **法老同夜作兩夢，無人能解**（1-8節）\n2. **酒政舉薦約瑟**（9-13節）\n3. **法老召見約瑟並重述兩夢**（14-24節）\n\
  4. **約瑟解夢並建議因應之道**（25-36節）\n5. **法老任命約瑟治理埃及，賜名賜妻**（37-45節）\n6. **七個豐年：積糧如海沙，並生二子**（46-52節）\n\
  7. **七個荒年來到，天下都來糴糧**（53-57節）\n\n### 一、「過了兩年」——神量定苦難的日期（1-8節）\n\n> [!quote] 為什麼是兩年？\n\
  > CT 指出這兩年對約瑟極其重要：①**使他學習單單依靠神，而不再求人**（參40:14 的「求你記念我」）；②使他從被關在監中的達官多學習治國之道；③使他[[試煉後的榮耀|達到三十歲能被神所用]]（46節；路3:23）。KC\
  \ 補上一句：**神量定萬事的日期，也量定我們受苦的日期**（林前10:13；雅1:3-4）。當神的時候一到，祂就動工，使祂的僕人從卑微進入榮耀（詩105:19-21）。\n\
  \n法老夢見自己站在[[尼羅河|河]]邊——STEP 可確認原文為 יְאֹר（H2975，源自古埃及語，專指尼羅河或其水系渠道）。[[尼羅河與埃及農業|尼羅河是埃及的命脈]]，一年一次氾濫帶來肥土；丁良才記下一則把水位與收成掛鉤的傳說：「尼羅河若只漲溢十二肘，就成了荒年；十三肘，眾人要受饑餓；十四肘眾人就歡喜；十五肘，莊稼就可收；十六肘，就是豐年；若漲得更高，就成了水災。」牛喜歡浸在水中、只露頭頸，以躲避烈日和蒼蠅，在[[尼羅河與埃及農業|蘆荻]]（STEP 顯示原文為 אָחוּ，H260，埃及借詞，指沼澤水草）中吃草。母牛在埃及是月神伊希斯的象徵，與土地產量相關——**神用埃及人自己看得懂的圖像說話**。\n\
  \n第二夢是[[豐年與荒年的神聖節奏|一棵麥子長七個穗子]]（埃及的麥子確實一棵分數穗），隨後七個穗子[[東風（西洛可、卡姆辛）|被東風吹焦]]——春末夏初從東邊沙漠吹來的灼熱大風（sirocco／khamsin），足以毀壞農作物（何13:15；賽40:7）。\n\
  \n法老召了[[古埃及術士與博士|埃及所有的術士和博士]]（CT：術士專研祕術、巫術禮儀典籍，博士即星象學家，兩者被埃及人視為解夢專家；精讀本說術士意為「解釋所隱藏神奇之事的人」，掌握神秘的宗教知識、屬於祭司長職務，通常掌管占星學、解夢、看手相、占卜、變戲法等事，摩西時代與尼布甲尼撒宮中也都有這類人——出7:11；8:18；但1:20），**卻沒有人能圓解**。法老所作的「夢」在第8節使用單數 חֲלוֹם（H2472），CT 從原文看出一個線索：暗示兩夢實為一個（25節）；**術士卻分開來解，這或許正是他們失敗的原因**。\n\n> [!note]\
  \ 世界的智慧必先破產\n> KC：**只有當埃及全部的智慧——世界全部的智慧——都對法老的問題無言以對時，人才想起約瑟。**先要「滅絕智慧人的智慧」，神在基督裡的智慧才被人接受（林前1:19-20,30）。CT：**人天然的頭腦、屬世的智慧，不能領會神深奧的事**（林前2:11,14）。\n\
  \n### 二、酒政想起了他的罪（9-13節）\n\n「我今日想起我的罪來」——這「罪」是指什麼？丁良才與 CT 都認為**不是指忘記約瑟，而是指他從前得罪法老的事**（40:1-2）；BH\
  \ 則讀為他承認自己忘恩的失職。KC 給了第三層：**酒政一想起約瑟，就不能不想起自己的過去——他在哪裡遇見約瑟、約瑟為他做了什麼。我們想起主耶穌，豈不也是如此？**\n\
  \n他稱約瑟為「一個希伯來的**少年人**」（原文與37:2 的「童子」同字）——CT 認為**這稱呼有意無意地貶低了約瑟**。\n\n### 三、「這不在乎我」（14-24節）\n\
  \n法老「**遂即**」差人召約瑟，他們「**急忙**」帶他出監。約瑟[[埃及人剃頭刮臉習俗|剃頭、刮臉、換衣裳]]——埃及男人不留鬚，希伯來人卻留鬚；這不是說約瑟在獄中蓬頭垢面（他關在「王的囚犯」之處，待遇較好），而是朝見法老必須遵守的宮廷禮節。\n\
  \n> [!note] 約瑟的第三件衣裳\n> KC 數過約瑟的衣裳：①**彩衣**被哥哥們剝去、蘸血（37:31-33）；②**奴僕的衣裳**留在波提乏妻子手中（39:12）；③**囚衣**在此換下——凡叫人想起監獄的都被除去；④稍後還有**細麻衣**（42節），是他公開得榮耀的衣服。**這正是腓立比書2章的縮影：先有卑微（腓2:5-8），後有升高（腓2:9）。**\n\
  \n面對權傾天下的法老，約瑟的第一句話是：「[[解夢出於神|這不在乎我]]，神必將平安的話回答法老。」——STEP 可確認約瑟開頭直言 בִּלְעָדָי（H1107，字面為「不在於我／與我無關」），隨後宣告「神必將平安的話回答法老」（動詞 עָנָה H6030 搭配 שָׁלוֹם H7965）；和他兩年前在獄中對酒政膳長說的那句「解夢不是出於神嗎」（40:8）是同一個宣告。\n\
  \n> [!quote] 神真正的僕人，都必須承認自己一無所有\n> CT：**神真正的僕人，都必須承認自己一無所有，而將榮耀歸於神；神才是惟一的啟示者、賜予者和賜福者。那些從神得著大恩賜的人，若以謙卑為懷、不肯篡奪神該得的讚美，神必給予更大的恩賜。**丁良才：「約瑟不怕在王的面前為主作見證。」GT\
  \ 進一步指出：約瑟尚未聽見夢的內容，就已憑屬靈的洞察力宣告「平安」——**他胸有成竹，因為他知道神是誰。**\n\n### 四、兩個夢，一個意思（25-36節）\n\
  \n|  | 第一夢 | 第二夢 |\n|---|---|---|\n| 好的 | 七隻母牛，又美好又肥壯 | 一棵麥子上七個穗子，又肥大又佳美 |\n| 壞的\
  \ | 七隻母牛，又醜陋又乾瘦 | 七個穗子，細弱、被東風吹焦 |\n| 結局 | 瘦牛吃盡肥牛，**吃了卻看不出是吃了** | 細穗吞了飽穗 |\n| 解 |\
  \ 七個大豐年，隨後七個荒年 | 同一個解——「這夢乃是一個」 |\n\n「法老的夢乃是一個」——**這是解此夢的關鍵。**至於為何兩回作夢？「是因神命定這事，而且必速速成就」（32節）。STEP 形態學顯示「命定」使用 נָכוֹן（字根 כּוּן，H3559，Niphal 分詞「確立／定準」），「速速成就」使用 מְמַהֵר（字根 מָהַר，H4116，Piel 分詞「快快地／迅速催行」），雙重分詞強調神旨意的確定與急迫。CT：**神重複的啟示，是在強調事情的確定性和急迫性**（來6:17-18），**目的是要喚起人的行動，而不是要人頹廢。**\n\
  \nGT 丁良才《創世紀註釋》指出「神已將所要做的事指示法老」含三層意思：①要使法老知道**神管理萬有**；②要**拯救多人脫離饑荒**；③要**應驗神向亞伯拉罕所應許的話**（創15:13——雅各全家將寄居埃及）。\n\
  \n約瑟不只解夢，更獻上具體對策（CT 數為五個建議）：\n\n1. 揀選一個有聰明有智慧的人[[智慧與治理|總其成]]（33節）——**「智慧」是識透事實真相的能力，「聰明」是把智慧付諸執行的能力**；\n\
  2. 分層派[[智慧與治理|官員]]管理各地（34節上）；\n3. 豐年征收**五分之一**（34節下）；\n4. 聚斂豐年一切的糧食（35節上，即除五分之一外還收購餘糧）；\n\
  5. [[各城（積貨城）|收存在各城裡]]、[[積貨城制度|歸法老手下看守]]（35節下）。\n\nKC 提醒：**這是奴僕約瑟不請自來、卻有尊嚴地向大能的法老獻策——其中沒有一絲對所受不公的報復。**丁良才更說：**約瑟根本沒想到自己會被選**——他是希伯來人、是奴僕兼囚犯、沒有學問和治國閱歷（可與自以為是的哈曼比較，斯6:6）。\n\
  \n### 五、「有神的靈在他裡頭」（37-45節）\n\n法老認出：「像這樣的人，[[神的靈在人身上|有神的靈在他裡頭]]，我們豈能找得著呢？」——**這是聖經中最早以「神的靈在某人裡頭」形容一個人的地方之一**（參出31:3；但5:14）。\n\
  \n就職典禮的每一件事都有其意義：\n\n| 賜下 | 意義 |\n|---|---|\n| 打印的戒指 | 認證文件的印璽，即掌權的標誌（斯3:10；8:2）\
  \ |\n| 細麻衣 | 埃及貴族／祭司的朝服 |\n| 金鍊 | 榮寵有加，通常頒給有功的大臣 |\n| 副車 | 緊隨法老車後的座駕，表明地位僅次於法老 |\n\
  | 喝道「跪下」 | 由埃及文轉來，含讓開、屈膝、歡呼之意 |\n\n以上皆見[[埃及宮廷禮儀（剃頭、刮臉、賜名、賜戒指、細麻衣、金鍊、副車）|埃及宮廷授職禮儀]]；[[埃及印璽戒指代表權柄|法老摘下自己手上的戒指戴在約瑟手上]]，等於把治國的權柄交託他。[[埃及宰相職位（維齊爾）|「掌管我的家」]]相當於埃及的「大維齊爾」（首相）兼王室物業總監，**惟獨在寶座上法老比他大**。[[喝道「跪下」的禮儀|喝道的在前呼叫「跪下」]]（43節）——STEP 顯示原文為 אַבְרֵךְ（H86，context gloss 為「bend the knee」，通常理解為埃及語借詞或屈膝歡呼之聲）；BH\
  \ 由此看見腓2:10-11：**萬膝必向耶穌跪拜。**\n\n法老又行了兩件「埃及化」的事：賜名[[撒發那忒巴內亞]]、賜妻[[亞西納]]。STEP 可確認希伯來音譯分別為 צָפְנַת פַּעְנֵחַ（H6847）與 אָסְנַת（H621），波提非拉為 פּוֹטִי פֶרַע（H6319）。這名字的意思在註釋中眾說紛紜——CT\
  \ 列作「奧秘的啟示者，世界的救主，世界的救恩，維持生命的，生命的糧，因神的話而活著」，KC 與精讀本作「奧祕的啟示者」或「世界的救主」，BH 作「神說話，他就活著」；但串珠說「意思不詳，可能有『豐富生命』的意思」，雷氏說「不能肯定」，背景註釋也說「不能確定」，只提出「神已說話而他會存活」與「曉得之人」兩個可能。CT\
  \ 由此直看基督：**祂是奧祕的啟示者（約1:18）、世界的救主（約1:29）、生命的糧（約6:51）。**亞西納是安城（赫利阿坡利斯，敬拜太陽神銳）祭司波提非拉的女兒——**約瑟娶了外邦女子為妻，CT／KC\
  \ 一致視為基督在升高之後得著外邦的教會作新婦**（弗5:25、32）。精讀本則不迴避法老的動機：這兩件事一方面是為了鞏固約瑟在埃及社會的身份地位、「以防有人對他持有偏見或藐視」，另一方面「明顯出於私心，試圖把約瑟這難得的人才完全變為埃及人」。\n\
  \n> [!note] 法老身份與年代\n> 這位法老是誰？《舊約背景註釋》指出：從閃族人大量在埃及任官的角度看，**許克所斯時期（主前1750-1550年）**最合乎邏輯；但按聖經年代資料，則指向**更早的中王國第十二王朝（主前1963-1786年）**。創世記的作者照例不提法老的名字——**埃及人視法老為神，以色列人當然絕口不提他的名號。**\n\
  \n### 六、瑪拿西與以法蓮（46-52節）\n\n「約瑟見埃及王法老的時候年[[試煉後的榮耀|三十歲]]」——他十七歲被賣（37:2），**在埃及已經十三年**。CT：利未人三十歲開始在會幕任職（民4:3），主耶穌三十歲開頭傳道（路3:23）——**神作事有祂自己的時間表。**\n\
  \n兩個兒子的名字，就是約瑟的信仰告白：\n\n- [[瑪拿西（使之忘了）|瑪拿西]]：STEP 可確認希伯來名為 מְנַשֶּׁה（H4519），源自約瑟宣告「神使我忘記（נַשַּׁנִי，字根 נָשָׁה H5382，Piel 完成式）了一切的困苦和我父的全家」；後來的事實證明約瑟並沒有忘記父家的**人**（42:7；43:30），CT\
  \ 認為這句話**指的是忘記了他對父家的懷怨**。丁良才一語中的：**「約瑟忘了他的苦難，卻沒有忘了他的神。」**\n- [[以法蓮（使之昌盛）|以法蓮]]：STEP 可確認希伯來名為 אֶפְרַיִם（H669），源自約瑟宣告「神使我在受苦的地方昌盛（הִפְרַנִי，字根 פָּרָה H6509，Hiphil 完成式，字面義為『使之繁衍／多結果子』）」；丁良才：**「我們為主忍受苦難的地方，大概也就是得昌盛的地方。」**\n\
  \n> [!quote] 先有瑪拿西，後有以法蓮\n> CT：**「須先有瑪拿西的經歷，後才有以法蓮的經歷」——瑪拿西表明約瑟顛沛際遇的結束，以法蓮表明新生活豐盛的開展。「誰苦受得越多，誰的靈命就越豐盛。」**KC\
  \ 讀出同一幅圖畫：**被弟兄棄絕的主耶穌如今在榮耀裡，得著教會作新婦，「忘記」了所受的凌辱；並且從榮耀裡使一切與祂聯合的人多結果子。**\n\n### 七、「你們往約瑟那裡去」（53-57節）\n\
  \n七個豐年一完，七個荒年就來了，**「正如約瑟所說的」**——CT：**神的話從不落空**（書21:45；賽55:11）。「各地都有饑荒；惟獨埃及全地有糧食。」\n\
  \n> [!quote] 這是福音的圖畫\n> 眾民向法老哀求糧食，法老說：「**你們往約瑟那裡去，凡他所說的，你們都要做。**」KC：**這是福音的美麗圖畫——神對那些因罪困苦、向祂呼求的人說：「去見耶穌，祂告訴你們什麼，你們就做什麼」**（參約2:5）。CT：**信徒如有需要，不要向人哀求，而要往主那裡去**（約15:7）。\n\
  \n於是[[積貨城制度|約瑟開了各處的倉]]，[[積貨城制度|糶糧]]給埃及人；各地的人都往埃及去[[積貨城制度|糴糧]]（CT 特別為兩個難字注音：「糶」音「跳」，指出售糧食；「糴」音「笛」，指購買糧食）——**這一句正是下一章的伏筆：約瑟的哥哥們也要來了。**\n\
  至於「饑荒遍滿天下」的「天下」，CT 與串珠都設了界線：指當時所知道的世界，也就是中東埃及和鄰近一帶地方；丁良才則推測前來糴糧的「各地的人」大概是埃提阿伯、亞拉伯、迦南和亞蘭等國的人。KC\
  \ 讀出另一層：豐年結束、荒年開始的這段日子，正是約瑟要與埃及人、也要與他哥哥們打交道的時候——他把這段光景比作「那將要臨到普天下的試煉的時候」（啟3:10），以及雅各遭難的日子（耶30:7）。\n\
  ### 十三年與十四年：本章的兩條時間線\n本章有兩條時間線交疊：一條是約瑟個人的十三年，一條是埃及的十四年。丁良才把前一條算得很清楚——「三十歲」意味著約瑟「已經在埃及十三年了」（創37:2）；雷氏同說他十七歲來到埃及，為奴的時間已有十三年。精讀本則把約瑟的一生補完：此後他又活了八十年，一百一十歲歸到他列祖那裡（創50:26）。\n\
  ```mermaid\ntimeline\n  title 約瑟從被賣到荒年的時間線\n  十七歲 : 在迦南被哥哥們賣到埃及（創37:2、28）\n  在埃及十三年\
  \ : 波提乏家作管家 : 被誣告下在王的囚犯之處 : 為酒政膳長解夢 : 酒政忘記他又過兩年（創41:1）\n  三十歲 : 見埃及王法老解夢並獻策 : 受戒指細麻衣金鍊副車治理埃及全地（創41:46）\n\
  \  七個豐年 : 遍地極豐極盛積糧如同海沙 : 荒年未到以前生瑪拿西與以法蓮（創41:47-52）\n  七個荒年 : 各地都有饑荒惟獨埃及全地有糧食 : 各地的人都往埃及糴糧（創41:54-57）\n\
  ```\n兩條線在第46節交會：約瑟站在法老面前的那一天，既是他十三年受苦的終點，也是埃及十四年豐荒的起點。\n\n### 關鍵神學點\n\n1. **神的主權與預定**：豐年荒年皆由神命定；連法老的夢、酒政的忘記與想起，都在神的時間表之內。\n\
  2. **[[試煉後的榮耀]]**：十七歲被賣，三十歲作宰相——**通往榮耀的路，總是經過苦難**（KC）。\n3. **[[神的靈在人身上]]**：外邦君王在一個希伯來奴僕身上認出神的靈。\n\
  4. **[[智慧與治理]]**：真智慧不只解釋危機，更提出可執行的方案。\n5. **約瑟預表基督**（CT 靈訓要義）：從監裡出來（14節）／主從死裡復活；受外邦人尊敬（38-39節）；作埃及宰相（43-44節）／萬王之王；娶外邦女子為妻（45節）／得外邦教會作新婦；三十歲遍行埃及（46節）／主三十歲傳天國；有豐富的糧食（48-49節）／主是生命的糧。\n\
  6. **互文**：約瑟與但以理同為異邦宮廷中解夢的義人（但2）；七年的節奏呼應安息年與禧年的神聖韻律。\n\n### 背景補充：法老的夢、術士行會與約瑟的擢升\n\
  \nGT《舊約背景註釋》為本章的埃及場景提供了大量對照，值得逐項記下。\n\n**為何是兩個夢**：古代近東的人一般假定夢是神明與人溝通的方法，有些夢很簡單直接（如雅各在伯特利所作的夢，創二十八10-22），但夢若牽涉到君王或法老，其重要性有時會透過雙夢的經歷表達。背景註釋舉出平行例證：蘇美王古德據說也曾作過兩個夢，指示他興建廟宇，而上述二王的夢都是由術士或神明的代表圓解的；按照馬里文獻，連續兩晚作相同的夢會加強夢中信息的重要性，而《吉加墨斯史詩》和一首關於受苦義人的詩，都描述以三次重複來證實可靠性的夢。約瑟在第32節說「夢兩回，是因神命定這事」，正是這套共識的說法。\n\
  \n**法老求人解夢有多反常**：背景註釋指出這一點——「埃及法老竟然要人為他解夢，此事十分反常。因為法老被奉為神祇，神明藉夢與他溝通時，其意義對他來說應該是顯而易見的。」第8節那句「卻沒有人能給法老圓解」，在埃及的宗教框架裡是一則醜聞。它並說明埃及術士行會與美索不達米亞的差異：美索不達米亞的法術有黑白之分、奉行者分巫師術士與博士兩類，而「埃及的術士行會卻沒有這個分別」；埃及術士的職責雖主要在醫療方面，對神明的態度卻似乎沒有那麼尊重。形容法老所召專家的希伯來語字眼原是埃及文的專用名詞，有時被學者認為專指解夢者。\n\
  \n**法老是誰**：背景註釋坦承「已經無從稽考」，並列出兩派——部分學者認為情節所反映的背景是許克所斯（主前1750～1550年）或亞馬拿時代（主前十四世紀），當時有很多閃族人在埃及定居、埃及史料也提及有些是政府官員；但聖經年代的資料則顯示發生此事的時間是較早的中王國第十二王朝（主前1963～1786年）。它並提出一個文學上的觀察：創世記的作者照例不提法老的名字，「這作法可能是故意的，埃及人視法老為神，以色列人當然絕口不提他的名號」。\n\
  \n**剃頭刮臉**：約瑟用剃刀使自己可以體面地朝見法老，所剃的可能包括頭髮（民六9）與鬍鬚（耶四十一5）；如此他把外貌改成與埃及人相似，而埃及的壁畫證明埃及人通常是剃淨毛髮的。這個細節顯示第14節不是衛生描寫，而是一次身分的換裝。\n\
  \n**埃及也會鬧饑荒**：背景註釋指出，埃及雖因尼羅河定期氾濫而成為古代近東最穩定的穀物出產地之一，「但它偶爾也會發生饑荒」，並舉出一個時代更早的平行例證——亞曼念紇一世在位之時（主前1991～1962年）的《奈費爾蒂的異象》就提及過這樣一場災禍，「這典籍也是描述異象得到圓解，災難得以預知，與約瑟的敘述相仿」。CT\
  \ 從另一頭說同一件事：正因為尼羅河每年定期氾濫，埃及「很少有長期的饑荒」——七個荒年之所以驚人，正在於此。\n**配給制與積貨城**：約瑟的計策——豐年每年儲藏五分之一收成、有需要時分配給百姓——背景註釋指建築倉庫也是這妙計的一部分（出一11；王上九19）；而埃及對尼羅河的經營與這河的恆常性，令埃及成為全古代近東的大糧倉，「積貨城是有長遠眼光，了解饑荒的必然性而謀求對策之富強國家的特徵」，每個區域通常都會在位置適中的地點設有積貨城。\n\
  \n**擢升的規格**：背景註釋指約瑟的職任「相等於『大維齊爾』（即首相）和『王室物業總監』」，而他的職務「大致與『上下埃及糧倉總監』相同」；把官位授與非埃及人在許克所斯時代以前十分罕見，但仍有先例——亞馬拿執政時期一位閃族官員圖圖（Tutu）被任命為「全國最高之口」，地位權力相當於約瑟。它並指不少埃及貴胄都可以說自己僅次於法老，好幾個職銜都表示有此地位，碑文中曾提及的兩個是「兩地之主最寵愛者」與「他的侍官之首」。至於打印的戒指，君王和王室執政官員都用印章戒指處理公務文件，這種戒指十分獨特並刻有王的名號，因此「使用者就是以王的名義行事」；細麻衣和金鍊則是在授職典禮中賜下的裝飾，用以表明他的地位、階級、職權。背景註釋最後把整件事放進埃及的文類裡：埃及古墓中的傳記與《辛奴亥的故事》等文學，為法老臣屬的生涯提供了充分資料，其中從低微地位被擢升到掌握大權者為數不少——因此「約瑟高升得榮的描寫，從埃及當代的背景來看，可說是典型的例證」。\n\
  \n背景註釋所說的「典型」，指的是這段敘事在埃及的社會現實中完全站得住，而不是說它取材自那些故事。"
