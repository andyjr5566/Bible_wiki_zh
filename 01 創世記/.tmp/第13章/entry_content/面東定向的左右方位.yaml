name: 面東定向的左右方位
type: 背景
secondary_types: []
aliases: []
status: formal
definition: >-
  古代以色列人以面向日出的方向作為定位基準。GT 丁良才《創世紀註釋》在創十三9 直接說明這套方位觀：「以色列人按著面向日出的地方定方向，他們就稱東為前邊，西為後邊，南為右邊，北為左邊。」因此亞伯蘭對羅得說「請你離開我，你向左」，丁良才註明「就是向北」；「我就向右」則註明「就是向南」。第9節不是抽象地說「隨你挑」，而是以身體朝東為準，把地劃成南北兩半，讓羅得先選一半。
development: >-
  這套方位慣例對本章有兩處實際作用。第一，它讓第9節的提議變得可以衡量：亞伯蘭讓出的不是含糊的「左右」，而是北半或南半的整片牧地，慷慨的程度因此看得見。第二，它與第14節神吩咐亞伯蘭「舉目向東西南北觀看」形成刻度上的對比——第9節的人間分地只在南北二者取一，第14節的神卻把四個方向一次給盡。
  值得並列的是經文自身的一個落差：第9節提出的是左右（北南）二選一，第11節記羅得實際的動作卻是「往東遷移」，敘事沒有解釋這個方向差異，也沒有評論。此外，CT 把第14節的「東西」加上第17節的「縱橫」讀成十字架形狀，那是中文註釋的靈意發揮，屬於應用而非方位詞的原意；本條目只承載定向慣例本身。
accumulations:
- book: 創世記
  chapter: 13
  summary: >-
    第9節亞伯蘭說「你向左，我就向右；你向右，我就向左」。GT 丁良才《創世紀註釋》指出以色列人面向日出定方向，東為前、西為後、南為右、北為左，所以「向左」即向北、「向右」即向南——亞伯蘭是把地分成南北兩半讓羅得先選。
  relation: >-
    這條背景把亞伯蘭讓步的實際幅度顯示出來：他不是說幾句客氣話，而是按當時通行的方位語言，具體交出了一半土地的優先選擇權，且身為長輩仍讓晚輩先選。第14節神隨後叫他「向東西南北觀看」，在同一套方位語言裡把他讓出去的加倍還給他。
