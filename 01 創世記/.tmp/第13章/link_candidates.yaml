book: 創世記
chapter: 13
candidates:
  - name: 亞伯蘭
    type: 人物
    evidence: 1-18節；回伯特利恢復求告、讓羅得先選、得應許遷希伯崙築壇
  - name: 羅得
    type: 人物
    evidence: 1-12節；財物甚多、舉目自選約但河平原、漸漸挪移直到所多瑪
  - name: 埃及
    type: 地點
    evidence: 1、10節；從埃及上南地；平原「像埃及地」
  - name: 南地
    type: 地點
    evidence: 1、3節尼革乾旱區，回伯特利的路線
  - name: 伯特利
    type: 地點
    evidence: 3節回到起先支搭帳棚築壇之地
  - name: 帳棚與祭壇
    type: 主題
    evidence: 4、18節；回到起先築壇處求告耶和華的名，又在幔利築壇
    surfaces:
      - {phrase: 築壇, verses: [4]}
      - {phrase: 築了一座壇, verses: [18]}
  - name: 牧人水草與土地承載
    type: 背景
    evidence: 6-7節；GT 背景註釋論季節性遷牧與水草使用權常引發爭執；「容不下」指同一放牧區資源不足
    surfaces:
      - {phrase: 那地容不下他們, verses: [6]}
  - name: 謙讓
    type: 主題
    evidence: 8-9節亞伯蘭放棄先選權；KC 指他不堅持權利，留給神選擇（詩四十七4）
    surfaces:
      - {phrase: 亞伯蘭就對羅得說, verses: [8]}
  - name: 骨肉原文作弟兄
    type: 原文
    evidence: 8節；原文弟兄可泛指男性親屬，中文依叔姪關係譯作骨肉
    surfaces:
      - {phrase: 骨肉【原文作弟兄】, verses: [8]}
  - name: 迦南人
    type: 人物
    evidence: 7節「當時，迦南人與比利洗人在那地居住」；GT 背景註釋指其為當地已定居的族群，亞伯蘭與羅得並非獨占土地
    surfaces:
      - {phrase: 迦南人, verses: [7]}
  - name: 比利洗人
    type: 人物
    evidence: 7節與迦南人並列住在那地；GT《串珠聖經註釋》「住在迦南地的一個部落」；《創世記雷氏研讀本》列出其在申七1-4、士一1-7、王上九20-21等處的後續出現
    surfaces:
      - {phrase: 比利洗人, verses: [7]}
  - name: 求告耶和華的名
    type: 主題
    evidence: 4節亞伯蘭在起先築壇之處重新求告耶和華的名；GT《聖經精讀本》讀作痛心悔改埃及行為、以讚美感恩重新開始
    surfaces:
      - {phrase: 求告耶和華的名, verses: [4]}
  - name: 艾
    type: 地點
    evidence: 3節「到了伯特利和艾的中間」；BH 指艾字義為「廢墟」，與伯特利「神的家」形成對照，並是日後約書亞征迦南的重要地點
    surfaces:
      - {phrase: 伯特利和艾的中間, verses: [3]}
  - name: 面東定向的左右方位
    type: 背景
    evidence: 9節「你向左，我就向右」；GT 丁良才《創世紀註釋》說明以色列人按面向日出定方向，東為前、西為後、南為右、北為左，故「向左」即向北、「向右」即向南
    surfaces:
      - {phrase: 你向左，我就向右, verses: [9]}
  - name: 往東遷移
    type: 主題
    evidence: 11節羅得往東遷移；BH 指創世記中「往東」常與離開神的同在相連；GT 背景註釋指約但河為迦南東界，羅得遷平原城邑等於離開迦南地
    surfaces:
      - {phrase: 往東遷移, verses: [11]}
  - name: 走遍全地與土地所有權
    type: 背景
    evidence: 17節「你起來，縱橫走遍這地」；BH 指走遍土地是古代近東取得所有權的象徵行為（書一3）；GT《創世記雷氏研讀本》指18節「搬了帳棚」直譯為一直遷移帳棚，展示對應許地的所有權
    surfaces:
      - {phrase: 縱橫走遍這地, verses: [17]}
  - name: 約但河
    type: 地點
    evidence: 10-11節全平原直到瑣珥，水源充足
  - name: 瑣珥
    type: 地點
    evidence: 10節「直到瑣珥」為平原範圍的南端界標；GT《創世記雷氏研讀本》指其為死海南端小城；《啟導本》指瑣珥即十四2的比拉
    surfaces:
      - {phrase: 瑣珥, verses: [10]}
  - name: 蛾摩拉
    type: 地點
    evidence: 10節與所多瑪並列，經文明說平原的滋潤是「在耶和華未滅所多瑪、蛾摩拉以先」的景況
    surfaces:
      - {phrase: 蛾摩拉, verses: [10]}
  - name: 所多瑪
    type: 地點
    evidence: 10、12-13節；罪大惡極之城，羅得漸漸挪移直到所多瑪
  - name: 耶和華的園子
    type: 原文
    evidence: 10節；形容平原如伊甸般水源植物豐盛（結四十七6-12）
  - name: 羅得的世俗選擇與後果
    type: 主題
    evidence: 11-13節；KC 指羅得只看眼前利益、心隨眼走如夏娃；GT 整理眼錯心錯腳錯的次序
    surfaces:
      - {phrase: 羅得選擇約但河的全平原, verses: [11]}
  - name: 迦南地
    type: 地點
    evidence: 12節亞伯蘭住迦南地；GT 背景註釋指約但河為迦南東界，羅得等於離開了迦南
  - name: 後裔如地上的塵沙
    type: 原文
    evidence: 16節；數量極多的修辭；傳統以塵沙表屬地後裔、十五5眾星表屬天後裔
    surfaces:
      - {phrase: 地上的塵沙, verses: [16]}
  - name: 希伯崙
    type: 地點
    evidence: 18節；原文意「聯合、交通」；猶大山地古道交會處，後為族長家族中心
  - name: 幔利
    type: 地點
    evidence: 18節；既是地點也是十四13與亞伯蘭結盟者之名
  - name: 撒萊
    type: 人物
    evidence: 1節「帶著他的妻子」與全家同回迦南
  - name: 亞伯拉罕之約
    type: 神學
    evidence: 14-17節重申土地與後裔應許，直到永遠
  - name: 信心與世俗的對比
    type: 主題
    evidence: 全章敘事對照：神吩咐舉目對比自己舉目、留迦南對比住平原城邑、築壇對比無壇
