book: 創世記
chapter: 48
updates:
- title: 雅各
  path: link_folder/人物/雅各.md
  summary: 雅各病中勉強在床上坐起，向約瑟重述全能的神在路斯（伯特利）向他顯現的應許（3-4節），收納以法蓮和瑪拿西為自己的兒子（5-6節），並回憶拉結死在以法他的路上（7節）。他交叉雙手祝福二子，立以法蓮在瑪拿西以上（13-20節），最後說「我要死了，但神必與你們同在，領你們回到你們列祖之地」，並把多得的一分賜給約瑟（21-22節）。
  relation: CT 指出雅各在病中並不自憐，反而對探病的人作自己蒙恩的見證；GT 丁良才說他重提神的應許「是為要堅固約瑟的信心」。他祝福時用三個稱呼稱神——立約的神、一生牧養他的神、救贖他脫離一切患難的那使者；CT 注意到第16節的「賜福」在原文是單數動詞，表示這三個稱呼實際上乃是一位。而他兩次說「我知道，我兒，我知道」，CT 說這表明「他外面的眼睛雖然昏花了，但他裡面的眼睛並沒有昏花」。CT 另注意到雅各一生的三重反轉：他身為弟弟卻與以掃爭長子名分（27:36），愛妹妹拉結過於姊姊利亞（29:30），如今又將約瑟次子立在長子之上。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 約瑟
  path: link_folder/人物/約瑟.md
  summary: 約瑟聽見父親病了，帶著瑪拿西和以法蓮同去（1節）；他把兩個兒子從以色列兩膝中領出來，自己臉伏於地下拜（12節），又按長幼把長子安排在父親右手邊（13節）。見父親把右手按在以法蓮頭上就不喜悅，要挪回來，被父親拒絕（17-19節）。最後領受父親多給他的一分地（22節）。
  relation: CT 說約瑟雖然貴為一國的宰相，仍俯伏拜他的父親。至於他的「不喜悅」，CT 指出他能知道神有關七個豐年和七個荒年的旨意（41:25-36），卻不知道神有關以法蓮和瑪拿西的旨意——「人無論怎樣屬靈，所知的仍然有限」（林前13:12）；GT 丁良才同說他不喜悅是「因他不明白神的旨意」。KC 說得最直接：這是聖經中我們讀到約瑟唯一的不完全，顯明他也是一個會犯錯的人。這一章他所得的是長子的雙份地土，作王掌權的部分歸猶大、作祭司的部分歸利未。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 以法蓮
  path: link_folder/人物/以法蓮.md
  summary: 以法蓮被雅各收納為自己的兒子（5節）；雅各故意交叉雙手，把右手按在次子以法蓮頭上，並說「他的兄弟將來比他還大，他兄弟的後裔要成為多族」，於是立以法蓮在瑪拿西以上（13-20節）。
  relation: CT 注意到第5節雅各就已把次子以法蓮置於長子瑪拿西之前，而「以法蓮」的原文字義「加倍的豐盛」與第4節的「生養眾多」意義相近，這或許是立他在瑪拿西以上的由來。預言的應驗，CT 指出是在南北分國時期（主前930-722）：以法蓮支派成為北國以色列最強大的支派，「以法蓮」也成了以色列國的別稱（賽7:2、5、8-9；何9:13；12:1、8）。GT《聖經精讀本》從更早算起：經士師時代到王國分裂時代，從數量及指揮能力方面，以法蓮支派超越瑪拿西支派的預言如實成就。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  summary: 瑪拿西雖是約瑟的長子，被約瑟安排在雅各右手邊，雅各卻剪搭過左手來按在他頭上（13-14節）；約瑟請父親改正，雅各不從，卻仍明說「他也必成為一族，也必昌大」（17-19節）。
  relation: 祝福次序的反轉並沒有取消瑪拿西的祝福——他仍與以法蓮一同成為分地的支派，「願神使你如以法蓮、瑪拿西一樣」也把兩人並列（20節）。KC 補上後續的對照：瑪拿西沒有像以法蓮那樣強大，並且被分成兩半，半個支派住在河西，另半個住在約旦河東。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 拉結
  path: link_folder/人物/拉結.md
  summary: 雅各在收納約瑟二子之後，忽然轉到拉結：「至於我，我從巴旦來的時候，拉結死在我眼前，在迦南地的路上，離以法他還有一段路程，我就把他葬在以法他的路上」（7節）。
  relation: 來源把這段回憶與收納直接相連。CT 說拉結之死歷歷在目，「這或許是促使雅各收納約瑟的兩個兒子為子嗣的主要原因」；GT《串珠聖經註釋》說雅各這樣做「乃是紀念他的愛妻拉結」；GT《聖經精讀本》說雅各特別強調拉結的死亡，是想說明他分給約瑟兩份基業的理由，表明他深愛著拉結和迦南地；GT 丁良才則只說一句：「雅各如此追憶已死的妻子，足以顯明他有恆愛之心。」KC 從另一面讀：在拉結的死上，雅各學到凡肉體所倚靠的都必須被奪去——而埋葬也說到新生命，拉結的死伴隨著便雅憫的生。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 路斯
  path: link_folder/地點/路斯.md
  summary: 雅各對約瑟說：「全能的神曾在迦南地的路斯向我顯現，賜福與我」（3節），並複述那時所領受的應許——生養眾多、成為多民、把這地賜給後裔永遠為業（4節）。
  relation: CT 與 GT 丁良才、《串珠聖經註釋》都指明路斯就是伯特利的古名（28:19），也就是雅各往哈蘭路上夢見天梯之處（28:10-17）。GT《聖經精讀本》指出雅各在這裡把伯特利所得的應許（28:12-15；35:9-13）親手傳給下一代——土地與後裔，正是他分派支派產業的根據。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 伯利恆
  path: link_folder/地點/伯利恆.md
  summary: 雅各說拉結死在往以法他的路上，他就把她葬在以法他的路上；經文並註明「以法他就是伯利恆」（7節）。
  relation: GT《舊約背景註釋》說雅各因著對拉結之死的幽思，而把她的墳墓置於伯利恆、以法他一帶。KC 由這個地名讀出更遠的一層：埋葬也說到新生命，拉結的死伴隨著便雅憫的生；伯利恆是雅各生命的轉捩點，也是以色列歷史的轉捩點——因為他們的彌賽亞要生在那裡（彌5:2；太2:1）。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 全能的神在迦南地的路斯向雅各顯現，應許「把這地賜給你的後裔，永遠為業」（3-4節）；拉結也是死在迦南地的路上（7節）。雅各臨終說「神必與你們同在，領你們回到你們列祖之地」（21節），並把從亞摩利人手下奪的一分地賜給約瑟（22節）。
  relation: 迦南應許支配了本章的每一個動作——收納、支派產業、額外的一分地，都是按著「這地要賜給你的後裔」而作的。GT《聖經精讀本》指出這句話的後續份量：日後希伯來人在外邦受難時，「恢復迦南」的思想成為他們的精神支柱，也是他們成為一個共同體的基礎，更是出埃及事件的決定性動機。CT 則說：「雅各身在埃及，心卻牽掛著迦南地。」
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 全能的神（El Shaddai）
  path: link_folder/神學/全能的神（El Shaddai）.md
  summary: 雅各對約瑟說：「全能的神曾在迦南地的路斯向我顯現，賜福與我」，隨即複述那應許：「我必使你生養眾多，成為多民，又要把這地賜給你的後裔，永遠為業」（3-4節）。
  relation: 雅各在臨終安排產業時，先把根據說明白——這些安排不是他個人的意思，而是「全能的神」在路斯所應許的。GT 丁良才把這個稱號與創43:14 連起來（雅各差便雅憫下埃及時也是求「全能的神」施憐憫）。CT 指出這次顯現就是雅各往哈蘭路上睡夢中所見的異象（28:10-17）。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 神的護理
  path: link_folder/神學/神的護理.md
  summary: 雅各對約瑟說「我想不到得見你的面，不料，神又使我得見你的兒子」（11節），並在祝福詞中稱神為「一生牧養我直到今日的神」與「救贖我脫離一切患難的那使者」（15-16節）。
  relation: GT《啟導本聖經創世記註釋》指出這是聖經第一次稱神為牧者，而說這話的雅各自己一生就是牧羊人；CT 說他對神的認識已經從「客觀的認識」轉為「主觀的經歷」。GT《聖經精讀本》讀出第11節的位置：經過所有的試煉，雅各認識到神深奧的主權性護理和豐盛的恩典，以感謝和喜樂的心發出感慨——如同約伯經過試煉後，加倍的祝福臨到了他（伯42:10、12）。「救贖」一詞（goel）在此首次出現於聖經（GT《創世記雷氏研讀本》），CT 指出原文與「贖業至親」同字：當一個人陷入困境，那位至親就義不容辭地代贖產業並提供保護（利25:25、47-49）。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 埃及
  path: link_folder/地點/埃及.md
  summary: 雅各說「我未到埃及見你之先，你在埃及地所生的以法蓮和瑪拿西，這兩個兒子是我的」（5節）；臨終又說「我要死了，但神必與你們同在，領你們回到你們列祖之地」（21節）。
  relation: 出生地不妨礙承受立約的產業。GT《聖經精讀本》說雅各「不顧約瑟兩個兒子的出生環境和血統，將他們納入救贖史的成員」；KC 也注意到這兩個孩子是外邦女子所生的。而第21節則把埃及定位為暫居之處——CT：「雖然你們目前在埃及飛黃騰達，但它不是你們久住之地；你們將來終必回到迦南地去。」
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 長子名分
  path: link_folder/主題/長子名分.md
  summary: 雅各收納以法蓮和瑪拿西，說「正如流便和西緬是我的一樣」（5節），又對約瑟說「使你比眾弟兄多得一分」（22節）。
  relation: 這一章是長子名分實際易主的地方。GT 丁良才說明前因後果：流便本來是長子，但因為他污穢了父親的床，就失了長子的名分（49:3-4），因此以法蓮和瑪拿西也列在以色列支派中，約瑟就承受了雙份的產業；丁良才並補一個法律上的注記——「這是特別的辦法；後來在神的法律中明明地禁止為父親的存偏心，奪去長子的名分」（申21:15-17）。GT《啟導本聖經創世記註釋》與《創世記雷氏研讀本》同指這名分由流便轉給約瑟（代上5:1）。但 CT 與丁良才都指出約瑟並沒有全然得著長子的名分：他只得著雙份地土的部分，作王掌權的部分歸給了猶大（49:8-12；代上5:2），作祭司的部分歸給了利未（申33:8-10）。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 流便失去長子名分
  path: link_folder/神學/流便失去長子名分.md
  summary: 雅各收納約瑟的兩個兒子時說「正如流便和西緬是我的一樣」（5節）——長子名分的雙份產業由此落在約瑟的二子身上。
  relation: GT 丁良才把因果說得最清楚：「流便本來是長子；但因為他污穢了父親的床，就失了長子的名分（49:3-4）。」GT《啟導本聖經創世記註釋》同說：流便雖是長子，因犯過罪失去長子名分，這名分將賜給約瑟，然後傳給他的二子（代上5:1）。GT《創世記雷氏研讀本》也說這時候雅各「顯然把長子的權利從流便轉給了約瑟」。KC 則注意到接受者的身分：這兩個孩子是外邦女子所生的。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  summary: 雅各對約瑟說：「並且我從前用弓用刀，從亞摩利人手下奪的那塊地，我都賜給你，使你比眾弟兄多得一分」（22節）。
  relation: 這裡的「亞摩利人」是一個泛稱。GT《舊約背景註釋》說這用法「似乎是泛指迦南地全體的原居民（15:19-21），尤其是示劍一帶的人，雅各曾向他們買地（33:18-19）」，並指出這用語雖然不能道盡當地混雜的人種，然而勢力範圍主要在美索不達米亞北部和敘利亞的亞摩利人「依然對迦南的民間和宗教習俗，有深遠的影響力」。GT《聖經精讀本》同說是「通指居住迦南地的所有民族」；CT 也說亞摩利人在此代表迦南人諸族。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
- title: 約瑟骸骨葬於示劍
  path: link_folder/歷史/約瑟骸骨葬於示劍.md
  summary: 雅各把「從亞摩利人手下奪的那塊地」賜給約瑟，使他比眾弟兄多得一分（22節）。
  relation: CT 把這塊地與約瑟的葬地連了起來：「約瑟的骸骨後來被葬在示劍，該地也作了約瑟子孫的產業」（書24:32；約4:5）。GT 丁良才同說約瑟和他的弟兄是被埋於從亞摩利人奪回的那塊地裡，並指出示劍城後來歸於約瑟的後裔以法蓮支派的人為業（書21:20-21）；GT《串珠聖經註釋》說「那塊地」指示劍城，該城後來屬於以法蓮支派（書21:21），而約瑟的骸骨也放在示劍（書24:32）。GT《啟導本聖經創世記註釋》則說此地後來屬瑪拿西支派，約瑟死後葬在此。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_48.txt, raw_data/ccbiblestudy_GT_genesis_48.txt, raw_data/kingcomments_genesis_48.txt, raw_data/biblehub_study_genesis_48.txt]
