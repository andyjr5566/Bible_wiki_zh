updates:
- title: 神的主權與人的責任
  path: link_folder/神學/神的主權與人的責任.md
  summary: "酒政和膳長同樣得罪了法老（創40:1），三天後卻一個官復原職、一個被掛在木頭上（創40:21-22）。KC 就此提出本章最硬的問題：為什麼一個蒙恩、一個受審？他的回答不是解答而是並陳——「這裡我們碰到神主權的作為，是我們無法測透的……這裡有真理的兩面：一面是神的揀選，另一面是人的責任。這兩面我們無法連起來，只有神能。我們必須讓兩面並排放著，不要試圖把它們接起來；我們若硬要接，就會落入異端。」他同時明說：神並沒有預定那些人沉淪，滅亡的人是因自己不肯照著神的呼召悔改（參太23:37；徒17:30）。"
  relation: "本章把揀選與責任的張力放在一組完全對稱的處境裡：同罪、同囚、同夜作夢、同一位解夢者、同一天受審，結局卻相反——這使得「差別從何而來」無法被歸因於際遇。KC 拒絕把兩面壓成一面，也拒絕由神的主權推出雙重預定；這與創45章「不是你們，乃是神」、創50章「你們的意思是要害我，神的意思原是好的」是同一條線的兩端：那裡是人的惡不能廢去神的善，這裡是神的揀選不取消人不肯悔改的責任。"
