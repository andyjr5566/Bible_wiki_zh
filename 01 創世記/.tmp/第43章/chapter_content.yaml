organization: "上一章雅各說「我的兒子不可與你們一同下去」（42:38）；本章饑荒把他逼到牆角。KC 一語道破：**對雅各來說，最可怕的不是饑荒，而是他必須交出便雅憫。**\n\
  \n> [!note] 約瑟與便雅憫，合起來纔是完整的彌賽亞\n> KC：**在約瑟身上我們看見那位受苦、被棄絕、如今得榮耀的耶和華僕人；在便雅憫身上我們看見那位快要在權能與威嚴中掌權的彌賽亞——「右手之子」**（創35:18；49:27）。**正統猶太人今日所盼望的彌賽亞，只是「便雅憫」。他們棄絕了約瑟，卻愛便雅憫。**——而神的作法是：**要把便雅憫帶到約瑟那裡去，使二者合一。**\n\
  \n### 經文大綱\n\n1. **饑荒甚大，雅各再遣眾子糴糧**（1-2節）\n2. **猶大以性命作保，說服父親**（3-10節）\n3. **雅各備禮物、加倍銀子，交託全能的神**（11-15節）\n\
  4. **約瑟設筵，家宰安撫、釋放西緬**（16-25節）\n5. **兄弟們二次下拜，約瑟見便雅憫而哭**（26-30節）\n6. **分席宴樂，便雅憫多得五倍**（31-34節）\n\
  \n### 一、猶大的擔當（1-10節）\n\n「他們從[[埃及]]帶來的糧食吃盡了」——CT：**約瑟所供應的糧食，有吃盡的時候；昨天的嗎哪不能供給今天的需要**（出16:21）。**正是這「吃盡」、這饑餓不滿足的感覺，驅使我們一再回到主面前。**\n\
  \n出面說話的是[[猶大（雅各之子）|猶大]]——GT 分析他何以有資格：**長子流便與繼母同寢失了父親的看重（35:22）；次子西緬被扣在埃及；三子利未與西緬同謀屠示劍（34:25），不得父親信任。**而猶大在多坍事件中曾攔阻眾兄弟殺約瑟（37:26-27）。\n\
  \n| | 流便（創42:37） | 猶大（創43:9） |\n|---|---|---|\n| 抵押 | 「你可以殺**我的兩個兒子**」 | 「**我為他作保**……我情願永遠擔罪」\
  \ |\n| 代價 | 別人的性命（他有四個兒子，46:9） | 自己的一生 |\n| 結果 | 雅各不聽 | 雅各終於答應 |\n\n> [!quote] 從「賣了他」到「我為他作保」\n\
  > KC：**當年極力主張賣掉約瑟的正是猶大（創37:26-27）；如今他卻成了那個為父親、為便雅憫著想的人。復興的工作正在他和眾弟兄裡面進行。**「[[古代近東的作保制度|作保]]」（STEP\
  \ 可確認第9節使用字根 עָרַב，H6148，「擔保／作保」；擔罪使用 חָטָא，H2398）與「從我手中追討」（בָּקַשׁ，H1245）都是法律術語——**借款人若不還錢，擔保人負全責。**GT\
  \ 說得更重：**若真出事，猶大可能被逐出雅各家、被剝奪繼承權、被咒詛。**這正預備了下一章他替便雅憫代求的高峰（44:18-34），也是雅各日後大大祝福他的緣由（49:8-12）。\n\
  \n### 二、雅各終於交託（11-15節）\n\n雅各說「**若必須如此**」——CT：**這句話顯出雅各現在是一個溫柔的人了，不再堅持己見。**他吩咐帶「這地土產中最好的」（原文直譯是「這地的力量」或「這地的詩歌」，即那些使這地出名的東西）：乳香、蜂蜜、香料、沒藥、榧子、杏仁。《舊約背景註釋》指出：**其中惟有乳香、蜂蜜、榧子、杏仁纔真正是迦南出產；香料和沒藥是舶來品。**——**饑荒之年送出這些，代價極高。**\n\
  \n這六樣東西，來源各有說明；CT 另在靈意註解裡逐項給了象徵：\n\n  | 禮物 | 來源給的說明 | CT 的靈意 |\n  |---|---|---|\n\
  \  | 乳香 | 真正的迦南出產（背景註釋）；可用來醫治傷口（串珠） | 基督復活的馨香（林後2:14-15） |\n  | 蜂蜜 | 真正的迦南出產（背景註釋）；雷氏說「不是蜜蜂的蜜，而是用新鮮葡萄汁熬成的糖漿」\
  \ | 基督甘甜恩惠的話語（詩119:103） |\n  | 香料 | 舶來商品，非迦南出產（背景註釋） | 基督加在眾聖徒祈禱中的功績（啟5:8） |\n \
  \ | 沒藥 | 舶來商品（背景註釋）；啟導本說是樟樹或岩薔薇軟樹分泌的膠汁，盛產阿拉伯南部，有濃郁香氣；串珠說也有醫治的功能 | 基督受死的苦（約19:39）\
  \ |\n  | 榧子 | 真正的迦南出產（背景註釋）；啟導本說產於小亞細亞一帶，青色核仁可供食用，今稱「開心果」，聖經只有此處記載；串珠說是迦南地稀有的美品\
  \ | 基督外表堅剛、實則宅心仁厚（歌6:11） |\n  | 杏仁 | 真正的迦南出產（背景註釋） | 基督是初熟的果子（杏樹最早開花） |\n\n  GT《靈修版聖經註釋》補上一句最現實的話：這一類禮物「在埃及並不常見，在鬧饑荒的年份就更稀罕了」。\n\
  \n  「又要手裡加倍地帶銀子」——CT 幽默地說：**這不像那從前老是要把別人的東西拿來當作自己的雅各了。**\n\n> [!quote] 「我若喪了兒子，就喪了吧」\n\
  > 「但願[[全能的神（El Shaddai）|全能的神]]使你們在那人面前蒙憐憫」——STEP 可確認原文為 אֵל שַׁדַּי（El Shaddai，H410/H7706）；至於 Shaddai 的詞源與神學詮釋，註釋與研究有不同解釋，其中部分傳統理解為「全豐、全足、全有的神」。這正是神當年向亞伯拉罕（17:1）與雅各自己（35:11）啟示的名字，**雅各是在提起神的應許**（丁良才）。而「我若喪了兒子，就喪了吧」（第14節原文使用動詞字根 שָׁכֹל，H7921，Qal 完成式疊用 שָׁכֹלְתִּי שָׁכָלְתִּי），與以斯帖的「我若死就死吧」（斯4:16）同一語氣——**不是斷言悲劇必然發生，而是在無法控制的處境中，把結果交在神手裡。**\n\
  >\n> KC：**雅各以為自己失去一切，結果卻是全部得回，而且遠超過他所失去的。這就是神賜福我們的方式。**\n\n### 三、恩典使他們害怕（16-25節）\n\
  \n[[約瑟]]一見[[便雅憫]]同來，就吩咐家宰宰牲設筵。**但約瑟的恩慈，只叫哥哥們更加害怕**——他們以為是要「找我們的錯縫……強取我們為奴僕」。（按古代近東習俗，小偷若不能歸還原物並加倍賠償，就會被賣為奴，出22:3-4。）\n\
  \n> [!note] 不信任的人，會曲解一切善意\n> CT：**人與人相處，最重要的是彼此能夠信任；若不能信任，無論對方的動機如何良善，都會予以曲解。許多時候，神安排萬事萬物是為著我們的益處（羅8:28），我們卻常誤以為神是在苦待我們。**KC\
  \ 補上：**約瑟渴望賜福他們，一切的恩惠卻只叫他們更懼怕、更多疑。他們又一次用各樣的解釋和辯白來安撫自己的良心。**\n\n然後他們從家宰口中聽見一句福音式的話：「**你們可以放心，不要害怕，是你們的神和你們父親的神賜給你們財寶在你們的口袋裡；你們的銀子，我早已收了。**」\n\
  \nKC：**他們所要買的，早已有人付清了，而他們竟不知道。他們正在學一個功課——沒有人能靠自己的功德供應自己的需要，一切都是神的恩典所供應的。這功課我們也必須學，而且要一再重學。**（GT《聖經精讀本》留意到家宰用的是希伯來人稱神的名字「伊勒欣」；CT\
  \ 則說這句話**隱約透露出他知道約瑟與他們之間的關係，或者約瑟事先關照過他如何答話**。）\n\n西緬被帶出來交還他們；[[家宰（約瑟的管家）|家宰]]給他們水洗腳、給驢草料——**這是把他們當作上賓對待。**《舊約背景註釋》說明這個職位：位高家大者如約瑟必然需要成群僕從，由管家率領，其責任包括維持住宅、照管財政、監督僕人；約瑟視之為心腹（創44:1、4），而他人有求於主人時負責傳話的也是他。\n\
  \n### 四、約瑟第二次哭（26-30節）\n\n「他們就把手中的禮物拿進屋去給他，又俯伏在地，向他下拜」——夢再一次應驗（創37:7-11；參42:6）。KC\
  \ 卻指出約瑟的心思不在禮物上：**約瑟根本不理會那禮物。他要的不是他們的禮物，而是他們這個人。**——**照樣，我們也不需要帶著禮物去見神，以為這樣就能討祂喜悅。**\n\
  \n約瑟問的第一句是「你們的父親……平安嗎？」——STEP 可確認 43:27–28 反覆三次使用 שָׁלוֹם（H7965，如「問他們好」לְשָׁלוֹם、「平安嗎」הֲשָׁלוֹם、「他平安」שָׁלוֹם）。這與 37:14 雅各差約瑟查看哥哥們的 שָׁלוֹם 形成直接詞彙呼應；KC 進一步指出這個跨章回聲：**二十多年前，正是父親差他去問哥哥們「平安」的**（創37:14）。而哥哥們回答「平安」時，**卻一字不提老父這些年的悲傷。**\n\
  \nGT《聖經精讀本》為這一刻補上年歲：當時約瑟三十九歲，便雅憫二十三歲；而約瑟被賣到埃及之前，在希伯崙見便雅憫的最後一面時，這個弟弟還是個約一歲的嬰兒——他認得出便雅憫，靠的是那張上次沒見過的新面孔。\n\
  \n  他看見同母的兄弟便雅憫，說「小兒啊，願神賜恩給你」，隨即「愛弟之情發動，就急忙尋找可哭之地，進入自己的屋裡，哭了一場」——**這是他第二次哭**（第一次在42:24）。STEP\
  \ 顯示「愛弟之情發動」原文為 נִכְמְרוּ רַחֲמָיו（字根 כָּמַר H3648，Niphal 完成式「溫熱／沸騰」；搭配 רַחֲמִים\
  \ H7356，指發自深處的憐憫與骨肉之情）；GT 說原文意為「如燃燒」，**指心腸灼熱、緊縮的狀態**。\n\n> [!quote] 有時候，別人不該看見我們的眼淚\n\
  > KC：**有時候讓別人看見我們的眼淚是好的（徒20:19；提後1:4），有時候不讓別人看見卻更好（耶13:17；路22:62）。他何等渴望立刻表明自己！但他在弟兄們心裡的工作還沒有完成。**——**主耶穌對待敘加井旁的婦人也是如此：祂沒有立刻向她顯明自己，而是等她的良心先進入光中**（約4:25-26）。CT：**我們不應視「哭」為弱者的行為，主耶穌自己也曾哭過（約11:35）；凡不曾在神面前哭過的人，就不配在人面前笑。**\n\
  \n### 五、三張桌子與五倍的份（31-34節）\n\n「他洗了臉出來，**勉強隱忍**」——然後擺飯。三席分開：約瑟一席、希伯來弟兄一席、埃及人一席。STEP\
  \ 顯示第32節埃及人視與外族同席為「可憎／忌諱」（使用 תוֹעֵבָה，H8441，context gloss 為「abomination」）。原因來源說法有二：①**埃及人厭惡牧羊人**（46:34），且希伯來人吃埃及人視為神聖的母牛；②**宗教潔淨的規矩**——與外族同席被視為玷污。《舊約背景註釋》：**埃及人視一切外人為蠻族。約瑟身分高貴，不論埃及人還是雅各眾子，均不能與他同席。**\n\
  \n約瑟「使眾弟兄在他面前排列坐席，都按著**長幼的次序**；眾弟兄就彼此詫異」——KC：**他雖未表明身分，卻藉著座次顯出他知道他們、知道他們的來歷。**GT：**兄長們只當他是善於占卜（44:15）、具超然能力的人，仍沒認出這是約瑟。**\n\
  \n最後是那個試驗：「[[對兄弟的試驗|但便雅憫所得的比別人多五倍]]。」\n\n> [!note] 五倍的份，是一個秤\n> CT：**「五倍」的食物，不可能是要便雅憫全部自己享受，而是為試驗哥哥們的反應，是否仍心存嫉妒。**KC\
  \ 問得更直接：**他們會嫉妒，還是會為他高興？**——經文的回答是：「**他們就飲酒，和約瑟一同宴樂。**」GT 據此判斷：**當年那個嫉妒的心（37:4）已經找不到了；他們確實痛改前非、已經成熟。**\n\
  >\n> GT《聖經精讀本》另補兩層背景：古代近東的筵席風俗並不要求客人把分到的食物全部吃完，多給只是出於尊敬和愛意，表示這是特別尊貴的客人（撒上9:22-24）；而埃及人以「五」代表完全、充分（參創45:22）。丁良才則說約瑟把自己面前的食物分出來送給他們，本身就是尊重弟兄的作法。\n\
  >\n> 但 KC 留下一句冷靜的話：**這是一切憂愁之後第一次的歡樂；然而弟兄們所歡喜的還不是約瑟這個人本身，只是他們從他所得的東西。**——真正的考驗，要等到下一章。\n\
  \n### 關鍵神學點\n\n1. **猶大的認罪與悔改**：從主張賣弟的人，變成以自己一生作保的人；這是本章最大的轉折。\n2. **[[全能的神（El Shaddai）]]**：雅各先安排一切，最後纔把事交在神手裡——但他終究交了。\n\
  3. **神的護理**：口袋裡的銀子、家宰的話、按長幼的座次，都是神在暗中安排的痕跡。\n4. **[[對兄弟的試驗]]**：五倍的份是一把秤，量出他們對「父親所偏愛的另一個兒子」是否仍有嫉妒。\n\
  5. **約瑟的夢（應驗）**：他們第二次俯伏下拜，卻仍不認得他。\n6. **悔改與良心的覺醒**：恩典臨到了，有虧的良心卻先把恩典當作威脅。\n\n###\
  \ 背景補充：禮物、家宰、下拜與分席而食\n\nGT《舊約背景註釋》為本章四個場景各補一條。\n\n**雅各挑的禮物**：背景註釋指這份禮物「最是昂貴，因此也是最為討好的物件」，並作了一個關鍵的分辨——其中惟有乳香、蜂蜜、榧子、杏仁才真正是迦南的出產，而香料和沒藥是舶來商品。換句話說，雅各是把迦南最好的土產與最貴的進口貨湊在一起，作為取悅埃及宰相的重禮。第11節那句「把這地土產中最好的……帶下去」，在制度上是一份外交贈禮。\n\
  \n**家宰是什麼職位**：位高家大者如約瑟必然需要成群僕從，由管家率領，而這人的責任包括維持住宅、照管財政、監督僕人；背景註釋並指約瑟視之為心腹（創四十四1、4），「顯示這是備受信任的職位」，而他人有求於主人時負責傳話的也是他（創四十三19-23）。這解釋了為何眾兄弟一到門口就先向家宰說明銀子的事——那是正確的申訴管道。\n\
  \n**下拜的規格**：古代近東表示敬意的標準姿態是下拜到地，埃及古墓藝術隨處都有奴僕臣宰俯伏在法老面前的例證；背景註釋並指亞馬拿泥版（主前十四世紀）中每封信的格式，都是先問安、再按一套既定程式向前向後下拜七次，向法老表示敬意。眾兄弟第26節的下拜不是誇張的描寫，而是當時見高官的標準動作——也正因為它如此標準，讀者才更看得出創三十七章那兩個夢正在應驗。\n\
  \n**為何分三處吃飯**：背景註釋說明第32節的安排出於埃及的族群觀念——「埃及人視一切外人為蠻族，因此不會與他們同桌吃飯，以避免直接接觸」；而約瑟身分高貴，不論埃及人還是雅各眾子均不能與他同席。這一節同時交代了三件事：約瑟已完全進入埃及的階序、他仍與弟兄之間隔著一道文化的牆、而這道牆正是他還不能相認的處境之一。"
