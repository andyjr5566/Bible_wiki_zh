organization: '### 為以撒擇偶的囑咐（1-9節）


  亞伯拉罕年約一百四十歲（以撒娶妻時四十歲，創25:20），「向來在一切事上耶和華都賜福給他」是他一生的總結。他叫管理全業最老的僕人（傳統認為即大馬色人以利以謝，創15:2）把手放在他[[大腿底下起誓|大腿底下]]起誓——古代最鄭重的起誓禮，手所按之處靠近生殖器官，關乎後裔傳承（創47:29）。


  誓約的兩個條件：

  1. **不可娶迦南女子**（3節）——迦南各族拜偶像，恐後裔被誘離真神；擇偶首在信仰傳承的純潔（申7:3-4；林後6:14）。

  2. **不可帶以撒回本地**（6、8節）——神既呼召亞伯拉罕出來並應許迦南地，就絕不能走回頭路；「祂必差遣使者在你面前」（7節）顯出他堅定的信心。

  GT《舊約背景註釋》為這兩件事各補了一層制度說明。關於起誓：誓必然是奉神祇之名起的，誓言把履行條款的重責放在起誓者身上，他若背誓就有受神、人報復的危險；起誓有時包括某些舉動，而這舉動通常和所應允之事相關——僕人把手放在亞伯拉罕大腿內側（接近其生殖器官），正是把服從的誓言與「為以撒娶妻以延續譜系」連結起來。


  關於不娶迦南女子，背景註釋提出的動機卻與中文註釋不同，值得並陳。它把這種「內族通婚」（endogamy）的動機分成宗教、社會、種族三類，並判斷本處「似乎是種族因素，因為經文沒有表示拉班、利百加、拉結的信仰，與亞伯拉罕一家有什麼共通之處」；真正的關鍵是與神所立的約需要亞伯拉罕一家不被迦南這個大熔爐所同化。這個讀法提醒我們：把第3節直接解成「擇偶首在信仰純潔」，是後代的應用；經文與後續敘事（拉班家中有家神像，創三十一19）並沒有給拿鶴一族更高的信仰評價。



  ### 井旁的禱告與利百加（10-28節）


  僕人帶[[十匹駱駝]]與各樣財物往[[米所波大米]]的拿鶴之城（哈蘭一帶，約八百公里）。天將晚，他在城外的[[水井]]旁禱告，求神以一個記號顯明「[[神約定之妻|你所預定給你僕人以撒的妻]]」（14節）：肯給客旅水喝、又主動為駱駝打水的女子。這記號考驗的正是品格——十匹駱駝的飲水量極大，非有愛心、勤快與體力者不能為。

  這個「記號」的運作方式，GT《舊約背景註釋》有一段極要緊的分析：僕人其實是在借用當時通行的「神諭機制」——向神明提出一個是非題，再用某種答案非是即否的機制讓神回應（西乃山之後以色列祭司所用的烏陵土明即是一例）。而背景註釋認為這位僕人「想必極有創意」，因為他用的是自然界的機制：求水的人通常都預期對方應允，因為按當時的禮節和習俗這本是正常作法——所以少女給他水喝，對諭示而言恰恰是「否」的答案；他把「是」的答案設定在一個出乎意料的回應上，就是少女面對這樣一個隨和的請求時，竟自動提出為他整隊駱駝打水。這一連串步驟背後的觀念是：神若作出答覆，就會影響人正常的行為、改變人自然的本能，藉以傳達祂的答案。類似的機制式諭示可見於士六36-40 與撒上六7-12。


  這個框架讓第14節的記號從「巧合」變成一套當時人看得懂的求問程序，也解釋了僕人為何要「定睛看她、一句話也不說」（21節）——他在等機制跑完。


  至於工作量有多大，背景註釋也算給了數字：幾天沒有喝水的駱駝能夠一次喝二十五加崙之多，而裝水餵駱駝的瓶子容量不超過三加崙。十匹駱駝，意味著少女要來回打水數十趟。它並補充駱駝的生理：牠喝水只是補充失去的水分，不是把水儲藏在駝峰；集中的脂肪和毛層有助散熱減汗，並容許體溫在日夜間有較大幅度變動。


  水井旁的社會規則同樣有講究。背景註釋指出早晨和傍晚清涼之時是婦女到村中公用井打水最理想的時候，水井往往在村外以方便飲牛飲羊，婦女為了安全通常會集體前來；外人可以打水，但理當先向村民作出請求，而村民必須向外人提供食水，因為待客友善是當時的通例。它另注意到一個字彙細節：第11節用的是「井」、第13節用的是「泉」，可能表示該處有不同的水源——某些泉水因地下水位下降而驅使人下掘求水，如此便形成水井。



  「話還沒有說完」，[[利百加]]扛著水瓶出來——神的答覆迅速而即時。她給僕人水喝，又「急忙」「跑」著為所有駱駝打上水來；僕人定睛看她、一句話也不說，要曉得耶和華賜他通達的道路沒有（21節）——觀察印證，不急於下結論（哈2:1）。駱駝喝足了，僕人拿出重半[[舍客勒]]的[[金環]]（戴在鼻上，47節）與重十舍客勒的兩個[[金鐲]]給她；問明她是[[密迦]]與[[拿鶴]]之子[[彼土利]]的女兒——正合「本族」條件——就低頭向耶和華下拜。

  這兩件首飾的份量值得換算。GT《舊約背景註釋》說鼻環在鐵器時代最為普遍但較早時期也有例證，材質用銀、青銅或金，設計通常呈管狀環形、有兩端以供穿戴、有時佩有小墜；本節的鼻環重一貝卡，相當於半舍客勒，即五分之一盎斯。金鐲則是環腕穿戴的手鐲，是很普遍的飾物，古墓中女屍的臂上和腕上經常可以找到，而僕人把鐲子戴在她臂上「可能象徵婚約」；十舍客勒的金鐲重約四盎斯。它並給了一個對照的刻度：主前第二千年紀上半葉的法律文件顯示，僱工每年頂多只能賺到十舍客勒，往往還不到——而那還是銀子，金子的價值只會更高。換句話說，僕人一出手就等於一個工人一年以上的工價。


  另外第28節利百加「跑回去照著這些話告訴她母親和她家裡的人」也有講究：背景註釋指出年輕未婚女子出嫁之前，稱己家為娘家（母親家）是很自然的事（歌三4），不必讀成彼土利已經不在或無權過問。



  僕人的成功在於完全依賴神的引領：禱告→觀察→感恩。


  ### 提親與利百加的「我去」（29-61節）


  利百加的哥哥[[拉班]]看見金環金鐲就跑出來迎接——為日後他重財的性情埋下伏筆（創31章）。僕人不肯先吃飯：「等我說明白我的事情再吃」（33節）——受託之事重於身體需要。他從神的角度重述始末（34-49節），簡明透徹，使人知所進退。


  拉班和彼土利回答：「這事乃出於耶和華，我們不能向你說好說歹」（50節）——人一看出是出於神，就只能順服。僕人三次禱告的姿勢逐步降卑：站著求（13節）→低頭下拜（26節）→俯伏在地（52節）（CT）。


  次日家人欲留她「至少十天」，僕人以神的帶領辭謝耽延。他們叫了利百加來問：「你和這人同去嗎？」她說：「**我去**」（58節）——雖未見過以撒，卻信僕人所述而果斷順服；「我們雖然沒有見過祂，卻是愛祂」（彼前1:8）。家人祝福她「願你作[[千萬人的母]]！願你的後裔得著仇敵的城門！」（60節）——正應和神對亞伯拉罕的賜福（創22:17）。

  「叫利百加來問」這一步在當時其實不尋常，GT《舊約背景註釋》特別解釋了原因：古時女子在重要事務中甚少有作決定的份，利百加對自己的婚事本來不得置喙（50-51節），但當僕人要求立刻啟程時，家人卻請求她同意。背景註釋認為理由在於保障——環繞這段時期的婚約十分關注女子在夫家是否得著照顧，女家若在附近就能保證她受到適當待遇，而他們所要求的十日時間正能給他們機會查明是否一切屬實；利百加之所以被諮詢，「可能是因為她在這種特殊情況底下離開家庭的保護，是要冒頗大危險之故」。她那句「我去」因此不只是順服，也是承擔風險的決定。


  第53節送出的財物也有制度上的功能：背景註釋指出在協定結婚之前男家必須付出聘金、女家要提供妝奩，而送給利百加的金銀器皿和衣物有「改變她身分成為亞伯拉罕家一份子」的作用（經文所用的字眼形容的是打成有用器皿的金屬，包括首飾、盤碟或其他用具）；送給她哥哥拉班和她母親的禮物，則有證明亞伯拉罕財富、突出與他家聯婚之益處的作用。至於同行的乳母（59節），背景註釋說預備要與富人結婚的女子應當有成群奴僕隨行，而乳母自小撫育她因此地位特別高，會同行成為新家的一份子，並在途中擔任護送之職。



  ### 以撒迎娶（62-67節）


  以撒住在南地，天將晚在田間默想，舉目見駱駝隊來了。利百加見以撒便下駱駝、拿帕子蒙上臉——按當時風俗，新娘在婚禮完成前以帕蒙面，表端莊與尊重。僕人將所辦的一切事都告訴以撒——完滿交代任務。

  GT《舊約背景註釋》為這個動作補上兩層。其一是意義：她在途中並沒有蒙臉，直到知道對方是以撒之後才立刻蒙上——「這可能是利百加向以撒表示自己是他新婦的方法」，因為新娘在結婚時蒙臉，已婚婦人則否。其二是分寸：蒙臉風俗隨時、地而變遷，便尼哈桑古墓壁畫（主前第二千年紀早期）中的亞洲婦女並不蒙臉，而按中亞述法律（主前第二千年紀晚期），所有良家婦女在公眾場合出現時都必須蒙臉——所以不能把某一時期的規矩當成全時代的通例。


  第62節提到以撒「從庇耳拉海萊來」，背景註釋也留了一個觀察：這地名意為「看見我的永生者之井」，最初出現在創十六14 神向夏甲顯現之處，位於尼革地區希伯崙西南方；以撒出現在那裡，表示「亞伯拉罕和以撒若非將營盤往南遷移，就是以撒如今已經分家居住」。



  以撒領利百加進了他母親[[撒拉的帳棚]]——表明她承接主母的地位；「娶了他為妻，並且愛他」——這是聖經第二次出現「愛」字：第一次是父對子（創22:2，父神與愛子的圖畫），這次是夫對妻（基督與教會之愛的圖畫）。以撒自從母親不在了，這才得了安慰。

  GT《舊約背景註釋》確認這個動作在當時的法律意涵：撒拉具有全家主母的地位，因此她死後帳棚空置；以撒把利百加帶進母親的帳棚，表示如今全家主母就是她——而這個作法「與烏加列文獻中進入新郎家門，有同等的重要性」。換句話說，第67節不只是溫情的收尾，也是這樁婚事在制度上正式完成的一步。



  ### 三一神同工的豫表


  > [!quote] KC

  > 僕人述說的滿是主人和主人兒子的豐富——聖靈今日也照樣向我們述說父與子的榮耀（約十六13-15）。


  | 角色 | 豫表 | 要點 |

  |------|------|------|

  | 亞伯拉罕 | 父神 | 發起計劃：一切所有的都給了兒子（36節；西1:19），差遣僕人為子娶妻 |

  | 老僕人 | 聖靈（[[聖靈的引領]]） | 管理全業、奉差遣尋找對象、介紹子的豐富、引領新婦走曠野路直到見面 |

  | 以撒 | 基督 | 承受萬有、留在應許之地等候、田間默想（為教會代求的圖畫）、迎娶新婦 |

  | 利百加 | 教會（[[基督之新婦（豫表）]]） | 同族（有其生命）、未見而信而愛、撇下所有跟隨引領、使新郎得安慰 |


  撒拉被利百加接續，KC 讀作以色列與教會的救贖史圖畫；這一切豫表都以「這事乃出於耶和華」為根基——婚姻與救恩同樣出於神的預定與引領。'
