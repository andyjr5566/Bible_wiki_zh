updates:
- title: 亞伯拉罕
  path: link_folder/人物/亞伯拉罕.md
  summary: 亞伯拉罕年老蒙福，叫管理全業最老的僕人把手放在他大腿底下起誓，不為以撒娶迦南女子，要往本地本族去為以撒娶妻，且不可帶以撒回本地；他確信「祂必差遣使者在你面前」，僕人遂往米所波大米，蒙神引領為以撒娶得利百加。
  relation: 本章亞伯拉罕退居幕後、僅於1-9節設定擇偶原則，卻主導全章走向：他堅持信仰傳承的純潔（不娶迦南女子）與不走回頭路（不帶以撒回本地），並以差使者的信心把成事交託給神。
- title: 駱駝成為家畜
  path: link_folder/文化/駱駝成為家畜.md
  summary: 本章十匹駱駝貫串全篇（10、11、19-20、31-32、61、63-64節）。GT《舊約背景註釋》〈創二十四10～11 駱駝的馴養〉給了與「主前十二世紀才馴服」不同的一組資料：阿拉伯挖掘到鑑定為主前二六○○年的駱駝遺骸，經馴養的駱駝要到主前一二○○年才在巴勒斯坦普遍起來，但主前第二千年紀初期烏加列的舊巴比倫文獻中已可找到馴養的跡象，「足以作為創世記中幾次提及駱駝的佐證」，而阿拉伯以駱駝為馱獸的證據可上溯到主前第三千年紀末期。它並說明駱駝是富裕的象徵，甚少被用作食物。
  relation: 本章是創世記中駱駝著墨最多的一章，因此也是「族長時代是否已有馴養駱駝」這個年代問題最集中的一處。背景註釋所給的「馴養跡象早於普及」的區分，正是回應該條目原本所記「主前十二世紀由米甸人首先馴服」的說法——兩說並非互相取消：一個講普及的時間，一個講馴養最早的跡象。
