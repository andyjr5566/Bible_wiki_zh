book: 創世記
chapter: 27
updates:
- title: 赫人
  path: link_folder/人物/赫人.md
  summary: |
    - 利百加對以撒說，因這赫人女子連性命都厭煩了（46節），指以掃所娶的赫人媳婦
    - 她以「恐雅各也娶赫人女子」為由，說服以撒打發雅各往哈蘭娶本族女子
    - 來源：CT, GT, KC
  relation: 承接創26以掃娶赫人女子的家庭愁煩，利百加藉此為由送雅各離家，既避以掃殺機又免雅各與赫人通婚
- title: 努斯泥板與家神像
  path: link_folder/歷史/努斯泥板與家神像.md
  summary: 第37節以撒對以掃說「我已立他為你的主……我還能為你做甚麼呢」。GT《聖經精讀本──創世記註解》引族長時代的努斯泥版說明：只要是族長正式的祝福，即使只是口頭祝福或遺言，都具有效力，法庭也認可。這是以撒無法收回已出口之祝福的制度背景。
  relation: 努斯泥板在本卷中兩次提供關鍵背景：本章解釋口頭祝福為何具法律拘束力，創31章解釋家神像為何與繼承權相連。兩者指向同一件事——族長家族的財產與名分轉移，在當時有可訴諸法庭的成文慣例，不只是家內的情感安排。
