organization: "本章是一齣令人省思的家庭悲劇：一個原本敬畏神的家庭，在關鍵時刻卻沒有一個人先向神禱告求問——以撒受制於口腹之慾與個人偏好、利百加擅自用人的計謀搶先出手、雅各順從母親的安排冒充行騙、以掃既曾輕看長子名分此時又心懷殺機。儘管神早已宣告的旨意（「將來大的要服事小的」）最終依然成就，但家庭裡的每一個人都為自己的軟弱付出了沉重的代價。\n\
  \n### 一、以撒欲祝福以掃（1-4節）\n\n以撒年老，雙眼昏花看不清楚（經文描寫「眼睛昏花不能看見」וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת，H3543A、H5869A、H7200G；[[以撒的眼睛昏花]]）。在屬靈的教訓上，這也反映出人在年老體衰時，屬靈的辨識力可能受到肉體感覺的蒙蔽，容易忽略神的心意（KC）。以撒一心想把祝福給予大兒子以掃，儘管神早在二子出生前就已啟示「將來大的要服事小的」（創\
  \ 25:23），且以掃早已把長子名分出賣——這主要源於以撒對野味美味的個人偏好（經文使用 צַיִד，H6718A；מַטְעַמִּים，H4303；[[以撒偏愛以掃]]；創\
  \ 25:28）。在希伯來文中，「祝福」（בְּרָכָה，*berakah*，H1293）與「長子名分」（בְּכֹרָה，*bekorah*，H1062）發音非常相近，以撒企圖藉著私下的祝福把屬靈的繼承權給予以掃，反映出他不尊重神既定的定規。\n\
  \n> [!note] 「未死之先」的祝福\n> 根據年歲推算，以撒此時約 137 歲（可能受到同父異母兄長以實瑪利享壽 137 歲去世的影響，自覺離世的日子近了），但他實際上活到了\
  \ 180 歲，此後還有 43 年的歲月（創 35:28；CT/KC）。在古代近東，族長臨終時正式宣告的[[族長祝福的不可更改性|口頭祝福具有法律約束力與預言效力，一經說出口就不能更改]]（創\
  \ 9:24-27；49:28）。\n\nGT 華爾頓《創世記背景註釋》在此補充了兩點重要的文化背景考證。第一是關於當下的處境：古代族長所宣告的祝福或咒詛都具有必然的拘束力，若在臨終前宣告則更為莊嚴；「然而本段經文並不是描繪以撒快將死亡，只是說他老到一個地步，覺得需要安排好後事，作出傳統的祝福」——第\
  \ 2 節以撒所說「我如今老了，不知道哪一天死」，是老年人對生命有限的常態自覺，而非病危的臨終診斷。第二是關於野味的宴席：以掃所準備的野味不僅營造喜悅的氣氛，更「構成配得起這種大事的慶祝場面」，如同現代人在重大儀式時舉行正式盛宴——因此第\
  \ 4 節要求野味美味，在當時也是正式立約與祝福儀式程序的一部分。\n\n至於野味為何需要費時出獵，華爾頓在第 14 節進一步說明古代近東的飲食實況：當時煮食由男女共同分擔，野味是為平日單調少肉的飲食增添變化的主要來源；野獸的肉質通常較硬且羶味較重，必須經過長時間燜煮並加入多種香料調味才好吃——這正說明了利百加為何有把握用家中的兩隻山羊羔（גְּדָיֵי\
  \ הָעִזִּים，H1423、H5795），烹調出「父親所喜愛的美味」。\n\n### 二、利百加的詭計（5-17節）\n\n利百加無意中聽見了以撒的吩咐後，並沒有直接去提醒以撒順服神的旨意，也沒有像過去那樣先求問神（創\
  \ 25:22），反而擅自採取了瞞騙的手段：她吩咐雅各從羊群中牽來兩隻肥嫩的山羊羔做成[[野味|美味]]，讓雅各穿上以掃珍貴的衣服（בִּגְדֵי עֵשָׂו\
  \ הַחֲמֻדֹת，H899B、H2530），並在雅各光滑的手和頸項上包上[[山羊羔皮]]（עֹרֹת גְּדָיֵי הָעִזִּים，H5785、H1423、H5795）前去冒充。雅各起初的顧慮並非出於道德的自責，而是害怕被父親摸出破綻而招來咒詛；利百加隨即回答：「我兒，你招的咒詛歸到我身上。」\n\
  \n關於「咒詛歸到我身上」在古代法律背景中的涵義，GT 華爾頓《創世記背景註釋》給了清晰的分辨：本章的脈絡表明祝福不能隨意轉讓給他人，宣告的咒詛同樣無法轉移；因此利百加這句話的真實意思「大概是咒詛的惡果，而非咒詛本身」——既然神是監察一切的公義者，利百加坦承是自己主導這場計謀，若有任何災禍後果，她願意一人承擔責任。這不是迷信式的替罪，而是她承擔責任的決心；而後續歷史（第\
  \ 45 節起她被迫與雅各長久分離，直至去世再未相見）顯示，欺騙帶來的苦果確實切實臨到了她身上。\n\nKC 指出：夫妻在婚姻中長期相處所建立的了解，本應當用來鞏固家庭的合一，在此卻被利百加拿來當作欺騙丈夫的工具——原本美好的默契反而成了拆毀家庭信任的破口。\n\
  \n### 三、雅各騙取祝福（18-29節）\n\n雅各照著母親的計謀冒充哥哥以掃來到父親面前（[[雅各騙取祝福]]）。在整個對話中，以撒三次產生懷疑（打獵回來的時間太快、說話的聲音像雅各、伸手觸摸檢驗），但最終卻因倚賴肉體的觸覺與衣服的氣味而受騙相信了謊言——以撒親口說：「聲音是雅各的聲音，手卻是以掃的手（הַקֹּל\
  \ קוֹל יַעֲקֹב וְהַיָּדַיִם יְדֵי עֵשָׂו）」（22節）。KC 在此提出警惕：信徒在生活中有時可能「說話像屬神的人，行事卻完全順從世俗的方法」。雅各甚至用神的名來掩飾謊言，聲稱「耶和華你的神使我遇見好機會得著的」——以掃在信仰上向來冷淡，絕不會說出這樣的話，這虛偽的回答反而是極大的破綻。\n\
  \n以撒經過觸摸並親嘴確認後（וַיִּשַּׁק־ לוֹ，H5401A；[[親嘴]]在古代是親密關愛的標誌，[[猶大出賣耶穌|在此卻被雅各用來作為行騙的工具，預表日後親嘴成為背叛的記號]]），聞到衣服上的田野香氣（רֵיחַ\
  \ בְּגָדָיו，H7381、H899B），便開口為他祝福，說：「我兒的香氣如同耶和華賜福之田地的香氣一樣（כְּרֵיחַ שָׂדֶה אֲשֶׁר\
  \ בֵּרֲכוֹ יְהוָה）」。這份祝福包含了三個核心面向：\n\n| 面向 | 原文用語與內容（28-29節） | 實質內涵與解經意義 |\n|---|---|---|\n\
  | 物質豐盛 | `מִטַּל הַשָּׁמַיִם וּמִשְׁמַנֵּי הָאָרֶץ וְרֹב דָּגָן וְתִירֹשׁ`（H2919、H8064、H4924A、H776H、H1715、H8492）\
  \ | 天上的甘露、地上的肥土、豐富的五穀與新酒，代表生存與生活資源的充裕。 |\n| 治權地位 | `יַעַבְדוּךָ עַמִּים וְיִשְׁתַּחֲווּ\
  \ לְךָ לְאֻמִּים הֱוֵה גְבִיר לְאַחֶיךָ`（H5647G、H5971A、H7812、H3816、H1933B、H1376、H251G）\
  \ | 萬民服事、列邦跪拜、立為弟兄的主，確立長子在家族與列國中的領導權。 |\n| 聖約保護 | `אֹרְרֶיךָ אָרוּר וּמְבָרֲכֶיךָ\
  \ בָּרוּךְ`（H779、H1288；[[祝福與咒詛]]） | 咒詛他的受咒詛、祝福他的蒙福，直接承接了亞伯拉罕之約的保護原則（創 12:3）。 |\n\
  \nGT 華爾頓《創世記背景註釋》對這份祝福的本質作了重要的學術界定：以撒此時所賜下的內容——肥沃的土地、治理兄弟與鄰國的權柄，以及祝福與咒詛的報應——「是古代族長祝福的標準元素，主要關乎維生與昌盛的基本條件」，這與神直接與族長所立的救贖聖約本身在層次上有所不同。華爾頓並指出第\
  \ 37 節的文法細節：以撒說「我已立他為主……並賜他……」，採用第一人稱表達，表明這份宣告是族長以父親的權柄行使的家庭產權與位階祝福。\n\n### 四、以掃的痛哭與次等祝福（30-40節）\n\
  \n雅各剛接受完祝福離開，以掃就打獵回來，滿心期待地做好美味獻給父親。以撒聽聞後「大大地戰兢」（וַיֶּחֱרַד יִצְחָק חֲרָדָה גְּדֹלָה\
  \ עַד־ מְאֹד，H2729、H2731、H1419A）——這震驚不僅是因為發現受騙，更是因以撒突然在神的光中醒悟過來，意識到自己先前的私意差點抵觸了神預定的旨意；因此以撒並未收回祝福，反而堅定地確認：「他也必蒙福（בָּרוּךְ\
  \ יִהְיֶה）」（33節），這份在震撼中的順服，正是希伯來書 11:20 所稱讚的以撒的信心。\n\n以掃得知真相後放聲痛哭（וַיִּצְעַק צְעָקָה\
  \ גְּדֹלָה וּמָרָה עַד־ מְאֹד，H6817、H6818、H1419A、H4751），苦苦哀求父親也為他祝福，但失去的屬靈長子名分已無法挽回（[[以掃輕看長子名分|來\
  \ 12:16-17]]）。以掃在怨恨中把所有責任推給雅各，說：「他名雅各豈不是正對嗎？因為他欺騙了我（וַיַּעְקְבֵנִי，H6117）兩次：他從前奪了我長子的名分（בְּכֹרָתִי，H1062），你看，他現在又奪了我應得的福分（בִּרְכָתִי，H1293）」（36節）。\n\
  \n關於口頭祝福為何不可撤銷，GT《聖經精讀本──創世記註解》引用族長時代的[[努斯泥板與家神像|努斯泥版]]考證指出：在古代近東社會，族長臨終前的口頭遺言與正式祝福具有絕對的法定約束力，受到社會與法庭的完全認可；以撒說「我還能為你做甚麼呢」，正反映出法律效力已經確立的客觀事實。GT\
  \ 華爾頓《創世記背景註釋》也指出，話語在古代社會具有不可逆轉的約束力，一旦正式宣講即產生實質效力。\n\n以撒在以掃的哀求下，給了他一個次等的預言性宣告（39-40節）。經文指出他的住處與生計將處於嚴峻的環境：\n\
  \n> 第39節：「地上的肥土（מִשְׁמַנֵּי הָאָרֶץ）與天上的甘露（וּמִטַּל הַשָּׁמַיִם מֵעָל）必為你的住處（或作：必遠離你的住處）。」\
  \  \n> 第40節：「你必倚靠刀劍度日（וְעַל־ חַרְבְּךָ תִחְיֶה），服事你的兄弟；到你強盛翻騰的時候（כַּאֲשֶׁר תָּרִיד），必從頸項上掙開他的軛（וּפָרַקְתָּ\
  \ עֻלּוֹ מֵעַל צַוָּארֶךָ）。」\n\n對於第 39 節的翻譯與理解，註釋家提出了不同的探討（[[以掃所得的是福還是禍]]）：\n- CT\
  \ 與 GT《創世記雷氏研讀本》指出介系詞 *min*（מִן）在此可作分離意（away from），直譯為「你的住處必遠離地上的肥土，遠離天上的甘露」，歷史上以東人所居住的西珥山區確實地勢崎嶇、遠不及迦南肥沃（瑪\
  \ 1:3）。\n- GT《啟導本聖經創世記註釋》則認為此處維持「地上的肥土必為你的住處」，但語氣是次等的安排，並預言他將倚靠刀劍度日（這在歷史上應驗於大衛征服以東，以及後來猶大王約蘭年間以東人的背叛獨立，王下\
  \ 8:20）。兩種解釋都確認了一點：以掃所得的產業完全無法與雅各承受的聖約相提並論。\n\n### 五、以掃的殺機與雅各逃亡（41-46節）\n\n[[以掃的怨恨|以掃因祝福被奪而深恨雅各]]（經文使用\
  \ וַיִּשְׂטֹם，H7852，指懷恨在心），暗自打算等父親去世居喪的日子滿了（יְמֵי אֵבֶל אָבִי，H3117G、H60、H1G），就要動手殺死弟弟——這顯露出該隱殺亞伯的兇殺心思（[[該隱殺亞伯]]；約壹\
  \ 3:12）。利百加得知消息後，急忙吩咐雅各[[雅各逃往哈蘭|逃往哈蘭]]（חֲרָן，H2771G）投奔她的哥哥拉班，原以為只要「住些日子」等以掃怒氣消退（עַד־\
  \ שׁוּב אַף־ אָחִיךָ，H7725、H639），豈知雅各在異鄉一去就是二十年，母子終生未再相見。\n\n第 45 節利百加說「為甚麼一日喪你們二人呢」，GT\
  \ 華爾頓《創世記背景註釋》指出這在古代文化中有兩種合理的解讀：其一是同時失去以撒（壽終）與雅各（被殺）；其二是雅各若被以掃所殺，依照古代近東的血仇制度，以掃也必遭報血仇者追討處死，因而使母親同時失去兩個兒子。利百加隨後藉著抱怨以掃所娶的[[赫人]]女子，成功說服以撒打發雅各前往巴旦亞蘭尋親娶妻，將逃亡化為一場帶著父親祝福的合法啟程。\n\
  \n> [!quote] KC\n> 利百加與雅各雖然透過人的心計得到了渴望的祝福，卻也失去了眼前溫暖的家庭生活。偷來的祝福帶來的是長達二十年的漂流與親人分離。然而令人敬畏的是，神竟然能超越人的軟弱與失敗，依然成全祂崇高的救贖計畫；這絲毫不減免人當負的道德責任，反而顯明神配得世人最深沉的敬畏與敬拜（[[神的旨意與人的詭詐]]）。\n\
  \n雅各前半生的歷程始於人的詭詐與抓取，但神的管教與塑造不斷在他生命中作工，直至晚年，聖經記載他生命的最高峰是在信心中俯伏「敬拜」（來 11:21）——這正是神在選民身上奇妙的恩典工作。"
