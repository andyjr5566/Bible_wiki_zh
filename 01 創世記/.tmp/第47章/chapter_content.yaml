organization: "本章有兩條線交織：**一邊是雅各一家在埃及安頓、生養眾多；一邊是埃及全國在饑荒中把一切交在法老手裡。**而全章收在一個老人扶著杖頭（或伏在床頭）敬拜的畫面上。\n\
  \n### 經文大綱\n\n1. **五個弟兄見法老，得住歌珊**（1-6節）\n2. **雅各見法老，兩次為他祝福**（7-10節）\n3. **約瑟按人口奉養父家**（11-12節）\n\
  4. **饑荒政策：銀子、牲畜、田地**（13-26節）\n5. **雅各的十七年與臨終的囑咐**（27-31節）\n\n### 一、「你們以何事為業？」（1-6節）\n\
  \n約瑟「**從他弟兄中挑出五個人來**」。為什麼是五個？各家的答案不同：CT 說他選的是外表體面且具有口才者，並補一句靈意——「五」這數字在聖經裏象徵「負責」；GT《聖經精讀本》從埃及那一頭看——**埃及人認為「五」在數字中最有意義，所以最喜歡這個數字**（參43:34；45:22）；KC\
  \ 說**「五」是責任的數字，是人所當作的**；BH 則說五在聖經數字象徵中可能表示恩典或恩寵。\n\n他們照約瑟先前的教導誠實回答：「**你僕人是牧羊的，連我們的祖宗也是牧羊的**」，並且說明「我們來到這地[[寄居身分|寄居]]」——STEP\
  \ 顯示第4節「寄居」原文使用動詞字根 גּוּר（H1481，Qal 不定詞建構形 לָגוּר בָּאָרֶץ בָּאנוּ，意為「作客旅／暫時居留」）。\n\
  \n> [!note] 「寄居」這兩個字，是他們的護照，也是他們的身分\n> GT 丁良才：**「寄居」顯明以色列人遲早要回到迦南；他們在埃及只不過是客旅。**KC：**他們無意在那裡定居，因為他們真正的居所在迦南；他們只想在饑荒持續期間留在埃及。**GT《聖經精讀本》指出希伯來語「寄居」一詞就是「暫時居住」的意思（12:10；20:1；35:27），並說這種意識**成了日後出埃及事件的背景**。BH\
  \ 則把它連到來11:13 與詩39:12 的客旅主題。\n>\n> 精讀本另記下這段「暫住」實際上有多長：儘管約瑟的兄弟們希望只住到饑荒結束（4節），神卻按照創15:13-16\
  \ 的預言，把居住期限延長到四百三十年（出12:40；加3:17），直到迦南地罪惡滿盈為止。\n\n法老不但准了，還說：「你若知道他們中間有什麼**能人**，就派他們看管我的牲畜。」CT\
  \ 與 GT《串珠聖經註釋》都指「能人」是善於牧養牲畜的人，串珠並指出法老願意委派他們出任官職。KC 由此看見一個屬靈的次序：**弟兄們所求的（住歌珊），正是法老已經應許給約瑟的。神也是這樣——藉著我們的禱告，把祂在旨意中早已定意要給我們的，賜給我們。**GT《聖經精讀本》則從政治面讀：**法老爽快地把如此重要的邊境要地讓給異國人，可以看出他對約瑟的絕對信任，以及約瑟不可忽略的影響力。**\n\
  \n### 二、逃荒的老人，為天下最有權勢的人祝福（7-10節）\n\n「約瑟領他父親雅各進到法老面前，**雅各就給法老祝福**。」——而且**一見面就祝福，離開前再祝福**（7、10節；STEP\
  \ 顯示兩次「祝福」均使用動詞字根 בָּרַךְ，H1288，Piel 連續未完成式 וַיְבָרֶךְ，context gloss 為 \"he blessed\"\
  ）。\n\n> [!quote] 從來位分大的給位分小的祝福\n> CT：**「雅各雖然是宰相的父親，總比法老小一點。並且雅各又是一個逃荒的人，他到法老的地方來，還得靠法老得糧食……但是在這裡我們看見，雅各在法老面前並不失去他的地位；他知道在屬世方面法老的位分是大的，但在屬靈方面法老的位分卻是小的，所以他能替法老祝福。這是他站住屬靈的地位。」**（來7:7：「從來位分大的給位分小的祝福。」）\n\
  >\n> KC：**約瑟並不以他年老、跛腳的父親為恥。這是給所有社會地位高過父母的年輕人的功課——雅各也許是個貧窮的白髮老人，但他在神裡面是富足的。**KC 又補一個新約的對照：**保羅這個囚犯站在非斯都面前，向亞基帕王說話時，也是這樣**（徒26:29）。\n\
  >\n> GT《聖經精讀本》說明雅各憑什麼能祝福：**舊約時期，族長的祝福權是根據神和亞伯拉罕之間的生死之約（12:3）；族長也肩負家庭的祭司，能以神的祭司身份為他人祝福。**它並指出雅各所祝的內容——對法老的善意充滿感恩，祝福他個人的平安與繁榮。丁良才則說得樸素：雅各年紀老邁，又是神的僕人，所以為法老禱告。\n\
  >\n> CT 還看出雅各一生的翻轉：**「雅各從前想盡辦法求取別人的祝福（27:19），如今卻是為別人祝福。靈命幼稚的人，只想從別人有所得；靈命成熟的人，卻想讓別人有所得。」**\n\
  \n「我[[寄居身分|寄居在世]]的年日是一百三十歲，我平生的年日**又少又苦**，不及我列祖在世寄居的年日。」——STEP 顯示「寄居」使用名詞 מְגוּרַי（字根\
  \ מָגוֹר H4033，sojourn / temporary dwelling），「又少又苦」原文為 מְעַט וְרָעִים（形容詞 מְעַט\
  \ H4592「少」搭配 רַע H7451「困苦／艱難」）。\n\n| | 年歲 |\n|---|---|\n| 亞伯拉罕 | 175 歲 |\n| 以撒 |\
  \ 180 歲 |\n| 雅各 | 147 歲（見法老時 130 歲） |\n\n「又苦」——GT 丁良才數了九樣：**以掃的怨恨、拉班的欺哄、底拿被辱、拉結去世、流便不孝、約瑟被害、猶大行淫、西緬被囚、幼子（便雅憫）離家。**KC\
  \ 指出另一面：**他的年日之所以「又少又苦」，是因為他沒有接受耶和華的引導，總是走自己的路；他不信靠神，以為必須自己想辦法去得著神所應許的。**GT《聖經精讀本》的讀法又不同：這些歲月在神的護理下**成為養育子女、試煉、成聖的過程，為使他單單信靠神**，他終於活出得勝的生命，平安歸到列祖那裡（49:33）。\n\
  \n### 三、銀子、牲畜、田地（13-26節）\n\n饑荒政策是分三步、跨兩年的。GT《聖經精讀本》先澄清一個容易讀錯的地方：第18節的「第二年」不是指饑荒的第二年，而是**用牲畜交換糧食的第二年，即饑荒的最後一年（第七年）**；連種子都找不到，可見當時饑荒的嚴重性。\n\
  \n```mermaid\nflowchart TD\n  A[\"饑荒甚大，全地絕糧（13節）\"] --> B[\"第一步：銀子——埃及與迦南的銀子盡歸法老的宮（14-15節）\"\
  ]\n  B --> C[\"百姓：我們的銀子都用盡了（15節）\"]\n  C --> D[\"第二步：牲畜——牛、羊、驢、馬換糧一年（16-17節）\"]\n\
  \  D --> E[\"第二年：除身體與田地一無所剩（18節）\"]\n  E --> F[\"第三步（百姓自己提出）：求你用糧食買我們和我們的地（19節）\"\
  ]\n  F --> G[\"田地盡歸法老，百姓各歸各城（20-21節）\"]\n  G --> H[\"惟有祭司的地不買，因有法老的常俸（22節）\"]\n\
  \  F --> I[\"約瑟給種子，定下五分之一納王的常例（23-26節）\"]\n```\n\n| 階段 | 百姓交出 | 經文 |\n|---|---|---|\n\
  | 一 | **銀子**（糴糧的銀子盡歸法老的宮） | 14-15節 |\n| 二 | **牲畜**（牛、羊、驢、馬） | 16-17節 |\n| 三 | **身體與田地**（並求種子）\
  \ | 18-20節 |\n\n**第三步是百姓自己提出來的**——CT：**「注意這種出賣土地和勞力的辦法，並非出於約瑟的要求，而是出於埃及百姓自動的提議。」**GT《聖經精讀本》補上動機：歷盡饑荒苦難的百姓，除了維持生命，根本顧不得考慮身體和田地，他們**自願成為法老的僕人——佃農**。\n\
  \n約瑟隨即：**[[約瑟的饑荒土地政策|為法老買了埃及所有的地]]**、叫百姓[[各歸各城或使民為奴|都各歸各城]]、給他們種子，並定下**收成[[約瑟的饑荒土地政策|五分之一納給法老]]、四分歸自己**的常例。\n\
  \n> [!note] 第21節到底說了什麼\n> 「都各歸各城」這句話另有一種讀法。STEP 顯示馬所拉文本（MT）作 וְאֶת־הָעָם הֶעֱבִיר\
  \ אֹתוֹ לֶעָרִים（動詞 עָבַר H5674，Hiphil 完成式，字面直譯「他將百姓遷移到各城」）；CT 記下：**「根據《七十士譯本》，『都各歸各城』這句話另譯成『使各人都成為奴隸』」**（LXX\
  \ 作 κατεδουλώσατο αὐτῷ εἰς παῖδας）；呂振中譯本正文即作「約瑟就叫他們做奴隸」。\n>\n> 讀成遷徙的一方講行政效率：CT 說這是把人民從鄉下乾旱的田園遷徙到鄰近囤糧的城市、候命分配田地為法老耕種，「不失為明智的辦法」；GT\
  \ 丁良才說「大概是預備領糧」（41:35、45）；GT《聖經精讀本》指「各城」就是當年大豐收時儲存糧食的地方（41:48），並直接判定七十士譯本與武加大譯本的理解**「是不正確的」**。\n\
  >\n> 讀成為奴的一方從上下文推：GT《啟導本聖經創世記註釋》說「也有人考證『各歸各城』應譯為『成為農奴』，因為田地與牲畜都賣給了法老，後來連身體也賣了（23節），百姓都成為奴隸，故25節法老的『僕人』應作『奴僕』」；GT《串珠聖經註釋》兩讀並列。BH\
  \ 所據的英文譯本正文採後者，但限定程度：這是契約性的僕役而非奴隸制，百姓仍保有若干權利，並且能夠耕種土地。\n\n> [!note] 這是善政還是暴政？\n\
  > 來源多半持正面評價：GT《串珠聖經註釋》：**「五分之一是極低的稅收；上古中東的人借錢時通常要付出百分之五十的利息。」**GT《聖經精讀本》：**「應該說約瑟施行的制度是善政、決不是暴政」**——理由是與各國稅制相比交納五分之一決非殘酷，且古時經濟上無自立能力的人往往自願為僕，這種主僕關係「不是剝削者和被剝削者的關係，而是以順從為條件的保護者和被保護者的關係」。GT《舊約背景註釋》的口氣比較保留：**「百分之二十的稅額在古代世界並不反常。然而現時有關埃及稅收的資料，並不足以為約瑟所提出的賦稅，作出更具體的描繪。」**經文自己給的評價，是從百姓口中說出來的：「你救了我們的性命」（STEP\
  \ 顯示使用動詞字根 חָיָה H2421，Hiphil 完成式 הֶחֱיִתָנוּ，context gloss 為 \"you have preserved\
  \ us alive / you saved our lives\"）。\n>\n> 經文同時記載了另一面：土地與勞役由此集中在王權之下（20-21、23、25節）。BH\
  \ 就第14 節指出，這種財富與權力向法老集中的趨勢，日後將成為以色列人受奴役的背景。\n>\n> KC 從中讀出一個豫表：**約瑟用他為主的地位，把一切完全歸服法老——先是銀子，再是牲畜，最後是人和地。主耶穌也要照樣使萬有服在神以下**（林前15:24-28）；**而祂是用重價買了這一切**（啟5:9）。\n\
  \n**惟有祭司的地，約瑟沒有買**——因為祭司有從法老所得的常俸。GT《聖經精讀本》說明「常俸」指從國庫中支付的一定數量的物品，在古埃及祭政一致的社會中，這是給予統治階層祭司的特權；在嚴酷的饑荒中，負責供奉太陽神「銳」（Ra）和其他神的祭司們**是唯一能安逸生活的階層**。GT《舊約背景註釋》並提出一個對照：埃及祭司「往往集中了頗大的政治勢力……不少法老都覺得有逢迎他們的必要」，**「反觀以色列的制度，則不容許利未支派擁有地業。」**KC\
  \ 也在這裡看見一幅圖畫：**有一班人不在這被買的範圍之內——祭司。這叫我們想起今日的信徒：我們是祭司**（彼前2:5）；**當萬有都服在主之下時，教會卻不在其中——教會是要與祂一同作王的**（弗1:22-23）。\n\
  \n### 四、十七年（27-31節）\n\n「以色列人住在埃及的歌珊地，他們在那裡**置了產業，並且[[亞伯拉罕之約|生育甚多]]**」——STEP 可確認\
  \ 47:27 以 וַיִּפְרוּ וַיִּרְבּוּ מְאֹד 描寫以色列人在埃及「生養、增多，極其繁盛」，核心動詞為 פָּרָה（H6509）與\
  \ רָבָה（H7235A）；GT 丁良才指這正應驗了46:3 的話（並見出1:7）；GT《聖經精讀本》把兩個應許一起算進來：這**既成就了十七年前雅各移居埃及時的應許（46:3），也成就了二百五十多年前亞伯拉罕移居迦南時的應許（12:2）**。（CT\
  \ 也留下一句警語：**以色列人樂不思蜀，在埃及置產落戶，以致後來被埃及人忌恨**，出1:8-10。）\n\n「雅各住在埃及地**十七年**」——CT 注意到一個對稱：**「十七年」正是約瑟被賣時的歲數**（37:2）。\n\
  \n> [!quote] 他的結局比他的祖宗更美\n> KC 的觀察是：**在信心的道路上，雅各不及亞伯拉罕和以撒；但他的結局卻更美。我們沒有亞伯拉罕或以撒臨終的記載，卻讀到雅各臨終極其詳盡的記載——這正是要顯明：神的恩典最終如何在這個人身上得勝。這是神那忍耐的管教工作的高峰。**\n\
  \n臨終時他叫約瑟「[[大腿底下起誓|把手放在我大腿底下]]」起誓——STEP 顯示原文為 שִׂים־נָא יָדְךָ תַּחַת יְרֵכִי（動詞\
  \ שִׂים H7760 搭配 יָד H3027 與 יָרֵךְ H3409），並要求「用慈愛和誠實待我」——STEP 可確認原文使用 חֶסֶד וֶאֱמֶת（H2617＋H571），基本義域為慈愛／恩惠與信實／真誠；相關註釋進一步將這組用語放在立約忠誠與信實的脈絡理解；這是亞伯拉罕當年叫老僕人起誓的方式（24:2），CT\
  \ 說**手所觸近生殖之處，意味著若違背誓言，就要遭受絕後的報應**；GT《聖經精讀本》說這是古代常用的作法，**象徵誓約的嚴肅和神聖**。\n\n> [!note]\
  \ 他不在乎吃什麼穿什麼，卻極在乎葬在哪裡\n> CT：**「雅各在埃及地沒有注意吃什麼、穿什麼……但是，他對於自己死後該葬在什麼地方這一個問題並沒有放鬆，因為這一個問題與神應許的地和國發生關係。」**GT\
  \ 丁良才數出兩個理由：**①他相信他的後裔必得迦南地為業；②他要使他的子孫知道——埃及不是他們常住的地方。**KC 更把它連到復活：**他要葬在那地，是著眼於復活，以及神就那應許之地所起的一切誓**（參太22:31-32：「神不是死人的神，乃是活人的神」）。\n\
  >\n> 「[[麥比拉洞|葬在他們所葬的地方]]」指的是迦南地希伯崙的麥比拉洞（23:19；25:8-9；35:27-29）。GT《舊約背景註釋》說明這種安排的社會意義：**家塚一旦設立，就有了每個人都要與全體家人同葬的傳統；這樣做不但構成代與代之間的聯繫，更進一步加強家族對墳墓所在地所有權的證據。**\n\
  \n末了一句：「於是以色列在[[床頭或杖頭|床頭上【或作扶著杖頭】]]敬拜神」——STEP 顯示馬所拉文本（MT）作 וַיִּשְׁתַּחוּ יִשְׂרָאֵל\
  \ עַל־רֹאשׁ הַמִּטָּה（名詞 מִטָּה H4296「床」）；在未加母音標點的古代希伯來文子音串 המטה 中，亦可讀作 מַטֶּה（H4294「杖」），七十士譯本（LXX）與希伯來書\
  \ 11:21 即採後者讀法。\n\n> [!quote] 床頭，還是杖頭？\n> GT 李道生《舊約聖經問題總解》把來由說得最細：**古代的希伯來文還沒有今日作母音的標點，「床」字音是\
  \ Mittah，「杖」字音是 Matteh，都是同一個字根，因此七十士譯本就譯為「杖」字。**馬所拉文本讀作「床」；希伯來書11:21 引用的正是七十士譯本的「杖」。GT《串珠聖經註釋》：**「在床頭」描寫這個體弱的老人家不能從床上起來跪地敬拜，只有伏在床頭禱告神。**GT《聖經精讀本》認為兩者**意義相同**。\n\
  >\n> KC 從「杖」讀出雅各一生的縮影：**在毘努伊勒，神摸了他的大腿窩，從此他瘸腿而行（32:25、31）；那根杖，是他起初不肯接受、後來卻不可或缺的扶持。如今他承認：神一直是他的扶持——於是他敬拜。**CT\
  \ 同聲：**「杖」的含意：一生在地上奔波，乃是作客旅；一生受神的帶領，是蒙神憐憫的記號（32:10）。所以這句話的意思乃是對神說：你在我身上和我一生的路上所作的，沒有一件不是最好的，所以我要敬拜你。**\n\
  >\n> KC 的結語：**他的死，以敬拜神、並把祝福分給後裔為標記。還能想像比這更好的結局嗎？**\n\n### 關鍵神學點\n\n1. **[[寄居身分]]**：「寄居」是雅各家在法老面前的自我介紹，也是雅各對自己一生的總結——他們在埃及蒙保全，盼望卻始終連於應許之地。\n\
  2. **神的護理**：饑荒之中，全地餓昏，雅各全家卻按人口得奉養；同一場饑荒，成了選民保全與繁衍的搖籃。\n3. **[[約瑟的饑荒土地政策]]**：百姓說「你救了我們的性命」，經文同時記下土地與勞役集中於王權。\n\
  4. **[[大腿底下起誓]]／[[床頭或杖頭]]**：老雅各最在意的不是餘生，而是歸葬何處；他的最後一個動作，是敬拜。\n\n### 背景補充：蘭塞境內、以貨易貨與債奴制\n\
  \nGT《舊約背景註釋》為本章的埃及土地政策提供了完整的制度框架。\n\n**[[蘭塞|蘭塞境內的地]]**：背景註釋說本節表示「蘭塞境內的地」就是歌珊地；這個位於尼羅河三角洲東北部的地區據悉其居民是閃族人，並且在主前十八至十六世紀是許克所斯活動的中心，此地又稱泰尼斯地區，希伯來奴隸日後在此建築積貨城比東和蘭塞（出1:11）。至於名字本身，CT\
  \ 說「蘭塞」乃摩西時代的歌珊地名，係因數百年後統治埃及的法老蘭塞二世（主前1290-1224）而得名；GT《創世記雷氏研讀本》說這名字出現在這裏「目的是讓讀者知道所談及的是那個地區」；背景註釋則稱它「可能是今名古用的案例」。GT《啟導本聖經創世記註釋》另記蘭塞又叫「瑣安田」（詩78:12）。\n\
  \n**以貨易貨**：貨物貿易遠古之時已經存在，互惠地交換財產、貨物、製品「是古代非貨幣經濟的基礎」；本段所述的正是饑荒時以牲口換取穀糧。第16至17節不是約瑟的發明，而是既有經濟形態在極端情況下的運作。\n\
  \n**土地充公與債奴**：背景註釋說明政府本就可以因欠債不還、未能繳稅，或家庭沒有後嗣而將土地充公；饑荒時埃及人無力購買糧食，只得將土地售與政府、成為法老的佃農。它並把這件事放進更大的制度裡：債奴在古代近東到處都很常見，失去土地的農人賣身為短期奴隸來供養一家，為奴的期限可以是一日（出22:26-27），也可以是幾年；「在以色列，債奴最多只能為奴六年」（出21:2），然而本章的埃及例證顯示他們是終身作為法老佃農，以收成的五分之一作為田賦。\n\
  \nGT《聖經精讀本》另記下這套制度在後世的痕跡：約瑟制定的埃及土地法，**後被兩位歷史學家希羅多德（B.C.484-425）和提歐多路斯（B.C.1世紀末）證明**，其架構是除祭司擁有的土地外全歸國家管理，佃農身份的百姓在耕種國家土地時須交納所產的五分之一作為稅金；雖然後代有許多補充，主體未變。第27節平靜地並記兩件事：埃及人賣了地作佃農，而以色列人在歌珊地「置了產業，並且生育甚多」。"
