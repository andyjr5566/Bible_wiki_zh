- title: 饒恕與和好
  path: link_folder/神學/饒恕與和好.md
  summary: 哥哥們見父親死了，怕約瑟報復，打發人去求饒恕，又親自俯伏說「我們是你的僕人」；約瑟哭了，對他們說「不要害怕」，並承諾「我必養活你們，和你們的婦人、孩子」，用親愛的話安慰他們（15-21節）。
  relation: GT 丁良才指出這件事的癥結：哥哥們是「按著自己的心議論約瑟，以為約瑟和他們的性情一樣」；他並算出時間差——早十七年，約瑟已經饒恕了他們（45:1-15），「約瑟就哭了」是因為他們還疑惑他。KC 把這一幕轉向讀者：我們知道主耶穌在十字架上為我們擔當了神的審判，也經歷過祂的看顧，然而一遇難處，就顯出我們何等不真信靠祂。GT《聖經精讀本》則把它讀成收尾：這是兄弟們對多坍事件的真實悔改，也是對創45:15 那次和解的重新確認。
