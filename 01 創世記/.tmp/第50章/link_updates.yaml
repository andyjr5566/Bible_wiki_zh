- title: 麥比拉洞
  path: link_folder/地點/麥比拉洞.md
  summary: 「把他搬到迦南地，葬在幔利前，麥比拉田間的洞裡；那洞和田，是亞伯拉罕向赫人以弗崙買來為業作墳地的」（13節）。
  relation: CT 指這正是雅各在49:29-32 所囑咐的，而麥比拉洞的典故見創23章。GT《靈修版聖經註釋》說明這個選擇的份量：亞伯拉罕為埋葬撒拉買下這洞，那塊地成為整個家族的墓地；雅各的兒子們把父親送回葬在亞伯拉罕和以撒旁邊，「顯示他們對神的應許充滿信心，相信祂必把迦南地賜給他們的後代為業」。BH 補一句制度上的意義：這是族長在迦南少數幾筆有法律效力的土地持有之一，是對應許地的實體憑據。
