- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 雅各的遺體被搬到迦南地，葬在幔利前、麥比拉田間的洞裡（13節）；約瑟臨終說神必領他們從這地上去，到祂起誓所應許給亞伯拉罕、以撒、雅各之地（24節）。
  relation: GT《聖經精讀本》讀出這場出殯的意義：行列走向祖父亞伯拉罕和父親以撒所葬之地，一面預示四百年後的出埃及事件，一面是對迦南應許的信仰告白——「這等於神已在迦南地蓋了印，為以色列民族所有」，而對雅各個人而言，別是巴之約（46:4）到此完全成就。GT《靈修版聖經註釋》同說：他們要葬在這個洞裡的心願，顯示他們對神的應許充滿信心。
