- title: 神的主權與人的責任
  path: link_folder/神學/神的主權與人的責任.md
  summary: 「從前你們的意思是要害我，但神的意思原是好的，要保全許多人的性命，成就今日的光景」（20節）——同一件事，兩個「意思」並列。
  relation: 經文本身把人的惡意與神的善意並排說出來，兩面都沒有被取消。KC 指出約瑟不報復的根據：他不在神的地位上，事情的走向不是他定的，是神定的；若有什麼要追討，他交給神（羅12:19）。CT 同說「我豈能代替神呢」的意思是不能不顧神的意思而隨心所欲地審判並刑罰人；而在約瑟看來，哥哥們從前所得罪的不是他，乃是神。
