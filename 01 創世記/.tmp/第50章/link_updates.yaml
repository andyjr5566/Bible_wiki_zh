- title: 亞伯拉罕之約
  path: link_folder/神學/亞伯拉罕之約.md
  summary: 約瑟臨終說：「我要死了，但神必定看顧你們，領你們從這地上去，到他起誓所應許給亞伯拉罕、以撒、雅各之地」（24節）。
  relation: GT《聖經精讀本》指出以色列三大族長在此代表選民與神立約，日後百姓正是根據這份應許祈求神的憐憫（出32:13；申9:27），神也因著這份應許保守他們（利26:42），而這約的核心是基督（12:3；22:17-18；26:4；28:14）。GT《創世記雷氏研讀本》說「看顧你們」的意思是「為了你們而插手幹預」——約瑟相信他的子孫最終會遷回迦南地，而他們也照著做了（出13:19；書24:32）。BH 則指這句話預告了出埃及，也是亞伯拉罕之約中「土地」那一項的延續。
