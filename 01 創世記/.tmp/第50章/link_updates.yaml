- title: 埃及
  path: link_folder/地點/埃及.md
  summary: 埃及人為雅各哀哭七十天，並派出法老的臣僕、長老、車輛馬兵護送靈柩（3-9節）；約瑟和他父親的眷屬都住在埃及，他死後被薰了，收殮在棺材裡，停在埃及（22、26節）。
  relation: GT《舊約背景註釋》指薰屍是埃及人的常例，「然而本段是以色列人薰屍惟一的例子」；它並說明約瑟終年一百一十歲對埃及人來說是理想的年齡，而對木乃伊所作的檢驗證明埃及人的平均壽命是四十至五十歲，使用棺材或石棺也是埃及人而非以色列人的慣例。GT《啟導本聖經創世記註釋》為全卷作結：神所揀選的亞伯拉罕一族始於迦南而終於埃及，但約瑟像他的列祖一樣囑咐把骸骨運回去，「他的信心的旅程不過剛剛開始」。
