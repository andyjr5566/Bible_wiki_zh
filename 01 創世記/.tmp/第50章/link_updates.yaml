- title: 法老
  path: link_folder/人物/法老.md
  summary: 約瑟因守喪不便面見法老，託法老家中的人轉稟；法老說「你可以上去，照著你父親叫你起的誓，將他葬埋」（4-6節），並差臣僕與埃及國的長老同去送葬（7節）。
  relation: CT 說法老一口答應，「這乃是約瑟多年來言行合一所得來的信用」。GT《聖經精讀本》補上實務上的必要：從埃及到墓地約五百公里，需要越過國境，約瑟還要暫時離職，所以需要王的特許；他沒有直接見王，是因為在服喪期間穿的是喪服、沒有刮臉。BH 則指出王室臣僕與埃及長老全體參與，顯示這件事已超出家族範圍，成了國家層級的哀悼。
