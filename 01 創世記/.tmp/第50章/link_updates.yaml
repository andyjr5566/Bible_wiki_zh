- title: 悔改與良心的覺醒
  path: link_folder/神學/悔改與良心的覺醒.md
  summary: 「約瑟的哥哥們見父親死了，就說：或者約瑟懷恨我們，照著我們從前待他一切的惡足足地報復我們」（15節）；他們打發人去求饒恕，又親自俯伏說「我們是你的僕人」（16-18節）。
  relation: CT 說人犯罪後最大的痛苦乃是良心的控告，使人心存內疚、久久不能釋懷。GT《聖經精讀本》把他們記得的內容說出來：哥哥們扒下幼小約瑟的衣服、把他扔進土坑、又賣給商人，「始終沒有忘記約瑟淒涼的哀求聲」（42:21）——後來先知阿摩司指責欺壓懦弱者的人，說他們「卻不為約瑟的苦難擔憂」（摩6:6）；精讀本並指這一幕是他們對多坍事件的真實悔改，與約瑟的安慰寬恕一同使以色列十二支派成為一體。BH 注意到他們自己用「惡」這個字稱呼舊事，顯示他們認得那件事的道德份量。
  sources:
  - CT
  - GT
  - KC
  - BH
  source_files: *id001
