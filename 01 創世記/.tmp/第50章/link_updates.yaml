- title: 約瑟
  path: link_folder/人物/約瑟.md
  summary: 約瑟伏在父親面上哀哭，吩咐醫生用香料薰他（1-3節）；求得法老准許後扶柩歸葬麥比拉洞，又回埃及（4-14節）。哥哥們懼怕報復，他說「不要害怕，我豈能代替神呢」「從前你們的意思是要害我，但神的意思原是好的」，並承諾養活他們（15-21節）。他活到一百一十歲，臨終叫以色列的子孫起誓把他的骸骨搬上去（22-26節）。
  relation: KC 為這一章定調：在這裡看見的不是約瑟的地位和尊榮，而是他的品格與美德；它並數出這是約瑟第六次哭（1節）與第七次、也是最後一次哭（17節）——後者是因為他發覺弟兄們竟這樣回應他的愛。CT 指出第1節正應驗了神在別是巴對雅各的應許「約瑟必給你送終」（46:4）。KC 另注意到約瑟臨終時的處境：弟兄們住在全地最好的地方、蒙王完全的恩寵，沒有任何跡象顯示這極其優越的地位會改變，他說的卻是「神必定看顧你們」——他預見了受患難的日子，也預見神必拯救。
