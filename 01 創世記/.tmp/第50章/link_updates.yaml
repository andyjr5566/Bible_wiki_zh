- title: 神的護理
  path: link_folder/神學/神的護理.md
  summary: 約瑟對哥哥們說「從前你們的意思是要害我，但神的意思原是好的，要保全許多人的性命，成就今日的光景」（20節）；臨終又說「神必定看顧你們」（24-25節）。
  relation: CT：「人的意思無論是怎樣的壞，我們若能從神的角度來看整個事物，就會因著神的美意而得享安息。」GT《啟導本聖經創世記註釋》把約瑟的回答拆成三層：伸冤的事在神手中（19節；羅12:19）、從人的惡念可以看出神的美意（20節）、不但要寬恕還應用善來報惡（21節；路6:27）。GT《啟導本》並在末了指出，「神必定看顧」這句話「是自古迄今信靠神的人響徹雲霄的見證」。
