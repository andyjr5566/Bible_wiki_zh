- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  summary: 「瑪拿西的孫子瑪吉的兒子，也養在約瑟的膝上」（23節）。
  relation: CT 說「養在約瑟的膝上」有解經家認為是正式領養孫子的儀式，但也未嘗不是承歡膝下、含飴弄孫的景象；GT 丁良才與《串珠聖經註釋》都讀成前者——約瑟視瑪拿西的孫子如同自己的兒子，以一家之主的身分承認瑪吉的兒子是他的子孫。GT《啟導本聖經創世記註釋》補上瑪吉是誰：他是瑪拿西的長子，也是勇士基列人的祖先（書17:1）；BH 說瑪吉的後裔日後定居基列、約旦河東（民32:39-40）。
