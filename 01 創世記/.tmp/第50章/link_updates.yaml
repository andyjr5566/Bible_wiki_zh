- title: 雅各
  path: link_folder/人物/雅各.md
  summary: 雅各的遺體由醫生用香料薰了，薰屍的常例是四十天，埃及人為他哀哭了七十天（2-3節）；由法老的臣僕、宮廷貴戚、埃及國的長老與車輛馬兵護送，經亞達禾場哀哭七日，最後葬在麥比拉田間的洞裡（7-13節）。
  relation: CT 說約瑟薰屍的用意不是學埃及人的迷信，而是因為運屍到迦南需時，若不防腐便無法履行他向父親所起的誓。GT《啟導本聖經創世記註釋》從天數看規格：埃及定例為法老舉哀才七十二天，雅各得七十天，備極哀榮；GT《舊約背景註釋》另拆成薰屍四十日加傳統的三十日哀悼期（申34:8）。KC 讀出雅各自己的取捨：他被視為埃及的顯貴之一，若他或約瑟開口，必定會為他造一座金字塔，但他不求任何為自己立名的地方——他拒絕了埋葬在埃及所帶來的尊榮，選擇了迦南的一個洞穴。
