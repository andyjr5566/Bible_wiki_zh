- title: 約瑟骸骨葬於示劍
  path: link_folder/歷史/約瑟骸骨葬於示劍.md
  summary: 「約瑟叫以色列的子孫起誓，說：神必定看顧你們，你們要把我的骸骨從這裡搬上去」（25節）；他死後被薰了，收殮在棺材裡，停在埃及（26節）。
  relation: CT 指出後來以色列人在出埃及時遵著約瑟的心願，將他的骸骨一同帶去（出13:19），並葬在迦南地的示劍（書24:32）。KC 讀出他為什麼不要求立刻運回：他要他的骸骨留在百姓中間，因為他知道百姓有一天必上去；在那日子來到以前，這口棺材就作為見證與百姓同在——當他們受欺壓的日子來到，這位死了的約瑟仍要提醒他們他所說的話。KC 並說百姓在曠野把他的身體抬了四十年。GT《聖經精讀本》把時距補完：過了四百年，照他的遺願葬在迦南的示劍地。
