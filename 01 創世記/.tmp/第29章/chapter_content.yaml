organization: '本章記載雅各抵達巴旦亞蘭、為娶拉結服事拉班十四年，以及以色列十二支派前四位先祖誕生的歷史過程。全章貫穿著兩條平行的神聖主線：一方面是神藉著精明狡詐的舅父拉班，對雅各過去「欺騙抓取」的天然性格進行長達十四年的嚴格管教與雕琢；另一方面則是神超越的主權恩典，親自介入家庭的偏愛與紛爭，看顧失寵被冷落的利亞，並藉此奠定了以色列十二支派與救贖歷史的崇高基石。


  ### 一、水井旁的相會（1-14節）


  雅各順利抵達了[[東方人之地]]（אַרְצָה בְנֵי־ קֶדֶם，H776G、H1121G、H6924G），在田間的一口水井旁（בְּאֵר בַּשָּׂדֶה，H875、H7704G）遇見從[[哈蘭]]（חָרָן，H2771A）來的牧人，隨即與前來牧羊的表妹[[拉結]]（רָחֵל，H7354）相遇。解經家常將雅各此處的井旁相會，與創世記
  24 章亞伯拉罕老僕人以利以謝在井旁為以撒尋妻的事件作對照——同樣是在水井邊，神的引導與人的靈性光景呈現出鮮明的對比：


  | 對照面向 | 以利以謝為以撒求妻（創24章） | 雅各求妻的經歷（創29章） |

  |---|---|---|

  | 出發裝備 | 帶著主人豐盛的財寶、禮物與駱駝隊（創 24:10） | 隻身逃亡，兩手空空，只有手中一根行杖（創 32:10） |

  | 水井情境 | 井口敞開，利百加主動打水給僕人與駱駝喝 | 井口蓋著大石（וְהָאֶבֶן גְּדֹלָה עַל־ פִּי הַבְּאֵר），須眾牧人聚齊合力搬開
  |

  | 禱告生活 | 處處充滿謙卑的禱告、尋求與感恩稱頌（創 24:12, 26, 52） | 經文未記載一句祈求，主要展現個人的力量與急切 |

  | 事後結果 | 順利完成使命，即刻帶著新娘平安踏上歸途 | 在拉班手下寄居異鄉二十年，歷經苦工與磨練 |


  雅各一見到拉結和舅父拉班的羊群，便獨自上前把井口上的大石頭輥開（וַיָּגָל אֶת־ הָאֶבֶן，H1556），打水給拉結的羊群喝，顯露出過人的體力與熟練的牧羊身手——這是神暗中與他同行的恩典記號（KC：神一路與他同在，引導他的腳步，儘管他當時在靈裡還未完全緊緊跟隨神）。雅各與拉結親嘴後放聲大哭（וַיִּשַּׁק
  יַעֲקֹב לְרָחֵל וַיִּשָּׂא אֶת־ קֹלוֹ וַיֵּבְךְּ，H5401A、H5375N、H6963A、H1058），傾吐了一路逃亡隱忍的所有辛酸與激動。拉班聽聞後熱情奔來迎接，承認雅各「實在是我的骨肉（עַצְמִי
  וּבְשָׂרִי אָתָּה，H6106、H1320）」。


  井口的大石頭具有深厚的文化與社會背景。GT 華爾頓《創世記背景註釋》指出這塊大石至少有四重功能：保護水源不受污染或毒害；作為社群公約的制約機制，防止個別牧人過度抽取有限水源；在無圍欄的水井旁防止人畜失足跌落；並在乾旱空曠的曠野中保護井位與維持水質。由於巴旦亞蘭一帶水源極為珍貴，牧人間約定必須等到所有羊群與牧人聚齊後才能合力開井飲羊（[[井權與牧羊取水規矩]]）。雅各不等眾人聚齊便獨自搬開巨石，不僅展現了他卓越的體能，也顯露出他看見拉結時難以按捺的急切心情。


  華爾頓同時考證了其他生活細節：第 6 節記載拉結身為女子親自牧羊（רֹעָה הִוא，H7462G），在古代近東通常只出現在家中無成年男丁的家庭；這工作雖辛苦且需面對野外風險，卻也是家族女子參與生計與社交的途徑。第
  11 節雅各與拉結親嘴，是古代近東同族親友見面時標準的熱情問候禮儀，代表親族的接納與喜悅。


  > [!note] 認識神到伯特利，認識自己到哈蘭

  > 創世記敘事多次提及「石頭」：在伯特利是一塊作枕頭並立為聖殿記號的石頭（創 28:11, 18），在此處則是井口阻擋水源的巨石。CT 深刻指出：「人若要認識神，就必須到伯特利去；人若要認識自己的天然本相，就要到哈蘭去。」神特意安排了精明過人的拉班，成為磨練雅各性格、除去他天然詭詐的工具。


  ### 二、七年勞役與拉班的欺哄（15-30節）


  雅各深愛小表妹拉結，主動提議願意為她服事拉班七年作為娶妻的代價（「我願為你小女兒拉結服事你七年」אֶעֱבָדְךָ שֶׁבַע שָׁנִים בְּרָחֵל
  בִּתְּךָ הַקְּטַנָּה，H5647G、H7651、H8141、H1323G、H6996B；[[古代近東聘禮與七年勞役]]）。解經家指出，因雅各兩手空空逃亡異鄉，無法像以利以謝那樣拿出大批金銀財寶作為聘禮（聘金與禮物），只能以漫長的體力勞役代替聘金；然而因為他深愛拉結，看這七年「如同幾天」（וַיִּהְיוּ
  בְעֵינָיו כְּיָמִים אֲחָדִים בְּאַהֲבָתוֹ אֹתָהּ，H3117G、H259、H160）。


  GT 華爾頓《創世記背景註釋》提供了具體的歷史文獻數據：在古代努斯泥版與美索不達米亞法律中，一般新娘的聘禮約為三十至四十舍客勒銀子；而當時一名合格牧人的年薪約為十舍客勒銀子，因此雅各服事七年相當於付出了高達七十舍客勒的重價。雅各在缺乏談判籌碼的處境下甘願付出加倍代價，充分反映出他對拉結摯熱的情感。


  七年期滿後，拉班依俗擺設婚宴（מִשְׁתֶּה，H4960；[[古代近東婚筵七日]]），卻將大女兒[[利亞]]（לֵאָה，H3812）送入洞房。古代婚宴、新娘蒙臉以及夜間環境，都可能有助於理解雅各為何直到清晨才發現是利亞；部分背景資料也指出婚宴往往伴隨飲酒，但經文沒有直接說明雅各當晚是否醉酒。雅各直到次日天亮驚覺受騙，質問拉班：「你為甚麼欺騙我？（לָמָּה
  רַמִּיתָנִי，H7411B）」（[[雅各受管教與被欺哄]]）。多份研讀資料指出此處歷史的奇妙回響與對稱性：


  - 以撒當年因眼睛昏花在黑暗中被雅各冒充欺騙；如今雅各也在夜色與面紗的遮蔽下被拉班掉包瞞騙。

  - 雅各當年順從母親利百加的計策冒名頂替長子以掃；如今利亞也順從父親拉班的安排冒名頂替妹妹拉結。

  - 雅各當年以「次子」奪取了長子的名分與福分；如今拉班卻以「大女兒先嫁、小女兒在後」的當地規矩為由將他制伏。


  拉班要求雅各先為利亞滿了七天的婚宴禮期（מַלֵּא שְׁבֻעַ זֹאת，H4390、H7620），隨後便將拉結也給他為妻，條件是雅各必須再為拉結服事拉班另外七年。拉班分別將使女[[悉帕]]（זִלְפָּה，H2153）給了利亞，將使女[[辟拉]]（בִּלְהָה，H1090）給了拉結作為陪嫁妝奩（[[送婢女為嫁妝]]；古代近東婚姻習俗）。


  ### 三、「眼睛沒有神氣」的解經探討（v17）


  經文第 17 節對兩姊妹的外貌作了對比描寫：「利亞的眼睛沒有神氣（וְעֵינֵי לֵאָה רַכּוֹת，H5869A、H3812、H7390），拉結卻生得美貌俊秀（וְרָחֵל
  הָיְתָה יְפַת־ תֹּאַר וִיפַת מַרְאֶה，H3303、H8389、H3303、H4758）」。對於形容利亞眼睛的字詞（רַכּוֹת，原意為柔弱、嬌嫩），註釋家提出了不同的詮釋面向（[[利亞的眼睛沒有神氣]]）：


  - CT 與 GT《串珠聖經註釋》、《創世記雷氏研讀本》傾向理解為外貌上的欠缺或視力柔弱，指出古代近東以眼睛明亮有神為美貌首要標準，利亞的雙眼顯得缺乏光彩，在視覺吸引力上不及拉結。

  - GT 華爾頓《創世記背景註釋》與 GT《聖經精讀本──創世記註解》則指出，希伯來字（רַךְ）本質上是正面詞彙，帶有「溫柔、纖巧、清秀、含蓄」的意涵；利亞並非相貌醜陋，而是拉結在外表與體態上格外光彩照人，使溫婉的利亞在強烈對比下顯得平凡失色。

  - 經文先描述拉結容貌俊美，再敘述雅各愛她；丁良才等註釋據此提醒不可單憑外貌取人，神察看與揀選人的法則卻與世人完全不同（撒上 16:7）。


  ### 四、利亞失寵與四子命名的神學意義（31-35節）


  雅各愛拉結勝過愛利亞（וַיֶּאֱהַב גַּם־ אֶת־ רָחֵל מִלֵּאָה，H157G），但[[神看顧失寵者|耶和華看見利亞失寵]]（經文使用
  שְׂנוּאָה לֵאָה，H8130，指不受喜愛或被冷落），就憐憫她，使她能夠生育（וַיִּפְתַּח אֶת־ רַחְמָהּ，H6605、H7358），而受寵的拉結卻暫時不生育（וְרָחֵל
  עֲקָרָה，H6135）。


  利亞相繼生下四個兒子，每一位兒子的起名都記錄了她內心從痛苦渴求轉向專心讚美神的信仰轉變過程（[[利亞四子命名的神學意義]]）：


  | 兒子名稱 | 希伯來原文與字義 | 命名的經文語境與利亞的心聲 | 屬靈與救贖歷史意義 |

  |---|---|---|---|

  | [[流便]]（Reuben） | `רְאוּבֵן`（H7205）<br>字根意為「看哪，一個兒子」 | 「耶和華看見我的苦情（רָאָה יְהוָה
  בְּעָנְיִי，H7200G、H3068G、H6040），如今我的丈夫必愛我。」（[[「流便」名字含義]]） | 確信神察看受壓迫與被冷落者的苦難，神是有恩典的監察者。
  |

  | [[西緬]]（Simeon） | `שִׁמְעוֹן`（H8095）<br>字根源於 `שָׁמַע`（聽見，H8085G） | 「耶和華聽見我失寵（שָׁמַע
  יְהוָה כִּי־ שְׂנוּאָה אָנֹכִי，H8085G、H8130），所以又賜給我這個兒子。」（[[「西緬」名字含義]]） | 確信禱告蒙神垂聽，在家庭的孤寂中神親自成為依靠。
  |

  | [[利未]]（Levi） | `לֵוִי`（H3878）<br>字根源於 `לָוָה`（聯合、連結，H3867） | 「我給丈夫生了三個兒子，他如今必與我聯合（יִלָּוֶה
  אִישִׁי אֵלַי）。」（[[「利未」名字含義]]） | 渴望夫妻關係的深層連結；利未後裔日後成為專事事奉神的祭司支派。 |

  | [[猶大（雅各之子）]]（Judah） | `יְהוּדָה`（H3063）<br>字根源於 `יָדָה`（稱謝、讚美，H3034B） | 「這回我要讚美耶和華（הַפַּעַם
  אוֹדֶה אֶת־ יְהוָה，H6471、H3034B、H3068G）。」隨後暫停了生育。（[[「猶大」名字含義]]） | 焦點從渴求丈夫的愛完全轉向仰望與讚美神；基督肉身的家系正出自猶大支派。
  |


  利亞的經歷深刻表明：世人的冷落無法攔阻神豐富的恩惠。利亞從起初將眼光定睛在丈夫身上、渴望藉著生育爭取人的肯定（流便、西緬、利未），最終被神提升到單單讚美耶和華的崇高境界（猶大）。神更將以色列最重要的兩大職分——執掌聖所祭司職分的利未支派，以及承受君王寶座與彌賽亞應許的猶大支派（太
  1:2-3）——賜給了這位在人眼中失寵的利亞，顯明神的揀選完全是本於主權與恩典（KC/CT/GT）。'
