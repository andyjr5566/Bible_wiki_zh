- title: 哈蘭
  path: link_folder/地點/哈蘭.md
  summary: 雅各在東方人之地遇見從哈蘭來的牧人，並藉此確認拉班及拉結所在的母族環境。
  relation: 哈蘭在本章不只是目的地名稱，也是雅各受拉班接納、服事與受磨練的背景區域。
