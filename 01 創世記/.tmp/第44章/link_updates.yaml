- title: 家宰（約瑟的管家）
  path: link_folder/人物/家宰（約瑟的管家）.md
  summary: "本章的每一步都由家宰執行：約瑟吩咐他把糧食裝滿口袋、把各人的銀子放回、又把自己的銀杯和便雅憫糴糧的銀子一同裝在便雅憫口袋裡（1-2節）；天一亮打發他們走後，又差他追上去質問「你們為什麼以惡報善呢」（4-6節）；他當場把處分從眾兄弟提出的「就叫他死，我們也作我主的奴僕」改成「在誰那裡搜出來，誰就作我的奴僕；其餘的都沒有罪」（9-10節），並「從年長的起，到年幼的為止」逐一搜查（12節）。"
  relation: "CT 由第3節推出他動手的時間：他是在夜間趁眾人睡夢中把銀子和銀杯放進口袋，一大早就打發他們走，使他們沒有機會查看；GT《聖經精讀本》則說他明知杯在便雅憫袋中，卻故意從老大搜起，「為了不使計畫被對方看穿」——CT 說這也消除了他們可能認為他栽贓的疑慮。第10節那句改口尤其關鍵：CT 指出受罰程度比兄弟們自請的輕得多，因為搜杯的目的不在懲罰，而在試驗他們的存心。KC 把這位管家讀作聖靈的圖畫——他照約瑟所說的一切去行，追上他們並「查出」那杯，使他們再無藉口可推。"
