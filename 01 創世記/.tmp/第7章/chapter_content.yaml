organization: '### 神命挪亞全家進方舟（1-4節）


  STEP 顯示，神以命令式 בֹּא（H935G，「進入／來」）吩咐挪亞，把「你」和「你全家」בֵּיתְךָ（H1004M，「你的家／家人」）一同帶進方舟；神也以
  צַדִּיק（H6662，「義的」）稱挪亞。CT把這稱為聖經中早期的救恩呼召，也從「你和你的全家」發展家庭救恩的靈訓；KC與BibleHub同樣把方舟中的一家看作神保存家庭的圖畫。這些是從挪亞一家蒙保存進一步發展的家庭救恩教導；本章直接敘述的則是神給挪亞一家這次特定的應許與命令。


  GT、KC等來源把創6:3的120年與造方舟、傳義道的時期相連，因而說第7章命令約在120年後正式發出。這是把兩章與彼後2:5「[[挪亞是傳義道者|傳義道者]]」連結起來的傳統讀法；創7本身的敘事焦點，是最後七天的命令、進舟與洪水正式來臨。


  第2節以 הַטְּהוֹרָה（H2889，「潔淨的」）和「不是潔淨的」區分畜類；潔淨畜類的 שִׁבְעָה שִׁבְעָה（H7651）直譯為「七、七」，不潔淨畜類則用雙數
  שְׁנַיִם（H8147，「兩個」）。因此「七七」可譯作七對，也有譯本理解為七隻，即三對加一隻。來源普遍把潔淨畜類較多的數量與創8:20的獻祭相連：第6章的[[每樣兩個與潔淨畜類七對|每樣兩個]]是一般保存原則，第7章再補充潔淨類別的特殊數量。GT背景註釋進一步把洪水前的潔淨區分理解為主要關乎獻祭；利未記則把這套分類發展為以色列的飲食規條。


  第4節的「再過七天」由 עוֹד（H5750，「尚有／再」）和 שִׁבְעָה（H7651，「七」）組成，第10節再以「到了那七天」交代期限完成。CT、GT與KC進一步把這[[七天的等候與最後寬限|七天]]看作審判前最後的寬限，也看作挪亞憑信等候的試驗；至於方舟外的人如何反應，則是註釋的講道想像。


  ### 遵命、等候與活物進方舟（5-10節）


  - 第5節以 וַיַּעַשׂ（H6213A，「他就行了」）和 צִוָּהוּ（H6680，「祂吩咐他」）直接描寫挪亞照耶和華一切命令而行。CT再以雅2:20、26說明信心落實為順服；來11:7也把挪亞的行動解作因信預備方舟。

  - 第9節以 בָּאוּ（H935G，「牠們來了」）描述各類動物「到挪亞那裡」。CT、GT與KC由此進一步理解為神主動引導活物，如同創2:19動物被帶到亞當面前。

  - CT以賽1:3作靈訓對照，說動物順服神的安排，人反而可能不認識主；這屬於由動物依序進舟所發展的講道應用。

  - CT也把洪水臨到挪亞六百歲與瑪土撒拉名字的傳統解釋相連，視為豫言應驗；這項關聯來自跨章命名解釋，本章直接提供的是挪亞六百歲與洪水來臨的時間資料。

  - KC以方舟外的人在最後七天繼續譏誚來重構講道場景，並連於彼後3:3-6的末世類比；第7章的敘事本身集中在挪亞遵命等候。


  ### 洪水爆發與精確日期（11-12節）


  挪亞六百歲二月十七日，[[大淵的泉源與天上的窗戶|大淵的泉源裂開，天上的窗戶敞開]]，大雨持續四十晝夜。STEP顯示「裂開」נִבְקְעוּ（H1234）和「敞開」נִפְתָּחוּ（H6605A）都是被動詞形；מַעְיְנֹת（H4599）是「泉源」，תְּהוֹם
  רַבָּה（H8415、H7227A）是「大淵」，וַאֲרֻבֹּת（H699）則是「而天上的窗戶／水閘」。GT《丁道爾聖經註釋》先為這個日期定性：「這裏準確的日期，顯然沒有象徵意味，可見是人所牢記的一項事實；這一點可由故事中進一步仔細記錄的日期，得到證實。」GT
  艾基斯《舊約聖經難題彙編》據此作文獻比較：世界各地都有洪水傳說（巴比倫的烏他拿比士、蘇美的古要特烏、希臘的丟加良、印度的馬奴等），「但在全部有關洪水的故事中，只有聖經記載在洪水開始後各樣事情發生的準確日子」；《吉加墨詠史詩》「也和大部份經過數百至一千年口傳下來的傳說一樣，沒有記載洪水發生於那一年」。艾基斯並比較兩隻船的形制——烏他拿比士的方舟是正方體，「不大合乎實際需要，亦不適合用於海上航行」，挪亞的方舟長寬深比例則「正是大洋船的理想體積」。這些是來源所作的文獻比較與護教論證。


  STEP在第12節另以 הַגֶּשֶׁם（H1653）稱實際降下的「雨」；註釋再把「大淵泉源」與「天上窗戶」放進古代世界的宇宙圖像，描寫上下水源同時開啟。BH把它讀成受造秩序逆轉，說天窗敞開「可以看作創世記1章分開諸水的逆轉，象徵因人的罪而回到混沌」。GT
  這邊給的是背景與修辭說明：《舊約背景註釋》指「天上窗戶」是「富有詩意」而「不是科學化的用語，而是反映觀察者的角度，正如我們也說太陽會『日落』一樣」，並考出這語詞在古代近東文學中「只在另一處地方出現」（迦南神話中巴力居所的「窗戶」，指雲中的裂縫，且與下雨無關）；《串珠聖經註釋》給希伯來宇宙觀的框架——「大氣層上面和地底下都各有一個廣大的儲水池」；《聖經精讀本》說「裂開了」是修辭手法，「描述當萬物的主宰把堵水用的塞子拔出時，宏大的水從四方同時湧出」。CT
  的文意註解則給兩種可能：「或指地下水湧上來，或指海床升高導致海水倒灌」，其後再以「大淵象徵陰府攻擊」作靈意解說。


  STEP以 אַרְבָּעִים（H705）標出「四十」，直接說明大雨持續四十日、四十夜。CT與BibleHub再從聖經中其他「[[四十的屬靈意義|四十]]」的段落，進一步討論試驗、審判與預備的屬靈意義。


  ### 全家進入與耶和華關門（13-16節）


  挪亞、妻子、閃、含、雅弗和三位兒婦共八人，與各類活物在洪水開始的同一天進入方舟。來11:7以此說明挪亞因信敬畏、預備方舟；彼前3:20則明說八口「藉著水得救」。


  第16節先說活物按「神」所吩咐的進入，繼而用 וַיִּסְגֹּר（H5462，「祂關上」）說「耶和華」在挪亞 בַּעֲדוֹ（H1157，「身後／為他」）關上。CT從稱謂交替進一步理解神的權柄與耶和華的關懷；丁道爾則從關門動作看見父親般的眷顧。


  CT也強調神預備救恩而人必須接受，並以「神關了，就沒有人能開」說明救恩的穩固。不同神學傳統會用自由意志、恩典或揀選等不同語彙說明人的回應；本章敘事的共同基礎是挪亞確實遵命進入，而門由[[耶和華把他關在方舟裡|耶和華親自關上]]。關門既使方舟內的人得保守，也標示方舟外再不能進入。


  > [!quote] GT（丁道爾）

  > 「耶和華就把他關在方舟裏頭」：這句話極美地流露出神如父親的輕撫——在審判即將展開的邊緣。這份關愛從頭至尾眷顧此事，也同樣將會執行我們的救恩，直到完全成就。


  ### 水勢高漲、死亡與存留（17-24節）


  第17至24節用一串動詞推進水勢：רָבָה（H7235A，「增多」）見於17、18節，גָּבַר（H1396，「增強／勝過」）見於18、19、20、24節，כָּסָה（H3680，「遮蓋」）則在19、20節描述高山被淹沒；方舟被水「托起」נָשָׂא（H5375H）並「升高」רוּם（H7311A）。水高過山嶺十五肘；GT《串珠聖經註釋》按一肘0.45公尺換算為高出約七公尺（廿三英尺）。GT《丁道爾聖經註釋》對這個數字提出一個重要限定：「十五肘深是指高過山嶺的尺度，不是全部的深度。或許，正如許多人建議的，這個衡量是從滿載的方舟吃水的深度（譬如，其全高三十肘的一半）估計而來；這麼深的水除去了一切的障礙。」《聖經精讀本》再由
  גָּבַר 的「變強／勝過」語感，描寫翻騰急水與暴風的動勢。KC 描寫人拍打方舟門、逃向高山的場面，用以表達審判臨到後為時已晚；這屬於生動的講道重構。


  第21至23節連續列舉飛鳥、牲畜、走獸、昆蟲與所有的人，並以 נִשְׁמַת（H5397，「氣息」）、רוּחַ（H7307H，「氣／氣息」）和 חַיִּים（H2416E，「生命」）界定旱地上死亡的生命。第23節先用主動式
  וַיִּמַח（H4229A，「祂除滅」），再用被動式 וַיִּמָּחוּ（同一 Strong，「牠們被除滅」），最後以 וַיִּשָּׁאֶר（H7604，「被留下／存留」）配合
  אַךְ（H389，「只有」）轉向挪亞和方舟中的生命。這一正一反構成[[洪水中的審判與拯救]]的核心；[[挪亞作為審判中蒙保守的預表|挪亞一家]]因此成為審判中蒙神保守的預表。CT、KC與BibleHub據此把方舟連於基督：審判的水使方舟浮起，方舟中的人因此經過審判而蒙保守。這是新約光照下的豫表性閱讀。


  彼前3:20-21又把八口藉水得救連於[[洪水與洗禮的豫表|洗禮]]，並把洗禮的救恩意義連於耶穌基督復活，不是肉體污穢的外在除掉。CT整理出「在基督裡勝過死亡、世界、肉體與罪惡」的四重靈訓，保存了該來源的教導架構；這四項不是創7逐項列出的象徵對照。


  STEP在第12節用 אַרְבָּעִים（H705，「四十」）說明降雨時間，第24節則以 חֲמִשִּׁים（H2572，「五十」）加 וּמְאַת（H3967，「和一百」）說水勢增強的日數。四十天是降雨持續時間，一百五十天是水勢浩大的期間，後者包括前四十天——GT
  丁良才說得最簡潔：「『共一百五十天』——就是五個月，12節的四十天也在其內」；《啟導本》《創世記雷氏研讀本》同此，《串珠聖經註釋》再細分為「首四十天內洪水從天上降落和從地底下氾濫，後一百一十天是洪水橫流或停留在地上的時期」。GT
  賈斯樂郝威《聖經難解經文詮釋手冊》｛命題23｝也把兩者分為「雨下了40天」和「洪水氾濫的時間」。CT再把150日應用為審判的嚴厲與周密。


  ### 洪水範圍與證據限度


  所收來源對洪水地理範圍並不一致：


  - **普世性讀法**：KC與BibleHub按「天下」「全地」「所有」及高山被淹沒的語句，主張洪水覆蓋全球。GT 這邊，《創世記雷氏研讀本》說「『天下』更佳的理解是在諸天之下。這短語指出那是一次全球性，而不是地區性的洪水」，並以創九11、15的應許與世界各地二百七十個洪水故事為佐證；《聖經精讀本》更直接反對局部說，理由是神與挪亞立約把保存餘種的範圍只限於挪亞一家，且七11「是關於整個地球的生動記錄」；艾基斯《舊約聖經難題彙編》則從物理推論——水面會拉平，若淹過亞拉臘山，海平面就得上漲一萬七千尺，因此「我們的結論必須是：洪水是普世性的」。

  - **地區性或未定論讀法**：CT明說「當時人心目中的『天下』，並不是現在我們所認識的全世界……洪水是否淹沒全球，我們不知道」，並把可確定的事限定為「除了挪亞一家八口以外，當時的全人類，以及地上和空中凡有血肉的生命（水族除外），全都滅絕了」。GT《丁道爾聖經註釋》立場更明確地留白：「這些經文本身不足以支援或反對洪水是否為局部性：甚至天下一詞，從這幾章的類比方式看來，很可能是按表面所見的形容語（在西一23，保羅用了類似的誇張語氣）。這故事所關心的，是記載人為他所處的整個世界所帶來的審判，不是要詳述地理。」GT《啟導本》同向：「聖經沒有講明洪水淹沒的範圍，『全地』、『天下』這些字眼的含義，可以只指當時所知的世界，象中國人所說的『四海』和『天下』。」


  STEP可直接確認第19節的「所有高山」「在所有諸天之下」，以及第21至23節反覆出現的「所有／每一」כֹּל（H3605）；אֶרֶץ（H776G）的簡要義域則包括「地、土地、國土、世界」。這些全稱語句描寫敘事中人類與旱地生命所受的全面審判；它們在現代地理上應按全球或人類所知世界理解，形成[[洪水範圍的爭論|解經爭議]]。GT引用全球約270種洪水傳說，也收錄地層、化石與快速沉積的護教論證；同一套GT資料在第6章所引《舊約背景註釋》則指出近東各城洪水層年代不一，方舟木片也未獲確證。這些資料適合用於比較與論證，其證據強度仍需按年代、範圍與因果關係逐項評估。


