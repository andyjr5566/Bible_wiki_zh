book: 創世記
chapter: 7
updates:
- title: 挪亞
  path: link_folder/人物/挪亞.md
  summary: 神以命令式 בֹּא（H935G，「進入」）吩咐挪亞帶全家進方舟；第5節再用 וַיַּעַשׂ（H6213A，「他就行了」）說明挪亞照一切吩咐而行。洪水臨到後，只有他和方舟中的生命存留。
  relation: STEP直接呈現挪亞進入、遵行與存留的敘事動詞；註釋與來11:7進一步把這一連串行動理解為信心、義與順服的果子。
- title: 閃
  path: link_folder/人物/閃.md
  summary: 閃與父親挪亞、母親、兄弟及三位妻子在洪水當日一同進入方舟。
  relation: 本章記閃在普世洪水中因屬挪亞之家而蒙保守，成為洪水後人類與應許家譜延續的一員。
- title: 含
  path: link_folder/人物/含.md
  summary: 含與挪亞一家在洪水開始時進入方舟，在方舟外旱地生命遭洪水除滅時蒙保守。
  relation: 第7章把含列入神所保存的八口之家，為第9至10章關於其家族的敘事留下背景。
- title: 雅弗
  path: link_folder/人物/雅弗.md
  summary: 雅弗與挪亞一家同入方舟，在洪水消滅地上一切有氣息之物時得以存留。
  relation: 本章確立雅弗是洪水後人類重新展開的祖先之一，其蒙保存完全出於神藉方舟所作的安排。
- title: 方舟的豫表
  path: link_folder/神學/方舟的豫表.md
  summary: 第7章延續使用 תֵּבָה（H8392，「方舟」）；水增多時把方舟「托起」נָשָׂא（H5375H），方舟便「升高」רוּם（H7311A），保存挪亞一家及按類帶入的活物。
  relation: STEP先呈現方舟在洪水中實際被托起的動作；來源再把方舟作為審判中的避難所，進一步連於人在基督裡蒙拯救。
- title: 義人與完全人
  path: link_folder/神學/義人與完全人.md
  summary: 耶和華以 צַדִּיק（H6662，單數陽性形容詞「義的」）稱挪亞，說「在這世代中，我見你在我面前是義人」，並命他和全家進入方舟。
  relation: STEP確認第7章再次使用第6章的「義」；註釋再把挪亞在神面前的義與實際遵命並列，描寫他在敗壞世代中因信而活的見證。
- title: 大淵的泉源與天上的窗戶
  path: link_folder/神學/大淵的泉源與天上的窗戶.md
  summary: 大淵泉源 מַעְיְנֹת תְּהוֹם רַבָּה「被裂開」，天上的窗戶 וַאֲרֻבֹּת הַשָּׁמַיִם「被敞開」，雨降四十晝夜。
  relation: STEP先確認上下水源與兩個被動動詞；BH、GT與CT再分別從受造秩序逆轉、古代觀察語言、地下水或海床變動，以及審判靈意加以解釋。
- title: 耶和華把他關在方舟裡
  path: link_folder/神學/耶和華把他關在方舟裡.md
  summary: 挪亞一家與活物進入方舟後，經文用 וַיִּסְגֹּר（H5462）與 בַּעֲדוֹ（H1157）描寫耶和華在他身後親自關上。
  relation: STEP確認關門的主體、動作及相對位置；註釋再從中看見神的保守、寬限期結束，以及方舟內外的分界。
- title: 潔淨與不潔淨的早期區分
  path: link_folder/主題/潔淨與不潔淨的早期區分.md
  summary: 潔淨畜類使用 הַטְּהוֹרָה（H2889），數量寫作 שִׁבְעָה שִׁבְעָה（H7651，「七、七」）；不是潔淨的畜類則用雙數 שְׁנַיִם（H8147，「兩個」）。
  relation: STEP確認摩西律法前已有潔淨分類及不同數量；各家註釋再把較多潔淨牲畜連於洪水後獻祭與繁衍的需要。
- title: 四十的屬靈意義
  path: link_folder/原文/四十的屬靈意義.md
  summary: 第4、12、17節都使用 אַרְבָּעִים（H705，「四十」），記大雨四十晝夜、洪水在地上四十天，水勢增長使方舟浮起。
  relation: STEP先確認實際日數；註釋再由本章和其他經文，發展「四十」作試煉、審判、預備或轉折時期的理解。
- title: 各從其類
  path: link_folder/原文/各從其類.md
  summary: 第14節四次使用 מִין（H4327，「類」）的附代名詞形式，依次說野獸、牲畜、爬物與飛鳥「各按其類」進入方舟。
  relation: STEP確認創造敘事的「各從其類」用語在洪水保存生命時再次出現；註釋進一步看見神藉方舟延續受造界的類別與秩序。
- title: 挪亞的完全順服
  path: link_folder/神學/挪亞的完全順服.md
  summary: 第5節用 וַיַּעַשׂ（H6213A，「他就行了」）和 צִוָּהוּ（H6680，「祂吩咐他」）說挪亞照耶和華一切命令而行；第9、16節又重複「照神所吩咐的」。
  relation: STEP顯示「行」與「吩咐」從第6章延續到第7章；註釋與來11:7再把實際進入、等候並接納活物的行動理解為因信敬畏。
- title: 洪水中的審判與拯救
  path: link_folder/神學/洪水中的審判與拯救.md
  summary: 第23節以同一詞根先說「祂除滅」וַיִּמַח、再說「牠們被除滅」וַיִּמָּחוּ（H4229A），隨即以「被留下」וַיִּשָּׁאֶר（H7604）和「只有」אַךְ（H389）轉向挪亞及方舟中的生命。
  relation: STEP藉主動、被動與「存留」形成審判和拯救的文字對照；彼前3:20-21再以八口藉水得救連於洗禮和基督復活。
- title: 挪亞作為審判中蒙保守的預表
  path: link_folder/神學/挪亞作為審判中蒙保守的預表.md
  summary: 挪亞在神面前被稱為義人，與一家八口進入方舟；第23節以「只有」אַךְ（H389）和「被留下」וַיִּשָּׁאֶר（H7604）說他們在其他旱地生命滅亡時存留。
  relation: STEP確認挪亞「存留」的文字焦點；來源據此進一步發展在審判中蒙保守、並在基督裡經過審判而得救的預表。
- title: 每樣兩個與潔淨畜類七對
  path: link_folder/解經爭議/每樣兩個與潔淨畜類七對.md
  summary: 第2至3節把潔淨類數量寫作 שִׁבְעָה שִׁבְעָה（H7651，「七、七」），不潔淨類用雙數 שְׁנַיִם（H8147，「兩個」）；第9、15節又重複「兩個、兩個」。
  relation: STEP顯示一般成對保存與潔淨類特殊數量並列；註釋據此把第6章視為一般原則、第7章視為補充，並保留「七七」譯作七對或七隻的差異。
- title: 洪水的考古證據
  path: link_folder/解經爭議/洪水的考古證據.md
  summary: GT第7章收錄以地層、化石、快速沉積和各地洪水傳說支持大洪水的護教論證，也保存不同作者對洪水範圍的保留意見。
  relation: 這些材料顯示來源合集內部立場多元；洪水傳說和地質現象可供比較，卻不能不經年代、範圍與因果分析便視作已確證單一模型。
- title: 挪亞是傳義道者
  path: link_folder/互文/挪亞是傳義道者.md
  summary: 創世記7章沒有逐字記錄挪亞的講道，卻描寫神所定最後七天、挪亞的順服，以及審判按所宣告的日期臨到。
  relation: 彼後2:5稱挪亞為傳義道者，補充他洪水前的見證；來源所說120年傳道期是把創6:3與彼後互文連結的傳統推論。
- title: 七天的等候與最後寬限
  path: link_folder/神學/七天的等候與最後寬限.md
  summary: 神先以「再」עוֹד（H5750）和「七」שִׁבְעָה（H7651）明告洪水來臨的期限；挪亞照命令行，七天期滿，洪水便氾濫在地上。
  relation: STEP直接標出七天期限；來源一方面看見神在審判前留下最後寬限，另一方面以挪亞在尚未見雨時進方舟，說明信心按神的話行動並忍耐等候。
- title: 洪水全程時間軸
  path: link_folder/背景/洪水全程時間軸.md
  summary: 創7:11依次使用「年」שָׁנָה（H8141）、「月」חֹדֶשׁ（H2320G）和「日」יוֹם（H3117G）標出挪亞六百歲二月十七日；本章另記四十晝夜與一百五十天。
  relation: STEP確認時間軸起點與兩段日數；GT再據三十日月份推算三月二十六日雨停、七月十六日滿一百五十天，推算結果會隨起訖日計算法略有差異。
- title: 四十天降雨與一百五十天水勢
  path: link_folder/解經爭議/四十天降雨與一百五十天水勢.md
  summary: 第12節以「四十」記降雨，第24節以「五十加一百」記水勢增強，兩句各有不同的敘事功能。
  relation: STEP先確認兩組數字和所搭配的事件；GT解經資料進一步說明一百五十天包括前四十天，CT再把一百五十日發展為審判嚴厲周密的靈意應用。
- title: 洪水範圍的爭論
  path: link_folder/解經爭議/洪水範圍的爭論.md
  summary: כֹּל（H3605，「所有／每一」）反覆修飾高山、活物與人；第22節又以「旱地」חָרָבָה（H2724）界定死亡的生命，只留下挪亞和方舟中的生命。
  relation: STEP先呈現全稱語句、土地詞彙與旱地範圍；普世性讀法按最大地理範圍理解，地區性讀法則按古代作者所知的人類世界理解。
