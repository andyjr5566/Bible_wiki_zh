organization: '創世記第1章像是從高處觀看整個天地，第2章則把鏡頭慢慢推近：一片土地、一個園子、一個由塵土而來的人，以及另一個終於能與他相對而立的人。這一章承接創造的故事，進一步回答一個更貼近我們的問題：人要怎樣活在神所造的世界裡？答案沿著安息、生命、工作、界線和關係，一步一步展開。


  ### 一、人還沒有工作，先看見神已經完成（1-3節）


  第2章從「完成」開始。天地萬物都已齊備，神在第七日歇下創造之工。這不是一位筋疲力盡的神終於得到休息；「安息」在這裡首先是停止、歇下的意思——該做的已經做成，世界不再等待最後一塊拼圖。


  這個次序很重要。人還沒有耕種園子，還沒有完成任何功績，就先活在神已經完成的工作裡。工作固然會在本章出現，但人的生活不是從焦慮的證明自己開始，而是從領受開始。[[安息日]]與[[希伯來書4章神的安息]]後來都回到這個根基：真正的安息，不只是停止活動，而是信靠神所成就的工作。


  > [!quote] 話中之光

  > 惟有神自己的工作，才能給人帶來真實的安息……人必須先享受神所賜的安息，然後才有力量作工。


  古代近東的一些神話說，諸神因工作勞苦，造出人來替自己服役，然後才得以休息。創世記呈現的畫面正好相反：神不需要人替祂解除疲勞；祂把一個已經預備好的世界交給人。人不是為填補神的不足而受造，而是受邀進入神的豐盛（見[[與古代近東創世神話的對比]]）。


  ### 二、塵土沒有生命，直到神親自吹氣（4-7節）


  第4節的「來歷」像一道轉場。第1章關心天地萬物怎樣各按次序被造，第2章則把注意力放在人身上：他從哪裡來？他的生命有什麼分量？他與神、土地和其他受造物有什麼關係？兩章焦點不同，彼此並不衝突（見[[創世記2章與1章關係]]）。


  經文說，神用地上的塵土「塑造」人。這個動詞讓不少註釋想到陶匠手中的泥土：不是遠遠發出一道命令，而是細緻地形成一個有形體的人。「人」אָדָם（*adam*）與「土地」אֲדָמָה（*adamah*）在聲音上彼此呼應，提醒我們人與土地相連——人不是神，也不是不受限制的存在；他脆弱、有限，終究要面對自己出於塵土的事實。


  神接著把生命的氣息吹入人的鼻孔，使他成為「活的生命、活的受造者」נֶפֶשׁ חַיָּה。這個詞組也用來稱動物；在本節的完整敘事中，人的生命由神親自賜下，並且受託在祂面前生活。部分註釋再結合神吹氣的行動及其他經文，進一步討論人的靈、魂、體與人特殊的屬靈生命。塵土使人謙卑，神的氣息則使人的生命帶著不可輕看的尊嚴（見[[地上塵土與生命氣息]]、[[有靈的活人]]）。


  從這裡開始，經文反覆使用「[[耶和華神的名字|耶和華神]]」這個稱呼。接下來的神不只創造，也親自栽種、安置、吩咐、供應，並為人的孤單預備答案。註釋常說，第1章讓人看見神創造的權能，第2章則讓人看見創造主如何走近祂所造的人。


  ### 三、園子既是禮物，也是託付（8-15節）


  在人開始工作以前，神先為他栽種一座園子。那裡有悅人眼目的樹，也有可作食物的果子；有河水從[[伊甸]]流出，滋潤園子，再分成四道流向外面。經文花篇幅寫[[比遜]]、[[基訓]]、[[底格里斯|希底結]]和[[伯拉大河|伯拉河]]，讓這座園子不只像一幅理想圖畫，也像一個與真實世界相連的地方。


  原文把比遜、基訓、希底結和伯拉河列作四個專有河名。部分註釋再按照傳統字源，把它們聯想到暢流、湧出、迅速和多結果子，並由此描繪生命與祝福向外流動。經文所呈現的畫面同樣鮮明：園中的水向外流去，神的供應也從園子延伸到更遠之地（見[[伊甸園四河]]）。


  園子中央有[[生命樹]]，也有[[分別善惡的樹]]。前者把生命指向神的供應，後者則使人面對一個問題：人願不願意承認，自己雖有選擇，卻不是善惡的最終制定者？神給人的生活既豐盛，又有界線；這兩件事並不矛盾。


  神把人安置在園中，要他「修理、看守」。這兩個詞帶著工作、服事、守護的意思。由此可見，工作不是人犯罪以後才出現的刑罰；在世界尚未敗壞時，人已經領受工作。真正因罪而來的，是勞苦、挫敗和土地的抵抗。工作本身原是尊嚴，也是託付：人不是園子的主人，卻被信任去照料園子。


  ### 四、神的命令先說「可以」，然後才說「不可」（16-17節）


  談到園中的命令，我們很容易只記得那棵不可吃的樹；經文的次序卻不是這樣。神先說：「園中各樣樹上的果子，你可以隨意吃。」希伯來文把「吃」連說兩次，語氣近似「你儘管吃」。神的第一句不是剝奪，而是慷慨的允許；禁令只落在一棵樹上。


  因此，這項命令不是要把人困在狹窄的生活裡，而是在豐盛之中留下一條清楚的界線。自由並不等於世界上沒有任何「不可」；真正的問題是，人願不願意在擁有真實選擇時，仍信任賜下一切的神（見[[神的命令與自由意志]]）。


  「你吃的日子必定死」同樣把「死」連說兩次，強調後果一定臨到。後來的註釋把本節放進整本聖經，進一步從與神隔絕、肉身死亡和末後的第二次死三方面理解死亡（見[[死的三層]]）。此刻的警告先讓讀者明白：離開生命的源頭，死亡便進入人的處境。


  ### 五、在萬物之中，沒有一個真正與他相配（18-25節）


  創造故事一路重複「神看著是好的」，到了這裡卻第一次出現「不好」：那人獨居不好。神把走獸和飛鳥帶到人面前，讓他一一命名。這顯出人有觀察、分辨和治理的責任，也使他的缺少逐漸顯明——萬物各有其美，卻沒有一個能站在他面前，真正與他相對、相應。


  原文稱她為「幫助者」，又說她「與他相配」，帶著面對面、彼此對應的意思。聖經別處也稱神為人的幫助；註釋因此從這個詞組、男女同具神的形像及整段婚姻敘事，看見女人與男人同等相配，能與他同行並共同承擔使命（見[[配偶幫助者]]）。第19節描述神「形成」動物，與第7節「塑造」人使用同一個動詞；GT 再從兩章的敘事焦點理解時間關係：第1章呈現創造次序，第2章專注於動物被帶到人面前命名（見[[創世記2章19節創造次序問題]]）。


  神使亞當沉睡，從他的「側邊／肋骨」取出一部分，又把女人「建造」出來。這是原文直接呈現的動作；註釋再從肋旁的位置與整段婚姻敘事，看見親密、同源、同等和並肩而立的圖像。女人由亞當身上所取的一部分被建造，表明她與男人共享同樣的人性。


  所以當她被領到亞當面前，亞當終於開口說話，而且說出的像是一首短詩：「這是我骨中的骨，肉中的肉。」原文三次重複「這一位」，把他的驚喜集中在眼前的人身上；「女人」與「男人」的讀音也互相呼應。經過萬物從眼前一一走過，他終於認出：這一位與我同源，也能與我彼此相屬。


  接著，敘事從第一對男女轉向所有婚姻：人要離開父母，與妻子「連合」——緊緊相連——二人成為一體。這不是抹去兩人的不同，而是在不同之中建立忠誠而深厚的聯合。第25節以「赤身露體，並不羞恥」為這一章收尾：他們彼此完全敞開，卻不需要躲藏、防衛或遮掩。這份坦然，正是下一章失落之物。


  ### 六、這段婚姻，後來指向更遠的故事（18-24節）


  創世記第2章先呈現男人與女人、婚姻與共同生活。到了新約，以弗所書5章31-32節引用「二人成為一體」，把這段婚姻放進基督與教會的奧祕裡。於是，亞當沉睡、女人由他身旁而出、新婦被領到他面前，以及二人成為一體，便被教會歷來讀作[[基督之新婦（豫表）|基督與教會的圖像]]，並與[[約翰福音19章肋旁血和水]]互相照映。


  這層閱讀來自新約對創世記的引用與回望。它在本章婚姻教導的基礎上，讓離開、連合和忠誠進一步指向一份更大的愛與盟約（見[[以弗所書5章基督與教會的婚姻奧祕]]、[[馬太福音19章婚姻不可分開]]）。


  讀到章末，我們看見的是一幅尚未被罪撕裂的生活：有工作，卻沒有徒勞；有界線，卻沒有猜疑；有差異，卻沒有隔絕；赤身相對，卻沒有羞恥。人的生命不是自己從塵土中掙來的，園子不是自己建成的，配偶也不是自己在萬物中找到的。一切先是領受，然後才是回應——這正是創世記第2章留給人的起初圖像。


