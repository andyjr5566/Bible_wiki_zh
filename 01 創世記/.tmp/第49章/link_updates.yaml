- title: 利未
  path: link_folder/人物/利未.md
  summary: 利未與西緬同受「分居在雅各家裡，散住在以色列地中」的宣告（5-7節）。
  relation: 同一句宣告在利未身上的結果與西緬不同。CT 說利未散住在以色列人地業中的四十八座城及其四圍的郊野（書21:41）。GT 丁良才把轉折點說出來：利未支派也果然住在以色列人的眾支派中，「神卻將這咒詛變為幸福」（出32:25-29；申33:8-11）。KC 說明轉折的機制：因著分散，他們得以進到全民中間，好把神的律法教訓全民。GT 賈斯樂郝威《聖經難解經文詮釋手冊》正面處理「雅各咒詛利未、摩西卻祝福利未」的表面矛盾：「這兩個宣告（咒詛和祝福）之間並沒有矛盾」——利未的後裔就如雅各所言分散在以色列各地，卻成為神命定的祭司支派。
