- title: 以薩迦（價值）
  path: link_folder/人物/以薩迦（價值）.md
  summary: 「以薩迦是個強壯的驢，臥在羊圈之中。他以安靜為佳，以肥地為美，便低肩背重，成為服苦的僕人」（14-15節）。
  relation: CT 說以薩迦支派所分得的土地在約但河谷的西北部（書19:17-23），土地肥美、物產豐富，但他們可能沒有設法趕出境內的迦南人而安於現狀。GT 丁良才說得更簡：「這支派的人因著地土肥美而心裡知足，就失去了自治的心，致逐漸地被人欺壓。」GT《舊約背景註釋》從動物習性補一條：驢子有時頑強而性惰，可能會在最不合宜之處突然坐倒下來。GT 賈斯樂郝威指出應驗的時點：主前732年提革拉毘列色三世併吞以薩迦的地業納入亞述版圖（王下15:29；賽9:1）。
