- title: 迦得（萬幸）
  path: link_folder/人物/迦得（萬幸）.md
  summary: 「迦得必被敵軍追逼，他卻要追逼他們的腳跟」（19節）。
  relation: CT 說這是指他們先被敵人追逼、後來卻反過來追逼敵人，描述失敗後重獲勝利：迦得支派分得的土地在約但河東邊（書13:24-28），經常受到侵襲（士10:8），但當他們強盛時就會把敵人制伏（代上5:18-22）。GT 丁良才說追逼他們的是亞拉伯的敵軍；GT《啟導本聖經創世記註釋》說與南邊的摩押人為鄰；GT《串珠聖經註釋》說是從沙漠來的米甸和摩押人。GT《創世記雷氏研讀本》歸納：迦得定居在約但河東後很容易受到攻擊，因此他們需要強壯的戰士。
