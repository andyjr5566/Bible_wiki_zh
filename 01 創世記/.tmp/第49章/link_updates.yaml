- title: 神的護理
  path: link_folder/神學/神的護理.md
  summary: 「但他的弓仍舊堅硬，他的手健壯敏捷；這是因以色列的牧者，以色列的磐石，就是雅各的大能者」（24節）。
  relation: CT 說本節指大能的神是約瑟力量的泉源，惟有順從祂的引導（「牧者」）並全心依靠祂（「磐石」），才得以屹立不為仇敵所害。GT《啟導本聖經創世記註釋》指出「牧者」「磐石」「雅各的大能者」都指全能的神，並說雅各是「從約瑟如日中天的現在，追溯到他往日所受的痛苦，但將一切都歸於神的大能的作為」。GT《聖經精讀本》說約瑟能力的源泉，正是把族長雅各從患難中拯救出來的全能神。
