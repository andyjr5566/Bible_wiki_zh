- title: 拿弗他利
  path: link_folder/人物/拿弗他利.md
  summary: 「拿弗他利是被釋放的母鹿；他出嘉美的言語」（21節）。
  relation: CT 說「被釋放的母鹿」指其步履靈活矯捷（詩18:33），後來拿弗他利支派的人曾在爭戰中有出色的表現（士4:6、16）；GT 丁良才更直接：母鹿就是「善於打仗之人」的標幟。GT《聖經精讀本》把兩句話分開對應：前半預言他們是敏捷矯健的戰士（可由擊退迦南王耶賓看出，士4:1-9），後半預言他們「將以驚人的善辯和美妙的歌聲打動人心」，可由底波拉與拿弗他利後裔巴拉的歌聲看出（士5章）。GT《串珠聖經註釋》另記一種讀法：不少學者建議把21節加上不同的響音而譯作「拿弗他利是一棵高大的松樹，生髮出美麗的嫩芽」。
  sources:
