- title: 全能的神（El Shaddai）
  path: link_folder/神學/全能的神（El Shaddai）.md
  summary: 「你父親的神必幫助你，那全能者必將天上所有的福，地裡所藏的福，以及生產乳養的福，都賜給你」（25節）。
  relation: CT 解釋這三重的福：「生產乳養」的原文是「母腹和胸奶」，母腹是為生產，胸奶是為乳養；整體指天候與地利之福，包括雨水、甘露、泉源、礦藏、農產、畜牧。GT《聖經精讀本》分得更細：天上所有的福指早晨的露水、適量的雨水與陽光，地裡所藏的福指使土地肥沃的泉水——「常年乾旱的巴勒斯坦地帶，豐富的水是最大的祝福」，生產乳養的福則指順產及多產帶來多子多孫。
