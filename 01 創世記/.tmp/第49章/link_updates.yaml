- title: 十二支派起源
  path: link_folder/神學/十二支派起源.md
  summary: 「這一切是以色列的十二支派；這也是他們的父親對他們所說的話，為他們所祝的福，都是按著各人的福分，為他們祝福」（28節）。
  relation: CT 指出兩件事：雅各臨死的時候，以色列十二個支派已經擺明在那裡了；而「他們之中有些人，按表面看，似乎不是祝福，而是責備，但聖經仍認為這是他們的福分」。GT《聖經精讀本》列出雅各預言的判準：把兒子們一貫的行為牢記在心、各自在救贖史中要擔當的使命、一切根據神的安排、不從個人角度而基於對後裔影響的角度；它並把這條線拉到新約——舊約的以色列十二支派演變成新約基督的十二個門徒，最後形成神國的十二個根基（啟21:14）。
