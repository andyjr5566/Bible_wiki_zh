- title: 便雅憫
  path: link_folder/人物/便雅憫.md
  summary: 「便雅憫是個撕掠的狼，早晨要吃他所抓的，晚上要分他所奪的」（27節）。
  relation: CT 說這是讚許便雅憫支派的戰鬥精神，他們曾多次出了著名的爭戰勇士（士3:15-30；20:21、25；代上12:2）。GT《啟導本聖經創世記註釋》把同一種兇暴指向士師記19至21章。GT《聖經精讀本》則列出這支派對以色列歷史的貢獻：士師以笏、第一個王掃羅、掃羅的兒子約拿單、以斯帖、末底改，以及新約時代的保羅。KC 把約瑟與便雅憫合起來讀：約瑟是基督受苦與高升的圖畫，便雅憫是基督帶著權能榮耀再來、在地上掌權的圖畫。
