- title: 麥比拉洞
  path: link_folder/地點/麥比拉洞.md
  summary: 雅各囑咐眾子：「你們要將我葬在赫人以弗崙田間的洞裡，與我祖我父在一處，就是在迦南地幔利前，麥比拉田間的洞」，並細數已葬在那裡的人——亞伯拉罕與撒拉、以撒與利百加，以及利亞（29-32節）。
  relation: CT 指出這是族長合法購得的產業：「那洞和田，是亞伯拉罕向赫人以弗崙買來為業，作墳地的」（創23章）。CT 並注意到一處聖經他處未載的資料：以撒之死別處有記（35:28-29）卻未記葬處，至於利百加和利亞，連她們何時死亡都未見記載——本章是唯一的線索。GT《啟導本聖經創世記註釋》同說利亞死在迦南的事「只在此處簡略提到」。KC 讀出這囑咐的性質：雅各重述他先前所說的（47:30），這清楚顯明他對復活的信心，也顯明神是復活的神。
