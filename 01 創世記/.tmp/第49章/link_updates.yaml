- title: 西緬
  path: link_folder/人物/西緬.md
  summary: 「西緬和利未是弟兄；他們的刀劍是殘忍的器具……他們的怒氣暴烈可咒；他們的忿恨殘忍可詛。我要使他們分居在雅各家裡，散住在以色列地中」（5-7節）。
  relation: CT 指這是說他們用刀劍殺了示劍全城的人（34:25-29），並提醒雅各「不是咒詛他們的『人』，而是咒詛他們的『性情和行為』」。應驗方面，CT 說西緬支派只能在猶大支派的境內得著地業（書19:1-9）；GT 丁良才補上兩點：西緬支派後來成了最小的支派（民26:14），而摩西為以色列人祝福的時候（申33章）並沒有提到這支派。GT《聖經精讀本》說在曠野行軍中西緬支派的人越來越減少。
