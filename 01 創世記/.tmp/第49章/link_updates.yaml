- title: 西布倫（同住）
  path: link_folder/人物/西布倫（同住）.md
  summary: 「西布倫必住在海口，必成為停船的海口；他的境界必延到西頓」（13節）。
  relation: CT 說這預表西布倫支派的居住地將靠近地中海，「他們要吸取海裡的豐富，並沙中所藏的珍寶」（申33:18-19），並指西布倫地將成為基督福音的起源地（太4:15-16）。GT《串珠聖經註釋》說西頓是腓尼基人的首府，位於今天黎巴嫩境內，並說這支派「善於經營航運事業」。GT《舊約背景註釋》補上一個地理限制：以色列沿岸缺乏天然的海港，因此對他們而言大海不過是疆界，「惟有北面沿海地區的人，才有發展航海技術的機會」。GT《聖經精讀本》指出這段預言過了約450年才藉拈鬮的方式實現（民26:55；書19:10-16）。
