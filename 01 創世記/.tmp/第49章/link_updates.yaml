- title: 雅各
  path: link_folder/人物/雅各.md
  summary: 雅各叫齊兒子們說「我好把你們日後必遇的事告訴你們」（1-2節），逐一宣告十二子的將來（3-27節）；經文總結說「這一切是以色列的十二支派……都是按著各人的福分，為他們祝福」（28節）。最後他囑咐葬在麥比拉洞（29-32節），「就把腳收在床上，氣絕而死，歸到列祖那裡去了」（33節）。
  relation: CT 指出「日後的事」包含以色列人出埃及、進迦南、分配地、建國度等整個歷史，甚至包括有關彌賽亞的預言，而雅各此時「是被神的靈感動作先知」。GT《啟導本聖經創世記註釋》說第2至27節是全卷創世記最長的一篇詩歌。CT 另注意到第2節的兩個名字各有其位：「雅各」指他是生育的父親，「以色列」指他說話的地位。GT 丁良才說第33節的「歸他列祖那裡去」是指靈魂歸到陰間，不是指屍首埋於墳墓，因為下一章才記載他過了七十天被埋葬的事。
  sources:
