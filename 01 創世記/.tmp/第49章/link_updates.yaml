- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 雅各雖死在埃及，卻囑咐要葬在「迦南地幔利前，麥比拉田間的洞」（29-32節）。
  relation: 歸葬的選擇再次把埃及定位為暫居地。GT《聖經精讀本》給出雅各特別關心葬地的兩個原因：讓兒子們記住以色列民族的根，並讓他們確信神要恢復迦南地的應許。GT《串珠聖經註釋》同說：他的遺囑表明他深信後代必會按神的應許重返迦南地。
