- title: 猶大（雅各之子）
  path: link_folder/人物/猶大（雅各之子）.md
  summary: 「猶大啊，你弟兄們必讚美你……圭必不離猶大，杖必不離他兩腳之間，直等細羅（就是賜平安者）來到，萬民都必歸順」（8-12節）。
  relation: CT 指出「猶大」的字義就是「讚美」，而長子名分中家族領導者的地位之所以歸他，是因為長子流便放縱情慾、二三子西緬和利未殘忍可詛；後來猶大支派的大衛開創了猶大王朝（撒下5:4-5）。GT《聖經精讀本》給猶大受讚美的兩個理由：他忘我的品德（43:9；44:18-34），以及將來的君王權威。KC 注意到語氣的驟變：雅各論到猶大只說可稱讚的事，與前三個兒子成了極大的對比。至於「細羅」，各家譯法不一（賜平安者／那應得的人／示羅／貢物），但共同的主軸是猶大王權的延續與萬民歸順者的來到。
