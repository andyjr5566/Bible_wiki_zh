- title: 約瑟
  path: link_folder/人物/約瑟.md
  summary: 「約瑟是多結果子的樹枝，是泉旁多結果的枝子，他的枝條探出牆外」（22節）；「弓箭手將他苦害，向他射箭，逼迫他；但他的弓仍舊堅硬……這是因以色列的牧者，以色列的磐石，就是雅各的大能者」（23-24節）；末了是天上、地裡、生產乳養的三重福（25-26節）。
  relation: CT 指出「多結果子」的應驗：當摩西的時候，屬約瑟的以法蓮和瑪拿西兩個支派合計人數比以色列任何一個支派都多（民26:28-34）。GT 丁良才把「弓箭手」對回具體的人：他的哥哥們（創37章）與波提乏的妻子。KC 用一個比喻說明第24節的「因」：像小孩要提起父親沉重的箱子，他自己提不動，卻因父親的大手包著他的手一同提起而提起來了。CT 另指出「與弟兄迥別」的原文與「拿細耳人」同字，故兼有兩義——成就高過弟兄們，以及分別為聖歸給神；KC 說主耶穌是那真正的拿細耳人。
