- title: 亞設（有福）
  path: link_folder/人物/亞設（有福）.md
  summary: 「亞設之地必出肥美的糧食，且出君王的美味」（20節）。
  relation: CT 說亞設支派分得的土地靠近地中海（書19:24-31），農地肥沃、物產豐盛，並指出「且出君王的美味」亦可譯為「將有美食供奉君王」，表示所出產的糧食品質最佳美（王上4:7）。GT《串珠聖經註釋》說這支派居住在迦密山以北的東海岸，以豐富出產馳名，「連帝王的美食也由亞設支派供應」。GT《聖經精讀本》指出應驗的時點：所羅門時代，他們用肥沃土地出產的食物供給王（王上5:11）。
  sources:
