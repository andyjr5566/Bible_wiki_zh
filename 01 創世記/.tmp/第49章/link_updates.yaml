- title: 流便
  path: link_folder/人物/流便.md
  summary: 「流便哪，你是我的長子，是我力量強壯的時候生的，本當大有尊榮，權力超眾；但你放縱情慾，滾沸如水，必不得居首位，因為你上了你父親的床，污穢了我的榻」（3-4節）。
  relation: CT 的背景註解說明失去的是什麼：猶太人特別重視長子的名分，它有三大特權——雙份的產業、家族的首領（君王）職分、家族的祭司職分。應驗的證據，CT 與 GT 丁良才、雷氏都指向同一件事：在流便的後裔中沒有出過任何著名的士師、先知或官長（士5:15-16）。GT《聖經精讀本》補上曠野時期的例外也不算數：流便支派雖出過大坍和亞比蘭，但他們與可拉黨一同反對摩西，終被滅亡（民16章；申11:6）。GT《串珠聖經註釋》說「滾沸如水」是「描寫流便放任，像洪流不受管制」。
