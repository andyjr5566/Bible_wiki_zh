- title: 但（審判）
  path: link_folder/人物/但（審判）.md
  summary: 「但必判斷他的民，作以色列支派之一。但必作道上的蛇，路中的虺，咬傷馬蹄，使騎馬的墜落於後」（16-17節）；緊接著是雅各的一聲歎息：「耶和華啊，我向來等候你的救恩」（18節）。
  relation: CT 指出「但」的字義就是「判斷」，第16節意即他的後裔要作士師——但支派出了一位有名的士師參孫（士13:2、24；15:20）。第17節則轉向另一面：CT 說但的後裔走上暴力和奸詐的路，將米迦的神像帶到但城另成立敬拜中心（士18:27-31）。GT《串珠聖經註釋》讀出其中的反諷：法官主要的特色應是公正，「而雅各卻用詭計狡猾的蛇描寫但，實是絕大諷刺」。GT《聖經精讀本》記下兩條可考的線索：但支派是拜偶像的發起人（士18:18；王上12:29-30），而啟7:5-8 的受印名單中沒有但支派；初期教父愛任紐、奧古斯丁、安波羅修據此推想敵基督將從但支派出現。
  sources:
