book: 創世記
chapter: 21
updates:
- title: 亞伯拉罕
  path: link_folder/人物/亞伯拉罕.md
  summary: 亞伯拉罕百歲時，神按先前的話使撒拉生以撒；他照吩咐在第八日給以撒行割禮，斷奶日設豐盛筵席。神命他聽從撒拉打發夏甲和以實瑪利，他清早起來遵行；後與亞比米勒在別是巴立約，解決水井之爭，栽垂絲柳樹並求告耶和華永生神（El
    Olam）的名。
  relation: 本章呈現亞伯拉罕信心路程的三個面向：等候二十五年後領受應許成就、在骨肉之情與神命令間順服神、以寄居者身分與外邦王和平立約並公開敬拜。
- title: 加拉太書四章
  path: link_folder/互文/加拉太書四章.md
  summary: 加四22-31直接引用本章「把使女和她兒子趕出去」（創廿一10），以夏甲對應西奈之約、撒拉對應應許之約，以實瑪利按血氣生、以撒憑應許生，作兩約的寓意閱讀。
  relation: 本章8-21節趕出夏甲與以實瑪利的敘事，是保羅這段寓意論證的舊約本文；「按血氣生的逼迫按靈生的」（加四29）即指本章9節的戲笑。
- title: 以實瑪利與以撒的豫表
  path: link_folder/主題/以實瑪利與以撒的豫表.md
  summary: 以撒斷奶設筵之日，以實瑪利「戲笑」以撒（與「以撒」同字根的加強形式，含譏嘲之意）；撒拉要求趕出使女之子，神指定「從以撒生的才要稱為你的後裔」，同時應許以實瑪利的後裔成立一國。
  relation: 本章是這一豫表主題的敘事高峰：按血氣生與憑應許生的兩線在承受產業一事上正式分開，但被逐者仍蒙神看顧（神聽見童子的聲音）。
- title: 「以撒」名字含義
  path: link_folder/原文/「以撒」名字含義.md
  summary: 以撒出生後，撒拉說「神使我喜笑，凡聽見的必與我一同喜笑」（創廿一6），名字「喜笑」由不信的暗笑轉為信心的歡笑；第9節「戲笑」為同字根的加強形式，形成對比的雙關。
  relation: 本章使「以撒＝喜笑」的命名達到敘事成就：名字在創十七19預定，在本章由撒拉的頌讚公開解明。
- title: 巴蘭的曠野
  path: link_folder/地點/巴蘭的曠野.md
  summary: 第21節記以實瑪利被逐後「住在巴蘭的曠野」，這是巴蘭曠野在聖經敘事中最早的出現。四來源對其位置說法不一：GT 丁良才《創世紀註釋》作「迦南南邊的大曠野」，GT《啟導本聖經創世記註釋》與 CT 均作「西奈半島北部」，GT《創世記雷氏研讀本》作「西乃半島的東北面」，GT《串珠聖經註釋》作「位於基低斯東南」，GT《舊約背景註釋》則指西乃沙漠東北部的乾旱曠野、在以東的西面，並明說加低斯亦位於此。
  relation: 本章把這片曠野定位為被逐者的存活之地——以實瑪利在此長大成為弓箭手，母親從埃及為他娶妻。後兩說彼此相衝（一說巴蘭在加低斯東南，一說加低斯在巴蘭境內），經文未給界線可據以裁決；背景註釋並指出這區域在曠野時代扮演重要角色（民十三3、26；申一1），與民數記的用法相接。
- title: 非各
  path: link_folder/人物/非各.md
  summary: 第22、32節記亞比米勒同他的軍長非各與亞伯拉罕立約，這是非各在聖經中最早的出現，同行的對象是亞伯拉罕而非以撒。GT 丁良才《創世紀註釋》指出「有人以為這『非各』不是人名而是尊號，因為在創二十六26 中還有一個非各」。
  relation: 非各的在場說明這是一次正式的邦交行動——亞比米勒帶著最高武官前來締約，而不是私人往來。他在創二十六26 與以撒立約時再度出現，兩次相隔逾六十年，因此本章這一筆是判斷「非各是人名還是軍職尊號」的第一個座標。
- title: 神的使者
  path: link_folder/人物/神的使者.md
  summary: 第17節「神的使者從天上呼叫夏甲」，對絕望中的夏甲說「不要害怕，神已經聽見童子的聲音了」。GT 丁良才《創世紀註釋》記下這個稱呼的稀有：摩西五經只有四次用「神的使者」，其餘多稱「耶和華的使者」；夏甲上一次在曠野遇見的（創十六7）正是「耶和華的使者」。
  relation: 這是使者向同一個人第二次顯現，卻換了稱呼。使者的話與「以實瑪利」（神所聽見的）名字構成雙關——神聽見的不是母親的哭聲，而是童子的聲音；被排除在約的承受線之外，不等於失去神的看顧。
- title: 非利士人
  path: link_folder/地點/非利士人.md
  summary: 第32、34節記亞比米勒與軍長非各「起身回非利士地去了」，亞伯拉罕則「在非利士人的地寄居了多日」。這是非利士人在聖經中最早的出現，早於以撒時代的衝突（創二十六）。GT《啟導本聖經創世記註釋》指非利士人到主前十二世紀初才大批徙居巴勒斯坦，亞伯拉罕時代的非利士人與後來的不同；GT《舊約背景註釋》指出「亞比米勒」是閃族語系的名字，與非利士地基拉耳王的描述相符。
  relation: 本章的非利士人與後來的敵對形象相反——雙方以立約收場，亞伯拉罕在其地長期寄居。這一筆也是「亞伯拉罕時代是否已有非利士人」這場年代爭議的經文出處。
- title: 古代近東立約
  path: link_folder/背景/古代近東立約.md
  summary: 第22-32節是族長與外邦王締結互不侵犯條約的完整範例：指著神起誓（23節）、以牛羊為立約之物（27節）、另置七隻母羊羔作挖井的證據（28-30節）、以地名記念盟誓（31節）。GT《聖經精讀本──創世記註解》指出贈禮是簽訂同盟的最後儀式，在古代近東「收納禮物是表示講和，拒絕禮物則表示不和與戰爭」（王上十五19；賽三十6、三十九1）；並註「起誓」一詞源自希伯來文中意指「七個」的詞。GT《舊約背景註釋》則說明這類條約有確立水井擁有權與使用權、避免爭執的實際作用。
  relation: 本章呈現的是立約的世俗一面——不是神與人立約，而是兩個牧養群體為水源劃定權利。它與神向亞伯拉罕所立的約形成對照：一個靠禮物、證物與人的起誓維持，另一個靠神自己的話成就。
- title: 古代近東割禮背景
  path: link_folder/背景/古代近東割禮背景.md
  summary: 第4節記以撒生下來第八日受割禮。GT《舊約背景註釋》指出這八天的等候期正是以撒與以實瑪利的分別（後者十三歲才受割禮），並提出其功用是斷定嬰兒是否能夠養活，也可能與產後的不潔期有關（利十二1-3）。GT《聖經精讀本──創世記註解》則把希伯來人的割禮與外邦區分開：埃及與埃提阿伯所行的割禮帶迷信色彩，目的是減除痛苦、醫治不治之症或增加出生率，希伯來人的割禮則是根據神的命令而行。BH 另提出一項現代生理說明，指第八日維生素K濃度達到自然高峰而有助凝血。
  relation: 創十七章立下第八日的規條，本章是它第一次實際施行的記載。以撒與以實瑪利受割禮的年齡之差（八日對十三歲），使這個記號從族群標誌轉為「生來即在約中」的記號。
