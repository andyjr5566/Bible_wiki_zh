book: 創世記
chapter: 21
candidates:
  - name: 亞伯拉罕
    type: 人物
    evidence: 2-34節；百歲得以撒、遵命打發夏甲、與亞比米勒立約（舊檔連 亞伯蘭 為改名前條目，本章事件在創17改名後，統一連 亞伯拉罕）
  - name: 撒拉
    type: 人物
    evidence: 1-12節；蒙眷顧生子、喜笑頌讚、要求趕出使女之子
  - name: 以撒
    type: 人物
    evidence: 3-12節；應許之子出生、第八日受割禮、斷奶設筵
  - name: 夏甲
    type: 人物
    evidence: 9-21節；被打發走，曠野絕望中蒙神開眼見井
  - name: 以實瑪利
    type: 人物
    evidence: 9-21節戲笑、被逐、神聽見童子聲音（raw 經文 v9 無其名，僅作知識節點）
  - name: 亞比米勒
    type: 人物
    evidence: 22-32節；求立約、歸還水井爭議、於別是巴起誓
  - name: 別是巴
    type: 地點
    evidence: 14、31-33節；盟誓的井／七之井，栽垂絲柳樹之地
  - name: 耶和華永生神
    type: 神學
    evidence: 33節 El Olam；亞伯拉罕對神認識的推進
    surfaces:
      - {phrase: 耶和華─永生神, verses: [33]}
  - name: 加拉太書四章
    type: 互文
    evidence: 加四22-31以撒夏甲寓意兩約，引用本章「把使女和她兒子趕出去」
  - name: 以實瑪利與以撒的豫表
    type: 主題
    evidence: 8-21節；按血氣生的逼迫按靈生的（加四29）
  - name: 「以撒」名字含義
    type: 原文
    evidence: 3、6節；喜笑，從暗笑到信心的歡笑，與9節「戲笑」同字根
  - name: 巴蘭的曠野
    type: 地點
    evidence: 21節；以實瑪利成年後所住之地。四來源對位置說法不一（丁良才「迦南南邊的大曠野」、啟導本「西奈半島北部」、串珠「基低斯東南」、雷氏「西乃半島的東北面」、背景註釋「西乃沙漠東北部、在以東的西面」）
    surfaces:
      - {phrase: 巴蘭的曠野, verses: [21]}
  - name: 非各
    type: 人物
    evidence: 22、32節；亞比米勒的軍長。丁良才指出創26:26另有一非各，故可能是尊號而非人名
    surfaces:
      - {phrase: 非各, verses: [22, 32]}
  - name: 神的使者
    type: 人物
    evidence: 17節；從天上呼叫夏甲。丁良才記摩西五經只有四次用「神的使者」這稱呼，其他多稱「耶和華的使者」
    surfaces:
      - {phrase: 神的使者, verses: [17]}
  - name: 非利士人
    type: 地點
    evidence: 32、34節；亞比米勒與非各回非利士地，亞伯拉罕在非利士人的地寄居多日
    surfaces:
      - {phrase: 非利士人, verses: [34]}
  - name: 古代近東立約
    type: 背景
    evidence: 22-32節；牛羊為立約之物、贈禮表示講和拒禮表示不和（王上15:19；賽30:6；39:1）、七隻母羊羔作挖井證據、指著神起誓
  - name: 古代近東割禮背景
    type: 背景
    evidence: 4節；背景註釋論第八日等候期的功用（斷定嬰兒能否養活、產後不潔期利12:1-3），精讀本比較埃及與埃提阿伯割禮的迷信動機
  - name: 垂絲柳樹
    type: 背景
    evidence: 33節；背景註釋詳述其形態與用途、精讀本論其長壽象徵約的穩固、丁良才記古人以所栽的樹為立約證據、雷氏「直譯是聖柳樹」
    surfaces:
      - {phrase: 垂絲柳樹, verses: [33]}
  - name: 戲笑
    type: 原文
    evidence: 9節；與「以撒」同字根的加強形式，雷氏指此用語另見創19:14、39:14-17
    surfaces:
      - {phrase: 戲笑, verses: [9]}
  - name: 亞伯拉罕時代是否已有非利士人
    type: 解經爭議
    evidence: 32、34節；背景註釋今名古用說、啟導本與雷氏早期通商說、艾基斯考古反駁說、賈斯樂郝威命題40存而不論
