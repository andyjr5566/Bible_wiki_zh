organization: "雅各終於動身了。但他走到迦南的南界[[別是巴]]就停下來獻祭。要離開應許之地的人，先回到自己信仰的起點求問——第1節的地點選擇本身就是全章的樞紐。\n\
  \n### 經文大綱\n\n1. **別是巴獻祭，神在夜間異象中應許**（1-4節）\n2. **全家帶著牲畜貨財下埃及**（5-7節）\n3. **隨雅各下埃及的名譜**（8-27節）\n\
  4. **父子在歌珊重逢**（28-30節）\n5. **約瑟豫先策劃，使家人得住歌珊**（31-34節）\n\n```mermaid\nflowchart TD\n\
  \  A[\"希伯崙起程（CT：大概是從希伯崙寄居之處）\"] --> B[\"別是巴：獻祭給父親以撒的神（1節）\"]\n  B --> C[\"夜間異象：連叫兩聲『雅各，雅各』（2節）\"\
  ]\n  C --> D[\"神的四句話：我是神／不要害怕／成為大族／同下同上（3-4節）\"]\n  D --> E[\"從別是巴起行，全家坐法老送來的車（5-7節）\"\
  ]\n  E --> F[\"名譜：同行六十六人、雅各家七十人（8-27節）\"]\n  F --> G[\"打發猶大先去請約瑟指路往歌珊（28節）\"]\n\
  \  G --> H[\"約瑟套車上歌珊，伏在父親頸項上哭了許久（29-30節）\"]\n  H --> I[\"豫先教家人回答法老：都以養牲畜為業（31-34節）\"\
  ]\n  I --> J[\"得住歌珊地，與埃及人聚居處相隔\"]\n```\n\n### 一、他為什麼要在別是巴獻祭？（1-4節）\n\n「別是巴」意為「**盟誓之井**」——**這名字本身就叫人想起神的應許**（KC）。這裡是亞伯拉罕求告耶和華永生神之處（21:33），也是以撒築壇之處（26:25）。\n\
  \n> [!note] 雅各的躊躇是有理由的\n> GT 丁良才列出他猶疑的五個緣故：①**亞伯拉罕下埃及曾冒大險**（12:10）；②**神曾明明禁止以撒下埃及**（26:2）；③**神應許把迦南地賜給他們和他們的後裔**；④**埃及是一個熱心拜偶像的國度**；⑤或許他也想起創15:13\
  \ 那個「你的後裔必寄居別人的地」的預言。\n>\n> 原文第1節在「獻祭」（וַיִּזְבַּח，H2076）後面接的是複數名詞「祭物」（זְבָחִים，H2077）。CT\
  \ 據此留意複數形態：**本節的「獻祭」是複數詞，表示他這個獻祭並不簡單，而是持續的獻上祭物，直到使神滿足為止**；並判斷「**或許雅各怕自己下埃及會錯，所以他藉此向神求問**」。KC：**在離開這地以前，他要先尊榮神；他彷彿是說：若沒有神與他同去的確據，他就不肯再往前一步。**\n\
  \n神在夜間的異象中回答他，並且連叫兩聲「雅各！雅各！」（如同「亞伯拉罕！亞伯拉罕！」創22:11、「摩西！摩西！」出3:4——**每一次都在極重大的時刻**，BH）。神宣告「我是神，就是你父親的神」（אָנֹכִי\
  \ הָאֵל אֱלֹהֵי אָבִיךָ；H595、H410、H430）；第4節「我要和你同下埃及去，也必定帶你上來」，原文連用兩次「我」（אָנֹכִי），且「必定帶你上來」重複「上去」的字根（וְאָנֹכִי\
  \ אַעַלְךָ גַם־עָלֹה，H5927），強烈宣告神引領同在的確定性。神說了四件事：\n\n| 神的話 | 意義 |\n|---|---|\n|\
  \ 「我是神，就是你父親的神」 | CT：**「我是神」表明祂負一切的責任；「你父親的神」表明祂必成就向以撒所作的應許** |\n| 「你下埃及去**不要害怕**」\
  \ | CT：**這證明雅各那時心中躕躇、畏懼** |\n| 「我必使你在那裡**成為大族**」 | GT《創世記雷氏研讀本》：耶和華要在埃及使他們從一個支派氏族擴展至一個大國（比較出1:7）\
  \ |\n| 「**我要和你同下埃及去，也必定帶你上來**」 | 見下 |\n\n> [!quote] 「也必定帶你上來」——這個「你」指誰？\n> 各家給的答案並不相同。CT\
  \ 說得最斬釘截鐵：此處「你」字**乃集合代名詞，並非指雅各個人，乃指他的全體後裔**；GT《串珠聖經註釋》同樣說「你」指雅各的後代，雅各乃是他們的代表。GT《聖經精讀本》則把兩面都算進去：**神從兩個方面成就了這約——雅各的骸骨將送回迦南地埋葬（50:13），以及雅各的後裔出埃及、征服迦南地。**\n\
  >\n> GT 賈斯樂郝威《聖經難解經文詮釋手冊》把「雅各終究死在埃及」列為一道難題（命題57），並給三種解答：①這個應許是針對雅各的後裔說的；②雅各可能經由約瑟而被帶出埃及，雖然他那時不是活著的（50:25；出13:19）；③雅各復活後將會回到應許之地（太8:11）。\n\
  >\n> 而「約瑟必給你送終」，原文直譯為「約瑟必把手放在你的眼睛上」（וְיוֹסֵף יָשִׁית יָדוֹ עַל־עֵינֶיךָ；H7896、H3027、H5869），也就是親手為父親闔上雙眼。CT\
  \ 說這裡的「你」是個人代名詞，暗示**雅各將至死和約瑟相離不遠**（50:1）。\n>\n> KC 另注意到神在此自稱「**你父親以撒的神**」：**這叫我們想起祂是復活的神。雅各是站在復活的根基、新生命的地位上往前走的。**\n\
  \n這段話不是一次孤立的顯現。GT《聖經精讀本》把它接回[[亞伯拉罕之約|神與族長所立的約]]：本章的移居**成就了火把之約（15:13-17）「要成了外邦人」的預言，也是出埃及事件的前奏**，並列出雅各家族移居埃及的四重意義——**在迦南各族中保持純潔性；從雅各家族轉變成以色列「國家」；選民經歷許多的苦難和試煉；通過將來的出埃及事件，體現救贖的意義。**精讀本並把時間標了出來：這是**亞伯拉罕蒙召215年之後，雅各130歲**。\n\
  \nGT 丁良才則從地理與目的兩面解釋神為何要他們下去：**埃及是最合式以色列人居住的國度，因為那裡有許多草地足供他們作牧場**；而神的用意有四——**要使雅各的後裔聯合為一；要使以色列人和拜偶像的人少有來往；要使他們多吸收埃及的文化；要使他們因受磨煉而越發親近神。**\n\
  \n### 二、名譜與那些數目（8-27節）\n\n名單按**四位母親**分四組：\n\n| 母親 | 節 | 人數 |\n|---|---|---|\n| 利亞（並女兒底拿）\
  \ | 8-15 | 三十三人 |\n| 悉帕（利亞的婢女） | 16-18 | 十六人 |\n| 拉結 | 19-22 | 十四人 |\n| 辟拉（拉結的婢女）\
  \ | 23-25 | 七人 |\n| **合計** | | **七十人** |\n\n第26節說「那與雅各同到埃及的，除了他兒婦之外，凡從他所生的，共有[[雅各家七十人與七十五人|六十六人]]」；第27節說「雅各家來到埃及的共有**七十人**」。CT\
  \ 與 GT 丁良才的算法一致：\n\n- 四組合計七十人；\n- 減去**已死在迦南的珥與俄南**、以及**已經在埃及的約瑟、瑪拿西、以法蓮**，再加上未計入\
  \ 15 節的**女兒底拿**——恰好**六十六人**（同行者）；\n- 六十六人再加上**雅各本人、約瑟、瑪拿西、以法蓮**——恰好**七十人**（雅各家）。\n\
  \n> [!note] 那麼徒7:14 的「七十五人」呢？\n> KC 說得直接：**兩個數字都對。**司提反（或路加）**根據的是七十士譯本（LXX）**；七十士譯本在第20節之後**增列了五個名字**——瑪拿西的一子一孫、以法蓮的二子一孫（參民26:28-37；代上7:14-20）。GT\
  \ 李道生《舊約聖經問題總解》數的方式略有出入：他記為瑪拿西的一個兒子瑪姬和一個孫子基列，並以法蓮的三個兒子書提拉、比結、他罕。GT《聖經精讀本》則不從名單增列著眼，說七十五人是「**七十人加上日後形成獨立家業的約瑟五個後代**」（50:23）。倪柝聲另提一解：徒7:14\
  \ 的「全家」原文是「親族」，範圍較廣。\n>\n> 同一個「七十」，三家讀出三種意思：CT 說「七十」在聖經裡是「**今世完全**」的數目（但9:24；太18:22）；GT《聖經精讀本》拆成兩個因數——「**7**」有關神的救贖、「**10**」有關人類完全發展；KC\
  \ 則從六十六那一頭看：**六是人的數字，人總是不及格，永遠達不到七所說的完全；當約瑟（主耶穌的圖畫）與他的兒子被加進來，六十六的不完全就變成了七十的完全。**\n\
  \n名單中兩個女性的出現（**女兒底拿**、**孫女西拉**）並不尋常——CT 的背景註解說，猶太人一般都只計算男丁人數（太14:21；15:38），但遇有特殊含意的事例時也往往提到女性（太1:3、5-6；徒1:13-14）。CT\
  \ 坦承這個算法有矛盾：15節不算底拿，18節卻算西拉；而雅各有那麼多男孫，不可能只有一個女孫——聖經本身未作解釋，只能猜測是為27節的「七十人」豫作安排。GT\
  \ 丁良才的推測不同：**底拿和西拉被提名，或者是因為她們沒有出嫁而且出名，雅各其餘的女兒和孫女大概都出了嫁。**\n\n這份名單也是[[十二支派起源|十二支派名單]]的起點。GT\
  \ 賈斯樂郝威在命題58 把本章、民數記26章與啟示錄7章三份名單並排，處理「以色列到底是十二支族還是十四支族」：雅各只有十二個兒子，但約瑟得了雙分（48:22），民26\
  \ 以瑪拿西和以法蓮取代約瑟支派；利未因職事是祭司、不得分地，散住在各支派的四十八座利未城裡；啟7 的名單則除去但支派、列入利未——每一份名單的作者都設法保住「十二」這個數目。\n\
  \n### 三、二十二年後的重逢（28-30節）\n\n雅各**打發[[猶大（雅各之子）|猶大]]先去**引路——原文動詞「引導／指教」（לְהוֹרוֹת，字根\
  \ יָרָה H3384）說明雅各派他去打前站、領路往歌珊。CT：**由此可見猶大在雅各和約瑟心目中的地位**；GT《聖經精讀本》把原因說得更具體：**看來猶大借著第二次埃及之行的言行（44:18-34），得到雅各的信任。猶大作為家族的全權代表，這件事意味深長，日後猶大家族成為以色列支派中繼承王權的家族（49:10）。**BH\
  \ 由此讀到更遠：這一幕預告了猶大支派的地位，大衛與「猶大支派中的獅子」（啟5:5）都由他而出。\n\n「[[約瑟]]套車往[[歌珊地|歌珊]]去，迎接他父親以色列；及至見了面，就伏在父親的頸項上，**哭了許久**」——「套車」原文（אָסַר\
  \ מֶרְכַּבְתּוֹ；H631、H4818）指的是備妥座車。CT 數過，**這是約瑟第四次哭，而且一次比一次久**（42:24；43:30；45:2、14-15）。GT《聖經精讀本》把時間補上：這是**父子在希伯崙分手後，過了二十二年又相逢**的場面，「不需更多的言語，只有深沉長久的哭聲才能傳達相逢的喜樂」。KC：**雅各渴望再見約瑟，約瑟也渴望再見父親——他上去迎接他。當我們往主那裡去的時候，我們會發現：祂也正在路上迎向我們。**\n\
  \n> [!quote] 「就是死我也甘心」\n> KC：**雅各所說的，叫我們想起西面抱著嬰孩耶穌時所說的話**（路2:25-30）。CT：**世人是「朝聞道，夕死可也」；我們信徒是「若得親眼看見救恩，也可安然去世」。**GT《聖經精讀本》讀出這句話的背面：**看來在見到約瑟之前，雅各內心肯定深藏約瑟之死留下的遺恨。**\n\
  >\n> KC 也提醒我們看約瑟的舉止：**他作為兒子，如何尊榮他的父親。兒女孝敬父母是本分（弗6:1-3），即使兒女的社會地位遠高於父母，這本分也不改變。**——不過雅各實際上還要在埃及活十七年（47:28）。\n\
  \n### 四、為什麼是歌珊？（31-34節）\n\n[[法老]]會問一個問題：「你們以何事為業？」KC 注意到，**這似乎是法老慣常會問來見他之人的問題**，所以約瑟豫先教家人怎麼回答：「你的僕人，從幼年直到如今，都以**養牲畜**為業。」CT\
  \ 說這是他**為父家的將來，豫先策劃應對之道**。\n\n歌珊地的好處，GT 丁良才數了五樣：**①地土肥美；②草地很多（他們多牧羊）；③離迦南地近（後來出埃及的時候就便當）；④離埃及人略遠（不惹埃及人的怒）；⑤離約瑟的住處近。**CT\
  \ 的背景註解則說明它的位置：歌珊「位於尼羅河出海的三角洲地帶，土地肥沃，是全埃及最好的畜牧用地」，且「該地自處一隅，易於和埃及人隔離；且距迦南地不遠，可謂是由埃及進入迦南地的大門口」。\n\
  \n而第34節那句「[[埃及人厭惡牧羊人|因為凡牧羊的都被埃及人所厭惡]]」，原文使用「埃及人的可憎之物」（תוֹעֲבַת מִצְרַיִם，H8441）來形容牧羊人（רֹעֵה\
  \ צֹאן；H7462、H6629）；各家提出的原因不一：\n\n| 提出者 | 原因 |\n|---|---|\n| GT《聖經精讀本》 | 傳統上以農業為主，對其他行業有排斥心理；認為牧人沒有教養、非常野蠻；曾被遊牧民攻擊過的被害意識；對牧人殺害他們認為神聖的動物產生輕蔑感\
  \ |\n| GT《啟導本聖經創世記註釋》 | 埃及以農立國，法老時代已有高度文明，看不起粗陋的遊牧生活 |\n| BH | 埃及主要是農耕社會，其宗教實踐又常涉及對動物的崇拜，這可能助長了對飼養牲畜者的反感\
  \ |\n| GT《舊約背景註釋》 | 提出限定：埃及**本地**的牧羊人大概不會被其他埃及人恨惡；約瑟的忠告另有外交作用 |\n\n精讀本並記下一個具體的線索：**「從埃及發掘的石碑上，牧羊人又瘦又高、飽經風霜，像病人一樣憔悴，甚至有的像幽靈。可能因這些緣故，埃及人厭惡牧羊人。」**經文本身只陳述「厭惡」這個事實，沒有指定單一原因。\n\
  \n> [!note] 為什麼這個策略行得通\n> CT 的背景註解指出當時[[喜克索王朝（Hyksos）背景|治理埃及的王朝]]的來歷：「**當時治理埃及的喜克索王朝，乃外來的牧羊民族，人稱其王為『牧羊王』。**」GT《靈修版聖經註釋》據此把約瑟的算計說明白：「**因為法老的祖先很可能是許克所斯人的遊牧民族，所以他或許會同情牧人，而埃及人絕不歡迎牧人住在他們中間。約瑟的策略奏效，雅各一家從法老的慷慨乃至埃及人所抱的成見中受益。**」\n\
  \n> [!note] 被世界厭惡，反而成了保護\n> CT：**約瑟如此安排父家的住處，除了為日後全族出埃及豫作打算，用意更在使他們避免和埃及人混雜來往，不至於隨從埃及人的惡俗。**GT《聖經精讀本》說得更直接：**神甚至可以利用埃及人的這種風俗，提供環境，使自己的百姓活出分別為聖的生活。**KC\
  \ 說得更透：**因著埃及人的厭惡，雅各家被分派到埃及地的一隅——這就攔阻了他們與埃及人混合。若與埃及人相混，他們就會失去自己的身分；如今他們仍分別出來，保住了民族與信仰的獨立。**\n\
  >\n> 而 KC 把它翻轉成一句刺人的話：**埃及人是世界的圖畫。對世界上的人來說，一個為神的榮耀而活的基督徒，正是「可厭惡的」。**\n\n### 關鍵神學點\n\
  \n1. **[[神的護理]]**：「我要和你同下埃及去，也必定帶你上來」——這是全章的軸心；下[[埃及]]不是離棄應許，而是應許的一段路（創15:13）。\n\
  2. **[[雅各家七十人與七十五人]]**：六十六／七十／七十五三個數字各有其計算範圍與文本傳統。\n3. **[[埃及人厭惡牧羊人]]**：一個看似不利的偏見，反而成了選民保持分別的屏障。\n\
  4. **獻祭與求問**：[[雅各]]在動身以前先停下來獻祭求問——**信心的行動，是從祭壇開始的。**\n\n### 背景補充：別是巴的獻祭、馬車與牧羊人的處境\n\
  \nGT《舊約背景註釋》為本章三處各補一條。\n\n**在別是巴獻祭有多罕見**：背景註釋指出「眾族長雖然多次築壇，聖經卻很少有他們獻祭的記錄」——在此以前唯一提過的一次，是雅各和拉班立約之時（創31:54）；以撒曾經在別是巴築壇（創26:25），但沒有在此獻祭的記錄。它並說明雅各為何選在這裡停下：他是乘南行之便到此朝聖，因為「這是他長大之處，也是他父親崇拜之聖所的所在地」。\n\
  \n**約瑟乘的馬車**：背景註釋指這個時代的埃及馬車是輕型的，材料是木和皮革，車輪只有兩輻；而法老所乘坐的華麗馬車（高官大臣無疑也有分）要到稍後的新王國時代才一再在藝術中出現。第29節「約瑟套車往歌珊去」用的是當時實際存在的輕便車制。至於第5節載雅各與婦孺下埃及的[[埃及車輛與遷徙|那批車輛]]，BH\
  \ 指出車輛在當時是一種奢侈品，法老送車既反映約瑟在埃及的地位，也是給雅各的尊榮。\n\n**牧羊人為何被厭惡**：背景註釋提出一個重要的修正——「埃及本地的牧羊人大概不會被其他埃及人恨惡」。因此約瑟給父親的忠告（第34節要他們自稱是牧養牲畜的人）另有作用：一方面警告他埃及人有排外態度，另一方面表示自己一家能夠獨立自足（羊群足以供應所需），並且顯出他們「沒有野心要擺脫放牧生涯以從事其他行業」——背景註釋稱這「也是外交上的手段」。"
