book: 創世記
chapter: 46
updates:
- title: 雅各
  path: link_folder/人物/雅各.md
  summary: 雅各帶著一切所有的來到別是巴，獻祭給他父親以撒的神；夜間神在異象中連叫兩聲「雅各，雅各」，應許同下埃及、必定帶他上來，並使他在那裡成為大族（1-4節）。他從別是巴起行，全家坐法老送來的車下埃及（5-7節），最後在歌珊與約瑟重逢，說「我既得見你的面，知道你還在，就是死我也甘心」（29-30節）。
  relation: CT 指出第1節的「獻祭」在原文是複數詞，「表示他這個獻祭並不簡單，而是持續的獻上祭物，直到使神滿足為止」，並判斷「或許雅各怕自己下埃及會錯，所以他藉此向神求問」；神說「不要害怕」，正反證了他心中確實在害怕。GT 丁良才列出他猶疑的五個緣故：亞伯拉罕下埃及曾冒險（12:10）、神曾禁止以撒下埃及（26:2）、神已應許把迦南地賜給他們的後裔、埃及是熱心拜偶像的國度，以及創15:13 的預言。GT《聖經精讀本》另記下時間：這是亞伯拉罕蒙召215年之後，雅各130歲。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 約瑟
  path: link_folder/人物/約瑟.md
  summary: 約瑟套車往歌珊迎接父親，「及至見了面，就伏在父親的頸項上，哭了許久」（29節）；他又對弟兄和父的全家豫先策劃，教他們如何回答法老「你們以何事為業」的問話，好得住在歌珊地（31-34節）。
  relation: CT 數過這是約瑟第四次哭，而且一次比一次久（42:24；43:30；45:2、14-15），並指出他這番教導「是為父家的將來，豫先策劃應對之道」。KC 注意到相向而行的兩端：雅各渴望再見約瑟，約瑟也渴望再見父親——他上去迎接他；KC 並說約瑟作為兒子如何尊榮父親，即使兒女的社會地位遠高於父母，孝敬的本分也不改變（弗6:1-3）。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 猶大（雅各之子）
  path: link_folder/人物/猶大（雅各之子）.md
  summary: 雅各打發猶大先去見約瑟，請派人引路往歌珊去；於是他們來到歌珊地（28節）。
  relation: CT 說「由此可見猶大在雅各和約瑟心目中的地位」。GT《聖經精讀本》把原因說得更具體：「看來猶大借著第二次埃及之行的言行（44:18-34），得到雅各的信任。猶大作為家族的全權代表，這件事意味深長，日後猶大家族成為以色列支派中繼承王權的家族（49:10）。」BH 由此讀到更遠：這一幕預告了猶大支派的地位，大衛與「猶大支派中的獅子」（啟5:5）都由他而出。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 法老
  path: link_folder/人物/法老.md
  summary: 法老先前送來的車輛載著雅各與婦孺從別是巴下埃及（5節）；約瑟豫備上去向法老報告全家到來，並教家人在被問「你們以何事為業」時回答世代以養牲畜為業（31-34節）。
  relation: CT 的背景註解指出「當時治理埃及的喜克索王朝，乃外來的牧羊民族，人稱其王為『牧羊王』」；GT《靈修版聖經註釋》據此解釋約瑟的策略為何奏效——法老的祖先很可能是許克所斯人的遊牧民族，或許會同情牧人。KC 則注意到「你們以何事為業」似乎是法老慣常會問來見他之人的問題，約瑟因此先為家人作預備。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 別是巴
  path: link_folder/地點/別是巴.md
  summary: 以色列帶著一切所有的起身來到別是巴，獻祭給他父親以撒的神，並在此於夜間領受神准他下埃及的異象；他隨後從別是巴起行（1-5節）。
  relation: CT 指出別是巴靠近迦南地的邊界，亞伯拉罕和以撒曾分別在該地求告神（21:33；26:25）。GT《舊約背景註釋》補上這次獻祭的罕見度：「眾族長雖然多次築壇，聖經卻很少有他們獻祭的記錄」——在此以前唯一提過的一次是雅各和拉班立約之時（31:54）；以撒曾在別是巴築壇，卻沒有在此獻祭的記錄。它並說明雅各為何選在這裡停下：他是乘南行之便到此朝聖，因為「這是他長大之處，也是他父親崇拜之聖所的所在地」。KC 另指出這名字的意思是「盟誓之井」，叫人想起神的應許。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 埃及
  path: link_folder/地點/埃及.md
  summary: 神應許與雅各同下埃及，「我必使你在那裡成為大族」（3-4節）；雅各家來到埃及的共有七十人（27節），約瑟的兩個兒子瑪拿西與以法蓮則生在埃及地（20節）。
  relation: GT 丁良才指出埃及「是最合式以色列人居住的國度，因為那裡有許多草地足供他們作牧場」，並列出神使以色列人下埃及的四層用意：要使雅各的後裔聯合為一、要使以色列人和拜偶像的人少有來往、要使他們多吸收埃及的文化、要使他們因受磨煉而越發親近神。GT《聖經精讀本》則把這次移居連到火把之約：這件事成就了創15:13-17「要成了外邦人」的預言，也是出埃及事件的前奏。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 他們帶著迦南地所得的牲畜、貨財來到埃及（6節）；猶大的兒子珥與俄南死在迦南地（12節）；約瑟要對法老說「我的弟兄和我父的全家，從前在迦南地，現今都到我這裡來了」（31節）。
  relation: 離開迦南並沒有取消土地應許。神在第4節說「也必定帶你上來」——CT 讀這個「你」為集合代名詞，「並非指雅各個人，乃指他的全體後裔」；GT《串珠聖經註釋》同樣說「你」指雅各的後代，雅各乃是他們的代表；GT《聖經精讀本》則說神從兩方面成就這約：雅各的骸骨送回迦南地埋葬（50:13），以及後裔出埃及、征服迦南地。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 神的護理
  path: link_folder/神學/神的護理.md
  summary: 神在夜間異象中親自准許雅各下埃及，應許同行、使他成為大族、必定帶他上來，並說「約瑟必給你送終」（2-4節）；約瑟則在歌珊接應，並安排全家的居處（28-34節）。
  relation: 神的應許沒有繞過雅各的躊躇，而是在他獻祭求問之後才臨到。GT《聖經精讀本》把這次移居讀成救贖史的一步：它成就了火把之約（15:13-17）「要成了外邦人」的預言，也是出埃及事件的前奏，並列出雅各家族移居埃及的四重意義——在迦南各族中保持純潔性、從雅各家族轉變成以色列「國家」、選民經歷許多的苦難和試煉、通過將來的出埃及事件體現救贖的意義。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 埃及車輛與遷徙
  path: link_folder/文化/埃及車輛與遷徙.md
  summary: 以色列的兒子們使他們的父親雅各和他們的妻子、兒女都坐在法老為雅各送來的車上，從別是巴前往埃及（5節）；約瑟也是套車上歌珊迎接父親（29節）。
  relation: BH 指出車輛在當時是一種奢侈品，法老送車既反映約瑟在埃及的地位，也是給雅各的尊榮。GT《舊約背景註釋》另描述同時代的實物：「這個時代的埃及馬車是輕型的，材料是木和皮革，車輪只有兩輻」，而法老所乘坐的華麗馬車（高官大臣無疑也有分）要到稍後的新王國時代才一再在藝術中出現。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 亞伯拉罕之約
  path: link_folder/神學/亞伯拉罕之約.md
  summary: 雅各在別是巴「獻祭給他父親以撒的神」（1節）；神在夜間異象中自稱「我是神，就是你父親的神」，應許「我必使你在那裡成為大族」與「我要和你同下埃及去，也必定帶你上來」（3-4節）。
  relation: GT《啟導本聖經創世記註釋》指神在這裡向雅各重申祂向亞伯拉罕和以撒立約的應許。GT《聖經精讀本》把這次移居直接連到火把之約：它成就了創15:13-17「要成了外邦人」的預言，也是出埃及事件的前奏。BH 同樣指出「我必使你在那裡成為大族」重申了創12:2 給亞伯拉罕的應許，而「在那裡」這個字說明神的計畫與賜福並不限於迦南這塊地。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 喜克索王朝（Hyksos）背景
  path: link_folder/歷史/喜克索王朝（Hyksos）背景.md
  summary: 約瑟教家人向法老自稱世代以養牲畜為業，好得住在歌珊地（31-34節）。CT 在第32節的背景註解裡說明當時的王朝：「當時治理埃及的喜克索王朝，乃外來的牧羊民族，人稱其王為『牧羊王』。」
  relation: 這個背景解釋了約瑟的策略為何行得通。GT《靈修版聖經註釋》說：「因為法老的祖先很可能是許克所斯人的遊牧民族，所以他或許會同情牧人，而埃及人絕不歡迎牧人住在他們中間。約瑟的策略奏效，雅各一家從法老的慷慨乃至埃及人所抱的成見中受益。」同一個牧羊身分，在王室那裡是親近的理由，在埃及民間卻是被厭惡的理由。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
- title: 十二支派起源
  path: link_folder/神學/十二支派起源.md
  summary: 8-27節按四位母親分組列出隨雅各下埃及的名譜：利亞三十三人、悉帕十六人、拉結十四人、辟拉七人，合為七十人。
  relation: GT《聖經精讀本》指出這份名單的焦點不是「出生地」而是「以色列國家的形成」——名單上的名字並不只指迦南地出生的人，也包括在埃及出生的；從摩西時代回頭看，雅各的兒子、孫子、曾孫或是各支派的創立者，或是獨立部落的族長（民26章）。GT 賈斯樂郝威《聖經難解經文詮釋手冊》在命題58 把本章、民26 與啟7 三份名單並排，處理「十二支族或十四支族」的問題：約瑟得了雙分（48:22），民26 以瑪拿西和以法蓮取代約瑟支派；利未因職事是祭司、不得分地，散住在各支派的四十八座利未城；啟7 的名單則除去但支派、列入利未。
  sources: [CT, GT, KC, BH]
  source_files: [raw_data/ccbiblestudy_CT_genesis_46.txt, raw_data/ccbiblestudy_GT_genesis_46.txt, raw_data/kingcomments_genesis_46.txt, raw_data/biblehub_study_genesis_46.txt]
