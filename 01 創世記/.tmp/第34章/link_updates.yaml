- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: '創世記第34章中，迦南地作為事件背景：雅各全家居住示劍（迦南中部），底拿出去見「那地的女子」（1節），示劍為「那地的主」（2節），哈抹邀雅各「同住、做買賣、置產業」（10節），雅各擔心「在迦南人和比利洗人中有了臭名」（30節）。BH指迦南地是神應許亞伯拉罕之地（創12:7），並在第21節下說明這地「是貿易路線的交會處，商業位置極具戰略性」。CT讀哈抹的邀請（10節）為「邀請長居，不再作寄居者；這是許多寄居的人所求之不得的事」，並提醒「信徒在世上是客旅，是寄居的（來十一13）」。KC說得更重：如此一來迦南地就成了「仇敵送給雅各與其後裔的禮物」，而不是照神的應許所領受的地。'
  relation: '本章展示聖約族群在應許之地面對迦南文化滲透的屬靈爭戰：雅各久居示劍（創33:18）未上伯特利，導致家庭邊界模糊，底拿事件成為神管教雅各回歸伯特利（創35:1）的催化劑。'
