- title: 利未
  path: link_folder/人物/利未.md
  summary: '創世記第34章中，利未作為底拿同母哥哥，與西緬共同策劃執行屠城報復：設計割禮詭計（13-17節），第三日趁男丁疼痛殺盡全城（25-26節），並參與擄掠（27-29節）。對父親責備同聲辯護：「他豈可待我們妹子如同妓女」（31節）。CT說二子是「憑血氣的力量，來除掉恥辱」，並指其行動「包含著背信和毀約」；KC的說法是「詭詐之後接著是暴力」，並強調兒子們的行為一面是雅各的過失、另一面他們自己要完全負責。GT《聖經精讀本》記雅各「在臨終前指責他們的殘忍，咒詛他們『分居』和『散住』（49:5-7）」。'
  relation: '本章為利未生平的決定性事件：以暴力報復取代神的公義。四份來源在此一致，且都把後果指向雅各臨終的咒詛——後裔分居散住（創49:5-7）。'
