book: 創世記
chapter: 6
updates:
- title: 挪亞
  path: link_folder/人物/挪亞.md
  summary: 挪亞在普世敗壞中「尋得」恩惠（מָצָא／חֵן），又被稱為義人（צַדִּיק）、完全人（תָּמִים）並與神同行；神向他宣告洪水，命他造方舟保存家人與各類活物。
  relation: 第6章使挪亞成為審判與救恩敘事的中心；第22節前後重複「行／作」（עָשָׂה），強調他照神一切吩咐而行。註釋與來11:7再把這項長期順服理解為信心的果子。
- title: 閃
  path: link_folder/人物/閃.md
  summary: 閃是挪亞三子之一，在洪水前與含、雅弗一同被列名，並將隨父母進入方舟。
  relation: 第6章把閃置於神藉挪亞保存人類的家庭中，為洪水後從閃延續至亞伯拉罕的家譜預作準備。
- title: 含
  path: link_folder/人物/含.md
  summary: 含是挪亞三子之一，與閃、雅弗同屬洪水中蒙保存的家庭。
  relation: 本章只簡要列出含，重點在於神的救恩不僅保守挪亞個人，也把他的兒子及兒婦包括在方舟之約的安排中。
- title: 雅弗
  path: link_folder/人物/雅弗.md
  summary: 雅弗是挪亞三子之一，與閃、含一同被神納入進方舟、保存生命的安排。
  relation: 第6章把雅弗列入洪水後新世界的人類祖先；他與兄弟的出現連接第5章家譜與第10章列國分布。
- title: 偉人
  path: link_folder/人物/偉人.md
  summary: 創世記6章4節使用 הַנְּפִלִים（H5303，「Nephilim」），又稱上古英武者為 הַגִּבֹּרִים（H1368）；來源再進一步討論他們是否是巨人、古代強權人物，以及與神的兒子和人的女子有何關係。
  relation: 本章先陳明拿非林當時在地上，接著記神的兒子與人的女子生子；各家按這個次序提出不同身分解釋，條目並列保存其語源、時序與跨經文理由。
- title: 人的全面敗壞
  path: link_folder/神學/人的全面敗壞.md
  summary: 第6章以 יֵצֶר（H3336，傾向／意念）、מַחְשְׁבֹת（H4284，思想／計謀）與「心」描寫人的內在，又以敗壞的行為和滿地強暴描述外在世界。
  relation: STEP 先顯示內在意念、思想和社會強暴的實際用詞；註釋再由這幅既深且廣的敗壞圖景，討論持續的罪性與完全墮落教義。
- title: 神的後悔與憂傷
  path: link_folder/神學/神的後悔與憂傷.md
  summary: 第6節以 וַיִּנָּחֶם（H5162H，「他後悔／遺憾」）和 וַיִּתְעַצֵּב（H6087A，「他感到痛苦」）並列，表達神看見人的敗壞時心中的悲痛。
  relation: STEP 可確認「後悔」與「痛苦」的詞形；各家註釋進一步以擬人化語言和神治理中的處置轉變來解釋這段經文，同時把神的本性與旨意仍然信實並列說明。
- title: 恩典的首次出現
  path: link_folder/神學/恩典的首次出現.md
  summary: 第6章8節以 מָצָא（H4672，「尋得」）配合 חֵן（H2580，「恩惠／恩寵」），說挪亞在耶和華眼前蒙恩；雷氏研讀本與BH進一步指出這是聖經首次提到恩典。
  relation: STEP 界定「蒙恩」的詞形與本節語義，註釋則從普世審判的背景發展恩典神學：挪亞得救的根源在神的恩待，他的義與順服顯明恩典在生命中的結果。
- title: 義人與完全人
  path: link_folder/神學/義人與完全人.md
  summary: 第6章9節以 צַדִּיק（H6662，「公義的」）、תָּמִים（H8549H，「純全／無可指摘的」）和「與神同行」三方面描寫挪亞。
  relation: STEP 可確認三個實際用詞；CT、GT、KC與BH再從因信稱義、對神專一和正直無虧等角度，描寫敗壞世代中蒙恩者的整全見證。
- title: 方舟的豫表
  path: link_folder/神學/方舟的豫表.md
  summary: 第6章14節使用 תֵּבָה（H8392，「方舟」）、קִנִּים（H7064，「巢／隔間」），並以動詞「遮蓋」和名詞「松香」描述裡外防水；來源再把方舟理解為審判中的遮蔽與拯救預表。
  relation: STEP 可確認方舟、隔間、遮蓋與松香的語言資料；CT、KC與BH進一步將這些細節連於基督的救贖、遮蓋和信徒在基督裡的安全。
- title: 挪亞之約
  path: link_folder/神學/挪亞之約.md
  summary: 第6章18節以 וַהֲקִמֹתִי（H6965I，「我要堅立」）和 בְּרִיתִי（H1285，「我的約」）宣告神與挪亞立約，使他與妻子、兒子和兒婦進入方舟。
  relation: STEP 可確認「堅立我的約」的詞形；註釋進一步指出第6章是挪亞之約的宣告階段，重點在審判臨到以前神主動設立拯救安排，第9章才展開約的記號與洪水後應許。
- title: 強暴
  path: link_folder/主題/強暴.md
  summary: 第6章11、13節兩次以 חָמָס（H2555，單數名詞「強暴」）描述全地；來源再從社會脈絡說明其暴力、壓迫、流血和無法無天的面向。
  relation: STEP 界定本節用詞，各家註釋進一步指出強暴是內在邪惡化為社會行動的表現，也是神向挪亞說明洪水審判的直接理由。
- title: 歌斐木
  path: link_folder/背景/歌斐木.md
  summary: 第6章14節以 עֲצֵי（H6086G，「木材」）和 גֹפֶר（H1613，gopher）稱方舟木料；各家註釋再提出柏木、絲柏、香柏或雪松等可能樹種。
  relation: STEP 保留這個罕見材料名稱；註釋則依古代造船與木材背景討論其耐久性，並把它與裡外抹松香的防水安排連在一起。
- title: 神的兒子們
  path: link_folder/解經爭議/神的兒子們.md
  summary: 第6章2節以 בְנֵי־（H1121I，複數構造式）連接「神」，又用 לָקַח（H3947I，本節作「娶」）和 בָּחַר（H977，「選擇」）描述娶妻；註釋主要提出墮落天使、塞特後裔與古代君王三種身分解釋。
  relation: STEP 先界定句中的名詞結構與婚配動詞；CT、GT、KC與BH再依約伯記、猶大書、家譜上下文及古代近東王權背景，分別發展三種解釋。
