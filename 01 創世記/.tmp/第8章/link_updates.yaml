book: 創世記
chapter: 8
updates:
- title: 亞拉臘山
  path: link_folder/地點/亞拉臘山.md
  summary: 創8:4以「山」的複數構造式 הָרֵי（H2022G）連接地名 אֲרָרָט（H780），說方舟在亞拉臘眾山停住。
  relation: STEP先確認「亞拉臘眾山」的實際詞形；註釋再把它理解為古烏拉爾圖山區，而非只限定今日單一山峰。
- title: 神的記念
  path: link_folder/神學/神的記念.md
  summary: 創8:1以 וַיִּזְכֹּר（H2142，Qal）說神記念挪亞、方舟裡的一切活物和牲畜，隨即使風吹地、水勢消退。
  relation: STEP呈現「記念」及其後續行動；註釋進一步理解為神按承諾顧念並施恩，使審判走向終止。
- title: 三一神同工
  path: link_folder/神學/三一神同工.md
  summary: 神使風吹地、止住水源並帶挪亞進入新造；來源以神、風與方舟救恩整理神工作的不同層面。
  relation: 本章的靈意整理將父的記念、靈的運行與基督所預表的方舟連於同一救恩進程。
- title: 審判已過
  path: link_folder/神學/審判已過.md
  summary: STEP依次記水「消退」שָׁכַךְ、泉源與天窗被關閉、雨被止住，水又持續退回並減少，直到山頂顯露。
  relation: 這組退水動詞先呈現洪水逐步終止的過程；註釋再由此發展審判轉向恢復的主題。
- title: 信心與忍耐
  path: link_folder/神學/信心與忍耐.md
  summary: 創8:10、12兩次明記挪亞再等七天；地面乾後，他仍等到神以命令式 צֵא（H3318G）吩咐才出方舟。
  relation: STEP先呈現等候日數與出舟命令；註釋再由挪亞在已有跡象後仍等候，發展信心與忍耐的教訓。
- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: 烏鴉飛來飛去，鴿子因找不到落腳處返回；挪亞出方舟後從潔淨牲畜與飛鳥中取祭物。
  relation: 本章把洪水前的分類延伸到獻祭，顯出潔淨牲畜較多數量與敬拜用途的關聯。
- title: 新造與新生活
  path: link_folder/神學/新造與新生活.md
  summary: 創8:16-17以「出去」צֵא、使動式「帶出」הַיְצֵא吩咐挪亞，又以 שָׁרַץ、פָּרָה、רָבָה命活物滋生、繁衍、增多。
  relation: STEP先呈現出舟與繁衍的命令；註釋再把這組用語與創1章相照，理解為洪水後的新造開端。
- title: 馨香之氣
  path: link_folder/神學/馨香之氣.md
  summary: 創8:21的「馨香之氣」由 רֵיחַ（H7381，氣味／香氣）與 נִיחֹחַ（H5207，舒暢、悅納的）組成。
  relation: STEP確認雙字結構；註釋進一步以擬人化語言解作祭物蒙悅納，並連於基督完全的獻上。
- title: 神的恩典之約
  path: link_folder/神學/神的恩典之約.md
  summary: 創8:21兩次使用 אֹסִף（H3254G，「再／重複」），應許不再咒詛地，也不再照此次所行的擊打 נָכָה（H5221）各種活物。
  relation: STEP先呈現應許的實際動詞；註釋再指出這應許發生在人心仍傾向惡的現實中，彰顯神主動施恩。
- title: 無條件之約
  path: link_folder/神學/無條件之約.md
  summary: 地還存留時，稼穡、寒暑、冬夏、晝夜就永不停息。
  relation: 此應許由神單方面宣告，維持受造秩序，並在第9章挪亞之約中進一步明確化。
- title: 方舟的豫表
  path: link_folder/神學/方舟的豫表.md
  summary: 方舟經過洪水後停在亞拉臘山地，所保存的人與活物最終按神命令出來。
  relation: 第8章使方舟預表從審判中的遮蔽推進到經過審判、進入新生活的救恩圖像。
- title: 橄欖葉子
  path: link_folder/主題/橄欖葉子.md
  summary: 創8:11以 עֲלֵה（H5929，「葉」）和 זַיִת（H2132H，「橄欖」）稱橄欖葉，並用 טָרָף（H2965）形容它是新摘下的。
  relation: STEP先確認葉子的種類與狀態；註釋再將它理解為生命恢復、新造應許和後來的和平象徵。
- title: 乾的兩個希伯來字
  path: link_folder/原文/乾的兩個希伯來字.md
  summary: 創8:13兩次用 חָרְבוּ（H2717A）說水乾退、地面已乾；8:14則用 יָבְשָׁה（H3001）說地已乾燥。
  relation: STEP確認兩個不同詞形；註釋按上下文進一步區分地面無積水與土地乾透，說明挪亞仍需等候神命令。
- title: 風與靈同字
  path: link_folder/原文/風與靈同字.md
  summary: 創8:1使用 רוּחַ（ruach，H7307H）；STEP在本句給「風」的語境義，簡要義域也包括氣息與靈。
  relation: STEP先界定本句的風；註釋再與創1:2同字的「神的靈」相照，發展洪水後新創造的理解。
- title: 基督復活預表
  path: link_folder/互文/基督復活預表.md
  summary: 方舟停在山上的日期被來源連於逾越節後的復活日期，作為經過審判而進入新生命的預表。
  relation: 此為基督教預表式閱讀，重點在方舟經過死亡之水後停穩，不等於經文明說日期對照。
- title: 創一章與創八章的對照
  path: link_folder/互文/創一章與創八章的對照.md
  summary: 神使風吹水退、旱地再現、活物出來繁衍，與創世記1章水中顯出旱地及生物繁殖相呼應。
  relation: 平行結構把洪水後世界描繪為新創造，同時保留人心仍然懷惡的張力。
- title: 古代近東洪水故事中的放鳥情節
  path: link_folder/背景/古代近東洪水故事中的放鳥情節.md
  summary: 古代近東若干洪水傳說也記放鳥探查水退，創世記則以烏鴉、三次放鴿及神命令構成獨特敘事。
  relation: 比較材料顯示共同古代背景，但創世記把焦點放在神的記念、挪亞的等候與盟約秩序。
- title: 神是否暫時忘記了挪亞
  path: link_folder/解經爭議/神是否暫時忘記了挪亞.md
  summary: 「神記念挪亞」不表示神曾失憶，而是盟約語言，表示神開始按承諾介入並施行拯救。
  relation: 本章由神記念轉入水退，說明這句話描述行動的轉折，不是神知識狀態的改變。
- title: 神是否改變心意
  path: link_folder/解經爭議/神是否改變心意.md
  summary: 神先因罪審判世界，後應許不再以同樣方式滅盡活物；兩者都正視人心從小懷惡。
  relation: 改變的是神在救贖歷史中的處置階段，不是祂的聖潔、全知或道德旨意反覆不定。
- title: 挪亞之約
  path: link_folder/神學/挪亞之約.md
  summary: 創8:21-22記耶和華在心裡宣告不再照此次洪水擊打各種活物，並使播種收割、寒暑、冬夏、晝夜不止息。
  relation: STEP先呈現世界保存應許的動詞與成對名詞；第9章再向挪亞、後裔和活物正式宣告約並賜下虹的記號。
- title: 人的全面敗壞
  path: link_folder/神學/人的全面敗壞.md
  summary: 創8:21以 יֵצֶר（H3336，傾向／意念）、לֵב（H3820A，心）、רַע（H7451H，惡）和 מִנְּעֻרָיו（H5271A，從幼年）描述人心。
  relation: STEP先呈現人心傾向惡的用詞；註釋再與創6章相照，討論洪水後罪性的延續與神保存世界的恩典。
- title: 祭壇敬拜
  path: link_folder/神學/祭壇敬拜.md
  summary: 創8:20以 מִזְבֵּחַ（H4196）稱挪亞為耶和華所築的壇，並記他取潔淨牲畜與飛鳥獻祭。
  relation: STEP先確認壇與獻祭動詞；註釋再指出這是聖經首次明用「壇」一詞，並把蒙拯救後的新生活連於敬拜。
- title: 洪水與洗禮的豫表
  path: link_folder/互文/洪水與洗禮的豫表.md
  summary: 洪水退去後，挪亞一家按神命令離開方舟，進入重新顯露的土地，開始繁衍的新生活。
  relation: 彼前3:20-21把一家八口藉水得救連於洗禮；CT與KC據此把出方舟解作與基督同死同復活、行在生命新樣中。
- title: 洪水全程時間軸
  path: link_folder/背景/洪水全程時間軸.md
  summary: 本章明記七月十七日方舟停靠、十月初一山頂顯露、四十天與兩次七天的間隔、次年正月初一地面乾及二月二十七日地全乾。
  relation: STEP確認各日期與日數詞形；GT的371日及377日則是依是否包括進舟前七天與首尾計日所作的重建。
- title: 四十天降雨與一百五十天水勢
  path: link_folder/解經爭議/四十天降雨與一百五十天水勢.md
  summary: 創8:3以 חֲמִשִּׁים（H2572）加 וּמְאַת（H3967）重述一百五十天，說到這段日數末了水勢減弱。
  relation: STEP先確認兩個數詞與退水語境；註釋再把它與7:12的四十天降雨區分為不同階段。
