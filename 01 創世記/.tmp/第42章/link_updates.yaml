- title: 亞伯拉罕之約
  path: link_folder/神學/亞伯拉罕之約.md
  summary: "迦南的饑荒把雅各一家推向埃及。GT《聖經精讀本》就第2節「你們可以下去」指出：埃及積蓄的糧食把雅各的兒子們吸引到那裡，「這是神以前應許的部分（創15:13）——立約百姓要在外邦地受四百年的苦難，預言現在開始漸漸成就」。它並提醒，被應許承受迦南地為業的三代族長，在有生之年都因饑荒受過苦（創12:10；26:1）——這說明地上的迦南是不完全的，是經受考驗和試煉的地方。丁良才、CT 同記三位信心的祖宗都在迦南遭遇過饑荒。"
  relation: "本章看似只是一次買糧的行程，實際上是約的下一步：神藉饑荒把立約的家族領往寄居之地。精讀本因此稱這場饑荒是「神把他們領進埃及的邀請函」，而約瑟在埃及積糧也不只是為了法老——「神始終關心迦南地的雅各家族，在約瑟背後主管一切，要把選民引領到埃及，直到迦南地的罪惡滿盈」（創15:16）。創15:13 所預告的寄居與受苦，就從這一趟下埃及開始。"
