organization: "多坍事件（創37:17-28）之後，聖經有二十年沒有再談雅各一家。KC 讀出這沉默的意義：**「他們犯罪之後，約瑟又不在他們中間，我對他們就無話可說了。」**——這正是以色列棄絕主耶穌之後的歷史；他們暫時成了「羅‧阿米」（非我民，何1:9），但神並沒有忘記他們，祂只是**在等候合宜的時機**，而這時機必與那位真約瑟相連。\n\
  \n如今饑荒把他們趕到約瑟腳前。**神用飢餓把浪子趕回家**（路15:17-18）。GT《聖經精讀本》為這一幕標出時間：這是約瑟擔任宰相的第八年，七個大豐年剛剛結束（創41:53），前所未有的饑荒降臨；雅各當時約一百二十九歲。它並把這場饑荒放進更大的線索裡：三代族長都在有生之年因饑荒受過苦（創12:10；26:1）——地上的迦南是不完全的，是經受考驗和試煉的地方；而[[亞伯拉罕之約|這場饑荒正是神把他們領進埃及的邀請函]]，是創15:13「立約百姓要在外邦地受苦」的預言開始成就。\n\
  \n### 經文大綱\n\n1. **雅各差遣十子下埃及糴糧**（1-5節）\n2. **十個哥哥向約瑟下拜，卻不認得他**（6-8節）\n3. **約瑟指控他們是奸細，下在監裡三天**（9-17節）\n\
  4. **留西緬作人質，釋放其餘九人**（18-25節）\n5. **回迦南向雅各報告**（26-34節）\n6. **雅各不容便雅憫下去**（35-38節）\n\
  \n### 一、「你們為什麼彼此觀望呢？」（1-5節）\n\n兒子們坐著彼此觀望、卻不去尋糧——丁良才推想：**或許是因為他們的良心有虧**（創37:25-28，當年正是在埃及商隊面前賣了約瑟）。CT\
  \ 由此發出三問：\n\n> [!note] 信心的道路並非一帆風順\n> CT：**①亞伯拉罕、以撒、雅各三位信心的祖宗，在迦南地都遭遇過饑荒。②迦南地沒有糧，埃及地反而有糧——許多時候，信徒忠心站住地位，反而缺乏屬世的祝福，但這正是考驗我們信心的時候。③信徒明知可以從神的話中得著生命的供應，卻很少人愛讀聖經，而喜歡「彼此觀望」，當作新聞說說聽聽**（徒17:21）。\n\
  \n為什麼十個哥哥全都下去？GT《聖經精讀本》給了兩個實際的理由：一是考慮曠野路途的危險，二是「埃及的糧食可能按人頭定量出售，想一次能多買些糧食」。GT《靈修版聖經註釋》則說明穀物為何如此要緊：各地皆以穀物作糧食，幾乎人人靠它維生，「它可以曬乾收藏，比蔬菜、乳酪製品、肉類等更能長久保存」，所以穀類極其重要，人有時甚至把它當作錢幣來使用。\n\
  \n  雅各不打發[[便雅憫]]同去，「恐怕他遭害」——KC 一針見血：**雅各了解他的兒子們。他對他們關於約瑟的說法，恐怕心裡一直存疑；也許他們為了保全自己，連便雅憫也會犧牲。**\n\
  \n第5節的用字值得留意：第1節說是「**雅各**」打發，本節卻說「**以色列**的兒子們」來糴糧。KC：**他們雖然混在「來糴糧的人」中間、不再有列國中特殊的地位，聖靈仍以「以色列的兒子們」保留他們因信而有的分別。**\n\
  \n### 二、夢應驗了（6-8節）\n\n「約瑟的哥哥們來了，**臉伏於地，向他下拜**」——[[約瑟的夢（應驗）|二十年前那個被他們恨惡的夢，就在他們不知不覺中應驗了]]（創37:7,10）。GT\
  \ 指出：**他們曾以為賣掉約瑟就能破碎他的夢（37:19-20），神卻偏偏用這件事成就那夢。**\n\nSTEP 原文顯示此處有極為生動的詞彙對照：第7節約瑟「認得」（וַיַּכִּרֵם）哥哥們，卻向他們「裝作生人」（וַיִּתְנַכֵּר）；第8節再次強調「約瑟認得（וַיַּכֵּר）他哥哥們，他們卻不認得（לֹא\
  \ הִכִּרֻהוּ）他」。兩詞皆源自同一字根 נָכַר（H5234），以 Hiphil（認得）與 Hithpael（偽裝／裝作生人）形成精妙的敘事對比。\n\
  \n哥哥們認不出約瑟，CT、GT 與 BH 列出的理由大致相同：①二十多年未見；②約瑟從十七歲少年變成中年人；③他剃頭刮臉、作埃及人打扮；④問答都經[[通事（傳譯員）|通事]]傳話；⑤他們作夢也想不到被賣的弟弟會作宰相。GT《聖經精讀本》另加一項：他們在那位「那地的主」面前，根本不能正眼看他。\n\
  \n> [!quote] 他認得我們，我們卻不認得祂\n> CT：「約瑟認得他哥哥們，他們卻不認得他」——**許多基督徒乃是「人云亦云，人拜亦拜」，並不真正認得所拜的是誰，只是想從所拜的主得到些好處而已。真實的敬拜，必須是出於對主有真實的認識**（約4:24）。\n\
  \n這裡有一個經文沒有回答、來源卻正面處理的問題：約瑟已作宰相七年，為什麼始終沒有與迦南的家人聯絡？GT《聖經精讀本》提出兩個可能：一是他確信到了時候，自己的夢必然照神美善的旨意成就，因此在耐心等候；二是他怕以這樣高的職位與他們相會，恐怕嚇壞眾兄長，反而給雙方的和好帶來諸多不便。\n\
  \n  便雅憫此時幾歲，來源也給了不同的數字：GT《聖經精讀本》說「大概22歲」，丁良才說「有二十多歲，已經娶妻生子」，CT 則說他「此時已經成年，且已生了許多個兒子」（參創46:21）——換言之，雅各口中那個怕「遭害」的孩子，實際上早已是成年的父親。\n\
  \n  ### 三、嚴厲與智慧：約瑟的試驗（9-20節）\n\n約瑟四次指控他們是「奸細」（9、12、14、16節）。STEP 可確認「奸細」原文使用 מְרַגְּלִים（字根\
  \ רָגַל H7270，Piel 分詞「探子／窺探者」），並指控他們來窺探這地的「破綻」（עֶרְוָה H6172，字面為「赤露之處」）。KC 誠實地承認：**這個指控並不真實——他們不是奸細。約瑟在意的是他們對這指控的反應。**而他們的反應顯示：**他們不再自我辯護了，他們察查神正在對付他們。**\n\
  \n> [!note] 這不是報復，是智慧\n> KC：**約瑟沒有把腳踏在跪伏於他面前的哥哥們身上（他們當年就是這樣待他的）；他也沒有走向另一極端——「大方地」把一切一筆勾銷，因為那樣對他們並無真正的益處。**他時而嚴厲、時而恩慈；時而威嚇、時而鼓勵；時而控告、時而設筵——**這不是喜怒無常，而是極大的智慧。主要得著我們的心和良心時，也正是這樣作工的。**CT：**向那跌倒的人，主是「嚴厲」的，所以我們應當長久在祂的恩慈裏**（羅11:22）。\n\
  \n約瑟兩次[[古埃及的起誓方式|「指著法老的性命起誓」]]——這是古埃及人鄭重發誓的慣用語，意即「就如法老活著那樣實在」。他堅持要見「小兄弟」便雅憫，各家給的理由略有不同：CT\
  \ 說是為了確知哥哥們有沒有像害他一樣也害了便雅憫，並盼望老父或許也能隨來；丁良才列了三點——要使哥哥們生出認真悔改的心、若便雅憫先來老父就更容易下來、他無非是隨神的引導叫同族的人都下埃及而成全他的夢；GT《聖經精讀本》則說得最直接：約瑟對這唯一的同母兄弟懷有特別的愛，所以再三強調一定要把他帶來。\n\
  \n「於是約瑟把他們都下在監裡三天」——KC：**他讓他們稍微嚐一嚐他所經歷的。他在那裡是冤枉的，他們在那裡卻是該當的；而且他們所嚐的只是他所受的一小部分。**（「三天」按猶太人算法，首尾兩天各算一整天，實際可能不到四十八小時。）\n\
  \n第18節約瑟說：「**我是敬畏神的**」——GT 敏銳地指出：**他沒有提「耶和華」的名，那會立刻暴露他是希伯來人。**\n\n### 四、良心的甦醒（21-24節）\n\
  \n| | 當年（創37） | 如今（創42） |\n|---|---|---|\n| 誰有權柄 | 哥哥們掌握約瑟的性命 | 性命反倒交在約瑟手中 |\n|\
  \ 誰在哀求 | 約瑟「哀求我們」，他們不肯聽 | 他們哀求：「我主啊，不是的」 |\n| 誰在坑／監裡 | 約瑟被丟在坑裡 | 他們被下在監裡三天 |\n\n\
  監獄作成了工。他們彼此說：「**我們在兄弟身上實在有罪**」——STEP 顯示「實在有罪」原文使用 אֲשֵׁמִים（H818，字根 אָשַׁם「負罪／有過犯」）。GT\
  \ 指出：**這是聖經中第一次的認罪。**\n\n> [!quote] 收割當日所種的\n> CT：**約瑟的哥哥們開始瞭解到，他們正在收割當日所種的惡果**（加6:7）。**苦難常幫助我們認識自己的罪；人在犯罪之後可以遮蓋罪行，但永遠無法除去內心的愧疚。**BH\
  \ 注意到這一節裡有一個創37章沒有記載的細節：**「他哀求我們的時候，我們見他心裡的愁苦，卻不肯聽」**——原來當年約瑟在坑裡曾苦苦哀求，而他們**聽見了，卻不肯聽**。\n\
  \n流便說「流他血的罪向我們追討」（參創9:5-6）。而「約瑟轉身退去，哭了一場」——**這是約瑟在創世記中的第一次哭；此後他還要哭好幾次**（43:30；45:2,14；46:29；50:1,17）。CT：**表明他外表嚴厲，內心卻滿了手足之愛。**KC：**這顯明主耶穌何等被人向祂回轉的每一步所感動。**\n\
  \n為什麼挑出西緬、而不是長子流便？CT、GT 與 BH 給的答案一致：**西緬生性殘忍**（創34:25 屠示劍城；49:5 雅各的評語），很可能是當年謀害約瑟的主要人物；**而流便曾主張不可下手害他**（37:21-22；本章22節）。丁良才另補一層次序上的理由：流便雖是長子而應當被留，「但他本有救約瑟的心，就沒有被留」；精讀本則說，除了流便，西緬就是最大的。\n\
  \n第19節的條件其實比三天前放寬了：原先是「打發你們中間一個人去」、其餘全數囚禁（16節），現在改成只留一人、其餘九人可以回去。GT《聖經精讀本》推想理由有二：父家需要很多糧食，以及怕年老的雅各擔心。\n\
  \n  ### 五、口袋裡的銀子（25-38節）\n\n約瑟吩咐把[[古埃及銀子交易|各人的銀子]]歸還在口袋裡——**這本是恩典的憑據，他們卻不當作恩典來經歷。**\n\
  \n> [!quote] 恩典使他們害怕\n> KC：**約瑟的良善本是要叫他們喜樂，但有虧的良心沒有喜樂。恩典嚇著了他們。**這證明他們還不認識神；然而神一路與他們同行，為要叫他們認識祂是**賜與者**。CT：**從我們這一面看，生命的糧食須要花銀子去買（2節；啟3:18）；但從主那一面看，生命的糧食是「賜給」的，不需用銀錢買**（約6:31-33；賽55:1-2）。丁良才：**「提心吊膽」——良心有虧的人容易懼怕。**\n\
  \nSTEP 顯示第28節原文極為傳神地描繪「他們的心跳出來」（וַיֵּצֵא לִבָּם）並「彼此戰兢發顫」（וַיֶּחֶרְדוּ，字根 חָרַד\
  \ H2729，Qal 未完成式）。他們戰兢地說：「[[神的護理|這是神向我們做什麼呢]]？」——CT：**表明他們承認神掌管一切。**GT《聖經精讀本》從約瑟那一面解釋他為何要退回銀子：一來賣糧給父母、弟兄不能收錢，二來是要使他們在半路上看不到口袋裡有購糧的錢。\n\
  \n  回到迦南之後，兄弟們的報告裡有兩處空白：GT《聖經精讀本》注意到他們沒有提被關三天（17節），也沒有提西緬被扣的經過（24節），「或許他們想減輕對年邁父親的打擊」。\n\
  \n雅各的哀嘆：「約瑟沒有了，西緬也沒有了，你們又要將便雅憫帶去；**這些事都歸到我身上了**。」\n\n> [!note] 雅各還不會說信心的話\n> KC：**雅各還（不能）說出信心的語言——「萬事都互相效力，叫愛神的人得益處」（羅8:28）。他只看見自己已經失去的（約瑟、西緬）和即將失去的（便雅憫），把一切都當作是「與我作對」。**丁良才更溫柔地說：**雅各卻不知道，這些事將來都要使他得大喜樂；神出名的僕人有時也缺少信心**——摩西曾說「你為何苦待僕人」（民11:10），大衛曾說「必有一日我死在掃羅手裡」（撒上27:1），以利亞求死（王上19:4），耶利米歎息（耶20:7）。\n\
  >\n> KC 最後留下一句刺心的話：**只要雅各還不肯交出便雅憫，約瑟就不能向他們顯明自己。我們若不肯把一切交出來，神也無法向我們顯明祂自己。**\n\n流便願以自己的兩個兒子性命擔保（37節）——CT：**是以自己「兩個兒子」的性命，來擔保父親「一個兒子」的安危**（他其實有四個兒子，創46:9）。而雅各仍說：「他若在你們所行的路上遭害，那便是你們使我白髮蒼蒼、悲悲慘慘地下[[陰間（Sheol）|陰間]]去了。」\n\
  \n### 約瑟這場試驗的結構\n\n  約瑟的每一步都不是隨興的。KC 說他「有時用嚴厲，有時用恩慈；有時威嚇他們，有時鼓勵他們；有時控告他們，有時為他們設筵——這不是喜怒無常，而是極大智慧的作為」。把本章的動作排開來看，這句話的意思就具體了：\n\
  \n  ```mermaid\n  flowchart TD\n    A[\"認得他們，卻裝作生人（7節）\"] --> B[\"說嚴厲話，四次指控是奸細（9、12、14、16節）\"\
  ]\n    B --> C[\"逼出家中實情：十二弟兄、一個沒有了、頂小的在父親那裡（13節）\"]\n    C --> D[\"要求帶小兄弟來，好證驗真假（15、20節）\"\
  ]\n    D --> E[\"下在監裡三天（17節）\"]\n    E --> F[\"第三天放寬條件：只留一人，其餘帶糧回去（18-19節）\"]\n\
  \    F --> G[\"聽見他們彼此認罪，轉身退去哭了一場（21-24節）\"]\n    G --> H[\"挑出西緬捆綁作人質（24節）\"]\n \
  \   H --> I[\"暗中把銀子歸還口袋，又給路上的食物（25節）\"]\n    I --> J[\"恩典反而使他們懼怕：這是神向我們做什麼呢（28節）\"\
  ]\n  ```\n\n  嚴厲與恩慈交替出現，指向的卻是同一個目的。GT《靈修版聖經註釋》說明約瑟為何不乾脆相認：他對哥哥們最後的印象，就是他們把他賣為奴隸，「所以他決定先試驗他們，好知道他們現在是仍奸詐邪惡如故，還是已經改變了」。\n\
  \n  ### 關鍵神學點\n\n1. **[[神的護理]]**：饑荒、約瑟的高位、哥哥們的下拜、口袋裡的銀子——全是神在背後掌管。\n2. **[[約瑟的夢（應驗）]]**：哥哥們所恐懼、所要破壞的夢，竟藉著他們自己的手成就。\n\
  3. **悔改與良心的覺醒**：三天的囚禁使他們第一次承認「我們在兄弟身上實在有罪」。\n4. **種與收的法則**：他們收割當日所種的（加6:7）。\n5.\
  \ **對兄弟的試驗**：嚴厲與恩慈交織，目的不是報復，而是要引他們真實認罪。\n6. **約瑟預表基督**：他認得他們，他們卻不認得他；他為他們的回轉而哭；他是那位「賣糧給那地眾民」的——**人必須到主這裡來，才能不餓、不渴**（CT；約6:35,51）。\n\
  \n### 背景補充：間諜罪與以物易物的銀子\n\nGT《舊約背景註釋》為本章兩處關鍵細節作了說明，都讓約瑟的手段從「刁難」變成「在制度內施壓」。\n\n**間諜的指控為何有效**：背景註釋指出以色列後來也打發探子窺探迦南地，而約瑟眾兄長正是被指控同樣為外國服務；從事貿易的行商做這種事「應該十分普遍，因為他們能夠在不受人注意或不被懷疑的情況下周遊國內」。它並點出這個罪名的性質：有些政府自然而然地對外人心存疑忌，「並且間諜罪名本身亦極難洗雪」。約瑟挑的正是一個他們無法自證清白的罪名——除非把便雅憫帶來，否則他們說什麼都不算數。\n\
  \n**放回袋中的銀子有多重**：背景註釋提醒錢幣要到主前六世紀才發明並普遍應用，因此貴金屬、寶石、香料、香及其他奢侈品都是按重量以貨易貨的，貨物的相對價值視乎其罕有性；而銀子在古代世界每個地方都是很普遍的貿易品，「埃及沒有天然銀礦，所以銀子是很受歡迎的通商貿易標準」。糧價付的是實物白銀，退回的也是實物白銀——這使第28節「這是甚麼事呢」的驚駭有了重量：那不是一張可以作廢的收據，而是一袋足以構成盜竊指控的金屬。"
