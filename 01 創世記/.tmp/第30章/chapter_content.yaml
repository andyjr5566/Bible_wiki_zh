organization: "神最初應許給亞伯拉罕的豐盛福分（創 12:2-3），歷經以撒（創 26:12-13），如今切實應驗在雅各身上：本章前半段生動記述了家族後裔的迅速繁衍（1-24節），後半段則記載了羊群與財產的極大增添（25-43節）。聖經在敘事中對同時代各大帝國的豐功偉業隻字不提，卻極其詳盡地記錄了雅各家中連同牲畜在內的生計細節——因為整部救贖歷史始終以神的選民為核心焦點，歷史的脈絡最終都指向基督（GT）。\n\
  \n### 一、拉結與利亞為生子爭寵失和（1-24節）\n\n拉結見自己多年不生育，便深深嫉妒姊姊利亞（וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ，H7065、H7354、H269），情緒激動地向雅各哭求：「你給我孩子，不然我就死了！（הָבָה־\
  \ לִּי בָנִים וְאִם־ אַיִן מֵתָה אָנֹכִי，H3051、H1121A、H369、H4191、H595）」。雅各向拉結動怒，嚴肅地回答：「叫你不生育的是神，我豈能代替神作主呢？（הֲתַחַת\
  \ אֱלֹהִים אָנֹכִי אֲשֶׁר־ מָנַע מִמֵּךְ פְּרִי־ בָטֶן，H8478H、H430G、H595、H4513、H6529、H990H）」。雅各向來習慣倚靠自己的力氣抓取好處，此時也不得不公開承認：兒女的賞賜完全在於神的主權。\n\
  \n拉結仿效祖母撒拉當年的作法（創 16:2），將自己的使女[[辟拉]]（בִּלְהָה，H1090A）給雅各為妾，希望藉使女生子歸在自己名下（「使她生子在我膝下，我也因她得孩子」וְאִבָּנֶה\
  \ גַם־ אָנֹכִי מִמֶּנָּה，H1129、H595；使女代孕習俗），相繼生下[[「但」名字含義|但]]與[[拿弗他利|拿弗他利]]。利亞見自己暫時停止了生育，也將使女[[悉帕]]（זִלְפָּה，H2153）給雅各為妾，相繼生下[[迦得（萬幸）|迦得]]與[[亞設（有福）|亞設]]。\n\
  \n> [!note] 又一次「撒拉、夏甲」的歷史重演\n> GT 華爾頓《創世記背景註釋》指出：古代近東的努斯、漢摩拉比等法律／文書中，可找到不育妻子透過婢女生育後嗣的相關制度背景；這說明這種安排有當時的法律與社會先例，但制度上的存在並不表示經文對家庭衝突作正面評價——本章隨後的敘事生動描繪了這套人為安排所帶來的家庭持續爭端。\n\
  > \n> KC 深刻反思：雅各身為家長，理應效法父親以撒為不孕的妻子專心向神祈禱（創 25:21），卻重蹈了祖父亞伯拉罕在操之過急時的軟弱（創 16:1-4）。信徒若不能忍耐等候神的時間，轉而採用屬世的方法解決問題，往往成為家庭紛爭與痛苦的起因。\n\
  \n在麥割的季節（קְצִיר־ חִטִּים，H7105、H2406），流便在田間尋得[[風茄(催情果)|風茄]]（דּוּדָאִים，H1736）帶給母親利亞。拉結向利亞索取風茄，甚至答應用與雅各同寢的權利作為交換；然而，故事情節與當時認為風茄有助生育的期待恰好形成反差：擁有風茄的拉結並未因此受孕，而最終使拉結懷孕生子的，是出於神親自的恩典與應允（「神顧念拉結，應允了她，使她能生育」וַיִּזְכֹּר\
  \ אֱלֹהִים אֶת־ רָחֵל וַיִּשְׁמַע אֵלֶיהָ אֱלֹהִים וַיִּפְתַּח אֶת־ רַחְמָהּ，22節）。拉結生下兒子後感恩地說：「神除去了我的羞恥（אָסַף\
  \ אֱלֹהִים אֶת־ חֶרְפָּתִי，H622、H430G、H2781）」，給他起名叫[[約瑟（增添）|約瑟]]（יוֹסֵף，H3130G），祈盼神再為她增添一個兒子（יֹסֵף\
  \ יְהוָה לִי בֵּן אַחֵר，H3254H、H3068G、H1121A）。\n\n本章記載了雅各十二個兒子中的七位兒子與一位女兒的出生：\n\n\
  | 出生次序 | 兒女名稱 | 希伯來原文與字義 | 母親 | 命名的經文心聲與屬靈意涵 |\n|---|---|---|---|---|\n| 第五子 | 但\
  \ | `דָּן`（H1835）<br>字根源於 `דִּין`（伸冤、審判，H1777） | 辟拉（拉結使女） | 「神為我伸冤，也聽了我的聲音（דָּנַנִּי\
  \ אֱלֹהִים וְגַם שָׁמַע בְּקֹלִי）。」（[[「但」名字含義]]） |\n| 第六子 | [[拿弗他利]] | `נַפְתָּלִי`（H5321）<br>字根源於\
  \ `נָפַת`（相爭、角力，H6617） | 辟拉 | 「我與我姐姐大大相爭，並且得勝（נַפְתּוּלֵי אֱלֹהִים נִפְתַּלְתִּי\
  \ עִם־ אֲחֹתִי גַּם־ יָכֹלְתִּי）。」（拿弗他利（角力）） |\n| 第七子 | 迦得 | `גָּד`（H1410）<br>字義為「萬幸、幸運」\
  \ | 悉帕（利亞使女） | 利亞說：「萬幸！」（迦得（幸運）） |\n| 第八子 | 亞設 | `אָשֵׁר`（H836）<br>字義為「有福、喜樂」（H837）\
  \ | 悉帕 | 利亞說：「我有福啊，眾女子都要稱我是有福的（בְּאָשְׁרִי כִּי אִשְּׁרוּנִי בָּנוֹת）。」（[[亞設（有福）]]）\
  \ |\n| 第九子 | 以薩迦 | `יִשָּׂשכָר`（H3485）<br>字義為「價值、工價、報酬」（H7939） | 利亞 | 利亞說：「神給了我工價（נָתַן\
  \ אֱלֹהִים שְׂכָרִי）。」（以薩迦（報酬）） |\n| 第十子 | 西布倫 | `זְבוּלֻן`（H2074）<br>字義源於「贈禮」（זֵבֶד）與「同住」（זָבַל）\
  \ | 利亞 | 利亞說：「神賜我美好的厚禮，我丈夫必與我同住（הַפַּעַם יִזְבְּלֵנִי אִישִׁי）。」（[[西布倫（同住）]]） |\n\
  | 女兒 | 底拿 | `דִּינָה`（H1783）<br>字根意為「審判、判斷」 | 利亞 | 雅各唯一記錄名字的女兒。（[[底拿名字含義]]） |\n\
  | 第十一子 | 約瑟 | `יוֹסֵף`（H3130G）<br>直接對應 `יָסַף`（增添，H3254H）；23節另以 `אָסַף`（除去，H622）形成諧音雙關\
  \ | 拉結 | 「神除去了我的羞恥；願耶和華再增添我一個兒子。」（約瑟（增添／除去）） |\n\n兩姊妹為生子而產生的激烈競爭，顯明偏離神起初設立一夫一妻的心意必帶來家庭張力；然而神依然超越人的軟弱，按著祂崇高的主權引導一切，逐步建立以色列十二支派的基石（亞伯拉罕之約的應驗）。\n\
  \n### 二、雅各與拉班議訂新工價（25-36節）\n\n拉結生下約瑟之後，在拉班手下服事滿十四年的雅各，正式向母舅請求帶著妻兒返回迦南故鄉（創 30:25-26）。拉班深知自己的產業繁茂完全是神因雅各所賜的恩惠（「我若在你眼前蒙恩，請你仍與我同住，因為我算定，耶和華賜福與我是為你的緣故」נִחַשְׁתִּי\
  \ וַיְבָרֲכֵנִי יְהוָה בִּגְלָלֶךָ，H5172、H1288、H3068G、H1558；神作為賜福的源頭），極力挽留雅各，請他自定工價（工價與雇約）。\n\
  \nGT 華爾頓《創世記背景註釋》指出：雅各主動提出的條件——只要羊群中所有黑色（חוּם，H2345）的綿羊和有斑（טָלוּא，H2921）有點（נָקֹד，H5348）的山羊作為報酬——在古代牧業常理看來是一份極低、近乎白做工的條件；因為在近東羊群中，綿羊絕大多數為白色、山羊絕大多數為純黑或純深色，帶有花斑與雜色的比例極低（常規雇約往往撥歸牧人一至兩成的羊隻）。拉班見有利可圖便爽快答應，但當天就把所有有紋有斑的公羊母羊全數挑出，交給自己的兒子們帶走，並與雅各拉開了三天的路程，徹底防止羊群自然雜交。\n\
  \n> [!note] 神因信徒的緣故賜福周遭\n> 拉班雖然為人奸巧，卻親口承認「耶和華賜福與我是為你的緣故」。CT 指出：敬虔屬神的人活在世上，神常因他們的緣故使身邊的人同蒙恩惠（正如日後約瑟在波提乏家中，創\
  \ 39:5）；然而雅各在異鄉受磨練的功課尚未結束，時候未到便不能擅自離開。\n\n### 三、雅各用計與神的奇妙賜福（37-43節）\n\n面對拉班的刻意刁難，雅各拿楊樹（לִבְנֶה，H3839）、杏樹（לוּז，H3869）、楓樹（עַרְמוֹן，H6196）的嫩枝，將皮剝成白紋（פְּצָלוֹת\
  \ לְבָנוֹת，H6478、H6479、H3836），插在羊群前來飲水的水槽內（牧羊與牲畜繁殖）；他又運用繁育實務，每當肥壯的羊交配時便插上枝子，瘦弱的羊交配時則不用，使健壯有斑的羊群全數歸於自己。結果雅各極其昌盛發大（וַיִּפְרֹץ\
  \ הָאִישׁ מְאֹד מְאֹד，H6555、H3966），得到了大批的羊群、僕婢、駱駝和驢（人的詭詐與神的祝福）。\n\n> [!quote] 不是樹枝的功效，而是神的大能\n\
  > GT 華爾頓《創世記背景註釋》分析：雅各按著羊隻的肥壯程度分離繁育，屬於古代牧人精準的實務經驗；然而在水槽前插有紋樹枝企圖影響胎兒毛色，則是古代民間常見的視覺感應習俗，在生物遺傳學上並無因果關聯。這段記載真實呈現了雅各當時一邊倚靠人的常識與心計、一邊仍需經歷神親自介入的生命光景。\n\
  > \n> CT 與 KC 一致指出：雅各財產的極大倍增，絕非來自樹枝的奇巧，而是神親自履行了伯特利的恩典應許。正如創世記 31:10-12 神在夢中向雅各啟示的真相——「跳母羊的公羊都是有紋、有點、有花斑的……凡拉班向你所作的，我都看見了」；是神親自將拉班的牲畜奪來賜給了雅各（創\
  \ 31:9）。神始終與雅各同在，並在耐心中一步一步將他塑造成合乎神心意的屬靈人。"
