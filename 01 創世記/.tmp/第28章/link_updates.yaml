- title: 亞蘭人
  path: link_folder/人物/亞蘭人.md
  summary: 第5節稱彼土利為「亞蘭人」，拉班是他的兒子。GT 華爾頓《創世記背景註釋》在此指出亞蘭人的來源有不少疑難：他們要到主前第二千年紀後期亞述王提革拉毘列色一世（主前1114～1076年）的年表中，才在美索不達米亞的歷史記錄中首次出現；主前九世紀的撒縵以色三世提到過大馬色的幾位亞蘭王。用「亞蘭人」描述亞伯拉罕和雅各的親族，比較可能是指亞蘭尚未凝聚成後世文獻所述的國家以前，散居在上美索不達米亞的部落。
  relation: 這個稱呼把雅各此行的目的地放進族群史的脈絡：他要去的不是一個外邦，而是自己血親所屬的那一支。華爾頓並指出「亞蘭」一名可能原本是這個地區的名字，後來才用來形容當地的居民——與「巴旦亞蘭」這個只在創世記出現的地名相合。
