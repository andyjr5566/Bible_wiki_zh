book_name:
  title: 書名
  paragraphs:
    - >-
      中文所用的《創世記》承接希臘文七十士譯本的名稱 Genesis，意思與「起源、生成」有關；
      希伯來聖經則按卷首第一個字稱它為 **בְּרֵאשִׁית（Bereshith）**，就是「起初」。
      兩個名稱都很貼近本書內容，因為這卷書不只記天地的開始，也陸續交代人類、婚姻家庭、
      罪與死亡、列國、以色列先祖、約與應許等重要主題如何進入聖經故事。
    - >-
      《創世記》也是摩西五經的第一卷。它本身沒有記載西奈山頒布律法，卻先交代了律法書所需要的歷史背景：
      神是誰、以色列人的祖先是誰、應許之地從何而來，以及為什麼以色列人的故事會在埃及延續下去。
  callout:
    kind: tip
    title: 「起初」不只是一個書名
    body: >-
      讀《創世記》時可以留意一件事：後面聖經許多大主題，都能在這裡找到第一次重要出現。
      因此它不只是「第一卷」，也像整本聖經許多主題的起點。
  source_ids: [CT00, GT00, KC0, BH]

authorship:
  title: 作者與成書
  paragraphs:
    - >-
      猶太教與基督教傳統長期把《創世記》放在「摩西五經」之中，並把五經與摩西的名字聯繫在一起。
      CT00、KingComments 與 BibleHub 的書卷導論都沿用這個傳統框架；因此若問「傳統認為作者是誰」，
      最直接的答案就是摩西。
    - >-
      但若把問題換成「今天這個文本的材料如何形成」，現代五經研究通常會再往下細分：有些研究者認為其中保存了長期流傳的傳統，
      經過不同時期的寫作、整理與編輯才形成現有文本。GT00 所收錄的部分導論、Enter the Bible 與 Yale 都會介紹這類研究。
      各種來源模型與年代重建彼此仍有差異，因此本專案不把某一套模型寫成已無爭議的定論。
  views:
    - label: 故事年代
      text: 經文敘事從創造一路到族長與約瑟；這是故事所描寫的時代，不等於成書日期。
    - label: 傳統作者歸屬
      text: 摩西；這是猶太教與基督教長期流傳的五經作者傳統。
    - label: 傳統成書框架
      text: 約主前十五至十四世紀、出埃及後的曠野時期。
    - label: 現代學術成書觀
      text: 常把《創世記》視為長期傳承、寫作與編輯的成果；對材料層次與最終形成時間仍有不同模型。
  mermaid: |-
    flowchart LR
      A[故事發生的年代] --> B[傳統作者歸屬]
      B --> C[材料的傳承與寫作]
      C --> D[編輯與最終文本]
      B -. 傳統五經框架 .-> M[摩西]
      C -. 現代研究 .-> S[多階段形成]
  callout:
    kind: important
    title: 不要把四個問題壓成一個日期
    body: >-
      「亞伯拉罕活在什麼年代」和「《創世記》何時寫成」不是同一個問題；
      「傳統作者歸屬」和「現代文本形成研究」也不是同一層次。
      本頁把它們分開呈現，避免一句「作者某某、寫於某年」把真正的問題全部蓋掉。
  source_ids: [CT00, GT00, KC0, BH, ENTER_THE_BIBLE, YALE]

time_and_background:
  title: 寫作時地與歷史背景
  paragraphs:
    - >-
      按傳統摩西成書框架，《創世記》的寫作背景通常放在出埃及之後、以色列人在曠野的時期；
      KingComments 約定在主前1450年前後，CT00 則把摩西放在約主前1500至1400年的範圍。
      這個日期屬於傳統成書理解，和經文本身所敘述的漫長故事年代需要分開。
    - >-
      本書敘事的地理舞台則一路移動：從創造與列國的宏觀場景，進入美索不達米亞與迦南的族長世界，最後落到埃及。
      亞伯拉罕家族的遷徙、牧養、婚姻與繼承、土地與井、饑荒與寄居，都需要放回古代近東的生活背景來理解。
  timeline_mermaid: |-
    flowchart LR
      U[美索不達米亞<br/>吾珥／哈蘭] --> C[迦南<br/>亞伯拉罕・以撒・雅各]
      C --> E[埃及<br/>約瑟與雅各一家]
      E --> X[銜接《出埃及記》]
  background_points:
    - 1–11章與古代美索不達米亞的創造、洪水傳統存在可比較之處；比較的重點是相似與差異，而不是簡化成「誰抄誰」。
    - 12–36章大量涉及家族、土地、婚姻、長子與繼承、牧養和寄居等古代近東生活背景。
    - 37–50章把故事帶入埃及，也解釋了下一卷書為何從「以色列人在埃及」開始。
  callout:
    kind: note
    title: 背景資料是為了幫助讀經，不是取代經文
    body: >-
      古代近東資料最有價值的地方，是讓讀者知道當時的人如何理解世界、家庭、土地、盟約與王權。
      它能照亮經文的語境，但不應反過來把《創世記》縮成其他古代文獻的翻版。
  source_ids: [CT00, KC0, BH, ENTER_THE_BIBLE, YALE]

main_message:
  title: 主旨要義
  paragraphs:
    - >-
      《創世記》的故事從神創造一個美好的世界開始，接著很快進入人的悖逆、罪、死亡與彼此傷害。
      從伊甸園、該隱與亞伯、洪水到巴別塔，問題不斷擴大；然而神的計畫沒有因此停止。
      到第12章，神呼召亞伯拉罕，應許土地、後裔與祝福，並把「地上的萬族都要得福」放在這個家族蒙召的目的裡。
    - >-
      因此全書一方面誠實呈現人的失敗，另一方面不斷顯出神仍在保存生命、守住應許並推動祂的計畫。
      到約瑟故事，甚至人的惡意也沒有成為最後一句話；雅各一家在饑荒中得以存活，並被帶到埃及，讓救贖故事進入下一卷。
  mermaid: |-
    flowchart LR
      A[創造<br/>神看為美好] --> B[人的悖逆<br/>罪與死亡]
      B --> C[洪水與巴別<br/>審判與分散]
      C --> D[亞伯拉罕蒙召<br/>土地・後裔・祝福]
      D --> E[族長家庭<br/>應許穿過人的失敗]
      E --> F[約瑟在埃及<br/>保存生命]
  theme_table:
    - name: 創造與人的使命
      text: 人按神形像受造，在受造世界中承擔治理與代表的責任。
    - name: 罪與死亡
      text: 人的悖逆從個人擴散到家庭、社會與列國，成為全書持續面對的問題。
    - name: 祝福與應許
      text: 神對亞伯拉罕的土地、後裔與祝福應許，成為12–50章的主線。
    - name: 約
      text: 挪亞與亞伯拉罕的約，把神的保守與應許用更明確的方式固定下來。
    - name: 揀選與萬族
      text: 神聚焦亞伯拉罕一家，但目的從一開始就沒有離開「萬族得福」。
  source_ids: [CT00, GT00, KC0, BH, BIBLEPROJECT, ENTER_THE_BIBLE]

purpose:
  title: 寫本書的目的與原始讀者
  paragraphs:
    - >-
      CT00 將本書的寫作目的概括為交代人類的起源、神選民的來歷，以及他們如何從迦南來到埃及。
      若放在摩西五經的整體脈絡裡，這卷書也在回答以色列群體最基本的身份問題：創造世界的神就是與他們立約的神；
      他們的祖先、應許與土地並不是到了《出埃及記》才突然出現，而是有一條更早的故事。
    - >-
      BibleHub 與其他現代導論也常從「原始讀者」角度說明這一點：對以色列而言，《創世記》既是家族的來歷，
      也是一個更大的世界故事。它先談全人類，再談一個家族，讓以色列的身份始終放在神對萬族的計畫中理解。
  source_ids: [CT00, BH, BIBLEPROJECT, ENTER_THE_BIBLE]

importance:
  title: 本書的重要性
  paragraphs:
    - >-
      《創世記》的重要，不只是因為它排在第一卷，而是因為後面聖經會反覆使用的許多概念，
      在這裡已經第一次形成清楚的故事背景。若不知道《創世記》，就很難理解《出埃及記》的以色列是誰，
      也很難掌握土地、後裔、約、祝福、罪、祭、神形像、列國等主題後來為什麼如此重要。
  points:
    - 它提供摩西五經的歷史前提，尤其解釋以色列如何進入埃及，以及神對列祖已有什麼應許。
    - 它建立整本聖經許多核心主題的第一個語境；後面的律法、先知與新約常會回到這些故事與人物。
    - 它把以色列的故事放在全人類的故事之中，使「揀選一個家族」與「祝福萬族」從開頭就連在一起。
    - 它呈現的不是一群完美英雄，而是神如何在人的失敗、衝突與等待中仍推動祂的應許。
  source_ids: [CT00, KC0, BH, BIBLEPROJECT]

features:
  title: 本書的特點
  items:
    - title: 一卷「起源」之書
      text: >-
        天地、人類、婚姻家庭、罪與死亡、列國、以色列先祖、約與應許等主題，都在這卷書取得最初的重要位置。
        因此「Genesis」不只是在說宇宙起源，也是在說聖經故事許多主題的源頭。
    - title: 從全人類逐步聚焦到一個家族
      text: >-
        1–11章的範圍是全人類；12章以後鏡頭縮到亞伯拉罕一家。但範圍縮小並不代表關懷縮小，
        因為亞伯拉罕蒙召一開始就帶著「萬族得福」的方向。
    - title: 家譜其實是全書的骨架之一
      text: >-
        《創世記》反覆用「這是……的後代／記略」一類 **toledot** 公式推進故事。
        家譜除了保存名字，也負責轉場、縮短時間，並指出下一段故事要跟著哪一條家族線走。
    - title: 人物不是單純的道德模範
      text: >-
        亞伯拉罕、雅各、約瑟等人物都有信心，也都有複雜性。敘事把人物的選擇與後果寫出來，
        並不表示經文認可他們所做的每一件事；很多時候，故事真正突出的反而是神如何在這些不完美的人中守住應許。
    - title: 37–50章的約瑟故事有很強的連續敘事感
      text: >-
        約瑟故事比前面的族長片段更像一篇長篇敘事，透過伏筆、隱藏身份、試驗、反轉與揭露一路推進，
        最後把兄弟衝突帶向和好，也把全家帶到埃及。
  callout:
    kind: tip
    title: 家譜先別整段跳掉
    body: >-
      不一定要一次記住所有名字，但至少看清楚「這份家譜把哪一段故事接到哪一段」「最後把焦點交給誰」。
      這樣會更容易看懂《創世記》的結構。
  source_ids: [CT00, GT00, KC0, BH, BIBLEPROJECT, ENTER_THE_BIBLE, YALE]

relationships:
  title: 本書與其他聖經書卷的關係
  paragraphs:
    - >-
      《創世記》與《出埃及記》的關係最直接：前者結束時，雅各一家已經住在埃及；後者則從這個家族在埃及成為一個受壓迫的民族開始。
      因此《出埃及記》的救贖、立約與進入應許之地，都要回到《創世記》的列祖應許才看得完整。
    - >-
      更往後看，亞伯拉罕、亞當、該隱、挪亞、麥基洗德、以撒、雅各與約瑟，以及創造、神形像、婚姻、信心、應許、約等主題，
      都會被舊約後面的書卷和新約重新提起。《創世記》因此不是一座孤島，而像許多後續主題共同的源頭。
  mermaid: |-
    flowchart LR
      G[創世記<br/>創造・列祖・應許] --> E[出埃及記<br/>救贖・立約]
      G --> T[律法書<br/>土地・後裔・約]
      G --> P[先知／詩歌<br/>創造・列祖記憶]
      G --> N[新約<br/>亞當・亞伯拉罕・信心・應許]
  source_ids: [CT00, KC0, BH, BIBLEPROJECT]

keys:
  verses:
    - ref: 創1:26
      text: 神照著自己的形像造人，並把治理受造界的責任交給人。
    - ref: 創3:15
      text: 人犯罪之後，審判之中已出現關於女人後裔與蛇敵對的盼望線索。
    - ref: 創12:1–3
      text: 神呼召亞伯蘭，應許土地、後裔與祝福，並把地上萬族放進這個應許的目標。
    - ref: 創15:6
      text: 亞伯蘭信耶和華，這句話後來成為新約談信心與稱義的重要經文。
    - ref: 創50:20
      text: 約瑟回看兄弟的惡意時，看見神仍能使事情轉向保存許多人的生命。
  words:
    - word: 起初／起源
      note: 不只對應書名，也提醒讀者本書不斷交代重要事物與聖經主題的開端。
    - word: 祝福
      note: 從創造到亞伯拉罕之約反覆出現，特別在創12:1–3成為列祖故事的核心線索。
    - word: 後裔
      note: 從創3章一路延伸到亞伯拉罕、以撒、雅各的應許，是整卷書的重要連續線。
    - word: 地
      note: 與後裔、寄居、饑荒、應許相連，並直接銜接後面五經的土地主題。
    - word: 約
      note: 挪亞與亞伯拉罕的立約使神的保守與應許更加明確。
  source_ids: [CT00, GT00, KC0, BH, BIBLEPROJECT]

outline:
  title: 內容大綱
  intro: >-
    最簡單也最實用的分法，是先把全書看成 **1–11章「上古史」** 與 **12–50章「列祖史」** 兩大部分；
    再把後半部沿著亞伯拉罕、以撒與雅各、約瑟幾條主要人物線往下讀。
  mermaid: |-
    flowchart TB
      G[創世記 1–50章] --> A[1–11章<br/>上古史・全人類]
      G --> B[12–50章<br/>列祖史・一個家族]
      A --> A1[1–2 創造]
      A --> A2[3–5 墮落與早期人類]
      A --> A3[6–9 洪水與立約]
      A --> A4[10–11 列國與巴別]
      B --> B1[12–25 亞伯拉罕]
      B --> B2[26–36 以撒與雅各]
      B --> B3[37–50 約瑟與兄弟]
  sections:
    - range: 1–2章
      label: 創造
      summary: 神創造天地、人類與安息；建立人與神、彼此及受造界的基本關係。
    - range: 3–5章
      label: 墮落與早期人類
      summary: 人悖逆神，罪與死亡進入故事；家庭中的衝突很快擴大。
    - range: 6–9章
      label: 洪水與挪亞之約
      summary: 世界因暴力與敗壞受審判，洪水之後神與挪亞立約並保存受造界。
    - range: 10–11章
      label: 列國與巴別
      summary: 列國展開，人類在巴別再次追求自己的名；故事隨後轉向亞伯拉罕。
    - range: 12–25章
      label: 亞伯拉罕
      summary: 蒙召、土地、後裔、約與信心成為主線；應許在等待與失敗中逐步展開。
    - range: 26–36章
      label: 以撒與雅各
      summary: 應許延續到下一代；兄弟競爭、離家與歸回塑造雅各／以色列的故事。
    - range: 37–50章
      label: 約瑟與兄弟
      summary: 約瑟被賣到埃及，經過升降與反轉後保存全家；兄弟衝突走向和好，故事停在埃及。
  callout:
    kind: tip
    title: 第12章是全書最重要的轉軸
    body: >-
      1–11章一路看見全人類的問題擴大；12章卻突然把鏡頭縮到亞伯拉罕。
      這不是神放棄列國，而是應許要透過這個家族使「地上的萬族」得福。
  source_ids: [CT00, GT00, BH, BIBLEPROJECT, ENTER_THE_BIBLE, YALE]

supplement:
  title: 補充導讀：讀《創世記》時值得知道的幾件事
  paragraphs:
    - >-
      CT00 式提要已經能把一卷書的骨架說清楚；下面幾點則是 BibleProject、Enter the Bible 與 Yale 特別能補上的閱讀視角。
      它們不是另外建立一套結論，而是幫助一般讀者知道，哪些地方在現代研究中常被進一步討論。
  items:
    - title: 1–11章與古代近東文本
      text: >-
        古代美索不達米亞也保存創造與洪水故事，例如 Atrahasis 與 Gilgamesh 傳統。
        研究這些平行材料可以幫助讀者看見共同的古代世界背景，也更清楚《創世記》在神觀、人觀與敘事重點上的特色。
    - title: 文類不要全部用同一把尺量
      text: >-
        Yale 特別提醒，1–11章、12–36章與37–50章在文學性質上並不完全相同；約瑟故事尤其具有較完整的長篇敘事結構。
        因此讀者在問歷史、文學與神學問題時，也需要留意自己正在讀哪一類段落。
    - title: 來源批判是研究模型，不是讀者必須先接受的信條
      text: >-
        J／E／P 等來源模型影響近代五經研究很深，能幫助理解學者如何觀察神名、重複敘事、用詞與文本層次；
        但各來源的邊界與年代並沒有一套所有研究者都同意的版本，所以這裡把它當成「研究如何提問」的一部分，而不是預設答案。
  callout:
    kind: question
    title: 讀一段時可以多問一句
    body: >-
      這段經文除了告訴我「某個人物做了什麼」，還把哪一條大主線往前推？
      是創造與秩序、罪與死亡、後裔、土地、祝福、約、兄弟衝突，還是神如何保存祂的應許？
  source_ids: [BIBLEPROJECT, ENTER_THE_BIBLE, YALE]

