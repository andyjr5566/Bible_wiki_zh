hero:
  eyebrow: 聖經第一卷書
  title: 創世記 Introduction
  lead: >-
    《創世記》不是只在回答「世界怎麼開始」。它先把鏡頭拉到天地與全人類，
    再一路推近到一個家庭：亞伯拉罕、以撒、雅各和約瑟。人一次又一次把事情弄壞，
    但神沒有放棄祂對世界的心意；從第12章開始，「我要賜福給你……地上的萬族都要因你得福」
    成為後面整本聖經的重要主線。
  source_ids: [CT00, GT00, KC0, BH, BIBLEPROJECT, ENTER_THE_BIBLE]

quick_facts:
  - label: 位置
    value: 摩西五經第一卷；舊約與整本聖經的開場
    sources: [CT00, BH, ENTER_THE_BIBLE]
  - label: 章數
    value: 50 章
    sources: [BH]
  - label: 希伯來書名
    value: בְּרֵאשִׁית（Bereshith，「起初」）
    sources: [CT00, KC0, BH]
  - label: 希臘／中文書名
    value: Genesis，意為「起源、出生、生成」
    sources: [CT00, KC0, BH]
  - label: 故事範圍
    value: 從創造與人類起源，一直到約瑟去世、雅各一家住在埃及
    sources: [CT00, BH, BIBLEPROJECT]
  - label: 最重要的轉折
    value: 第12章——從全人類的破裂，轉向亞伯拉罕一家與「萬族得福」的應許
    sources: [BIBLEPROJECT, CT00]

name_and_place:
  title: 為什麼叫「創世記」？
  paragraphs:
    - >-
      希伯來聖經沒有用一個後來才加上的主題名稱來稱呼這卷書，而是直接取開頭第一個字
      **בְּרֵאשִׁית（Bereshith）**，意思就是「起初」。希臘文傳統則用 **Genesis**，
      表達「起源、出生、生成」。兩個名字剛好從不同角度抓到本書特色：這是一卷不斷追問
      「事情是怎麼走到今天這一步」的書。
    - >-
      所以它談的不只是天地的起初，也談人、婚姻與家庭、罪與死亡、列國、以色列先祖、
      約與應許的起頭。更重要的是，《創世記》把《出埃及記》為什麼會從「一群住在埃及的以色列人」
      開始，提前交代清楚。
  source_ids: [CT00, GT00, KC0, BH]

structure:
  title: 先看懂整卷書的鏡頭怎麼移動
  intro: >-
    如果只記一個結構，先記 **1–11章 → 12–50章**。前半段看全世界，後半段聚焦一個家族；
    第12章就是鏡頭轉向的鉸鏈。
  macro:
    - range: 1–11章
      label: 全人類的故事
      summary: 創造、伊甸園、該隱與亞伯、洪水、列國、巴別塔。問題一步步擴大：人離開神，也彼此傷害。
      sources: [CT00, BH, BIBLEPROJECT, YALE]
    - range: 12章
      label: 轉折點
      summary: 神呼召亞伯蘭，應許土地、後裔與祝福；焦點縮小到一個家庭，但目標仍是「地上的萬族」。
      sources: [CT00, BIBLEPROJECT]
    - range: 12–36章
      label: 亞伯拉罕、以撒、雅各
      summary: 應許在一個很不完美的家族裡往前走；信心、失敗、衝突、保守與更新反覆出現。
      sources: [CT00, BH, BIBLEPROJECT, YALE]
    - range: 37–50章
      label: 約瑟與兄弟
      summary: 家族衝突把約瑟帶到埃及，最後反而成為全家在饑荒中得保存的途徑，也把舞台交給《出埃及記》。
      sources: [CT00, BH, BIBLEPROJECT, ENTER_THE_BIBLE, YALE]
  toledot_note: >-
    除了「1–11／12–50」的大分法，書內還反覆出現「這是……的後代／記略」一類 **toledot** 公式。
    它像一組路標，把創造之後的故事一段一段往下一代推進；家譜因此不是可以全部跳過的附錄，
    而是《創世記》本身的骨架之一。
  source_ids: [GT00, ENTER_THE_BIBLE]

story_arc:
  title: 從「世界很好」到「一家人成了應許的載體」
  steps:
    - title: 創造
      detail: 神把秩序、生命與美善帶進世界，人受造承擔神形像與治理的使命。
      sources: [BIBLEPROJECT, ENTER_THE_BIBLE]
    - title: 破裂
      detail: 人選擇按自己的方式定義善惡，罪從個人蔓延到家庭、社會與列國。
      sources: [CT00, BIBLEPROJECT]
    - title: 審判與保守
      detail: 洪水與巴別顯示罪的嚴重，也顯示神仍保存受造界並繼續祂的計畫。
      sources: [CT00, ENTER_THE_BIBLE]
    - title: 呼召亞伯拉罕
      detail: 神把焦點放在一個人和他的後裔身上，卻不是只為這一家，而是要使萬族得福。
      sources: [CT00, BIBLEPROJECT, ENTER_THE_BIBLE]
    - title: 應許穿過失敗
      detail: 亞伯拉罕、以撒、雅各一家並不理想，但土地、後裔與祝福的應許沒有因此中止。
      sources: [BIBLEPROJECT, ENTER_THE_BIBLE]
    - title: 進入埃及
      detail: 約瑟的故事把人的惡意與神的保守放在同一條線上；創世記結束時，以色列一家已在埃及，等待下一卷。
      sources: [BH, BIBLEPROJECT, ENTER_THE_BIBLE]

authorship_and_date:
  title: 誰寫的？什麼時候寫的？——先把四個問題拆開
  intro: >-
    這是《創世記》導論最容易被一句話寫壞的地方。**故事發生在什麼年代、傳統把作者歸給誰、
    材料何時形成、今天這個文本何時完成**，其實是四個不同問題。
  questions:
    - label: 故事年代
      answer: 創造敘事一路延伸到族長與約瑟時代；這是「故事世界」的年代，不等於寫作日期。
      sources: [CT00, BH]
    - label: 傳統作者歸屬
      answer: 猶太教與基督教長期把摩西五經與摩西聯繫在一起；CT00、KC、BibleHub 也採這條傳統線。
      sources: [CT00, GT00, KC0, BH, ENTER_THE_BIBLE]
    - label: 傳統成書框架
      answer: 常把寫作放在出埃及後的摩西時期，約主前十五至十四世紀、西奈／曠野背景。
      sources: [CT00, KC0, BH]
    - label: 現代學術成書觀
      answer: 許多現代研究者把《創世記》理解為長期流傳、寫作與編輯的成果，並討論不同材料層與後期整合；具體模型與年代彼此仍有差異。
      sources: [GT00, ENTER_THE_BIBLE, YALE]
  conclusion: >-
    因此這個專案不會把其中一邊寫成「已經證明另一邊錯」。比較負責任的讀法，是把**傳統作者歸屬**與
    **現代文本形成研究**並列，並告訴讀者各自在回答什麼問題。像 J／E／P 這類來源模型，可以用來理解近代學術史與文本觀察，
    但不應假裝學界對每一層的年代與範圍都有一致答案。
  source_ids: [GT00, ENTER_THE_BIBLE, YALE]

historical_background:
  title: 讀《創世記》時，腦中要有哪個世界？
  paragraphs:
    - >-
      《創世記》的故事舞台從整個世界逐漸縮到古代近東：美索不達米亞、迦南、最後是埃及。
      亞伯拉罕家族的遷移、牧養生活、婚姻與繼承、城邑與土地交易，都放在這個大環境裡閱讀會更有畫面。
    - >-
      尤其 1–11 章不能只放在現代科學爭論裡。古代美索不達米亞也流傳創造與洪水故事，
      如 Atrahasis 與 Gilgamesh 傳統；《創世記》與它們既有可比較之處，也有非常不同的神觀、人觀與敘事目的。
      「有平行材料」不等於可以直接簡化成「誰抄誰」，實際的傳承關係比這複雜得多。
  source_ids: [ENTER_THE_BIBLE, YALE]

purpose_and_audience:
  title: 這卷書為什麼值得寫？
  paragraphs:
    - >-
      從傳統的五經框架來看，《創世記》是寫給已經要認識自己身份的以色列群體：你們的神是誰？
      世界從哪裡來？罪與死亡為什麼存在？你們的祖先是誰？為什麼會有土地、後裔與祝福的應許？
      又為什麼故事一開始就已經把「萬族」放進視野？
    - >-
      這也是為什麼《創世記》不能只被讀成「古代人物故事集」。它在回答以色列是誰的同時，
      一直把視野拉回全人類：神揀選一個家族，並不是把其他人忘掉，而是要透過這個家族把祝福帶出去。
  source_ids: [CT00, BH, BIBLEPROJECT, ENTER_THE_BIBLE]

themes:
  title: 抓住這幾條線，50章就不會散掉
  items:
    - name: 創造與美善
      text: 世界首先被描述為神所造、可居住、可繁衍、被看為好的地方；後面的罪與審判都發生在這個「原本美好」的背景上。
      sources: [BIBLEPROJECT, ENTER_THE_BIBLE]
    - name: 人想自己定義善惡
      text: 從伊甸園開始，人不斷想脫離神自己決定什麼是好；結果不是更自由，而是羞恥、嫉妒、暴力、破裂與死亡擴大。
      sources: [BIBLEPROJECT, CT00]
    - name: 祝福與咒詛
      text: 神的祝福從創造、生養眾多一路延伸到亞伯拉罕；第12章把「蒙福」與「使萬族得福」綁在一起。
      sources: [BIBLEPROJECT, ENTER_THE_BIBLE]
    - name: 約與應許
      text: 挪亞之約面向受造界；亞伯拉罕之約則集中在土地、後裔與祝福。故事的張力常來自：眼前情況看起來與應許完全相反。
      sources: [CT00, ENTER_THE_BIBLE]
    - name: 揀選不是偏愛的終點
      text: 神把亞伯拉罕一家分別出來，但終點仍是萬族；「特別揀選」與「普世祝福」在《創世記》不是互斥的。
      sources: [BIBLEPROJECT, ENTER_THE_BIBLE]
    - name: 兄弟衝突與和好
      text: 該隱與亞伯、以實瑪利與以撒、以掃與雅各、約瑟與哥哥們反覆把「兄弟如何一起活」推到讀者面前；最後約瑟故事把報復改寫成饒恕與保存生命。
      sources: [ENTER_THE_BIBLE]
    - name: 神的信實穿過人的失敗
      text: 族長不是一群毫無瑕疵的英雄。正因為人物常常害怕、欺騙、偏愛、爭鬥，神仍推動應許的事才變得更突出。
      sources: [BIBLEPROJECT, ENTER_THE_BIBLE, CT00]

literary_features:
  title: 《創世記》其實很會說故事
  items:
    - title: 重複與對照
      text: 同類事件會在不同世代再次出現：兄弟競爭、妻子不孕、長幼次序翻轉、離開與歸回、饑荒與寄居。重複不是偷懶，而是在邀請讀者比較。
    - title: 家譜是轉場工具
      text: 家譜會把時間快速推進，也把「誰承接應許、誰成為哪一族」交代清楚；toledot 公式更是整卷的重要結構標記。
    - title: 人物不是扁平榜樣
      text: 亞伯拉罕、雅各、約瑟等人物都有信心也有複雜性；故事往往不是在說「照他做」，而是讓讀者看人在真實處境裡如何與神、家人和應許互動。
    - title: 約瑟故事的篇幅與連續性不同
      text: 37–50章比前面的短篇族長事件更像一個長篇連續故事，情節鋪陳、伏筆、誤認與揭露尤其明顯。
  source_ids: [GT00, ENTER_THE_BIBLE, YALE]

relationship_to_bible:
  title: 《創世記》不是一座孤島
  paragraphs:
    - >-
      它的最後一句把約瑟收殮在埃及，下一卷《出埃及記》就從「以色列人在埃及」接棒。
      土地、後裔、祝福、神同在、罪與死亡、祭、安息、神形像、列國等主題，也會一路被後面的律法書、先知書、詩歌智慧書與新約重新拾起。
    - >-
      因此讀《創世記》最好的方式之一，不是每讀完一個故事就急著找「人生小教訓」，而是問：
      **這段故事把哪一條大主線往前推了一步？**
  source_ids: [CT00, KC0, BIBLEPROJECT]

reading_guide:
  title: 第一次讀，可以這樣抓
  items:
    - 先看每一段「神做了什麼」，再看人物做了什麼；神才是全書真正不斷出場的主角。
    - 每次看到「福／咒詛、後裔、地、約、兄弟、長子、饑荒、離開／歸回」時，留意它是否在重複或翻轉前面的故事。
    - 家譜先不要全跳過，至少看它把哪一個故事接到哪一個故事，以及焦點最後落到誰身上。
    - 讀到 1–11章的科學、歷史與古代近東問題時，把「文本想說什麼」與「現代研究能驗證什麼」分開問。
    - 讀族長故事時，不要預設聖經記載某人的行為就等於贊成那個行為；敘事常常讓後果自己說話。
  source_ids: [BIBLEPROJECT, ENTER_THE_BIBLE, YALE]

