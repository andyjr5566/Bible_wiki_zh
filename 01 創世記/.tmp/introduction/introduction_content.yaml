hero:
  eyebrow: 聖經第一卷書・摩西五經的開端
  title: 創世記 Introduction
  lead: >-
    《創世記》把聖經許多最基本的問題放在開頭：世界從哪裡來？人是誰？罪與死亡怎麼進入人的世界？
    神為什麼揀選亞伯拉罕一家？而這一家又為什麼最後到了埃及？全書從天地與全人類開始，
    逐步聚焦到亞伯拉罕、以撒、雅各與約瑟，為後面的《出埃及記》和整本聖經鋪設背景。
  source_ids: [CT00, GT00, KC0, BH, BIBLEPROJECT]

