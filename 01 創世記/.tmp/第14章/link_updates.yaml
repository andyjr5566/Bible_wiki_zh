"updates":
- "title": "面東定向的左右方位"
  "path": "link_folder/背景/面東定向的左右方位.md"
  "summary": "第15節記亞伯蘭追擊四王「又追到大馬色左邊的何把」。GT 丁良才《創世紀註釋》在此註明「左邊就是北邊」，並直接回指創十三9 的方位慣例；呂振中譯則逕譯作「大馬色北邊的何把」。同一個方位詞，和合本用身體座標（左），呂振中用羅盤座標（北）。"
  "relation": "這是本卷第二次用到面東定向的慣例，用法卻與創十三9 相反：那裡是亞伯蘭主動用「左右」讓地，這裡是敘事者用「左邊」標定一個地點的位置。兩處合看可以確認這不是修辭而是通行的地理表述——談方向時以人面朝東為準，因此北在左、南在右。讀者若按現代習慣把「左邊」理解成西邊，整條追擊路線的方向就會反過來。"
