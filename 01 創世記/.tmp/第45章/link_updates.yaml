updates:
- title: 悔改與良心的覺醒
  path: link_folder/神學/悔改與良心的覺醒.md
  summary: "本章是前三章那場良心工作的結果。GT《聖經精讀本》就第1節列出約瑟此時願意不再掩飾身分的三個理由：哥哥們已真正悔改（創42:21；44:16）；他們對年邁父親的孝心（創44:19-32）也得到證實；他們對弟弟便雅憫懷著純潔的愛（創44:33-34）。約瑟自己則在第5節說「不要因為把我賣到這裡，自憂自恨」——CT 指出「憂」是愁煩、「恨」是責怪，這正是人知道自己作錯事後該有的反應，而約瑟到此已經兩次聽見他們說這樣的話（創42:21-22；44:16）。"
  relation: "認罪在創42章開口、在創44章由猶大代表全體說出，到本章才收到回應：那位被賣的弟弟不但沒有報復，反而叫他們不必再自憂自恨。KC 指出，正是猶大口中所顯出的恩典工作的確據，使約瑟再也控制不住自己。良心的覺醒在這裡不是終點而是門檻——精讀本注意到兄弟們的恐懼並未一次除盡，多年之後（創50:15）陰影仍在，而第24節「你們不要在路上相爭」也正是為了防止他們回程時彼此追究當年的責任。"
