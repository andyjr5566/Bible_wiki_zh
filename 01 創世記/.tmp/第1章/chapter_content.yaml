organization: "### 起初的創造與未成形的地（v1-2）\n\n全章以「起初，神創造天地」立根。四家來源一致指出，這節宣告神是萬有的創造主，而非\n\
  與混沌爭戰、或藉既有材料受限地加工的工匠。BH 指出希伯來文 *bara*（[[創造（從無到有）|創造]]）\n「專用於神的作為」，含 *ex nihilo*（從無到有）之意；GT\
  \ 引丁道爾指出 *bara* 的主詞在\n舊約中一律是神，串珠更統計此字在舊約出現四十四次、每次都描寫神造出「簇新的、前所未有的」\n東西。「起初」與約翰福音的「太初」有別：GT\
  \ 諸家與 CT 都說本節的「起初」是**時間的起點**\n（時間本身也是受造），約1:1 的「太初」則指基督超越時空、自有永有的本質（見\n[[約翰福音1章道與創造|約1:1-3]]）。「神」（Elohim）原文為複數，GT\
  \ 引啟導本稱之為\n「華麗的多數」，動詞卻用單數，指向獨一而又蘊含多元的神，隱約預告了\n[[三位一體在創造中的隱現|三位一體]]。第2節，[[神的靈的角色|神的靈]]「運行」在水面上，\n\
  原文有覆翼、盤旋、輕撫、愛育之意（申32:11 母鳥護雛），KC、BH、精讀本都由此看見神親密、\n賦生命的看顧。\n\n第2節「[[空虛混沌的原意|空虛混沌]]」（*tohu\
  \ wabohu*）如何解，是本章第一個\n[[創世記1章第1-2節間隔問題|解經分歧]]，各家並不一致，不宜壓成單一結論：\n\n| 立場 | 對「空虛混沌」的解讀\
  \ | 主要代表 |\n| --- | --- | --- |\n| 間隔／復造說 | 神起初所造的地本美好有序，後遭審判才變荒涼；3-31 節是「復造、恢復」\
  \ | CT（黃迦勒）；GT 中的丁良才、李道生 |\n| 初始未成形說 | 起初的地本即未成形、無居住，神隨即分別、充滿使之成序，並非審判的結果 | GT 中的丁道爾、啟導本、精讀本、雷氏（精讀本與雷氏明文反對「缺口說」）；BH\
  \ |\n| 立場轉變 | 早期因「未成形」一詞而採間隔說，後改認為神可先造未成形之物、再繼續塑造充滿 | KC |\n\n> [!note] 一處要修正的來源歸屬\n\
  > 舊版整理把「復造說」整片掛給「CT／GT」。實際上 GT 是多家文集、內部並不一致：\n> 丁良才、李道生採間隔／復造說，丁道爾、啟導本、精讀本、雷氏卻主張起初即未成形、\n\
  > 隨即被安排成序，其中精讀本與雷氏還明白反對「缺口」讀法。故此處按家並陳、不再籠統。\n\n### 前三日：神以話語分別、命名、立界（v3-13）\n\n前三日的主調是「分別」。神三次分開：光與暗（v4）、上下之水（v7）、海與地（v9-10）；\n\
  精讀本與雷氏都點出這三次劃分，保羅並以光暗之分喻信與不信、義與不義（林後6:14）。\n推動這一切的是[[神的話（創造媒介）|神說]]——第3節起「神說」反覆出現，詩人說「他說有，\n\
  就有；命立，就立」（見[[詩篇33篇神話語創造|詩33:6、9]]），來11:3 說諸世界是藉神的話造成的；\n丁道爾強調「說」字排除了宇宙自我存在、或是爭鬥產物、或是神性衍生物等錯誤。神又為所造之物\n\
  命名——稱光為晝、稱暗為夜、稱空氣為天、稱旱地為地與海。多家（CT、啟導本、精讀本、雷氏、\nKC、BH）都指出，在閃族文化裡[[神命名與主權|命名即表明主權與所有權]]（王下23:34）。\n\
  \n每一日大體循同一節奏。精讀本把神的創造事工歸為五個環節：\n\n```mermaid\nflowchart LR\n  A[\"神說（宣告）\"] -->\
  \ B[\"就有了／事就這樣成了（成就）\"]\n  B --> C[\"神看著是好的（評價）\"]\n  C --> D[\"神稱…（命名、界定主權）\"]\n\
  \  D --> E[\"有晚上，有早晨（劃分一日）\"]\n```\n\n但這節奏有兩處例外，正好是解經的觀察點：其一，命名（「稱」）只出現在前三日；其二，\n\
  唯獨**第二日沒有單獨說「神看著是好的」**。CT 推測是因空中有屬靈氣的惡魔居住（弗6:12），\nKC 則指出第31節的「甚好」已把第二日一併涵蓋——兩說並存，本章不必替任一家定案。第三日\n\
  神再命地長出青草菜蔬與果樹，「[[各從其類]]」；CT 與丁良才都統計此語在本章共出現**十次**，\n強調物種的界限出於神的定規、並非漸次演化而成。\n\n\
  ### 後三日：神充滿受造界，光體與生命各從其類（v14-25）\n\n若說前三日是備好舞台，後三日就是充實其上的居民。第四日造「[[光體作記號定節令|光體]]」\n\
  分晝夜、作記號、定節令、日子、年歲。這裡有一個明顯的**去神話化**筆法：GT 所收的\n《舊約背景註釋》指出，本章刻意迴避「日」「月」之名（那正是周邊列邦日神、月神的名字），\n\
  只稱「兩個大光」；BH 也一再強調日月星辰並非神明，而是受神管轄的受造物，不可敬拜\n（KC 引申4:19；17:3）。第五日神以話語使水中滋生水族、空中滋生飛鳥，並第一次向受造物\n\
  「賜福」，命其滋生繁多、充滿。第六日先造地上活物，分牲畜、昆蟲（爬行之物）、野獸三類，\n丁道爾指出這些原文詞分別對應家畜、貼地的小動物與自由漫遊的野獸。\n\n\
  後三日與前三日並非平行流水帳，而是「充滿」對應「分別」的呼應結構。GT 所引丁良才把它排成\n對照表，並說「前三日的工是預備後三日的工，後三日的工是成全前三日的工」；KC\
  \ 也逐日對應\n（四日連於一日、五日連於二日、六日連於三日）：\n\n| 前三日：分別、立界 | 後三日：充滿、充實 |\n| --- | --- |\n|\
  \ 第一日　光（v3-5） | 第四日　光體：日、月、星（v14-19） |\n| 第二日　空氣、上下之水（v6-8） | 第五日　水族、飛鳥（v20-23）\
  \ |\n| 第三日　陸地、草木（v9-13） | 第六日　走獸、人（v24-31） |\n\n這正是[[六日復造的結構|六日創造前後呼應的結構]]所要凸顯的：創造有秩序、有界限、有目的，\n\
  不是混亂堆疊。\n\n### 第六日的高峰：按神形像造人、治理託付與食物（v26-31）\n\n第26-31節是全章高峰。造人的引言與別的受造物不同——「我們要照著我們的形像……造人」。\n\
  多家指出「我們」暗示神格中的商議與[[三位一體在創造中的隱現|三位一體]]；不過來源在此也有\n分寸：精讀本列出「自督、三一、與天使商議、莊嚴複數」四種讀法而擇三一，賈斯樂郝威則提醒\n\
  複數代名詞要與複數的 Elohim 相配、單憑文法未必能證三一，惟新約（約1:1 等）清楚見證聖子、\n聖靈有份於創造。「[[形像與樣式|形像]]」與「[[形像與樣式|樣式]]」，CT\
  \ 分辨為裡面的性情\n（心思、情感、意志）與外面的體格；串珠、啟導本、KC、BH 則同強調人因此像神卻不是神，能與神\n相交、在地上作神的代表。神「照著他的形像[[人的尊嚴與神的形像|造男造女]]」——丁道爾指出\n\
  耶穌把此節與二24 並列為婚姻的兩根柱石（可10:6-7），並預示新約兩性在靈裡平等（加3:28）；\nKC、BH、GT 都據此強調當尊重每一個人（彼前2:17；雅3:9）。\n\
  \n接著是[[生養眾多與治理|生養眾多、遍滿、治理]]的託付，以及[[治理與管理|管理]]海、空、地上\n活物（呼應[[詩篇8篇人的治理權柄|詩8篇]]）。這治理是管家職分、不是剝削：啟導本稱之為神與人\n\
  所立管理地球的「大憲章」，但明言不可濫用、浪費、破壞；BH 更指合神心意的治理應是基督式的\n僕人領導（可10:42-45），以愛護與建立為核心。最後神安排食物：菜蔬與有核的果子賜給人、青草\n\
  賜給走獸飛鳥（[[原初素食與受造界和平|墮落前原是素食]]）。CT、丁良才、KC、精讀本都指出，此時\n受造界沒有流血吞食，直到洪水以後神才准人吃肉（見[[創世記9章洪水後准吃肉|創9:3]]）；這未流血的\n\
  和平要在彌賽亞的國度重現（賽11:6-9）。至此神看著一切所造的都[[神看為好（甚好）|甚好]]——\n丁良才說神的作為由「浩大、奇妙、完全」而至「甚好」，人是這創造的中心與目的。\n\
  \n### 跨章脈絡：創造的節奏、預表與應用\n\n貫穿全章，*bara*（從無到有的創造）其實只出現三次，精確標記三重飛躍——這是 CT、GT\n（丁良才、精讀本）與雷氏共同的觀察；其餘各處用的是\
  \ *asah*（製造、設立、派定），指對已有之物的\n安排。\n\n| *bara* 出現處 | 受造 | 飛躍 |\n| --- | --- | --- |\n\
  | 1 節 | 天地（物質宇宙） | 從無 → 物質 |\n| 21 節 | 大魚與水中活物（動物生命） | 物質 → 生命 |\n| 27 節 | 人 | 生命\
  \ → 人 |\n\nCT 的「靈訓要義」與 KC 通篇更把六日次序讀成[[六日創造與信徒重生經歷|信徒重生的歷程]]：\n靈運行、光照歸主（一日）→ 分別上下（二日）→\
  \ 脫離死亡權勢、心田結果（三日）→ 站住屬天地位\n發光（四日）→ 勝過環境的試煉（五日）→ 生命成熟、彰顯神形像掌權（六日）。KC 並把整章讀為神\n終極計畫的縮影：神將受造界交給亞當夫婦，也要把萬有交給「末後的亞當」基督與教會（林前15:45；\n\
  弗1:10、22），基督終必作宇宙的中心（詩8:4-9；啟5:13）。至於[[創造日長度問題|六日的「日」有多長]]，\nBH 並陳「二十四小時」與「長時期」兩讀，KC、CT、GT\
  \ 諸家（尤其 KC 據出20:11）則偏向普通一日；\n本章按爭議並陳，不代它定案。\n\n幾點應用反思：\n\n- 信仰從「起初神」開始：世界與人都不是偶然，生命的意義也不是自我發明出來的。\n\
  - 神的話帶出光與秩序；人的混亂不能靠自我命名得救，仍需神的光照與分別。\n- 人的尊嚴與責任相連：按神形像被造，意味人既不可被貶低，也不可把受造界當成任意消耗的資源。\n\
  - 對解經爭議要誠實：來源不一致時，最好的整理不是抹平差異，而是點名並陳、讓經文主線清楚。\n- 治理是管家職分而非剝削：權柄來自神的委派，當以基督式的僕人領導愛護、建立所託付的一切。"
