name: 與古代近東創世神話的對比
type: 背景
secondary_types: []
aliases: []
status: formal
definition: 創世記第1章用當時古代近東共有的宇宙語彙描寫創造，卻在關鍵處與周邊創世神話形成對比。《舊約背景註釋》指出：在巴比倫《埃努瑪埃利什》等記述中，創造是諸神爭戰的結果——組織宇宙的神必須勝過混沌（查馬特）勢力才帶來秩序，人類則由黏土混合被殺之神的血一次造成、生來是供諸神使喚的奴隸；創世記卻描繪獨一真神安詳而有條不紊地創造，與敵對勢力的爭戰無關，且整個宇宙都是為人類而造、以人為受造焦點。經文並刻意迴避「日」「月」之名（僅稱「兩個大光」），把海中大魚、天體等一律貶為受造物，全面除去古代宇宙觀中的神格成分。
development: 這種「借用語彙、顛覆神學」的手法是通貫舊約的解經視角：作者採用當時世界共有的宇宙圖像，卻在去神化、非爭戰、以人為中心三點上與異教徹底分道。同樣的對照在後續敘事反覆出現（洪水對比《吉爾伽美什》、巴別塔對比廟塔、族長習俗對比努斯與馬里文獻），是理解摩西五經如何在多神環境中宣告獨一神主權與創造次序的重要背景。
accumulations:
- book: 創世記
  chapter: 1
  summary: 舊約背景註釋逐段對比創1與埃努瑪埃利什等近東神話：非諸神爭戰、宇宙功用觀、人為受造中心非眾神奴隸、天體與海獸去神化。
  relation: 本章以近東共有的宇宙語彙宣告獨一真神的創造，顛覆周邊多神、爭戰、人為奴隸的世界觀。
