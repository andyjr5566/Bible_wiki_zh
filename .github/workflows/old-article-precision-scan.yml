name: Old Article Precision Scan

on:
  push:
    branches: [test/attribution-fidelity]

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML
      - name: Scan completed Pentateuch chapters
        run: |
          python - <<'PY'
          from pathlib import Path
          from util.check_quote_fidelity import (
              normalize, collect_targets, QUOTE_PATTERNS, ELLIPSIS_RE, MIN_FRAGMENT_CHARS,
          )
          from util.book_paths import book_directory
          from util.source_excerpts import parse_manifest

          ROOT = Path.cwd()
          scripture_parts = []
          scripture_files = 0
          for path in sorted((ROOT / 'raw_scripture').glob('*/第*章.txt')):
              scripture_parts.append(normalize(path.read_text(encoding='utf-8', errors='ignore')))
              scripture_files += 1
          SCRIPTURE = ''.join(scripture_parts)
          print(f'PRELOAD scripture_chapters={scripture_files} normalized_chars={len(SCRIPTURE)}')

          def chapter_corpus_fast(book, chapter):
              manifest = book_directory(ROOT, book) / '.tmp' / f'第{chapter}章' / 'source_manifest.md'
              if not manifest.is_file():
                  raise FileNotFoundError(manifest)
              parts = [SCRIPTURE]
              for _label, path in parse_manifest(manifest, ROOT):
                  path = Path(path)
                  if path.is_file():
                      parts.append(normalize(path.read_text(encoding='utf-8', errors='ignore')))
              return ''.join(parts)

          def scan(book, chapter, min_chars):
              corpus = chapter_corpus_fast(book, chapter)
              total, misses = 0, []
              for label, text in collect_targets(book, chapter, ROOT):
                  seen = set()
                  for pattern in QUOTE_PATTERNS:
                      for match in pattern.finditer(text):
                          quote = match.group(1).strip()
                          if len(quote) < min_chars or quote in seen:
                              continue
                          if '／' in quote or '/' in quote:
                              continue
                          seen.add(quote)
                          total += 1
                          if normalize(quote) in corpus:
                              continue
                          if ELLIPSIS_RE.search(quote):
                              pieces = [f.strip() for f in ELLIPSIS_RE.split(quote) if f.strip()]
                              fragments = [f for f in pieces if len(f) >= MIN_FRAGMENT_CHARS] or pieces
                              if fragments and all(normalize(f) in corpus for f in fragments):
                                  continue
                          misses.append((label, quote))
              return total, misses

          books = {
              '創世記': 50,
              '出埃及記': 40,
              '利未記': 27,
              '民數記': 36,
              '申命記': 34,
          }
          for floor in (10, 2):
              print(f'=== FLOOR {floor} ===')
              grand_quotes = grand_misses = chapters_scanned = chapters_with_miss = 0
              for book, last in books.items():
                  bq = bm = bc = bw = 0
                  for chapter in range(1, last + 1):
                      try:
                          total, misses = scan(book, chapter, floor)
                      except FileNotFoundError:
                          continue
                      chapters_scanned += 1
                      bc += 1
                      grand_quotes += total
                      bq += total
                      grand_misses += len(misses)
                      bm += len(misses)
                      if misses:
                          chapters_with_miss += 1
                          bw += 1
                          print(f'CHAPTER {book}{chapter}: quotes={total} misses={len(misses)}')
                          for label, quote in misses:
                              q = ' '.join(str(quote).split())
                              print(f'  MISS | {label} | {q}')
                  print(f'BOOK {book}: chapters={bc} quotes={bq} misses={bm} chapters_with_miss={bw}')
              print(f'TOTAL floor={floor}: chapters={chapters_scanned} quotes={grand_quotes} misses={grand_misses} chapters_with_miss={chapters_with_miss}')
          PY
