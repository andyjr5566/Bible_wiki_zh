name: Maintenance Prompt Cleanup One Shot

on:
  push:
    branches: [test/attribution-fidelity]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python util/dev_patch_maintenance_prompt.py
      - name: Commit exact patch
        run: |
          if git diff --quiet -- agent_maintenance_prompt.md; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_maintenance_prompt.md
          git commit -m "test: keep maintenance prompt neutral [skip ci]"
          git push
