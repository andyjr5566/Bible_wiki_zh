book: 出埃及記
chapter: 37
updates:
- title: 一他連得精金（燈臺用金量）
  path: link_folder/原文/一他連得精金（燈臺用金量）.md
  summary: 出37:24「他用精金一他連得做燈檯和燈檯的一切器具。」CT 的〔原文字義〕給「他連得」為重量單位（合約34~42.5公斤），並在文意註解取「一他連得約合三十四公斤重」，解為「整座燈檯和附屬器具都是用三十四公斤重的精金錘成的」。BH 給的數字相同：一他連得是很重的分量，約七十五磅或三十四公斤，顯出燈臺及其附件的巨大價值；而用單單一他連得金子做成整座燈臺與全部器具，顯出神供應與設計的合一與完整。
  relation: 這個數字是本章唯一一處以重量計價的記載，它把燈臺與其他器具區別開來：別的器具記尺寸，燈臺記金重。CT 在靈意上讀為「『一他連得』表極其寶貴且完整的」，並解「教會做金燈檯在神看來是極其寶貴的，因為全然出於神的作為」。而這一他連得不只做燈臺本身，還包括七個燈盞、蠟剪和蠟花盤——連清理燈花的小工具都在同一塊金子的預算裡。
- title: 基路伯（施恩座）
  path: link_folder/主題/基路伯（施恩座）.md
  summary: 出37:7-9 用金子錘出兩個基路伯安在施恩座兩頭，二基路伯接連一塊（同一塊精金錘出），高張翅膀遮掩施恩座，臉對臉朝著施恩座。CT：基路伯是一種有長翅翼的活物，與撒拉弗相似的特別使者（參創3:24；王上6:23-28；結9:3），意即「那些被緊握著的」；聖經特別稱他們是「榮耀的基路伯」（來9:5）。GT 李道生《舊約聖經問題總解》把三處會幕中的基路伯放在一起看：「在古時的會幕中，有提到基路伯的事，是在幔子上，在內幔上，在法櫃施恩座上」，並作出分辨——「在伊甸園中的基路伯，是見證神降罰於人（創三24）；在會幕中的基路伯，是見證神施恩於人」；他也指出施恩座上的基路伯「看來其形像大概像人；這和以西結書中所記的，或有些不同的地方（結一4－14）」。GT《聖經精讀本》：「象徵神臨在的地方常有基路伯,所以把基路伯和施恩座連在一起(賽6:1-3;結1:1-28;啟4:6-8)」，而「朝著施恩座」則「表示敬畏臨在施恩座上面的神」。KC：希伯來書稱他們為「那榮耀的基路伯遮掩著施恩座」（來9:5）。BH：兩個基路伯臉對臉、目光朝著施恩座，凸顯了神的贖罪與同在才是中心。
  relation: 本章首次記載施恩座上基路伯的實際製作——兩個基路伯與施恩座由同一塊精金錘出，CT 讀為「神榮耀的見證是一致的」，而「錘出」表徵神榮耀的見證需經過受苦的試煉。李道生的分辨給了這一處基路伯一個明確的位置：伊甸園口的基路伯把守生命樹的路、見證神降罰於人；會幕裡的基路伯遮掩施恩座、見證神施恩於人——同一種活物，站在救恩史的兩端。CT 在話中之光另留了一個張力：神在出20:4、23 命令不可造任何形像，這裡卻親自吩咐人造基路伯的像。
- title: 壇的四角（香壇）
  path: link_folder/主題/壇的四角（香壇）.md
  summary: 出37:25-26 香壇是四方的，壇的四角與壇接連一塊，並與壇的上面、四面同被精金包裹。CT 解構造：「意指在壇的四個角落，各做一個動物的角狀物，是與壇連成一體的」；靈意上「高二肘，壇的四角與壇接連一塊」表徵見證基督全備的代禱能力（來7:25）。BH：壇的四角是壇體不可分的一部分，象徵力量與權柄——在聖經時代，角常代表權柄與保護（王上1:50-51）；四角與壇一體，顯出壇之目的的完整；而贖罪之禮要把血抹在四角上（出30:10），預表基督最終的贖罪與祂的中保之工。
  relation: 本章首次記載香壇四角的實際製作。四角之所以要「與壇接連一塊」，在功能上是因為它們要承受贖罪日抹上的血；在 CT 的讀法裡，這種不可分割正對應基督的代禱能力與祂的位格不可分離。香壇的四角與燔祭壇的四角同名而不同場所——一個在幔子外的聖所，一個在院子裡。
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出37 全章每一件器具的製作都嚴格依照神在山上指示的樣式——約櫃（出25:10-16）、施恩座（出25:17-22）、陳設餅桌子（出25:23-30）、金燈臺（出25:31-40）、金香壇（出30:1-10）、聖膏油與淨香（出30:22-38）。GT《丁道爾聖經註釋》指出本段的編排並不是照原啟示的次序：「本段的安排和前面經文（出二十五31）不同，而是依照建築工程的自然次序。譬如首先建築帳幕，才製造其中的器皿。經文一起討論香壇和帳幕內部的其他物件；洗濯盆是戶外大院的陳設，本段亦一起討論。……這一切都顯出材料經過小心而有系統的重整，並非無意識的重複。」GT《串珠聖經註釋》另指出兩處簡化：造香壇一段「沒有提及贖罪日的儀式，理由是利16章有詳細的記載」，而造香及聖膏油一段「前一段用較長的篇幅形容這兩類聖物，現在卻簡化為一節」。KC：房子造好之後，才造要擺進房子裡的器具——先是約櫃，緊接著是有兩個基路伯的施恩座。
  relation: 本章是「山上的樣式」在器具層面的全面執行，但執行的次序並不等於啟示的次序。CT 在話中之光把這個差別說成兩條路：「神的啟示先是從至聖所開始，自約櫃至銅祭壇。但當他們建造時就先從外面開始，從人的經歷開始：罪人進入會幕，最先見到的是銅祭壇。這與五祭的次序相同（利1-5章）。」丁道爾則從編輯的角度看同一件事：重整是有系統的，不是無意識的重複。
- title: 施恩座
  path: link_folder/主題/施恩座.md
  summary: 出37:6-9 用精金做施恩座，長二肘半寬一肘半（與約櫃尺寸完全相同）；用金子錘出兩個基路伯安在施恩座兩頭，二基路伯接連一塊，高張翅膀遮掩施恩座，臉對臉朝著施恩座。CT：施恩座英文名叫「憐恤座或慈悲座」（Mercy Seat），希伯來原文字根有「遮蓋」的意思，因此它是約櫃上面一塊精金做的厚蓋板，具有遮蓋罪或贖罪的功用。BH 給出原文：施恩座希伯來文作 kapporet，是約櫃的蓋，象徵神在地上的寶座；大祭司在贖罪日把祭牲的血彈在其上（利16:14-15），預表基督成為我們的挽回祭（羅3:25）。KC：施恩座對我們已經成了「施恩的寶座」，我們可以坦然無懼地來到這寶座前，「為要得憐恤，蒙恩惠，作隨時的幫助」（來4:16）。
  relation: 本章首次記載施恩座的實際製作——整塊精金，與約櫃同尺寸。CT 由這個「一模一樣」讀出一組對照：「約櫃表神的公義，施恩座表神的恩典；公義多大，恩典也多大。施恩座放在櫃上：恩典在公義之上。」他又說：「約櫃的裡面有法版，人看不見，上面有施恩座，人看得見，表明律法是被恩典遮蔽了；由此可見，神的寶座不是要審判定罪人，乃是要施恩給人。」但 CT 同時設下界限：「恩典不是縱容人犯罪，而是以櫃為基礎的（出34:7）。」
- title: 杏花杯球花（燈臺裝飾）
  path: link_folder/原文/杏花杯球花（燈臺裝飾）.md
  summary: 出37:17-22 燈臺的座和幹與杯、球、花都是接連一塊錘出來的；六個枝子每枝上有三個杯形狀像杏花有球有花，燈臺上另有四個杯；每兩個枝子以下有球與枝子接連一塊。CT 的〔原文字義〕給「杯」為「杯，碗」、「球」為「圓球，柱頭」、「花」為「花苞，嫩芽」，並解「『球』指花形杯底部的花萼；『花』指花形杯上雕塑的花瓣」。CT 另記下兩處異議：杯的用途有兩種解釋（是燈盞，或是承接自然掉落的燈花），而「有的解經家根據KJV英譯文with a knop and a flower in one branch，認為每個枝子上僅有一球一花」。BH：杏樹是以色列最早開花的樹，象徵儆醒與神應許的速成——耶1:11-12 神正是以杏樹枝表明祂看守自己的話去成就；杏花也與亞倫發芽的杖相連（民17:8），標示神的揀選與權柄。
  relation: 這些裝飾不是附加上去的，而是與燈臺同出一塊精金——CT 由此讀出「球和枝子是接連一塊」表徵眾信徒藉生命長大過程中的試煉而結合配搭在一起。CT 也把杏花接到民17:8 亞倫的杖開熟杏的花，解為復活的生命，並把「有球有花」解為「花萼和花瓣須經過細心捶打而成功的」——裝飾的美，是錘出來的。
- title: 比撒列（Bezalel）
  path: link_folder/人物/比撒列（Bezalel）.md
  summary: 出37:1 比撒列用皂莢木做櫃。GT 丁良才：「比撒列親自製造法櫃，無非因為約櫃是至聖的，不然，就是比撒列指揮人做的。」GT《聖經精讀本》：「在聖物的具體製作過程中,唯一提到的人物是比撒列,因為他是被選出來做櫃的人,可能他是當時充滿神的智慧的最好的工匠。」GT《丁道爾聖經註釋》處理本節與申10:3 的張力：「本節和形容摩西作櫃子的申命記十章3節並無衝突（該節的意思是『摩西使人作櫃子』）。出埃及記完全沒有提到摩西本人有製造工藝品的能力和技巧。」CT 在第10節指出其後的「他」可指比撒列，也可是參與製作的工匠之集合代名詞。BH：比撒列是神所揀選的巧匠，是負責造約櫃的主要工匠。
  relation: 本章是比撒列的名字在全卷最後一次以主詞出現，而且落在最重的一件器具上。丁良才的讀法給了一個分工上的推論：本章其餘器具很可能是他指揮工匠做的，唯獨約櫃是他親手做——聖物的等級決定了誰動手。CT 也指出全章從第10節起改用單數的「他」，這個主詞的模糊與出36 是同一條線。
- title: 皂莢木
  path: link_folder/原文/皂莢木.md
  summary: 出37:1、4、10、15、25、28 約櫃與櫃的槓、陳設餅桌子與桌子的槓、香壇與壇的槓都用皂莢木製作。CT 說明它的性質：「『皂莢木』是產於西乃曠野沙漠中的一種木料，它的質地堅實、稍具芳香，是製作傢俱和器具的良好材料。」BH：皂莢木耐久、抗腐，象徵神之約的長存；皂莢樹在西乃一帶隨處可見，取材便利。
  relation: 本章記載皂莢木在三件木框器具及其抬槓上的使用——凡有木框的器具都用它，而施恩座與燈臺是整塊精金錘出、完全不用木。CT 在話中之光把這種木頭讀成基督的性質：「皂莢木生長在曠野，是一種堅固不易朽壞的木頭，這是表明主耶穌的性質非常堅固，不會朽壞。遭遇一點患難就退縮的人，他的個性對神方面並不堅強，最容易中魔鬼的詭計。」木包上金，CT 讀為神人二性；而抬槓同樣是木包金，「表徵神僕人的見證須從神而來，全靠神『包金』的裝飾」。
- title: 精金
  path: link_folder/主題/精金.md
  summary: '出37:2、6、11、16、17、22、23、24、26 約櫃裡外包精金、施恩座用精金、桌子包精金、桌子器皿用精金、燈臺整塊用精金錘出、七個燈盞用精金、香壇包精金。GT《聖經精讀本》給出原文與範圍：「精金: 希伯來文表示『純金』,是從普通金子中提煉出來的精華。聖所裡只有施恩座和燈檯是用精金製作的」；又在第6節說明為什麼用它：「聖所的器物大部分都用精金製作,原因是金子具有不變性、貴重性和尊貴性。」CT 在話中之光補上神學的理由：「金的美麗體現了神的榮耀和威嚴，其不變的屬性體現了神對約的不變性。所以會幕中重要的器具都用精金包裹，特別是施恩座（櫃的蓋）則是完全用精金製作的。」BH：在古代近東，金常與王權和神性相連；純金不朽壞，象徵神永恆不變的性情，也標示出聖所這個空間的神聖。'
  relation: 本章記載精金在至聖所和聖所全部器具中的廣泛使用——從約櫃到最小的燈盞。而精金與「包金」在本章是兩種不同的作法：約櫃、桌子、香壇是木框包金，施恩座與燈臺卻是整塊精金錘出；GT《聖經精讀本》正是在這一點上劃線——聖所裡只有施恩座和燈臺是用精金製作的。CT 在靈意上把包金讀成神人二性，把整塊精金讀成神性的完全。
- title: 約櫃
  path: link_folder/主題/約櫃.md
  summary: 出37:1-5 比撒列用皂莢木做櫃，長二肘半寬一肘半高一肘半，裡外包精金、四圍鑲金牙邊；鑄四個金環安在四腳上，這邊兩環那邊兩環；用皂莢木做兩根槓用金包裹，把槓穿在櫃旁的環內以便抬櫃。CT 折算尺寸：一肘約合45公分，故約櫃長約一百十三公分，寬與高均約六十八公分；CT 並指出櫃內存放兩塊法版、嗎哪、亞倫發過芽的杖（來9:4）。金環的位置有爭議——CT：「大多數解經家認為應當安在兩短頭而非兩長邊，這樣，才可以穿杠抬櫃向前直行，無須迴旋。」KC：約櫃連同其上的施恩座，是至聖所裡唯一的物件；希伯來書的作者稱它為「約櫃」（來9:4），並以「四面都包上金子」描述它的榮耀，同節還提到「有盛嗎哪的金罐和亞倫發過芽的杖」（來9:4；出16:33；民17:8-10）。BH：約櫃是神在地上的寶座，它的可攜性對曠野行程是必要的；金環與槓使約櫃不必被人手直接觸摸——撒下6:6-7 烏撒的事件正凸顯了這一點，而抬櫃的職責歸給利未人中的哥轄子孫（民4:15）。
  relation: 本章首次記載約櫃的實際製作，而且是比撒列親手做的。CT 在靈意上把每個部件都讀成見證：皂莢木做櫃表徵神與人立約的見證，裡外包精金表徵耶穌的神人二性，金環安在四腳上表徵為著行動到處顯揚基督。金環位置之爭在實用上有直接後果：安在兩短頭，抬櫃時才能向前直行而無須迴旋。KC 指出希伯來書整卷的教導都在把基督放在新約的中心，與約櫃作為舊約中心成為直接的對比。
- title: 聖膏油
  path: link_folder/原文/聖膏油.md
  summary: 出37:29 又按做香之法做聖膏油和馨香料的淨香。KC：主耶穌是「被聖靈和能力所膏」的（徒10:38）；而在那調製香料的人身上，我們可以看見聖靈的一幅圖畫——惟有祂能供給我們在神家中盡職所必需的。
  relation: 本章以聖膏油和淨香的製作作為會幕器具製造的收尾——膏油表徵聖靈的膏抹，淨香表徵基督的馨香之氣；兩者都是事奉神不可或缺的。
- title: 聖香（清淨聖潔的香）
  path: link_folder/原文/聖香（清淨聖潔的香）.md
  summary: 出37:29 又按做香之法做馨香料的淨香。KC：這清淨馨香的香料之香升到神面前成為悅人的香氣；基督一切大能的作為都散發著馨香，是獻給神為馨香的供物（弗5:2）。
  relation: 本章記載淨香的實際製作——與聖膏油並列為會幕器具製造的收尾；香表徵基督的馨香之氣升到神面前，膏油表徵聖靈的膏抹，兩者相輔相成。
- title: 金燈臺
  path: link_folder/主題/金燈臺.md
  summary: 出37:17-24 用精金做一個燈臺，座和幹與杯、球、花都是接連一塊錘出來的；兩旁杈出六個枝子（這旁三個那旁三個），每枝有三個杯形狀像杏花有球有花；燈臺上有四個杯；每兩個枝子以下有球與枝子接連一塊；球和枝子都是一塊精金錘出來的；用精金做七個燈盞並蠟剪和蠟花盤；用精金一他連得做燈臺和一切器具。GT 丁良才：「『精金』——預表基督和信徒的寶貴（彼前二4-12）。『燈檯的座和幹』——座比方基督為根基（林前三11），幹比方基督在祂的百姓當中凡事居首位（西一18），得榮耀（彼前四11）」；六個枝子「可比方信徒」。GT《聖經精讀本》：六個枝子「加上中間的杆,燈檯共有七個枝子。這裡的『7』表示燈檯發出完全的光」；又在第21節說「如同枝子離開杆不能發光一樣,我們這些信徒若離開生命的根源和所有能力的中心—基督,同樣也會一事無成」。KC：燈臺接在桌子之後製作，這指明我們與神、與基督、並彼此的交通只能在光中進行——「我們若在光明中行，如同神在光明中，就彼此相交」（約壹1:7）；而正如杯作為果子連於燈臺，果子也照樣連於在光中的行事為人（弗5:8-9）。BH：燈臺由一整塊金子做成，強調合一與完全；杏花是以色列最早開的花，象徵儆醒與新生命（耶1:11-12）；七盞燈象徵完全，這意象在啟1:12-13 再現，主耶穌行走在七個金燈臺中間。
  relation: 本章首次記載金燈臺的實際製作——整塊精金一他連得錘出，連杯、球、花都不是另接上去的。CT 由此讀出兩件事：燈臺表徵基督與教會（啟1:20），而它之所以能發光，是「經過不斷受苦的試煉（錘出來）的」。燈臺在陳設餅桌子的對面，KC 把這個位置關係讀成次序：交通（桌子）必須在光中（燈臺）進行。至於那些「形狀像杏花」的杯究竟是燈盞還是承接燈花的器皿，CT 記下了兩種並存的解釋。
- title: 金香壇（香壇）
  path: link_folder/主題/金香壇（香壇）.md
  summary: 出37:25-28 用皂莢木做香壇，是四方的，長一肘寬一肘高二肘，壇的四角與壇接連一塊；用精金把壇的上面與四面並四角包裹，四圍鑲金牙邊；做兩個金環安在牙子邊以下、兩旁兩根橫撐上，作為穿槓的用處以便抬壇；用皂莢木做槓用金包裹。CT 折算尺寸：長寬各約四十五公分成四方形，高約九十公分；並解「橫撐」為壇的兩旁安裝金環的加固部位。KC：金香壇代表敬拜；而希伯來書把這壇算在至聖所裡（來9:3-4上）——這指明它實際的功用是屬於至聖所的；亞倫要在香的雲霧圍繞中才能進入聖所，不然就必死亡（利16:13）。BH：香壇的位置與功用象徵眾聖徒的祈禱升到神面前（詩141:2；啟8:3-4）；壇的四角象徵力量與權柄，在聖經時代角常代表權柄與保護（王上1:50-51），而贖罪之禮要把血抹在四角上（出30:10）。
  relation: 本章首次記載金香壇的實際製作。CT 在靈意上把它讀成代求：「皂莢木表徵基督的人性；燒香的壇表徵基督為大祭司，是眾聖徒的代求者（來7:22）」，而壇高二肘、四角與壇接連一塊，「表徵見證基督全備的代禱能力（來7:25）」。CT 在話中之光給了一個很平實的應用：「基督徒沒有甚麼事能比為人代禱更顯高貴的人性了。」而 KC 由希伯來書把香壇歸入至聖所這一點，指出它的功用其實跨過了幔子。
- title: 陳設餅桌子
  path: link_folder/主題/陳設餅桌子.md
  summary: 出37:10-16 用皂莢木做一張桌子，長二肘寬一肘高一肘半（與約櫃同高），包精金、四圍鑲金牙邊；四圍各做一掌寬的橫樑鑲金牙邊；鑄四個金環安在四腳四角上挨近橫樑，穿槓抬桌子；用精金做桌子上的器皿——盤子、調羹、奠酒的瓶和爵。CT 指出橫樑一節有兩種解釋：一是把它讀成第11節「四圍鑲上金牙邊」的補充說明，即在桌子上邊四圍裝上約七公分半高的邊框以防陳設餅滑落；二是把它讀成另一道結構，即在桌面底部四圍裝上邊框以加固並美化桌子。GT《啟導本聖經腳註》與《串珠聖經註釋》都注意到一件事：本章沒有提陳設餅——「此處未提陳設餅，但見三十九36的名單中」、「只是本處沒有提到陳設餅，直到40:23才提及」。KC 把這個不提讀成刻意：這正好把重點放在桌子本身所代表的——桌子說到交通；藉著主耶穌的工作，人可以與神相交、也可以彼此相交。而關鍵在高度：「桌子和約櫃一樣高。這教導我們：我們的交通是在基督的位格與工作的水平上。我們作為教會信徒的交通，是由祂構成的。藉著祂和祂的工作，我們彼此相連。」因為神呼召我們，是「叫你們一同得分於他兒子我們的主耶穌基督」（林前1:9）。BH：陳設餅的桌子承載著「面前的餅」，代表神的供應以及祂與百姓的相交；桌子的可攜性合乎以色列人在曠野的行程。
  relation: 本章首次記載陳設餅桌子的實際製作，而它與約櫃同高這件事，KC 讀成一條水平線：信徒的交通與基督的位格和工作在同一個高度上。CT 則從器皿讀出供應的完整：「盤子」放陳設餅、「調羹」放淨乳香（利24:7）、「瓶」盛酒、「爵」是奠酒時倒酒用的有尖嘴大口高杯。桌上不提餅，反而讓桌子本身成為重點——餅要到出40:23 才擺上。
- title: 出35-40 逐字複述出25-31
  path: link_folder/主題/出35-40 逐字複述出25-31.md
  summary: 出37 是這段複述中重整最明顯的一章。GT《丁道爾聖經註釋》指出本段「和前面經文（出二十五31）不同，而是依照建築工程的自然次序。譬如首先建築帳幕，才製造其中的器皿。經文一起討論香壇和帳幕內部的其他物件；洗濯盆是戶外大院的陳設，本段亦一起討論……這一切都顯出材料經過小心而有系統的重整，並非無意識的重複。」GT《啟導本聖經腳註》逐段標出對應：出37:1-9 參出25:10-22、10-16 參出25:23-30、17-24 參出25:31-38、25-28 參出30:1-10，而第29節「本節為三十22～38的縮寫」。GT《串珠聖經註釋》另指出兩處刻意的省略與簡化：造香壇一段「沒有提及贖罪日的儀式，理由是利16章有詳細的記載」；造香及聖膏油一段「前一段用較長的篇幅形容這兩類聖物，現在卻簡化為一節」。
  relation: 出36 的複述幾乎是逐字的，出37 卻是重編過的——香壇原本放在出30 的補編，這裡卻與聖所其他器具一起處理。這使「複述」有了兩種形態：一種是機械的重述，一種是按施工次序的重整。CT 另指出建造次序與啟示次序正好相反：「神的啟示先是從至聖所開始，自約櫃至銅祭壇。但當他們建造時就先從外面開始，從人的經歷開始。」
- title: 香壇的位置與歸屬之爭
  path: link_folder/解經爭議/香壇的位置與歸屬之爭.md
  summary: 出37:25-28 記金香壇的製作，而經文把它排在聖所的器具之間。KC 指出希伯來書給了另一個歸屬：神的靈引導希伯來書的作者說，這壇是在至聖所裡（來9:3-4上）——這指明這座壇實際的功用是屬於至聖所的。KC 並以利16:13 為據：亞倫必須被這壇的香圍繞著才能進入聖所，不然就必死亡。CT 從尺寸給出另一個線索：香壇高二肘（約九十公分），高過約櫃與陳設餅桌子（各一肘半）。
  relation: 本章的排序本身就是這場爭議的一部分：經文把香壇與聖所的桌子、燈臺並列，希伯來書卻把它算在幔子內。KC 的解法不是選邊，而是把「位置」與「功用」分開——壇放在幔子外，功用卻屬於幔子內。CT 在話中之光補上一條經歷上的次序：「從至聖所出來，首先遇見金香壇……神先給人生命糧，使人享受，再光照我們，使我們發光；然後祂接受人在香壇的獻上。」
- title: 抬約櫃的槓是否可抽出來
  path: link_folder/解經爭議/抬約櫃的槓是否可抽出來.md
  summary: 出37:4-5「用皂莢木做兩根槓，用金包裹。把槓穿在櫃旁的環內，以便抬櫃。」CT 說明穿槓的位置：「兩根杠穿在櫃的兩短頭底邊腳上的金環，以便抬櫃往前行」，並指出金環該安在哪一面本身有爭議——「大多數解經家認為應當安在兩短頭而非兩長邊，這樣，才可以穿杠抬櫃向前直行，無須迴旋。」BH 指出槓與環的設計是為了讓約櫃不被人手直接觸摸，撒下6:6-7 烏撒的事件正凸顯這一點；而抬櫃的職責歸給利未人中的哥轄子孫（民4:15）。
  relation: 本章只記「把槓穿在櫃旁的環內」，沒有再重述出25 那條「不可抽出來」的禁令——複述在這裡是簡化的。但抬櫃的實務要求並沒有因此改變。CT 在話中之光把它讀成事奉的姿態：「不同心者不能抬，只知自己者不能抬。若打翻就會叫同抬的人受傷，故極嚴肅謹慎。同配搭、同方向、步伐齊、穩步走，不貪快，同心抬如一人。這不是任務，而是服事。」
- title: 壇的槓（抬壇用）
  path: link_folder/主題/壇的槓（抬壇用）.md
  summary: 出37:27-28「做兩個金環，安在牙子邊以下，在壇的兩旁、兩根橫撐上，作為穿槓的用處，以便抬壇。用皂莢木做槓，用金包裹。」CT 解「橫撐」為「在壇的兩旁安裝金環的加固部位」，而金環是為穿插兩根抬壇的槓，一旁一根；靈意上表徵基督代禱的涵蓋能力。BH 指出用槓抬運使聖物不必被人手直接觸摸，這是搬運聖物一貫的作法，也顯出曠野行程中每一件器具都必須可攜。
  relation: 香壇的槓與約櫃、桌子的槓同樣是皂莢木包金，但金環的配置不同——約櫃的環在四腳，桌子的環在四角挨近橫樑，香壇卻只有兩個環，安在牙子邊以下的兩根橫撐上。CT 在話中之光把「隨處可抬」讀成禱告的隨處：「基督徒應當舉起聖潔的手，隨處禱告（提前2:8）。」
- title: 銀號製作工藝（錘出法）
  path: link_folder/文化/銀號製作工藝（錘出法）.md
  summary: 出37:7「用金子錘出兩個基路伯來」；出37:17「這燈臺的座和幹，與杯、球、花，都是接連一塊錘出來的」；出37:22「球和枝子是接連一塊，都是一塊精金錘出來的」。CT 的〔原文字義〕給「錘出」為「錘打的金屬品」，並指出整座燈臺「乃是用一整塊精金錘出來的」。BH 指出錘打黃金這道工序顯出製作的精細與用心，而燈臺由單一一塊金子錘成，強調的是合一與完全。
  relation: 本章把兩種工法分得很清楚：施恩座連兩個基路伯、燈臺連杯球花，是整塊精金錘出；約櫃、桌子、香壇則是木框包金。CT 在靈意上把錘打讀成試煉——「神榮耀的見證（兩個），需經過受苦的試煉（錘出），方能更多彰顯出神性（金）的榮耀來」；燈臺之所以能發光，同樣是「經過不斷受苦的試煉（錘出來）的」。
- title: 奠酒
  path: link_folder/文化/奠酒.md
  summary: 出37:16「又用精金做桌子上的器皿，就是盤子、調羹，並奠酒的瓶和爵。」CT 逐件說明用途：「『瓶』是為盛酒之用的酒壺；『爵』指有尖嘴的大口高杯，是為奠酒時倒酒之用。」BH：這些碗與壺是為奠祭而設，奠祭伴隨素祭一同澆奠給耶和華；把酒傾倒出來的舉動象徵把生命獻上事奉神，保羅正是用這個意象描述自己被澆奠（腓2:17）。
  relation: 本章記的是器皿的製作，不是奠祭的施行——連陳設餅都還沒有擺上（要到出40:23 才提）。但器皿本身已經把預備做完了：盛酒的瓶、傾倒的爵，都用精金做成。BH 指出這些器皿用金，本身就標示了所獻之物的分量。
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 出37:1-9 約櫃與其上的施恩座是至聖所裡唯一的物件，而神應許在施恩座上、二基路伯中間與人相會。GT《聖經精讀本》：「象徵神臨在的地方常有基路伯,所以把基路伯和施恩座連在一起(賽6:1-3;結1:1-28;啟4:6-8)」，而基路伯「朝著施恩座」是「表示敬畏臨在施恩座上面的神」。KC：約櫃連同施恩座是至聖所裡唯一的物件，希伯來書的作者稱它為「約櫃」（來9:4），指回舊約之下神與百姓相會的地方。BH：約櫃是神在地上的寶座，是天與地相交之處。
  relation: 本章是神的同在由「應許有一個相會之處」進入「那個相會之處被造出來」的一步，而且經文把它排在最前面：房子造好之後，第一件造的就是約櫃與施恩座。CT 由施恩座與約櫃同尺寸讀出這個同在的性質：「神的寶座不是要審判定罪人，乃是要施恩給人。」
- title: 挽回祭（羅3：25）
  path: link_folder/互文/挽回祭（羅3：25）.md
  summary: 出37:6-9 用精金做施恩座，二基路伯高張翅膀遮掩施恩座。BH 給出原文與功用：施恩座希伯來文作 kapporet，是約櫃的蓋，象徵神在地上的寶座；大祭司在贖罪日把祭牲的血彈在其上（利16:14-15），而這正是保羅所說的挽回祭——施恩座本身是基督的預表（羅3:25）。BH 並指出兩個基路伯立在施恩座兩頭，見證神與以色列立約並施憐憫的往來。CT 走的是同一條線：施恩座「希伯來原文字根有『遮蓋』的意思……具有『遮蓋罪或贖罪』的功用」。
  relation: 本章記的是這塊蓋板被造出來的一刻，而它的尺寸與約櫃一模一樣——CT 由此讀出「公義多大，恩典也多大」。挽回祭這個新約用語所指的，正是這塊金蓋：罪在下面（法版在櫃裡），血在上面（贖罪日彈血），而神在其上與人相會。
- title: 世界的光（約8：12）
  path: link_folder/互文/世界的光（約8：12）.md
  summary: 出37:17-24 記金燈臺的製作——一塊精金錘出，七個燈盞。CT 在靈意上直接連上：燈臺「表徵基督與教會（啟1:20）；基督是世界的光，又是生命的光（約8:12），教會和信徒也是世上的光（太5:14）」。BH 同樣把燈臺讀成基督的預表，指出杏花的圖案象徵儆醒與應許的速成，而七盞燈的意象在啟1:12-13 再現——主耶穌行走在七個金燈臺中間。GT《聖經精讀本》：六枝加中幹共七枝，「這裡的『7』表示燈檯發出完全的光」。
  relation: 燈臺是聖所裡唯一的光源，而本章把它排在陳設餅桌子之後製作。KC 由這個次序讀出一個條件：交通只能在光中進行（約壹1:7）。CT 則把光的本體與光的傳遞分成兩層——基督是光，教會與信徒是被點亮而發光的燈盞。
- title: 基督代禱（來7：25）
  path: link_folder/互文/基督代禱（來7：25）.md
  summary: 出37:25-28 記金香壇的製作。CT 在靈意註解裡把香壇直接讀成代求：「皂莢木表徵基督的人性；燒香的壇表徵基督為大祭司，是眾聖徒的代求者（來7:22）」，而壇高二肘、四角與壇接連一塊，「表徵見證基督全備的代禱能力（來7:25）」；穿槓抬壇則「表徵基督代禱的涵蓋能力」。KC：金香壇代表敬拜，而希伯來書把這壇算在至聖所裡（來9:3-4上）——它實際的功用屬於至聖所。
  relation: 本章是這條線索在器具上的落點：代求不是抽象的，它有一座壇、有四個角、有兩根槓。CT 在話中之光把它接回信徒：「基督徒沒有甚麼事能比為人代禱更顯高貴的人性了」，並引提前2:8——「基督徒應當舉起聖潔的手，隨處禱告」。
- title: 聖徒禱告如香（啟5：8, 8：3-4）
  path: link_folder/互文/聖徒禱告如香（啟5：8, 8：3-4）.md
  summary: 出37:25-29 記金香壇與淨香的製作。BH 指出香壇上所燒的香代表百姓的禱告升到神面前，並引詩141:2 與啟8:3-4 為據；BH 並指出香的配方載於出30:34-38，與聖膏油一樣不可仿製私用，這正顯出敬拜所要求的真誠與聖潔。CT 在話中之光直接引詩141:2：「願我的禱告如香陳列在你面前，願我舉手祈求，如獻晚祭。」GT《聖經精讀本》：「在香壇上向神燒香的香煙象徵著禱告。」
  relation: 本章把「香」拆成兩件事來做：燒香的壇（v25-28）與香本身（v29）。禱告因此有了兩個面向——升上去的地方，和升上去的內容。CT 在靈意上指出淨香的香料「表徵基督的各種素質美德以及祂的成就，乃是蒙神悅納並垂聽的憑藉」——使禱告蒙垂聽的不是禱告者，而是香。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出37 全章記載會幕內部器具的製作：至聖所的約櫃與施恩座（v1-9），聖所的陳設餅桌子（v10-16）、金燈臺（v17-24）、金香壇（v25-28），以及聖膏油與淨香（v29）。GT《串珠聖經註釋》為全章下的標題是「造會幕內的各樣聖物」；GT《聖經精讀本》：「本文接前一章的會幕實體的建造,介紹了擺設在至聖所和聖所裡的各種器具的製作。」GT《丁道爾聖經註釋》指出本段的編排「依照建築工程的自然次序」——先建帳幕，才製造其中的器皿。KC：房子造好之後，才造要擺進房子裡的器具。
  relation: 出36 造的是房子，出37 造的是房子裡的東西。這個先後在 KC 的讀法裡有一課：信徒要先認識教會是什麼，才會明白其後各件器具所代表的真理。而 CT 指出建造的次序與啟示的次序正好相反——啟示從至聖所的約櫃開始，建造卻從外面開始，也就是從人的經歷開始。
