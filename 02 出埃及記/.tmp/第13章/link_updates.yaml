- title: 歸給耶和華
  path: link_folder/原文/歸給耶和華.md
  summary: "第12節是頭生條例進到迦南之後的執行條文：一切頭生的、並牲畜中頭生的，都要「歸給耶和華」，而「公的都要屬耶和華」。本章第15節再說一次同一件事，用的卻是另一個字——「獻給耶和華為祭」。"
  relation: "這個字的字面意思（使之經過／使之經火）正好把以色列的作法與迦南的作法擺在一起看：同一個動作、同一個字，迦南人可以用在兒女身上，以色列卻只能用在頭生的牲畜身上，而頭生的兒子要贖出來（第13節）。丁道爾指出自亞伯拉罕以降，「將長子當作燔祭獻給神的習俗已經不復存在」，創世記22章的重點正是公羊取代以撒。"
- title: 驢用羊羔代贖
  path: link_folder/原文/驢用羊羔代贖.md
  summary: "第13節在頭生歸神的總則之下開了兩個例外——不潔的牲畜不能獻，人也不能獻。GT 丁良才把這條界線寫成一句話：「聖潔的牲畜必歸於神作犧牲，不潔的被贖或被宰殺。」"
  relation: "GT《串珠聖經註釋》指出本章為什麼單挑驢來講：驢「是很有用但屬不潔的動物，所以要藉羔羊代贖……這裡特別提到驢，因它是從埃及帶出來唯一荷負重載的動物」。丁良才也從當時的畜牧狀況解釋：「當時埃及國的駱駝不多，馬匹多是政府和富戶養的，又是多為拉戰車用的，所以以色列人出埃及只帶著驢。」"
