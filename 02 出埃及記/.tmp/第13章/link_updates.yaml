  relation: "路近不等於路對。CT 列出四個不走的理由，其中兩個與這條路本身有關——沿路設有埃及重兵駐守，且須經過好戰的非利士人領土。"
- title: 神的主權與預定
  path: link_folder/神學/神的主權與預定.md
  summary: "v17-18 非利士地道路雖近、神卻不領他們從那裡走——神領百姓繞道行走紅海曠野路；神的護理與引導超越人的判斷"
  relation: "CT 指出神不領他們走那條近路的理由是「神知道萬事，領以色列百姓走何路不合適，走何路最合適」，並在話中之光加上一句：「神知道並且體恤我們的軟弱（來四15），所以按照我們的實際情形來帶領我們。」丁良才另列出神引導的五種樣子：是連續的、是深奧的（以色列人往往不明白，故此發怨言）、是奇妙的、是完全的（沒有一時錯了）、是長久的（直到迦南）。"
- title: 繞道而行
  path: link_folder/歷史/繞道而行.md
  summary: "CT 為神不領他們走那條近路列出四個緣故：沿路設有埃及重兵駐守；須經過好戰的非利士人領土；以色列人雖號稱「耶和華的軍隊」，實際還沒受過軍事訓練；恐怕他們遇難而退，回埃及地去。"
  relation: "GT《中文聖經註釋》指出這一大段（13:17～14:31）反覆在說同一件事：「神不單領以色列人出埃及，也領導他們當走的道路和不當走的道路。」GT《聖經精讀本》則把距離的代價算了出來：那條捷徑「大概需要四天的路程」，神卻「特意引他們走上了比這條路遠6倍的曠野之路」。"
- title: 紅海曠野
  path: link_folder/地點/紅海曠野.md
  summary: "第18節只有一句話交代路線，卻是全卷地理爭論的起點——神領百姓繞道而行，走的是「紅海曠野的路」，而不是第17節那條最近的路。"
  relation: "GT《中文聖經註釋》指出走過這一段就已經出了埃及的邊境：「由這地區過去，就已經出了古代的埃及邊境而到了西乃半島的曠野地帶。」它並提到有些現代學者因此認為第13章17節到第14章31節屬於「到曠野」的傳統，而非「出埃及」的傳統。"
