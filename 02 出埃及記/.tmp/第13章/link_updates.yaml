- title: 以色列人帶兵器
  path: link_folder/歷史/以色列人帶兵器.md
  summary: "這半節緊接在「神領百姓繞道而行，走紅海曠野的路」之後，兩件事並排：神因為怕他們遇見打仗而繞道，他們卻是帶著兵器上去的。"
  relation: "GT《每日研經叢書》指出這句話的用意：「這裏提及以色列人『以戰鬥的陣容』前進，乃是要強調他們不是一些散兵游勇之逃命。」GT《啟導本》則把兩面都說清楚：他們攜有一些武器，「萬一遇埃及邊防軍，也可以一戰」，但「這枝毫無訓練的『軍隊』，又有大群婦孺與牲畜隨行，決非裝備精良的埃及軍隊的對手。他們能夠勝利，因為有耶和華神為他們爭戰」。"
- title: 約瑟
  path: link_folder/人物/約瑟.md
  summary: "v19 摩西把約瑟骸骨一同帶去——約瑟曾叫以色列人嚴嚴起誓說「神必眷顧你們，你們要把我的骸骨從這裡一同帶上去」"
  relation: "GT《聖經精讀本》把時間跨度說了出來：這「大概是350多年前，堅信出埃及和征服迦南事件的約瑟臨終前對子孫們的遺言（創50:25）」，而「征服迦南地之後，約瑟的遺言得以實現，終於把他的骸骨埋在了迦南的示劍地裡（書24:32）」。丁良才指出約瑟叫以色列人起誓這件事本身就是信心的表示：「顯明他深信神必將迦南地賜給亞伯拉罕的後裔（來十一13-22）。」"
- title: 約瑟骸骨
  path: link_folder/歷史/約瑟骸骨.md
  summary: "這一節夾在繞道而行（第17-18節）與疏割起行（第20節）之間，記的是一件三百多年前託付的事終於被做到了。"
  relation: "KC 注意到它出現的時機：「就在神說到祂要祂百姓走的道路之時，注意力卻轉到約瑟的骸骨上。」丁良才則指出約瑟當初叫以色列人起誓這件事本身就是信心：「約瑟叫以色列人這樣起誓，顯明他深信神必將迦南地賜給亞伯拉罕的後裔（來十一13-22）。」"
- title: 疏割
  path: link_folder/地點/疏割.md
  summary: "v20 從疏割起行、在曠野邊的以倘安營——疏割作為出埃及第二站"
  relation: "第12章 v37 以色列從蘭塞起行往疏割、第13章 v20 從疏割起行往以倘——疏割是出埃及路線的轉接站"
- title: 以倘
  path: link_folder/地點/以倘.md
  summary: "以倘是本章記下的第二個地名，也是全章最後一個地理座標——從疏割起行到以倘安營，緊接著就是雲柱火柱的登場（第21-22節）。"
  relation: "確實地點各家都說不準。GT《啟導本聖經腳註》：「以倘的位置不詳。民三十三6說其地在曠野邊上。有的考據說，以倘為埃及東邊的邊防要塞，或在疏割以東。」GT《串珠聖經註釋》：「既然是在曠野邊（民33:8），所以大概位於疏割之東。」GT《丁道爾聖經註釋》說得最乾脆：「正確地點已經無可考據。」"
- title: 雲柱火柱
  path: link_folder/歷史/雲柱火柱.md
  summary: "這是雲柱火柱在出埃及記中第一次出現，位置就在全章的最後兩節——條例講完、路線定了、營也安了，最後出場的是引路的那一位。"
  relation: "CT 指出兩者兼有引領與保護兩種功用：「在曠野地日間炎熱，雲柱可以遮蔭；夜間寒冷，火柱可以保溫。」GT《中文聖經註釋》把這件事寫得更切身：「西乃沙漠日間的熱度有時在攝氏四十五度或以上，無樹蔭無房舍，炙熱的沙粒，實在令人乾渴頭昏，但在雲柱的蔭下，卻使人稍能喘氣清醒。沙漠區因無濕氣保住溫熱，夜晚由清涼而降至寒冷，火柱的溫熱可使發抖的人稍能鎮定。」"
- title: 傳於後代
  path: link_folder/神學/傳於後代.md
  summary: "本章有兩組父子問答——第8節「當那日，你要告訴你的兒子說」，第14節「日後，你的兒子問你說：這是什麼意思？你就說」；兩組的收尾都是同一句「在你手上作記號，在你額上作紀念／經文」（第9、16節）。"
  relation: "第12章 v26-27 兒女問父代答、第13章 v8,14 兒子問父代答——救贖記憶的代代傳遞具體模式設立；GT《中文聖經註釋》指出這段記述「明顯是為教育之用──要告訴你的兒子，而不是為律例之用」"
- title: 出埃及為要事奉神
  path: link_folder/神學/出埃及為要事奉神.md
  summary: "v3「你們要記念從埃及為奴之家出來的這日」、v8「耶和華在我出埃及的時候為我所行的事」、v14「耶和華用大能的手將我們從埃及為奴之家領出來」——記念出埃及是信仰教育的核心"
  relation: "出12章出埃及完成、第13章 v3-9, 14-16 設立記念教育——「為奴之家」vs「事奉耶和華」的對比貫穿全章"
- title: 非利士地
  path: link_folder/地點/非利士地.md
  summary: "第17節是全章的轉折——法老一放人，神做的第一個決定就是不走那條最近的路。CT 列出四個緣故：沿路設有埃及重兵駐守；須經過好戰的非利士人領土；以色列人雖號稱耶和華的軍隊，實際還沒受過軍事訓練；恐怕他們遇難而退，回埃及地去。"
  relation: "GT《聖經精讀本》把兩邊的形勢並排：這條捷徑「大概需要四天的路程」，但路的前方住著好戰的非利士人，而剛出埃及的以色列「整個群體還沒有正規化，而且根本不具備打仗的條件」，所以神「特意引他們走上了比這條路遠6倍的曠野之路」。"
- title: 出埃及的年代
  path: link_folder/解經爭議/出埃及的年代.md
  summary: "本章第17-18節記下神為以色列人選的路線，而各家在同一段下並排收了兩套出埃及年代——早期說（主前1446-1445）與晚期說（主前1300-1220），以及非利士人何時定居沿海一帶的討論。"
  relation: "年代之爭在本章不是題外話：第17節「非利士地的道路」這個地理兼民族的稱呼，正是晚期說用來質疑經文成書年代的例證之一，而丁道爾對它的辯護也就寫在這一節下。年代取捨不同，讀第17節時所設想的埃及邊防與非利士勢力也就不同。"
- title: 創五十25 約瑟骸骨應許
  path: link_folder/互文/創五十25 約瑟骸骨應許.md
  summary: "v19 摩西帶約瑟骸骨出埃及，直接應驗創50:25 約瑟叫以色列子孫起誓的臨終遺命。骸骨最終埋葬示劍（書24:32），構成創→出→書三卷互文鏈。"
  relation: "v19 唯一關聯節，承先祖遺命應驗於出埃及旅程中。"
- title: 創十五13-16 迦南應許
  path: link_folder/互文/創十五13-16 迦南應許.md
  summary: "v5 與 v11 進迦南應許根植於創15:13-16 亞伯拉罕之約——「到了第四代他們必回到此地」。v5 所列五族中的亞摩利人呼應創15:16「亞摩利人的罪孽還沒有滿盈」——神的應許以審判時間點為標誌。"
  relation: "GT《中文聖經註釋》指出第5節的族名各抄本並不一致：「撒瑪利亞抄本在這節加上比利洗人和革迦撒人。七十士譯本亦有這七族的名稱，但次序不同。」。"
