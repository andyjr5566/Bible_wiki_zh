  relation: "GT《中文聖經註釋》指出第1-16節這一大段的結構：第1-2節是神對摩西的說話，第3-10節與第11-16節都是摩西轉頭對百姓的說話——本章摩西的角色是轉述者與執行者。第19節則是他做的一件無人吩咐的事：把約瑟的骸骨帶走，履行三百多年前的一個誓。"
- title: 頭生歸神為聖
  path: link_folder/歷史/頭生歸神為聖.md
  summary: "第1-2節是總則，第11-16節是細則——頭生的公牲畜歸耶和華獻為祭，頭生的驢用羊羔代贖，頭生的兒子要贖出來。GT《中文聖經註釋》指出這一大段分成三小段：第1-2節是神對摩西的說話，第3-10節是摩西吩咐守無酵餅節，第11-16節「再接回第2節」。"
  relation: "這條例的根據不是創造而是救贖。GT《中文聖經註釋》說得最清楚：神的要求「並不是全體都歸回給祂，乃是因祂在埃及藉擊殺他們頭生的而將選民救贖出來，故此祂要求凡對救贖有感恩之心的人，將頭生的分別為聖歸給神」。CT 也指出這是代表的原則：「神是用第一個人亞當代表所有人；神也用以色列人頭生的代表全部以色列人。」"
- title: 分別為聖
  path: link_folder/神學/分別為聖.md
  summary: "第2節「以色列中凡頭生的，無論是人是牲畜，都是我的，要分別為聖歸我。」CT 給的原文字義是「分別出來，使成聖」；GT《串珠聖經註釋》指出這個詞在此可解作「獻上」，也可解作「將它當作屬神的」兩個意思。"
  relation: "KC 從這個動作讀出一個次序：神先前分別的是一日（安息日），如今分別的是人（頭生的），後來被分別出來的還有祭司、利未人和全體百姓，再後來是一個地方（會幕與聖殿）與事奉用的器皿——「凡祂所分別的，都是出於祂、也是歸給祂的。祂藉著分別一樣東西，就在那東西上行使祂的權利。」"
- title: 為奴之家
  path: link_folder/主題/為奴之家.md
  summary: "「埃及為奴之家」在本章出現兩次（第3、14節），而且都出現在同一種場合——第3節是摩西吩咐百姓要紀念，第14節是父親答覆兒子的問題。兩次的下半句也一樣：「耶和華用大能的手將你（們）從……領出來。」"
  relation: "GT《串珠聖經註釋》把本章兩段條例互相呼應的地方列了出來，其中一項就是「都引用同一救贖的公式作答」——而這公式的前半正是「從埃及為奴之家領出來」。換句話說，這四個字在本章不是背景描述，是答案的一部分。"
