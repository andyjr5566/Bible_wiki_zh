book: 出埃及記
chapter: 2
candidates:
  - name: 利未
    type: 人物
    evidence: 1節；「有一個利未家的人娶了一個利未女子為妻」——即暗蘭與約基別（6:20）
  - name: 摩西
    type: 人物
    evidence: 10-11、14-15、17、21-22節；被法老女兒收養、長大後殺埃及人、逃往米甸、娶妻生子
  - name: 米利暗
    type: 人物
    evidence: 4節；孩子的姊姊遠遠站著；她的機智使母親得以奶養親生兒子
  - name: 約基別
    type: 人物
    evidence: 8節；孩子的母親；因著信把摩西藏了三個月，又受法老女兒之雇奶養親子
  - name: 法老的女兒
    type: 人物
    evidence: 5、7-10節；來到河邊洗澡發現蒲草箱，動了憐憫收養摩西——違逆父王殺嬰的政策
  - name: 法老
    type: 人物
    evidence: 15節；聽見摩西殺埃及人的事就想殺他
  - name: 流珥（米甸祭司）
    type: 人物
    evidence: 16、18節；米甸的祭司，七個女兒的父親；名意「神的朋友」
    surfaces:
      - {phrase: 米甸的祭司, verses: [16]}
      - {phrase: 流珥, verses: [18]}
  - name: 西坡拉
    type: 人物
    evidence: 21-22節；流珥的女兒，摩西之妻；名意「鳥、女歌者」
  - name: 革舜（摩西之子）
    type: 人物
    evidence: 22節；摩西長子，名意「在那裡作了寄居的」
    surfaces:
      - {phrase: 革舜, verses: [22]}
  - name: 亞伯拉罕
    type: 人物
    evidence: 24節；神記念與他所立的約
  - name: 以撒
    type: 人物
    evidence: 24節；同上
  - name: 雅各
    type: 人物
    evidence: 24節；同上
  - name: 以色列
    type: 原文
    evidence: 23、25節；因作苦工歎息哀求；神看顧他們
  - name: 米甸地
    type: 地點
    evidence: 15節；摩西逃往之地；位於阿卡巴灣以東，米甸人是亞伯拉罕與基土拉的後裔（創25:2）
  - name: 摩西因信被藏三個月
    type: 互文
    evidence: 2節；來11:23：「摩西因著信，生下來的時候……被父母藏了三個月，並不怕王命」
    surfaces:
      - {phrase: 藏了他三個月, verses: [2]}
  - name: 蒲草箱與方舟同字
    type: 原文
    evidence: 3節；「箱」（tevah）與挪亞「方舟」在希伯來文同字（創6:14）；同樣抹上防水材料，同樣在水中保存生命
    surfaces:
      - {phrase: 蒲草箱, verses: [3]}
  - name: 摩西名字的由來
    type: 原文
    evidence: 10節；埃及語 ms(w)「生／兒子」（如杜得模西士、蘭塞）；希伯來語雙關為「拉出來」
    surfaces:
      - {phrase: 給孩子起名叫摩西, verses: [10]}
  - name: 被拒絕的拯救者摩西
    type: 互文
    evidence: 14節；「誰立你作我們的首領和審判官呢？」——徒7:27,35 兩次引用；豫表基督被本族棄絕（約1:11）
    surfaces:
      - {phrase: 誰立你作我們的首領和審判官呢, verses: [14]}
  - name: 寄居身分
    type: 神學
    evidence: 22節；「因我在外邦作了寄居的」——革舜之名保存了摩西的自覺
    surfaces:
      - {phrase: 寄居的, verses: [22]}
  - name: 神聽見百姓的哀求
    type: 神學
    evidence: 23節；「他們的哀聲達於神」——歎息、哀求、哀聲三重的苦，達到神那裡
    surfaces:
      - {phrase: 哀聲達於神, verses: [23]}
  - name: 神的記念
    type: 神學
    evidence: 24節；「就記念他與亞伯拉罕、以撒、雅各所立的約」——不是曾遺忘，而是決定行動的時候到了
    surfaces:
      - {phrase: 記念, verses: [24]}
  - name: 亞伯拉罕之約
    type: 神學
    evidence: 24節；創15:18；17:5-8,19；26:24；35:11-12——拯救的根基是神對盟約的信實
    surfaces:
      - {phrase: 約, verses: [24]}
  - name: 埃及
    type: 地點
    evidence: 11-15、23節；摩西在埃及王宮長大、殺埃及人後逃離；埃及王死了以色列人仍作苦工
  - name: 暗蘭
    type: 人物
    evidence: 1節；「有一個利未家的人」即摩西的父親暗蘭（6:20），哥轄的兒子
  - name: 尼羅河
    type: 地點
    evidence: 3、5節；蒲草箱擱在河邊的蘆荻中；法老的女兒來到河邊洗澡——埃及人視尼羅河為聖河
    surfaces:
      - {phrase: 河邊, verses: [3, 5]}
  - name: 希伯來人（族群稱呼）
    type: 文化
    evidence: 6-7、11、13節；「這是希伯來人的一個孩子」「希伯來婦人」「希伯來人的一個弟兄」——外邦人對以色列人的稱呼
    surfaces:
      - {phrase: 希伯來, verses: [6, 7, 11, 13]}
  - name: 古代埃及的蒲草與防水籃
    type: 文化
    evidence: 3節；抹上石漆和石油；蒲草可造船造紙（賽18:2），蒲草捆重疊三層加石漆便不漏水
    surfaces:
      - {phrase: 石漆和石油, verses: [3]}
  - name: 井權與牧羊取水規矩
    type: 背景
    evidence: 16-17、19節；打滿了槽要飲父親的群羊；牧羊人把她們趕走——中東水源稀少，井有一定的取水規矩
    surfaces:
      - {phrase: 井旁, verses: [16]}
  - name: 摩西的希伯來與埃及雙重身分
    type: 背景
    evidence: 10-11、19節；作了法老女兒的兒子，卻出去到他弟兄那裡；米甸女子稱他「有一個埃及人」
  - name: 摩西認同受苦的神子民
    type: 神學
    evidence: 11節；「他出去到他弟兄那裡，看他們的重擔」——來11:24-26 稱這是信心的選擇
  - name: 摩西憑己力施救與神的時間
    type: 神學
    evidence: 12節；「他左右觀看，見沒有人，就把埃及人打死了」——KC 說這顯出肉體在摩西身上活躍
  - name: 米甸曠野對摩西的預備
    type: 神學
    evidence: 15-22節；四十年牧羊；KC 說工作能藉著摩西作成以前，必須先有工作作在摩西裡面
  - name: 神保守救贖計畫中的生命
    type: 神學
    evidence: 3-10節；法老要用河除滅男嬰，同一條河卻成為摩西被發現、被保存、進入王宮的途徑
  - name: 革舜名字的由來
    type: 原文
    evidence: 22節；Ger（客旅、寄居的）與 Shom（那裡）；「那裡」指埃及而非米甸
  - name: 摩西殺死埃及人的解經問題
    type: 解經爭議
    evidence: 12節；來11:24-27 稱為信心，KC 與 CT 卻指出他看人看環境、憑血氣行事
    surfaces:
      - {phrase: 就把埃及人打死了, verses: [12]}
  - name: 流珥葉忒羅與何巴的稱謂關係
    type: 解經爭議
    evidence: 18節；本章稱流珥，3:1／18:1 稱葉忒羅；CT 列出四種解法
  - name: 古代近東的棄嬰與逃亡故事
    type: 背景
    evidence: 3、15節；《撒珥根誕生傳奇》《坎納什與札珥帕雙城記》《辛奴亥的故事》——舊約背景註釋與中文聖經註釋都以之為平行材料
  - name: 古代近東的乳母與收養
    type: 文化
    evidence: 7-10節；找乳母乳養嬰孩直到斷奶是貴族慣例；乳母是受薪的法定監護人，正式收養在斷奶之後舉行
    surfaces:
      - {phrase: 奶媽, verses: [7]}
