"book": "出埃及記"
"chapter": !!int "20"
"updates":
- "title": "來2：2"
  "path": "link_folder/互文/來2：2.md"
  "summary": "GT 丁良才註解出二十1「神吩咐這一切的話說」時，指出律法的頒佈不只有神與摩西兩方：「天使也在傳律法上有份（詩六十八17；徒七53；加三19；來二2）。」來2:2 的「那藉著天使所傳的話」因此被列為十誡頒佈時天使有分的證據之一。"
  "relation": "本章是十誡頒佈的現場記錄；來2:2 從新約回望這件事，指出「那藉著天使所傳的話既是確定的」，用以襯托那藉主親自宣講之救恩的更大分量。GT 丁良才把它與詩68:17、徒7:53、加3:19 並列，作為律法頒佈時天使有分的四處引證。"
- "title": "創26：25"
  "path": "link_folder/互文/創26：25.md"
  "summary": "BH 註解出二十24「你要為我築土壇」時，指出用泥土築壇這個吩咐反映神所要的敬拜是簡樸與謙卑的：壇在古時本來就多以自然材料造成，重點不在人的工藝而在順服與敬畏；這與族長的作法一致——亞伯拉罕、以撒、雅各都築簡樸的壇敬拜神（創12:7、26:25、35:7）。"
  "relation": "創26:25 記以撒在別是巴「築了一座壇，求告耶和華的名」，是 BH 在本章列舉的族長築壇三例之一。出二十24-26 把族長時代這種簡樸的築壇作法正式立為條例：可用土壇，若用石壇不可用鑿成的石頭。"
- "title": "創35：7"
  "path": "link_folder/互文/創35：7.md"
  "summary": "BH 註解出二十24「你要為我築土壇」時，把這條吩咐連回族長築壇的傳統：亞伯拉罕、以撒、雅各都以簡樸的壇敬拜神（創12:7、26:25、35:7），顯示神所看重的不是壇的材質與工藝，而是築壇者的順服與敬畏。"
  "relation": "創35:7 記雅各在路斯築壇、給那地方起名伊勒伯特利，是 BH 在本章列舉的族長築壇三例之一。出二十24 的「凡記下我名的地方，我必到那裡賜福給你」正與族長在神顯現之處築壇求告神名的作法相呼應。"
