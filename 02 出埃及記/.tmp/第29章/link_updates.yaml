book: 出埃及記
chapter: 29
updates:
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: 出29:10-14、36 公牛作贖罪祭：亞倫和他兒子按手在牛頭上，牛宰於會幕門口，血抹壇的四角並倒在壇腳，脂油燒在壇上，皮、肉、糞在營外焚燒；承接聖職的七天中每天還要獻一隻公牛為贖罪祭潔淨祭壇。CT 指出這一次的處理與常例不同：「祭司為百姓獻贖罪祭時，僅燒一部分在壇上，所餘的祭肉可留著給祭司吃（參利6:26），但此處是為祭司自己獻贖罪祭，必須將全部都燒掉。」GT《精讀本》補上一個常被略過的對象：「這個贖罪祭不僅是為了亞倫和他兒子的罪而獻上，而且也是為了祭壇的罪而獻（36,37節）。以此先潔淨向神獻祭的人和器具。」
  relation: 贖罪祭是承接聖職禮儀的第一步，也是全禮的地基——GT《中文聖經註釋》講出理由：「祭司也是人，人就有罪。因此，要分別祭司為聖以事奉神，就必先為他獻贖罪祭。」而祭牲的選擇本身就在說話：用的是公牛犢，同一則註釋註明那是「祭牲中最大的」。CT 從燒的位置讀出兩重意義：脂油燒在壇上、皮肉糞燒在營外——「前者成為馨香之氣蒙神的悅納，滿足神一切的要求；後者是審判的火，預表基督為我們受苦。這樣，我們也當出到營外，就了祂去，忍受祂所受的凌辱（來13:13）。」GT《精讀本》把同一個方向講得更直接：營外焚燒「象徵了日後耶穌基督將背負人類的罪，釘死在耶路撒冷城外（來13:11-13）」。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 出29:15-18 第一隻公綿羊全然燒在壇上為燔祭：按手、宰殺、血灑壇的周圍、切成塊子、洗淨五臟和腿、連塊子帶頭都放在一處，「要把全羊燒在壇上，是給耶和華獻的燔祭，是獻給耶和華為馨香的火祭」。CT 說明兩個細節的用意：「『切成塊子』容易全然焚燒；『洗淨』使焚燒時氣味馨香。」GT《舊約背景註釋》補上實務上的理由：死羊要切塊洗淨「以便安放壇上，並且不被穢物所玷污」。此外 29:38-42 的每日晨昏之祭也是燔祭，29:42 稱之為「你們世世代代常獻的燔祭」。
  relation: KC 抓住燔祭與贖罪祭方向相反這一點：「藉著把自己與贖罪祭認同，祭司的不配，就彷彿轉到了贖罪祭身上。在燔祭裡卻是反過來：藉著把自己與燔祭認同，燔祭的尊貴與馨香，就彷彿轉到了祭司身上。」贖罪祭把不配送出去，燔祭把配得帶回來，而兩者都靠同一個按手的動作完成。KC 並指出燔祭的對象是神自己：「燔祭全然是給神的，對祂是馨香之氣。主耶穌在十字架上榮耀了神。」CT 從「切成塊子」讀出事奉者的一面：「表徵破碎自己，任何信徒若要事奉神，便須接受十字架的破碎。」
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: 出29:19-28 第二隻公綿羊是「承接聖職所獻的羊」，GT《中文聖經註釋》判定它「當作平安祭獻上」；29:28 明說搖祭的胸與舉祭的腿「要從以色列人的平安祭中，作為獻給耶和華的舉祭」，歸亞倫和他子孫永遠得的分。這隻羊的處理與前一隻截然不同：脂油、肥尾巴、內臟脂油、肝上的網子、兩個腰子與右腿要搖一搖再燒在壇上，其餘的肉卻要煮在聖處、由祭司在會幕門口吃（29:31-32）。GT《舊約背景註釋》指出這正是它與燔祭的分野：公綿羊的肉「用作立約筵席的基礎，供亞倫父子食用，有別於全部燒毀的第一隻公綿羊」。
  relation: KC 把這第三隻祭牲讀成承接聖職的正題：看過贖罪祭與燔祭之後，「才來到真正的承接聖職」，而獻上這祭表達的是「我們看見主耶穌如何在與父的交通中、在全然獻給祂的心志裡，走完祂在地上的路直到死」。他並指出對信徒的要求不在於複製十架的工作（那是主獨有的），而在於「我們對神的獻上要有同樣的性質」（參弗5:1-2）。祭肉可吃這一點也有它的意義：KC 說「祭物因此成了他們的一部分」——承接聖職不只是被分別出來，也是被那祭物餵養。
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出29:35「你要這樣照我一切所吩咐的，向亞倫和他兒子行承接聖職的禮七天。」本章沒有重複「照山上的樣式」一語，卻整章以「照我一切所吩咐的」為框架。GT《中文聖經註釋》指出一個結構上的空缺：「這一章聖經，仍然是繼續摩西在山上領受神的吩咐，但在出埃及記中卻找不到敘述執行此吩咐的記載。在利未記第八、九兩章，才找到摩西按這在山上的吩咐，膏立亞倫和他的兒子為祭司。因此，讀者須自行比對利未記的記載。」GT《丁道爾》則指出本章雖多屬一時的規例、與鄰國禮儀亦有雷同，「此中仍有好幾個顯著的永恆原則。祭司必須在象徵上潔淨，他要洗過身、獻過祭贖罪後，才能穿著新衣就職。他要嚴肅地為這事工受膏，手、腳、耳朵都要獻上給神。只有這樣，祭司才能獻上神所喜悅的祭物。」
  relation: 「照山上的樣式」在出25-27 管的是器物的形狀，到出28-29 管的是人的資格與程序——同一條原則從物延伸到人。而本章特別之處在於執行記載不在本卷：吩咐在出29，實行在利8-9，中間隔了整整一卷書，且利8 用「都是照耶和華所吩咐摩西的」這句公式重複了七次。這使「照樣式」不只是建造時的一次要求，而是一條跨卷的驗收線。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出29 五次把會幕當作動作的座標：會幕門口洗身（29:4）、會幕前按手與宰公牛（29:10-11）、在會幕門口吃承接聖職的祭肉（29:32）、會幕門口作常獻的燔祭（29:42），以及神應許在此相會、使會幕因祂的榮耀成聖（29:43-44）。GT《精讀本》指出本章與會幕落成的時間關係：「真正的委任儀式是在建立了會幕（40:17），而且制定祭司制度之後（利1-7章）才執行的（利8:1-36）。這是出埃及一年後的事情。」GT《中文聖經註釋》也指出本章在出埃及記裡「卻找不到敘述執行此吩咐的記載。在利未記第八、九兩章，才找到摩西按這在山上的吩咐，膏立亞倫和他的兒子為祭司」。
  relation: 出25-27 造的是房子，出28 造的是穿衣服的人，出29 則說明這房子要靠什麼才成為神的居所——不是材料，是壇上不斷的祭。GT《中文聖經註釋》講得很直接：「聖幕和壇的材料雖屬珍貴，仍然是世間的物質，為人手所造。它們之所以成聖，並非因本身的華麗或貴重，乃因神的臨在。」而 29:43-46 把會幕的目的一次講完：神要在這裡相會、要使它因榮耀成聖、要住在以色列人中間——KC 說這正是出埃及本身的目的。
- title: 聖所
  path: link_folder/地點/聖所.md
  summary: 出29:30「他的子孫接續他當祭司的，每逢進會幕在聖所供職的時候，要穿七天。」本章只在這一節提到聖所，而它出現的位置是聖衣的世襲條款——GT《中文聖經註釋》指出這句話的原意可能與利8:33-35 一致：「是指祭司授職和就職禮的七天內，要在聖所內住宿，不可離開」，但 30 節的前句又說「每逢進會幕在聖所供職的時候」，讀來不單指就職禮；該註釋推測這「極可能反映了在被擄回國之後，因祭司眾多，又只集中在耶路撒冷的聖殿事奉，所以必須分班到聖殿事奉。輪值事奉的人，每次只有七天」。此外本章多處提到的「會幕門口」「耶和華面前」屬於院子與壇前，不在聖所之內。
  relation: 出26 隔出聖所的界線、出27 交代它唯一的光、出28 規定進去的人穿什麼，出29 則交代誰有資格接續進去——而條件是穿上前任的聖衣七天。聖所在本章因此不是空間的描述，而是一個世代接續的名額：29:29-30 把聖衣、受膏、承接聖職與「進會幕在聖所供職」綁成一組，缺一不可。CT 也指出本章末了神應許使會幕與壇成聖，「『會幕』因神的臨在而成為聖（參43節）；『壇』指祭壇，因潔淨之禮而成為聖（參37節），但仍是神使之成聖的」。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: 本章是亞倫和他兒子承接聖職的全禮：洗身（29:4）、穿聖衣（29:5-9）、獻公牛為贖罪祭、公綿羊為燔祭、第二隻公綿羊為承接聖職之祭（29:10-28），血抹右耳垂、右手大拇指、右腳大拇指（29:20），歷時七天（29:35）。
  relation: KC 指出出28 與出29 必須合看：「作祭司是一回事，盡祭司的職事是另一回事。」聖衣不夠，還必須有承接聖職。而 KC 讀出的三段結構正是這一章的骨架：先是「有事情為他們發生」（祭牲為他們被宰），然後「有事情在他們身上發生」（被血分別為聖、被油膏抹），最後才「有事情藉著他們發生」（他們獻上搖祭與舉祭）——順序不能顛倒。另一個關鍵次序：亞倫受膏在說到血以先（29:7），KC 指這正是基督與我們的分別——祂在十字架以先就受聖靈膏抹，我們卻是在祂的血流出之後才受膏。
- title: 披戴基督（羅13：14）
  path: link_folder/互文/披戴基督（羅13：14）.md
  summary: 出29:5-9 洗身之後才穿上聖衣：內袍、外袍、以弗得、胸牌、腰帶、冠冕、聖冠。KC：「它的應用是，我們可以意識到神能夠在祂面前接納我們。我們有那合適的衣服……我們是穿著基督自己，因為我們在那蒙愛者裡被接納了」（弗1:6；詩132:9,16）。
  relation: 羅13:14「總要披戴主耶穌基督」的舊約底稿在此，而出29 補上了羅13:14 沒明說的兩件事：①披戴之前必須先洗（29:4，KC：水代表神的話在它潔淨的能力上，弗5:26；洗淨在成聖之前，林前6:11）；②披戴需要根基——KC：「還需要的是根基，就是我們能被穿上基督的憑藉。我們在承接聖職時所獻的各樣祭物裡，有這個根基。」衣服不是自己織的，也不是白穿的，是三隻祭牲換來的。
- title: 聖靈膏抹（約壹2：20,27）
  path: link_folder/互文/聖靈膏抹（約壹2：20,27）.md
  summary: 出29:7 摩西將膏油倒在亞倫頭上膏他；29:21 膏油與壇上的血一同彈在祭司和他們的衣服上。KC：「唯有藉著聖靈的能力，真正的祭司事奉才是可能的、才是神所喜悅的」——這是關乎「用心靈和誠實敬拜」（約4:24）。
  relation: 本章給了膏抹一個關鍵的時間座標。KC 指出亞倫是在說到血以先受膏（29:7），而這正是基督與信徒的分別：主耶穌也是在成就十字架的工作以先就受聖靈膏抹（徒10:38、太3:16），我們卻是在祂的血流出、並接受了福音之後才受膏（弗1:13）。所以約壹2:20,27 的「恩膏」對信徒而言永遠是後於十架的——先有血，才有油。而 29:21 血與油一同彈在衣服上，也表明兩者不可分：外在行為要與血的價值相符，事奉要在聖靈的能力裡。
- title: 聖膏油
  path: link_folder/原文/聖膏油.md
  summary: 出29:7 膏油倒在亞倫頭上膏他；29:21 膏油與壇上的血一同彈在亞倫、他兒子和他們的衣服上，使他們和衣服一同成聖。膏油的配方要到出30:22-33 才詳述。GT《中文聖經註釋》認為 21 節是全禮的頂點，並反駁一種來源批判的說法：「有些學者把這第21節認作是後人加筆，那是錯誤的。因為這實際是整個授職禮的高峰，是使受職者成聖的儀節。」GT 引丁良才把血與油分工說得最短：「這血表明贖罪的意思，膏油表明成聖的意思」；GT《精讀本》的說法相同：「意味著，因血掩蓋了罪，因油而分別為聖。」GT《舊約背景註釋》從儀式的完成度看：把血與油「彈在祭司及其衣服之上，授職典禮便告完成，祭司不但在實質上認定供事奉之用，更得以淨化」。
  relation: 本章顯明膏油的兩種用法與兩種時機。①單獨澆在大祭司頭上（29:7）——在血以先，KC 指這區別了基督與我們：祂在十架以先受聖靈膏抹（徒10:38；太3:16），我們卻是在祂流血、並接受了福音之後才受膏（弗1:13）。②與壇上的血一同彈在祭司與衣服上（29:21）——血與油在此不可分割：血管我們的資格（全人被分別為聖），油管我們的能力（KC：唯有藉著聖靈的能力，真正的祭司事奉才是可能的、才是神所喜悅的）。承接聖職若只有血沒有油，人就成聖卻不能事奉；只有油沒有血，人就無資格站在那裡。CT 從詩133:2 讀出方向：「膏油倒在頭上，必定會往下流；聖靈倒在元首基督身上，我們只要持定祂，凡事順從祂，自然就會得著聖靈的引導。」
- title: 贖罪
  path: link_folder/神學/贖罪.md
  summary: 出29:10-14 公牛為贖罪祭：亞倫和兒子按手在牛頭上，牛被宰於會幕門口，血抹在壇的四角並倒在壇腳，脂油燒在壇上，皮、肉、糞則在營外用火焚燒。29:33 說承接聖職所吃的是「贖罪之物」，29:36 每天獻一隻公牛為贖罪祭潔淨祭壇，連續七天。壇的血禮有兩個位置，各有其意：GT《中文聖經註釋》說抹壇的四角「是表明壇因此潔淨，神就臨在壇上」，而「把血都倒在壇腳那裏 這是贖罪祭中，惟一將血倒在壇腳的。表示受職者的潔淨」；GT《舊約背景註釋》則從壇的根基說：「必須用贖罪祭的血從根基（底座）開始淨化，它才能完全聖潔，合乎這儀式。」CT 的靈意讀法落在同一處：「把血都倒在壇腳那裡」表示「流血的功效成了救恩的根基」。
  relation: KC 對本章贖罪祭的讀法有兩個銳利的分辨。①方向：「藉著把自己與贖罪祭認同，祭司的不配，就彷彿轉到了贖罪祭身上」——而緊接著的燔祭方向恰好相反，是把燔祭的尊貴轉到祭司身上。贖罪把「不配」送出去，燔祭把「配得」帶回來。②脂油：「贖罪祭的一切都必須在營外燒掉，作為神所憎惡的。贖罪祭的脂油卻不是神所憎惡的。那要在壇上」——脂油說到主耶穌成就那對付罪之工作時的能力，「那是神所喜悅的」。即使在最黑的贖罪祭裡，仍有一部分是直接上壇歸神的。而 GT《丁道爾》對 kuppar 的限定提醒了一件事：本章的贖罪語彙本身不必然帶「轉離忿怒」的意思，它先是「遮蓋」與「除去」；忿怒的挽回是新約在基督身上才講明的。
- title: 信徒作祭司（彼前2：5,9）
  path: link_folder/互文/信徒作祭司（彼前2：5,9）.md
  summary: 出29 是承接聖職的全禮，KC 用一句話點出它與彼前2:5 的關係：「作祭司是一回事，盡祭司的職事是另一回事。」出28 的聖衣（身分）不夠，出29 的承接聖職（運用）才使人真能事奉。KC：「要盡祭司的事奉，必須讓自己被主耶穌和祂的工作佔有」——那正是本章三隻祭牲的意思。
  relation: 彼前2:5 說信徒是「聖潔的祭司」，出29 補上了那身分要怎麼被運用。KC 的三段結構是關鍵：先是「有事情為他們發生」（祭牲為他們被宰），然後「有事情在他們身上發生」（被血分別為聖、被油膏抹），最後才「有事情藉著他們發生」（獻上搖祭與舉祭）。多數信徒停在第一步——知道基督為我死——卻沒有走到第三步。而 29:20 血抹右耳垂、右手大拇指、右腳大拇指，說明祭司職分不是一個頭銜而是全人：KC「我們只當聽祂的，只當作祂告訴我們的，只當去祂要我們在的地方」。
- title: 義行的細麻（啟19：8）
  path: link_folder/互文/義行的細麻（啟19：8）.md
  summary: 出29:5-9 亞倫和他兒子被穿上細麻內袍、束腰帶、包裹頭巾；29:21 血與膏油一同彈在他們的衣服上，使衣服與人一同成聖；29:29 亞倫的聖衣要傳給他的子孫。
  relation: 啟19:8「這細麻是聖徒所行的義」在本章有一個容易忽略的前提：衣服不是自己白的，是被血彈過的。KC：「作為祭司的全部外在行為，都必須與那血的價值相符」——29:21 血彈在衣服上，正是把「行為」與「血的價值」綁在一起。而穿衣的次序更關鍵：先洗（29:4）、再穿（29:5）、然後才被血與油彈（29:21）。啟19:8 說新婦「蒙恩得穿」光明潔白的細麻衣——出29 顯明那「蒙恩」是三隻祭牲換來的。
- title: 基督作智慧（林前1：30）
  path: link_folder/互文/基督作智慧（林前1：30）.md
  summary: 出29:2 承接聖職要用細麥麵做的無酵餅、調油的無酵餅、抹油的無酵薄餅；29:23 從無酵餅的筐子裡取餅、調油的餅、薄餅各一，與脂油、右腿一同搖一搖作搖祭。CT 指薄餅一碰即碎，預表感覺敏銳而非遲鈍。
  relation: 林前1:30「基督成為我們的智慧、公義、聖潔、救贖」在本章有一個具體的對應：素祭（細麥麵的餅）說到基督在地上的一生。KC 讀搖祭時把餅與脂油放在一起：「脂油說到祂所走的路上顯出的精力、堅忍。與脂油一同帶來的還有餅和薄餅。這是素祭，說到祂在地上直到十字架之死的整條路。在每一件事上祂都完全純潔、完全獻給神。」而祭司要把這些「搖來搖去、舉上舉下，滿了讚嘆」——認識基督不是抽象的，是把祂一生的每一面拿在手上、在神面前反覆端詳。
- title: 按手
  path: link_folder/原文/按手.md
  summary: 出29:10、15、19 三隻祭牲每一隻在被宰之前，亞倫和他的兒子都要按手在牠的頭上。GT《中文聖經註釋》指出這動作發生的時機：「是在他們認罪時的按手，表示這些所承認的罪都歸到這公牛身上了。然後便宰這公牛。」但 GT 也留了一個分辨：獻贖罪祭時的按手是認罪，「但在此獻感恩的燔祭時，按手是舒誠，是向神感恩。因此祭牲的肉並不為罪所污染」。BH 的說法與此並行：按手是「認同與轉移」的象徵動作，把罪歸到祭牲身上，指向那位擔當人類罪孽的基督。KC 則簡短地說：按手表達的是把自己與這祭物認同、合為一。
  relation: 本章的三次按手，方向並不相同——這是 KC 最銳利的一個分辨。①按在贖罪祭的公牛上（29:10）：「藉著把自己與贖罪祭認同，祭司的不配，就彷彿轉到了贖罪祭身上」——對我們而言就是與那「在木頭上親身擔當我們罪」（彼前2:24）、「替我們成為罪」（林後5:21）的主認同。②按在燔祭的公綿羊上（29:15）：「在燔祭裡卻是反過來：燔祭的尊貴與馨香，就彷彿轉到了祭司身上」。③按在承接聖職之祭上（29:19）：認同主耶穌「在與父的交通中、完全獻給祂，走完地上的路直到死」。同一個動作，一次把不配送出去，一次把配得帶回來。GT 引丁良才的四層讀法（罪歸於公牛、公牛的義歸於祭司、公牛代替祭司死、祭司代替公牛活）正好把這兩個方向都收在一起。
- title: 搖祭
  path: link_folder/原文/搖祭.md
  summary: 出29:24 脂油、右腿、餅要放在亞倫和他兒子的手上，在耶和華面前搖一搖作搖祭；29:26 公綿羊的胸也要搖作搖祭，「這就可以作你的分」；29:27-28 搖祭的胸與舉祭的腿要成為亞倫和他子孫永得的分。GT 引丁良才描述了這個動作實際怎麼做：「摩西將自己的手放在亞倫和他兒子的手下，將他們的手前後平搖，親自使他們行祭司所應行的頭一件事，這樣將自己所供之祭司的職分，完全歸於亞倫和他的後裔。」——搖祭因此不只是一個儀式動作，也是職分交接的那一刻。GT《舊約背景註釋》另指出本段定下了先例：「規定祭物中屬於祭司的是哪些部分」，並注意到摩西自己也留下一份祭肉，因為當時他的角色是主持典禮的祭司（29:26）。
  relation: KC 讀搖祭的重點在「胸」，理由很具體：「我們可以讚嘆祂的愛——胸所說的就是這個，因為心在那裡——那愛驅使祂作成這工。」而搖祭的位置在整個承接聖職的第三步：KC 指出先是「有事情為他們發生」（祭牲被宰），再是「有事情在他們身上發生」（被血與油分別），「現在，必須有事情藉著他們發生：他們必須獻上搖祭與舉祭」——這是祭司頭一次主動獻上。至於「搖來搖去」的動作本身，KC 讀作敬拜的姿態：把所看見基督的一切「在神面前搖來搖去、舉上舉下，滿了讚嘆」。GT《舊約背景註釋》從另一端讀出同一個方向：這姿態「象徵一切祭物都是源自神，屬乎神的」——祭司手上並沒有什麼原本屬於自己的東西。
- title: 舉祭
  path: link_folder/原文/舉祭.md
  summary: 出29:27-28 承接聖職之公綿羊的右腿是舉祭，要與搖祭的胸一同成聖，作亞倫和他子孫從以色列人所永得的分，「因為是舉祭。這要從以色列人的平安祭中，作為獻給耶和華的舉祭」。CT 指出這是祭司世代性的權利：「凡是以色列人獻給神的舉祭和搖祭，都要歸給祭司和他們的家人，作他們永得的分（參民18:11；利7:34）。」GT《舊約背景註釋》從祭司的生計解釋這條規定的必要：「由於祭司只許負責宗教事務，又不能擁有土地，他們維生所需，惟靠壇前祭物的一部分。某些部分，如公羊的胸和腿，是特別為祭司保留的。」
  relation: KC 讀舉祭的重點在「腿」：「我們可以看見祂的能力——腿所說的就是這個——祂藉著這能力完成了這工。」胸與腿因此是一對：胸是愛（心在那裡），腿是能力——而 KC 指出這兩樣「是給亞倫和他兒子的」，也就是說：「作為祭司，我們特別可以默想主耶穌的愛與能力。我們看見的越多，就越會反映在我們作祭司的奉獻上。」祭司當得的分不是報酬，是默想的材料。GT《中文聖經註釋》另指出本章26-28 節在編輯上有一處張力：26 節說胸作搖祭後歸摩西，27-28 節卻說搖祭的胸與舉祭的腿歸亞倫和他兒子；該註釋認為 26 節指當時摩西執行祭司職分、應得之分僅為胸，27-28 節則是「從此以後」的通例。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: 出29:40-41 每日晨昏的羊羔要與「細麵伊法十分之一與搗成的油一欣四分之一調和」同獻，黃昏那一隻「照著早晨的素祭和奠祭的禮辦理」。CT 定義：「『素祭』指用細麵調油的混和物，作為祭物獻給神。」份量各家有換算：GT《中文聖經註釋》作「一般說來，乾容量的伊法，約相等於四十五公升，這裏便約等於四公升半的細麵了」，油與酒各「一點八公升多」；GT《舊約背景註釋》另按蒲式耳系統估為約1.6夸脫的細麵與1夸脫的油。此外承接聖職所用的三種無酵餅也是「用細麥麵做成」（29:2），GT《舊約背景註釋》指出那必須是「最上等的麵粉，才能作為務農維生之百姓當獻的祭物」。
  relation: 素祭在利未記是獨立的一種祭（利2章），但在出29 它是附屬的：GT《丁道爾》指出「素祭和奠酒是附屬的祭，與祭牲同獻。背後的想法大概是要將完整的燔祭獻給神，便當包括日常飲食的基本元素（肉、餅、酒）」；GT《串珠》說得更白：「獻與神的燔祭若要完全，必須包括一個家庭平常進餐時的各種要素（肉、面和酒）。」這是素祭在正典中第一次與常獻燔祭綁在一起，也定下了後來民28:3-8 的規格。
- title: 無酵餅
  path: link_folder/原文/無酵餅.md
  summary: 出29:2、23、32、34 承接聖職要備三樣：「無酵餅和調油的無酵餅，與抹油的無酵薄餅」，裝在筐子裡帶來（v3）；獻搖祭時各取一個與脂油、右腿同搖再燒在壇上（v23-25），其餘由祭司在會幕門口吃（v32），留到早晨的要用火燒了（v34）。GT 引丁良才點名這三樣的分別，並解釋為何無酵：「發酵是一種敗壞的作用，所以酵就是罪惡的表號」；GT《精讀本》的說法相同：無酵餅是「沒有發酵（罪，意味著腐敗）的餅。象徵信徒聖潔的生活（出12:15；林前5:7,8）」。CT 另逐樣給靈意：無酵指遠離罪惡，調油與抹油指聖靈的分別為聖與塗抹，薄餅一碰即碎「代表感覺靈敏並非遲鈍」。
  relation: 無酵餅在出12-13 是逾越節與無酵節的記號，紀念以色列人出埃及的匆促；到出29 它換了場合——成為祭司就職禮上與祭牲同獻、又由祭司吃下的食物。同一種餅，一次是全民的記憶，一次是祭司的資格。GT《舊約背景註釋》也提醒這三樣餅的具體含義不必過度推衍：「提供無酵餅、調油無酵餅、抹油無酵薄餅的含義已不可考，它可能代表當時常見的糕餅，又可能是特別為祭儀而設的物品。」
- title: 脂油
  path: link_folder/原文/脂油.md
  summary: 出29:13、22 蓋臟的脂油、肝上的網子、兩個腰子和腰子上的脂油都要燒在壇上；承接聖職的公綿羊另加「脂油和肥尾巴」。CT 說明選這些部位的理由：「『脂油』是祭牲身上上好的部分；『網子』指蓋肝臟的脂油；這些上好的部分都要獻給神」；GT 引丁良才一句話：「脂油是上好的，故此必燒在壇上。」GT《串珠》另註明「肥尾巴」「一向被認為是羊最美好的部分」。GT《舊約背景註釋》從古代近東的對照補上一層：因為是贖罪祭，公牛沒有一部分可以保留，「因此脂肪、腎（腰子），和可以用來占卜（這是美索不達米亞的慣例）或分派給參與者的肝，都要燒在壇上」。
  relation: 利3、利7 把「脂油歸耶和華、不可吃」立為通例，出29 則是這條通例第一次在祭司就職禮上被執行，而且帶著一個特別的對比：贖罪祭的皮、肉、糞都要在營外焚燒作為神所憎惡的，惟獨脂油要上壇。KC 抓住的正是這個例外：「贖罪祭的一切都必須在營外燒掉，作為神所憎惡的。贖罪祭的脂油卻不是神所憎惡的。那要在壇上」——脂油說到主耶穌成就那對付罪之工作時的能力，而那是神所喜悅的。
- title: 銅壇（燔祭壇）
  path: link_folder/主題/銅壇（燔祭壇）.md
  summary: 出29 中壇出現十八次，是全章動作的中心：血抹壇的四角並倒在壇腳（v12）、脂油燒在壇上（v13）、血灑在壇的周圍（v16、v20）、全羊與搖祭的祭物燒在壇上（v18、v25）、七天為壇獻贖罪祭並用膏抹壇（v36）、壇成為至聖（v37）、每日晨昏獻在壇上（v38）。壇本身需要贖罪，理由各家一致：GT《串珠》說壇「是出於人手所造，故最初被視為『不潔』，需要獻上贖罪祭，並用膏抹壇，使之成聖」；GT《丁道爾》：「可能因為這壇是人手所作，因此算為『不潔』。不像二十章24、25節指定的石壇或土壇，用的是天然材料。」GT《舊約背景註釋》把整個程序講成一個淨化的量表：惟有透過「一日兩次，為期七日」的儀式天天獻上公牛，「祭壇才淨化到足以稱聖潔淨」。壇角的血另有其意：同一則註釋指出「在任何祭禮中，壇角都特別是神臨在的象徵」，而 GT《啟導本》說壇角「象徵神的幫助和庇護（看王上1:50；2:28；詩18:2）」。
  relation: 出27:1-8 造壇、出38:1-7 做成，出29 則是壇第一次被使用——而使用之前它要先被贖罪七天。這個次序本身是本章的一個重點：獻祭的器具不會因為造得貴重就配得，它與祭司一樣需要血與膏。CT 也指出兩者成聖的方式不同：「『會幕』因神的臨在而成為聖；『壇』指祭壇，因潔淨之禮而成為聖，但仍是神使之成聖的。」KC 另把壇接到新約：「壇說到主的桌子（瑪1:7；林前10:15-21）……必須常常意識到，罪在那裡不可有地位。」
- title: 營外焚燒
  path: link_folder/主題/營外焚燒.md
  summary: 出29:14「只是公牛的皮、肉、糞，都要用火燒在營外。這牛是贖罪祭。」GT 引丁良才註明「糞」指「犧牲被宰的時候，腸子內所蓄的糞」。為何非在營外不可，GT《舊約背景註釋》從潔淨規例說明：「不潔和殘餘的部分要在營外毀滅（見：申23:12-14）。由於這牛是贖罪祭，它的皮、肉、糞都已受到污染，不宜再作食物或其他用途」，而更根本的理由是「避免百姓的住處受其污染」；GT《精讀本》從神學面說：以色列的營「是神臨在的場所，不能使其被玷污」。CT 則指出這一次的處理與常例不同：「祭司為百姓獻贖罪祭時，僅燒一部分在壇上，所餘的祭肉可留著給祭司吃（參利6:26），但此處是為祭司自己獻贖罪祭，必須將全部都燒掉。」
  relation: 營外焚燒在本章第一次出現，就同時帶著兩個方向。一個是潔淨的方向：不潔的必須離開營，免得玷污神所居住的地方。另一個是預表的方向：GT《精讀本》說這「象徵了日後耶穌基督將背負人類的罪，釘死在耶路撒冷城外（來13:11-13）」；CT 把它接到信徒身上：「後者是審判的火，預表基督為我們受苦。這樣，我們也當出到營外，就了祂去，忍受祂所受的凌辱（來13:13）。」利4、利16 與民19 後來把這條規定擴大成通例，本章是它的起點。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 出29 全章的第二人稱「你」都是摩西：使亞倫父子成聖（v1）、帶他們到會幕門口洗身（v4）、給他們穿衣戴冠（v5-6）、把膏油倒在亞倫頭上（v7）、宰祭牲抹血（v11-12、v20）、把祭物放在他們手上搖一搖再從他們手中接過來燒（v24-25），連公羊的胸都「這就可以作你的分」（v26）。GT 引丁良才在10 節直接點名：「『你』——就是摩西，他代替神直到祭司被分派完了」，在25 節又說「摩西雖然已經將祭司的職分歸給亞倫，他還要行完分派的一切禮節」。CT 也註明 v26 的「你」指摩西，「是監督祭司就職典禮的人，此後便是指歷代大祭司了」。
  relation: 摩西在本章的角色是一個過渡性的祭司。GT《中文聖經註釋》把這件事講成一個命題：「摩西既受神吩咐要膏立亞倫和他兒子為祭司，則摩西本身就從神自己領受了這祭司的職分」，並回指出24:6-8 立約時他已執行過祭司的職分；GT《舊約背景註釋》從典禮的角度證實：「摩西安排和執行分別為聖的儀式，所擔任的是祭司的職責，今後這責任要落在亞倫和他的子孫身上。」本章之後，這條線就交給亞倫家族——摩西親手把自己所供的職分搖進了亞倫父子的手裡（v24），此後不再獻祭。
