- title: 一比加
  path: link_folder/原文/一比加.md
  summary: '出38:26「按聖所的平，每人出銀半舍客勒，就是一比加。」CT 的〔原文字義〕給「比加」為「一半，半舍客勒（約5.5公克）」。GT《聖經精讀本》：「一比加: 比加是貨幣單位。一比加相當於銀子半舍客勒(5.7克)。」GT《啟導本聖經腳註》：「『一比加』等於半個舍客勒。」GT《舊約聖經背景註釋》給的是重量與用途：「比加是相等於半舍客勒的重量單位，重五分之一盎司。每個二十歲以上男丁所繳付，來支持聖幕之建造和維修的贖命稅，就是這個數目。」BH：比加是重量與貨幣單位，等於半舍客勒；這個定額使人人繳得起，確保無論貧富都同樣有分於會幕的維持。'
  relation: 本章是「比加」這個單位在聖經中被定義的地方——經文自己給出換算：半舍客勒就是一比加。它之所以要被定義，是因為這個數字要乘以六十萬零三千五百五十人，成為鑄造一百個銀座的全部材料。CT 在靈意上讀為「建造教會，人人有責，最低限度每人都要在財物奉獻上盡自己的一份」；而 GT《丁道爾聖經註釋》另指出，現代以色列已發掘到好幾個 beqa`（比加）的實物樣品。
- title: 亞何利亞伯（Oholiab）
  path: link_folder/人物/亞何利亞伯（Oholiab）.md
  summary: '出38:23「與他同工的有但支派中亞希撒抹的兒子亞何利亞伯；他是雕刻匠，又是巧匠，又能用藍色、紫色、朱紅色線和細麻繡花。」CT 逐項說明他的三種專長：「(1)雕刻匠：擔任寶石、金屬、木頭等的雕刻；(2)巧匠：指設計並執行一切精巧的工作；(3)繡花：指使用彩色線編織和刺繡。」CT 的〔原文字義〕另給「但」為「審判」、「亞希撒抹」為「我的兄弟是支援或已經支援」、「亞何利亞伯」為「父親的帳幕」。GT《中文聖經註釋》據此推論分工：「他的特長是雕刻、設計和刺繡。故此，部分的金屬材料，可能是由他使用的。」GT《聖經精讀本》：「雕刻匠: 可能雕刻了比撒列所造的櫃,陳設餅的桌子、豎板、柱子等器具。看來亞何利亞伯是在比撒列的領導下做工。」BH：但支派向來以工藝著稱，猶大的比撒列與但的亞何利亞伯並肩，象徵各支派在事奉神上的合一。'
  relation: 本章是全卷唯一一次把亞何利亞伯的技能列成清單的地方，而它出現在材料統計的正中間——技能與材料被放在一起結算。CT 在話中之光為這組配搭寫下評語：「比撒列為首，並不驕傲或忌才，亞何利亞伯為副，並不妒忌，也不懈怠。他們單獨向神負責，所以一切聖工都做得非常使神和摩西滿意，以致摩西要為他們祝福（出39:42）。神的榮光後來充滿帳幕（出40:34），表示神十分喜悅他們的工作。」
- title: 以他瑪
  path: link_folder/人物/以他瑪.md
  summary: '出38:21「這是法櫃的帳幕中利未人所用物件的總數，是照摩西的吩咐，經祭司亞倫的兒子以他瑪的手數點的。」CT 的〔原文字義〕給「以他瑪」為「棕櫚岸」，並解此節為「摩西指派亞倫的最小兒子以他瑪負責點收所有的材料」。GT《啟導本聖經腳註》：「以他瑪是亞倫的小兒子（見六23）。」GT《聖經精讀本》：「以他瑪: 亞倫的四兒子(6:23;28:1)。可能他有這方面的恩賜,所以讓他計算造會幕的器具所需的材料。」GT《中文聖經註釋》補上他日後的職分範圍：「他在兄弟中排行最小，在他手下的利未人和他們應辦應抬及應看守之物，均記在民四21～33。他負責數點這些物件，是照摩西的吩咐而行的。」GT《丁道爾聖經註釋》：「利未人受任的經過記載在民數記三章。以他瑪在該處經文也是擔任首領之職（其實他在出六23經已出現了）。」BH：以他瑪受託督導利未人辦這件事，顯出祭司職分之下有分層的職責與授權。'
  relation: 以他瑪在本章第一次擔任一個具體的行政職務，而這個職務是清點——不是獻祭，也不是教導。GT《中文聖經註釋》指出這份清單的用意「大概是為『徵信』之用」。CT 在話中之光把它讀成事奉的權責：「聖所的材料，不但收入要核計，作甚麼用途，也要有清楚的交代。可見作神的工作，權責必要分明，神絕不容許含糊不清。作神管家的人，要準備向神交帳……而且對於人，也該行光明的事（林後8:21）。」
- title: 六十萬零三千五百五十人（出38：26）
  path: link_folder/事件/六十萬零三千五百五十人（出38：26）.md
  summary: 出38:26「凡過去歸那些被數之人的，從二十歲以外，有六十萬零三千五百五十人。」GT 丁良才把這個數字與民數記對照：「『……從二十歲以外』——（民一3、22）。『六十萬零三千五百五十人』——（民二32）。這數和摩西第二年二月初一日所計算的總數一樣（民一1-2、46），因為這兩件事相連，當時摩西數點百姓，收他們的贖命銀，到第二年二月初一日就記各人的家室宗族，利未人卻沒有被數在其中（民一47，二32-33），所以他們也沒有出贖命銀。」GT《啟導本聖經腳註》與《串珠聖經註釋》都指出銀子的總量301,775 舍客勒剛好是這個人數的一半，與民1:46 相符。GT《聖經精讀本》另指出這是「百姓中壯年男子的總數(12:37)」，並提醒這個數字與建造會幕之後第一次人口普查的數字一模一樣。BH：這個數目是可服兵役的以色列男丁總數，不含婦女、孩童與利未人；它顯出以色列自下埃及以來的增長，也是神向亞伯拉罕應許後裔如同星辰的應驗（創15:5）。
  relation: 這個數字在本章的功能是會計上的：它乘以半舍客勒，就是第25節那一百他連得又一千七百七十五舍客勒銀子的由來，而那些銀子鑄成了一百個帶卯的銀座。丁良才由「利未人沒有被數」推出「他們也沒有出贖命銀」——這使銀座的材料成為全體非祭司支派共同承擔的。GT《丁道爾聖經註釋》也指出，正因為銀子出自必繳的贖價而非自願的捐獻，才會出現「銀子比銅多得反常」的情形。
- title: 壇的器具（盆、鏟子、盤子、肉鍤子、火鼎）
  path: link_folder/主題/壇的器具（盆、鏟子、盤子、肉鍤子、火鼎）.md
  summary: 出38:3 他做壇上的盆、鏟子、盤子、肉鍤子、火鼎；這一切器具都是用銅做的。CT：盆用來收拾祭牲和祭物全燒後遺留在祭壇上的灰；鏟子供清除灰燼；盤子供盛放祭牲的血；肉鍤子供插取和置放肉塊；火鼎供盛放和移送火炭。
  relation: 本章首次記載銅壇器具的實際製作——五樣器具全用銅造，表徵一切與十字架相關的事奉都必須經過神的審判；盆收灰、鏟清灰，表徵我們須時常清理裡面的灰才能心裡火熱（羅12:11）。
- title: 壇的四角
  path: link_folder/主題/壇的四角.md
  summary: 出38:2 在壇的四拐角上做四個角，與壇接連一塊，用銅把壇包裹。CT靈意：角指拯救的能力（路1:69）；十字架的能力無堅不摧，能把我們拯救到完全的地步；祭壇的角也為著栓住祭牲（詩118:27）——基督的愛如同慈繩愛索拴住我們（羅12:1；林後5:14-15）。
  relation: 本章首次記載銅壇四角的實際製作——四個角與壇接連一塊、同被銅包裹；角表徵基督拯救的能力（拯救的角），也表徵護庇（王上1:50）。
- title: 壇的銅網
  path: link_folder/主題/壇的銅網.md
  summary: 出38:4-5 為壇做一個銅網，安在壇四面的圍腰板以下，從下達到壇的半腰；為銅網的四角鑄四個環子作為穿槓的用處。CT 記下兩種構造上的解釋：「(1)祭壇是空心的，銅網是四角形，掛在祭壇裡面的半腰處，其上可放置肉塊和祭物，火從祭壇下面焚燒；(2)是為圍住祭壇下半部的四周，一方面有助於空氣流通，維持火勢旺盛，另一方面也有助於預防祭司的腳部被掉下來的灰燼燙傷。」BH 取的是網目讓灰落下、以助燃燒的讀法，並指出這個細節反映獻祭制度的實際需要——壇必須能在頻繁的獻祭中有效運作。CT 靈意：銅網一面托住祭牲、一面幫助焚燒，表徵我們不但不逃避十字架，且要歡迎十字架的對付；而「從下達到壇的半腰」——壇的半腰正是和約櫃相同的高度（出25:10），表徵十字架的救贖合乎神公義的要求。
  relation: 本章首次記載銅網的實際製作，而它的位置正好落在壇的一半高度上。CT 抓住的正是這個數字上的巧合：壇高三肘，半腰即一肘半，與約櫃的高度相同。銅網的四角鑄環穿槓，使整座壇可以抬走——CT 讀為「到處高舉、傳揚並見證基督的十字架」。
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出38:22 凡耶和華所吩咐摩西的都是猶大支派戶珥的孫子、烏利的兒子比撒列做的。全章每一物件都嚴格依照神在山上指示的樣式——銅壇（出27:1-8）、洗濯盆（出30:17-21）、院子帷子與柱子（出27:9-19）。KC：每一樣都被數點——對神而言，每一份祭物、每一份為著會幕的奉獻，都是重要的。
  relation: 本章以材料統計（v21-31）作為「山上的樣式」執行完成的數據總結——金銀銅的每一舍客勒都被數點記錄，表徵神對照祂吩咐所做的每一細節都記念不忘（來6:10）。
- title: 帶卯的銅座（院子柱子座）
  path: link_folder/主題/帶卯的銅座（院子柱子座）.md
  summary: 出38:10-20、30-31 院子柱子帶卯的座是銅的：南面二十個、北面二十個、西面十個、東面門兩邊各三個、門簾柱子四個；帳幕一切的橛子和院子四圍的橛子都是銅的；會幕門帶卯的座也是銅的。CT 解「帶卯的座」為「插立柱子的基座」，並指出「柱子的材質……沒有記載，院子所有的柱子很可能是木製包銅」。KC 把柱子與橛子放在一起看：柱子在會幕裡有它們的位置，橛子也有；柱子引人注目，橛子看來微不足道，然而兩者都不可少——沒有柱子就沒有建築，沒有橛子柱子就站立不住。BH：銅在聖經中常表審判與力量，用作柱子的基座意味著一個能經得起試煉的根基。
  relation: 本章首次記載院子銅座的實際鑄造數量——南北各二十、西面十、東面門兩邊各三、門簾四根，共六十個帶卯銅座為院子柱子的根基。CT 在靈意上讀為「銅座把柱子立定，使它不倒下來；銅，預表審判，我們應當有經得起審判的見證」，並引啟1:15：主耶穌的腳「好像在爐中煆煉光明的銅」——祂的腳在地上行走，代替我們受神的審判，而成為「帶卯的銅座」。院子的座用銅、聖所的座用銀，是本章一組清楚的對比。
- title: 會幕院子
  path: link_folder/主題/會幕院子.md
  summary: '出38:9-20 做帳幕的院子：南面帷子寬一百肘、柱子二十根、帶卯銅座二十個；北面同樣；西面帷子寬五十肘、柱子十根、帶卯座十個；東面寬五十肘，門兩邊各有帷子十五肘、柱子三根、帶卯座三個；院子四面的帷子都是用撚的細麻做的；柱子帶卯的座是銅的，鉤子和杆子是銀的，柱頂用銀子包，一切柱子用銀杆連絡。GT《聖經精讀本》給出實際大小：「會幕的院子南北長45米,東西寬22.5米,是一個相當大的廣場」，並說明它的用途——不僅是祭司宰殺祭物的地方，「而且又是祭司圍坐著吃獻給神的祭物的地方(利6:16,26;7:6)」；院子裡「不僅有祭司和利未人(民8:9-26;18:3-7),還有一般的平民(利12:6,7;15:14,29)」。同一來源解帷子的作用：「用撚的細麻作帷子: 一種白色的簾子,起到隔開神的會幕和外界的作用。這教訓我們,神聖的和世俗的,聖潔的和不潔的是不可能相合的道理。」KC：建築物與其前的器具，被柱子所支撐的細麻帷子從南、北、西三面與東面的一部分圍起來；而東面被稱作「日出的一邊」——這只能是要把注意力引向那升起的日頭，也就是撒迦利亞頌歌中「清晨的日光從高天臨到我們」（路1:78）所指的主耶穌（另參瑪4:2）。'
  relation: 本章首次記載會幕院子的實際建造。院子把「聖」與「俗」分開，卻也把百姓帶進來——GT《聖經精讀本》指出這裡既是宰殺祭物之處，也是祭司吃祭物之處，而平民也能進入。CT 在靈意上讀為「院子表徵基督的見證，就是教會；細麻帷子表徵教會見證基督的公義和聖潔」。柱子立於銅座（審判）、以銀杆連絡（救贖），構成院子結構上的兩層根基。
- title: 橛子與繩子的預表
  path: link_folder/神學/橛子與繩子的預表.md
  summary: 出38:20,31 帳幕一切的橛子和院子四圍的橛子都是銅的。KC：柱子引人注目，橛子看來微不足道，然而兩者都不可少；沒有柱子就沒有建築，沒有橛子柱子就站立不住。橛子深埋地中人所不見，卻擔起支持會幕的工作；銅表審判，橛子用銅造表徵隱藏的事奉者經歷過神的審判與煉淨。
  relation: 本章首次記載橛子的實際製作——帳幕和院子四圍的橛子全用銅造；橛子雖不顯眼，卻是會幕穩固不可或缺的根基，表徵教會中默默支撐的無名事奉者。
- title: 比撒列（Bezalel）
  path: link_folder/人物/比撒列（Bezalel）.md
  summary: 出38:22-23「凡耶和華所吩咐摩西的，都是猶大支派戶珥的孫子、烏利的兒子比撒列做的。」GT 丁良才對這句話的範圍給了一個限定：「『……都是……比撒列做的』——意思都是比撒列指揮人做的。」GT《中文聖經註釋》同樣把金屬材料的使用歸到他手下：「所有有關聖幕和其中的器物，既是比撒列作的，則這些金、銀、銅也是經由他的手所使用的。」CT 的〔原文字義〕：「猶大」讚美的；「戶珥」洞；「烏利」火熱的；「比撒列」在神的庇蔭之下。BH：比撒列出自猶大支派，而猶大是日後大衛與基督的支派；經文提到他的祖父戶珥，可能就是在與亞瑪力人爭戰時扶持摩西的那位戶珥（出17:10-12），顯出一個忠心與領導的家族傳承。
  relation: 本章是比撒列在全卷最後一次被提名，而且是以三代族譜的完整形式（戶珥的孫子、烏利的兒子、猶大支派）出現在總結欄。丁良才對「都是比撒列做的」的限定很重要：它把出37 的「他」與本章的「做」都讀成指揮而非親手。CT 在話中之光把名字的意思接到事奉的態度：「『比撒列』是『在神的蔭下』的意思。他所做的工完全是按照神所吩咐而作的，在每一樣聖工上都是服『在神的蔭下』。」
- title: 洗濯盆（銅盆）
  path: link_folder/主題/洗濯盆（銅盆）.md
  summary: 出38:8 他用銅做洗濯盆和盆座，是用會幕門前伺候的婦人之鏡子做的。GT 丁良才給出材質背景：「『鏡子』——古時候的鏡子是銅做的（伯三十七18）。」GT《啟導本聖經腳註》補上年代：「古代以銅為鏡，銅磨亮之後可以照見人面。用玻璃作鏡子到羅馬時代才有。」GT 另引一段說明這份奉獻的性質：「鏡子以前沒有提到過，是用拋光的青銅製作的，呈圓形或橢圓形。像大多數東方國家一樣，這種鏡子很早就被埃及婦人使用了。摩西似乎並沒有這樣的吩咐，所以婦人一定是出於值得稱道的獻身捨己的精神把它們奉獻出來的。這些鏡子無疑非常昂貴，所以呈與神就成了犧牲奉獻的典範。」GT《聖經精讀本》：「她們把自己的鏡子獻上作鏡,說明重視神的帳幕超過重視自己的打扮,體現了為事奉神而捨己的精神。」CT：銅表徵審判；洗濯盆表徵話中之水的洗淨（弗5:26）。KC：洗濯盆代表神的話；神的話也被比作鏡子（雅1:23-25）；婦人的鏡子能給出照鏡者完整的形像，卻不是改變那不對之處的方法——神話語這面鏡子同樣給出完整的形像，卻也給出了改變的方法。BH：這些鏡子多半是磨光的銅做的，因為古代近東還沒有玻璃鏡；它們是私人物品，捐出來是一項實在的犧牲。
  relation: 本章首次記載洗濯盆的實際製作，並揭示了出30:17-21 沒有交代的材料來源。GT《丁道爾聖經註釋》指出這是新資料：「製造洗濯盆所用之銅的來源，本節提供了新資料。男人若獻臂環，女人獻的便是鏡子了。」鏡子原為照見自己、妝飾自己，獻上後成為洗淨祭司的盆——CT 在話中之光把這個轉換寫得很直接：「『鏡子』是婦女最珍視的財產，關係著她們的妝飾。她們獻上鏡子，說明了她們有屬靈的分辨能力，認識了真實的妝飾，乃是在生命中獻上真實的敬拜。」
- title: 皂莢木
  path: link_folder/原文/皂莢木.md
  summary: 出38:1、6 燔祭壇與抬壇的槓用皂莢木製作，外面包銅。CT 指出銅的作用是耐火：「意指祭壇的骨架是木料，外面則包上銅，可以耐火。」BH：皂莢木耐久抗腐，在西乃一帶隨處可見，是曠野行程中最實際的選材；木包銅的組合可讀為基督人性（木）與祂所承受之審判（銅）的並置。
  relation: 本章是皂莢木在會幕工程中最後一次出現，而且是唯一一次外面包的不是金而是銅。至聖所與聖所的器具是木包金（神性），院子的燔祭壇是木包銅（審判）——同一種木頭，兩種包裹，對應會幕由外而內的兩種遇見。CT 在靈意上讀為「皂莢木表徵道成肉身的耶穌；燔祭壇表徵耶穌的十字架（來13:10-13）」。
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 出38:21-31 全章以材料統計作結——金銀銅的每一舍客勒都被數點記錄，表明神對祂居所建造的每一細節都記念不忘。KC：每一樣都被數點——對神而言，每一份祭物、每一份為著會幕（祂居所）的奉獻，都是重要的；「可以在耶和華面前為以色列人作紀念」（出30:16）。會幕院子以細麻帷子圍繞，將聖與俗分開，神的同在在院子內、在帳幕中具體實現。
  relation: 本章完成會幕外院與一切器具的建造，神的居所從至聖所（出37）延伸到聖所（出37）再到外院（出38），神的同在由內向外逐步展開；材料統計顯明每一個人的奉獻都在神面前被記念。
- title: 舍客勒
  path: link_folder/原文/舍客勒.md
  summary: 出38:24-29 三種金屬的總量都以「按聖所的平」計算：金二十九他連得並七百三十舍客勒、銀一百他連得並一千七百七十五舍客勒、銅七十他連得並二千四百舍客勒。CT 的〔原文字義〕給「平」（舍客勒）約11.5公克、「他連得」為3000舍客勒（約34公斤）。GT 丁良才：「『舍客勒』——大約是現今磅秤的半兩，按25-26一他連得有三千舍客勒。」GT《聖經精讀本》給出這個單位在生活中的分量：「當時的銀子1舍客勒相當於普通工人的4天工價,30舍客勒相當於一個奴隸的身價(21:32)。金子1舍客勒相當於銀子15舍客勒。」GT《丁道爾聖經註釋》指出這份記載的另一層意義：「這裡的記載很有意思，顯出早期統一度量衡的嘗試。現代以色列發掘到好幾個 beqa` 『比加』，即半舍客勒的樣品。」BH：聖所的平是會幕所用的標準單位，比通用舍客勒略重，這使奉獻的計算有一致而公平的基準。
  relation: 本章是舍客勒這個單位在出埃及記中被用得最密集的一章——三種金屬、四個總量、一個人頭定額，全部以它為基準。「按聖所的平」這個限定語在本章出現三次，CT 讀為「聖所自有標準度量，表徵神有祂自己的衡量標準」。而 GT《聖經精讀本》給的工價換算讓這些數字有了實感：一舍客勒銀子約等於普通工人四天的工價。
- title: 金銀銅統計（出38：24-31）
  path: link_folder/事件/金銀銅統計（出38：24-31）.md
  summary: 出38:24-31 記三種金屬的總量與用途：金二十九他連得並七百三十舍客勒（用於聖所一切工作）、銀一百他連得並一千七百七十五舍客勒（一百他連得鑄一百個帶卯的座，每座一他連得；餘下的做鉤子、包柱頂與杆子）、銅七十他連得並二千四百舍客勒（會幕門帶卯的座、銅壇與銅網及壇的一切器具、院子四圍與院門帶卯的座、帳幕與院子一切的橛子）。CT 折算金約一公噸、銀約三點五公噸、銅約二點五公噸。GT《串珠聖經註釋》另取一套基準，算得金877公斤、銀3017公斤、銅2124公斤；GT《啟導本聖經腳註》取第三套，算得金863公斤、銀2926公斤、銅2055公斤。GT《丁道爾聖經註釋》對數字持保留：「數目以整數列出，貴重金屬全都數以噸計（金一噸、銀四噸、銅三噸）。但古卷中的數字可能亦保存得並不正確。」GT《舊約聖經背景註釋》指出這份清單的排序原則：「建築聖幕所用的材料，本段由貴到賤一一列出」，而這些材料「都是首先獻給神作為搖祭，把它分別出來作為聖用」。KC：一切都被數點；對神而言，每一份祭物、每一份為著祂居所的奉獻都是重要的，「可以在耶和華面前為以色列人作紀念」（出30:16）。
  relation: 本章的收尾不是一段講論，而是一份帳。三種金屬的來源並不相同：GT《丁道爾聖經註釋》指出「銀子不算是自願的捐獻」，它出自每個被數男丁必繳的半舍客勒贖價，這正是銀子反常地多過銅的理由；金與銅則出於甘心的搖祭。CT 在靈意上把三者對應為神性（金）、救贖（銀）、審判（銅），並指出「正如銀子用於柱子和帶卯的座等，金子和銅也都有指定的用途，在建造教會的事上，不可或缺」。KC 由「everything is counted」帶出一個自省：我們也該數一數，是不是某些真理被我們忽略了，而另一些被不成比例地強調。
- title: 銀子
  path: link_folder/主題/銀子.md
  summary: 出38:10-12、17、19、25-28 院子柱子的鉤子和杆子用銀子做、柱頂用銀子包；會中被數的人所出的銀子有一百他連得並一千七百七十五舍客勒；用那一百他連得銀子鑄造聖所帶卯的座和幔子柱子帶卯的座，一百他連得共一百帶卯的座，每帶卯的座用一他連得；用那一千七百七十五舍客勒銀子做柱子上的鉤子、包裹柱頂並柱子上的杆子。GT 丁良才逐一算出那一百個座的分佈：「就是會幕南面四十個（三十六23-24），北面四十個（三十六25-26），西面十六個（三十六27-28、30），在聖所和至聖所當中四個（三十六36），共一百個。」GT《聖經精讀本》指出這些銀出自贖罪銀：「支撐會幕柵欄的柱子,並起到連接作用的鉤子和杆子都是用百姓的贖罪銀製作的。」GT《丁道爾聖經註釋》點出一個反常之處：「銀子不算是自願的捐獻，這是銀子比銅多得反常的理由。」KC：銀子出自那些被數點的人——每個被數的人都要付半舍客勒（出30:11-16），而聖所的帶卯座正是用這些銀子做的；也就是說，每個人都是在同一個根基上有分於神的家。
  relation: 本章首次記載銀子的完整統計與用途分配。一百他連得鑄成一百個帶卯的銀座，每座恰好一他連得——KC 由此讀出一條平等的線：無論我們多麼不同，都同樣需要基督和好之工這個根本的真理，唯有信靠這工，才使我們有分於神的家。CT 在靈意上以銀表救贖，並指出鉤子和杆子用銀，「表徵基督的救贖是信徒聯結和維繫見證的力量」。
- title: 銀杆（連絡柱子）
  path: link_folder/主題/銀杆（連絡柱子）.md
  summary: 出38:17、19、28 院子一切的柱子都是用銀杆連絡的；柱子的鉤子和杆子是銀的，柱頂是用銀子包的；用那一千七百七十五舍客勒銀子做柱子上的鉤子、包裹柱頂並柱子上的杆子。CT 說明用途：「『鉤子』是為懸掛帷子和門簾；『杆子』是為連結相鄰兩根柱子；『柱頂』指柱子的頂端」，並推測「柱子本身可能是用皂莢木，柱頂包銀」，而銀杆的連結處「大概位於柱子的頂端」。GT 丁良才指出柱頂在出27 並未提到：「『柱頂是用銀子包的』——正如帳幕的柱頂是用金子包的（三十六38），在第二十七章上沒有提到這些柱頂。」GT《聖經精讀本》給了數目：「用銀子製作了40個同一規格的柱頂,這不僅保護了柱子,而且外表很協調、優美。」BH：銀在聖經中常與救贖相連，而銀鉤與銀杆把整座院子的結構繫成一體，正呼應信徒在基督裡「被建造在一起」（弗2:22）。
  relation: 本章首次記載銀杆的實際製作與用料數量——那一千七百七十五舍客勒銀子（鑄完一百個銀座之後所剩）全部用在鉤子、柱頂與杆子上。CT 在話中之光讀出合一：用銀杆把各柱相連，使柱子站穩；銀預表聖潔與救贖，唯有救贖能使人有真正屬靈的聯絡。而柱頂包銀這件事，丁良才指出是本章相對出27 新增的細節。
- title: 銅
  path: link_folder/主題/銅.md
  summary: 出38:2-8、10-12、14-15、17、19-20、29-31 壇包銅、壇的器具用銅、銅網用銅、洗濯盆和盆座用銅、院子柱子帶卯的座用銅、門簾柱子座用銅、橛子用銅；所獻的銅有七十他連得並二千四百舍客勒。GT《聖經精讀本》給出用銅的實際理由：「與會幕中其他的器具不同,燔祭壇和洗濯盆是用銅製作的。因為在其上經常燒祭物,所以它要能夠承受熱度。」BH 補上材質背景：銅是銅錫合金，堅韌耐熱，在古代近東常用於工具與兵器；聖經中銅常與審判和忍耐相連，如銅蛇（民21:9）與啟1:15 基督如同在爐中煆煉的銅腳。GT《舊約聖經背景註釋》列出銅的用途：「這種比較耐用的金屬，用來製作入口的底座、銅壇及其網、祭壇的器具、支持院帷柱子的底座，以及橛子。」CT 靈意：銅表徵神的審判。
  relation: 本章記載銅在會幕外院中的全面使用——從銅壇到洗濯盆、從柱子座到橛子。銅之所以集中在外院，一半是物理上的（耐火耐磨），一半在 CT 的讀法裡是神學上的：外院是人第一步遇見神的地方，而人第一步遇見的是審判。CT 由此帶出一句應用：「凡我們身上通不過神審判的地方，十字架就將它置之於死。」
- title: 銅壇（燔祭壇）
  path: link_folder/主題/銅壇（燔祭壇）.md
  summary: 出38:1-7 用皂莢木做燔祭壇，是四方的，長五肘寬五肘高三肘；在壇的四拐角上做四個角與壇接連一塊，用銅把壇包裹；做壇上的盆、鏟子、盤子、肉鍤子、火鼎，一切器具用銅做；為壇做一個銅網安在壇四面的圍腰板以下，從下達到壇的半腰；為銅網的四角鑄四個環子作為穿槓的用處；用皂莢木做槓用銅包裹；把槓穿在壇兩旁的環子內用以抬壇，並用板做壇，壇是空的。GT《丁道爾聖經註釋》注意到一個用詞上的細節：「燔祭壇。本段用這個（前面所無的）名稱來分別祭壇和香壇，是因為經文剛剛提到過香壇（出三十七25）。」GT《聖經精讀本》說明為何用銅：「與會幕中其他的器具不同,燔祭壇和洗濯盆是用銅製作的。因為在其上經常燒祭物,所以它要能夠承受熱度。」CT 折算尺寸約二百二十五公分見方、一百三十五公分高。BH：壇的四方形與尺寸反映神吩咐中的秩序，既大得足以承接律法所要求的祭牲，又輕便得可以隨曠野行程搬遷。KC：這壇是神與祂百姓相會的地方，其根基是那不斷獻上的燔祭（出29:38-45）；希伯來書講明這壇與這祭都已在基督裡應驗（來13:10）。
  relation: 本章首次記載銅壇的實際製作。它是會幕中最大的器具（五肘見方、三肘高），置於院子入口之後，CT 由此讀出人到神面前的次序：「神的啟示先是從至聖所開始，自約櫃至銅祭壇。但當他們建造時就先從外面開始，從人的經歷開始：罪人進入會幕，最先見到的是銅祭壇。這與五祭的次序相同（利1-5章）。」而「燔祭壇」這個名稱是在此才出現的——丁道爾指出這是為了與剛提過的香壇分別。
- title: 院子門簾
  path: link_folder/主題/院子門簾.md
  summary: 出38:18-19 院子的門簾是以繡花的手工，用藍色、紫色、朱紅色線和撚的細麻織的，寬二十肘高五肘，與院子的帷子相配；柱子四根，帶卯的銅座四個，柱子上的鉤子和杆子是銀的，柱頂是用銀子包的。CT 折算：「大門的寬度約合九公尺，高度約二百二十五公分」，並指出第19節「帷子」在原文中沒有這個字——「按照句子的文法結構，可譯作代名詞『它』，用來修飾18節的主詞，故應當是指『門簾』……中文誤譯」。GT《聖經精讀本》解門的意義：「掛在會幕大門上的這個門簾,讓我們聯想起他阻擋那些想盲目地靠近神的人的耶穌基督的事工……但另一方面,基督用自己的死滿足了神的公義,所以無論是誰只要靠著他就能親近神。」同一來源在第14-15節指出門其實只有一扇：「其實是一扇門,由於在門的兩邊掛上了布簾,所以才說門這邊,門那邊。」KC：院門的簾子與其餘的帷子不同，它是有顏色的；只有經由這道門，人才能進去。
  relation: 本章首次記載院子門簾的實際製作。它是院子唯一的彩色入口，與四圍白色的細麻帷子形成對比——CT 讀為「門簾分別門內和門外，卻又容易進入，表徵福音，任何人只要相信就能有分於基督」，並把各色線解為福音的內容：流血的救贖（朱紅色線）、永生的賞賜（藍色）、成聖的追求（細麻）和作王的應許（紫色）。CT 在第19節另留下一個譯本上的提醒：那四根柱子是門簾的柱子，不是帷子的柱子。
- title: 壇的圍腰板
  path: link_folder/主題/壇的圍腰板.md
  summary: 出38:4「又為壇做一個銅網，安在壇四面的圍腰板以下，從下達到壇的半腰。」CT 指出「圍腰板」是祭壇半腰處的框板，其功用有兩種說法：「(1)供祭司做踏腳板；(2)為裝飾並強固祭壇。銅網就掛在圍腰板的下方。」BH：這道邊沿有實際功能，很可能是祭司獻祭時站立的平臺；它的存在也顯出壇的體積相當可觀。
  relation: 本章是圍腰板由出27 的規格進入實做的一章，而它的功用仍然沒有定論。CT 在靈意上取「加固」的讀法：「圍腰板加固祭壇；表徵十字架的能力，足以對付並除去一切罪惡、肉體和肉體的邪情私慾。」不論取哪一說，它都是銅網的定位基準——銅網掛在它以下，一直到壇的半腰。
- title: 壇的槓（抬壇用）
  path: link_folder/主題/壇的槓（抬壇用）.md
  summary: 出38:6-7「用皂莢木做槓，用銅包裹，把槓穿在壇兩旁的環子內，用以抬壇。」CT 說明槓是用皂莢木作的、外表包上一層銅；靈意上「杠用以抬祭壇；表徵人性經過審判合格，才能見證基督」。BH：槓與環的配置與約櫃、桌子、香壇一致，都是為了讓聖物不必被人手直接觸摸，也顯出曠野行程中每一件器具都必須可攜。
  relation: 燔祭壇的槓與會幕內部器具的槓有一處明顯的差別：內部器具的槓是木包金，燔祭壇的槓是木包銅。同一種結構、兩種包裹，對應的是聖所與外院的兩種材質語言。CT 在靈意上讀為「銅環用以穿杠抬壇，可以移動祭壇；表徵到處高舉、傳揚並見證基督的十字架」。
- title: 壇的銅環
  path: link_folder/主題/壇的銅環.md
  summary: 出38:5「為銅網的四角鑄四個環子，作為穿槓的用處。」CT 說明位置：「『銅網的四角』也就是壇半腰處的四角；『四個環子』指壇兩旁各有兩個環子，都位於角落上；『穿杠的用處』指兩旁各有一根杠。」BH：鑄造銅環是為了做出耐用而合用的構件，四這個數目在此同樣指向完整，而環與槓的組合是會幕搬運聖物一貫的作法。
  relation: 本章首次記載壇的銅環的實際鑄造。它與會幕內部器具的金環是同一種設計、不同的材質——銅在外院，金在聖所。CT 在靈意上讀為「銅環用以穿杠抬壇，可以移動祭壇；表徵到處高舉、傳揚並見證基督的十字架」。
- title: 拯救的角（路1：69）
  path: link_folder/互文/拯救的角（路1：69）.md
  summary: 出38:2「在壇的四拐角上做四個角，與壇接連一塊，用銅把壇包裹。」CT 在靈意註解裡把壇的角接到路1:69：「角指拯救的能力（路一69）；十字架的能力無堅不摧，無敵不克，能把我們拯救到完全的地步。」他並在話中之光說：「祭壇的角說出基督拯救的能力，所以又稱『拯救的角』（路一69）；感謝主，凡信靠祂的，祂都能拯救我們到底（來七25）。」BH：角在古代近東文化中與權柄和力量相連，而壇的角也用於贖罪之禮——把血抹在角上（利4:7）。
  relation: 本章是這個新約用語在會幕器具上的落點：撒迦利亞所說「在他僕人大衛家中，為我們興起了拯救的角」，其意象正來自祭壇四角。CT 另指出角還有一個很實際的用途——繫住祭牲（詩118:27），並由此帶出一句應用：「基督的愛如同慈繩愛索拴住我們，使我們不能不奉獻自己，為神而活（羅12:1；林後5:14-15）。」
- title: 撚的細麻
  path: link_folder/原文/撚的細麻.md
  summary: '出38:9、16、18 院子四面的帷子都是用撚的細麻做的，院子的門簾也用藍色、紫色、朱紅色線和撚的細麻織成。GT《聖經精讀本》解帷子的作用：「用撚的細麻作帷子: 一種白色的簾子,起到隔開神的會幕和外界的作用。這教訓我們,神聖的和世俗的,聖潔的和不潔的是不可能相合的道理。」BH：細麻是貴重而高品質的材料，常與純潔和公義相連（啟19:8 以細麻為聖徒的義行），用它作院子的界線，正顯出親近神所要求的聖潔。'
  relation: 本章是撚的細麻在會幕工程中面積最大的一次使用——院子四圍一共二百六十肘的帷子全是它。細麻在聖所裡是幔子的材料，在院子裡卻成了牆：同一種織物，在裡面表明榮美，在外面劃出界線。CT 在靈意上讀為「院子表徵基督的見證，就是教會；細麻帷子表徵教會見證基督的公義和聖潔」，並在話中之光提醒：「撚細麻的時候，要細心、忠心、耐心，否則就撚得不美。」
- title: 藍色、紫色、朱紅色線
  path: link_folder/主題/藍色、紫色、朱紅色線.md
  summary: 出38:18、23 院子的門簾以繡花的手工，用藍色、紫色、朱紅色線和撚的細麻織成；亞何利亞伯「能用藍色、紫色、朱紅色線和細麻繡花」。CT 指出門簾的製法與至聖所的門簾一樣，是用彩色線繡花手工織成有細縫的簾子；靈意上各色線表徵福音的內容——流血的救贖（朱紅色線）、永生的賞賜（藍色）、成聖的追求（細麻）和作王的應許（紫色）。BH：這三色在會幕與祭司衣袍中一再出現，藍表天與神性、紫表王權與財富、朱紅表犧牲與贖罪。
  relation: 本章把三色線用在整座院子唯一有顏色的地方：門簾。四圍二百六十肘全是白色的細麻，只有那二十肘的入口是彩色的——顏色在這裡標示的不是華美，而是門。CT 由此讀出福音的性質：「門簾分別門內和門外，卻又容易進入，表徵福音，任何人只要相信就能有分於基督。」
- title: 銅壇與十字架（來13：10-13）
  path: link_folder/互文/銅壇與十字架（來13：10-13）.md
  summary: 出38:1-7 記燔祭壇的製作。CT 在靈意註解裡直接把它接到十字架：「皂莢木表徵道成肉身的耶穌；燔祭壇表徵耶穌的十字架（來13:10-13）」，並在話中之光說：「基督是我們的救贖，若不藉著祂的救贖，沒有人能靠自己的功績來到神面前……皂莢木說出基督道成肉身，四方說出祂滿足神公義的要求；我們唯有在基督裡面，才能通過神的審判。」KC：這座壇是神與祂百姓相會的地方，其根基是壇上不斷獻上的燔祭（出29:38-45）；而希伯來書講明這壇與這祭都已在基督裡得了成全——「今日仍然死抓著這座字面的壇不放的人，在基督徒的交通上是無分的（來13:10）。」BH：壇預表基督，祂把自己一次獻上作了永遠的贖罪祭（來10:10）。
  relation: 本章是這個對應關係在實物上的落點：壇造好了，而它是院子裡最大的一件器具，也是人進門後最先遇見的。CT 由建造次序讀出人的經歷次序：「神的啟示先是從至聖所開始，自約櫃至銅祭壇。但當他們建造時就先從外面開始，從人的經歷開始：罪人進入會幕，最先見到的是銅祭壇。」
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出38 記會幕外院的建造與全部材料的總結算：燔祭壇（v1-7）、洗濯盆（v8）、院子的帷子柱子與門簾（v9-20），以及金銀銅三種材料的總量與用途（v21-31）。GT《中文聖經註釋》指出這份清單「大概是為『徵信』之用」；GT《舊約聖經背景註釋》指出材料是「由貴到賤一一列出」，而且都先獻給神作搖祭、分別為聖。KC：一切都被數點——對神而言，每一份祭物、每一份為著祂居所的奉獻都是重要的（出30:16）。
  relation: 出36 造房子，出37 造房子裡的東西，出38 造房子外面的東西並把帳結清。到本章為止，會幕的每一個部件都已造成，只差立起來——而那要到出40 才發生。CT 在話中之光把這份帳的意義說給今天的教會聽：「聖所的材料，不但收入要核計，作甚麼用途，也要有清楚的交代。可見作神的工作，權責必要分明。」
- title: 基督是門（約10：7）
  path: link_folder/互文/基督是門（約10：7）.md
  summary: 出38:14-19 院子的東面設門，門這邊的帷子十五肘、那邊也是一樣，門簾寬二十肘、高五肘，是院子唯一有顏色的一段。CT 在靈意註解裡直接連上：「門表徵基督是通神之門（約10:7）」，並在話中之光引約10:9：「我就是門，凡從我進來的，必然得救，並且出入得草吃。」GT《聖經精讀本》指出這其實只有一扇門：「其實是一扇門,由於在門的兩邊掛上了布簾,所以才說門這邊,門那邊。暗示滿身是罪的人類通過這扇門才能走向神,除外別無他法。」KC：院門的簾子與其餘帷子不同，它是有顏色的；只有經由這道門，人才能進去。BH：這道入口的簾子是唯一的進路，預表基督是到父那裡去的唯一道路（約14:6）。
  relation: 本章是這個預表在會幕最外一圈的落點。院子四圍二百六十肘的帷子沒有一處可以穿過，只有東面中央那二十肘——「除外別無他法」這句話在建築上是字面成立的。GT《聖經精讀本》另指出門簾同時有攔阻與開放兩面：它阻擋那些想盲目靠近神的人，但「基督用自己的死滿足了神的公義，所以無論是誰只要靠著他就能親近神」。
- title: 半舍客勒（贖罪銀）
  path: link_folder/原文/半舍客勒（贖罪銀）.md
  summary: 出38:25-26 會中被數的人所出的銀子有一百他連得並一千七百七十五舍客勒；被數的男丁從二十歲以外共六十萬零三千五百五十人，「按聖所的平，每人出銀半舍客勒，就是一比加」。GT《丁道爾聖經註釋》指出這筆銀子的性質：「銀子的總數（極高）是民數記一章所列以色列成人數目，乘以每人必須繳交半舍客勒『贖價』（出三十13）的積數。銀子不算是自願的捐獻，這是銀子比銅多得反常的理由。」GT《舊約聖經背景註釋》：「這銀子原是從每一位以色列男子收集回來的贖命稅（三十11～16）。」KC：銀子出自那些被數點的人，也就是說每個人的數額都一樣，因為每個被數的人都要付半舍客勒。
  relation: 本章是半舍客勒這條規定第一次結出實際的重量：六十萬零三千五百五十人乘以半舍客勒，正好是301,775 舍客勒，也就是一百他連得又一千七百七十五舍客勒。而這筆錢的去處使它的意義更明確——那一百他連得鑄成了一百個帶卯的銀座，成為會幕站立的根基。KC 由此讀出一條平等的線：「每一個人都是在同一個根基上有分於神的家。」
- title: 數點民數
  path: link_folder/事件/數點民數.md
  summary: 出38:26「凡過去歸那些被數之人的，從二十歲以外，有六十萬零三千五百五十人。」GT 丁良才把這次數點與民數記的兩次記載對齊：「這數和摩西第二年二月初一日所計算的總數一樣（民一1-2、46），因為這兩件事相連，當時摩西數點百姓，收他們的贖命銀，到第二年二月初一日就記各人的家室宗族，利未人卻沒有被數在其中（民一47，二32-33），所以他們也沒有出贖命銀。」GT《啟導本聖經腳註》與《串珠聖經註釋》都指出銀子總量正是這個人數的一半（每人半舍客勒），與民1:46 相符。BH：這次數點統計的是可服兵役的男丁，不含婦女、孩童與利未人。
  relation: 本章的數點不是為了徵兵，而是為了收贖命銀——數點與贖價在出30:11-16 本來就綁在一起。丁良才指出這正是同一次數點的兩種用途：先收贖命銀，到第二年二月初一日才按家室宗族記錄下來。而利未人不在其中，所以他們也沒有出這筆銀子——會幕的銀座，是由其餘各支派的男丁一人一份湊出來的。
- title: 古代近東的人口統計
  path: link_folder/背景/古代近東的人口統計.md
  summary: 出38:26 記被數之人「從二十歲以外，有六十萬零三千五百五十人」。GT《舊約聖經背景註釋》說明這個統計的性質與用途：「人口統計被數點，並且繳付了半舍客勒銀子贖命稅（見三十11～16）的男子，共有六十萬零三千五百五十名。這數目與民數記一46所記之人口統計總數相同。這統計的用意，是計算二十歲以上可服兵役男子的數目。」BH：二十歲在以色列社會是成年與擔責的年齡，這個年齡下限同時界定了服兵役的資格與繳納人頭稅的義務。
  relation: 本章讓這次統計顯出它的雙重用途：它既是兵籍，也是稅籍，而稅收的去處是會幕的銀座。GT《舊約聖經背景註釋》另指出「比加」這個單位正是為此而設——「每個二十歲以上男丁所繳付，來支持聖幕之建造和維修的贖命稅，就是這個數目」。
- title: 搖祭
  path: link_folder/原文/搖祭.md
  summary: 出38:24、29 金子與銅都以「所獻的」（原文為搖祭）記述。CT 的〔原文字義〕給「獻」為「遙祭，輝動，搖擺」。GT《舊約聖經背景註釋》說明這個動作的意義：「建築聖幕所用的材料，本段由貴到賤一一列出。這些材料和保留給祭司食用的祭肉（二十九27）一樣，都是首先獻給神作為搖祭（和合本：『所獻的』），把它分別出來作為聖用。」BH：搖祭是把供物在耶和華面前搖一搖，象徵把它呈獻給神，再由神轉交給人使用。
  relation: 本章讓「搖祭」這個原本用在祭肉上的動作，出現在建材上——金與銅在成為壇、座與橛子之前，先被搖過一次。這使建造會幕的材料在性質上與祭物同列：它們不是捐給工程的物資，而是獻給神、再由神分派用途的聖物。而銀子不在此列，因為銀出自必繳的贖價，不是甘心的搖祭。
- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  summary: 出38:22「凡耶和華所吩咐摩西的，都是猶大支派戶珥的孫子、烏利的兒子比撒列做的。」CT 的〔原文字義〕給「猶大」為「讚美的」、「戶珥」為「洞」、「烏利」為「火熱的」。BH：比撒列出自猶大支派，而猶大是日後大衛與基督的支派，這使會幕總工頭的出身帶有彌賽亞譜系的意味；經文提到他的祖父戶珥，可能就是在與亞瑪力人爭戰時扶持摩西的那位戶珥（出17:10-12），顯出一個忠心與領導的家族傳承。
  relation: 本章是全卷唯一一次把比撒列的三代族譜與支派完整寫在總結欄裡的地方。這個位置本身有意義：材料的帳要記名，工匠的出身也要記名。而猶大與但這兩個支派並列出現在同一節之內，BH 讀為各支派在事奉神上的合一。
- title: 但支派
  path: link_folder/人物/但支派.md
  summary: 出38:23「與他同工的有但支派中亞希撒抹的兒子亞何利亞伯；他是雕刻匠，又是巧匠，又能用藍色、紫色、朱紅色線和細麻繡花。」CT 的〔原文字義〕給「但」為「審判」、「亞希撒抹」為「我的兄弟是支援或已經支援」、「亞何利亞伯」為「父親的帳幕」。BH：但支派向來以工藝著稱，亞何利亞伯出自但、比撒列出自猶大，兩人並肩象徵各支派在事奉上的合一。
  relation: 但支派在出埃及記中被具名提及的次數極少，而本章是其中一次，並且是在總結欄裡與猶大支派並列。CT 在話中之光把亞何利亞伯的名字意思接到教會：「『亞何利亞伯』是『父親的帳棚』的意思。他是一個時代的技術工——巧匠，在教會中，有恩賜能幹的工人是父神家中寶貴的財產。」
- title: 話語潔淨（弗5：26）
  path: link_folder/互文/話語潔淨（弗5：26）.md
  summary: 出38:8 洗濯盆與盆座用銅做成，材料是會幕門前伺候的婦人之鏡子。CT 在靈意註解裡把洗濯盆接到弗5:26：「銅表徵審判；洗濯盆表徵話中之水的洗淨（弗五26）」，並在話中之光展開：「祭壇是贖我們的罪；洗濯盆是洗去我們的污穢，成為聖潔。我們不只在地位上成聖，更要在生活上成聖……這表明神的話，和基督在十字架為我們所成的事實，都如鏡子般告訴我們說，我們的自己（肉體）是污穢的，如果我們要進入聖所事奉神，必須經過洗濯盆，藉著道潔淨，成為聖潔。」KC：洗濯盆代表神的話，而神的話也被比作鏡子（雅1:23-25）——婦人的鏡子能給出完整的形像，卻不是改變的方法；神話語這面鏡子卻給出了改變的方法。
  relation: 本章使這個對應多了一層很具體的內容：洗濯盆的材料本來就是鏡子。KC 抓住的正是這一點——女人交出的是只能照出問題的鏡子，換來的是能解決問題的鏡子。而它在院子裡的位置也對應著次序：先過祭壇（贖罪），再過洗濯盆（潔淨），才進聖所。
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 出38:21「這是法櫃的帳幕中利未人所用物件的總數，是照摩西的吩咐，經祭司亞倫的兒子以他瑪的手數點的。」GT《中文聖經註釋》指出這句話的時間點：「這已表明在豎立聖幕之後，已經分配了利未人各自保管和扛抬聖幕中的不同物件之後的說法（參看民三至四章）。」GT《丁道爾聖經註釋》：「利未人受任的經過記載在民數記三章。以他瑪在該處經文也是擔任首領之職。」BH：利未人是被分別出來擔任會幕事奉的支派，由他們記錄這份清單，凸顯了他們作為聖物看守者與神人之間中介的角色。
  relation: 本章是利未人在出埃及記中被指派具體職務的地方，而這個職務是保管與扛抬——不是獻祭。GT 丁良才另指出，正因為利未人沒有被數在贖命銀的名單中（民1:47），他們也沒有出那半舍客勒；他們對會幕的分是勞力，不是銀子。
- title: 婦女參與建造會幕
  path: link_folder/主題/婦女參與建造會幕.md
  summary: 出38:8「他用銅做洗濯盆和盆座，是用會幕門前伺候的婦人之鏡子做的。」GT《丁道爾聖經註釋》指出這是全新的資料：「製造洗濯盆所用之銅的來源，本節提供了新資料。男人若獻臂環（出三十五22），女人獻的便是鏡子了。」GT 另有一段說明這份奉獻的性質：「摩西似乎並沒有這樣的吩咐，所以婦人一定是出於值得稱道的獻身捨己的精神把它們奉獻出來的。這些鏡子無疑非常昂貴，所以呈與神就成了犧牲奉獻的典範。這些虔誠的婦女注重心靈勝過外表的妝飾（彼前3:1-5）。她們的禮物證明她們愛神勝過愛自己。」GT《聖經精讀本》：「她們把自己的鏡子獻上作鏡,說明重視神的帳幕超過重視自己的打扮,體現了為事奉神而捨己的精神。」KC 由此列出女人在神工作上的九項貢獻，從用財物供給主（路8:1-3）到與眾人一同構成教會的核心（徒1:14）。
  relation: 出35 記婦女紡線，出38 記婦女獻鏡——前者是手藝，後者是財物，而且是最私人的那一件財物。GT《丁道爾聖經註釋》指出這件事沒有吩咐在先：摩西並沒有要她們獻鏡子。CT 在話中之光把這個選擇讀成分辨力：「她們獻上鏡子，說明了她們有屬靈的分辨能力，認識了真實的妝飾，乃是在生命中獻上真實的敬拜。」
