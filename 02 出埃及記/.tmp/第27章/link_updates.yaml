book: 出埃及記
chapter: 27
updates:
- title: 皂莢木
  path: link_folder/原文/皂莢木.md
  summary: 出27:1、6 本章的皂莢木用在兩處：做壇的板，以及抬壇的兩根槓——兩者都不包金，而是包銅。CT：「祭壇的骨架是木料，外面則包上銅，可以耐火」；GT 引丁良才給了同樣的理由：「神吩咐摩西用銅包壇，免得壇上的火燒壞了壇。」GT《丁道爾》從搬運的角度說明選材：「祭壇用包裹著銅片的皂莢木板製成，使之易於搬遷。」BH：皂莢木「因其耐久與抗腐蝕而被選用」，也「指向基督不朽壞、無罪的人性」。
  relation: 皂莢木在會幕裡通常包金（約櫃、桌子、豎板、內幔柱），本章卻是它唯一一次包銅——而這個差別正是位置造成的：壇在院子裡，要天天燒火。CT 的靈意讀法把這件事讀成一體兩面：「皂莢木表徵道成肉身的耶穌」，而銅表徵審判；壇的槓也是「用皂莢木為壇做杠，用銅包裹，表徵人性經過審判合格，才能見證基督」。KC 讀得更進一步：木頭說到祂是人，而包在外面的銅「是從那些經過神審判卻沒有被燒毀的香爐來的（民16:37-38）」——所以壇沒有被燒毀，「祂的復活就是神公義的證明」。
- title: 銅
  path: link_folder/主題/銅.md
  summary: 出27:2-6、10-19 銅在本章的用途：包壇、壇上一切器具、銅網、銅環、包槓、院子柱子的六十個帶卯座、以及帳幕與院子一切的橛子。CT 註明包銅的實務理由：「祭壇的骨架是木料，外面則包上銅，可以耐火。」GT 引丁良才同記：「神吩咐摩西用銅包壇，免得壇上的火燒壞了壇，因此這壇稱為銅壇（出38:30；39:39）。」BH：銅「是耐用而堅固的金屬，在聖經象徵中常代表審判與堅忍」，並連到民21:9 的銅蛇「預表基督被掛（約3:14-15）」；銅與至聖所所用的金相對，「標誌著從審判到神同在的轉換」。
  relation: 本章是全書用銅最集中的一章，而它的位置說明了原因：銅在外面。人從東門進來，先遇見的是銅——銅壇、銅器、銅座、銅橛子；越往裡走，銅換成銀（院子柱頂的銀杆銀鉤），再換成金（聖所與至聖所）。CT 把這條線讀成一句話：「銅表徵審判」，而信徒「越多經歷神審判的煉淨，就越多具有神性」。KC 則把銅讀成已經過火的公義：香爐從可拉一黨的火場裡撿出來，「那公義經過了審判而沒有被燒滅」。
- title: 銀子
  path: link_folder/主題/銀子.md
  summary: 出27:10、11、17 院子四圍柱子上的鉤子與連絡柱子的杆子都要用銀子做——本章的銀不在根基，而在上頭。CT 把兩種金屬分開讀：「『銅』表徵審判；『銀』表徵救贖……『柱子上的鉤子和杆子』鉤子是為勾住帷子，杆子是為聯結柱子，這兩樣都是銀做的，表徵維繫並聯結信徒生活見證的力量，來自基督的救贖。」CT 的話中之光另加一句：「掛帷子的鉤是用銀做的，而銀預表救贖；必須是蒙恩得救的人才能做分別為聖的見證。」GT 引丁良才補上經文未載的一項：「柱頂是用銀子包的（出38:17）。」BH：銀「在聖經中常象徵救贖與贖罪」，銀杆銀鉤「或許表明神救贖的工作把整個結構維繫在一起」。
  relation: 銀在會幕裡的位置在本章換了一層。出26 的銀在最底下——九十六個銀座是豎板的根基；出27 的銀在最上頭——院子柱子的鉤子、杆子與柱頂。底下的是銅座（審判），上頭的是銀（救贖）。KC 把這組上下讀成信徒的兩件事：「銅指出，藉著行公義、行神眼中看為正的事，那細麻才在行事為人中顯出來。銀指明，在這託付裡，信徒是被那為他們與神和好所付的代價聯結在一起的。」CT 的話中之光則落在彼此相連上：「用銀杆把各柱相連，使柱子站穩……以色列人都是一家人，彼此聯絡，一同事奉神。」
- title: 撚的細麻
  path: link_folder/原文/撚的細麻.md
  summary: 出27:9、16、18 院子四面的帷子與東面的門簾都用撚的細麻。GT 引丁良才把細麻的意思與院子的功能扣在一起：「『細麻』預表義行（啟19:8），白細麻帷子表明人靠自己進到神面前所必須有的義行，人只能從門進去（16），門預表基督（約10:9）。」GT《中文聖經註釋》記其規格：「這是用細麻撚織的。南北兩邊的帷子均長一百肘，高五肘；各邊均有二十根柱子。」BH：細麻「是象徵潔淨與公義的材料，常用於祭司的衣袍」，其耐用與透氣「也適合嚴酷的沙漠氣候，反映神為百姓所需的預備」。
  relation: 細麻在本章的位置與前一章相反。出26 的細麻在裡面——內層幕幔與內幔上繡著基路伯，只有祭司藉著燈臺的光才看得見；出27 的細麻在最外面——院子的白帷子是整座會幕從曠野遠望唯一看得見的東西。KC 正是從這一點把它讀成三層：地、主耶穌、以及信徒——「人也必須在他身上看見那細麻」；而柱子「撐起細麻，自己卻不被看見」。CT 的話中之光落在做工的態度上：「撚細麻的時候，要細心、忠心、耐心，否則就撚得不美。」
- title: 藍色、紫色、朱紅色線
  path: link_folder/主題/藍色、紫色、朱紅色線.md
  summary: 出27:16 院子的門簾要拿藍色、紫色、朱紅色線和撚的細麻，用繡花的手工織成——這是本章唯一用到三色線的地方，其餘的帷子只用白細麻。CT 指出這道對比正是重點：門簾「與至聖所的門簾一樣（參出26:36），是用彩色線繡花手工織成有細縫的簾子」，而「門簾分別門內和門外，卻又容易進入，表徵福音」；他並把顏色一一對應成福音的內容：「流血的救贖（朱紅色線）、永生的賞賜（藍色）、成聖的追求（細麻）和作王的應許（紫色）」。GT 引丁良才：「這簾子和聖所簾子的材料做法一樣（出26:36-37）。」BH：藍「常代表天或神性」，紫「表明王權與財富」，朱紅「可象徵犧牲或罪」，三色合起來「反映以色列敬拜核心的神性、王權與獻祭制度」。
  relation: 三色線在本章只出現一次，而位置很關鍵——整圈院子都是白的，唯獨東面那道二十肘寬的門是彩色的。KC 讀出的正是這個對比：入口「由一幅沒有基路伯的彩色簾子構成。它代表對人的邀請，要人親近神。只有一道門」。白帷子是界線，彩門是邀請；而 CT 把彩色讀成福音的內容——人從遠處看見的是一片白（義行的要求），走近了才看見那道彩色的門（進去的方法）。
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出27:8 「要用板做壇，壇是空的，都照著在山上指示你的樣式做。」CT：「意指祭壇和一切相關器具，都要嚴格遵照神在西乃山上所指示的樣式，不得擅自更改。」GT 引丁良才在此處只回指前一章的註（出26:30），把兩處連成同一條原則。BH：這句話「強調這些指示的神聖來源」，而摩西在西乃山領受律法與會幕的詳細藍圖，「凸顯敬拜必須照著神所啟示的旨意進行」，也連到聖經一貫的主題——神向祂所揀選的領袖啟示，如挪亞造方舟、大衛與所羅門造聖殿。
  relation: 「照山上的樣式」在出埃及記共出現四次（出25:9、40；26:30；27:8），本節是最後一次，也是位置最外的一次——前三次都在會幕本體與其中的器具，這一次則落在院子裡那座燒著火的銅壇上。從至聖所的約櫃到外院的祭壇，整條由內而外的線都在同一句話底下。而 GT《丁道爾》在本章指出這條線的方向本身就是設計：「離開核心越遠，材料就越不貴重、結構就越簡單」——連遞減的規則也是照樣式定的。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出27:9、19、21 本章把會幕的範圍向外推到院子——「你要做帳幕的院子」（v9）、「帳幕各樣用處的器具，並帳幕一切的橛子，和院子裡一切的橛子」（v19）、「在會幕中法櫃前的幔外」（v21）。GT《中文聖經註釋》為「整座聖幕」下了一個完整的界定：「整座聖幕並不單指那帳幕，也包含帳幕外的院圍，以及院圍內的院子用作殺牲獻祭的地方。在這院子內，主要的擺設是洗濯盆（出30:17-21）和祭壇。」它並注意到本章末節的用字：「這裏的會幕，原文所用的字與出33:7完全相同，而不同於本章19節所用的帳幕。」GT《精讀本》概括本章在全段中的位置：「到現在為止（25、26章）介紹了有關帳幕的實體，即聖所和至聖所裡的各種器具。從本章開始說明，會幕的院子裡擺設的器具。」
  relation: 本章是會幕由「屋子」擴成「園區」的一章。GT《丁道爾》引納皮爾指出這個次序本身就是設計：「經文對聖物的描述是自內而外的。首先形容的是位於帳幕至聖之處的約櫃和主室的燈臺，然後暫停向外擴展，描寫帳幕本身的結構，出到帳幕外面，經文繼續描述祭壇和安置祭壇的院子。離開核心越遠，材料就越不貴重、結構就越簡單。這象徵也很明顯。」KC 則從相反的方向讀同一件事——人是從外面進來的：門在東邊、是寬的、沒有基路伯，「它代表對人的邀請，要人親近神」。一條由內而外寫、由外而內走的路。
- title: 聖所
  path: link_folder/地點/聖所.md
  summary: 出27:21 「在會幕中法櫃前的幔外」——本章唯一一次提到聖所，是為了定位那盞燈。CT：「指燈檯的位置是在至聖所的外面，對著約櫃。」GT《中文聖經註釋》說得更完整：「這裏所指的就是幔子前的聖所。這聖所的北面有陳設餅的桌子，南面則放了七盞燈的金燈臺。」GT《精讀本》另指出進入的分層：以色列眾人可以進入外院，唯獨祭司可以進入聖所，大祭司可以進入至聖所（GT 引丁良才在16節同樣如此區分）。
  relation: 本章的重心在院子，但結尾兩節把讀者拉回聖所——因為那盞要「從晚上到早晨」點著的燈在那裡。這使本章同時架出了三層空間：院子（獻祭、眾人可到）、聖所（點燈、祭司事奉）、至聖所（幔內、法櫃）。KC 由此讀出一句對比：「當世界正是黑夜的時候，聖所裡有光。」而油要從院子外面由百姓送進來，光卻只在聖所裡亮著——供應的人與看見光的人並不是同一批。
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 出27:20-21 燈要常常點著，亞倫和他的兒子要在會幕中法櫃前的幔外、從晚上到早晨在耶和華面前經理這燈，這要作世世代代永遠的定例。CT 註明燈的位置：「指燈檯的位置是在至聖所的外面，對著約櫃」——燈在聖所裡，不在院子裡。GT《中文聖經註釋》同樣說「這裏所指的就是幔子前的聖所」。本章的另一半則處理院子：帷子把聖地圍起來，KC 說院子的入口「代表對人的邀請，要人親近神」，而門開在東邊——「東邊是罪人所去的那一邊」。
  relation: 本章把神的同在放進一組由外而內的層次裡：院子（眾人可到）、聖所（祭司可進）、至聖所（大祭司一年一次）。同在因此既是敞開的，也是有次序的——門是寬的、沒有基路伯，但門後的路一層比一層窄。而在最裡面那一層，KC 讀出一句很短的話：燈要「從晚上到早晨」點著，「那意味著，當世界正是黑夜的時候，聖所裡有光」。神的同在在本章不是一個抽象的宣告，而是一盞需要有人天天添油的燈。
- title: 至聖所
  path: link_folder/地點/至聖所.md
  summary: 出27:21 「在會幕中法櫃前的幔外」——本章唯一一次提到至聖所，是以「幔外」反過來定位那盞燈。CT：「指燈檯的位置是在至聖所的外面，對著約櫃。」GT《中文聖經註釋》同樣說「這裏所指的就是幔子前的聖所」。GT 引丁良才在16節把三層空間的進入權一次分清：「以色列眾人都可以進入外院，唯獨祭司可以進入聖所，大祭司可以進入至聖所」；GT《精讀本》在出26 也說過同一件事：至聖所「一年只能進一次」。
  relation: 本章的重心在最外的院子，卻在最後一節把座標拉回最裡面——燈的位置是靠「法櫃前的幔外」定出來的。這使出27 架出了完整的三層：院子（眾人可到、獻祭）、聖所（祭司事奉、點燈）、至聖所（幔內、法櫃）。三層的材質也順著同一條線遞減：院子用銅，帳幕的根基用銀，最裡面用金。GT《丁道爾》引納皮爾把這個方向講明：「離開核心越遠，材料就越不貴重、結構就越簡單。」
- title: 橛子與繩子的預表
  path: link_folder/神學/橛子與繩子的預表.md
  summary: 出27:19 「帳幕各樣用處的器具，並帳幕一切的橛子，和院子裡一切的橛子，都要用銅做」——這是橛子在出埃及記中第一次被吩咐製作。GT《中文聖經註釋》說明它的形制與用法：「橛子是用銅做的小樁，用為斜釘在地上，用繩索之類的東西串入或綁在橛子上，以拖牢院圍或帳幕之用的。」GT 引丁良才指出配置：「院子裡每柱子必有繩子和橛子使柱子穩固」，並認為帳幕的橛子「大概是罩棚上的橛子」。GT《丁道爾》指出這個意象活得很久：「橛子使帳幕立穩，今日大型帳幕或營帳的『幅帆』也是靠它固定。以賽亞書五十四章2節提到繩子和橛子，以色列初期的日常物件，千百年後仍在喻象中用到。」BH：橛子與繩子「確保這片聖地穩固」，而全部用銅則「象徵神與以色列之約的持久，以及獻祭制度的嚴肅」。
  relation: 出35 與出38 記的是橛子的奉獻與實際鑄造，出27:19 則是它第一次被吩咐——而它出現的位置很特別：在院子一段的最後、燈油之前，經文把最不起眼的零件與「帳幕各樣用處的器具」並列。CT 的話中之光正是抓住這個不起眼：橛子「必須隱藏而不表現自己（捶入地面以下），忍受十字架的打擊，以慈繩愛索聯繫眾信徒」；「銅橛被釘入地裡，表明我們是受世界的審判與定罪」；「埋得越深就越穩固，否則就不能用。我們不要露頭，而是要深埋……如果橛子一露頭，別人就會討厭，因為橛子露頭就會絆倒人」。全院最高的柱子與最深的橛子用的是同一種金屬。
- title: 土壇
  path: link_folder/神學/土壇.md
  summary: 出27:1-8 的銅壇與出20:24-25 的土壇／粗石壇之令並列時產生張力，GT 的三位註釋者給了三種處理。丁良才判定不相違：「『要用皂莢木做壇』——本句與二十24-25節沒有什麼不符」，理由是「『壇是空的』大概是用土或石頭填滿（參二十24-25）」。GT《丁道爾》採兩案並列：「前面命令建築的『土』或『粗石』祭壇（出二十24、25），大概只在某些固定地點使用。但也有學者則相信，這個木銅製成的架構可以裝上一定高度的泥土或粗石，來滿足約書所定的規條。」GT《中文聖經註釋》則認為衝突無法調和：「與約書的吩咐相違反卻是最大的問題。因此，我們認為這聖幕和其中大部分的器物，是在進住迦南後的產品」，並在8節重申「銅壇乃是定居迦南後的產物」。
  relation: 出20:24-26 只給了三條規定（用土、石不可鑿、上壇不可用臺階），出27 卻給了一座有尺寸、有材質、有配件的壇——兩章一併讀，土壇之令就成了衡量銅壇的尺規。丁良才的填土讀法還連帶推出一道坡：「有三個緣故證明這坡在壇的南邊」，而坡道而非臺階正是為了滿足出20:26；CT 記的「壇是空的」第二種解釋——基座「上面呈斜坡狀，免得祭司獻祭時上臺階而露出下體」——走的是同一條線。土壇的條例因此沒有在出27 被取消，而是變成一組必須交代的前提。
- title: 古代近東祭壇庇護
  path: link_folder/背景/古代近東祭壇庇護.md
  summary: 出27:2 壇的四角，四來源都提到它後來成為求庇之處。GT 引丁良才列出經文：「人若要避難，就抓住這壇的角（出21:14；王上1:50，2:28）」；GT《中文聖經註釋》：「這些角，原來的作用是給祭司抹血在其上的，其後卻含有護庇或逃罪的意義（參看王上1:50-53）」；GT《串珠》：「對於逃難的人，祭壇的角象徵神的保護，抓住角便得安全（王上1:50）」；GT《丁道爾》說得最完整：「作為聖地的祭壇是個『庇護所』，一個小型的『逃城』，求告的人抓住壇角，使自己成為歸給耶和華的活祭，在祂保護之下。」CT 同記：壇角「後來又成為護庇的象徵（參王上1:50）」。
  relation: 出21:13-14 講的是制度——為誤殺者設「一個地方」，卻明說蓄意殺人的「就是逃到我的壇那裡，也當捉去把他治死」；出27:2 講的則是那個「地方」的實物：壇上四個與壇接連一塊的角。兩章合看，庇護的界線很清楚——抓住的是真的壇角，但抓住並不等於免罪，仍要查明是誤殺還是謀殺。GT《丁道爾》把這個動作的意思說得很準：抓住壇角，「使自己成為歸給耶和華的活祭」——求庇的人是把自己交出去，不是躲起來。
- title: 古代近東祭壇
  path: link_folder/背景/古代近東祭壇.md
  summary: 出27:1-8 的銅壇在形制上與古代近東的祭壇有明顯共通處。GT《丁道爾》：「與大部分古代祭壇一樣，壇頂四隅也有四個角狀的突出物。這些壇角可能一度代表所獻祭牲的犄角」；論到銅網時他又說：「這壇和大部分古代祭壇一樣是空心的（8節）。」尺寸上則有一組可比的數據：GT《中文聖經註釋》指出這壇「比之以西結那理想聖殿的壇小得很多（見結43:13-17）」，而所羅門的壇「長寬各二十肘，高十肘」（王上8:64；代下4:1）；GT《丁道爾》換算為「它只有七英呎半見方，遠小於後來所羅門所建的銅壇，那壇有三十英呎見方，高十五英呎」；GT《精讀本》同記後來「換成了長9m，寬9m，高4.5m的更大的壇」。
  relation: 出20:24-26 的築壇條例是刻意與周邊做法區隔的——用土或未鑿的石頭、不可用臺階；出27 的銅壇則反過來顯出共通的一面：四角、中空、可搬運，都是古代祭壇常見的作法。兩者並不矛盾：形制可以相似，規矩卻不同。GT《丁道爾》也正是在這個對照裡指出，壇角在別處代表祭牲的犄角，在以色列則另有抹血與庇護的功能——同一個形狀，被賦予不同的用途。
- title: 金燈臺
  path: link_folder/主題/金燈臺.md
  summary: 出27:20-21 點燈的油與經理燈的條例。這盞燈是不是出25:31 的金燈臺，GT 內部並不一致：《啟導本》說「這燈可能就是指二十五31的金燈檯。會幕聖所內燈火通明，徹夜不熄」；《串珠》直接說「這燈就是金燈檯（25:31）」；《中文聖經註釋》也照此理解：「為使聖所中金燈臺的燈，能每晚都點，神吩咐摩西要叫以色列人奉獻清橄欖油。」GT《丁道爾》則保留：「經文沒有清楚說明這燈是否二十五章31節的金燈臺。驟然看來，它似乎遠為簡單，較像撒母耳在示羅照管的燈（撒上3:3）。但其至終的意義卻是一樣：分隔神臨在的幔子前面不可有片刻的黑暗。」GT 引丁良才另記一項猶太傳說：「燈檯幹子上的燈（出25:34）是晝夜常點著，其餘六個枝子上的燈是從晚上到早晨點著的。」
  relation: 出25 造燈臺、出26 定它在聖所南面的位置，出27 則第一次規定「燒什麼」與「誰來顧」——油要是搗成的清橄欖油，人要是亞倫和他的兒子，時間是從晚上到早晨，而且「作以色列人世世代代永遠的定例」。這條線到利24:2-4 再走一次，幾乎逐字重申。KC 從燈的時段讀出一句對比：「當世界正是黑夜的時候，聖所裡有光。」燈臺本身是金的、在最裡面，供油的人卻在最外面的院子外——光的來源與光的所在，隔著整座會幕。
