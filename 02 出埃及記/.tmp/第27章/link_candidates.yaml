  # === 本次維護新增（依 rawdata 覆蓋率重推）===
  - name: "銅壇與土壇之令的張力"
    type: "解經爭議"
    evidence: "出27:1-2 用皂莢木包銅造壇，與出20:24-25「你要為我築土壇……若為我築一座石壇，不可用鑿成的石頭」之間有沒有衝突，三家給了三種答案。CT 未直接處理，GT 引丁良才判定沒有衝突：「『要用皂莢木做壇』——本句與二十24-25節沒有什麼不符（參7-8注）」，並在7-8節說明理由：「『壇是空的』——大概是用土或石頭填滿（參二十24-25）」。GT《丁道爾》採折衷：「前面命令建築的『土』或『粗石』祭壇（出二十24、25），大概只在某些固定地點使用。但也有學者則相信，這個木銅製成的架構可以裝上一定高度的泥土或粗石，來滿足約書所定的規條。」GT《中文聖經註釋》則把它當成年代問題：「若這聖幕和其中的設備，是在西乃曠野製造的話，大概也不會造這銅壇，因為這是和二十24～25明顯相反的……與約書的吩咐相違反卻是最大的問題。因此，我們認為這聖幕和其中大部分的器物，是在進住迦南後的產品，而摩西在曠野時代，卻只有那簡單的會幕（卅三7～11）」；在8節重申「銅壇乃是定居迦南後的產物」"

  - name: "壇的圍腰板"
    type: "主題"
    evidence: "出27:5「把網安在壇四面的圍腰板以下」。CT 列出兩種功用說法：「(1)供祭司做踏腳板；(2)為裝飾並強固祭壇」，並說銅網就掛在圍腰板的下方；靈意「圍腰板加固祭壇；表徵十字架的能力，足以對付並除去一切罪惡、肉體和肉體的邪情私慾」。GT 引丁良才主張踏腳說：「這圍腰板就是祭司獻祭的時候所站的地方（詩二十六6）」；GT《中文聖經註釋》反對：「有些學者認為這是為祭司獻祭時踏腳之用的。但這銅壇既只有三肘（約四英尺半）之高，大概不必有踏腳板。故此，這圍腰板或為裝飾及強固壇身之用的」；GT《串珠》：「提到壇有圍腰板，其下有銅網，卻沒有很詳細的描述它們的作用及安放的方法，可能它們只作裝飾，或者是防止灰燼跌落到壇的下部」"
    surfaces:
      - phrase: "圍腰板"
        verses: [5]

  - name: "會幕器物由內而外的敘述次序"
    type: "神學"
    evidence: "出27:1 GT《丁道爾》引納皮爾指出出25-27 的敘述有一條明確的方向：「納皮爾指出經文對聖物的描述是自內而外的。首先形容的是位於帳幕至聖之處的約櫃和主室的燈臺，然後暫停向外擴展，描寫帳幕本身的結構，出到帳幕外面，經文繼續描述祭壇和安置祭壇的院子。離開核心越遠，材料就越不貴重、結構就越簡單。這象徵也很明顯。」這條線在材質上可以逐段驗證：至聖所與聖所用金，豎板與內幔柱的座用銀，院子的座、壇與橛子用銅。GT《精讀本》在同一章開頭也標出這個轉折：「到現在為止(25,26章)介紹了有關帳幕的實體，即聖所和至聖所裡的各種器具。從本章開始說明，會幕的院子裡擺設的器具。」"

  - name: "上壇的坡道"
    type: "背景"
    evidence: "出27:8「要用板做壇，壇是空的」。GT 引丁良才推論壇旁有土坡並指出其方位：「『壇是空的』——大概是用土或石頭填滿（參二十24-25），有土坡可以上到圍腰板處（5，參二十26，利九22，注意『下來』兩個字）。有三個緣故證明這坡在壇的南邊：（一）東邊是倒灰的地方（利一16）；（二）北邊是宰殺祭牲的地方（利一11）；（三）西邊有浴盆」。CT 同樣把「壇是空的」列出兩解，其中一解正與此有關：「(2)指放置祭壇的基座，基座的下面中空，上面呈斜坡狀，免得祭司獻祭時上臺階而露出下體（參二十26）」"

  - name: "撒瑪利亞抄本的院內袍服增句"
    type: "解經爭議"
    evidence: "出27:19 之後的異文。GT《中文聖經註釋》兩次記下同一件事：「撒瑪利亞抄本在19節之後，尚有如下字句：你要用藍色紫色朱紅色線，為在這聖院內崇拜事奉的人製造袍服。」馬索拉經文沒有這一句，本章也未記載院內事奉者的袍服，祭司聖衣要到出28章才出現。GT《中文聖經註釋》另在27:1 指出同章另一處抄本差異：「這壇的原文加了冠詞，而不像撒瑪利亞抄本和七十士譯本之『一壇』，藉示和三十1之燒香的壇有分別」"

  - name: "橛子與繩子的預表"
    type: "神學"
    evidence: "出27:19「帳幕各樣用處的器具，並帳幕一切的橛子，和院子裡一切的橛子，都要用銅做。」CT 的靈意與話中之光在本章給了橛子最完整的一段讀法：「橛子表徵背負教會重責的信徒，必須忍受十字架的打擊，隱藏而不表現自己（捶入地面以下），以慈繩愛索聯繫眾信徒」；「銅橛是要被釘進地的裡頭：地是表明世界；銅橛被釘入地裡，表明我們是受世界的審判與定罪」；「橛子是要釘入地裡頭，埋得越深就越穩固，否則就不能用。我們不要露頭，而是要深埋」。GT 引丁良才記其實務：「院子裡每柱子必有繩子和橛子使柱子穩固」；GT《中文聖經註釋》：「橛子是用銅做的小樁，用為斜釘在地上，用繩索之類的東西串入或綁在橛子上，以拖牢院圍或帳幕之用的」；GT《丁道爾》：「橛子使帳幕立穩，今日大型帳幕或營帳的『幅帆』也是靠它固定。以賽亞書五十四章2節提到繩子和橛子，以色列初期的日常物件，千百年後仍在喻象中用到。」已有條目「橛子與繩子的預表」（出35、出38 累積）"
    surfaces:
      - phrase: "橛子"
        verses: [19]

  - name: "土壇"
    type: "神學"
    evidence: "出27:1-8 銅壇的規格與出20:24-25 的土壇／粗石壇之令並列時產生張力，三家各有處理。GT 引丁良才：「本句與二十24-25節沒有什麼不符」，並在7-8節說「壇是空的，大概是用土或石頭填滿（參二十24-25）」；GT《丁道爾》：「前面命令建築的『土』或『粗石』祭壇（出二十24、25），大概只在某些固定地點使用」；GT《中文聖經註釋》：「二十24～25所講的壇，以色列人在曠野生活中，隨地都可以築成，並不必有個銅壇。銅壇乃是定居迦南後的產物。」已有條目「土壇」（出20 累積）"

  - name: "古代近東祭壇庇護"
    type: "背景"
    evidence: "出27:2 壇的四角。GT 引丁良才：「人若要避難，就抓住這壇的角（二十一14，王上一50，二28）」；GT《串珠》：「對於逃難的人，祭壇的角象徵神的保護，抓住角便得安全（王上1:50）」；GT《中文聖經註釋》：「這些角，原來的作用是給祭司抹血在其上的，其後卻含有護庇或逃罪的意義（參看王上一50～53）」；GT《丁道爾》：「作為聖地的祭壇是個『庇護所』，一個小型的『逃城』，求告的人抓住壇角，使自己成為歸給耶和華的活祭，在祂保護之下」；CT：壇角「後來又成為護庇的象徵（參王上一50）」。已有條目「古代近東祭壇庇護」（出21 累積）"

  - name: "古代近東祭壇"
    type: "背景"
    evidence: "出27:1-2 GT《丁道爾》把壇角放進古代祭壇的通例：「與大部分古代祭壇一樣，壇頂四隅也有四個角狀的突出物。這些壇角可能一度代表所獻祭牲的犄角」；並在銅網一節指出「這壇和大部分古代祭壇一樣是空心的（8節）」。GT《中文聖經註釋》與《精讀本》另以所羅門聖殿的壇（長寬各二十肘、高十肘，王上8:64；代下4:1）與以西結理想聖殿的壇（結43:13-17）作為尺寸的對照。已有條目「古代近東祭壇」（出20 累積）"

  - name: "金燈臺"
    type: "主題"
    evidence: "出27:20-21 點燈的油與經理燈的條例。GT《啟導本》：「『使燈常常點著』。這燈可能就是指二十五31的金燈檯。會幕聖所內燈火通明，徹夜不熄」；GT《串珠》：「這燈就是金燈檯（25:31），要時常點著，使聖所中常有亮光」；GT《中文聖經註釋》：「為使聖所中金燈臺的燈，能每晚都點，神吩咐摩西要叫以色列人奉獻清橄欖油。」GT《丁道爾》則對這個等同存疑：「經文沒有清楚說明這燈是否二十五章31節的金燈臺。驟然看來，它似乎遠為簡單，較像撒母耳在示羅照管的燈（撒上三3）。但其至終的意義卻是一樣：分隔神臨在的幔子前面不可有片刻的黑暗。」已有條目「金燈臺」（出25、26、37、利24、民4、民8 累積）"
    surfaces:
      - phrase: "這燈"
        verses: [21]
