book: 出埃及記
chapter: 36
updates:
- title: 五十個金鉤
  path: link_folder/主題/五十個金鉤.md
  summary: 出36:13 又做五十個金鉤，使幔子相連，這才成了一個帳幕。CT 說明用法：「『五十個金鉤』是為了把每組五幅幔子的相對，最末幅幔子邊緣的五十個扣環(參11~12節)用金鉤勾住，使兩組幔子相連在一起」；接上之後「每五幅幔子成一組，又將兩組幔子勾在一起，就成了一整幅的幔子」。CT 靈意：金表神性，五十個金鉤表徵神性的能力促成完美的聯結。BH：金在聖經中象徵純潔與貴重，反映神的聖潔；「五十」這個數目常與禧年和自由相連（利25:10），金鉤在實用上把幔子接起來，在象徵上則指向神設計中的合一與完整。
  relation: 本章首次記載金鉤的實際製作與使用。經文用「這才成了一個帳幕」為這道工序收尾——十幅幔子分兩組、各五幅相連，要到金鉤扣上才算一個整體。金鉤與罩棚所用的銅鉤（36:18）構成一組對照：內層用金（CT：金表神性），外層用銅（CT：銅表審判）。
- title: 五十個銅鉤
  path: link_folder/主題/五十個銅鉤.md
  summary: 出36:18 又做五十個銅鉤，使罩棚連成一個。罩棚為山羊毛織成（v14-17），以銅鉤連結（非金鉤）。銅在會幕中表徵審判，銅鉤連結罩棚表徵基督擔當人的罪而受神審判，使信徒得以連結在祂裡面。
  relation: 本章首次記載銅鉤的實際製作；與內層幕幔的金鉤形成對比——金鉤（神性聯結）用於內層、銅鉤（審判聯結）用於罩棚，層層預表基督工作的不同面向。
- title: 五根包金柱子（門簾柱）
  path: link_folder/主題/五根包金柱子（門簾柱）.md
  summary: 出36:38 為簾子做五根柱子和柱子上的鉤子，用金子把柱頂和柱子上的杆子包裹，柱子有五個帶卯的銅座。CT 指出柱子「與會幕內部掛幔子的柱子一樣，是用皂莢木包金作的」，也沒有尺寸記載，而「每根柱子套在每個銅座上，即一柱子一銅座；『是銅的』與其他的銀製基座不同，是用銅鑄造而成的」。GT 丁良才補上一個出26 沒說的細節：「聖書裡從前沒有提到這些柱頂和杆子（二十六37）……這些柱頂和杆子是叫柱子相連，和外院的杆子一樣（參二十七10）。」BH：銅在聖經中常與審判和力量相連，用在入口的座上，指出親近神所需要的根基是義的；而金與銅並用，反映神的聖潔與公義兩面。
  relation: 本章首次記載門簾柱子的實際製作，並補上了出26 未提及的柱頂和杆子。CT 在靈意上讀為：「五根柱子表徵信徒有責任為基督作見證；柱子包金，其上的鉤子是金鉤，為懸掛門簾，表徵信徒越多具有神性，就越能為基督作見證」；而銅座則表徵「信徒越多經歷神審判的煉淨，就越能為基督作見證」。
- title: 亞何利亞伯（Oholiab）
  path: link_folder/人物/亞何利亞伯（Oholiab）.md
  summary: 出36:1-2 亞何利亞伯與比撒列同被摩西召來，帶領一切心裡受感前來做工的智慧人正式開工。CT：亞何利亞伯是比撒列的副手，協助管理建造會幕的事工（出35:34-35），名字意為「父親的帳幕」。
  relation: 本章是亞何利亞伯由「被提名」（出31:6）和「被公告」（出35:34）進入「實際同工帶領」的階段；他與比撒列的配搭成為全體工匠的領導核心。
- title: 內幔（隔聖所至聖所的幔子）
  path: link_folder/主題/內幔（隔聖所至聖所的幔子）.md
  summary: 出36:35-36 用藍色、紫色、朱紅色線和撚的細麻織幔子，以巧匠的手工繡上基路伯；為幔子做四根皂莢木柱子用金包裹，柱子上有金鉤，鑄四個帶卯的銀座。CT 指出此處的幔子「與幕幔有別，是聖所與至聖所之間的幔子，惟無尺寸的記載」，靈意上表徵基督的身體（來10:20）。GT《聖經精讀本》：「為了維護神的榮耀和聖潔,所以用幔子擋住至聖所……因此,若有人膽敢侵犯這幔子就難免一死。唯獨神指定的人,在指定的時間用指定的禮物用指定的方法才能進入幔子內。但在這些所有的條件中,最必需的是祭物的血……但到了新約時代,這種血祭,用耶穌基督在十字架上一次性地流出寶血最終得以完全;基督作為中保,不顧生命危險進入這幅幔子內,而且用死亡撕裂了它。」KC：這幔子在希伯來書被稱作「第二幅幔子」，其後就是「稱為至聖所的帳幕」（來9:3）；大祭司一年只能進去一次，而且不能不帶血；如今我們卻可以坦然無懼地進入——神自己把路開了，祂從上頭、也就是從祂那一邊，把幔子裂為兩半（太27:51）。
  relation: 本章首次記載內幔的實際製作。四根柱子立於銀座（CT：銀座表徵以救贖為根基），金鉤懸掛幔子——這道幔子把神與人隔開，而基督的身體正是為此被撕裂。CT 在話中之光把兩件事接在一起：「主斷氣的那一剎間，聖殿裡發生了一件事，就是殿裡的幔子，從上到下裂為兩半。希伯來書告訴我們，這幔子即指主的身體。主如果不死，幔子便不會裂開。」
- title: 十一幅山羊毛幔子（罩棚）
  path: link_folder/主題/十一幅山羊毛幔子（罩棚）.md
  summary: 出36:14-18 用山羊毛織十一幅幔子作為帳幕以上的罩棚；每幅長三十肘寬四肘；五幅連成一幅、六幅連成一幅；末幅邊上各做五十個鈕扣，用五十個銅鉤使罩棚連成一個。CT 註明山羊毛的顏色是黑色（參歌1:5），並算出罩棚「三十肘乘四十四肘，比幕幔的二十八肘乘四十肘，長度多兩肘，總寬度多四肘」。GT《聖經精讀本》：第二幅幔子用山羊毛織成，為作罩住第一幅幔子，所以比它大（26:7-13）。KC：基督的榮耀以及教會對這榮耀的彰顯，只有進入聖所的人——就是祭司——才看得見，世界什麼也看不見；山羊毛的幔子祭司在裡面看不見、外面的百姓也看不見，但祭司知道它在那裡，它講的是與世界分別。BH：山羊毛在古代近東是常見的帳篷材料，因為它有防水的特性，這正合一個遊牧民族的實際需要。
  relation: 本章是罩棚由「設計規格」（出26:7-13）進入「實際織造」的執行記錄。十一幅比內層十幅多出一幅，且改用銅鉤而非金鉤——CT 解銅表審判，罩棚表徵基督站在人的地位上擔罪。KC 則把這一層與下一層（染紅的公羊皮）讀成互相補足的一對：分別（山羊毛）之後必須繼之以奉獻（公羊皮），兩者都是必需的，好使神的家能達到它的目的。
- title: 十幅幔子（內層幕幔）
  path: link_folder/主題/十幅幔子（內層幕幔）.md
  summary: 出36:8-13 用撚的細麻和藍色、紫色、朱紅色線製造十幅幔子，用巧匠的手工繡上基路伯；每幅長二十八肘寬四肘；五幅相連、另五幅相連；末幅邊上做五十個藍色鈕扣，兩兩相對，用五十個金鉤使幔子相連成一個帳幕。CT 靈意：十表徵人的完全；幔子表徵耶穌人性的美麗；細麻表潔白和聖潔（啟19:8）；藍色線表屬天（出24:10）；紫色線表君尊；朱紅色線表流血犧牲；基路伯表彰顯神的榮耀；巧匠的手工表聖靈的工作。KC：這幾幅彩色幔子被稱作「帳幕」，彷彿它就是神真正的居所（雖然這名稱其實適用於整座建築）；它們以一種特別的方式表出主耶穌榮耀的多重面向，每一種顏色代表祂榮耀的一個側面——神本性一切的豐盛，都有形有體地居住在祂裡面（西1:19；2:9）。BH：十在聖經中常表完全，指向帳幕建造所要求的周全與精確。
  relation: 本章是十幅幔子由「設計規格」（出26:1-6）進入「實際織造」的執行記錄。CT 在第8節的話中之光提醒這件事在當時的分量：「摩西那時代，織布（紡線與織布）要用很多的時間。能有兩三件以上衣服的人就算是富有的了。織成夠會幕用的布，更是艱巨的工程。如果不是百姓齊心協力，就不能建成會幕。」而和合本「這幔子是比撒列……製造的」中的主詞，CT 的〔原文字義〕註明原文並沒有這個字。
- title: 四根包金柱子（內幔柱）
  path: link_folder/主題/四根包金柱子（內幔柱）.md
  summary: 出36:36 為幔子做四根皂莢木柱子，用金包裹，柱子上有金鉤，又為柱子鑄了四個帶卯的銀座。CT 說明構造：柱子「是用皂莢木包金作的，用於懸掛會幕內部的幔子，也無尺寸的記載」，金鉤在柱子頂端，而「每根柱子套在每個銀座上，即一柱子一銀座」。CT 靈意：四根柱子表徵四福音書所描述基督的四種特性——君王、奴僕、人子和神子；金包皂莢木表徵祂具有神人二性；金鉤為懸掛幔子，表徵基督的身體出於神的預備（來10:5）；銀座則表徵基督道成肉身是以完成救贖大工為根本立足點。BH：皂莢木耐久抗腐，象徵神之約的持久；「四」在聖經中常表普世或完全；金覆於木，可視為基督神人二性的預表；而銀在聖經中常象徵救贖（出30:11-16）。
  relation: 本章首次記載內幔柱子的實際製作。它與門簾的五根柱子形成一組對照：內幔柱立於銀座、門簾柱立於銅座；CT 解為救贖（銀）與審判（銅）兩種根基，對應親近神的不同層次。
- title: 基路伯（施恩座）
  path: link_folder/主題/基路伯（施恩座）.md
  summary: 出36:8、35 十幅幔子和內幔上均以巧匠的手工繡上基路伯。CT 在第35節給了較完整的說明：「『基路伯』是一種有長翅翼的活物，與撒拉弗相似的特別使者(參創三24；王上六23~28；結九3)，意即『那些被緊握著的』。聖經特別稱呼他們是『榮耀的基路伯』(來九5)，大概是因為他們特別與神相近，神的榮耀照射在他們身上，使他們返照而成為神榮耀的象徵。」CT 靈意：巧匠的手工表徵聖靈的工作；繡表徵受苦的管教；基路伯表徵彰顯神的榮耀。BH：基路伯是常與神的同在相連的天使性活物——創3:24 他們把守通往生命樹的道路，結10章 他們是神寶座車輦的一部分；牠們被繡在幔子上，象徵神寶座之所在的屬天實際，使帳幕成為神同在的縮影。
  relation: 本章記載基路伯繡於幔子上的實際製作——不只施恩座上有錘出的基路伯（出37:7-9），最內層的幕幔和聖所與至聖所之間的內幔上也都繡有基路伯。BH 指出內幔上的基路伯呼應伊甸園口把守道路的基路伯（創3:24）與約櫃上的基路伯（出25:18-22），標示出因罪而有的隔絕；而這道隔絕在基督受死、殿裡的幔子裂開時被除去（太27:51）。
- title: 奉獻過剩與節制
  path: link_folder/神學/奉獻過剩與節制.md
  summary: 出36:5-7 工匠停下手上的活來對摩西說「百姓為耶和華吩咐使用之工所拿來的，富富有餘」，摩西傳命全營宣告「無論男女，不必再為聖所拿什麼禮物來」。CT 的〔原文字義〕給「富富」為「許多，增多」、「攔住」為「限制，遏制，停止」。GT《串珠聖經註釋》：「百姓的奉獻遠超過所需要的，以至摩西要阻止百姓繼續奉獻。」GT 丁良才把原因追回前兩章：「這是出奇的禁令，無非是因為百姓蒙了赦免（三十四6），有感恩的心（參路七47）。」GT《聖經精讀本》指出這些材料本是出埃及時所得（12:35,36），「但是這些東西在曠野生活中都是有用的……說明若不是出於自願是不可能做到的」。BH 指出這種「攔阻」在聖經中僅見；KC：「祂若看見所獻的已經夠了，就會讓你知道。」
  relation: 本章把「奉獻」與「節制」放在同一段裡，而且兩邊都不是妥協。CT 一面說「在正常的情形之下，神的工作絕不會因為缺少物質的配合，而受到限制的」，一面又說「當『富富有餘』之時，就應『攔住百姓不再拿禮物來』……這個原則適用於個人，也適用於教會」。攔阻之所以出現在這裡，不是因為百姓獻錯了，而是因為工程有它的度量——第7節說得很清楚：「他們所有的材料夠做一切當做的物，而且有餘。」GT《丁道爾聖經註釋》從反面補了一句很重的話：拖延未獻的人「發現神這時已經用不著他們了……神的工作已經完結，他們卻將自己摒諸門外、無分參與」。
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出36:1 都要照耶和華所吩咐的做工。CT：所有事奉神的人都要遵照神的旨意行事，並不是自己想要做甚麼就做甚麼；要做神的聖工必須是照神所吩咐的作工，不能摻有半點自己的意思在裡面。KC：沒有一個細節是不重要的；每一次重述都在加強前面已說過的話，並指明它的確定（腓3:1）；神在山上怎樣指示，就怎樣做成——用那些材料、照那個形狀。BH：這建造並未交給人的創意，而是要照著神在西乃山上給摩西的藍圖（出25:9）；這種順服是聖經反覆出現的主題。
  relation: 本章是「山上的樣式」由啟示進入執行的第一章——全章每一細節（幔子尺寸、鈕扣數目、鉤子材質、板數與座數）都嚴格複述出26章的規格，KC 指出：知道一件事該發生，與去做它、並照所吩咐的去做，是兩回事。
- title: 帳幕門簾
  path: link_folder/主題/帳幕門簾.md
  summary: 出36:37-38 拿藍色、紫色、朱紅色線和撚的細麻，用繡花的手工織帳幕的門簾；又為簾子做五根柱子和柱子上的鉤子，用金子把柱頂和柱子上的杆子包裹，柱子有五個帶卯的銅座。CT 指出門簾與內幔的織法不同：「幔子是織成密實的布幔，而門簾是刺繡成有細縫的簾子」。GT 丁良才注意到本章多說了一件出26 沒說的事：「聖書裡從前沒有提到這些柱頂和杆子（二十六37），會幕第二個講法圖（二十六1），也沒有畫上這些杆子，這些柱頂和杆子是叫柱子相連，和外院的杆子一樣（參二十七10）。」KC：入口處也掛了一道簾子，簾子後面就是希伯來書作者所稱「頭一層帳幕」（來9:2），其中有燈臺、桌子和陳設餅，這一層叫作聖所，祭司天天進去行拜神的禮。
  relation: 本章首次記載門簾的實際製作，並補上了出26 沒有提到的柱頂與杆子。CT 的靈意讀法把門簾讀成「基督是門」（約10:7），五根柱子表徵信徒有責任為基督作見證；而門簾的柱子立於銅座、內幔的柱子立於銀座，CT 解為「信徒越多經歷神審判的煉淨，就越能為基督作見證」。BH 也指出銅在聖經中常與審判和力量相連，這種金與銅的並用，反映神的聖潔與公義兩面。
- title: 帶卯的銅座（院子柱子座）
  path: link_folder/主題/帶卯的銅座（院子柱子座）.md
  summary: 出36:38 帳幕門簾的五根柱子有五個帶卯的座，是銅的。CT：門簾柱子用銅座（非銀座），與內幔柱子的銀座不同。銅在會幕中表徵審判；門簾柱立於銅座，表徵進入聖所必須經過神審判的煉淨。
  relation: 本章首次記載門簾柱銅座的實際鑄造；銅座與銀座的對比貫穿會幕——內幔柱立於銀座（救贖根基）、門簾柱立於銅座（審判煉淨），反映親近神的不同層次。
- title: 拐角板（雙板）
  path: link_folder/主題/拐角板（雙板）.md
  summary: 出36:28-29 帳幕後面的拐角做板兩塊，板的下半截是雙的、上半截是整的，直到第一個環子；在帳幕的兩個拐角上都是這樣做。CT 解釋做法：「『拐角』指與南面和北面相接的兩頭各做一個轉角板，彼此呈直角相接」，而「轉角板下半截要分開，上半截要合在一起」，並「用直角狀環子箍在一起使成整塊」。GT《聖經精讀本》：第一個環子指套在連接豎板的閂上的環。BH：拐角在古代近東建築中常被視為力量的所在；「從下到上連在一起」並「套進一個環子」顯出結構的整全與穩固。
  relation: 本章首次記載拐角板的實際製作。CT 在靈意上把這個構造讀成兩層：「拐角處的雙板是為著加固，表徵轉彎接連處更須加倍的扶持」；而「板的下半截是雙的，上半截是整的」則「表徵行動要彼此適應，心靈卻是一的」，並解那個環子——「木板表信徒，環子表聖靈或愛心，眾信徒乃是在聖靈裡以愛相連」。加上西面六塊，拐角兩塊使西面共八塊板、十六個銀座（36:30）。
- title: 撚的細麻
  path: link_folder/原文/撚的細麻.md
  summary: 出36:8、35、37 十幅幔子、內幔、門簾均用撚的細麻製造。CT 的〔原文字義〕給「撚的」為「搓捻而成的，扭結編織而成的」，並解「『撚的細麻』指用手撚的細麻線織成的布幔」；靈意上「細麻表徵潔白和聖潔（啟19:8）」。BH：細麻是昂貴而華貴的材料，顯出帳幕的神聖與親近神所當有的敬畏；細麻在聖經中常與純潔、公義相連（啟19:8），這種材質的選用強調了到神面前所要求的聖潔。
  relation: 本章記載撚的細麻在三種織物（內層幕幔、內幔、門簾）中的實際使用——細麻的潔白貫穿整個會幕的紡織品。CT 在第8節的話中之光把它落到人身上：「細麻意味著純潔、聖潔。這表示聖徒要以清淨的面貌來到神面前；世上最醜陋和骯髒的就是罪。即使是優秀的人，擁有低俗的心就會成為低俗的人。」
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出36:8-38 全章記載帳幕的實際建造：十幅幔子（v8-13）、十一幅山羊毛罩棚（v14-18）、染紅公羊皮蓋與海狗皮頂蓋（v19）、四十八塊皂莢木豎板與九十六個銀座（v20-30）、十五根包金閂（v31-34）、內幔與四根柱子（v35-36）、門簾與五根柱子（v37-38）。GT《串珠聖經註釋》為全章下的標題是「建造會幕的架構」。KC 注意到一個次序上的差別：出25 神給摩西的描述裡，約櫃排在最前面，因為它對神最重要；實際建造時，先出現的卻是房子本身——信徒要學的第一件屬靈功課，是認識教會是什麼。BH：聖所是神在祂百姓中間的居所，是耶路撒冷聖殿的前身，象徵神願意與人同住（約1:14）。
  relation: 本章是會幕由「山上的樣式」（出25-31）和「材料奉獻」（出35）進入「實體建造」的關鍵章節。GT《聖經精讀本》從反面點出這件事的分量：「異教的神殿是根據人類的設計自行建造的,但是萬物的主權者神,把自己將臨在的地方詳細地啟示給自己的百姓,從而排除了一切世俗的因素。」BH 另補上一個很具體的背景：皂莢木原產於西乃一帶，正是以色列人安營之地——神用當地生長的木頭，為自己在當地立起一座可拆可搬的居所。
- title: 染紅的公羊皮蓋子
  path: link_folder/主題/染紅的公羊皮蓋子.md
  summary: 出36:19 並用染紅的公羊皮做罩棚的蓋。CT 指出這是第四層覆蓋中的第三層，且公羊皮和海狗皮「比織造的細麻幕幔和山羊毛織成的罩棚幔子堅實耐用，可以保護裡面兩層幔子，不受風吹、日曬、雨淋的侵蝕」。KC：這一層祭司在裡面看不見、外面的百姓也看不見，但祭司知道它在那裡；它所講的完全是向神的奉獻，是山羊毛那一層的對應面——一邊是分別，另一邊必須繼之以向神的奉獻，兩者互相補足，而且都是必需的，好使神的家能達到它的目的，就是神可以住在其中。BH：公羊是貴重的牲畜，常用於獻祭，象徵代替與贖罪；染紅多半象徵血，指向獻祭制度，最終指向基督的血（來9:22）。
  relation: 本章首次記載染紅公羊皮蓋的實際製作。CT 在靈意上讀為「耶穌為人擔罪而流血捨命」；而 KC 把它與山羊毛罩棚配成一對——分別與奉獻缺一不可。這一層與最外的海狗皮同樣沒有尺寸記載，CT 推測「相信最低限度約相當於罩棚的尺寸，或者更寬更長」。
- title: 比撒列和亞何利亞伯的配搭
  path: link_folder/神學/比撒列和亞何利亞伯的配搭.md
  summary: 出36:1-2 兩個名字第一次以「一同」的形式出現在動工現場：摩西把一切受感前來做工的人「和比撒列並亞何利亞伯一同召來」。CT 的〔原文字義〕：「比撒列」在神的庇蔭之下、「亞何利亞伯」父親的帳幕；CT 並分出三層人——比撒列「是負總責的工頭」、亞何利亞伯「是比撒列的副手」、「一切心裡有智慧的」指一切工匠。BH 指出兩人分屬猶大支派與但支派，並列代表各支派在這項工作上的合一（林前12:4-11）。GT《聖經精讀本》在第2節列出入選的兩個條件：「①蒙神賜智慧的人;②自覺地想要作主的工」，並在第5節指出兩人「認為自己現在所做的工作是耶和華吩咐的,這意味著他們已經認可摩西是傳達神話語的中保」。
  relation: 本章是這組配搭由「名單」變成「現場」的一刻。CT 在第2節的話中之光把重量放在「一同」上：「這表示神的工人需要配備，需要同心，在恩賜上還彼此服事，彼此配搭，同心合意，建造神的會幕——教會(彼前四10)。」而本章從第10節起主詞忽然轉成單數的「他」，CT 提出的三種解法（指摩西、指比撒列、指各個小工頭）正好對應他所分出的三層人——這個文本上的模糊，本身就是配搭的痕跡。KC 則指出摩西在此是主耶穌的預表：為著建造神的家，主賜下恩賜（弗4:11-12），而恩賜是奉祂的命令去做工的。
- title: 比撒列（Bezalel）
  path: link_folder/人物/比撒列（Bezalel）.md
  summary: 出36:1-2,8 摩西正式召集比撒列和亞何利亞伯及一切心裡有智慧的工匠開工；比撒列親手製造十幅幔子（v8），以巧匠的手工繡上基路伯。CT：比撒列是負總責的工頭（出35:30-33），名字意為「在神的庇蔭之下」。KC：摩西在此是主耶穌的一幅圖畫——為著建造教會，主耶穌賜下了恩賜（弗4:11-12）。
  relation: 本章是比撒列由「被提名選召」（出31、35章）進入「實際帶領建造」的轉折點；他親手製作最內層的幕幔，並統籌全體工匠照神所吩咐的施工。
- title: 海狗皮頂蓋
  path: link_folder/主題/海狗皮頂蓋.md
  summary: 出36:19 再用海狗皮做一層罩棚上的頂蓋。CT 指出這是第四層，且「海狗皮的顏色沒有記載，或者可能屬橘色或褐色」，並註明公羊皮和海狗皮「比織造的細麻幕幔和山羊毛織成的罩棚幔子堅實耐用，可以保護裡面兩層幔子，不受風吹、日曬、雨淋的侵蝕」。KC：海狗皮這一層是百姓看得見的，它不美觀，卻有用——它保護帳幕免受暑熱、風暴與雨水；對世界而言，神的居所沒有什麼吸引人的地方。BH：這層皮革（英譯或作「海牛皮」、「獾皮」）是額外的保護層，使帳幕在曠野的行程中得以耐久；它也可看作基督的預表——祂遮蓋並保護屬祂的人，作他們的避難所（詩91:4）。
  relation: 本章首次記載海狗皮頂蓋的實際製作。作為最外層，它決定了會幕從外面看起來的樣子——CT 由此帶出一組很強的對比：「會幕的最頂層由於是用海狗皮蓋的，所以從外表來看，會幕顯得很簡陋。但是進入會幕門之後，展現在人們眼前的是精金包裹的牆，最底層的蓋子是用撚的細麻和藍色紫色朱紅色線製造的幔子，其美麗無法用言語來表達……即就像會幕重視的不是外表，而是裡面一樣，教會也要重視裡面的華美。」CT 在靈意上把它讀成「在地上做人，並無佳形美容，卻堅固耐苦，祂的人性足能保護信徒，不受撒但和世界的侵害」。
- title: 甘心樂意的奉獻
  path: link_folder/神學/甘心樂意的奉獻.md
  summary: '出36:3-7 百姓每早晨還把甘心獻的禮物拿來，以致工匠們「各都離開他所做的工」來對摩西說：「百姓為耶和華吩咐使用之工所拿來的，富富有餘」；摩西傳命在全營中宣告「無論男女，不必再為聖所拿什麼禮物來」，這樣才攔住百姓不再拿禮物來。GT《聖經精讀本》：「甘心獻的禮物: 表示百姓奉獻了神所喜悅的禮物。他們的行為不是強迫性的,而是甘心樂意事奉神。」CT：「每早晨」表明是繼續的奉獻，不是一陣熱心過去了就停止；教會缺乏之際理當鼓勵奉獻，但富富有餘之時就應攔住，「只要有衣有食，就當知足」（提前6:8）。GT《丁道爾聖經註釋》：神子民領受了救恩和赦罪之愛，這是典型的回應；捨不得財寶而拖延未獻的人，發現神這時已經用不著他們了。KC：這種慷慨背後的祕訣是「他們先把自己獻給主」（林後8:5）；「捐得樂意的人是神所喜愛的」（林後9:7）；祂若看見所獻的已經夠了，就會讓你知道。BH：「每早晨」一語強調的是規律與恆常，如同神的憐憫每早晨都是新的（哀3:22-23）。'
  relation: 本章是「甘心樂意」的高潮——奉獻從出35 的熱烈響應發展到「富富有餘、必須停止」的程度。GT 丁良才把爆發力的來源追回前兩章：「這是出奇的禁令，無非是因為百姓蒙了赦免（三十四6），有感恩的心（參路七47）。」BH 指出這一幕在聖經中僅見：極少有百姓的慷慨超過了實際需要的例子。CT 在話中之光描摹了那個場面：「『每早晨』表明是繼續的奉獻……也可能是奉獻的人多，一時收不了，就分別支派宗族，排長隊奉納。」
- title: 皂莢木
  path: link_folder/原文/皂莢木.md
  summary: 出36:20、31、36 豎板、閂、內幔柱子均用皂莢木製作。CT 說明它的材質：「『皂莢木』是西乃半島所產的一種木材，材質堅硬，不易腐朽，用來製作支撐的木板和各種傢俱，是上乘的木料」。BH：選用皂莢木是因它耐久、抗腐，最適合嚴酷的沙漠環境；這種木材原產於西乃一帶，正是以色列人安營之處，它也象徵不朽與純潔。KC：每一塊板都出於同一種材料。
  relation: 本章記載皂莢木在豎板、閂、柱子三類結構件中的實際使用——它是會幕骨架唯一用到的木材。CT 在話中之光把它讀成人的天然本相：「皂莢木堅硬帶刺，用處不大。照著我們人的本性，本來對於神沒有多大用處。」以及「皂莢木是外表無可看性，粗糙的樹。但神卻用它來做建造會幕的木材，這說明神的恩典屬於謙卑的人。『神阻擋驕傲的人，賜恩給謙卑的人』(彼前五5)。」而本章的做法是：皂莢木全部包上金子。
- title: 皂莢木豎板
  path: link_folder/主題/皂莢木豎板.md
  summary: 出36:20-30 用皂莢木做帳幕的豎板，每塊長十肘寬一肘半，有兩榫相對；南面二十塊、北面二十塊、西面六塊加拐角兩塊，共四十八塊板配九十六個帶卯銀座。GT《串珠聖經註釋》為「豎板」下的定義是：支撐會幕框架的木板。GT《聖經精讀本》給出尺寸與統計：「這板的高度是4.5m,寬是67.5cm,會幕中共有48塊板」，「48塊板每塊板上需要2個銀座,所以構成會幕實體所需的銀座一共是96個」。KC：每一塊板都出於同一種材料，長度相同，根基也相同；有些板有特別的位置——它們被安在拐角；所有的板都由五根閂連在一起，其中一根是以特別的方式裝上的；「因為只有一位是你們的夫子，你們都是弟兄」（太23:8），「聖品人」與「平信徒」的分別是神的話所沒有的。BH：選用皂莢木是因它耐久、抗腐，象徵不朽與純潔——這是常與基督相連的性質。
  relation: 本章首次記載豎板的實際製作。CT 在靈意上算了一筆帳：南北西三面共四十八塊板、九十六個銀座，「四十八乃六乘八，表徵舊造的人(六)在復活裡(八)成為建造教會的材料，一切都根據主的救贖(銀座)」。CT 也留下一個沒有定論的細節：「有些解經家認為豎板並非實心木板，而是空心框架，固可看見幔子上的基路伯(參8節)，也因此比較輕，容易搬動」。話中之光則把豎板的作用說得很實際：「如果帳幕沒有豎板，幔子是軟的，會隨風飄搖，站立不穩；同樣的，教會沒有真理的根基，也難以立穩。」
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 出36:8-38 全章記載會幕實體建造的展開——從幔子、罩棚、豎板到內幔與門簾，每一細節都照神所吩咐的做成。KC：出25 神給摩西的描述裡約櫃排在第一位，因為它對神最重要；實際建造時卻是房子先造——信徒要學的第一件屬靈功課，是認識教會是什麼，教會是神的居所。BH：聖所是神與祂百姓同在的居所，象徵神渴望與人同住（約1:14）。GT《聖經精讀本》從反面說出同一件事：「異教的神殿是根據人類的設計自行建造的,但是萬物的主權者神,把自己將臨在的地方詳細地啟示給自己的百姓,從而排除了一切世俗的因素。」
  relation: 本章是神的同在由「應許」（出25:8）和「樣式啟示」（出25-31）進入「居所實體建造」的一步：每一塊板、每一幅幔子都在為神住在人間預備具體的空間。而本章唯一被攔阻的事，是奉獻——不是因為獻得不好，而是因為夠了；神要的居所有它確定的度量，不多也不少。
- title: 蒙靈充滿的智慧恩賜（比撒列、亞何利亞伯）
  path: link_folder/神學/蒙靈充滿的智慧恩賜（比撒列、亞何利亞伯）.md
  summary: 出36:1-2 凡蒙耶和華賜智慧聰明、知道做聖所各樣使用之工的，都要照耶和華所吩咐的做工；凡耶和華賜他心裡有智慧而且受感前來做這工的，摩西把他們一同召來。CT 分辨兩個詞：「『智慧』偏重於對事物的創見；『聰明』偏重於對事物的領悟」，並指出「神的工人必須是神賜他心裡有智慧，單靠自己的智慧聰明是遠遠不及神的要求的，所以我們『不是倚靠勢力，不是倚靠才能，乃是倚靠我(神)的靈方能成事』（亞4:6）」。KC：為主作的每一件工上有兩樣要緊的——能力與意願；一個人可以有作某項工作的能力，但他若不願意用他的恩賜，就什麼也不會發生；而那能力不是出於自己，乃是出於神（林後3:5）；摩西在此是主耶穌的預表，為著建造教會，祂賜下了恩賜（弗4:11-12）。BH：這些技巧與能力被描述為神所賜的恩賜（雅1:17），而神所要的不只是技藝，更是把技藝用得合乎祂心意的智慧（箴2:6）。
  relation: 本章把出35 的恩賜宣告落實成開工的行動——智慧人「各都離開他所做的工」（v4）來投入聖工，顯明恩賜的運用需要順服的行動配合。GT《聖經精讀本》把入選條件寫成兩條：「①蒙神賜智慧的人;②自覺地想要作主的工」——與 KC 所說的「能力與意願」是同一組分辨。CT 在話中之光補上一句提醒：「要做神的聖工，必須是照神所吩咐的作工，不能摻有半點自己的意思在裡面，否則就不能為神所用。」
- title: 藍色、紫色、朱紅色線
  path: link_folder/主題/藍色、紫色、朱紅色線.md
  summary: 出36:8、35、37 十幅幔子、內幔、門簾均用撚的細麻和藍色、紫色、朱紅色線製造。CT 解為「細麻線和貴重的藍色、紫色、朱紅色線混紡織造而成的彩色幔子」，即彩色織錦；靈意上藍色線表徵屬天（出24:10）、紫色線表徵君尊、朱紅色線表徵流血犧牲。BH：這些顏色在古代近東文化中意義重大，常與王權和神性相連——藍色象徵諸天與神的啟示，紫色是王者與財富的顏色，朱紅代表犧牲與贖罪；三色並用指向神的威嚴與聖潔，也指向以色列敬拜核心的獻祭制度。
  relation: 本章記載三色線在三種織物中的實際使用：內層幕幔、內幔、門簾——藍紫朱紅貫穿了會幕由外而內的每一道分隔。BH 另補上一個材料上的細節：藍色染料在古代近東稀有而昂貴，多半取自貝類；這些顏色出現在會幕上，本身就是一筆極重的奉獻。
- title: 藍色鈕扣
  path: link_folder/主題/藍色鈕扣.md
  summary: 出36:11-12、17 在相連的幔子末幅邊上做藍色的鈕扣，每邊五十個，兩兩相對；罩棚的末幅邊上也做五十個鈕扣。CT 的〔原文字義〕給「鈕扣」為「扣環」，並說明用法：「兩組各別有五幅相連接的幔子，每組的末幅幔子邊緣上，各做藍色的扣環，以便將兩組幔子相連在一起」，而「扣環的位置要彼此相對」；靈意上「藍色的鈕扣」表徵屬天的聯結。BH：藍色常與諸天相連，象徵神性與神的同在；在古代近東，藍色染料稀有而昂貴，多半取自貝類，這本身就顯出會幕建造的貴重。
  relation: 本章首次記載鈕扣的實際製作——不只用於內層幕幔（v11-12），也用於罩棚（v17）；差別在於內層扣環是藍色的，並以金鉤相連，罩棚則以銅鉤相連。CT 在靈意上把數目也讀進去：「五十個鈕扣」表徵負責任顯出完美的聯結。
- title: 金子（包金）
  path: link_folder/主題/金子（包金）.md
  summary: 出36:34、36、38 用金子將板包裹，又做板上的金環套閂，閂也用金子包裹；內幔的四根皂莢木柱子用金包裹，柱子上有金鉤；門簾的五根柱子，柱頂和杆子用金子包裹。CT 的〔原文字義〕給「包裹」為「覆蓋，呈現」；靈意上「表徵眾信徒無論其服事的崗位如何，都是人性包上神性，又在神性裡連結為一」。KC：眾板包上金子，板上的金環用來套閂。BH：金子象徵這座建築的貴重與神聖，反映神的聖潔與榮耀；金子的不朽壞表明神永恆的性情，而連最小的零件（金環、金鉤）也用金，顯出神居所沒有一處是次要的。
  relation: 本章首次記載包金的實際執行——板、閂、內幔柱、門簾的柱頂和杆子全部包金。CT 在話中之光給了兩句很直接的應用：「皂莢木包金，表明活在信心裡，與神聯合。信徒若不活在信心裡，只是顯露自己(皂莢木)，神不用他。」以及「豎板上需要很多金子包裹，表明神為得信徒並建造教會，祂不惜代價。」
- title: 銀座（帶卯的銀座）
  path: link_folder/主題/銀座（帶卯的銀座）.md
  summary: 出36:24、26、30、36 每塊豎板底下兩個帶卯的銀座，南面四十個、北面四十個、西面十六個（含拐角），共九十六個；內幔柱子也鑄四個帶卯的銀座。CT 解構造：「『帶卯的銀座』指銀製的基座，用於固定豎板，銀座的上方有一個凹狀的卯眼，供豎板底部的凸狀榫頭插入以便接合在一起」。GT《聖經精讀本》：榫起到讓板堅實地插入銀座的作用，而「48塊板每塊板上需要2個銀座,所以構成會幕實體所需的銀座一共是96個」。BH：銀在聖經中常象徵救贖；每個座是用一他連得銀子做的，而那銀子是從以色列人收來的贖價銀（出30:11-16）——神在祂百姓中間的居所，字面意義上是立在救贖之上的。
  relation: 本章首次記載銀座的實際鑄造數量：九十六個銀座為四十八塊豎板的根基，每塊板兩座。CT 在靈意上讀為「銀座表徵以救贖為根基；四十乃四乘十，表徵受造的人若蒙受救贖，就得以在神面前站立得穩，顯得完全」。銀座與門簾柱下的銅座構成本章的一組對照：一邊是救贖的根基，一邊是審判的根基。
- title: 閂（橫閂）
  path: link_folder/主題/閂（橫閂）.md
  summary: '出36:31-34 用皂莢木做閂：南面五閂、北面五閂、西面五閂，共十五根；板腰間的中閂從這一頭通到那一頭；用金子將板包裹，又做板上的金環套閂，閂也用金子包裹。CT 說明用意：「『閂』指橫閂，是用皂莢木作的木閂，將幾塊豎板栓在一起，用意在防止豎板與豎板的連接處不致分散開來」，並指出中閂「從這一頭通到那一頭」是一個疑難問題——一整排共長十三公尺半，製作、搬運與實際使用都有難處，還會損壞包在外面的金子，因此比較合理的是「每閂分成長度相同的數段，段與段之間可以接合起來」。GT《聖經精讀本》：「閂(bar): 起到把會幕的豎板互相套住的作用。帳幕的各板上有5個閂,而且板和環,還有閂都要用金子包裹。」KC：所有的板都由五根閂連在一起，其中一根是以特別的方式裝上的。BH：橫閂為帳幕提供結構支撐，確保它在拆搭之間保持完整；中閂貫穿眾板的正中，這個居中的位置標示出把神放在敬拜與生活的中心。'
  relation: 本章首次記載閂的實際製作。CT 在靈意上算出「三面共十五閂，十五閂表徵三一神（父神的慈愛，基督的恩典，聖靈的感動）使信徒有力量負起連結的責任」，並解中閂「比上下各兩閂的長度加倍，其承擔的責任和力量也加倍」。板與閂全部包金、再以金環相套，CT 讀為「金環表徵聖靈結合的能力；套閂表徵聖靈所賜合而為一的心(弗四3)」。
- title: 心裡有智慧
  path: link_folder/原文/心裡有智慧.md
  summary: 出36:1、2、4、8 四次用到這個詞：「一切心裡有智慧的」（v1）、「凡耶和華賜他心裡有智慧」（v2）、「凡做聖所一切工的智慧人」（v4）、「凡心裡有智慧做工的」（v8）。CT 的〔原文字義〕在第4節給「智慧人」為「有智慧的，精明的，有技巧的」，並在第1節分辨兩個詞：「『智慧』偏重於對事物的創見；『聰明』偏重於對事物的領悟」。GT《聖經精讀本》在第2節把它與意願配成一對：「負責建造會幕之人的條件是:①蒙神賜智慧的人;②自覺地想要作主的工。」BH 指出這個詞不只是擁有技巧，更是理解與智慧、能把技巧用得合乎神心意——正如箴2:6 說智慧出於耶和華。
  relation: 本章是這個詞從「宣告」進入「動工」的一章。出35 用它來界定誰可以做工，出36 則記下這些人真的「各都離開他所做的工」（v4）前來——而且他們前來所說的第一件事，是材料已經夠了。CT 據此下了一句話中之光：「神的工人必須是神賜他心裡有智慧，單靠自己的智慧聰明是遠遠不及神的要求的，所以我們『不是倚靠勢力，不是倚靠才能，乃是倚靠我(神)的靈方能成事』（亞4:6）。」
- title: 出35-40 逐字複述出25-31
  path: link_folder/主題/出35-40 逐字複述出25-31.md
  summary: 出36:8-38 是這段複述最密集的一章，而各家對它究竟對應出26 的哪一段並不一致。GT《啟導本聖經腳註》：「參二十六1～36。其中省略了二十六9下半節和12～13節。」GT《串珠聖經註釋》：「這段大致上重複26章的記載，至於為何26:9下, 12, 13節不在此處重述，則仍是一個謎。」GT《丁道爾聖經註釋》：「本段重複二十六章1～37節，更改的只是動詞的人稱和時態。這種重複在以色列文學中十分常見，更是祭司圈子的特徵：以西結書和歷代志都有不少例子。建築師怎樣埋首於設計或藍圖，敬虔的祭司也怎樣樂於一絲不苟地，重述所得的規格。」GT 丁良才在第1節為整段定範圍：「本節是三十六1至三十九43節的總旨。」KC：所有的細節被再題一次，這不是無用的重複，它顯出沒有一個細節是不重要的。
  relation: 本章讓「複述」這件事有了可以檢驗的細節：被省略的那幾節（26:9下、12-13）至今沒有解釋，而三份來源給的對應範圍也不相同。KC 另指出一個次序上的差別——出25 神給摩西的描述以約櫃為首，因為它對神最重要；實際建造時卻是房子先造。複述並不是照抄，次序本身就在說話。
- title: 兩榫相對（榫卯接合）
  path: link_folder/文化/兩榫相對（榫卯接合）.md
  summary: 出36:22「每塊有兩榫相對。帳幕一切的板都是這樣做」；出36:24、26、30 每塊板底下兩個帶卯的銀座，「兩卯接這塊板上的兩榫」。CT 的〔原文字義〕給「榫」為「手」、「相對」為「被綁起來，被連起來」，並解「『兩榫』一公一母，一凸一凹，以便將兩塊豎板緊密接合在一起」，而「豎板的尺寸和兩榫位置都要相同，如此，眾豎板可以緊密接合在一起」。GT《聖經精讀本》：「榫起到讓板堅實地插入銀座的作用……48塊板每塊板上需要2個銀座,所以構成會幕實體所需的銀座一共是96個。」BH：榫是木工的接頭作法，顯出帳幕設計上對穩固與耐久的要求；榫是連接點，確保眾板牢牢接合。
  relation: 出26 給的是規格，出36 是實做——同一句話在兩章之間只換了動詞的時態。CT 在本章的靈意讀法是「表徵信徒彼此配搭得合式」，話中之光引「兩個人總比一個人好，因為二人勞碌同得美好的果效」（傳4:9）與太18:19；他又說「『榫』似人腳，這是顯出信心的見證。信心把神的孩子堅定在神的應許之上」。而本章把這個小零件的數量也記清楚了：四十八塊板，九十六個榫，九十六個卯。
- title: 豎板是木板還是骨架
  path: link_folder/解經爭議/豎板是木板還是骨架.md
  summary: 出36:20-21 記下豎板的材料與尺寸，卻沒有記厚度。CT 在第21節的備註提出兩個讀法之爭：「有些解經家認為豎板並非實心木板，而是空心框架，固可看見幔子上的基路伯(參8節)，也因此比較輕，容易搬動；同時這裡沒有豎板的厚度，故無法估計每塊豎板的重量。」GT《聖經精讀本》給的則是實心板的尺寸：「這板的高度是4.5m,寬是67.5cm,會幕中共有48塊板」。GT《串珠聖經註釋》對「豎板」的定義同樣偏向板：支撐會幕框架的木板。
  relation: 這個爭議在本章多了一個支點——本章明說幔子上繡有基路伯（v8、35）。若豎板是空心框架，站在聖所裡的人就看得見那些基路伯；若是實心板，內層幕幔就只能從上方看見。CT 提出的第二個理由是重量：經文沒有給厚度，而會幕必須能拆能扛，四十八塊實心板再加上包金，是實際的難處。
- title: 板上的金環（套閂）
  path: link_folder/主題/板上的金環（套閂）.md
  summary: '出36:34「用金子將板包裹，又做板上的金環套閂；閂也用金子包裹。」CT 說明：「『板上的金環』指豎板上用於套橫閂的金環」；靈意上「金環表徵聖靈結合的能力；套閂表徵聖靈所賜合而為一的心(弗四3)」。GT《聖經精讀本》在第29節指出「第一個環子: 指套在連接豎板的閂上的環」，並在第31-34節說「帳幕的各板上有5個閂,而且板和環,還有閂都要用金子包裹」。BH：金環在功能上是實用的，卻也顯出神的居所裡連最小的零件都用金——沒有一處是次要的。'
  relation: 本章是金環由規格進入實做的一章，而且它把兩個系統接在一起：板（豎立）與閂（橫貫）。CT 在拐角板那裡另提到一個環——「直到第一個環子」，並解為「板在環中緊箍在一起；木板表信徒，環子表聖靈或愛心，眾信徒乃是在聖靈裡以愛相連」。
- title: 基督是門（約10：7）
  path: link_folder/互文/基督是門（約10：7）.md
  summary: 出36:37「拿藍色、紫色、朱紅色線，和撚的細麻，用繡花的手工織帳幕的門簾」。CT 在靈意註解裡把這道簾子讀成基督：「帳幕的門簾指會幕出入口的簾子，表徵基督是門(約十7)。」CT 並指出門簾與內幔的織法不同：「幔子是織成密實的布幔，而門簾是刺繡成有細縫的簾子」。BH：入口的簾子是外界與內裡聖所之間的界線，它一面標示出因罪而有的隔絕，一面又提供了一條按規定親近神的路；這道簾子可視為基督的預表，祂後來成為神與人之間終極的中保（來10:19-20）。
  relation: 本章是這個預表在會幕上第二次落到實物：門簾通向聖所，內幔通向至聖所。KC 指出簾子後面就是希伯來書所稱「頭一層帳幕」（來9:2），其中有燈臺、桌子和陳設餅，祭司天天進去行拜神的禮——門是天天用的，不是一年一次。
- title: 面東定向的左右方位
  path: link_folder/背景/面東定向的左右方位.md
  summary: 出36:23、25、27 依次記南面、北面、後面（西面）的板數，而 CT 用入口的朝向來定這三個方位：「『南面』指帳幕入口的左邊；帳幕呈長方形，入口處是在東面，故東面和西面較短，南面和北面較長」；「『北面』指帳幕入口的右邊」；「可見，帳幕的前面，就是帳幕入口處，就是東面，朝日出的方向」。BH：會幕入口朝東，這與古代近東神廟的傳統佈局一致，而東方常與日出和新的開始相連；至於西面，在古代近東文化裡常與一日之終和安息相連。
  relation: 本章是這套方位在實做上第一次全部用到：南面二十塊、北面二十塊、西面六塊加拐角兩塊。CT 由方位推出會幕的形狀（長方形，東西短、南北長）；BH 則指出西面之所以要用轉角板加固，正因為那是最須保護的一端——至聖所在那裡。
