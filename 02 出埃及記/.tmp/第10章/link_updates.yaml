book: 出埃及記
chapter: 10
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: |
    本章摩西身兼宣告者、施行者與代求者：第3-6節宣告蝗災後「就轉身離開法老出去」，不等回話；第12-13節向埃及地伸杖，東風一晝一夜颳來蝗蟲；第16-18節法老急召他認罪求代求，他就離開法老去求耶和華；第21-22節向天伸杖使埃及遍地烏黑三天；第28-29節被法老逐出並以死威脅，他答「你說得好！我必不再見你的面了」。
  relation: |
    本章的摩西一次也沒有讓步。第9節他把條件開得最全：「我們要和我們老的少的、兒子女兒同去，且把羊群牛群一同帶去」；第26節再加一句「連一蹄也不留下」。CT 指出第6節他宣告完就走「表示摩西不給法老討價還價的餘地」，GT 丁良才則說明理由：「摩西知道法老仍是不懼怕神（9:30），所以沒有等候，看法老回答什麼。」代求也有變化——CT 注意到第18節「這次摩西並沒有等到『出城』才求神（參9:29、33），表示蝗災極其嚴重」。GT 丁良才對這次代求的評語很高：法老這一次連釋放的應許都沒有給，摩西仍為他求，「這樣足可顯出摩西忍耐的宏量，不靠法老的應許，也不諫責他，反倒准法老所求的，使災消去」。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: |
    本章亞倫兩次與摩西同行：第3節一同進去見法老、第16節法老急召時一同被叫來；第8節與第11節他被召回又被攆出，都與摩西同進退。蝗災與黑暗之災的施行都由摩西單獨伸杖，亞倫在本章沒有動作，也沒有一句話。
  relation: |
    GT《中文聖經註釋》兩次點出亞倫在本章的文本地位：第8節「這裏亞倫亦是插詞」。第16節法老說「我得罪耶和華你們的神，又得罪了你們」，同一份註釋指出複數的來由：「得罪你們的複數，是因加了亞倫而來的」；GT 丁良才則把法老得罪他們兩人的兩件事列出來——「屢次食言」與「曾把摩西、亞倫攆出去（10:11）」。從第七章亞倫的杖，到本章摩西單獨伸杖，施行的動作已完全落在摩西身上。
- title: 法老
  path: link_folder/人物/法老.md
  summary: |
    本章法老兩次讓步、兩次收回。第8-11節是 CT 所說的第三次妥協：「允許成年男子離開，但老弱婦孺必須留下」，摩西不接受，他就把摩西亞倫「從法老面前攆出去」。第16-17節蝗災之下他認罪：「我得罪耶和華你們的神，又得罪了你們」，並求「只這一次，饒恕我的罪」。第24節是第四次妥協：人可以都去，「只是你們的羊群牛群要留下」。摩西再拒，他就逐客並威脅：「你見我面的那日你就必死！」
  relation: |
    本章最能看出他讓步的算計。CT 說明第三次妥協的用意：扣住老弱婦孺，「這樣，以色列人就會自動的再回來，因為他們離不開自己的家人」；GT《聖經精讀本》說得更白：把女人孩子和家產留下作人質，「因為這樣他們才能再回到埃及，而且回到了埃及，自然就再作埃及的奴隸」。第四次妥協的算計也一樣，GT 丁良才：「法老以為以色列人若不帶著羊群牛群同去，他們就不能在曠野存活，必須仍得返回。」認罪的成色，GT《串珠聖經註釋》判得很清楚：「他只向災禍低頭而不是真心向耶和華悔改」；GT《丁道爾》補上一句更冷靜的觀察：「這一切記述並沒有將法老描繪為徹底墮落的怪物，他不過和以掃一樣，是個『屬世的』人；我們當引為鑑戒。」丁良才並把他一路的退讓排成五格：不釋放（5:2）→在這裡祭祀（8:25）→不要走得很遠（8:28）→只許壯年人去（10:11）→留下羊群牛群（10:24）。
- title: 埃及
  path: link_folder/地點/埃及.md
  summary: |
    本章埃及連受兩災。蝗蟲遮滿地面、甚至地都黑暗了，吃盡冰雹所剩的菜蔬和樹上果子，「連一點青的也沒有留下」（v15）；接著全地烏黑三天，「人不能相見，誰也不敢起來離開本處」（v23）。第7節法老的臣僕已經說出實情：「埃及已經敗壞了，你還不知道嗎？」
  relation: |
    CT 解釋「已經敗壞」是「形容埃及經歷前面數次災禍之後，損耗巨大，瀕臨覆滅的局面」；GT《串珠聖經註釋》從語氣讀出更尖銳的一層：「好像暗示所有埃及都知道了，惟獨法老仍茫然不知。」GT《舊約聖經背景註釋》把本章放在整個序列裡定位：「埃及經濟已經崩潰，但其主要神明仍未蒙羞受辱」——第八災打完經濟，第九災才打宗教。GT《啟導本》並記下埃及當時的作物實況：冰雹摧毀田間一切，「只剩下尚未長成的小麥和粗麥（9:32）。蝗蟲吃盡所剩的，並且騷擾人的生活。」
- title: 歌珊地
  path: link_folder/地點/歌珊地.md
  summary: |
    本章第23節「惟有以色列人家中都有亮光」——黑暗之災臨到全埃及，以色列人所住之處卻有光。
  relation: |
    這是繼8:22 蠅災、9:26 雹災之後第三次的分別，而分別的內容變了：前兩次是「沒有」（沒有蒼蠅、沒有冰雹），這一次是「有」（有亮光）。GT《啟導本》提醒這光的範圍比地名更廣：「可見有亮光的不只是歌珊地，凡有以色列人住的房屋，都可以見到亮光。」GT《丁道爾》另提出一個地理上的可能：「以色列有『亮光』，可能是因為他們在沙暴範圍以外……歌珊若是位於尼羅河谷地三角洲的儘邊的話，受影響的機會就更微小了。」而 GT《中文聖經註釋》堅持這光不是天然的：「並不是他們有現代設備，或是使用他們慣用的燃料點燈所致，乃是神將他們和埃及人分別出來的緣故。」
- title: 耶和華
  path: link_folder/神學/耶和華.md
  summary: |
    「耶和華」這個名字在本章 35 節中出現於 20 節、共 21 次，是全章出現密度最高的名。祂三次對摩西說話（v1、12、21），使法老和臣僕的心剛硬（v1、20、27），使東風颳來蝗蟲（v13）、又轉了極大的西風把蝗蟲吹入紅海（v19），使埃及遍地烏黑三天（v22）。
  relation: |
    本章讓人看見祂怎麼用受造之物。GT《串珠聖經註釋》一句話收束第13節：「指出神能掌管自然界的一切事物，東風和蝗蟲都在祂控制之下。」GT《聖經精讀本》說得更廣：「宇宙萬物的主宰神把天地間的一切作為自己的工具（申10:14；伯41:11；詩24:1；50:12；林前10:26）。」GT《丁道爾》則從第13節看出一條更長的線：「本節說明了創造萬物的神怎樣使用自然世界，普通的蝗蟲被視作神之鞭笞」，而希伯來文的「風」字既可作「氣息」也可作「靈」，「日後『風』即是神『使者』的意念，大概便是從此而出」。KC 用約珥書的話為這群蝗蟲定性：牠們是「耶和華的軍隊」（珥2:11）。
- title: 希伯來人的神
  path: link_folder/神學/希伯來人的神.md
  summary: |
    本章第3節摩西、亞倫進去見法老，開場的話仍是「耶和華希伯來人的神這樣說」，接著是本章特有的一問：「你在我面前不肯自卑要到幾時呢？」
  relation: |
    CT 的原文字義提醒這個稱號的字義沒有變：「希伯來人」是「過河的人，來自遠處的人」。但本章對法老的要求升高了一層——GT《中文聖經註釋》：「原文自卑是低頭，並可作敬拜的含義。這是對法老的一個進一步的要求。不單是要他認識、知道神是誰，現在甚至要他低頭了。」GT 丁良才則從「要到幾時呢」讀出神忍耐的界限，並列出祂忍耐直到的四件事：「直到罪人悔改的機會完畢，直到罪人的惡貫滿盈，直到罪人的希望盡了（賽5:4），直到神的旨意成就」——「由此可知神向罪人的忍耐也是有限的。」法老自己的用語則始終保持距離：第16-17節他兩次說「耶和華你們的神」，GT 丁良才注意到這三個字：「法老不認神為自己的神。」
- title: 耶和華的話臨到
  path: link_folder/神學/耶和華的話臨到.md
  summary: |
    本章三次「耶和華對摩西說」：第1節（差摩西再去見法老，並說明「我使他和他臣僕的心剛硬」的緣由）、第12節（向埃及地伸杖使蝗蟲上來）、第21節（向天伸杖使埃及地黑暗）。
  relation: |
    GT《中文聖經註釋》指出第1節的句式是這一整組敘事的固定開端：「這是記敘神大能的作為的常見開端話（見8:1、20，9:1、13）。」但本章的第1節多了一樣東西——CT 注意到「我使他和他臣僕的心剛硬」這句話「前面原文有『因為』一詞，說明摩西需要繼續與法老辦交涉的原因」。話的內容也在本章第一次轉向以色列人自己：第2節「並要叫你將我向埃及人所做的事……傳於你兒子和你孫子的耳中」。GT《串珠聖經註釋》指出這是災害預告裡的一個特例：「就是神吩咐以色列人將這些奇事傳於後代，好讓信心之火永遠燃點起來。」
- title: 出埃及為要事奉神
  path: link_folder/神學/出埃及為要事奉神.md
  summary: |
    「事奉」在本章 35 節中出現於六節（v3、7、8、11、24、26），另有第9節的「守節」與第25節的「祭祀」——這是出埃及記中討論「去做什麼」最密集的一章。KC 指出第3節是第七次發出同一個呼召：「容我的百姓去，好事奉我」（5:1；7:16；8:1、20；9:1；10:3）。
  relation: |
    本章的爭執點不在去不去，而在誰去、帶什麼去。CT 指出第9節的「守節」就是「獻祭等宗教活動，用現代的話就是指聚會、親近神、敬拜神」，並在第25節說「事奉神就是祭祀，祭祀就是事奉神」。GT《中文聖經註釋》說明第9節為什麼非全家不可：「這裏所說的守節，是一種朝聖的崇拜，是全家大小可去的」，而崇拜中要獻祭，「因此就必須帶他們的牛群、羊群一同出去」。法老的兩個條件正好各砍掉一半——先扣人（v11）、再扣牲畜（v24）。摩西的答覆是第26節：「連一蹄也不留下……我們未到那裡，還不知道用什麼事奉耶和華。」GT《聖經精讀本》把這句話提到原則的高度：「不像外邦宗教似的自己任選祭物，而是一切靠神的啟示，根據他的指示獻祭。」KC 則指出撒但退而求其次的策略：「若沒有別的辦法，撒但情願讓我們去事奉神」——只要頌讚與感謝的靈祭沒有獻上（來13:15-16），他的詭計就得逞了。
- title: 神蹟（miraculous signs）
  path: link_folder/神學/神蹟（miraculous signs）.md
  summary: |
    本章第1-2節說明神為何還要再行神蹟：「我使他和他臣僕的心剛硬，為要在他們中間顯我這些神蹟，並要叫你將我向埃及人所做的事，和在他們中間所行的神蹟，傳於你兒子和你孫子的耳中，好叫你們知道我是耶和華。」CT 的原文字義指出「神蹟」原文就是「記號」。
  relation: |
    本章給神蹟加上一個新的收件人。CT：「『神蹟』的原文是記號，表示神當時所行的那些神蹟奇事，乃是表明神的記號，用意是要叫以色列人更多認識神。」GT《啟導本》說得最短：「神顯奇事，還有教育下一代認識神的作用。」GT 丁良才則把後代怎麼記住這些事列了一長串經文（12:26-27；13:14-15；申32:7；書4:6；詩78、105、106篇）。GT《丁道爾》為這種做法命了名：「聖經對於這種『敘述式神學』很是看重」，並指出數算神勝利的作為「有激發信心的作用」。KC 也注意到約珥書有同樣的吩咐：「你們要將這事傳與子，子傳與孫，孫傳與後代」（珥1:3），並提醒把這些歷史告訴孩子不只是傳遞知識，更是要指出神仍在工作（參詩78:3-4）。
- title: 法老心剛硬
  path: link_folder/神學/法老心剛硬.md
  summary: |
    本章三次記神使法老剛硬：第1節（並且是本卷唯一一次同時提到「他和他臣僕的心」）、第20節（蝗災之後）、第27節（黑暗之災之後）。
  relation: |
    第1節的特別之處在於它把理由講了出來。CT 指出「本節有兩個『我』字指神自己」，而法老和臣僕的心剛硬「乃是神所容許的，為要更多在埃及人中間顯出神蹟」。CT 在第20節又把分寸收了一次：「與其說是神『使法老的心剛硬』，不如說實際是神『容許』法老的心剛硬，為著達到祂的目的。」GT《中文聖經註釋》則說第20節「是神嚴厲的刑罰，是對法老的心剛硬的清楚描述。他已無法回轉了」。有意思的是，臣僕的心雖也被說成剛硬，第7節卻是他們第一次開口勸法老讓步——GT 丁良才注意到人數的變化：「法老的臣僕中早先有懼怕耶和華的（9:20），當時懼怕的人更加多了。」
- title: 分別百姓
  path: link_folder/神學/分別百姓.md
  summary: |
    本章第23節：「三天之久，人不能相見，誰也不敢起來離開本處；惟有以色列人家中都有亮光。」
  relation: |
    這是十災中分別得最顯眼的一次，因為它從「不受害」變成「有光」。GT《聖經精讀本》把兩邊的意思並列：「埃及的黑暗象徵了神的震怒（啟16:10），而以色列的亮光則象徵了神的恩典（弗5:8）。」GT《啟導本》從中讀出一個給讀者的安慰：「信主的人，無論環境如何惡劣，都能有主的光照，正像主耶穌所說：『在世上你們有苦難』、『在我裡面有平安』（約16:33）。」KC 則把這幅圖畫接到逾越節與啟示錄：那三天黑暗中，以色列人的家裡有羊羔（12:3），而新耶路撒冷「城內的燈就是羔羊」（啟21:23）；主耶穌就是「世界的光」（約8:12），信祂的人不住在黑暗裡（約12:46）。
- title: 代求
  path: link_folder/神學/代求.md
  summary: |
    本章第16-18節：法老急忙召摩西、亞倫來認罪，求「只這一次，饒恕我的罪，求耶和華你們的神使我脫離這一次的死亡」；摩西就離開法老去求耶和華，神隨即轉了極大的西風把蝗蟲吹入紅海。
  relation: |
    CT 注意到這次代求少了一個動作：「這次摩西並沒有等到『出城』才求神（參9:29、33），表示蝗災極其嚴重。」GT 丁良才則注意到這次代求少了一個前提——法老連釋放的應許都沒有給，摩西仍為他求：「這樣足可顯出摩西忍耐的宏量，不靠法老的應許，也不諫責他，反倒准法老所求的，使災消去。本來法老當受感動，但他的心如鐵石，不受感化。」GT《中文聖經註釋》把這件事寫成一條原則：「神的僕人總是接受人的認罪，並為之代求神饒恕的。」而本章的結尾正好是這條線的斷點——GT《聖經精讀本》：「在以往的災難中都有過為法老的代禱（8:29；9:29；10:18），但是這一次連代禱都沒有了。當摩西停止代禱的時候，留給法老的只有滅亡。」KC 也說法老的認罪為時已晚：「他已經讓他所定的時候過去了」（耶46:17），「他不知道自己蒙眷顧的時候」（路19:44）。
- title: 神的手段
  path: link_folder/神學/神的手段.md
  summary: |
    本章第7節，法老的臣僕以災情本身作為勸諫的依據：「這人為我們的網羅要到幾時呢？容這些人去事奉耶和華他們的神吧！埃及已經敗壞了，你還不知道嗎？」
  relation: |
    CT 的原文字義給「敗壞」三個意思：「消滅，破壞，摧毀」，並解釋這句話「形容埃及經歷前面數次災禍之後，損耗巨大，瀕臨覆滅的局面」。GT《中文聖經註釋》指出臣僕不敢把矛頭對準法老：「所以不敢直接說法老頑固，而說摩西是埃及人的網羅」——他們選擇的是「勸諫國王以國家和人民為重」這條路。GT《聖經精讀本》則點破他們的動機：「這種行為絕不是認可以色列的解救宣言，只不過是擔心埃及滅亡。」BH 也指出這場質問顯示埃及的領導階層已經出現異議，連效忠法老的人都看出繼續抵擋是徒然的。
- title: 耶和華聖名的啟示
  path: link_folder/神學/耶和華聖名的啟示.md
  summary: |
    本章第2節：「好叫你們知道我是耶和華。」CT 指出這句話的份量：「『我是耶和華』意思是我就是那『我是』的神（參3:14-15）。」
  relation: |
    本章把「知道我是耶和華」的收件人換了。前面幾章這句話多半是對埃及人說的（7:5、17），第九章第29節是對法老說「全地都是屬耶和華的」；本章第2節卻是對以色列人和他們的子孫說的。GT《聖經精讀本》把這條傳承線接得很長：「本節也說明十分重要的目的，要讓摩西時代的人，還有無數的後代，通過神在埃及行的一切神跡，堅信並依靠他」，並舉摩西最後的讚歌（申32:1-47）、約書亞最後的講道（書24:1-5）與詩篇78、105、114篇為例。KC 也說第八災「是給以色列人的特別記號」，他們要據此把神向埃及所行的告訴後代，「藉此以色列人就知道『我是耶和華』」。
- title: 在曠野向神守節
  path: link_folder/神學/在曠野向神守節.md
  summary: |
    本章第9節摩西把出去的條件說全了：「我們要和我們老的少的、兒子女兒同去，且把羊群牛群一同帶去，因為我們務要向耶和華守節。」CT 的原文字義：「守節」是「節慶集會，筵席」。
  relation: |
    「守節」二字決定了誰可以去。GT《中文聖經註釋》：「這裏所說的守節，是一種朝聖的崇拜（參看13:6；利23:39；士21:19等），是全家大小可去的（參看撒上1:1-4）。在這朝聖的崇拜中，他們也要獻祭，因此就必須帶他們的牛群、羊群一同出去。」GT《聖經精讀本》說得一樣：「在一個國家的節期裡，不僅包括小孩子全民都需要參加，而且向耶和華獻祭的動物的犧牲也是必需的。」法老的算盤正好相反——GT《串珠聖經註釋》分析他只准男丁去的理由有三層：利害上要男人回來、宗教上「只有男人才能參與古代任何宗教崇拜的全部過程（參23:17）」、身分上男人是一家之主。GT《丁道爾》也把這三層列出來，並補一句：「當時是男人的世界，但那是有其理由的。」摩西不接受這種算法，於是被攆了出去。
- title: 十災
  path: link_folder/歷史/十災.md
  summary: |
    本章一次收了第八災（蝗災，v1-20）與第九災（黑暗之災，v21-29），也是十災敘事中談判段落的終點——第29節之後，摩西與法老不再協商。
  relation: |
    本章給整組災下了兩個註腳。第一個在第1-2節：神說明祂為何還要繼續行神蹟——「為要在他們中間顯我這些神蹟，並要叫你將我向埃及人所做的事……傳於你兒子和你孫子的耳中」。GT《丁道爾》為這種做法命名為「敘述式神學」，GT《啟導本》說得最短：「神顯奇事，還有教育下一代認識神的作用。」第二個在章末，GT 丁良才把十災的意義歸納成五條：「顯明神的權柄」（神雖能使各種的物類成災，卻沒有用獅豹豺狼傷害埃及人，乃是用小小的蝨子並蝗蟲擾害他們）、「顯明主民的幸福」、「顯明法老的固執」（他寧肯忍受各樣的苦難，總不願聽神的命令）、「顯明惡人的結局」、「宜作眾人的警誡」。CT 的靈訓要義則為本章兩災各定了一個對手：蝗災對付埃及的莊稼之神，黑暗之災對付埃及的太陽神。GT《舊約聖經背景註釋》也指出這一章正是轉折點——第八災之後「埃及經濟已經崩潰，但其主要神明仍未蒙羞受辱」，第九災才打到那裡。
- title: 海（紅海）
  path: link_folder/地點/海（紅海）.md
  summary: |
    本章第19節：耶和華「轉了極大的西風，把蝗蟲颳起，吹入紅海；在埃及的四境連一個也沒有留下」——這是出埃及記中「紅海」第一次成為事件的終點。
  relation: |
    這一節讓「紅海」在全卷第一次出場，而各家立刻處理了它的名字。GT《中文聖經註釋》：「原文的紅海是『蘆葦海』，而不是紅海」，並推測「較近事實的，可能是指蘇彝士灣至地中海之間的一些湖泊沼澤，因為原文的海，亦可譯為『湖』」；GT《啟導本》記下原文作 yam sup，「不可能是今天我們所知道的紅海」。GT《中文聖經註釋》並補一句實情：「因風向的反吹，就算這些蝗蟲不被吹下海，也已進了沙漠地帶，因此在埃及的四境連一個也沒有留下了。」KC 從這裡看出一個伏筆：所有蝗蟲都死在那海裡，而日後法老和他的馬兵也要死在同一個地方。GT《丁道爾》也把兩件事並列：神用東風把蝗蟲吹來、西風把牠們吹走，「渡過紅海是神使用風浪的另一個案例」。
- title: 以色列
  path: link_folder/原文/以色列.md
  summary: |
    本章以色列人自己一句話也沒有說，卻是兩次交涉的標的：第2節神要他們把這些神蹟傳給子孫，「好叫你們知道我是耶和華」；第20、27節兩次「不容以色列人去」；第23節「惟有以色列人家中都有亮光」。
  relation: |
    第2節把以色列人放在一個新的位置上——他們不只是被拯救的一方，也是要把這件事講下去的一方。GT《串珠聖經註釋》指出這是本章預告的特別之處：「就是神吩咐以色列人將這些奇事傳於後代，好讓信心之火永遠燃點起來。」第23節則把他們與埃及人分得最開——GT《啟導本》注意到光的範圍：「可見有亮光的不只是歌珊地，凡有以色列人住的房屋，都可以見到亮光。」而 GT 丁良才提醒這三天他們並沒有趁機逃走：「當時以色列人若要逃走就有好機會，但神要叫法老親自釋放他們（11:8）。」
