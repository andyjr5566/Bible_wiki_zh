  - name: 歌珊地
    type: 地點
    evidence: 23節；「惟有以色列人家中都有亮光」——GT《啟導本》指出有光的不只歌珊地，凡以色列人住的房屋都有
  - name: 代求
    type: 神學
    evidence: 16-18節；法老求「使我脫離這一次的死亡」，摩西離開法老去求耶和華；CT 指出這次沒有等到出城才求
  - name: 法老四次妥協
    type: 歷史
    evidence: 8-11、24節；CT 明指第8節是「法老第三次的妥協」、第24節是「法老第四次的妥協」
  - name: 太陽神Ra（Amon-Re）
    type: 文化
    evidence: 21-23節；GT《啟導本》「埃及人信奉的太陽神『銳』（Ra）現在一點用處也沒有」；《舊約背景註釋》作「亞孟─銳（Amon~Re）」
  - name: 東風（西洛可、卡姆辛）
    type: 歷史
    evidence: 13、21節；GT《啟導本》記喀新風（Khamsin）為五十天風，並保留「不能肯定就是這種風」
  - name: 十災
    type: 歷史
    evidence: 29節；GT 丁良才「埃及十災顯明五種意思」——神的權柄、主民的幸福、法老的固執、惡人的結局、眾人的警誡
  # ↓ 依 rawdata 重新推導的新條目（C 類）：高來源密度卻無節點
  - name: 不肯自卑
    type: 神學
    evidence: 3節；GT《中文聖經註釋》「原文自卑是低頭，並可作敬拜的含義」；丁良才列神忍耐罪人直到的四件事；CT「自卑是體認自己無何可誇，而自我壓低的姿態」
  - name: 海（紅海）
    type: 地點
    evidence: 19節；蝗蟲被西風吹入紅海。GT《中文聖經註釋》「原文的紅海是『蘆葦海』，而不是紅海」；《啟導本》記原文作 yam sup，並推測是蘇彝士灣至地中海之間的湖泊沼澤
