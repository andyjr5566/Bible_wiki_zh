book: 出埃及記
chapter: 34
updates:
- title: 三大節期
  path: link_folder/神學/三大節期.md
  summary: 出34:18,22-24 更新之約重申三大節期：除酵節（亞筆月吃無酵餅七天，因這月出了埃及）、七七節（收割初熟麥子時，又稱收割節、五旬節）、收藏節（年底，又稱住棚節），一切男丁一年三次朝見主耶和華以色列的神；並附加應許「你一年三次上去朝見耶和華你神的時候，必沒有人貪慕你的地土」（24節）。GT 引丁道爾：順命守節的農夫需要這保證——不必擔心朝聖時被鄰舍侵奪土地；丁良才指出歷史上仇敵沒有一次趁三大節期出兵侵掠以色列，顯明神應許的效力。
  relation: 本章與出23:14-17 平行而增添了 v21「雖在耕種收割的時候也要安息」與 v24 的保障應許，KC 指出三大節期表達神對百姓的奉獻與一切所有的主權。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 出34:30-31 亞倫和以色列眾人看見摩西的面皮發光就怕挨近他；摩西叫他們來，亞倫和會眾的官長才回到他那裡，摩西就與他們說話。KC 指出律法主義的人被恩典驚嚇——亞倫與百姓的懼怕正顯明人在神榮光前的本相。
  relation: 與32章鑄犢的失敗相對，本章亞倫以敬畏者的姿態重新出現在摩西面前，恢復了他在會眾中領受神話語的位分，為利未記中就任大祭司鋪路。
- title: 亞舍拉（木偶）
  path: link_folder/背景/亞舍拉（木偶）.md
  summary: 出34:13「砍下他們的木偶」——CT 的〔原文字義〕標明「木偶」即亞舍拉神像。GT《舊約聖經背景註釋》指出她是「美索不達米亞和敘利亞—巴勒斯坦好幾個不同諸神系統中男性元首的伴偶」，包括巴比倫風暴之神阿穆魯與烏加列神明伊勒，並引孔蒂拉特阿吉魯碑文「耶和華與祂的亞舍拉」，說明以色列人對她的接受程度。GT《丁道爾聖經注釋》指出木偶是立於巴力祭壇旁的聖樹或木柱，「代表拉斯珊拉文獻中的海之亞舍拉」；GT《啟導本聖經腳註》稱她為「迦南主神伊爾之妻」，其敬拜儀式「且涉淫亂」；GT《中文聖經註釋》指出先知書「各高崗各青翠樹下」的說法正是敬拜巴力與亞舍拉的用語。
  relation: 本章的拆毀命令緊接在忌邪的神之後（14節），這個次序正是 GT《舊約聖經背景註釋》所點出的邏輯：「砍下這些祭柱的命令，是外邦影響必須從國中除淨的表徵……必須順服『嫉妒之神』的誡命，祂不能容忍象徵敵對神祇的事物。」在金牛犢事件之後重申這條命令，其針對性也很清楚——以色列剛剛示範過，混合敬拜正是從一個「為耶和華守節」的名義開始的。
- title: 出23：19不可用山羊羔母奶煮山羊羔
  path: link_folder/解經爭議/出23：19不可用山羊羔母奶煮山羊羔.md
  summary: 出34:26 立約條款末句重申「不可用山羊羔母的奶煮山羊羔」，與出23:19、申14:21 三度出現。CT 提出二解：以母奶煮其子有殘忍之嫌；此乃迦南異教祭祀習俗，為真神所不喜。GT 引舊約聖經背景註釋：煮食或獻祭時禁止混合奶和肉的猶太潔食規例即以本節為根據，此令亦可能是針對迦南宗教崇拜方式的反應。
  relation: 本條例在更新之約中位居結尾（與初熟之物同節），顯明其在「禮儀十誡」框架中的正式地位，不僅是飲食細則。
- title: 初熟果子
  path: link_folder/神學/初熟果子.md
  summary: 出34:22,26 更新之約把初熟之物綁在兩處：七七節「在收割初熟麥子的時候要守七七節」，以及「地裡首先初熟之物要送到耶和華你神的殿」。CT 指出初熟之物「和家庭裡的長子，以及頭生的牲畜一樣，原都是屬於神的」，而「耶和華你神的殿」此時尚未有聖殿，故指神居住的所在，即會幕中的聖所、至聖所。GT《丁道爾聖經註釋》說明為何在此提及：「由於起碼在曆法上，這些節期全部都有農業上的重要性，在此提及『初熟果子』是很適宜的（在譴責迦南生殖崇拜的法術和禮儀時提及，也同樣適合）。」GT《舊約聖經背景註釋》指出初熟之物與頭生兒子的處理方式相同：「將首先收取的五穀和果子獻給神為祭，亦同樣要贖回，使它可以給人食用。」
  relation: 初熟果子在本章與頭生的人畜並列，兩者的邏輯相同：以第一份代表全部，承認一切都屬於神。KC 把三大節期讀成一條救恩線，其中七七節是「地裡初熟之物的節期……基督已經作為睡了之人初熟的果子復活了（林前15:23）」，而住棚節「說到照著神的計畫萬物的更新」。
- title: 十誡
  path: link_folder/神學/十誡.md
  summary: 出34:28 「摩西在耶和華那裡四十晝夜，也不吃飯也不喝水。耶和華將這約的話，就是十條誡，寫在兩塊版上。」GT 指出原文「十句話」；學者對本章11-26節可否歸納為「禮儀十誡」爭論甚多（中文聖經註釋臚列其十條並指出其漏洞），丁道爾認為兩套律法基本神學並無衝突，若「十言」已在本段背後的假設之中，問題便不存在；GT 並指出申10:10 說這是第二個四十晝夜，摩西一直俯伏祈求神赦免百姓（申9:18,25），故不吃不喝。
  relation: 本章十誡被重寫於摩西所鑿的第二套法版上，是約的恢復而非新約——第一次立約時的律法照樣有效；「寫」的主詞在1節（我要寫）與27節（你要寫上）之間的張力，GT 引丁道爾解為神書寫與摩西書寫同樣真實，反映妥拉是神心思的表達。
- title: 四十晝夜
  path: link_folder/神學/四十晝夜.md
  summary: 出34:28「摩西在耶和華那裡四十晝夜，也不吃飯，也不喝水。」CT 指出這是第二個四十晝夜（第一次見出24:18），「不吃飯，也不喝水」即禁食四十晝夜（參申9:9；太4:2）。GT《中文聖經註釋》給了原因：「摩西為甚麼要四十晝夜在神那裏？又何以不喫也不喝？原因是他四十晝夜俯伏在神面前，祈求神赦免以色列人的罪孽和罪惡的緣故（見申9:18、25等）。」GT《丁道爾聖經註釋》指出申10:10 明說這是第二次的四十晝夜；GT《聖經精讀本》：「聖經裡的『40』表示操練和試驗。」丁良才列出同類的例子：以利亞（王上19:8）與主耶穌（太4:2）。
  relation: 第一個四十晝夜（出24:18）換來的是法版被摔碎，第二個四十晝夜換來的是約的更新——同樣的長度，內容卻從領受變成代求。CT 在話中之光注意到一個反差：「在那四十晝夜中，摩西似乎忘記了一件事，那就是他的自己；他不吃飯，也不喝水，好像他已不復存在。然而，當他從山上下來時，他非但未見清瘦或憔悴軟弱，相反的，他卻更強壯，更有豐采，他的臉上光華四射。」
- title: 安息日
  path: link_folder/神學/安息日.md
  summary: 出34:21「你六日要做工，第七日要安息，雖在耕種收割的時候也要安息。」本節下半是出23:12 所沒有的。GT《啟導本聖經腳註》指出加這一句的用意：「人們急於耕種收割，容易忽略安息，所以特別指出即令在農忙的日子也當守安息日。」GT《串珠聖經註釋》：「這裡提醒他們甚至在收割時，就是很有理由不守安息日的時刻，也需要安息。」GT《丁道爾聖經注釋》把這條要求的分量說到底：「即使從人的角度而言，成敗可能在於一日的工作，農夫也要在年中最忙的時候守日休息。『先求祂的國』是從舊約到新約的不變屬靈原則（太6:33）。守安息所考驗的是以色列對神供給的信心（出16:29）。」
  relation: 安息日在本章不是以創造為理由（出20:11）也不是以恤民為理由（出23:12），而是被放進更新之約的節期條款裡，並加上農忙時期的但書。GT《中文聖經註釋》從這句話推斷成文的處境：「可知這已在農耕生活下的迦南所講的，而不是仍在曠野時所頒布的」——換言之，這條加寫是為了預先堵住百姓進迦南後最容易找的藉口。
- title: 忌邪的神
  path: link_folder/神學/忌邪的神.md
  summary: 出34:14 「不可敬拜別神；因為耶和華是忌邪的神，名為忌邪者。」CT 引高雅倫：「嫉妒」所指的是排他性的個人關係（如婚姻）遭破壞時導致的強烈反應，不當視作偏執而應看為專一——真愛妻子的丈夫不容妻子與人分享，神也不與對手分享以色列。GT 引蘇佐楊對原文 qanna 的解析：既「克」且「拿」，神要克服、擒拿一切祂所不喜的。KC 指出神的忌邪不是把自己與金銀木石之神相比，而是不願祂的百姓因牽連偶像而自取滅亡——祂尋求的是百姓的幸福。
  relation: 本章是「名為忌邪者」的出處——忌邪從神的屬性（出20:5）升格為神的名字，緊接於禁止與迦南居民立約、通婚、吃祭物的條款中，構成立約排他性的神學根據。
- title: 忌邪（嫉妒）
  path: link_folder/原文/忌邪（嫉妒）.md
  summary: 出34:14 「不可敬拜別神；因為耶和華是忌邪的神，名為忌邪者。」CT 原文字義注「忌邪的」即嫉妒的；GT 引蘇佐楊解析原文拼寫與字義：「『妒忌』一詞，原文是 KANA，音似『克拿』，用在神方面，則為 KANNA，即中文所譯的『忌邪』」，蘇佐楊主張譯作「克拿」是音義兼備，因為中文「忌邪」只說出神所克拿的一部分；BH 把同一個字拼作 qanna，並指神的嫉妒不像人的嫉妒那樣可能瑣碎或自私，而是公義的、保護性的。CT 引高雅倫：這嫉妒是排他性個人關係（如婚姻）受破壞時的專一反應，源於神的獨一性與祂和以色列的獨特關係。
  relation: 本章「名為忌邪者」使這個字由屬性描述（出20:5）升格為神的名字，是此原文詞在五經中語意最重的一次出現。
- title: 拆毀偶像律例
  path: link_folder/事件/拆毀偶像律例.md
  summary: 出34:13「卻要拆毀他們的祭壇，打碎他們的柱像，砍下他們的木偶。」CT 指出三個對象各有所指：『祭壇』指獻祭敬拜巴力的地方（參士6:25）、『柱像』指雕刻巴力形像的木柱（參王下10:27）、『木偶』指亞舍拉女神的偶像（參王上15:13），並下一句斷語：「除惡務盡，不可留下絲毫餘地，否則必會捲土重來。」GT 丁良才注意到這條命令在本章重出的時機：「在二十三24節神吩咐以色列人要將迦南的偶像盡行拆毀，以色列人敬拜金牛犢以後，神吩咐他們也要拆毀迦南人的祭壇，砍下他們的木偶。」
  relation: GT《舊約聖經背景註釋》指出執行這條命令在當時需要極大的信心：「因為當時人相信毀壞聖物大大冒犯神明，能夠導致最嚴厲的懲罰。以色列人若是順命，就證明了他們確實相信神能夠保護他們不致受到報應。」同一份來源並指出這整段「也可能是針對金牛犢事件作出的回應」——剛剛造過偶像的百姓，第一項功課就是動手拆別人的。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 出34章摩西的角色貫穿全章：遵命鑿出兩塊石版、清晨獨自上西乃山（4節）、聽聞神宣告性情後急忙伏地下拜並四度代求（8-9節）、領受立約條款並奉命寫上（27節）、在耶和華那裡四十晝夜不吃飯不喝水（28節）、下山時面皮發光而不自知（29節）、以帕子蒙臉往返於神與百姓之間（33-35節）。GT 引丁道爾：摩西不知道自己面皮發光，與施洗約翰、保羅一樣不自知其超卓，正是真屬靈偉人的記號（民12:3）。
  relation: 本章是摩西中保職分的榮耀面——32章他為罪代求、33章他求神同在，本章他成為約的執筆者與神榮光的反照者；GT 指出這段與主耶穌登山變像相似而迥異：摩西自始至終只是神使用的媒介，將真神旨意轉述的神人先知。
- title: 摩西的代求
  path: link_folder/神學/摩西的代求.md
  summary: 出34:8-9 神宣告完自己的性情後，「摩西急忙伏地下拜」，隨即提出三個祈求：求你在我們中間同行、求你赦免我們的罪孽和罪惡、以我們為你的產業。CT 指出這三個祈求逐句都建立在6-7節的宣告上——求同行依據「耶和華」之名與「有憐憫」，求赦罪依據「不輕易發怒」「有豐盛的慈愛」「赦免罪孽、過犯和罪惡」，求為產業依據「誠實」與「為千萬人存留慈愛」。GT 丁良才把摩西為百姓的代求整理成四次：「第一次，注重百姓的危險（32:11-14）；第二次，注重百姓的罪孽（32:30-34）；第三次，注重百姓的缺乏（求神同行，33:12-17）；第四次，注重百姓的前途（求神以百姓為自己的產業，34:8-9）。」同一來源並注意到摩西說的是「我們的罪孽」——「本來是百姓的，摩西將自己和罪民同列」，與尼西米（尼1:7）、但以理（但9:5、9）同一作法。
  relation: 本章的代求有一個很特別的邏輯：摩西求神同行，給的理由竟是百姓的頑梗——那正是神先前說不同行的原因（出33:3、5）。KC 指出這個反轉正是摩西的高明處：「那值得注意的理由，正是百姓的頑梗。摩西正是因此才求這事。他藉此指明：百姓靠自己的力量永遠到不了應許之地，非得耶和華把他們帶去不可」，而他所憑的根據是「因為祂是神，不是人」（何11:9）。這也是四次代求的終點：從求免禍、求赦罪、求同行，到求神收他們作自己的產業。
- title: 摩西鑿石版（第二次法版）
  path: link_folder/事件/摩西鑿石版（第二次法版）.md
  summary: 出34:1-4,28 神吩咐摩西鑿出兩塊石版帶上山，神在其上重寫十條誡。CT 指出第一次的石版與其上的字都是神的工作（出24:12；31:18；32:15-16），第二次卻是摩西遵命鑿成；GT《聖經精讀本》讀出其中的落差：「從而第二次法版跟第一次法版比起來，減少了許多神性的權威和威嚴」；GT 丁良才：「人犯罪後雖得赦免，總是受虧損。」但字沒有變——CT：「神頭一次所寫的字和第二次所寫的字，是一樣的……人當中雖然發生變化，但神卻沒有更改。」KC：「頭一對石版被人的不忠打碎了，但那並沒有改變神的律法……神與祂百姓之間關係的根基，仍舊是律法。」CT 話中之光另有兩句：「摔碎容易，要鑿出新的石版困難」；「摩西鑿石版，神在其上寫字；神的工作，仍需人的配合」。
  relation: 本章的立約更新是從一塊石頭開始的，而這塊石頭要摩西自己鑿。這個分工正是全章的縮影：赦免完全出於神（CT：「表明神恩慈的赦免，樂意重申前約」），但恢復需要人動手。KC 為兩對石版配了一組預表：「頭一對石版代表基督：祂來到自己的百姓中間，就被殺了。第二對石版是信徒的圖畫……信徒在祂裡面，正如那兩塊版在櫃裡一樣（申10:2）」，而山上的摩西則是「主耶穌的圖畫，祂正在按著自己的形像塑造祂的百姓」。
- title: 摩西面皮發光（與帕子）
  path: link_folder/互文/摩西面皮發光（與帕子）.md
  summary: 出34:29-35 摩西手拿兩塊法版下山，「不知道自己的面皮因耶和華和他說話就發了光」；亞倫和以色列眾人看見就怕挨近他；摩西傳完神的話便以帕子蒙臉，惟每逢進到耶和華面前就揭去。GT 指出「發光」的希伯來動詞與「角」同字根，武加大譯本因此誤譯為「生出了角」，「以致有些中古時代摩西的畫像頭上居然有角」（米開蘭基羅的摩西像即為著例）；GT《舊約聖經背景註釋》從古代近東圖像給出這個字義關聯的來歷：神明冠冕上的光芒或角象徵其權能，亞喀得語稱這種榮光為梅嵐穆。GT《丁道爾聖經註釋》指出這一段有兩個「語言學上的罕見用法證實了這個遠古記載的歷史性」——「發光」的動詞是其一，第33節的「帕子」是其二：GT《中文聖經註釋》指出「帕子」原文 masweh「不但名詞只在這裏出現一次，連字根 SWH 也沒有在全部舊約中出現過」，因此譯作帕子只是一種推測。CT 則注意到摩西的不自知：「臉上擦粉的人，要常常照鏡子；但是，摩西臉上發光，自己並不知道。」
  relation: 本段是立約更新的收尾，也是新舊約職事對比的原始場景。KC 讀百姓的懼怕讀出一句很銳利的話：「律法主義的人總是被恩典嚇到。他們滿了自己、滿了自己的本事或討神喜悅的努力。恩典說服他們：他們什麼都不是。這是他們不想聽的信息。」GT《丁道爾聖經註釋》則指出保羅在林後3:7-18 的用法與經文本身的說法不同：經文只說摩西蒙臉是因為以色列人怕看他（30節），保羅卻假設目的是不讓他們看見榮光逐漸減退（林後3:13）——「保羅的詮釋無疑是依照拉比式的釋經」。丁良才另把摩西的榮光與信徒的榮光列成八層對照，末一層是：「那榮光是暫時限定的，這榮光卻是時常加增的（榮上加榮）。」
- title: 本章是否另有一套十誡
  path: link_folder/解經爭議/本章是否另有一套十誡.md
  summary: 出34:28 稱本章的約的話為「十條誡」（原文「十句話」），但11-26節既不止十條、內容也與出20 迥異。GT《中文聖經註釋》稱本章為「學者爭論極多的一章」，並列出一些學者所擬的十條，卻自陳「當然是漏去了好些『話』，特別是15～16節的話」，故「許多學者就稱這章的誡命為禮儀的誡命」。GT《啟導本聖經腳註》把出20 稱為「倫理十誡」、本章稱為「敬拜十守則」。GT《丁道爾聖經註釋》則明確反對：「將本段形容為『禮儀十誡』，更是雙重的誤導……稱之為『節期法典』更為貼切」，並引挪士指出「兩套律法即或有不同重點，在基本神學方面卻毫無衝突之處」。GT《聖經精讀本》：「這不是新的約，而是第一次立約的恢復和確認。」
  relation: 這場爭議關係到本章的定位：出34 究竟是另一次立約，還是同一個約的恢復？各家在細節上分歧，在結論上卻趨同——GT《串珠聖經註釋》指出本章「神只在摩西面前宣告和百姓立約，他們未有參與任何儀式」，與出24 的立約儀式明顯不同；而 GT《聖經精讀本》與丁道爾都主張本章是恢復而非新創。這也解釋了為何本章的條文大量重複出23 的內容：重申本身就是恢復的方式。
- title: 柱像
  path: link_folder/原文/柱像.md
  summary: 出34:13「打碎他們的柱像」。CT 的原文字義給「柱像」為「柱子，紀念碑」，並指出它是「雕刻巴力形像的木柱」（參王下10:27）。GT《中文聖經註釋》在本節下把讀者指回出23:24 的註釋，說明這是同一組禁令的重申。GT《舊約聖經背景註釋》把柱像放進整段脈絡：「這個重申順服誡命是何等重要的段落，特別提到要毀滅各種各樣的異教崇拜，祭儀聖物和偶像尤然。這也可能是針對金牛犢事件作出的回應。」BH 指出這些立石在迦南宗教中「既作為神明的象徵，也作為重大事件的紀念碑」。
  relation: 柱像在本章與祭壇、木偶並列成為必須毀壞的三樣，而 BH 指出這些立石在迦南宗教中既作為神明的象徵、也作為重大事件的紀念碑——同一個物件承載兩種功能，本章要毀的是前者。
- title: 法版上的字是誰寫的
  path: link_folder/解經爭議/法版上的字是誰寫的.md
  summary: 出34:1、28 說神親自把字寫在版上，第27節卻說「你要將這些話寫上」。CT 記下兩說並補一句「無論是神寫的或是摩西寫的，神都承認是祂的工作（參申10:4）」，並把27節的「這些話」界定為11-26節、「寫上」是記錄在冊上而非刻在石版上；GT 丁良才把「這些話」定為12至17節的話；GT《中文聖經註釋》兩處都指出這個落差。GT《丁道爾聖經註釋》主張不必調和：「敘事者不認為兩者互相矛盾……任何關乎『神書寫』的解釋一定得同時留有餘地，承認『摩西書寫』是同樣真實的」，並舉出法老心硬的三種說法（出4:21、8:15、7:13）為完全類同的例子。
  relation: 這個爭議正落在本章的核心：立約更新是神的作為還是人的作為？第1節神吩咐摩西親手鑿版，第27節吩咐摩西親手寫字，而神仍宣告這是祂寫的、祂立的約。CT 由此推出的原則把爭議帶到聖經觀上：「寫聖經的人按照聖靈的感動所寫出來的話，神承認是祂自己的話。」
- title: 申10：1-5
  path: link_folder/互文/申10：1-5.md
  summary: 出34:1-4 神吩咐摩西鑿石版上山、神在版上寫十誡，申10:1-5 是摩西日後對同一件事的回顧，並補上出埃及記未記的一項：石版要放在約櫃中（申10:2、5）。KC 把這一點列為兩次法版的第二個差別：「另一個差別我們在申命記10 讀到。神在那裡說，這第二對必須放在櫃中。」GT《丁道爾聖經註釋》另指出申10:10 明說本章的四十晝夜是第二次的四十晝夜；GT《中文聖經註釋》引申9:18、25 說明摩西這四十晝夜不吃不喝，是因為他俯伏祈求神赦免以色列人的罪孽和罪惡。
  relation: 出34 與申10 是同一件事的兩個視角：出34 記過程，申10 記歸宿。這條互文使本章的立約更新有了收束——摩西親手鑿的兩塊版，最後被放進神所指定的櫃中，成為約的長存憑據；KC 由此讀出預表：「信徒在祂裡面，正如那兩塊版在櫃裡一樣。」
- title: 申命記7_3-4 禁止與迦南人通婚
  path: link_folder/互文/申命記7_3-4 禁止與迦南人通婚.md
  summary: 出34:16「又為你的兒子娶他們的女兒為妻，他們的女兒隨從他們的神，就行邪淫，使你的兒子也隨從他們的神行邪淫。」CT 把15-16兩節讀成一個下滑的序列，稱之為「信仰上變節的五個步驟」：隨從他們的神、祭拜偶像假神、吃偶像假神的祭物、彼此兒女通婚、下一代自然接受偶像假神的信仰。GT《中文聖經註釋》點出真正的危險所在：「娶外邦女子為媳的本身，本來不是主要問題，但因兒子會隨媳婦敬拜外邦神，才是大問題。」GT《聖經精讀本》列出這條線在全本聖經的後果：「由於與外邦人通婚而帶來的墮落，在整個舊約中造成惡劣影響（創6:1,2；王上11:1-13）。同樣，新約中也禁止與不信者的結合（林前7:39；林後6:14-18）。」
  relation: 申7:3-4 把出34:16 的警告寫成正式的律法條文，並補上理由：「因為他必使你兒子轉離不跟從主，去事奉別神。」兩處的重點一致——禁令針對的不是血統而是信仰的傳承斷點。BH 以所羅門為例，指出外邦妻子如何使他去敬拜別神（王上11:1-8），正是這條警告最完整的應驗。
- title: 石版的應許（出24：12）
  path: link_folder/互文/石版的應許（出24：12）.md
  summary: 出34:1「你要鑿出兩塊石版，和先前你摔碎的那版一樣；其上的字我要寫在這版上」；v4 摩西鑿石版上山；v28「摩西在耶和華那裡四十晝夜，也不吃飯，也不喝水。耶和華將這約的話，就是十條誡，寫在兩塊版上。」GT 丁良才指出石版上所寫的話就是十條誡命（參申10:4），並列出平行的申命記經文（申5:6-22；4:13；9:11；10:1-4）。
  relation: 出24:12 的應許在出31:18 第一次兌現，卻在出32:19 被摔碎；本章是同一個應許的第二次兌現。三處連起來看，這條線的重點不在石頭而在「神所寫的律法和誡命」——石版可以碎，話不能改。CT 指出神第一次與第二次所寫的字完全一樣，「儘管中間發生了許多的事，卻不能影響神的權柄」。
- title: 硬著頸項的百姓
  path: link_folder/神學/硬著頸項的百姓.md
  summary: 出34:9 摩西在神宣告性情後代求：「主啊，我若在你眼前蒙恩，求你在我們中間同行，因為這是硬著頸項的百姓。」KC 指出這是引人注目的理由——正因百姓頑梗，摩西才求神同行：百姓靠自己的力量永遠到不了應許地，唯有神親自帶領；他憑「神是神並非世人」（何11:9）為百姓懇求。
  relation: 「硬著頸項」在本章從神拒絕同行的理由（33:3,5）反轉為摩西求神同行的理由，顯明中保代求的邏輯——愈是頑梗軟弱，愈需要神的同在與恩典。
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 出34:9-10 摩西在神宣告性情後代求「求你在我們中間同行」，神隨即宣告「我要立約，要在百姓面前行奇妙的事，是在遍地萬國中所未曾行的」。KC 指出神應許與他們同去並立約，33章懸而未決的同行問題在此以立約的形式落定。
  relation: 本章將「神的同在」由33章的應許推進為約的實體——同行不再只是摩西個人蒙恩的果效，而是神與以色列全體更新之約的內容。
- title: 神的性情宣告（耶和華有憐憫有恩典）
  path: link_folder/神學/神的性情宣告（耶和華有憐憫有恩典）.md
  summary: 出34:6-7 耶和華在摩西面前經過時親自宣告祂的名所包含的性情。CT 逐項解明六加一：耶和華重稱兩次指祂是那「我是」的神、有憐憫是眷顧人的軟弱、有恩典是不在乎人的行為、不輕易發怒是饒恕人的過犯、豐盛的慈愛多過祂公義的要求、誠實是信守祂所應許的，而「萬不以有罪的為無罪」表明公義是祂審判的原則；CT 並把「赦免罪孽、過犯和罪惡」分成三類——罪孽重在傲慢自義所犯、過犯重在疏忽無知所犯、罪惡重在失誤軟弱所犯。GT 丁良才把這些美德歸納為七種，「前六條顯明神的憐恤，後一條顯明神的公義」。GT《舊約聖經背景註釋》則按猶太傳統數為「十三樣神的屬性」，並指出這正是對摩西在出33:13 求「將你的道指示我」的答覆；同一份來源指出這份清單在古代近東屬性目錄中的特殊之處：「大部分清單所注重的都是有關權能的屬性，然而本段的焦點卻在乎神的仁慈恩惠」，並列出聖經後來反覆引用此段以致形成信仰宣言的經文（民14:18；尼9:17；詩86:15、103:8、145:8；珥2:13；拿4:4；鴻1:3）。BH 補上原文：「不輕易發怒」的希伯來文 erek apayim 直譯是「長的鼻孔」，是慢於發怒的比喻。
  relation: 這段宣告是出33:19「我要顯我一切的恩慈，在你面前經過，宣告我的名」的兌現，也是本章立約更新的神學地基——第9節摩西的三重祈求（求同行、求赦罪、求以我們為產業）逐句都建立在6-7節的用語上，CT 把這個對應逐條列了出來。KC 注意到宣告的次序本身有意義：憐憫、恩典、忍耐、豐盛的慈愛、信實、赦免在前，公義與真實在後——「這個次序我們在主耶穌身上也看見，祂是『滿有恩典和真理的』（約1:14）」。
- title: 神的榮耀
  path: link_folder/神學/神的榮耀.md
  summary: 出34:5-8 耶和華在雲中降臨，在摩西面前經過，宣告耶和華的名——這是33:18-23 摩西求見榮耀的實現：神的榮耀以性情宣告（有憐憫有恩典……萬不以有罪的為無罪）的形式經過，摩西急忙伏地下拜。KC 指出摩西在此看見了他上一章所求的榮耀經過；34:29-35 摩西面皮發光，正是與神榮耀相交的返照。
  relation: 本章顯明神的榮耀核心不是外顯的威嚴而是祂的性情（恩慈與公義）；榮耀經過的果效留在中保臉上，成為百姓可見的見證。
- title: 禍延三四代
  path: link_folder/解經爭議/禍延三四代.md
  summary: 出34:7「必追討他的罪，自父及子，直到三、四代」與結18:20「兒子必不擔當父親的罪孽」的表面牴觸。CT 指出「這裡的意思應當另有所指。所謂『禍延子孫』正是本句的意思」，並列出實際機制（疾病的遺傳、家境的貧困、觀念的傳遞、行為的模仿）。KC 先劃界線：「那不是說任何人會因著別人所作的而滅亡，因為各人都為自己的罪受罰」，再說明模仿的傳遞。GT《舊約聖經背景註釋》另給一種解法：「懲罰三四代所表達的事實，是背約能使全家擔罪。換言之『三四代』是指全家在世的人」；GT《串珠聖經註釋》與《丁道爾聖經註釋》則稱「三四代」是表示延續的慣用語。
  relation: 這一句是神性情宣告的收尾，也是這段宣告不致被讀成單面恩典的原因。丁良才把6-7節歸納為七項，「前六條顯明神的憐恤，後一條顯明神的公義」；GT《舊約聖經背景註釋》指出在金牛犢事件之後說這話，「是有關集體性罪咎的鮮明警告」。摩西第9節的祈求正是踩在這兩面之上——他求赦免，卻同時承認「這是硬著頸項的百姓」。
- title: 立約禁令
  path: link_folder/事件/立約禁令.md
  summary: 出34:12,15「你要謹慎，不可與你所去那地的居民立約，恐怕成為你們中間的網羅」。GT 丁良才指出本章12-17節「所論的和二十三24-25、32-33節一樣」，並列出與那地的人立約的三種危險：唯恐他們吃邪神的祭物、唯恐他們與拜邪神的人聯婚、唯恐他們隨從迦南的邪神就行邪淫，以所羅門（王上11:1-8）為鑑。GT《中文聖經註釋》把12節與15節的對象分開：「12節所指的，主要是警戒不可與那地居民的神立約有關，與這兩節才是不可與那地的居民立約。」GT《丁道爾聖經註釋》一句話點明理由：「既然與神立約，便不可與迦南人建立任何盟約關係。」
  relation: 出23:32-33 的禁令在金牛犢事件之後重申，而 CT 記下一個歷史反諷：「以色列人第一項破壞這個誓約的事，竟是與受騙與基遍人立約（參書9:15）。」KC 把禁令的理由推到根上：任何與那些主張神之地的所有權、因而否認神權利的人所結的聯繫，「本身就是對與神之聯繫的否認」——立約禁令不是排外，而是排他性盟約關係的必然推論。
- title: 西乃山
  path: link_folder/地點/西乃山.md
  summary: 出34:2-4,29,32 摩西遵命清晨帶著鑿好的兩塊石版再上西乃山，神在雲中降臨山頂宣告祂的名；此次全山戒嚴比第一次更嚴（連約書亞也不得同行、山根不可放牧羊群牛群），CT 認為主因是金牛犢事件後摩西須留約書亞看守營地，也因神要向摩西顯出祂的榮耀；摩西在山上四十晝夜不吃不喝，末了手拿法版下山，面皮發光。
  relation: 西乃山在本章見證立約的更新——同一座山，第一次領版以百姓毀約告終，第二次領版以摩西面光與約的恢復收場。
- title: 迦南七族（迦南地原住民）
  path: link_folder/背景/迦南七族（迦南地原住民）.md
  summary: 出34:11 神應許「我要從你面前攆出亞摩利人、迦南人、赫人、比利洗人、希未人、耶布斯人」。GT 指出撒瑪利亞抄本和七十士譯本在此名單加上革迦撒人，湊足通稱的迦南地七族；丁道爾指出詳舉族名的用意是藉成事之難反映神蹟之大（申4:38），但勝利有條件——以色列必須遵守神隨後頒布的命令（12-26節）。
  relation: 本章攆出七族的應許緊接立約條款（不可與那地居民立約、要拆毀祭壇柱像木偶），顯明得地與守約互為表裡；神應許的「奇妙可畏之事」（10節）即以驅逐七族為主要內容。
- title: 逾越節
  path: link_folder/歷史/逾越節.md
  summary: 出34:25 「你不可將我祭物的血和有酵的餅一同獻上。逾越節的祭物也不可留到早晨。」GT 引串珠：與出23:18 稍異，此處明指那不可留到早晨的祭物屬於逾越節；聖經精讀本指出祭物的血象徵贖罪、餅中之酵象徵罪惡，故不能同獻；舊約聖經背景註釋指出禁留殘羹是筵席稱聖的表徵。
  relation: 逾越節條例在更新之約中隨除酵節重現（18節），維繫「這約」與出埃及救贖事件的連結。
- title: 頭生歸神為聖
  path: link_folder/歷史/頭生歸神為聖.md
  summary: 出34:19-20 立約條款重申「凡頭生的都是我的；一切牲畜頭生的，無論是牛是羊，公的都是我的……凡頭生的兒子都要贖出來。誰也不可空手朝見我」。GT 引丁道爾：代贖頭生人畜的規條插在除酵節（紀念出埃及）的背景中十分合宜，因為這作法正是紀念以色列蒙拯救——神在逾越之夜擊殺埃及長子而保全以色列頭生的。
  relation: 頭生歸神在本章被納入更新之約的「禮儀十誡」，與除酵節相連成為救贖紀念的一環；KC 指出神藉頭生的權利要百姓承認祂對他們一切所有的主權。
- title: 驢用羊羔代贖
  path: link_folder/原文/驢用羊羔代贖.md
  summary: 出34:20 「頭生的驢要用羊羔代贖，若不代贖就要打折它的頸項。」CT 指出驢屬不潔牲畜不能獻神，故以羊羔代贖，不贖則打折頸項使之無用（參民18:15）。GT 引《聖經難解經文詮釋手冊》討論本節與民18:15-16（不潔牲畜用銀子贖出）的差異：神指示修改先前的律法以利聖所的收入，情況所需使律法以另一方式執行。
  relation: 本章在立約更新中重申此條例（與出13:13 同），潔與不潔、代贖與毀壞的對比繼續指向救贖的替代原則。
