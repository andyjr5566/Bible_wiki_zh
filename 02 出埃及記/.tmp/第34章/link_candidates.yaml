  - name: "亞舍拉（木偶）"
    type: "背景"
    evidence: "出34:13「砍下他們的木偶」。GT《舊約聖經背景註釋》給了這位女神最完整的背景：「以不同但相關名字出現的女神亞舍拉（和合本：『木偶』），似乎是美索不達米亞和敘利亞—巴勒斯坦好幾個不同諸神系統中男性元首的伴偶。這些神祇計有巴比倫風暴之神阿穆魯、烏加列神明伊勒，可能迦南神祇巴力亦包括在內。聖經經常將亞舍拉描繪為立於祭壇不遠處的聖柱。」同一份來源引出一個關鍵的考古發現：「仍受多神世界觀影響的以色列人對她的歡迎程度，從西乃半島西北部之孔蒂拉特阿吉魯的一個碑文，就可見一斑：『耶和華與祂的亞舍拉』。」GT《丁道爾聖經注釋》補上形制與出處：「木偶是通常立於巴力祭壇旁邊（士六25）的聖樹或木柱……這種彷彿『五月柱』的柱子，代表拉斯珊拉文獻中的海之亞舍拉。她是迦南人的『幸運女神』。」GT《啟導本聖經腳註》：「亞舍拉為迦南主神伊爾之妻，也是『賜子觀音』。她的雕像為迦南人所膜拜，敬拜的儀式且涉淫亂。」GT《中文聖經註釋》指出先知書常見的「各高崗各青翠樹下」正是敬拜巴力與亞舍拉的用語。CT 的原文字義給「木偶」直接對應「亞舍拉神像」。新建條目"
