  - name: "法版上的字是誰寫的"
    type: "解經爭議"
    evidence: "出34:1 神說「其上的字我要寫在這版上」，第28節也說「耶和華將這約的話……寫在兩塊版上」，但第27節神卻吩咐摩西「你要將這些話寫上」。同一章之內兩種說法並存，是本章最直接的一處張力。CT 記下兩說：「『我』字指神自己，但有些解經家認為實際上是摩西遵從神的吩咐寫上的（參27節）。無論是神寫的或是摩西寫的，神都承認是祂的工作（參申十4）。」GT《中文聖經註釋》兩處都指出這個落差：「這裏和本章28，以及申十2、4都說是神將字寫在版上，而本章27節卻說是摩西寫的」；並在27節下說明「在28節，似乎是神自己將字寫上，而這裏是叫摩西寫上」。GT《丁道爾聖經註釋》給出最完整的處理：「敘事者不認為兩者互相矛盾。對他來說，兩段經文是用不同方法描述同一連串的事件，意義絕對相等。這觀點顯出堅定的神學立場，深信妥拉是神心思和本性之表達，同時證明機械化地按照字面解釋這幾句話，是不必要的。任何關乎『神書寫』的解釋一定得同時留有餘地，承認『摩西書寫』是同樣真實的。」同一份來源並舉出一個完全類同的例子：聖經說神使法老的心剛硬（出4:21）、法老使自己心硬（出8:15），又說法老心硬卻絕口不提使他如此的媒介（出7:13）。CT 由此推出一條原則：「寫聖經的人按照聖靈的感動所寫出來的話，神承認是祂自己的話。」新建條目"
    surfaces:
      - phrase: "其上的字我要寫在這版上"
        verses: [1]

  - name: "本章是否另有一套十誡"
    type: "解經爭議"
    evidence: "出34:28 說「耶和華將這約的話，就是十條誡，寫在兩塊版上」，但本章11-26節的條文既不止十條、內容也與出20:1-17 迥異，這使本章成為 GT《中文聖經註釋》口中「學者爭論極多的一章」。同一份來源把難處列得很清楚：「10和27節都說立約，卻又見不到像廿四章的立約儀式。更進一步說，28節說『十條誡』，即原文的『十句話』，而明顯的，全章，或單就14節算起到26節，都不止十句話或十條誡。問題究竟在哪裏？」它並列出一些學者所擬的十條（不可敬拜別神、不可鑄造神像、凡頭生的都是我的、誰也不可空手朝見我、第七日要安息、一年三次朝見主、不可將祭物的血和有酵的餅同獻、逾越節的祭物不可留到早晨、初熟之物要送到神的殿、不可用山羊羔母的奶煮山羊羔），但隨即指出「以上的『十條誡』，當然是漏去了好些『話』，特別是15～16節的話」，因此「許多學者就稱這章的誡命為禮儀的誡命」。GT《啟導本聖經腳註》採取類似路線，把本章稱為「敬拜十守則」，與出20 的「倫理十誡」對舉。GT《丁道爾聖經註釋》則明確反對這個作法：「將本段形容為『禮儀十誡』，更是雙重的誤導。第一，經文必須大肆刪改，才能達到十（甚至十二）的數目；若是承認平行的『十言』已經存在，便無須多此一舉。第二，本段並非『大部分』，更非『完全』關乎禮儀，稱之為『節期法典』更為貼切。」並引挪士的處理為最精闢：「兩套律法即或有不同重點，在基本神學方面卻毫無衝突之處。」新建條目"
    surfaces:
      - phrase: "你要將這些話寫上"
        verses: [27]

  - name: "禍延三四代"
    type: "解經爭議"
    evidence: "出34:7「萬不以有罪的為無罪，必追討他的罪，自父及子，直到三、四代。」CT 直接指出難處：「本句似乎與神公義的原則『兒子必不擔當父親的罪孽』（結十八20）相牴觸，也與可拉一黨人的實例不符（參民二十六11）。神審判的原則是『照各人所行的受審判』（啟二十12-13），因此這裡的意思應當另有所指。所謂『禍延子孫』正是本句的意思。」它並列出實際的機制：「按照常理，兒女和子孫難免受到父母、祖父母的連累，譬如疾病的遺傳、家境的貧困、觀念的傳遞、行為的模仿等，都會令子孫受到不良影響。」GT《舊約聖經背景註釋》從古代近東的家族觀給出另一種解法：「懲罰三四代所表達的事實，是背約能使全家擔罪。換言之『三四代』是指全家在世的人。在金牛犢事件之後，這是有關集體性罪咎的鮮明警告。」GT《串珠聖經註釋》則說「『直到三四代』：是當時慣用的語句，有延續之意」；GT《丁道爾聖經註釋》同樣稱之為「表示延續的典型閃族用語」。KC 把界線劃得最清楚：「那不是說任何人會因著別人所作的而滅亡，因為各人都為自己的罪受罰（結18:20上）。但譬如父親若是賊，他很有可能把同樣錯誤的事教給兒女。他們就學了樣。」BH 的說法一致：這不是直接的刑罰，而是活在墮落世界中罪的自然後果。新建條目"
    surfaces:
      - phrase: "必追討他的罪，自父及子，直到三、四代"
        verses: [7]

  - name: "摩西的代求"
    type: "神學"
    evidence: "出34:8-9 神宣告完自己的性情後，「摩西急忙伏地下拜」，隨即提出三個祈求：求你在我們中間同行、求你赦免我們的罪孽和罪惡、以我們為你的產業。CT 指出這三個祈求逐句都建立在6-7節的宣告上：求同行依據的是「耶和華」之名與「有憐憫」；求赦罪依據的是「不輕易發怒」「有豐盛的慈愛」「赦免罪孽、過犯和罪惡」；求為產業依據的是「誠實」與「為千萬人存留慈愛」。GT 丁良才把摩西為百姓的代求整理成四次：「第一次，注重百姓的危險（神要滅絕他們，32:11-14）；第二次，注重百姓的罪孽（32:30-34）；第三次，注重百姓的缺乏（求神同行，33:12-17）；第四次，注重百姓的前途（求神以百姓為自己的產業，34:8-9）。」同一來源另注意到第9節的理由方向是反的：「神不願意同去，因為以色列人是強項的百姓（參33:3）。摩西卻正因這緣故邀求神與他同去。」KC 讀出同樣的悖論並補上根據：摩西以此表明「百姓靠自己的力量永遠到不了應許之地」，而他向神懇求的理由是「因為祂是神，不是人」（何11:9下）。丁良才並指出摩西說的是「我們的罪孽」——「本來是百姓的，摩西將自己和罪民同列」，與尼西米（尼1:7）、但以理（但9:5、9）同一作法。已有條目「摩西的代求」"
    surfaces:
      - phrase: "求你在我們中間同行"
        verses: [9]

  - name: "立約禁令"
    type: "事件"
    evidence: "出34:12,15「你要謹慎，不可與你所去那地的居民立約，恐怕成為你們中間的網羅」。GT 丁良才指出本章12-17節「所論的和二十三24-25、32-33節一樣」，並列出與那地的人立約的三種危險：「唯恐他們吃邪神的祭物；唯恐他們與拜邪神的人聯婚；唯恐他們隨從迦南的邪神，就行邪淫」，以所羅門（王上11:1-8）為鑑。GT《中文聖經註釋》把12節與15節的對象分開：「12節所指的，主要是警戒不可與那地居民的神立約有關，與這兩節才是不可與那地的居民立約。」CT 則指出一個歷史反諷：「以色列人第一項破壞這個誓約的事，竟是與受騙與基遍人立約（參書九15）。」GT《丁道爾聖經註釋》一句話點明理由：「既然與神立約，便不可與迦南人建立任何盟約關係。」KC 說得更硬：任何與那些主張神之地的所有權、因而否認神權利的人所結的聯繫，「本身就是對與神之聯繫的否認」。已有條目「立約禁令」"
    surfaces:
      - phrase: "恐怕成為你們中間的網羅"
        verses: [12]

  - name: "拆毀偶像律例"
    type: "事件"
    evidence: "出34:13「卻要拆毀他們的祭壇，打碎他們的柱像，砍下他們的木偶。」CT 指出三個對象各有所指：『祭壇』指獻祭敬拜巴力的地方（參士6:25）、『柱像』指雕刻巴力形像的木柱（參王下10:27）、『木偶』指亞舍拉女神的偶像（參王上15:13），並在話中之光下一句斷語：「除惡務盡，不可留下絲毫餘地，否則必會捲土重來。」GT 丁良才注意到這條命令在本章重出的時機：「在二十三24節神吩咐以色列人要將迦南的偶像盡行拆毀，以色列人敬拜金牛犢以後，神吩咐他們也要拆毀迦南人的祭壇，砍下他們的木偶。」GT《舊約聖經背景註釋》指出執行這條命令在當時需要極大的信心：「因為當時人相信毀壞聖物大大冒犯神明，能夠導致最嚴厲的懲罰。以色列人若是順命，就證明了他們確實相信神能夠保護他們不致受到報應。」已有條目「拆毀偶像律例」"
    surfaces:
      - phrase: "拆毀他們的祭壇"
        verses: [13]

  - name: "柱像"
    type: "原文"
    evidence: "出34:13「打碎他們的柱像」。CT 的原文字義給「柱像」為「柱子，紀念碑」，並指出它是「雕刻巴力形像的木柱」（參王下10:27）。GT《中文聖經註釋》在本節下把讀者指回出23:24 的註釋，說明這是同一組禁令的重申。GT《舊約聖經背景註釋》把柱像放進整段的脈絡：「這個重申順服誡命是何等重要的段落，特別提到要毀滅各種各樣的異教崇拜，祭儀聖物和偶像尤然。這也可能是針對金牛犢事件作出的回應。」BH 補上功能：「Sacred stones, or 'standing stones,' were often used in Canaanite religious practices as symbols of deities or as memorials for significant events」——亦即這些立石既可代表神明，也可作為重大事件的紀念碑。已有條目「柱像」"
    surfaces:
      - phrase: "打碎他們的柱像"
        verses: [13]

  - name: "申命記7_3-4 禁止與迦南人通婚"
    type: "互文"
    evidence: "出34:16「又為你的兒子娶他們的女兒為妻，他們的女兒隨從他們的神，就行邪淫，使你的兒子也隨從他們的神行邪淫。」CT 把15-16兩節讀成一個下滑的序列，稱之為「信仰上變節的五個步驟」：隨從他們的神、祭拜偶像假神、吃偶像假神的祭物、彼此兒女通婚、下一代自然接受偶像假神的信仰。GT《中文聖經註釋》點出真正的危險所在：「娶外邦女子為媳的本身，本來不是主要問題，但因兒子會隨媳婦敬拜外邦神，才是大問題。」GT《聖經精讀本》列出這條線在全本聖經的後果：「由於與外邦人通婚而帶來的墮落，在整個舊約中造成惡劣影響（創6:1,2；王上11:1-13）。同樣，新約中也禁止與不信者的結合（林前7:39；林後6:14-18）。」BH 以所羅門為例，指出外邦妻子如何使他去敬拜別神（王上11:1-8）。已有條目"
    surfaces:
      - phrase: "又為你的兒子娶他們的女兒為妻"
        verses: [16]

  - name: "安息日"
    type: "神學"
    evidence: "出34:21「你六日要做工，第七日要安息，雖在耕種收割的時候也要安息。」本節下半是出23:12 所沒有的。GT《啟導本聖經腳註》指出加這一句的用意：「人們急於耕種收割，容易忽略安息，所以特別指出即令在農忙的日子也當守安息日。」GT《串珠聖經註釋》：「這裡提醒他們甚至在收割時，就是很有理由不守安息日的時刻，也需要安息。」GT《丁道爾聖經注釋》把這條要求的分量說到底：「這要求在農業社會中影響深遠。即使從人的角度而言，成敗可能在於一日的工作，農夫也要在年中最忙的時候守日休息。『先求祂的國』是從舊約到新約的不變屬靈原則（太六33）。守安息所考驗的是以色列對神供給的信心（出十六29）。」GT《中文聖經註釋》從這句話推斷成文的處境：「從這句話，可知這已在農耕生活下的迦南所講的，而不是仍在曠野時所頒布的。」已有條目「安息日」"
    surfaces:
      - phrase: "第七日要安息"
        verses: [21]

  - name: "初熟果子"
    type: "神學"
    evidence: "出34:22,26 更新之約把初熟之物綁在兩處：七七節「在收割初熟麥子的時候要守七七節」，以及「地裡首先初熟之物要送到耶和華你神的殿」。CT 指出初熟之物「和家庭裡的長子，以及頭生的牲畜一樣，原都是屬於神的」，而「耶和華你神的殿」此時尚未有聖殿，故指神居住的所在，即會幕中的聖所、至聖所。GT《丁道爾聖經註釋》說明為何在此提及：「由於起碼在曆法上，這些節期全部都有農業上的重要性，在此提及『初熟果子』是很適宜的（在譴責迦南生殖崇拜的法術和禮儀時提及，也同樣適合）。」GT《舊約聖經背景註釋》指出初熟之物與頭生兒子的處理方式相同：「將首先收取的五穀和果子獻給神為祭，亦同樣要贖回，使它可以給人食用。」KC 把三大節期讀成一條線，其中七七節「是地裡初熟之物的節期……基督已經作為睡了之人初熟的果子復活了（林前15:23）」。已有條目「初熟果子」"
    surfaces:
      - phrase: "地裡首先初熟之物"
        verses: [26]

  - name: "亞倫"
    type: "人物"
    evidence: "出34:30-31 亞倫和以色列眾人看見摩西的面皮發光就怕挨近他；摩西叫他們來，亞倫和會眾的官長才回到他那裡。KC 指出這個反應本身是一則診斷：「他們不但沒有被摩西的榮光吸引，反而害怕。律法主義的人總是被恩典嚇到。」GT《中文聖經註釋》讀的是另一面：「這裏的怕，是一種敬畏的含意……亞倫和以色列眾人就看他如神似的，對他生出敬畏的心。」CT 指出摩西召集他們是為了向他們傳達神立約的話。與出32 鑄犢的失敗相對，本章亞倫是以敬畏者的姿態重新站在摩西面前。已有條目「亞倫」"
    surfaces:
      - phrase: "亞倫和以色列眾人看見摩西的面皮發光"
        verses: [30]

  - name: "四十晝夜"
    type: "原文"
    evidence: "出34:28「摩西在耶和華那裡四十晝夜，也不吃飯，也不喝水。」CT 指出這是第二個四十晝夜（第一次見出24:18），並即禁食四十晝夜（參申9:9；太4:2）。GT《中文聖經註釋》給出原因：「原因是他四十晝夜俯伏在神面前，祈求神赦免以色列人的罪孽和罪惡的緣故（見申9:18、25等）。」GT《丁道爾聖經註釋》指出申10:10 明說這是第二次的四十晝夜；GT《聖經精讀本》：「聖經裡的『40』表示操練和試驗。」丁良才舉以利亞（王上19:8）與主耶穌（太4:2）為同類。已有條目「四十晝夜」"
    surfaces:
      - phrase: "四十晝夜"
        verses: [28]

  - name: "忌邪（嫉妒）"
    type: "原文"
    evidence: "出34:14「不可敬拜別神；因為耶和華是忌邪的神，名為忌邪者。」CT 的原文字義給「忌邪的」為「忌邪的，嫉妒的」，並指出「名為忌邪者」原文與「忌邪」同字，是重複強調。CT 引高雅倫（Alan Cole）給出這個字最精準的定義：「『嫉妒』所指的，是排他性的個人關係——諸如婚姻——到破壞時所導致暴烈、猛力的行為。因此這種行為不當視作偏執，而應看為專一。」GT 蘇佐楊另從譯名切入，指出英文譯作「妒忌」只譯了原意的一部分，中文「忌邪」也只說出神所「克拿」的一部分，並主張原文 KANNA 音近「克拿」——「克」是得勝制服、「拿」是擒拿。GT《中文聖經註釋》：「神既名為忌邪者，則不單對敬拜別神的人，會發出極端嫉恨的怒氣，也對一切與敬拜事奉別神有關的事物，會不予寬恕。」已有條目「忌邪（嫉妒）」"
    surfaces:
      - phrase: "不可敬拜別神"
        verses: [14]

  - name: "神的同在"
    type: "神學"
    evidence: "出34:9-10 摩西求「求你在我們中間同行」，神隨即宣告「我要立約，要在百姓面前行奇妙的事，是在遍地萬國中所未曾行的」。GT《中文聖經註釋》指出「我要立約」原文所用的動詞是分詞，「表明即將進行而尚未做的」，因此這約「並不單指把西乃所立的約更新，乃是申明神決定要為祂的百姓所要做的」。KC 指出神在此以「看哪」引入這約，「藉此把重點放在上面」——出33 懸而未決的同行問題，在本章以立約的形式落定。已有條目「神的同在」"
    surfaces:
      - phrase: "我要立約"
        verses: [10]
