    evidence: "出34:29-35 摩西下西乃山時不知自己的面皮因與耶和華說話而發光，亞倫和以色列眾人害怕挨近他；摩西傳話完就用帕子蒙臉，每逢進到耶和華面前說話就揭去帕子。CT：面皮發光正如保羅所說返照主的榮光（林後3:18）。GT：「發光」希伯來原文與「角」同字根，武加大譯本誤譯為「生角」，以致中古時代摩西畫像頭上有角（如米開蘭基羅雕像）；舊約聖經背景註釋指出古代近東圖像常以神明冠冕的光芒或角象徵權能。KC/林後3:7-16：保羅引摩西蒙帕子解釋律法之下人心的蒙蔽——律法本有榮光，卻因基督的榮光而顯得失色，凡仍願自居律法之下的人心上蒙著帕子；惟有轉向主，帕子才被除去，得以敞著臉看見主的榮光，漸漸變成主的形狀（林後3:17-18）。BH：this radiance foreshadows the Transfiguration of Jesus (Matthew 17:2), where His face shone like the sun"
