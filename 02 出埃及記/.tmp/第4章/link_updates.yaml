- title: 先知
  path: link_folder/主題/先知.md
  summary: |
    第15-16節神設立摩西與亞倫的關係：「你要將當說的話傳給他」（CT 指原文是「把話放在他嘴裡」），「他要替你對百姓說話；你要以他當作口，他要以你當作神」。GT《串珠聖經註釋》直接把這組關係讀成先知職分的原型：「摩西與亞倫的關係就像神與先知的關係；舊約的先知乃是神的代言人，由神將祂的話語放入先知的口內。」
  relation: |
    GT《中文聖經註釋》說明「當作口」在古代的份量：「摩西是神的代言人，亞倫則是摩西的代言人。代言人不只是傳話，也是有權威的。古代以某人當作口的說法，在宮廷中，那『口』就是代替王上執掌政事者。」GT《啟導本聖經腳註》以7:1為最好的註釋——「我使你在法老面前代替神，你的哥哥亞倫是替你說話的」，並注意到一個實情：「亞倫後來很少代摩西說話，都是摩西自己代神說話。」GT《丁道爾聖經註釋》另從字根指出，第15節「我……要指教你們」的「指教」與 to^ra^「妥拉」同字根，「妥拉」意思是「教訓」，後來成為摩西律法（五經）的名稱。KC 則注意到第22節的開場白：摩西必須以「耶和華這樣說」引入他的話——這個日後被眾先知反覆使用的說法，第一次是從摩西口中發出的。BH 補上處境：「在古代近東的處境中，身分不同的兩方溝通時，往往需要一位發言人或中間人。」
