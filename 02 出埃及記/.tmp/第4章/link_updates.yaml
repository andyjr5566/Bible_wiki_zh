- title: 葉忒羅
  path: link_folder/人物/葉忒羅.md
  summary: |
    摩西順從神的差遣後，回到岳父葉忒羅那裡辭行。摩西沒有提神的顯現，只說「求你容我回去見我在埃及的弟兄，看他們還在不在」，葉忒羅回應「你可以平平安安地去吧」。KC 拿雅各作對比：雅各當年是不告而別的（創31:20），摩西卻求岳父允准。GT 丁良才另指出摩西這趟回去有兩件事要辦：一面要交代所牧的羊，一面要與葉忒羅告辭。
  relation: |
    葉忒羅在此以岳父身分平靜地同意摩西的旅程。GT《中文聖經註釋》注意到摩西並沒有把在神的山所遇見的事告訴岳父，「原因大概是不要他為此擔憂」，並由此反駁所謂「基尼說」（以為摩西敬拜神的宗教是從岳父那裡學來的）——這說法不能成立。「你可以平平安安的去吧」原文的「平平安安」只有一個字 shalom，「去」則是祈願式，含有願神賜福你平安去、平安返的意思；BH 也說這是一句祝福與放行的話。
  sources:
  - KC_KingComments
  source_files:
  - kingcomments_exodus_4.txt
- title: 西坡拉
  path: link_folder/人物/西坡拉.md
  summary: |
    本章中，西坡拉在摩西危急之際（耶和華欲殺摩西，v24-26）採取果斷行動：拿火石割下兒子的陽皮，丟在摩西腳前，說「你真是我的血郎了」。這一行動挽救了摩西的性命。西坡拉說出「血郎」兩次：v25「你真是我的血郎了」，v26「你因割禮就是血郎了」。
  relation: |
    西坡拉在本章扮演拯救者角色──雖然耶和華要殺的是摩西（作為家主與割禮的主要責任人），但行動的是西坡拉。她的話「血郎」含義有多種解讀：可能指她用割禮之血從死亡「買回」丈夫如同新郎，也可能透露她本人對割禮習俗的不情願或責備。GT《中文聖經註釋》把她的處置讀作「一石二鳥」：兒子還未受割禮，本該為他施行；而摩西若在此時親自行割禮，便要耽誤數天行程（參創34:24-25），所以她把割下的陽皮觸在摩西身上，以代替的方式使摩西也算行了割禮。CT 的背景註解則交代了她的去向：西坡拉和兒子從第26節之後就不再被記載，直到18:2才由摩西的岳父帶回曠野與摩西會面，那裡說「就是摩西從前打發回去的」——可見此事之後不久，摩西便打發她帶著兒子回娘家。
