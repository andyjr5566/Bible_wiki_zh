- title: 尼羅河
  path: link_folder/地點/尼羅河.md
  summary: |
    本章v9神賜第三個神蹟：從尼羅河取水倒在旱地上，水必變作血。尼羅河被埃及人視為神靈與生命之源：GT《中文聖經註釋》說埃及人尊之為神、稱其為哈庇（Hapi），哈庇既是神名也是河名；GT《聖經精讀本》另記埃及人相信尼羅河是生命之神 Osiris 特別賜予的聖水，是整個埃及繁榮的根源。BH 指出從尼羅河取水正是直接向與河相關的埃及神明（如 Hapi）挑戰，宣告神超乎埃及諸神；KC 則說尼羅河代表世界沒有神時仍藉神的恩慈所享的自然祝福，人若對前兩個神蹟充耳不聞，這祝福就要變為咒詛。
  relation: |
    本章中尼羅河首次被標記為審判的對象。GT《中文聖經註釋》列出從尼羅河取水變血至少含三種意義：污穢埃及人視為神聖的所在、表明神勝過埃及人所崇拜的神並將牠擊殺、以及報仇的含義（詩58:10；賽49:26；耶46:10）；GT《舊約背景註釋》則說這表記「顯出完全仰賴尼羅河水的埃及，其興衰是在神的掌管之下。它也是神要降災禍的先聲」。同時要注意，摩西當時是在何烈山、離尼羅河甚遠，CT 指出這第三個神蹟並未當場施行，也不像前兩個那樣有還原的一步。
