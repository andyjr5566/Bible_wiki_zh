- title: 米甸地
  path: link_folder/地點/米甸地.md
  summary: |
    本章v19神在米甸對摩西說話，吩咐他回埃及去，因為尋索他命的人都死了。米甸在此是摩西返回埃及前神最後一次向他說話的地點，也是摩西四十年寄居生活的終結場景。
  relation: |
    米甸地從出2章的逃難與成家之地，在本章轉為離開之地。CT 的原文字義註解說「米甸」意為「爭鬥」；GT《中文聖經註釋》把它歸入亞拉伯地區的一部分，並從第27節神的山的位置推斷米甸在東方。BH 說：「米甸位於西乃半島以東，是摩西打死埃及人後逃往的地方」（出2:15），而米甸人是亞伯拉罕從基土拉所生的後裔（創25:1-2），與以色列人同源——這處背景「凸顯摩西從逃犯轉為神所揀選之領袖的轉變」；GT《舊約背景註釋》另指出米甸是摩西尋求庇護之地，離開此地就要冒著為當年那樁流人血之事受罰的危險。
