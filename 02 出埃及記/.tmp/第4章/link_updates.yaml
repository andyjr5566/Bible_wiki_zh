- title: 法老
  path: link_folder/人物/法老.md
  summary: |
    神囑咐摩西回到埃及後要在法老面前施行一切奇事（v21），並預告法老的心將剛硬，不容百姓去。神也吩咐摩西向法老宣告：「以色列是我的兒子，我的長子」（v22），若不釋放，神將擊殺埃及的長子（v23）。
  relation: |
    CT 的原文字義註解說「法老」意為「宏偉的房子」。GT《聖經精讀本》點出這場對決的性質：當時埃及的法老自稱「太陽神的兒子」，所以神稱以色列為長子的宣告並不離奇——接下來記述的就是以色列的神耶和華與法老所拜之埃及神的決戰；同一份注釋另指出尋索摩西性命的是「為了鞏固自己的寶座，想除掉摩西的圖特摩斯三世和他身邊的人」，GT《啟導本聖經腳註》也說這位埃及王應在死者之中。本章法老尚未親身出現，卻已是神計畫的核心對象。神預先告知剛硬的事實，不是剝奪法老的選擇權，而是預示法老自己先硬心之後，神將審判性地加劇其剛硬——BH 也承認這是難題：「法老心硬是一個複雜的神學概念，顯出神對人意志的掌管以及祂救贖計畫的展開」，並說法老的抗拒「不只是政治決定，更是對神旨意在屬靈上的違抗」。摩西首次被委派直接對法老發言，話語以「耶和華這樣說」開頭，先知式宣告從本章開始。
