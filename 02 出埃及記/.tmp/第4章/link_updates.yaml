- title: 長子名分
  path: link_folder/主題/長子名分.md
  summary: |
    第22-23節神吩咐摩西對法老說：「以色列是我的兒子，我的長子……容我的兒子去，好事奉我。你還是不肯容他去。看哪，我要殺你的長子。」GT《啟導本聖經腳註》指出這是舊約唯一稱以色列人為神長子的經文；長子名分在此從家庭制度躍為國際政治的宣告。
  relation: |
    CT 的背景註解列出古時以色列人長子的四項特權：得父親的祝福（創27:4）、得作一家之主（撒上20:29）、得雙份的產業（申21:17）、得作全家祭司之尊榮；BH 同樣從古代近東的家庭制度解釋：「在古代近東的處境中，長子享有特權也擔負責任，通常得雙份的產業，並作家中的領袖」，所以稱以色列為長子，是宣告祂與這國有「在萬國中蒙恩眷、被揀選的地位」。GT《舊約背景註釋》看出全段是圍著「長子」鋪排的：「本段技巧地發展長子——神的長子以色列、法老的長子、摩西的長子——所要面臨的危難」；GT《聖經精讀本》則點出這宣告的鋒芒：當時的法老自稱「太陽神的兒子」，兩個「兒子」的名分正面相對。
