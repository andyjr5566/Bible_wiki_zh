- title: 亞伯拉罕
  path: link_folder/人物/亞伯拉罕.md
  summary: |
    神賜摩西杖變蛇的神蹟，「如此好叫他們信耶和華他們祖宗的神，就是亞伯拉罕的神，以撒的神，雅各的神，是向你顯現了」（v5）。CT 指出「亞伯拉罕的神、以撒的神、雅各的神」這個組合有三層意思：以色列眾先祖的神、活人的神（太22:32）、以及守約的神——祂信守對亞伯拉罕、以撒、雅各個別的應許（參出2:24；創12:7；26:3-4；28:13-14）。
  relation: |
    本章將亞伯拉罕置於「列祖」公式中（v5），用以建立摩西蒙召與神向先祖立約的連續性。BH 指出亞伯拉罕是神最初與之立約的先祖，神應許他後裔眾多與一塊地（創12:1-3），這裡提他就是提醒以色列人：如今行動的神，就是當年向他們祖宗守約的那一位。CT 另注意到一句要緊的分辨：這裡是說好叫他們信「神」，並不是叫他們相信「摩西」。三神蹟的目的不單是證明摩西的權柄，更是證明那位曾向亞伯拉罕、以撒、雅各顯現的神，如今一樣向摩西顯現，接續拯救計畫。
  sources:
  - BH_BibleHub Study
  source_files:
  - biblehub_study_exodus_4.txt
- title: 以撒
  path: link_folder/人物/以撒.md
  summary: |
    神賜摩西杖變蛇的神蹟的目的，是叫以色列民「信耶和華他們祖宗的神，就是亞伯拉罕的神，以撒的神，雅各的神，是向你顯現了」（v5）。BH 說以撒是應許之子，代表神與亞伯拉罕之約的延續；提到他就凸顯神保守立約後裔的信實，正如撒拉年老時仍生下他的神蹟（創21:1-3）。
  relation: |
    以撒在列祖公式中被提及，與亞伯拉罕、雅各共同形成盟約傳承的鏈條。CT 指出這個公式的重點之一是「守約的神」——祂信守對亞伯拉罕、以撒、雅各個別的應許（創26:3-4是給以撒的那一份），所以摩西所傳的不是一位新神，而是列祖所認識的同一位神。
  sources:
  - BH_BibleHub Study
  source_files:
  - biblehub_study_exodus_4.txt
- title: 雅各
  path: link_folder/人物/雅各.md
  summary: |
    神賜摩西杖變蛇的神蹟的目的，是叫以色列民「信耶和華他們祖宗的神，就是亞伯拉罕的神，以撒的神，雅各的神，是向你顯現了」（v5）。BH 說雅各後來改名以色列，是十二支派之父；他一生滿了與神相遇的經歷——伯特利的異象（創28:10-22）、與天使摔跤（創32:22-32）——提到他就凸顯神親自介入、改變人生命的作為。
  relation: |
    雅各在列祖公式中被提及，作為盟約列祖的最後一位，把神對列祖的應許與摩西時代的以色列人接了起來——CT 指出神在這公式裡信守的是對三位先祖「個別的」應許（給雅各的那一份見創28:13-14），而在埃及為奴的正是雅各的後裔。
  sources:
  - BH_BibleHub Study
  source_files:
  - biblehub_study_exodus_4.txt
- title: 埃及
  path: link_folder/地點/埃及.md
  summary: |
    本章中埃及是摩西返回的目的地。神在米甸吩咐摩西「回埃及去，因為尋索你命的人都死了」（v19）。摩西攜妻兒騎驢返回埃及（v20），並在回到埃及後要將一切奇事行在法老面前（v21）。31節百姓在埃及聽見神眷顧他們，低頭下拜。
  relation: |
    埃及在神學層面是壓迫之地的象徵，但在本章中以地理目的地出現：摩西從米甸返回埃及，踏上執行使命的路程。GT《啟導本聖經腳註》與《聖經精讀本》都指出「尋索你命的人都死了」包括那位埃及王（圖特摩斯三世）在內；CT 則把這批人分成兩類：下令追殺摩西的法老和他的臣僕，以及被摩西打死的埃及人的直接親屬。BH 另注意到摩西一家騎驢返回的細節：「驢是古代近東常見的馱獸，用來載人與運貨」，而「以驢代步顯出摩西一家的清寒，與埃及的財富權勢成對比」；同一份注釋也說這趟返程「標誌著神拯救祂百姓之應許（創15:13-14）開始應驗」。神宣告「以色列是我的兒子我的長子」，將以色列與埃及對立──法老以為擁有以色列為奴隸，神宣告以色列是祂的兒子。
