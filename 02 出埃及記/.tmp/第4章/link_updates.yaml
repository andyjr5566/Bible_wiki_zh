book: 出埃及記
chapter: 4
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: |
    本章記下摩西的三次推辭——GT 丁良才《出埃及記註釋》把摩西的推辭數成五次（我是不配去、我沒有憑據、他們不信我、我沒有口才、求主差別人），本章記的是後面三次：(1)百姓不信（v1），神以杖變蛇、手長大痲瘋、水變血三個神蹟回應；(2)拙口笨舌（v10），神宣告造口者必賜口才；(3)「你願意打發誰，就打發誰去吧」（v13），神發怒但仍以亞倫為輔助。摩西順從後回到米甸辭別葉忒羅，攜妻兒返回埃及——BH 注意到他向岳父開口時的用語：「摩西稱以色列人為『弟兄』，顯出他雖在法老宮中長大，仍認同他們」，而葉忒羅的回答「『平平安安地去』是聖經中常見的祝福用語，表達善意與平安」。途中神欲殺摩西（v24-26）因未守割禮之約，西坡拉行割禮後釋放。摩西與亞倫在神的山相遇，招聚長老，施行神蹟，百姓信而敬拜。
  relation: |
    本章是摩西從推辭到順從的轉折。CT 指出摩西已離開埃及四十年之久、以色列人並不認識他，而神也有數百年未曾向以色列人顯現，所以「他們必不信我」在 GT《中文聖經註釋》看來「不單是摩西的託辭，也是現實」；但 KC 把問題拉回差遣者身上：使命從不倚靠接受的人，只倚靠差遣的那一位。到第13節，KC 認為那已經不能算是異議而是拒絕——「拒絕不是謙卑」。神的回應策略不是移除摩西的軟弱，而是以同在的應許與話語賦權。割禮事件表明神對祂器皿的絕對要求：家中必須先遵守聖約。最後百姓相信並下拜的結局證實了神的信實，與摩西的憂慮形成反轉。
  sources:
