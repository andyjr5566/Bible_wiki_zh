- title: 割禮之約
  path: link_folder/神學/割禮之約.md
  summary: |
    本章24-26節是割禮之約在出埃及記中最戲劇化的呈現：耶和華在摩西往埃及的路上「遇見他，想要殺他」，原因是摩西未給兒子行割禮，違背了神與亞伯拉罕所立的割禮之約（創17章）。西坡拉緊急之下拿火石割下兒子的陽皮，耶和華才放了摩西。
  relation: |
    GT《中文聖經註釋》把割禮放回古代近東的背景：主前二千五百年前後敘利亞地區已盛行割禮，其後在埃及、亞拉伯、腓尼基、以東、亞捫和摩押都普遍使用，以色列周圍不行割禮的只有非利士人和亞述人；但各地的作法不同——有的在春情發動期（如以實瑪利人，創17:25），有的在準備結婚前的成年期，有的甚至不把陽皮割掉；以色列人的割禮卻是男孩生下第八天、並且要割去陽皮（創17:10-12），作為與神立約、屬神子民的證據。BH 說這記號的作用是分別：「割禮是神與亞伯拉罕後裔立約的關鍵記號，是一個把以色列人與列國分別出來的身體印記，時刻提醒他們與神的獨特關係」，而在新約裡它成了心靈潔淨的隱喻——保羅所說「心裡的割禮」（羅2:29）。本章表明這約在摩西個人生命中的絕對性：即使是神親選的領袖，若家中未守聖約記號，也在死亡的威脅之下。KC指出神不能容忍祂要使用的人身上有任何不義；領袖必須先管好自己的家。割禮在此不是儀式條規，而是生死攸關的盟約記號。
