book: 出埃及記
chapter: 31
updates:
- title: 分別為聖
  path: link_folder/神學/分別為聖.md
  summary: 出31:13 神吩咐以色列人務要守安息日，「因為這是你我之間世世代代的證據，使你們知道我耶和華是叫你們成為聖的」。CT 指出本節表明遵守安息日的理由之一，是使神的百姓認識神藉設立安息日將他們分別為聖；14節「以為聖日」即將安息日從平常日子分別出來歸為聖。
  relation: 本章將「分別為聖」繫於安息日的記號——成聖的主詞是耶和華（叫你們成為聖的是神自己），守安息日則是百姓對此分別的認識與回應。
- title: 西乃山
  path: link_folder/地點/西乃山.md
  summary: 出31:18 「耶和華在西乃山和摩西說完了話，就把兩塊法版交給他，是神用指頭寫的石版。」GT 引中文聖經註釋：這是接出24:15-18 摩西上山六天後進入雲中，獲神給予出25-31章的一切指示；現在這些話都說完了，神便將法版交給摩西。
  relation: 西乃山在本章是出25-31章整段會幕啟示的總結場景——山上的話語以神親手寫的法版為印記交付摩西。
- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  summary: 出31:2 神提名選召建造會幕的工頭比撒列出自猶大支派，是戶珥的孫子、烏利的兒子。GT 指出十二支派中實質只有三個支派在全部舊約中佔顯著地位：利未支派是祭司、以法蓮支派是北國領導支派，而猶大支派是君王的世家（創49:8-10）；德萊維並指出戶珥、烏利、比撒列三名同見於代上2:20 猶大支派迦勒家族的族譜。
  relation: 本章顯明猶大支派除君王世家的身分外，也在會幕建造上居首——首位明確被神的靈充滿以作聖工的巧匠比撒列即出自此支派，與但支派的亞何利亞伯配搭同工。
- title: 戶珥
  path: link_folder/人物/戶珥.md
  summary: 出31:2 比撒列是戶珥的孫子、烏利的兒子。GT 指出此戶珥是否即出17:10、24:14 與亞倫同扶摩西手、代摩西聽訟的戶珥，已無可考證；但德萊維指出戶珥、烏利、比撒列三名皆出現於代上2:20 猶大支派迦勒家族族譜（同名不必同人）。CT 補充聖經提特定人物時常附帶父祖名字以免同名混淆。
  relation: 本章以「戶珥的孫子」界定比撒列的家系，使會幕巧匠的譜系與猶大支派迦勒家族相連；若此戶珥即扶摩西手者，則其家族橫跨爭戰代禱（出17）、司法（出24）與聖工建造（出31）三種事奉。
- title: 安息日
  path: link_folder/神學/安息日.md
  summary: 出31:12-17 神在交付會幕工程之後重申安息日：務要守神的安息日，因這是神與以色列人之間世世代代的證據，使百姓知道耶和華是叫他們成為聖的；干犯者治死、做工者剪除；以色列人要世世代代守安息日為永遠的約，因為六日之內耶和華造天地，第七日便安息舒暢。CT/BH 指出此段強調即使建造會幕的聖工也不可廢安息日；GT 引丁道爾：安息日與割禮同為立約記號——割禮是個人的證據，安息日是團體恆常奉行的證據。
  relation: 本章將安息日與會幕建造並列為一體兩面（串珠：安息日使百姓知道神叫他們成聖，神在會幕中與人相會也達到同一目標），是「立約證據」語意最完整的一段，並以創造的安息（第七日安息舒暢）為其根基。
- title: 法版
  path: link_folder/原文/法版.md
  summary: 出31:18 耶和華在西乃山和摩西說完了話，就把兩塊法版交給他，是神用指頭寫的石版。GT/BH 指出「法版」原文即「見證版」，是「法櫃」（見證櫃）一名的由來；此節總結出25-31章神在山上的全部指示。CT 指出兩塊版各載五誡（或前四後六之分）而非一式兩份，因神不需要法版作證據，兩塊都交給了摩西；「神用指頭寫」是擬人法，指神能力的直接作為（參出8:19、路11:20）。
  relation: 本章是法版首次實際交付之處（應驗出24:12 的應許），石版與其上的字皆是神的工作，與第二次由摩西鑿版、神寫字（出34:1,28）形成對照；此版後為摩西在金牛犢事件中摔碎（出32:19）。
- title: 割禮作為立約記號
  path: link_folder/主題/割禮作為立約記號.md
  summary: 出31:13、17 兩次稱安息日為「證據」（記號）：「這是你我之間世世代代的證據」「這是我和以色列人永遠的證據」。GT《舊約背景註釋》直接把兩個記號並列：「割禮是個人參與盟約的記號（和合本：『證據』）。同樣，以色列集體參與盟約的記號就是守安息日。它和割禮一樣，是每一代都必須奉行的責任。」同一則註釋也指出兩者的差別：「守安息日和割禮的分別，則在於前者不是只做一次，而是必須恆常保持，並且定期藉行動表彰的態度。」GT《丁道爾》的說法相同：「對以色列來說，割禮是神和祖宗亞伯拉罕『立約的證據』（創17:11）」；GT 引丁良才則把三個記號排成一條線：虹是神與挪亞立約的證據（創9:8-17）、割禮是神與亞伯拉罕立約的證據（創17:9-14）、安息日是神與以色列立約的證據。CT 也把這組對照延伸到新約：「守安息日是神和以色列人團體立約的證據，受割禮是神和以色列人個人立約的證據。」
  relation: 割禮是一次性的、刻在身體上的、個人的；安息日是週期性的、刻在時間上的、群體的。出31 把後者立為記號，正好補上前者所不能標記的那一面——一個人是否屬神，看身體；一群人是否屬神，看他們怎麼用第七日。而兩者都是「世世代代」的：記號不隨立約的那一代結束。
- title: 曠野安息日撿柴事件與神明告處決
  path: link_folder/事件/曠野安息日撿柴事件與神明告處決.md
  summary: 出31:14-15 兩次規定安息日做工者必要治死，而民15:32-36 是這條律法在正典中唯一一次被實際執行的記載。三份材料都作了連結：GT《中文聖經註釋》「民十五32～36亦記述一個在安息日撿柴，而被帶到營外用石頭打死的事例」；GT 引丁良才「神在此處論到這事，無非是要警誡百姓……過了不久，以色列人就將一個不守安息日的人治死了（民十五32、36）」；GT《丁道爾》「根據民數記十五章32～36節的記載，曠野流浪時，曾有一名以色列人為此處死」。GT《舊約背景註釋》另指出經文為何沒有列出具體案例：「經文在此沒有提出具體的案例，但所列的刑罰包括了放逐和處死。這可能表示案件必須個別審核，來決定所做之事應否算為『工作』（見：民15:32-36；耶17:21的案例）。」
  relation: 民15 的撿柴事件之所以要「囚在監內，因為當怎樣辦他，還沒有指明」，正是因為出31 只定了刑罰而沒有界定什麼算「做工」。兩章合看，這條律法的執行需要逐案判斷——這也是 GT《舊約背景註釋》所說「案件必須個別審核」的意思。出31 給的是原則與刑度，民15 給的是第一個判例。
- title: 希伯來書4章神的安息
  path: link_folder/互文/希伯來書4章神的安息.md
  summary: 出31:17「因為六日之內耶和華造天地，第七日便安息舒暢。」CT 由此直接指向來4:9：這是「那真安息的表樣，要屬祂的人藉著守安息日，被提醒將另有安息日的安息為神的子民存留」。GT《丁道爾》講得最完整：「本節和二十章11節一樣，都以神的『安息』為守安息日的理由。這是基督徒理解箇中原則的關鍵。信徒憑信心休止『工作』（工作可瞭解為試圖賺取救恩），進到屬靈安息和內心的平安之中，這種平安只有自知已經蒙神悅納稱義之人才能享用（來四10）。」KC 則指出這安息望向的時間點：「這日子前瞻千年國度的安息。神一切的工作、以及一切為祂而作的，都歸結在那裡。」
  relation: 創2:2-3 給了安息的起點，出31:17 把它立為以色列的立約記號並附上刑罰，來4:9-10 則指出那安息尚未被真正進入。三處合看，安息日不只是回頭紀念創造，也是往前指望——GT 引丁良才提醒那個「安息」的性質：「神安息不是因為乏倦（賽40:28），乃是因為造物的工程完畢了」，而信徒進入的安息同樣不是休息，是工作已被成全。
- title: 剪除
  path: link_folder/原文/剪除.md
  summary: 出31:14「凡干犯這日的，必要把他治死；凡在這日做工的，必從民中剪除。」這是「剪除」第一次與「治死」在同一節中並列。CT 讀為平行同義：「這兩個子句乃是平行同義子句；做工即指干犯，從民中剪除即指治死。」GT 引丁良才卻作了更細的分別：「剪除——就是從選民中被棄絕，使他與盟約無份，凡被治死的也是被剪除，凡被剪除的未必都被治死」；GT《精讀本》站在同一邊：剪除「不僅指以色列百姓肉體上的死亡，而且指從神的祝福中被剪除的意思」。
  relation: 剪除在出12:15（吃有酵之餅）、出30:33、38（私製聖膏油與聖香）都出現過，本章是它第一次與死刑並列，因而也第一次引出「兩者是否等同」的問題。而本章的違例對象很特別：不是吃錯東西、不是造錯東西，而是在錯的日子做工——被剪除的理由是動作發生的時間。
- title: 古代近東安息日
  path: link_folder/背景/古代近東安息日.md
  summary: 出31:13-17 把安息日立為立約的記號。這種制度在閃族世界並非孤例：GT《丁道爾》指出「安息日和割禮一樣，其他閃族地區似乎也有奉行（起碼被視為不宜買賣的『凶日』）；然而照我們所知，只有在以色列才有獨特的宗教意義」。GT《舊約背景註釋》則從經濟與體力兩面補充：「停工休業在經濟上雖則可能構成重擔，從另一方面看，精神和體力亦可藉此得以恢復」，並指出「在安息日休息的誡命，重要到所有違犯之人都要判處死刑的地步」。同一則註釋也界定了「工作」的範圍：「在這個完全安息的日子，聖俗的工都一概不可做。」
  relation: 出23:12 從人道面給安息日理由（牲口歇息、奴僕舒暢），出31:13-17 則從立約面給它記號的地位——同一個制度，兩種說法。而 GT《丁道爾》的觀察把差別點出來了：周邊民族也有「凶日」的觀念，但那是趨避；以色列的第七日卻是神自己安息的日子，並且被立為「你我之間」的記號。制度的外形可以相似，來源與意義卻不同。
- title: 當記念安息日守為聖日
  path: link_folder/神學/當記念安息日守為聖日.md
  summary: 出31:13-17 是十誡第四條（出20:8-11）在會幕指示末了的重申，而且加上了兩樣出20 沒有的東西：立約記號的地位，與違例的刑罰。GT 引丁良才點出這個差別：「在二十8節神曾吩咐百姓守安息日，在本章就給他們定了不守安息日的刑罰」；GT《串珠》也說「此處加上這法律是要強調安息日的重要性」。CT 則指出本章新增的理由：安息日是「你我之間世世代代的證據，使你們知道我耶和華是叫你們成為聖的」——守的理由從創造（出20:11）擴充到成聖（出31:13）。
  relation: 出20 的第四誡以創造為根據，出31 保留了這個根據（v17）並疊上兩層新的意義：記號與成聖。這使安息日從一條誡命變成一個身分標誌——不守不只是違誡，而是自外於那個記號所標明的群體，因此刑罰才是治死與剪除。GT《丁道爾》也指出這個標誌在歷史上真的發揮了作用：以色列人住在不守安息日的外邦人中間時，這日「有了作為識別記號的功用」。
- title: 摩西上山領石版
  path: link_folder/事件/摩西上山領石版.md
  summary: 出31:18「耶和華在西乃山和摩西說完了話，就把兩塊法版交給他。」GT《中文聖經註釋》把敘事線接了起來：「這是接廿四15～18摩西上山六天後，第七天神從雲中召摩西，摩西進入雲中上山，以致獲得神給予記在廿五至卅一章的話。現在，這些話都說完了。」GT《舊約背景註釋》的說法相同：本節「顯示它是接續在二十四章18節中斷的敘述。本節更表示在敘述中加插有關聖幕的建築和祭司分別為聖的材料，至此告一段落，敘事回復到西乃山所發生的事件」。GT《精讀本》另指出本章是摩西「以中保者的身份在西乃山度過的40晝夜中，所得到的神的啟示中最後一個部分」。
  relation: 出24:12-18 是上山與應許，出31:18 是交付——中間隔著出25-30 整套會幕指示。這個編排使石版不是孤立地賜下：它與神要住在百姓中間的計畫一同交給摩西。而 GT 引丁良才也點出這次上山的後果：「摩西因為以色列人製造了金牛犢，就把論會幕的事工從此擱起，直到三十五1節才續論本章的事」——這一趟上山領受的東西，要等到金牛犢事件處理完才動工。
- title: 石版
  path: link_folder/文化/石版.md
  summary: 出31:18「是神用指頭寫的石版。」BH 說明材質本身的意義：「石版象徵永久與耐久，指明神的律法是不改變、永存的。在古代近東，重要的法律文件常刻在石上以確保保存」，並把它與新約「寫在心版上」的應許對照（林後3:3）。GT 引丁良才列出這兩塊版值得注意的四點：「（一）是石頭的，所以能耐久長存（參太五18）；（二）是神親自寫的，故此是十分要緊的；（三）是兩塊的，記載人對於神並對於人的本份；（四）是兩面寫的（出32:15）。」CT 另排除一種常見的說法：兩塊版不是「一式兩份」由立約雙方各持一份，「因為神不需要法版作證據，所以兩塊法版都交給了摩西，並且摩西後來還把兩塊都摔碎了」。
  relation: 出24:12 應許「石版並我所寫的律法和誡命」，出31:18 交付，出32:19 摔碎，出34:1 摩西照樣鑿出兩塊、神再寫一次。GT《每日研經叢書》從第二次賜版讀出這材質的意義：「它強調它們不可變與不能變的性質。正因為這樣，在耶利米書卅一章卅一至卅四節並未暗示新約將會有一部新妥拉，只是它表現的性質改變了（結36:26-27；耶31:33）。」石頭會碎，寫在上面的字卻沒有改。
- title: 從民中剪除的含義
  path: link_folder/解經爭議/從民中剪除的含義.md
  summary: 出31:14「凡干犯這日的，必要把他治死；凡在這日做工的，必從民中剪除。」兩個子句的關係是本章最直接的爭點。CT 讀為平行同義，兩者所指相同：「做工即指干犯，從民中剪除即指治死。全句意指神的百姓務必遵守安息日，違者必須處死。」GT 引丁良才卻明確區分兩者的範圍：「剪除——就是從選民中被棄絕，使他與盟約無份，凡被治死的也是被剪除，凡被剪除的未必都被治死。」GT《精讀本》支持後者：剪除「不僅指以色列百姓肉體上的死亡，而且指從神的祝福中被剪除的意思」。GT《舊約背景註釋》則從執行面指出兩者並列的實際後果：「所列的刑罰包括了放逐和處死。這可能表示案件必須個別審核。」
  relation: 這場爭論的關鍵在於「剪除」是不是一個獨立於死刑的刑度。若照 CT，本節只是同一件事的兩種說法；若照丁良才與《精讀本》，剪除的範圍比治死更廣——可以是逐出、可以是失去約的份，未必都要處死。出31 之所以成為這場爭論最直接的經文根據，正因為它是唯一一處把「治死」與「剪除」放進同一節、同一個罪行下的經文。
