    這一筆實際交付。
- name: 石版
  type: 文化
  evidence: 出31:18「是神用指頭寫的石版。」BH 說明選擇石頭這種材質的意義：「石版象徵永久與耐久，指明神的律法是不改變、永存的。在古代近東，重要的法律文件常刻在石上以確保保存。」GT 引丁良才另列出這兩塊版值得注意的四點：「（一）是石頭的，所以能耐久長存（參太五18）；（二）是神親自寫的，故此是十分要緊的；（三）是兩塊的，記載人對於神並對於人的本份；（四）是兩面寫的（出32:15）。」此條目只累積出24（應許），缺出31
    這一筆實物交付。
