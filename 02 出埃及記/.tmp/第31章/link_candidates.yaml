- name: 安息日與會幕工程的關係
  type: 主題
  evidence: 出31:12-17 的安息日條例，緊接在出31:1-11 交派會幕工程之後、出35:1-3 開工之前——這個位置本身就是解釋的重點。GT《串珠》把兩者讀成一體兩面：「會幕的設立應驗了約的應許：『我要住在你們中間』，而安息日也是這約的實在證據，表明以色列人全歸屬耶和華，作祂的子民；所以守安息日和建造會幕是一個事實的兩面：安息日使以色列民知道神使他們成聖（31:13），同樣，神在會幕中與人相會也達到這目標（29:43）。」GT《丁道爾》引海厄特給的是另一個角度：「將安息日命令加插於此的目的，可能是提醒他們，即使在建築會幕之時，守安息日依然是不可或缺的。」GT《舊約背景註釋》說得最直接：「即使是聖幕的工程，也必須七日停止一日，向創造萬物的神表示尊重。」GT
    引丁良才也註明摩西後來確實這樣傳達：「連會幕上的工程也不可在安息日做，因此摩西吩咐百姓的時侯，就先用這話警誡他們（出35:1-3）。」這組材料在本章密度極高，卻沒有對應節點。
- name: 主日與安息日的關係之爭
  type: 解經爭議
  evidence: 出31:13-17 把安息日立為以色列的立約記號，而新約信徒守的是七日的第一日——兩者是什麼關係，各家並不一致。CT 主張是對應的替代：「守安息日是神和以色列人團體立約的證據，受割禮是神和以色列人個人立約的證據（創17:11）。同樣的，守主日是神和教會立新約的證據，受浸是神和信徒個人立約的證據」，並把出31:14-15
    的刑罰逐句應用到主日上（忽略主日「恐怕會得不償失」、主日做工「將來恐怕會從得勝者中被剔除」）。GT《丁道爾》卻明確切斷這個連結：「基督徒的『主日』（啟一10）和安息日並沒有直接關聯。主日是七日的第一日（林前16:2），是光和創造以及聖靈降臨之日，也是每週記念基督復活，祂子民特此聚集敬拜的日子（徒20:7）。如今信徒一切的時間都已屬神，並不限於七日之中的一日。」GT《中文聖經註釋》居中：主日「並不是新安息日」，並引羅14:5-10
    提醒「亦不可論斷或輕看那些堅持要守某一日子的人」，又指出可2:23-28 的重點「不是在日子，乃在人，更在於主」。
- name: 烏利
  type: 人物
  evidence: 出31:2 比撒列是「戶珥的孫子、烏利的兒子」。GT《中文聖經註釋》給出字義與一個時代線索：烏利「原文的意義是『神之光』或『我的火焰』。這名字也在被擄回國的名單中有出現（參看拉十24）」，並由此推論戶珥、烏利、比撒列三個名字「都在被擄回國的人名中有出現，表示是當時代一般的人名」。GT《丁道爾》另引德萊維指出這三個名字同見於代上2:20
    猶大支派迦勒家族的族譜。KC 則從字義讀出事奉的條件：烏利意為「受光照」——「這工作需要聖靈的光照」。三代之中戶珥與比撒列都有條目，烏利卻沒有。
  surfaces:
