- name: 古代近東安息日
  type: 背景
  evidence: 出31:13-17。GT《丁道爾》指出安息日這種制度在閃族世界並非孤例，但意義獨特：「安息日和割禮一樣，其他閃族地區似乎也有奉行（起碼被視為不宜買賣的『凶日』）；然而照我們所知，只有在以色列才有獨特的宗教意義。」GT《舊約背景註釋》另從經濟面補充：「停工休業在經濟上雖則可能構成重擔，從另一方面看，精神和體力亦可藉此得以恢復。」此條目只累積出23，缺出31
    這一筆把安息日定為立約記號的關鍵章。
- name: 當記念安息日守為聖日
  type: 神學
  evidence: 出31:13-17 是十誡第四條（出20:8-11）在會幕指示末了的重申，而且加上了刑罰。GT 引丁良才點出這個差別：「在二十8節神曾吩咐百姓守安息日，在本章就給他們定了不守安息日的刑罰」；GT《串珠》也說「此處加上這法律是要強調安息日的重要性」。CT
    則指出本章新增的理由：安息日是「你我之間世世代代的證據，使你們知道我耶和華是叫你們成為聖的」。此條目只累積出20，缺這一筆補上刑罰與立約記號意義的重申。
- name: 摩西上山領石版
