- name: 割禮作為立約記號
  type: 主題
  evidence: 出31:13、17 兩次稱安息日為「證據」（記號）。GT《舊約背景註釋》〈出三十一12～17 安息日為立約的記號〉直接把兩者並列：「割禮是個人參與盟約的記號（和合本：『證據』）。同樣，以色列集體參與盟約的記號就是守安息日。它和割禮一樣，是每一代都必須奉行的責任。」並指出分別所在：「守安息日和割禮的分別，則在於前者不是只做一次，而是必須恆常保持。」GT
    引丁良才也把三個記號排在一起：虹（創9:8-17）、割禮（創17:9-14）、安息日；GT《丁道爾》同樣說「對以色列來說，割禮是神和祖宗亞伯拉罕『立約的證據』（創17:11）」。此條目累積創17、出12，缺這一筆與安息日對照的記載。
- name: 曠野安息日撿柴事件與神明告處決
  type: 事件
  evidence: 出31:14-15 兩次規定安息日做工者必要治死。三份材料都以民15:32-36 為這條律法的實際執行：GT《中文聖經註釋》「民十五32～36亦記述一個在安息日撿柴，而被帶到營外用石頭打死的事例」；GT
    引丁良才「過了不久，以色列人就將一個不守安息日的人治死了（民十五32、36）」；GT《丁道爾》「根據民數記十五章32～36節的記載，曠野流浪時，曾有一名以色列人為此處死」。此條目只累積民15，缺這條律法的出處章。
- name: 希伯來書4章神的安息
  type: 互文
  evidence: 出31:17「因為六日之內耶和華造天地，第七日便安息舒暢。」CT 由此指向來4:9：這是「那真安息的表樣，要屬祂的人藉著守安息日，被提醒將另有安息日的安息為神的子民存留」。GT《丁道爾》講得更完整：「本節和二十章11節一樣，都以神的『安息』為守安息日的理由。這是基督徒理解箇中原則的關鍵。信徒憑信心休止『工作』（工作可瞭解為試圖賺取救恩），進到屬靈安息和內心的平安之中，這種平安只有自知已經蒙神悅納稱義之人才能享用（來四10）。」此條目只累積創2，缺出31
    這一筆最直接的舊約支點。
- name: 剪除
  type: 原文
  evidence: 出31:14「凡在這日做工的，必從民中剪除。」CT 指出本節兩個子句是平行同義：「做工即指干犯，從民中剪除即指治死」；GT 引丁良才卻作了一個更細的分別：「剪除——就是從選民中被棄絕，使他與盟約無份，凡被治死的也是被剪除，凡被剪除的未必都被治死」；GT《精讀本》同樣說剪除「不僅指以色列百姓肉體上的死亡，而且指從神的祝福中被剪除的意思」。此條目累積八章，缺出31
    這一筆——而本章正是「治死」與「剪除」被並列、因而引出兩者關係之爭的地方。
  surfaces:
