book: 出埃及記
chapter: 11
candidates:
  - name: 耶和華的話臨到
    type: 神學
    evidence: 1、9節；「耶和華對摩西說」——最後一災的宣告與總結
    surfaces:
      - {phrase: 耶和華對摩西說, verses: [1, 9]}
  - name: 摩西
    type: 人物
    evidence: 全章；向法老宣告第十災；氣忿忿離開
  - name: 法老
    type: 人物
    evidence: 1、5、8、10節；長子必死；臣僕要俯伏求摩西離開
  - name: 埃及
    type: 地點
    evidence: 1、4-6、9節；遍地必有大哀號
  - name: 災殃
    type: 原文
    evidence: 1節；原文可直譯為「擊打」，與9:14 的「災殃」不是同一個字
    surfaces:
      - {phrase: 災殃, verses: [1]}
  - name: 催逼
    type: 原文
    evidence: 1節；原文含「無法容忍而以暴力驅趕」之意——從「不容」到「催逼」
    surfaces:
      - {phrase: 催逼, verses: [1]}
  - name: 傳於後代
    type: 神學
    evidence: 2節；「你要傳於百姓的耳中」——原文是命令式且加了強調
    surfaces:
      - {phrase: 傳於百姓的耳中, verses: [2]}
  - name: 耶和華
    type: 神學
    evidence: 3-4、10節；祂叫百姓蒙恩；祂親自出去巡行
    surfaces:
      - {phrase: 耶和華, verses: [3, 4, 10]}
  - name: 磨子後的婢女
    type: 原文
    evidence: 5節；推磨是社會最卑賤的工作（賽47:2；士16:21）——上自法老下至女奴，無一例外
    surfaces:
      - {phrase: 磨子後的婢女, verses: [5]}
  - name: 狗不敢搖舌
    type: 原文
    evidence: 7節；原文作「磨利舌頭」；當時的狗是流浪惡犬，脾氣一觸即發——狗不吠表示極度的平靖
    surfaces:
      - {phrase: 狗也不敢向他們搖舌, verses: [7]}
  - name: 知道我是耶和華
    type: 神學
    evidence: 7節；「好叫你們知道耶和華是將埃及人和以色列人分別出來」
    surfaces:
      - {phrase: 知道耶和華是將埃及人和以色列人分別出來, verses: [7]}
  - name: 氣忿忿
    type: 原文
    evidence: 8節；原文字義是「鼻孔、怒氣」——摩西的義怒
    surfaces:
      - {phrase: 氣忿忿, verses: [8]}
  - name: 神蹟（miraculous signs）
    type: 神學
    evidence: 9節；「使我的奇事在埃及地多起來」
    surfaces:
      - {phrase: 奇事, verses: [9]}
  - name: 亞倫
    type: 人物
    evidence: 10節；與摩西在法老面前行了這一切奇事
  - name: 法老心剛硬
    type: 神學
    evidence: 10節；「耶和華使法老的心剛硬」
    surfaces:
      - {phrase: 法老的心剛硬, verses: [10]}
  - name: 出埃及為要事奉神
    type: 神學
    evidence: 10節；「不容以色列人出離他的地」
    surfaces:
      - {phrase: 以色列人出離他的地, verses: [10]}
  # ↓ 既有條目吃本章累積（B 類）：本章 md 已連結、卻不在候選清單
  - name: 第十災（殺長子之災）
    type: 歷史
    evidence: 1、4-7節；CT 靈訓要義「對付埃及的眾神之神，即法老自己」
  - name: 長子之死
    type: 歷史
    evidence: 5節；GT 丁良才「法老既然除滅了神的長子，神也要除滅法老的長子（4:22-23）」
  - name: 分別百姓
    type: 神學
    evidence: 7節；GT《啟導本》「說明住在歌珊地的以色列人，在這場大災中所受的與埃及人不同。參八22及九4」
  - name: 埃及人給以色列人財物
    type: 歷史
    evidence: 2-3節；GT 丁良才「神使以色列人向埃及人要金銀器皿有兩個緣故：作他們的工價、後來要造會幕」
  - name: 催逼離開
    type: 歷史
    evidence: 1節；GT《啟導本》「他要像打發不要了的新婦一樣，給她厚禮送她走」
  - name: 摩西氣忿忿離開法老
    type: 歷史
    evidence: 8節；KC「這一次法老沒有機會把摩西趕走，而是摩西自己離去」
  - name: 創十五14 亞伯拉罕之約的財物應驗
    type: 互文
    evidence: 2節；BH 指出向鄰舍要金器銀器應驗了神對亞伯拉罕的預言（創15:14）
  - name: 詩七八51、一三六10 擊殺長子
    type: 互文
    evidence: 4-5節；KC 引詩78:51、136:10 指出詩篇以擊殺長子回顧這一夜
  # ↓ 依 rawdata 重新推導的新條目（C 類）：高來源密度卻無節點
  - name: 摩西看為極大
    type: 人物
    evidence: 3節；GT 中文聖經註釋、丁良才、啟導本、串珠、精讀本、丁道爾、賈斯樂郝威〈命題16〉與 KC、BH 九處材料集中在這一節
    surfaces:
      - {phrase: 看為極大, verses: [3]}
  - name: 約到半夜
    type: 原文
    evidence: 4節；GT《丁道爾》「『約在』似乎表示在時間上頗為模糊。但希伯來文卻沒有模糊的意思，『正在半夜』才是正確的翻譯」
    surfaces:
      - {phrase: 約到半夜, verses: [4]}
  - name: 第11章的敘事次序
    type: 解經爭議
    evidence: 1-8節；CT、丁良才、串珠、中文聖經註釋、精讀本、丁道爾六家都指出 1-3 節是插句、4-8 節接續 10:29
