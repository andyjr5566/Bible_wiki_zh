book: 出埃及記
chapter: 11
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: |
    本章摩西做了三件事：領受神關於末災的話並轉告百姓向鄰舍要金器銀器（v1-3）；向法老宣告半夜巡行、長子必死（v4-7）；說完最後一句「你這一切臣僕都要俯伏來見我」就氣忿忿地離開（v8）。第10節與亞倫一同被記為「在法老面前行了這一切奇事」。
  relation: |
    第3節是全卷唯一一次從埃及人的角度給他下的定位：「摩西在埃及地、法老臣僕，和百姓的眼中看為極大。」理由各家不一——GT《丁道爾》列出兩個可能：「摩西的影響力可能源自他所行的『神蹟』，亦可能是因為民眾記得他在王室長成」；GT《中文聖經註釋》給的卻是品格：「他沒有因法老的固執而求神降瘟疫，一次就把全埃及人滅掉。乃是逐步的緊迫法老就範，以致法老的臣僕對其國王的作為也看不過眼而加勸諫（10:7）。」KC 從中讀出一個預表：「摩西在這裡是主耶穌的預表，主也要藉著祂所施行的審判贏得敬重。」而第8節的怒氣，KC 說明了它的性質：「這一次法老沒有機會把摩西趕走，而是摩西自己離去。他對法老再沒有半點膽怯或懼怕。他與神相交，因此對法老的罪充滿了聖潔的憤慨。」丁良才並為這種義怒作了平衡的辯護：保羅雖說當除掉一切的忿怒（弗4:31；西3:8），「但也說信徒生氣卻不要犯罪」（弗4:26），而「摩西與法老說話還是制服了自己的心」（箴16:32）。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: |
    本章亞倫只在第10節出現一次：「摩西、亞倫在法老面前行了這一切奇事。」CT 指出「『這一切奇事』指前後共十次災禍；除了已經施行的九災之外，還包括本章所預言的第十災」。
  relation: |
    第10節是一句回望的總結，而不是本章的敘事。GT《串珠聖經註釋》把兩節的用詞分清楚：第9節「『我的奇事』是指第十災及以色列人之被釋放」，第10節「『這一切奇事』是指先前的九個災禍」；GT《啟導本》說得一樣，並指出第九節那一組「是耶和華神直接行的奇事」。換句話說，本節記的是亞倫與摩西同工的那一段已經完成——第十災不再經人的手。第16節法老說「又得罪了你們」用的是複數，GT《中文聖經註釋》指出「得罪你們的複數，是因加了亞倫而來的」。
- title: 法老
  path: link_folder/人物/法老.md
  summary: |
    本章法老一句話也沒有說，卻是每一節的對象：第1節神預告他將「催逼」以色列人出去；第5節他寶座上的長子在被擊殺之列；第8節摩西預告他的臣僕要俯伏求人離開；第10節「耶和華使法老的心剛硬，不容以色列人出離他的地」。
  relation: |
    第十災打的正是他這個人。GT《舊約聖經背景註釋》把父子兩代連起來看：「法老在埃及被視為神明，而這個第十災所針對的正是他。他的『父』太陽神在第九災被擊敗，如今他的兒子──可能甚至是繼位的太子──更被宰殺。這對於法老本人、王位、神性，都是打擊。」CT 的靈訓要義也說這一災「對付埃及的眾神之神，即法老自己」。而他的結局在第1節已經寫定：GT《中文聖經註釋》指出「催逼」的原文「含有無法容忍而以暴力驅趕的意思」，GT《啟導本》譯得更生動——「他要像打發不要了的新婦一樣，給她厚禮送她走」，因為「法老巴不得把以色列人一齊趕掉，以絕後患」。
- title: 埃及
  path: link_folder/地點/埃及.md
  summary: |
    本章埃及是一場尚未發生的審判的現場：第4節神要「出去巡行埃及遍地」，第5節從坐寶座的法老到磨子後的婢女所有的長子與一切頭生的牲畜都必死，第6節「埃及遍地必有大哀號；從前沒有這樣的，後來也必沒有」。
  relation: |
    這一次神要親自來。GT《舊約聖經背景註釋》指出這在埃及人的宗教感受上有一層反諷：「埃及主要節期中最重大、最是眾所期待的一件事，是神明出來到百姓中間。然而以色列的神巡行埃及遍地，卻是為審判而來。」GT《每日研經叢書》則從埃及人的死亡觀說明這一擊為何格外深：「古代民族中，可能沒有比埃及人更為迷於死亡。祭司身份的實際權力，乃在被視為確有能力，保證死者平安到達阿西利斯神所仁慈統治的西天。這可怕的災殃蔑視一切理性的解釋，顯示出耶威不只是自然力之主，也是生死之主。」而「大哀號」這個字，GT《丁道爾》串成了全卷的一條線：「以色列向耶和華『哀求』拯救（出2:23），後來他們又在極度痛苦中向法老『哀求』，卻得不應允（出5:15）。如今卻輪到了埃及人在神審判的痛苦中『哀求』。」
- title: 耶和華
  path: link_folder/神學/耶和華.md
  summary: |
    本章神說了兩段話（v1-3、v9），並在第4節宣告一件祂要親自做的事：「約到半夜，我必出去巡行埃及遍地。」祂也叫百姓在埃及人眼前蒙恩（v3），將埃及人和以色列人分別出來（v7），並使法老的心剛硬（v10）。
  relation: |
    本章最要緊的一個字是第4節的「我」。CT：「『我』指耶和華神自己；『巡行』意指親臨。」GT《聖經精讀本》說明這與前九災的差別：「現在為止的災難卻是通過摩西和亞倫施行的，而第10次災難神要親自下到埃及。」丁良才說得最短：「末後的災是神親自降的。」KC 也說：「在最後這一災中，神自己要降下來施行審判。」而祂的另一面在第3節與第7節——祂叫百姓「在埃及人眼前蒙恩」（GT《串珠聖經註釋》：「意思是以色列人向埃及人要求什麼，都可得著」），又使以色列那邊安靜到連狗也不敢搖舌。同一夜之內，同一位神做了兩件相反的事。
- title: 耶和華的話臨到
  path: link_folder/神學/耶和華的話臨到.md
  summary: |
    本章兩次「耶和華對摩西說」：第1節宣告「我再使一樣的災殃臨到法老和埃及」並吩咐百姓向鄰舍要金器銀器；第9節說明「法老必不聽你們，使我的奇事在埃及地多起來」。
  relation: |
    這兩段話在時序上並不相連。GT《串珠聖經註釋》指出「本章的編排是按課題內容而不是按時間的先後次序」——第1-3節是神在10:24 之前給摩西的指示，第4-8節接的才是10:29。GT《中文聖經註釋》指出第1節的開場句式是這一整組敘事的固定形式：「這是記敘神大能的作為的常見開端話（見8:1、20，9:1、13）。」而第9節的話不是給法老的，是給摩西的——KC：「神告訴摩西，為什麼法老不會聽他，儘管他和亞倫在法老面前行了這一切神蹟。神要賜下豐盛的神蹟，作祂能力的見證。」
- title: 法老心剛硬
  path: link_folder/神學/法老心剛硬.md
  summary: |
    本章第10節：「摩西、亞倫在法老面前行了這一切奇事；耶和華使法老的心剛硬，不容以色列人出離他的地。」第9節先給了理由：「法老必不聽你們，使我的奇事在埃及地多起來。」
  relation: |
    本章把「剛硬」與「奇事增多」放在同一句因果裡。CT 解釋第9節：「神在此對摩西說明為何祂容許法老硬著心不肯答應摩西的請求」，目的「是要藉法老一再拒絕而多行些神蹟奇事，使埃及人知道神的心意所在」，並在第10節把分寸再收一次：「『耶和華使法老的心剛硬』指神容許法老多次硬著心不肯遂行他自己的承諾。」GT 收錄的《靈修版》守住同一條界線：「神真的使法老的心剛硬，強迫他做錯事嗎？……法老不肯回心轉意，神就任憑他作驕傲的抉擇，使他嘗到自己行為的苦果。神並沒有強迫法老棄絕祂，反而一再留有餘地，使他回轉。神說：『我斷不喜悅惡人死亡』（結33:11）。」KC 則從神那一面看這件事的用處：「人若不肯聽，神就能用他的不肯，向每一個願意看的人顯明祂的能力，作一個警告的見證。」丁良才並指出這不是新消息：「神曾屢次對摩西說了這話」（3:19；4:21）。
- title: 分別百姓
  path: link_folder/神學/分別百姓.md
  summary: |
    本章第7節：「至於以色列中，無論是人是牲畜，連狗也不敢向他們搖舌，好叫你們知道耶和華是將埃及人和以色列人分別出來。」
  relation: |
    這是十災敘事中最後一次提到這條分界線——KC：「這是最後一次提到埃及人與以色列人之間的分別。」GT《啟導本》把前面幾次列出來：「『分別出來』說明住在歌珊地的以色列人，在這場大災中所受的與埃及人不同。參八22及九4。」而這一次的表達方式與前幾次都不同：不是「沒有蒼蠅」「沒有冰雹」「有亮光」，而是連狗都不出聲。GT《聖經精讀本》的對照最貼近生活：「如果養狗的人家發生什麼事情，那麼第一個有反應的肯定是那家的狗。但是與埃及震天的哭聲相反，以色列的家庭由於有神同在，所以連狗都會安然入睡。」丁良才則提醒分別的根據不在以色列自己：「以色列人平安出埃及，不是因他們的善良，乃是出於神的恩典（林前4:7），又因著羊羔的血」（12:7、13、21、23）。
- title: 神蹟（miraculous signs）
  path: link_folder/神學/神蹟（miraculous signs）.md
  summary: |
    本章第9-10節兩次提到「奇事」，而且指的不是同一批：第9節「使我的奇事在埃及地多起來」，第10節「摩西、亞倫在法老面前行了這一切奇事」。
  relation: |
    GT《啟導本》把這個區別說得最清楚：第9節的「我的奇事」「指就要施行的第十災和以色列人的獲得自由。這是耶和華神直接行的奇事」；第10節的「這一切奇事」則「指摩西與亞倫參與過的先前的九災」。GT《串珠聖經註釋》的分法相同。CT 則把兩者合起來算：「『這一切奇事』指前後共十次災禍；除了已經施行的九災之外，還包括本章所預言的第十災。」丁良才一句話收束這兩節的功能：「這兩節總論以上的九災。」
- title: 傳於後代
  path: link_folder/神學/傳於後代.md
  summary: |
    本章第2節：「你要傳於百姓的耳中，叫他們男女各人向鄰舍要金器銀器。」GT《中文聖經註釋》指出這句話的語氣很重：「這句話的原文不但是命令式，而且還加了一個務字，即務要傳於百姓的耳中。」
  relation: |
    這一節與第10章2節的「傳」不是同一件事，連 CT 給的原文字義都不同——10:2 的「傳於」是「描述，述說」，本章11:2 的「傳於」是「說話」。前者是把神的作為講給子孫聽，後者是把一道即刻要執行的吩咐傳達下去。CT 解釋本節：「意指切實的將下面的話傳達給全體以色列，使他們周知。」而所傳的內容日後仍有下文——GT《中文聖經註釋》指出3:22 和12:35 的記載除金器銀器外還有衣裳，「所以，撒瑪利亞抄本和七十士譯本在此也加有衣裳在其中」。
- title: 出埃及為要事奉神
  path: link_folder/神學/出埃及為要事奉神.md
  summary: |
    本章第1節把結局說定了：「我再使一樣的災殃臨到法老和埃及，然後他必容你們離開這地。他容你們去的時候，總要催逼你們都從這地出去。」第10節則記下當下的僵局：「不容以色列人出離他的地。」
  relation: |
    從第5章1節開始的那句要求，在本章第一次得到明確的答覆——不是法老答應，而是神宣告。CT 解釋第1節「然後他必容你們離開這地」是「意指法老不再提出條件」；GT《中文聖經註釋》說明離開的規模：「都從這地出去是一人一蹄都不留，全部男女老少和牛群羊群，埃及人都要把他們驅趕離開」——這正是第10章26節摩西堅持的「連一蹄也不留下」。KC 也說這一災的結果是「法老要把整個民族完完全全地趕出這地」。而所要離開的人並非空手：第2節的吩咐讓他們帶著金器銀器出去，KC 稱之為「他們和他們祖先在埃及作奴僕、多年勞苦所未曾支領的工錢」。
- title: 知道我是耶和華
  path: link_folder/神學/知道我是耶和華.md
  summary: |
    本章第7節下半：「好叫你們知道耶和華是將埃及人和以色列人分別出來。」CT 解釋這句話的意思是「神藉此顯明祂厚待以色列人，使他們的情況與埃及人有所分別」。
  relation: |
    這一次「知道」的內容很具體——不是抽象的「我是耶和華」，而是一件可以看見的事：兩邊的遭遇不一樣。GT《中文聖經註釋》另注意到一個抄本上的細節：「從十28～29和十一8，我們知道這一段話是對法老說的。所以在撒瑪利亞抄本和七十士譯本都把你們知道改成單數，即好叫你知道。但摩西既在王宮對法老說話，許多臣僕在其旁邊，摩西當然就不止要使法老一人知道，故此原文是用你們。」BH 也指出這道分別不是因以色列有什麼可誇，而是出於神向亞伯拉罕、以撒、雅各所立的約。
