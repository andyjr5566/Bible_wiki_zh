- title: 出埃及時期法老的身份
  path: link_folder/解經爭議/出埃及時期法老的身份.md
  summary: |
    第2節那句「耶和華是誰」出自一位經文從未指名的法老。各家對他是誰、出埃及在哪一年，說法相差可達兩百年：GT《聖經精讀本》主張摩西和亞倫面對的是圖特摩斯三世之後的阿孟和蒂二世（主前1448-1424年），當時年僅二十至二十二歲，「他同先王一樣強硬，而且有能力」；賈斯樂郝威《聖經難解經文詮釋手冊》則說現代聖經學者一般主張是拉美西斯二世（Ramsees II，出埃及約在主前1270-1260年間），但他自己主張早期年代。
  relation: |
    賈斯樂郝威列出三組理由支持早期年代：其一是聖經內證——王上6:1說「以色列人出埃及地後四百八十年，所羅門作以色列王第四年」，所羅門第四年約主前967年，推得出埃及在主前1447年；士11:26的三百多年、徒13:19-20的四百五十年、出12:40的四百三十年也都指向主前1400年左右，「而非一般的批評者所說的主前1200年」；照傳統王朝表，當時的法老就是亞門諾菲斯二世（Amenhotep II，約主前1450-1425年在位）。其二是考古年代的重定——賽森與李文斯頓（John Bimson and David Livingston）主張把銅器時代中葉與末葉的過渡期由主前1550年改為1400年，而中銅器時代的城邑「其特徵都是較大而堅固的防城」，與探子回報的情形相符（申1:28）。其三是 Velikovsky-Courville 修訂法，主張埃及法老年代多算了六百年，據此出埃及發生在主前1440年、當時的法老應是東（Thom），並以出1:11的比東（Pithom，意即「東的居所」）為佐證。GT《啟導本聖經腳註》與《聖經精讀本》在出4:19則把「尋索你命的人都死了」的那位王指為圖特摩斯三世——這些都是歷史重建，經文本身始終沒有給名字。
  sources:
  - GT_拾穗
  source_files:
  - ccbiblestudy_GT_exodus_5.txt
- title: 比東
  path: link_folder/地點/比東.md
  summary: |
    第5章沒有再提比東，但賈斯樂郝威《聖經難解經文詮釋手冊》在討論本章法老是誰時，把比東的名字當作年代重建的佐證：依 Velikovsky-Courville 修訂法，出埃及發生在主前1440年、當時的法老應是東（Thom），「這與出埃及記一章11節所記載的以色列人為奴所發生的城——比東（Pithom）相符（意即『東』的居所；abode of Thom）」。
  relation: |
    這個字源說法與出1所收的解釋並不相同：GT 華爾頓《出埃及記背景注釋》把比東解作埃及語的比亞頓（Pi(r)-Atum，意即「亞頓神之地業」），賈斯樂則把它讀成某位法老名字（Thom）的居所，並用它來支持一整套修訂過的埃及年代。同一個地名被兩種年代方案各自引為證據，本身就說明出埃及年代之爭有多倚賴這類字源與地望的推定。
  sources:
  - GT_拾穗
  source_files:
  - ccbiblestudy_GT_exodus_5.txt
