- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: |
    本章中亞倫與摩西一同首次見法老，開口傳達神言（v1）。法老斥責摩西和亞倫「為什麼叫百姓曠工」（v4）。結尾官長埋怨的是摩西和亞倫二人（v20-21），但只有摩西回到神面前（v22）——GT《中文聖經註釋》對此有一個文本上的觀察：第20節的「亞倫」有可能是修訂者的加筆，而第23節摩西說「自從我去見法老，奉你的名說話」也再次顯示是他自己奉神的名說話，「頂多，亞倫是陪去了，但他只是個摩西的口，而不是負有使命的使者」。同一份注釋另提醒，3:18神原本吩咐的是摩西和以色列的長老同去見王，這裡卻是摩西和亞倫。
  relation: |
    亞倫在本章的角色是摩西的同伴，同受法老藐視和百姓埋怨。他的經驗構成事奉者必經的考驗：與領袖同受苦、同被誤解。KC暗示摩西和亞倫在官長埋怨時「默默轉離」，這是受苦僕人的典型反應——不作辯護，轉向神。
