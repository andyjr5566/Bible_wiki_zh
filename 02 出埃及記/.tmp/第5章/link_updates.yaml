book: 出埃及記
chapter: 5
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: |
    本章記錄摩西和亞倫第一次到法老面前傳達神的命令（v1-3）。法老藐視拒絕後，摩西目睹百姓被加倍苦待、工頭挨打、官長向他抱怨（v20-21）。摩西在挫折中回到神面前，發出兩個「為什麼」與一句斷語：「你為什麼苦待這百姓呢？為什麼打發我去呢？……你一點也沒有拯救他們。」（v22-23）GT《中文聖經註釋》指出末句原文是雙同字的強調——「論拯救，你一點也沒有拯救你的百姓」；並說「回到耶和華那裡」不是指他回何烈山去，因為神既應許與他同在（3:12），摩西隨時都可以藉禱告回到神那裡與祂交通。
  relation: |
    本章是摩西從出4章順從的高峰跌入挫折的深谷。他首次經歷「順服神反而使情況更糟」的信仰考驗。各家對摩西這番話的評價並不一致：KC 直言「他的聲音裡有不信」——摩西的眼目不再定睛於耶和華，而是注視百姓，他以為百姓會賞識他的事奉卻大失所望，「但僕人不該看他的工場，應當看他的差遣者」；GT《聖經精讀本》則為他辯護：「這句話不是出於氣忿」，而是人不能理解神的計畫時誰都會向神發出的哀求（詩74:1；89:46），先知哈巴谷提出過同樣的問題（哈1:13-17），得到的答覆是「雖然遲延，還要等候，因為必然臨到，不再遲延」（哈2:3）；CT 的〔話中之光〕更正面：「信靠神的人，碰到外面現實生活中的難處，反而會逼他們回到神面前，更多仰望神。」GT 丁良才則從另一個角度看這兩節的可信度：「後來的以色列人若要捏造本書的事，必定不寫這兩節的話。」本章結束時摩西仍在神面前（v22），表明他未放棄與神的關係，只是尚未學會定睛於差遣者而非結果。
  sources:
