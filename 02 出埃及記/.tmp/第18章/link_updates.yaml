- title: 革舜（摩西之子）
  path: link_folder/人物/革舜（摩西之子）.md
  summary: "v3 葉忒羅把革舜帶回摩西身邊，經文並重述命名的理由：「因為摩西說：我在外邦作了寄居的。」CT 給的原文字義是「異族人」，並指出這名字有兩種相反的讀法：「指逃離埃及而在米甸作了寄居的，藉給長子命名來表達他的孤獨和恥辱感」，或「指在那裡（即埃及）作了客旅，表明他對埃及不再有眷戀」。BH 說字根 ger 意為「外人」或「寄居者」，這名字保存的是摩西在米甸作外人的那段經歷。KC 從名字讀出預表：「革舜的意思是『寄居者』。他的名字提醒我們，基督像摩西一樣，曾是地上的寄居者，正如教會現今也是。」"
  relation: "革舜在本章沒有任何行動，出場的只是他的名字——而名字正是本章前半的骨架：兩個兒子的名字合起來就是摩西前半生的兩段。《丁道爾聖經註釋》把它與以利以謝並讀：「他的名字（『我神是幫助』）和革舜所代表的絕望相比，可以看出摩西信心重燃。」"
- title: 革舜名字的由來
  path: link_folder/原文/革舜名字的由來.md
  summary: "v3「我在外邦作了寄居的」在本章被再說一次。CT 的原文字義給「革舜」作「異族人」、「外邦」作「異邦的，外國的」、「寄居的」作「旅居者」，並列出兩種相反的解釋。BH 從字根入手：「革舜」出自希伯來字根 ger，意為「外人」或「寄居者」，反映摩西在米甸作為外人的處境；它並把這個身分接到來11:13，信徒承認自己在世上是客旅和寄居的。KC 也是從這個字義讀出基督與教會在地上的寄居身分。"
  relation: "出2:22 的命名是在事發當下，出18:3 的重述則是在出埃及之後——同一個名字，講的已經是一段結束了的日子。這也是本章唯一一次回頭解釋舊名的地方。"
- title: 流珥葉忒羅與何巴的稱謂關係
  path: link_folder/解經爭議/流珥葉忒羅與何巴的稱謂關係.md
  summary: "v1 與 v27 是這個爭議在出埃及記裡最集中的兩處。CT 的分派是：流珥（出2:18）是本名，葉忒羅（出3:1）可能是他擔任祭司時的職稱，何巴（士4:11）可能是指摩西的內兄（民10:29）；它並指出「岳父」按希伯來原文「此字可作岳父和內兄兩種解釋」。它從 v27 反推身分：摩西「一面允許他的岳父葉忒羅一個人離去，另一面卻請求何巴同往迦南美地，由此可見，葉忒羅和何巴並非同一人」。GT《啟導本聖經腳註》的分派不同：「『葉忒羅』可能是稱號，義為『大人』，『流珥』才是他的名字。何巴很可能是摩西內兄的名字，因在原文『岳父』與『內兄』為同一字。」GT《丁道爾聖經註釋》則對 v27 與民10:29-32 的關係持保留：那裡「不清楚是岳父還是內兄」，也「沒有明言何巴（或流珥）有沒有答允摩西的請求」，但它補了一個反向線索——「然而他若沒有答應，基尼人後來怎會和以色列同住迦南，卻不容易解釋」"
  relation: "這個稱謂問題在出18章之所以要緊，是因為本章是這個人在全卷中戲份最重的一章：他來訪、獻祭、建議、離去。他到底叫什麼、與摩西是什麼關係，直接影響 v12 由誰主祭、v27 誰留下作嚮導這兩件事怎麼讀"
