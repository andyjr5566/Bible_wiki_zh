book: 出埃及記
chapter: 39
updates:
- title: 以弗得
  path: link_folder/原文/以弗得.md
  summary: '出39:2-7 用金線和藍色、紫色、朱紅色線並撚的細麻做以弗得；為以弗得做兩條相連的肩帶，接連在以弗得的兩頭；其上巧工織的帶子和以弗得一樣的做法，用以束上，與以弗得接連一塊；又琢出兩塊紅瑪瑙鑲在金槽上，刻以色列兒子的名字，安在兩條肩帶上作紀念石。CT 的〔原文字義〕給「以弗得」為「祭司披肩或斗篷」。GT《聖經精讀本》解肩帶的意義：「以弗得的兩條肩帶: 掛在大祭司肩上的東西,象徵著力量和責任,刻以色列12支派之名的寶石意味著全以色列在神的保護之下。」同一來源指出以弗得因用金而象徵榮耀：「不管在東西方,金子象徵著極高的榮耀,所以用其作的以弗得象徵著坐在神的右邊的我們永遠的大祭司,耶穌的榮耀。」BH：以弗得是大祭司的聖服，兩條肩帶承載刻著十二支派名字的紅瑪瑙，象徵大祭司把百姓擔在肩上帶到神面前——這正預表基督為祂的百姓擔負重擔（來4:14-16）。'
  relation: 本章把以弗得與胸牌的關係固定下來：胸牌要用藍細帶子繫在以弗得上，「不可與以弗得離縫」。兩者的分工也因此清楚——名字刻在肩帶上（擔負），也刻在胸牌上（親近）。CT 在話中之光說：「『為以弗得做兩條相連的肩帶』就是彼此聯絡。我們在教會中，當『用和平彼此聯絡』（弗4:3），聯絡的工作至關重要。」
- title: 內袍（雜色內袍）
  path: link_folder/主題/內袍（雜色內袍）.md
  summary: '出39:27「他用織成的細麻布為亞倫和他的兒子做內袍。」GT《聖經精讀本》給出原文：「織成的: 希伯來文是『編織』的意思。指有智慧的人織成的亞倫和他兒子的內袍。內袍: 指細麻布作的內衣。」GT 丁良才補上祭司平日的穿著慣例：「平常祭司的衣服都是白細麻布做的（結四十四17-18），唯獨他們的腰帶有雜色，大祭司當贖罪日的時候全身穿著白細麻衣（利十六4、23）。祭司當不供聖職的時候所穿的衣服大概和普通的人一樣（結四十二14，四十四19）。」BH：亞倫的兒子所穿的比大祭司簡單，卻同樣是精工織成的；這些衣服標示出他們的分別為聖與獻身事奉。'
  relation: 本章把內袍記在大祭司專屬的幾件之後，而它是亞倫與他兒子共有的一件——CT 由此讀出內在生活的普遍要求：「內袍預表著祭司的內在生活，祭司的內在生活必須是聖潔，是見得神見得人，無愧於心，是榮耀，是華美的。」丁良才指出的對照更顯出這件衣服的性質：祭司平日全白，唯獨腰帶有雜色。
- title: 冠冕（裹頭巾）
  path: link_folder/原文/冠冕（裹頭巾）.md
  summary: '出39:28「並用細麻布做冠冕和華美的裹頭巾，用撚的細麻布做褲子。」GT 丁良才把兩者的對象分開：「冠冕是特為大祭司預備的（二十八37-39），裹頭巾是為眾祭司（二十八40）。」GT《聖經精讀本》則指出中譯的用字與原文相反：「裹頭巾: 希伯來原文是指大祭司頭上戴的冠冕。冠冕: 希伯來原文指祭司戴的圓錐型冠冕。」CT 的〔原文字義〕給「冠冕」為「包頭巾」、「華美的」為「頭飾」、「裹頭巾」為「帽子」。GT《丁道爾聖經注釋》另從第30-31 節指出，那條藍細帶子與金牌合起來在本章被稱為「王冠」，而「由於帶子相當於古代近東帝王的『帶狀王冠』，這說法亦有可能」。'
  relation: 本章的用字給譯本留下了一個困難：中文的「冠冕」與「裹頭巾」在丁良才與《聖經精讀本》的說法裡指向相反的對象。CT 在話中之光取的是象徵的讀法：「神的工作當約束自己的頭腦（裹頭巾），讓主耶穌居首位（西1:18），這種樣才致成為屬靈的榮美。」而不論名稱如何對應，本章確定的是：大祭司頭上另有一塊刻著「歸耶和華為聖」的金牌，用藍細帶子繫上。
- title: 十二寶石（胸牌寶石）
  path: link_folder/主題/十二寶石（胸牌寶石）.md
  summary: 出39:10-14 胸牌上鑲著寶石四行：第一行紅寶石、紅璧璽、紅玉；第二行綠寶石、藍寶石、金鋼石；第三行紫瑪瑙、白瑪瑙、紫晶；第四行水蒼玉、紅瑪瑙、碧玉；「這些寶石都是按著以色列十二個兒子的名字，彷彿刻圖書，刻十二個支派的名字。」CT 在第13節加了一條很重要的備註：「十二種寶石的中文和英文翻譯名字並不一定正確，僅作參考。譬如當時尚無金鋼石diamond的切割方法，故可能是指另一種顏色相近的寶石。」CT 在第14節另指出十二個名字有兩種解法：「(1)左邊：流便，西緬，利未，猶大，但，拿弗他利；右邊：迦得，亞設，以薩迦，西布倫，約瑟，便雅憫。(2)沒有利未和約瑟，而被以法蓮和瑪拿西取代。」GT《聖經精讀本》指出排序的問題：「肩帶上的寶石上按年齡順序刻上了以色列支派的名字(28:10),胸牌上的寶石卻沒有具體的說明。可能和肩帶上的寶石一樣。」BH 同樣持保留：這些寶石的具體對應「會因翻譯與歷史理解而有出入」，但它們的象徵意義仍值得細究。
  relation: 本章逐行列出十二塊寶石，卻沒有指明哪一塊配哪一個支派——這使兩個問題同時懸著：石頭的名字對不對，以及名字的排序是什麼。CT 的兩條備註把這兩個問題都寫明了。而在這些不確定之上，各家一致的是它們的作用：GT《聖經精讀本》指出「胸牌上的寶石和肩帶上的寶石一樣,象徵以色列的12支派」，而 BH 說大祭司佩戴這些石頭，就是把全體百姓帶到神面前。
- title: 外袍（以弗得的外袍）
  path: link_folder/主題/外袍（以弗得的外袍）.md
  summary: '出39:22-26 用織工做以弗得的外袍，顏色全是藍的；袍上留一領口，口的周圍織出領邊來，彷彿鎧甲的領口，免得破裂；在袍子底邊上用藍色、紫色、朱紅色線並撚的細麻做石榴，又用精金做鈴鐺，把鈴鐺釘在袍子周圍底邊上的石榴中間，一個鈴鐺一個石榴。GT《聖經精讀本》解鈴鐺與石榴的用意：「以弗得的外袍: 指以弗得裡面的衣服。在其上掛鈴鐺和石榴的原因是,神的忠心的僕人不僅要用嘴作神話語的見證人,而且在行為上也要結出美麗的信仰的果子(加5:22,23)。」CT 從顏色讀出身分：「祭司的『外袍顏色全是藍的』，表示祭司乃是屬天的」，並在領口上加了一句：「『袍上留一領口』——『一』是神的數。這就表示讓主耶穌為頭，尊主為大之意……如果教會沒有讓主為頭，尊主為大，教會很快就會破裂分散。」BH：金鈴與石榴相間排列，鈴聲在大祭司進出聖所時可以聽見，石榴則是豐盛與果實的象徵。'
  relation: 本章是外袍由出28 的規格進入實做的一章，而它保留了兩處很具體的工藝細節：領邊要「彷彿鎧甲的領口」以免破裂，鈴鐺與石榴要一個間一個。CT 在話中之光把鈴鐺讀成事奉的警戒：「金鈴鐺是為著發出警戒的聲音。事奉主的人最大的毛病是『能說不能行』（太23:3），教訓別人而不教訓自己，這種現象乃是他們作工沒有果效的最大原因。」
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出39:1,5,7,21,26,29,31,32,42,43 「是照耶和華所吩咐摩西的」在本章出現十次——從以弗得（v1）、腰帶（v5）、寶石（v7）、胸牌繫住（v21）、鈴鐺石榴（v26）、腰帶（v29）、聖冠牌（v31）、完工總結（v32,42,43）。KC：本章十次出現「是照耶和華所吩咐摩西的」這句話——這強調了祭司聖衣的重要，並且沒有留下任何讓人憑想像發揮的餘地。CT：顯示摩西準確而詳細地順服了神命令中的每個細節。
  relation: 本章是「山上的樣式」在祭司聖衣層面的全面執行——「是照耶和華所吩咐摩西的」十次重述為全書之冠，顯明聖衣的每一細節（材料、顏色、寶石排列、鈴鐺石榴交替）都不可憑人意更改。
- title: 摩西的祝福
  path: link_folder/事件/摩西的祝福.md
  summary: 出39:43「耶和華怎樣吩咐的，他們就怎樣做了。摩西看見一切的工都做成了，就給他們祝福。」GT《中文聖經註釋》指出這個祝福有兩種可能的讀法：「這祝福，原文是可以對神和對人使用的。對神使用時，中文多用稱謝、讚美等詞句來繙譯。對人使用時，是祝福、賜福或讚揚、稱許的意義。所以，這裏固可以說摩西是求神賜福他們，也得解釋為摩西對他們讚許連連。」GT《聖經精讀本》從這一節讀出摩西的兩種形象：「①作為神的僕人盡心盡力的形象。從建造會幕的指示到建造過程的監督,最後確認完工,他出色的盡了自己的職責;②堅守神是唯一神的摩西的形象。他以神的吩咐為根基,保證一切器具都要按神的吩咐造」，並指出「摩西作為中保,憑神的權威祝福百姓」。GT 丁良才把本章與下一章的兩次賜福分開：「在本章裡會幕的工既已告竣，摩西就給百姓祝福（43），在第四十章裡會幕既已成立，神就賜福與百姓（四十33-34）。」GT《丁道爾聖經註釋》指出這一節「大概是故意引人聯想創世記一章31節」。BH：摩西的祝福表示認可與神的恩眷，可視為民6:24-26 祭司祝福的先聲。
  relation: 本章的祝福出現在一個很特別的時間點上：工完了，帳幕卻還沒立起來。丁良才指出摩西「沒有立時立幕，乃是等候耶和華的吩咐」——祝福不是落成典禮，而是驗收。GT《串珠聖經註釋》在思想問題裡記下一個延伸的讀法：加爾文認為這裡的「祝福」表示耶和華已悅納了百姓所作的工。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出39:32「帳幕，就是會幕，一切的工就這樣做完了。凡耶和華所吩咐摩西的，以色列人都照樣做了。」出39:33-41 逐項列出送到摩西面前的一切：帳幕與其器具、蓋與頂蓋、遮掩櫃的幔子、法櫃與槓並施恩座、桌子與陳設餅、燈臺與燈油、金壇與膏油香料門簾、銅壇與銅網器具、洗濯盆與盆座、院子的帷子柱子座門簾繩子橛子，以及聖衣。GT《中文聖經註釋》注意到第32節的譯文困難：「這句話再次給我們看到繙譯上的困難，因為在這裏是有兩個不同的名詞來形容聖幕。但無論如何，我們讀到這裏時，也會和編寫的作者一樣，為摩西和一切與這建造聖幕和其中一切器物的人舒一口氣。」GT《丁道爾聖經註釋》在第43節另指出一處用詞問題：「『會幕』此時尚未建成，所指的必然是早時較簡單的『帳棚』，和合本用了『會幕』一詞，不準確。」同一來源由用料辨識兩座壇：「『金壇』從所用的材料看，必然是指較小的香壇。同樣，從用料又可看出：下一節的『銅壇』才是獻祭用的大壇。」KC：帳幕還沒有立起來，但一切都已預備好了。
  relation: 本章是會幕全部部件完工的一章，也是它們第一次被列成一份完整清單的一章。GT《中文聖經註釋》指出這份清單的功能：「這段經文總結廿五至卅一章神所吩咐的，並在卅五1～本章31中，已經執行的，又將物品分類別陳列在摩西面前，摩西檢視後便為他們祝福。」而《聖經精讀本》提醒工匠與百姓的分工：「雖然實際作工的人是比撒列和亞何利亞伯等有智慧的人,但所有的百姓都用心和財物參與了這項工作。」
- title: 歸耶和華為聖
  path: link_folder/神學/歸耶和華為聖.md
  summary: '出39:30-31「他用精金做聖冠上的牌，在上面按刻圖書之法，刻著歸耶和華為聖。又用一條藍細帶子將牌繫在冠冕上。」GT《丁道爾聖經注釋》對「聖冠上的牌」給了一段考證：「這個用藍紫色的帶子繫於祭司裹頭巾上，刻『歸耶和華為聖』的金『花』或牌子，在此形容為『王冠』（參出二十八36、37）。其重要性和外貌，都因這稱呼更加顯然。本節的希伯來文又可表示金牌和帶子合起來才稱為『王冠』。由於帶子相當於古代近東帝王的『帶狀王冠』，這說法亦有可能。」GT《聖經精讀本》從資格的角度讀它：「聖冠上的牌……歸耶和華為聖: 意味著事奉神的聖職人員首先要聖潔。象徵性表示若不依靠潔淨我們罪行的耶穌基督的寶血,誰也不可能親近神(來10:18-22)。」'
  relation: 這塊牌是本章聖衣清單的最後一件，也是位置最高的一件——戴在頭上，寫著整套聖衣的目的。丁道爾指出的「帶狀王冠」讀法給了它一層政治性的意味：大祭司頭上戴的，形制上近於古代近東君王的冠。而牌上的字沒有留下任何模糊：歸耶和華為聖。
- title: 比撒列（Bezalel）
  path: link_folder/人物/比撒列（Bezalel）.md
  summary: 出39:1-2 比撒列用藍色、紫色、朱紅色線做精緻的衣服，又為亞倫做聖衣；他用金線和藍色、紫色、朱紅色線並撚的細麻做以弗得。CT 的〔原文字義〕在第1節註明「比撒列」在該處原文並無此字。GT《聖經精讀本》在第32節指出分工：「雖然實際作工的人是比撒列和亞何利亞伯等有智慧的人,但所有的百姓都用心和財物參與了這項工作」；在第33節又說：「比撒列和亞何利亞伯等有智慧的人把按摩西所說的造的東西全部送了過來。這體現了他們對神的忠心和誠實。」BH：比撒列是神所揀選、被神的靈充滿的巧匠（出31:1-5），以弗得是大祭司的聖服，象徵他在神與百姓之間的中保身分。
  relation: 本章是比撒列的名字在出埃及記中最後一次出現，而它出現在聖衣段落的開頭——他親手做的最後一件，是給別人穿的衣服。GT《串珠聖經註釋》在思想問題裡把這一點提成一個問題：比撒列等人所造的聖衣是為亞倫和他兒子作的，表面看來只加增他人的榮耀，對自己毫無作用。
- title: 聖衣（祭司聖服）
  path: link_folder/主題/聖衣（祭司聖服）.md
  summary: 出39:1「比撒列用藍色、紫色、朱紅色線做精緻的衣服，在聖所用以供職，又為亞倫做聖衣」；出39:41「精工做的禮服，和祭司亞倫並他兒子在聖所用以供祭司職分的聖衣」。GT 丁良才指出「聖衣」在此的所指：「『聖衣』——就是大祭司在贖罪日所穿的白細麻的聖衣（利十六4、32）。」CT 則對「精工做的禮服」保留：「意義不確定，可能是指大祭司和祭司們在聖所供職時必須穿上的『精緻的衣服』（參1節；三十一10；三十五19）。」GT《中文聖經註釋》指出出39:41 這一節「全節與卅五19的話完全相同」。KC：這一章反覆出現「照耶和華所吩咐摩西的」，強調的正是祭司衣服的重要——它關乎主耶穌與信徒的祭司職事，同時也不給人的想像留下任何餘地。BH：這些衣服包括以弗得、胸牌、外袍、內袍、冠冕與腰帶，各有象徵與功能；大祭司的服飾是他在神與以色列之間中保身分的視覺表達。
  relation: 本章把聖衣造成了，卻沒有人穿上——穿戴要等到利8 的承接聖職。CT 在話中之光由此帶出祭司職分的來歷：「能夠在神面前供祭司的職分，乃是一種無上的特權。舊約時代，本來以色列人是祭司的國度（出19:6），全民都是祭司，卻因悖逆而將祭司的職份拱手讓給亞倫的家族。」
- title: 胸牌（決斷胸牌）
  path: link_folder/原文/胸牌（決斷胸牌）.md
  summary: '出39:8-21 用巧匠的手工做胸牌，和以弗得一樣的做法；胸牌是四方的、疊為兩層，長寬各一虎口；上面鑲寶石四行；用精金擰成如繩子的鍊子，兩個金槽兩個金環安在胸牌的兩頭，以藍細帶子把胸牌的環子和以弗得的環子繫住，「不可與以弗得離縫」。GT《串珠聖經註釋》指出本段與出28 的兩處差別：「這裡只提到『胸牌』，不再用『決斷的胸牌』一名；這段也沒有提及『烏陵和土明』。」GT《聖經精讀本》給出尺寸與細節：「祭司胸前的胸牌是左右各一虎口(約22.8釐米)的正方形」；「金槽: 金環可能用於掛胸牌。28:23節中沒有提及這個東西」；並解「不可與以弗得離縫」為「暗示胸牌的功能,不能離開以弗得。即在以弗得的根據上,才能有胸牌」。GT 靈修版聖經注釋另給出功能上的說明：「胸牌是用彩色的細麻線織成的大約23公分正方的牌子，前面鑲有十二塊寶石，每塊刻有一個支派的名字。這表示大祭司在神面前代表以色列全族。」BH：一虎口約九英吋，是拇指尖到小指尖張開的距離；四方而摺為兩層的設計既能牢固盛裝十二塊寶石，也便於安放烏陵和土明。'
  relation: 本章的胸牌少了兩樣東西：一個名字（「決斷的」）和一對石頭（烏陵和土明）。串珠與丁道爾都注意到了，而丁道爾提出的理由是天然物件不需製造。CT 在話中之光把胸牌的位置讀成代求：胸牌貼在心口，「本節表示代禱告者必須有的靈德與靈智」。而「不可與以弗得離縫」這條規定，《聖經精讀本》讀得最直接：胸牌的功能不能離開以弗得。
- title: 腰帶（繡花腰帶）
  path: link_folder/主題/腰帶（繡花腰帶）.md
  summary: '出39:29「又用藍色、紫色、朱紅色線，並撚的細麻，以繡花的手工做腰帶。」GT 丁良才指出本節比出28:39 多了一項材料：「『……並撚的細麻……』——（二十八39），沒有這一句。」GT《聖經精讀本》指出腰帶在祭司衣服中的獨特性：「腰帶: 雖然是用單數表示的,但其適用於亞倫和他兒子穿的所有衣服上。祭司的衣服中(內袍、腰帶、冠冕),唯一用藍色紫色朱紅色線的就是腰帶。」同一來源在第5節另指出帶子的象徵：「帶子意味著,工作前的心態和奉獻(約13:4)。」'
  relation: 腰帶是祭司衣服中唯一有顏色的一件——其餘全白。這使它在本章的清單裡特別顯眼，也讓丁良才注意到的那個小差異（本章比出28:39 多了「並撚的細麻」）有了分量：同一件衣服，兩次記載的材料清單並不完全一樣。
- title: 藍色、紫色、朱紅色線
  path: link_folder/主題/藍色、紫色、朱紅色線.md
  summary: 出39:1-3,5,8,24,29 以弗得、胸牌、外袍石榴、腰帶均用藍色紫色朱紅色線。三色線從會幕幔子（出36章）延伸到祭司聖衣（出39章），貫穿整個會幕的紡織品。CT靈意：藍色線表徵屬天（出24:10）；紫色線表徵君尊；朱紅色線表徵流血犧牲。
  relation: 本章記載三色線在祭司聖衣中的全面使用——從以弗得到腰帶，藍紫朱紅貫穿全部七件聖衣；三色線從會幕幔子延伸到祭司身上，表徵基督屬天、君尊、犧牲的三重性質不僅覆蓋神的居所，也穿戴在事奉者身上。
- title: 褲子（細麻布褲子）
  path: link_folder/主題/褲子（細麻布褲子）.md
  summary: 出39:28「用撚的細麻布做褲子。」CT 的〔原文字義〕給「褲子」為「長內褲」。GT 丁良才指出這一件的對象：「『褲子』——是特為眾祭司做的（二十八42-43注）。」BH：亞倫的兒子作祭司所穿的包括內袍、腰帶與裹頭巾，同樣是精工製作的；祭司職分是世襲的，由亞倫一脈相傳，而這些衣服標示著他們的分別為聖。
  relation: 褲子是本章聖衣清單中最不顯眼的一件，卻也是唯一一件不為著「榮耀華美」而設的——出28:42-43 說明它的用意是遮掩下體。本章只用半句話帶過，材料是撚的細麻布。
- title: 金線
  path: link_folder/原文/金線.md
  summary: 出39:2-3、5、8 以弗得、巧工織的帶子與胸牌都用金線；第3節並記下金線的做法：「把金子錘成薄片，剪出線來，與藍色、紫色、朱紅色線，用巧匠的手工一同繡上。」GT《丁道爾聖經注釋》指出這是出28 沒有的細節：「這技巧是個有趣的細節（舊約其他地方沒再提及）。它解釋了以色列織造祭司衣料時，使之更顯華美的金線。」GT《串珠聖經註釋》：「解釋以色列人製作金線的方法，確是巧奪天工。」GT《聖經精讀本》：「不管在東西方,金子象徵著極高的榮耀,所以用其作的以弗得象徵著坐在神的右邊的我們永遠的大祭司,耶穌的榮耀。」KC 同樣指出這是出28 所沒有的一個細節——織進以弗得裡的金線；他把它讀成一幅圖畫：神性的榮耀（金）透過主耶穌聖潔人性的每一種特質照射出來；有關祂位格的一切真理彼此相連，可以分辨，卻不能分割——正如祂在船上因疲乏而以人的樣式睡著，過一會兒卻站起來以神的身分斥責風和海（可4:35-41）。BH：把金子錘成薄片再剪成線，是古代工藝中製作金箔與金絲的作法，顯出所獻材料的貴重與工藝的精細。
  relation: 本章記下了出28 只給結果、沒給作法的一道工序：金線是怎麼來的。錘、剪、繡三個動作把「金」從塊狀變成可以織進布裡的絲——CT 在靈意上讀為「表徵祂道成肉身，在聖靈的引導（巧匠的手工）下歷經苦難（錘、繡）」。而這道工序之所以被記下來，正合本章的性質：本章關心的不只是成品，也是成品怎麼做成的。
- title: 鈴鐺與石榴（大祭司袍子）
  path: link_folder/原文/鈴鐺與石榴（大祭司袍子）.md
  summary: 本章第24至26節記載工匠在以弗得外袍的底邊，用藍色、紫色、朱紅色線並撚的細麻做石榴，又用精金做鈴鐺，將鈴鐺釘在袍子周圍底邊上的石榴中間，交替排列用以供職，是照耶和華所吩咐摩西的。
  relation: 鈴鐺與石榴的交替排列具體展現了大祭司聖服的屬天要求，結合了外在事奉的宣告（鈴鐺發聲）與內在生命的豐盛（石榴結實），預表基督對教會積極供應生命並消極發出警戒的事奉。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 出39:1「又為亞倫做聖衣」；出39:27「他用織成的細麻布為亞倫和他的兒子做內袍」；出39:41「祭司亞倫並他兒子在聖所用以供祭司職分的聖衣」。GT 丁良才指出本章「聖衣」的所指是「大祭司在贖罪日所穿的白細麻的聖衣（利16:4、32）」，並分辨冠冕是特為大祭司預備的、裹頭巾是為眾祭司的。BH：亞倫作首任大祭司，所穿的衣服使他分別出來擔任聖職；這一整套服飾——以弗得、胸牌、外袍、內袍、冠冕、腰帶——是他在神與以色列之間中保身分的視覺表達。
  relation: 本章造出了亞倫要穿的一切，卻沒有人穿上——穿戴要等到承接聖職。而聖衣是比撒列等人做的，亞倫本人在本章完全沒有出場：他的名字只出現在「為誰做」的位置上。GT《串珠聖經註釋》在思想問題裡把這件事提成一個問題：所造的聖衣「表面看來只加增他人的榮耀，對自己毫無作用」。
- title: 撚的細麻
  path: link_folder/原文/撚的細麻.md
  summary: 出39:2、5、8、24、28、29 以弗得、巧工織的帶子、胸牌、袍子底邊的石榴、褲子與腰帶都用撚的細麻。CT 的〔原文字義〕給「撚的」為「搓捻而成的，扭結編織而成的」。GT 丁良才指出本章第29節比出28:39 多了一項材料：「『……並撚的細麻……』——（二十八39），沒有這一句。」BH：細麻是以亞麻織成的高品質布料，以潔白耐久著稱；在祭司服飾中它象徵純潔與公義，正是站在神面前所必需的。
  relation: 細麻在本章貫穿全部聖衣，卻在不同的件上扮演不同角色：在以弗得與胸牌上，它與金線和三色線混織成彩色的錦；在內袍與褲子上，它是純白的。丁良才由此指出祭司平日的穿著慣例——「平常祭司的衣服都是白細麻布做的（結44:17-18），唯獨他們的腰帶有雜色」。
- title: 精金
  path: link_folder/主題/精金.md
  summary: 出39:15、25、30、37 胸牌上用精金擰成如繩子的鍊子；用精金做鈴鐺；用精金做聖冠上的牌；送交摩西的清單中有「精金的燈臺」。CT 的〔原文字義〕在相關各節解「精金」為純度最高的金。BH：金在聖經中象徵神性、純潔與君尊，用在祭司服飾上顯出這職分的貴重與所代表的神聖權柄；金的不朽壞也對應神永恆不變的性情。
  relation: 本章的精金集中在三處最貼身、也最顯眼的地方：胸前的鍊子、袍底的鈴鐺、額上的牌。這三處正好對應祭司的三種動作——擔負、行走、站立。而金線則是精金的另一種形態：本章第3節記下它是怎麼從金塊變成絲的。
- title: 紅瑪瑙（紀念石）
  path: link_folder/原文/紅瑪瑙（紀念石）.md
  summary: '出39:6-7「又琢出兩塊紅瑪瑙，鑲在金槽上，彷彿刻圖書，按著以色列兒子的名字雕刻；將這兩塊寶石安在以弗得的兩條肩帶上，為以色列人做紀念石。」GT《聖經精讀本》解肩帶與石頭的意義：「以弗得的兩條肩帶: 掛在大祭司肩上的東西,象徵著力量和責任,刻以色列12支派之名的寶石意味著全以色列在神的保護之下」，並指出「肩帶上的寶石上按年齡順序刻上了以色列支派的名字(28:10)」。BH：刻石如刻圖章，意味著永久與權柄；大祭司佩戴這兩塊石頭，就是把十二支派擔在肩上帶進神的面前，這也預表基督為祂的百姓擔負重擔。'
  relation: 本章有兩處刻名字的地方：肩帶上的兩塊紅瑪瑙，和胸牌上的十二塊寶石。分工很清楚——肩上是擔負，胸前是親近。而紅瑪瑙的排序在本章有明說（按以色列兒子的名字），胸牌上的卻沒有，《聖經精讀本》只能推測「可能和肩帶上的寶石一樣」。
- title: 烏陵和土明
  path: link_folder/原文/烏陵和土明.md
  summary: 出39:8-21 記胸牌的製作，卻沒有提到烏陵和土明。GT《串珠聖經註釋》注意到這一點並提出理由：「這段與28章的記載有一些明顯的分別，例如這裡只提到『胸牌』，不再用『決斷的胸牌』一名；這段也沒有提及『烏陵和土明』（參28:30），或許烏陵和土明是自然界原有物體，不須用人工製造，故沒有在此提及。」GT《丁道爾聖經注釋》給的是同一個理由，並補上一個平行例證：「不提這兩塊求問用石頭的原因，可能因為它是天然物件，不用製造。參較建築耶和華祭壇所用的石頭，也必須是天然石塊（出二十25），不得經過人手雕琢。」GT 靈修版聖經注釋則說明它們的用途：「胸牌上也有口袋，裡面裝有烏陵和土明，大祭司使用它向神求問，以確定神為全族所定的旨意。」
  relation: 這是全卷唯一一次以「不出現」來說明烏陵和土明性質的地方：出28 把它們放進胸牌，出39 造胸牌時卻不提。串珠與丁道爾給的解釋是同一個——本章是一份製造清單，而它們不是製造出來的。丁道爾舉的平行例子把這一點說得更清楚：耶和華的壇也必須用未經人手雕琢的天然石塊。
- title: 祭司聖衣的件數之爭
  path: link_folder/解經爭議/祭司聖衣的件數之爭.md
  summary: '出39:1-31 逐件記下聖衣的製作：以弗得（v2-7）、胸牌（v8-21）、外袍（v22-26）、內袍（v27）、冠冕與裹頭巾（v28）、褲子（v28）、腰帶（v29）、聖冠上的牌（v30-31）。而各件的歸屬在各家說法中並不完全一致：GT 丁良才指出「冠冕是特為大祭司預備的（二十八37-39），裹頭巾是為眾祭司（二十八40）」、「『褲子』——是特為眾祭司做的」；GT《聖經精讀本》則指「裹頭巾: 希伯來原文是指大祭司頭上戴的冠冕。冠冕: 希伯來原文指祭司戴的圓錐型冠冕」——兩者的對應正好相反。CT 對第41節「精工做的禮服」同樣保留：「意義不確定。」'
  relation: 本章的清單提供了一份可以與出28 對照的實做記錄，而對照之下浮現的正是件數與歸屬的問題：哪幾件是大祭司獨有的、哪幾件是眾祭司共有的，中譯的用字（冠冕／裹頭巾）在丁良才與《聖經精讀本》之間指向相反。GT《聖經精讀本》另指出腰帶「雖然是用單數表示的,但其適用於亞倫和他兒子穿的所有衣服上」。
- title: 蒙靈充滿的智慧恩賜（比撒列、亞何利亞伯）
  path: link_folder/神學/蒙靈充滿的智慧恩賜（比撒列、亞何利亞伯）.md
  summary: 出39:3、8 兩處記「用巧匠的手工」：金線與三色線一同繡上，以及胸牌的做工。GT《聖經精讀本》在第32節指出分工：「雖然實際作工的人是比撒列和亞何利亞伯等有智慧的人,但所有的百姓都用心和財物參與了這項工作」；在第33節又說：「比撒列和亞何利亞伯等有智慧的人把按摩西所說的造的東西全部送了過來。這體現了他們對神的忠心和誠實。」BH：這些工匠是被神的靈充滿、蒙神裝備來承擔這項聖工的（出31:1-5）。
  relation: 本章是這份恩賜結出成品、並且交件的一章。GT《串珠聖經註釋》在思想問題裡另指出一件本章之外的事：比撒列和亞何利亞伯「並沒有隱瞞『秘方』，而是把技術傳授他人（出35:34）」——恩賜在他們身上不只被使用，還被傳遞。
- title: 聖所
  path: link_folder/地點/聖所.md
  summary: 出39:1「在聖所用以供職」；出39:41「祭司亞倫並他兒子在聖所用以供祭司職分的聖衣」。CT 的〔原文字義〕給「聖所」為「分別，神聖」，並指出聖衣是「大祭司和祭司們在聖所供職時必須穿上的」。BH：聖所是神在祂百姓中間的居所，而祭司的衣服象徵在祂面前供職所要求的聖潔。
  relation: 本章兩次以「在聖所用以供職」為聖衣定位——衣服的意義不在衣服本身，而在它要被穿去的地方。這也解釋了本章為何要把每一件都做到「照耶和華所吩咐摩西的」：進入聖所的人，連穿什麼都不由自己決定。
- title: 大祭司基督（來4：14-15）
  path: link_folder/互文/大祭司基督（來4：14-15）.md
  summary: 出39:22「他用織工做以弗得的外袍，顏色全是藍的。」CT 由這個顏色讀出祭司的屬天身分，並接到希伯來書：「祭司的『外袍顏色全是藍的』，表示祭司乃是屬天的。我們蒙恩得救以後，仍然在地上生活……但感謝神，我們『有一位已經升入高天尊榮的大祭司，就是神的兒子耶穌…』而且我們這樣一位大祭司，『並非不能體恤我們的軟弱』（來4:14-15）。」BH：以弗得的肩帶承載刻著十二支派名字的紅瑪瑙，象徵大祭司把百姓擔在肩上帶到神面前，這正預表基督為祂的百姓擔負重擔（來4:14-16）。
  relation: 本章把大祭司的服飾一件一件造出來，而每一件都指向同一個職分：代表、擔負、親近。CT 抓住外袍的顏色（全藍）作為屬天身分的標記，而 BH 抓住的是肩帶與胸牌上的名字。兩條線在希伯來書那位「升入高天尊榮的大祭司」身上會合。
- title: 義行的細麻（啟19：8）
  path: link_folder/互文/義行的細麻（啟19：8）.md
  summary: '出39:27「他用織成的細麻布為亞倫和他的兒子做內袍」；出39:28「用撚的細麻布做褲子」。GT《聖經精讀本》給出原文：「織成的: 希伯來文是『編織』的意思。」BH：細麻常與純潔和公義相連——啟19:8 以細麻為聖徒的義行；祭司衣服用細麻，正顯出在神面前供職所要求的聖潔。CT 對內袍的靈意讀法相應：「內袍預表著祭司的內在生活，祭司的內在生活必須是聖潔，是見得神見得人，無愧於心，是榮耀，是華美的。」'
  relation: 本章的細麻分成兩種用法：與金線和彩色線混織的（以弗得、胸牌、腰帶），和純白的（內袍、褲子）。純白的那幾件都是貼身的——這正合 CT 把內袍讀成「祭司的內在生活」的思路：外面可以有顏色，裡面必須是白的。
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 出39:32「帳幕，就是會幕，一切的工就這樣做完了」；出39:42-43 一切工作都是照耶和華所吩咐摩西做的，摩西看見一切的工都做成了，就給他們祝福。KC：會幕還沒有立起來，但一切都已預備好了；主耶穌也照樣看我們一切與教會有關的工作，即使它在世人面前仍是隱藏的，並照著我們順服的程度賜福給我們。GT 丁良才指出時序：「雖是做成了，摩西卻沒有立時立幕，乃是等候耶和華的吩咐（出40:12）」，而「在本章裡會幕的工既已告竣，摩西就給百姓祝福；在第四十章裡會幕既已成立，神就賜福與百姓（出40:33-34）」。
  relation: 本章是神同在的預備階段的終點：材料收齊了、器具造好了、聖衣也做完了，人這一邊該做的都做完了。但帳幕仍然是平放的一堆部件——立起來與榮光充滿，要等到下一章。丁良才把兩章的賜福分開：出39 是人祝福人，出40 是神賜福人。
- title: 約櫃
  path: link_folder/主題/約櫃.md
  summary: 出39:35「法櫃和櫃的槓並施恩座」——約櫃出現在送交摩西的清單裡。CT 指出這份清單「本句是指幕幔、幕板、柱子和相關器物」之後，逐項列出至聖所與聖所的器具。GT《中文聖經註釋》：「和這四節經文有關的器物，是帳幕內至聖所與聖所中擺設的物件和其附件。」BH：法櫃安放法版，是神與百姓立約的憑據，也是會幕最核心的物件。
  relation: 本章是約櫃第一次以「交件」的身分出現：它被抬到摩西面前受檢視，而不是被安放進至聖所。安放要等到出40:20-21。GT 丁良才指出同一份清單裡的「遮掩櫃的幔子」就是至聖所當中的內幔，「這幔子遮掩法櫃使人不能看見」。
- title: 施恩座
  path: link_folder/主題/施恩座.md
  summary: 出39:35「法櫃和櫃的槓並施恩座」。施恩座在送交摩西的清單裡與法櫃同列，兩者一同被抬到摩西面前受檢。BH：施恩座是約櫃的蓋，是神與人相會之處，也是贖罪日彈血的地方。
  relation: 本章的清單把施恩座緊接在法櫃之後——這正是它們在至聖所裡的關係：一個在下，一個在上。而在這一刻它們還沒有被組合起來安放，只是完工待驗的兩件成品。
- title: 陳設餅桌子
  path: link_folder/主題/陳設餅桌子.md
  summary: 出39:36「桌子和桌子的一切器具並陳設餅」。CT 解為「陳設餅的桌子和相關器物，以及陳設餅」。GT《啟導本聖經腳註》在出37 曾指出那裡未提陳設餅，而本節的清單正是餅第一次出現的地方。
  relation: 出37 造桌子時沒有提餅，本章的交件清單卻把「陳設餅」與桌子一同列出——串珠在出37 說餅要到出40:23 才提及，而本節顯示至少在清單上它已經備妥。桌子與餅一起交到摩西面前，等候擺設。
- title: 金燈臺
  path: link_folder/主題/金燈臺.md
  summary: '出39:37「精金的燈臺和擺列的燈盞，與燈臺的一切器具，並點燈的油」。GT 丁良才解「擺列的燈檯」為「擺列在枝子上的七盞燈」；GT《聖經精讀本》給出原文：「擺列的: 希伯來原文是『配置』、『整理』的意思。」BH：點燈用的是純橄欖油，在聖經中是聖靈的象徵；油使燈持續燃燒，正如聖靈托住信徒的屬靈生命。'
  relation: 本章的清單把燈臺、燈盞、器具與燈油列在一起——燈臺是唯一連燃料都一併交件的器具。這也顯出它的功能性質：別的器具是擺設或盛器，燈臺卻要天天被點著。
- title: 金香壇（香壇）
  path: link_folder/主題/金香壇（香壇）.md
  summary: 出39:38「金壇、膏油、馨香的香料、會幕的門簾」。GT《丁道爾聖經注釋》示範了怎麼從用料辨識這座壇：「『金壇』從所用的材料看，必然是指較小的香壇。同樣，從用料又可看出：下一節的『銅壇』才是獻祭用的大壇。」CT 同樣解為「金香壇和燒香的香料、聖膏油、會幕的門簾」。BH：金壇即香壇，位於聖所、幔子之前，壇上所燒的香象徵百姓的禱告升到神面前（詩141:2；啟8:3-4）。
  relation: 本章的清單用材料來區分兩座壇——這是全卷唯一一次把「金壇」與「銅壇」並列在相鄰兩節的地方，而丁道爾正是由此指出讀者可以憑用料判斷所指。金壇與膏油、香料同列，也顯出它們在功能上本是一組。
- title: 銅壇（燔祭壇）
  path: link_folder/主題/銅壇（燔祭壇）.md
  summary: 出39:39「銅壇和壇上的銅網，壇的槓並壇的一切器具，洗濯盆和盆座」。GT《丁道爾聖經注釋》由用料指出「下一節的『銅壇』才是獻祭用的大壇」，與前一節的金壇（香壇）分別。CT 同樣把本節解為院子裡的器物。BH：銅壇即燔祭壇，是院子中獻祭之處；銅象徵審判與忍耐，而它預表基督一次獻上自己成全了贖罪（來10:10）。
  relation: 本章的清單把銅壇與洗濯盆列在同一節——這正是它們在院子裡的位置關係：先過壇，再過盆。而金壇在前一節，銅壇在後一節，兩座壇在清單上的先後，正好與人進入的方向相反。
- title: 洗濯盆（銅盆）
  path: link_folder/主題/洗濯盆（銅盆）.md
  summary: 出39:39「洗濯盆和盆座」與銅壇同列在送交摩西的清單裡。BH：洗濯盆供祭司在進入會幕或就近壇之前洗濯之用，象徵事奉神所要求的潔淨；盆座使盆架高，也顯出敬拜中潔淨的重要。在新約，這一點成全於基督——祂用話語與犧牲潔淨信徒（弗5:26）。
  relation: 本章是洗濯盆完工交件的一章，而它的材料在出38:8 已經交代過：會幕門前伺候的婦人之鏡子。清單在此不再重述來歷，只把它與銅壇並列——院子裡的兩件銅器，一件對付罪，一件對付污穢。
- title: 會幕院子
  path: link_folder/主題/會幕院子.md
  summary: 出39:40「院子的帷子和柱子，並帶卯的座，院子的門簾、繩子、橛子，並帳幕和會幕中一切使用的器具」。CT 解為「與院子一切和相關器物」。GT《中文聖經註釋》：「這兩節經文所臚列的器物，是院子裏所擺設的，以及院帷與院圍門簾並帳幕和會幕中一切使用的器具。」
  relation: 本章的清單把院子的全部構件列在最後一項器物欄——帷子、柱子、座、門簾、繩子、橛子。而「繩子」是這份清單裡少數出38 沒有明列的東西：出38:20、31 只記橛子是銅的，本節才把繩子一併點出。
- title: 內幔（隔聖所至聖所的幔子）
  path: link_folder/主題/內幔（隔聖所至聖所的幔子）.md
  summary: '出39:34「染紅公羊皮的蓋、海狗皮的頂蓋，和遮掩櫃的幔子」。GT 丁良才指明這道幔子的身分：「『遮掩櫃的幔子』——就是至聖所當中的內幔，這幔子遮掩法櫃使人不能看見（出40:21）。」GT《聖經精讀本》：「遮掩櫃的幔子: 指遮蓋至聖所的幔子。因為遮蓋至聖所裡的櫃和施恩座,即神臨在的地方,所以叫作遮掩櫃的幔子。」'
  relation: 本章給了內幔一個功能性的名字：「遮掩櫃的幔子」。這個名字不是從材質或位置來的，而是從它擋住什麼來的——它擋住的是法櫃與施恩座，也就是神臨在的地方。而在清單上，它與外層的兩張皮蓋列在同一節：由外到內的三層遮蓋，一次交清。
- title: 聖膏油
  path: link_folder/原文/聖膏油.md
  summary: 出39:38「金壇、膏油、馨香的香料、會幕的門簾」。CT 解為「聖膏油」，與金香壇、燒香的香料同列。BH：聖膏油是用橄欖油調和特定香料製成的（出30:22-33），用來膏抹會幕、器具與祭司，使之分別為聖；它象徵聖靈的同在與能力，也預表受膏者基督。
  relation: 本章是聖膏油完工交件的一章，而它在清單上緊挨著金香壇與香料——三樣同屬「香」這一類的聖物一起交出。它的用途要到膏抹會幕與祭司時才顯出來，那是出40 與利8 的事。
- title: 聖香（清淨聖潔的香）
  path: link_folder/原文/聖香（清淨聖潔的香）.md
  summary: 出39:38「金壇、膏油、馨香的香料、會幕的門簾」。CT 解「馨香的香料」為在金香壇內燒的香。BH：這香是專為敬拜調製的特定配方（出30:34-38），香氣蒙神悅納，象徵百姓可蒙悅納的禱告與敬拜；它與聖膏油一樣不可仿製私用。
  relation: 本章的清單把香與膏油、金壇並列，顯出它們在功能上的一組關係：壇是燒的地方，香是燒的東西，膏油是使壇成聖的憑藉。三樣一起交到摩西面前，等候被安放與使用。
- title: 橛子與繩子的預表
  path: link_folder/神學/橛子與繩子的預表.md
  summary: 出39:40「院子的門簾、繩子、橛子，並帳幕和會幕中一切使用的器具」。橛子與繩子在送交摩西的清單中被明確列出，與帷子、柱子、座並列。CT 解本節為「與院子一切和相關器物」。
  relation: 在這份清單裡，橛子與繩子和柱子、帷子平起平坐——它們同樣是要交到摩西面前受檢視的成品。這正合 KC 在出38 的說法：柱子引人注目，橛子看來微不足道，然而兩者都不可少；沒有橛子，柱子就站立不住。
