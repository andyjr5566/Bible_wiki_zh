book: 出埃及記
chapter: 21
updates:
- title: 太5：21-22
  path: link_folder/互文/太5：21-22.md
  summary: BH 註解出二十一12「打人以致打死的」時指出，主耶穌在馬太福音五21-22 把這條誡命推進到心的層面，指出動怒與恨也在其中；BH 在二十一14 與二十一28 下同樣引這段說明意圖與心思才是審判的著眼點。
  relation: KC 也說主在馬太福音五章所處理的不只是行為，而是行為與言語背後的心。出二十一12-14 已經以動機分別蓄意與誤殺，太五21-22 把同一個判準推到還沒有動手的階段。
- title: 加5：1
  path: link_folder/互文/加5：1.md
  summary: CT 在出埃及記第21章的靈訓要義裡，把第2節「第七年他可以自由」列為第三項，並註明其屬靈意義：「但神仍尊重我們各人自由的意志（加五1）。」
  relation: 出二十一2 的第七年是律法給的自由，加五1 則是基督所賜的自由。CT 把兩者並讀，指出神在兩處都沒有把人的意志取消——本章第5節那位奴僕，正是自由被尊重之後的自願選擇。
- title: 太5：17
  path: link_folder/互文/太5：17.md
  summary: BH 註解出二十一12「必要把他治死」時指出，主耶穌是律法的成全者，並要審判活人死人（太五17）；BH 在二十一15 與二十一20 下同樣引這一節，說明道德律的延續性以及那位完全遵行律法者的地位。
  relation: 本章的死刑條例在新約不再執行，但 BH 指出其中的道德原則並未廢去。太五17 是這種連續性的根據：律法不是被取消，而是被成全。
- title: 耶31：33
  path: link_folder/互文/耶31：33.md
  summary: BH 註解出二十一1「你在百姓面前所要立的典章是這樣」時指出，摩西把律法擺在百姓面前這個動作，預表了新約——神要把祂的律法寫在信徒心上（耶三十一33），而摩西作為中保正是基督的預表。
  relation: 出二十一1 的典章是寫在石版與書卷之外、擺在百姓面前的條文。BH 用耶三十一33 指出這個「擺在面前」最終要變成「寫在心上」，律法的位置從外面移到裡面。
- title: 古代近東法典
  path: link_folder/背景/古代近東法典.md
  summary: 出二十一章的典章與古代近東法典在案例類型上高度重疊，本章來源實際點名的有漢摩拉比法典、埃施嫩納法典、中亞述法律、蘇美法律、赫人法律、利皮特—伊施他爾法典與烏加列文獻。GT《舊約聖經背景註釋》列出的具體對照包括：債奴期限「漢摩拉比法典將債奴的時限定為三年，出埃及記二十一2則是六年」；同態復仇「以其基本格式，出現在漢摩拉比法典（第196～197條）中；然而接下來的法律，卻因當事人社會地位（自由人、奴隸、貴族）而有差別」；輕藐父母「蘇美法律准許將不認父母的兒子賣為奴隸，漢摩拉比法典規定切除毆打父親之兒子的手」。
  relation: 差異最大的一條在人命的估價。GT《啟導本聖經腳註》指出「《漢慕拉比法典》第251條規定，如有牛只觸死人的事發生，牛主只須賠償一點銀子便可了事。但摩西律法重視人命」；同書另註近東法律「規定傷及奴僕的眼或骨，只照奴價一半給償（第199條）」，本章則是釋放。但本章並未取消一切身分差別——GT《舊約聖經背景註釋》同時指出以色列的奴隸「地位不與一般人平等，若是傷害了自由人，他們所要受的刑罰比自由人傷害自由人重很多」。
- title: 希伯來人
  path: link_folder/人物/希伯來人.md
  summary: 出二十一2「你若買希伯來人作奴僕」。CT 的原文字義給「來自遠處的人，過河的人」，文意註解則指「『希伯來人』即指以色列人」，並在話中之光說：「『希伯來人』說出同是神的兒女，雖然在世上的身分地位不同，但在神面前都有同享自由的權利。」GT《舊約聖經背景註釋》為這個稱呼加上社會處境：它「是指沒有地業、變得赤貧的以色列人。這人雖然可能要將自己或家人出賣為債奴，他依然保有社群一份子的權益，不可永遠作為奴隸」。GT《中文聖經註釋》另從這個用詞推測條例的年代：「這裏仍用希伯來人的名稱，亦可見這律例的古遠。」
  relation: GT《丁道爾聖經註釋》指出本章奴僕條例的特別之處，正在於它沒有訴諸以色列獨有的盟約，而是訴諸這個共同稱呼——「主人和奴隸同為『希伯來人』」；同書並指出「『希伯來』一詞可以追溯到很早的年代，其意義十分廣泛」，因此這些律法「有可能是遠在摩西以前，族長時代的遺訓：亞伯蘭亦稱為『希伯來人』（創十四13）」，但也坦承這看法「是無法證實的」。
- title: 舍客勒
  path: link_folder/原文/舍客勒.md
  summary: 出二十一32 記牛觸死僕婢，牛主須將「銀子三十舍客勒」給他們的主人。本章兩份來源給的換算略有出入：CT 註「舍客勒」為「重量和幣制單位（相當於11.5公克）」，GT《聖經精讀本》則作「銀子一舍客勒大約11.4g」。CT 並把這個數目放進當時的估價表裡對照：「『銀子三十舍客勒』大概是古時奴僕的身價，一般二十歲至六十歲男人的估價是五十舍客勒（參利二十七3），而主耶穌被猶大出賣的價銀只有三十塊錢（參太二十六15）。」
  relation: 本章的三十舍客勒是律法為僕婢定下的固定賠償額，與同章第30節牛主贖命價銀由雙方議定形成對比。GT《啟導本聖經腳註》提醒同一單位在不同時代的購買力並不可直接比較：「約瑟當年被賣是二十舍客勒（創三十七28）……但一舍客勒銀子的時值因時代而有不同，難加比較。」
- title: 安息年
  path: link_folder/神學/安息年.md
  summary: 出二十一2「他必服事你六年；第七年他可以自由，白白地出去」。各家都把這個節奏連回安息年：GT《串珠聖經註釋》說本節「顯示希伯來奴僕享有安息年的權利（利25:4）；他工作六年後，第七年可以『自由』，不再受束縛」；GT《中文聖經註釋》稱之為「這是像安息年般的給予禧年的恩典」；GT《丁道爾聖經註釋》也說「本節和『安息』的概念似乎有很明顯的關係」。BH 則從創造敘事說明第七年的意義：第七年在聖經神學中一向與安息和釋放相連，其根源在神第七日的安息。
  relation: 本章把六日工作、第七日安息的節奏放大成六年服事、第七年自由，使安息年的原則第一次落在人身自由上，而不只落在土地上。GT《舊約聖經背景註釋》就本章第10節另指出，債奴六年得釋這一點「很明顯與七日創世的循環對應」。
- title: 禧年（第五十年）
  path: link_folder/原文/禧年（第五十年）.md
  summary: 出二十一2 的六年之限與禧年並行，本章多家都提到兩者的關係。GT 丁良才說「這六年中若遇禧年，他就可以自由出去（利二十五39-41）」；GT《聖經精讀本》同樣說「其中如果有禧年，可以更提前獲得自由（利25:40）」；GT《丁道爾聖經註釋》則說「先來的倘若是『七七』的禧年，他顯然也同樣可得自由（利二十五）」；GT《中文聖經註釋》把第七年的釋放直接稱為「像安息年般的給予禧年的恩典」。此外，GT 丁良才記下猶太注釋家對第6節「永遠服事主人」的解法：那個「永遠」是「到下次的禧年」。
  relation: 本章的釋放有兩條時間軸：奴僕自己的第七年，以及全國共同的禧年，兩者以先到者為準。禧年因此成為本章六年之限的上限——即使服事未滿六年，禧年一到仍得自由；而它也被猶太注釋家用來限定第6節那個「永遠」的長度。
- title: 定言式法律
  path: link_folder/神學/定言式法律.md
  summary: GT《丁道爾聖經註釋》在出二十一1-6 下把這批律法歸入另一種文體：「這些都是西亞洲甚為普遍的『條件式』而非『定言式』（即本身並非原則，而是衍自原則）律法。但以色列則認為兩種律法都出乎神。」GT《聖經精讀本》也說這段立約書「的文體特徵是『若……可以……』式的」。但同章十二至十七節又不屬於這兩類——GT《丁道爾聖經註釋》稱之為「嚴峻的沙漠法律」：「下一組的律法既非『絕對式』、也非『條件式』，而是屬於介乎兩者之間的『分詞式』（participial），但比較接近前者；全部都以『必要把他治死』一句有力的希伯來語作結。」
  relation: 十誡是定言式的宣告，本章則以條件式的判例把那些原則落到具體情境上。但本章並非全是條件式：十二至十七節的四項死罪在文體上更接近定言式，這正是它們讀起來語氣像誡命而不像判例的原因。GT《丁道爾聖經註釋》並強調以色列對兩種文體的態度一致——「兩種律法都出乎神」。
