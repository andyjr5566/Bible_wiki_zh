book: "出埃及記"
chapter: 32
candidates:
  - name: "金牛犢事件"
    type: "事件"
    evidence: "出32:1-6 百姓見摩西遲延不下山，聚集到亞倫那裡要求造神像引路；亞倫收百姓耳上金環鑄成牛犢，宣告向耶和華守節，百姓次日獻燔祭平安祭，坐下吃喝、起來玩耍。CT：直接違反十誡第二誡「不可為自己雕刻偶像」，模仿埃及人拜牛神（Apis）習俗。GT：原文「神像」的動詞是複數形態，不能解作君尊複數，百姓要的是「眾神」而非單指耶和華；丁道爾指出這是性急與看得見之神的需要所致；舊約聖經背景註釋指出金牛犢崇拜所觸犯的是十誡第二誡（不可造偶像）而非第一誡（不可有別神），因百姓仍稱其為領他們出埃及的耶和華。KC：亞倫將牛犢的形狀賦予只有神才配得的尊榮，百姓忘記了神一切的神蹟（詩106:19-23）；林前10:6-7 保羅引此事警戒信徒不可效法以色列人貪戀惡事、拜偶像。BH：this act of idolatry directly violated the first two commandments given by God (Exodus 20:3-4)"
    surfaces:
      - phrase: "神像"
        verses: [1, 4, 8, 23, 31]
      - phrase: "牛犢"
        verses: [4, 5, 8, 19, 20, 24, 35]
      - phrase: "金像"
        verses: [31]

  - name: "亞倫"
    type: "人物"
    evidence: "出32:1-6,21-25,35 亞倫在百姓催逼下未求問神就自作主張，鑄造金牛犢、在牛犢前築壇、宣告守節；摩西下山責問時，亞倫推諉是百姓專於作惡，自己只是把金環扔進火中「這牛犢便出來了」。CT：亞倫是意志薄弱、順應民意過於堅守真理的領袖借鏡。GT：猶太人傳說戶珥曾抵擋百姓而被殺，故亞倫因懼怕而屈服（此說未必可靠）；亞倫「這牛犢便出來了」之語連三歲小孩都不會相信，其掩飾至少有三種可能：推卸責任、為同工戶珥掩護、或藉此反襯摩西品格之高貴。KC：亞倫將自己降為百姓的奴隸，代表百姓在神面前卻使自己受百姓擺佈。BH：his role here highlights his leadership failure, as he succumbs to the pressure of the Israelites；申9:20 記摩西曾為亞倫代求免其滅亡。已有條目「亞倫」"
    surfaces:
      - phrase: "亞倫"
        verses: [1, 2, 3, 4, 5, 21, 22, 25, 35]

  - name: "約書亞"
    type: "人物"
    evidence: "出32:17-18 約書亞聽見百姓呼喊的聲音，誤以為是營裡爭戰的聲音，摩西卻聽出是人歌唱的聲音。CT/GT：約書亞當時經歷尚淺（他是出17:8-13 擊敗亞瑪力人的戰士出身），此處顯出他與久經歷練的摩西之別；GT指出約書亞在摩西上山的三十四天中一直等候未離開。已有條目「約書亞」"
    surfaces:
      - phrase: "約書亞"
        verses: [17]

  - name: "摩西為百姓代求（金牛犢）"
    type: "互文"
    evidence: "出32:11-14,30-32 摩西兩次為犯罪的百姓向神代求：先求神不發烈怒、記念列祖之約，神就後悔不降禍；後更求神「倘或你肯赦免他們的罪……不然，求你從你所寫的冊上塗抹我的名」。CT：摩西的代求預表基督長遠活著替人代求（羅8:34、來7:25），甘心承擔罪過與賽53:12「他們的罪孽，他都擔當」相符。GT：摩西的代求有五種特色——切心實意、毫不為己、專求主榮、理由充足、大有功效；摩西求恩並非依賴百姓的善行，而是依賴神的尊名、榮耀、盟約。KC：摩西不能替百姓死，也不能為他們贖罪；唯有基督這位完全無罪的人才能真正替人贖罪。BH：Moses acts as an intercessor, a role that foreshadows Christ's mediatory work (1 Timothy 2:5)"
    surfaces:
      - phrase: "摩西便懇求耶和華"
        verses: [11]
      - phrase: "或者可以為你們贖罪"
        verses: [30]

  - name: "硬著頸項的百姓"
    type: "神學"
    evidence: "出32:9-10 耶和華對摩西說「我看這百姓真是硬著頸項的百姓」，欲向他們發烈怒滅絕之。CT/GT/BH：此為聖經慣用語，源自農夫喻像，形容不肯受人牽引駕馭的牛馬，日後屢次用以形容以色列的頑梗悖逆（出33:3,5、34:9、申9:6,13、10:16、代下30:8、36:13、詩75:5、耶17:23、徒7:51）"
    surfaces:
      - phrase: "硬著頸項"
        verses: [9]

  - name: "摩西摔碎法版（廢約的象徵）"
    type: "事件"
    evidence: "出32:15-19 摩西手拿兩塊法版下山，挨近營前看見牛犢與跳舞的人，便發烈怒把兩塊版扔在山下摔碎了。CT：石版摔碎並非單純洩憤，而具禮儀上廢除盟約的象徵意義，因百姓已先違背十誡的約（申9:17 摩西自述此事）；神並未因此責備摩西，可見要緊的是律法的精意而非外面的規條字句。GT：摔碎法版表明以色列人與神立的約已完了；丁道爾指出摩西打碎石版正如百姓所行的相符，表示盟約既遭違背便宣告無效。舊約聖經背景註釋：打碎刻了立約條款的石版，是典型廢除盟約的象徵性行動"
    surfaces:
      - phrase: "把兩塊版扔在山下摔碎了"
        verses: [19]

  - name: "利未人受聖職討罪"
    type: "事件"
    evidence: "出32:26-29 摩西站在營門中呼召「凡屬耶和華的，都要到我這裡來」，利未的子孫都到他那裡聚集，奉命各人殺弟兄同伴鄰舍，那天百姓中被殺的約有三千；摩西宣告「今天你們要自潔，歸耶和華為聖」。CT：此事是利未支派受聖職服事神的契機（申33:9 摩西祝福十二支派時尊榮利未人此舉）。GT：「自潔」原文直譯是「今天你們的手已滿了為神」，即受聖職之意（七十士譯本比照出28:41 按手將他們分別為聖而譯）；利未支派當時是摩西本族，這關係或使他們一直忠於摩西與耶和華。BH：the Levites' loyalty here is rewarded later when they are chosen to serve in the tabernacle (Numbers 3:5-10)"
    surfaces:
      - phrase: "凡屬耶和華的，都要到我這裡來"
        verses: [26]
      - phrase: "利未的子孫"
        verses: [26, 28]

  - name: "從冊上塗抹（生命冊）"
    type: "互文"
    evidence: "出32:32-33 摩西求神「倘或你肯赦免他們的罪……不然，求你從你所寫的冊上塗抹我的名」，耶和華回答「誰得罪我，我就從我的冊上塗抹誰的名」。KC/CT：此「冊」即後來聖經中生命冊的概念（詩69:28「願他們從生命冊上被塗抹」、賽4:3、但12:1、路10:20、啟3:5、13:8），摩西甘願被塗抹以代贖百姓之罪的心志，預表基督替罪人受死（賽53:12）；但唯有基督才能真正成就代贖，摩西不能替百姓死。GT：舊約聖經背景註釋指出神明的帳簿在古美索不達米亞是很普遍的概念，簿上記載某人註定的命運和賞罰。BH：the 'book' likely refers to a divine record of those who belong to God, akin to Paul's expression in Romans 9:3"
    surfaces:
      - phrase: "從你所寫的冊上塗抹我的名"
        verses: [32]
      - phrase: "我就從我的冊上塗抹誰的名"
        verses: [33]

  - name: "亞伯拉罕"
    type: "人物"
    evidence: "出32:13 摩西代求時提及神向亞伯拉罕、以撒、以色列起誓應許後裔如天上的星那樣多、迦南地永遠為業。CT/GT：摩西懇求的根據不在百姓的善行，而在神向列祖所起的誓、立的約不能更改。已有條目「亞伯拉罕」"
    surfaces:
      - phrase: "亞伯拉罕"
        verses: [13]

  - name: "以撒"
    type: "人物"
    evidence: "出32:13 摩西代求時提及神向亞伯拉罕、以撒、以色列起誓應許後裔如天上的星那樣多、迦南地永遠為業。已有條目「以撒」"
    surfaces:
      - phrase: "以撒"
        verses: [13]

  - name: "坐下吃喝起來玩耍"
    type: "主題"
    evidence: "出32:6,19 百姓次日清早獻燔祭和平安祭，「就坐下吃喝，起來玩耍」；摩西下山時看見的是「人跳舞」。CT：原文字義「玩耍」是笑、玩弄；此處四重不合法——必須是祭司才有資格在壇上獻祭、所築的壇不是照山上的樣式、金牛犢不是耶和華真神、「玩耍」含有異教徒在獻祭時淫亂敗德的意味；並引高雅倫（Alan Cole）「本節形容的行徑對巴力崇拜者來說有宗教上的重要性，並沒有不道德的用意；但耶和華的看法就不同了」。GT《丁道爾聖經注釋》：譯作玩耍的希伯來動詞有「調情」的含義（參創二十六8），故此這些大概是狂飲的縱慾大會。GT《中文聖經註釋》：這玩耍的原文，是和創廿六8的「戲玩」以及創卅九14、17的「戲弄」相同，含有性事的意義，特別是濫交的含義。GT《啟導本聖經腳註》：「吃喝」指狂歡作樂，「玩耍」原文可指性事。GT《串珠聖經註釋》：實行宗教上的縱淫。GT《聖經精讀本》：這一切是照埃及人的風俗，埃及人祭拜他們的神時，在其面前築壇之後便開始吃喝、跳舞。林前10:7 保羅直接引用本節警戒教會。新建條目"
    surfaces:
      - phrase: "坐下吃喝，起來玩耍"
        verses: [6]
      - phrase: "又看見人跳舞"
        verses: [19]

  - name: "耶和華擊打百姓的瘟疫"
    type: "事件"
    evidence: "出32:35 全章的收束句「耶和華殺百姓的緣故，是因他們同亞倫做了牛犢」。CT〔原文字義〕「殺」擊打，打。GT《中文聖經註釋》：「這裏的殺字，是錯譯。原文是『擊打』。這個字只用在神對人施行災禍的擊打上，正如八2（中文繙成「糟蹋」）；十二23、27（中文都譯為「擊殺」）等所顯示的。但在通常的情形下，是使用瘟疫作擊打的方法。這大概就是現代中文譯本繙為『降下瘟疫』的原因。」GT《丁道爾聖經註釋》：「大概是指五經常見的那種立時而短暫的懲罰（如：民十一33）。然而本節亦可能遙指以後整代人要受的刑罰。」GT《舊約聖經背景註釋》：「古代近東到處的無數史料，都曾論及流行性的疾病。經文沒有提到症狀，所以這是什麼瘟疫也無從稽考。」新建條目"
    surfaces:
      - phrase: "耶和華殺百姓的緣故"
        verses: [35]

  - name: "推諉罪責"
    type: "神學"
    evidence: "出32:21-24 摩西責問「這百姓向你做了什麼？你竟使他們陷在大罪裡」，亞倫兩重推諉：先諉過百姓「這百姓專於作惡，是你知道的」（22節），再推說是出於神蹟「我把金環扔在火中，這牛犢便出來了」（24節）。GT《中文聖經註釋》：「連三歲小孩子也不會相信的這話，年紀老大的亞倫卻講出來了」，並列出三個可能：推卸責任、為同工戶珥作掩飾、藉此反襯摩西的高貴品質。GT 丁良才：亞倫「應當重重斥責百姓的錯謬才是正理（弗五11）」。與創3:12-13 亞當推給夏娃、夏娃推給蛇同一模式。已有條目「推諉罪責」"
    surfaces:
      - phrase: "這百姓專於作惡，是你知道的"
        verses: [22]
      - phrase: "我把金環扔在火中"
        verses: [24]

  - name: "耳環作異教護身符"
    type: "文化"
    evidence: "出32:2-3 亞倫叫百姓摘下妻子、兒女耳上的金環。GT《中文聖經註釋》：「古代中東一帶地方的人，有些地區到現在還是這樣，他們帶金（或銀）耳環或鼻環（參看創廿四47；士八24～27；賽三19、21等），並不單在為裝飾，也有求神明保佑的含意（參看創卅五3～4）。」CT〔話中之光〕：「耳上的金環」原是妝飾品，竟成了敬拜的偶像；偶像的材料出自妝飾，「牛犢的出來，不過把肉體的妝飾換成了宗教的妝飾，從敬拜耳環轉而敬拜金牛犢」。KC：「The ear is stripped of what it adorns」——耳朵被剝去妝飾，而耳朵的本分正是聽神的話。與創35:4 雅各家交出「耳朵上的環子」同一脈絡。已有條目「耳環作異教護身符」"
    surfaces:
      - phrase: "摘下你們妻子、兒女耳上的金環"
        verses: [2]

  - name: "金環"
    type: "背景"
    evidence: "出32:3 百姓就都摘下他們耳上的金環。CT：『耳上的金環』是妝飾品，可能得自埃及人（參十二35~36）；戴耳環須錘穿耳朵（參二十一6），表徵聽從。GT《啟導本聖經腳註》：「這些金耳環當為以色列人出埃及時向埃及人要的金銀珠寶的一部分（十一2；十二35）。」GT《丁道爾聖經注釋》：「『金環』，大抵是埃及奪來之物（出十二36）。歷史記載日後以色列男子有別於米甸的遠親，並不佩戴金子作為妝飾（士八24）。然而依照創世記三十五章4節，雅各時代的人都有佩戴這種耳環。」GT 丁良才：「古時候的男人也往往帶耳環（創三十五4，出三22，三十五22）。」與創24:22,47 的金環（鼻環）互為對照。已有條目「金環」"
    surfaces:
      - phrase: "百姓就都摘下他們耳上的金環"
        verses: [3]

  - name: "古代近東偶像崇拜"
    type: "背景"
    evidence: "出32:4,8 百姓指著鑄成的牛犢說「以色列啊，這是領你出埃及地的神」。GT《舊約聖經背景註釋》指出考古所出的公牛小像「長度都是只有三至七吋」，並說明金牛犢崇拜所觸犯的是十誡第二誡（不可造偶像）而非第一誡（不可有別神），因百姓仍稱其為領他們出埃及的耶和華。GT《聖經精讀本》：埃及人祭拜他們的神時，在其面前築壇之後便開始吃喝、跳舞，本章百姓「這一切是照埃及人的風俗」。BH：「The molten calf is significant as it reflects the influence of Egyptian culture」。與出20:4、出23:24 拆毀神像打碎柱像同一背景線。已有條目「古代近東偶像崇拜」"
    surfaces:
      - phrase: "這是領你出埃及地的神"
        verses: [4]

  - name: "代求"
    type: "神學"
    evidence: "出32:11-14,30-32 是全本聖經中保代求最完整的一次示範。摩西以三重理由求神轉意：百姓是神用大力大能的手領出來的（11節）、恐埃及人議論神懷惡意（12節）、求神記念向列祖所起的誓（13節）；第二次更以「從你所寫的冊上塗抹我的名」自願代替百姓受罰（32節）。GT《中文聖經註釋》：摩西「訴說百姓罪狀後，嗚咽的懇求赦免，甚至不能繼續說下去」。KC：「Moses, however, cannot die instead of the people」——摩西不能代死，這正指向真中保。與出8:8,12,28-30、出9:29,33 摩西為法老代求成同一序列而更進一層。已有條目「代求」"
    surfaces:
      - phrase: "求你轉意，不發你的烈怒"
        verses: [12]

  - name: "摩西"
    type: "人物"
    evidence: "出32 全章的主角：在山上領受法版、下山摔碎、責問亞倫、呼召利未人、兩次為百姓代求。CT 指出摩西的「發烈怒」與神的發烈怒（10節）用字相同，他是站在神的立場發義怒；GT 丁良才在33節下把摩西與基督列成十層對照（申18:15-18），第九層「都願意為弟兄犧牲自己」正是分界——神不讓摩西犧牲自己，卻讓耶穌犧牲了性命。KC：「Moses, however, cannot die instead of the people」。已有條目「摩西」"
    surfaces:
      - phrase: "摩西轉身下山"
        verses: [15]

  - name: "法版"
    type: "原文"
    evidence: "出32:15-16,19 摩西手裡拿著兩塊法版下山，「這版是兩面寫的，這面那面都有字，是神的工作，字是神寫的，刻在版上」，隨即在山下摔碎。KC：「在石版上神把自己啟示給祂的百姓。百姓卻已經確保：神旨意的啟示對他們是不必要的。律法是在山腳下被摔碎的，不是在山頂上。」須待出34 神重寫法版。已有條目「法版」"
    surfaces:
      - phrase: "手裡拿著兩塊法版"
        verses: [15]

  - name: "神的後悔與憂傷"
    type: "神學"
    evidence: "出32:14「於是耶和華後悔，不把所說的禍降與他的百姓。」GT《丁道爾聖經注釋》把它放回條件句的邏輯：「聖經明證神的應許和警告，始終是以人的回應作為條件；以西結書三十三章13～16節將這一點表達得最是清楚。」改變的不是神的本性與旨意，而是情況——摩西的代求成為新的因素。GT 另立「神會改變心意嗎」的難題專條處理此節。已有條目「神的後悔與憂傷」"
    surfaces:
      - phrase: "於是耶和華後悔"
        verses: [14]

  - name: "耶和華的使者"
    type: "神學"
    evidence: "出32:34 神仍命摩西領百姓前行，「我的使者必在你前面引路」。GT 丁良才指出「這使者不是二十三20、23節所論的使者」；GT《中文聖經註釋》則說「神的使者，就是神自己，仍然作他們的引路者」——兩說並存。已有條目「耶和華的使者」"
    surfaces:
      - phrase: "我的使者必在你前面引路"
        verses: [34]
