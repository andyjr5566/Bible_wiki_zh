- title: 以色列
  path: link_folder/原文/以色列.md
  summary: "v1 全會眾遵耶和華的吩咐按著站口從汛的曠野往前行；v5-6 摩西在以色列的長老眼前擊打磐石；v7「因以色列人爭鬧」；v8 亞瑪力人來和以色列人爭戰；v11 摩西何時舉手以色列人就得勝"
  relation: "本章是以色列人出埃及後第一次自己爭戰：KC 指在埃及他們是奴隸、沒有爭戰，在紅海是神爭戰，到了曠野卻有一場必須由百姓自己去打的仗——而勝負仍不在山下，在山頂舉手的那雙手上"
- title: 耶和華
  path: link_folder/神學/耶和華.md
  summary: "v2「為什麼試探耶和華呢」；v6「我必在何烈的磐石那裡，站在你面前」；v7「耶和華是在我們中間不是？」；v15 摩西築壇起名叫耶和華尼西；v16「耶和華已經起了誓，必世世代代和亞瑪力人爭戰」"
  relation: "本章的耶和華被百姓「試驗」——KC 指特別之處不是神試驗百姓，而是以色列在試驗神，向祂索求同在的憑據；而祂的回答是站在磐石那裡讓摩西擊打，並在得勝後被立為旌旗（尼西）"
- title: 埃及
  path: link_folder/地點/埃及.md
  summary: "v3「你為什麼將我們從埃及領出來，使我們和我們的兒女並牲畜都渴死呢？」——第四次怨言仍以埃及為對照"
  relation: "與14:11、15:24、16:3 同一線：每逢困境便回頭望埃及；CT 指這話「表明他們只在意眼前的難處，卻把他們從前的困境忘得一乾二淨」；而摩西手中正拿著「先前擊打河水的杖」——同一根杖在埃及使水變血，在何烈使磐石出水"
- title: 西乃山的地理
  path: link_folder/背景/西乃山的地理.md
  summary: "v1 利非訂與 v6「何烈的磐石」是全卷地望之爭的兩個支點。主南部的一方：GT《啟導本聖經腳註》把利非訂考證為西乃半島南部的拉法伊德城（Wadi Refayid），「其地近摩西山（Jebel Musa），傳統的西奈山所在地」；GT《舊約聖經背景註釋》從路線推論同一結論；GT《丁道爾聖經註釋》同意這個考證，另記下「亞喀巴灣東岸的拉非德（er-Rafid）山脈」一說。主北部的是 GT《中文聖經註釋》，它在註 v6 何烈時說「從這名詞和下節的兩個地方的名詞，都可以使我們比較相信神的山，並不在西乃半島的南部，而在西乃半島的北部」，並在註 v8 時據亞瑪力地在猶大南部再推一次：「這也說明傳統認神的山是西乃半島的南端的錯誤。」GT《串珠聖經註釋》不選邊，只說利非訂「正確位置不詳」"
  relation: "西乃山的位置在本章不是背景而是論據——《中文聖經註釋》正是拿利非訂、何烈、瑪撒米利巴這三個地名當作神的山在北部的證據，而《丁道爾聖經註釋》則因南部說而必須假定「利非訂十分接近西乃山，以致山腳可以延伸到利非訂」。同一批地名，兩種地圖"
- title: 何西阿與約書亞改名時機與字意之解經爭議
  path: link_folder/解經爭議/何西阿與約書亞改名時機與字意之解經爭議.md
  summary: "v9「摩西對約書亞說」是聖經中第一次出現這個名字。GT《啟導本聖經腳註》按傳統說法處理：原名「何西阿」義為「拯救」，摩西給他易名為「約書亞」義為「耶和華拯救」（民13:16），而「約書亞」是「耶何書亞」的縮寫，新約「耶穌」即其希臘文寫法。GT《丁道爾聖經註釋》則在此提出時序上的保留：「嚴格來說，這時他仍然使用舊名何西阿。包含耶和華名字的『約書亞』，顯然是到了加低斯才給他起的」（民13:16）。GT《中文聖經註釋》注意到本節的敘述方式本身就不尋常：「這是本書首次提到他的名字，卻並沒有介紹他的來源和職責」"
  relation: "出17:9 正是這個爭議最早的落點——民13:16 的改名記載在時序上晚於本章，因此本章用「約書亞」稱呼他，要麼是追溯性的用法（摩西晚年成書時用讀者共知的名字），要麼改名時機另有說法。《丁道爾聖經註釋》選前者並明說「嚴格來說」的保留，是各家中唯一把這個時序差直接寫出來的"
