organization: "本章一口氣記了三災（第二、三、四災），並且是**術士退場、分別開始、法老學會討價還價**的一章。\n\n### 經文大綱\n\n1.\
  \ **第二災：蛙災**（1-15節）\n2. **第三災：蝨災**（16-19節）\n3. **第四災：蠅災**（20-32節）\n\n### 一、蛙災（1-15節）\n\
  \n> [!note] 為什麼是青蛙？\n> **CT／丁良才／《啟導本》／《精讀本》一致指出**：古代埃及人視青蛙為神聖動物，牠標誌那掌管生育的女神——赫克特（Heqet），蛙頭女神，司生育與助產。丁良才補一句關鍵：**「因此埃及人不敢殺害青蛙。」**\n\
  >\n> **KC 說得最尖**：「青蛙被埃及人視為聖物、受尊敬，因此不可被殺。如今這些偶像，在神審判的手下，成了一場災。」\n>\n> **但《舊約背景註釋》給了一個很誠實的保留**：「女神赫克特是青蛙的形狀，並司助產。但卻難以想像這災怎能夠說成是她被擊敗。」——它認為更直接的因果是：水中和河邊填滿腐魚，很自然就把青蛙趕到岸上（承接第一災）。\n\
  >\n> **《丁道爾》從語言學補一筆**：「蛙」可能是個擬聲詞，即「哇哇叫的動物」。舊約提及青蛙的，只有本段和兩首敘述這事的詩篇（詩78:45；105:30）。\n\
  \n**蛙災不傷人，卻最叫人受不了** 《中文聖經註釋》寫得很生動：「在全部十災中，蛙災可能是最不恐怖的——因為青蛙不會咬人，也不使人懼怕。但是，蛙災卻是使人最討厭的。試想：滿目所見的都是跳來跳去的青蛙，滿耳所聽的盡是咯咯的蛙叫，滿鼻所聞的又是噁心的青蛙腥臭。加上青蛙也需要飲食、也會排泄——所以青蛙的確會糟蹋四境。」\n\
  \n第1節耶和華吩咐摩西去見法老：「[[容我的百姓去]]，好[[在曠野事奉神|事奉我]]（שַׁלַּח אֶת־עַמִּי וְיַעַבְדֻנִי，H7971\
  \ 搭配 H5647）。」第2節宣告「我必使青蛙糟蹋你的四境（נֹגֵף אֶת־כָּל־גְּבוּלְךָ בַּצְפַרְדְּעִים，H5062\
  \ 搭配 H6854）」。\n\n**並且「糟蹋」這個字很重**：原文 נָגַף（*nagaph*，H5062）基本意思是「擊打／重擊」（賽19:22）或「擊殺」（出12:13,23）——《中文聖經註釋》指出「在舊約聖經中，其施行動作者惟獨是神，絕未有用於他神的行動的。可見這災的嚴重性。」\n\
  \n「進你的[[爐灶和摶麵盆|爐灶和你的摶麵盆]]」——\n\n**這一災打在埃及人最敏感的地方：潔淨** 丁良才：「古時候好潔淨的人中當推埃及人為首。埃及的祭司穿細麻布衣服；按古時的史家所記，他們白日兩次、黑夜兩次，用涼水沐浴全身。百姓也好洗澡，祭司又常謹防各樣污穢——所以這災叫他們十分厭惡。」\n\
  \n《精讀本》：「宮殿、臥房、摶麵盆，這些是埃及人看作最清潔的地方——如今被他們自己視為聖物的青蛙弄髒了。」\n\nKC 讀出一層應用：**「青蛙進到摶麵盆裡，表示這污穢已經混進了食物。」**\n\
  \n「[[埃及行法術的|行法術的]]也用他們的邪術照樣而行」——**《串珠》一句話就點破了這裡的諷刺**：**「他們不但沒有除滅災禍，反而使境況更惡化。」**《中文聖經註釋》問得更狠：「在到處都是青蛙的時候，獨裁者應當要他那行法術的將青蛙消滅或驅除才對。他沒有這樣做，卻叫他們也用邪術照樣而行，叫青蛙上了埃及地——使災害更為嚴重了。」\n\
  \n艾基斯的處理很務實：「這不是說行法術的也能生出青蛙。他們的方法可能與今天的專業魔術師沒有兩樣——術士引出的青蛙，在數量上遠比摩西所造成遍地的青蛙少得多；這些青蛙可能是術士預先預備的，就像魔術師帽子內的兔子一樣。」\n\
  \n#### 法老第一次求代禱（8-14節）\n\n**法老的三種「謙卑」** 丁良才數得很細：「法老在這事上顯出三種謙卑的心意：①承認耶和華有權柄，能驅逐青蛙離開他；②承認摩西、亞倫的禱告有能力；③應許讓百姓去。」——**「雖是這樣，法老見災鬆了，就又不肯容百姓去（15節）。」**他的比喻很傳神：**「人拉弓，弓隨手彎；手鬆，弓仍復原。」**\n\
  \n**但《串珠》看出這是一個狡猾的談判**：「他雖然說『我就容百姓去祭祀耶和華』，但究竟哪些人可以參與祭祀、在哪一處祭祀，他早已保留餘地，不加以說明。」——**這個保留，要到25節才露出真意。**\n\
  \n「[[任憑你吧]]（הִתְפָּאֵר עָלַי，H6286）」——\n\n**這句話原文其實很客氣** 《丁道爾》：「任憑你吧」直譯是「榮耀你自己吧」，可能是對君主的敬稱。《中文聖經註釋》：「中文的翻譯似乎不甚客氣。原文卻是對王恭謹的說法，直譯應是：『請給我光彩吧！』意即由你指定時間。」\n\
  \n**這句話的分量在於它把主權交還給神**：《丁道爾》：「這話又清楚顯示災難是神所引來、神所帶走的。『神的時候』的概念再次得以強調——祂要災禍何時離開，災禍就何時離開。」\n\
  \n**法老說「明天」**——CT／丁良才／《中文聖經註釋》都推測：**他大概盼望到了次日災難或能自己消去**（或認為青蛙這樣多，不可能一下子解決）。摩西卻一口應承下來：「可以照你的話吧，好叫你知道沒有像耶和華我們神的。」——CT：**「摩西對神的話相當有把握，所以他對法老的回應也相當有自信。」**\n\
  \n「眾人把青蛙聚攏成堆，遍地就都腥臭」——\n\n**死青蛙的腥臭，是法老「講價」時沒算到的** 《串珠》／《中文聖經註釋》都讀出這個諷刺：「這可能是素有行政經驗、善於講價卻居心叵測的獨裁者所沒有預先想到的——青蛙的死屍和遍地腥臭，是他在『講價』時沒有向摩西提及的。」\n\
  \n第15節「法老見災禍鬆緩（הָרְוָחָה，H7309），就[[法老心剛硬|硬著心]]（וְהַכְבֵּד אֶת־לִבּוֹ，H3513）」——\n\
  \n**「硬著心」在這裡用的是「使之重」** **《舊約背景註釋》提供了本章最精采的一條背景**：「本節所用的動詞（כָּבֵד H3513）與前面的不同，意思是『使之重／使之沉重』——因此與埃及一個人所共知的意象有關。在《亡經》中審判的一幕裡面，死者的心放在天平之上，與一條羽毛（代表司真實和正義的女神瑪阿特〔Ma'at〕）互稱，來決定他要被帶進快樂的來生，還是遭受吞吃。」\n\
  \n——「增加法老之心的重量，就是表示他來生要面臨厄運已是定數。它和英語俗諺『在棺材上多加一根釘子』差不多，都有使無可避免的事加速發生的意思。」\n\nCT 的〔話中之光〕轉得很實際：**「正如法老的表現，人們在患難中許願，但得了平安時卻不還願。」**KC：「那些抗拒神清楚說話的人，等到神下一次說話時，就更難被說服了。」\n\
  \n### 二、蝨災（16-19節）\n\n**這一災沒有預告。**丁良才給的理由很直接：**「法老既是失了信用（15節），神這一次就沒有使摩西警誡他。」**——並且他順帶點出一個結果：「神這一次沒有警誡法老，因此術士也沒有預備的機會。」\n\
  \n第16節亞倫伸杖擊打地上的塵土（עֲפַר הָאָרֶץ，H6083 搭配 H776），使塵土變作蝨子（כִנִּם，H3654 / H3654B）。**「蝨子」到底是什麼？**\
  \ **各家都承認：不確定。**原文 כִּנִּים（*kinnim*，H3654）在聖經中用法特殊，語義考證多元：\n- **和合本小字**：或作虼蚤。\n\
  - **七十士譯本／武加大譯本／《耶路撒冷聖經》／猶太哲學家菲羅**：譯作**蚊蚋**。\n- **《舊約背景註釋》／《每日研經叢書》**：**大部分研究都認為最可能是蚊子和扁蝨**——**前者可以在氾濫後留下的大量死水潭中滋生。**\n\
  - **《精讀本》**：「埃及的蚊子特別小，但叮咬的程度非常厲害。這小東西追擊人無處躲藏，甚至鑽入人的眼睛或鼻子。」（菲羅：它不單咬人後使之癢得難受，也會進入人的鼻孔和耳朵，甚至傷害眼睛的瞳孔。）\n\
  \n《中文聖經註釋》的結論很誠實：**「至於這小昆蟲，我們既無法考證，便仍以蝨子稱之。」**\n\n**這一災為什麼特別狠？**丁良才點出對埃及祭司的殺傷力：「埃及人好潔，為祭司的要常剃除頭髮和全身的汗毛，穿著細麻衣——因此這蝨子災就越發叫他們難忍。」《精讀本》補完了這個邏輯：「埃及的祭司按規矩每三天要剃頭、沐浴，之後用無瑕疵的動物獻祭。但由於這場災難，所有的動物都變得污穢、有了傷痕，根本不能獻祭。」——**術士連自己的宗教都運轉不下去了。**\n\
  \n「擊打地上的**塵土**」——CT／BH 都注意到這個字：**人和牲畜都是用地上的塵土造成的**（創2:7,19）。CT 的〔話中之光〕：「地受擊打生出蝨子，一面表明這是出於神的作為，另一面也說出神稍微放鬆一下祂『托住萬有』（來1:3）的權能手，就會產生自然界的變異而造成災害。」\n\
  \n**這是本章的轉折點：術士敗了** **「行法術的也用邪術要生出蝨子來，卻是不能。」**\n\n**CT 的判斷**：「邪術只能用障眼法騙人，卻不能使無生物變成生物——他們的能力僅能到此為止。」〔話中之光〕：**「活物只能『生出』，不能『造出』。」**\n\
  \n**KC 說得最深**：**「當生命從死的塵土中被帶出來的時候，撒但的能力就到了盡頭。」**\n\n《中文聖經註釋》還補了一刀：「於是在人身上和牲畜身上都有了蝨子——行法術的人也不能例外；他們也自身難保了。」\n\
  \n「這是[[神的手段]]」——\n\n**原文是「神的指頭」** **CT／《串珠》／《丁道爾》／《中文聖經註釋》一致指出**：**「神的手段」原文直譯是「神的指頭」**（*\
  \ Elohim*）。\n\n**丁良才把神權柄的三種標記排出來**：\n\n| 標記 | 程度 | 經文 |\n|---|---|---|\n| **神的指頭**\
  \ | 微小的權柄 | 出8:19；路11:20 |\n| **神的手** | 略大的權柄 | 出3:20 |\n| **神的膀臂** | 更大的權柄 | 出15:16\
  \ |\n\n**——連神「一根指頭」，術士就全軍覆沒了。**\n\n**這個「指頭」在聖經裡還有兩處極重的用法**（KC／《中文聖經註釋》都列）：**①「兩塊法版是神用指頭寫的」**（出31:18；申9:10）——**顯明祂話語的權柄**；**②「我觀看你指頭所造的天」**（詩8:3）——**顯明祂創造的能力。**\n\
  \n**KC 更把它連到新約**：路11:20「我若靠著神的能力（原文：神的指頭）趕鬼」，平行的太12:28 作「我若靠著神的靈趕鬼」——所以「神的指頭」就是聖靈。——「惟有神的聖靈，能在一個由塵土所造、死在罪中的人心裡，賜下新的生命」（羅8:11）。\n\
  \n**但要留意術士說這話的分寸**（《中文聖經註釋》／《精讀本》）：「他們所指的神，並不是真神，乃是埃及人所信的眾神中的某一個神……這句話並不代表他們真的認識了唯一的神，只是承認有一種超自然的存在在幫助以色列。」\n\
  \n丁良才順帶留了一句很有意思的觀察：**「反對神的人往往不由自主地就為真理作見證。」**（比方：法利賽人，約11:47-48；官長，徒4:16；被巫鬼附的使女，徒16:17。）\n\
  \n### 三、蠅災（20-32節）\n\n「你清早起來，法老來到[[尼羅河|水邊]]」——**這是第二組的首災**（KC：第一、四、七災都是清早去見法老，指向每一次新的開始）。KC：「耶和華差摩西清早到尼羅河邊站在法老面前，意味著不只摩西起得早，法老也起得早——法老無疑是去尼羅河邊行他的偶像敬拜。世人有時在他們所寄託幸福的各樣儀式上，是很有紀律的；信徒反倒可以從他們身上學一課。」\n\
  \n丁良才另補一個對照：摩西與法老相見時的氣氛，大概和亞哈與以利亞相見時彼此所說的話相仿（王上21:20）。KC 也指出同一點：**「亞哈和法老都忘了，是他們自己把所負責的百姓拖進了災禍。」**\n\
  \n> [!note] 「成群的蒼蠅」原文是「混雜群」\n> 第21節神警告要叫成群的蒼蠅進入埃及——**原文只有一個字 עָרֹב（*arob*，H6157），是集合名詞，指成群的飛蟲或混雜群體。**\n\
  > - **《丁道爾》**：直譯可作「混雜群」……經文可能不是指一個品種，而是被腐蛙引來、各種成群的飛蟲。\n> - **七十士譯本**譯作**「狗蠅」**；**武加大譯本**作**各類飛蟲**；**《耶路撒冷聖經》**作**牛虻**。\n\
  > - **菲羅**用傳奇筆法形容：「正如大群雜亂的野獸——獅子、熊、豺狼、豹子……許多食人的鳥群。」\n> - **《舊約背景註釋》給了最具體的推測**：最普遍的詮釋是學名\
  \ Stomoxys calcitrans 的品種——因為牠能夠傳播皮膚性炭疽（與後來的畜疫、瘡災兩災有關）。**「這些昆蟲既是害蟲，又傳播病菌，所以說遍地被牠們所敗壞。」**\n\
  >\n> **譯名不定，但各家一致：這群飛蟲極其可怖。**（12:38 的「閒雜人」出自同一字根。）\n\n> [!quote] 從這一災起，神開始「[[分別百姓|分別]]」\n\
  > **這是十災中第一次明說把以色列人分別出來**（《中文聖經註釋》）。\n>\n> **為什麼前三災不分？**丁良才提出一個很有分量的推想：**前三災以色列人可能也受了些連累**（好叫神藉這些災難懲罰熬煉祂的百姓）；**而法老或者因此起了三種錯誤的感想，使自己越發固執**：\n\
  > 1. **神的權柄有限**，不能保護以色列人；\n> 2. **神的愛心有限**，不看顧以色列人；\n> 3. **神不能降重災到極處**，恐怕以色列人也被除滅。\n\
  >\n> ——「所以神往後將歌珊地和埃及地分別出來：一面勉勵以色列人，一面使法老和他的臣僕知道，祂不但有愛心看顧祂的百姓，也有權柄能保護他們。」（9:4,26；10:23；11:7；12:13）\n\
  >\n> 第22節神宣告「我要[[分別百姓|分別]]我百姓所住的歌珊地」（וְהִפְלֵיתִי ... אֶרֶץ גֹּשֶׁן，H6395 搭配 H1657，『分別／顯出不同』）。**並且第23節的「分別」和第22節不是同一個字。**第23節「我要把我的百姓和你的百姓分別出來」（וְשַׂמְתִּי\
  \ פְדֻת，原文名詞 פְּדוּת，H6304，有『贖價／救贖』之意）。《中文聖經註釋》／《串珠》／《精讀本》都指出：**「將以色列人分開出來，在救贖的脈絡中就是將他們救贖出來。」**\n\
  >\n> **KC 把這件事的分量說盡了**：「神稱這分別為一個『記號』。撒但若恨惡什麼，就是恨惡神的百姓持守神為他們與世界所定下的分別。」\n\n「好叫你知道我是**天下的**耶和華」——《中文聖經註釋》把這個進程排得很清楚：5:2\
  \ 法老說「我不認識耶和華」；兩災之後他不得不召摩西來討價還價（8節），承認了使者的地位；第三災時術士承認這是「神的作為」，但他們只把祂當作眾神中的一位；現在，神要藉分別歌珊地，叫法老知道——祂是天下的主，而不是眾神中的一神而已。\n\
  \n#### 法老的第一、二次妥協（25-28節）\n\n法老的讓步不是一次到位，而是一步一步往回收——KC 說他一共四次提出妥協，「他要為每一寸空間爭辯」：\n\
  \n```mermaid\nflowchart TD\n    A[\"8:25 在這地祭祀（留在埃及境內）\"] --> B[\"8:28 可到曠野，只是不要走得很遠\"\
  ]\n    B --> C[\"10:8-11 只准壯年人去，婦人孩子留下\"]\n    C --> D[\"10:24 人可以去，羊群牛群留下\"]\n\
  \    A -.->|\"摩西：這樣行本不相宜（v26）\"| E[\"堅持：往曠野去，走三天的路程\"]\n    B -.->|\"摩西不回應這條件（v29）\"\
  | E\n```\n\n\n> [!quote] [[法老四次妥協]]——撒但的談判術\n> **KC 把這四次連起來看**（8:25、8:28；10:8-11、10:24），並且給了一個非常有力的讀法：\n\
  >\n> | 次 | 法老的提議 | 實質 |\n> |---|---|---|\n> | **一**（8:25） | **「在這地祭祀」** | **不准出境**——「你們可以事奉我，也事奉神」\
  \ |\n> | **二**（8:28） | **「只是不要走得很遠」** | **不准走遠**——仍在他的勢力範圍內 |\n> | 三（10:8-11） |\
  \ 只准壯年人去 | 留下家眷作人質 |\n> | 四（10:24） | 羊群牛群留下 | 留下產業 |\n>\n> **KC**：「他要為每一寸空間爭辯。但神和摩西——以及每一個因信主耶穌而屬神的人——除了與那釘死基督的世界清楚分別以外，什麼都不能滿足。」\n\
  >\n> **CT 的〔話中之光〕說得最好記**：「『不要走得很遠』，乃是魔鬼的策略：牠若不能阻止我們信主，牠就要叫我們不要信得太迷、愛主太過。」\n>\n>\
  \ 《中文聖經註釋》另從政治現實解釋法老的顧慮：「法老不放心這些慣於遊牧的人出到曠野去走得太遠。遊牧的人在沙漠走三天的路程以後，不慣沙漠生活的軍兵是難得把他們追回的。」\n\
  \n> [!note] [[埃及人所厭惡的]]——摩西為什麼不能在埃及境內獻祭？\n> 第26節摩西回答說，要把「埃及人所厭惡的（תוֹעֲבַת מִצְרַיִם，H8441\
  \ 搭配 H4714G）」祭祀耶和華，若在他們眼前行，他們必拿石頭打死；因此必須走「[[三天的路程]]（דֶּרֶךְ שְׁלֹשֶׁת יָמִים，H1870、H7969、H3117）」往曠野獻祭。\n\
  > **注意摩西的談判技巧**（《中文聖經註釋》讚賞地指出）：他沒有搬出「這是神的吩咐」來壓法老，而是從埃及人自己的立場說話，使法老無話可說。\n>\n> **問題出在祭牲。**《丁道爾》列得最全：「身上有某些標記的公牛，是亞皮斯（Apis）神的聖物；伊西斯（Isis）女神以母牛為聖；亞孟神（Amon）的聖物則是公羊——如此類推，幾乎每種祭牲都包括在內。」\n\
  >\n> **《精讀本》引希羅多德**：在古埃及，如果有人殺害了他們視為神聖的動物，不論職位高低一律處以死刑。——**摩西說「他們豈不拿石頭打死我們嗎」不是誇張。**\n\
  >\n> **《舊約背景註釋》給了一個更精確的分寸**：「無數浮雕證明，屠殺牲畜給神祇作為食物，在埃及宗教中是十分普遍的作法。然而動物血祭在埃及宗教中最主要的太陽崇拜、君王崇拜和葬禮等儀式中，卻沒有什麼地位——被殺的往往是被視為神祇仇敵的動物。」\n\
  >\n> **丁道爾／李道生還補了一則歷史旁證**：波斯王剛比西斯（主前529-522）曾用詐打了一場勝仗——他們驅趕聖物來開路，埃及的弓箭手不肯殺傷。（李道生另提：**曾有一位羅馬欽差誤殺了一隻貓，就被埃及人毆打致死。**）\n\
  \n「法老卻不可再行[[詭詐]]」——丁良才在此列了一長串先知諫責君王的先例：撒母耳諫掃羅、拿單諫大衛、以利亞諫亞哈、哈拿尼諫亞撒、耶戶諫約沙法、亞撒利雅諫烏西雅、施洗約翰諫希律。——**「神的僕人往往諫責世上有威權的人。」**\n\
  \n「一個也沒有留下」——丁良才：「蒼蠅既是這樣忽然完全離開埃及，就顯明這災不是偶然的，乃是出於神。」\n\n「這一次法老又硬著心」——《中文聖經註釋》的四個字最有力：**「江山易改，本性難移！」**《精讀本》：**「不顧連續五次的神蹟，鐵了心向著死亡之路走去」**（7:13,22；8:15,19,32）。\n\
  \n### 頭四災的屬靈對照（CT 靈訓要義）\n\n| 災 | 對付的埃及神明 | 逆轉 |\n|---|---|---|\n| **一、水變血**（7:14-25）\
  \ | **河神** | **賴以生存的河水 → 死亡的威脅**；享受變為厭惡 |\n| **二、蛙災**（8:1-15） | **生產女神** | **所崇拜的聖物\
  \ → 骯髒不潔之物**；安寧變為煩擾 |\n| **三、蝨災**（8:16-19） | **大地之神** | **所依靠的土地（塵土） → 螫人吸血之物**；穩固變為困擾\
  \ |\n| **四、蠅災**（8:20-32） | **蠅神** | **自私 → 自己受害**；並且只充滿埃及人所住之地 |\n\n### 關鍵神學點\n\n\
  1. **青蛙為埃及聖物**：他們不敢殺的聖物，成了他們除不掉的災——**神擊打的，往往正是人所敬拜、所倚靠的那一樣。**\n2. **[[任憑你吧]]**：摩西讓法老自己定除災的時間——**這是恩典，也是證據：災難是神引來的，也是神帶走的。**\n\
  3. **[[神的手段]]**：術士到此技窮，只能說「這是神的指頭」。**神的一根指頭，就勝過埃及全部的邪術。**（並且「神的指頭」在新約就是聖靈——**惟有祂能在塵土所造的人裡面賜下生命。**）\n\
  4. **[[分別百姓]]**：從第四災起，神把歌珊地分別出來。**「分別」的原文含「救贖」之意——分別就是救贖。**\n5. **[[法老四次妥協]]**：撒但不求你不信，只求你不要走遠。**「不要走得很遠」是牠一貫的策略。**\n\
  6. **[[法老心剛硬]]**：災禍一鬆緩，他就硬心。原文的「使之重」正對應埃及《亡經》裡秤心的意象——他來生的厄運，是他自己一次次加重的。"
