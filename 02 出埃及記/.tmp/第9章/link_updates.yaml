book: 出埃及記
chapter: 9
updates:
- title: 耶和華
  path: link_folder/神學/耶和華.md
  summary: |
    本章「耶和華」是每一段的主詞：祂吩咐摩西（1、8、13、22節）、定了時候（5節）、親自行這事（6節）、分別以色列的牲畜（4節）、使法老的心剛硬（12節）、宣告「在普天下沒有像我的」（14節）與「我叫你存立，是特要向你顯我的大能」（16節）、打雷下雹（23節）、保守歌珊地無雹（26節），最後垂聽摩西出城舉手的禱告使雷雹止住（33節）。
  relation: |
    第五災是全卷少數幾次神不經摩西亞倫之手直接施行的作為——GT《中文聖經註釋》註第6節：「這是神自己施行神蹟，未經摩西或亞倫之手，是神在預定的時間施行作為的清楚說明。」同一份註釋也注意到第3節的敘事人稱換了：「首先，這耶和華的說法是以第三人稱出現，而其他地方都用『我』。」本章因此把「耶和華是誰」的答案推到最遠：不只是希伯來人的神（1、13節），而是「普天下沒有像我的」（14節）、「全地都是屬耶和華的」（29節）。KC 讀第19-21節時指出一件本章獨有的事：「這是我們第一次讀到埃及人中間有敬畏耶和華的。」
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: |
    本章摩西身兼三職：第1、13節傳達神的宣告；第8-10節取爐灰在法老面前向天揚起（第五災神親自施行，第六、七災才由他動手）；第22-23節向天伸杖招來雷雹；第29、33節出城向耶和華舉手禱告使雷雹止住——這是他第一次為法老作這樣的代求。第12、35節兩次「正如耶和華對／藉著摩西所說的」印證他的代言人身分。
  relation: |
    第29節摩西自己把這場禱告的三層意思說清楚了（CT 歸納）：他在法老面前是代表神的、耶和華是全地的神、雹災的止住是因法老認罪。CT 並指出「舉手禱告」是當時以色列人禱告常用的姿勢（伯11:13；代下6:13；拉9:15），GT《中文聖經註釋》補一句和合本的旁點：「和合本在禱告的字旁加點，表示原文無此兩字。但這加字是符合原意的。」第30節他對法老說的話最能看出他的清醒——GT《丁道爾》稱之為「聖經『神學寫實主義』的例子：摩西不相信法老會遵守諾言，但仍應承他的請求，好使他無可推諉。」KC 把它化成一個功課：「摩西雖然知道法老不會放百姓走、心裡也沒有真正敬畏耶和華，他仍然答應為他禱告。這給我們一個榜樣：要為那些我們幾乎不抱指望會降服於主的人禱告。」KC 另把他與以利亞並列：「像以利亞一樣，摩西也用禱告的能力開了天、又關了天。」
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: |
    本章亞倫出現三次：第8節神吩咐「你們取幾捧爐灰」（複數）、第10節「摩西、亞倫取了爐灰，站在法老面前」，但向天揚起的動作由摩西單獨完成；第27節法老災中打發人召「摩西、亞倫」來。第11節術士生瘡站立不住時，CT 指出摩西、亞倫和一切以色列人都例外，沒有生瘡。
  relation: |
    GT《中文聖經註釋》解釋了為何第8節用複數：「與施行神蹟有關的準備工作，亞倫也有分兒，所以用你們。」——取灰兩人一同，揚灰只有摩西，這是本章分工的實況；和第七章亞倫伸杖、第八章亞倫伸杖相比，從本章起施行的動作轉到摩西身上（第10節揚灰、第23節伸杖都是摩西）。同一份註釋還記下七十士譯本的一處增補：「七十士譯本卻在法老之後加了『和他臣僕』」，理由大概是第11節提到行法術的也受禍。
- title: 法老
  path: link_folder/人物/法老.md
  summary: |
    本章法老經歷四個階段：第7節派人去查驗以色列人的牲畜是否真的一隻都沒死，查證屬實仍「心裡固執」；第12節第一次由神使他的心剛硬；第27節第一次認罪「這一次我犯了罪了。耶和華是公義的；我和我的百姓是邪惡的」，並請摩西代求；第34-35節雷雹一止就「越發犯罪」，他和臣僕都硬著心——這是繼8:15、8:32之後第三次收回承諾。
  relation: |
    第27節的認罪各家評價不一，而分歧本身就是重點。GT《中文聖經註釋》給它一個相對正面的評價：「法老雖是仍然作自我的防護，而不願完全的投降神，亦已承認神的大能和公義，比他在蛙災（8:8）和蠅災（8:28）中所表現的，進步得多了。」GT《丁道爾》從法律用語切入：「他所說的是司法的用辭：耶和華是清白的，法老和他子民則罪名成立。」但 KC 判得最重：「這是頭一次他承認自己犯了罪。但這是一個只從他行為的後果生出來的認罪——完全沒有自我審判可言……這種悔改在神面前毫無價值。」GT 丁良才的比方同樣不留情：「賊在被重打的時候，滿口認罪悔改。」他並注意到「這一次」三個字：「顯明法老還沒有把先前的罪從心裡悔改了，只想躲避當時的災難。」GT《聖經精讀本》另指出第29節「全地都是屬耶和華的」為何對他是重擊：「作為大國的王法老一直認為自己是『神的兒子』，摩西的這句話對他是極大的打擊。」
- title: 十災
  path: link_folder/歷史/十災.md
  summary: |
    本章一次收了三災——第五災畜疫（1-7節）、第六災瘡（8-12節）、第七災雹（13-35節）——並在第13節出現十災結構最明確的一處標記：「你清早起來，站在法老面前。」
  relation: |
    CT 據此把前九災分成三組：「第一至第九災可分成三組，每組的首災，即第一（7:15）、第四（8:20）和第七災（9:13），神都吩咐摩西清早起來去見法老。」GT《中文聖經註釋》從另一個角度得到同樣的結構：「這第五災的形式與第二災的形式，在開始時很相近，故有九災三三循環之說。」本章因此同時是第二組的收尾（五、六災）與第三組的開場（七災），而第七災前特別加了一段神學引言——GT《丁道爾》：「這災可能因為是第七個的緣故，前面有一段神學的引言。」災的性質也在本章升級：CT 指出「前面的四災不過是叫埃及人的身心受到攪擾與痛苦而已，但從這災開始，是叫他們的財產蒙受損失」，GT 丁良才則數出雹災是「埃及十災中頭一個使人喪命的大災」。CT 的靈訓要義把本章三災各自對付的神明列出來：畜疫對付埃及的牛神、瘡災對付埃及的醫治之神、雹災對付埃及的天候神。
- title: 以色列
  path: link_folder/原文/以色列.md
  summary: |
    本章三次把以色列從災中分別出來：第4-7節「凡屬以色列人的，一樣都不死」，連法老派人查驗也「連一個都沒有死」；第11節瘡長在「一切埃及人身上」，CT 指出摩西、亞倫和一切以色列人都例外；第26節「惟獨以色列人所住的歌珊地沒有冰雹」。
  relation: |
    分別的層次一層比一層深：牲畜（第五災）、身體（第六災）、地土（第七災）。GT 丁良才指出這條分界線是從第四災才劃下的：「以色列人在第一二三災上受了些影響，那三災雖是可厭惡的，卻沒有叫他們受什麼虧損。自第四災以後，神就把他們和埃及人分別出來。」牲畜得保全另有一個實際的用處——CT：「神為著保守以色列的牲畜，以便將來在曠野中短期內仍有祭牲和百姓的肉類食物，就連牲畜也有所分別。」KC 從這裡讀出兩種人對財物的不同用法：「以色列人把牲畜用在事奉耶和華上，特別是牛群羊群要獻給祂為祭；埃及人卻把這一切都用在自己身上。」
- title: 埃及
  path: link_folder/地點/埃及.md
  summary: |
    本章埃及連受三災：田間的牲畜幾乎全死（6節）；人和牲畜都長起泡的瘡、連行法術的也站立不住（10-11節）；雹與火攙雜「自從埃及成國以來，遍地沒有這樣的」（24節），打壞田間的人、牲畜、菜蔬與樹木（25節），麻和大麥被擊打而小麥粗麥因未長成得免（31-32節）。
  relation: |
    本章給了埃及一個它自己想不到的位置。第15節神說「我若伸手用瘟疫攻擊你和你的百姓，你早就從地上除滅了」，第16節說明為何沒有：「我叫你存立，是特要向你顯我的大能，並要使我的名傳遍天下。」GT《中文聖經註釋》把降災的三個目的排出來：叫法老知道普天下沒有像神的、顯出神的大能、使神的名傳遍天下——「這是第三個目的，也是最重要的目的。」災情之重不只是宗教問題，也是國力問題：GT《丁道爾》註第25節說「從十章7節便可看出毀壞的程度，連埃及人也請願要求法老釋放以色列人離開，免得再有災難臨到。國家經濟已然陷於崩潰。」而雹在埃及本就罕見——GT《啟導本》：「這現象在埃及十分罕見」；丁良才：「原來在埃及雨水甚少，所以這災的勢派越發令人可怕。」
- title: 歌珊地
  path: link_folder/地點/歌珊地.md
  summary: |
    本章第26節「惟獨以色列人所住的歌珊地沒有冰雹」，是繼第8章蠅災（8:22）之後第二次以地名點出免災的範圍。
  relation: |
    GT 丁良才把歌珊免災的幾處並列：8:22、9:4、10:23。GT《丁道爾》另給了一個地理上的解釋，並且立刻說明它為何不足以取代神蹟：「狹窄的尼羅河河谷兩面都是炎熱的沙漠和山丘，形成一條漏斗形的風道。雷暴若是沿著這風道移動，氣流截然不同的東部地區沒有受到蹂躪，便十分合理。」——「即使如此，以色列也正確地認知這是神拯救自己子民、而非特殊地理現象的結果。」BH 把它連到後來的逾越節：歌珊的分別是最後一災「越過」以色列人的預演，也呼應詩91:7「千人仆倒在你旁邊」的保護。
- title: 希伯來人的神
  path: link_folder/神學/希伯來人的神.md
  summary: |
    本章第1節（第五災）與第13節（第七災）兩次以「耶和華─希伯來人的神這樣說：容我的百姓去，好事奉我」開場——這是本章兩組宣告的固定起手式。
  relation: |
    CT 把這個稱號的四層意思列出來：祂帶領他們從大河那邊過來（「希伯來」的字義），為要叫他們從拜偶像的人中間分別出來；祂是他們所拜的神；祂寶愛並照顧他們；祂的名就是耶和華。KC 從同一個字讀出身分：「『希伯來人的神』這名字強調神的百姓是一群『從那邊來的人』，這正是『希伯來』一名的意思。一個希伯來人是地上的客旅，因為他屬於另一個國度。」本章的特別之處在於，這個帶著歸屬意味的名字後面，緊接著就是最大的主權宣告：「叫你知道在普天下沒有像我的」（14節）、「叫你知道全地都是屬耶和華的」（29節）——歸屬與主權在同一章裡合成一句話。
- title: 耶和華的話臨到
  path: link_folder/神學/耶和華的話臨到.md
  summary: |
    本章神四次開口：第1節（第五災宣告）、第8節（第六災，同時對摩西和亞倫說）、第13節（第七災宣告）、第22節（施行雹災）。第20-21節則把「耶和華這話」放到埃及人面前作分界：「懼怕耶和華這話的」把人畜收進屋裡，「不把耶和華這話放在心上的」把人畜留在田裡。
  relation: |
    本章讓「神的話」從摩西這一端跨到聽者那一端。GT《中文聖經註釋》註第20節：「原文懼怕和敬畏是同一個字。今日的人也和當年一樣，聽了神的話，有的人敬畏，有的人不把這話放在心上。敬畏而相信神話的，就會預作防護；不把神的話放在心上的，根本就不理一切。其結果也就有很大的分別。」GT《丁道爾》把它推成通則：「法老和他的臣子首次有機會藉著對神的信心和順服避免災難。任何『福音』傳講之時，有人把握機會，有人則否；這是不變的真理。」而神的話也在本章加上時間刻度——第5節「明天耶和華必在此地行這事」、第18節「到明天約在這時候」，GT《中文聖經註釋》：「神總是給人予悔改的機會，因為祂說話的時間，和定了的時候之間，總是有空檔的。」
- title: 雅尼和佯庇
  path: link_folder/人物/雅尼和佯庇.md
  summary: |
    本章第11節「行法術的在摩西面前站立不住，因為在他們身上和一切埃及人身上都有這瘡」——術士這一方在本章徹底出局，此後不再出現在十災的敘事裡。
  relation: |
    KC 直接把名字接上去：「行法術的雅尼和佯庇身上也長出了瘡。這印證了保羅提名指出這兩個術士時所說的：『他們的愚昧必在眾人面前顯露出來，像那二人一樣』（提後3:9）。」GT 丁良才與《聖經精讀本》也在第11節同引提後3:8-9。「站立不住」怎麼解，各家分成兩路：GT《中文聖經註釋》兩者兼取——「一方面也表達敵不過摩西了，另方面也是寫實的說，他們疼痛非常，坐立難耐的而在摩西面前站立不住了」，並引一句俗諺「泥菩薩過江，自身難保」；GT《每日研經叢書》則覺得字面讀法牽強：「『在摩西面前站立不住』卻有點牽強，因為瘡是在他們腳上；比較更大可能的乃是意指他們放棄爭了，因為他們不能再反抗下去了。」從第7章仿造杖變蛇（7:11）、第8章仿造蛙災（8:7），到第8章蝨災已經模仿不出來（8:18），再到本章自身難保，術士的路在本章走到盡頭。KC 另舉一個新約的平行：行法術的以呂馬照樣被保羅責打眼瞎（徒13:10-11）。
