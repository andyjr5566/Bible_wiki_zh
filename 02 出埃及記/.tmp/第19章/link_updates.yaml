book: 出埃及記
chapter: 19
updates:
- title: 神的山
  path: link_folder/地點/神的山.md
  summary: "v3「摩西到神那裡，耶和華從山上呼喚他」。GT《中文聖經註釋》指出出18章的事跡「乃發生在神的山（十八5）；就是起先摩西受召時的地方（三1）」，而「從十八章到出埃及記的末了所記述的事跡，都是在這神的山下的曠野和山上所發生的」——本章只是為方便討論才另起一段。丁良才指出 v3 使出3:12 的話得著應驗：「你將百姓從埃及領出來之後，你們必在這山上事奉我，這就是我打發你去的證據。」GT《中文聖經註釋》另記下一個抄本上的細節：「七十士譯本在神之後加『的山』，而成為神的山」；同一譯本把 v3 的「山上」譯作「天上」"
  relation: "「神的山」這個稱呼在本章沒有出現，本章用的是「西乃山」；但兩者指的是同一處，而本章正是這座山從『摩西一個人蒙召之處』變成『全民族領受律法之處』的一章。GT《丁道爾聖經註釋》在此提出一個要緊的分辨，使這個稱呼不至於被誤解：「以色列從來沒有想像耶和華住在西乃山上，祂不過在此顯現而已（反觀希臘人，則相信他們諸神都居於終年積雪的奧林匹斯山巔）」"
- title: 宗主條約
  path: link_folder/背景/宗主條約.md
  summary: "出19:3-8 的形式與古代近東宗主國和屬國之間的條約十分相似。GT《啟導本聖經腳註》把對應關係逐項列出：「此約的文字和形式很象宗主與屬國訂立的條約，有前言（3節），有宣言，說明宗主的高超與仁慈（4節），和屬國的義務與權利；遵守條約可得的福氣，違背條約須受的刑罰。」GT《中文聖經註釋》在逐節註解中指出同樣的形式：v4「這是古代大君王與臣屬立約前，宣告大君王曾作過的偉大事跡的形式」；v5「如今你們若」也是「古代大君王與臣屬立約前宣告的形式，給他們有選擇的權利，而不是強逼他們就範」；v3 的雙重稱呼則「是符合古代君王對寵愛臣民官式的稱呼」。GT《舊約聖經背景註釋》提供了具體的文獻證據：「珍貴財產」一詞在古代近東指藉分配擄物或遺產而得的財寶，「阿拉拉赫王在其印章中自稱為哈達神的『珍貴財產』」，而在烏加列文獻中「赫人宗主稱烏加列王為『珍貴財產』，也是表示他的身分是得寵的藩屬」；它另舉出一個更貼近本章的先例：「一城或一個群體的人，可以脫離君王的轄管，直接成為某位神明的子民」。GT《聖經精讀本》則把立約的四個要素列了出來：簽約當事人、條件、約定、警告"
  relation: "借形式不等於借內容，這是本章各家一致提出的保留。GT《啟導本聖經腳註》說：「『西奈之約』的精神與內容則和宗主與屬國的條約不同，不只強調宗主國的高超與絕對權威，也是全能的神在這裡彰顯祂自己，讓祂的選民明白祂的旨意。」GT《聖經精讀本》說得更直接：「不能把聖經中的『約』理解成當時在近東地區所流行的簽約，即兩個人或兩個群體相互協商之後形成的約定……約的主導權始終在神的手上，人類只不過是受惠者而已。」而 v5 的「若」字是這個形式的關鍵——《啟導本聖經腳註》從中歸納出三點：百姓一直是神施恩的對象、律法不是得救的方法只是已蒙救贖者順服的規範、律法要在人願意主動接受後才頒佈"
