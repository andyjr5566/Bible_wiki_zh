  relation: "GT《串珠聖經註釋》指疏割約在蘭塞東南八十公里，也許是現今的馬斯古達山丘，是以色列人出埃及後第一個紮營的地方；GT《舊約聖經背景註釋》指從蘭塞到疏割約一日腳程，是往東離開埃及的正常路徑。丁道爾指出這個地名的來歷：疏割「可能相當於埃及語的 t[kw。而這個埃及名字也不過是閃族語文『牛棚』的音譯」，若真在圖米拉特河東端，「以色列人便由西到東穿越了歌珊全境」。KC 則把地名讀成身分：「疏割的意思是『棚』，正如帳棚一樣，表示這百姓是寄居的客旅。」"
- title: 六十萬人的數目
  path: link_folder/解經爭議/六十萬人的數目.md
  summary: "第37節給出出埃及的人數：除了婦人孩子，步行的男人約有六十萬。本章的來源在這一節下並列了兩種截然不同的處理方式。"
  relation: "這個數字與第40-41節的四百三十年是同一段經文裡的兩個統計數字，丁道爾把第29-51節整段稱作記載了「關於逾越節的各種統計數字」的一段。CT 更把兩者接在一起算：人口從七十個人（1:5）增加到二百萬人以上，「這個增殖的速率超乎想像，只能歸功於神的賜福」。"
- title: 閒雜人
  path: link_folder/人物/閒雜人.md
  summary: "v38「又有許多閒雜人，並有羊群牛群，和他們一同上去」——閒雜人首次隨以色列人出埃及"
  relation: "《丁道爾》指原文作「混雜群」，字根與8:21 蠅災同；各家或視為日後犯罪之因（民11:4），或如《精讀本》讀為恩典的開口——「通過割禮儀式，他們完全被納入以色列共同體內」，正是 v43-51 條例要處理的問題"
- title: 四百三十年
  path: link_folder/原文/四百三十年.md
  summary: "第40節給的是「住在埃及」四百三十年，第41節加上「正滿了……的那一天」。CT 對後者的解讀是「『正滿了』似乎有意強調連一天也不提早也不延遲」；GT《丁道爾》則保留：「可能不是指『四百三十年，一日不差』。它強調的可能只是一個時代的結束，和當日出埃及的真實性。」"
  relation: "CT 在第40節說「本節的四百三十年究竟如何計算而得，聖經中並無明文可考」，並指司提反所提的四百年（徒7:6；創15:13）「乃是個約數」；但它在第41節仍給出了自己的一套算法，而且起算點與丁良才不同——它從神與亞伯拉罕立約（創15:17-21）算起：立約到生以撒十五年、以撒生雅各時六十歲、雅各下埃及時一百三十歲，共二○五年，「所以他們在埃及地僑居時間是二二五年」，並把那一天定在主前一四九一年亞筆月十五日。"
- title: 神的主權與預定
  path: link_folder/神學/神的主權與預定.md
  summary: "v40-41「以色列人住在埃及共有四百三十年。正滿了四百三十年的那一天，耶和華的軍隊都從埃及地出來了」——預定的時刻精準成就"
  relation: "CT 指「正滿了」似乎有意強調連一天也不提早也不延遲；GT《串珠聖經註釋》則把重點從數字挪開：「其實作者只是強調：在日期滿足之後，神要將百姓拯救出來。」KC 用一句話總結：「耶和華成就了祂當年向亞伯拉罕所說的話。神的磨坊磨得慢，卻磨得準。」BH 也指出「正滿了……的那一天」這句話所強調的是神時間的準確——顯出祂在自己所定的時候成就立約的應許。至於這四百三十年究竟怎麼算，各家並不一致，見 [[四百三十年]]。"
- title: 出埃及
  path: link_folder/歷史/出埃及.md
  summary: "第37-42節是出埃及本身的記述——從蘭塞起行往疏割，除了婦人孩子步行的男人約有六十萬，許多閒雜人並羊群牛群同行，用埃及帶出來的生麵烤成無酵餅，住在埃及共四百三十年，正滿的那一天耶和華的軍隊都從埃及地出來了，這夜是耶和華的夜。"
  relation: "人數是本章爭論最多的一處。GT《舊約聖經背景註釋》列了好幾條理由質疑二百萬這個數字——埃及三角洲養不起這麼多人、同時代的埃及軍隊不超過兩萬人、這麼長的隊伍「後隊與前隊相比，起碼相差兩個星期的行程」；它認為可行性最高的解法是希伯來語的「千」字還可以譯作「部隊」，於是「六百千」可以是六百隊軍人。丁道爾也提到同一條路，並補上一句要緊的話：「由於人數多少不會影響任何神學立場，這問題並不重要；人口不論是六千還是六十萬，他們得拯救總是神蹟。」GT《啟導本》與《聖經精讀本》則主張二百萬是可信的，理由是以色列人在埃及寄居四百多年、人口大增已成埃及的威脅（1:12），而摩西在曠野為供應食物飲水發愁也說明人數的確很多。"
- title: 逾越節條例（外邦人與寄居者）
  path: link_folder/歷史/逾越節條例（外邦人與寄居者）.md
  summary: "v43-51 逾越節條例補充——外邦人不可吃、奴僕受割禮可吃、寄居與雇工人不可吃、骨頭不折、一房內吃、外人受割禮可吃、本地人與寄居同歸一例"
  relation: "GT《串珠聖經註釋》說明這段條例為什麼在這裡出現：「因為有這麽多閒雜人加入以色列民族，這問題必要弄清楚。」GT《舊約聖經背景註釋》把三條規例並排解釋：第一，只有受了割禮的人才可參與；第二，肉一點也不可以帶出屋外；第三，骨頭一根也不可折斷——「後面兩條規例的目的，都是防止與社群以外的人分享筵席，因為這樣做是違例的」。GT《中文聖經註釋》辨析第45節與第48節的「寄居的」在原文不是同一個字：前者是短暫的寄居，「如今日的遊客之類的人」，既不知以色列人的習俗，也不可能了解和遵奉他們的信仰而行割禮；後者則是長居甚至終生的寄居。它並注意到第48節寫著「自願」和「全家」兩個條件，並以歷史為戒：「主前一百四十年前後，以色列人強迫以東人受割禮，結果以東人的後裔出了個希律大帝，使以色列人受了很多苦頭。」"
- title: 割禮作為立約記號
  path: link_folder/主題/割禮作為立約記號.md
  summary: "第44節用銀子買的奴僕既受了割禮就可以吃；第48節外人寄居的所有男子務要受割禮，然後才容他前來遵守，他也就像本地人一樣，「但未受割禮的，都不可吃這羊羔」；第49節「本地人和寄居在你們中間的外人同歸一例」。丁良才指出這中間有一條界線：家中所生的奴僕第八日就受割禮，「但以色列人用銀子所買的奴僕，受割禮不受仍在奴僕自己定主意」，而受了割禮的奴僕「在一切宗教的事上能和他的主人享同等的權利」。"
  relation: "本章把割禮定為參與逾越節的唯一界線——《中文聖經註釋》：「不可喫羊羔的人，並不是血統的問題，也不是住地的問題，而是被認可與否的問題。被認可的條件，是割禮」；並由此推出第49節：「因此，『以色列』實質上是一個宗教的結合體，而不是一個血緣和地緣的結合體。」KC 則把這個記號的內容說出來：割禮代表基督在十字架上所受的、對肉體的審判（西2:11）；GT《聖經精讀本》也說「可以看出除血緣和身份，割禮成為了區分以色列與外邦人的唯一標準」"
- title: 基督預表（逾越節羔羊）
  path: link_folder/神學/基督預表（逾越節羔羊）.md
  summary: "第5節無殘疾、一歲的公羊羔；第6節留到十四日黃昏才宰；第9節帶著頭、腿、五臟用火烤；第46節骨頭一根也不可折斷。丁良才把逾越節羊羔與基督的對應列成十五層，從「都必死亡」「主設救法」「一隻羊羔」一路數到「勿折骨頭」「血抹框楣」「須食羊肉」「吃無酵餅」「並食苦菜」。"
  relation: "CT 指出第6節「要留到本月十四日」這四天的預表意義：「四是被造的數字，表徵基督成為贖罪祭，要受人所受的試驗。」KC 也把三天的觀察讀成福音書的三年：「羔羊必須在家中三天。主耶穌，那真逾越節（林前5:7下），我們也能在祂地上行走的三年之間觀看祂。」但 KC 同時提醒，吃烤過的羔羊所指的不是主的生平而是主的死：「主耶穌的生命不能帶來拯救，惟有藉著祂的死才有和好（羅5:10）。」"
- title: 法老長子之死的埃及旁證
  path: link_folder/歷史/法老長子之死的埃及旁證.md
  summary: "第29節指名被擊殺的長子從「坐寶座的法老」起算。本章的來源在這一節下收了一篇專門討論埃及考古旁證的文字，另有一條走不同年代路線的註釋。"
  relation: "這條旁證與本章第40-41節的四百三十年是同一組年代問題的兩端：艾基斯用王上6:1 反推出主前一四四五年出埃及，而 GT《舊約聖經背景註釋》註第40節時也是用同一節經文反推，得到「出埃及就是在主前一四○○年代中葉」。年代取捨不同，指認的法老也就不同。"
- title: 神蹟（miraculous signs）
  path: link_folder/神學/神蹟（miraculous signs）.md
  summary: "第12節耶和華宣告那夜要巡行埃及地、擊殺一切頭生的、敗壞埃及一切的神；第29-30節是它的執行。"
  relation: "GT《啟導本》指出這一災與前九災在解釋上的分別：「不少人曾用常理來解釋以前九災，但迄今無一人能圓滿解釋這最後一災，因為這是神自己施行的奇事。」GT《聖經精讀本》給了三條理由，說明為什麼不能把它讀成一場突發的傳染病：一、災難已經預言過；二、只局限於人和牲畜一切頭生的；三、超越地域，只臨在了埃及人身上。"
- title: 法老心剛硬
  path: link_folder/神學/法老心剛硬.md
  summary: "v30,33 法老與埃及眾人夜間都起來；v33 埃及人催促以色列人快快出離「我們都要死了」——剛硬到此完全被擊潰"
  relation: "第7-11章「耶和華使法老的心剛硬」在本章走到終點——第11章 v10 是最後一次明確記載，本章顯示法老被末災完全擊潰、主動催逼以色列人離開"
