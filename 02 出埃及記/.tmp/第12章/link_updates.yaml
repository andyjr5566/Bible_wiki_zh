- title: 寄居的（ger）
  path: link_folder/原文/寄居的（ger）.md
  summary: "v45「寄居的和雇工人都不可吃」；v48「若有外人寄居在你們中間，願向耶和華守逾越節，他所有的男子務要受割禮」"
  relation: "GT《中文聖經註釋》辨析本章兩個「寄居的」在原文不是同一個字：第45節那個「含有短暫的寄居，如今日的遊客之類的人」，既不知以色列人的習俗，也不可能了解和遵奉以色列人的信仰而行割禮；第48節那個（ger）則「是較長的，甚至是終生的寄居……是外國人長居於異地者之意」，受割禮之後「他也就像本地人一樣」"
- title: 逾越節
  path: link_folder/歷史/逾越節.md
