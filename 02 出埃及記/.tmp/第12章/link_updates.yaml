  summary: "v8 逾越節當夜與烤羊羔、無酵餅、苦菜同吃——苦菜記念為奴之苦"
  relation: "苦菜是逾越節筵席三元素之一——味覺記號連結為奴歷史記憶"
- title: 逾越節的吃法
  path: link_folder/歷史/逾越節的吃法.md
  summary: "這是全卷對一頓飯規定得最細的一段——烹法、配菜、姿態、剩食、地點、骨頭，六件事都有明文。"
  relation: "GT《丁道爾》指出這頓飯在以色列的祭中是獨一無二的：「以色列交通的祭中，惟有這個祭在吃的時候要作好準備，以便隨時可以起行」，而「惟一合理的解釋，是第一個逾越節對神的臨在，充滿了恐怖和期望」。"
- title: 逾越（Pesach）
  path: link_folder/原文/逾越（Pesach）.md
  summary: "這個字在本章出現三次——第11節是名詞（「耶和華的逾越節」），第13、27節是動詞（「越過」）。GT《丁道爾》指出第13節是「全本舊約對這節期名字惟一的解釋」。"
  relation: "GT《丁道爾》把名詞與動詞的先後說清楚：「希伯來文 pesah 一詞本身，大概主要是指祭物，其次才是指以這祭物為中心的節期。因此直譯應作『這是耶和華的逾越羔羊』。」"
- title: 埃及
  path: link_folder/地點/埃及.md
  summary: "埃及在本章從審判的對象變成被拋在身後的地方——第12節神要巡行埃及地擊殺一切頭生的、敗壞埃及一切的神；第29-30節半夜遍地大哀號、無一家不死一個人的；第33節埃及人催促百姓快快出離那地，說「我們都要死了」；第35-36節埃及人把所要的金器銀器衣裳都給了以色列人；第37節以色列人從蘭塞起行往疏割；第41節正滿四百三十年的那一天，耶和華的軍隊從埃及地出來。"
  relation: "GT《聖經精讀本》指出第十災之所以打在埃及最痛的地方，是因為「埃及的很多偶像被擬作各種動物的形像」，而這一夜「尤其體現了埃及一切神的無能和虛假，因為他們在耶和華的審判中連自己的性命都沒能保全」。GT《舊約聖經背景註釋》從埃及自己的節慶讀出同一件事：本章可能反映了代表更新君王權柄的塞德節——「君王在塞德節中象徵式地在全地隨意週遊，來顯示他能夠支配全地。神巡行遍地，藉災禍證明其支配權，法老的王權受到嘲弄，耶和華的王權卻得以認定。」"
- title: 耶和華敗壞埃及一切神
  path: link_folder/歷史/耶和華敗壞埃及一切神.md
  summary: "第12節把兩件事寫在同一句話裡——擊殺一切頭生的，以及敗壞埃及一切的神。CT 解釋後者是「對埃及一切的偶像假神，可能包括牠們的代理人，如行法術的等，施行審判與懲罰」。"
  relation: "這兩件事在埃及人眼中本是同一件。GT《串珠聖經註釋》：「反映出埃及人的信念，他們視動物為神明，亦相信一切頭生的皆有神明特別保護；當耶和華神擊殺牲畜及長子時，就是擊敗了他們所倚靠神明。」丁良才說得一樣：「埃及人以各樣的牲畜為聖，有的牲畜他們也以為活神，神既擊殺了一切頭生的牲畜，就必定敗壞了埃及人許多的神。」而「我是耶和華」是這句話的落款——GT《中文聖經註釋》：「要懲罰埃及人的神和擊打埃及人和其牲畜的原因，就是要他們認識，知道神才是神，才是主。」"
- title: 知道我是耶和華
  path: link_folder/神學/知道我是耶和華.md
  summary: "第12節在宣告擊殺一切頭生的、敗壞埃及一切的神之後，以四個字收尾：「我是耶和華。」丁良才給這句話下的比方是「君王的印璽」。"
  relation: "GT《中文聖經註釋》把這句話讀成整件事的目的：「要懲罰埃及人的神和擊打埃及人和其牲畜的原因，就是要他們認識，知道神才是神，才是主。」CT 說「我是耶和華」意指祂是獨一的真神，凡祂所說的必定成就。BH 也指出這裡用的是神的立約之名，「強調祂永恆、自有的本性」，向以色列人保證祂有能力成就自己的應許。KC 則從第1-2節就把說話者的身分定住了：「耶和華以審判者的身分說話。祂對埃及是審判者，對祂的百姓也是；而對祂的百姓，祂同時是拯救者。」"
- title: 災殃
  path: link_folder/原文/災殃.md
  summary: "第13節「我擊殺埃及地頭生的時候，災殃必不臨到你們身上滅你們」。CT 給的原文字義是「致命的重擊，瘟疫」。這是本章唯一一次用這個字，而且是用在否定句裡——它說的不是災殃如何臨到埃及，而是它為什麼不臨到以色列。"
  relation: "丁道爾指出第13節下半這句話正好為上半句的動詞作註：「我……就越過你們」的含義，「則在下半節災殃或『擊打』必不臨到他們身上這句話中，得到了局部的解釋」——「越過」是什麼意思，要靠「災殃不臨到」來界定。BH 也指出這裡所說的災殃就是第十災，並說門上的血是「一個看得見的順服與信心的記號」。"
- title: 逾越節定為永遠定例
  path: link_folder/歷史/逾越節定為永遠定例.md
  summary: "第14、17、24 三節分別把逾越節、無酵節、宰羊羔之例定為永遠的定例；第25節把它推到將來——「日後，你們到了耶和華按著所應許賜給你們的那地，就要守這禮」；第26-27節給出這條例代代相傳的具體形式：兒女問「行這禮是什麼意思」，父母答「這是獻給耶和華逾越節的祭……救了我們各家」。"
  relation: "GT《中文聖經註釋》指出第25節的「禮」在原文與第1章14節、第2章23節、第5章9節的「苦工」是同一個字：「在埃及人或自己的肉體之下的工，是一種勞苦；但在敬拜神上，卻是一種喜悅地與神交通的禮儀。」——同一個字，在為奴時是苦工，在得贖後是敬拜。"
