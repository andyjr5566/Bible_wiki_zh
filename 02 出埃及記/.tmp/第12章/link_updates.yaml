- title: 從以色列中剪除
  path: link_folder/原文/從以色列中剪除.md
  summary: "第15、19節兩次為無酵節的條例配上處分：凡吃有酵之物的，必從以色列中剪除；第19節並申明這處分對寄居的和本地的一樣有效。"
  relation: "這是本章唯一一處帶罰則的條文，而它落在無酵節而不是逾越節上。GT《中文聖經註釋》指出第19節推廣了第15節的意思——條例的效力不限血統，凡住在以色列境內的人都受同等約束；這條原則到第43-49節論外邦人可否吃羊羔時再度出現。"
- title: 聖會
  path: link_folder/文化/聖會.md
  summary: "v16 頭一日、第七日當有聖會——除了預備各人所要吃的以外，無論何工都不可做"
  relation: "聖會是無酵節首末日的集體敬拜集會——本章首次明定後延伸到所有節期"
- title: 無酵節
  path: link_folder/歷史/無酵節.md
  summary: "第15-20節定下七日吃無酵餅、頭一日把酵從各家中除去、凡吃有酵之餅的必從以色列中剪除；第16節首尾兩日當有聖會；第18節界定日期為正月十四日晚上到二十一日晚上；第19節申明這條例對寄居的和本地的一同有效；第39節補記第一批無酵餅是怎麼來的。"
  relation: "GT《中文聖經註釋》認為這原是農耕的節期，與逾越節在時令與食物上相合而後來揉合：「為免舊酵長年累積下來而成有毒害情況，農耕的人在此新年就斷酵七日，使舊酵完全斷絕。過了這七日再培養新酵做餅。」丁道爾則堅持節期的重心不在農事：「對以色列來說，這個節期和所有其他節期一樣，都是記念神拯救的作為，其重要性是在歷史之上，而非農業之上。」"
- title: 以色列人的軍隊
  path: link_folder/神學/以色列人的軍隊.md
  summary: "v17,41,51 三次稱以色列人為「耶和華的軍隊」——v17「我正當這日把你們的軍隊從埃及地領出來」、v41「正滿了四百三十年的那一天，耶和華的軍隊都從埃及地出來了」、v51「耶和華將以色列人按著他們的軍隊，從埃及地領出來」"
  relation: "CT 注意到第41節與第51節這兩句話換了角度：第41節說的是「耶和華的軍隊」從埃及地出來，第51節說的是耶和華將以色列人「按著他們的軍隊」領出來——前者從以色列人的角度說「出來」，後者從神的角度說「領出來」。CT 並指出「凡二十歲以上的以色列人均為軍隊的成員（參民一3）」，這詞是要形容他們的行動「並非雜亂無章，而是有條不紊、秩序井然的」。GT《聖經精讀本》說得更重：「沒有從埃及人手中慌張逃脫，而是征服了埃及一切神之後，以色列浩浩蕩蕩地出埃及……他們是奔向征服迦南地的強大的軍隊。」KC 則指出這詞出現的位置本身有話說：逾越節是按家庭守的，離開埃及卻是「按著他們的軍隊」——「這表示他們踏進的是戰場，曠野的行程就要開始了。」"
