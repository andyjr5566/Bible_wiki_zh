- title: 創十五13 四百年寄居預言
  path: link_folder/互文/創十五13 四百年寄居預言.md
  summary: "第40-41節「以色列人住在埃及共有四百三十年。正滿了四百三十年的那一天，耶和華的軍隊都從埃及地出來了」；第35-36節則應驗創15:14 下半「後來他們必帶著許多財物從那裡出來」。"
  relation: "GT《串珠聖經註釋》承認這兩個數字「引起不少爭論」，但把重點放在別處：「其實作者只是強調：在日期滿足之後，神要將百姓拯救出來。」丁道爾說得更直接：「時間長短是無關重要的；重要的是神在這段時間結束之時，拯救了以色列。」BH 也指出這個年數「常有爭議」，有人認為它是從亞伯拉罕之約算起，並提到加3:17 正是把律法定在應許之後四百三十年。"
- title: 創十五14 亞伯拉罕之約的財物應驗
  path: link_folder/互文/創十五14 亞伯拉罕之約的財物應驗.md
  summary: "v35-36 以色列人向埃及人要金器銀器衣裳、埃及人給他們所要的——「他們就把埃及人的財物奪去了」"
  relation: "創15:14「後來他們必帶著許多財物從那裡出來」在本章最終執行；《精讀本》讀為「如同戰場上的勝利者獲取戰利品」，《丁道爾》指本節字眼故意令人想起3:22 的應許"
- title: 詩七八51、一三六10 擊殺長子
  path: link_folder/互文/詩七八51、一三六10 擊殺長子.md
  summary: "第29節半夜耶和華擊殺埃及地所有的長子；第23節則出現執行的那一位——「不容滅命的進你們的房屋，擊殺你們」。"
  relation: "詩78:49 是本章註釋回頭去引的經文。丁良才據此指出滅命的「不過是服役的靈」，因此「滅命者所行的就是神行的」；GT《中文聖經註釋》則坦承這裡有張力：按前後文滅命的應當是指神自己，「但在這裏卻是神不容滅命的進那門上有血者的房屋去擊殺他們，就明顯的是指另有天使、神靈或惡魔」。丁道爾把界線劃清楚：「以色列不信二元論，這位滅命使者並非什麼不受神操縱的鬼魔。」"
- title: 約翰福音十九36 羔羊骨頭不折
  path: link_folder/互文/約翰福音十九36 羔羊骨頭不折.md
  summary: "第46節「應當在一個房子裡吃；不可把一點肉從房子裡帶到外頭去。羊羔的骨頭一根也不可折斷。」三條規例是連在一起下的。"
  relation: "丁道爾引德萊維指出這三條規例所強調的是同一件事——逾越節的統一性：「一隻羊必須在一間房屋裡吃，骨頭亦一根也不可折斷（目的可能是避免有人將一部分的羊羔帶離房屋）」，並把它連到約17:11 所強調的合一。GT《舊約聖經背景註釋》給的是另一個理由：後兩條規例都是「防止與社群以外的人分享筵席」。GT《聖經精讀本》則同時保留預表與教會兩層：這句話暗示不要讓基督身體的骨頭被折斷（詩34:20；約19:36），「同時象徵成為基督身體的教會能夠完全地合而為一」。"
