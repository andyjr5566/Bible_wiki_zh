  relation: "GT《串珠聖經註釋》指出這節期的頒佈地點本身就有意義：「這逾越節的定例是在埃及地首次頒佈，後來在西乃（利23章）還會重提。」丁道爾同意這一點，並指出本章第13節是「全本舊約對這節期名字惟一的解釋」；但它也提醒不要把這一章讀得太滿：「逾越節不是救贖本身，而是救贖的肇始，渡過紅海和在西乃立約，皆可視為出埃及記真正的高峰。」"
- title: 牛膝草
  path: link_folder/原文/牛膝草.md
  summary: "v22 拿一把牛膝草蘸血打門楣門框——逾越節血記的具體執行工具"
  relation: "牛膝草在本章作為潔淨工具——從逾越節血記延伸到後續以色列潔淨儀式"
- title: 誰也不可出自己的房門
  path: link_folder/主題/誰也不可出自己的房門.md
  summary: "第22節在牛膝草蘸血打門之後，補上一條同樣要緊的禁令：誰也不可出自己的房門，直到早晨。"
  relation: "這句話把第13節「這血要在你們所住的房屋上作記號」落到實處——記號畫的是一個範圍，而不是一個人。GT《聖經精讀本》指出本段有兩個先前沒出現過的新內容，一是蘸血用的牛膝草，一是「直到早晨」禁止外出的命令；兩者都只見於摩西向長老轉達的這一段。"
- title: 耶和華
  path: link_folder/神學/耶和華.md
  summary: "v1,11,12,13,14,23,27,29,42,50,51 全章核心施事者——在埃及地曉諭摩西亞倫、設立逾越節、半夜親自巡行擊殺埃及長子、敗壞埃及一切的神、保護以色列家、領以色列軍隊出埃及"
  relation: "丁良才為第42節「這夜是耶和華的夜」列了四件事：「（一）耶和華的預言應驗；（二）耶和華的威嚴顯現；（三）耶和華的仇敵敗壞；（四）耶和華的百姓得救。」GT《啟導本》指出這句也可譯作「耶和華親自守夜」，原文兼有「保守、看顧、看察」的意思。丁道爾把它讀成一個雙關語，並給了一個意譯：「這是守夜的崇拜，因為耶和華當晚守夜。」CT 則指出第42節的「這夜」既是耶和華巡行埃及擊殺長子之夜，「也指耶和華保守以色列人之夜」——同一夜，兩件相反的事都是祂做的。"
- title: 滅命的
  path: link_folder/神學/滅命的.md
  summary: "第23節是本章唯一一次出現「滅命的」——耶和華巡行擊殺埃及人，看見門上的血就越過那門，不容滅命的進去擊殺屋內的人。"
  relation: "這一節與第12、29節形成一組張力：那兩節說擊殺的是耶和華自己（「那夜我要巡行埃及地」「耶和華把埃及地所有的長子……盡都殺了」），這一節卻另有一位執行者。各家對這個落差的處理，正是本條目的內容。"
- title: 救贖
  path: link_folder/神學/救贖.md
  summary: "第27節是全章唯一一次用「救」字總結那一夜所發生的事，而說這話的不是摩西，是後代的父母。GT《串珠聖經註釋》：「這答覆其實是一項信條，表明神曾在埃及施行救贖，但現在仍然照樣施行救贖。」"
  relation: "KC 為整章下的引言把次序說得很清楚：「以色列人未受先前大部分的災，是恩典。然而在最後一災、頭生的審判中，埃及與以色列並無分別。以色列的長子與埃及的長子一樣在審判之下。在我們知道什麼是拯救以先，必須先知道什麼是審判。」"
- title: 長子之死
  path: link_folder/歷史/長子之死.md
  summary: "第29節記下這一夜的範圍——從坐寶座的法老，直到被擄囚在監裡之人的長子，以及一切頭生的牲畜，盡都殺了；第30節記下結果——法老和一切臣僕並埃及眾人夜間都起來了，在埃及有大哀號，無一家不死一個人的。"
  relation: "GT《中文聖經註釋》指出「監裡」原文直譯應作「泥坑」，「擄囚的」直譯卻是「坐在」，因此第29節是一種文藝的表達：無論是坐寶座的，或坐在泥坑的，長子和頭生的牲畜盡都給殺了。丁道爾則認為與法老對比的不是第11章的推磨女子，而是「牢房中的戰俘」，並猜記述者心目中可能是約瑟的故事。丁良才對第30節「無一家不死一個人的」下了一個很細的註：「這是囫圇話，有些家頭生的是女兒，有些家的長子早先已經去世，也有些長子或者不在家。」"
- title: 法老
  path: link_folder/人物/法老.md
  summary: "v29-32 法老長子被殺、夜間與臣僕埃及眾人起來、半夜召摩西亞倫說「起來！連你們帶以色列人，從我民中出去…去事奉耶和華吧…連羊群牛群帶著走吧！並要為我祝福」"
  relation: "CT 指出第31節「法老這一個行動直接違反了他自己的話（參十28）」；丁良才說得更短：「此句顯明法老自食前言。」GT《中文聖經註釋》把這一刻的分量說了出來：「在10:28，法老已趕逐了摩西，並警告他不得再來見他，否則治死。現在他自己卻顧不得這面子了，連夜把摩西召來。」丁良才並從王位的角度說明第29節為何打得這麼重：「埃及的國位是世襲的，這樣，太子既然被殺了，與埃及全國關係甚大。」GT《串珠聖經註釋》注意到他的態度變了：「法老也要分擔埃及的痛苦，與他當初無關痛癢的表現（7:23），成一強烈對比。」但 KC 提醒這不是回轉：「法老不再作任何事攔阻以色列人。相反，他和他的臣民只想盡快擺脫他們。這裡沒有任何悔改可言。」"
- title: 神為何擊殺埃及眾長子
  path: link_folder/解經爭議/神為何擊殺埃及眾長子.md
  summary: "第29-30節是全章最重的一段：從坐寶座的法老直到被擄囚在監裡之人的長子，以及一切頭生的牲畜盡都殺了，在埃及有大哀號，無一家不死一個人的。"
  relation: "本章的來源在這一節下並排收了兩篇專門處理公義問題的文字（賈斯樂郝威〈命題17〉與艾基斯的難題彙編），這在整卷出埃及記中並不多見——說明這一節帶來的不安，古今讀者都感覺得到。"
- title: 第十災（殺長子之災）
  path: link_folder/歷史/第十災（殺長子之災）.md
  summary: "第29-30節是第11章 v4-6 宣告的應驗——半夜耶和華把埃及地所有的長子盡都殺了，埃及遍地大哀號，無一家不死一個人的。"
  relation: "GT《啟導本》指出這一災與前九災在解釋上的分別：「不少人曾用常理來解釋以前九災，但迄今無一人能圓滿解釋這最後一災，因為這是神自己施行的奇事。」GT《聖經精讀本》給了三條理由否掉「自然性傳染病」的說法：一、災難已經預言過；二、只局限於人和牲畜一切頭生的；三、超越地域，只臨在了埃及人身上。丁良才則從這一夜歸納出四條要訓：神的忍耐甚大（羅2:4）、神的話不能落空、神的威嚴往往忽然臨到（箴29:1）、神不偏待人（彼前1:17）。BH 也讀出兩邊的對照：埃及的大哀號，正襯出以色列的安靜——他們被逾越節羔羊的血保住了。"
- title: 法老召摩西
  path: link_folder/歷史/法老召摩西.md
  summary: "法老連夜召見，CT 解釋原因：「法老意識到再拖延下去恐會有更大的災難，因此來不及等到早晨，連夜召見摩西亞倫。法老這一個行動直接違反了他自己的話（參10:28）。」丁良才說得更直接：「此句顯明法老自食前言。」"
  relation: "GT《中文聖經註釋》指出這一刻的分量：「在10:28，法老已趕逐了摩西，並警告他不得再來見他，否則治死。現在他自己卻顧不得這面子了，連夜把摩西召來……這是摩西和其人民運動的大勝利──更是神對那自以為神的獨裁者的大勝利。」"
- title: 出埃及為要事奉神
  path: link_folder/神學/出埃及為要事奉神.md
  summary: "第31節法老親口說出摩西一路要求的那句話：「依你們所說的，去事奉耶和華吧！」第32節再加一句「也依你們所說的，連羊群牛群帶著走吧」。"
  relation: "CT 指出第31節的意思是「法老不再提出他的條件，完全照摩西亞倫的要求」，第32節則是「法老完全屈服，不再企圖扣留以色列人的牲畜和財產」。GT《中文聖經註釋》把這句話讀成一個認信：「法老現在認識神是誰了（參看五2）」——第5章他問「耶和華是誰，使我聽他的話」，到這一夜他自己答了。BH 也指出這句話點明了出埃及的首要目的：不是脫離奴役而已，是去敬拜、事奉耶和華。"
- title: 催逼離開
  path: link_folder/歷史/催逼離開.md
  summary: "第33節埃及人催促百姓、打發他們快快出離那地，說「我們都要死了」；第39節記下結果——他們用埃及帶出來的生麵烤成無酵餅，這生麵原沒有發起，「因為他們被催逼離開埃及，不能耽延，也沒有為自己預備甚麼食物」。"
  relation: "CT 指出這裡的轉折：「從前是強留，現在催促，兩者都出於強烈的意願」，並說這正應驗了第6章1節「趕出」的預言。GT《中文聖經註釋》把埃及百姓態度的變化按災的次序排了出來：「前面六災，對埃及百姓來說，可能只是皮肉之災；跟著的三災，卻有了死亡的陰影和威脅。現在，每家都死了一人，就不容只是王帝說話算數了。」——催促以色列人離境的已經不只是法老，是超越王權的整個民間。丁良才則指出第33節這句話同時解釋了第35-36節：埃及人為什麼願意把金器銀器送給以色列人。"
- title: 爐灶和摶麵盆
  path: link_folder/文化/爐灶和摶麵盆.md
  summary: "第34節「百姓就拿著沒有酵的生麵，把摶麵盆包在衣服中，扛在肩頭上」——摶麵盆在本章不是被蛙災侵入的家什，而是被扛著離開埃及的行李。"
  relation: "GT《舊約聖經背景註釋》說明這個作法的實用理由：「運輸已經摶好、供明日食用之麵團最簡易的辦法，是正如本節所言，把麵團放在摶麵盆中，蓋布以防弄髒。」GT《靈修版聖經註釋》補上它為何非帶不可：摶麵盆是用木頭、銅或陶器做的大盆，「餅既然是以色列人的主要食物，所以離開埃及時必須把摶麵盆扛在肩上帶走」。丁道爾則注意到經文的用詞：這是主婦所謂「未發」的麵，麵團用濕布包裹「沒有空氣透入也不能發酵」，似乎表示他們還未將一撚舊糰加在新麵之中——第39節的無酵餅就是這樣來的。"
- title: 埃及人給以色列人財物
  path: link_folder/歷史/埃及人給以色列人財物.md
  summary: "v35-36 以色列人照摩西的話向埃及人要金器、銀器和衣裳；耶和華叫百姓在埃及人眼前蒙恩，以致埃及人給他們所要的——他們就把埃及人的財物奪去了"
  relation: "CT 指出第36節「眼前蒙恩」意即心甘情願，「全句意指以色列人所拿的，都是埃及人所同意給的」；也提醒第35節「以色列人照著摩西的話行」表示他們「並非無法無天的強行掠奪埃及人的財物」。GT《啟導本》指出這批金銀後來的兩種去向：既造了金牛犢（32:2-4），也建了會幕（35:22-24）。丁道爾則注意到句子本身：「他們帶戰利品離開埃及，像得勝的大軍隊一般滿載而歸」，而本節的字眼「故意令人想起三章22節的應許」。GT《每日研經叢書》從埃及人那一邊看同一件事：「當他們被催逼要離去時，最後竟要金器銀器，這是不可思議的事。然而埃及人在生死關頭給他們那些東西，並非不可能；最後以賄賂，求撤去對生存的威脅。」"
- title: 分別百姓
  path: link_folder/神學/分別百姓.md
  summary: "第13節「這血要在你們所住的房屋上作記號」、第23節耶和華看見血就越過那門、第27節「越過以色列人的房屋，救了我們各家」——本章的分別不再靠地界（歌珊），而靠門上的一道血記。"
  relation: "KC 指出這件事的次序不可倒過來：「以色列人未受先前大部分的災，是恩典。然而在最後一災、頭生的審判中，埃及與以色列並無分別。以色列的長子與埃及的長子一樣在審判之下。在我們知道什麼是拯救以先，必須先知道什麼是審判。」CT 說「作記號」是「神順命之子民的記號」——凡有血在門框和門楣上的房屋，裡面所住的人就都是神的百姓。丁良才更把分界線畫在血本身而不在人的感受上：「人若相信血抹在門上就有平安，但叫他得救的不是他的信心，乃是他所信的真理，假若門上無血，就是人實信有血，也不能得救，若門上有了血，他雖恐懼不安，卻還要得救。」GT《聖經精讀本》把那一夜兩邊的光景並排寫下：「埃及人由於失去代表家族的長子而嚎哭的當晚，對以色列人來說是，連狗都不叫一聲的平安之夜。」"
- title: 蘭塞
