book: 出埃及記
chapter: 12
updates:
- title: 耶和華的話臨到
  path: link_folder/神學/耶和華的話臨到.md
  summary: "全章由兩次神的說話撐起——第1節「耶和華在埃及地曉諭摩西、亞倫說」啟動逾越節與無酵節的設立（第1-20節），第43節「耶和華對摩西、亞倫說：逾越節的例是這樣」啟動參與資格的條例（第43-49節）。第28、50節兩次收尾都用同一句話回應：「耶和華怎樣吩咐摩西、亞倫，以色列人就怎樣行。」"
  relation: "GT 丁良才指出開頭的「耶和華」三個字本身就是重點：「凡關係以色列人政治、社會、宗教的事都是神所指定的，不是摩西、亞倫所設立的」，並說「曉諭摩西、亞倫」一語「顯明他們占了特別的地位」。至於「在埃及地」，丁良才讀出兩層意思：一是本書是出了埃及以後寫的，二是「逾越節的禮儀是何等貴重」；CT 也說這幾個字表示本章的逾越節和除酵節「並非在西乃山下首創的」。"
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: "v1,21,28,31,35,50 摩西曉諭、召長老傳達、行禮、法老半夜召見、百姓照摩西的話要金銀衣裳、以色列眾人照耶和華吩咐摩西去行"
  relation: "第12章摩西是逾越節設立的傳遞者與出埃及的執行者——v28,50 兩次強調「耶和華怎樣吩咐摩西…以色列人就怎樣行」顯示摩西作為中保的完全順服"
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: "亞倫在本章共出現五次，每一次都與摩西並列——第1節同受曉諭，第28節「耶和華怎樣吩咐摩西、亞倫，以色列人就怎樣行」，第31節法老夜間召了摩西、亞倫來，第43節同受逾越節條例的曉諭，第50節「耶和華怎樣吩咐摩西、亞倫，以色列眾人就怎樣行了」。只有第21節召集眾長老宣講的是摩西一人。"
  relation: "法老在第32節向他們兩人求祝福，KC 注意到接下來的沉默：「在他求祝福這件事上，摩西和亞倫並沒有回應，不像先前他求他們代禱時那樣。法老這個人已經結案了。」丁良才則指出第1節「曉諭摩西、亞倫」一語「顯明他們占了特別的地位」——本章從頭到尾，神的吩咐都是同時交給這兩個人的。"
- title: 以本月為正月
  path: link_folder/主題/以本月為正月.md
  summary: "第2節是全章第一條命令，動的不是禮儀而是曆法——出埃及的那個月被定為正月、為一年之首，以色列的年從此從救贖之日起算。"
  relation: "這一節先於逾越節的一切細則出現，等於為整章定調：接下來的羊羔、血記、無酵餅都掛在這個新的起點上。GT《丁道爾》指出逾越節因此「不但是春季的節期，亦是新年的慶典」，而它和以色列所有其他節期一樣，「深深建基於以色列歷史和神拯救的作為之上」。"
- title: 一家一隻
  path: link_folder/主題/一家一隻.md
  summary: "第3-4節把逾越節的計量單位定在「父家」上——一家一隻，人太少就與隔壁鄰舍共取一隻，按著人數和飯量計算。"
  relation: "這條規矩決定了逾越節的形態：它是在各家的房屋裡守的，沒有祭司、沒有祭壇、沒有聖所。丁道爾正是從這裡讀出節期起源甚早的證據，而 CT 與 KC 則從中讀出救恩以家庭為單位臨到的意思。"
- title: 在黃昏的時候
  path: link_folder/原文/在黃昏的時候.md
  summary: "第6節定下宰羊羔的時刻：留到本月十四日，在黃昏的時候，由以色列全會眾宰了。這個時刻用的是一個原文成語，直譯作「在兩個黃昏之間」。"
  relation: "本章前後幾個時間點都靠這個時刻定位：初十取羊羔（第3節）到十四日黃昏宰羊，中間正好四天；宰了之後進入的是十五日的當夜（第8節），也就是無酵節的頭一日（第18節）。時刻定不準，全章的日程就接不上。"
- title: 逾越節羔羊
  path: link_folder/歷史/逾越節羔羊.md
  summary: "第3節定下「按著父家取羊羔，一家一隻」，第4節容許人少的家與鄰舍共取，第5節限定無殘疾、一歲的公羊羔，第6節留到十四日黃昏由全會眾宰。GT 丁良才把兩種緣故都寫出來：羊羔無殘疾，是因為「神只能悅納上好的祭物」，也因為「這羊羔預表基督完全的聖潔」；要公羊羔則因為「這羊羔代替頭生的男子」。"
  relation: "初十到十四這四天不是形式。丁良才說：「以色列人在逾越節以前四天，預備逾越節的羊羔，無非是要留心那羊羔完全不完全。」GT 趙世光說得更具體：這四天「每家要仔細查看，如果查出這公羊羔有損傷，或是缺欠，就當掉換」。GT《舊約聖經背景註釋》則從畜牧的角度說明為何選一歲公羊：公羊滿一歲「就算是度過了初生時最艱難的時期（死亡率在百分之二十到五十之間）」，而羊群並不需要那麼多公羊，所以一歲的公羊羔多被宰殺供應皮草和肉食。"
- title: 逾越節血記
  path: link_folder/歷史/逾越節血記.md
  summary: "血在本章出現三次，一次比一次具體——第7節吩咐塗、第13節說明作用、第22節說明工具與姿態。KC 指出這是聖經第一次談血的意義：「創世記裡我們讀到獻祭，卻沒有讀到血。」"
  relation: "血塗在哪裡是有講究的。CT：「注意，血不是塗在門檻上，以免被人踐踏（參來10:29）。」KC 說的是同一件事：「不可塗在門檻上，因為那會顯出對血的輕看，在那裡血會被踐踏。」"
