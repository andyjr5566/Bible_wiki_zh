- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: |
    第4節「要把他們寄居的迦南地賜給他們」，第8節「我起誓應許給亞伯拉罕、以撒、雅各的那地，我要把你們領進去，將那地賜給你們為業」——迦南地在本章是七重應許的終點。
  relation: |
    GT 丁良才指出「迦南地」這三個字在聖經中含兩種疆界：一是從西頓到迦薩（創10:19），二是從埃及河到伯拉大河（創15:18）——「神應許亞伯拉罕的是照著第二個意思」。CT 的原文字義說「迦南」意即「低地」，並指那地當時雖被七族的人佔據，「神終究要將那地賜給以色列人」。BH 說迦南是應許之地，代表神為祂百姓所預備的安息與福分，其地望在今日以色列、巴勒斯坦、黎巴嫩一帶，而這應許在約書亞記中應驗。GT《聖經精讀本》另加一句：日後以色列百姓能擁有此地，「是因著神的恩典」。
  sources:
