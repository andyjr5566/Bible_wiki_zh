- title: 擔子
  path: link_folder/神學/擔子.md
  summary: |
    第6-7節三次提到「重擔」：「救贖你們脫離他們的重擔，不作他們的苦工」「是救你們脫離埃及人之重擔的」——第5章加在百姓身上的擔子，在這裡成了神應許要解除的東西。
  relation: |
    CT 的原文字義註解把這幾個詞分得很細：「重擔」原文意指「受困於勞役」，「救贖」原文意指「付出代價以贖回」——全句意指以色列人正受困於埃及人的勞役之中，「神即將顯明為他們最近的親屬，贖回他們，使他們恢復原來自由的身分」。BH 也說「軛」象徵以色列人所受的苦役與壓迫，而神親自介入解除這軛。CT 的〔話中之光〕把它接到新約：「凡勞苦擔重擔的人，可以到我這裏來，我就使你們得安息」（太11:28）。
  sources:
  - CT_註解
