- title: 耶和華的話臨到
  path: link_folder/神學/耶和華的話臨到.md
  summary: |
    本章是「耶和華對摩西說」的密集章：第1節回應摩西的哀問，第2節「神曉諭摩西說：我是耶和華」，第10、28-29節再度說話，並吩咐「我對你說的一切話，你都要告訴埃及王法老」（v29）。
  relation: |
    GT《中文聖經註釋》指出第1節「仍然是只對摩西說話，沒有亞倫的分兒。因為惟有摩西才是祂的使者」，並說第6節「我是耶和華」這句自我表白「不單作為神的自我表白，也作為向摩西啟示立約的證據」，更表明祂是永遠且無所不在的，因此知道以色列人的景況，要主動施行作為成就立約的應許——同時也要求立約的另一方按神的旨意生活（結20:5-9；利11:44）。CT 的〔話中之光〕從第29節立下神僕的本分：「神的僕人乃是傳神話的人，神對我們說甚麼，我們就說甚麼，並且要傳說神對我們所說的『一切話』」，而且「必須切實認識『我是耶和華』，知道神必為祂所說的每一句話，負完全的責任」。
  sources:
  - CT_註解
  - GT_拾穗
  source_files:
  - ccbiblestudy_CT_exodus_6.txt
  - ccbiblestudy_GT_exodus_6.txt
- title: 法老
  path: link_folder/人物/法老.md
  summary: |
    第1節神預告法老的結局：「使他因我大能的手容以色列人去，且把他們趕出他的地」；第11、29節神兩次差摩西「進去對埃及王法老說，要容以色列人出他的地」；第27節總結摩西與亞倫就是向法老交涉的人。
  relation: |
    GT《中文聖經註釋》把第1節末句的原文力道譯出來：「使他要用強力的手段打發以色列人出去，就是用強力的手段，趕他們離開他的國境」——法老不但會容以色列人去，「乃是主動的設法打發他們離開，並且是強迫的趕他們出去」；GT《聖經精讀本》則把「趕出」讀得緩一點：「不是指強制性的趕出去，而是『放走』的意思」，法老終將如12:33那樣「慌忙趕走」似地放人。GT 丁良才一針見血：「他將來必要竭力地使你們行他現在所禁止的。」另注意第11節的要求已與3:18、5:3不同——丁良才指出「這一次摩西全不提到以色列人回來不回來」。
  sources:
  - GT_拾穗
  source_files:
  - ccbiblestudy_GT_exodus_6.txt
- title: 大能的手與出埃及神蹟
  path: link_folder/神學/大能的手與出埃及神蹟.md
  summary: |
    第1節「使他因我大能的手容以色列人去」是本章對十災的第一次預告，與第6節「我要用伸出來的膀臂重重的刑罰埃及人」前後相扣。
  relation: |
    GT《中文聖經註釋》指出「大能的手」原義是「用強力的手段」，而且原文並沒有「因我」二字，是和合本依上文語意補上的；若按七十士譯本，末句則作「伸手趕他們離開他的地」。GT 丁良才由此立了一句話：「難處越多，越發使神的能力顯大；西國有俗語說：人的急難，是神的機會。」CT 也說第6節「我要用伸出來的膀臂重重的刑罰埃及人」意指神要伸出大能的手替以色列人申冤，而 GT《中文聖經註釋》直說這句「是十災的預示」。BH 則從神學上收攏：「大能的手」象徵神的能力與介入，法老最終放人「是神作為的結果，而不是法老的仁慈」。
  sources:
  - CT_註解
  - GT_拾穗
  - BH_BibleHub Study
  source_files:
