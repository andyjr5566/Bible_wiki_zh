- title: 全能的神（El Shaddai）
  path: link_folder/神學/全能的神（El Shaddai）.md
  summary: |
    第3節「我從前向亞伯拉罕、以撒、雅各顯現為全能的神」——這是神向列祖啟示自己時所用的名，與本章要啟示的「耶和華」形成兩個階段。
  relation: |
    CT 的〔話中之光〕給了一個少見的解釋：「『全能的神』原文的意思是『有乳房的大能者』，亦即『全豐的神』。祂足以應付所有的問題和難處，成就祂的應許，仍有餘裕。」GT《中文聖經註釋》則記另一種讀法：El Shaddai「直譯可作『山神』」，這大概是其後亞蘭人把以色列人所敬拜的神稱作山神的原因（王上20:23、28），而這名字本身與立約及立約者當怎樣為人有關（創17:1-14）。GT《串珠聖經註釋》指出這稱號第一次出現正是在神與亞伯拉罕立約時（創17:1）；GT《舊約背景註釋》更把兩個名字的分工說清楚：與伊勒沙代相連的是族長在世時實現的那部分約，與耶和華相連的則是長遠的應許。BH 也說 El Shaddai「強調神至高的能力與豐足」，使列祖確信祂必能成就所應許的。
  sources:
  - CT_註解
  - GT_拾穗
  - BH_BibleHub Study
  source_files:
  - ccbiblestudy_CT_exodus_6.txt
  - ccbiblestudy_GT_exodus_6.txt
  - biblehub_study_exodus_6.txt
- title: 耶和華聖名的啟示
  path: link_folder/神學/耶和華聖名的啟示.md
  summary: |
    第3節下半「至於我名耶和華，他們未曾知道」是本章最大的解經問題：創世記裡列祖分明用過這個名（創4:26；12:8；15:7；28:13、16；22:14）。各家給出的解法可以分成四種。
  relation: |
    GT 李道生《舊約聖經問題總解》整理出四種可能：一是後世的作者或編者把已知的名字用回前代的記載；二是列祖知道這名字卻不明白其中的意義；三是「他們」指當代的以色列人，他們已遺忘了這名，所以神要摩西重申；四是列祖確實不知道——他自己判斷第二、三說「比較實際」。GT 丁良才同持第二說：以色列人並不是不曉得神的名稱為耶和華，「乃是不明白內中有極寶貴極全備的意思」；GT《啟導本聖經腳註》也說他們「沒有完全明白所包含的救贖以色列人的意義。他們和子孫必須有了出埃及到曠野的經驗之後才會明白」。賈斯樂郝威補了一個語言上的旁證：以 -ah（表示耶和華）作字尾的人名（彌迦、約拿、耶利米）在摩西時代之前很少見。GT《舊約背景註釋》給的分寸最值得記住：「六章3節表面看來，似乎表示族長時代的列祖並不熟悉耶和華的名。但這看法很清楚是不吻合創世記十五7和二十八13」——說族長不曾經歷祂是對的，但經文「不必然會導致一個結論，說他們對這名一無所知」。GT《中文聖經註釋》則整理成兩個階段：第一階段向列祖啟示為全能的神，第二階段向摩西啟示為耶和華。
  sources:
  - GT_拾穗
  source_files:
  - ccbiblestudy_GT_exodus_6.txt
- title: 立約
  path: link_folder/主題/立約.md
  summary: |
    第4節「我與他們堅定所立的約」與第5節「我也紀念我的約」，把出埃及的行動整個安放在與列祖所立的約上；第7節「我要以你們為我的百姓，我也要作你們的神」則是立約的定式語。
  relation: |
    GT《中文聖經註釋》指出第4節推前到與亞伯拉罕所立的約（創17章），「而且這約是堅立的──永遠而不會廢棄的」；GT 丁良才列出這約散見的經文：創15:18-21；17:7-8；26:3-4；28:13；35:12。至於第7節，同一份注釋說「這是神應許與人立約的話，也是有揀選含義的話」（創17:7-8；出19:5-6；29:45-46；利26:12；申26:17-18；耶7:23；結11:20）；並指出「我是耶和華」這句自我表白同時要求立約的另一方按神的旨意生活、聖潔為人（結20:5-9；利11:44）。CT 則從神的角度看這約：「神竟甘願親自受『約』的束縛，一再重申並堅定『約』的效力」，而「神以自己的名賜約，更是見證守約的信實性」。
  sources:
  - CT_註解
  - GT_拾穗
  source_files:
  - ccbiblestudy_CT_exodus_6.txt
  - ccbiblestudy_GT_exodus_6.txt
- title: 寄居身分
  path: link_folder/神學/寄居身分.md
  summary: |
    第4節「要把他們寄居的迦南地賜給他們」——列祖在應許之地上的身分是寄居的客旅，這正是本章要對比的：應許已立，實現卻在後代。
  relation: |
    CT 說當亞伯拉罕、以撒、雅各還活著的時候「只不過是寄居的客旅（來11:9），他們不曾真正擁有過整個迦南地，但神應許要賜給他們的後裔」；〔話中之光〕由此延伸：「信徒在世上的身份不過是寄居的客旅（彼前2:11），神卻應許那些照祂旨意在世度日的人，將來必要承受地土。」GT 丁良才補上歷史的一面：亞伯拉罕和他的後裔寄居迦南直到雅各下埃及，是迦南人、比利洗人、赫人所許可的（創12:6；13:7；20:15；23:7）。BH 也說列祖作為外人「沒有永久擁有那地」，這身分凸顯他們對應許的信心，並在新約中被用來形容信徒是地上的客旅（彼前2:11）。KC 則點出這正是「耶和華」這名的重點所在：「列祖在應許之地是外人。神已把應許賜給他們，如今祂要成就這些應許。」
