- title: 雅各
  path: link_folder/人物/雅各.md
  summary: |
    第3、8節把雅各列在列祖公式中；而本章的族譜（v14-27）正是從「以色列長子流便」開始，順著雅各的兒子排下來，最後停在利未一支。
  relation: |
    CT 指出神與雅各個別立約、應許把迦南地賜給他的後裔（創35:12），GT 丁良才在第4節也引創28:13、35:12為證。族譜的開頭用的是「以色列」而不是「雅各」——GT《中文聖經註釋》說這是按創46:8-11列出以色列頭三個兒子的第一代，第三個兒子利未卻列了五代，「並特別重亞倫和其後人」。BH 補上一句背景：流便雖是長子，卻因與辟拉的事失去了長子的名分（創35:22；49:3-4），這也是本章族譜雖從他開始、重點卻不在他的緣故之一。
  sources:
