book: 出埃及記
chapter: 6
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: |
    本章接在摩西的控訴之後（5:22-23）。神沒有責備他，而是重新啟示自己：「我是耶和華」（v2）。摩西把七重應許轉告以色列人，他們卻因苦工愁煩不肯聽（v9）；神再命他去見法老，他兩次以「拙口笨舌」推辭（v12、30）。中間插入的利未族譜（v14-27）則確認了他與亞倫的身分與權柄。
  relation: |
    KC 把神的回應說得最準：「耶和華沒有責備摩西。摩西灰心，是因為他看見了法老是誰、百姓是誰；神不責備他，反而讓他看見祂是誰。」GT《中文聖經註釋》注意到第1節「耶和華對摩西說」的一個細節：「仍然是只對摩西說話，沒有亞倫的分兒。因為惟有摩西才是祂的使者。」摩西第二次的推辭則暴露他信心的實況——GT《聖經精讀本》說「連自己同族以色列百姓都不能說服，怎麼敢站在法老面前呢？由於百姓的不信，連摩西也灰心了。摩西的信心還很脆弱」。CT 的〔話中之光〕反過來立了一條原則：「神的僕人辦理事情，有時候可能會得不到弟兄姊妹們的支持，但若已得到神確切的話語，仍須遵照神的話去作。」
