- title: 以色列
  path: link_folder/原文/以色列.md
  summary: |
    本章的以色列人有兩種面貌：一面是神七重應許的對象——「我要以你們為我的百姓，我也要作你們的神」（v7）；一面是「因苦工愁煩，不肯聽」摩西的人（v9）。第26節神卻稱這批奴工為「軍隊」。
  relation: |
    CT 的原文字義註解說「以色列」意即「神勝過」。第9節的反應，GT 丁良才列出三重代價：「他們錯看了神；他們使自己的苦難加重；他們得不著神的安慰」；GT《聖經精讀本》說得更沉：「暫時的苦難，使喜悅和渴望變成了埋怨和絕望，信心和順從變成了不信和悖逆。」而賈斯樂郝威《聖經難解經文詮釋手冊》處理了它與4:31「百姓就信了」的張力：「很明顯的早先他們接受摩西所說的，但是當他們沒有經歷到即時的釋放時，他們感到氣餒失去耐心，再也不聽摩西的話了。」CT 則從第7節指出神與百姓的關係何時建立：「這是以色列人還在埃及為奴的時候，神對他們的宣告——由此可見，神與我們信徒彼此之間的關係，絕對不是建立在我們的社會地位上，而是建立在神對我們的揀選。」
  sources:
  - CT_註解
  - GT_拾穗
  source_files:
  - ccbiblestudy_CT_exodus_6.txt
  - ccbiblestudy_GT_exodus_6.txt
- title: 亞伯拉罕
  path: link_folder/人物/亞伯拉罕.md
  summary: |
    第3節「我從前向亞伯拉罕、以撒、雅各顯現為全能的神」，第4節「我與他們堅定所立的約，要把他們寄居的迦南地賜給他們」，第8節「我起誓應許給亞伯拉罕、以撒、雅各的那地，我要把你們領進去」——本章三處把出埃及直接接回與列祖所立的約。
  relation: |
    CT 指出神曾分別和亞伯拉罕、以撒、雅各立約，把迦南地賜給他們的後裔為業（創17:7-8；26:3-4；35:12），而列祖在世時「只不過是寄居的客旅，他們不曾真正擁有過整個迦南地」（來11:9）。GT 丁良才把第8節的起誓連到創22:16-18；GT《舊約背景註釋》則提出一個分工的讀法：與「伊勒沙代」（全能的神）相連的，是族長在世時就實現的那部分約（創17:1；35:11），與「耶和華」相連的則是長遠的應許，尤其是土地。BH 也說神向列祖顯現是聖經敘事的根基事件，「立下了信心與順服的先例，成為後代的榜樣」。
  sources:
  - CT_註解
  - GT_拾穗
  - BH_BibleHub Study
  source_files:
  - ccbiblestudy_CT_exodus_6.txt
  - ccbiblestudy_GT_exodus_6.txt
  - biblehub_study_exodus_6.txt
- title: 以撒
  path: link_folder/人物/以撒.md
  summary: |
    第3、8節兩次把以撒列在「亞伯拉罕、以撒、雅各」的列祖公式中：神向他顯現為全能的神，也向他起誓應許那地。
  relation: |
    CT 指出神與以撒個別立過約（創26:3-4），而這約如今要在他的後裔身上成就；GT 丁良才在第8節註解也引創26:3為神起誓應許的出處。BH 說以撒是應許之子，代表神與亞伯拉罕之約的延續，提到他就凸顯神保守立約後裔的信實。列祖三人並列的作用，CT 說得清楚：這是「守約的神」的標記——祂信守對亞伯拉罕、以撒、雅各個別的應許。
  sources:
  - CT_註解
