- title: 約基別
  path: link_folder/人物/約基別.md
  summary: |
    第20節是聖經中少數幾處指名摩西母親的經文之一：「暗蘭娶了他父親的妹妹約基別為妻，她給他生了亞倫和摩西。」
  relation: |
    CT 的原文字義說「約基別」意即「耶和華是榮耀」，GT《中文聖經註釋》作「神的榮耀或神是尊貴的」，BH 也記其名意為「耶和華是榮耀」，並說這名字或許反映以色列人在埃及為奴時期仍存的信心與盼望。她與暗蘭的關係，GT《聖經精讀本》說得最清楚：聖經別處記為「利未的女子」（2:1）或「利未的女兒」（民26:59）的暗蘭之妻約基別，「其實是暗蘭的姑姑」，這種近親結婚可能是在摩西律法之前，律法頒佈後即被禁止（利18:12）。另有一個沉默值得注意——CT 指出這段家譜（v14-25）只記兒子而不記女兒，所以沒有提起摩西的姐姐米利暗（2:4、7；民26:59）。
