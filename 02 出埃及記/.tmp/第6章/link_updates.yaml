- title: 流便
  path: link_folder/人物/流便.md
  summary: |
    第14節「以色列長子流便的兒子是哈諾、法路、希斯侖、迦米；這是流便的各家」——族譜從長子開始，卻只列一代就轉去下一個支派。
  relation: |
    CT 說本章的名單旨在凸顯利未支派，流便與西緬只是按次序點名。GT《中文聖經註釋》給出四個兒子名字的字義：哈諾（供獻的或開端的）、法路（優越的或盛譽的）、希斯崙（村居者或圍住的）、迦米（我的葡萄園丁），並指這一代取自創46:8-11。BH 補上流便地位的背景：他雖是雅各的長子，卻因與辟拉的事失去了長子的名分（創35:22；49:3-4），這對理解雅各家族的權力轉移以及猶大、約瑟兩支派的崛起十分重要；同一份注釋也說這些名字在民26:5-9再次出現，可與本章互相印證。
