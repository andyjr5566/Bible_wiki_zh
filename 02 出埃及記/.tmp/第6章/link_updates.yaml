- title: 拙口笨舌
  path: link_folder/原文/拙口笨舌.md
  summary: |
    第12、30節摩西兩次以「拙口笨舌」推辭，但這裡的原文與4:10不同——CT 與 GT 都指出它直譯是「未受割禮的嘴唇」。
  relation: |
    GT 丁良才把聖經中「未受割禮」用在人身上的三處排在一起：嘴唇是拙口笨舌（出4:10；6:12、30），耳朵是聽不清楚（耶6:10），心是領受不明白（利26:41；耶9:26；結44:7；徒7:51）。GT《串珠聖經註釋》把字面意思說得更具體：「未受割禮之嘴」意思是「嘴被嘴唇的皮蓋住，以致說話困難」。KC 的解釋最深：割禮是約的記號，是一個人要作神地上子民必須有的外在印記（創17:9-14），「摩西覺得自己像個缺少了甚麼的人，像神百姓中一個有缺陷的成員，因此覺得自己沒有能力、也不配帶著能力說話」。而神的回應是不回應——KC 說「耶和華沒有理會這話，只是命令他去」。摩西的推論本身，CT 讀出兩層：自家人尚且不聽信，何況外邦人法老；即使能言善辯或可說服，何況拙口笨舌。GT 丁良才則反過來說：「法老阻擋不算稀奇，以色列人不信才為稀奇。」
