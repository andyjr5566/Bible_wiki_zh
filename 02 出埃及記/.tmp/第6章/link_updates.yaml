- title: 暗蘭
  path: link_folder/人物/暗蘭.md
  summary: |
    第18節把暗蘭列為哥轄之子，第20節說「暗蘭娶了他父親的妹妹約基別為妻，她給他生了亞倫和摩西。暗蘭一生的歲數是一百三十七歲」——這兩個「暗蘭」是不是同一個人，正是本章族譜最大的難題。
  relation: |
    CT 直說「摩西的父親暗蘭應不是利未的孫子暗蘭」，理由是四百三十年裝不下三代，而且七十人也不可能在三、四代之內增至六十萬男丁，「這裡的記載，至少略過了六至七代」。GT 丁良才給的第一個理由是人口：在摩西年間，哥轄後裔四族的男丁已有八千六百人（民3:27-28），「這樣看來，暗蘭一族大約不下二千多男丁」；第二個理由是體例——聖經的家譜中往往有間隔，如以斯拉的家譜（拉7:1-3）便省去了好幾代。賈斯樂郝威的算法相同：若只有三代，暗蘭、以斯哈、希伯倫、烏薛每一支就得各有兩千多人，「很明顯的，出埃及記六章18節所提到的暗蘭並非摩西的直接生父」。至於他所娶的約基別，CT 指出這是娶了自己的姑媽，「這是後來的摩西律法所特別禁止的」（利18:12）。
