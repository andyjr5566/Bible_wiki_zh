- title: 埃及
  path: link_folder/地點/埃及.md
  summary: |
    本章的埃及是三重身分：苦待以色列人、使他們發出哀聲之地（v5），神要把百姓從其中領出來的地方（v6、11、13、26-27），以及神即將施行刑罰的對象（v6）。
  relation: |
    CT 的原文字義註解說「埃及」意即「兩個海峽」。第6節「我要用伸出來的膀臂重重的刑罰埃及人」，GT《中文聖經註釋》直說「這是十災的預示」；第11節神要摩西「進去對埃及王法老說」，CT 解「進去」是進到皇宮裡面去。BH 則把埃及讀成神學上的象徵：它「常象徵罪與捆綁」，而「出他的地」一語強調神要祂的百姓與埃及徹底分開——不只是地理上的離開，也是屬靈上的分別。第26-27節兩次說「從埃及地領出來」，CT 說這是申明神差遣摩西和亞倫的最終目的。
  sources:
  - CT_註解
