- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: |
    第13節神吩咐摩西和亞倫「往以色列人和埃及王法老那裡去」，把以色列人從埃及地領出來；族譜在第20節記他是暗蘭與約基別的兒子，第23節記他娶猶大支派首領拿順的妹妹以利沙巴，生拿答、亞比戶、以利亞撒、以他瑪；第26-27節兩次點名這對兄弟，卻換了次序。
  relation: |
    GT 丁良才《出埃及記註釋》與《聖經精讀本》都指出這個次序的用意：第26節作「亞倫、摩西」是按長幼，第27節作「摩西、亞倫」是按職任；GT《中文聖經註釋》講得更具體——「對以色列人，是以亞倫為首，但對埃及王說話，還是以摩西為首」，因為到底摩西才是神差派去與法老說話的使者。同一份注釋還從文獻的角度解釋這段譜系為何處處抬高亞倫：這批材料是從祭司圈子中搜集、編寫和收存的，也是用來教育祭司的。KC 則把兩人合看成主耶穌的圖畫：摩西是神與人之間的中保、代表神向著人，亞倫是大祭司、代表人向著神（來3:1）。
