- title: 西緬
  path: link_folder/人物/西緬.md
  summary: |
    第15節「西緬的兒子是耶母利、雅憫、阿轄、雅斤、瑣轄，和迦南女子的兒子掃羅」——族譜同樣只列一代，卻留下一個罕見的註記：其中一子的母親是迦南女子。
  relation: |
    GT 丁良才逐一比對這些名字在別處的異文：耶母利在代上4:24、民26:12作尼母利；阿轄在民26:12、代上4:24沒有出現，「大概是因為阿轄絕了後」；雅斤在代上4:24作雅立；瑣轄在民26:13、代上4:24作謝拉；而掃羅「這人的後裔後來繁多」（代上4:25-27）。GT《中文聖經註釋》另給名字字義：耶母利（神的節期或神的兒子）、雅憫（右手）、阿轄（力量或聯合）、雅斤（他使之堅定或設立）、瑣轄（黃褐色皮膚）、掃羅（祈求的或禱告獲答允）。BH 則點出「迦南女子的兒子」這句話的意義：它顯示以色列各支派中確有混合血統，也反映當時複雜的社會文化往來。
  sources:
  - GT_拾穗
  - BH_BibleHub Study
  source_files:
  - ccbiblestudy_GT_exodus_6.txt
  - biblehub_study_exodus_6.txt
- title: 利未
  path: link_folder/人物/利未.md
  summary: |
    第16節「利未眾子的名字按著他們的後代記在下面：就是革順、哥轄、米拉利。利未一生的歲數是一百三十七歲」——族譜到了利未就從一代擴展成五代，一路列到亞倫的孫子非尼哈。
  relation: |
    CT 指出利未支派的名單長達十節，「可見本章的名單，旨在凸顯利未支派，而摩西、亞倫和祭司家族均出自利未支派」。GT《中文聖經註釋》給三個兒子的字義：革順（放逐或趕出）、哥轄（率直的或立盟的）、米拉利（苦的或苦惱）；GT《丁道爾聖經註釋》另指「米拉利」這名可能是埃及語，而這類埃及語名字「在利未支派十分常見」。GT《聖經精讀本》注意到記歲數的用意：與利未一同記下壽命的還有哥轄（v18）與暗蘭（v20），加上7:7所記摩西的年歲——利未、哥轄、暗蘭、摩西這四代，正對應創15:16「到了第四代，他們必回到此地」的預言。BH 則說利未三子各有分工：革順一族看管帳幕的幔子與罩棚，哥轄一族（摩西與亞倫所出）負責至聖的器具包括約櫃，米拉利一族負責架構部分。
