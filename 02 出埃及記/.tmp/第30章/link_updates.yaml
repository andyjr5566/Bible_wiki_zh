book: 出埃及記
chapter: 30
updates:
- title: 皂莢木
  path: link_folder/原文/皂莢木.md
  summary: 出30:1、5 香壇與抬壇的兩根槓都用皂莢木做，外面包金。GT《中文聖經註釋》指出這一點是本章與其他器具一貫的作法：香壇「和帳幕其他物件一樣是皂莢木造成，外面包金，鑲有環子可以穿杠扛抬」；同一則註釋另注意到抬壇之物的規格比別處更高：「這香壇既是放在聖所內的尊貴地方，所以不但壇要包金，壇兩旁穿杠的環子也用金做，並且抬壇的木杠也用金包裹，用以表明其尊貴的地位。」BH 從材質本身說明理由：皂莢木「以耐久、抗腐著稱，象徵神之約的長存」，而它在西乃一帶隨處可得，對曠野中的以色列人是務實的選擇。
  relation: 皂莢木在會幕系統裡走的是同一條線：約櫃、陳設餅桌、豎板、燔祭壇的骨架，到本章的香壇，核心都是這種木頭，外面按所在位置包上不同的金屬——院子裡包銅，聖所裡包金。CT 一貫把它讀為基督的人性：「皂莢木表徵基督的人性；燒香的壇表徵基督為大祭司，是眾聖徒的代求者（來7:22）。」本章的組合因此特別完整：人性的木頭外面包著榮耀的金，擺在最靠近至聖所的位置上代求。
- title: 銅
  path: link_folder/主題/銅.md
  summary: 出30:18 洗濯盆與盆座用銅做，放在會幕和壇的中間。CT 一貫讀銅為審判：「銅表徵審判；洗濯盆表徵話中之水的洗淨（弗5:26）」，並把兩者串起來：「洗濯盆是用銅造的，銅是表明經過審判。祭司到洗濯盆那裡先須找出污穢，後藉著水洗除污穢。」KC 在本章把銅與金的分工說得最完整，因為兩座壇正好同時出現：「燔祭壇是銅的，香壇是金的。銅說到神的公義，金說到神的榮耀。」GT《丁道爾》另處理了一個譯名問題：「雖然一般英譯本作『青銅』（銅錫合金），要譯法一貫最好還是譯『銅』，因為青銅和紫銅（純銅）在希伯來文是同一個字。」
  relation: 本章是銅與金在同一段經文裡對照最清楚的一次：院子裡的燔祭壇包銅、聖所裡的香壇包金，而洗濯盆——這個介於兩者之間、擺在會幕與壇中間的器具——用的是銅。這個材質的選擇本身就在說位置：洗濯盆屬於「還要經過審判」的那一側，人要先在那裡被照出污穢、洗淨，才進得去包金的聖所。CT 的讀法正是如此：「如果我們要進入聖所事奉神，必須經過洗濯盆，藉著道潔淨，成為聖潔。」
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出30 全章仍是摩西在山上所領受的吩咐，而 GT《中文聖經註釋》指出它與執行記載的對應關係：「這章和這段經文，說明香壇的製法，而比撒列便按這製法，在卅七25～28中的記述，予以完成。」不過同一則註釋也留下一個文本上的疑點：「執行本段吩咐製造香壇的經文，卅七25～28，卻不見於七十士譯本。理由無法知道。」本章在全書結構中的位置也不尋常：GT《丁道爾》認為出30-31 應視為附記——「本段討論幾個個別的事務，相互之間難以看出有什麼關聯……這些題目有些是前面缺口的補充（如：香壇），有些則為前面視為當然的事物提供解釋（如：膏油、香、洗濯盆）」；GT《串珠》的判斷相同：「這些指示彼此之間沒有直接關係；它們主要是補充以上幾章引述過而未有詳細記載的指示。」
  relation: 「照山上的樣式」在本章不是靠一句重複的話維持，而是靠配方的絕對性：聖膏油與聖香都給了逐項的分量，並各附一條「不可按這調和之法做與此相似的」的死刑禁令。樣式在這裡從尺寸擴及配方——連氣味都不許人自己調。而本章作為附記的性質，也讓這條原則顯出另一面：即使是前面章節「視為當然」而略過的東西（膏油、香、洗濯盆），神仍要一一給出規格，不留給人補完。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出30 補上三樣會幕中此前未詳述的物件與一項制度。GT《精讀本》把本章的結構列了出來：這部分「接27章有關對會幕的啟示，分為三個部分：①香壇（1-10節）；②洗濯盆（17-21節）；③製聖膏（22-33節）。同時也有對生命的贖價的啟示（11-16節）以及有關香的啟示。」聖膏油的用途更把整個會幕一次涵蓋：v26-28 要抹會幕、法櫃、桌子與其器具、燈臺與其器具、香壇、燔祭壇與一切器具、洗濯盆和盆座，「要使這些物成為聖，好成為至聖」。GT《中文聖經註釋》註明這個「抹」的實際做法：「是指摩西要在豎立聖幕時，用這聖膏油抹會幕和法櫃的某一部位為代表」，而不是像雅各澆油在石柱上那樣（創28:18；35:14）。而 v11-16 的贖罪銀也直接回到會幕——GT《串珠》指出這筆錢「不是為了建築會幕，而是供應會幕平時的需用（尼10:32）」。
  relation: 出25-29 造的是會幕與其中的人，出30 交代的是這一切要靠什麼維持運作：每天燒的香、每天用的水、抹一切器具的油、供應日常開銷的銀子。GT《丁道爾》把本章讀成附記，正是因為它處理的是前面「視為當然」的東西——但這些東西恰恰是會幕天天在用的。KC 則從功能上給本章一句總結：「這一章顯明作祭司親近神所需要的器物。」會幕因此不只是一組建築規格，而是一套要日日供應、日日潔淨、日日燒香的運作。
- title: 聖所
  path: link_folder/地點/聖所.md
  summary: 出30:6-8 金香壇放在聖所內、法櫃前的幔子外，亞倫每早晚在其上燒香。GT《中文聖經註釋》給出它在聖所中的確切位置與地位：「這金香壇是放在聖所靠幔子的正中位置，與聖所中的其他兩器物鼎足三立：陳設餅桌在其左，金燈臺在其右。這就表明金香壇比其他兩器物有更重要的地位。」GT《啟導本》則指出它的歸屬有兩種讀法：香壇「在聖所內（聖所內共有三樣聖物，就是陳設餅、金燈檯和金香壇），但隔著幔子，對正至聖所內的施恩座，因此可算作至聖所的物品（來9:3-4）」。相對地，洗濯盆不在聖所裡——GT《串珠》註明它「放在會幕和壇的中間，即是在外院裡」。
  relation: 本章把聖所的界線畫得更明確：進聖所之前要在院子的洗濯盆洗手洗腳（v20），進去之後每天早晚要在香壇燒香（v7-8），而香壇一年一次要用贖罪日的血潔淨（v10）。聖所因此不是一個純粹的空間，而是一段有前提、有節奏、有年度清算的事奉。KC 從器具的材質讀出同一條界線：銅壇在院子裡「為著所有人」，金香壇在聖所裡「只為那些已經得救的、可以作祭司帶著敬拜親近神的人」——聖所的門檻不在牆上，在洗濯盆與膏油上。
- title: 聖靈膏抹（約壹2：20,27）
  path: link_folder/互文/聖靈膏抹（約壹2：20,27）.md
  summary: 出30:22-33 是聖膏油的配方與禁令：四樣上品香料（流質沒藥、香肉桂、菖蒲、桂皮）與橄欖油調和，用來膏會幕、法櫃與一切器具，並膏亞倫和他的兒子；不可倒在別人身上、不可按這配方仿製，違者從民中剪除。KC：「聖膏油代表聖靈」，而那些香料「象徵基督的各樣榮美」。
  relation: 約壹2:20,27 的「恩膏」在此有了配方、範圍與禁令。KC 給了三層：①膏油代表聖靈，香料代表基督的榮美——「聖靈在信徒中間工作的地方，就會散發寶貴的香氣（詩133:1-2）；祂工作的地方，基督的榮耀就被顯明」。②會幕一切器具都要先受膏才能用——「在事奉神的事上，惟有出於聖靈工作的才有價值；沒有一樣不是出於祂的能歸到祂那裡（代上29:14），而歸到祂那裡的，裡面必須有基督（約5:23）」。③只有分別歸神的才可受膏——KC 直指有些人與有些事「看起來受了膏，其實沒有」，並點名自由派神學與普救論。恩膏因此不是感覺，是有形狀、有邊界的。
- title: 精金
  path: link_folder/主題/精金.md
  summary: 出30:3 金香壇要「用精金把壇的上面與壇的四圍，並壇的四角，包裹；又要在壇的四圍鑲上金牙邊」。KC 指出金香壇是會幕裡的第二座壇，與院子裡的銅壇形成一組對照：銅壇是銅，金壇是金。
  relation: 本章讓精金與銅的分工說得最清楚。KC：「銅說到神的公義，金說到神的榮耀。」兩座壇因此不只是材質不同，服務的對象也不同——銅壇在院子裡「為著所有人：人人都可以在主耶穌工作的基礎上得救」；金香壇在聖所裡，「只為那些已經得救的、可以作祭司帶著敬拜親近神的人」。而金壇的尺寸比銅壇小（長寬各一肘 vs 各五肘），KC 指這個差別正對應那兩份名單的大小。精金在此因此標記的是「已經進來的人所站的地方」——榮耀不是入口的材料，是內室的材料。
- title: 舍客勒
  path: link_folder/原文/舍客勒.md
  summary: 出30:13「每人要按聖所的平，拿銀子半舍客勒；這半舍客勒是奉給耶和華的禮物（一舍客勒是二十季拉）」，另 v23-24 的香料也「都按著聖所的平」計量。本章是「聖所的舍客勒」這個標準第一次被定義的地方。CT：「『聖所的平』原文是聖所的舍客勒，指當時在聖所內使用的砝碼，在收取奉獻物、贖罪銀時，作為度量的標準，每一舍客勒約折合十一點五公克。」GT《丁道爾》指出它與通用舍客勒輕重不同：「一舍客勒是二十季拉，『季拉』是巴比倫的重量單位」，而「根據《他勒目》，前者即『推羅舍客勒』」；GT《舊約背景註釋》給出考古實測：「考古學家挖掘到的法碼，顯示舍客勒的重量在九又十分之三至十又二分之一克之間」，並註明季拉「是來自亞喀得語的借詞」，為二十分之一舍客勒、約半克。GT《串珠》另作「大概相等於十一公分（五分之二安士）」。
  relation: 舍客勒在創24、出21、利5、利27、民3 各處都是計價或計重的單位，出30 卻是它第一次被神親自定為一個標準——「聖所的平」。這使它從市場的度量變成聖所的度量：同一個名字，兩套砝碼。GT《中文聖經註釋》也指出這個標準的實務問題：「古代耶路撒冷聖殿中，有標準的度量衡器由大祭司保管。在曠野時代有否這種標準度量衡器，是一個問題」——這正是學者對丁稅何時開徵意見分歧的根源之一。
- title: 剪除
  path: link_folder/原文/剪除.md
  summary: 出30:33、38 兩次「這人要從民中剪除」：一次針對私製聖膏油或把膏油抹在別人身上的（v33），一次針對仿製聖香「為要聞香味的」（v38）。CT 把刑度講明：兩者「都必須處死」。GT《中文聖經註釋》譯為逐出神子民之外，並指出 v32「別人」的原文與出29:33 的「外人」是同一個字；GT《啟導本》則把本章的剪除接回出12:15 的用法。
  relation: 剪除在正典其他地方多半針對行為——吃有酵的餅、擅敢行事、褻瀆聖名。出30 是它第一次被用來保護配方：不是做了什麼壞事，而是複製了神所定的東西。兩處禁令的對象也很具體——膏油不可倒在別人身上、聖香不可「為要聞香味」而做——都是把分別為聖之物挪作私用。KC 對此的讀法很不留情：「凡想要用他所看見之主耶穌的東西來使自己發光的人，罪就要在他身上顯明出來。」
- title: 立約的鹽
  path: link_folder/主題/立約的鹽.md
  summary: 出30:35「你要用這些加上鹽，按做香之法做成清淨聖潔的香。」CT 註明鹽的份量沒有說明，並讀為「鹽能防腐，表徵基督保守的能力」。GT《丁道爾》兩面都取：「將香料『用鹽調和』，即加上氯化鈉，或許能夠助長燃燒。這樣做亦可能因為食鹽有防腐功效」，而象徵上「一切祭物都包括了鹽，鹽本身亦能保證盟約（利2:13）」，並指出民18:19 與代下13:5 的「鹽約」是「可靠的約」。GT《中文聖經註釋》同樣兼取實用與象徵：「加鹽亦有實用的意義，因可易燒，且發白煙」，而鹽約「就是為肉用鹽醃後永不朽壞或廢壞的意思」。GT《精讀本》則說加鹽「是為了保存其香味……另一方面，聖經中的鹽象徵了神不變的約（民18:19）」。
  relation: 利2:13 把鹽定為素祭的必要成分，民18:19 與代下13:5 把它提升為「鹽約」的意象；出30:35 則是鹽第一次進入香的配方。三處合看，鹽走的是同一條線：它不是調味，是防腐——用在祭物上表示這約不會壞。而本章的位置特別：聖香是「至聖」的，加鹽因此不只保存香味，也把「不朽壞」這件事放進了每天升到神面前的煙裡。
- title: 凡火
  path: link_folder/主題/凡火.md
  summary: 出30:9「在這壇上不可奉上異樣的香。」GT《啟導本》把它與利10 的凡火並列為敬拜的兩條禁令：「聖經中有兩條關乎敬拜的禁令：1.不可燒『異樣的香』（三十9）；2.不可獻『凡火』（利十1）。」CT 的話中之光也並列同樣兩條，並分別解為「不可隨著自己的情慾禱告」與「應當在靈裡火熱，不可出自天然的熱心」。GT《精讀本》說異樣的香「是沒有照34-38節中的神的提示製作的香」，象徵「不能隨著我們的情欲禱告（雅4:3）」；BH 也把這條禁令直接連到拿答、亞比戶獻凡火被火燒滅（利10:1-2）。
  relation: 凡火與異樣的香是一對，卻不是同一件事：凡火錯在火的來源（不是從壇上取的），異樣的香錯在香的配方（不是照神所定的）。一個是來源自取，一個是內容自創——兩者合起來把敬拜的兩端都封住了。出30 因此是利10 悲劇的前置條款：規定在先，違例在後。
- title: 大贖罪日（Yom Kippur）條例
  path: link_folder/歷史/大贖罪日（Yom Kippur）條例.md
  summary: 出30:10「亞倫一年一次要在壇的角上行贖罪之禮。他一年一次要用贖罪祭牲的血在壇上行贖罪之禮，作為世世代代的定例。」CT 與 GT《啟導本》都指明「一年一次」是七月十日的贖罪日（利16:29-30；23:27），GT《啟導本》並稱它「是舊約祭祀中最重要的日子」。GT《舊約背景註釋》描述當日的動作：「大祭司當日要進到聖幕裡面，在金壇上燒香。當日特獻之祭的血也要點在香壇角上，使這個至聖的壇和流通其上的香，與全國之罪有潔淨的需要相連。」GT《中文聖經註釋》另指出這道血禮的目的是「使香壇成聖」。
  relation: 贖罪日的完整條例要到利16 才展開，出30:10 卻已經在不經意間提到它——而這一點正是它在批判學上的份量所在。GT《丁道爾》：「本節極之重要，因為它在不經意間提到贖罪日的禮儀，此外贖罪日只在利未記（利23:27）出現，以致不少學者視之為後期發明的新節日。」換句話說，出30 這一節是贖罪日並非後起之制的旁證。而它也界定了贖罪日在香壇上的那一個動作：一年三百六十四天燒香，只有一天抹血。
- title: 壇成為至聖與挨著壇的都成為聖
  path: link_folder/解經爭議/壇成為至聖與挨著壇的都成為聖.md
  summary: 出30:29「要使這些物成為聖，好成為至聖；凡挨著的都成為聖。」與出29:37 的爭議完全同型，而本章多了一個關鍵旁證。GT《丁道爾》主張聖潔確實可藉接觸傳遞，並舉出兩處經文：「這樣做有傳遞『聖潔』的果效，能夠把它分別出來供神使用。本節描述的情形與出埃及記十九章12節一樣，『聖潔』藉觸摸傳達，摸著的人必須死亡（祭司除外）。撒母耳記下六章7節烏撒的故事就是這原則的實例。」CT 則把範圍限在事奉的人身上：「『凡挨著的都成為聖』意指靠近並使用或搬運神聖器物的祭司和利未人都成為聖」，並在靈意上讀為「聖靈分別為聖的功用（參彼前1:2）」。
  relation: 出29:37 說的是壇，出30:29 說的是被膏油抹過的一切器具——範圍更大，因此傳遞說的張力也更大。丁道爾在本章給了兩個具體的支點（出19:12 摸山必死、撒下6:7 烏撒扶櫃而死），使「聖潔可藉接觸傳遞」不再只是推論；但同一組例子也顯出這種傳遞對不合資格的人是致命的。CT 的限定因此不是反對而是補充：能因挨著而成聖的，是祭司與利未人。兩章合看，這條原則的兩面在出30 才完整：對分別為聖的人是成聖，對其餘的人是危險。
- title: 香料乳香沒藥貿易
  path: link_folder/文化/香料乳香沒藥貿易.md
  summary: 出30:23-24 聖膏油用流質的沒藥、香肉桂、菖蒲、桂皮；30:34 聖香用拿他弗、施喜列、喜利比拿與淨乳香——全部都是進口貨，而且用量極大（沒藥與桂皮各五百舍客勒）。GT《舊約背景註釋》點出產地與商道：「膏油所列的香料全部都是進口的貨物，價錢應當很高，並且十分珍貴。這些香料有些來自阿拉伯南部（沒藥）、印度和斯里蘭卡（肉桂），有些則經固有的海陸商道從遠方（耶6:20曾經提及，和合本作『菖蒲』的香蔗）運來。」GT《丁道爾》的說法相同：「香料大多是商旅自遠方運來，有些甚至是印度的出產；阿拉伯不但是香料產地，更是香料貿易的中心。」GT《中文聖經註釋》逐一考證各樣香料的產地與用途，例如沒藥「是篤耨香樹的膠液。這種樹盛產於亞拉伯和印度」，且「古羅馬人多以此酒賜死囚行刑前飲用（參看可15:23）」。
  relation: 創37 的以實瑪利商隊馱著香料、乳香、沒藥下埃及，是這條商道在正典中的第一次出現；出30 則顯示以色列自己成了這條商道的買家——而且買的份量不小。同一批貨物在創37 是把約瑟賣去埃及的商隊所載，在出30 卻成了膏抹會幕與祭司的材料。GT《丁道爾》也提醒這些香料在當時的日常用途（化妝、歡宴、醫藥），「所以聖經有必要禁止這膏油作一般或凡俗的用途」——貴重的東西本來就有被挪用的風險。
- title: 搗細香料遮掩施恩座
  path: link_folder/主題/搗細香料遮掩施恩座.md
  summary: 出30:36「這香要取點搗得極細，放在會幕內法櫃前，我要在那裡與你相會。你們要以這香為至聖。」利16:12-13 大祭司帶進幔內的「搗細的香料」正出於這條規定。GT《中文聖經註釋》指出這批香不只燒在金壇上，也「為摩西和其後的大祭司與神相會之處，即至聖所中法櫃前撒散之用」，並給了一個很實際的理由：至聖所內無燈無光，「灑在施恩座上的牲血日久會發臭引來蚊蠅，極需這聖香予以調和並驅除蚊蚋蒼蠅」。同一則註釋也處理了一個文本上的疑問：有學者認為「放在會幕內法櫃前」應作放在香爐那裡，但原文既說法櫃前、又說「我要在那裏與你相會」，因此現代中文譯本作「要拿一部分搗成粉末，帶到我帳幕，撒在法櫃前」較合原義。CT 則讀「搗得極細」為「禱告須靠著聖靈，隨時多方（弗6:18）」。
  relation: 利16 的贖罪日，大祭司要用搗細的香造出煙雲遮掩施恩座「免得他死亡」；那一捧香的規格出於出30:36。兩處合看，「搗得極細」不是講究，是必要——香要細到能立刻起煙、能布滿至聖所。而它的位置也說明了級別：GT《丁道爾》引戴維斯指出膏油雖「聖」（31節），香卻稱為「至聖」（36節），「理由是它更為接近象徵耶和華臨在的約櫃」。
- title: 數點民數
  path: link_folder/事件/數點民數.md
  summary: 出30:11-16 是數點人口的條例：被數的人要各出半舍客勒為自己的生命贖價，「免得數的時候在他們中間有災殃」。GT《中文聖經註釋》指出以色列人在正典中三次被數（民1-2、民26、撒下24），「主要在知道二十歲以上能出去打仗的人數有多少」，但也提醒「歷代各國的人口調查，其主要目的在稅收，其次才輪到軍事和其他的因素」。GT《啟導本》認為出30 這一次「可能只是預先作的一次統計，為了收集贖銀來建造會幕（出38:25-27）」，而民1 的正式統計是在會幕建立一個月之後（民1:1,18；比較出40:17）。GT《精讀本》也指出這條條例的社會功能：讓貧富都參與建造會幕，「給以色列百姓樹立一種立約百姓的意識」。
  relation: 民1 記的是數點的執行，出30 記的是數點的前提條件——先付贖價，才可以被數。這個次序決定了整件事的性質：數點不是清點資源，而是逐一站在神面前。GT《舊約背景註釋》指出這在古代近東是逆流的作法：一般人怕被數點，因為那意味著加稅與徵兵；以色列的男丁卻要先繳費、承認神的權利，然後才「過去」——「是象徵他們接受了供應聖幕建造和維持需要的責任」。而撒下24 大衛數點百姓招來瘟疫，正好從反面說明缺了這個前提的後果。
