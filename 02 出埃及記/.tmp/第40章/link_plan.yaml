  suggested_type: 主題
  evidence: 出40:2,17-33 神吩咐摩西正月初一日立起帳幕；摩西照吩咐立起帳幕——安上帶卯的座、立上板、穿上閂、立起柱子；搭罩棚、蓋頂蓋；把法版放櫃裡、杠穿櫃旁、施恩座安櫃上；把櫃抬進帳幕、掛上遮掩櫃的幔子；把桌子安在會幕內北邊幔子外、將餅陳設在耶和華面前；把燈臺安在會幕內南邊與桌子相對、在耶和華面前點燈；把金壇安在會幕內的幔子前、在壇上燒了馨香料做的香；掛上帳幕的門簾；在會幕的帳幕門前安設燔祭壇、把燔祭和素祭獻在其上；把洗濯盆安在會幕和壇的中間盆中盛水以便洗濯；摩西和亞倫並亞倫的兒子在這盆裡洗手洗腳；在帳幕和壇的四圍立了院帷、把院子的門簾掛上。KC：the
