book: 出埃及記
chapter: 40
updates:
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: '出40:12-15 神吩咐摩西要使亞倫和他的兒子到會幕門口用水洗身，給亞倫穿上聖衣、膏他使他成聖，可以給神供祭司的職分；他的兒子也要照樣。出40:31 摩西和亞倫並亞倫的兒子在洗濯盆裡洗手洗腳。GT《聖經精讀本》解洗身：「用水洗身: 意味著,用生命的水潔淨信徒的心靈（約4:14；7:38、39；弗5:26）。」GT 丁良才指出在祭司未被分派以先，摩西在一切的事上代表祭司，「但亞倫和他的兒子也幫助」。GT《中文聖經註釋》從本段讀出祭司制度的預表：以色列本應全民作祭司的國度（出19:6），因罪而需設立祭司作中保，而這制度預表耶穌——祂既作祭司獻祭代求，又親自作了祭牲。'
  relation: 本章給了亞倫父子受職的完整程序（洗身、穿衣、受膏），卻沒有記下執行——這要到利8 才發生。他們在本章唯一實際做的事，是在洗濯盆裡洗手洗腳（v31）。CT 在話中之光把這道手續的意義寫得很直接：「一個人不來到聖所事奉則已，一來到聖所事奉，他的本相立刻在那裏顯出來。同時，在聖所裏，沒有一個人可以照自己的意思來作一件事。」
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出40 全章以「是照耶和華所吩咐他的」貫串：第16節「摩西這樣行，都是照耶和華所吩咐他的」是總題，而第19、21、23、25、27、29、32 節各以此語作結。GT《中文聖經註釋》數出這七次並解釋這個數字：「這裏七次使用這話語，是祭典作者要表達摩西已完完全全的遵行了神的吩咐的意思。因為三有屬天的意義，四為屬地的含義。三加四為七，就是天地間，或神人間的完備的意義。」KC 指出第16節是那個一再回來的起點：凡事都照耶和華所吩咐的行，不照自己的看法行事。
  relation: 本章是「山上的樣式」在出埃及記的最後一次落實，而它落實的方式與出39 不同：出39 是造，出40 是立與用。CT 在話中之光把這一點說明白：「立起帳幕，不止是空殼，也不是隨意安置各樣的器皿，而是一再說『照耶和華所吩咐他的』。這是開始新生活的原則。」而榮光在全部照做之後才降下來——順服與同在在本章是接連的兩件事。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 出40:16「摩西這樣行，都是照耶和華所吩咐他的」；出40:18-33 立幕、放法版、擺餅、點燈、燒香、獻祭、盛水、立院帷，逐項都以「是照耶和華所吩咐他的」作結；出40:35 摩西不能進會幕。GT《中文聖經註釋》指出第16節是整段的總題：「這節話，是本段經文（16～33節）的總題，標示摩西所做的一切，都是照神的吩咐；他自己僅僅是一個神所使用的器皿而已。」KC：工人把一切都預備好了，但立起神的家的是摩西；他不只把它立起來，還在其中盡了職事——擺餅、點燈、燒香、獻祭、盛水並洗手洗腳；他在凡事上作了榜樣，如同神家中的僕人（來3:5）；他既作建造者，也作祭司，雖然耶和華並沒有正式立他為祭司（詩99:6）；他是主耶穌的一幅圖畫，而主耶穌比摩西更大，因為基督是「兒子治理神的家」（來3:6）。GT《聖經精讀本》從順從的角度總結：「從神呼召摩西開始,摩西面前的苦難就不斷,但他依然順從神。順從是神的工作之中最必需的一個。」
  relation: 本章是摩西在出埃及記中的最後一場戲，而他做的是最像祭司的一批事——擺餅、點燈、燒香、獻祭。GT《中文聖經註釋》指出這也正是他使命的終點：「作者亦暗示摩西這神使者的使命經已完成，從此以後，他的工作要交給祭司去繼續協和神與人的工作了。」KC 由此看見一個對讀者的榜樣：不只要知道神的家是什麼、能說明、懂得怎樣行事為人，同樣要緊的是我們自己也在其中盡職——我們所知道的，也必須實行出來。
- title: 摩西不能進會幕
  path: link_folder/神學/摩西不能進會幕.md
  summary: 出40:35「摩西不能進會幕，因為雲彩停在其上，並耶和華的榮光充滿了帳幕。」GT《中文聖經註釋》指出這一句表面上與神先前的話相衝突：「這明顯是和原來神對摩西吩咐要建造聖幕和其中一切器物時的話相違背的。因為神明白的申述：我要在那裏與你相會，和你說話（出25:22，29:42）。但摩西受召為使者的工作經已完成；聖幕落成，祭司受職後，從此與神交通的工作，已要由摩西轉移到祭司身上去了。」GT《串珠聖經註釋》給的是同一個讀法：「這表示一個新時刻的開始，他以前在『營外的會幕』獨自擔當的角色（出33:7），現在由祭司承擔了。」GT 丁良才把它與後代的兩處並列：所羅門的聖殿也是如此（王上8:11；代下5:14、7:2）。GT《丁道爾聖經注釋》：「神將會幕覆蓋充滿到一個地步，連祂的忠僕（民12:7）摩西也不敢擅進。」
  relation: 這一句是出埃及記留下的最後一個轉折：會幕造好了，摩西卻進不去。GT《中文聖經註釋》把這件事讀成使命的交接——「作者亦暗示摩西這神使者的使命經已完成，從此以後，他的工作要交給祭司去繼續協和神與人的工作了」，並指出五經的編輯在此為利未記留下伏筆：膏立祭司的禮，以及獻祭與節期的種種律例。也就是說，摩西進不去，不是被拒絕，而是換人接手。
- title: 摩西完了工
  path: link_folder/事件/摩西完了工.md
  summary: 出40:33「在帳幕和壇的四圍立了院帷，把院子的門簾掛上。這樣，摩西就完了工。」GT《中文聖經註釋》指出這句話有三層：「這話在這裏要表達的，不但是聖幕和其中一切器物完了工，也不但是聖幕之豎立完了工，更是摩西為神使者的使命完了工。」GT 丁良才則從次序推斷：「大概摩西完了立會幕的工以後，才獻祭供祭司的職分。」CT 對本節的文意註解是：「在立起會幕並安放會幕門前的洗濯盆和燔祭壇之後，接著便在外院的四周立起院帷，又在外院的入口處掛上門簾。」
  relation: 「完了工」這個說法在聖經裡有它的回聲——創2:1-3 神造完諸天與地就歇了工，出39:43 摩西看見一切的工都做成了就給百姓祝福，而本節是第三次。三次的主詞不同，動作卻是同一個：看見完成，然後停下來。GT《中文聖經註釋》把第三層意思說得最重：這也是摩西作神使者的使命完了工。
- title: 日間雲彩、夜間雲中有火
  path: link_folder/神學/日間雲彩、夜間雲中有火.md
  summary: 出40:38「日間，耶和華的雲彩是在帳幕以上；夜間，雲中有火，在以色列全家的眼前。在他們所行的路上都是這樣。」GT 丁良才把它接回出13:21-22 的雲柱火柱。GT《聖經精讀本》：「雲柱是每天確認神的同行與保護，恩典與安慰的標誌。」GT《中文聖經註釋》為這一節寫下一段親身的見證：曠野「終年難有下雨的機會，日間晴空無雲，艷陽高照，四處無樹可遮蔭，地上沙石均被日頭蒸曬得滾熱，那時我們真盼望有神的雲彩在上！太陽下山後，曠野地面很快就黑暗了……沙石冷得有如冰塊！……但是，當年的以色列人，從那裏來有東西生火？特別是在安息日，他們連坐火都不可以（出35:3），又從那裏取暖？感謝神，夜間雲中有火！」BH：雲柱與火柱最早出現在出13:21-22，是神晝夜引導百姓的可見記號。
  relation: 這是出埃及記的最後一節，而它記的不是一件事，是一個常態——「在他們所行的路上都是這樣」。GT《中文聖經註釋》的曠野見證把這節經文的實用意義說得很具體：日間的雲遮住的是烈日，夜間的火解決的是嚴寒，而以色列人在安息日連生火都不可以。神的同在在這裡不只是神學命題，也是遮蔭與取暖。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出40:2、17-33 神吩咐摩西在正月初一日立起帳幕，摩西照樣行：安座、立板、穿閂、立柱子（v18）、搭罩棚蓋頂蓋（v19）、把法版放櫃裡並安施恩座（v20）、把櫃抬進帳幕掛上遮掩櫃的幔子（v21）、安桌子並擺餅（v22-23）、安燈臺並點燈（v24-25）、安金壇並燒香（v26-27）、掛上帳幕的門簾（v28）、安設燔祭壇並獻燔祭素祭（v29）、安洗濯盆盛水（v30）、立院帷並掛院門的門簾（v33）。GT《中文聖經註釋》指出「這樣摩西就完了工」一語有三層意思：「不但是聖幕和其中一切器物完了工，也不但是聖幕之豎立完了工，更是摩西為神使者的使命完了工。」同一來源另指出第18-33 節「實質上是主要的重複了在第2～11節的話。惟一沒有在前段經文提到的，乃是12～15節中膏立亞倫和他兒子為祭司的事」。KC：工人把一切都預備好了，但立起神的家的是摩西；他不只把它立起來，還在其中盡了職事——他在凡事上作了榜樣，如同神家中的僕人（來3:5），他設立了事奉；他既作建造者，也作祭司，雖然耶和華並沒有正式立他為祭司（詩99:6）；而他是主耶穌的一幅圖畫，主耶穌比摩西更大，因為基督是「兒子治理神的家；我們若……便是他的家了」（來3:6）。
  relation: 本章是會幕從一堆完工的部件變成一座立起來的居所的一章。CT 在話中之光提醒這件事不是形式：「立起帳幕，不止是空殼，也不是隨意安置各樣的器皿，而是一再說『照耶和華所吩咐他的』。這是開始新生活的原則。」而 GT《中文聖經註釋》指出這十六節裡有七次重複「是照耶和華所吩咐他的」（19、21、23、25、27、29、32節），並解這個數字：「三有屬天的意義，四為屬地的含義。三加四為七，就是天地間，或神人間的完備的意義」——七次使用這話語，是要表達摩西已完完全全地遵行了神的吩咐。
- title: 正月初一日
  path: link_folder/事件/正月初一日.md
  summary: 出40:2「正月初一日，你要立起帳幕」；出40:17「第二年正月初一日，帳幕就立起來。」GT《中文聖經註釋》指出抄本上的旁證：「撒瑪利亞抄本和七十士譯本，在這裏都有『在出埃及後』的字樣。清楚地說明這第二年是在出埃及後的第二年元旦。」GT《啟導本聖經腳註》：會幕在以色列人離開埃及後一年建成（出12:2），這時到達西奈山已九個月（出19:1）；「正月一日」會幕立起，「正月十四日」以色列人第二次守逾越節（民9:1-3）。GT《舊約聖經背景註釋》：「聖幕在新年當日立起，還差兩個星期便是出埃及的週年紀念，距離百姓到達西乃山的日子，剛好是九個月。整個建造過程完全沒有偏離神的指示。新的崇拜紀元在歲首開始，自然無比恰當。」KC：立幕的這一刻宣告了一個新的開始——「正月初一日」。
  relation: 這個日子在本章出現兩次：一次在神的吩咐裡（v2），一次在執行的記錄裡（v17）——吩咐與執行落在同一天。CT 在話中之光把它讀成信徒的新起點：「信徒蒙恩得救之後，應當有新的開始，在神面前有新的年日。」而華爾頓指出的曆法意義更具體：新的崇拜紀元從歲首開始。
- title: 永遠當祭司的職任
  path: link_folder/神學/永遠當祭司的職任.md
  summary: 出40:15「怎樣膏他們的父親，也要照樣膏他們，使他們給我供祭司的職分。他們世世代代凡受膏的，就永遠當祭司的職任。」GT 丁良才指出父子受膏的儀式並不相同：「亞倫和他的兒子都被膏，但他們被膏的儀式不同，因為他們的職分不同，摩西先將油倒在亞倫的頭上（利8:12；詩133:2），後又將油和壇上的血彈在亞倫和他的衣服上，並他兒子和他兒子們的衣服上，使他們和他們的衣服一同成聖。」GT《丁道爾聖經註釋》把本節接到出29:9：「參較出二十九章9節亞倫一脈的『永久性祭司職分』。」GT《中文聖經註釋》則從這裡讀出祭司制度的由來與預表：「本來，神揀選以色列民，是要他們都歸主作祭司的國度的（出19:6）。但因他們的埋怨與罪惡，他們也與神隔絕，需要設立祭司制度來作中保。這些都成了預表，預表耶穌是那真正的祭司——祂不但作祭司為人獻祭與代求，他還作了祭牲，在十字架上為全人類作了代贖。凡被祂呼召的新以色列人，就是這祭司國度中君尊的祭司（彼前2:5、9）。」
  relation: 本章只給了膏立祭司的吩咐（v12-15），卻沒有記下執行——GT《串珠聖經註釋》指出「這段卻沒有提到摩西膏祭司之事，一直留待利未記8章才詳細記述」。這使出埃及記在祭司這件事上停在半途：職分定了，人還沒有就位。而本章結尾摩西不能進會幕，正是催著這件事往下走的訊號。
- title: 法版
  path: link_folder/原文/法版.md
  summary: 出40:20「又把法版放在櫃裡，把槓穿在櫃的兩旁，把施恩座安在櫃上。」GT 丁良才對「放在櫃裡」加了一個限定：「這不是說沒有別的物件在櫃裡。」GT《聖經精讀本》描述這一步完成了什麼：「這是完成會幕實體中的至聖所的場面。即會幕最裡端的至聖所裡放置了十誡法版的法櫃,在其上蓋上施恩座（櫃的蓋子）,然後在入口掛上簾子,從此與聖所隔開。」GT《中文聖經註釋》在第1-3 節指出這一放的神學後果：法櫃「象徵神臨在而安放兩塊法版，其上有施恩座」，放進至聖所並用幔子遮掩之後，「從此，神居於幽暗中，正如在西乃山一樣（出20:21）；從此，祂和人的關係，是要藉大祭司作中保，直至基督耶穌在十字架上受死的代贖，人始能直接達到神的施恩寶座前（可15:38；來9:11-15，10:19-23）」。
  relation: 本章是法版被放進約櫃、約櫃被抬進至聖所、幔子被掛上的一章——三個動作一次完成，而完成之後，神就住進了幽暗裡。CT 在話中之光把這件事接到教會：「會幕沒有法櫃就不成其為會幕；法櫃預表神的話，也就是預表基督。教會必須有基督和神的話，若缺少這兩樣，便不是教會。」
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 出40:34-38 雲彩遮蓋會幕，耶和華的榮光充滿了帳幕；日間雲彩在帳幕以上，夜間雲中有火，在以色列全家的眼前。GT《串珠聖經註釋》指出這一幕與西乃山的顯現極為相似（出24:17-18），並由此帶出全書的神學論點：「神曾在西乃山住在百姓之中，現在則住在會幕中，與以色列人在曠野的路上同行。」GT《丁道爾聖經註釋》引德萊維指出全書以出29:45 的應許實現作結：「耶和華住在祂子民中間：神臨在的神學成為神臨在的事實」；並引戴維斯指出結束全書的是「對將來充滿把握的展望。與自己子民同住的神，也是必然成就對列祖承諾，將他們引領進到迦南的神……那為以色列動了拯救大工的，必成全這工（腓1:6）」。KC：一個大能的時刻來到了，這是先前一切工作的目標——神來與祂的百姓同住。
  relation: 出埃及記到此為止，神的同在走完了一條完整的路線：在燒著的荊棘裡、在雲柱火柱裡、在西乃山頂上，最後住進了營中央的一座帳幕。GT《啟導本聖經腳註》指出全書「以耶和華神應許（出29:45）的實現結束，同時展望前路：神要帶領他們走過曠野，直到達那應許的美地」。而 GT《聖經精讀本》把榮光落下的意義列成八項——印記、聖潔、喜悅、同行、引領、悅納的事奉、保護、得勝。
- title: 第二年正月初一立帳幕
  path: link_folder/歷史/第二年正月初一立帳幕.md
  summary: 出40:17「第二年正月初一日，帳幕就立起來。」GT《啟導本聖經腳註》給出兩個時間座標：以色列人在出埃及後剛剛一年（出12:2），抵達西乃山九個月後（出19:1），立起了會幕；「正月一日」會幕立起，「正月十四日」以色列人第二次守逾越節（民9:1-3）。GT《中文聖經註釋》指出「撒瑪利亞抄本和七十士譯本，在這裏都有『在出埃及後』的字樣」。GT《舊約聖經背景註釋》：「聖幕在新年當日立起，還差兩個星期便是出埃及的週年紀念……新的崇拜紀元在歲首開始，自然無比恰當。」GT 丁良才另從這一天往後排出五十天的行事曆，直到二月二十日雲彩收上去、以色列人離開西乃向迦南起行（民10:11）。GT《丁道爾聖經注釋》則對工期存疑：「這些日期如果是實數而非象徵，扣除摩西在山上的日子，餘下可供製造各種物件的時間其實並不充裕。」
  relation: 這一節把出埃及記的全部工程釘在一個確切的日子上，而各家對這個日子的處理正好分成兩路：丁良才用它推出一整份行事曆，丁道爾用它質疑工期是否夠用。分歧不在日期本身，而在這些數字是實數還是象徵。無論如何，會幕是在歲首立起來的——為以色列開了一個新的崇拜紀元。
- title: 耶和華的榮光
  path: link_folder/神學/耶和華的榮光.md
  summary: 出40:34-35「當時，雲彩遮蓋會幕，耶和華的榮光就充滿了帳幕。摩西不能進會幕，因為雲彩停在其上，並耶和華的榮光充滿了帳幕。」GT《中文聖經註釋》：「按照祭典的記述，雲彩是表達神的臨在……因此，這原來籠罩在神之山的雲彩，現在籠罩在聖幕之上了。耶和華的榮光，亦即是神的榮耀，或作神的榮顯，充滿了帳幕。這是指在聖幕的內部，滿有神榮光的顯現，表達祂的臨在，祂的恩眷和祂的悅納。」GT《聖經精讀本》把榮光的意義列成八項：①神的印記；②神的聖潔（出29:43、44）；③神的喜悅；④神的同行（出33:14）；⑤神的引領；⑥神悅納的事奉；⑦神的保護（申29:5）；⑧神的得勝，並指出「耶和華的榮光在雲彩中可能以燦爛的光彩出現」。GT 丁良才：「『耶和華的榮光就充滿了帳幕』——這樣神就成全了出33:17 節的應許。」KC：一個大能的時刻來到了，這是先前一切工作的目標——神來與祂的百姓同住；雲彩，就是神同在的象徵，佔有了會幕。KC 並把榮光的行蹤一路追下去：到約櫃被非利士人擄去時成了「以迦博」，意思是「榮耀離開了」（撒上4:21-22）；所羅門建成聖殿時榮耀回來（王上8:10-11）；後來又因百姓的罪離開聖殿（結8:4；9:3；10:4）；但主耶穌降生時，神的榮耀又在祂身上顯在地上（約1:14）；祂復活升天之後，五旬節那日神的榮耀藉聖靈再次住在地上，如今住在教會全體（弗2:21-22）與個別信徒的身體裡（林前6:19）。
  relation: 本章是出埃及記的收束，而收束的方式是榮光落下來。GT《啟導本聖經腳註》把它接到後代：「五百多年後，所羅門造的聖殿落成，雲彩也照樣充滿聖殿（王上8:10-11），表示神的悅納與同在。從摩西出生到被揀選作領袖領以色列人出埃及，這一連串事件現在到達高潮。」GT《串珠聖經註釋》則指出這一幕與西乃山的相似（出24:17-18），並由此帶出全書的神學論點：神曾在西乃山住在百姓之中，現在則住在會幕中，與以色列人在曠野的路上同行。
- title: 膏抹成聖
  path: link_folder/神學/膏抹成聖.md
  summary: 出40:9-11 用膏油把帳幕和其中所有的都抹上，使帳幕和一切器具成聖；又抹燔祭壇和一切器皿使壇成為至聖；又抹洗濯盆和盆座使盆成聖。GT《聖經精讀本》給出膏油的配方與用途：「為了祭司的委任儀式或分別聖殿器具等宗教目的,才特別製作膏油。其材料是沒藥500舍客勒、香肉桂250舍客勒、菖蒲250舍客勒、桂皮500舍客勒、橄欖油一欣」；並解「膏」為「把這膏油膏在器具或人身上,表明被神分別為聖」。GT《中文聖經註釋》把這道手續接到基督與信徒：「基督『道成肉身』後，並不是馬上執行其宣道、教育、醫治和救贖的工作，乃是等到受洗受聖靈的恩膏之後（太3:16；徒10:38），才周流四方行善事；基督徒也是神的殿，要聖靈住在其中，才能成聖歸榮於神（林前3:16，6:19-20）。這些，都正如這段經文所記，要用膏油把帳幕和其中一切器具抹上成聖一樣。」GT 丁良才指出第10節特別提出祭壇的理由：「會幕和會幕裡的一切物件都是至聖（出30:29），在這裡特別地提出祭壇，或是因為這祭壇靠近院門，敬拜神的人容易摸著。」KC：本章一再提到膏油（v9-11、13、15），提醒我們不斷需要聖靈的恩典與引導，沒有祂，最好的工作在神面前也是不蒙悅納的。
  relation: 本章的膏抹分成兩段：先抹帳幕與器具（v9-11），再抹亞倫與他的兒子（v13-15）。物件與人用的是同一瓶油，也因此被歸入同一種身分——分別為聖。CT 在話中之光把這兩樣並列：「信徒的外面有神的話——聖經，裡面有膏油的塗抹——聖靈；兩者合起來是神所賜的兩大禮物，極其寶貴。」
- title: 雲彩
  path: link_folder/原文/雲彩.md
  summary: 出40:34-38 雲彩遮蓋會幕；摩西不能進會幕，因為雲彩停在其上；每逢雲彩從帳幕收上去，以色列人就起程前往；雲彩若不收上去，他們就不起行；日間耶和華的雲彩是在帳幕以上，夜間雲中有火。CT 的〔原文字義〕給「雲彩」為「定居，居留，駐紮」。GT 丁良才指明它的身分：「『雲彩』——就是領以色列人出埃及的雲柱（出13:20-22）。」GT《聖經精讀本》：「雲彩象徵耶和華神的臨在（出34:5）。」GT《丁道爾聖經注釋》指出本章把兩個概念合而為一：「首先是神在代表祂臨在的『榮耀』雲彩之中降臨（參出33:9），表示祂的贊許……第二個相關概念是這個象徵神臨在的雲彩，在以色列曠野的所有年日中，日夜為他們引路。」BH：這雲彩就是神同在與引導的表徵，也被稱為舍吉拿的榮耀，是神同在的可見顯現。
  relation: 本章讓雲彩從「引路的柱子」變成「住下來的記號」——CT 的〔原文字義〕正好給了這層意思：雲彩的原文有「定居、居留、駐紮」的意思。它先在西乃山上，如今停在帳幕上；先在前面走，如今在中間住。而它並沒有因此不再引路：出40:36-38 記下它日後四十年的兩種動作——停與收上去。
- title: 雲彩引導行程
  path: link_folder/神學/雲彩引導行程.md
  summary: '出40:36-37「每逢雲彩從帳幕收上去，以色列人就起程前往；雲彩若不收上去，他們就不起行，直等到雲彩收上去。」GT《聖經精讀本》：「收上去: 在曠野生活中,百姓絕對順從了雲柱。他們不僅沒有擅自行動,而且也沒想過要拒絕雲柱。他們只信靠雲柱,證明他們只求神的旨意,只想服從神的旨意而不是自己的想法和意志」；並在第37節加一句：「不起程: 可以學習只信靠神的旨意的百姓的忍耐。」GT《中文聖經註釋》指出這幾節的文學功能：「這末了幾節經文，是作為民數記的伏筆。民數記主要敘述以色列人在進入迦南前，於曠野飄流的情狀。民9:15-23 就是接續這出埃及記末了數節的敘事語，但更為詳盡。」BH：雲彩的升起是神要百姓起行的指示；他們的行程被分成許多段落，詳列於民數記33-36 章，而每一段都是神應許實現過程中的一步。'
  relation: 本章的最後三節把敘事從「一座立起來的帳幕」推到「四十年的路」。順從在這裡有兩個方向：雲彩收上去就走，不收上去就不走——《聖經精讀本》指出後者同樣是功課，是「只信靠神的旨意的百姓的忍耐」。而 GT《中文聖經註釋》指出這正是五經編輯為民數記留下的伏筆。
- title: 約櫃
  path: link_folder/主題/約櫃.md
  summary: 出40:3、20-21 神吩咐把法櫃安放在帳幕裡並用幔子遮掩；摩西把法版放在櫃裡、把槓穿在櫃的兩旁、把施恩座安在櫃上，又把櫃抬進帳幕、掛上遮掩櫃的幔子。GT《聖經精讀本》：「這是完成會幕實體中的至聖所的場面。即會幕最裡端的至聖所裡放置了十誡法版的法櫃,在其上蓋上施恩座,然後在入口掛上簾子,從此與聖所隔開。」GT 丁良才對「把法版放在櫃裡」加了一個限定：「這不是說沒有別的物件在櫃裡。」
  relation: 本章是約櫃第一次被安放進至聖所——出37 造成、出39 交件，到本章才就位。CT 在話中之光把這一件事的分量說得最重：「會幕沒有法櫃就不成其為會幕；法櫃預表神的話，也就是預表基督。教會必須有基督和神的話，若缺少這兩樣，便不是教會。」
- title: 施恩座
  path: link_folder/主題/施恩座.md
  summary: 出40:20「又把法版放在櫃裡，把槓穿在櫃的兩旁，把施恩座安在櫃上。」GT《聖經精讀本》指出這一步的效果：櫃放進至聖所、施恩座蓋在櫃上、入口掛上簾子，至聖所自此與聖所隔開。GT《中文聖經註釋》在第1-3 節指出這個安放的神學後果：法櫃「象徵神臨在而安放兩塊法版，其上有施恩座」，遮掩之後「從此，神居於幽暗中，正如在西乃山一樣」。
  relation: 本章是施恩座被蓋到約櫃上的一刻，而蓋上之後它就看不見了——幔子隨即掛上。CT 在話中之光讀這道遮蓋：「耶穌基督裡面的神聖性質（櫃），被祂那顯在外面的人性（幔子）遮掩了。」
- title: 內幔（隔聖所至聖所的幔子）
  path: link_folder/主題/內幔（隔聖所至聖所的幔子）.md
  summary: 出40:3「用幔子將櫃遮掩」；出40:21「把櫃抬進帳幕，掛上遮掩櫃的幔子，把法櫃遮掩了。」GT《中文聖經註釋》指出這道遮掩的後果：「從此，神居於幽暗中，正如在西乃山一樣（出20:21）；從此，祂和人的關係，是要藉大祭司作中保，直至基督耶穌在十字架上受死的代贖，人始能直接達到神的施恩寶座前（可15:38；來9:11-15，10:19-23）。」GT《聖經精讀本》：掛上簾子之後，至聖所「從此與聖所隔開」。
  relation: 本章是內幔被掛起來的一刻，而掛起來的同時，一段長達千餘年的隔絕就開始了——直到主耶穌斷氣時殿裡的幔子從上到下裂為兩半（可15:38）。CT 在話中之光把幔子讀成基督的人性：「耶穌基督裡面的神聖性質（櫃），被祂那顯在外面的人性（幔子）遮掩了。」
- title: 陳設餅桌子
  path: link_folder/主題/陳設餅桌子.md
  summary: 出40:4、22-23 神吩咐把桌子搬進去、擺設上面的物；摩西把桌子安在會幕內、北邊幔子外，在桌子上將餅陳設在耶和華面前。GT 丁良才解「擺設上面的物」：「就是陳設的餅和乳香（利24:5-9），並棹子上的器皿（出25:29）。」GT《聖經精讀本》另指出這件事自此成為常規：「從現在開始,每個安息日祭司那要擺設新的陳設餅（利24:8）。」GT《中文聖經註釋》：從院帷門簾透過帳幕的門簾，百姓可以隱約看到那象徵神和祂的道、是我們屬天的糧的陳設餅桌。
  relation: 本章是桌子第一次被擺上餅——出37 造成、出39 交件時餅已列在清單上，到本章才真的陳設在耶和華面前。CT 在話中之光提醒次序：「餅是陳設在神面前的。先讓神得著飽足，才能使人得著飽足。」
- title: 金燈臺
  path: link_folder/主題/金燈臺.md
  summary: '出40:4、24-25 神吩咐把燈臺搬進去、點其上的燈；摩西把燈臺安在會幕內、南邊、與桌子相對，在耶和華面前點燈。GT 丁良才：「『與桌子相對』——使燈對照。」GT《聖經精讀本》：「點燈: 祭司把燈蕊調整好,使燈能照到前面（出25:37；民8:2、3）。」GT《中文聖經註釋》把燈臺與陳設餅桌並列，讀為神和祂的道是我們屬天的糧與世上的光（詩119:105；約8:12）。'
  relation: 本章是燈臺第一次被點著。它的位置是「與桌子相對」——CT 由此讀出兩者的關係：「燈檯要和桌子相對。神的話語一解開就發出亮光（詩119:130）。」而點燈的人在本章是摩西，不是祭司。
- title: 金香壇（香壇）
  path: link_folder/主題/金香壇（香壇）.md
  summary: 出40:5、26-27 神吩咐把燒香的金壇安在法櫃前；摩西把金壇安在會幕內的幔子前，在壇上燒了馨香料做的香。GT 丁良才特別說明這個位置的張力：「『安在法櫃前』——不是在至聖所內，乃是在聖所中的內幔外，這香壇原來屬至聖所（王上6:22 文理譯本，來9:4），但因祭司每天兩次要在上面燒香，所以只得放在至聖所內幔外，卻比燈檯和棹子離法櫃近。」GT《聖經精讀本》給的理由是氣味：「為了讓香壇裡的香氣上升到法櫃的施恩座上,因此把香壇擺在法櫃前面（利16:13）。象徵神已經聽到了信徒的禱告（啟5:8；8:3、4）。」
  relation: 本章是香壇被安放並第一次燒香的一刻，而它的位置正是那個長期爭議的落點：經文說「安在法櫃前」，實際卻在幔子外。丁良才給的解釋是實務性的——祭司每天要燒兩次香，不可能天天進至聖所。CT 在話中之光說：「在香壇上燒香，代表眾聖徒的禱告（啟5:8）；基督徒沒有甚麼事能比為人代禱更顯高貴的了。」
- title: 香壇的位置與歸屬之爭
  path: link_folder/解經爭議/香壇的位置與歸屬之爭.md
  summary: 出40:5「把燒香的金壇安在法櫃前」；出40:26「把金壇安在會幕內的幔子前。」兩節的說法之間有一個需要調和的地方，而 GT 丁良才正面處理：「『安在法櫃前』——不是在至聖所內，乃是在聖所中的內幔外，這香壇原來屬至聖所（王上6:22 文理譯本，來9:4），但因祭司每天兩次要在上面燒香，所以只得放在至聖所內幔外，卻比燈檯和棹子離法櫃近。」GT《聖經精讀本》從功能給理由：「為了讓香壇裡的香氣上升到法櫃的施恩座上,因此把香壇擺在法櫃前面（利16:13）。」
  relation: 這場爭議在出30 起於希伯來書把香壇算在至聖所裡（來9:3-4），在本章則落到一個具體的擺放動作上：經文既說「在法櫃前」，又說「在幔子前」。丁良才的解法把歸屬與位置分開——壇的歸屬是至聖所，位置卻因每日兩次燒香的實務需要而在幔外。
- title: 銅壇（燔祭壇）
  path: link_folder/主題/銅壇（燔祭壇）.md
  summary: '出40:6、29 神吩咐把燔祭壇安在帳幕門前；摩西在會幕的帳幕門前安設燔祭壇，把燔祭和素祭獻在其上。GT《聖經精讀本》解這個位置：「帳幕門前: 為了表明獻給神的所有祭物,已經上達到了神的面前,所以把燔祭壇擺在這裡」；並指出本節是「第一次記錄了在照神的指示製作的燔祭壇上獻祭的情形」，同時提醒燔祭與素祭本身早於出埃及就有（創8:20-22；22:2-13；19:3）。GT《中文聖經註釋》把燔祭壇讀成各各他的預表：「這是象徵基督要被帶到城外，在各各他山上被殺犧牲。」'
  relation: 本章是燔祭壇第一次被使用——出38 造成、出39 交件，到本章才有火。而獻祭的人是摩西，祭司尚未受職。CT 在話中之光為這一段下的結語很直接：「基督是我們的救贖，若不藉著祂的救贖，沒有人能靠自己的功績來到神面前。」
- title: 洗濯盆（銅盆）
  path: link_folder/主題/洗濯盆（銅盆）.md
  summary: 出40:7、30-32 神吩咐把洗濯盆安在會幕和壇的中間，在盆裡盛水；摩西照樣行，摩西和亞倫並亞倫的兒子在這盆裡洗手洗腳——他們進會幕或就近壇的時候，便都洗濯。GT《中文聖經註釋》解它的預表：「這不但象徵我們的受洗洗去罪（徒22:16），也表明我們受洗是歸入基督的死，使肉體和祂一同埋葬，以致一舉一動有新生的樣式（羅6:3-4）。」CT 在話中之光接到弗5:26：「所以基督徒應當多看神的話，因為神的話如同水一樣，要洗淨我們在生活行為中所沾染的一切污穢。」
  relation: 本章是洗濯盆第一次盛水、第一次被使用，而使用的人包括摩西自己。CT 由此帶出一句：「一個人不來到聖所事奉則已，一來到聖所事奉，他的本相立刻在那裏顯出來。」洗濯盆的位置在會幕與壇的中間——過了壇（贖罪）還要過盆（潔淨），才進得了會幕。
- title: 會幕院子
  path: link_folder/主題/會幕院子.md
  summary: '出40:8、33 神吩咐在四圍立院帷、把院子的門簾掛上；摩西在帳幕和壇的四圍立了院帷，把院子的門簾掛上，「這樣，摩西就完了工」。GT《聖經精讀本》解院帷的意義：「在四圍立院帷: 以此,從不潔淨當中被神分別為聖。從而這帷子象徵,從邪惡的勢力中保守分別為聖的所有信徒的神的城牆。」CT 的文意註解：「在立起會幕並安放會幕門前的洗濯盆和燔祭壇之後，接著便在外院的四周立起院帷，又在外院的入口處掛上門簾。」'
  relation: 院帷是本章最後立起的一樣東西，也是「摩西就完了工」這句話所收的那一筆。CT 在話中之光說明它的功能：「院子的圍籬用來分別內外界限，不讓不相干的人隨便進出；教會必須有界限，才能維護教會的純潔。」
- title: 帳幕門簾
  path: link_folder/主題/帳幕門簾.md
  summary: 出40:5、28 神吩咐掛上帳幕的門簾；摩西把帳幕的門簾掛上。這道門簾在本章的安放次序中排在金壇之後、燔祭壇之前——聖所裡的三件器具都就位之後，才把門關上。GT《中文聖經註釋》指出從院帷門簾透過帳幕的門簾，百姓可以隱約望見祭司在香壇前的燒香與代禱，也可以隱約看到陳設餅桌和金燈臺。
  relation: 本章是帳幕門簾被掛上的一刻。它的位置在安放次序上很說明問題：先把聖所裡的桌子、燈臺、金壇都安好並使用過，才掛門簾——門是最後才關的。
- title: 聖膏油
  path: link_folder/原文/聖膏油.md
  summary: 出40:9-11 用膏油把帳幕和其中所有的都抹上，使帳幕和一切器具成聖；又抹燔祭壇與一切器皿使壇成為至聖；又抹洗濯盆和盆座使盆成聖。GT《聖經精讀本》給出配方：「其材料是沒藥500舍客勒、香肉桂250舍客勒、菖蒲250舍客勒、桂皮500舍客勒、橄欖油一欣」，並解「膏」為「把這膏油膏在器具或人身上,表明被神分別為聖」。KC：本章一再提到膏油（v9-11、13、15），提醒我們不斷需要聖靈的恩典與引導，沒有祂，最好的工作在神面前也是不蒙悅納的。
  relation: 本章是聖膏油第一次被使用——出30 給配方、出37 記製作、出39 列進交件清單，到本章才真的抹在東西上。而它抹的對象包括器具與人，兩者因此被歸入同一種身分：分別為聖。
- title: 聖衣（祭司聖服）
  path: link_folder/主題/聖衣（祭司聖服）.md
  summary: 出40:13-14「要給亞倫穿上聖衣，又膏他，使他成聖，可以給我供祭司的職分；又要使他兒子來，給他們穿上內袍。」GT《聖經精讀本》指出「內袍」的原文與出28:39-40、29:5、8、39:27 所用的是同一個字。GT《中文聖經註釋》由此段讀出祭司制度的預表：以色列本應全民作祭司的國度（出19:6），因罪而需設立祭司作中保，而這制度預表耶穌——祂既作祭司獻祭代求，又親自作了祭牲。
  relation: 出39 造出了聖衣，本章給了穿上它的吩咐，卻沒有記下執行——GT《串珠聖經註釋》指出膏祭司之事「一直留待利未記8章才詳細記述」。聖衣在出埃及記裡因此停在一個未完成的狀態：做好了，也吩咐了，卻還沒有穿上。
- title: 皂莢木豎板
  path: link_folder/主題/皂莢木豎板.md
  summary: 出40:18「摩西立起帳幕，安上帶卯的座，立上板，穿上閂，立起柱子。」這是本章立幕的第一個動作，也是豎板在出埃及記中最後一次出現——從出26 的規格、出36 的製作，到本章的立起。
  relation: 本章是豎板真正站起來的一章。CT 在話中之光提醒每一道工序的分量：「豎立會幕的工作，有許多道工序，每一項工作對於神的居所皆很重要。現在這個原則同樣是重要的。在教會中，每一樣的事奉，無論大小，都是不可或缺的。」
- title: 閂（橫閂）
  path: link_folder/主題/閂（橫閂）.md
  summary: 出40:18「摩西立起帳幕，安上帶卯的座，立上板，穿上閂，立起柱子。」閂在本章與座、板、柱子並列為立幕的四個動作之一——出26 給規格、出36 記製作，到本章才被穿進金環裡。
  relation: 閂在本章只佔半句話，卻是把四十八塊板變成一面牆的關鍵一道。CT 在話中之光的提醒正合這一點：立幕有許多道工序，每一項對神的居所都很重要，在教會中每一樣事奉無論大小都不可或缺。
- title: 十一幅山羊毛幔子（罩棚）
  path: link_folder/主題/十一幅山羊毛幔子（罩棚）.md
  summary: 出40:19「在帳幕以上搭罩棚，把罩棚的頂蓋蓋在其上。」GT 丁良才由這一句指出兩者的分別：「『在帳幕以上搭罩棚』——這一句顯明帳幕是帳幕，罩棚是罩棚，不是一體的。」他並注意到用字：「『把罩棚的頂蓋蓋在其上』——注意，『頂蓋』兩個字的原文是單數的字式。」GT《聖經精讀本》：「完成了會幕的骨架之後,在其上蓋上了第一幅幔子和第二幅幔子,還有罩棚。」
  relation: 本章是罩棚被搭上去的一刻，而丁良才由這一句的措辭指出一件容易被讀混的事：帳幕與罩棚不是一體的。這也回應了出26 與出36 為何要把兩者分開記述——十幅幔子是帳幕，十一幅山羊毛幔子是罩棚。
- title: 海狗皮頂蓋
  path: link_folder/主題/海狗皮頂蓋.md
  summary: 出40:19「在帳幕以上搭罩棚，把罩棚的頂蓋蓋在其上。」GT 丁良才注意到用字上的細節：「『把罩棚的頂蓋蓋在其上』——注意，『頂蓋』兩個字的原文是單數的字式。」
  relation: 本章是頂蓋被蓋上去的一刻，也是會幕從外面看起來的最終樣子。CT 在話中之光由此帶出一個對照：「會幕的頂蓋是用海狗皮蓋的，外表簡陋不美觀，卻能耐得住風吹雨打，異常堅固；教會的外表，不在乎建築物的高大美觀，乃在乎教會中聖徒的信德與靈命。」
- title: 西乃山
  path: link_folder/地點/西乃山.md
  summary: 出40:17 帳幕在出埃及後第二年正月初一日立起，而此時以色列人仍在西乃山下。GT《啟導本聖經腳註》給出時間座標：這時到達西奈山已九個月（出19:1）。GT《串珠聖經註釋》指出本章末段與西乃山顯現的相似：神的雲彩與榮光在此的顯現，與當初神在西乃山的顯現極為相似（出24:17-18），並由此帶出全書的神學論點——神曾在西乃山住在百姓之中，現在則住在會幕中，與以色列人在曠野的路上同行。
  relation: 西乃山在出埃及記的最後一章沒有再出場，卻是這一切發生的地點。而本章的意義正在於一個轉移：雲彩原本籠罩在神的山上，如今籠罩在營中央的帳幕上。GT《中文聖經註釋》說得最直接：「這原來籠罩在神之山的雲彩，現在籠罩在聖幕之上了。」
