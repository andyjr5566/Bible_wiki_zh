book: 出埃及記
chapter: 28
updates:
- title: 信徒作祭司（彼前2：5,9）
  path: link_folder/互文/信徒作祭司（彼前2：5,9）.md
  summary: 出28:1 神從以色列人中揀選亞倫和他的兒子供祭司職分。KC 由此對彼前2:5 的「聖潔的祭司」作了一個關鍵的分辨：新約沒有一個被特別呼召作祭司的階級——「那是羅馬天主教會嚴重的錯誤之一」；對教會的信徒而言是一個共同的祭司職分。而亞倫兒子的衣服同樣是「為榮耀，為華美」（28:40），KC：「我們可以像主耶穌一樣完全地，作為祭司站在神面前。祂就是我們的完全。」
  relation: 出19:6 已宣告「你們要歸我作祭司的國度」，但出28 顯明親近神仍是有門檻的——神自己揀選誰可以近前來（來5:4）。KC 把這個張力接到新約：門檻不在身分而在使用——「只有那些真的親近神的人，才在運用這祭司職分。許多信徒沒有使用這特權，常常是因為錯誤的教導。」出28 因此是彼前2:5,9 的舊約底稿：祭司的資格全在所穿的聖衣（基督）而不在自己，沒有祂「我們赤裸的肉體就顯露出來」（28:42-43）。
- title: 義行的細麻（啟19：8）
  path: link_folder/互文/義行的細麻（啟19：8）.md
  summary: 出28:5、39 祭司聖衣的材料包含細麻，內袍、冠冕、褲子皆以細麻織成。KC 讀大祭司的白細麻：「白細麻說到祂作為人的完全」；而亞倫兒子的細麻褲子則是為遮蓋赤身，免得他們「擔罪而死」（28:42-43）。
  relation: 細麻在會幕系統裡一路從院子帷子（出27:9）走到祭司聖衣（出28），到啟19:8 收束為「這細麻是聖徒所行的義」。出27 的細麻是外人從院子外看見的，出28 的細麻卻是穿在祭司身上、貼著身體的——同一種材料，一個是見證給世人看，一個是資格站在神面前。而兩處都不是自己織的：細麻是神指定的材料，正如啟19:8「就蒙恩得穿光明潔白的細麻衣」——是被賜的。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 出28:1-2 神吩咐摩西「使你的哥哥亞倫和他的兒子……一同就近你，給我供祭司的職分」，並要為他做聖衣「為榮耀，為華美」。CT 列出祭司職責的八項：「(1)接納並檢查祭物；(2)向神獻祭；(3)料理會幕中的日常事務；(4)教導百姓認識律法；(5)查驗潔與不潔；(6)施行審判；(7)為百姓祝福；(8)吹號集合或爭戰。」GT《啟導本》列出大祭司的日常工作六項，並指出「大祭司最重要的工作，是一年一次的贖罪日那天進入至聖所為全民贖罪（利16章）」，而「以後，大祭司之位傳給亞倫後裔中每一代的長子」。GT《中文聖經註釋》從古代近東的角度界定這職分：「自古以來，祭司的職任是看守神壇，維護和傳流神聖的傳統……迦南地和古代其他中東地區相類，祭司的職分常是和君王連在一起的（參看創14:17-20麥基洗德的職分）。」BH：亞倫「是摩西的兄長，被神揀選作以色列第一位大祭司」，其職分「預表基督作我們終極的大祭司」（來4:14-16）。
  relation: KC 從一開頭就把本章的門檻講清楚：「不是每個人都可以就這樣親近。神自己揀選百姓中的哪些人可以這樣做（來5:4）……不是所有的百姓都是祭司，雖然神曾說：『你們要歸我作祭司的國度』（出19:6）。」CT 的話中之光正面對這個張力：「舊約時代，本來以色列人是祭司的國度（出19:6），全民都是祭司，卻因悖逆而將祭司的職份拱手讓給亞倫的家族」；GT 引丁良才也記下同一段歷史：以色列人「因懼怕就求摩西代替他們（出19:16，20:18-19）。神也允准了這事（申5:22-31）。故此摩西獨自擔任臨時祭司的職分」，直到亞倫和他兒子受職禮完畢為止。而 KC 指出亞倫的聖衣「為榮耀，為華美」這句話在新約有回聲：「這句話在希伯來書2章被引用，應用在主耶穌身上（來2:9）。由此我們看見，亞倫是主耶穌作大祭司的一幅圖畫。」
- title: 亞倫的祭司譜系
  path: link_folder/人物/亞倫的祭司譜系.md
  summary: 出28:1 亞倫四子拿答、亞比戶、以利亞撒、以他瑪一同就近，供祭司的職分。GT 在此處把這四個名字往後的命運一次交代：引丁良才「這兩個人（拿答、亞比戶）先前同摩西上過山（出24:1-9），後來在會幕初立的時候，因為他們獻上凡火，就被耶和華燒死（利10:1-2）。『以利亞撒』——這人後來接續亞倫做大祭司（民20:25-26）」；GT《串珠》補上後世的分支：「後期在耶路撒冷供奉的撒督祭司，都是源於他（代上6:3-8）」；GT《丁道爾》再補另一支：「而以利的家族，包括大衛的祭司亞比亞他，譜系則可追溯到以他瑪（代上24:3）。」GT《舊約背景註釋》從制度面說明這一節的意義：「神單獨挑選亞倫父子，就是指定誰有資格在聖幕事奉，同時為以色列將來世代的大祭司，設立世襲的繼承系統。祭司的世系屬於利未支派，限於亞倫一族。」CT 的靈意：「亞倫的眾子預表基督徒，所有被揀選蒙恩得救的信徒，都有分於祭司的體系（彼前2:9）。」
  relation: 出6:23-25 給的是這條譜系的起點（婚姻與四子），出28:1 給的是它的職分——四個名字第一次以「供祭司的職分」的身分被點出來。而 GT 在本章就已經預告了這條線後來的走向：四人之中兩人將因獻凡火死在耶和華面前（利10），大祭司的位分要落到以利亞撒身上（民20:25-26），後世耶路撒冷的撒督祭司出於他，以利與亞比亞他一系則出於以他瑪。本章列名的當下，這四個人是齊全的；聖經對這份名單的處理，是先立而後篩。
- title: 藍色、紫色、朱紅色線
  path: link_folder/主題/藍色、紫色、朱紅色線.md
  summary: 出28:5-6、8、15、31、33、37 三色線用於以弗得、以弗得上的帶子、胸牌、外袍底邊的石榴，以及繫金牌的藍細帶子；外袍本身則「顏色全是藍的」。GT 引丁良才指出聖衣與帳幕織物的關係與一個律法上的疑問：「除了這金線以外，其餘的材料和帳幕、內幔並門簾上所用的材料都是一樣的」，而利19:19、申22:11 說不可用兩樣攙雜的材料做衣服，「故此有人以為本節的藍色紫色朱紅色線不是絨的，乃是麻的（參結44:17-18）」。GT《丁道爾》另在外袍一節作了譯名上的更正：「『藍的』譯作『藍紫色』（英：violet）更佳。」GT《精讀本》為五種顏色各給一個對應：「金色象徵榮耀和尊貴、藍色象徵著慈悲和慈愛、紫色象徵著權威和威嚴、朱紅色象徵著贖罪、細麻即白色象徵著純潔和純真。」BH：藍「常代表天與神性」，紫「代表王權與財富」，朱紅「象徵犧牲與贖罪」，三者合起來反映大祭司作中保、君王與代求者的多重角色。
  relation: KC 把三色線在本章的意義接回四福音書，並讓它一路貫穿：以弗得的「顏色說到主耶穌不同的榮耀，就如四福音書所見的。那帶子顯出同樣的榮耀（顏色）」；而多彩的腰帶「叫人想起祂在各樣服事形式中的榮耀」。同一組顏色在出26 織成幔子（遮蓋神的居所）、在出27 織成院門的簾子（唯一的入口）、在出28 織成祭司的衣服——從房子到門到人，顏色沒有換過。
- title: 撚的細麻
  path: link_folder/原文/撚的細麻.md
  summary: 出28:5-6、8、15、39、42 細麻是本章聖衣的共同基材：以弗得、以弗得上的帶子、胸牌、內袍、冠冕與褲子。GT《舊約背景註釋》從實用面說明它為何被選用：細麻布內袍「有遮擋烈日的作用」；GT《丁道爾》指出細麻布褲子「細麻又美觀又衛生，是以色列（和埃及）祭司服裝常用的料子」。GT 引丁良才則從細麻讀出眾祭司的整套象徵：「眾祭司的細麻衣表明他們必須聖潔和大祭司一樣。白細麻褲子顯明肉體須聖潔，白細麻裹頭巾顯明思想須聖潔……白細麻腰帶顯明一切舉止動靜都要聖潔。」BH：細麻「代表潔淨與公義」，在古代近東是高級布料，常與貴族與祭司的服事相連。
  relation: 細麻在會幕系統裡走了一條由外而內的路：出26 是內層幕幔與內幔（幕內），出27 是院子的帷子（幕外，外人看得見的那一片白），出28 則穿在祭司身上、貼著身體。同一種材料，一次是遮蓋神的居所，一次是圍出聖地的界線，一次是使人有資格站進去。而 KC 讀大祭司的白細麻只用了一句話：「白細麻說到祂作為人的完全。」
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出28:1-43 全章的聖衣製作都出於神的指示，而本章沒有像出25:9、40，26:30，27:8 那樣重複「照山上的樣式」一語。GT《串珠》為本章的編排補上一個原則：「這裡提到聖衣的各部，不是按穿衣的次序（參29:5-7），而是按其重要性編排。」GT《啟導本》則指出兩份次序的差別：「亞倫穿聖衣的次序，是由內而外（出29:5-9）。神吩咐為亞倫製作聖衣的次序卻是由外而內（出28章）。」GT《丁道爾》坦言本段不易詮釋，並把可確定的部分挑出來：「大綱十分清楚：這些衣服是聖的——即從其他事物中分別出來——並且為榮耀、為華美（2節）是其製造的目標。除此以外，聖經再無解釋個別衣物含義之處。」
  relation: 「照山上的樣式」這條原則在本章不是靠一句重複的話維持，而是靠整章的細密度：從肩帶接法、金環位置、藍細帶子的繫法，到領口要織邊「免得破裂」，經文交代到不留餘地。GT《丁道爾》提醒了一件重要的事——聖經只說明衣服是「聖的」與「為榮耀、為華美」，個別衣物的含義並沒有解釋；本章的靈意讀法因此都是後人的推衍，而樣式本身則是被規定死的。KC 收在同一點上：這一切「所強調的是祭司的事奉是在神面前舉行的」。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出28:43 「亞倫和他兒子進入會幕，或就近壇，在聖所供職的時候必穿上，免得擔罪而死。」GT《精讀本》把本章放進整段的結構裡：「神一直啟示有關會幕制度，但是講到燈檯的事情（27:21），他便加上了有關亞倫和他兒子的事工。可以說這是有關會幕制度中的一個小插曲。即使是小插曲，由於祭司在會幕獻祭制度中是必需的人物，所以也具有非常重要的意義。」GT《中文聖經註釋》從需求面說明為何必須有這一章：「聖幕安排好了，就必須有專人在聖幕中作事奉。這些在聖幕中事奉的人，就稱為祭司……為要使在聖幕中及後期在聖殿中事奉的人有所識別，特別是對他們尊貴的地位和等級有所分別，就須有不同的袍服。」
  relation: KC 把出25-30 的走向排成三段，本章的位置也就清楚了：「在出埃及記25-27 我們看見神如何走向有罪的人。在出埃及記30 我們看見有罪的人如何能親近神。在出埃及記28-29 我們看見人能親近神的那條路，而那條路只有一個：藉著祭司。」前三章造的是房子與院子，本章造的是能進去的人。KC 並指出聖衣的材料與帳幕相同這件事本身就在說話：「這把亞倫祭司的事奉，緊緊連於聖所裡的事奉，就是神的居所。」
- title: 聖所
  path: link_folder/地點/聖所.md
  summary: 出28:29、35、43 「亞倫進聖所的時候，要將決斷胸牌……帶在胸前」；「他進聖所到耶和華面前，以及出來的時候，袍上的響聲必被聽見」；「在聖所供職的時候必穿上，免得擔罪而死」。GT 引丁良才提醒本章「聖所」一詞的範圍比前幾章寬：「『在聖所』這三個字在此處也包括外院，就是安設燔祭壇的地方（出40:6、29）」；GT《中文聖經註釋》則指出胸牌不是日常穿戴：「這表示此胸牌並不是大祭司日常的服裝，乃是在進入聖所作事奉的時候，才必須佩帶上的。」CT 說明鈴鐺響聲的用意：「『袍上的響聲』指大祭司走動時袍上金鈴鐺所發出的響聲，這響聲是為著讓會幕外面的人確認大祭司並未突然倒地死亡。」
  relation: 出26 給了聖所的界線，出27 給了它唯一的光，出28 則規定了進去的人要穿什麼——而規定的方式很特別：不是「怎麼做」，而是「不穿就會死」。這使聖所在本章成為一道資格的門檻。GT《丁道爾》描述的那個密不通風、只有燈臺光線的空間，在本章多了一種聲音——外面的人聽不見裡面的事，只聽得見鈴鐺；鈴鐺一停，就知道出事了。
- title: 至聖所
  path: link_folder/地點/至聖所.md
  summary: 出28:29-30、35 大祭司帶著決斷胸牌與烏陵土明「在耶和華面前」；進出聖所時袍上的響聲必被聽見。GT《中文聖經註釋》在鈴鐺一節把場景講得很具體：石榴與金鈴鐺安在外袍底邊，「更要緊的，是大祭司在進入至聖所時，不斷的擺動外袍，使金鈴鐺作響，叫外面不可進入至聖所的人知道他仍然活」。GT《啟導本》在本章開頭也指出大祭司職分的核心：「大祭司最重要的工作，是一年一次的贖罪日那天進入至聖所為全民贖罪（利16章）。」
  relation: 出26 定下至聖所的界線（內幔）、出27 說明它終年無光，出28 則交代了唯一能進去的那個人要穿成什麼樣子。三章合看，通往至聖所的路是逐層加限制的：先是一道繡著基路伯的幔子，然後是一片黑暗，最後是一整套不穿就會死的衣服。而 KC 指出這身衣服的意義正在於此：「我們可以像主耶穌一樣完全地，作為祭司站在神面前。祂就是我們的完全……沒有祂，我們赤裸的肉體、我們的赤身就顯露出來。」
- title: 鈴鐺與石榴（大祭司袍子）
  path: link_folder/原文/鈴鐺與石榴（大祭司袍子）.md
  summary: 出28:33-35 外袍周圍底邊要用藍色、紫色、朱紅色線做石榴，石榴中間要有金鈴鐺，「一個金鈴鐺一個石榴」；亞倫供職時「袍上的響聲必被聽見，使他不至於死亡」。本章是出39:24-26 製作記載的原始規定。GT《精讀本》一次列出金鈴鐺的四種解釋——大祭司宣佈並解釋律法、以鈴聲進行有旋律的讚美、體現祭司的權威（「在古代近東地區，一般王穿著帶鈴的衣服」）、以鈴聲警誡謹慎的態度——並自己作了選擇：「從祭司服與祭祀有關的意義上，第4種解釋更加恰當。」CT 說明響聲的實際用意：「這響聲是為著讓會幕外面的人確認大祭司並未突然倒地死亡。」GT《中文聖經註釋》講得更具體：大祭司在進入至聖所時「不斷的擺動外袍，使金鈴鐺作響，叫外面不可進入至聖所的人知道他仍然活」。BH 則指石榴在古代近東與豐盛、多產相連，在祭司衣物上象徵結果與祝福。
  relation: 出39 記的是照樣做成，出28 記的是為什麼要這樣做，而理由是生死攸關的：「使他不至於死亡」。KC 抓住響聲被聽見的時機：「一個神聖的見證被發出（鈴鐺），並且有果子歸給神（石榴）……聲音是在進入聖所時被聽見的。」於是這一對裝飾在本章不是裝飾，而是聖所內外唯一的通訊——外面的人看不見裡面的事，只聽得見鈴鐺；鈴鐺一停，就知道出事了。
- title: 聖衣（祭司聖服）
  path: link_folder/主題/聖衣（祭司聖服）.md
  summary: 出28:2-4「你要給你哥哥亞倫做聖衣為榮耀，為華美」，並列出所要做的六件：胸牌、以弗得、外袍、雜色的內袍、冠冕、腰帶。本章是聖衣制度的原始規定，出29 的穿戴、出39 的製作、利8 的就職禮都回指本章。GT《丁道爾》指出這些衣服「是聖的──即從其他事物中分別出來──並且為榮耀、為華美（2節）是其製造的目標。除此以外，聖經再無解釋個別衣物含義之處」。GT 引丁良才說明「聖服」之名的由來：「這衣被稱為聖服的緣故是因著專為敬拜神，不作別的用。」GT《串珠》提醒本章的排列「不是按穿衣的次序（參29:5-7），而是按其重要性編排」；GT《啟導本》把兩份次序並排：「亞倫穿聖衣的次序，是由內而外（出29:5-9）。神吩咐為亞倫製作聖衣的次序卻是由外而內（出28章）。」
  relation: 聖衣的材料與帳幕相同，KC 認為這件事本身就在說話：「這把亞倫祭司的事奉，緊緊連於聖所裡的事奉，就是神的居所。」出29 的承接聖職是把這套衣服穿上去，利8 是實際執行，本章給的則是規格與目的。經文對聖衣只交代了一句目的（為榮耀，為華美），卻把形制交代到不留餘地——資格因此不落在穿衣的人身上，而落在衣服本身。
- title: 承接聖職（分別為聖）
  path: link_folder/神學/承接聖職（分別為聖）.md
  summary: 出28:3「使他分別為聖，可以給我供祭司的職分」、28:41「又要膏他們，將他們分別為聖，好給我供祭司的職分」。本章給出承接聖職的三個動作——穿戴聖衣、受膏、分別為聖——禮儀細節要到出29 才展開。CT 給了一個原文上的細節：「『將他們』按原文是『充滿雙手』，意即奉獻自己，將身體獻上，當作活祭」，並把三個動作分列：「膏（anoint）」象徵聖靈與供祭司職分之人的交通；「奉獻（consecrate）」的「意思是『充滿這手』，說明一個受膏的人，得著完全的裝備，使他能盡他的職分」；「聖別（sanctify）」則「是指一個作祭司的人，要遠離屬靈和道德上的玷污」。BH 把整套程序前後排開：分別為聖包含洗、穿、膏與獻祭。
  relation: 出29 與利8 記的是承接聖職的實施，本章記的是它的構成要件。值得注意的是次序：v41 把「穿戴」放在「膏」與「分別為聖」之前——衣服不是分別為聖之後的獎賞，而是分別為聖的手段之一。CT 因此說，穿戴全副聖衣之後「仍須經過受膏分別為聖的禮儀，才能正式上任供職」。
- title: 擔當干犯聖所與祭司職任的罪孽
  path: link_folder/神學/擔當干犯聖所與祭司職任的罪孽.md
  summary: 出28:38「這牌必在亞倫的額上，亞倫要擔當干犯聖物條例的罪孽；這聖物是以色列人在一切的聖禮物上所分別為聖的……使他們可以在耶和華面前蒙悅納」，以及28:43「在聖所供職的時候必穿上，免得擔罪而死」。BH 指出以色列人所獻的禮物雖已分別為聖，仍帶著人的罪污，大祭司的職責就是使這些供物得蒙悅納；BH 並注意到額頭在古代近東常與身分和使命相連，金牌戴在額上等於把「歸耶和華為聖」放在最具代表性的位置。另一面的擔罪則落在祭司自己身上：GT 引丁良才說，祭司供職若不穿與聖職相稱的衣服，「就必惹動神的震怒；定要受神的懲罰」；CT 註明「『擔罪』指穿凡俗常服和赤身露體在聖所內供職乃是得罪神的事」。
  relation: 民18:1「一同擔當干犯聖所的罪孽」在本章已具雛形，而本章的形式很具體：一面刻著「歸耶和華為聖」的金牌，常在亞倫額上。KC 點出這件東西回應的問題比軟弱更麻煩：「百姓中不只有軟弱，就是百姓需要大祭司的力量與愛的地方。也有罪。有鑑於此，他額上有一面精金的牌子。」出28 的擔當落在聖物上，民18 的擔當擴及整個聖所與祭司職任——同一個動詞，範圍逐步放大。
- title: 古代近東的神諭機制
  path: link_folder/背景/古代近東的神諭機制.md
  summary: 出28:30「又要將烏陵和土明放在決斷的胸牌裡」。GT《舊約背景註釋》指出以是非題的方式求問神明「卻是古代近東廣為人知的作法」，並舉三項比對：巴比倫的塔米圖（tamitu）文獻「保存了不少神諭性問題的答案」；美索不達米亞有石子占卜（psephomancy），「廣泛使用肯定和否定的石頭（大概是鮮明和烏黑的石塊）」；亞述文獻具體提及條紋大理岩，同一顏色的石塊要連續抽出三次才能肯定答案的真確性。同一則註釋同時劃出界線：烏陵和土明「並不像其他占卜方法，具有不良的意味」，聖經談非以色列人的崇拜與儀式時也從未提及它；而且經文從未提到它的「製造」，「暗示在此之前，烏陵和土明已經在使用之中」。
  relation: 創24 亞伯拉罕的僕人在井旁所求的記號用的已是同一套機制——向神明提出是或非的問題，再用某種非是即否的裝置得答案。出28 把這個機制正式安置進祭司制度：它不再是個人臨場的求問，而是掛在大祭司胸前、隨他進出聖所的常設器物。GT《丁道爾》也說明了它為何後來消失：「隨著以色列先知活動的興起，這種『機械式』尋求帶領的需要亦相對而消減。聖靈降臨後（徒2章），新約時代再無『拈鬮』的案例並不偶然，因為從那時開始，神直接帶領祂的子民。」
- title: 蒙靈充滿的智慧恩賜（比撒列、亞何利亞伯）
  path: link_folder/神學/蒙靈充滿的智慧恩賜（比撒列、亞何利亞伯）.md
  summary: 出28:3「又要吩咐一切心中有智慧的，就是我用智慧的靈所充滿的，給亞倫做衣服」——這是出埃及記首次出現「智慧的靈所充滿」的說法，早於出31 點名比撒列與亞何利亞伯。GT《精讀本》說明其所指：「『智慧的靈』指聖靈（賽11:2；路4:17,18）。在舊約時代，神的聖靈只賜於那些作神的工作的特殊的人，即王、先知、士師、祭司。到了新約時代，聖靈降臨在每一位基督徒身上」，並指出「由於神的工作只能讓那些有神智慧的人完成，所以神讓用智慧的靈所充滿的人作祭司」。GT《中文聖經註釋》講得更直接：做聖衣的人「必須是一切心中有智慧的，而這智慧，乃是神用智慧的靈所充滿的，才有資格來做」。
  relation: 出31、35、36 記的是建造會幕本體的匠人（比撒列、亞何利亞伯），本章記的是做聖衣的匠人——同一個資格條件先用在人的衣服上，再用在神的居所上。KC 從同一句讀出一層應用：「對我們而言，衣服表達這人是誰……我們若心中有智慧，就會在祂裡面越來越多地發現榮美。」智慧的靈在此不只是手藝的來源，也是辨認榮美的能力。
