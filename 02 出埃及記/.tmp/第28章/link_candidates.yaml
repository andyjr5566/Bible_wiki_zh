- name: 古代近東的神諭機制
  type: 背景
  evidence: 出28:30 烏陵和土明放在決斷的胸牌裡。GT《舊約背景註釋》〈出二十八30〉指出以是非題求問神明是古代近東廣為人知的作法，舉巴比倫的塔米圖（tamitu）文獻、美索不達米亞的石子占卜（psephomancy）與亞述文獻中連續抽出同色石塊三次才算確認的作法為比對，並指出烏陵和土明「並不像其他占卜方法，具有不良的意味」。創24
    的求問記號已是同一機制，本章是它在祭司制度中的正式安置。
- name: 蒙靈充滿的智慧恩賜（比撒列、亞何利亞伯）
  type: 神學
  evidence: 出28:3「又要吩咐一切心中有智慧的，就是我用智慧的靈所充滿的，給亞倫做衣服」——這是出埃及記首次出現「智慧的靈所充滿」的說法，早於出31 點名比撒列與亞何利亞伯。GT《精讀本》指出「智慧的靈」即聖靈，並列出舊約中受靈的四類人（王、先知、士師、祭司），對比新約聖靈降臨在每一位基督徒身上。
- name: 古代近東的祭司
  type: 背景
  evidence: 出28:1 亞倫和他的兒子被分別出來供祭司的職分。GT《舊約背景註釋》〈出二十八1 古代近東的祭司〉整段鋪陳：祭司是古代近東所有文化共有的發展，只有貝督因部落沒有專人擔任；祭司自幼在廟中受教育、地位常世襲；他們是文盲社會中極少數識字的人，因而兼掌占卜；階級由高而低為大祭司、中等祭司、樂師、廟役，大祭司的勢力「有時堪與君王匹敵」。
- name: 為榮耀為華美（聖衣的目的）
  type: 主題
  evidence: 出28:2、40 兩次以「為榮耀，為華美」說明聖衣的目的（大祭司一次、眾祭司一次）。CT 給原文字義「榮耀，富足，尊榮」與「榮美，燦爛，榮耀」，並解為神性／人性的彰顯；GT《丁道爾》指出這是聖經對聖衣含義唯一的解釋，「除此以外，聖經再無解釋個別衣物含義之處」；GT《精讀本》從事奉本身立論；GT
    引丁良才指出神也以眾祭司的白衣為榮耀為華美；BH 亦反覆以 glory／beauty 申說。
  surfaces:
  - phrase: 為榮耀，為華美
    verses:
    - 2
    - 40
- name: 祭司聖衣的件數之爭
  type: 解經爭議
  evidence: 出28:4、39-43 列出的衣物，各家統計不一。GT 引丁良才作「眾祭司的衣服共有四件：褲子、內袍、大帶、裹頭巾」，「大祭司的衣服多四件：外袍、以弗得、胸牌、金牌」，另計大贖罪日穿的一套細麻衣；GT《精讀本》則作「大祭司所穿的七件衣服（胸牌、以弗得、外袍、內袍、金牌、冠冕、腰帶）和普通祭司所穿的三件衣服（內袍、頭巾、腰帶）」，並主張細麻布褲子「是沒有受膏的普通衣服」而不列入。分歧的軸心在褲子算不算聖衣。
