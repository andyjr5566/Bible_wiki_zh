book: 出埃及記
chapter: 14
updates:
- title: 六十萬人的數目
  path: link_folder/解經爭議/六十萬人的數目.md
  summary: "GT 賈斯樂郝威《聖經難解經文詮釋手冊》〈命題18〉以民一45-46 的「大約有兩百萬人左右」為前提，追問這麼多人如何在短時間內通過紅海；他的答覆分兩層：經文並沒有說渡海只花一夜（「在此沒有提到是什麼時候，因此也不能就下結論說以色列人在一大早就全部過了紅海」），而且即使按蘇彝士灣最寬處計，「它的平均寬度大約有40哩。如果一個人平均一小時走2哩，40哩的路程大約24 小時內就可以走完」。GT《聖經精讀本──出埃及記註解》另從通道寬度估算：「要使近200萬的男女老少和各種牲畜一夜渡過紅海，分開的通道寬度至少需要一海裡（1,609m）。」同一份註釋在 v5 也用「60多萬壯丁」計算法老失去的勞動力。"
  relation: "本章把出十二37 的人口數字推到了實務層面——過海需要多久、通道要多寬、埃及損失多少勞動力，都建立在這個數目上。"
- title: 出埃及的年代
  path: link_folder/解經爭議/出埃及的年代.md
  summary: "本章的來源在斷代上給了三種態度。GT《聖經精讀本──出埃及記註解》在 v6 直接指名：「這時候的法老是阿孟和蒂世（Amenhotep II，B.C.1448-1424）。他統治的埃及第19王朝已經擁有了軍兵和馬隊。」GT《丁道爾聖經註釋》在 v18 反對用法老的遺體斷代：「聖經並沒有說法老在這場『邊界衝突』中身亡……因此，若有人試圖在歷史尋找木乃伊沒得適當保全的法老，從而斷定出埃及的日期，只會白費工夫。」GT《靈修版聖經註釋》則指出史料本身闕如：「由於埃及人沒有記載，或是有記載但尚未被發現，我們至今無法判定這件事的準確時間。」"
  relation: "本章提供了斷代最常被引用的兩條線索——本章法老的身分，以及他全軍覆沒的結局——而三份來源分別給出指名、反對與存疑三種處理方式。"
- title: 哈妥爾（Hathor）
  path: link_folder/文化/哈妥爾（Hathor）.md
  summary: "GT《中文聖經註釋》在 v2 解「比哈希錄」時提到這位女神：這個地名「在原文有葦塘或草場的含義，但可能是埃及文『女神 Hathor 的殿』而錯讀成希伯來文的 Pi-hairoth」。同一節的另一個地名巴力洗分，GT《丁道爾聖經註釋》指出是迦南神祇巴力的廟宇。"
  relation: "神吩咐以色列人安營的位置，可能同時挨著哈妥爾的殿、對著巴力的廟——第9章第五災擊打的是以母牛為形象的哈妥爾，本章則是在她與巴力的地界上把海分開。"
