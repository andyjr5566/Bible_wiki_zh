name: 石版
type: 文化
secondary_types: []
aliases: []
status: formal
definition: 出埃及記二十四12 神召摩西上山，「我要將石版並我所寫的律法和誡命賜給你」。CT 指出「『律法和誡命』在此指十誡，因為石版上所寫的僅有十條誡命（參申四13）」，並在第4節註明摩西所寫的是寫在書上，「並不是石版上，那是神用指頭寫的」。GT《丁道爾聖經註釋》認為譯法可以更清楚：「石版並……律法，譯作『石版，即律法和誡命……』更佳」，並指出聖經他處稱這兩塊石版為「法版」（出三十一18）或「立約的版」（申九9）。
accumulations:
- book: 出埃及記
  chapter: 24
  summary: 出二十四12。GT《舊約聖經背景註釋》把石版放進古代近東的慣例裡：「古代近東的慣例，是將重要文件、法典，和記錄君王勇武戰績的年表銘刻於石。神在西乃山賜給摩西的石版也是依循同樣的模式」，但同時坦言「『所刻的是十誡』，這是個十分古老的傳統說法，然而版上寫的究竟是什麼，其實無法肯定」。GT《中文聖經註釋》則指出這石版「是神自己寫的，而且是兩面有字的兩塊石版」，因此第12節的「律法」不會是二十23至二十三19 的約書，而應按原文原有的意義作「教訓」解。
  relation: 石版與摩西所寫的約書在本章是兩份不同的文件：約書由摩西寫在書上、當眾宣讀、以血確立（3-8節），石版則由神自己寫、在雲中賜下（12節）。GT《舊約聖經背景註釋》並追出石版後續的下落：「原來的石版被毀之後（三十二19），神又另賜新版（三十四1）。第二套石版安放在約櫃之中（申十5）。」
