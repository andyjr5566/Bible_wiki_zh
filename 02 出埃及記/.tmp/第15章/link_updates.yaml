book: 出埃及記
chapter: 15
updates:
- title: 耶和華
  path: link_folder/神學/耶和華.md
  summary: "v1-18 摩西之歌歌頌的對象；v3「耶和華是戰士，祂的名是耶和華」；v11「眾神之中，誰能像你」；v18「耶和華必作王，直到永永遠遠」；v26「我耶和華是醫治你的」"
  relation: "本章是全卷第一次以詩歌認識神：祂是戰士（v3）、是力量詩歌拯救（v2）、是至聖至榮（v11）、是王（v18）、是醫治者（v26）；《舊約背景註釋》指出關鍵分別——巴力與瑪爾杜克在神話中制服海洋的化身，耶和華卻是用真實的海、在歷史中擊敗真實的人"
- title: 審判
  path: link_folder/神學/審判.md
  summary: "v7「推翻那些起來攻擊你的；你發出烈怒如火，燒滅他們像燒碎稭一樣」；v10「他們如鉛沉在大水之中」；v12「你伸出右手，地便吞滅他們」"
  relation: "第14章的事件在本章成為詩歌：仇敵六句誇口（v9「我要追趕、我要追上…」）對上神一口氣（v10「你叫風一吹」）——KC：「消滅仇敵在神不過是呼出一口氣的代價」；v12 的「地」按烏迦列文可作陰間"
- title: 救恩
  path: link_folder/神學/救恩.md
  summary: "v2「耶和華是我的力量，我的詩歌，也成了我的拯救」——14:13「看耶和華今天向你們所要施行的救恩」的應驗"
  relation: "《丁道爾》指出本卷「救恩」的意義是漸進的：14:13 與本節只含救命或戰勝的意思，「『救恩』的屬靈意義隨舊約啟示而漸進，其屬物質的意義逐步消減」——然而二者對希伯來人並無鮮明分別；本節後為詩118:14、賽12:2 直接引用"
- title: 出埃及的年代
  path: link_folder/解經爭議/出埃及的年代.md
  summary: "摩西之歌的後半（v13-18）提供了兩條常被引用的斷代線索。一是 v14 的「非利士的居民」：GT《中文聖經註釋》指出「以色列人出埃及過紅海時，非利士人還居住在海島上，尚未進佔其後稱為非利士地，即現今稱為巴勒斯坦地的地方。故此，這節經文絕不可能是摩西時代所寫的」；GT《丁道爾聖經註釋》給了年份：「主前一一八八年非利士人抵達迦南以前，這地不可能有此名稱，因此這句話起碼當來自入侵迦南以後。」二是 v17 的「你手所建立的聖所」：GT《中文聖經註釋》認為指所羅門的聖殿，GT《舊約聖經背景註釋》也說「山、產業、住處、聖所一同出現，顯示所指的是錫安山──耶路撒冷」。但 GT《丁道爾聖經註釋》兩處都反駁，認為這些平行語句「未必直指錫安山或所羅門的聖殿，因而有可能是早至摩西時代的作品」，更遠古的拉斯珊拉泥版已有類似語言，並以全詩「強而有力的韻律，簡潔而深奧的思想，富有古風的語言」與多處古式動詞字尾為早期作品的證據。"
  relation: "本章把年代問題從「出埃及發生在哪一年」推進到「這首詩寫於哪一個世紀」——同一段經文，早期說與後期說各執一端，而雙方引用的都是文本內部的證據。"
- title: 紅海指的是哪個海
  path: link_folder/解經爭議/紅海指的是哪個海.md
  summary: "第14章通篇只稱「海」或「海邊」，到了 v4 才第一次出現「紅海」。GT《中文聖經註釋》指出：「在第十四章，五經的編輯者絕未提到這海的名稱，而只說『海』或『海邊』。現代學者則認此詞的正譯，應作蘆葦海」，並把細節留給緒論「紅海指的是哪個海」。GT《舊約聖經背景註釋》則認為這裡提「蘆葦海」不是要再討論位置，而可能是個雙關語：「希伯來語的 suph 字不但有『蘆葦』的意思，更可譯作名詞『終結』，或動詞『滅盡』。」CT 也在 v4 註明「請注意『紅』字原文具有雙關語意」，並給原文字義「紅」為「蘆葦，激流，終結，滅盡」。"
  relation: "本章第一次替那片水域命名，而這個名字同時是地理問題與文字遊戲——「蘆葦海」既指出過海的地點，也在詩歌裡預告了埃及全軍的「終結」。"
