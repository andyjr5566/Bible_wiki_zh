  - name: "神施恩憐憫的主權（羅9:15,18）"
    type: "互文"
    evidence: "出33:19 神說「我要恩待誰就恩待誰；要憐憫誰就憐憫誰」。KC：保羅在羅9:15,18 引此節回應那些控告神不公義的人——神是完全自由的主權者，按自己的旨意施恩或憐憫，不受任何外力轄制；神從不預定人受審判，人是因自己的緣故承受審判。GT：這話顯明神有主權，祂固然為萬事萬物定了定律，如有需要，祂有主權暫廢這定律，使某人不受其轄制"
    surfaces:
      - phrase: "我要恩待誰就恩待誰；要憐憫誰就憐憫誰"
        verses: [19]

  - name: "不能看見神的面而存活"
    type: "神學"
    evidence: "出33:20 神說「你不能看見我的面，因為人見我的面不能存活」。CT：意指墮落的人類若非基督十字架救贖的遮蔽，不能在聖潔神的面光中存活；摩西所見僅是神的背（23節），要等到主顯現之日才得見祂的真體（約壹3:2）。GT：此節解釋了11節「面對面說話」、民12:8、出24:11、賽6:1等經文的意涵（參約14:9）；保羅也得了主特別的顯現和啟示（林後12:1-4），但仍論到神住在不能靠近的光裡（提前6:16）"
    surfaces:
      - phrase: "人見我的面不能存活"
        verses: [20]
      - phrase: "你就得見我的背，卻不得見我的面"
        verses: [23]

  - name: "我按你的名認識你"
    type: "神學"
    evidence: "出33:12,17 神兩次對摩西說「我按你的名認識你」，這句話是摩西整場代求的支點。GT《串珠聖經註釋》直接釋為「就是『揀選你』」。GT《中文聖經註釋》引七十士譯本：「七十士譯本把『按你的名』繙為『起於一切』（Para pantas），含意是在一切之外我揀選了你，或我認識你超於一切，我知道（知道是認識的原文）你有能力可以做得到，因為你已在我眼前蒙恩。」GT《聖經精讀本》：「知道名字表示保持著非常好的關係。意味著神特別揀選摩西，與他有特別的交通。」CT 指出「按…名認識」意指關係親密，「眼前也蒙了恩」意指地位特殊，並提出「名」的兩層意思：摩西這名的意思是「從水裡拉上來」，是神所拯救的；另一是摩西已過的為人使神賞識他。KC 把這句話拆成兩點：耶和華與摩西有位格性的關係，而摩西承認這關係的基礎是恩典。BH：「knowing someone by name implies an intimate understanding and acknowledgment of their character and role」。新建條目"
    surfaces:
      - phrase: "我按你的名認識你"
        verses: [12, 17]

  - name: "認識神的道"
    type: "主題"
    evidence: "出33:13 摩西求「將你的道指示我，使我可以認識你」。GT《中文聖經註釋》指出這個「道」不是「話」：「原文這裏所用的道，並不是『話』，乃道路、方法、計畫、方向、目的、原則、意念等方面的意義。因此，這認識，也就應按原文直譯為知道較佳……這大概就是現代中文譯本將之繙為『求你把你的計畫指示我，使我能事奉你』的原因。」同一份來源指出七十士譯本另有完全不同的譯法：「求將你自己顯示予我，使我可以看得你更清楚。」GT《聖經精讀本》列出兩家解法：「你的道：『主的旨意』（Pulpit）或者『主的幫助』（Calvin）」，並指出「使我可以認識你」是「指能夠認識主的人格」。GT 丁良才給的經文串是詩25:4、14，51:13，約15:15。GT《啟導本聖經腳註》：「神的本體人不能見（23節），摩西藉著認識神的道和祂對人的要求來認識神。」CT 指出這「認識」是「藉由實際的經驗而學取的認識，不僅指更多認識神的本性，且更多認識神的作為」。GT《丁道爾聖經注釋》引慕蘭伯指出本段「在五節之中，使用『認識』這動詞共六次之多」。新建條目"
    surfaces:
      - phrase: "使我可以認識你"
        verses: [13]

  - name: "神是否改變進迦南的心意"
    type: "解經爭議"
    evidence: "出33:3 神說「我自己不同你們上去」，但後來以色列人卻在約書亞帶領下浩蕩進入迦南（書1-11章）——GT 賈斯樂郝威《聖經難解經文詮釋手冊》把這列為難題〔命題35〕「對以色列人上迦南地，神是否改變了祂的心意？」其解答有三層：「這兩節經文是在不同的時候說的。出埃及記卅三章3節是針對第一代叛逆頑強的以色列人說的；後來是對第二代相信神的百姓，跟隨約書亞進入應許地的以色列人說的。」；「並非所有神所警誡的（或應許）是無條件的。這一個應許是有條件的，如果他們相信順服祂，祂就要與他們進入應許之地（第二代的百姓）；但是如果他們不順服（第一代的百姓）祂就不與他們進入應許地。」；「神祂要帶他們進入應許地這不可改變的目標，導致一些暫時可改變的情況發生，以達到最終的目的。」GT《丁道爾聖經注釋》從另一角度支持同一結論：「恐怕我……把你們滅絕。神拒絕是為了保護他們。」本章第14、17節神應允摩西「我必親自和你同去」，正是這個「暫時可改變的情況」在同一章內就翻轉的證據。新建條目"
    surfaces:
      - phrase: "我自己不同你們上去"
        verses: [3]

  - name: "分別為聖"
    type: "神學"
    evidence: "出33:16 摩西代求的最後一個、也是最有力的理由：「豈不是因你與我們同去、使我和你的百姓與地上的萬民有分別嗎？」CT 指出本句有兩個重點：神的選民是和地上萬族有所分別的；不同的原因乃在於有神和他們同在。GT《丁道爾聖經注釋》：「神一再呼籲以色列，要他們和萬國有別。摩西正確地看出神住在他們中間，就是以色列獨特之處。其他一切不過是這一點的註腳，亦源於這個事實。」GT《中文聖經註釋》：「使摩西與這百姓與地上萬民有分別的證據，就是神親自的同在和同去！」GT《聖經精讀本》：「成為神的百姓的最大證據是分別為聖（羅1:6,7）。這不僅是從世俗分別為聖，而且從黑暗、死亡、惡勢力中分別為聖。」BH 指出以色列的獨特不是基於自己的功績而是基於神的揀選與約，並以彼前2:9 連到新約信徒因聖靈內住而被分別出來。已有條目「分別為聖」"
    surfaces:
      - phrase: "與地上的萬民有分別"
        verses: [16]

  - name: "希伯來書4章神的安息"
    type: "互文"
    evidence: "出33:14 神應允摩西「我必親自和你同去，使你得安息」。GT 丁良才指出這個「安息」的落點是在迦南居住（申3:20，書1:13、15，22:4，參來4:8）；GT《串珠聖經註釋》同樣指出「『安息』與承受應許地很有關連……所以神實在是重申以前所應許的，但似乎這應許現在只落在摩西身上」。GT《中文聖經註釋》另提醒原文是「我必使你得安息」，「乃是神安慰摩西不必擔心掛慮的含義」，並認為現代中文譯本的「我要使你得勝」之譯法「可能是過強了一點」。CT 把這個安息定義為臨在的果效：「意指神應許必以祂的『臨在』與摩西同去，使他不至於煩擾掛慮，內心安寧」，並歸納為「沒有神的同在，就沒有安息；有神的同在，在任何情況下，仍能安息」。KC 一句話同義：「Where God is present, there is rest.」BH 指出這安息既是當下的（迦南的安居），也是末世的——來4:9-10 邀請信徒因信進入神的安息。已有條目"
    surfaces:
      - phrase: "使你得安息"
        verses: [14]

  - name: "亞伯拉罕為神的朋友"
    type: "神學"
    evidence: "出33:11「耶和華與摩西面對面說話，好像人與朋友說話一般。」CT 指出這個比喻還不夠強：「全句意指神與摩西之間的關係有如在一起同工的夥伴，比親密的朋友更進一步，將神所要作的事告訴摩西」，並歸納為「我們與神的關係，應當從親密的『朋友』，更進到『同伴、同工』（原文字義），可以彼此商量工作」。GT《丁道爾聖經注釋》：「清明的屬靈洞悉力是摩西所得的恩賜；神將自己的心意與他分享。」BH 指出古代近東的友誼含忠誠、信任與互相尊重之意，並把這一節連到約15:15——信徒在基督裡被稱為神的朋友。與創18 亞伯拉罕在敬畏中為所多瑪代求、神向他透露將行之事，是同一種關係內容。已有條目"
    surfaces:
      - phrase: "好像人與朋友說話一般"
        verses: [11]

  - name: "神的同在"
    type: "神學"
    evidence: "出33 全章環繞神的臨在。GT《丁道爾聖經注釋》：「出埃及記自始至終一直強調神臨在的主題，這主題更籠罩了本章全章……犯罪纍纍的人怎能經歷神的臨在？」神先宣告「我自己不同你們上去」（3節），摩西力爭「你若不親自和我同去，就不要把我們從這裡領上去」（15節），最終蒙神應允（14、17節）。CT：任何事物都不能代替神的同在——「如果失去和施恩者的交通，正是那些神所賜的恩賜，會陷我們於咒詛。倘若神不和我們同去應許的美地，美地的豐盛正是我們貧窮的機會。」GT《中文聖經註釋》：「使摩西與這百姓與地上萬民有分別的證據，就是神親自的同在和同去！」已有條目「神的同在」"
    surfaces:
      - phrase: "你若不親自和我同去"
        verses: [15]
