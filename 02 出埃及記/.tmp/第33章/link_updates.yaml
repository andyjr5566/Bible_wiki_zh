book: 出埃及記
chapter: 33
updates:
- title: 不能看見神的面而存活
  path: link_folder/神學/不能看見神的面而存活.md
  summary: 出33:20「你不能看見我的面，因為人見我的面不能存活。」CT 指出這是墮落人類的處境：「若非基督十字架救贖的遮蔽（參22節），不能在聖潔的神之面光中存活。」GT 丁良才指出本節是解讀全本聖經「見神」記載的鑰匙——「這一節解釋11，民十二8，出二十四11，賽六1等處」；GT《聖經精讀本》：「聖經中有關見到神的記述，都是指看到了其榮耀的一部分，或者看見象徵性的形態而已，不是指看到了實體的全部」；GT《丁道爾聖經注釋》：「親眼見神是凡人所不能忍受的」；GT《舊約聖經背景註釋》則指出「面對面說話」是慣用語，與20-23節並無牴觸。
  relation: 本章把「面對面」（11節）與「不能看見我的面」（20節）放在同一章，正是這條真理最完整的現場：親密的直接溝通是恩典，本體的直視則超過墮落之人所能承受。GT 艾基斯《舊約聖經難題彙編》指出摩西第18節所求的「不只是有某一程度掩藏著的顯現」，而是「看見神真正的面」——神拒絕這一項，卻另以磐石穴與遮手成全他，正是本條目在舊約的最高水位。
- title: 亞伯拉罕
  path: link_folder/人物/亞伯拉罕.md
  summary: 出33:1 神吩咐摩西起行時重提「我曾起誓應許亞伯拉罕、以撒、雅各說：要將迦南地賜給你的後裔」。CT 列出神向亞伯拉罕的歷次應許（創12:7、13:14-17、15:18、17:2-8、22:16-18），「起誓應許」表示神甘願受自己誓言的約束。
  relation: 金牛犢事件後神仍持守亞伯拉罕之約——百姓雖犯大罪，往應許地去的命令不變；GT 指出神起誓的兩項內容（子孫眾多、得迦南地為業）中，前者已在出埃及記開頭應驗，如今百姓正要去承受第二項。
- title: 以撒
  path: link_folder/人物/以撒.md
  summary: 出33:1 神重申曾起誓應許亞伯拉罕、以撒、雅各將迦南地賜給其後裔。CT 指出神向以撒的應許見創26:3。
  relation: 以撒與亞伯拉罕、雅各並列，見證神在金牛犢事件後仍照列祖之約推進應許地的賜予。
- title: 何烈山
  path: link_folder/地點/何烈山.md
  summary: 出33:6 「以色列人從住何烈山以後，就把身上的妝飾摘得乾淨。」CT 指出何烈山即神的山（出3:1），又稱西乃山，是頒佈十誡與會幕樣式之處。GT 指出「何烈」原文與「妝飾」同字根（裝飾品），本節帶文字呼應。
  relation: 何烈山在本章成為百姓悔改的時間標記——從住此山之後不再佩戴妝飾，與他們在此山下犯金牛犢之罪（飾物成偶像原料）形成對照。
- title: 我按你的名認識你
  path: link_folder/神學/我按你的名認識你.md
  summary: 出33:12、17 神兩次說「我按你的名認識你」。GT《串珠聖經註釋》直接釋為「就是『揀選你』」；GT《中文聖經註釋》引七十士譯本作「起於一切」（Para pantas），「含意是在一切之外我揀選了你，或我認識你超於一切」；GT《啟導本聖經腳註》指出這是「神特別揀選了摩西作百姓的代求者」；GT《聖經精讀本》：「知道名字表示保持著非常好的關係」。CT 指出「按…名認識」意指關係親密、「眼前也蒙了恩」意指地位特殊，並提出「名」的兩層意思：摩西之名意為「從水裡拉上來」，是神所拯救的；另一是摩西已過的為人使神賞識他。
  relation: 本章的結構把這句話放在頭尾兩端：摩西在12節引用它作為代求的根據，神在17節用同一組理由應允他——「因為你在我眼前蒙了恩，並且我按你的名認識你」。KC 指出摩西是在承認這關係「基礎是恩典」的前提下才這樣求的。這也是摩西敢把個人的蒙恩擴大成全民蒙恩（16節）的憑據。
- title: 摩西求神同去並蒙應允
  path: link_folder/事件/摩西求神同去並蒙應允.md
  summary: 出33:12-17 摩西不接受「只差使者同去」的安排，三步爭取神親自同行：訴諸神說過的話（12節）、求指示神的道以認識神（13節）、提醒「這民是你的民」（13節）。GT《中文聖經註釋》指出「道」的原文不是「話」而是道路、計畫、方向、原則之意，並指出13節兩個「民」字原文不同（go^y／`am）；第14節「原文直譯卻不是我必親自去，乃是『他們會在我前面走』」，七十士譯本作「我自己會在你前面走」。GT《丁道爾聖經注釋》主張直譯應是「我的面……」，並認為同去的「天使」即「祂面前的使者」（賽63:9）。丁良才提醒14節說的是「你」不是「你們」，故摩西再求時改為「我們」（15節）。
  relation: 本章的關鍵轉折在於摩西拒絕以次好為滿足：有應許地卻沒有神，對他毫無意義。GT《丁道爾聖經注釋》引慕蘭伯指出本段五節之中用了六次「認識」這個動詞；KC 則指出摩西站得住的位置正是他先前離營所取的分別立場——「要為別人代求，沒有比站在與惡分別的地位更好的根基」。最後神應允的內容（17節）成為出34 立約更新的前提。
- title: 摩西的代求
  path: link_folder/神學/摩西的代求.md
  summary: 出33:12-17 摩西在營外會幕為百姓代求：先訴諸神的話（你說我按你的名認識你）、再求指示神的道以認識神、又提醒「這民是你的民」；蒙神應允親自同去後仍不止步，進而求「顯出你的榮耀給我看」（18節）。CT 靈訓要義將本章標題定為「神與人之間的中保」，指出摩西第一次求情遭拒（32:30-33:6）後再次代求（33:7-17）方蒙應允。
  relation: 本章的代求較32章更進一層——不再只求免禍赦罪，而是求神的同在與更深認識神自己；KC 指出離開營（分別出來）的位置正是為他人代求最好的根基。
- title: 摩西的臨時會幕（營外）
  path: link_folder/事件/摩西的臨時會幕（營外）.md
  summary: 出33:7-11 金牛犢事件後神不肯住在營中，摩西便在營外遠處支搭帳棚稱為會幕。GT 丁良才：「離營卻遠」表明神棄絕以色列人，「雖是如此，會幕離營不甚遠」；GT《丁道爾聖經注釋》：這象徵「神不願住在以色列人中間，但也不願完全撤回祂的臨在」，並指出動詞的未完成時態表示這是曠野時代慣常的做法；GT《舊約聖經背景註釋》：「此地是為先知而非祭司事工而設的，這裡沒有獻祭，也無祭壇」；GT《串珠》：會幕「由約書亞而不是由利未人管理」。KC 指出這不是奉命而行：「神沒有給摩西命令，是他在正確判斷處境之後憑信心支搭了帳棚」，並以來13:13 讀出「藉著走出去，摩西定了那營的罪」。
  relation: 本章的營外會幕是神與百姓「隔而未絕」的具體形狀：不能同住，卻仍相會。GT《中文聖經註釋》指出摩西在此「成了神和以色列人之間，另一形式的中保」——他求問神所得的解決辦法常成為日後的先例（民27:1-11；36:5-9）；同一來源並認為這簡單的會幕大概就是曠野時代的實際會幕，後期仍有記載（民11:24-25；申31:14-15；撒上2:22）。與出25-31 那座「在營中央」的會幕相比，本章的位置本身就是判詞。
- title: 百姓摘除妝飾表悔改
  path: link_folder/事件/百姓摘除妝飾表悔改.md
  summary: 出33:4-6 百姓聽見凶信後不佩戴妝飾，神又吩咐他們摘下來。GT《中文聖經註釋》把兩處分開：「4節的不佩戴妝飾品，是百姓心中悲戚而自動不戴的；5節下的不佩戴妝飾，卻是為免以色列人再將他們的飾物交給亞倫製金牛犢般犯罪，是被吩咐摘下來的」。GT《啟導本》指出這些妝飾「有些很可能與敬奉外邦神只有關」，並以創35:2-4 為對照；GT《丁道爾聖經注釋》指出這原是暫時服哀的風俗，「在以色列卻成了永久性的規例」。CT 的〔原文字義〕另注意到一個雙關：「何烈」的字義是裝飾品，與「妝飾」原文同字。KC：摘下妝飾「意味著承認外表的體面沒有立足之地」。
  relation: 本章的悔改不是口頭的：金牛犢的材料出自耳上的金環（出32:2-3），現在同一批飾物被徹底除去，罪的物證與悔改的記號是同一件東西。GT《串珠聖經註釋》指出第5節「使我可以知道怎樣待你們」暗示神尚未決定如何對待他們，「讓摩西可再為百姓祈求」——百姓的悔改因此成為摩西 12-17 節那場代求得以進行的前提；KC 說得同樣直接：神彷彿退到一旁審議，「這給了百姓時間和機會，去證明他們真的願意自卑」。
- title: 硬著頸項的百姓
  path: link_folder/神學/硬著頸項的百姓.md
  summary: 出33:3,5 神兩次稱以色列人為硬著頸項的百姓：「我自己不同你們上去……恐怕我在路上把你們滅絕」「我若一霎時臨到你們中間，必滅絕你們」。GT 引丁道爾：神的拒絕其實是保護——以色列若在犯罪時太靠近耶和華，神的怒氣發作他們便會死亡；丁良才引摩3:2 指出人越與神親近，神追討其罪越嚴。
  relation: 本章將「硬著頸項」從罪狀（32:9）推進為神人關係的難題：聖潔的神如何與頑梗的百姓同行？由此帶出摘妝飾的悔改、營外會幕的隔離，與摩西求神同去的代求，構成全章張力的來源。
- title: 磐石預表基督
  path: link_folder/神學/磐石預表基督.md
  summary: 出33:21-22 神說「看哪，在我這裡有地方，你要站在磐石上」，並在榮耀經過時將摩西放在磐石穴中、用手遮掩他。CT 指出磐石表徵基督（林前10:4），磐石穴表徵十字架——人唯有藏身十字架的遮蔽下，才能通過神榮耀之光的考驗；KC 指出摩西必須站在那基礎上、完全消失在其中，因基督是「那不能看見之神的像」（西1:15）。
  relation: 有別於出17章磐石出水的供應面向，本章磐石是「站立與藏身之處」——在神的聖潔榮光前，基督成為人得以存活的遮蔽，深化了磐石預表的救贖內涵。
- title: 神施恩憐憫的主權（羅9：15,18）
  path: link_folder/互文/神施恩憐憫的主權（羅9：15,18）.md
  summary: 出33:19「我要顯我一切的恩慈，在你面前經過，宣告我的名。我要恩待誰就恩待誰；要憐憫誰就憐憫誰。」GT《串珠》指出「恩慈」直譯可作「我一切的美善」，「表明神讓摩西一瞥的榮耀與憐憫人的屬性不能分割」；GT《丁道爾聖經注釋》指出本節宣稱神的本性為「善」，並引德萊維：「神恩待憐憫的對象就是犯罪的以色列；神基本屬性中沒有了這種『慈愛』的特質，以色列便要完全失落」；GT《中文聖經註釋》則把主權界定為「祂有主權暫廢這定律」——人本不可看神的樣貌，神卻為恩待摩西而稍予改變。KC 指出這句話的沉默對稱面：「我們從來讀不到祂說『我要向誰發怒就向誰發怒』，因為祂的忿怒永遠是公義而聖潔的。祂從不預定一個人受審判，那是那人自己作的。」
  relation: 這句宣告的位置很要緊：它不是抽象的神學命題，而是在金牛犢事件之後、對一群本該被滅絕的百姓說的，因此保羅在羅9:15、18 的引用是有現場感的——KC 指出保羅正是用這句話回應那些指控神不公的人。同時它也直接引出本章的下半段：既然神有主權暫廢定律，人本不能見神的面（20節），神卻為恩待摩西而安排磐石穴與遮手（21-23節）。
- title: 神是否改變進迦南的心意
  path: link_folder/解經爭議/神是否改變進迦南的心意.md
  summary: 出33:3「我自己不同你們上去」與約書亞記1-11章的實際進入迦南構成表面矛盾。GT 賈斯樂郝威《聖經難解經文詮釋手冊》列為難題〔命題35〕，解答分三層：說話的對象不同（第一代叛逆的百姓 vs 第二代相信的百姓）、這個應許是有條件的（「並非所有神所警誡的（或應許）是無條件的」）、目標與手段分層（「神祂要帶他們進入應許地這不可改變的目標，導致一些暫時可改變的情況發生，以達到最終的目的」）。GT《丁道爾聖經注釋》另指出「神拒絕是為了保護他們」；GT《串珠聖經註釋》：「雖然神已赦免他們，這安排顯然是要以色列人承擔犯罪的後果。」
  relation: 本章不必等到約書亞記就給出了答案：第14、17節神已應允摩西「我必親自和你同去」「你這所求的我也要行」。GT《聖經精讀本》因此把整段讀為「由於摩西的代禱，再次保證了誓約的內容」。這使第3節成為理解神「改變心意」語言的樣本——不變的是目標與本性，可變的是達成目標的方式，而代求與悔改正是促成改變的因素。
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 出33章全章環繞神的臨在：神宣告「我自己不同你們上去」（3節）成為百姓悲哀的凶信；摩西在營外會幕與神面對面相會（7-11節）；摩西力求「你若不親自和我同去，就不要把我們從這裡領上去」，並指出神的同去正是「使我和你的百姓與地上的萬民有分別」的唯一記號（15-16節）；神終應允「我必親自和你同去，使你得安息」（14節，原文直譯「我的面要同去」）。GT 引丁道爾：出埃及記自始至終強調神臨在的主題，這主題更籠罩本章全章——犯罪纍纍的人怎能經歷神的臨在，是本章要解決的問題。
  relation: 本章是「神的同在」神學語意最密集的一章：同在可因罪撤回、可因代求恢復；沒有神的同在，應許地的豐盛也毫無意義——CT 指出任何事物都不能代替神的同在。
- title: 神的榮耀
  path: link_folder/神學/神的榮耀.md
  summary: 出33:18-23 摩西求「顯出你的榮耀給我看」，神應允顯祂一切的恩慈（原文「一切的美善」）在摩西面前經過並宣告耶和華的名，但宣告「你不能看見我的面」，只使摩西在磐石穴中、神的手遮掩之下得見神的背。GT 引丁道爾：摩西所求的 kabod（榮耀，直譯「重量」）是神本體的彰顯，這是凡人不能承受的；KC 指出神以「一切的美善」回應——神的美善就是祂的榮耀，祂要人藉恩典的榮耀認識祂，過於藉威嚴的榮耀。
  relation: 本章是「求見神榮耀」敘事的原場景：榮耀＝神自己的臨在，其完全的彰顯要等基督顯現（約1:14,18、林後4:6）；摩西所得的部分答覆（恩慈經過、宣告聖名）在34:6-7 實現。
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 出33:11 摩西轉回營裡時，惟有他的幫手、一個少年人嫩的兒子約書亞不離開會幕。GT 引丁良才：摩西沒有派亞倫和他的兒子看守會幕，或因他們在金牛犢的罪上有份，約書亞則與此無關；並推算約書亞當時約五十多歲，「少年人」多含僕人之意不論歲數。CT 指出「不離開會幕」意即看守會幕。
  relation: 營外會幕由約書亞而非利未人管理；KC 指出他持續留在與神相會之處，是摩西繼承人的屬靈訓練，使他學到許多不為人知的屬靈事物，為日後承接領袖職分奠基。
- title: 耶和華的使者
  path: link_folder/神學/耶和華的使者.md
  summary: 出33:2-3 神說「我要差遣使者在你前面，攆出迦南人……我自己不同你們上去」。GT 引丁良才：本章第3節顯明這使者不是出23:20-21 那位（神的名在他身上的）使者，乃是被造的天使；丁道爾指出此應許實質上是神拒絕直接臨在，摩西在12-16節就此判決提出上訴。CT 則列出「使者」可指神所打發的各種存在（含神自己、天使、甚至出23:28 的黃蜂）。
  relation: 本章的「使者」成為神臨在等級的對照——差使者同去與神親自同去有別；摩西不滿足於天使引路，力求神親自同行，最終蒙應允（14,17節），是本條目語意光譜（從代理到親臨）最清楚的一章。
- title: 認識神的道
  path: link_folder/主題/認識神的道.md
  summary: 出33:13 摩西求「將你的道指示我，使我可以認識你」。GT《中文聖經註釋》指出原文的「道」不是「話」，「乃道路、方法、計畫、方向、目的、原則、意念等方面的意義」，故現代中文譯本作「求你把你的計畫指示我，使我能事奉你」；七十士譯本則另譯為「求將你自己顯示予我，使我可以看得你更清楚」。GT《聖經精讀本》列出兩家解法（Pulpit 作「主的旨意」、Calvin 作「主的幫助」）；GT《啟導本聖經腳註》指出「神的本體人不能見（23節），摩西藉著認識神的道和祂對人的要求來認識神」。CT 指出這「認識」是「藉由實際的經驗而學取的認識」。GT《丁道爾聖經注釋》引慕蘭伯指出本段五節之中用了六次「認識」這個動詞。
  relation: 本章把「認識」與「看見」分成兩條路，而第20節堵死了後者：人不能看見神的面。摩西第13節所求的因此不是好奇，而是唯一可行的途徑——透過神的道路與作為來認識祂。KC 指出摩西求的層次高於一般：「摩西不只想知道那條要帶他和百姓進應許之地的路。他想知道神的路。」這個請求也直接引出他在18節更大膽的一求。
- title: 迦南七族（迦南地原住民）
  path: link_folder/背景/迦南七族（迦南地原住民）.md
  summary: 出33:2 神應許差遣使者在前面攆出迦南人、亞摩利人、赫人、比利洗人、希未人、耶布斯人。GT《中文聖經註釋》指出經文只列六族，「撒瑪利亞抄本和七十士譯本，都加上了革迦撒人，而湊足通常所稱的迦南地七族的人」；CT 的〔原文字義〕逐個給出族名意義（迦南人「熱心的」、亞摩利人「山居者」、赫人「恐懼地子孫」、比利洗人「屬於某一村莊」、希未人「村民」、耶布斯人「被踐踏的後裔」），並指出「攆出」是「對方因不勝其擾而自動逃避」。GT 丁良才把這件事定性為「神特別的恩典」。BH 指出這幾族代表盤踞迦南的異教文化，迦南人尤以偶像崇拜與道德敗壞著稱。
  relation: 本章的處境使這個應許帶著張力：神仍要為百姓趕出七族、把他們領進流奶與蜜之地，卻宣告「我自己不同你們上去」（3節）——恩典的內容照舊，恩典的方式卻降了一級。GT《聖經精讀本》指出「攆出」意味著「對迦南的征服，在神的恩典中已經開始」，而摩西在12-17節所爭的正是：光有這個應許不夠，非要神親自同去不可。
- title: 雅各
  path: link_folder/人物/雅各.md
  summary: 出33:1 神重申曾起誓應許亞伯拉罕、以撒、雅各將迦南地賜給其後裔。CT 指出神向雅各的應許見創35:12。
  relation: 雅各是三代列祖之約的最後承受者，其名下的應許（創35:12）在此成為以色列人離開何烈山往迦南去的法理根據。
- title: 雲柱火柱
  path: link_folder/歷史/雲柱火柱.md
  summary: 出33:9-10 每當摩西進營外的會幕，雲柱便降下立在會幕門前，耶和華便與摩西說話；眾百姓看見雲柱就都起來，各人在自己帳棚門口下拜。CT 指出雲柱平時大概停在西乃山上，只在摩西進會幕時降下；聖經精讀本指出雲柱降下意味著神認可摩西所搭的臨時會幕。
  relation: 雲柱在本章從行路的引導（出13:21-22）轉為相會的記號——神臨在的可見象徵移到營外會幕門前，百姓遠遠下拜，反映金牛犢事件後神與百姓之間「隔而未絕」的關係。
- title: 面對面見神
  path: link_folder/神學/面對面見神.md
  summary: 出33:11 「耶和華與摩西面對面說話，好像人與朋友說話一般。」CT 指出摩西實際並未見到神的面（參18-23節），「面對面」形容彼此非常接近、如同當面交談，其關係如同工夥伴更進於朋友。GT 引民12:8 解釋此語即神「口對口」與摩西說話——不用異象異夢而是清楚直接的溝通；舊約聖經背景註釋指出「面對面說話」是慣用語，表示雙方關係誠懇坦率，與20-23節「不能看見我的面」並無牴觸。
  relation: 本章同時出現「面對面說話」（11節）與「不能看見我的面」（20節），是這兩個真理並存的關鍵章：親密的直接溝通是恩典，本體的直視則超過墮落之人所能承受，惟藉基督才得完全（約1:18）。
- title: 分別為聖
  path: link_folder/神學/分別為聖.md
  summary: 出33:16 摩西代求的最後、也是最有力的理由：「豈不是因你與我們同去、使我和你的百姓與地上的萬民有分別嗎？」CT 指出本句有兩個重點：神的選民是和地上萬族有所分別的；不同的原因乃在於有神和他們同在。GT《丁道爾聖經注釋》：「神一再呼籲以色列，要他們和萬國有別。摩西正確地看出神住在他們中間，就是以色列獨特之處。其他一切不過是這一點的註腳，亦源於這個事實。」GT《中文聖經註釋》：「使摩西與這百姓與地上萬民有分別的證據，就是神親自的同在和同去！」GT《聖經精讀本》：「成為神的百姓的最大證據是分別為聖（羅1:6,7）。這不僅是從世俗分別為聖，而且從黑暗、死亡，惡勢力中分別為聖。」
  relation: 本章給「分別為聖」下了一個與眾不同的定義：它的憑據不在以色列自己身上（不是律法、不是割禮、不是道德表現），而在神肯不肯同去。BH 同樣指出以色列的獨特不是基於自己的功績而是基於神的揀選與約，並以彼前2:9 連到新約——信徒的分別出於聖靈的內住。這也解釋了摩西為何不肯接受「差使者同去」的替代方案：那個方案給得起應許地，卻給不起分別。
- title: 希伯來書4章神的安息
  path: link_folder/互文/希伯來書4章神的安息.md
  summary: 出33:14 神應允摩西「我必親自和你同去，使你得安息」。GT 丁良才指出這個「安息」的落點是在迦南居住（申3:20，書1:13、15，22:4，參來4:8）；GT《串珠聖經註釋》同樣指出「『安息』與承受應許地很有關連……所以神實在是重申以前所應許的，但似乎這應許現在只落在摩西身上」。GT《中文聖經註釋》提醒原文是「我必使你得安息」，「乃是神安慰摩西不必擔心掛慮的含義」，並認為現代中文譯本的「我要使你得勝」之譯法「可能是過強了一點」。CT 把這安息定義為臨在的果效，並歸納為「沒有神的同在，就沒有安息；有神的同在，在任何情況下，仍能安息」。
  relation: 本章把「安息」與「同在」綁成一件事：安息不是抵達某地，而是有神同去。KC 一句話同義：「Where God is present, there is rest.」丁良才引來4:8 指出約書亞所給的安息並非終局——這正是來4:9-10 說「必另有一安息日的安息為神的子民存留」的根據；創2 的第七日安息、出31 的安息日記號，到本章成為隨行的應許，最後在基督裡成為信徒因信進入的安息。
- title: 亞伯拉罕為神的朋友
  path: link_folder/神學/亞伯拉罕為神的朋友.md
  summary: 出33:11「耶和華與摩西面對面說話，好像人與朋友說話一般。」CT 認為這個比喻還不夠強：「全句意指神與摩西之間的關係有如在一起同工的夥伴，比親密的朋友更進一步，將神所要作的事告訴摩西」，並歸納出一句應用：「我們與神的關係，應當從親密的『朋友』，更進到『同伴、同工』（原文字義），可以彼此商量工作。」GT《丁道爾聖經注釋》：「清明的屬靈洞悉力是摩西所得的恩賜；神將自己的心意與他分享。」BH 指出古代近東的友誼含忠誠、信任與互相尊重之意，並把本節連到約15:15。
  relation: 創18 的亞伯拉罕與出33 的摩西是同一種關係的兩個樣本：神向他們透露將行之事，他們則在敬畏中為別人代求——亞伯拉罕為所多瑪，摩西為以色列。丁良才引創18:17「我所要作的事豈可瞞著亞伯拉罕呢」作為摩西求「將你的道指示我」的比方，兩處的connective就是這個「朋友」的分量。BH 並指出新約把這個稱號開放給所有信徒：「以後我不再稱你們為僕人……我乃稱你們為朋友」（約15:15）。
