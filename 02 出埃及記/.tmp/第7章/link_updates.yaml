book: 出埃及記
chapter: 7
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: |
    第1節神使摩西「在法老面前代替神」，亞倫作他的先知；第6節「摩西、亞倫這樣行；耶和華怎樣吩咐他們，他們就照樣行了」；第7節記下他見法老時已八十歲；第15-20節他在尼羅河邊迎見法老，宣告並施行第一災。
  relation: |
    GT《中文聖經註釋》說第6節「是摩西亞倫順服神的話的最重要記載，也是本大段的中心主題，更可算為摩西接受呼召的完美結論」——與第6章那個兩次說自己「拙口笨舌」的人相比，本章的摩西已經是照神吩咐行事的人。CT 把他的一生分成三段：首四十年自以為「我能」（徒7:22），次四十年承認「我不能」（4:10），末四十年認識「神能」（申3:24）。第17節「我要用我手裡的杖擊打河中的水」是神的話，實際舉杖的卻是亞倫（v20）——CT 由此讀出一個原則：「神的僕人若是照神的吩咐說話行事，等同神自己說話行事。」
  sources:
  - CT_註解
  - GT_拾穗
  source_files:
  - ccbiblestudy_CT_exodus_7.txt
  - ccbiblestudy_GT_exodus_7.txt
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: |
    第1節「你的哥哥亞倫是替你說話的」，原文作「你的先知」；第10節他把杖丟在法老和臣僕面前變作蛇；第12節「亞倫的杖吞了他們的杖」；第19-20節他伸杖、舉杖擊打河水，行第一災。第7節記他八十三歲，比摩西大三歲。
  relation: |
    GT 丁良才把這組關係說得很整齊：「代替神——奉神之命，說神之話，掌神之權，行神之事」；「替你說話的」原文作「你的先知」，而「先知在人面前代表神，祭司在神面前代表人」。杖的歸屬也在本章轉手——丁良才指出這杖原是摩西的（4:2、17、20），「但因亞倫也常用，這杖也就成為亞倫的」。KC 從這一點讀出更深的一層：現在用的是亞倫的杖，而亞倫的杖日後要發芽（民17:8），所以這根杖帶著死裡復活的能力——「亞倫是主耶穌作復活之主的圖畫」，正如主復活之後說「天上地下所有的權柄都賜給我了」（太28:18）。
  sources:
  - GT_拾穗
  - KC_KingComments
  source_files:
  - ccbiblestudy_GT_exodus_7.txt
  - kingcomments_exodus_7.txt
- title: 法老
  path: link_folder/人物/法老.md
  summary: |
    第3-4節神預告「我要使法老的心剛硬……但法老必不聽你們」；第11節他召博士和術士以邪術對抗；第13、22節兩次「法老心裡剛硬，不肯聽從摩西、亞倫，正如耶和華所說的」；第23節「法老轉身進宮，也不把這事放在心上」。
  relation: |
    GT 李道生指出頭兩次（4:21；7:3）是出於神的預言，其後才是神任憑法老自己先剛硬。CT 讀第23節讀得很冷：法老「故意不觀看災情，轉身背向河水，返回宮殿」，「裝作毫不在意的樣子」，而他對自己百姓的苦難（v24）根本無動於衷。CT 另記下一條猶太解經傳統的註腳：「在猶大解經集有加註法老的評語說『你們難不倒我，沒有水喝我有酒』。」GT《舊約背景註釋》則說第13節「是第二次提到法老剛硬的心，反映出他一意孤行自己所選擇的道路」；GT 丁良才更點出他的選擇：「法老信他虛假的術士，不肯信服神忠心的僕人」（賽5:20）。
  sources:
  - CT_註解
  - GT_拾穗
  source_files:
  - ccbiblestudy_CT_exodus_7.txt
  - ccbiblestudy_GT_exodus_7.txt
- title: 埃及
  path: link_folder/地點/埃及.md
  summary: |
    第3-5節神宣告要在埃及地多行神蹟奇事、伸手重重刑罰埃及；第19節第一災的範圍是「埃及所有的水」——江、河、池、塘，以及木器石器；第21節「埃及遍地都有了血」。
  relation: |
    GT《啟導本聖經腳註》從宗教的角度說明神為何這樣打：「埃及拜偶像之風甚盛，大小神像遍地，牛、羊、蛇與青蛙，都在敬拜之列」，因此十災「是對埃及的大小菩薩來一次大掃除」；而降災的目的只有一個——「就是要埃及人知道祂才是唯一的真神」（v5）。GT《舊約背景註釋》則注意到第19節的用字：希伯來原文其實沒有提到「器皿」，「樹枝、石頭」在烏加列文獻中連用時是指偏遠的不毛地帶，而經文中的「河」是指人工開鑿供灌溉的水道；GT《中文聖經註釋》也採同一讀法——大概原意是指連樹木吸取的地下水與石隙中瀝出來的泉水都有了血。
  sources:
  - GT_拾穗
  source_files:
  - ccbiblestudy_GT_exodus_7.txt
- title: 尼羅河
  path: link_folder/地點/尼羅河.md
  summary: |
    第15節法老清早「出來往水邊去」，摩西奉命在河邊迎接他；第17-21節亞倫舉杖擊打河水，河水變血、魚死、河腥臭；第24節「埃及人都在河的兩邊挖地，要得水喝」。
  relation: |
    GT 丁良才與《串珠聖經註釋》都推測法老清早到河邊是去主持祭河神的儀式——「埃及人以尼羅河為神，大概法老王常在河邊祭神」；GT《啟導本聖經腳註》說此時已屆春泛期，法老可能去主持祭祀大河的儀式。GT《中文聖經註釋》指出這也是宗教問題：「埃及人主要的用水，是取自尼羅河的。因此他們對河神存感恩的心」，每年氾濫時要舉行感恩祭神大典而王帝是主持人——「這正是給摩西宣告關乎埃及人飲食大事的最好機會」。至於挖地求水，丁良才補一句實情：「在尼羅河邊，人到處能挖地得水，但那水有硝酸的苦味，因此難喝」；GT《舊約背景註釋》則說他們「可能是試圖找到經沙土濾過的水」。
  sources:
  - GT_拾穗
  source_files:
  - ccbiblestudy_GT_exodus_7.txt
- title: 容我的百姓去
  path: link_folder/神學/容我的百姓去.md
  summary: |
    第2節神吩咐亞倫對法老說「容以色列人出他的地」；第16節摩西在河邊向法老重申：「耶和華希伯來人的神打發我來見你，說：容我的百姓去，好在曠野事奉我。到如今你還是不聽。」
  relation: |
    這是 GT 丁良才所數七次「容我的百姓去」中的第二次（5:1；7:16；8:1、20；9:1、13；10:3）。CT 指出第16節是重申上一次的要求，而「事奉」與5:1、3的「守節、祭祀」同義；「到如今你還是不聽」則是責怪法老心裡剛硬。GT《中文聖經註釋》從這句話讀出時間感：它「表明摩西下埃及後，已經有一段時間了」。KC 則指出這道要求的性質——神在此宣告祂對百姓的權利：祂要他們事奉祂，而不是事奉法老。
  sources:
  - CT_註解
  - GT_拾穗
  - KC_KingComments
  source_files:
  - ccbiblestudy_CT_exodus_7.txt
  - ccbiblestudy_GT_exodus_7.txt
  - kingcomments_exodus_7.txt
- title: 以色列人的軍隊
  path: link_folder/神學/以色列人的軍隊.md
  summary: |
    第4節神稱以色列民為「我的軍隊」：「我要伸手重重的刑罰埃及，將我的軍隊以色列民從埃及地領出來。」
  relation: |
    這是6:26「按著他們的軍隊」的延續。GT《串珠聖經註釋》說這是「指以色列人要像軍隊般排列整齊大步踏出埃及」；GT《聖經精讀本》說得更完整：指出埃及時以色列民族按各支派形成了軍事化裝備的狀態（6:26；12:51；13:18），「而且日後他們要為神而戰，他們的確是神的軍隊」。CT 則在〔話中之光〕把它接到新約：以色列民既是耶和華的軍隊，新約的信徒也屬於「神的軍隊」，「我們活在這地上（世界），乃是要為神打屬靈的仗」——並補一句次序：「我們必須從世界（埃及地）裡出來，脫離魔鬼（法老）的轄制，才能為神爭戰。」
  sources:
  - CT_註解
  - GT_拾穗
  source_files:
  - ccbiblestudy_CT_exodus_7.txt
  - ccbiblestudy_GT_exodus_7.txt
- title: 耶和華的話臨到
  path: link_folder/神學/耶和華的話臨到.md
  summary: |
    本章是「耶和華對摩西說」的又一密集段：第1節、第8節（同時對摩西和亞倫）、第14節、第19節神四次開口，每一次都直接推動事件；第2節更定下規矩：「凡我所吩咐你的，你都要說。」
  relation: |
    GT《中文聖經註釋》指出第8節的特別之處：「神的話不單是對摩西說，同時也是對亞倫說的」。第2節的要求，同一份注釋說得很簡單：「先知當然要將神所吩咐的一切話，不折不扣的說出來。」CT 則把它立成三條原則：基督徒說話的原則是「凡神所吩咐我們的，我們都要照樣地說」；「神所明白宣示的話，人不可擅自加添或刪減」（啟22:18-19）；「傳話必須準確；傳道人必須按著正意分解真理的道」（提後2:15）。而第6節的回應是全章的樞紐——「耶和華怎樣吩咐他們，他們就照樣行了」，GT 丁良才說這句話涵蓋了從本章第8節到第10章29節的整段歷史：摩西亞倫「完全聽從了耶和華一切的吩咐」（來3:5）。
  sources:
  - CT_註解
  - GT_拾穗
  source_files:
  - ccbiblestudy_CT_exodus_7.txt
  - ccbiblestudy_GT_exodus_7.txt
- title: 以色列
  path: link_folder/原文/以色列.md
  summary: |
    本章的以色列人沒有出場說一句話，卻是整章交涉的標的：第2節「容以色列人出他的地」、第4節「我的軍隊以色列民」、第5節「將以色列人從他們中間領出來」、第16節「容我的百姓去」。
  relation: |
    GT《啟導本聖經腳註》點出這一章的雙面性：「神的作為對以色列的敵人是刑罰，對以色列人是拯救」。第5節的「知道」也有兩面——GT《中文聖經註釋》指出6:7說以色列人會因神救他們出埃及而知道誰是耶和華，本章第5節則說神要藉「伸手攻擊埃及」而使埃及人知道；GT 丁良才把這兩條路並在一起：埃及人因受了十災「就必知道以色列人因恩典所知道的」，「將來不論何人，總得認識耶和華，不是因主的恩典，必是因主的威嚴」（腓2:10-11）。CT 另指出神稱他們為「我的軍隊」，是「視以色列百姓是祂在地上的軍隊，要將他們有秩有序地從埃及地帶領出來」。
  sources:
  - CT_註解
  - GT_拾穗
  source_files:
  - ccbiblestudy_CT_exodus_7.txt
  - ccbiblestudy_GT_exodus_7.txt
- title: 希伯來人的神
  path: link_folder/神學/希伯來人的神.md
  summary: |
    第16節摩西在尼羅河邊對法老說的第一句話就是這個名：「耶和華希伯來人的神打發我來見你。」這是5:3之後第二次以這個稱謂向法老說話。
  relation: |
    CT 指出「耶和華希伯來人的神」與5:1、3的「耶和華以色列人的神」同義，可以互相換用，而「希伯來人」的原文字義是「過河的人，來自遠處的人」。GT 丁良才則說明為何在法老面前用這個稱呼：「摩西頭一次見法老的時候，法老假裝不知道耶和華是誰，所以神使摩西說明耶和華是誰」——換言之，這個名字是為了回應5:2那句「耶和華是誰？我不認識耶和華」。同一節緊接著的「到如今你還是不聽」，GT《中文聖經註釋》說它「表明摩西下埃及後，已經有一段時間了」。
  sources:
  - CT_註解
