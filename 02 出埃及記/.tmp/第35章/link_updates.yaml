updates:
- title: 亞何利亞伯（Oholiab）
  path: link_folder/人物/亞何利亞伯（Oholiab）.md
  summary: 出35:34-35 耶和華使比撒列和但支派中亞希撒抹的兒子亞何利亞伯「心裡靈明，能教導人」，使他們的心滿有智慧，能做雕刻、巧匠、繡花（藍紫朱紅線和細麻）、機匠等各樣的工。GT 引丁良才分工細節：雕刻的工是比撒列所做之工的總稱，巧匠的工（幔子、內幔、以弗得、胸牌）、繡花的工（門簾、腰帶）、機匠的工（單色布幔、內袍）則多屬亞何利亞伯所轄。
  relation: 本章在出31:6 的基礎上增添「能教導人」的職分——兩位工頭不只自己做工，更要將神所賜的技藝傳授眾工匠，使全體奉獻的智慧人都能各按其分參與聖工。
- title: 以弗得
  path: link_folder/原文/以弗得.md
  summary: 出35:9,27 紅瑪瑙與別樣的寶石可以鑲嵌在以弗得和胸牌上；眾官長把寶石都拿了來。GT 引丁良才：這些官長或是百姓的長老，或是十二支派的首領。
  relation: 本章交代以弗得寶石的來源——眾官長的奉獻；居高位者獻上最貴重之物，與平民的紡線、金環各按所有，同成聖工。
- title: 但支派
  path: link_folder/人物/但支派.md
  summary: 出35:34 亞何利亞伯出自但支派，與猶大支派的比撒列同蒙選召、心裡靈明能教導人。
  relation: 本章重申出31:6 的配搭；領導支派（猶大）與非領導支派（但）的工匠同工建造會幕，見證神恩典的包容性。
- title: 出35-40 逐字複述出25-31
  path: link_folder/主題/出35-40 逐字複述出25-31.md
  summary: 出35:1「這是耶和華所吩咐的話，叫你們照著行」開啟出埃及記最後六章。GT《啟導本聖經腳註》指出這六章「大半為逐字逐句的複述，只不過把動詞從未來式改為過去式」，並以出26:1／36:8 為例。GT《丁道爾聖經註釋》否定「意外重複」之說：「這是不可能的，因為還有一些重要資料加插在內……重複若然存在，也都是故意的，所點出的教訓是摩西忠心實踐神的指示」，並指出經文用兩個方法標示這點——機械化複述，以及七次重述「是照耶和華所吩咐摩西的」（出39:1、5、7、21、26、29、31），出40 另有一組七重句子。同一來源提醒「七十士譯本和馬索拉經文之間歧異之處，這幾章比出埃及記任何地方都多」。KC：「神重複一件事的時候，就更清楚地顯出祂看這件事有多重要。」
  relation: 本章是這段重述的起點，而它的性質從第1節就定了：摩西所說的不是自己的計畫，而是「耶和華所吩咐的話」。GT《串珠聖經註釋》指出後六章的編排其實比前七章更有系統（例如香壇在出37:25-28 才與其他器具合併記述）——複述並非機械照抄。KC 更把這六章的存在本身讀成恩典：出32-34 的罪「並沒有取消、甚至沒有減少神的恩典」，會幕仍然臨到一群跌倒過的百姓中間。
- title: 婦女參與建造會幕
  path: link_folder/主題/婦女參與建造會幕.md
  summary: 出35:25-26「凡心中有智慧的婦女親手紡線，把所紡的藍色、紫色、朱紅色線和細麻，都拿了來」「凡有智慧、心裡受感的婦女就紡山羊毛」。GT 丁良才從當時的分工說明她們為何做這一項：「在埃及國女人多紡線，染布，男人多織布，繡花。」GT《聖經精讀本》指出用在她們身上的是同一個字：「『智慧的』一詞的希伯來文與10節中的『智慧』是同一個意思。當時的女人不記在家譜裡，但神賜給她們和男人同等的恩賜，使她們也能作神的工作」，並以路8:2-3、羅12:6-8、羅16:1 為新約的延續。CT 指出「有智慧的婦女」意即「具有才幹能製作會幕和聖衣所需的材料」，紡的線是織造幔子與聖衣的材料，山羊毛則用於織造罩棚的幔子（參出26:7）。BH 指出「skilled」一詞表示她們不只有經驗，更是在這門手藝上蒙了恩賜，與比撒列、亞何利亞伯所受的是同一種賦予。
  relation: 本章的奉獻名單刻意寫成跨階層的：男女都獻金器（22節）、婦女紡線（25-26節）、眾官長獻寶石（27節）。GT《串珠聖經註釋》指出這份名單「證明會幕的完成，每一個人的參與都是重要的」；GT《丁道爾聖經註釋》也說「人人都有分為耶和華建造聖所，若不是各盡其職，工作也不能完成（參弗4:16）」。KC 說得更正面：「女人完全有分於為會幕作的工。她們有男人所沒有的特別資質。她們也常常對什麼合乎神的心意有更好的感覺」，並舉馬利亞膏主耶穌的腳（約12:3）與主為此所給的特別題說（太26:13）為例。CT 的應用是：「神看重每一顆事奉的心，不分男女。」
- title: 安息日
  path: link_folder/神學/安息日.md
  summary: 出35:1-3 摩西招聚全會眾，在宣布會幕建造之前先重申安息日：六日做工，第七日守為安息聖日，干犯者治死；並補充獨特禁令「當安息日，不可在你們一切的住處生火」。GT 引丁道爾：此禁令舊約僅見此處，可能針對建造聖所金工所用的火而發；正統猶太教至今視點火為安息日禁止的「工作」。丁道爾並指出安息日律法在出31章位居該段結尾、在本章位居開頭，是故意的安排——百姓即使捲入建造帳幕的熱潮，仍不可稍忘守聖日。
  relation: 本章開頭重提安息日十分合宜（串珠）：神剛與百姓重新立約（出34章），而安息日正是約的標記（出31:16）；聖工的熱心不得逾越神所設的安息界線。
- title: 安息日不可生火
  path: link_folder/解經爭議/安息日不可生火.md
  summary: 出35:3「當安息日，不可在你們一切的住處生火」——GT《串珠聖經註釋》指出「這條例很獨特，沒有在舊約別處出現」。三種解法並存：CT 與《啟導本聖經腳註》以出16:23 為據，認為指的是烹煮三餐的火；GT《丁道爾聖經注釋》記下海厄特的提議，認為「這條禁令針對的，可能是建造聖所金工所用的火」，而《串珠》把這一層說到底——「甚至為建造會幕生火化金屬，在該日也不容許」；GT《聖經精讀本》則主張重點在態度：「可能這是為了讓人不是消極地照字面意思遵守安息日，而是能夠積極的、發自內心地遵守。」GT《舊約聖經背景註釋》與《中文聖經註釋》另記下後世猶太教的執行方式。
  relation: 這條禁令的位置本身就是解釋：它緊接在會幕建造清單之前。若海厄特與《串珠》的讀法成立，本節等於預先擋住一個很有說服力的例外——為神造會幕也不能在安息日動火。CT 在同章的評語是：「因為不守安息的人，就抵觸了神的『聖』。」
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出35:1,4,10,29 摩西招聚全會眾宣告「這是耶和華所吩咐的話，叫你們照著行」，呼召心裡有智慧的都要來做「耶和華一切所吩咐的」，百姓也將禮物拿來做「耶和華藉摩西所吩咐的一切工」。GT 引丁道爾：出35-39章幾乎逐字複述出25-31章的材料，所點出的教訓是摩西忠心實踐神的指示（出25:9），並以七次重述「是照耶和華所吩咐摩西的」加以強調。
  relation: 本章開啟「山上樣式」由啟示轉入執行的階段——建造不憑巧匠的創意，乃照神在山上所指示的樣式；KC 指出神賜創意卻不將運用之權留給人自定，凡所設計必須源於神的靈。
- title: 心裡有智慧
  path: link_folder/原文/心裡有智慧.md
  summary: 出35:10、25、35 三次以「心裡有智慧」作為參與會幕建造的條件。CT 的〔原文字義〕給「有智慧」為「智慧的，精明的，有技巧的」，指「一切能夠製作會幕和附屬器具的工匠」；GT《丁道爾聖經注釋》指出這是譯法差異——「英譯多作『能幹』；和合本直譯作『心裡有智慧』」；GT《聖經精讀本》指出第25節用在婦女身上的是同一個希伯來字，「當時的女人不記在家譜裡，但神賜給她們和男人同等的恩賜」。GT 丁良才把本章的人分成三等：凡心裡樂意獻的、凡心裡有智慧的、凡心裡受感的，並指出「眾人都能獻禮物，唯獨有智慧的才能做神所吩咐的工，但這話也包括紡線的婦女」。
  relation: 本章把奉獻與作工分成兩個門檻：材料人人可獻，工卻要「心裡有智慧」的人才能作。但第31、35節立刻把這個門檻接回源頭——智慧是神的靈充滿的結果。CT 據此指出：「神呼召有恩賜的人，用他們的恩賜事奉他，但絕對不是靠他們的恩賜，乃是靠著『神的靈充滿』。」這使本章的分工既有標準，又不成為誇口的理由。
- title: 戶珥
  path: link_folder/人物/戶珥.md
  summary: 出35:30 摩西宣告比撒列的家系：猶大支派中戶珥的孫子、烏利的兒子。CT 指出聖經提特定人物時附帶父祖名字以免同名混淆。
  relation: 戶珥之名隨其孫比撒列的就任再次出現，其家系（代上2:19-20 迦勒—戶珥—烏利—比撒列）與會幕建造正式相連。
- title: 施恩座
  path: link_folder/主題/施恩座.md
  summary: 出35:12 建造清單列出「櫃和櫃的槓，施恩座和遮掩櫃的幔子」。KC 補充「遮掩櫃的幔子」即民4:5 所說的幔子——起營時亞倫和他兒子要取下這幔子蓋在法櫃上。
  relation: 施恩座隨約櫃列入本章公告的製作清單之首，居至聖所器具之先，反映其在會幕中的中心地位。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 出35:4-19 摩西向全會眾傳達建造會幕的材料清單（金銀銅、紡線、皮料、皂莢木、油、香料、寶石）與零件清單（帳幕和罩棚、蓋、鉤子、板、閂、柱子、帶卯的座，直到院子的橛子繩子與祭司聖衣），百姓奉獻材料用以做會幕和其中一切的使用（21節）。KC 指出金牛犢之罪並未使神收回或縮減祂的恩典——會幕如今臨到一個跌倒的百姓中間，神照樣成就祂的旨意。
  relation: 本章是會幕由「山上樣式的啟示」（出25-31）轉入「實際建造」（出36-40）的樞紐：摩西忠心轉述（來3:5-6 摩西在神的全家盡忠、基督卻治理神的家），百姓以奉獻與技藝回應。
- title: 橛子與繩子的預表
  path: link_folder/神學/橛子與繩子的預表.md
  summary: 出35:18 建造清單列出「帳幕的橛子並院子的橛子，和這兩處的繩子」。CT 的〔原文字義〕給「橛子」為「樁，掛釘，針」、「繩子」為「繩索，弓弦」，並解為「『橛子』指支搭帳幕和院子的一切橛子；『繩子』指連結幕板和柱子的繩子」。GT 丁良才進一步分辨：「『帳幕的橛子』就是罩棚的橛子；『這兩處的繩子』就是罩棚和院子的繩子。」GT《聖經精讀本》把三者的功能分開：「帳幕的橛子：起固定會幕的作用。院子的橛子：起支撐帷子的作用。繩子：起連接帳幕和帷子的作用。」BH 指出這些橛子多半是銅的（參出27:19），在曠野的環境中負責穩住整個結構。
  relation: CT 在本節的話中之光寫下全章最長的一段默想，而它的起點只是清單上一個不起眼的項目：「會幕中的器具人所共見，惟有橛子人看不見深埋地中，卻擔起支持會幕之工作。世人均想坐首席，做領袖，居高位指揮別人，少有人甘心隱藏。橛子為高舉基督，卻願意埋藏自己。」它連橛子的形狀都讀出意思：「橛子的形式是一面尖，一面禿……橛子禿之方面，可最受重擊，在教會中不論你做事快或慢，言論大或小，均會招來弟兄之指摘攻擊，但屬主的人卻如橛子般，堪經重擊。」繩子則另有一層：「會幕院子的銅柱，每根用兩條繩子來固定，一條在院裡，一條在院外。這些繩子好像是向神雙份的大愛」——而 CT 隨即指出今天缺的是哪一半：「許多人受復活的基督吸引是因為他的榮耀與權能……可是很少有人受吸引去尋求在基督的受苦與降卑上與他聯合」（腓3:10；彼前2:21）。
- title: 比撒列（Bezalel）
  path: link_folder/人物/比撒列（Bezalel）.md
  summary: 出35:30-33 摩西向以色列人正式宣告：耶和華已提名召猶大支派中戶珥的孫子、烏利的兒子比撒列，以神的靈充滿他，使他有智慧、聰明、知識能做各樣的工——想出巧工、用金銀銅製造各物、刻寶石鑲嵌、雕刻木頭。GT 指出摩西早知神以主權揀選了比撒列（出31:1-11），此處只是向會眾傳達神的主權；神根據自己的預知呼召人（徒9:15），且從不後悔（羅11:29）。
  relation: 出31章是神在山上對摩西說、本章是摩西向會眾公告——同一選召的兩個場景；本章並補充「心裡靈明，能教導人」（34節），比撒列由受召者成為教導者，開始實際帶領全體工匠。
- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  summary: 出35:30 摩西向會眾宣告神已提名召猶大支派中戶珥的孫子、烏利的兒子比撒列作會幕工程的工頭。
  relation: 承接出31:2 的選召，本章是此選召向全會眾的公告場景，猶大支派的比撒列正式就任並開始教導眾工匠。
- title: 甘心樂意的奉獻
  path: link_folder/神學/甘心樂意的奉獻.md
  summary: 出35:4-9,20-29 摩西呼籲「凡樂意獻的可以拿耶和華的禮物來」，全會眾回應：凡心裡受感和甘心樂意的，連男帶女，將金器（胸前針、耳環、戒指、手釧）、各色紡線、皮料、皂莢木、銀銅、寶石、香料都拿了來；有智慧的婦女親手紡線，眾官長獻上寶石。GT 引丁良才歸納百姓的捐法六層：甘心樂意、按著所有、人人都捐、豐豐富富、足夠有餘、獻給真神；並指出本段有三等人——凡心裡樂意獻的、凡心裡有智慧的、凡心裡受感的。
  relation: 本章是「甘心樂意」語彙最密集的一章（5,21,22,26,29節五現）；KC 對照出32:3 同樣的金環曾獻給金牛犢——獻給世界的已然失落，如今百姓將剩餘的獻給神，構成奉獻對象的強烈對比。
- title: 皂莢木
  path: link_folder/原文/皂莢木.md
  summary: 出35:7,24 皂莢木列於奉獻材料清單，凡有皂莢木可做什麼使用的百姓也都拿了來。GT 引串珠：皂莢木盛產於西乃半島，質堅耐用。
  relation: 本章顯明皂莢木的來源——百姓甘心樂意的奉獻；此木在曠野隨處可得，卻因奉獻歸聖而成為會幕器具的骨幹。
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 出35章重啟會幕建造，KC 指出這顯明出32-34章人的罪並未取消或縮減神的恩典——神照樣成就祂的旨意，會幕如今臨到一個跌倒過的百姓中間，神仍要住在他們中間。
  relation: 本章以行動印證34章立約恢復的同在應許：百姓甘心樂意奉獻、巧匠受靈充滿動工，神居所的建造正式展開，同在由應許進入具體的居所預備。
- title: 胸牌（決斷胸牌）
  path: link_folder/原文/胸牌（決斷胸牌）.md
  summary: 出35:9,27 寶石鑲嵌在以弗得和胸牌上，由眾官長奉獻。
  relation: 胸牌寶石由眾官長供應，十二支派的名字將刻在其上（出28:21），首領們的奉獻與所代表的支派相稱。
- title: 蒙靈充滿的智慧恩賜（比撒列、亞何利亞伯）
  path: link_folder/神學/蒙靈充滿的智慧恩賜（比撒列、亞何利亞伯）.md
  summary: 出35:31,34-35 摩西向會眾宣告神以祂的靈充滿比撒列，使他有智慧、聰明、知識能做各樣的工，又使他和亞何利亞伯心裡靈明能教導人，使他們的心滿有智慧能做各樣的工。KC 指出神賜創意，卻不將如何運用創意留給人自行決定——所設計的必須源於神的靈，不在乎合人的口味，乃在乎合神自己；正如日後聖殿的樣式由大衛從神領受交給所羅門（代上28:11-12），教會的聚集也有主明確的引導（林前11:23、14:37）。
  relation: 本章將出31章的恩賜宣告落實到會眾層面，並擴及有智慧的婦女（25-26節）——聖靈的恩賜不分男女、不分名匠與無名工人，全體各按恩賜參與神居所的建造。
- title: 陳設餅桌子
  path: link_folder/主題/陳設餅桌子.md
  summary: 出35:13 建造清單列出「桌子和桌子的槓與桌子的一切器具，並陳設餅」。
  relation: 陳設餅桌子列入本章向會眾公告的製作清單，屬聖所器具之一；KC 靈意指做桌子的代表維繫信徒相交，使神得著祂的喜悅與糧食。
- title: 全會眾
  path: link_folder/人物/全會眾.md
  summary: 出35:1,4,20 三次出現「以色列全會眾」，本章的每一個轉折都以這個群體為單位——摩西招聚他們、對他們宣告、他們從摩西面前退去。CT 把這個詞的內涵展開：「『以色列全會眾』指全體以色列人中能承擔神所託付責任的人，殉道者司提反稱他們為『曠野的會』（參徒7:38），可見他們是一群蒙神救贖並呼召，從世界（埃及所豫表的）裏出來，成為『曠野的會』，身負神使命不斷前行，又建造會幕的人。」GT《聖經精讀本》給的是同一個對照：「全會眾：也叫曠野教會（徒7:38）。因為以色列百姓是神揀選的，並且是從外邦人中分別出來的群體。」BH 指出這場招聚凸顯了他們與神立約關係的群體性，並把它與新約教會的聚集相連（來10:25）。
  relation: 本章是全會眾第一次以「建造者」的身分被招聚：出19 他們在山下發顫，出24 他們應允立約，出32 他們聚集向亞倫要神像——同一個群體，這一次聚集是為了聽見會幕的樣式並動手。GT 丁良才指出摩西前次下山並沒有把造會幕的事述說給他們，「因為他們造金牛犢，干犯了主的烈怒」；本章的招聚因此是一次遲來的宣告，也是關係恢復的證據。
- title: 以色列人的官長
  path: link_folder/人物/以色列人的官長.md
  summary: 出35:27「眾官長把紅瑪瑙和別樣的寶石，可以鑲嵌在以弗得與胸牌上的，都拿了來。」GT 丁良才記下兩種身分推測：「有人以為這些官長是百姓的長老（出3:16，4:29，24:9），也有人以為是十二支派的首領（民1:16，7:2）。」CT 指出他們所獻的是全章最貴重的一項：紅瑪瑙用於鑲嵌在以弗得的肩帶上，別樣的寶石即十二樣寶石，用於鑲嵌在胸牌上。GT《丁道爾聖經註釋》把這件事放進整章的分工裡：「女人可以紡線（箴31:13），官長比較富有，可以帶來寶石和香料。人人都有分為耶和華建造聖所，若不是各盡其職，工作也不能完成（參弗4:16）。」
  relation: 本章的奉獻名單是刻意跨階層的：男女都獻金器（22節）、婦女紡線（25-26節）、眾官長獻寶石（27節）。GT《串珠聖經註釋》指出這份名單「包括不同階層的以色列人，例如婦女及官長；這證明會幕的完成，每一個人的參與都是重要的」。官長所獻的寶石日後要刻上十二支派的名字掛在大祭司胸前——他們奉獻的物件，正好對應他們所代表的支派。
- title: 安息日與會幕工程的關係
  path: link_folder/主題/安息日與會幕工程的關係.md
  summary: 出35:1-3 摩西向全會眾轉達神的話，第一件事不是會幕而是安息日。GT《丁道爾聖經註釋》指出這個位置是刻意的，而且與出31 恰好相反：「安息日的律法在此位於整個段落的開始，在第三十一章卻是該段落的結語。毫無疑問這是故意安排。若然，我們可以看出一個明顯的結論：以色列縱然捲在建造帳幕的熱潮中，仍然不可稍忘守這聖日。」GT《串珠聖經註釋》給的是約的理由：「這裡再提安息日是十分適合的，因神已重新訂約，而安息日就是約的標記（出31:16）。」GT《聖經精讀本》給的是位階的理由：「因為安息日概括代表所有立約內容，是百姓應遵守的最基本的條例，所以摩西在這裡先提到了安息日。」丁良才說得最實際：「百姓興工造會幕以先，摩西提醒他們，就是在造會幕的工作上也必須守安息日。」
  relation: 出31 把安息日放在會幕指示的結尾，出35 把它放在會幕清單的開頭——同一條律法，一前一後把整段工程夾住。而本章新增的不可生火之禁令使這個界線更硬：GT《串珠聖經註釋》指出「這裡禁止生火，甚至為建造會幕生火化金屬，在該日也不容許」。聖工不能凌駕聖日，這是本章開場就立下的規矩。
- title: 古代近東安息日
  path: link_folder/背景/古代近東安息日.md
  summary: 出35:2-3 重申安息日誡命並加上不可生火的禁令。GT《舊約聖經背景註釋》把這條禁令的後續發展記了下來：「本節重複三十一章15節禁戒在安息日做任何工作的命令，並且進一步禁止在安息日生火。這是安息日不得執行何種工作之主題的延伸（見出34:21）。後世猶太教拉比律法的判決，規定必須在安息日之前點燈，免得房屋陷於黑暗。但在安息日時卻不可為這火加添燃料。」GT《中文聖經註釋》描述這條例在今日的實況：正統的以色列人家中在安息日不生火，「連接亮電燈都算為違犯安息日的例」，會堂崇拜也不收奉獻，因為安息日不能沾銀錢或紙幣，而電器用具「多數都安裝有自動開關或計時開關」。
  relation: 「凡這日之內作工的，必把他治死」這樣的刑度何以可行，GT《聖經精讀本》從政體給出答案：「由於當時的以色列是政治、宗教一體化的神政國家，所以完全可能做到這一點。即宗教法具有政治性和制裁力度。」這一節因此同時記錄了兩件事：安息日在古代以色列的法律地位，以及這條律法如何在後世發展成一整套細則。
