- name: 安息日與會幕工程的關係
  suggested_type: 主題
  evidence: 出35:1-3 摩西向全會眾轉達神的話，第一件事不是會幕而是安息日。GT《丁道爾聖經註釋》指出這個位置是刻意的：「安息日的律法在此位於整個段落的開始，在第三十一章卻是該段落的結語。毫無疑問這是故意安排。若然，我們可以看出一個明顯的結論：以色列縱然捲在建造帳幕的熱潮中，仍然不可稍忘守這聖日。」GT《串珠聖經註釋》從約的角度說明為何在此重提：「這裡再提安息日是十分適合的，因神已重新訂約，而安息日就是約的標記（31:16）。」GT《聖經精讀本》給的理由是位階：「因為安息日概括代表所有立約內容，是百姓應遵守的最基本的條例，所以摩西在這裡先提到了安息日。」CT
    的說法一致：安息日「乃是『摩西之約』的標誌」。而 GT《串珠》另指出這條禁令的實際涵蓋面：「這裡禁止生火，甚至為建造會幕生火化金屬，在該日也不容許」——聖工不能凌駕聖日。已有條目「安息日與會幕工程的關係」
