- name: 出35-40 逐字複述出25-31
  suggested_type: 主題
  evidence: 出35:1「這是耶和華所吩咐的話，叫你們照著行」開啟了出埃及記最後六章，而這六章與出25-31 的關係本身就是一個題目。GT《啟導本聖經腳註》描述得最具體：「自本章到四十38記述摩西和以色列人怎樣執行神在25到31章所頒的造約櫃、會幕等等的訓示。大半為逐字逐句的複述，只不過把動詞從未來式改為過去式，例如『你要用十幅幔子作帳幕』（26:1），現在改為『他們…用十幅幔子作帳幕』（36:8）。」GT《丁道爾聖經註釋》處理了學術上的質疑：「部分學者因此將之視作意外的重複。但這是不可能的，因為還有一些重要資料加插在內，材料也有些調動。重複若然存在，也都是故意的，所點出的教訓是摩西忠心實踐神的指示。」它並指出經文用兩個方法指明這教訓：「第一個是機械化地複述經文，第二個是七次重述『是照耶和華所吩咐摩西的』一語（出39:1、5、7、21、26、29、31）。經文兩度使用七重的句子（另參出40:19、21、23、25、27、29、32），保證我們不會忽略。」同一份來源另提醒一個文本學上的事實：「七十士譯本和馬索拉經文之間歧異之處，這幾章比出埃及記任何地方都多。」GT《串珠聖經註釋》指出後六章的編排其實更有系統，例如香壇在出30
    是單獨記述的，到出37:25-28 才「合理地與其他器具一起記載」。KC 從神那一邊給出理由：「神重複一件事的時候，就更清楚地顯出祂看這件事有多重要。」新建條目
