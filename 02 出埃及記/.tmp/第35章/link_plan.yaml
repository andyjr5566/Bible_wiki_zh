  evidence: 出35:27「眾官長把紅瑪瑙和別樣的寶石，可以鑲嵌在以弗得與胸牌上的，都拿了來。」GT 丁良才記下兩種身分推測：「有人以為這些官長是百姓的長老（出3:16，4:29，24:9），也有人以為是十二支派的首領（民1:16，7:2）。」CT
    指出他們所獻的是全章最貴重的一項：「『紅瑪瑙』用於鑲嵌在以弗得的肩帶上；『別樣的寶石』指十二樣寶石，用於鑲嵌在胸牌上。」GT《丁道爾聖經註釋》把這件事放進整章的分工裡：「女人可以紡線（箴31:13），官長比較富有，可以帶來寶石和香料。人人都有分為耶和華建造聖所，若不是各盡其職，工作也不能完成（參弗4:16）。」GT《串珠聖經註釋》同樣指出奉獻名單「包括不同階層的以色列人，例如婦女及官長；這證明會幕的完成，每一個人的參與都是重要的」。已有條目「以色列人的官長」
