- name: 安息日不可生火
  suggested_type: 解經爭議
  evidence: 出35:3「當安息日，不可在你們一切的住處生火。」GT《串珠聖經註釋》指出這條例的獨特性：「這條例很獨特，沒有在舊約別處出現；這裡禁止生火，甚至為建造會幕生火化金屬，在該日也不容許。」GT《丁道爾聖經注釋》同樣說「這個嚴格的禁令舊約其他地方並無記載」，並指出兩條線索：其一，出16:23
    要求嗎哪必須在前一晚煮好，「似乎亦暗示這條規例」；其二，「海厄特提出這條禁令針對的，可能是建造聖所金工所用的火」。CT 的解法較平實：「『在…住處生火』主要是指烹煮三餐所起的火，因此，在安息日所要吃的食物都要在前一天預先煮好。」GT《聖經精讀本》提出動機上的讀法：「可能這是為了讓人不是消極地照字面意思遵守安息日，而是能夠積極的、發自內心地遵守。」GT《舊約聖經背景註釋》記下後世的規範：「後世猶太教拉比律法的判決，規定必須在安息日之前點燈，免得房屋陷於黑暗。但在安息日時卻不可為這火加添燃料。」GT《中文聖經註釋》則描述至今的實況：「因這吩咐，直至今日，正統的以色列人家中在安息日是不生火的，連接亮電燈都算為違犯安息日的例。他們在安息日的會堂崇拜也不收奉獻的，因為他們在安息日是不能沾銀錢或紙幣的。」BH
    給出神學上的理由：禁止生火是要強調「完全的安息與對神的倚靠」。新建條目
