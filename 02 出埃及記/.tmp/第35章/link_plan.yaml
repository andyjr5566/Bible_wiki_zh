- name: 古代近東安息日
  suggested_type: 背景
  evidence: 出35:2-3 重申安息日誡命並加上不可生火的禁令。GT《舊約聖經背景註釋》把這條禁令的後續發展記了下來：「本節重複三十一章15節禁戒在安息日做任何工作的命令，並且進一步禁止在安息日生火。這是安息日不得執行何種工作之主題的延伸（見34:21）。後世猶太教拉比律法的判決，規定必須在安息日之前點燈，免得房屋陷於黑暗。但在安息日時卻不可為這火加添燃料。」GT《中文聖經註釋》描述這條例在今日的實況：正統的以色列人家中在安息日不生火，「連接亮電燈都算為違犯安息日的例」，會堂崇拜也不收奉獻，因為安息日不能沾銀錢或紙幣，而電器用具「多數都安裝有自動開關或計時開關」。GT《聖經精讀本》另指出當時執行死刑的可行性有其政體背景：「由於當時的以色列是政治、宗教一體化的神政國家，所以完全可能做到這一點。即宗教法具有政治性和制裁力度。」已有條目「古代近東安息日」
