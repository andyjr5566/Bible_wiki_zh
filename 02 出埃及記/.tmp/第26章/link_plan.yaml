  suggested_type: 解經爭議
  evidence: 出26:1、7 GT 引丁良才詳列會幕外觀的兩種復原方案——第一解法：帳幕（細麻幔）之上另有罩棚；第二解法：幔子與蓋子都直接蓋在豎板上。他舉七層證據主張第一解法合乎聖書（聖書明說帳幕以上有罩棚、兩層幔子兩層蓋子都蓋在豎板上會從中段沉下、雨水無法流下、按第二解法只能看見帳幕幔子的四分之一、山羊毛幔子垂下的長度與9、12-13節不合、第二解法用不著繩子橛子但出35:18有、第二解法會幕裡沒有祭司可住的地方但利8:33與撒上3:23說祭司能住在會幕裡）。丁良才在出26:14
    另記第三種折衷讀法：帳幕兩層（細麻幔＋海狗皮蓋）、罩棚兩層（山羊毛幔＋染紅公羊皮蓋）；GT《丁道爾》則對「第四層皮帳」存疑，認為「這似乎是太重而且多餘了」
