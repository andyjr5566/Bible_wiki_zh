- name: 面東定向的左右方位
  suggested_type: 背景
  evidence: 出26:18、20、22 帳幕的南北西三面。CT：「『南面』指帳幕入口的左邊」、「『北面』指帳幕入口的右邊」、「帳幕的前面，就是帳幕入口處，就是東面，朝日出的方向」。GT
    引丁良才：「以色列人面向日出的地方，就以右邊為南面……本句暗指帳幕必是坐西向東」。GT《中文聖經註釋》詳述整套方位語言：「在以色列人討論方向時，必以聖幕或聖殿的門為定位。幕門是開向東方的。面向東方時，稱右邊為南方，左邊為北方，後面為西方」，並指出原文18節的「南面」用了兩個字：「頭一個是
    negebah（向曠野），第二個是 teymanah（向右）」，又記七十士譯本在18節譯成北面、20節譯為南面。已有條目「面東定向的左右方位」（創13、創14
    累積）
  match_type: exact
  existing_title: 面東定向的左右方位
