name: 兩榫相對（榫卯接合）
type: 文化
secondary_types: []
aliases:
- 榫
- 榫卯
- 兩榫相對
- 卯
status: formal
definition: 每塊豎板下端伸出兩個凸起（榫），插進銀座上方的凹口（卯），使板能直立並彼此接合（出26:17、19）。GT《中文聖經註釋》說明這是古代通行的作法：「榫這是古代沒有釘子前的建築最常用的方式。榫頭或榫子，就是指木板中凸出的部分；榫眼是凹入的部分。凸凹相接合，便稱為對榫。」GT《精讀本》補上譯法上的線索：「榫：各塊板的下端突出的東西，和銀座一同起固定的作用。英語聖經中譯成突起（projection, NIV, TEV）。」CT 則把「相對」解為公母凹凸的配對：「『兩榫』一公一母，一凸一凹，以便將兩塊豎板緊密接合在一起；『相對』指公對母，凸對凹，兩兩相對」，並指出「豎板的尺寸和兩榫位置都要相同，如此，眾豎板可以緊密接合在一起」。BH：榫是木料端部的凸出、嵌入相應的卯眼構成堅固接頭，這種作法確保了一座既要便於搬運、又要穩固的建築所需的強度與耐久。
accumulations:
- book: 出埃及記
  chapter: 26
  summary: 出26:17「每塊必有兩榫相對。帳幕一切的板都要這樣做」；出26:19、21、25 每塊板下的兩個帶卯銀座「兩卯接這塊板上的兩榫」。GT《中文聖經註釋》指出榫卯是「古代沒有釘子前的建築最常用的方式」；GT《精讀本》記英譯作 projection（NIV、TEV）；CT 解「兩榫」為一公一母、一凸一凹，並強調眾板的尺寸與榫位都要相同才能緊密接合。BH：這種接合方式使結構既穩固又可拆卸。
  relation: 榫卯是本章「可拆可立」這件事在技術上的支點——會幕要能拆、能扛、能再立起來，靠的不是釘子，而是每塊板下兩個榫落進兩個銀座的卯裡。CT 的靈意讀法把它讀成信徒之間的配搭：「有兩榫相對，表徵信徒彼此配搭得合式」，並在話中之光引「兩個人總比一個人好，因為二人勞碌同得美好的果效」（傳4:9）與「若是你們中間有兩個人在地上，同心合意的求甚麼事，我在天上的父，必為他們成全」（太18:19）；他又說「『榫』似人腳，這是顯出信心的見證。信心把神的孩子堅定在神的應許之上」。技術上的凸凹相合，與神學上的「站立得穩」，在本章落在同一個零件上。
