book: 出埃及記
chapter: 26
updates:
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 本章是神同在的「外殼」規格書。內層十幅細麻彩色幔子繡著基路伯，KC 指出這一層本身就被稱為「帳幕」——「這正是神的居所」（26:6）。四層遮蓋由內而外越來越樸素：細麻彩幔、山羊毛罩棚、染紅的公羊皮、海狗皮頂蓋（26:1-14），而只有祭司在聖所裡藉著燈臺的光才看得見最裡面那層的華美。內幔將聖所與至聖所隔開，約櫃安在幔內（26:31-33），神的同在因此是「可親近卻有界限」的。全章以「要照著在山上指示你的樣式立起帳幕」（26:30）作結。
  relation: 承接出25章的器具，本章處理的是包裹神同在的結構本身。神同在的性質在這裡以建築表達出來：①越靠近神越華美——最外層是灰黑粗糙的海狗皮，最內層是繡著基路伯的彩色細麻，KC：「教會在世界眼中也沒有吸引力。你得先在其中，才看得見它的美」；②同在是有界限的——內幔上的基路伯把守通往寶座的路，除大祭司一年一次外無人可入，而 KC 指出這幔子正是主耶穌「身體」的圖畫（來10:20），祂死時幔子裂開，通往神的路才敞開；③同在是需要被「抬著走」的——整座帳幕由包金的豎板、銀座與閂組成，可拆可立，神的同在隨百姓行走曠野。
- title: 基路伯（施恩座）
  path: link_folder/主題/基路伯（施恩座）.md
  summary: 出26:1、31 內層十幅幕幔與內幔都要「用巧匠的手工繡上基路伯」。CT 在31節補足了基路伯的來歷與稱號：「『基路伯』是一種有長翅翼的活物，與撒拉弗相似的特別使者（參創3:24；王上6:23-28；結9:3），意即『那些被緊握著的』。聖經特別稱呼他們是『榮耀的基路伯』（來9:5），大概是因為他們特別與神相近，神的榮耀照射在他們身上，使他們返照而成為神榮耀的象徵。」CT 靈意：「巧匠的手工表徵聖靈的工作；繡表徵受苦的管教；基路伯表徵彰顯神的榮耀」；繡在內幔上則「表徵基督在人性裡披戴著榮耀的神性」。BH：基路伯是「與神同在相連的天使性存有」，把牠們織進幔子「標明這空間的聖潔」，並連回伊甸園守衛生命樹之路的基路伯（創3:24）與施恩座上的基路伯。
  relation: 本章把基路伯從「一對金像」擴成「整片織物上的形像」——出25章的基路伯是施恩座兩頭錘出的兩個，本章則繡滿十幅幕幔與內幔。KC 在這一點上點出牠們的職分：在幔子上的基路伯「彷彿確保神聖所中的事奉，是照著合乎神聖潔的方式進行」，「這些天使確保神的律法得著成全，也執行神的審判」（參創3:24）；到了內幔，「幔子後面是約櫃，神的寶座。基路伯把守通往寶座的路」。GT 引丁良才則從基路伯反推幔子的掛法：這幔子必是垂在豎板的裡面，因為「這幔子若垂在豎板之外，人就看不見那些基路伯了」，並以所羅門聖殿與以西結聖殿四面牆上都有能看見的基路伯為旁證（代下3:7；王上6:29；結41:18-20）。門簾上則沒有基路伯——GT 引丁良才：「門上沒有門閂，沒有基路伯（參創3:24），叫凡願意進去的人沒有什麼攔阻。」
- title: 施恩座
  path: link_folder/主題/施恩座.md
  summary: 出26:34 「又要把施恩座安在至聖所內的法櫃上。」CT 在此處補足了名稱與字根：施恩座「英文名叫『憐恤座或慈悲座』（Mercy Seat），希伯來原文字根有『遮蓋』的意思，因此，它是約櫃上面的一塊精金做的厚蓋板，具有『遮蓋罪或贖罪』的功用」。CT 靈意：「施恩座是神與人相會的地方（出25:22）；安在法櫃上表徵人唯有滿足律法的要求，才能來到神面前；全句表徵人唯有接受基督的救贖，靠祂滿足神公義的要求，才能坦然來到施恩的寶座前」（來4:14-16）。BH：施恩座「就是希伯來文 kapporet，是安在約櫃上的金蓋」，是神與摩西相會、宣告祂旨意的地方（出25:22），也是贖罪日大祭司彈血之處（利16:14-15），指向基督作我們的挽回祭（羅3:25）。
  relation: 本章是施恩座「就位」的一章：出25章造它，本章把它安在至聖所內的法櫃上。CT 的話中之光從這裡引到希伯來書，把幔子的裂開與施恩座連成一條線：「從前大祭司只能一年一次進到神面前，而我們現在可以隨時來到神面前。我們每回跪下禱告，即是跪在神的施恩寶座之前，為要蒙恩惠、得憐恤，作隨時的幫助。」施恩座在本章與內幔並列——一個是攔阻，一個是施恩；而 KC 指出那攔阻正是主耶穌的身體（來10:20），祂死時幔子裂開。
- title: 約櫃
  path: link_folder/主題/約櫃.md
  summary: 出26:33-34 「把法櫃抬進幔子內」；「又要把施恩座安在至聖所內的法櫃上」。CT：「『法櫃』指見證的約櫃；『抬進幔子內』指將法櫃放在至聖所內。」GT《啟導本》：「至聖所為約櫃存放的地方（出25:22；來9:3-4），代表天上神的所在（來9:23-26）。」GT 引丁良才記下一個搬運上的細節：內幔的金鉤「大概在至聖所那一面」，「所以祭司一摘下幔子，隨手就蓋在約櫃上（民4:5），掛幔子的時候，從約櫃上舉起，順手就可掛上，這樣，或懸掛，或摘下，就常有幔子作他們和約櫃中間的隔牆」（來9:7；出30:10；利16:34）。BH：法櫃是「會幕中最神聖的器物，內有十誡的石版」，放在幔子後面「標明它至高的聖潔與神在祂百姓中間的同在」。
  relation: 本章給了約櫃一個位置。出25章講的是它的規格與功用（神要在二基路伯中間與摩西相會），本章則把它「抬進幔子內」——從此約櫃有了一道帷幕擋在前面，而幔子上同樣繡著基路伯。KC 因此說：「幔子後面是約櫃，神的寶座。基路伯把守通往寶座的路。」CT 的靈意讀法：「法櫃置於至聖所內，表徵通神之路唯有藉著基督（約14:6）。」
- title: 陳設餅桌子
  path: link_folder/主題/陳設餅桌子.md
  summary: 出26:35 「把桌子安在幔子外帳幕的北面。」CT 說明方位是從入口算的：「『桌子』指陳列餅的桌子（參出25:30）；『幔子外』指聖所內（幔子裡面是至聖所）；『北面』人從會幕門口進去，面向至聖所，即指右邊。」GT《中文聖經註釋》：「這幔子外，就是聖所。聖所的北面放有陳設餅桌，南面則安放了金燈臺。」BH：桌子放在幔子外，「是祭司可以到、卻不在至聖所之內」；北面的位置「或許象徵穩固與供應」，也使聖所的陳設得著平衡與次序。
  relation: 本章給桌子定了位，而位置本身構成一組對照：桌子在北、燈臺在南，「彼此相對」。CT 讀這組對照：「桌子表徵基督是生命的糧（約6:51）」，「燈檯表徵基督是生命的光（約8:12）」，而「彼此相對」則「表徵生命的糧和光，彼此互增效用」。GT 引丁良才另指出燈臺在南、與桌子相對，「就占了尊貴的地位（出40:24）」。
- title: 金燈臺
  path: link_folder/主題/金燈臺.md
  summary: 出26:35 「把燈檯安在帳幕的南面，彼此相對。」CT：「『燈檯』指金燈檯（參出25:31、37）；『南面』即指左邊」（人從會幕門口進去、面向至聖所而言）。GT 引丁良才從位置讀出分量：「燈檯既被安在帳幕內的南邊，與桌子相對，就占了尊貴的地位（出40:24）。」GT《丁道爾》說明它在本章結構中的實際功用：帳幕「密不通風，除了金燈臺的燈光和祭司揭開帳門進出時放進來的短暫光線以外，亦十分幽暗。燈臺在『聖所』，幔子後面的至聖所則經常一片漆黑。」BH：燈臺放在桌子對面，為聖所提供光照，「是祭司執行職務所必需的」，並象徵神的同在與真理的照明（約8:12）。
  relation: 本章把燈臺放進一個具體的空間裡，而這個空間是暗的——它是聖所裡唯一的光源。這一點反過來成了本章第一段的關鍵：KC 說內層那些彩色的幔子，「只有祭司在聖所裡，藉著燈臺的光」才看得見；GT《串珠》同樣指出「祭司在會幕內，可藉著燈檯的亮光看見這些手藝」。燈臺不只是器具，它是使會幕最華美的一層被看見的條件。
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 出26:30 「要照著在山上指示你的樣式立起帳幕。」CT：「『山上』指西乃山上；『指示你的樣式』神在西乃山上當面指示摩西關於建造會幕和其中一切器具的樣式（參出25:9、40）」；靈意讀為「要照神所啟示的心意建造教會」。CT 的話中之光：「今天的教會，也要完全『照著』神所『指示』的『樣式』去建造，不得按任何人的主觀意識隨意為之」，並引提後1:13「你從我聽的那純正話語的規模（或譯『規範』），要用在基督耶穌裡的信心和愛心，常常守著」——「離開這個『規範』，教會就會走樣」。GT 引丁良才對「為何要一再交代」給了一個很樸素的理由：「無論神解得怎樣詳細，總有些地方人不能領會，所以神警教摩西，要留心在山上所指示他的樣式，十分照樣去做，俗語說，百聞不如一見。」BH：這樣式是神所賜的，「強調敬拜與親近神必須照祂的條件，不憑人的發明」。
  relation: 本章是「照山上樣式」這句話在出埃及記出現的第三次（出25:9、40 之後），而它出現的位置很關鍵——它不在某一件器具的規格之後，而在整組建築規格（幔子、罩棚、豎板、銀座、閂）講完之後，作為 v15-30 這一大段的結語。CT 在出25:9 統計這句話「在出埃及記中曾四次告訴摩西」（出25:9、40；26:30；27:8），本節正是其中之一。
- title: 皂莢木
  path: link_folder/原文/皂莢木.md
  summary: 出26:15、26、32、37 皂莢木在本章有四種用途：帳幕的豎板、三面的橫閂、內幔的四根柱子、門簾的五根柱子。CT 在15節記其產地與性質：「『皂莢木』是西乃半島所產的一種木材，材質堅硬，不易腐朽，用來製作支撐的木板和各種傢俱，是上乘的木料。」GT 引丁良才同記：「皂莢木是在西奈曠野長的，預表基督為人（賽53:2），包裹板的金子預表基督的神性神榮。」GT《丁道爾》另據約瑟夫記下一項尺寸：骨架「用皂莢木的圓杆造成（根據約瑟夫的記載，粗三英吋）」。BH：皂莢木「因其耐久與抗腐蝕而被選用，適合嚴酷的沙漠環境」，並與約櫃等聖物用的是同一種木料。
  relation: 本章是皂莢木用途最廣的一章——出25章它只用在器具（約櫃、桌子與抬槓），本章則從骨架（豎板、閂）一路用到掛幔子的柱子，會幕整個立體結構都由這一種曠野木材撐起來。CT 的話中之光把這件事讀成一個對比：「皂莢木堅硬帶刺，用處不大。照著我們人的本性，本來對於神沒有多大用處」；「皂莢木是外表無可看性，粗糙的樹。但神卻用它來做建造會幕的木材，這說明神的恩典屬於謙卑的人」（彼前5:5；賽57:15）。CT 靈意：「皂莢木表徵人性」，包上金子則「表徵眾信徒……都是人性包上神性」。
- title: 銀子
  path: link_folder/主題/銀子.md
  summary: 出26:19、21、25、32 銀座在帳幕結構中的分佈：豎板共九十六個（南北各四十、西面十六），內幔柱四個；門簾柱則改用銅座（v37）。KC 解釋每塊板為什麼是兩個座：「他們知道兩件事——就是那兩個座——是他們信心的根基：①神『因我們的過犯把主耶穌交付了』；②祂『因我們稱義把祂復活了』（羅4:25）。在那確據裡，他們在神面前站立得穩。」CT 靈意：「銀座表徵以救贖為根基；四十乃四乘十，表徵受造的人若蒙受救贖，就得以在神面前站立得穩。」GT 引丁良才另指出銀座把板與地面隔開的意義：信徒「與世界大有分別……正如這些板借著贖命銀與地隔開一般」。BH：銀常象徵救贖（出30:11-16 的贖罪銀），因此銀座是「一個以救贖為根基的地基」。
  relation: 本章把「贖價」做成了建築的地基——會幕不是直接立在曠野的沙土上，而是立在九十六個銀座上，而那銀出自贖命的價銀（出38:27）。銀在本章的位置也劃出一條界線：豎板與內幔柱立於銀座，門簾柱立於銅座（v37）——救贖是站立的根基，審判則在入口。
- title: 面東定向的左右方位
  path: link_folder/背景/面東定向的左右方位.md
  summary: 出26:18、20、22 三面豎板的方位敘述，全部建立在「面朝東」這套座標上。CT 註明「『南面』指帳幕入口的左邊」、「『北面』指帳幕入口的右邊」，並由此反推「帳幕的前面，就是帳幕入口處，就是東面，朝日出的方向」。GT 引丁良才：「以色列人面向日出的地方，就以右邊為南面……本句暗指帳幕必是坐西向東。」GT《中文聖經註釋》把整套語言寫全：「在以色列人討論方向時，必以聖幕或聖殿的門為定位。幕門是開向東方的。面向東方時，稱右邊為南方，左邊為北方，後面為西方」，並記下一個至今無解的原文問題——第18節的「南面」用了兩個字，「頭一個是 negebah（向曠野），第二個是 teymanah（向右）」，兩個都指南，「但為甚麼要重複地用兩個字？就至今仍無令人滿意的解答」；他又注意到「七十士譯本在18節繙成北面，而在20節卻譯為南面」。
  relation: 創13、創14 用這套慣例讀人物的動作（亞伯蘭讓地、追擊到大馬色左邊），本章則用它讀建築：會幕的門朝東，於是北在右、南在左、西在後——桌子在北、燈臺在南、至聖所在西，整套陳設的相對位置都靠這一組座標才站得住。GT《中文聖經註釋》還從 negebah（向曠野）這個字推出一個作者位置的線索：「頭一個字卻使人體會到作者是已在聖地，並以此地來述說方向，而不是身在西乃半島並從那裏來講說方向的。」
- title: 會幕材料的豫表
  path: link_folder/神學/會幕材料的豫表.md
  summary: 出26:1-14 把出25:3-7 的材料清單實際用了出去，四層遮蓋各用一種材料，而每一層都有讀法。KC 把內層四種材料對到四卷福音書：撚的細麻說到「在潔淨與純全中有力的服事」（馬可）、藍色「提醒我們祂是從天上來的人」（約翰）、紫色「顯出祂作人子的榮耀」（路加）、朱紅色「顯出祂作彌賽亞在地上的榮耀」（馬太）；山羊毛「說到與罪完全的分別」；公羊皮「說到對神的獻上」；海狗皮「不好看，卻經得起風吹雨打」。CT 逐項給靈意：細麻＝潔白聖潔（啟19:8）、藍色＝屬天（出24:10）、紫色＝君尊、朱紅色＝流血犧牲、山羊毛＝為贖罪而被剪除、染紅公羊皮＝為人擔罪流血捨命、海狗皮＝無佳形美容卻堅固耐苦、皂莢木＝人性、金＝神性、銀＝救贖、銅＝審判。
  relation: 出25章是材料的「清單」，本章是材料的「位置」——同一批東西被排進一個有次序的立體結構，而排法本身就構成一套讀法：銅在最外（罩棚的鉤、門簾柱的座）、銀在根基（九十六個銀座）、金在最裡（板、閂、金環、內幔柱）。人從東面進來先碰到銅，站得穩靠的是銀，越往裡走金越多。CT 讀「木包金」時把這道階梯收在信徒身上：「板要用金子包裹……表徵眾信徒無論其服事的崗位如何，都是人性包上神性。」
- title: 來10：19-20
  path: link_folder/互文/來10：19-20.md
  summary: 出26:31-33 內幔「要將聖所和至聖所隔開」，這是本章與來10:19-20 最直接的接點。KC：「在希伯來書10章我們讀到，這幔子是主耶穌『身體』的圖畫（來10:20），就是祂的位格，就是祂在地上行走的樣子。當祂死的時候，幔子裂開，通往神的路就敞開了。」CT 在31節靈意同樣說幔子「表徵基督的身體（來10:20）」，並在話中之光整段引來10:19-22：「我們既因耶穌的血，得以坦然進入至聖所，是藉著祂給我們開了一條又新又活的路從幔子經過，這幔子就是祂的身體。」GT 引丁良才：內幔「預表耶穌的身體（來10:20）」，祂死時「殿裡的幔子就從上到下裂為兩半（太27:51）」。BH：幔子裂開標誌這道屏障的挪去。
  relation: 出24 是「遠遠下拜」，利16 是「一年一次帶血進去」，本章則是那道幔子被造出來的一刻——來10:19-20 所說「從幔子這邊經過」的那幅幔子，規格就寫在出26:31-32。CT 的話中之光把前後對照講得最清楚：「主如果不死，幔子便不會裂開」；「從前大祭司只能一年一次進到神面前，而我們現在可以隨時來到神面前。」而 KC 補上一件本章獨有的細節：幔子上繡著基路伯，「基路伯把守通往寶座的路」——攔阻不只是布，還有把守者。
- title: 基督是門（約10：7）
  path: link_folder/互文/基督是門（約10：7）.md
  summary: 出26:36-37 帳幕的門簾是進入聖所的唯一入口。CT 靈意直接對到：「帳幕的門簾指會幕出入口的簾子，表徵基督是門（約10:7）。」GT 引丁良才把這道門讀成五重恩典：「門簾表示主耶穌（約10:9），因著這門，人能得著五樣大恩：（一）與神相交（指著陳設餅的桌子）；（二）得神的光照（指著燈檯）；（三）能作有功效的祈禱（指著香壇）；（四）得意外的平安；（五）得以親近神（靠近施恩座）」，並指出這道門少了兩樣東西：「門上沒有門閂，沒有基路伯（參創3:24），叫凡願意進去的人沒有什麼攔阻。」BH：入口「是進入聖所的唯一通道，象徵通往神的獨一道路」，對應主耶穌自稱為門（約10:9）。
  relation: 出27 講的是院子的門（外院入口），本章講的是聖所的門簾（帳幕入口）——同一個預表在會幕裡出現了兩層。而本章的門簾還有一個對照組：內幔。KC 指出兩者的關鍵差異就在有沒有基路伯——「這幅簾子上沒有基路伯」，因為門簾是給人進去的，不是攔阻的：「祭司經由這幅簾子進入聖所。在他們進去之前，這幅簾子彷彿提醒他們主耶穌的榮美。」有基路伯的攔阻要等基督死時才裂開，沒有基路伯的門則從一開始就敞著。
- title: 聖殿中的基路伯（王上6：23-28）
  path: link_folder/互文/聖殿中的基路伯（王上6：23-28）.md
  summary: 出26:1、31 基路伯從施恩座上的一對金像，擴成繡滿十幅幕幔與內幔的形像。CT 在31節說明基路伯時直接引所羅門聖殿：「是一種有長翅翼的活物，與撒拉弗相似的特別使者（參創3:24；王上6:23-28；結9:3）」。GT 引丁良才更把聖殿當作論證的證據：這幔子必是垂在豎板的裡面，因為「這幔子若垂在豎板之外，人就看不見那些基路伯了」，而「在所羅門的聖殿（代下3:7；王上6:29）和以西結的聖殿裡，四面的牆上既然都有能看見的基路伯（結41:18-20），大概摩西的會幕也就是如此」。他並把兩處至聖所並排量了一次：「會幕的至聖所，長寬高各十肘，所羅門聖殿的至聖所，長寬高各二十肘（正大八倍）。」
  relation: 出25 的對照是「一對基路伯 vs 一對基路伯」（施恩座上的金像對聖殿裡的橄欖木巨像），本章的對照換了一個層面——會幕幔子上繡的基路伯，對到聖殿四面牆上看得見的基路伯。丁良才正是用後者反推前者：既然聖殿的基路伯是看得見的，摩西的會幕大概也是如此，所以幔子必定垂在豎板裡面。兩處至聖所同為立方形、聖殿正好是會幕的八倍，也在本章一併量出來。
