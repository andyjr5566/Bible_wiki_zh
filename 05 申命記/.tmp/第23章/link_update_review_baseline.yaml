- title: 田角拾穗顧念窮人的條例
  path: link_folder/主題/田角拾穗顧念窮人的條例.md
  definition: '收割的時候不可把田角割盡，也不可回頭撿掉在地上的穗子；摘葡萄不可摘光，掉在地上的也不可撿，全要留給窮人和寄居的（v9-10）。


    CT 說這條例要教三件事：地表面上是他們的產業，實際上是神的；不可存貪婪、吝嗇、自私的心；快樂的時候正是施捨的好機會。GT 丁良才引一個猶太傳說：收割的時候，至少要留下六十分之一。


    GT《精讀本》從神的屬性看這件事——神以公義堅固祂的位，但我們不能忘記祂的慈愛和慈悲。GT《啟導本》把它擺進更大的社會圖像：申命記規定借款給弟兄不可收取利息、不可拿人賴以維生的磨石作抵押，都是同一種精神的延伸。BH
    稱這是一種早期的社會福利安排，強調的是整個群體對弱勢者的共同責任。


    GT《舊約聖經背景註釋》提供了一個外部對照，標題就叫「故意低效率的收割」：在古代近東的豐饒祭儀中，留在田間的那一部分是獻給土地神明的祭物；在這裡卻成了照顧窮人的方法。該書並說明證據狀況——「古代近東法典雖然沒有這種規條的例證，來自努斯的文獻卻暗示有類似的習慣」。


    STEP 顯示 v9 的「田角」是 pe.ah（H6285，邊、角）。同一個字在本章第27節再出現兩次，就是「頭的周圍」和「鬍鬚的周圍」。'
  development: '這條例在律法書中被反覆加寬。GT 丁良才指出申命記24:19-22 把本段的吩咐講得越發詳細，利未記23:22 也重申一次；受益者從「窮人和寄居的」擴大到孤兒寡婦。


    它在敘事書裡有一個現成的例子。GT 丁良才、《啟導本》、《串珠》、《雷氏研讀本》與 BH 都指向路得記第二章——摩押女子路得正是靠著這條規定，在波阿斯的田裡拾穗養活自己和婆婆。BH
    並由此看見一條更遠的線：這條例把外族人納入神的供應之內。'
