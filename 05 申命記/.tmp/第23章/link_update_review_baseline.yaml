  path: link_folder/原文/取利.md
  definition: CT 在出二十二25 給「放債的」的原文字義是「借出，債權人」、「利」是「利息，高利」，並解本節為「借錢給窮人應付急需，不可向他們索取利息」。GT《丁道爾聖經註釋》指出這條禁令的範圍比高利貸更寬：「本節不但譴責高利貸，更反對向窮人收取任何利息」，並說明理由——「窮人陷於困境才會借貸，借錢是幫助鄰舍，在鄰舍缺乏時還收取利息是不道德的」。
