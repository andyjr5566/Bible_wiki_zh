- title: 古代近東放債取利
  path: link_folder/背景/古代近東放債取利.md
  summary: 第19至20節區分同族與外邦人。GT《聖經精讀本──申命記註解》把兩種情況分開：同族窮人為維持生計而借用時不可取利，「因為取利會導致使窮人愈加貧困的結果」；借給有商業往來的外邦人則可以取利，因為他們身在律法之外，「並且他們是為了獲取更大的利潤而借用了金錢」。BH 說在古代近東向外邦人收息是常見做法，因為那類借貸往往涉及商業投資。
  relation: 周邊法典管的是利率上限，本章管的卻是對象：同一筆錢借給誰，決定可不可以收息。
