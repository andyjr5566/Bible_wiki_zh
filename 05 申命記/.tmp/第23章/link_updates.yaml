- title: 可憎的物（to.e.vah）
  path: link_folder/原文/可憎的物（to.e.vah）.md
  summary: '第18節：「因為這兩樣都是耶和華─你神所憎惡的。」STEP：to.''a.Vat（H8441，to.e.vah: abomination）。CT 在話中之光說：「錯誤的手段並不能成就良善的目的，用行惡、行淫或詭詐而得的錢財奉獻，神絕不悅納。」GT《聖經精讀本──申命記註解》說這句話表明錯誤的手段決不能成為合理解釋良善目的；KC 也說神絕不接受這種人的祭物。'
  relation: 本章這一次判為可憎的不是物件，而是錢的來源——同一個字從不可吃、不可拜、不可穿，走到了不可獻。
