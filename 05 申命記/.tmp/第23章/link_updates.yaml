- title: 聖潔
  path: link_folder/神學/聖潔.md
  summary: '第14節：「所以你的營理當聖潔，免得他見你那裡有污穢，就離開你。」STEP：ka.Do.osh（H6918G，qa.dosh: holy）。GT《聖經精讀本──申命記註解》解釋為什麼連生理現象都被列為不潔：「律法之所以規定精液、大便、月經等人身上的自然生理現象為不潔淨的,是為了使以色列百姓藉著日常生活,認識到他們是為聖潔之神所分別為聖的。」CT 說這是藉物質層面的清潔或污穢來喻指靈性層面的聖潔或污穢。'
  relation: 本章把這個要求放在最不像宗教場合的地方：行軍的營地。要守的不是祭儀規格，而是夢遺、便溺這類每天都會發生的事。
  overview_review:
