      - 申命記:23
- title: 不潔之人出到營外
  path: link_folder/主題/不潔之人出到營外.md
  summary: 第10至11節：夜間偶然夢遺的人要出到營外，不可入營；到傍晚用水洗澡，日落了才可以入營。CT 把這種不潔與利未記的其他情形並列——痲瘋病患者(參利十三1~46)、漏症患者(參利十五1~15)、遺精的男人(參利十五16~18)、行經的女人(參利十五19~25)，並說「用水洗澡」指用水洗全身(參利十五16)。GT《聖經精讀本──申命記註解》把本章的潔淨條例定位為爭戰時的軍隊聖潔條例，與日常生活的潔淨條例分開；KC 說這種不潔並非出於人的意志，人不必為它受責備。
  relation: 本章把出營的規矩搬到行軍的營裡，門檻降低了——出營的只是偶然夢遺的人，隔天日落就回來——理由卻沒有改：第14節說神在營中行走。
