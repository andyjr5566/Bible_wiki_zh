- title: 許願
  path: link_folder/文化/許願.md
  summary: 第21至23節：向神許願，償還不可遲延，神必定追討，不償還就有罪；不許願倒無罪；口中應許甘心所獻的要謹守遵行。CT 說許願是甘心自願的，許了願卻不還願就是欺騙神，並說向神許了願卻不謹守遵行，不只是信用的問題，而是藐視神、不以神為神。GT《申命記串珠聖經註釋》：「許願時必須要謹慎，因為必要向神還願（參箴20:25; 傳5:4-5）。」GT《啟導本聖經申命記註釋》把本段接回民數記第三十章的許願條例；KC 說許願要被嚴肅對待，並提醒唱奉獻詩歌時不該隨口唱過去。
  relation: 本章把許願寫成了有法律後果的行為：出口就算數，不出口不算數，中間沒有折衷的餘地。
