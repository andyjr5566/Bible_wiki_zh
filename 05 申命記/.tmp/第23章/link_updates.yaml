      - 申命記:23
- title: 奴僕
  path: link_folder/原文/奴僕.md
  summary: '第15至16節：逃到以色列的奴僕不可交還主人，要讓他同住、由他自選城邑、不可欺負他。STEP：''E.ved（H5650，e.ved: servant/slave）、tas.Gir（H5462 sa.gar: to shut）、yi.na.Tzel（H5337 na.tsal，本節譯義 he will deliver himself）。CT 說「『脫了主人的手』非指企圖脫離奴僕身分的逃走，而是指因受到主人的殘酷虐待，甚或折斷手腳的酷刑，為保性命而冒險逃脫的奴僕」；GT《申命記雷氏研讀本》：「這條例所指的是一個非以色列人的奴僕從殘酷的迦南人主人那裏逃走出來。」GT《啟導本聖經申命記註釋》：「巴比倫的《漢慕拉比法典》規定匿藏逃奴者死，與神賜以色列人的律法不同很大。」'
  relation: 本章講的不是以色列自己的奴僕，而是逃到以色列來的外邦奴僕；律法給的不是年限與贖回，而是收容、自選居所與不被欺負。
  overview_review:
    signals: []
    accumulation_count:
