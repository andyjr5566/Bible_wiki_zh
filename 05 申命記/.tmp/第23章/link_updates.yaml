- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: '第14節：「因為耶和華─你的神常在你營中行走，要救護你，將仇敵交給你，所以你的營理當聖潔，免得他見你那裡有污穢，就離開你。」STEP：mit.ha.Lekh（H1980I，ha.lakh，本節譯義 [is] walking back and forth）、ma.cha.Ne.kha（H4264 ma.cha.neh: camp）、le.ha.tzi.le.Kha（H5337 na.tsal: to rescue）。CT 說「『在你營中行走』形容神的同在和保守」，並說這是藉物質層面的清潔或污穢，來喻指靈性層面的聖潔或污穢。KC 說爭戰的力量就在於耶和華在他們中間；BH 把這個行走的意象連到神在伊甸園中行走。'
  relation: 本章讓同在出現在行軍的營裡，而維持它的條件落在最日常的細節上——夢遺的人出營一夜，便溺要挖坑掩埋。
  overview_review:
    signals: []
    accumulation_count:
