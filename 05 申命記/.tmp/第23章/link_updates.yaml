- title: 田角拾穗顧念窮人的條例
  path: link_folder/主題/田角拾穗顧念窮人的條例.md
  summary: 第24至25節允許路人在鄰舍的葡萄園吃飽、在禾稼中用手摘穗子，但不可裝在器皿中、不可用鐮刀割取。BH 把這一段接到利19:9-10 與路得記第二章的拾穗規定，說這是神為窮人與行路人所作的供應。GT《申命記串珠聖經註釋》說巴勒斯坦有些地方田產豐富，葡萄園和麥田都公開給路人隨便取食，而禁止帶走是為要禁止貪婪、防止盜取。
  relation: 利未記那條靠收割的人先留下，本章這條靠土地的主人放行；受益的也從住在當地的窮人與寄居的，換成了路過的人。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 利未記:19
      - 申命記:23
- title: 亞捫人
  path: link_folder/人物/亞捫人.md
  summary: 第3至6節把亞捫人與摩押人並列，永不可入耶和華的會。CT 給的原文字義是「亞捫」部落，並指出他們與摩押人同為羅得與兩個女兒亂倫所生的子孫(參創十九36~38)，和以色列人有血緣關係。GT《聖經精讀本──申命記註解》整理出兩項理由：一是以色列流浪曠野時他們不但沒有善待，反而請外邦先知巴蘭咒詛以色列；二是他們敵擋、妨礙根據神的應許進軍迦南的以色列。BH 說他們住在約旦河東、即今日的約旦一帶，以敵視以色列著稱。
  relation: 這是亞捫人第一次在律法條文裡被指名處置。與同章第7至8節的以東人、埃及人相比，判決的差別不在敵意的多寡，而在有沒有可追溯的血緣或收留之恩。
  overview_review:
    signals: []
    accumulation_count:
    - 5
    - 6
    definition: keep
    development:
      decision: keep
