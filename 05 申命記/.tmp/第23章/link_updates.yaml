      - 申命記:23
- title: 迦南廟妓風俗
  path: link_folder/文化/迦南廟妓風俗.md
  summary: 第17至18節先禁止以色列的女子作妓女、男子作孌童，再禁止把這一行所得帶入耶和華的殿還願。CT：「『妓女』指賣淫的女人，特指異教的廟妓；『孌童』指供人狎玩的男人，特指異教拜神儀式中的男性廟娼。」GT《申命記雷氏研讀本》：「“妓女……孌童”。指迦南宗教裏常見的女性和男性廟妓。」GT《聖經精讀本──申命記註解》說這裡所論及的妓女與孌童「是與外邦的偶像崇拜及祭祀儀式有密切關聯的人,指以宗教性禮拜行為來賣淫的人」；GT《啟導本》說神滅絕迦南地民族正是要杜絕此種惡風俗。KC 指出摩西提出這條禁令本身就說明他知道百姓做得出這種事，後來也確實犯了（何4:14；王下23:7；彌1:7）。
  relation: 創世記那次是敘事裡的一個誤認，本章則把同一個風俗寫成兩道明文禁令——不可做，也不可拿這一行的錢來還願。
  overview_review:
