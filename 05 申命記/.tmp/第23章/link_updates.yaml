- title: 取利
  path: link_folder/原文/取利.md
  summary: '第19至20節：借給弟兄的錢財、糧食或無論什麼可生利的物都不可取利，借給外邦人則可以。STEP：Ne.shekh（H5392，ne.shekh: interest）在第19節出現三次，動詞是 ta.Shikh 與 yi.Shakh（H5391B，na.shakh: to pay interest）。GT《啟導本聖經申命記註釋》：「借錢財給人取暴利，自古視為惡事（箴二十二7）。」GT《申命記串珠聖經註釋》說借貸給外邦人可以取利，因為他們不屬於神選民的團體；BH 則把差別放在借款目的上——向弟兄借是為求生，向外人放款多半涉及商業。'
  relation: 本章把禁令的對象從窮人擴大到全體弟兄，項目也從錢擴到糧食與一切可生利之物，同時第一次明文寫出外邦人不在此限。
