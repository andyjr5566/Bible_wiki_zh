book: 申命記
chapter: 23
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 摩押人
  path: link_folder/人物/摩押人.md
  summary: 第3至6節把摩押人與亞捫人一同判為永不可入耶和華的會，理由記了兩筆：出埃及時沒有拿食物和水在路上迎接，又雇巴蘭來咒詛。CT 指出他們是羅得與兩個女兒亂倫所生的子孫(參創十九36~38)，並註明「此處亞捫人和摩押人是用陽性名詞，指男人，故女子若嫁給以色列人不在此限，例如摩押女子路得嫁給波阿斯，大衛王便是他們的第三代子孫(參得四13，17)」；GT《申命記雷氏研讀本》說法一致：「這裏的陽性動詞顯示所指的是“亞捫”或“摩押”的男子。進猶太教的女子，如摩押人路得，可以嫁給以色列的男人。」第5節接著說耶和華不肯聽從巴蘭，卻使咒詛變為祝福。
  relation: 本章把這個民族與以色列的敵對關係寫成了一條成文的定例，也同時留下了路得那個例外的空間——限制的是男性，不是整個民族。
  overview_review:
    signals:
    - many_accumulations
    accumulation_count:
    - 6
    - 7
    definition:
      decision: keep
      basis: no_identity_change
    development:
      decision: keep
      basis: already_covered
      covered_by: 因此有申二三3 的定例：摩押人的子孫雖過十代，也永不可入耶和華的會。
- title: 巴蘭（比珥的兒子）
  path: link_folder/人物/巴蘭（比珥的兒子）.md
  summary: 第4至5節：亞捫人與摩押人「雇了米所波大米的毘奪人比珥的兒子巴蘭來咒詛你們」，「然而耶和華─你的神不肯聽從巴蘭，卻使那咒詛的言語變為祝福的話，因為耶和華─你的神愛你」。CT 註：「神禁止巴蘭咒詛以色列人，又使巴蘭不自覺地說出祝福以色列人的話(參民二十三7~8，11等)。」GT《申命記串珠聖經註釋》：「「巴蘭」：摩押人曾雇請他咒詛選民，但神將他對以色列的咒詛變成祝福（參民22-24章）；這裡提及巴蘭，藉此強調摩押人的罪行。」GT《聖經精讀本》另註米所波大米的毘奪「據推測,是今日位於幼發拉底河沿岸的Tell-Ahmar」。KC 說神提醒百姓的不只是這些國家所行的惡，也提醒他們祂把咒詛翻轉成祝福，因為祂愛他們。
  relation: 本章沒有再敘述巴蘭的行動，而是把他當成一項罪證引用——被引用的是雇他的人，被證明的是神的愛。
  overview_review:
    signals:
    - first_in_book
    - development_blank
    accumulation_count:
    - 5
    - 6
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 民數記:22
      - 申命記:23
- title: 以東
  path: link_folder/地點/以東.md
  summary: 第7節：「不可憎惡以東人，因為他是你的弟兄。」第8節接著說他們第三代子孫可以入耶和華的會。CT 說「『以東人』以東人是以掃的後代(參創三十六9)，和以色列人的祖先有血緣關係」；GT《申命記雷氏研讀本》：「以東人是雅各“弟兄”以掃的後裔。」GT《啟導本聖經申命記註釋》另指出以東人曾在曠野中和以色列人作對（民二十10～21），神要以色列人以德報怨。KC 說以東是與神百姓血緣最近的親屬，比亞捫和摩押更近。
  relation: 創世記那條線走的是相爭，本章給的卻是一條相反方向的吩咐：不可憎惡。判準落在血緣本身，不在以東做過什麼。
  overview_review:
    signals:
    - many_accumulations
    accumulation_count:
    - 11
    - 12
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 創世記:25
      - 申命記:23
- title: 寄居的
  path: link_folder/原文/寄居的.md
  summary: 第7節：「不可憎惡埃及人，因為你在他的地上作過寄居的。」CT 指出「在天下鬧飢荒時，埃及的法老曾經允許雅各攜家帶眷移居埃及的蘭塞(參創四十七11)」；GT《聖經精讀本──申命記註解》說以色列曾將埃及的地當作躲避饑謹之地滯留在那裡(創46:7)；GT《啟導本聖經申命記註釋》則認為這裡的埃及人當指寄居以色列地的埃及人，因為只提寄居的事、未提受奴役的事。KC 也注意到這裡回想的只有他們在埃及所經歷的好處。
  relation: 本章用這段記憶做的是另一件事：不是要求以色列善待住在他們中間的外人，而是禁止以色列記恨曾收留過他們的那個國家。
  overview_review:
    signals:
