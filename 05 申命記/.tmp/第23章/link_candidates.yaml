book: 申命記
chapter: 23
candidates:
- name: 摩押人
  type: 人物
  evidence: 'v3「亞捫人或是摩押人不可入耶和華的會」、v4-6 說明理由。CT：「『亞捫人…摩押人』是亞伯拉罕的侄兒羅得與他兩個女兒亂倫所生的子孫(參創十九36~38)」；GT《申命記雷氏研讀本》：「這裏的陽性動詞顯示所指的是“亞捫”或“摩押”的男子。進猶太教的女子，如摩押人路得，可以嫁給以色列的男人。」'
  surfaces:
  - 摩押人
- name: 巴蘭（比珥的兒子）
  type: 人物
  evidence: 'v4-5「他們雇了米所波大米的毘奪人比珥的兒子巴蘭來咒詛你們」、「然而耶和華─你的神不肯聽從巴蘭，卻使那咒詛的言語變為祝福的話」。CT：「神禁止巴蘭咒詛以色列人，又使巴蘭不自覺地說出祝福以色列人的話(參民二十三7~8，11等)。」GT《申命記串珠聖經註釋》：「「巴蘭」：摩押人曾雇請他咒詛選民，但神將他對以色列的咒詛變成祝福（參民22-24章）；這裡提及巴蘭，藉此強調摩押人的罪行。」'
  surfaces:
  - 巴蘭
- name: 以東
  type: 地點
  evidence: 'v7「不可憎惡以東人，因為他是你的弟兄」。CT：「『以東人』以東人是以掃的後代(參創三十六9)，和以色列人的祖先有血緣關係」；GT《啟導本聖經申命記註釋》：「“以東人”為以掃後裔，以掃是雅各（又名以色列）的哥哥，因此和以色列人有血緣關係。」BH 也說這條吩咐的根據是共同的祖先。'
  surfaces:
  - 以東人
- name: 寄居的
  type: 原文
  evidence: 'v7「不可憎惡埃及人，因為你在他的地上作過寄居的」。CT：「『埃及人』在天下鬧飢荒時，埃及的法老曾經允許雅各攜家帶眷移居埃及的蘭塞(參創四十七11)」；GT《聖經精讀本──申命記註解》說以色列曾將埃及的地當作躲避饑謹之地滯留在那裡(創46:7)。'
  surfaces:
  - 寄居的
- name: 不潔之人出到營外
  type: 主題
  evidence: 'v10-11「若有人夜間偶然夢遺，不潔淨，就要出到營外，不可入營；到傍晚的時候，他要用水洗澡，及至日落了才可以入營。」CT 把這種不潔與利未記的其他情形並列：痲瘋病患者(參利十三1~46)、漏症患者(參利十五1~15)、遺精的男人(參利十五16~18)、行經的女人(參利十五19~25)。'
  surfaces:
  - 出到營外
- name: 神的同在
  type: 神學
  evidence: 'v14「因為耶和華─你的神常在你營中行走，要救護你，將仇敵交給你」。STEP：מִתְהַלֵּךְ mit.ha.Lekh（H1980I，ha.lakh: to go: walk，本節譯義 [is] walking back and forth）。CT：「『在你營中行走』形容神的同在和保守。」BH 也把這個「行走」的意象連到創3:8 神在園中行走。'
  surfaces:
  - 常在你營中行走
- name: 聖潔
  type: 神學
  evidence: 'v14「所以你的營理當聖潔，免得他見你那裡有污穢，就離開你」。STEP：קָדוֹשׁ ka.Do.osh（H6918G，qa.dosh: holy）。GT《聖經精讀本──申命記註解》：「律法之所以規定精液、大便、月經等人身上的自然生理現象為不潔淨的,是為了使以色列百姓藉著日常生活,認識到他們是為聖潔之神所分別為聖的。」'
  surfaces:
  - 營理當聖潔
- name: 奴僕
  type: 原文
  evidence: 'v15「若有奴僕脫了主人的手，逃到你那裡，你不可將他交付他的主人。」CT：「『脫了主人的手』非指企圖脫離奴僕身分的逃走，而是指因受到主人的殘酷虐待，甚或折斷手腳的酷刑，為保性命而冒險逃脫的奴僕。」'
  surfaces:
  - 奴僕
- name: 迦南廟妓風俗
  type: 文化
  evidence: 'v17-18「以色列的女子中不可有妓女；以色列的男子中不可有孌童。」CT：「『妓女』指賣淫的女人，特指異教的廟妓；『孌童』指供人狎玩的男人，特指異教拜神儀式中的男性廟娼」；GT《申命記雷氏研讀本》：「“妓女……孌童”。指迦南宗教裏常見的女性和男性廟妓。」BH 也說 shrine prostitute 是迦南宗教生殖崇拜的一部分。'
  surfaces:
  - 妓女
  - 孌童
- name: 可憎的物（to.e.vah）
  type: 原文
  evidence: 'v18「因為這兩樣都是耶和華─你神所憎惡的」。STEP：תוֹעֲבַת to.''a.Vat（H8441，to.e.vah: abomination）。KC 也說神絕不接受這種人的祭物，這對祂是 an abomination。'
  surfaces:
  - phrase: 所憎惡的
    verses: [18]
- name: 取利
  type: 原文
  evidence: 'v19-20「你借給你弟兄的，或是錢財或是糧食，無論什麼可生利的物，都不可取利。借給外邦人可以取利，只是借給你弟兄不可取利。」STEP：נֶשֶׁךְ Ne.shekh（H5392，ne.shekh: interest）本節出現三次，動詞是 ta.Shikh／yi.Shakh（H5391B，na.shakh: to pay interest）。'
  surfaces:
  - 取利
- name: 古代近東放債取利
  type: 背景
  evidence: 'v19-20 區分同胞與外邦人。GT《聖經精讀本──申命記註解》：「本條例是關於高利貸業的規定。律法不同地適用於兩種情況」，並說借給外邦人可以取利是因為「他們是為了獲取更大的利潤而借用了金錢」；BH 也說借給外人常涉及商業投資。GT《啟導本聖經申命記註釋》：「借錢財給人取暴利，自古視為惡事（箴二十二7）。」'
  surfaces:
  - 可生利的物
- name: 許願
  type: 文化
  evidence: 'v21-23「你向耶和華─你的神許願，償還不可遲延……你若不許願，倒無罪。」STEP v18 的「願」是 Ne.der（H5088，ne.der: vow）。GT《申命記串珠聖經註釋》：「許願可以是人對神一種心意的表達，也可以是一個實際行動。許願時必須要謹慎，因為必要向神還願（參箴20:25; 傳5:4-5）。」GT《啟導本》把本段接回民數記第三十章的許願條例。'
  surfaces:
  - 許願
- name: 田角拾穗顧念窮人的條例
  type: 主題
  evidence: 'v25「你進了鄰舍站著的禾稼，可以用手摘穗子，只是不可用鐮刀割取禾稼。」BH 把這條接到利19:9-10 與路得記2章的拾穗規定，說這是神為窮人與行路人所作的供應。'
  surfaces:
  - phrase: 摘穗子
    verses: [25]
- name: 耶和華的會（qa.hal）
  type: 原文
  evidence: 'v1-8 六次出現「耶和華的會」。STEP：בִּ/קְהַל bi/k.Hal（H6951，qa.hal: assembly）。CT：「『耶和華的會』指具有公開參與敬拜神儀式的權利，包括進入聖所、獻祭、節日聖會等」；GT《聖經精讀本──申命記註解》列出五種說法並選定第五種；GT《啟導本聖經申命記註釋》說這是以色列人因種種目的而有的集會；KC 指出 1-14 節有兩個名稱——assembly of the LORD（1-8 節六次）與 camp（9-14 節六次）。'
- name: 私生子（mam.zer）
  type: 原文
  evidence: 'v2「私生子不可入耶和華的會；他的子孫，直到十代，也不可入耶和華的會。」STEP：מַמְזֵר mam.Zer（H4464，mam.zer: bastard）。CT 原文字義：「私生子」非婚生子(特別指亂倫)；GT《啟導本》引猶太傳統解釋；GT《申命記串珠聖經註釋》：「「私生子」：或指巴力廟裡的娼妓所生的子女。」KC 指出這個字在舊約另一次出現是撒迦利亞書9章6節。'
  surfaces:
  - 私生子
- name: 亞捫人
  type: 人物
  evidence: 'v3「亞捫人或是摩押人不可入耶和華的會」。CT 原文字義：「亞捫」部落，並說他們是羅得與兩個女兒亂倫所生的子孫(參創十九36~38)；GT《聖經精讀本──申命記註解》整段說明這兩族的來歷與兩項罪行；BH 說他們住在約旦河東、即今日的約旦一帶，以敵視以色列著稱。'
  surfaces:
  - 亞捫人
- name: 以東人與埃及人可入會的條例
  type: 主題
  evidence: 'v7-8「不可憎惡以東人，因為他是你的弟兄。不可憎惡埃及人，因為你在他的地上作過寄居的。他們第三代子孫可以入耶和華的會。」CT：「不是指從設立本條例開始的第三代，而是指從個人宣告改信猶太教開始的第三代」；GT《聖經精讀本》：「可以入耶和華的會: 前提條件是他們必行割禮,改信耶和華信仰。」KC 也說第三代是從歸信真神那一刻起算。'
  surfaces:
  - 第三代子孫
  - phrase: 不可憎惡埃及人
    verses: [7]
- name: 軍營潔淨的條例
  type: 主題
  evidence: 'v9-14「你出兵攻打仇敵，就要遠避諸惡……你在營外也該定出一個地方作為便所。在你器械之中當預備一把鍬。」CT 原文字義：「遠避」防備；「諸惡(原文雙同字)」壞的，惡的；「便所」(原文無此字)。GT《聖經精讀本》把它與利11-15、民5:1-4 的日常潔淨條例區分開來；KC 說摩西提到戰士會不潔的兩種情形；BH 說挖坑掩埋是為了衛生也是為了聖潔。'
  surfaces:
  - 遠避諸惡
  - 作為便所
  - 當預備一把鍬
- name: 逃奴不可交還主人的條例
  type: 主題
  evidence: 'v15-16「若有奴僕脫了主人的手，逃到你那裡，你不可將他交付他的主人……你不可欺負他。」GT《啟導本聖經申命記註釋》：「巴比倫的《漢慕拉比法典》規定匿藏逃奴者死，與神賜以色列人的律法不同很大」；GT《聖經精讀本》把以色列比作逃城；KC 舉大衛收留亞瑪力人的埃及少年(撒上30:11-15)為例，並指出保羅送阿尼西母回去是另一回事。'
  surfaces:
  - 脫了主人的手
  - 不可欺負他
- name: 娼妓與孌童所得不可帶入神殿
  type: 主題
  evidence: 'v18「娼妓所得的錢，或孌童（原文作狗）所得的價，你不可帶入耶和華─你神的殿還願。」STEP：''et.Nan zo.Nah（H868 加 H2181）與 me.Chir Ke.lev（H4242 加 H3611，ke.lev: dog）。CT：「『孌童』原文用「狗」字，含有輕蔑的意思」；GT《申命記雷氏研讀本》：「“狗”。希伯來人對男妓或雞姦者的謔稱」；GT《聖經精讀本》說這句話表明錯誤的手段決不能成為合理解釋良善目的；KC 也說我們獻給神的，取得的方式同樣重要。'
  surfaces:
  - 娼妓所得的錢
  - 所得的價
- name: 過路取食的條例
  type: 主題
  evidence: 'v24-25「你進了鄰舍的葡萄園，可以隨意吃飽了葡萄，只是不可裝在器皿中……可以用手摘穗子，只是不可用鐮刀割取禾稼。」CT：「這個條例，一面提供行路人的方便，一面保障果園園主的權益」；GT《啟導本》：「在中東地區，今天仍保有這種款接過路旅客的古風」；KC 指出主的門徒正是引用這條例(太12:1)，法利賽人責備的是安息日而不是這件事本身。'
  surfaces:
  - 隨意吃飽了葡萄
  - 不可用鐮刀割取禾稼
