- title: 黃蜂
  path: link_folder/原文/黃蜂.md
  definition: 出埃及記二十三28「我要打發黃蜂飛在你前面，把希未人、迦南人、赫人攆出去」。STEP 語言數據顯示，「黃蜂」原文為 הַצִּרְעָה（hats-tsir'ah，字根
    צִרְעָה tsir'ah，H6880），字面即作「黃蜂／hornet」。至於這是實際昆蟲、軍事象徵（如埃及軍隊）、恐慌或超自然災害，各家註釋有不同理解。CT
    在出二十三28 給「黃蜂」的原文字義是「大黃蜂」，並解為「在此表徵超自然的災禍，令人不勝其擾，亟思逃避，因此自動集體遷移到別地，或者在原地被消滅」；GT《啟導本》與《丁道爾》則提出象喻埃及軍隊或瘟疫的可能。
  development: 這個字在申命記七20 與約書亞記二十四12 同樣情境下再次出現。GT《中文聖經註釋》把它歸入「聖戰」的語彙：神可以使用自然界之物替以色列人趕出敵人。
