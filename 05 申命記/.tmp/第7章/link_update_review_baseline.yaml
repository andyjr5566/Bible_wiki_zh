- title: 不可為自己雕刻偶像
  path: link_folder/神學/不可為自己雕刻偶像.md
  definition: 「不可為自己雕刻偶像，也不可做什麼形像彷彿上天、下地，和地底下、水中的百物。不可跪拜那些像，也不可事奉它」（出二十4-5a）是十誡的第二條誡命（基督教傳統和改革教派條分法），禁止為敬拜目的製造任何偶像或形像。此誡命的核心是：神是個靈（約四24），不能用任何形像來表現祂；凡自製神像、雕刻菩薩，或用任何形式來代表神加以膜拜，都是罪。第一誡禁止敬拜別的神，第二誡禁止製造偶像——無論是藉著這像敬拜神，或是拜別神。
  development: 第二誡所關注的是應當如何崇拜耶和華，因為所禁的像是代表祂的。古代近東人相信神明在偶像中臨在，可以透過偶像操控神明；耶和華是創造、保存、救贖萬人的主宰，祂無形無像，人不能控制祂。新約中耶穌教導「神是個靈，所以拜祂的必須用心靈和誠實拜祂」（約四24）。約壹五21勸勉信徒「要自守，遠避偶像」。
