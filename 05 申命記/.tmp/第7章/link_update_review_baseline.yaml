- title: 征服迦南應許
  path: link_folder/事件/征服迦南應許.md
  definition: 出二十三25-31 是一連串應許：事奉耶和華必賜福糧與水、除去疾病、境內沒有墜胎的不生產的、滿了年日的數目、使眾民驚駭擾亂、仇敵轉背逃跑、打發黃蜂攆出希未人迦南人赫人、漸漸攆出、並定下境界。CT
    指出這些應許並非絕對：「除去疾病」應不是指不再患病，而是「除去不必要的疾病」；「必沒有墜胎的」也「不是指全然沒有流產和不育，乃是說因著神的特別保護，這類意外的情形必會顯著減少」。
  development: 這疆界從未完全實現。GT 丁良才指出「本節的話到大衛、所羅門的時候就應驗了」；GT《舊約聖經背景註釋》則說「即使所羅門王在位之時，以色列的國境也從來沒有包括這麼廣大的地區。然而從理想的角度看，這疆界卻很合理，因為它包括了當時兩大超級強國之間的全部土地」。CT
    也指出第28節的應許因以色列沒有完全聽從而「沒有成就」。
