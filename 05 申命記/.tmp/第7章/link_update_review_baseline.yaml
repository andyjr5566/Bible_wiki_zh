- title: 聖潔的國民
  path: link_folder/神學/聖潔的國民.md
  definition: 出19:6「為聖潔的國民」。CT 給的原文字義是：「聖潔的」——「聖潔的，分別的，神聖的」；「國民」——「人民，百姓」，並解為「與萬民有所分別、為神所悅納的對象」。GT《丁道爾聖經註釋》指出這裡用的「邦」字（go^y）在後世通常只限於非猶太人的國家，「至於神的選民以色列，則有另一個字代表；現代希伯來語也維持這個分別」，而在本節之前「世上萬民皆地位平等，『選民』要到西乃之後才開始存在」。BH
    說「聖」意為「為特殊目的被分別出來」，並強調這種聖潔不只是禮儀性的，「更包含道德與倫理的行為」。
  development: '**這三句話到底指前面還是後面。** GT《丁道爾聖經註釋》注意到 v6 末句「這些話你要告訴以色列人」的位置容易誤讀：「這幾個字聽來幾乎可說是十誡的引言。然而更有可能是指以上的應許，而非以下的誡命。」CT
    也指出這句話「原文文法相當特別，含有強調的語氣，需要重複地去作的意思」；GT《中文聖經註釋》同說：「原文告訴的文法很特別，是加重語勢和重複應做的動作。」


    **新約的接續。** GT《丁道爾聖經註釋》說「新的約亦再次強調神百姓稱聖以及選民的祭司身分」（[[彼前2：9 君尊的祭司|彼前2:9]]）；BH 另引弗1:4——教會同樣被召為聖，並指出迦南地「位於古代文明的十字路口，使以色列能以其分別的生活方式影響列國」。KC
    則把 [[自潔|聖潔的要求]] 接到今天：「我們若可以稱神為父，那命令就是要聖潔，像祂是聖潔的一樣」（彼前1:15-17）。'
