- title: 屬我的子民
  path: link_folder/神學/屬我的子民.md
  definition: 出19:5「就要在萬民中作屬我的子民，因為全地都是我的」。CT 給的原文字義是「產業，財富」，並指出「原文同一字在代上29:3譯作『我自己積蓄的』，就是說那件東西是某人用錢購買或通過其他努力取得的，他把它作為自己的特別財產」。GT《丁道爾聖經註釋》說得更直接：「這字指君王私有的『特殊珍寶』（如代上二十九3），其含義包括了特殊價值和特別關係」，並注意到出埃及記本節原文其實沒有「子民」二字，是申7:6加上去的。BH
    說這個詞「暗示一種獨特而被珍視的關係，如同君王個人的珍寶」，而這不是因為以色列的規模或勢力，乃是出於神主權的揀選與愛（申7:6-8）。
  development: '**古代近東的同一個詞。** GT《舊約聖經背景註釋》給了這個詞在當時的實際用法：英譯作「珍貴財產」的字眼「在古代近東其他語言中，是指藉分配擄物或遺產而得的財寶。阿拉拉赫王在其印章中自稱為哈達神（Hadad）的『珍貴財產』，證明了這字亦可指人。同樣在烏加列文獻中，赫人宗主稱烏加列王為『珍貴財產』，也是表示他的身分是得寵的藩屬。」


    **舊約與新約的引用。** 丁良才把「作屬我的子民」在申命記與先知書中的重述列了出來：申7:6、14:2、26:18；詩135:4；賽43:1-14；瑪3:17，並注意到一個必要的限制：「神雖從萬民中揀選以色列做祂的子民，這並不是說神就棄絕了其餘的國度，全不看顧他們」（詩67:4）。CT
    也引瑪3:17：「萬軍之耶和華說，在我所定的日子，他們必屬我，特特歸我。」BH 則把這個身分接到 [[彼前2：9 君尊的祭司|彼前2:9]]，並指出以色列被分別出來是為了作「外邦人的光」（賽42:6）。'
