- title: 神的信實
  path: link_folder/神學/神的信實.md
  definition: 神的信實（Faithfulness of God）是神不改變、堅守應約的屬性。在創世記中，神對亞伯拉罕之約的持續性是信實體現的核心。
  development: '### 創26：兩次顯現夾著一次失信


    本章神向以撒顯現兩次。第一次在他往基拉耳去的路上（2-5節），神攔阻他下埃及，並說「我必堅定我向你父亞伯拉罕所起的誓」；第二次在他回到別是巴的當夜（24節），神說「不要懼怕！因為我與你同在……並要為我僕人亞伯拉罕的緣故，使你的後裔繁多」。


    夾在兩次顯現中間的，是以撒稱妻為妹（7節）。神在第3節剛說過「我必與你同在」，第7節以撒就因懼怕而說謊——丁良才在此下了一句話：「人一生怕心，就失了信心。」CT
    也指出以撒的懼怕說出他忘了神剛剛說過的應許。兩次顯現的措辭卻沒有因這次失信而更改或縮減。


    ### 應許為什麼繫在亞伯拉罕身上


    第5節與第24節兩次把賜福的理由歸到亞伯拉罕——「都因亞伯拉罕聽從我的話」「為我僕人亞伯拉罕的緣故」。GT《創世記雷氏研讀本》處理了這裡的張力：雖然神與亞伯拉罕所立的約是出於神無條件的恩典，「但祂也樂於承認亞伯拉罕的美德（如在創二十二16
    一樣），並向以撒確認這約」。KC 說得更具體：這應許建立在亞伯拉罕對神命令的順服上，尤其是他獻上兒子那一次。


    GT《聖經精讀本──創世記註解》把第3-5節定位為創二十二16-18 之約的更新，並指出約的核心依然是土地和子孫。BH 則強調這道誓言的性質：神引述向亞伯拉罕所起的誓，凸顯的正是祂應許的連續性與不可更改——跨代不因人的失敗而中斷。


    CT 另注意到第24節的一個獨特措辭：「我僕人亞伯拉罕」是創世記惟一稱亞伯拉罕為神僕人的經節；GT《串珠聖經註釋》同樣點出這一點，並說亞伯拉罕不但有信心，更有僕人那般的順從。


    - 神對亞伯拉罕之約的「無條件恩典」與「亞伯拉罕的順服」之間的關係'
