- title: 發慈愛直到千代
  path: link_folder/神學/發慈愛直到千代.md
  definition: 「愛我、守我誡命的，我必向他們發慈愛，直到千代」（出二十6）是十誡第二條誡命附帶的應許，與第5節的警告形成對比。此語句宣告神對愛祂、遵守祂誡命之人所施行的堅定慈愛（hesed），其範圍遠超審判的範圍——審判僅及三四代，慈愛卻直到千代。這表明神的恩典和憐憫遠遠大於祂的審判。
  development: 「慈愛」（hesed）是舊約中描述神盟約之愛的核心詞彙，強調神對祂百姓堅定不移的忠誠和憐憫。新約中，耶穌教導「愛我、守我誡命的」原則：「你們若愛我，就必遵守我的命令」（約十四15）。神的慈愛在基督裡得到終極彰顯——「神愛世人，甚至將祂的獨生子賜給他們」（約三16）。
