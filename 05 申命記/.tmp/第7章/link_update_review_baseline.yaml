- title: 迦南人
  path: link_folder/人物/迦南人.md
  definition: 迦南人為迦南地原住民族總稱（創10:15-19），含西頓人、赫人、耶布斯人、亞摩利人、革迦撒人、希未人、亞基人、西尼人、亞瓦底人、洗馬利人、哈馬人等。「迦南」意為「紫紅色之地」，因盛產紫紅染料。神命以色列盡滅迦南七族（申7:1-2），因其罪孽滿盈（創15:16）、習俗可憎（利18:24-30）。
