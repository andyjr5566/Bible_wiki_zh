- title: 網羅
  path: link_folder/原文/網羅.md
  definition: 出十7 法老的臣僕對法老說：「這人為我們的網羅要到幾時呢？」——「這人」指摩西。CT 的原文字義給這個詞兩個意思：「網羅，誘餌」；CT
    並說明它原來的用法：「『網羅』原用來抓捕鳥獸，此處用來形容摩西乃是引致埃及毀滅性災禍的陷阱。」臣僕接著問的「要到幾時呢？」，CT 解作「所受的災害已經夠多了」。
  development: '**誰在說話。** GT《中文聖經註釋》指出第7節是一個轉折：「這是法老手下的人，首次開口勸法老低頭。這些人中，有的早已存敬畏的心聆聽神藉摩西所說的話了（見9:20），為免國家因獨裁者的頑固，而使元氣大傷，他們也敢於表達意見了。」GT
    丁良才把人數的變化也算了進去：「法老的臣僕中早先有懼怕耶和華的（9:20），當時懼怕的人更加多了。」GT《聖經精讀本》則指出他們的動機並不高尚：「這種行為絕不是認可以色列的解救宣言，只不過是擔心埃及滅亡。」


    **他們說了什麼。** 臣僕的話分三段：稱摩西為網羅、勸法老放人、最後一句最重——「埃及已經敗壞了，你還不知道嗎？」CT 解釋「已經敗壞」是「形容埃及經歷前面數次災禍之後，損耗巨大，瀕臨覆滅的局面」；GT《串珠聖經註釋》從語氣讀出更尖銳的一層：「好像暗示所有埃及都知道了，惟獨法老仍茫然不知。」BH
    也說這句反問是一記警鐘，要法老正視埃及已成廢墟的事實。


    **「容這些人去」的算計。** GT《中文聖經註釋》注意到臣僕用的字有伸縮空間：「這裏的人字是複數，原文亦可譯為壯丁，男人或丈夫。因此，法老的臣僕在此所提議的，是容許以色列人的壯丁到曠野，按他們所說的走三天的路程，去祭祀神。但是，可以把他們的老人，婦人和孩子們，留在埃及作『抵押』。」——臣僕的建議，正是法老在第10-11節開出的條件。


    **進諫的時機。** GT 丁良才由此發了一段議論：「假若法老的臣僕起初就犯顏強諫，或者能免埃及所遭的災難，也未可知」，並列出四條要理：「務須趁早，免得遲了無濟於事；言行必須前後相符；須知袖手旁觀與堅持中立都含危險；既盡忠告，仍當繼續催請免得在上者置之不理。」CT
    說得更短：「話說得適時合理，才有價值。該說時不說，不能防患於未然，難免被追究責任。」


    **法老的位置。** KC 注意到一件反常的事：法老是被自己的臣僕說服，才召摩西和亞倫回來的——「他的心剛硬到一個地步，竟像是需要別人來勸他去避開這場災。」BH
    也指出臣僕的質問「顯示埃及的領導階層開始出現異議」，連效忠法老的人都看出繼續抵擋神是徒然的。'
