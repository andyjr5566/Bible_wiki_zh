- title: 古代近東祭壇
  path: link_folder/背景/古代近東祭壇.md
  definition: 古代近東祭壇是指古代西亞和埃及地區用於獻祭和敬拜的建築結構。祭壇通常以土、石或金屬建造，形式從簡樸的土堆到精心設計的高臺階梯不等。神在出埃及記二十章24-26節指示以色列人築壇的規則——用土或未鑿過的石頭，不可用臺階——這些規定刻意區別於異教的高臺階梯祭壇，強調敬拜的簡樸和謙卑。
