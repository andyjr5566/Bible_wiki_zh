- title: 迦南七族（迦南地原住民）
  path: link_folder/背景/迦南七族（迦南地原住民）.md
  definition: '指神應許要為以色列人趕出的迦南地原住民。出33:2 列了六族：迦南人、亞摩利人、赫人、比利洗人、希未人、耶布斯人。


    **為什麼通稱「七族」而經文只有六個名字。** GT《中文聖經註釋》指出：「撒瑪利亞抄本和七十士譯本，都加上了革迦撒人，而湊足通常所稱的迦南地七族的人。」CT
    的說法一致——這六族「包括革迦撒人，合稱迦南七族（參徒十三19）」。


    **族名的字義。** CT 的〔原文字義〕逐個給出：「迦南人」熱心的；「亞摩利人」山居者；「赫人」恐懼地子孫；「比利洗人」屬於某一村莊；「希未人」村民；「耶布斯人」被踐踏的後裔，打鼓廠的後裔。


    **「攆出」的方式。** CT 指出『攆出』的意思是「指對方因不勝其擾而自動逃避」，並在同章註「使者」時提到一個可能：此處的使者「很可能指黃蜂（參二十三28），因為黃蜂也能將人攆出原居地」。GT
    丁良才則把這件事定性為恩典：「『攆出迦南人』——這是神特別的恩典。」


    **他們代表什麼。** BH 指出這幾族代表「盤踞迦南地的根深柢固之異教文化」，其中迦南人以偶像崇拜與道德敗壞著稱，是神要從那地除去的對象；同一份來源把這場征服讀為屬靈得勝的預表。GT《聖經精讀本》給出同一方向的應用：「我要……攆出：意味著對迦南的征服，在神的恩典中已經開始。同樣，新約時代信徒的屬靈戰爭，不是靠自己的能力，而是依靠神的權能（西1:29）。」'
