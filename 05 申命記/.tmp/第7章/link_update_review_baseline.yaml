- title: 柱像
  path: link_folder/原文/柱像.md
  definition: CT 在出二十三24 給「盡行拆毀」的原文字義是「廢除，破壞，推翻」、「打碎」是「打碎，折斷」。GT《丁道爾聖經註釋》說明「柱像」是什麼：「直譯是『站立〔之石〕』或『直立之物』。迦南人聖所中〔如：基色和他納〕經常可以找到這種十個一組的直立石頭。」GT《舊約聖經背景註釋》也說這是「巨型的直立石塊，代表當地神祇的能力。這些柱像有時單獨，有時成組出現」。
  development: '柱像的禁令在三章裡出現三次，語氣一次比一次直接。出二十三24 說「盡行拆毀」，出三十四13 說「打碎他們的柱像」，到了利二十六1 則是連立都不可立。GT
    丁良才在出二十三下指出這條命令針對的是戰勝國的習慣：「古時的人戰勝別國以後，就多保存那國的偶像，為本國戰勝他國的紀念品，神卻禁止以色列人這樣行，免得他們陷於拜偶像的罪中。」BH
    也說砸碎聖石是公開宣告這些神明無能、耶和華至上。


    這三章合起來還交代了一件容易混淆的事：立石本身不是罪。GT《丁道爾聖經註釋》在出二十三下說明「族長時代使用這些石頭並無不良的意義（創二十八18），但如今有了迦南的巴力崇拜作為背景，情況就不同了」；BH
    在出三十四下也指出這些立石在迦南宗教中「既作為神明的象徵，也作為重大事件的紀念碑」——同一個物件承載兩種功能，律法要毀的是前者。


    利未記第26章把柱像放在全書結語的最前面，位置本身有意義：全章以「不可立雕刻的偶像或是柱像」開場，以第30節神親手打碎邱壇日像、把拜偶像者的屍首堆在偶像碎塊上收場。禁止的物件與被毀的物件，是同一批。'
