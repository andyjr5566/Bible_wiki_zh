- title: 立約禁令
  path: link_folder/事件/立約禁令.md
  definition: 出二十三32-33：不可和他們並他們的神立約；他們不可住在你的地上，恐怕他們使你得罪我；「你若事奉他們的神，這必成為你的網羅」。CT 解釋與假神立約的意思：偶像不可能與人立約，因此「和『他們的神立約』意味著單方面發咒起誓，承諾以異教徒所拜的假神為神」。
  development: 「網羅」一字的分量比中文更重。GT《丁道爾聖經註釋》引德萊維：「在希伯來思想裡，網羅和新約的『絆腳石』同樣都不是陷於罪中的象徵，而是陷於滅亡的象徵。因此原文的警告遠比譯文所顯示的嚴峻。」KC
    也以約翰壹書五21「小子們哪，你們要自守，遠避偶像」作為全章的收束。
