- title: 聽命順從蒙醫治
  path: link_folder/主題/聽命順從蒙醫治.md
  definition: 「聽命順從蒙醫治」是出埃及記15:26所啟示的盟約原則。神在瑪拉使苦水變甜後宣告：「你若留意聽耶和華你神的話，又行我眼中看為正的事，留心聽我的誡命，守我一切的律例，我就不將所加與埃及人的疾病加在你身上，因為我——耶和華是醫治你的。」這原則將神的醫治與子民的聽命順從連結，形成盟約中的條件性應許。
  development: 聽命順從蒙醫治的原則在聖經中反覆出現。申命記28章將順從與祝福、悖逆與咒詛系統化。GT指出這不是說所有疾病都源於不順從，而是強調立約關係中順從與祝福的關聯——神將自己啟示為醫治者，與埃及的疾病（十災中的瘟疫、瘡災等）形成對比。KC指出這原則預表基督的救恩——順從基督者得醫治（彼前2:24）。
