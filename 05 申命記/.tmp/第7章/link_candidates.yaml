    type: 互文
    evidence: 申7:3-4以轉去事奉別神說明禁婚的宗教理由。
    surfaces:
      - phrase: 結親
        verses: [3]

  - name: 古代近東祭壇
    type: 背景
    evidence: 申7:5命令拆毀迦南宗教祭壇。
    surfaces:
      - phrase: 祭壇
        verses: [5]

  - name: 柱像
    type: 原文
    evidence: 申7:5命令打碎迦南宗教柱像。
    surfaces:
