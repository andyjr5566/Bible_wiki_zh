- title: 神的命令與自由意志
  path: link_folder/主題/神的命令與自由意志.md
  definition: 創世記2章16-17節中，神先允許人吃園中各樣樹的果子，只禁止分別善惡樹。第16節把「吃」אָכַל（*a.khal*，H398）連說兩次，可直譯為「吃，你可以吃」，用來加強慷慨的允許；這是
    STEP 可直接確認的句式。人擁有真實選擇、自由仍在神主權之下，則是 CT、KC 與 BibleHub 根據整段作出的神學整理。
