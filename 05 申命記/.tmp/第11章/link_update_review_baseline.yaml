- title: 苦難與管教
  path: link_folder/神學/苦難與管教.md
  definition: 聖經中苦難常被神用作管教與成聖的工具。創42章中，哥哥們被囚禁三天（v17）是他們悔改的轉捩點；雅各失去約瑟、西緬又被扣留，看似悲劇，實則是神為了使雅各全家下埃及的預備。GT《聖經精讀本──創世記註解》說：「其實這不單單是懲罰,乃是神為了使雅各成聖而實施的愛的鞭打」（來12:6）。
  development: '創世記與申命記各給了這個主題一半，而且是互補的一半。


    創42 是從人的一側看的。哥哥們被囚禁三天，在牢裡開始翻出二十年前的舊帳；雅各說「這些事都歸到我身上了」，他看見的只有損失。苦難在那一章裡確實把人帶回了神面前，卻沒有任何人知道它為什麼會有這種作用——受苦的人只覺得事情都衝著自己來。


    申8:5 補上的正是那個「為什麼」，而且是用家庭裡的關係說出來的：管教的人是父親，受管教的是兒子。這一句一旦成立，苦難的性質就變了——它不再是命運或報應，而是一個有目的的行動，行動的人與受苦的人之間還有情感上的連帶。


    兩章合起來，這個主題才有前後兩端：創42 顯示苦難能生出悔改，申8 說明它為什麼能——因為施加苦難的不是仇敵。也正因如此，申8 敢把時間尺度拉到整整四十年，並在結尾給出終點。創42
    的三天與申8 的四十年量級差得極遠，性質卻是同一種。'
