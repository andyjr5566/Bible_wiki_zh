- title: 利巴嫩
  path: link_folder/地點/利巴嫩.md
  definition: '第25節摩西求神容他過去看的，是「約但河那邊的美地，就是那佳美的山地和利巴嫩」。


    **名字與原文。** CT 原文字義：「利巴嫩」潔白。STEP 顯示是 ve./ha./le.va.Non（H3844G）。


    **它在哪個方向。** BH：「Lebanon, known for its majestic cedar trees, was located to the
    north of Israel.」（利巴嫩以壯麗的香柏樹著稱，位於以色列以北。）CT 在第8節說黑門山「位於利巴嫩之南」；GT《啟導本》在同一節說黑門山「為黎巴嫩境內最壯觀的一座大山」——兩家用不同方式把這兩個地名扣在一起。


    **它象徵什麼。** BH：「It was renowned for its natural beauty and resources, often symbolizing
    strength and majesty in biblical literature (Psalm 92:12).」（它以自然美景與資源聞名，在聖經文獻裡常象徵力量與威嚴（詩92:12）。）


