- title: 摩利橡樹
  path: link_folder/背景/摩利橡樹.md
  definition: 摩利橡樹是創世記十二6 所記示劍的地標，亞伯蘭進入迦南後抵達的第一個具名地點，神也在此首次向他顯現並應許把地賜給他的後裔（7節）。CT
    註「摩利」的原文字義為「教師，教訓，山寨」；GT《舊約背景註釋》把樹種考為泰博橡樹（學名 Quercus ithaburensis），並指出它是示劍的地標，「可能也是教師（這是摩利一語的本義）、士師聽訟或講學之處」。GT《串珠聖經註釋》另記其宗教身分：這是「迦南人當為神聖的一棵樹，他們的占卜者憑這樹葉子的颯聲指示未來的事情」。GT《創世記雷氏研讀本》則提出另一種讀法，把該處譯作「摩利平原」。
  development: '這棵樹的份量不在植物本身，而在它同時是**三種場所**：地標、講學／聽訟之處、迦南人的聖樹。三者疊在一起，正好說明第6節後半那句看似突兀的補述——「那時迦南人住在那地」。

    GT《舊約背景註釋》提供了古代近東的平行例：與底波拉的棕樹（士四5）同類，也與烏加列史詩《阿赫特》中達尼珥的審判樹同類，都是在大樹下施行審斷或教導。它接著說明這種樹為何常與宗教相連：「這種樹除了作為樹蔭很有價值以外，其茂盛更是豐饒崇拜的象徵，因此經常用作祭偶的地點。」但背景註釋在此加了一個關鍵的括號限定——樹是**祭偶的地點，不是崇拜對象**。引用時要守住這條線，不宜說迦南人「拜這棵樹」。

    由此看，亞伯蘭築壇的位置就有了對照的意味：他在一個原本屬於迦南宗教與司法生活的地標旁，為向他顯現的耶和華築壇（見[[帳棚與祭壇]]）。GT《啟導本聖經創世記註釋》指出大樹常是聖所所在地的明顯記號，並舉底波拉的棕樹為例；GT
    丁良才則補一句年代上的謹慎：「當時還沒有示劍城，這名大概是後來起的。」

    CT 從「摩利」的字義發展出靈意讀法（摩利＝知識，橡樹高大可供客旅遮蔭休息，合起來指真實認識神能叫天路旅客從新得力，賽四十29-31）。這是由名稱引申的應用，與上述的地理與宗教背景屬不同層次，宜分開看待。'
