- title: 快快地（ma.her）
  path: link_folder/原文/快快地（ma.her）.md
  definition: '申命記第9章有一個字被中文譯成三種說法。第3節「使他們速速滅亡」、第12節「你起來，趕快下去」與「他們快快地偏離了我所吩咐的道」、第16節「快快地偏離了耶和華所吩咐你們的道」——STEP
    顯示這四處都是同一個原文形式 מַהֵר（ma.her，H4118B，簡要詞典義 quickly），詞形一律標為 HVpcc，本節譯義也一律是 quickly。CT
    在第12節的〔原文字義〕也註明「快快地」原文與「趕快」同字。


    把四處排在一起，本章的節奏就看得出來。==同一個詞先形容神的審判有多快，再形容人的墮落有多快。== 第3節說的是迦南人在神面前速速滅亡；第12節神叫摩西趕快下山，理由正是百姓快快地偏離；第16節摩西下山之後，用同一個詞複述他親眼看見的事。


    GT《聖經精讀本》在第16節把這個「快快」放進時間軸裡：拜金牛犢的事件發生在以色列百姓在莊嚴的情景中聽神親自宣告十誡之後尚未滿四十日的時候。KC 在第12節只留一句評語，說神談到他們偏離得有多快，而這就是人。BH
    也指出這種迅速的背道反映了人在等待與不確定中容易離開神所吩咐的路。


    第3節那個「速速」還牽出一個問題。CT 指出這句話和申7:22 神所應許的漸漸趕出、不可速速滅盡並不矛盾，因為那裡講的是不要一下子就將他們滅盡，而本節講的是他們的滅亡不會拖延太久。GT《聖經精讀本》給的兩個解法方向略有不同：一是本節或許描繪的是迦南人在神審判面前的命運，二是逐漸滅亡的對象指迦南居民，而急速滅亡的對象是迦南人的社會或國家體系。'
