- title: 流便
  path: link_folder/人物/流便.md
  definition: 雅各與利亞所生的長子。創世記第二十九章中，利亞因耶和華看見她的苦情而給兒子起名流便，名字與「看哪，一個兒子」或「有兒子」的意思相關。
  development: '流便的出生首先顯出神看見利亞在婚姻中的苦情。這名字不是單純家譜資訊，而是利亞信仰經歷的一部分：她把兒子的出生解讀為耶和華對受冷落者的眷顧。


    ### 一次失去，四卷書都記得


    流便的長子名分在創35章因與辟拉同寢而斷送，創49:3-4 雅各臨終宣告他「必不得居首位」——CT 指出長子名分原有三大特權：雙份的產業、家族的首領（君王）職分、家族的祭司職分，而
    CT 與 GT 丁良才、雷氏都指向同一個歷史印證：流便的後裔從未出過著名的士師、先知或官長。這件事沒有隨創世記結束就被遺忘。出1章他仍被列在下埃及的眾子之首，但
    CT 已隨即註明「原是長子，因犯淫亂的罪而失去長子的名分」；出6章的利未支派族譜同樣從流便的名字起頭，卻只列一代就轉去下一個支派——BH 指出這對理解雅各家族的權力轉移、猶大與約瑟兩支派的崛起十分重要。到民數記，這件事仍在被引用：民1章
    CT 說流便因犯淫亂失去長子名分，「被猶大和約瑟兩人分得」；民2章他仍保留長子的位置尊榮——南營第一隊、右邊方位——GT《精讀本》說這是對長子「特殊的照顧」，可見失去的是名分的實質特權，不是敘事裡的位置與紀念。代上5:1-2
    最終把帳算清：長子的名分歸了約瑟。



    ### 河東那塊地：他保住了地，沒保住次序


    民數記32章流便子孫與迦得子孫聯名求約但河東的雅謝地和基列地。GT 串珠卻注意到一件事：流便是長子，理應排名在先，主謀實際上是迦得支派，所以民32 第6、25、29、31、33節一律把迦得排在流便前面。這是流便支派在民數記裡最後一次以主動角色出現，而他在自己參與發起的事情上仍然排第二。


    到民數記34章，同一件事已經縮成一句插話：第14-15節提流便與迦得「已經在耶利哥對面、約但河東、向日出之地受了產業」，作用只是解釋為什麼第13節的分地只給九個半支派。


    申命記3章摩西複述這件事時，流便一律與迦得成對出現，兩次都同時被提，界線也寫得最完整——南到亞嫩谷、東北到雅博河、西到約但河與鹽海。


    申命記4章他最後一次出現，做的已經不是分地而是分逃城：第43節「為流便人分定曠野平原的比悉」，CT 說「流便人所得地業在河東的最南邊」。河東三座逃城由南到北排開，比悉是最南的一座，落在他最早拿到、位置也最南的那塊地上。


    這條線與長子名分那條線其實是同一件事的兩面：地他拿到了，而且拿得比誰都早；排序、主導權、被單獨稱呼的位置，一次也沒有回來。'
