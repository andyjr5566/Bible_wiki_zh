- title: 他的道（de.rekh）
  path: link_folder/原文/他的道（de.rekh）.md
  definition: '申10:12 要求以色列「遵行他的道」。STEP 顯示這是兩個部分：動詞 לָלֶכֶת（la./Le.khet，H1980I，ha.lakh，簡要詞典義
    to go: walk，不定詞）加上 בְּכָל־דְּרָכָיו（be./khol de.ra.Kha/v，H1870G，de.rekh 簡要詞典義
    way: conduct）。


    **原文的「道」是複數。** de.ra.Kha/v 的 morphology 是 HNcmpc/Sp3ms——陽性複數附屬形加第三人稱陽性單數詞尾，字面是「他的眾道路」。CT
    的話中之光也記下同一點：「祂的道(或道路)不是單方面的事，在原文裡這個字是眾數。」


    CT 從這個複數推出的應用是：神給不同的人不同的道路，在職業上有不同的帶領、在恩賜上所賜各有不同，快樂的人生是走在他的旨意中。這是 CT 的解經延伸，語言層面能確定的只是這個字在本節確實是複數形。


    **動詞本身也有意思。** CT 的〔原文字義〕給「遵行」是「行走」，並在話中之光裡拿這個字面義說事：「行走的動作是繼續不斷的，停了就不是行走了。」BH 講的是同一個方向：行在神的道路上意味著按他的誡命律例過日子，是一種持續而主動的順服生活方式，並接到詩119:1。


    **這個詞在本章的位置。** 它是第12 節那串答案的第二項，夾在「敬畏耶和華」與「愛他」中間。KC 在列舉這四項時把它寫成 walk in His ways，與敬畏、愛、事奉並列，當作對神恩典的合宜回應。'
