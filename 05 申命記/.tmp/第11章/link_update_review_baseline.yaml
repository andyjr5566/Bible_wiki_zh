- title: 專靠（da.veq）
  path: link_folder/原文/專靠（da.veq）.md
  definition: '申命記4:4 用一個很身體性的字描述倖存者：「惟有你們專靠耶和華─你們神的人，今日全都存活。」


    **原文是「黏著」。** STEP 原文資料顯示，「專靠」是 ha./de.ve.Kim（H1695），形態是形容詞陽性複數（HTd/Aampa），本節譯義作
    who were clinging；簡要詞典義是 da.veq: cleaving。


    CT〔原文字義〕給的是「專靠」貼近，貼著的，並在文意註解裡說：「『專靠』意指最親密的關係，如同夫妻彼此的關係一樣。」


    **它與第7節的「相近」是同一件事的兩面。** CT 在第7節指出：「『相近』指貼近；是人『專靠』（參4節）神的相應結果」，「『求告』乃是人『專靠』（參4節）神的表現」。人黏著神，神就靠近人。


    **BH 把它接到別處的同一個要求。** 「Holding fast to the LORD implies a steadfast commitment
    to His commandments and a rejection of idolatry, which was prevalent among surrounding
    nations.」（緊緊抓住耶和華，意味著堅定守住祂的誡命，並拒絕周圍列國盛行的偶像崇拜。）他並指出約書亞記23:8 也勸以色列人要緊緊依附耶和華。


    **這個字是本章的分水嶺。** 第3節說隨從巴力毘珥的人被除滅，第4節說專靠耶和華的人全都存活——同一天、同一群人，差別只在黏著誰。'
  development: '這個字根在申命記出現兩次，詞形不同，作用也不同。


    申4:4 是描述：「惟有你們專靠耶和華─你們神的人，今日全都存活。」STEP 顯示那是 ha./de.ve.Kim（H1695），形態是形容詞陽性複數，本節譯義
    who were clinging。它在那一章的作用是分辨——隨從巴力毘珥的被除滅，黏著耶和華的存活。


    申10:20 換成命令：「你要敬畏耶和華─你的神，事奉他，專靠他，也要指著他的名起誓。」STEP 顯示這裡是動詞 tid.Bak（H1692，Qal 未完成式）。GT《申命記串珠聖經註釋》給的直譯是「粘著他」，GT《啟導本聖經申命記註釋》說這個字有忠於神和愛神的意思，要像妻子對丈夫般忠於神並愛他。


    ==同一個動作，一次是事後的判斷，一次是事前的要求。== KC 在申10:20 把它列為敬畏的三種表現之一：事奉是行為上的、專靠是心裡定意的、指著他的名起誓是口裡說出來的。兩章合起來，這個字既說明誰活了下來，也說明活下來的人接著要做什麼。'
