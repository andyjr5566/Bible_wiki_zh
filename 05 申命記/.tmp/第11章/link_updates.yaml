  path: link_folder/背景/摩利橡樹.md
  summary: 第30節「靠近摩利橡樹嗎」。STEP：e.lo.Nei mo.Reh（H436H 加 H4176G）。CT 說摩利橡樹位於示劍境內（創十二6），並註「摩利」的字義是教師；KC 說 Moreh 意為教導，橡樹一字帶著強壯或堅硬的意思。GT《聖經精讀本──申命記註解》指出兩山所在正是亞伯拉罕移居迦南後第一次築壇之處（創12:6-7）。
