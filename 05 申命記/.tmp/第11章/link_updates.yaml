  path: link_folder/主題/神的命令與自由意志.md
  summary: 第26節「我今日將祝福與咒詛的話都陳明在你們面前」。GT《聖經精讀本──申命記註解》把這個處境類比為神把亞當夏娃放在善惡果面前（創2:16、17），說神允許人以自由意志選擇善和惡，且喜悅發自內心自發性的順服。
