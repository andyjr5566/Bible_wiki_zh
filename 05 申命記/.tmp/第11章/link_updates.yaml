  path: link_folder/神學/苦難與管教.md
  summary: 第2節把「管教」列進這一代親眼看見的事：「沒有看見耶和華─你們神的管教、威嚴、大能的手，和伸出來的膀臂」。STEP：mu.Sar（H4148G，簡要詞典義 discipline）。CT 說這指神在曠野中對悖逆者的屢次懲罰。
  relation: 本章給這個主題一個少見的角度：管教在這裡不是私下的教導，而是一代人共同目擊的歷史，和第6節地開口吞人的事列在同一份清單上。
