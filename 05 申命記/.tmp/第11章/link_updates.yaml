  summary: 第24節「直到西海」。STEP：hai./Yam ha./a.cha.Ron（H3220G 加 H314），字面是後面的海。CT 原文字義給「西」後面、西方，並說西海即地中海為西界。GT《申命記雷氏研讀本》直接註明「西海」即地中海。
  relation: 這是它第一次進入申命記的累積；民34:6 用的是「大海」，本章用的是「西海」，指的是同一片水。
