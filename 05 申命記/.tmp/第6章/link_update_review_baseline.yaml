- title: 記號與經文
  path: link_folder/原文/記號與經文.md
  definition: 出13:9「這要在你手上作記號（לְאוֹת，H226H），在你額上作紀念（וּלְזִכָּרוֹן בֵּין עֵינֶיךָ，H2146
    搭配 H996G, H5869A），使耶和華的律法常在你口中」，第16節再說一次：「這要在你手上作記號，在你額上作經文（וּלְטוֹטָפֹת בֵּין
    עֵינֶיךָ，H2903）。」STEP 顯示 טוֹטָפֹת（*to.ta.Fot*，H2903）在原文是指額前的標誌或佩戴的經文匣（phylacteries
    / marks）。
  development: '**這句話是不是要照字面做？各家不同。** 丁良才認為摩西「借埃及人所用的佩戴為喻」；GT《串珠聖經註釋》說得更明白：「不應作字面解、以為真要將律法寫在皮條上，然後佩戴在手上（或額上）作為紀念。摩西其實是以隱喻提醒以色列人──他們原是神救贖出來歸自己的。」GT《中文聖經註釋》給的解釋最具體：「這經文的原意是要聽眾緊記此吩咐，正如善忘的人做記號在手上，或把它當經文般惦念在兩眉中間的上端（這是古以色列人認為記憶的所在）。」GT《丁道爾聖經註釋》則從一個很有力的角度否掉字面解：「然而這種文字竟可用在除酵節上，就證明了它純粹是喻象。過分拘泥字義不但是猶太人的毛病，也是基督徒常犯的危機。」


    **後世的作法。** 各家都記下同一件事。丁良才：後來猶太人把出13:3-10、13:11-16、申6:4-9、11:13-21 寫在皮上，放在小皮盒內，繫在肘和額上。GT《啟導本》補上時間與細節：以色列人被擄到巴比倫回來後，「用皮革做成兩個備有經文的小方盒，一個戴在額前，一個戴在左手。經文寫在羊皮上」，而這種皮盒可能就是太23:5
    所記的「佩戴經文」——「經文盒到耶穌時代已成裝飾品，早失原來的意義」。GT《中文聖經註釋》說那是兩個立方型的小皮盒，一個纏在左臂，一個戴在額上，並指出耶穌責備法利賽人「將佩戴的經文做寬了」（太23:5），所指的就是這東西。CT
    另記下兩個盒子的分別：手臂上的「裡面錄有律法條規」，前額上的皮帶經文匣「下垂到胸前靠近心臟處，所錄律法條規較手臂為多」。


    **它從哪裡改裝而來。** GT《舊約聖經背景註釋》把它放在古代近東的處境裡：「古代近東的人經常佩帶護身符，以求避除邪靈。他們相信貴金屬和寶石最為有效，有時更內藏有法力的字句或咒語。護身符在以色列遭禁，但其概念卻被改裝為對律法的紀念。」它並舉出一件實物為證：一九七九年在耶路撒冷城外不遠處的前被擄時期古墓中挖掘到的銀製小卷，「這些小卷中藏有民數記六24～26的祝福，是現存最古的聖經片段」。


    **重點在心不在皮盒。** GT《聖經精讀本》把這句話讀成一件內在的事：這是「把神的話語藏在心底（申6:6），永遠銘記的意思」，而「在你口中」是說「神的律法在心中充滿的時候，自然會通過口流露出來」。BH
    也是同一路：手代表行動與工作，額代表思想與意識，而「在你口中」強調的是把神的誡命說出來、教出去。'
  signals:
  - first_in_book
  accumulation_count:
  - 1
  - 2
- title: 滅盡與除滅的雙同字（sha.mad）
  path: link_folder/原文/滅盡與除滅的雙同字（sha.mad）.md
  definition: '申命記4:26 的下半句在中文讀起來像兩個相似的警告：「你們必⋯速速滅盡！你們不能在那地上長久，必盡行除滅。」原文的力道來自一個中文譯不出來的結構。


    **兩處都是同一個動詞連用兩次。** CT〔原文字義〕直接標了出來：「滅盡（原文雙同字）」消滅，消失；「盡行除滅（原文雙同字）」根絕，滅絕。


    STEP 原文資料顯示這兩組的詞形：


    | 和合本 | 原文 | Extended Strong | 形態 | 本節譯義 |

    |---|---|---|---|---|

