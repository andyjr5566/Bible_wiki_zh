- title: 法度（e.dah）
  path: link_folder/原文/法度（e.dah）.md
  definition: '申命記4:45 用三個詞概括摩西所傳的內容：「就是摩西在以色列人出埃及後所傳給他們的法度、律例、典章」。「法度」是這一組裡最少單獨出現的一個。


    **它的字根是「證人」。** CT〔原文字義〕：「傳給」說話，講論；「法度」見證。文意註解：「『法度』指律法的證詞，見證神對人的心意」。


    GT《串珠聖經註釋》說得更完整：「『法度』：指一種嚴肅的宣告，神的法度也就是神的性情和旨意的宣告；『法度』的字根原為『證人』，這裡乃指神的律法。」


    STEP 原文資料顯示本節是 ha./''e.Dot（H5713B），形態為陰性複數（HTd/Ncfpa），本節譯義 [are] the testimonies；簡要詞典義
    e.dah: testimony。同節的「律例」是 chu.Kim（H2706G），「典章」是 mish.pa.Tim（H4941G）。


    **三個詞在第44-45節是層級關係。** KC：「"The law" (verse 44) is the general designation of God''s
    commandments and is further specified in the designations "testimonies", "statutes"
    and "ordinances" in verse 45.」（第44節的「律法」是神誡命的統稱，第45節再用「法度」「律例」「典章」三個稱呼把它細分。）


    BH 的說法方向相同：「"Testimonies" often denote the covenantal laws that bear witness to
    God''s relationship with His people.」（「法度」通常指那些為神與其子民的關係作見證的約中之律。）


    **它與第26節的證人語言是同一個世界。** 第26節摩西呼天喚地「作見證」（ud，H5749B），第45節說這套律法本身就是「法度」（e.dah，H5713B）——證人與證詞用的是相關的語彙。'
