- title: 太22：36-39
  path: link_folder/互文/太22：36-39.md
  definition: 馬太福音二十二章36-39節記載耶穌回答律法師關於「律法上的誡命，哪一條是最大的」的提問。耶穌回答：「你要盡心、盡性、盡意愛主你的神。這是誡命中的第一，且是最大的。其次也相倣，就是要愛人如己。」耶穌將十誡歸納為兩大誡命——愛神（對應第一至四誡）和愛人（對應第五至十誡），揭示了十誡的核心精神。
  development: 耶穌的兩大誡命歸納源自申命記六5（盡心愛神）和利未記十九18（愛人如己）。使徒保羅在羅馬書十三9-10指出：「愛人如己」就成全了律法。約翰一書四20-21強調愛神與愛人的不可分割。十誡因此不是冰冷的規條，而是愛的神學表達。
