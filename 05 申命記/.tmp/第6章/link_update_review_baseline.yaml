- title: 不可妄稱耶和華你神的名
  path: link_folder/神學/不可妄稱耶和華你神的名.md
  definition: 「不可妄稱耶和華你神的名；因為妄稱耶和華名的，耶和華必不以他為無罪」（出二十7）是十誡的第三條誡命，禁止人濫用或妄稱神的聖名。此誡命不僅禁止用神的名發咒、起假誓或行巫術，也禁止任何對神名的不敬、輕率或虛妄使用。神的聖名代表祂的品格和權威，妄稱神名即是對神本身的褻瀆和不敬。
  development: 新約中耶穌教導門徒禱告時要「尊神的名為聖」（太六9）。耶穌也擴展此誡命的內涵，指出人口中所出的話反映內心的狀態（太十二34-37）。雅各書教導不可起誓（雅五12）。第三誡不僅關乎言語，更關乎整個人的誠信和對神的敬畏——凡自稱屬神的人，其言行都與神的名相關，不可使神的名因自己的行為受羞辱。
