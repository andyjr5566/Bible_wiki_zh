- title: 以色列啊你要聽（sha.ma）
  path: link_folder/原文/以色列啊你要聽（sha.ma）.md
  definition: '申命記第五章第1節，摩西召齊眾人，開口第一個命令是「以色列人哪……你們要聽」。STEP 顯示這個「聽」是 she.Ma''（H8085G），命令式，簡要詞典義
    to hear: hear。


    這個字接著在本章走完一整圈：第23節「你們聽見從黑暗中出來的聲音」、第24節「我們又聽見他的聲音從火中出來」、第25節「若再聽見耶和華我們神的聲音就必死亡」、第27節「聽耶和華我們神所要說的一切話」與「我們就聽從遵行」，最後第28節換了主詞——「耶和華都聽見了」「這百姓的話，我聽見了」。同一個
    sha.ma，前半章是人聽神，第28節變成神聽人。


    **註釋家怎麼看這個開場。** BH 指出，這個呼召不只是要人耳朵收到聲音，而是帶著理解與順服的意圖去聽，並說這句話呼應了申命記6:4 的「Shema」，那是猶太信仰的核心宣告。KC
    注意到「聽」這個字連同「留心聽」在申命記裡反覆出現，為的是叫他們學會神所說的，然後照著去做；他並直說，聽與行分不開。


    GT《啟導本聖經申命記註釋》從結構上看：本章開始的話與四1相同，用誠懇且親切的呼喚來勖勉新一代。CT 則在話中之光裡把聽放在最前面——聆聽是指領受吸收從神來的啟示，並說聽是教育的開始。


    **它與本章其他兩個字連成一條線。** 第1節一口氣給了三個動作：你們要聽（sha.ma）、可以學習（la.mad）、謹守遵行（sha.mar 加 a.sah）。第27節百姓自己把最後兩個接了回去——我們就聽從遵行；第32節摩西再要求一次謹守遵行。整章的要求沒有離開這三個動作。'
