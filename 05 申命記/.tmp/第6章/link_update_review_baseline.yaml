- title: 亞伯拉罕
  path: link_folder/人物/亞伯拉罕.md
  definition: 聖經中信心之父，原名亞伯蘭，神將其名改為亞伯拉罕（創17:5），意為「多國之父」。神與他立約（亞伯拉罕之約），應許賜給他迦南地、使後裔極多、並在其中萬國因他得福（創12:1-3;
    15; 17）。
  development: '### 創21：順從、憂愁、與外邦人和睦


    創世記二十一章把亞伯拉罕放在三種處境裡，各家的著眼點不同，合起來剛好是一個人的三個面向。


    **憂愁不是不順從。** 第11節說他「因他兒子的緣故很憂愁」（CT 註「憂愁」的原文字義是「不以為然，沮喪」）。GT《聖經精讀本──創世記註解》給了兩個具體理由：一是按哈蘭當地的風俗，不能隨便驅逐給主人生過孩子的女僕；二是他對曾經以為就是立約之子的以實瑪利（創十七18）本有父愛。GT《啟導本聖經創世記註釋》與《串珠聖經註釋》都指出撒拉的要求違反了當時的法律。第14節「清早起來」隨即接上——CT
    說這表示他對神的話立即順從。憂愁與順從在同一段裡並存。


    **和睦不是妥協。** 精讀本在第24節稱他為「和平之子」（比照創十三9），說他從福音的精神出發欣然答應了亞比米勒的友好提議，並由此推出一句：真正的信仰人格不是排斥他人或獨善其身。但同一段裡他也沒有放棄權利——第25節他為被霸佔的水井指責亞比米勒。精讀本指出這是必要的次序：井是巴勒斯坦南部沙漠地帶遊牧民生存的必備條件、也是最大的財產，霸佔井水的行為常常成為戰爭的導火線，因此在締結友好同盟之前，必須先解決這個問題。


    **認識加深了一層。** 精讀本追蹤他對神的稱呼：最初稱耶和華為「至高的神」（創十四22），立割禮之約時已認得他是「全能的神」（創十七1），到本章第33節稱他為「耶和華永生神」——「告白神是與人立約並成就其約的神」（見[[耶和華永生神]]）。


    不過 KC 在同一段裡看見一根刺：亞比米勒要求他起誓不欺負自己與子孫（23節），這個要求本身就等於讓亞伯拉罕痛切地想起前一章的失敗。承認與提醒同時到來。


    ### 創22：他這一次沒有講價


    創世記十八章他為所多瑪與神反覆討價，一路從五十人講到十人；創二十二章神要他獻上以撒，他一句話也沒有回。CT 把這個對比說成他的難能可貴之處：對於神的要求，「亞伯拉罕並沒有表示質疑或據理力爭，反而定意默默地遵行」，並列出五項他沒有做的事——不與神理論、不為自己辯護、不為以撒求情、不與撒拉商量、清早起來立即行動。


    沉默不等於平靜。GT《聖經精讀本──創世記註解》明說：若以為他是以喜悅的心接受這道命令，「這是無視父愛、無人情味的解釋」；那一夜他很可能整夜不眠，心裡至少有三重矛盾（見[[清早起來]]）。經文只記他清早起來，沒有記這一夜。


    **他心裡在想什麼，只有新約說了。** KC 指出希伯來書十一章列舉的是舊約信徒憑信心所行的事，唯獨對亞伯拉罕記下他所想的——「他以為神還能叫人從死裡復活」（來十一19）；而他在自己的環境裡並沒有任何先例可以據以相信這件事。這個判斷在敘事裡留下兩處痕跡：對僕人說「我與童子往那裡去拜一拜，就回到你們這裡來」（5節），對以撒說「神必自己預備作燔祭的羊羔」（8節）。CT
    說前一句「應是憑信說話，而非誆言」；丁良才說後一句是他「不知不覺說了預言」（約一29）。


    **這是最後一次面對面。** GT 丁良才《創世紀註釋》在第16-18節下留了一句觀察：神在此指著自己起誓，而以色列人一切的好處都是藉著這誓來的（創二十四7、二十六3、五十24；出十三5；路一73；徒七17）；他接著補上一句——「亞伯拉罕雖然仍活了五十多年，聖書沒有記載神再顯現於他。」本章因此不只是他信心的高峰，也是他與神面對面往來的最後一次記載（見[[指著自己起誓]]）。


    ### 一個名字，四卷書共用的立約根基


    亞伯拉罕本人的故事在創世記結束，但「亞伯拉罕的神」這個稱呼卻在後面三卷書反覆出現，是神信實的憑據。出2:24 神聽見以色列人的哀聲，「記念祂與亞伯拉罕、以撒、雅各所立的約」；出3、4章神向摩西自稱亞伯拉罕的神，CT
    指出這個組合有三層意思——以色列眾先祖的神、活人的神（太22:32）、守約的神；出6章神更把「全能的神」（伊勒沙代）與「耶和華」分工——GT《舊約背景註釋》說前者是族長在世時就實現的那部分約，後者是長遠的應許，尤其是土地。出32章金牛犢事件後，摩西的代求正是回到這個名字：「求你記念你的僕人亞伯拉罕、以撒、以色列。你曾指著自己起誓說……」（v13）——亞伯拉罕之約成了摩西攔阻神烈怒最有力的根據。利26:42
    神應許被擄後仍要「記念我與雅各所立的約，與以撒所立的約，與亞伯拉罕所立的約」——四卷書、四百多年，同一句起誓沒有失效。'
