- title: 法老
  path: link_folder/人物/法老.md
  definition: 法老是古埃及君王的稱號。在創世記裡，它從一個背景稱號逐步變成敘事中的實際角色：創37、39 章只間接出現——波提乏被記為「法老的內臣、護衛長」，用來標示他所屬的埃及王廷體系；創40-41
    章法老親自作夢、召約瑟解夢並立他治理埃及全地；創45-47 章則由他發話接納約瑟全家、供應車輛並指定居地。
  development: '### 這位法老可能是誰


    CT 在創46:32 的背景註解裡給出一個判斷：「當時治理埃及的喜克索王朝，乃外來的牧羊民族，人稱其王為『牧羊王』。」GT《靈修版聖經註釋》從同一個角度解釋約瑟的策略為何奏效：「因為法老的祖先很可能是許克所斯人的遊牧民族，所以他或許會同情牧人，而埃及人絕不歡迎牧人住在他們中間。約瑟的策略奏效，雅各一家從法老的慷慨乃至埃及人所抱的成見中受益。」


    ### 王室的資源，與王室的核准


    創46 把法老的兩種作用分得很清楚。一面是資源：以色列的兒子們讓父親、妻子、兒女「都坐在法老為雅各送來的車上」（5節），遷徙才成為可能。另一面是權柄：住在哪裡仍須經他核可，所以約瑟說「我要上去告訴法老」，並豫先教家人怎樣回答「你們以何事為業」（31-34節）。KC
    注意到這似乎是法老慣常會問來見他之人的問題，約瑟因此先為他們作預備。


    ### 從創世記的恩主，到出埃及記的頭號敵手


    創世記裡的法老兩次都是主動的施恩者——收納約瑟一家、賜車輛田地；出埃及記卻是另一個法老，經文自始至終沒有給他名字。GT《中文聖經註釋》指出「法老」本不是人名而是尊稱，CT〔靈意註解〕逕自把他讀成一個屬靈記號：法老預表這世界的王撒但（約12:31；弗2:2）——出5章他加重苦工、扭曲真理（稱神的應許為「虛謊的言語」），KC
    說這正是撒但的策略模式（約8:44）。GT 丁良才把他從第一次拒絕（出5:2）到最終讓步，一路的退讓排成五格：不釋放→在這裡祭祀（出8:25）→不要走得很遠（出8:28）→只許壯年人去（出10:11）→留下羊群牛群（出10:24），而
    KC 判斷這一路的「認罪」沒有一次是真悔改——「只從行為的後果生出來的認罪」。到出11章，第十災打的正是他這個人：GT《舊約聖經背景註釋》說「法老在埃及被視為神明……如今他的兒子更被宰殺，這對於法老本人、王位、神性，都是打擊」。'
