  path: link_folder/歷史/進迦南應許.md
  definition: 出13:5「將來耶和華領你進迦南人、赫人、亞摩利人、希未人、耶布斯人之地，就是祂向你的祖宗起誓應許給你那流奶與蜜之地，那時你要在這月間守這禮」，第11節再說一次：「將來，耶和華照祂向你和你祖宗所起的誓將你領進迦南人之地，把這地賜給你。」CT
    指出第5節所列的是迦南地的原住民，「本節未提到的尚有比利洗人（參三8，17）和革迦撒人（參申七1），統稱迦南七族（參徒十三19）」。
  development: '**這應許是向祖宗起的誓。** CT 指出「你的祖宗」是亞伯拉罕、以撒、雅各，而「起誓應許」指神與以色列人的祖宗立約（創17:7-8；26:3-4；28:13-15）。GT《聖經精讀本》也說：「神與族長們立約的時候，每次都是應許後裔的繁榮和對迦南地的所有。」丁良才另補了幾處經文（創15:18，24:7；出6:8），並指出一件事：「聖書上記他們在曠野只守了一次逾越節（民九1-5），神本來預備叫他們不久就進迦南，但因百姓干犯主怒，以色列人就在曠野漂流了四十年，才得了所應許的迦南地。」


    **族名的抄本差異。** GT《中文聖經註釋》指出：「撒瑪利亞抄本在這節加上比利洗人和革迦撒人。七十士譯本亦有這七族的名稱，但次序不同。」


    **「流奶與蜜之地」是什麼意思。** CT 說這是「物產豐富之地（參申十一9～11）」，並解釋「奶代表動物的精華，蜜代表植物的精華」。BH 也指出這個描述所畫的是豐盛與興旺的圖畫，與以色列人在埃及和曠野的經歷成對比。


    **KC 把「進那地才真正獻上」讀成一個屬靈的次序。** 它注意到摩西講頭生分別為聖時，是把它說成「只有在百姓到了迦南地之後才發生的事」，並由此推論：「按神心意真正的奉獻，是與在天上認識基督裡的福分相連的。」'
