- title: 學習與教訓同一字根（la.mad）
  path: link_folder/原文/學習與教訓同一字根（la.mad）.md
  definition: '申命記第五章的頭一節和倒數第三節，各有一個動作扣在一起。第1節摩西要百姓「可以學習」，第31節神對摩西說「你要教訓他們」。中文一個是學、一個是教，原文是同一個字根
    la.mad。


    STEP 顯示第1節是 u./le.mad.Tem（H3925H，簡要詞典義 to learn: learn），第31節是 te.la.me.De/m（H3925G，簡要詞典義
    to learn: teach）。差別只在動詞語幹：基本幹是自己學，強調幹是使人學，也就是教。


    CT 的原文字義在第31節給「教訓」的解釋，正好把兩頭並在一起寫：「教訓」教導，學習。CT 在文意註解裡再說一次——『教訓』意指教導，使其學習。


    **這一對字定出了本章的傳遞路線。** 第1節摩西要百姓聽了以後學會；第31節神留摩西下來，把一切誡命、律例、典章交給他，再由他去教會眾人；第32節回到眾人身上，要他們照所吩咐的謹守遵行。學與教是同一件事的兩端，中間隔著一位中保。


    CT 在第1節的話中之光裡把這條路線整理成三段：聆聽是指領受吸收從神來的啟示；學習是指明白其中的意思和內涵；謹守遵行是指我們將所學到、所明白的，在生活中實踐出來。CT
    並說學習包括默想，記憶，寫下來，研討。


    KC 對第1節的重點是聽與行不可分：他呼籲他們去聽，好使他們學會神所說的，然後去做神所說的。BH 在第31節指出摩西作為教導者的角色是關鍵，因為他要負責把神的律法傳給百姓，這也凸顯教育在維繫盟約忠誠上的地位。'
