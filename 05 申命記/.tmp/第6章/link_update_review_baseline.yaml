- title: 除他以外再無別神
  path: link_folder/神學/除他以外再無別神.md
  definition: '申命記4:35 與39 兩次說出同一句話：「惟有耶和華─他是神，除他以外，再無別神」；「天上地下惟有耶和華他是神，除他以外，再無別神」。


    **這是本章論證的結論，不是前提。** 第32-34節先擺出三個反問——有沒有哪個民族聽見神在火中說話還活著？有沒有這樣的大事？有沒有哪個神從別的國中把一國人領出來？——第35節才說：「這是顯給你看，要使你知道」。CT
    文意註解：「32~34節顯明只有真神才能有如此的作為，故結論是：除祂以外別無真神。」


    **第39節多了兩個動作。** CT〔原文字義〕：「記在」返回，轉回；文意註解：「『今日你要知道』意指要從已過對神的經驗記取教訓」。所以第35節是「知道」，第39節是「知道，也要記在心上」——同一個真理被要求進入記憶。


    **GT《雷氏研讀本》一句話帶過重點：**「清楚地宣告絕對的一神敬拜（也見於39節）。」


    **BH 指出這句話的位置。** 「This exclusivity is a recurring theme in the prophetic literature,
    such as Isaiah 45:5, "I am the LORD, and there is no other; apart from me there
    is no God."」（這種排他性是先知書反覆出現的主題，例如以賽亞書45:5：我是耶和華，在我以外並沒有別神。）他並把第39節的「天上地下」讀成主權的範圍：「It
    reflects the ancient Near Eastern understanding of the cosmos, where heaven and
    earth encompass all of existence.」（這反映古代近東對宇宙的理解，天與地涵蓋了全部的存在。）


    **KC 從這裡推出敬拜的唯一結論。** 「It is altogether folly, contempt and the height of ingratitude
    to honor anything or anyone other than Him.」（去尊崇祂以外的任何事物或任何人，全然是愚昧、輕慢，也是忘恩的極致。）


    **CT〔話中之光〕把「知道」與「記念」連成教育次序。**「我們信神，知道祂，信託祂，記念祂。這是正確的教育順序。」'
