- title: 記號與經文
  path: link_folder/原文/記號與經文.md
  summary: 第8節「繫在手上為記號，戴在額上為經文」，STEP 為 'ot（H226H）與 to.ta.Fot（H2903）；第9節「寫在你房屋的門框上，並你的城門上」，STEP 門框為 me.zu.Zot（H4201）。CT 說後來猶太人文士把四段經文寫在小羊皮卷上放進皮匣，禱告時分別繫在手臂和前額；GT《雷氏研讀本》說掛在門上的那個稱為 mezuzah。GT《聖經精讀本》則認為這些話並不是讓人按照字面意義去一一奉行，而是象徵性地描述無論行動或內心都不可忘記神的話語。
  relation: 出13 的兩句話收束無酵節與頭生歸神，本章則把同一組動作接在示馬後面，並且多出第9節的門框與城門——這是既有條目原本沒有的一段。四段經文匣經文之中有兩段（申6:4-9、11:13-21）正是出自申命記，本章就是其中之一。
