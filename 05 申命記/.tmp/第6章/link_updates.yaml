- title: 得福（ya.tav）
  path: link_folder/原文/得福（ya.tav）.md
  summary: '第3節「得以享福」yi.Tav 與第18節「使你可以享福」Yi.tav，STEP 同為 H3190（ya.tav: be good）；第24節的「常得好處」則是 H2896B（tov），不同編號。CT 在第18節說按照神的旨意行事有兩樣眼前的好處：享福與得迦南地。'
  relation: 本章把這個字放在頭尾兩處，都接在「遵行」之後：第3節是進地之前的應許，第18節是行事準則之後的結果。第24節換字之後意思相近而用詞不同，中文讀起來像同一句話，原文分成兩組。
