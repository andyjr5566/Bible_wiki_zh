- title: 律例（choq）
  path: link_folder/原文/律例（choq）.md
  summary: 「律例」在本章出現於第1、2、17、20、24節，STEP 為 choq（H2706G）。CT 在第2節與第24節都說「律例」在此是律法的總稱，在第17節則說是律法的條規，是神向人的要求。第20節借兒子的問題把「法度、律例、典章」三個詞一起列出。
  relation: 本章讓這個詞從條文變成教材：第1節它是摩西要教的內容，第20節它成了兒子發問的對象，第24節則給出目的——遵行這一切律例，使我們常得好處。
