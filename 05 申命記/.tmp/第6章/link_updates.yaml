  path: link_folder/原文/法度（e.dah）.md
  summary: 第17節「誡命、法度、律例」與第20節「這些法度、律例、典章」兩次出現「法度」，STEP 為 e.dah（H5713B）。CT 說「法度」指律法的證詞，見證神對人的心意。
  relation: 申4 首次帶出這個詞，本章把它放進兩個新位置：第17節是命令句裡的三詞並列，第20節則出現在兒子的提問裡。也就是說，這個詞不只是律法的分類名稱，也是下一代會直接問起的東西。
