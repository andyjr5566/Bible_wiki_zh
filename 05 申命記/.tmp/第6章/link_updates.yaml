- title: 滅盡與除滅的雙同字（sha.mad）
  path: link_folder/原文/滅盡與除滅的雙同字（sha.mad）.md
  summary: '第15節「惟恐耶和華─你神的怒氣向你發作，就把你從地上除滅」，STEP 為 ve./hish.Mi.de./kha（H8045，sha.mad: to destroy）。CT 說以色列人如果因敬拜偶像假神而觸怒真神，其結局相當可怕，並指後來南北兩國先後滅亡、人民被擄分散列國，證明本節的警告並非虛假。'
  relation: 申4 用這個字根講違約的後果，本章第15節把它接在「忌邪的神」後面，成為隨從別神的直接代價。兩章的用法一致：這個字出現的地方，講的都是留在那地或被逐出那地。
  overview_review:
    signals:
    - development_blank
    accumulation_count:
