- title: 遵行
  path: link_folder/原文/遵行.md
  summary: 「遵行」在本章出現於第1、3、18、24、25節。CT 在第3節與第25節兩次做同一組區分：『謹守』重在指思想觀念的贊同和一致；『遵行』重在指行為上的遵照和實施。第18節把它接在「耶和華眼中看為正、看為善的」之後。
  relation: 本章從頭到尾用這個字扣住結構：第1節說律法是為了遵行而頒布，第25節說遵行就是我們的義。中間第18節換了一個判準——不是照自己看為正的去做，而是照耶和華眼中看為正的去做。
  overview_review:
    signals: []
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 典章
  path: link_folder/神學/典章.md
  summary: 第1節與第20節兩次出現「典章」，STEP 為 mish.pat（H4941G）。CT 說『典章』指審判，是神對人是否遵行律法的判定，並在第20節註解重複同一個定義。
  relation: 本章把「典章」放在一頭一尾：第1節是摩西要教的三種法律用語之一，第20節則是兒子問起的三個詞之一。中間第17節列三詞時換成了「法度」，所以整章其實在四個詞之間輪換。
  overview_review:
    signals: []
    accumulation_count:
    - 6
    - 7
    definition: keep
    development: keep
- title: 忌邪的神
  path: link_folder/神學/忌邪的神.md
  summary: 第15節「因為在你們中間的耶和華─你神是忌邪的神」，STEP 為 'el（H410G）＋ka.Na'（H7067H）。CT 說『忌邪』形容神對維護祂獨一、至尊的權利極其熱忱，絲毫不能容忍對立的人事物並存。GT《聖經精讀本》說這是將神擬人化的表現手法，並說神的「嫉妒」源自祂的屬性，是向自己百姓的又一種愛。
  relation: 本章把忌邪直接接在第4節的獨一之後：因為神是獨一的，隨從別神才會構成背叛。第14節先下禁令，第15節才給理由，第15節下半再給後果——這是本章唯一一處把神的屬性當作刑罰依據來用的地方。
  overview_review:
    signals: []
    accumulation_count:
    - 5
    - 6
    definition: keep
    development: keep
- title: 流奶與蜜之地
  path: link_folder/神學/流奶與蜜之地.md
  summary: 第3節「使你可以在那流奶與蜜之地得以享福」。GT《啟導本聖經申命記註釋》說「流奶與蜜之地」形容迦南地的富庶，與以色列人現居的曠野成強烈對比；GT《串珠聖經註釋》說它象徵土地肥沃、產品豐富；GT《雷氏研讀本》說這是住在曠野之人夢寐以求的地方，指一塊飽得灌溉的土地。KC 統計這個片語在聖經中出現將近二十次。
  relation: 本章只用了這個片語一次，位置很關鍵：它接在第3節的「謹守遵行」之後，是遵行的結果而不是既得的現況。第10至11節接著把這片地拆成城邑、房屋、水井、葡萄園橄欖園四樣具體的東西。
  overview_review:
    signals: []
    accumulation_count:
    - 5
    - 6
    definition: keep
    development: keep
- title: 大能的手
  path: link_folder/神學/大能的手.md
  summary: 第21節「耶和華用大能的手將我們從埃及領出來」，STEP 為 be./Yad（H3027H）＋cha.za.Kah（H2389）。CT 說「用大能的手」指降十災、使紅海成乾地等神蹟奇事。
  relation: 本章讓這個片語出現在一個新場合：不是摩西對百姓講，而是父親對兒子講。第20節兒子問律法是什麼意思，第21節父親的回答就從這隻手開始——律法的理由被安置在一段救贖歷史裡。
  overview_review:
    signals: []
    accumulation_count:
    - 5
    - 6
    definition: keep
    development: keep
- title: 敬畏神
  path: link_folder/神學/敬畏神.md
  summary: 「敬畏耶和華」在本章出現三次（第2、13、24節），STEP 皆為 ya.re（H3372H）。CT 在第2節說『敬畏』指害怕惹神發怒；BH 說這種懼怕不是恐懼，而是承認神的聖潔與權柄。KC 指出在神面前敬畏祂與愛祂是連在一起的，而敬畏神就是對祂存敬重。
  relation: 本章把敬畏放在三個不同的位置：第2節是律法的目的，第13節是進地之後的要求，第24節是父親對兒子的解釋。這三處分別落在講章的開頭、中段與結尾，等於用同一個動作把整章框起來，而第5節的「愛」就夾在第2節與第13節之間。
  overview_review:
    signals:
    - many_accumulations
    accumulation_count:
    - 7
    - 8
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:4
      - 申命記:6
- title: 除他以外再無別神
  path: link_folder/神學/除他以外再無別神.md
  summary: 第4節「耶和華─我們神是獨一的主」與第14節「不可隨從別神，就是你們四圍國民的神」。GT《聖經精讀本》說第4節同時排斥了多神論、泛神論及單一神論；KC 說以色列的信仰是一神的，這給了人關於神旨意的確定性，而多神信仰缺的正是這份確定。
  relation: 申4:35、39 是以論證作結的宣告——先擺出三個反問，再說除他以外再無別神；本章第4節則不作論證，直接把它放在命令的最前面當前提。同一個真理在兩章裡的功能不同：申4 是結論，申6 是出發點。
  overview_review:
    signals:
    - development_blank
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:4
      - 申命記:6
- title: 傳於後代
  path: link_folder/神學/傳於後代.md
  summary: 第7節「也要殷勤教訓你的兒女」與第20至25節的父子問答。KC 指出聖經有四處記載兒子發問，本章第20節是第四處，另三處分別關乎逾越節（出12:26）、頭生的贖回（出13:14）與過約旦河（書4:6）。GT《串珠聖經註釋》說摩西不厭其煩地複述神在歷史中所施行的恩惠和拯救，為要把神在救贖中的恩典與以色列民應有的生活方式連接起來。
  relation: 出埃及記那幾處的父子問答都繫在一個節期或一件記號上，本章第20節問的卻是律法本身——這些法度、律例、典章是什麼意思。而父親的答案仍舊從出埃及講起，所以教導的內容雖然換了，敘事的起點沒有變。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 5
    - 6
    definition: keep
    development: keep
- title: 神的試驗
  path: link_folder/神學/神的試驗.md
  summary: '第16節「你們不可試探耶和華─你們的神，像你們在瑪撒那樣試探他」，STEP 為 te.na.Su／ni.si.Tem（H5254G，na.sah: to test）。CT 說『試探』原意試驗、考驗、驗證，是神試驗祂的子民的用詞，如今反過來，神的子民試圖迫使神照他們的意思伸手作事。GT 另指出這個字沒有現代「引誘人犯罪」的含義。'
  relation: 既有累積裡兩個方向都有：創22、出15、16 是神試驗人，出17 則已經是百姓在瑪撒試探神——該章的累積本身就寫著方向被翻了過來。本章第16節做的是第三件事：把出17 那個方向明文列成禁令，而且用的是同一個字。這一節也成了主耶穌在曠野引用的兩節之一。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 4
    - 5
    definition: keep
    development:
      decision: keep
