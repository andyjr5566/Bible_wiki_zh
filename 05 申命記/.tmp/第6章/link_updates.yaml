      - 申命記:6
- title: 學習與教訓同一字根（la.mad）
  path: link_folder/原文/學習與教訓同一字根（la.mad）.md
  summary: '第1節「所吩咐教訓你們的誡命」STEP 為 le./la.Med（H3925G，簡要詞典義 la.mad: to learn: teach）。本章第7節另有一個也譯作「教訓」的字，STEP 為 ve./shi.nan.Ta/m（H8150，sha.nan: to sharpen），與 la.mad 不同字根。'
  relation: 申5 那組 la.mad 講的是摩西與百姓之間的教與學，本章第1節沿用同一個字，但第7節把教導的場景換到家庭，並改用另一個字根。同一個中文詞「教訓」在本章之內就分屬兩個原文字，這是讀中文看不出來的分工。
  overview_review:
