  # ── C 類：新建條目 ──
  - name: 獨一（e.chad）
    type: 原文
    section: 原文
    evidence: 'v4「耶和華─我們神是獨一的主」，STEP ''e.Chad（H259，e.chad: one）。GT《雷氏》說第4節有許多不同譯法，可能是強調耶威的獨一性；GT《精讀本》說「獨一」並非相對的單一性而是絕對的惟一性；KC 從神的合一推出祂旨意的確定性。本庫尚無此條目'
    surfaces:
      - 耶和華─我們神是獨一的主
  - name: 你要盡心盡性盡力愛耶和華（a.hav）
    type: 原文
    section: 原文
    evidence: 'v5，STEP ve./''A.hav.ta（H157G，a.hav: to love）＋le.va.ve./Kha（H3824，le.vav: heart）＋naf.she./Kha（H5315G，ne.phesh: soul）＋me.''o.De./kha（H3966，me.od: much）。CT：靈、魂、體全人投入；GT《串珠》：「愛」尤指順從；KC 指出愛的命令從來不是地上的統治者會下的命令。與既有條目「盡心盡性尋求（ba.qash、da.rash）」不同節不同動詞，本庫尚無此條目'
    surfaces:
      - 盡心、盡性、盡力愛耶和華
  - name: 殷勤教訓（sha.nan）
    type: 原文
    section: 原文
    evidence: 'v7「殷勤教訓你的兒女」，STEP ve./shi.nan.Ta/m（H8150，sha.nan: to sharpen）。CT〔原文字義〕：「殷勤教訓」深刻地（教導），並說「教訓」原文「磨、使尖利」；GT《精讀本》：希伯來詞意為「使之銳利」或「紮」；BH 也說這個字含磨利或刻寫之意。與 v1 的 la.mad 不同字根，本庫尚無此條目'
    surfaces:
      - 殷勤教訓你的兒女
  - name: 非你所建造的
    type: 主題
    section: 主題
    evidence: 'v10-11 連用四次「非你所建造的」「非你所裝滿的」「非你所鑿成的」「非你所栽種的」。CT：表示坐享其成；KC 說這裡一再指出神的百姓為這些福分沒有出過力；BH 兩次把它連到弗2:8-9 的恩典。本庫尚無此條目'
    surfaces:
      - 非你所建造的
      - 非你所裝滿的
      - 非你所鑿成的
      - 非你所栽種的
  - name: 太4：1-11 耶穌在曠野受試探引用申命記
    type: 互文
    section: 互文
    evidence: 'v13 與 v16 是主耶穌受試探時三次引用申命記的其中兩次（第三次為申8:3）。GT《雷氏》在 v13 註明主受引誘時引述本節、六章16節與八章3節；GT《啟導本》說祂擊敗魔鬼所用的經文全部來自申命記；KC 逐一對應三次引用與三次試探，並指出魔鬼引詩91 時斷章取義。本庫已有「申8：3 人活著不是單靠食物」但只涵蓋第三次，尚無統攝三次引用的條目'
  - name: 遵行誡命是我們的義
    type: 解經爭議
    section: 解經爭議
    evidence: 'v25「這就是我們的義了」，STEP u./tze.da.Kah（H6666）。四套來源給出不同解法：CT 說意指滿足與神所立之約的要求；GT《雷氏》說遵守律法並不保證有永生，卻構成得到約之祝福的權利；GT《啟導本》說「義」是就立約關係而言；GT《精讀本》說它決不與因信稱義矛盾；BH 說這種義不是賺得救恩。本庫尚無此條目'
    surfaces:
      - 這就是我們的義了
