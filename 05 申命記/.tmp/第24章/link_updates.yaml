- title: 大痲瘋（sara'at）
  path: link_folder/原文/大痲瘋（sara'at）.md
  summary: 第8至9節：「在大痲瘋的災病上，你們要謹慎，照祭司利未人一切所指教你們的留意遵行……當記念出埃及後，在路上，耶和華─你神向米利暗所行的事。」GT《啟導本聖經申命記註釋》：「今天所知的痲瘋病不見於舊約時代的近東，原文saraat應作“皮膚惡疾”解。」BH 說 tzaraath 在希伯來文裡涵蓋多種皮膚病，不只是漢森氏病。CT 說『災病』的字根意思是「擊打」，並解釋大痲瘋狹義指皮膚像鱗片那樣剝落或無知覺，廣義指一切嚴重的皮膚病。GT《聖經精讀本──申命記註解》說這裡是命令百姓謹慎如實地遵行摩西曾在利13、14 章詳細教導利未人的條例；KC 注意到「謹慎」在這一節出現兩次，並說重點在祭司所教導的而不在祭司的檢查。
  relation: 前面幾卷寫的是這病該怎麼判、怎麼潔淨，本章寫的是百姓該不該聽——話不是對祭司說的，是對全體百姓說的。
  overview_review:
    signals:
