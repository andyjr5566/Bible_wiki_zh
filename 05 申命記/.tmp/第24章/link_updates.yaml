- title: 不可欺壓鄰舍雇工工價不可過夜
  path: link_folder/主題/不可欺壓鄰舍雇工工價不可過夜.md
  summary: 第14至15節：「困苦窮乏的雇工，無論是你的弟兄或是在你城裡寄居的，你不可欺負他。要當日給他工價，不可等到日落─因為他窮苦，把心放在工價上─恐怕他因你求告耶和華，罪便歸你了。」GT《聖經精讀本──申命記註解》：「這是關於雇工的律例。第一,要尊重其人格(14節),第二,不可遲發工價(15節;利19:13)。」GT《啟導本聖經申命記註釋》說不問是以色列同胞或是寄居的都不可欺壓，日落前應把工資給付；KC 引利19:13b、太20:8 與雅5:4。
  relation: 本章把利未記那條規定寫得更完整：加上了受雇者的身分不限本國人，也加上了不付工價的後果——他向耶和華求告，罪就歸雇主。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: keep
- title: 工價與雇約
  path: link_folder/文化/工價與雇約.md
  summary: 第15節：「要當日給他工價，不可等到日落─因為他窮苦，把心放在工價上─恐怕他因你求告耶和華，罪便歸你了。」CT 說明按時發放工錢乃是雇主的義務：「古時雇用臨時工，泰半按日發放工錢(參太二十8)，特別是窮人，沒有積蓄，只能指望拿到當日的工錢，好買食物養活家人。」GT《聖經精讀本──申命記註解》註「把心放在工價上」：雖然在主人看來那工價是微不足道的，對雇工而言卻是維持自己與家人生計的錢。BH 也說按日給付使工人能應付當天的需要。
  relation: 創世記那幾份雇約是雙方議定、可以更改的，本章的工價時限則由律法規定，而且違反的後果直接落在神面前。
