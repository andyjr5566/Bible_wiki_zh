- title: 寡婦衣裳
  path: link_folder/文化/寡婦衣裳.md
  summary: 第17節：「也不可拿寡婦的衣裳作當頭。」BH 說在古代近東外衣既是衣服也是被褥，拿寡婦的外衣作抵押會讓她在寒夜中失去遮蔽，這條命令強調的是財務往來中的憐憫與慈悲。CT 把寄居的、孤兒、寡婦並列為弱勢族群，並說官長理當為他們主持公義、伸張人權、照顧他們的需要。
  relation: 創世記那件衣裳標明的是她的身分，本章這件衣裳則被列為任何人都不可以拿走的東西，理由寫在下一節——要記念你在埃及作過奴僕。
