      - 申命記:24
- title: 米利暗
  path: link_folder/人物/米利暗.md
  summary: 第9節：「當記念出埃及後，在路上，耶和華─你神向米利暗所行的事。」CT 說米利暗是摩西的姐姐女先知，曾因批評摩西娶古實女子而長大痲瘋(參民十二10)，並說舉這件事是要人記取教訓；他另指出米利暗雖是先知又是婦女的領袖(參出十五20)，神責罰她時她也被關鎖在營外七天，沒有成為例外。GT 馬唐納《申命記》說舉她為例的用意可能是提醒在社會中地位最高者也不能倖免這種疾病；GT《聖經精讀本──申命記註解》說這是為了教訓無論是何人患了麻瘋病都當按照律例處置。KC 讀出的重點不同：她的事不是道德上的惡，而是結黨——她出於嫉妒挑戰摩西的領導，結果百姓七天不能起行。
  relation: 這是五卷書裡最後一次提到米利暗，而且她的名字被寫進了律法條文本身——不是作為女先知，是作為全民必須記念的鑑戒。
  overview_review:
