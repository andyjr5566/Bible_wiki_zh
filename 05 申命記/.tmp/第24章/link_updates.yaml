- title: 救贖
  path: link_folder/神學/救贖.md
  summary: 第18節與第22節兩次以同一句話收尾：「要記念你在埃及作過奴僕。耶和華─你的神從那裡將你救贖，所以我吩咐你這樣行。」CT 原文字義：「救贖」贖回，解救，並說以色列人從前在埃及地被有權有勢的人欺壓，投訴無門，幸而蒙神施予救援，如今理當飲水思源。GT《聖經精讀本──申命記註解》：「神根據滿有恩典與憐憫的出埃及救贖事件,命令以色列百姓當對貧窮而為社會所忽視的人施行恩典與憐憫。」BH 說這裡的救贖同時是身體的與屬靈的，指向神信實守約的作為。
  relation: 本章把救贖當成一連串社會條例的理由，中間的連接詞是「所以」——不可屈枉正直、不可拿寡婦的衣裳、收割要留下一部分，全都接在這句話後面。
