- title: 田角拾穗顧念窮人的條例
  path: link_folder/主題/田角拾穗顧念窮人的條例.md
  summary: 第19至21節：田間收割若忘下一捆不可回去再取，打橄欖樹枝上剩下的不可再打，摘葡萄所剩下的不可再摘，都要留給寄居的與孤兒寡婦。CT：「田主收割時不可割盡田角，也不可拾取所遺落的(參利十九9)，使窮人有機會充機」，並指出迦南人把遺留在田中的莊稼當作獻給偶像的祭物，但神要求把這些留給窮人。GT《申命記雷氏研讀本》：「路得從這律法中得益（比較得二3）。」GT《啟導本聖經申命記註釋》說拿俄米與路得靠這制度可以在以色列地生活下去。KC 注意到這幾節用的是忘記的角度——被留下的東西是收割的人漏掉的，得著的人仍要自己動身去撿。
  relation: 本章把這條例講得比利未記更細，並第一次寫進賜福的應許：這樣，耶和華必在你手裡所辦的一切事上賜福與你。
  overview_review:
