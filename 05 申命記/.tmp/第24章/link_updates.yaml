- title: 寄居的
  path: link_folder/原文/寄居的.md
  summary: 本章五次出現：第14節「無論是你的弟兄或是在你城裡寄居的」，第17節不可向寄居的和孤兒屈枉正直，第19至21節三次要留給寄居的與孤兒寡婦。GT《啟導本聖經申命記註釋》說做工的應得工價，不問是以色列同胞或是寄居的，都不可欺壓；BH 指出律法為外人提供保護（出22:21；利19:33-34），顯出神的不偏待人。
