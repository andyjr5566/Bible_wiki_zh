- title: 古代近東當頭制度
  path: link_folder/背景/古代近東當頭制度.md
  summary: 第10至11節：「你借給鄰舍，不拘是什麼，不可進他家拿他的當頭。要站在外面，等那向你借貸的人把當頭拿出來交給你。」CT：「『不可進他家』含意不僅是應當尊重債戶的主權，並且也是在防止債主任意選擇高價抵押品以牟暴利。」GT《聖經精讀本──申命記註解》說這是為了表明即便是債務人，債權人也不能毀壞他們的人格或家庭的神聖性；BH 說在古代近東，人的家是不可擅入的私人空間，這條規定保住了借貸者的尊嚴與主導權。
  relation: 背景資料描述的是窮人手上通常只剩一件外衣可押，本章規定的是別人不可以走進他家去挑——抵押品的種類由借的一方拿出來決定。
