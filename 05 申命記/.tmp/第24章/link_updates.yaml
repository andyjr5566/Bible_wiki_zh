- title: 追討罪自父及子直到三四代
  path: link_folder/神學/追討罪自父及子直到三四代.md
  summary: '第16節：「不可因子殺父，也不可因父殺子；凡被殺的都為本身的罪。」STEP：''a.Vot（H1G av）、ba.Nim（H1121A ben）、be.chet.''/O（H2399 chet: sin）、yu.me.Tu（H4191 mut，使役被動）三次。CT 說神公義的審判只追究犯法者個人，甚至親如父子也不予連坐問罪；GT《啟導本聖經申命記註釋》：「這是摩西律法與當時米所波大米的律法一大不同處。」GT《申命記串珠聖經註釋》註「被殺」指受死刑；GT《聖經精讀本──申命記註解》說立法是為了不使以色列隨從外邦人的連帶處刑法（結18:19,20）。KC 指出這與出20:5 的表面矛盾，並說解法在於分辨罪的刑罰與罪的後果；BH 舉王下14:6 亞瑪謝守此律法的實例。'
  relation: 本章這一節與出二十5 說話的對象不同：那裡講神怎麼追討，這裡講人的法庭不可以怎麼追討。
