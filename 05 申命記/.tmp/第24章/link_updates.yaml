- title: 拐帶人口
  path: link_folder/神學/拐帶人口.md
  summary: 第7節：「若遇見人拐帶以色列中的一個弟兄，當奴才待他，或是賣了他，那拐帶人的就必治死。這樣，便將那惡從你們中間除掉。」GT《啟導本聖經申命記註釋》：「此法例也見《出埃及記》二十一16，嚴懲販賣人口，犯者處死。」CT 在背景註解指出古代中東雖然到處都有奴隸買賣，但法律都禁止誘拐、綁架自由的公民成為奴隸，當時的奴隸絕大部分都是被自己的家人出賣或是戰俘；他並說拐帶已得自由的弟兄、讓他重新落在奴僕的捆綁下，是對神帶領百姓出埃及的背叛。GT《聖經精讀本》說聖經視誘拐犯為殺人犯，理由是誘拐犯徹底抹殺和蹂躪了按神的形象所創造的人之自由與人格。
  relation: 本章重申出二十一16 的死罪，並加上被害者的身分與收尾的一句——便將那惡從你們中間除掉。
  overview_review:
