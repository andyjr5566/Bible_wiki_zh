- title: 孤兒寡婦
  path: link_folder/主題/孤兒寡婦.md
  summary: 本章四次提到他們：第17節不可向寄居的和孤兒屈枉正直、不可拿寡婦的衣裳作當頭；第19至21節三次「要留給寄居的與孤兒寡婦」。CT 說「『寄居的與孤兒寡婦』是當時最軟弱無助的群體」，並指出神沒有自己另外去供應他們，而是把他們留在百姓當中，頒佈許多律例讓享用恩典的百姓去學習分享恩典。BH 說他們在古代以色列常缺乏家族支持，特別容易被剝削；GT《聖經精讀本──申命記註解》說對弱者的保護與關愛正是律法所不斷關注的（10:18,19；出22:21,22；利19:33,34）。
  relation: 本章給他們的位置是寫進禁令的受詞——別人不可以對他們做什麼。這是前面幾章那些供養與同席規定的前提。
