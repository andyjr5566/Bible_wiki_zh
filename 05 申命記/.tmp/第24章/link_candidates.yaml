book: 申命記
chapter: 24
candidates:
- name: 免服兵役的四種人
  type: 主題
  evidence: 'v5「新娶妻之人不可從軍出征，也不可託他辦理什麼公事，可以在家清閒一年，使他所娶的妻快活。」GT《啟導本聖經申命記註釋》：「本節乃准許新婚男子免役一年，得享室家之樂，也可以有子嗣承繼家門。」GT《申命記串珠聖經註釋》：「剛結婚者可緩兵役一年，使雙方得到適應，妻子感到快樂。」與申20:7 聘定了妻還沒迎娶的豁免同屬一組。'
  surfaces:
  - 不可從軍出征
- name: 當頭
  type: 原文
  evidence: 'v6、10-13、17 反覆出現。STEP v6：יַחֲבֹל ya.cha.Vol 與 חֹבֵל cho.Vel（都是 H2254A，cha.val: to pledge）。CT 註『當頭』指借貸時用來擔保的抵押品；GT《申命記串珠聖經註釋》註 v12 的「當頭」：「在此指氈型鬥蓬（見出22:26注），以色列的貧苦人日間把它穿在身上作衣裳，晚上用它來作被子蓋。」'
  surfaces:
  - 當頭
- name: 古代近東當頭制度
  type: 背景
  evidence: 'v10-11「你借給鄰舍，不拘是什麼，不可進他家拿他的當頭。要站在外面，等那向你借貸的人把當頭拿出來交給你。」CT：「『不可進他家』含意不僅是應當尊重債戶的主權，並且也是在防止債主任意選擇高價抵押品以牟暴利。」BH 說在古代近東，人的家是神聖的空間，未經允許進入是侵犯個人界線。'
  surfaces:
  - 不可進他家
- name: 拐帶人口
  type: 神學
  evidence: 'v7「若遇見人拐帶以色列中的一個弟兄，當奴才待他，或是賣了他，那拐帶人的就必治死。」GT《啟導本聖經申命記註釋》：「此法例也見《出埃及記》二十一16，嚴懲販賣人口，犯者處死。」CT 在背景註解指出古代中東雖然到處都有奴隸買賣，但法律都禁止誘拐、綁架自由的公民成為奴隸。'
  surfaces:
  - 拐帶
- name: 大痲瘋（sara'at）
  type: 原文
  evidence: 'v8「在大痲瘋的災病上，你們要謹慎，照祭司利未人一切所指教你們的留意遵行。」GT《啟導本聖經申命記註釋》：「今天所知的痲瘋病不見於舊約時代的近東，原文saraat應作“皮膚惡疾”解。」BH：「Leprosy, or tzaraath in Hebrew, is a term used for a variety of skin diseases, not just Hansen''s disease.」CT 說『災病』的字根的意思是「擊打」。'
  surfaces:
  - 大痲瘋
- name: 米利暗
  type: 人物
  evidence: 'v9「當記念出埃及後，在路上，耶和華─你神向米利暗所行的事。」CT：「『米利暗』是摩西的姐姐女先知，曾因批評摩西娶古實女子而長大痲瘋(參民十二10)。」GT 馬唐納《申命記》說舉米利暗為例是一種提醒，即在社會中地位最高者也不能倖免這種疾病；KC 說她的事不是道德上的惡，而是結黨——她出於嫉妒挑戰摩西的領導。'
  surfaces:
  - 米利暗
- name: 不可欺壓鄰舍雇工工價不可過夜
  type: 主題
  evidence: 'v14-15「困苦窮乏的雇工，無論是你的弟兄或是在你城裡寄居的，你不可欺負他。要當日給他工價，不可等到日落。」GT《聖經精讀本──申命記註解》：「這是關於雇工的律例。第一,要尊重其人格(14節),第二,不可遲發工價(15節;利19:13)。」KC 也引利19:13b 與雅5:4。'
  surfaces:
  - 困苦窮乏的雇工
- name: 工價與雇約
  type: 文化
  evidence: 'v15「要當日給他工價，不可等到日落─因為他窮苦，把心放在工價上。」CT：「古時雇用臨時工，泰半按日發放工錢(參太二十8)，特別是窮人，沒有積蓄，只能指望拿到當日的工錢，好買食物養活家人。」BH 也說按日給付使工人能應付當天的需要。'
  surfaces:
  - phrase: 工價
    verses: [15]
- name: 孤兒寡婦
  type: 主題
  evidence: 'v17「你不可向寄居的和孤兒屈枉正直，也不可拿寡婦的衣裳作當頭」，v19-21 三次「要留給寄居的與孤兒寡婦」。CT：「『寄居的與孤兒寡婦』是當時最軟弱無助的群體」，並引詩一百四十六9 與申十18。BH 說他們在古代以色列常缺乏家族支持，特別容易被剝削。'
  surfaces:
  - 孤兒寡婦
- name: 寡婦衣裳
  type: 文化
  evidence: 'v17「也不可拿寡婦的衣裳作當頭」。BH 說在古代近東，外衣既是衣服也是被褥，拿寡婦的外衣作抵押會讓她在寒夜中失去遮蔽。CT 把寄居的、孤兒、寡婦並列為弱勢族群，官長理當為他們主持公義。'
  surfaces:
  - 寡婦的衣裳
- name: 寄居的
  type: 原文
  evidence: 'v14「無論是你的弟兄或是在你城裡寄居的」、v17、v19-21「要留給寄居的與孤兒寡婦」。BH 指出律法為外人提供保護（出22:21；利19:33-34），顯出神的不偏待人。GT《啟導本聖經申命記註釋》說做工的應得工價，不問是以色列同胞或是寄居的，都不可欺壓。'
  surfaces:
  - 寄居的
- name: 救贖
  type: 神學
  evidence: 'v18「要記念你在埃及作過奴僕。耶和華─你的神從那裡將你救贖，所以我吩咐你這樣行。」CT 原文字義：「救贖」贖回，解救，並說以色列人從前在埃及地被有權有勢的人欺壓，如今理當飲水思源。GT《聖經精讀本──申命記註解》：「神根據滿有恩典與憐憫的出埃及救贖事件,命令以色列百姓當對貧窮而為社會所忽視的人施行恩典與憐憫。」'
  surfaces:
  - 將你救贖
- name: 田角拾穗顧念窮人的條例
  type: 主題
  evidence: 'v19-21「你在田間收割莊稼，若忘下一捆，不可回去再取……你打橄欖樹，枝上剩下的，不可再打……你摘葡萄園的葡萄，所剩下的，不可再摘；要留給寄居的與孤兒寡婦。」CT：「田主收割時不可割盡田角，也不可拾取所遺落的(參利十九9)，使窮人有機會充機。」GT《申命記雷氏研讀本》：「路得從這律法中得益（比較得二3）。」GT《啟導本》也指出拿俄米與路得靠這制度可以在以色列地生活下去。'
  surfaces:
  - 若忘下一捆
  - 枝上剩下的
  - 所剩下的，不可再摘
- name: 追討罪自父及子直到三四代
  type: 神學
  evidence: 'v16「不可因子殺父，也不可因父殺子；凡被殺的都為本身的罪。」STEP：''a.Vot（H1G av）與 ba.Nim（H1121A ben），「本身的罪」是 be.chet.''/O（H2399 chet: sin）。KC 指出這與出20:5「追討他的罪，自父及子，直到三四代」看似矛盾，並說解法在於分辨罪的刑罰與罪的後果。'
  surfaces:
  - 凡被殺的都為本身的罪
- name: 休書（se.fer ke.ri.tut）
  type: 原文
  evidence: 'v1、v3「就可以寫休書交在他手中，打發他離開夫家」。STEP：סֵפֶר כְּרִיתֻת Se.fer ke.ri.Tut（H5612A se.pher: scroll: document 加 H3748 ke.ri.tut: divorce）。CT 原文字義：「休書(原文雙字)」離婚(首字)；文件，證書(次字)，並註『交在她手中』指正式的手續，不能經由第三者代理。GT 艾基斯《舊約聖經難題彙編》詳論這張證明書的作用；BH 說這份文件讓婦人有權再嫁，是以色列律法與周邊文化不同之處。'
  surfaces:
  - 休書
- name: 不合理的事（er.vat da.var）
  type: 原文
  evidence: 'v1「見他有什麼不合理的事」。STEP：עֶרְוַת דָּבָר ''er.Vat da.Var（H6172 er.vah: nakedness 加 H1697L da.var: word: case）。GT《申命記串珠聖經註釋》直接把它接回上一章：「「不合理的事」：23:14譯作「污穢」，指不潔淨的事（但不會是姦淫，因淫婦必須接受死刑），這裡或許指婦人生理的缺陷，如不能懷孕生育等。」GT《聖經精讀本》記下 Hillel 與 Shammai 兩學派的解釋；CT 說應指其言行嚴重違反常規。'
  surfaces:
  - 不合理的事
- name: 不可再娶被休的前妻
  type: 主題
  evidence: 'v1-4，重點在第4節：「打發他去的前夫不可在婦人玷污之後再娶他為妻，因為這是耶和華所憎惡的。」CT 話中之光：「1~4節原文是同一個長句，1~3節是假設前提，4節是得出結論。」GT《申命記雷氏研讀本》：「這段經文不能解釋為命令式的離婚，只是把現存的做法納入規則裏而已。」KC 說這個安排是為了阻止輕率的離婚；BH 說「玷污」在這裡不是對婦人的道德判決，而是律法下的身分。'
  surfaces:
  - 再娶他為妻
- name: 磨石不可作當頭
  type: 主題
  evidence: 'v6「不可拿人的全盤磨石或是上磨石作當頭，因為這是拿人的命作當頭。」STEP：רֵחַיִם re.Cha.yim（H7347 re.cheh: millstone，雙數）與 רָכֶב va.Ra.khev（H7393H re.khev: chariot: millstone），「命」是 Ne.fesh（H5315H ne.phesh: soul: life）。GT《啟導本聖經申命記註釋》：「取磨石作抵押，並非磨石本身有何金錢價值，而是作為一種生產工具，取去之後令人生活無著，以迫他還債。」KC：「This instrument is his life, and whoever takes this instrument in pledge, takes the life of his brother in pledge.」'
  surfaces:
  - 全盤磨石
  - 上磨石
- name: 個人擔罪與父罪及子的張力
  type: 解經爭議
  evidence: 'v16「不可因子殺父，也不可因父殺子」與出20:5「追討他的罪，自父及子」看似衝突。GT 艾基斯《舊約聖經難題彙編》用整篇處理這個難題，並解釋撒下12 大衛喪子與撒下21 掃羅七個孫兒被殺兩個例外；GT《聖經精讀本》引結18:18-20；KC 說解法在於分辨罪的刑罰與罪的後果；BH 引王下14:6 亞瑪謝守這條律法的實例。'
  surfaces:
  - 不可因子殺父
