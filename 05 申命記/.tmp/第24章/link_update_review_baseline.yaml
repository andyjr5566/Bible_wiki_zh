review_schema_version: 2
book: 申命記
chapter: 24
entries:
- title: 免服兵役的四種人
  path: link_folder/主題/免服兵役的四種人.md
  definition: '祭司講完鼓勵的話之後，換官長開口。申命記第二十章第5至8節裡，官長一連四次說同一句話——「他可以回家去」。這四種人不必上戰場。


    ### 三加一的結構


    經文其實分成兩次宣告。第5節「官長也要對百姓宣告說」帶出前三種人：建了新房屋還沒有奉獻的、種了葡萄園還沒有用所結的果子的、聘定了妻還沒有迎娶的。第8節「官長又要對百姓宣告說」才另起一段，加上第四種：懼怕膽怯的人。


    兩組的性質不一樣，各家的數法也因此不同。CT 在第5節的話中之光只算前面那組：「有三種人可以免除兵役(參5~7節)」；GT《啟導本》同樣說「本章講以色列人可以豁免兵役的三種情況：剛造好住屋、剛剛種了葡萄園，或者新婚」。GT《串珠》則把四種並列：「凡建築新房屋、辟種新葡萄園、剛娶妻的以及膽怯者皆可免服兵役。」GT《聖經精讀本》也是列出三項再加一句「並且,乾脆禁止膽小怕事之輩參加爭戰(8節)」。


    ### 前三種：還沒享用到的福氣


    三件事的共同點是開始了但還沒有享用。


    **新房屋還沒奉獻。** CT 說這裡的奉獻不是把房子捐出去：「『房屋…奉獻』指新建房屋的獻屋(參詩三十1)，是一種感恩的奉獻，奉獻者仍可得回房屋自己居住。」STEP
    顯示這個字是 cha.na.Kh/o（H2596，cha.nakh: to dedicate），同一節末尾又用一次 yach.ne.Khe./nu——「恐怕他陣亡，別人去奉獻」用的正是同一個動詞。BH
    說獻屋是一種禮儀行為，通常包括禱告與供物，把住處分別出來歸給神。


    **葡萄園還沒用果子。** CT 交代了為什麼要等：「新種的果樹，頭三年所結的果子，主人不能享用；第四年所結的果子，要當作初熟的果子獻給神；第五年以後所結的果子，才可以享用(參利十九23~25)。」GT《串珠》一句話說完：「「尚未用所結的果子」：即種葡萄園不足五年」。KC
    算的也是五年（利19:23-25），並把酒讀成喜樂的圖像（士9:13a）——先自己嘗過，才有得分給人。BH 這裡給的數字略短，說葡萄園通常要約四年才結出可收的果子。STEP
    顯示「用」是 chi.le.L/o（H2490I，cha.lal，本節譯義是 he has put to use it）。


    **聘定了妻還沒迎娶。** CT 說這是「已訂婚而尚未完婚的情況」。BH 補上文化背景：在古代以色列，訂婚是正式而有約束力的協議，地位近乎婚姻，只是尚未同住；要解除必須經過正式的休離程序。KC
    指出這一類人可以先成婚、先享受夫妻的親密，並把申24:5 列為同一組條例。STEP 顯示「聘定」是 ''e.Ras（H781，a.ra.s: to betroth），「迎娶」是
    le.ka.Cha/h（H3947I，la.qach，本節譯義是 he has taken her）。


    ### 第四種：懼怕膽怯的人


    第四種的理由完全不同——不是為了他自己，而是為了別人。「恐怕他弟兄的心消化，和他一樣」。CT 說得直白：「膽小者恐會影響士氣」。BH 說融化的比喻正好表達恐懼會傳染，也說明讓害怕的人先回家可以避免恐慌在軍中擴散。STEP
    顯示這一種人被形容為 hai./ya.Re''（H3373，ya.re: afraid）與 ve./Rakh ha./le.Vav（H7390 rakh:
    tender 加 H3824 le.vav: heart），而「消化」是 yi.Mas（H4549，ma.sas: to melt，Niphal）。


    KC 從新約找了個對照：保羅打發約翰馬可回去（徒15:38），因為馬可先前受不了旅途的艱難（徒13:13）；帶這樣的人同去，對福音的推進是妨礙而不是幫助。他又指出基甸就是照這一節執行的，結果一支本來就不大的軍隊走掉了兩萬兩千人（士7:3）。GT《雷氏研讀本》也把第8節接到士師記七章2、3節。


    ### 為什麼律法要主動裁減自己的軍隊


    各家的答案一致：因為勝負本來就不在人。GT《雷氏研讀本》說「這些豁免條例有助確保勝利是有賴耶和華（比較4節），表示參軍並不是首要的事」。GT《串珠》說「軍隊的品質比數量更重要。一隊優秀的軍兵是要完全委身於神，並對神在爭戰中的能力有絕對的信心」。GT《聖經精讀本》把兩點並列：「第一,若要參加實現耶和華之公義的耶和華之戰就當「完全委身」,第二,爭戰的勝敗並不取決於軍事力量,而單單在乎耶和華神的手」，並把它接到弗6:10-20
    的全副軍裝。KC 用的是提後2:4 的比方：合格的兵丁是能完全獻給主、不被別的事纏累的人。


    GT《啟導本》另提出一個比較貼近生活的動機：這些條例「目的不外保護財產不喪失或者讓一家一門有後，基本上所著重的是個人享受神賜福氣的權利」，並指出只有不聽從神命令的人才得不到這些福氣（二十八30）。BH
    的方向相同，說這條規定顯出律法對家庭與個人責任的重視。


    ### 適用範圍的限制


    GT《聖經精讀本》引猶太學者的說法提醒了一件容易忽略的事：「只有當以色列為攻打遠方之城而徵兵時,才可以實行免服兵役的優惠政策,而在與迦南人爭戰時人則不能有所例外。」也就是說，免役條例和第10至15節的招降條例一樣，屬於同一組管轄遠方城的規則。'
  development: '這條免役規定在聖經裡有後續。KC 指出新婚免役在申24:5 又出現一次，成為一條獨立條例；他又指出士師記七章3節的基甸是照第8節執行的實例——當基甸照這一節放人回家，兩萬兩千人離開，只剩一萬人，而神接著還要再減。GT《雷氏研讀本》也把第8節指向士師記七章2、3節。


    這條線的方向是一致的：申命記第二十章把主動裁減自己的軍隊寫成常規程序，士師記則把它推到極端，讓以色列在人數上完全站不住，好使得勝的歸屬毫無爭議。'
