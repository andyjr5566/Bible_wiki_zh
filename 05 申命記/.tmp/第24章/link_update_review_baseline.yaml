- title: 拐帶人口
  path: link_folder/神學/拐帶人口.md
  definition: 出埃及記二十一16「拐帶人口，或是把人賣了，或是留在他手下，必要把他治死」。CT 的原文字義給「拐帶」為「偷竊，偷走」、「人口」為「人」、「留在」為「被遇見，被找到」，並解為「拐賣人口的，無論已經賣掉或仍未賣掉，只要有拐帶的事實，就必須處死」。GT《中文聖經註釋》據此把這條罪歸類：「這是一種嚴重的偷盜行為……拐帶人口的目的，在古代是將其販賣為奴婢。因此，不論他已賣出，或仍控制在其手下，罪情都是一樣。」GT《聖經精讀本》同樣從字義出發：「相當於『拐賣』的希伯來語是『趁機偷盜』的意思……這是偷取了別人性命的人，就要用自己的性命來償還的原理。」KC
    則在偷盜的序列裡給它定位：綁架一個人是違犯第八誡，而「在一切偷盜的形式中，這是最壞的一種」。
  development: 拐帶人口在律法中同時觸犯第八誡（偷盜）與人身自由，因此刑度遠高於一般偷盜。KC 把它的界線推得更遠：使人完全依附自己、以致可以操縱他，使那人不再能作神所要他成為的人，屬靈上就是同一種罪。
