- title: 大痲瘋（sara'at）
  path: link_folder/原文/大痲瘋（sara'at）.md
  definition: '「大痲瘋」是和合本的譯法。STEP 語言資料顯示，利13:2 這個詞的原文是 צָרָעַת（H6883），逐字解作 a serious
    skin disease（嚴重的皮膚病）；同一節的「災病」則是另一個字 נֶגַע（H5061）。到了 v45 講患者本人時，用的是動詞形式 צָרוּעַ（H6879）。音譯拼法在來源中有兩種：GT
    艾基斯《舊約聖經難題彙編》寫作 sara''at，GT 賈斯樂郝威《聖經難解經文詮釋手冊》寫作 tsaraath。


    **它到底指什麼病？大部分來源都說：不是今天的痲瘋病。** 艾基斯的結論是「希伯來文sara''at並非單指皮膚病，而是一個統稱，包括所有皮膚及頭上所患的，會影響外形的病」；賈斯樂郝威說它「其實是一種對任何嚴重的皮膚疾患或皮膚感染，或無生命物質遭到污染的通稱」；GT《啟導本》說這個詞「可指真正的痳瘋病，也可以指其他皮膚的疾病」，主張譯作「皮膚病」較妥。GT《舊約聖經背景註釋》講得最硬：「漢森氏病最主要的病癥一個也沒有在經文中出現，反之所列的症狀卻顯示與漢森氏病無關。」照經文所記的描述，「現代醫學可以診斷為牛皮癬、濕疹、瘌痢、脂漏性皮膚炎，以及一系列的黴菌感染」。


    **但 CT 的說法不一樣。** CT 在 v2 註明：「『大痲瘋』狹義指皮膚像鱗片那樣剝落或無知覺，類似現代所謂的『漢森氏病(Hansen)』；廣義指一切嚴重的皮膚病。」GT《利未記雷氏研讀本》介於兩者之間：「雖然這用語包括現今稱為麻風的疾病（罕生氏病），但在人類來說，也指許多別的皮膚病。」


    **「擊打」是哪個字的字根，兩家說法不同。** CT 的〔原文字義〕把它歸給「災病」：「『災病』的字根的意思是『擊打』，暗示大痲瘋是神的『擊打』，是一些令人厭惡的東西，各人都視其為羞恥和禁忌。」GT《聖經精讀本》則把它歸給「大麻風」本身：「源於『打』、『抽打』一詞,希伯來人認為這個病是神的審判。」STEP
    語言資料可以把兩個字分開來看：「災病」נֶגַע（H5061）與「大痲瘋」צָרָעַת（H6883）在本章是兩個不同的詞，v2 把它們合起來寫成「大痲瘋的災病」。


    **本章一開頭的三個症狀。** STEP 顯示 v2 列的三個詞分別是 שְׂאֵת（H7613，逐字解作 a swelling，腫起）、סַפַּחַת（H5597，逐字解作
    flaking skin，脫屑的皮膚）、בַהֶרֶת（H934，逐字解作 a bright spot，發亮的斑點），和合本譯作癤子、癬、火斑。GT《串珠聖經註釋》由此解釋了「毛變白」為什麼只是可疑而不是確診：「由於皮膚病是不會使毛的色澤改變，『毛變白』可能是指皮膚因乾燥而皮鱗脫落，黏貼在毛上，毛看來好像變了白色。」


    **診斷與判定。** 祭司看三件事：毛有沒有變白、患處是不是深於皮、有沒有發散（3、10、20、25、30）。不能立刻判定的就「關鎖七天」——STEP 顯示這個動詞是
    סָגַר（H5462）的使役形，逐字解作 he will shut up。條例另外處理幾種特殊情形：舊病復發不必再關鎖（11）、全身變白反而定為潔淨（12-13）、紅肉一顯露就是不潔（14-15）。衣服、皮子與經緯線上發綠發紅的黴斑，經文也用同一個字稱呼（47-59）。'
  development: '**利未記13章：判定。** 本章只做一件事——把人和物分進「潔淨」與「不潔淨」兩邊。流程是初察（2-3）→ 關鎖七天、必要時再七天（4-6、21、26、31、33、50、54）→
    復察定斷（6-8、13、17、23、28、34、37、55-58）。判為不潔的人要撕裂衣服、蓬頭散髮、蒙上唇、喊叫「不潔淨了」，並獨居營外（45-46）；判為不潔的衣物則洗滌、撕除，仍不除就焚燒（52、55、57）。


    **利未記14章：恢復。** 十三章沒有給人任何恢復的辦法，十四章才補上：痊癒者在營外行兩鳥禮，洗衣剃毛沐浴，第八天獻贖愆祭、贖罪祭、燔祭與素祭（14:1-32）；房屋的災病另有一套挖石刮灰、必要時全屋拆毀的程序（14:33-53）。GT
    丁良才注意到一個對比：人與房屋都有潔淨的禮儀，衣物卻沒有——「神沒有定什麼禮節使染大痲瘋的衣服或物件得以潔淨……乃是只憑祭司將那衣服或對像定為潔淨或不潔淨就是了」。


    **民數記：從條例走進歷史。** 民5:2 把「長大痲瘋的」列入必須送出營外的三類人，是本條例在行軍安營時的行政落實；民12:10 米利暗因毀謗摩西而長了大痲瘋，是條例第一次落在一個有名有姓的人身上。'
  signals:
  - first_in_book
  accumulation_count:
  - 4
