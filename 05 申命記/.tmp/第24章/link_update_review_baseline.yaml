- title: 米利暗
  path: link_folder/人物/米利暗.md
  definition: 米利暗是暗蘭與約基別的女兒、亞倫與摩西的姊姊，後來於舊約信仰社群被確認為女先知。出埃及記2章敘述其出場時尚未載具本身姓名，僅稱其「孩子的姊姊」；她在河岸邊遠處守望隨波之蒲草箱，並在法老女兒心生憐憫時機智上前求見建議代僱一希伯來乳娘，促速促回小童親母名正言順承養童生。
  development: 本章沒有把米利暗的行動描寫成偶然插曲。她能辨識法老女兒的憐憫，並以恰當問題提出可行方案；這既保全摩西，也避免直接暴露生母與孩子的關係。她日後在過海後帶領婦女歌唱，顯示她持續參與以色列的拯救歷史。
