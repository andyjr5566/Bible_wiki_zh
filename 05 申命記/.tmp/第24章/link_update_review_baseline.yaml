- title: 當頭
  path: link_folder/原文/當頭.md
  definition: CT 在出二十二26 給「即或拿」與「當頭」的原文字義是同一個字：「典當，抵押，綑綁」，並指「『衣服』指外袍；『當頭』指抵押品」。這條律例規定即使窮人自願以外袍抵押，債主仍須在日落以先歸還。GT《串珠聖經註釋》說明這件衣服是什麼：「指一種闊大長方形的鬥蓬，是窮人在夜間當作氈用的。」
  development: 當頭在本章受到兩重限制：不可拿人離不了的物件（丁良才引申二十四6、10-13），以及必須在日落以先歸還。這兩重限制使抵押制度在以色列幾乎只剩象徵作用——GT《丁道爾聖經註釋》說它「只能不斷提醒人欠債的事實」。
