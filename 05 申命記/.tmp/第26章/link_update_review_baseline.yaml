- title: 初熟
  path: link_folder/原文/初熟.md
  definition: CT 在出二十三16 給「初熟之物」的原文字義是「初熟的果子」，並在二十三19 指出「『初熟之物』和家庭裡的長子，以及頭生的牲畜一樣，原都是屬於神的」。GT《聖經精讀本》說明「首先初熟之物」的所指：「指當年的初產物中最好的⋯同時，這代表將來要收割的所有產物。從而，把初熟之物獻給神的行為，象徵一切產物是屬神的。」
  development: 'CT 指出「耶和華你神的殿」在當時尚無聖殿，「故指神居住的所在，即會幕中的聖所、至聖所」。KC 則說初熟之物屬於耶和華，這表明祂對全地出產的權利，而把「初熟之物中的初熟」據為己有是違反本性的。


    初熟之物該送到哪裡，幾卷書的答案逐步收窄。出埃及記二十三19 說要送到耶和華你神的殿；民數記十八12 把它劃進祭司的份；申命記十八4 則直接指名收件人——初收的五穀、新酒和油，並初剪的羊毛，「也要給他」，也就是給那位侍立事奉的祭司。


    申命記在這裡還加了一項別處沒有的東西。CT 在本節注意到：「聖經中僅此處提到羊毛歸祭司，初剪的羊毛未被玷污。」==前面幾卷講的初熟都是地裡長出來的，申命記十八章把牲畜身上第一次剪下的毛也算了進去。=='
