- title: 雅各
  path: link_folder/人物/雅各.md
  definition: 以撒與利百加的次子，以掃的孿生弟弟。名字意為「抓住腳跟的人」、「詭計者」、「代替者」（創25:26）。日後改名「以色列」（創32:28）。
  development: '### 創27：名字第一次被當作控訴


    第36節以掃說：「他名雅各，豈不是正對嗎？因為他欺騙了我兩次。」CT 註「雅各」的原文字義是「詭詐、篡奪」，GT《創世記雷氏研讀本》說這個名字的意思可以是「騙子」，BH
    則作「抓住腳跟的人」「取代者」。這是全卷第一次有人把這個名字當作指控使用。


    丁良才對這句控訴的公允性有保留：長子名分是以掃自己甘願起誓出賣的（創二五33），並非被強奪。所以以掃的話一半是真的——祝福確實是騙來的；一半不是。


    ### 他與神的距離，從稱呼看得出來


    第20節雅各說「因為耶和華**你的**神使我遇見好機會得著的」。CT 指出這個「你」字表明雅各此時對神缺乏主觀的認識與經歷；GT《啟導本聖經創世記註釋》把這條線索追到底：雅各一直到從哈蘭回來，才稱耶和華為「我的神」（創二八21；三三20）。KC
    從另一角度看同一句：說「你的神」正是以掃會用的口吻，因為以掃與耶和華沒有連結——雅各在扮演哥哥的時候，連神學語彙都換了。


    ### 起點與終點


    KC 把雅各的一生放在兩端之間看：他的歷史「始於欺詐與詭計」，而聖經記下他最後所作的一件事卻是敬拜（來十一21）。丁良才則指出中間那一段的代價：雅各雖騙得祝福，「當時並沒有得著神所應許的福氣；直等到他全然不依靠自己的時候才得著了」（創三三）。


    GT《聖經精讀本──創世記註解》把那二十年讀成必要的過程：使狡詐的雅各成聖、成為真實的以色列，需要時間——如同摩西的四十年曠野、以色列的七十年被擄。


    雅各在聖經中代表「屬靈的生命」（與以掃的「肉體」對比）：

    - 出生在後，得救不在乎人努力

    - 得救出於神揀選（「大的要服事小的」）

    - 喜歡與主交通（安靜）、活在教會中（帳棚）

    - 羨慕屬天福分（長子名分）

    - 肯出代價追求（以餅和紅湯交換）

    - 雖有屬靈渴望，但趁人之危的手段不正當

    - 日後經歷極大磨練，蒙福是靠神的揀選與保守


    ### 他的名字後來成了神信實的代號


    雅各死後，「雅各的神」反倒成了神向摩西自我介紹時最先掛上的稱呼之一——出3、4章神向摩西顯現，自稱「亞伯拉罕的神，以撒的神，雅各的神」（出4:5），CT 指出這是神「信守對三位先祖個別的應許」（給雅各的那一份見創28:13-14）；出33:1
    神重申「我曾起誓應許亞伯拉罕、以撒、雅各……要將迦南地賜給你的後裔」，把雅博渡口那一夜的應許接成離開何烈山、往迦南去的法理根據。CT 說出埃及記開頭幾節「可視為創世記的後書」——雅各家七十口下埃及的族譜（創46）正是出1章的起點；出6章的利未支派族譜也是從「以色列長子流便」順著雅各的兒子排下來的。利26:42
    神應許被擄後「記念我與雅各所立的約，與以撒所立的約，與亞伯拉罕所立的約」——GT 丁良才特別指出這裡的次序是「自下而上」，在聖經別處都是亞伯拉罕在先、雅各在後，唯獨這裡把雅各放在最前面。'
  signals: []
  accumulation_count:
