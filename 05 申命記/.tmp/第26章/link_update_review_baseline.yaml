- title: 下拜
  path: link_folder/原文/下拜.md
  definition: CT 在出二十四1 給「遠遠的」的原文字義是「保持距離」、「下拜」是「下拜，俯伏」。本章第1節神吩咐亞倫、拿答、亞比戶與七十長老「都要上到我這裡來，遠遠的下拜」——被召上山，卻仍要保持距離。CT
    解這一句為「可以越過山腳下四圍的界限，但距離山頂仍有一段相當的路程，大概就在山腰處遠遠的下拜」。
  development: 下拜在聖經中是敬拜的核心動作：創18:2亞伯拉罕下拜、出4:31百姓信而下拜、出12:27逾越節下拜、太2:11博士下拜、啟4:10二十四長老下拜、啟5:14四活物長老下拜。新約將「下拜」內在化為「靈與真理敬拜」（約4:23-24），不再受空間距離限制。
