- title: 聖物
  path: link_folder/主題/聖物.md
  definition: 指「分別為聖歸耶和華之物」。利未記5:15-16列舉誤犯聖物的情形：誤吃聖物、不獻初熟之物、不納十分之一、不贖頭生、用頭生公牛耕地/剪頭生羊毛、不守所許之願、或使會幕/神受虧損（CT、GT）。此類物品屬神所有，僅供聖工使用，不可挪作私用。誤犯者須按聖所舍客勒估價，獻「沒有殘疾的公綿羊」為贖愆祭，並「償還所虧欠的，另外加五分之一」歸祭司（5:15-16），祭司贖罪始蒙赦免。新約原則延伸：奉獻給神的財物、時間、初熟果子皆屬聖物，挪用即干犯聖物（啟導本、串珠）。
  development: 利未記5:14-16 專門處理「在耶和華聖物上誤犯了罪」的贖愆祭條例，強調聖物的專屬性與誤犯後的雙重補償（歸還本值+加五分之一罰款）。後續律法（利22:14；民18:16；申15:19；瑪3:8）進一步界定聖物範圍。新約雖廢除獻祭制度，但「將聖物歸聖」的原則仍適用於什一奉獻、初熟果子、主日、身體為活祭（羅12:1；林前6:19-20）。
