- title: 在耶和華面前歡樂
  path: link_folder/主題/在耶和華面前歡樂.md
  definition: '申命記第十二章三次要百姓在神面前歡樂：第7節「就都歡樂」、第12節「都要在耶和華─你們的神面前歡樂」、第18節「在耶和華─你神面前歡樂」。這三次都不是抒情，而是命令句，跟著獻祭與吃祭物的規定一起下達。


    STEP 顯示第7節的「歡樂」是 u./se.mach.Tem（H8055，簡要詞典義 sa.mach: to rejoice），全章三處同一個字。同一節裡另有兩個詞值得一起看：「你手所辦的」是
    mish.Lach（H4916A）配 yed./Khem（H3027U，簡要詞典義 yad: hand: undertake），「賜福」是 be.rakh./Kha（H1288，ba.rakh:
    to bless）。


    **歡樂的理由是被規定好的。** CT 在第7節說得直接：歡樂是因神賜福，而神賜福是因按照神的旨意行事。GT《啟導本聖經申命記註釋》在第12節說「歡樂」來自神的祝福，要成為以色列人在迦南安居後的享受。CT
    的話中之光另提醒，神的同在才是真正歡樂的根源，而信仰生活裡有時會出現錯誤的反應——只有懼怕，歡樂不起來。


    **這場歡樂有名單。** 第12節列的是你們和兒女、僕婢，並住在你們城裡無分無業的利未人；第18節再列一次。CT 在第12節說希伯來人注重家庭敬拜，不管是獻祭或守重大節期，常常是全家人一同參加，以使兒女建立敬拜神的正確態度。GT《聖經精讀本》指出把利未人放進這份名單不只是宗教性理由，也是在經濟上幫助他們的社會性制度，因為利未人專志於事奉神而未能得到生計所需的土地或其它財產。BH
    注意到名單裡連僕婢都在內，說這反映敬拜的共同性——全家不分身分一同分享神同在的喜樂。


    **KC 補了一個容易被跳過的環節。** 他指出第7節的福分不只被看作神所賜，也被看作他們自己動手做出來的成果；地的出產要靠雨水，但光有雨水不夠，屬靈的耕種、耙地、撒種、收割都是需要的，越多勞動，麥子、新酒和油的收成越多。所以這份歡樂是先有神賜福、再有人動手、最後才在神面前一起吃。


    **這一點在本章是有份量的。** GT《申命記串珠聖經註釋》的思想問題直接把它擺出來問：有人認為神是嚴峻的、不喜歡人歡樂，你同意嗎，並要讀者從本章找出以色列人在神面前歡樂的原因。BH
    則說在舊約裡吃喝與歡樂本來就是敬拜與慶祝的一部分，在神面前設筵象徵團契與對神供應的感謝。'
  development: '這道命令在申命記十二章下了三次，十四章是第四次，而且第一次交代了做不到的時候怎麼辦。


    十二章的三次都綁在獻祭與吃祭物上：第7節「就都歡樂」、第12節與第18節「在耶和華─你們的神面前歡樂」。命令句配上一份名單——兒女、僕婢，還有城裡的利未人。


    十四26 沿用同一個動詞（STEP 為 ve./sa.mach.Ta，H8055），但前面多了三節鋪陳。經文先說路可能太遠、東西可能帶不動，再說可以換成銀子帶過去、到了那裡再買回來，然後才接上這句「你和你的家屬在耶和華─你神的面前吃喝快樂」。CT
    的話中之光提醒這場歡樂的性質：它不是坐下吃喝、起來玩耍的狂歡和放縱，而是為了學習時常敬畏耶和華。


    名單也再擴一次。十二章的名單止於家中與城裡的利未人，十四章第27節重申不可丟棄利未人，第28至29節又加上每三年一次的周濟，讓寄居的與孤兒寡婦也吃得飽足。==歡樂在申命記從來不是私事：它有指定的地點、指定的理由，還有一份會愈來愈長的名單。=='
