- title: 亞蘭人
  path: link_folder/人物/亞蘭人.md
  definition: 亞蘭人（Arameans），居住在美索不達米亞北部（今日敘利亞東部）的閃米特族群。語言為亞蘭文，後來成為近東的通用語言。
  development: '### 譜系線索比族名的出現更早


    創世記二十二21 記拿鶴的兒子中有「亞蘭的父親基母利」。BH 指出這一筆把拿鶴的家系與亞蘭人連了起來，而亞蘭人是古代近東的重要族群，在舊約中屢與以色列往來。CT
    註「亞蘭」的原文字義為「高地」，「基母利」則為「神的會眾」。


    這條線索早於創二十五20 直接稱彼土利為亞蘭人的記載——族名在創二十五章才出現，血緣關係在創二十二章的名單裡已經寫下。'
