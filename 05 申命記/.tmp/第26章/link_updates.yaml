- title: 十分之一
  path: link_folder/原文/十分之一.md
  summary: 第12節「你取完了一切土產的十分之一，要分給利未人和寄居的，與孤兒寡婦」。GT《啟導本聖經申命記註釋》：「十分取一之年」為以色列人第三種什一奉獻（參利二十七30及注），以色列人每逢三年要取出土產的十分之一周濟窮人。KC：These tithes are not given to the LORD, but directly to those for whom they are intended.（這些十分之一不是給耶和華的，而是直接給那些它們原本要給的人。）他並說它們不像每年的十分之一被帶到聖所，而是被帶到城裡去分。BH 稱之為 poor tithe，並指這一份留在本城分給有需要的人。
  relation: 本條目前面收的是許願的語氣（創14、創28）與條文的語氣（利27、民18、申12、申14）；本章第13節換成第一人稱完成式的報告——我已將聖物從我家裡拿出來、給了誰、照著什麼命令、沒有違背也沒有忘記。
  overview_review:
    signals:
    - many_accumulations
    accumulation_count:
    - 6
    - 7
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 創世記:28
