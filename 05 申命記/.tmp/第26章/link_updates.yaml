    - 18
    definition:
      decision: keep
      basis: no_identity_change
    development: keep
- title: 寄居的
  path: link_folder/原文/寄居的.md
  summary: '第11節「並在你們中間寄居的」，第12至13節兩次與利未人、孤兒寡婦並列。STEP：ve./la./Ger（H1616，簡要詞典義 ger: sojourner）。CT 的原文字義：「寄居的」旅居者。BH 說寄居的是住在以色列人中間、卻不是本地出生的人，把他們算進來顯出神對所有人的顧念（出22:21）。'
  relation: 本條目已累積了寄居者從不可欺負到愛他如己的整條線；本章加上的是兩個場合的並列——同一段經文裡，寄居的既在第11節的筵席上與獻的人一同歡樂，也在第12節的名單上與孤兒寡婦一同受供養。
  overview_review:
    signals: []
    accumulation_count:
