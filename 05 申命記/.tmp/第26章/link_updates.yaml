    definition: keep
    development: keep
- title: 古代近東立約
  path: link_folder/背景/古代近東立約.md
  summary: 第16至19節具有古代近東條約的形式。GT《啟導本聖經申命記註釋》指出立約雙方莊嚴宣佈信守盟誓，摩西為此約的見證人，並列出雙方各自承諾的內容。CT 把兩邊的條款逐條拆開：以色列這一邊四項（認信耶和華是我個人的神、應承遵行祂的道路、承諾謹守祂的律法、答應聽從祂的話）；神這一邊五項（接納你應許的話、承認你為自己的子民、使你有能力謹守律法、立你超乎萬民之上、使你分別為聖專歸屬於祂）。STEP：v17 he.'e.Mar.ta 與 v18 he.'e.mi.re./Kha（同一個 H559 的使役語態），ka./'a.Sher di.Ber（H834D＋H1696I）兩次都在神那一邊——v18 中段與 v19 結尾，v17 則以 ve./li/sh.Mo.a' be./ko.L/o（H8085H＋H6963A）收尾。
  relation: 本條目前面幾章記的都是人與人之間的約——禮物、證物、地名、互不侵犯；本章記的是百姓與神之間的約，而形式是同一套：雙方各自宣告，並且要有見證人。
