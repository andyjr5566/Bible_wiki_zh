- title: 立約
  path: link_folder/主題/立約.md
  summary: 第16至19節。GT《啟導本聖經申命記註釋》：本段有若向神承諾的誓詞（參出二十四7），具有契約形式，立約雙方莊嚴宣佈信守盟誓，「摩西為此約的見證人」，一方為以色列民，承諾願為耶和華神聖潔的子民，一方為神，宣佈願為以色列人的神；神賜此約乃本乎祂的恩典，答應賜福給遵守此約的民。GT《聖經精讀本──申命記註解》：本章是結束摩西第二篇講章的結語，摩西以兩種律例再次論及了律法的兩大精神之後，重新申明了所立之約。GT《申命記串珠聖經註釋》的總結是：當先順服然後才蒙福。
  relation: 本條目前面收的立約多半是敘事裡的一次事件；本章收的是立約的形式本身——兩句對稱的宣告，雙方各說一次；以色列那一句以聽從他的話作結，神那一句則兩次援引他先前所應許的。
  overview_review:
    signals: []
    accumulation_count:
