- title: 聖潔的國民
  path: link_folder/神學/聖潔的國民.md
  summary: '第19節「並照他所應許的使你歸耶和華─你神為聖潔的民」。STEP：''am-（H5971A）ka.Dosh（H6918G，簡要詞典義 qa.dosh: holy）；同節的「稱讚、美名、尊榮」是 li/t.hi.Lah（H8416 te.hil.lah: praise）、u./le./Shem（H8034 shem: name）、u./le./tif.''A.ret（H8597 tiph.a.rah: beauty）。KC 說神的心意不只是把祂的百姓立在萬民之上，也是要擁有他們作一群分別出來、單單歸祂的百姓。BH 說被立在萬國之上不是靠軍事或結盟得來的地位，而是出於神的恩眷。'
