- title: 屬我的子民
  path: link_folder/神學/屬我的子民.md
  summary: '第18節「耶和華今日照他所應許你的，也認你為他的子民」。STEP：le./''Am（H5971A am: people）se.gu.Lah（H5459，簡要詞典義 se.gul.lah: possession）。CT 說本節是神回應的話，內容包括接納你應許的話、承認你為自己的子民、使你有能力謹守律法。BH 說 treasured possession 指極其寶貴、受保護的所有物，在古代近東的語境裡指君王最珍視、最受保護的資產，同一個詞也見於出19:5 與瑪3:17。'
  relation: 出19:5 是神在西乃山下單方面的宣告；本章第18節則是雙方對答的第二句——以色列先認耶和華為自己的神，神才照祂所應許的認他們為自己的子民。同一個身分，這裡是接在人的宣告之後給的。
