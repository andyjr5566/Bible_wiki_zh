book: 申命記
chapter: 26
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 初熟
  path: link_folder/原文/初熟.md
  summary: '第2節「將所收的各種初熟的土產取些來」與第10節「現在我把你所賜給我地上初熟的土產奉了來」。STEP：me./re.Shit 與 re.Shit（H7225G re.shit: first: beginning）＋pe.Ri（H6529）＋ha./''a.da.Mah（H127G）。CT 的原文字義：「初熟」首先、最好的；「土產」果實、(地上的)出產；並說『初熟的土產』指初收的五穀、新酒和新油，並初剪的羊毛（參申十八4）。GT《聖經精讀本──申命記註解》：各種初熟的土產代表著所有餘下土產，因此將這些獻給神是承認神對迦南地的所有權及統治權的行為。KC 說把果子帶來本身就是他們已經到了那地的憑據。'
  relation: 本條目前面幾章交代的是初熟之物送到哪裡、歸給誰；本章交代的是送去的人到了那裡要做什麼、說什麼——盛在筐子裡、交給祭司、放在壇前、說一段回顧民族來歷的話、下拜，再與利未人和寄居的一同歡樂。
  overview_review:
    signals: []
    accumulation_count:
    - 7
    - 8
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:18
      - 申命記:26
- title: 古代近東初熟果子奉獻
  path: link_folder/背景/古代近東初熟果子奉獻.md
  summary: 第1至11節是初熟奉獻在律法裡最完整的一次規定。GT《聖經精讀本──申命記註解》說各種初熟的土產代表著所有餘下土產，因此將這些獻給神是承認神對迦南地的所有權及統治權的行為。BH 說初熟是古代以色列農業社會的作法，把收成中最先也最好的一份分別給神，是承認神的供應與主權；並說把它放進筐子這個動作，表示敬拜是有預備、有心意的。GT《申命記雷氏研讀本》另外指出，這特別的獻祭顯然只在進入迦南的第一次收割後才進行，而他們每年也獻上初熟的土產，作為未來豐收的保證。
  relation: 出22 的背景資料講的是儲藏的實務——先分別出一份再封存收成；本章把同一個慣例寫成完整的程序，而且在程序中間插進一段必須親口說出來的民族來歷。
  overview_review:
    signals:
    - first_in_book
    - development_blank
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 出埃及記:22
      - 申命記:26
- title: 立他名的居所（中央聖所）
  path: link_folder/主題/立他名的居所（中央聖所）.md
  summary: 第2節「往耶和華─你神所選擇要立為他名的居所去」。STEP：le./sha.Ken（H7931 sha.khan，使居住）she.M/o（H8034 名）Sham（H8033G 在那裡）。GT《聖經精讀本──申命記註解》：指以色列唯一的中央聖所（12:5;16:2）。CT：指拿到耶路撒冷聖所。KC 說對以色列人而言，耶路撒冷是地上唯一的地方，百姓要在那裡聚集守耶和華的節期；外邦人在任何自己認為好的地方獻祭，神卻要親自為祂的百姓指定這個地方，並期待祂的百姓去尋找它。
  relation: 本章是這條規定的一次實際應用，而且是最具體的一次：不只說要去那裡，還說去了要交給誰、放在哪裡、說什麼話。第12至15節的第三年十一奉獻則正好相反——那一份不進聖所，留在本城。
  overview_review:
    signals: []
    accumulation_count:
    - 7
    - 8
    definition: keep
    development: keep
- title: 亞蘭人
  path: link_folder/人物/亞蘭人.md
  summary: '第5節「我祖原是一個將亡的亞蘭人」。STEP：''a.ra.Mi（H761J，簡要詞典義 a.ram.mi: Aramean）。CT：『亞蘭人』指雅各的母親利百加是亞蘭人（參創二十五20），雅各的兩個妻子利亞和拉結乃是母舅拉班的女兒（參創二十八5），故所生子孫也自稱亞蘭人；但若按照父系而言，以色列人是希伯來人。GT《啟導本聖經申命記註釋》說亞蘭是雅各逃避以掃所住的巴旦亞蘭地，他壯年大部分時間都在那裡度過。GT《聖經精讀本──申命記註解》特別排除一種誤解：這並不是指雅各是閃的五子之一亞蘭（創10:22）的後裔。'
  relation: 本條目前面幾章的亞蘭人是外族——利百加與拉班的家族；本章卻是以色列人自己用來稱呼列祖的話，而且是在最莊重的場合、對神說的第一句。這個族稱在這裡不是族譜資料，是一句承認自己出身卑微的話。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
    - 4
    definition: keep
    development: keep
- title: 雅各
  path: link_folder/人物/雅各.md
  summary: 第5節的「我祖」四家一致指為雅各。KC：Jacob is “a wandering Aramean” because he lived in Syria for twenty years and because his mother comes from there.（雅各是一個飄泊的亞蘭人，因為他在敘利亞住了二十年，也因為他的母親出自那裡。）他並說雅各曾走到死亡的門口，因為拉班曾想殺他；神卻把一個幾乎被殺的人變成了一個大族。CT 說『我祖』指雅各、『將亡的』指衰老瀕死；GT《申命記串珠聖經註釋》說雅各下到埃及的時候，已是一個老邁體弱的人。
  relation: 本條目累積了創世記大半卷的雅各生平；本章是那段生平被整個民族用一句話總結的地方——不是說我祖是以色列，而是說「我祖原是一個將亡的亞蘭人」。以色列人每次獻上初熟土產，都要從這一句說起。
  overview_review:
    signals: []
    accumulation_count:
    - 30
    - 31
    definition: keep
    development: keep
- title: 大能的手
  path: link_folder/神學/大能的手.md
  summary: 第8節「他就用大能的手和伸出來的膀臂，並大可畏的事與神蹟奇事，領我們出了埃及」。CT 逐一註明：『大能的手』形容祂大有能力的作為；『伸出的膀臂』形容祂拯救的範圍；『大可畏的事』指過紅海；『神蹟奇事』指降十災。CT 的原文字義另給「大能」強壯的、堅固的；「伸出來」伸展、延長；「可畏」令人懼怕；「事」記號；「奇事」奇蹟、預兆。BH 說這組意象強調神的大能與祂在人類歷史中的實際介入。
  relation: 本條目前面幾章的「大能的手」都出現在摩西對百姓的講論裡，是神對以色列說的話；本章卻是百姓自己在獻祭時要背誦的告白——同一句話從教導的口吻換成了敬拜者的口吻。
  overview_review:
    signals: []
    accumulation_count:
    - 9
    - 10
    definition: keep
    development: keep
- title: 流奶與蜜之地
  path: link_folder/神學/流奶與蜜之地.md
  summary: 第9節「把這流奶與蜜之地賜給我們」與第15節「就是你向我們列祖起誓賜我們流奶與蜜之地」。CT：形容迦南地乃是土地肥沃，適宜畜牧業、果林茂密之地；「奶」代表動物的精華，「蜜」代表植物的精華。GT《聖經精讀本──申命記註解》：指迦南本土的修辭辭令（11:9）。BH 說這個描述強調土地的豐饒，奶與蜜象徵富足與神的供應。
  relation: 本章兩次用到這個說法，而且分別放在兩段告白的收尾：第9節是初熟土產告白裡神已經做成的事，第15節是第三年十一奉獻告白裡向神求的事。同一片地，一次當作已領受的事實，一次當作祈求的內容。
  overview_review:
    signals: []
    accumulation_count:
    - 7
    - 8
    definition: keep
    development: keep
- title: 下拜
  path: link_folder/原文/下拜.md
  summary: '第10節「隨後你要把筐子放在耶和華─你神面前，向耶和華─你的神下拜」。STEP：ve./hish.ta.cha.Vi.ta（H7812，簡要詞典義 sha.chah: to bow）。CT 的原文字義：「下拜」下拜，俯伏。BH 說俯伏是敬拜、敬畏與順服神權柄的表達，是聖經中人遇見神的常見動作，反映敬拜者該有的心態。'
  relation: 這是本章整套獻初熟動作的最後一個身體動作：話說完、筐子放下，然後下拜。KC 指出第10節那句在耶和華面前敬拜，正是前面所有預備要達到的地方。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 第11節「你和利未人，並在你們中間寄居的」，第12至13節兩次「分給利未人和寄居的，與孤兒寡婦」。CT 說這幾句指的是在以色列人中無分無業的人們。BH 說利未人沒有分得地業，靠供物與百姓的慷慨維生（民18:24）。KC 把本章的四種人分別對應到主的僕人、還不認識主的人，以及失去天然依靠的人。
  relation: 本條目前面幾章的利未人多半以事奉者或受供養者的身分出現；本章讓他們同時出現在兩個場合——第11節是與獻的人同席歡樂，第12節是每三年一次直接領受那一份十分之一。
  overview_review:
    signals: []
    accumulation_count:
