      - 申命記:26
- title: 孤兒寡婦
  path: link_folder/主題/孤兒寡婦.md
  summary: '第12節「要分給利未人和寄居的，與孤兒寡婦，使他們在你城中可以吃得飽足」，第13節再列一次。STEP：la/i.ya.Tom（H3490，簡要詞典義 ya.tom: orphan）、ve./la./''al.ma.Nah（H490 al.ma.nah: widow）。CT 說這是在過節時拿出所積存的來周濟窮人並顧念無分無業的利未人。BH 說孤兒寡婦與寄居的代表社會中沒有能力自給的族群，這條規定讓群體的豐富分到所有成員身上，而目標寫的是「吃得飽足」，不只是活下去。'
  relation: 本條目前面幾章多半把孤兒寡婦寫在禁令裡（不可屈枉、不可拿當頭）；本章寫的是一筆定期、定量、留在本城的供應，而且分完之後奉獻的人要在神面前逐項交代自己確實分了。
  overview_review:
    signals: []
    accumulation_count:
    - 4
    - 5
    definition: keep
    development: keep
- title: 聖物
  path: link_folder/主題/聖物.md
  summary: '第13節「我已將聖物從我家裡拿出來」與第14節「我守喪的時候，沒有吃這聖物」。STEP：ha./Ko.desh（H6944G，簡要詞典義 qo.desh: holiness）。CT 的原文字義：「聖物」分別、神聖；文意註解說『聖物』指分別出來專為奉獻給神的物品，並說人在居喪期中是不潔的（參民十九11），不可觸摸聖物。GT《聖經精讀本──申命記註解》：本節是告白了被分別為聖為十一奉獻的聖物並沒有用在私人身上或被玷污。GT《啟導本聖經申命記註釋》補上依據：守喪期為不潔的時期（民十九11～13），不可以吃祭肉（利七20）。'
  relation: 本條目前面幾章的聖物在祭司與聖所的管轄下；本章的聖物放在自己家裡，要由本人拿出來，並且要由本人在神面前自陳沒有在守喪時吃它、沒有在不潔時拿它、也沒有為死人送去。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
