- title: 巴力（迦南主神）
  path: link_folder/背景/巴力（迦南主神）.md
  summary: 第14節「又沒有為死人送去」是本章可能提到巴力的一處，但各家並無共識。CT 說『為死人送去』可能指敬拜巴力（參詩一百零六28），並補上背景：在迦南神話中，巴力每年死而復活一次，帶來旱季和雨季的更替。GT《申命記串珠聖經註釋》同樣說「死人」可能指巴力神。GT《啟導本聖經申命記註釋》則先給另一種讀法（把需用的食物送往喪家），再對巴力說下了否定：「此說無可靠依據」。
  relation: 本章對這個名字只有一句可能的、而且被其中一家明白否定的指涉，不足以推進本條目對巴力崇拜的整體理解；倒是它記下了一項本條目原本沒有的迦南神話細節——巴力每年死而復活一次，帶來旱季與雨季的更替。
