- title: 吩咐、律例、典章、誡命四個詞
  path: link_folder/原文/吩咐、律例、典章、誡命四個詞.md
  summary: '第16節「耶和華─你的神今日吩咐你行這些律例典章」、第17節「謹守他的律例、誡命、典章」、第18節「使你謹守他的一切誡命」。STEP：v16 是 ha./chu.Kim（H2706G choq: statute: decree）與 ha./mish.pa.Tim（H4941G mish.pat: justice: judgement），後面接 be./khol le.va.ve./Kha（H3824 le.vav）與 u./ve./Khol naf.She./kha（H5315G ne.phesh）；v17 有 chu.Ka/v（H2706G）與 u./mitz.vo.Ta/v（H4687 mits.vah），v18 再用一次 mitz.vo.Ta/v。CT 的原文字義：「律例」法規、法令、條例；「典章」判決、判例、正義；「性」魂、自我；「誡命」命令。文意註解另把兩個動詞分開：『謹守』重在指思想觀念的贊同和一致，『遵行』重在指行為上的遵照和實施。'
