    definition: keep
    development: keep
- title: 在耶和華面前歡樂
  path: link_folder/主題/在耶和華面前歡樂.md
  summary: 第11節「你和利未人，並在你們中間寄居的，要因耶和華─你神所賜你和你家的一切福分歡樂」。CT：『一切福分』指五穀豐收所代表的福樂平安生活；『歡樂』指過節時歡喜快樂的氣氛所代表的喜樂與感恩；百姓與利未人和寄居者一起歡樂，指一起享用筵席、分享神所賜的一切福分。GT《聖經精讀本──申命記註解》：神希望且命令為了表示感謝而獻上的自己子民的出產，能夠用在將歡樂與喜樂分給所有人，尤其是在對待貧窮的鄰人的事宜上。BH 說這道命令是群體性的，反映與神立約的喜樂。
  relation: 本條目前面幾次的歡樂都接在獻祭與吃祭物之後；本章這一次接在一段告白之後——要先把「我祖原是一個將亡的亞蘭人」說完、把筐子放下、下拜，然後才歡樂。
  overview_review:
