- title: 三種什一奉獻的區分
  path: link_folder/主題/三種什一奉獻的區分.md
  summary: 第12節「每逢三年，就是十分取一之年」。CT 的背景註解列出以色列人要交納的三個「十分之一」，並指第三個是每三年一次分給本城的利未人、寄居的和孤兒寡婦（參申十四28~29；二十六12）。GT《聖經精讀本──申命記註解》：指以每一個安息年為基準，每逢三年（第三年與第六年），為了救濟窮人而特意獻上的所謂第三年十一奉獻，其用途與用來感恩慶祝的第二個十一奉獻相區別。GT《啟導本聖經申命記註釋》：「十分取一之年」為以色列人第三種什一奉獻。BH 稱之為 poor tithe。
  relation: 申14 回答的是有幾種，本章回答的是第三種怎麼結案：分給誰、在哪裡分、分完之後要在神面前說什麼。而這一份的特點是不進聖所、也沒有人監督，所以第13至14節那段自陳就成了唯一的把關。
