- title: 把那惡從你們中間除掉（ba.ar）
  path: link_folder/神學/把那惡從你們中間除掉（ba.ar）.md
  summary: '第13節「我已將聖物從我家裡拿出來」與第14節「也沒有拿出來」用的是同一個動詞。STEP：bi.''Ar.ti 與 vi.''Ar.ti（H1197I，簡要詞典義 ba.ar: to burn: purge），第一人稱完成式；同一個 H1197I 在申21:9、21:21、22:21、22:22、22:24、24:7 都是第二人稱的要把那惡從你們中間除掉。本章第13節的受詞不是「那惡」，而是 ha./Ko.desh（H6944G，聖物）。'
  relation: 這是這個動詞在申命記裡第一次不用在除惡上。受詞從要清掉的髒東西換成分別為聖的一份，人稱也從第二人稱的命令換成第一人稱的完成式——從一道待辦的命令，變成一句在神面前作結的報告。
