- title: 摩西的代求
  path: link_folder/神學/摩西的代求.md
  definition: 出9:29、33 是出埃及記第一次完整記下摩西「出城、向耶和華舉手禱告」使災止住。CT 指出摩西這樣做要向法老顯示三件事：他在法老面前是代表神的（7:1）、耶和華是全地的神、雹災的止住乃因法老認罪（27節）。舉手是舊約禱告的固定姿勢——CT
    舉伯11:13、代下6:13、拉9:15，GT《中文聖經註釋》另舉王上8:22、拉9:5、詩28:2、63:4、134:2、賽1:15、哀2:19，BH 則以所羅門在聖殿獻殿時舉手禱告（王上8:22）為例。
  development: 'KC 把摩西與以利亞並列：「像以利亞一樣，摩西也用禱告的能力開了天、又關了天」（雅5:17-18），並從第30節讀出一個榜樣：「摩西雖然知道法老不會放百姓走、心裡也沒有真正敬畏耶和華，他仍然答應為他禱告。這給我們一個榜樣：要為那些我們幾乎不抱指望會降服於主的人禱告。」KC
    也說明摩西禱告的目的不在災本身：「他為法老禱告的目的是，即使法老不悔改，也要叫他知道這地是屬耶和華的。」BH 指出攤開雙手是古代近東常見的祈求姿勢，表明「倚靠神的介入」。CT
    的話中之光則收在信心上：「出於信心的祈禱必會蒙神垂聽（雅5:15），認識神的人也能像摩西一樣憑信向人說話，並且有確實的把握。」


    申命記第9章把這個主題推到另一個對象上。出埃及記那幾章裡，摩西的代求多半是為法老、為埃及所受的災；申9:18-20、25-29 的代求則是為以色列自己，而且求的不是災的止息，是整個民族不被滅絕。


    分別在於代求的處境。為法老禱告時，摩西站在一個明顯不配的外人面前；為以色列禱告時，神剛剛說完「你且由著我」，並且提出讓摩西自己的後裔成為更大更強的國。==摩西沒有接下那個提議。==
    CT 在第25節的話中之光說他不重看他的後裔得昌大，而是為了神的名和神的榮耀向神求恩典。


    申9:26-29 的三個理由也值得單獨看：他們是你的產業、求你記念亞伯拉罕以撒雅各、免得那地之人說神不能。三個理由沒有一個建立在百姓的表現上——這正好接住同一章第4至6節那句「不是因你的義」。CT
    與 GT《申命記串珠聖經註釋》整理出的三條順序一致。'
