- title: 種子（ze.ra）
  path: link_folder/原文/種子（ze.ra）.md
  definition: '民數記24:7：「水要從他的桶裡流出；種子要撒在多水之處。」


    **STEP 給的本節譯義是「後裔」。** 原文 ve./zar.''/O（H2233H），STEP 給的本節譯義是 and offspring its，簡要義域是
    ze.ra: seed: children。BH 也是這樣讀的：這裡的 seed 指的是後代子孫，意思是以色列將來的世代同樣要蒙福。


    **「桶」在原文是雙數。** 「桶裡」是 mi./Dal.Ya/v（H1805，簡要義域 de.li: bucket），morphology 標的是 HR/Ncmdc/Sp3ms——雙數形，也就是兩隻桶。


    **各家怎麼解這一句。** CT 讀作人數：「水要從他的桶裡流出」形容以色列人數多如從桶裡滿溢流出的水，「種子要撒在多水之處」形容以色列人繁增迅速，且物產豐富，不缺飲食。GT
    丁良才《民數記註釋》明說這一句有兩種解法：「1以色列人要得著有河海，有泉源的迦南美地（申八7，十一11）；2他們要承受佳美的福分，如栽在溪水旁的植物（賽三十二20，四十四4，六十五22-23）。」


    **KC 從「桶」讀出工夫。** KC 說水從我們身上流出去給別人，這代表我們成為別人的祝福；而「桶」這個詞預設了勞動，因為要把桶裝滿是需要力氣的——我們從神的話裡自己發現的東西，才能拿去供應別人。'
