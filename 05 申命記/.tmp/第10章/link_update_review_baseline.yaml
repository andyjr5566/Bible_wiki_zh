- title: 亞倫卒於何珥山與祭司職任更替
  path: link_folder/神學/亞倫卒於何珥山與祭司職任更替.md
  definition: '民數記20:26：「把亞倫的聖衣脫下來，給他的兒子以利亞撒穿上；亞倫必死在那裡，歸他列祖。」第28節記下執行的過程，第29節記下全會眾為他哀哭三十天。


    **這是一場公開的交接。** CT 說明神為什麼要三個人當著會眾的眼前上山：「會眾只看見三人上山，後來覲見兩人下山(參28節)，雖然沒有親眼看見亞倫之死，卻可推知他死在山上，給他保留了大祭司的尊榮。」GT《啟導本聖經註釋》從制度面說明同一件事：亞倫祭司職位的轉移是以色列民生活中的大事，因此要舉行儀式讓會眾清楚看見，「由亞倫開始的一個時代已告終結，由下一代繼起的新時代已經開始」。CT
    另指出聖衣移交的份量：「聖衣的移交，代表事工職任的傳承，有時甚至代表聖靈能力的傳承(參王下二13~14)。」


    **這件事在新約被拿來論證一件更大的事。** GT 丁良才《民數記註釋》一句話點破：「亞倫既死了，就顯明他為祭司的職分不完全（參來七23-25）。」GT《聖經精讀本──民數記註解》把它分成兩層：祭司職分的不完全性——人因罪惡和死亡不能完全履行職責；以及祭司職分的暫時性——以色列的祭司只在活著的時候才能擔當職分，所以需要很多祭司。KC
    補上一個細節：亞倫在死之前親眼看見以利亞撒穿上他的衣服，他是在尊嚴與平安中離世的，不是被從百姓中剪除。


    **誰埋葬了他，來源都停在推測。** CT 註：「誰埋葬亞倫的屍體，應當不是摩西和以利亞，因為這樣就要不潔淨七天(參十九11)」，因此推測可能與摩西一樣是神將他埋葬了。GT
    丁良才《民數記註釋》給的理由更完整：摩西和以利亞撒若葬埋亞倫按律法就必不潔七天（十九11），「況且以利亞撒既受了大祭司的職任，連自己父母的屍體也不敢挨近，恐怕沾染不潔（利二十一11）」。KC
    的推測相反，他認為亞倫是由他的弟弟和兒子埋葬的（申10:6）。'
