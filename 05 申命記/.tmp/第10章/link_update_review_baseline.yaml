- title: 十句話
  path: link_folder/原文/十句話.md
  definition: 「十句話」（希伯來文 עֲשֶׂרֶת הַדְּבָרִים，asereth hadevarim，H6235、H1697）是希伯來人對十誡的稱呼（出34:28；申4:13，10:4）。出埃及記20章1節神頒布十誡時原文作「這一切的話」（אֵת
    כָּל־הַדְּבָרִים הָאֵלֶּה，H853、H3605、H1697、H428）。GT《啟導本聖經腳註》：「希伯來人稱『十誡』為『十句話』，是耶和華神在這裡首次吩咐以色列人的『這一切的話』。」這個稱呼強調十誡的本質是神所說的「話」而非法律條文——GT《丁道爾聖經註釋》在行文中把它譯作「十言」，並注明這是「借用典型的希伯來措詞」（出三十四28）。至於「十條誡」這個中文名稱，GT《中文聖經註釋》指出它同樣源出於出三十四28，而不是出自本章：五經中五段定言式誡命（出二十1-17；卅四11-26；利十九1-18；申五6-21，廿七15-26）「本身都沒有註明是十條誡」。
