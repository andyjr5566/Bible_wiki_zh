- title: 河、泉、源（na.chal、a.yin、te.hom）
  path: link_folder/原文/河、泉、源（na.chal、a.yin、te.hom）.md
  definition: '第7節形容美地時說「那地有河，有泉，有源，從山谷中流出水來」。中文讀起來像同義詞堆疊，原文卻是三個不同的字。STEP 標出：「河」是
    נַחַל（na.chal，H5158A，簡要詞典義 torrent: river），本節譯義 torrents of；「泉」是 עַיִן（a.yin，H5869M，spring），本節譯義
    springs；「源」是 תְּהוֹם（te.hom，H8415，abyss），本節譯義 deeps。


    CT 的〔原文字義〕給的中文正好對得上：「泉」是「眼目，水泉」，「源」是「深處」。文意註解再把三者的關係排開：「源指水源，泉指水的湧出，河指水的匯流。」也就是說，這三個字連著講的是同一件事的三個階段——水從深處來，從地面湧出，再匯流成河。


    第7節末尾在原文還藏著一個細節。STEP 把最後兩個詞標為 בִּקְעָה（biq.ah，H1237K，valley）與 הַר（har，H2022G，mountain），本節譯義是
    in the valley 與 on the mountain。和合本譯作「從山谷中流出水來」，BH 與 KC 讀到的則是山谷與山地並列：BH 說這樣高低起伏的地形適合多樣的農作與放牧，KC
    說水在低處也在高處，整片地都找得到。


    KC 另外提醒不要把「河」想得太小，他說這裡指的不是淺淺的小水而是江河，並引詩65:9-10；至於「源」，他理解為地底水庫湧出的深水。GT《聖經精讀本》把7到10節整段歸納成迦南地的三樣富饒，第一樣就是豐富的水源。BH
    則把這件事放進古代近東的處境看：水在那裡是農業與生存的關鍵，這份豐盛與埃及、與曠野的缺乏形成明顯對比。'
