  definition: 出二十四18「摩西進入雲中上山，在山上四十晝夜」。CT 指出「『四十晝夜』在聖經中象徵神的試煉」。GT 丁良才補上內容：「這四十晝夜摩西沒有吃飯，也沒有喝水（申九9；出三十四28）」，並列舉以利亞（王上十九8）與主耶穌（太四2）為同樣的例子——而在變像山上，摩西和以利亞同來見主。
