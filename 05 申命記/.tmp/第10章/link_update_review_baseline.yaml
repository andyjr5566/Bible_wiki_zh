- title: 皂莢木
  path: link_folder/原文/皂莢木.md
  definition: 皂莢木（今稱金合歡木）是西乃半島和死海沿岸曠野生長的堅硬木材。GT《中文聖經註釋》記其形態：「其樹出土上截不高，下截入土有三十至七十呎不等。此木不易朽爛，又不沉重」；《舊約背景註釋》說它「木質極硬，宜於製造聖幕及其陳設」；CT
    說它「產於西乃曠野，堅硬耐久」，並注意到「樹身帶刺、堅硬」。在出埃及記25章中被用作約櫃、陳設餅桌子與抬物用槓的核心材料，外表包上精金。CT 的靈意註解把皂莢木讀為「堅固的人性」，『像根出於乾地』（賽53:2）；KC
    則把「木」列為七類材料之一，說到主耶穌完全的人性。
  development: 皂莢木在出埃及記中的用途是逐層擴大的：出25章先用在至聖所與聖所的器具（約櫃、陳設餅桌子及其抬槓），出26章擴到整個會幕的骨架（豎板、閂、內幔柱、門簾柱），出27章與30章再用到燔祭壇與金香壇及其槓，出35章記百姓把家中的皂莢木拿來奉獻，出36至38章則是這一切的實際製作。同一種曠野木材，從神所指示的樣式，到百姓手中的奉獻，最後成為整座會幕從骨架到器具的共同材料。
