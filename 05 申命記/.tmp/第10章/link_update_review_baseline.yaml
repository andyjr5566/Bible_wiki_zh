- title: 大會的日子（qa.hal）
  path: link_folder/原文/大會的日子（qa.hal）.md
  definition: '第10節說石版上所寫的，是照耶和華「在大會的日子、在山上、從火中」對百姓所說的一切話。STEP 顯示「大會」是 קָהָל（qa.hal，H6951，簡要詞典義
    assembly），本節作 ha./ka.Hal；同一節的「從火中」是 mi./Tokh ha./''Esh（H8432 中間＋H784 火）。CT 的〔原文字義〕給「大會」是集會、會眾。


    這個詞指的是一個具體的日子。CT 說明那是以色列眾百姓經過兩天的自潔預備之後，第三天聚集在西乃山腳下迎接神降臨在山上的那一天。GT《聖經精讀本》給的時間更明確：出埃及第一年三月初，所有以色列百姓為了聆聽神所宣告的十誡，按照神的命令經過兩天的潔淨期之後，會集在西奈山腳下。


    GT《聖經精讀本》另外記下一個翻譯上的細節：希臘文的七十士譯本把「大會」這個詞譯成 ekklesia，也就是新約裡「教會」那個字（徒7:38）。這條線索讓這一節在後世的解經裡有了額外的份量。BH
    從同一個方向讀，說大會標示出立約的群體性——那是全民一起見證神的啟示、一起進入約的一天，也是理解以色列身分的基礎。


    值得留意的是這個詞在本章出現的位置。摩西不是在講立約當天的榮耀，而是在講金牛犢之前的鋪陳：那些字是在全民聚集的日子、從火中親口說出來的，緊接著第12節就是百姓快快地偏離。'
