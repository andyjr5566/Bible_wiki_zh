- title: 約櫃
  path: link_folder/主題/約櫃.md
  definition: 約櫃是會幕中最核心的器具，以皂莢木製成，內外包精金，內藏法版。CT 指出「櫃」稱法櫃，直譯為「見證的櫃」，表徵神與人立約的見證——「櫃在那裡，表明神在那裡，神的律法也在那裡」；GT《丁道爾》則指出「櫃」的原文英文傳統譯作
    ark，其實譯作 chest（箱子）更佳，挪亞「方舟」和摩西「約櫃」雖然英文同樣翻作 ark，在原文中卻是兩個不同的字。約櫃之上安放施恩座，成為神與人相會、施恩與啟示的中心。
  development: '約櫃在舊約歷史中代表神的同在與引導，後來被安置於所羅門聖殿的至聖所中。其屬靈意義在基督身上得著應驗，基督成為神與人相會的實體，祂完全滿足了律法的要求，並成為神榮耀同在的彰顯。


    民數記從兩個方向碰到約櫃，而且兩件事在同一章。民7:9 說車與牛不給哥轄子孫，「因為他們辦的是聖所的事，在肩頭上抬聖物」——這條定例後來被大衛忽略，付上了烏撒的性命（GT
    丁良才引代上十三7至末）。同一章的第89節則是它最正面的一次出現：神從法櫃的施恩座以上、二基路伯中間向摩西說話。==同一個櫃，靠近的方式錯了會死人，方式對了卻是神開口的地方。==


    CT 說明櫃中所存的三樣東西：兩塊法版（出25:16）、嗎哪（出16:34）、亞倫發過芽的杖（來9:4）。'
