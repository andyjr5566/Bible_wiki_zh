- title: 雅各家七十人與七十五人
  path: link_folder/解經爭議/雅各家七十人與七十五人.md
  definition: '創世記四十六章二十七節的希伯來文本計雅各家七十人，使徒行傳七章十四節則說七十五人。


    ### 計算方式


    - 六十六人：與雅各同行、由他所生的後裔，不計兒婦。

    - 七十人：六十六人加雅各、約瑟、瑪拿西和以法蓮。

    - 七十五人：七十士譯本在創四十六20增列約瑟的五名後裔；使徒行傳沿用這一希臘文本傳統。


    這些數字採用不同名單範圍，實際遷徙人口若計入未列名的妻子與其他女性，會高於七十。'
  development: '### 七十五人是怎麼來的


    CT 與 GT 丁良才、KC 給的是同一條線索：《七十士譯本》在創46:20 末了增列了五個名字——瑪拿西的一個兒子、一個孫子，並以法蓮的兩個兒子、一個孫子；因此全數成為七十五（參民26:28-37；代上7:14-20），司提反在徒7:14
    用的正是這個希臘文本傳統。GT 李道生《舊約聖經問題總解》數的方式略有出入：他記為瑪拿西的一個兒子瑪姬和一個孫子基列，並以法蓮的三個兒子書提拉、比結、他罕（民26:28、29、35）。GT《聖經精讀本》則不從名單增列著眼，而說七十五人是「七十人加上日後形成獨立家業的約瑟五個後代」（創50:23）。


    倪柝聲另給一種解法：七十人是「雅各家」的數目，七十五人「乃是並雅各的親族都在內」——徒7:14 的「全家」在原文是「親族」，範圍較廣。


    KC 對這件事的判斷很直接：兩個數字都對。


    ### 名單只記了誰


    GT《啟導本聖經創世記註釋》提醒：「這裡記的人數只是男丁，若加上兒婦，數目當然比這更大。」GT《創世記雷氏研讀本》說得更全：若把雅各的媳婦和孫兒，還有女婿和孫女兒（沒有列出）都包括在內，人數便不止七十人了。


    不過名單裡確實出現了兩個女性——第15節的女兒底拿與第17節亞設的妹子西拉。CT 坦承這個算法有矛盾：15節不算底拿，18節卻算西拉；而雅各有那麼多男孫，不可能只有一個女孫。他說聖經本身未作解釋，只能猜測是為27節的「七十人」豫作安排。丁良才的推測不同：底拿與西拉被提名，或者是因為她們沒有出嫁而且出名，雅各其餘的女兒和孫女大概都出了嫁。


    ### 三種讀「七十」的方式


    同一個數字，三家給的意義各不相同。CT 說「七十」在聖經裡是一個「今世完全」的數目字（但9:24；太18:22），表明「所有」以色列人（不分男女）都下到埃及，日後也「所有」都要蒙神從奴役中拯救出來。GT《聖經精讀本》拆成兩個因數：「70」是由數字「7」（有關神的救贖）及數字「10」（有關人類完全發展）而得出。KC
    則從六十六那一頭看：六是人的數字，人總是不及格，永遠達不到七所說的完全；而當約瑟（主耶穌的圖畫）與他的兒子被加進來，六十六的不完全就變成了七十的完全。'
