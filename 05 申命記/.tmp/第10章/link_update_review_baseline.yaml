- title: 摩西鑿石版（第二次法版）
  path: link_folder/事件/摩西鑿石版（第二次法版）.md
  definition: '出34:1-4,28 神吩咐摩西「鑿出兩塊石版，和先前你摔碎的那版一樣」，摩西照辦帶上西乃山，神在其上寫下十條誡。


    **兩次法版的差別，就在誰動的手。** CT 指出：「先前的那兩塊石版，無論是石版本身，或是其上的字，都是神的工作（參出24:12；31:18；32:15-16），如今卻被摩西摔碎了；第二次所做的版，是摩西遵照神的命令鑿成的。」GT《聖經精讀本》把這個差別讀得更重：「第一次立約的法版是神親自製作的，而第二次立約的法版則是摩西鑿出來的，在這一點上存在差異。從而第二次法版跟第一次法版比起來，減少了許多神性的權威和威嚴。」GT
    丁良才的一句話最短：「先前的石版是神的工作（32:16），人犯罪後雖得赦免，總是受虧損。」


    **但字沒有變。** CT 指出「摩西所做的石版，和先前神親手所做的石版，大小尺寸一模一樣」，並在話中之光補一句觀察：「神頭一次所寫的字和第二次所寫的字，是一樣的。儘管中間發生了許多的事，卻不能影響神的權柄……人當中雖然發生變化，但神卻沒有更改。」KC
    說同一件事：「頭一對石版被人的不忠打碎了，但那並沒有改變神的律法……神與祂百姓之間關係的根基，仍舊是律法。」


    **人鑿版、神寫字的分工。** CT 的話中之光把它總結成一條原則：「摩西鑿石版，神在其上寫字；神的工作，仍需人的配合」；另一條則是「摔碎容易，要鑿出新的石版困難；摩西雖然發的是義怒，但是人的怒氣，並不成就神的義（雅1:20）」。BH
    從新約回望這個分工：「The act of chiseling represents human participation in divine work」，並以腓2:12-13
    為對應。


    **KC 給了一組預表。** 「頭一對石版代表基督：祂來到自己的百姓中間，就被殺了。第二對石版是信徒的圖畫。神渴望他們顯出基督是誰。信徒在祂裡面，正如那兩塊版在櫃裡一樣。」——所以申10:2
    那句「這第二對必須放在櫃中」在 KC 的讀法裡不是附註，而是關鍵；「山上的摩西則是主耶穌的圖畫，祂正在按著自己的形像塑造祂的百姓」。


    **這件事的性質是赦免。** CT 的靈意註解一句話定調：「表明神恩慈的赦免，樂意重申前約」；GT《串珠聖經註釋》：「這表示神已赦免以色列，並與他們恢復關係。」'
