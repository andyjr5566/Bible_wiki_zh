- title: 古代近東賄賂
  path: link_folder/背景/古代近東賄賂.md
  definition: GT《舊約聖經背景註釋》為賄賂下的定義涵蓋面很廣：「賄賂一語包括了政府官員和審判官一切循非合法途徑獲得的收入。它通常在法律訴訟時發生，用意是影響其判決。」CT
    也說「任何不正當的金錢授受，一定會蒙蔽人的心眼，叫人無法分辨是非曲直」。
  development: GT《丁道爾聖經註釋》指出這條在以色列自己的歷史中如何被違反：「賄賂是文化仍未調和的社會中經常存在的危險。任何以色列的審判官都必須在此站穩立場（撒上十二3）。撒母耳的兒子也在這件事上失敗（撒上八3）。」BH
    也指出賄賂使人「失去道德與倫理的清明」，並把這種盲目與屬靈的瞎眼相連。
