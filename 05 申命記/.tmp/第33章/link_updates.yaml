- "title": "瑪撒（Massah）"
  "path": "link_folder/原文/瑪撒（Massah）.md"
  "summary": "第8節下「你在瑪撒曾試驗他，在米利巴水與他爭論」。CT 的原文字義給「瑪撒」的是誘惑、給「試驗」的是試驗、測驗，並說瑪撒字義試探，以色列人曾因缺水而跟摩西爭鬧、試探神（參出十七7）。GT《申命記串珠聖經註釋》說摩西（屬利未支派）曾在瑪撒受神試驗；GT《聖經精讀本──申命記註解》說這是淡然回顧了被摩西與亞倫所代表的利未支派在歷史中最艱難困苦的利非訂水事件（出17:1-7）與加低斯水事件（民20:1-13）。KC\
    \ 指出一個方向上的差別：出埃及記17章說的是以色列試探神，這裡說的卻是神在瑪撒試驗利未。BH 說瑪撒的意思是試驗，指出埃及記17章1至7節以色列人爭鬧要水、試探耶和華那件事。"
  "relation": "先前幾章的瑪撒都是百姓試探神的地點；本章把同一個地名放進給利未的祝福裡，KC 讀出方向剛好相反——這一次是神在那裡試驗利未，而利未通過了。"
