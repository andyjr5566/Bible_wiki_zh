- "title": "烏陵和土明"
  "path": "link_folder/原文/烏陵和土明.md"
  "summary": "第8節「論利未說：耶和華啊，你的土明和烏陵都在你的虔誠人那裡」。CT 說土明和烏陵是放在大祭司胸牌裡的兩塊石頭，用於尋求神的旨意（參出二十八30），原文字義給「土明」的是完美、給「烏陵」的是眾光。GT《申命記串珠聖經註釋》說土明和烏陵是兩塊放在大祭司胸牌裡的物件，用以尋求神的旨意；GT《聖經精讀本──申命記註解》說土明與烏陵各自具有完全與光的意思，是大祭司用來垂問神旨意的工具；GT《申命記雷氏研讀本》要讀者參看出埃及記28章30節的腳註。KC\
    \ 說這兩塊石頭說明利未是一群認識神旨意、又能把神旨意教導神百姓的祭司之民。BH 說土明與烏陵是大祭司用來明白神旨意的聖籤，放在決斷的胸牌裡，這句話顯出利未人替全國求問神旨意的角色。"
