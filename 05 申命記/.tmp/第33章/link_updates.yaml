- "title": "迦南地"
  "path": "link_folder/地點/迦南地.md"
  "summary": "第28節「以色列安然居住；雅各的本源獨居五穀新酒之地。他的天也滴甘露。」CT 說獨居五穀新酒之地指佔據迦南美地，「他的天也滴甘露」是生產五穀新酒的先決條件，此處暗示神對以色列人施恩不斷。GT《聖經精讀本──申命記註解》說天也滴甘露指五穀與葡萄酒豐盛的地、流奶與蜜之地迦南，並說天滴甘露隱含著神施恩典之意（創27:28）。KC\
    \ 說他們的眼目定在那地的祝福上，當他們得著那祝福時，就要不受攪擾地住在那蒙耶和華賜福的地上；他並引民23:9 說以色列將在萬民中獨居。BH 說五穀與新酒是興盛與神供應的象徵，這地的出產是神賜福與守約信實的可見記號。"
  "relation": "先前三十一章談的多半是這地怎麼分、怎麼守、住進去要注意什麼。本章只用一句話收住：以色列在那裡安然居住、獨居於五穀新酒之地——不再是條件，而是結果。"
