- "title": "產業（na.cha.lah）"
  "path": "link_folder/原文/產業（na.cha.lah）.md"
  "summary": "第4節「摩西將律法傳給我們，作為雅各會眾的產業」。CT 說產業形容律法的寶貴，供代代相傳與經營；他在話中之光引詩119:111 說「我以你的法度為永遠的產業，因這是我心中所喜愛的」。GT《聖經精讀本──申命記註解》說律法就是以色列的產業，是為了曉諭他們神兒女以色列從神所能領受的最寶貴之物（詩119:72）就是律法的事實，同時也是為了使以色列百姓將這寶貴的律法作為第一遺產來傳給後人。KC\
    \ 說律法、神的話語就是這百姓的產業（詩119:111上），並說若對神所說的話沒有愛，那地就無法得著也無法享受。BH 說律法被描寫成雅各後裔的一份基業，是神所賜、使以色列有別於列國的獨特禮物。"
