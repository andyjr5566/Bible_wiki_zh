  "summary": "第24至25節「論亞設說：願亞設享受多子的福樂，得他弟兄的喜悅，可以把腳蘸在油中。」CT 的原文字義給「亞設」的是快樂的，說多子的福樂指亞設支派生養眾多、得他弟兄的喜悅指與其他支派有良好的關係、把腳蘸在油中指境內盛產橄欖油；他並說亞設支派將來分得的土地靠近地中海（參書十九24~31），擁有肥沃的平原和通到海口的貿易路線。GT《啟導本聖經申命記註釋》說油指橄欖油，亞設支派居住地以產橄欖油著名；GT《靈修版聖經註釋》說腳蘸在油中是興旺的標誌；GT《聖經精讀本──申命記註解》說正如雅各的祝福（創49:20）一樣，摩西對亞設支派的祝福也是肥沃的沃土。KC\
    \ 把摩西給亞設的五項祝福逐一列出，並說亞設是十個支派中唯一在新約被提到、卻與大衛家無關的一個——路加福音記的女先知亞拿就屬亞設支派。BH 說把腳蘸在油中是豐盛與興旺的隱喻。"
