- "title": "長子名分"
  "path": "link_folder/主題/長子名分.md"
  "summary": "第17節「他為牛群中頭生的，有威嚴；他的角是野牛的角」。CT 說頭生的指他得著長子的名分、野牛的角指他大有能力，並說雅各長子的名分歸了約瑟（參代上五1），所以約瑟支派擁有以法蓮和瑪拿西兩個支派產業。GT《聖經精讀本──申命記註解》說為牛群中頭生的象徵具有力量與權勢的長子，約瑟繼承了因近親相奸罪而被剝奪的流便之長子權（創48:22、代上5:1,2）；GT《申命記串珠聖經註釋》說野牛是力大無比的動物，在此比喻約瑟支派的能力與強硬。KC\
    \ 說在他的兩個兒子以法蓮與瑪拿西身上，約瑟得了雙份、就是長子的份，摩西提到的牛與野牛說到力量，加強了長子這個意思。BH 說在古代近東，長子居於尊榮與權柄的地位，常領受雙份產業。"
