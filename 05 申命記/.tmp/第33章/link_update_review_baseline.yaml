- title: 瑪撒（Massah）
  path: link_folder/原文/瑪撒（Massah）.md
  definition: 瑪撒（希伯來文 מַסָּה，Massah，H4532）是摩西在利非訂為那地方所起的兩個名字之一（出17:7），和合本小字註為「就是試探的意思」。STEP
    語言證據顯示，該名詞源自動詞 נָסָה（nasah，H5254，意為「測試、試驗、試探」；出17:2 摩西責備百姓「為何試探耶和華」同用此字 תְּנַסּוּן，v7
    說明命名原因「又因他們試探耶和華」亦用此動詞不定詞 נַסֹּתָם）。CT 給的原文字義是「誘惑，試探」。GT《中文聖經註釋》說這個字根「含有試驗、試探、試煉等意義」，作為地名除本節外也出現在申6:16、9:28與詩95:8。GT《丁道爾聖經註釋》提醒中譯與英譯都有風險：「這字在希伯來語無善無惡，現代英語將它譯作
    tempt 和 temptation，雖然在字源學上無可厚非，卻有誤導讀者之虞（和合本譯『試探』也是同樣危險，翻作『測試』或許較為安全）。」GT《串珠聖經註釋》同調：「這字在原文不一定含惡意的成分；百姓希望試驗神是否在他們中間。」
  development: '**這個字為什麼難譯。** 分歧不在字義而在語氣：GT《丁道爾聖經註釋》與《串珠聖經註釋》都主張這個字根本身中性，是上下文（百姓要求神證明自己同在）才使它帶上惡意；CT
    的註解則直接把它讀成「不信任」的表現。兩種讀法在本章可以並存——因為經文自己給了理由：「耶和華是在我們中間不是？」


    **後世怎麼引用它。** GT《丁道爾聖經註釋》指出「詩篇九十五篇8節將瑪撒和米利巴相提並論，作為以色列不信和拒絕神的例子，但這不過是對句，並非將兩件不同的事件認同為一」。丁良才把瑪撒的引用線列到新約：民14:1-24、詩78:19-41、[[來3：8-9
    硬著心不可像瑪撒|來3:8-19]]。BH 也指出「不可試探神」的命令在申6:16直接以瑪撒為名。'
