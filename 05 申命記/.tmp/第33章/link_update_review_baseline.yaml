- title: 金牛犢事件
  path: link_folder/事件/金牛犢事件.md
  definition: '出32:1-6、19-20、35 記載的以色列人在西乃山下鑄造並敬拜金牛犢的事件。這隻像究竟是什麼，各家從字義與考古兩面下手。GT《丁道爾》先修正譯名：「將希伯來文
    `eg{el 一字譯作牛犢並不很好。這字所指的是年輕力壯的公牛，聖經甚至曾經用以形容三歲大的牛（創15:9）」；GT《串珠》的說法相同：「牛犢：壯牛，約三歲。」考古上有實物可比：GT《舊約背景註釋》指出「考古學家在好幾個遺址（基利波山、夏瑣、亞實基倫），都挖掘到青銅或其他合金製造的公牛或牛犢小像。但這些小像的長度都是只有三至七吋」，而
    CT 也從摩西「挨近營前」才看見（v19）推論「所鑄的牛犢不會太大」。


    它的來歷各家分歧。GT《精讀本》認為是模仿埃及的 Apis 牛神，並列出以色列人在埃及所見的整套神譜（像牛的 Apis、像人的 Ptah 或 Osiris、像鷹的
    Horus 和 Ra 等）；GT 引丁良才卻提出另一種可能：「以色列人未必效法埃及人的風俗，因為神在前不多的時候才敗壞了埃及的神（出12:12；民33:4），他們效法的或者是巴比倫有翅膀的牛神」；GT《丁道爾》則直接排除
    Apis 說：「這像不可能是模仿埃及聖牛亞皮斯（Apis）造成的，因為亞皮斯崇拜的對象不是偶像，而是天生有某種特殊斑紋，被視作牛神不斷化身的普通公牛。埃及女神哈妥爾（Hathor）沒錯是以母牛為代表，但性別不對。」


    它扮演的角色也有爭議。GT《舊約背景註釋》指出在迦南文化裡「所描繪的神明通常不取公牛或牛犢的外形，而是站在這牲畜的背上」，但同一則註釋認為本章不是這種情形：「經文亦無跡象顯示以色列人僅將金牛犢視為座台（如約櫃之為腳凳）。他們在『向耶和華守節』時崇拜這牛犢，顯示所觸犯的是十誡之第二誡而非第一誡。」GT《中文聖經註釋》則認為亞倫與百姓的認知不同：「在亞倫的觀念中，大概並不是以此金牛犢為神，乃是以這牛犢為神的腳凳，或是承載神的……百姓認這金牛犢為神。」'
  development: '出32 是現場，申9 是四十年後的自述，兩份記載擺在一起才看得出這件事在以色列記憶裡的份量。


    出32 從百姓的角度寫起：摩西遲遲不下山，百姓要亞倫為他們造神像。申9 則從摩西的角度重講，順序也不同——他先講自己在山上的四十晝夜、講那兩塊神用指頭寫的版，然後才切到山下。這個順序本身就是論證：神正在頒佈禁止造像的誡命時，山下的人已經在造像了。


    申9 另外補上三件出埃及記沒有寫的事。第一，第20節說耶和華也向亞倫甚是發怒要滅絕他，摩西為亞倫祈禱——CT 與 GT《申命記雷氏研讀本》都指出出埃及記三十二章並未記載這一段。第二，第18節說那次俯伏四十晝夜是「像從前」一樣，把禁食的次數講清楚了。第三，第25節又說一次照舊俯伏四十晝夜，CT
    因此提出一個問題：聖經僅記載摩西兩次在神面前四十晝夜，本節若不是重複記載第二次的事，便可能另有第三次。


    ==兩份記載的用途也不同。== 出32 記的是事情怎麼發生的，申9 用它來證明一句話——第6節的「並不是因你的義」。摩西沒有把這件事當成往事帶過，而是把它排在悖逆清單的第一位。'
  signals: []
  accumulation_count:
  - 2
  - 3
- title: 西乃山
  path: link_folder/地點/西乃山.md
  definition: 西乃山（Mount Sinai）又稱何烈山，是神向摩西顯現、頒布十誡和律法的聖山。出18:5提及「神的山」即西乃山，以色列人在此安營。CT指出神的山指西乃山，神在山頂上召見摩西（19:20），又稱何烈山（3:1）。GT指出西乃山脈一直延伸到利非訂，以色列人就在山腳下安營。BH指出西乃山是神與以色列立約的核心地點。
  development: '### 一座山的十個場景：從荊棘的火到利未記的落款


    西乃山（又稱何烈山，出3:1、24:13）在出埃及記到民數記之間被反覆重訪，每一次它承擔的角色都不同。


    **顯現，而不是住所。** 出3:1-2 摩西在何烈山看見焚燒的荊棘，是這座山第一次出現。但這座山從一開始就不是神的居所——GT《丁道爾聖經註釋》註出19:11
    說得很明白：「以色列從來沒有想像耶和華住在西乃山上，祂不過在此顯現而已。」它的位置也從來沒有定論：GT《舊約聖經背景註釋》指出「學者提出的不同地點超過了十二個之多」，而丁道爾雖取傳統的穆薩山，卻加了一句限制——「然而神學要點並沒有一個是和鑑定的準確性有關的。後世以色列人可能也不知道確實地點。」


    **集結與立約（出18-24）。** 出18 葉忒羅在「神的山」與摩西會面，百姓已在山腳下安營；出19 神降臨頒布十誡；出20 雷轟、閃電、角聲與煙霧使百姓遠遠站立，摩西獨自挨近幽暗；出24
    三種景象疊在一起——雲彩遮蓋、榮耀停住、形狀如烈火。GT《丁道爾聖經註釋》指出出24:16 那個「停」字希伯來原文是「居住」，後來的專用術語「舍吉拿」（shekinah）正是衍自這個動詞。


    **啟示與交付（出25-31）。** 出25 起，這座山成為會幕藍圖的頒布現場，摩西被吩咐照「山上指示的樣式」製造；出31:18 這段話語以神親手寫的兩塊法版作結——山上的四十晝夜有了實物的印記。


    **分界（出32）。** 同一座山在出32 裂成兩層：山上是啟示與代求，山下是偶像與放肆。摩西在山上山下之間的往返，正是中保職分的空間寫照；而百姓口中的「遲延」，指的就是他在山上的那四十晝夜。


    **更新（出34）。** 第二次領版的戒嚴比第一次更嚴——連約書亞也不得同行，山根不可放牧牛羊。同一座山，第一次以百姓毀約告終，第二次以摩西面皮發光與約的恢復收場。


    **落款（利26、民3）。** 利26:46「這些律例、典章和法度是耶和華與以色列人在西乃山藉著摩西立的」——GT《丁良才註釋》說這一節可視為利未記全書的總結，申明了出於誰、藉著誰、與誰、寫於何處、有何內容這五個要點。到民3，「耶和華在西乃山曉諭摩西的日子」已經成為一個時間座標，用來標定拿答、亞比戶獻凡火的那一刻。


    **新約的回望。** 加4:24-25 保羅以「西乃之約」與新約對比；來12:18-24 則把西乃山的可怕與錫安山的恩典並排——這座不能被準確定位的山，最後成了整本聖經衡量兩種靠近神之方式的標尺。'
