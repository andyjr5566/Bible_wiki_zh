- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  definition: 「瑪拿西」是約瑟長子，母親是亞西納（創41:51, 46:20）。CT 的原文字義作「使之忘了，忘記」；BH 指出這名字出自希伯來文動詞
    *nashah*（忘記）。約瑟解釋：「神使我忘了一切的困苦和我父的全家」（創41:51）。後成為以色列十二支派之一（以法蓮、瑪拿西雙支派取代約瑟）。
  development: '「忘記」不是記憶消除。CT 指出後來的事實證明約瑟並沒有忘記父親全家的人（創42:7；43:27、30），「因此這句話較合理的解釋，指的是忘記了他對父親家人的懷怨」；丁良才說：「約瑟忘了他的苦難，卻沒有忘了他的神。」CT
    並排出兩個名字的次序：「須先有瑪拿西的經歷，後才有以法蓮的經歷」——瑪拿西表明約瑟顛沛際遇的結束，以法蓮表明新生活豐盛的開展。GT《串珠聖經註釋》則說約瑟藉長子的名字，表明神已使他忘記多年的苦難以及在父家所遭遇的一切。



    ### 一個支派被切成兩半


    民數記32:33 摩西把西宏與噩的國分給迦得、流便，還有「約瑟的兒子瑪拿西半個支派」——這半個支派到第33節才出現在名單裡，經文沒有交代他們是什麼時候加入求地的。第39-42節接著記瑪吉、睚珥、挪巴三支瑪拿西子孫各自佔地。


    民數記34章讓這個後果第一次同時現形：第14節「瑪拿西半個支派也受了產業」講的是河東那一半，第23節「約瑟的子孫瑪拿西支派有一個首領」講的是要在河西分地的那一半。同一個支派在同一章裡分屬兩邊。BH
    指出這是理解以色列地理與政治格局的關鍵。


    民數記36章的問題也是從這個支派內部長出來的：西羅非哈女兒的產業如果外嫁就會流出本支派，提出問題與接受解方的都是瑪拿西人。


    到申命記3章摩西複述分地時，這個切割已經是既成事實，河東的那一半領走的是版圖最北的一塊。


    申命記4:43 給這個切割留下最後一個標記：「為瑪拿西人分定巴珊的哥蘭」，CT 說「瑪拿西半支派的人所得地業在河東的最北邊」。河東三座逃城分屬流便、迦得、瑪拿西，哥蘭是最北那一座——被切走的那半個支派，在制度上佔的位置就是這片版圖的北端。


    名字「忘記」那條線講的是約瑟個人如何處理過去；這條線講的是他的後代在地上被一條河切成兩半，而那個分割從民32 一路牽動到申4，中間還繞過了西羅非哈女兒的婚姻。'
