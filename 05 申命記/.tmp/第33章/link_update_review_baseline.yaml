- title: 迦南地
  path: link_folder/地點/迦南地.md
  definition: 神應許賜給亞伯蘭及其後裔的土地。位於亞細亞、歐洲和非洲三洲當中。「迦南」意為「紫紅色之地」，因盛產紫紅色染料。
  development: '### 地理範圍


    - 東至阿拉伯曠野，西至地中海

    - 南至西乃半島，北至黎巴嫩山

    - 東西寬約270里，南北長約600里


    ### 四大地理區域


    1. 沿海平原：非利士平原+沙侖平原

    2. 中央高山：黎巴嫩山→以法蓮山→猶太山地→南地

    3. 約旦河谷：米倫水→加利利海→死海

    4. 河東山地：含亞摩河、雅博河、亞嫩河


    ### 戰略價值


    - 在文化、商業、政治、軍事、交通上均居樞紐地位

    - 世界的「肚臍」（結卅八12原文）


    ### 從應許到眼見：這個地名在各卷裡的身分變化


    創世記裡它先是列國表上的一個名字（創10），接著成為亞伯拉罕受召前往、卻始終只能寄居的地（創12、13、17），到雅各一家下埃及時成了要離開的家鄉（創46-50）。出埃及記把它變成目的地——神在出6、出13
    反覆以「流奶與蜜之地」指稱它。利未記26 則加上條件：住在其中要守神的律例，否則地要吐出他們。


    民數記13 是這條線的轉折點：這是第一次有以色列人真的走進去，並且把東西帶回來。同一章裡，這地的四界（v21）、地形分區（v29）、土產（v23）與居民（v28-29）第一次被具體記下來。GT《民數記串珠聖經註釋》注意到探子的稱呼在這一章變了——他們說「你所打發我們去的那地」，而不是聖經慣用的「耶和華向他們起誓應許之地」，「他們改變了用詞反映他們心裡已忘了這是神應許之地」。應許之地在被親眼看見的那一刻，反而在他們口中失去了應許的身分。


    民數記14 把這個轉折推到底：同一塊地在一章之內被四種身分說了四次——百姓說它是「使我們倒在刀下」的地（v3），迦勒與約書亞說它「原是流奶與蜜之地」（v8），神說它是「我向他們的祖宗所起誓應許之地」而他們斷不得看見（v23），最後又說「你們所厭棄的那地」我必把你們的婦人孩子領進去（v31）。KC
    引詩106:24 下了定義：他們「藐視那美地」，「因為不信祂的話」——「否認神所賜的，其實就是否認神自己」。從創世記的應許、出埃及記的目的地、利未記的居住條件，到民數記13-14
    的證物與審判標準，這個地名走完了它在五經前四卷的完整弧線。


    ### 屬靈意義


    - 迦南地豫表基督徒憑信心所要承受的屬靈產業

    - 對以色列：應許之地，需要信心和屬靈爭戰

    - 對信徒：基督裏的「天上」（弗一3）'
