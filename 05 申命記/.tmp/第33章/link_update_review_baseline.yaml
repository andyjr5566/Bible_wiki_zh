  development: '便雅憫這個名字從一開始就帶著兩種說法。拉結難產將死時給他起名「便俄尼」，雅各卻改叫他「便雅憫」——KC 以這兩個名字對照苦難與榮耀，CT
    與 GT 則著重名字含義、拉結的難產，以及雅各為兒子的命運重新命名這個舉動。


    創世記後段，這個最小的兒子成了整場埃及考驗的支點：約瑟指名要見他（創42），雅各不肯放他南下（創43），銀杯藏在他的口袋裡（創44），最後成了兄弟相認的場合（創45）。雅各臨終的祝福把他描述成一隻撕掠的狼（創49:27），與他早年在故事裡的柔弱形象形成對照。


    到了民數記，便雅憫第一次以支派的身分站進隊伍：出埃及記第一章他還只是下埃及的眾子之一，民數記第二章他已經有了自己的首領（基多尼的兒子亞比但）、自己的人數（35,400）、以及一個明確的位置——西邊，與以法蓮、瑪拿西同營，因為他們都是拉結的後裔。GT
    丁良才說這三個支派「在法櫃後行走」，並指出「此處可解明詩八十1-2節的話」；KC 也引同一篇詩，說詩人求神在以色列受苦的日子像曠野的日子那樣顯出能力。BH
    則把這個支派日後的份量點出來：便雅憫雖小，卻出了以色列的第一位王掃羅（撒上9:1-2）與使徒保羅（腓3:5）。'
