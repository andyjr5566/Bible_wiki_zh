- title: 瑪撒米利巴是一次還是兩次
  path: link_folder/解經爭議/瑪撒米利巴是一次還是兩次.md
  definition: 出17:7 摩西給利非訂起了瑪撒與米利巴兩個名字；民20:1-13 記載加低斯另一次磐石出水，那地也叫米利巴。 同一件事有兩個地名、兩件事共用一個地名，加上詩95:8把兩名並列，使各家對「這究竟是一次還是兩次」
    給出不同答案。GT《丁道爾聖經註釋》把難處說得最清楚：「同一處地方起了兩個這樣的別名來紀念同一件事， 不是絕不可能，可是很反常。而且眼前經文也沒有暗示摩西的行為，有何值得批評之處。」
  development: '**主張兩次、且不必合併——《丁道爾聖經註釋》。** 它先把合併說的理由攤開：民20:13的事件同樣因爭鬧 得名米利巴，「這事明顯發生在西乃山之後，而摩西也因為行為有不妥之處而受到懲罰，被禁進入迦南（申一37）」，
    因此有人問兩章是否記載同一件史實、只是「不同的地方敘述同一件史實，記載稍為不同的例子」。但它的結論是 否定的：「這個假設是不必要的，我們也可以接受發生頭一次事件的地方只是叫瑪撒，第二個地方則只叫米利巴的
    看法。沙漠時常會遇上缺水的問題，相類的事件實在沒理由不會發生兩次。由於兩件事是如此相似，忘記哪個地名 所指的是哪件事並不出奇……話又說回來，如果一件事可以發生兩次，同一個名字也沒有理由不能用兩次。」
    它並拆掉詩篇的證據：「詩篇九十五篇8節將瑪撒和米利巴相提並論，作為以色列不信和拒絕神的例子，但這不過是 對句，並非將兩件不同的事件認同為一。」

    **主張傳統混雜——《中文聖經註釋》。** 它從地望入手：米利巴「實際地點是在西乃半島北部尋的曠野之加低斯 附近，或者竟是加低斯的另一名稱。所以在舊約裏面常有將這兩個名稱連在一起的（見民廿七14；申卅二51等）。
    為這原因，這故事大概不是發生在汛的曠野，也可能是後期的人混雜前人的口傳傳統而混淆了地名之故。」它在 註v7時把話說得更完整：「這經文背後的傳統，原有兩個故事，其後給混合為一了。事實上，以色列人在曠野生活
    那麼長久……經不同地區的傳統口傳後，會將之混雜或地點淆亂，是事所難免的。」這個立場與它主張神的山在 西乃半島北部是同一套推論（見 西乃山的地理）。

    **兩名都指利非訂——《舊約聖經背景註釋》。** 它一句話否掉地點混淆的前提：「瑪撒和米利巴不是別處地方的 名字，而是指利非訂一地。」

    **兩次，並且差別可以逐項列出——李道生與《啟導本聖經腳註》。** 李道生《舊約聖經問題總解》把兩次並排： 「第一次—是在出埃及後一個月……摩西沒有發怒，在利非訂（意休息）擊打磐石一次，未受神的責罰，他給那地方
    起名叫瑪撒（意試探），又叫米利巴（意爭鬧）……第二次—是經過了卅八年之久的曠野飄流生活。於正月間， 摩西向以色列民發怒，在加低斯（意分開）擊打磐石兩次，受到神的責罰。」《啟導本聖經腳註》補上關鍵差別：
    「第一次擊磐石，神命摩西用杖，使水流出；第二次神命摩西『吩咐』（民二十8）磐石出水，但摩西卻用了杖 『擊打』，沒有順服神的命令，因而受罰。」丁良才也主張有兩個米利巴：「在這兩次當中，間隔有三十多年。」'
