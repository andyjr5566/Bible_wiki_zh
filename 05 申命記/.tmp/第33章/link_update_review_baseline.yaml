- title: 耶書崙（ye.shu.run）
  path: link_folder/原文/耶書崙（ye.shu.run）.md
  definition: '申32:15突然換了一個名字叫以色列：「但耶書崙漸漸肥胖，粗壯，光潤，踢跳，奔跑，便離棄造他的神，輕看救他的磐石」。全章只有這一次，而整卷申命記另外兩次都在下一章（33:5、33:26）。


    ### 原文與字義


    STEP 顯示這是 יְשֻׁרוּן，音譯 ye.shu.Run（H3484，簡要詞典義 ye.shu.run: Jeshurun），morphology
    標為專有名詞。


    這個名字的意思，各家給的不完全一樣。CT 的原文字義給「正直的人」，說這是以色列人的暱稱，並列出申33:5、33:26 與賽44:2。GT《申命記雷氏研讀本》給的也是正直的人，並補上一句：這是一個親暱的用詞。


    GT《聖經精讀本──申命記註解》把兩條線都列了出來：七十士譯本把此詞譯為「蒙愛者」，德里支則譯成「正直人」或「義人」；它自己的結論是把兩者合起來，說耶書崙的含意是因蒙神眷愛而成為義人的以色列。KC
    說摩西稱這百姓為耶書崙，意思是真誠或正直。


    ### 為什麼在這一節用它


    用一個代表正直的暱稱，來開一段講背道的話，四家都看出這是刻意的。


    GT《申命記串珠聖經註釋》說耶書崙是一種暱愛的稱語、以色列的別號，這裡用來稱呼以色列乃針對並強調以色列的忘恩負義而言。GT《聖經精讀本──申命記註解》講得最直接：如此尊貴而有譽的名字，在本節竟用來表現以色列的邪惡；摩西之所以諷刺性地稱以色列為耶書崙，是為了責備以色列本當過著與名字相符合的生活，如今卻走上了邪僻的背道之路。


    KC 從另一個角度說同一件事：神把自己的屬性給了他的百姓，他們卻不去反映神，反倒開始誇耀自己的義，把一切榮耀歸給自己。


    ### 同一節的三個動詞


    「漸漸肥胖，粗壯，光潤」在原文是三個接連的動詞：sha.Man.ta（H8080，簡要詞典義 sha.man: to grow fat）、a.Vi.ta（H5666，簡要詞典義
    a.vah: to thicken）、ka.Si.ta（H3780，簡要詞典義 ka.sah: be sated）；接著才是「踢跳」va/i.yiv.At（H1163，簡要詞典義
    ba.at: to kick）。


    CT 說這是如同幼犢逐漸長大的樣子，接著就自以為可以離神獨立而不顧神的律法。GT《啟導本聖經申命記註釋》用的比喻更兇：以色列人的反應像肥沃的草原上養肥了的羊，變成野獸，狂踢狂跳，反過來咬主人的手。BH
    說這一連串形容詞強調的是豐足與放縱的程度，在古代近東，肥壯常與財富和成功連在一起，這裡卻用在道德與屬靈的下滑上。'
