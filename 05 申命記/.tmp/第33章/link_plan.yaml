  suggested_type: 原文
  evidence: '第2節末「從他右手為百姓傳出烈火的律法」。STEP 把這裡標成一個帶雙斜線的複合形式 e.she.//dat（H784，簡要詞典義 esh:
    fire，morphology 標為 HNcbsc//Ncfsa，本節譯義是 fire of// law），前面是 mi./mi.N/o（H3225G ya.min:
    right，字面是從他的右手）。CT 在話中之光說烈火的律法原文由火和律法兩個字合成，意思是如火的律法；他並引出24:17 說神在西乃山頒佈律法時耶和華的榮耀在山頂上形狀如烈火，又引申4:24
    與來12:29 說神乃是烈火、是忌邪的神。CT 的文意註解另給了兩個讀法：形容律法合乎神公義的性質，或指神在烈火中降下律法（參出十九18）。GT《聖經精讀本──申命記註解》給的兩個可能也相近：這句話似乎是意指在烈火中所賜的律法（4:33、出19:16）或起著烈火般作用的律法。KC
    說這裡講到律法像閃電的火光，並說在西乃山頒佈律法時伴隨著雷轟與閃電。BH 說火焰象徵神的聖潔、審判與能力，右手常與力量和權柄相連。'
