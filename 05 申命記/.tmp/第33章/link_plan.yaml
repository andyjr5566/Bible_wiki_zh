- name: 萬萬聖者與眾聖徒（qo.desh 與 qa.dosh）
  suggested_type: 原文
  evidence: '第2節說耶和華「從萬萬聖者中來臨」，第3節接著說「眾聖徒都在他手中」。中文兩處都用「聖」字，原文卻是兩個不同的詞：STEP 顯示第2節是
    me./ri.Vot Ko.desh（H7233 re.va.vah: myriad 加 H6944G qo.desh: holiness），第3節是 kol
    ke.do.Sha/v（H3605 加 H6918H qa.dosh: holy: saint，本節譯義 all holy [ones] his）。四套註釋在指涉上一致。CT
    說第2節的萬萬聖者指無數的天使；GT《申命記雷氏研讀本》說得最清楚：第2節的萬萬聖者是指天使，然而第3節的聖徒是指以色列人、神分別為聖的子民；GT《啟導本聖經申命記註釋》同樣說萬萬聖者指天使、聖徒指以色列人；GT《聖經精讀本──申命記註解》說第2節原文的字面含義是與一萬聖者一起，這裡的聖者指天軍天使，又在第3節說這裡的聖徒並非指天軍天使而是指以色列的子孫，並記保羅與司提反所說律法是藉天使經中保之手設立的（徒7:53、加3:19）似乎指的就是本文。KC
    的讀法在第2節與其他三家不同，他說萬萬聖者是指神自己的百姓，神在他們中間顯現。BH 說萬萬聖者很可能指天使。'
