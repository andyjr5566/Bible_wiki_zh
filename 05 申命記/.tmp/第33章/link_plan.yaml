- name: 設立律法者的分存留指什麼
  suggested_type: 解經爭議
  evidence: 第21節「他為自己選擇頭一段地，因在那裡有設立律法者的分存留。他與百姓的首領同來；他施行耶和華的公義和耶和華與以色列所立的典章。」這半句怎麼讀，四家不同。CT
    說設立律法者指有權訂立律法的首領，「有設立律法者的分存留」是說迦得支派自認領袖群倫、配分得那段地。GT《申命記串珠聖經註釋》直接給了另一個譯法：「因在那裡有設立律法者的分存留」或作「因他期望得到首領的位分」，並說頭一段地指最好的土地（參民32:1）。GT《聖經精讀本──申命記註解》走的是第三條路：這句話指其它支派皆從約書亞分得了地，而迦得支派卻從立律法者摩西手中直接分得了產業的事實（書14:1-3）。KC
    說這裡的頭一段地與統治者的份相連、指向治理與掌權，並說迦得加入了百姓的首領，履行他一同過河爭戰的承諾（書1:12-18、4:12）。BH 說統治者的份表示一份帶著尊榮與領導意味的特別分地，並說保留一詞暗示神的護理。
