- name: 摩西的祝福與雅各的祝福
  suggested_type: 主題
  evidence: 本章與創世記49章雅各為十二子的祝福是聖經裡僅有的兩份支派祝福，四套註釋都把它們放在一起讀。GT《啟導本聖經申命記註釋》說這篇祝福內容與雅各晚年所作的相似（創四十九章），只是摩西的祝福中沒有斥責的話。GT《申命記串珠聖經註釋》說摩西臨終前為以色列各支派祝福、作出一些預言，正像雅各臨終的祝福一樣。GT《聖經精讀本──申命記註解》說此祝福當與創49章中的雅各祝福相比較理解，摩西的祝福與雅各祝福十二子之時相距450年，根據啟示的漸進性具有進一步發展的形態；它並在個別支派上指出兩者的差異，例如雅各將但支派比作奸詐的蛇（創49:17），摩西則將但支派比作勇猛的小獅子。KC
    說雅各講的是以色列歷史將如何展開，那是一份失敗的記錄，對應的是上一章摩西之歌；但本章摩西沒有講歷史、也沒有講失敗，他描述的是各支派在千年國度平安時期的光景。CT
    在利未那一段也點出同一件事：雅各與摩西的祝福有很大的差別，在雅各的祝福語中利未是遭咒詛的，將來這族必分散在以色列各地，但是現在咒詛成為祝福，分散成為以色列聖工的特權。
