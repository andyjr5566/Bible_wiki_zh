- name: 從西乃西珥巴蘭山顯現
  suggested_type: 神學
  evidence: '第2節「耶和華從西乃而來，從西珥向他們顯現，從巴蘭山發出光輝」。STEP 顯示三個動詞遞進：ba（H935G bo: to come）、ve./za.Rach（H2224
    za.rach: to rise，本節譯義 he dawned）、ho.Fi.a（H3313 ya.pah: to shine，本節譯義 he shone
    forth），三個地名是 mi./si.Nai（H5514G）、mi./se.Ir（H8165A）、me./Har pa.Ran（H2022G 加 H6290H）。CT
    說西乃指神降十誡的西乃山，西珥指西珥山、泛指以東地，巴蘭山可能位於西乃半島的東北部山區，也有聖經學者認為是西乃山的別名（參哈三3），並說這三處都在西乃半島。GT《聖經精讀本──申命記註解》說本節用詩的語言描述因神降臨在西奈山的榮耀顯現過於威嚴與莊重，其榮耀之光甚至照耀了遠離西奈山的兩座山，並說底波拉之歌（士5:4）與哈巴谷的禱文（哈3:3）也出現了相似的語詞；GT《啟導本聖經申命記註釋》說本書只有此處用西奈山、其他地方均稱為何烈山，又說巴蘭山地點不詳，本書只記有巴蘭曠野。KC
    說這段用日出與愈來愈強的日光為意象來描寫神的威嚴，並說西乃是旅程的起點、西珥標誌終點，中間的路程被跳過，只提到巴蘭山那一段他們還沒有失敗的日子。BH 說發出光輝指神的榮耀與同在，可能連到曠野飄流時晝雲柱夜火柱的引導。'
