- name: 你的日子如何你的力量也必如何
  suggested_type: 主題
  evidence: '第25節「你的門閂（門閂或作：鞋）是銅的，鐵的。你的日子如何，你的力量也必如何。」STEP 顯示「門閂」是 min.a.Lei./kha（H4515，簡要詞典義
    min.al: bolt），前面是 bar.Zel u./ne.Cho.shet（H1270 鐵、H5178A 銅）；下半句是 u./khe./ya.Mei./kha
    da.ve.E./kha（H3117G yom: day 的複數加 H1679，簡要詞典義 do.ve: strength）。CT 說門閂指亞設支派位於迦南地北方的邊防，銅的鐵的形容防禦堅固；下半句用於個人時乃形容老年時的力量跟年輕時一樣沒有衰減，用於整個支派則形容後來的力量也和開始時一樣沒有衰減。CT
    在話中之光另指出一個原文細節：日子在原文為多數，這表明力量是要與日俱增的。GT《申命記串珠聖經註釋》說門閂是銅的鐵的意指神應許要保護他們脫離仇敵；GT《聖經精讀本──申命記註解》說門閂原意為牢固地鎖住或關緊，是要塞或城寨的文學辭語。KC
    把亞設的五項祝福逐一列出，說鐵與銅是關門的門閂、把惡擋在門外，真正的分別是歸向神的分別，使人像鐵一樣剛強、像銅一樣發亮。BH 說這句話表示神所賜的力量正好對應每一天的需要，令人想起曠野中每日的嗎哪。'
  surfaces:
  - phrase: 你的日子如何，你的力量也必如何
