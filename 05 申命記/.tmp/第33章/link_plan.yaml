- name: 永生的神是你的居所（me.o.nah）
  suggested_type: 神學
  evidence: '第27節「永生的神是你的居所；他永久的膀臂在你以下。他在你前面攆出仇敵，說：毀滅吧。」STEP 顯示「居所」是 me.o.Nah（H4585，簡要詞典義
    me.o.nah: habitation，本節譯義 [is] a hiding place），「永生的神」是 e.Lo.hei Ke.dem（H430G 加
    H6924H，簡要詞典義 qe.dem: front: old），「永久的膀臂」是 ze.ro.Ot o.Lam（H2220 ze.ro.a: arm 加
    H5769G o.lam: forever: enduring），「攆出」是 va/y.Ga.resh（H1644G ga.rash: to drive out），末句
    hash.Med（H8045 sha.mad: to destroy）是祈使式。CT 說意指以色列人在神大能的膀臂保守之下，何等舒適、安全；他在話中之光說真正的安全乃在於永生的神，在我們所賴以支撐的人或物傾覆、自己也快要跌倒時，神往往扶持著我們的膀臂使我們站穩。GT《聖經精讀本──申命記註解》說永久的膀臂在你以下意指永不知疲倦的全能之神的膀臂將成為以色列安全的居所，看護並扶持以色列。KC
    說居所的意思是神把一個居所所能給的一切都給了屬他的人——不只是風暴時的避難處，也說到平靜無慮地享受安寧與相交；他並說永久的膀臂是永不缺力量的膀臂。BH 說居所這個意象傳達安穩與庇護，並把它接到詩篇90篇1節同樣出自摩西的說法。'
