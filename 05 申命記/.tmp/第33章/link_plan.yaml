    be.Rakh（H1288 ba.rakh: to bless），「未死之先」是 li/f.Nei mo.T/o（H6440G 加 H4194 ma.vet:
    death）。CT 說神人意指屬神的人，後來用來稱呼先知（參書十四6；撒上九6；王下五8）。GT《啟導本聖經申命記註釋》說神人為負起神的使命的人，這是舊約中首次用此稱呼，再見於《約書亞記》十四6，以後也用來指神的其他先知，並說摩西稱為神人也見《詩篇》90篇的詩題；GT《聖經精讀本──申命記註解》說這句話不僅指出了摩西的偉大性，而且也暗示了摩西在下面論的祝福完全是由神而來的宣告這一事實。KC
    說摩西被稱為神人共六次，並說神人是在衰敗的時代裡以個人身分承認神的權利、並在生活中活出來的人，這樣的人看得見神百姓當前的光景、也看得見神對他百姓最終的目的就是賜福他們。BH
    說神人這個稱號突顯摩西作為先知、領袖與神人之間中保的獨特角色，這稱號用在與神有特殊關係、被揀選傳達他信息的人身上，如以利亞與以利沙。'
