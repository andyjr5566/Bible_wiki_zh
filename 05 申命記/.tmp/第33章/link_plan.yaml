- name: 摩西的祝福為何漏掉西緬
  suggested_type: 解經爭議
  evidence: 第6至25節逐一為各支派祝福，十二支派中唯獨沒有西緬。CT 說可能因為西緬支派剛剛與巴力毗珥連合而受刑罰（參民二十五1、14），成了人數最少的支派（參民二十六14），而將來分得的地業在猶大支派中（參書十九9），所以與猶大支派一起分享祝福。GT《申命記雷氏研讀本》另給一條文本線索：七十士譯本使本節下半所指的作西緬，而西緬是從名單上刪除的，這大概是因為西緬在迦南所分得的土地是在猶大的邊界以內（書一九1～9）。GT《啟導本聖經申命記註釋》說摩西的祝福中未提西緬支派，可能因為西緬的分地是在猶大支派境內。GT《聖經精讀本──申命記註解》把兩種可能並列：一是因為西緬支派將要居住在猶大支派的領土之內，故有可能從西緬支派與猶大支派一起蒙了祝福的意義上省略；二是西緬支派在受到雅各的咒詛之後（創49:5-7）非但沒有悔改其罪，反而又出現了新的罪孽（民25:14），故作為懲罰從各支派獨有的祝福中被省略。KC
    說西緬缺席，那可能是因為他的地業屬於猶大的地業。四家都注意到這件事，但給的理由不同，也沒有一家宣稱有定論。
