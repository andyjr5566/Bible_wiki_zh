- title: 滅絕
  path: link_folder/原文/滅絕.md
  definition: 出埃及記二十二20「祭祀別神，不單單祭祀耶和華的，那人必要滅絕」。STEP 語言數據顯示，「必要滅絕」原文為動詞 יָחֳרָם（yochoram，H2763，字根
    חָרַם charam），名詞形態為 חֵרֶם（cherem，H2764），指被分別出來專屬於神之毀滅、禁止人私用的完全滅絕。CT 在本節給「滅絕」的原文字義是「滅絕，毀滅，劈開」，並解「祭祀別神，不單單祭祀耶和華的」為「在耶和華真神以外，禁止祭祀任何偶像假神」。GT《丁道爾聖經註釋》指出這個字帶著獻上的意味：犯這罪的人被列為「稱聖當滅之物」，並說「迦南人要怎樣被以色列人殺盡，這人也要怎樣滅絕」。BH
    同樣說明這個概念是「分別出來歸神毀滅」。
  development: 「滅絕」在本節指向的不是單純的處死，而是被歸為當滅之物。GT《丁道爾聖經註釋》以「稱聖當滅之物」表達這個雙義：被歸入其中的人與一切屬他的都須徹底摧毀，正如迦南人被以色列人殺盡一樣。
