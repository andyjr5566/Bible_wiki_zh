- title: 在米利巴未將耶和華尊為聖
  path: link_folder/神學/在米利巴未將耶和華尊為聖.md
  definition: '民數記20:12：「因為你們不信我，不在以色列人眼前尊我為聖，所以你們必不得領這會眾進我所賜給他們的地去。」第13節接著說：「耶和華就在他們面前顯為聖。」


    **罪名是什麼。** CT 的解釋分兩層：「『不信我』意指摩西的行動，是對神沒有信心的表示，以為光是『吩咐磐石』恐怕不夠」；至於不尊神為聖，則是「在會眾面前錯誤地代表了神的回應」。他在〔話中之光〕裡把問題講得最具體：「摩西那一次發脾氣的壞處是在這裏︰一方面他在那裏發脾氣，一方面杖打下去又有水流出來，看見有神的工作在那裏，這就叫人分不清到底這是誰作的事。」結論是：「摩西沒有把神擺在應有的地位上，反而把神拉在一起沒有分別，這個叫作得罪見證。」


    **GT《啟導本聖經註釋》列了三種解釋並陳：**一是摩西不信真能憑一句話便能叫石出水，用杖擊打違背了神的命令；二是他盛怒之下連擊二下，沒有在百姓前尊敬神；三是磐石是神的象徵（林前十4），百姓聚合在磐石前有若集合在會幕或約櫃前，摩西擊石構成一種瀆犯。


    **神要的是什麼。** GT《聖經精讀本──民數記註解》說明本來的劇本：「神願意在發怨言的百姓中間行神跡,要在自己的能力和榮耀中彰顯自己的聖潔。摩西因自己的血氣沒能成就這件事情。」第13節的結局因此是諷刺的——同一份註釋接著說：神本願藉摩西和亞倫彰顯自己的聖潔，「但是因他們的犯罪,神反而在百姓面前借著對他們的懲治顯出了自己的聖潔」。KC
    把這一層講成一句話：我們若不尊神為聖，神就自己尊自己為聖。


    **刑罰會不會太重。** BH 給的理由是領袖被要求的標準更高（雅3:1）；CT 說摩西是領導人應該以身作則，對百姓負有重大責任，所以神不能對他從輕發落；GT
    丁良才《民數記註釋》則把問題丟回給讀者：「神待遇摩西為什麼這樣嚴厲呢？參路十二47-48，申一37、二26節就可以明白了。」'
