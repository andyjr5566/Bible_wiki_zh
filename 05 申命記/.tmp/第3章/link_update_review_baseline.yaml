- title: 約書亞承接摩西
  path: link_folder/事件/約書亞承接摩西.md
  definition: '民數記27:18-23 記下約書亞承接摩西的正式任命。人選出自神的回答，程序在祭司與全會眾面前完成；這使交接同時具有神的揀選、摩西的承認、祭司的參與和會眾的公開見證。


    | 步驟 | 經文 | 意義 |

    |---|---|---|

    | 神點名約書亞 | 27:18 | 人選不是世襲或會眾投票；GT 指出權柄的根據是神直接委任 |

    | 確認他裡面有靈 | 27:18 | 約書亞已有神所賜的領導能力；KingComments 說曠野多年少有記載，神卻一直認識並塑造他 |

    | 摩西按手 | 27:18、23 | 公開表明聯合、授權與交接；STEP 兩次均為 H5564 sa.makh，詞典義域是「支持」 |

    | 站在祭司與會眾面前 | 27:19、22 | 任命可被共同見證，不是私下安排 |

    | 摩西囑咐／任命 | 27:19、23 | STEP 的 H6680 在本段三次出現，context gloss 包含 commission／command
    |

    | 分授尊榮 | 27:20 | 讓全會眾承認並聽從約書亞；H1935 hod 表示尊榮、威儀 |

    | 日後藉祭司求問 | 27:21 | 以利亞撒憑烏陵在神面前求問，約書亞和會眾照所得命令出入 |


    摩西完整照辦：他把約書亞領來、使他公開站立、按手並囑咐。CT 稱這是「公開執行交接儀式」與正式任命；GT 補充約書亞曾作摩西的助手、在窺探迦南時顯出信心，也指出百姓日後在過約但河時更完全確認他的領導。BibleHub
    著重公開儀式帶來透明、合一與連續性。


    STEP 還顯示第21節「烏陵」是 H224 複數名詞，第20節「尊榮」前有表示「從……中」的介系詞。這些資料使交接的層次更精確：摩西分授可見的尊榮，祭司保存求問程序，約書亞承擔帶領全體出入的責任。'
  development: 約書亞此前已作摩西助手、在與亞瑪力人爭戰及窺探迦南時受操練；民數記27章把長期預備轉成公開任命，申命記31章重申勉勵與交接，約書亞記則記他實際帶領百姓過河。GT
    與 KingComments 另以預表層理解摩西和約書亞：前者帶百姓出埃及、經過曠野，後者帶百姓進入地業；這是註釋家的神學延伸，事件本身首先處理以色列真實的領袖更替。
  signals:
  - first_in_book
