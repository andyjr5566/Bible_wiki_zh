- title: 面東定向的左右方位
  path: link_folder/背景/面東定向的左右方位.md
  definition: 古代以色列人以面向日出的方向作為定位基準。GT 丁良才《創世紀註釋》在創十三9 直接說明這套方位觀：「以色列人按著面向日出的地方定方向，他們就稱東為前邊，西為後邊，南為右邊，北為左邊。」因此亞伯蘭對羅得說「請你離開我，你向左」，丁良才註明「就是向北」；「我就向右」則註明「就是向南」。第9節不是抽象地說「隨你挑」，而是以身體朝東為準，把地劃成南北兩半，讓羅得先選一半。
  development: '這套慣例在聖經裡有兩種用法，而本條目累積的幾章正好各佔一邊。第一種是**用來讀人的動作**：創13:9 亞伯蘭說「你向左，我就向右」，丁良才註明「向左」即向北、「向右」即向南——他讓出的不是含糊的左右，而是北半或南半的整片牧地；創14:15
    追擊到「大馬色左邊的何把」，同一個方位詞由敘事者用來標定地點，呂振中逕譯作「大馬色北邊」。第二種是**用來讀建築**：出26:18-22 帳幕的南面、北面、西面全建立在「幕門朝東」這個基準上，GT《中文聖經註釋》把整套語言寫全——「在以色列人討論方向時，必以聖幕或聖殿的門為定位。幕門是開向東方的。面向東方時，稱右邊為南方，左邊為北方，後面為西方」；GT
    引丁良才在出26:20 也說「本句暗指帳幕必是坐西向東」。


    兩種用法共通的是同一個身體姿勢：人面朝東。讀者若按現代習慣把「左邊」理解成西邊，創14 的追擊路線會整個反過來，出26 的桌子與燈臺也會左右顛倒。


    出26 另外留下一個至今無解的原文問題：GT《中文聖經註釋》指出第18節的「南面」在原文用了兩個字，「頭一個是 negebah（向曠野），第二個是 teymanah（向右）。兩個字都指向南的意思。但為甚麼要重複地用兩個字？就至今仍無令人滿意的解答」；而「頭一個字卻使人體會到作者是已在聖地，並以此地來述說方向，而不是身在西乃半島並從那裏來講說方向的」。他並注意到「七十士譯本在18節繙成北面，而在20節卻譯為南面」。'
  signals:
  - first_in_book
  accumulation_count:
  - 4
