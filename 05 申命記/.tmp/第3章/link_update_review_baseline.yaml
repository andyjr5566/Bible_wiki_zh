- title: 哈倭特睚珥
  path: link_folder/地點/哈倭特睚珥.md
  definition: '哈倭特睚珥出現在民數記32:41：睚珥佔了基列的村莊，就把這些村莊按自己的名字這樣稱呼。


    **名字的意思，兩套中文註釋給法略有出入。** CT 說：「『哈倭特睚珥』直譯為『睚珥的一切城邑』(參書十三30；士十4；王上四13)，是一些沒有城牆的村落。」CT
    給的字義欄寫的是「儆醒者的村落，守望者的村落」。


    GT 丁良才《民數記註釋》寫作「哈委特睚珥」，並說「就是睚珥之村莊的意思」。他還記了數量的變化：「這些村莊，原有二十三個（代上二22），到士師年間，就成了三十個（士十4）。」


    BH 的說法是「睚珥的村莊」，並指出這個名字在申三14 與士十3-4 都還在用，可見它留下的痕跡很久。


    **原文層。** STEP 把同一節的兩個詞分開標：普通名詞「村莊」是 cha.vo.tei./hem（H2333），詞典形 chav.vah，簡要詞典義
    village；地名「哈倭特睚珥」則另有自己的編號 cha.Vot ya.''Ir（H2334）。也就是說，原文的普通名詞層面確實是「村莊」；CT 譯成「城邑」的同時也說明了它們是沒有城牆的村落，兩邊講的是同一種聚落。'
