- title: 擔當（na.sa）
  path: link_folder/原文/擔當（na.sa）.md
  definition: '申命記第一章裡，摩西說自己「擔當不起」，後來又說神「撫養」了他們。中文是兩個不同的詞，原文是同一個字。


    **三處同一個字。** STEP 原文資料顯示：


    | 節次 | 和合本 | 原文 | Extended Strong | 形態 | STEP 本節譯義 |

    |---|---|---|---|---|---|

    | 9 | 擔當 | se.''Et | H5375H | Qal 不定詞 | to bear |

    | 12 | 擔當 | ''e.Sa'' | H5375H | Qal 未完成 1cs | will I bear |

    | 31 | 撫養（你們） | ne.sa.''a./Kha | H5375H | Qal 完成 3ms＋2ms | he carried you |

    | 31 | 撫養（兒子） | yi.sa''- | H5375H | Qal 未完成 3ms | he carries |


    簡要詞典義是 na.sa: to lift: bear——舉起、背負。


    **CT 兩處給的中文字義相同。** 第9節「擔當」CT 註「舉起，承擔」；第31節「撫養」CT 也註「舉起，承擔」。同一份註釋在兩個不同的中文詞底下給了同一個原文字義。


    **KC 把這兩處接在一起讀。** KC 在第31節說：摩西做不到的事（民11:14），神做了——祂像人抱著自己的孩子那樣背負他們。KC 並引使徒行傳13:18
    保羅在彼西底安提阿會堂的講論，說神以乳養之人的溫柔看顧了他們約四十年。


    **兩處的分量不同。** 第9、12節是摩西講自己的極限：「管理你們的重任，我獨自擔當不起」「我獨自一人怎能擔當得起呢？」第12節同時列出三樣東西——STEP
    顯示是 ta.re.cha./Khem（H2960 to.rach，burden）、u./ma.sa.''a./Khem（H4853A mas.sa，burden）、ve./Ri.ve./Khem（H7379
    riv，dispute），CT 原文字義分別作「麻煩」＝重擔、「重任」＝負擔承受、「爭訟」＝爭端爭論。第31節則是同一個動作換了主詞。


    **BH 讀第31節的父子比喻。** BH 指出父親抱著兒子的意象講的是一種親密而有責任的關係，並把它接到詩篇103:13 與馬太福音6:9 的父神形象。'
