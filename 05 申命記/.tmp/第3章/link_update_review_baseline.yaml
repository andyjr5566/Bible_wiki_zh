- title: 睚珥
  path: link_folder/人物/睚珥.md
  definition: '睚珥在民數記32:41 佔了基列的村莊，並且用自己的名字把那些村莊叫作哈倭特睚珥。經文稱他為「瑪拿西的子孫」。


    **他的血統其實橫跨兩個支派。** CT 交代得最直接：「『睚珥』是猶大支派希斯崙的兒子西割和瑪吉的女兒結婚所生的兒子，歸屬母親家族，故稱瑪拿西的子孫」。CT
    給的名字字義是「儆醒，守望」。


    GT 丁良才《民數記註釋》把代上二21、22的家譜攤開來看，結論是：「這樣看來，睚珥的父親西割，原來屬猶大支派」。他還給了睚珥一個評語與一條後續線索：「睚珥是豪傑，占了亞珥歌伯的全境」、「以色列的士師睚珥（士十3），大概是這人的後裔。」


    BH 從命名這個動作切入：把村莊叫作哈倭特睚珥，也就是「睚珥的村莊」，「標示了所有權，也立下了一份傳承」。


    **原文層。** STEP 顯示第41節的「睚珥」是 ya.''Ir（H2971G）；同一節的「佔了」與第39節瑪吉那裡是同一個動詞 la.khad（H3920，簡要詞典義
    to capture）。'
