- title: 耶和華的爭戰
  path: link_folder/神學/耶和華的爭戰.md
  definition: 出埃及記第14章的核心神學主題之一：神親自為祂的子民爭戰。v14 摩西宣告「耶和華必為你們爭戰；你們只管靜默，不要作聲」；v25 埃及人承認「耶和華為他們攻擊我們」。爭戰屬於神——以色列人毋須動手，只需靜默觀看神的作為。KC
    指出這是從羅馬書7章（掙扎）到羅馬書8章（得勝）的轉折——人不再靠自己，而是靠神已完成的工作。
  development: '**「祂是戰神」——人只有旁觀的份。** GT《中文聖經註釋》給本段一個很硬的神學定位：「這裡的另一特徵，是神的作為，並不須人的合作；祂是戰神，祂施行聖戰以拯救其子民，完全出於祂聖善的鴻恩，人只有旁觀而無參與的份兒。」CT
    的〔話中之光〕語氣一致：「能得著神為我們爭戰，何敵不克？何難不攻？祂不需我們助陣，也不需我們加油；所以只管靜默，不要作聲。」


    **這句話後來被誰真正學會。** GT《中文聖經註釋》指出當年的以色列人並沒有真懂：「當年的以色列人，對這句話還沒有深切的體驗，雖然他們已經歷過神對埃及人所施行的十災。後來的以色列人，尤其是大衛，卻深明此奧祕，所以他能在人優我劣之下，仍然輕易的勝過巨人歌利亞」（撒上十七45～47；並參申一30、三22、二十4；書十14、42，廿三3、10）。


    **連仇敵也認出來了。** v25 埃及人自己說「我們從以色列人面前逃跑吧！因耶和華為他們攻擊我們了」。GT《中文聖經註釋》問得好：「為甚麼大隊的軍兵，大張聲勢而來，現在卻自動的說要在以色列人面前逃跑？原因是他們已經看出，因耶和華為他們攻擊我們了……這種神與人的爭戰，人是無法抵擋的。」CT
    的〔話中之光〕另指出以色列人在這場仗裡的角色：「以色列人過紅海，是神的拯救又是爭戰；以色列人沒有打仗，他們沒有動刀劍，不用一兵一卒。」'
