- title: 雅博渡口
  path: link_folder/地點/雅博渡口.md
  definition: 雅博河（今稱雅卡河 Wadi Zerqa）為約但河東側主要支流，發源於亞蒙地、向西流經基列、在死海北約30-38公里處注入約但河。希伯來文「雅博」與「摔跤」諧音（GT《聖經精讀本──創世記註解》：「摔跤」的詞根具有「塵土飛揚地撕打」之意，可能與河名有關），CT
    註其原文字義為「摔跤」、「湧出」、「潑出」、「倒空」。渡口為人畜可涉渡之淺灘（士3:28）。
  development: '### 渡口本身就有意義


    GT 華爾頓《創世記背景註釋》給了本條目最有份量的一段：渡口或涉渡點的功用與城門差不多，兩者都是某些地區的出口和入口，在軍事上都有戰略價值（見士三28、十二5；耶五一32），故此都與權能有關——「這權能包括了實質的勢力，和超自然的能力」。他因此說：「雅各進入應許之地，與他在湍急之雅博河渡口旁與一位超自然者搏鬥這兩回事有關聯，是不難想像的。」


    換句話說，摔跤發生在這個地點不是偶然。渡口是進出的關口，而雅各正要進入應許之地；他在關口被攔下。


    ### 它在哪裡


    各家給的數字略有出入，但指的是同一條河。CT 註「這河是約但河東面的分支，在死海以北約卅餘公里處注入約但河」；GT《串珠聖經註釋》作「約卅二公里」；GT《啟導本聖經創世記註釋》說「雅博是基列的一條小河，現名雅卡河（Wadi
    Zerqa），在死海北約30公里處，向西流入約但河」；GT《創世記雷氏研讀本》則作「大約在死海以北二十四英里（38公里）入約但河」。GT 丁良才《創世紀註釋》從另一端定位：「雅博河在加利利海和死海的當中，與示劍相對，流入約旦河。」


    GT《聖經精讀本──創世記註解》補了一項水文事實：這條支流「只有到了雨季才有水流」；而「渡口」是人和家畜可以渡過的較淺小溪（士三28）。這說明第22-23節那一夜為什麼能把兩妻、兩使女、十一個兒子連同所有家產都送過去。


    ### 河名與那一夜


    GT《創世記雷氏研讀本》指出「雅博」這名字與希伯來文解作「角力」的字有關（參第24節）。GT《聖經精讀本──創世記註解》講得更細：「摔跤」的詞根具有「塵土飛揚地撕打」之意，可能與河名有關，含有「緊緊抱住躺下」或「緊緊貼住」之意——並認為這河名「是後人為紀念雅各在這裡的特殊經歷而取」。CT
    則只註原文字義：「摔跤，湧出，潑出，倒空。」


    要留意精讀本這個說法的性質：河名是否因雅各而得，經文沒有說；它是一種推論。可以確定的只是字音的相近，以及敘事者把摔跤放在這條河邊。'
  signals: []
  accumulation_count:
  - 3
  - 4
- title: 亞拉巴
  path: link_folder/地點/亞拉巴.md
  definition: '亞拉巴是一條南北向的大裂谷，申命記第一章開場就把摩西講話的位置放在這裡。


    **範圍有多大。** CT 與 GT《啟導本》給的說法一致：「『亞拉巴』指約但河流域從北邊的加利利海到死海南端以迄阿卡巴灣的河谷地帶。今天死海南岸仍叫做亞拉巴（Wady
    el-Arabah）」。BH 的描述也相同：從死海延伸到阿卡巴灣的沙漠地帶。換算下來，這條裂谷縱貫了以色列人整趟行程的東側。


    **它同時是三個東西。** 第1節「疏弗對面的亞拉巴」是摩西講話的地點；第7節「就是亞拉巴、山地、高原、南地」則把它列為應許之地的一個地理分區；第5節說摩西講律法的地方在「約但河東的摩押地」，CT
    說明那就是「亞拉巴⋯的中南部」。同一個名字在同一章裡既指講話的現場，也指要去得的地。


    **死海也用這個名字。** CT 與 GT 都指出，聖經裡死海又名「亞拉巴海」（申四49；書三16；十二3；王下十四25）。所以讀到「亞拉巴」時要看上下文是指整條裂谷還是那片海。


    **原文。** STEP 原文資料顯示第1節與第7節都是 ba./''a.ra.Vah（H6160G），簡要詞典義 Arabah。CT 給的原文字義是「沙漠曠野，乾草原」。'
