- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  definition: BH 在出二十二20 指出「必要滅絕」背後的觀念是希伯來文的 herem——把某物分別出來歸神毀滅。GT《丁道爾聖經註釋》用同一個概念解釋本節：犯這罪的人被列為「稱聖當滅之物」，「迦南人要怎樣被以色列人殺盡，這人也要怎樣滅絕」，並在論這一組律法時說「獻祭給耶和華以外神祇的人都要『稱聖』歸作『當滅之物』，他和一切屬他的都須徹底摧毀」。
  development: 'herem 這個字在兩卷書裡出現的位置不同，份量也不同。


    出埃及記二十二20 是把它用在一條刑律上：獻祭給耶和華以外神祇的人「必要滅絕」。BH 在那裡點出背後的觀念——「把某物分別出來歸神毀滅」；GT《丁道爾聖經註釋》說得更重：這人被列為「稱聖當滅之物」，「迦南人要怎樣被以色列人殺盡，這人也要怎樣滅絕」，「他和一切屬他的都須徹底摧毀」。


    利未記二十七28-29 則是把它寫成一條完整的產權條例，並且第一次把兩種情況分開。第28節說永獻之物「都不可賣，也不可贖」，第29節說當滅的人「都不可贖，必被治死」。CT
    指出兩處原文同字：「『永獻』與『當滅』在希伯來文均用herem一字。」STEP 語言資料進一步顯示，差別在語態——v28 的動詞是 Hiphil（人主動把東西獻上毀滅），v29
    是 Hophal（人被獻上毀滅）。這正好對上 GT 丁良才對兩節的分工：「在28節是論各人隨意行的，在本節是論官長所可以行的。」


    兩卷合起來看，herem 的關鍵不在「毀滅」而在「不可取回」。GT《啟導本聖經利未記註釋》用亞干的案子說明後果：神指定某些戰利品或俘虜完全歸祂、人不可佔有（書六17），而「亞干的罪招神烈怒，正是因為取了永獻之物」。這也解釋了利未記二十七章為什麼要把它列進三類不可再許之物——已經是神的，就不能再當成自己的東西獻一次。'
