- title: 被掛在木頭上與基督被掛在樹上_徒5_30_加3_13
  path: link_folder/互文/被掛在木頭上與基督被掛在樹上_徒5_30_加3_13.md
  summary: '第23節「因為被掛的人是在神面前受咒詛的」。STEP 顯示是 ki.Lat E.lo.Him ta.Lui（H7045，qe.la.lah: curse 加 H430G 加 H8518，ta.lah: to hang）。CT：「主耶穌被掛在木頭上，是為罪人成為咒詛(參加三13)」，並說主耶穌代替我們每一個當死的人被掛在木頭上，承受了我們當承受的恥辱和咒詛。GT《申命記串珠聖經註釋》說基督卻選擇了這種死法，藉此為世人除去咒詛。GT《聖經精讀本──申命記註解》說被掛在天地之間的屍體意味著為天地所離棄，不僅在人的咒詛之下，更是在神的咒詛之下，並說本節是藉著最恥辱的事件來啟示基督十字架奧秘的彌賽亞性句子。GT《馬唐納》指出主耶穌的屍首也不許留在十字架上過夜（參看約一九31）。BH 說被掛在木頭上是神審判的記號，保羅據此解釋基督為我們成了咒詛。'
  relation: 本節是新約引用的那句話的出處。條文原本管的是屍體處理，四套註釋卻都在同一處轉向十字架；KC 把它列為髑髏地的第三個面向——神在使祂成為咒詛時必須撇棄祂。
