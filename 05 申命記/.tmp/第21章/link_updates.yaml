- title: 產業（na.cha.lah）
  path: link_folder/原文/產業（na.cha.lah）.md
  summary: '這個字在本章第23節出現：「免得玷污了耶和華─你神所賜你為業之地」，STEP 顯示是 na.cha.Lah（H5159）。同章第16節分產業的動作則是同字根的動詞 han.chi.L/o（H5157，na.chal: to inherit）。另外值得留意的是第1節與第23節的「地」都是 a.da.Mah（H127G，a.da.mah: land: soil）。CT 說『免得玷污了…地』的理由是死屍被視為不潔(參利二十一1)。GT《啟導本聖經申命記註釋》說一個被定罪治死的人也是受神咒詛的人，把他懸屍示眾不可過夜，免得玷污土地，因土地乃神所賜。BH 說這片地是神給祂子民的聖潔禮物，也是祂與以色列立約的具體表徵。'
  relation: 本章的第一節與最後一節都提到這片神所賜的地，而且兩處講的都是不可玷污它：開頭怕的是無主的血，結尾怕的是過夜的屍首。第16至17節的分產業則把同一個字根用在家庭內部——同一片地要按神定的次序傳下去。
