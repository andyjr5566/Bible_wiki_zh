- title: 城門口公共場合
  path: link_folder/歷史/城門口公共場合.md
  definition: 古代近東城門口為城市公共生活中心：法律審判（申21:19；22:15；25:7；得4:1；撒下15:2）、商業交易（創23:10-18）、公共集會（創19:1；書20:4）、君王接見（王上22:10）、先知傳道（耶17:19）。城門設長老席位（得4:1-2），為「在城門口坐著的長老」（箴31:23）決策場所。
  development: '- 城門口決策代表社會共識與法律效力

    - 哈抹利用城門權威推動割禮，展示權貴操縱公共場合

    - 信徒應在「城門口」（公共場合）為公義發聲（賽1:17；摩5:15）

    - 舊約另一個完整的城門程序範例是波阿斯：他在伯利恆城門口召集長老十人，當眾贖回產業並娶路得（得4:1-11）——買賣、法律見證與長老裁決在同一個場所完成


    ### 城門為什麼會兼具這麼多功能


    GT《舊約背景註釋》〈創十九1～3 坐在城門口〉給的解釋很實際：古代的城門有後世公眾廣場的作用，「由於不斷有人經過，它是商人擺設貨攤，審判官聽案的理想場所」。人流本身就是這個場所的資源——見證人隨時在場，交易與判決因而自動取得公開性。


    各家對本章的敘事功能說法一致，但推論的強度不同。CT 說羅得坐在城門口「很可能他在所多瑪城成了一個有身分、有地位的人（參9節）」；GT《啟導本聖經創世記註釋》說「表示是城中有身分地位的人」；GT《創世記雷氏研讀本》推得最遠，說「可見他是該城的審判官」；背景註釋則把結論收在社會接納上——羅得坐在城門口，「證明所多瑪的社會已經接納他為其中一份子」。KC
    讀成參與市議會。經文只寫他坐在那裡；「紳士」「審判官」都是由場所功能反推的身分。


    第9節暴民的回話從反面替這一點作了註腳：「這個人來寄居，還想要作官哪！」——他確實已經在這個位置上發言，但在他們眼中始終是外人。


    ### 從發生事情的地方，到被制度化的地方


    創世記那幾章記的是城門實際發生了什麼：羅得坐在所多瑪城門口、亞伯拉罕在赫人的城門前議價、示劍父子在城門口向本城的人說話。那時城門是個地點，不是個機構。


    申14 與申15 用同一個字（sha.ar）當作全城範圍的代稱——「你城裡」的利未人、寄居的、孤兒寡婦。


    申命記十六18 走到第三步：「你要在耶和華─你神所賜的各城裡，按著各支派設立審判官和官長。」這是律法第一次把司法機構明文設在這個位置上。KC 說在應許之地，公義是在城門口宣告的，而審判官的人數也會按各城的居民人數而定。


    ==同一個字走完了一條路：先是一個人們碰面的地方，再是一個行政範圍的代稱，最後成了一個有編制的機構所在。== 這條路的轉折點正是定居——曠野裡沒有城門，也就不需要在城門設審判官。


    申命記十七章把城門的兩種用途擺在同一章裡，位置卻不同。第8節說城中若起了爭訟的事，STEP 為 bi/sh.''a.Rei./kha（H8179H，簡要詞典義
    sha.ar: gate: town）——案子起於城門這個地方；第5節說行這惡事的人要拉到城門外，用石頭打死。CT 說古時是在城門口公開審問案件。審判在門裡，處決在門外，同一道門因此成了兩件事的分界。'
