- title: 把那惡從你們中間除掉（ba.ar）
  path: link_folder/神學/把那惡從你們中間除掉（ba.ar）.md
  definition: '申命記第十三章第5節在判死刑之後接了一句公式化的話：「這樣，就把那惡從你們中間除掉。」這句話在申命記裡反覆出現，本章是它的其中一次。


    STEP 顯示「除掉」是 u./vi.''ar.Ta（H1197I，簡要詞典義 ba.ar: to burn: purge，本節逐字解 you will remove），「那惡」是
    ha./Ra''（H7451B，ra: bad: evil），後面接 mi./kir.Be./cha（H7130G，qe.rev: entrails: among，直譯是從你中間）。CT〔原文字義〕註的是「除掉(原文雙同字)」消耗，燒盡，並在文意註解裡說『那惡』指叛逆神的惡，『除掉』原文意指用火燒除，含有除惡務盡的意思。


    **除掉的是罪，不是只有犯罪的人。** GT《啟導本聖經申命記註釋》說領人叛逆神的必須治死，「以消除作惡的和那罪惡本身」，並列出這條公式在申命記與士師記的其他出處（十七7；十九19；二十一21；二十四7及士二十13）。GT《申命記串珠聖經註釋》說得更簡短：「把那惡從你們中間除掉」是把犯人處死的結果，並同樣列出申17:7、19:19、21:21、22:21。


    **KC 數過它出現幾次。** 他說這道命令在申命記共出現九次，並指出新約有一個對應的版本：舊約在某些情況下是把人治死，新約給哥林多教會的命令則是「Remove
    the wicked man from among yourselves」（把那惡人從你們中間趕出去，林前5:13下）。他同時提醒兩件事要並存——恨惡罪惡與愛惜罪人是分開的，不可與惡有交通（猶1:23），但對被過犯所勝的人仍要用溫柔的心挽回（加6:1）。


    **它與本章的處置強度是配套的。** 第5節用在假先知身上，第11節則說出這道命令要達到的效果：以色列眾人都要聽見害怕，就不敢在你們中間再行這樣的惡了。STEP
    顯示第11節那句話裡的動詞是 yo.Si.fu（H3254G，ya.saph: to add: again），「這樣的惡」是 ha./Ra''（H7451H），與第5節的「那惡」同一個字。整章因此有一個閉環：除掉那惡，是為了那惡不再被加上去。'
  development: '這句公式在申命記十三章與十七章之間走了一段。十三章用它收尾的是引誘人去事奉別神的罪；十七章用了兩次，第7節收在拜日月天象的人身上，第12節收在不服中央判決的人身上。STEP
    顯示三處的動詞都是 u./vi.''ar.Ta（H1197I，簡要詞典義 ba.ar: to burn: purge），受詞都是 ha./Ra''。


    有變的是範圍詞。第7節說 mi./kir.Be./cha（從你中間），第12節說 mi./Yis.ra.''El（從以色列中）。GT《申命記串珠聖經註釋》說「惡」這字或作「惡人」，表示將罪和罪人看為一體。從十三章到十七章，同一句話從對付敬拜上的背叛，延伸到對付對司法權柄的藐視。


    申命記十九章讓這句公式第三次出現，而且同一章裡用了兩次同一個動詞、對著兩個不同的受詞。


    第19節是標準句型：作假見證的人查實之後，「這樣，就把那惡從你們中間除掉」（STEP：u./vi.''ar.Ta ha./Ra'' mi./kir.Be./cha，H1197I
    加 H7451B 加 H7130G），與申13:5、17:7 完全相同。


    第13節則換了受詞：蓄意殺人者被交出去之後，經文說要「從以色列中除掉流無辜血的罪」——動詞仍是 u./vi.''ar.Ta（H1197I），要除掉的卻不是「那惡」，而是流無辜血的罪。


    ==三章合起來，這句公式管的東西一路在擴：申13 除掉引誘拜別神的人，申17 除掉擅敢不聽判決的人，申19 除掉的先是一樁血債，再是一個誣告的人。== GT《啟導本聖經申命記註釋》看出同一件事：本書多次要求除惡，不只主張嚴懲作惡者，也要把那惡本身去除。'
