- title: 掛在木頭上_懸屍示眾
  path: link_folder/歷史/掛在木頭上_懸屍示眾.md
  definition: 創世記40:19約瑟對膳長說「法老必斬斷你的頭，把你掛在木頭上」；22節「把膳長掛起來」。GT《舊約背景註釋》說明第22節的作法：「人被處死後，使他屍體蒙羞的法子之一，是將之懸掛」（參書八29；撒下四12），「它可能是綁著頸項吊起來，也可能是刺在杆子上」，而處死的方法「若非用石頭打死，就是砍頭」——換言之，掛在木頭上是死後示眾，不是處決方式本身。GT《聖經精讀本》稱這是一種極刑：死囚的屍體不能埋葬，而是掛在樹上，「增加對他的恥辱」（申21:21-22；書10:26）；BH
    則指出申21:22-23 把被掛在木頭上與「被神咒詛」連在一起。
