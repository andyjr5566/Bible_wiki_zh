- title: 申21：18-21
  path: link_folder/互文/申21：18-21.md
  definition: 申21:18-21與出埃及記第二十一章的關聯：申命記21:18-21規定悖逆不聽從父母的兒子，父母可將他帶到城門長老面前，眾人用石頭打死。此條例擴展出21:15,17的死罪律例——打父母與咒罵父母為死罪，申命記進一步將持續悖逆的行為也列為死罪。
