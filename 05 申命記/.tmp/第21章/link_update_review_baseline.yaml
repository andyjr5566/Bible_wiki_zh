- title: 贖罪
  path: link_folder/神學/贖罪.md
  definition: 「贖罪」在舊約獻祭語彙中的核心意思是遮蓋。GT《啟導本》指出原文：「『贖罪之物』贖罪一詞，希伯來文作 kaphar。舊約時代按律法而獻的祭物只能暫時遮蓋人的罪，叫獻祭的人知道神已經赦免了他。祭物永遠不能除罪，正如新約所講的：『公牛和山羊的血斷不能除罪』（來十4）。」同一則註釋把以色列獻祭的內涵拆成三點：「1.認罪；2.承認死是犯罪的懲罰；3.表明神『寬容』人（羅三25）」，而基督的救恩「徹底去罪，叫人與神『和好』（羅五11）」。GT《丁道爾》在譯法上作了一個重要的限定：「贖罪之物，希伯來原文的動詞是
    kuppar，和約櫃之『蓋子』，即『施恩座』一詞字根相同。最好的譯法可能是（無人稱的）『遮蓋罪之物』，因為它不一定包含挽回（英：propitiate，即轉離神的忿怒）的意思，只有對付罪或除罪（英：expiate，即取消罪）之義而已。除非經文明言奉獻者和對象兩者的位格，否則最好還是不譯作『挽回』。」贖罪的效力也不限於贖罪祭：GT《精讀本》指出「贖罪之物」不只指14節的贖罪祭，「包括燔祭之物和平安祭之物。因為不僅通過贖罪祭贖罪，而且燔祭和平安祭中灑血也能起到贖罪的效果（利1:4；3:2）」；GT
    引丁良才的說法相同：「贖罪祭，燔祭，平安祭都含著贖罪的意思，贖罪祭全然表示這意思，燔祭和平安祭略略地表顯贖罪之意。」
