- title: 基博羅哈他瓦
  path: link_folder/地點/基博羅哈他瓦.md
  definition: '民11:34 記下的地名，和合本小字直接譯出它的意思：「貪欲之人的墳墓」。CT 給的原文字義是「情慾之墓」，GT 丁良才作「貪欲之人的墳墓」，BH
    作「Graves of Craving（貪慾之墓）」或「Graves of Lust」。


    **這個名字是從本章第4節長出來的。** STEP 原文資料顯示，第4節「大起貪欲的心」的第二個字是 ta.''a.Vah（H8378，詞典義 desire），而第34節地名的後半
    hat.ta.''a.Vah 正是同一個字；同節「起貪欲之心的人」是 ha./mit.''a.Vim（H183，詞典形 a.vah，詞典義 to desire），與第4節的動詞
    hit.''a.Vu 同形同根。==貪慾起於第4節，埋在第34節，用的是同一個字。==


    **位置說法不一。** GT《民數記串珠聖經註釋》說它「在西乃山的東北，和西乃山只相隔數英里」；GT《舊約聖經背景註釋》則說「此地的確實位置缺少有把握的考證」。經文只說百姓從這裡走到哈洗錄（v35）。


    **它與他備拉的關係另有爭議**，見「他備拉與基博羅哈他瓦是否同一地」。'
