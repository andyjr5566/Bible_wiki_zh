- title: 不可為自己雕刻偶像
  path: link_folder/神學/不可為自己雕刻偶像.md
  definition: 「不可為自己雕刻偶像，也不可做什麼形像彷彿上天、下地，和地底下、水中的百物。不可跪拜那些像，也不可事奉他」（出二十4-5a）是十誡的第二條誡命（基督教傳統和改革教派條分法），禁止為敬拜目的製造任何偶像或形像。此誡命的核心是：神是個靈（約四24），不能用任何形像來表現祂；凡自製神像、雕刻菩薩，或用任何形式來代表神加以膜拜，都是罪。第一誡禁止敬拜別的神，第二誡禁止製造偶像——無論是藉著這像敬拜神，或是拜別神。
  development: '第二誡同時禁止人用形像代表耶和華，也禁止人敬拜別神的偶像。出二十章先頒下不可製造及跪拜形像的命令，出三十二章的金牛犢顯示即使自稱向耶和華守節，以人手造像敬拜仍然違命；申四至五章再以神沒有向以色列顯出任何形像及祂是忌邪的神說明理由。


    民三十三章與申七章把禁令推到進入迦南的處境：以色列不只不可為自己造像，也要毀掉當地居民已造的偶像。申7:25-26 更禁止貪圖偶像上的金銀或把當毀滅之物帶進家中，顯明偶像的危險也包括人想把敬拜物件改作財物的誘惑。'
