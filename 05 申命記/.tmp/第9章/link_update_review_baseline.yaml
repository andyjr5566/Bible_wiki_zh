- title: 神的指頭（路11：20）
  path: link_folder/互文/神的指頭（路11：20）.md
  definition: 「神用指頭寫的石版」（出31:18）是一個擬人的說法，指神直接的作為與能力，而非字面上的手指。GT 引賈斯樂郝威《聖經難解經文詮釋手冊》處理得最完整：「神實在是沒有手指的。『神用指頭』這只是象徵的意思（figure
    of speech），表示神直接與十誡的頒佈有關（神是十誡的制定者），這稱為擬人說法（anthropomorphism），是以人的措辭來談論神」，並列出同型的表達：膀臂（申7:19）、翅膀（詩91:4）、眼（來4:13）。GT《啟導本》說得更短：「『用指頭』是比喻講法……『指頭』也指『能力』，這是神的能力」，並指出出8:19「神的手段」原文即作「神的指頭」。GT《丁道爾》把兩約串起來：「出埃及記八章19節用同樣的喻象形容埃及的災難，路加福音十一章20節則用以形容基督的事工」，並下結論：「這句話有力地肯定了神是來源和始因，我們不必拘泥字面的意思。」GT
    引李道生另補上兩處：但5:5、24 王宮粉牆上寫字的指頭，與約8:6 主耶穌用指頭在地上畫字。
  development: 出埃及記使用「神的指頭」強調法版上的誡命是神親自的工作，具有不可變更的權威。路加福音11章20節引用相同的喻象，說明耶穌趕鬼的神蹟同樣是神直接能力的彰顯。這構成了舊約律法頒佈與新約國度權能展現之間的互文關聯，皆指向神親自的介入與作為。
