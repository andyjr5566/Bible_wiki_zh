- title: 亞倫
  path: link_folder/人物/亞倫.md
  definition: 亞倫是摩西的哥哥，屬利未支派（出4:14）。CT 的原文字義註解給的是「開明的、甚高的、帶來光的」；GT《中文聖經註釋》說亞倫名字的來源不很清楚，希伯來文字根含有「開通點」「開明的」或「甚高的」等意思，「但若是從埃及文來的，便有『賜神諭者』的含意」。神在出埃及記第4章首次提及亞倫，指定他為摩西的輔助者與代言人。亞倫「能言」的特質補足摩西「拙口笨舌」的缺欠（出4:10-16）。聖經記述他後來成為以色列第一位大祭司（出28-29章）；KC
    說亞倫是主耶穌作祭司的圖畫（摩西則是主耶穌作君王的圖畫），BH 也把他的職分連到基督：「亞倫作為傳話者的角色意義重大，因為他成了第一位大祭司，預表基督作我們終極的大祭司」（來4:14-16），並指出「亞倫被稱為利未人是有意義的，因為利未人後來被分別出來擔任祭司的職務」（民3:5-10）。
  development: '### 從摩西的口，到失敗又復職的大祭司


    亞倫最早的身分只是「摩西的口」——出4章神設立這個分工：「你要以他當作口，他要以你當作神」，但各家對這個安排評價不一：GT 丁良才說「摩西既不願意獨自占神為他所預備最尊的地位，神就讓亞倫分享他的榮耀」，KC
    卻讀作削弱——「這不是加強，而是削弱」。出7-11章十災的前半，動作多半由亞倫的杖執行；但從出9、10章起，「揚灰」「伸杖」的動作已完全落在摩西身上。出32章是他最深的失敗——百姓要求造神像，他沒有求問神就鑄了金牛犢，事後還推諉「這百姓專於作惡，是你知道的」；GT
    引申9:20 說神向他甚是發怒要滅絕他，因摩西代求才免於死。出34章他才以敬畏者的姿態重新出現在摩西面前，為利未記中就任大祭司鋪路。利8、9章他正式受膏就職、首次以大祭司身分獨立獻祭；利10章隨即經歷喪子之痛與職分試煉；利16章他成為全會眾中唯一被授權一年一次進入至聖所行贖罪禮的人。到民數記1-9章，他的身分已穩固成傳達律例的中介，與摩西一同被神呼召。但民12
    顯示那個老弱點並沒有消失——他與米利暗一同譭謗摩西，KC 直接把這件事接回金牛犢：亞倫「再一次顯出他軟弱的性格。他曾順從百姓的意思，給了他們一隻金牛犢」，如今又順從姐姐；GT
    丁良才的判語是「亞倫本來是個沒有主意的人」。他連認錯的用語都是重複的——GT《聖經精讀本》指出「亞倫在西乃曠野陷在拜金牛犢的罪中時，也是用這樣的話向摩西承認了自己的錯誤（出32:22）」。從一句被
    KC 讀作「削弱」的分工，走到全會眾贖罪的獨一代表，中間隔著一次幾乎致命的失敗；而民12 說明那次失敗的性格根源，在他當上大祭司之後仍在。



    ### 民數記後半：從被質疑的職分，到山頂上的脫衣


    民12 之後，亞倫的祭司職分反倒是被外力打上來的。民16 可拉一黨質疑的正是他這個職位，神的回應是讓香爐分出真假，而瘟疫發作時止住災殃的也是他手上的香爐（民16:47-48）；民17
    十二根杖裡唯一發芽、開花、結熟杏的是利未支派上寫著亞倫名字的那一根，那根杖後來被留在法櫃前作記號；民18 神把擔當干犯聖所罪孽的責任與祭司的職任正式交給他和他的家。三章連著把同一件事釘死：這個職分是神給的，不是人爭來的。


    結局在民20。他因米利巴的事與摩西同受判詞——CT 給了兩個可能的理由：亞倫此時大概和摩西同心生會眾的氣；或當摩西舉杖時，亞倫沒有勸阻他。神隨即在何珥山吩咐摩西「把亞倫的聖衣脫下來，給他的兒子以利亞撒穿上」，他死在山頂，全會眾為他哀哭三十天。GT
    丁良才《民數記註釋》從這裡看見整個制度的限制：「亞倫既死了，就顯明他為祭司的職分不完全（參來七23-25）。」但同一位註釋者也記下神的體恤：「這樣看來，神在亞倫活著（參十七章）和臨終的時候，都使他有大尊榮。」KC
    補上最後一筆：他死前親眼看見兒子穿上了他的衣服，是在尊嚴與平安中離世，不是被從百姓中剪除。'
