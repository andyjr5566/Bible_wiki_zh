- title: 從冊上塗抹（生命冊）
  path: link_folder/互文/從冊上塗抹（生命冊）.md
  definition: 出32:32-33 摩西為犯金牛犢大罪的百姓代求時說「倘或你肯赦免他們的罪……不然，求你從你所寫的冊上塗抹我的名」，耶和華回答「誰得罪我，我就從我的冊上塗抹誰的名」。GT
    引丁良才指出「你所寫的冊」就是生命冊子（參詩69:28、賽4:3、但12:1、路10:20、腓4:3、啟3:5）；啟導本說明在冊子上除名表示「死」，因神在冊子上記著活人的名字，摩西求神抹去他的名，表示願意以身代贖百姓的罪；串珠註釋提醒此處的「冊」上寫著一切活著之人的名字，摩西是在求死，且此「冊」不等於新約的生命冊。GT
    引丁道爾指出這詞的原意大概來自民數記一章等人口調查的紀錄（參結13:9），神子民的名錄或可稱為「神的冊」，新約將這概念靈意化，意指所有進入永生之人的名錄（腓4:3、啟3:5）；舊約聖經背景註釋補充，神明的帳簿在古美索不達米亞是很普遍的概念，簿上所記包括人註定的命運和賞罰。神的回答「誰得罪我，我就從我的冊上塗抹誰的名」顯明神公義的原則——誰犯罪誰受罰（結18:20）；CT
    指出神雖回絕摩西代死的請求，卻樂意由祂自己承擔世人的罪，這是神救恩的原則（彼前2:24）。
  development: 摩西甘願被塗抹名字以代百姓贖罪的心志，預表基督替罪人捨命（賽53:12），保羅在羅9:1-3 為骨肉之親「就是自己被咒詛，與基督分離」的心情與此相呼應。但
    KC 指出摩西不能替百姓死、不能為他們贖罪，唯有主耶穌這位完全無罪的人才能成就代贖。「生命冊」的概念在聖經中逐步展開：詩69:28 願仇敵從生命冊上被塗抹、詩139:16
    未成形的體質都寫在神的冊上、但12:1 凡名錄在冊上的必蒙拯救，直到新約的腓4:3、啟3:5（得勝者的名必不從生命冊上塗抹）、啟13:8、17:8、20:12-15（案卷展開，另有一卷是生命冊）。
