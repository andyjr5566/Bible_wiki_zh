- title: 摩西摔碎法版（廢約的象徵）
  path: link_folder/事件/摩西摔碎法版（廢約的象徵）.md
  definition: 出埃及記32:19記載，摩西手裡拿著神親手所寫、刻有十誡的兩塊法版（15-16節）下山，挨近營前看見牛犢與百姓跳舞，便發烈怒，「把兩塊版扔在山下摔碎了」。GT引丁道爾聖經注釋與中文聖經註釋均指出，此舉並非單純情緒失控，而是象徵性宣告立約無效——百姓在西乃山才剛應許遵行的約（十九8，二十四3、7）既已被他們自己以拜偶像、違背頭兩條誡命的行動實質破壞，摩西便以摔碎見證約文的法版，對應這已破裂的事實；神事後並未因此責備摩西（GT引申命記9:17）。這是「廢約」的具體象徵行動，與其後三十四章神吩咐摩西重新鑿石版、恢復立約（34:1、27-28）形成對照。
