- title: 他備拉
  path: link_folder/地點/他備拉.md
  definition: '以色列人離開西乃的曠野之後第一個被命名的地方。民11:1-3 記百姓發怨言，「耶和華的火」燒到營的邊界，摩西祈求，火就熄了，那地便叫作他備拉。CT
    給這名字的原文字義是「燃燒」，BH 也說 Taberah 在希伯來文意為「burning（焚燒）」。


    **位置沒有確據。** GT《民數記串珠聖經註釋》說「這地方現已不能考據，因以色列人是取其義『火燒』而起名的，原名無從稽考」，並指出它「離西乃山約三日的路程（民10:13），已深入曠野之地」。GT《舊約聖經背景註釋》也說「其確實所在並沒有肯定的考證」。


    **它可能根本不是一個獨立站口。** 民33 的行程表沒有記他備拉，經文也沒有記百姓從他備拉走到基博羅哈他瓦。CT 因此直接判定它是基博羅哈他瓦的別稱。詳見「他備拉與基博羅哈他瓦是否同一地」。


    **火燒的範圍是重點。** 經文說火「直燒到營的邊界」。CT 解為「達到閒雜人所住的地方（參4節；出十二38）」；GT《民數記串珠聖經註釋》說這「是初步的警告，並不算是嚴重的懲罰，因為火只燒了一些營幕的物件，似乎沒有毀滅生命」；KC
    則讀成距離的問題——「神審判的火從營的外圍開始。離神的中心最遠的人，最先落在神懲罰的手下。」'
