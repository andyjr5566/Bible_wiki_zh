- title: 金牛犢事件
  path: link_folder/事件/金牛犢事件.md
  definition: '出32:1-6、19-20、35 記載的以色列人在西乃山下鑄造並敬拜金牛犢的事件。這隻像究竟是什麼，各家從字義與考古兩面下手。GT《丁道爾》先修正譯名：「將希伯來文
    `eg{el 一字譯作牛犢並不很好。這字所指的是年輕力壯的公牛，聖經甚至曾經用以形容三歲大的牛（創15:9）」；GT《串珠》的說法相同：「牛犢：壯牛，約三歲。」考古上有實物可比：GT《舊約背景註釋》指出「考古學家在好幾個遺址（基利波山、夏瑣、亞實基倫），都挖掘到青銅或其他合金製造的公牛或牛犢小像。但這些小像的長度都是只有三至七吋」，而
    CT 也從摩西「挨近營前」才看見（v19）推論「所鑄的牛犢不會太大」。


    它的來歷各家分歧。GT《精讀本》認為是模仿埃及的 Apis 牛神，並列出以色列人在埃及所見的整套神譜（像牛的 Apis、像人的 Ptah 或 Osiris、像鷹的
    Horus 和 Ra 等）；GT 引丁良才卻提出另一種可能：「以色列人未必效法埃及人的風俗，因為神在前不多的時候才敗壞了埃及的神（出12:12；民33:4），他們效法的或者是巴比倫有翅膀的牛神」；GT《丁道爾》則直接排除
    Apis 說：「這像不可能是模仿埃及聖牛亞皮斯（Apis）造成的，因為亞皮斯崇拜的對象不是偶像，而是天生有某種特殊斑紋，被視作牛神不斷化身的普通公牛。埃及女神哈妥爾（Hathor）沒錯是以母牛為代表，但性別不對。」


    它扮演的角色也有爭議。GT《舊約背景註釋》指出在迦南文化裡「所描繪的神明通常不取公牛或牛犢的外形，而是站在這牲畜的背上」，但同一則註釋認為本章不是這種情形：「經文亦無跡象顯示以色列人僅將金牛犢視為座台（如約櫃之為腳凳）。他們在『向耶和華守節』時崇拜這牛犢，顯示所觸犯的是十誡之第二誡而非第一誡。」GT《中文聖經註釋》則認為亞倫與百姓的認知不同：「在亞倫的觀念中，大概並不是以此金牛犢為神，乃是以這牛犢為神的腳凳，或是承載神的……百姓認這金牛犢為神。」'
