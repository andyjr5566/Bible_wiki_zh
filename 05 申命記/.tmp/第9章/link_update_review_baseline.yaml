- title: 十誡
  path: link_folder/神學/十誡.md
  definition: 十誡（Decalogue，希伯來文稱「十句話」）是神在西乃山親自從天上向以色列全會眾頒布的十條基本誡命（出二十1-17），是基督信仰中倫理道德的基本原則，具有永存的價值，普遍適用於全人類。十誡是神授律法的基石，但不是法典；所著重的是總的原則，而非法律的細則。十誡是神親自寫在兩塊石版上的（出三十一18，三十四28），被存放在至聖所的約櫃內——GT
    丁良才把這三項列為十誡「最要緊的三種證據」：唯獨這些誡命是神親自從西乃山曉諭百姓的、唯獨這些誡命是神親自寫在石版上的、唯獨這些誡命是被存在至聖所約櫃內的。十誡的頒布出於耶和華神的恩典，以色列人感謝神拯救其民族脫離奴役的大能作為，自願接受這「十句話」（出十九8）。
  development: '十誡在申命記五6-21重複記載，安息日的理由從創造（出二十11）轉為救贖（申五15）。新約中耶穌歸納十誡為兩大誡命：盡心愛神和愛人如己（太二十二36-39）。耶穌在登山寶訓中深化十誡的內涵，從外在行為延伸到內心動機（太五21-22、27-28）。保羅指出律法的功用刻在人的良心中（羅二15）。十誡作為盟約條款，其文學結構近似古代近東的宗主條約。


    十誡有三種主要的條分法，而各家對「猶太人怎麼分」的記載並不一致：GT《中文聖經註釋》說猶太人以1-3節為第一誡、4-6節為第一誡的解釋、7節為第二誡，並把17節拆為第九與第十；GT《丁道爾聖經註釋》則說猶太教視第2節為第一誡、把3-6節合為第二誡。兩家一致的是另外兩種：基督教傳統以第3節為第一誡、1-2節為序言；改革教派（慈運理、加爾文）提升4-6節為獨立的第二誡、把17節合併為第十誡。傳統上頭一塊版記載人對神的責任、第二塊版記載人對人的責任，因而有三七分與四六分之說。《丁道爾》為這場分歧下了一個要緊的分辨：「以上不同的立場和神學重點並無關連，意見分歧只是顯出傳統數目雖然是『十』，經文如何分列配合來構成這個總數，卻沒有定議。」'
