- title: 滅盡與除滅的雙同字（sha.mad）
  path: link_folder/原文/滅盡與除滅的雙同字（sha.mad）.md
  definition: '申命記4:26 的下半句在中文讀起來像兩個相似的警告：「你們必⋯速速滅盡！你們不能在那地上長久，必盡行除滅。」原文的力道來自一個中文譯不出來的結構。


    **兩處都是同一個動詞連用兩次。** CT〔原文字義〕直接標了出來：「滅盡（原文雙同字）」消滅，消失；「盡行除滅（原文雙同字）」根絕，滅絕。


    STEP 原文資料顯示這兩組的詞形：


    | 和合本 | 原文 | Extended Strong | 形態 | 本節譯義 |

    |---|---|---|---|---|

    | 速速滅盡 | ''a.Vod ／ toe.Du/n | 皆 H6 | 不定詞絕對式＋Qal 未完成 | certainly <to perish> ／
    you will perish |

    | 盡行除滅 | hi.sha.Med ／ ti.sha.me.Du/n | 皆 H8045 | 不定詞絕對式＋Niphal 未完成 | utterly <destroyed>
    ／ you will be destroyed |


    簡要詞典義分別是 a.vad: to perish 與 sha.mad: to destroy。希伯來文用同一動詞的不定詞絕對式加限定式來加強語氣，中文只能靠「速速」「盡行」這類副詞補。


    **這是本章判詞的頂點。** CT 文意註解：「意指拜偶像的結局，必然招致滅族。」BH 則指出這裡的毀滅「is not only physical but
    also spiritual, as it represents a severing of the relationship with God」（不只是肉身的，也是屬靈的，因為它代表與神的關係被切斷）。


    **但它不是最後一句話。** 第31節緊接著說「他總不撇下你，不滅絕你」——那裡用的是另一個字根（sha.chat，見[[敗壞與滅絕同一字根（sha.chat）]]）。判詞用
    sha.mad，赦免用 sha.chat 的否定式，兩者並不互相取消。'
  development: '**同一個字根，兩章各用一種語氣。** 申4:26 是這個字根在申命記裡最強的一次出現：hi.sha.Med 與 ti.sha.me.Du/n
    連用，不定詞絕對式加限定動詞，中文只能靠「盡行除滅」補出力道，而它前面還疊著另一組同樣結構的 H6（a.vad）。那是本章判詞的頂點，講的是拜偶像必然招致滅族。


    申6:15 用的是同一個字根，形態卻簡單得多——ve./hish.Mi.de./kha，單獨一個 Hiphil，接在「忌邪的神」與「怒氣向你發作」之後，中文只譯成「除滅」兩個字。


    兩處的共通點是觸發條件完全一致：都因著隨從別神。差別在於申4 的語氣是宣判，申6 的語氣是預防——一個講犯了會怎樣，一個講所以不要犯。而兩章都把這個字綁在同一件事上：留得住那地，或被從那地上除去。CT
    在申6:15 指出這個警告後來真的應驗，南北兩國先後滅亡、人民被擄分散列國，正好回頭印證了申4:26 那段判詞不是虛言。'
