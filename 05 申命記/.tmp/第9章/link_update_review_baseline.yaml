- title: 摩西為百姓代求（金牛犢）
  path: link_folder/互文/摩西為百姓代求（金牛犢）.md
  definition: 出埃及記32章記載摩西兩次為百姓向神代求。第一次（7-14節）：神因金牛犢事件宣告百姓「硬著頸項」，欲發烈怒滅絕他們、使摩西的後裔成為大國（10節），摩西以三重理由懇求：（1）百姓是神用大力大能的手從埃及地領出來的（11節）；（2）恐埃及人議論神懷惡意，領百姓出來是要降禍與他們（12節）；（3）求神記念向亞伯拉罕、以撒、以色列所起的誓（13節），於是「耶和華後悔，不把所說的禍降與祂的百姓」（14節）。第二次（30-35節）：摩西下山處置罪行後再次上山，說「或者可以為你們贖罪」（30節），向神承認「這百姓犯了大罪」（31節），甚至甘心代求「倘或你肯赦免他們的罪……不然，求你從你所寫的冊上塗抹我的名」（32節），神回應「誰得罪我，我就從我的冊上塗抹誰的名」，仍差摩西繼續領百姓前行，只是「到我追討的日子，我必追討他們的罪」（33-34節）。中文聖經注釋指出，摩西自受召以來不斷做這「中保」的工作（參羅8:26、34；來7:25），聖經精讀本則將摩西甘願被塗抹名字的心志與保羅在羅馬書9:1-3的心情相比擬。
