  summary: 第2節說那民是亞衲族的人，又大又高，並引用一句流傳的話：誰能在亞衲族人面前站立得住呢？STEP 原文資料為 be.Nei 'a.na.Kim（H1121A＋H6062）與 be.Nei 'a.Nak（H6061）；CT 的〔原文字義〕給「亞衲」是頸項，文意註解說這是一種身材魁偉的巨人族（參民13:33）。BH 補上他們的名聲本身就足以叫以色列人猶豫。
