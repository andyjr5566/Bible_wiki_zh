  path: link_folder/神學/四十晝夜.md
  summary: 本章四次出現四十晝夜：第9、11節是摩西上山領受石版的期間，第18節是摔碎法版之後的俯伏代求，第25節又說在耶和華面前照舊俯伏四十晝夜。CT 在第25節留下一個問題：聖經僅記載摩西兩次在神面前四十晝夜（參出24:18；34:28），故本節若不是重複記載第二次的事，便可能另有第三次。GT《聖經精讀本》則說聖經中的四十一般指一個世代，或試驗與磨練、審判與悔改等的期間。
