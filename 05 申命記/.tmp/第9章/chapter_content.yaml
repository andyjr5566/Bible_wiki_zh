organization: "### 一、敵人很大，但問題不在敵人（v1-3）\n\n這一章的開場和第8章一樣是一句呼喚：「以色列啊，你當聽！」（見[[以色列啊你要聽（sha.ma）]]）。KC\
  \ 指出這個開場是申命記的特色，作用是把注意力叫回神要說的話上。\n\n接下來摩西把敵人形容得非常可怕：比你強大的國民、廣大堅固、高得頂天的城邑、又大又高的[[亞衲族與偉人拿非林|亞衲族]]，還加上一句流傳已久的話——誰能在亞衲族人面前站立得住呢？CT\
  \ 注意到一件事：「『廣大堅固、高得頂天』這句言過其實的話，是引用那十個膽怯的探子所說的」（參申一28）。KC 讀出的重點略有不同，他說摩西之所以用那些不信的探子用過的字眼，是因為敵人的力量本來就是事實，我們不該小看仇敵的力量，而是要倚靠更大的力量——神的力量。==兩家都注意到摩西在引用探子的話，但一家看見的是誇張，一家看見的是實情。==\n\
  \nSTEP語言資料在第1節給的字是 u./ve.tzu.Rot（H1219）與 ba./sha.Ma.yim（H8064，heaven），也就是「堅固」到「頂天」的那組詞；CT\
  \ 的〔原文字義〕在這裡把「高得」解作難以進入、「頂天」解作天空。\n\n第3節把答案給了出來：耶和華在你前面過去，如同[[烈火]]。STEP語言資料顯示這是\
  \ 'esh 'o.khe.Lah（H784 火＋H398 吞吃）；CT 的〔原文字義〕給「烈」是吞噬，文意註解說這火是因迦南原住民拜偶像假神而惹動的忌邪怒火。GT《啟導本聖經申命記註釋》從另一面補：神走在祂的子民前面，與他們一同作戰，取得勝利。\n\
  \n### 二、三次說「不是因你的義」（v4-6）\n\n第4到6節是全章的論證核心，同一句話講了三次（見[[不是因你的義（tse.da.qah）]]）。第4節是「不可說⋯是因我的義」，第5節是「並不是因你的義，也不是因你心裡正直」，第6節再說一次「並不是因你的義」。\n\
  \n摩西同時給出真正的兩個原因：\n\n| | 真正的原因 | 出處 |\n| --- | --- | --- |\n| 一 | 這些國民的惡——CT 說他們由於拜偶像的惡行而失去了迦南地的所有權（見[[亞摩利人罪孽滿盈]]）\
  \ | v4、v5 |\n| 二 | 神要堅定他向列祖亞伯拉罕、以撒、雅各起誓所應許的話（見[[亞伯拉罕之約]]） | v5 |\n\nGT《申命記串珠聖經註釋》把整段的意思寫成一句話：神向他們施慈愛「並不是因為他們有什麽好處，而是由於純粹的恩典和神當初所說的應許」。GT《聖經精讀本》再把創15:16\
  \ 那條線拉出來，說迦南人被滅的根本理由正是他們的罪孽，那是亞伯拉罕領受啟示之後七百年來不斷加增而無法得到赦免的罪。KC 則把這句話直接轉向讀者：不要以為神給我們屬靈的福分是因為我們比周圍的人更好、更忠心。\n\
  \n> [!note]\n> 這一段與申6:25 的「這就是我們的義了」要並讀。同一位摩西在兩處講的不是同一件事——申6 講的是遵行誡命的結果，申9 講的是得地的原因（見[[遵行誡命是我們的義]]）。\n\
  \n第6節收在一個判詞上：==你本是[[硬著頸項的百姓]]。== STEP語言資料作 ke.sheh 'O.ref（H7186 severe ＋H6203 neck）；GT《申命記雷氏研讀本》說這比喻來自那拒絕負軛的不聽話的牛，GT《申命記串珠聖經註釋》則說這比喻源於不受制馭的野驢，兩家給的動物不同。這句話在第13節由神親口再說一次。\n\
  \n### 三、悖逆史：從何烈山數起（v7-24）\n\n第7節起，摩西開始舉證。他用的是一個命令：「你當記念不忘」——同一句話裡放了[[「記念」與「守」|記念]]（H2142\
  \ za.khar）和[[忘記（sha.khach）|不忘]]（H7911 sha.khach）兩個動詞，而第8章要人記念的是神的恩待，這裡要人記念的是自己的失敗。\n\
  \n這段悖逆史的第一站是[[何烈山]]，也就是領受十誡的那座山。摩西先鋪陳自己上山的經過（見[[摩西上山領石版]]）：領受兩塊[[石版]]、住了[[四十晝夜]]沒有吃飯也沒有喝水；那版是[[神的指頭（路11：20）|神用指頭寫的]]，寫的是耶和華在[[大會的日子（qa.hal）|大會的日子]]從火中所說的[[十誡|一切話]]。\n\
  \n然後第12節把場景切開。神叫摩西趕快下去，理由是百姓已經敗壞了自己、快快地偏離了他所吩咐的道，[[不可為自己雕刻偶像|為自己鑄成了偶像]]（見[[金牛犢事件]]）。這裡有一個\
  \ STEP 才看得清楚的細節（見[[快快地（ma.her）]]）：\n\n```mermaid\nflowchart LR\n  A[\"v3 使他們速速滅亡（迦南人）\"\
  ] --> C[\"同一個字 ma.her（H4118B）\"]\n  B1[\"v12 你起來，趕快下去\"] --> C\n  B2[\"v12、v16 快快地偏離\"\
  ] --> C\n  C --> D[\"審判來得快，偏離也來得快\"]\n```\n\nGT《聖經精讀本》把這個「快」放進時間軸：拜金牛犢的事件發生在百姓聽神親自宣告十誡之後尚未滿四十日的時候。GT《聖經精讀本》另指出第12節神的用語本身就是警訊——他不再稱以色列為我的百姓，而是稱為「你的百姓」，因為拜偶像的罪已經破壞了聖約。\n\
  \n第14節是全章最重的一句話：「[[你且由著我（ra.phah）|你且由著我]]，我要滅絕他們，將他們的名從天下塗抹」（見[[從冊上塗抹（生命冊）]]）。STEP語言資料把「你且由著我」標為\
  \ He.ref（H7503 ra.phah，簡要詞典義 to slacken，使役語幹命令式），CT 的〔原文字義〕給「下沉，放鬆」，文意註解直接解作不要為他們求情。KC\
  \ 說神彷彿是在向摩西請求容許他毀滅這百姓；BH 說這是對摩西代求職分的一種考驗。神同時提出另一個方案：使你的後裔比他們成為更大更強的國。\n\n接下來的動作一件比一件重：摩西轉身下山，[[摩西摔碎法版（廢約的象徵）|在你們眼前摔碎了]]兩塊版。GT《啟導本聖經申命記註釋》給了一個背景上的解釋，說「摩西摔碎法版並非他個人的暴怒行動」，因為古代雙方訂約時如有一方毀約，他方就扔碎書約之石表示作廢；GT《申命記串珠聖經註釋》同樣說摔碎「象徵神和選民所立的盟約即告廢除」。KC\
  \ 讀的方向一致：摔碎表達的是百姓已經摔碎了他們與耶和華的關係，摩西不過是把這件事蓋上印。\n\n第18到21節是摩西的第一輪處理：俯伏四十晝夜（見[[摩西為百姓代求（金牛犢）]]）、為[[亞倫]]祈禱、把牛犢用火焚燒搗碎磨細撒在溪水中。三家在這裡各補一筆——CT\
  \ 從金子的比重推想那牛犢並不太大，也注意到出埃及記另記了摩西叫以色列人喝那水；GT《聖經精讀本》說那偶像可能是先用木頭雕出形狀再鍍上金；KC 說代求並不使審判罪惡的行動變成多餘，摩西把牛犢磨到不能再用，這是無限的恩典——神接受偶像被毀滅，代替拜偶像之人被毀滅。第19節記下結果：那次耶和華又應允了摩西（見[[摩西代禱熄滅神怒（詩106：23）]]）。\n\
  \n第22到24節再補三處地名一件事：[[他備拉]]、[[瑪撒（Massah）|瑪撒]]、[[基博羅哈他瓦]]，然後是[[加低斯巴尼亞事件|加低斯巴尼亞]]。GT《啟導本聖經申命記註釋》逐一給出處：他備拉是惡語譭謗神（民十一1～3），瑪撒是因缺乏食水而發怨言（出十七1～7），基博羅哈他瓦是起貪欲埋怨神（民十一31～34）。KC\
  \ 把加低斯巴尼亞的性質單獨點出來，說那裡講的是不信。CT 在第22節的〔話中之光〕把這串事件歸納成兩類罪：一類是人不要神，要為自己造假神代替真神；另一類是人不信神，要以自己為神。\n\
  \n### 四、摩西的三個理由（v25-29）\n\n最後五節是[[摩西的代求]]的全文。他沒有替百姓找任何可取之處，而是換了三個角度求神：\n\n1. **他們是你的產業**（v26、29）——是你用大力[[救贖]]的，用[[大能的手|大能]]從埃及領出來的（見[[產業（na.cha.lah）]]、[[出埃及]]、[[伸出來的膀臂]]）。\n\
  2. **求你記念你的僕人亞伯拉罕、以撒、雅各**（v27）——不要因百姓的過犯而不顧對列祖的應許。\n3. **免得那地之人說**（v28）——不要讓外邦人以為耶和華是因為不能、因為恨才把百姓領出來殺在曠野。\n\
  \nCT 把這三項整理成同樣的順序，GT《申命記串珠聖經註釋》給的三條也一樣。KC 注意到第27節那個字：這是他數到的第三次「記念」（申8:2、申9:7、申9:27），而這一次摩西不是對百姓說，是對神說。\n\
  \n> [!important]\n> 摩西的三個理由沒有一個建立在百姓身上。第一個講神做過什麼，第二個講神應許過什麼，第三個講神的名。這正好是第4至6節那句「不是因你的義」的實際操作。\n\
  \n### 五、兩個原文字根怎麼串起全章\n\n本章有兩個動詞值得單獨看，它們把散開的段落縫在一起。\n\n第一個是 sha.mad（H8045，見[[滅盡與除滅的雙同字（sha.mad）]]）。STEP語言資料顯示它在本章出現六次，而對象一路在換：\n\
  \n| 節次 | 對象 |\n| --- | --- |\n| v3 | 迦南人——神要滅絕他們 |\n| v8、v14、v19、v25 | 以色列——神要滅絕你們\
  \ |\n| v20 | 亞倫——神要滅絕他 |\n\n==同一個動詞，第3節還指著迦南人，第8節就轉向以色列自己。==這正是第4至6節那個論證的語言證據：以色列與被趕出的列國，在同一個判決動詞底下並沒有本質差別。\n\
  \n第二個是 sha.chat（H7843，見[[敗壞與滅絕同一字根（sha.chat）]]）。第12節神說「你從埃及領出來的百姓已經敗壞了自己」，第26節摩西說「求你不要滅絕你的百姓」——中文一個是敗壞、一個是滅絕，原文卻是同一個字根。人先毀了自己，摩西才求神不要照著毀下去。\n\
  \nKC 為本章與前一章的分工留了一句話：申命記第8章講的是神在曠野怎樣待這群人，第9章講的才是百姓自己的不忠。兩章合起來，[[曠野]]那四十年就有了兩面——一面是[[美地]]之前的恩待與管教，一面是從[[何烈山]]數到[[加低斯巴尼亞事件|加低斯巴尼亞]]的一長串悖逆。"
