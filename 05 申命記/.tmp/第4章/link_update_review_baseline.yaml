  definition: 出13:3、9、14、16 四次用同一句話收束同一件事：「耶和華用大能的手將你（們）從埃及領出來。」CT 給「大能的」的原文字義是「強壯的，堅固的，強大的」，並解釋第3節這句話所指的是實事：「神使十災臨到埃及人身上，迫使法老容許以色列人出埃及。」BH
    也說這是一個比喻，指的是神大有能力、有主權的作為，並強調出埃及「不是靠人的努力成就的，是靠神的能力」。
  development: '**它是一句救贖的公式。** 這句話在本章的位置不是隨意的：三次出現在教導的場合（第9節「使耶和華的律法常在你口中」、第14節父親回答兒子、第16節結語），一次出現在命令的場合（第3節「你們要紀念……有酵的餅都不可吃」）。GT《中文聖經註釋》指出第3-10節整段的用意就在這裡：「藉這機會教育兒女有關神的大能和揀選他們的恩慈。因為這件事是那麼的重要，他們必須像做記號在手上和額上般的，使神的律法常在口中，不致或忘。」


    **父親要說的是自己的經歷。** KC 注意到第8節的答覆並不是一篇道理：「這解釋不是一篇論埃及所發生之事的神學論文，而是一家之主親自的見證。他要講的是耶和華在他的救贖上親自為他所作的事。」


    **新約的接法。** CT 在第14節下把這句話交給讀者：「每一個基督徒，都是神用『大能的手』將我們拯救出來的；因為我們之所以能夠相信主耶穌基督，『不在乎人的智慧，只在乎神的大能』（林前二5）。」BH
    也指出這是舊約反覆出現的用語（申5:15；詩136:12），標誌著神在歷史中的介入。'
