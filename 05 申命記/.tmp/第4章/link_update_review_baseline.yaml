- title: 立約
  path: link_folder/主題/立約.md
  definition: 在創世記中，立約是神與人、人與人之間建立關係的正式行動。以撒與亞比米勒在別是巴立約互不侵犯。
  development: '### 創26：條約如何生效


    GT《舊約背景註釋》說明第28-30節的和平條約「足以構成鄰邦認可以撒在本地居住的證據」，而協定的生效方式是具體的：「在同享筵宴和起誓之後便即生效」。GT《聖經精讀本──創世記註解》給的說法相同——設擺筵席表示以撒理解並接受對方提出的友好條約，而「簽約的友好宴會是古代的慣例，以更加堅固同盟關係為目的」（比較創三十一54）。BH
    也指出在古代近東，同席吃喝本身就是立約與和好的表記。


    背景註釋並把這件事放進族長的行為模式裡：亞伯拉罕昔日如何築壇（創十二章）和確立對地的所有權（創二十三章），以撒在此也是一樣。


    ### 立約的一方說了不實的話


    第29節亞比米勒說「正如我們未曾害你，一味地厚待你」。CT 直接指出這話並不正確，因為基拉耳的牧人曾與以撒的牧人爭競（19-21節）；丁良才列出兩條理由——亞比米勒背了與亞伯拉罕所立的約（比較創二十一22-34），基拉耳的牧人也與以撒的牧人相爭。GT《聖經精讀本──創世記註解》措辭更重：以撒被驅逐、辛苦挖出的井被對方奪去，「亞比米勒此番話語不過是窘迫之人的狡辯而已」。


    以撒沒有反駁這句話，只設擺筵席。條約仍然成立——但經文留下了這個不實的措辭，沒有替它修飾。'
