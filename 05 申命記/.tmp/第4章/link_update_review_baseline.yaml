- title: 密雲
  path: link_folder/神學/密雲.md
  definition: 出19:9「我要在密雲中臨到你那裡」，v16「在山上有雷轟、閃電，和密雲」。CT 給的原文字義是「黑雲，雲層」，並說「『密雲』原文意指『雲中最後之處』，在聖經中經常表徵神的臨在」（詩97:2；結30:3）。GT《丁道爾聖經註釋》的譯法相近：「依照希伯來慣用語，這詞或可譯成『雲中最厚之處』。雲和黑暗經常是神臨在的象徵。」BH
    說密雲同時表明神的臨近與超越——它遮蔽了祂完全的榮耀，因為那榮耀是人無法承受的（出33:20），並把它接到引領以色列人的雲柱（出13:21）。
  development: '**這朵雲要達成的是信任。** CT 說神降臨的目的是「叫以色列人能夠聽見神與摩西說話的聲音，這樣，就會相信摩西所說的乃是從神來的，並且傳到永世」。GT《中文聖經註釋》把這個目的講得更直白，並接到新約的中保觀念：「這節話目的在抬高摩西的地位和剔除百姓對他埋怨的記憶，以致影響他在領受律法上的『中保』地位」（加3:19）。GT《聖經精讀本》的兩點相同：「①讓他們明白將要傳達的律法的重要性；②為使他們認可摩西的權威，使其相信摩西。」BH
