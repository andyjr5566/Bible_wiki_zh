- title: 平安祭
  path: link_folder/神學/平安祭.md
  definition: '**平安祭是五祭中唯一三方同享的祭：脂油歸神、胸與右腿歸祭司、其餘的肉歸獻祭的人和他請來的親友。** 它是自願獻上的，不是為了贖某一件罪，而是為了表達感恩、還願或單純的樂意。


    **這個名字是什麼意思？各家給的字義相近但取向不同：**

    - **CT**：「此名詞在希伯來文表示『和好』或『福祉』」；原文字義欄另給「平安」為感恩、聯盟、友誼。

    - **GT《啟導本》**：原文含有「和平」、「相契」、「完全」等意思，表示人與神的和好。

    - **GT《精讀本》**：希伯來語意為「報答」、「賠償」、「重新給」，是感謝神恩典而自願獻上的祭。

    - **GT《利未記雷氏研讀本》**：直譯作「和睦或快樂的祭」。

    - **BH**：又稱「相交之祭」（fellowship offering），象徵獻祭者與神之間的復和與相交。


    原文是 שֶׁלֶם（H8002，複數形 shelamim），STEP 的詞典義即「peace offering」；經文的完整說法是「זֶבַח שְׁלָמִים」——平安祭的「祭牲」（H2077）。


    **它分三種。** 丁良才與 GT《精讀本》都列出同一組：感謝祭、還願祭、甘心祭（利7:11-18），三者「都有酬恩的意思」。以色列人在喜樂的日子和過節時多獻這祭（民10:10；王上8:63；撒上11:15；撒下6:17）。


    KC 指出承接聖職之祭是「一種特別的平安祭」；GT《精讀本》另從供養的角度讀它：「在平安祭中有亞倫和他的兒子當得的份，意味著神為自己的工人提供應得的糧食。」'
  development: '### 從立約的筵席，到節期的常規，再到主的桌子


    平安祭在聖經裡走的是一條「從特例到常規」的路。


    **第一段：立約與就職（出20、出24、出29）。** 出20:24 首次把它與燔祭並列；出24:5 用它立約——GT《舊約聖經背景註釋》指出這種祭適合立約，正因為「它是為參與者分享而設的」，燒在壇上的只是一部分，其餘用來設宴；出29
    則把它編進祭司承接聖職的程序。


    **第二段：正式立法（利3、利7）。** 利3 規定怎麼獻，利7 補上怎麼吃、誰拿哪一份，並分出感謝祭、還願祭、甘心祭三類。


    **第三段：進入日常與節期（利8-10、利17、利19、利22、民6、民10）。** 利9 是百姓第一次實際獻上；利17 規定凡宰牲都必須帶到會幕門口獻為平安祭，防止私宰淪為獻鬼；利19、利22
    反覆強調祭肉的時效與無殘疾；民6 用在拿細耳人還俗；民10:10 把它綁進節期與月朔，配上吹號。


    **新約的收束。** 基督在十字架上成就了和平（西1:20），使人與神和好（羅5:1；弗2:14-17）。KC 把平安祭直接接到主的桌子：哥林多前書 10
    章解釋了這祭對信徒的意義，「神與主耶穌和祂所有的人之間的交通，在主的晚餐中被慶祝」。從一場立約的筵席，到每個節期的常規，再到擘餅的桌前——這祭始終是同一件事：因著已成就的贖罪，神與人同席。'
