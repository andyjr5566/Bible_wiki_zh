  development: '柱像的禁令在四章裡出現四次。出二十三24 說「盡行拆毀」，出三十四13 與申七5 都說「打碎他們的柱像」，利二十六1 則是連立都不可立。GT
    丁良才在出二十三下指出這條命令針對的是戰勝國的習慣：「古時的人戰勝別國以後，就多保存那國的偶像，為本國戰勝他國的紀念品，神卻禁止以色列人這樣行，免得他們陷於拜偶像的罪中」。BH
    也說砸碎聖石是公開宣告這些神明無能、耶和華至上。


    這四章合起來還交代了一件容易混淆的事：立石本身不是罪。GT《丁道爾聖經註釋》在出二十三下說明「族長時代使用這些石頭並無不良的意義（創二十八18），但如今有了迦南的巴力崇拜作為背景，情況就不同了」；BH
    在出三十四下也指出，這些立石在迦南宗教中既作為神明的象徵，也作為重大事件的紀念碑——同一個物件承載兩種功能，律法要毀的是前者。


