- title: 安息
  path: link_folder/神學/安息.md
  definition: 神在第七日歇下創造的工作，因為工作已經完成。創世記2章2-3節使用希伯來動詞 שָׁבַת（*sha.vat*，H7673A），意思是「停止、歇下」；後來表示「安息日」的名詞
    *shabbat* 與這個動詞相關。註釋由第七日蒙福、被分別為聖的整體敘事，進一步發展安息日與救恩安息的神學。
  development: '### 神學意義／研讀意義


