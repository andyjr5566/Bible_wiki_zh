- title: 舉祭
  path: link_folder/原文/舉祭.md
  definition: 舉祭原文 תְּרוּמָה（H8641），STEP 作「contribution／奉獻物」。至於實際獻祭動作是否向上舉起，或主要指從百姓中分別出來歸給神的特別貢物，各註釋與詞典有進一步討論。GT
    引丁良才用兩個動作把兩者分開：「『搖』就是前後平搖」，「『舉』就是向上舉起」；CT 的說法相同：「『搖祭』指呈平面前後搖動；『舉祭』指呈垂直上下抬放。」GT《精讀本》指出它「同搖祭一樣是祭祀的一種方法」，希伯來原文有「高舉」「高抬」的意思，而適用範圍遠超過祭肉：「不僅是平安祭中的祭物的右大腿（利7:32）、連土地的產物、十一奉獻、葡萄酒、油等都獻為舉祭（民18:8,19,24-29；尼10:39）。」被舉起的部位在本章是右腿，CT
    註明「『右腿』或譯作右肩，代表事奉的能力」。
  development: '### 從平安祭的固定份，到還俗與供養制度


    舉祭最早出現在承接聖職與平安祭的常規條例裡（出29、利3、利7），指的是祭牲中「所舉的腿」，與「所搖的胸」一同歸給祭司永得的分（利7:32）。民數記把同一個名稱用在兩個新場合：民5:9
    是以色列人一切聖物中歸祭司的舉祭，民6:20 則是拿細耳人還俗時，搖祭之物「與所搖的胸、所舉的腿同為聖物，歸給祭司」。到民18 它進一步成為祭司與利未人整套供養制度的名目。


    這條線的重心，是從一次性的授職動作，慢慢變成祭司家族固定的生活來源。BH 在民6 說明其中的道理：胸與腿是祭牲中的上選部位，歸給祭司顯出這個職分所受的尊重；而祭司沒有地業、靠供物維生，因此這條規定同時是供養制度的一環，新約以此類比傳福音的靠福音養生（林前9:13-14）。'
