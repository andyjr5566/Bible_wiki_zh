- title: 網羅
  path: link_folder/原文/網羅.md
  definition: 網羅原指捕捉鳥獸的陷阱，也可比喻使人落入毀滅的誘惑或危險。出10:7 中法老的臣僕把摩西稱為埃及的網羅，形容他們認為災禍因摩西而來；出23:33
    與申7:16 則說事奉迦南人的神會成為以色列的網羅。申7:25 又把貪圖偶像上的金銀列為同一種陷阱，讓宗教引誘與財物誘惑落在同一意象下。
  development: '出埃及記第十章第一次使用網羅意象時，是法老的臣僕把摩西視為使埃及受災的陷阱。這句話反映臣僕已看見埃及敗壞，卻仍從埃及的角度把危險歸到摩西身上。


    出埃及記二十三章把意象轉到以色列自己：真正會把他們帶向滅亡的網羅，是容留當地居民並事奉他們的神。申命記七章沿用這個宗教警告，第16節說七族的神會成為網羅；第25節又補上物質的一面，連偶像上的金銀也不可貪圖，免得因此被纏住。三章合看，網羅既可形容人所認定的外在威脅，更可指人因敬拜與貪欲而落入的毀滅性陷阱。'
