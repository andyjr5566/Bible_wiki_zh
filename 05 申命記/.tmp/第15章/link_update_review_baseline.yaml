- title: 保護弱勢
  path: link_folder/主題/保護弱勢.md
  definition: 出二十二21-27 一連保護四種人：寄居的、寡婦、孤兒、貧窮人。GT《舊約聖經背景註釋》指出前三者「是古代社會軟弱無助的三個階層。這些人易受欺凌，所以特別得神關顧，不許別人壓迫他們，又咒詛壓迫者，使他們遭受同樣的厄運」。GT《丁道爾聖經註釋》則指出這一段的根據不在條件而在神的本性：「以色列必須關顧窮乏無助的人，因為耶和華也關顧他們：這是祂的本性。」
