- title: 脂油和血都不可吃
  path: link_folder/神學/脂油和血都不可吃.md
  definition: '利未記 3:17 的禁令：「在你們一切的住處，脂油和血都不可吃。」原文兩個關鍵字是 חֵלֶב（H2459，脂油）與 דָּם（H1818，血）。


    **兩樣東西被禁的理由不同。** CT 分得很清楚：「『脂油』是為焚燒獻給神的；『血』是為贖罪，故兩者都不可吃。」一個是因為已經歸給神，一個是因為它是贖罪的憑據。GT《精讀本》從另一角度說同一件事：「脂油被視為維持生命的力量根源，血被視為生命本身或生命的根源。」KC
    的講法最短：神保留脂油與血的權利，因為祂是生命的賜與者，而生命在血中。


    **禁令的範圍比想像的寬。** 丁良才指出：「在你們一切的住處」是「或在會幕，或在家中」；而所禁的「無論是獻上的，或是不獻之牛羊的脂油和血都不可吃」。也就是說，這不只是祭壇規矩，是日常飲食規矩。


    **一個常被混淆的地方。** GT《啟導本》特別提醒：「《申命記》十二15～16禁止吃血，但沒有禁止吃脂油，因所講的事與這裡完全不同，不可混淆。」申12 講的是平常宰殺食用的牲畜，本節講的是聖所條例下的規範。同一份註釋另補上健康的一面：血可能帶病菌，大量吃脂油會使膽固醇升高。


    違例的罰則寫在利7:25、27：必從民中剪除。'
  development: 脂油禁令範圍：1) 平安祭脂油歸神焚燒（利 3:3-5, 9-11, 14-16）；2) 一切牛羊脂油不可吃（利 7:23）；3) 非祭牲脂油可作別用（利
    7:24）；4) 違者從民中剪除（利 7:25）。神學意義：脂油表徵基督豐盛內在生命完全歸神，信徒不可自取。
