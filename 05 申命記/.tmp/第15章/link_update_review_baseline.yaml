- title: 永遠服事的奴僕
  path: link_folder/神學/永遠服事的奴僕.md
  definition: '出埃及記二十一5-6 給六年期滿的奴僕留了一條反向的出路：他若明說「我愛我的主人和我的妻子兒女，不願意自由出去」，就由主人帶到審判官那裡、在門框前穿耳，「他就永遠服事主人」。CT
    指出這個決定的動機是愛：「『我愛我的主人』意指他被主人的恩情打動，願意終身回報」，而「『愛』是人甘願放棄自由的動機，愛使人樂意付出代價」。CT 並引摩根把這種身分抬得很高：「神不許任何人擁有一些男人或女人，作為他永久的財產。然而，卻有一種例外，就是由於為奴者定意的揀選，人可以終身為奴，服事別人。這種揀選，乃是因為愛的緣故。這一種出於愛的揀選，絲毫沒有可鄙的因素。這一種服事至為高貴。」


    「永遠」該理解到哪裡，各家有分歧：GT《丁道爾聖經註釋》說「這是原文直譯，正確的意思該是『終生』」，GT 丁良才則記下另一種讀法——「猶太的注釋家解釋說，是到下次的禧年」。'
  development: KC 把出二十一6 排進一條三段的線裡：詩篇四十指向祂進入世界（「我的耳朵你已開通」），以賽亞書五十指向祂行過世界（「主耶和華開通我的耳朵」），出埃及記二十一則指向祂離開世界時，把自己交出來永遠作屬祂之人的僕人。KC
    並注意到七十士譯本把詩四十7 直譯的「你為我挖通了耳朵」轉譯為「你曾給我預備了身體」，而希伯來書十5 引用的正是後者：開通的耳朵是聽的憑藉，身體是行出意願的憑藉。
