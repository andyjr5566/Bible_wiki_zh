- title: 出23：10-11安息年執行
  path: link_folder/解經爭議/出23：10-11安息年執行.md
  definition: 安息年是全國同時奉行，還是各塊田地按各自得地的時間分別計算？這在經文中並無交代。GT《丁道爾聖經註釋》坦言：「我們不知道安息年應是全國同時奉行，還是以最初得地的時間為準，每塊農田各有不同的年分。馬加比時代的安息年是全國同時舉行的，但在較早的時期，則可能沒有大規模奉行。」
  development: 另一個爭議是休耕的規模。GT《舊約聖經背景註釋》提出一個實務上的可能：「以色列的農夫可能是每年休耕田地的七分之一，而不是全年不耕種整片田地。」GT《中文聖經註釋》另記下一種起源說：有些學者認為不耕不種的起源是古代土地公有、「地主」只有使用權，「但經文的本身，無法證明此說的對與不對」。
  signals:
