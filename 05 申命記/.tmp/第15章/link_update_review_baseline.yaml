- title: 「希伯來人」的意義
  path: link_folder/原文/「希伯來人」的意義.md
  definition: '「希伯來人」（Hebrew）在創世記十四13 首次出現，用來標識亞伯蘭的身分。四份來源對這個名稱的由來給出三種並存的說法，彼此不必互斥：


    1. **「過來之人」**——CT 與 GT 丁良才《創世紀註釋》都說此名意為「過來、渡過河」，指亞伯蘭原住在伯拉大河東邊，蒙神呼召渡過大河移居迦南地；CT
    並註明這是聖經裡第一次出現這名，後來也用來稱呼以色列人（創卅九14、17）。

    2. **源自先祖希伯**——丁良才同時記下另一說：「也有人以為希伯來人是因他們的先祖希伯得名的」；GT《創世記雷氏研讀本》採此說，指希伯來一字源於其祖先希伯（創十一10～14）；GT《聖經精讀本──創世記註解》也說希伯來人是「希伯後裔」的意思，並註希伯的拼法為
    Ebel。

    3. **社會階層而非民族**——GT《舊約背景註釋》指出這個稱號初時只是指外來的人，並指部分學者認為此處的「希伯來人」不是民族名，而是不少古代文獻中稱為「哈比魯」（Habiru）、主要是流離失所的社會階層。GT《啟導本聖經創世記註釋》同樣提到古代近東有近似的字「habiru」，指居無定所的人，並說學者多認為「希伯來」在當日代表社會上一個階層：從外面移居、住在巴勒斯坦地。'
  development: '### 這是別人給的稱呼，不是自稱


    四份來源在這一點上高度一致：本章的「希伯來人」出自外人之口。GT 丁良才《創世紀註釋》說得最直接——這是「外邦人當時稱呼選民所用的名號」，而「以色列人」才是選民自稱的尊號。GT《啟導本聖經創世記註釋》比擬使徒行傳中「基督徒」一名的由來：雖為聖經名稱，卻是非以色列人為他們取的稱號，並指這稱呼含有輕蔑的意思。GT《舊約背景註釋》列出同一用法的其他場合，都是站在外人視角：在埃及的約瑟（創卅九14～17）、埃及主人眼中的以色列奴隸（出二11）、海員眼中的約拿（拿一9）、非利士人眼中的以色列（撒上四6）。


    丁良才另補一項後期用法的區別：新約的「希伯來人」是指說希伯來話的猶太人（相對於說希利尼話的猶太人，徒六1，九29，十一20）；而「猶太人」原只指猶大支派，到以色列國分裂、十支派離散之後，才用來指全國百姓。


    ### 三說如何並存


    「過來之人」與「希伯後裔」兩說並不真正衝突：前者解釋詞義，後者解釋人名來源，而希伯本身就在閃的支系中。真正另立一格的是「哈比魯」說——它把這個詞從血緣移到社會身分，主張同時代文獻中的
    Habiru 指一個流離失所、居無定所的階層。GT《創世記雷氏研讀本》其實把兩者接在一起：希伯來一字源於祖先希伯，「但也廣泛用來稱呼一些象亞伯拉罕那樣的遊牧民族；迦南人認為亞伯拉罕是一個流浪和移居的人，因為他是從吾珥和哈蘭而來的」。


    需要留意分寸：Habiru 與「希伯來」發音相近，但來源說的是「部分學者認為」，並非已證實的等同。GT《聖經精讀本──創世記註解》另指希伯（Ebel）是閃的支系中與亞伯蘭有關的最重要人物（創十21），這是族譜層面的線索，同樣不足以單獨定案。


    ### 在本章敘事中的作用


    KC 注意到經文在這一節「特別強調地」稱他為「希伯來人亞伯蘭」，並把它與亞伯蘭的處境連起來：他是寄居的、是從彼岸來的人，與周圍的政治局勢本無關係，也沒有什麼可失去的，因為神的應許不能被奪走。這個稱呼因此不只是身分註記，也解釋了他為何能置身於四王五王的爭戰之外，卻仍為了救親人而介入。'
  signals:
  - first_in_book
  accumulation_count:
  - 1
  - 2
- title: 弟兄賣身為奴不可像奴僕看待
  path: link_folder/主題/弟兄賣身為奴不可像奴僕看待.md
  definition: '利未記25:39-43：以色列弟兄若窮到把自己賣了，買他的人「不可叫他像奴僕服事你」，要待他「像雇工人和寄居的一樣」，服事到禧年為止，而且「不可嚴嚴地轄管他」。


    **「將自己賣給你」這幾個字是關鍵。** 丁良才特別要讀者注意：「強迫人做奴僕或強取人的兒女做奴婢是不合律法的」，並舉先知門徒的妻子（王下4:1）、西底家時（耶34:8-17）與尼希米時的百姓（尼5:3-5）為當時實際發生過的窘境。


    **理由寫在 v42：「因為他們是我的僕人。」** 丁良才由此列出神領以色列人出埃及的六種目的：使他們得釋放、使他們得自由、將迦南地賜給他們為業、叫他們做神的僕人、彰顯神的大能與美德、使以色列人引導萬國的人歸向神。KC
    的說法一致——所有以色列人都是耶和華的僕人，都從埃及被贖出來得自由，所以誰也不可苛待別人、趁人之危。


    **「不可嚴嚴地轄管」在原文與埃及對照。** 丁良才：「就是不可苦待他，像埃及人苦待以色列人一樣（出1:13）。」串珠：「即虐待他，要他不停作苦工。」BH
    也指出這個詞含有嚴苛壓迫之意，並把這條規定連回出埃及記20:2——神自己曾把以色列從奴役中領出來。


    **禧年會提前終止年限。** 丁良才：按出埃及記21:2 做奴僕以六年為滿，「但在期內若遇禧年，雖然限期未滿，這等僕人也要得釋放」；主人在他得自由時「不可使他空手而去，乃要照神所賜的福將食物給他」（申15:12-18）。他並直說這些條例「本是要阻止富戶的暴行，戒除他們的吝嗇，但他們還是屢次違背」（耶34:8-17）。


    **外邦奴僕另有一套。** v44-46 允許從四圍的國中買奴僕婢女，且可遺留給子孫、不受禧年限制。丁良才在此處寫下一段長註，把當時的奴婢制度攤開來看——來源有戰俘、無力償還盜取財物者、販奴買來的、家生的、親友餽贈的、父母遺留的，尋常價值三十至五十舍客勒；他的結論是「摩西的律法只能漸漸減輕其中的害處，不能立即除掉這惡俗，乃因以色列人心硬」。他並列出律法實際設下的限制：拐帶人口的必被治死（出21:16）；主人若使奴婢受不能復原的傷損，奴婢即得自由（出21:26-27）；主人刑罰奴婢甚至致死要受罰（出21:20-21）。BH
    也強調這與周圍文化中的奴隸制不同，是「一種契約性的僕役」而非嚴格意義的奴隸。'
  development: '這條律例與出埃及記21:2-11 的六年期限、申命記15:12-18 的釋放規定合成一組，而本章加上的是禧年這個上限——無論服事幾年，到禧年一律終止。GT《舊約聖經背景註釋》指出以色列律法「力求防止有人欠債累積到非為奴不可的程度」，禁止收息的規定在絕大部分情況下都是對窮人有幫助的。


    KC 把它轉成新約的處境：基督徒作主人的必須明白自己在天上也有一位主人（西4:1），所以自己同樣是僕人；而「有一位是你們的夫子，你們都是弟兄」（太23:8）。'
