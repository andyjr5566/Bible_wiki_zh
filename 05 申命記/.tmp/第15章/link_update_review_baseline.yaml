- title: 立他名的居所（中央聖所）
  path: link_folder/主題/立他名的居所（中央聖所）.md
  definition: '申命記第十二章從頭到尾在講一件事：獻祭只能在耶和華自己挑的那一個地方。整章六次提到它（第5、11、14、18、21、26節），措辭每次略有不同，指的都是同一處。


    原文把這件事說得很具體。STEP 顯示第5節「立他名的居所」是三個動作接在一起：la./Sum（H7760H，簡要詞典義 sum: to set: put）把
    she.M/o（H8034，shem 名）放在 sham（那裡），後面再接 le./shikh.N/o（H7931，sha.khan: to dwell）。「選擇」是
    yiv.Char（H977，ba.char: to choose），本章六次都用這個字，主詞一律是耶和華。CT〔原文字義〕在第5節給的也是同一組：「選擇」挑選，決定。


    **這是哪裡，申命記自己沒有點名。** CT 說『選擇何處』後來明定必須在耶路撒冷，『立祂名的居所』即指聖殿；第14節的「那一支派」，CT 註明後來所選定的耶路撒冷是在猶大支派境內。GT《啟導本聖經申命記註釋》把過程排出來：曠野時期會幕是中心，進迦南後會幕先設在示羅（書十八1；撒上一3），但為臨時措施，最後由所羅門王在耶路撒冷建殿。GT《申命記雷氏研讀本》補上更多臨時站點——吉甲、伯特利和示羅，都只是聖殿仍未在耶路撒冷建成之前的臨時敬拜中心。KC
    也是同一條線：先是示羅，後來是錫安或耶路撒冷，而聖殿要到出埃及後第四百八十年才動工，等於過了四個多世紀才找到那個地方。


    **為什麼非要只有一處。** GT《聖經精讀本》稱它是「惟一的中央聖所」，並統計本章五次論及（5,11,14,18,26節），說這「暗示了當時迦南地的獻祭制度是異常多樣化」。它給的兩個理由一個是信仰的、一個是社會的：使純潔的耶和華信仰在外邦偶像宗教風俗中得以保存，以及讓分為十二個支派的整個以色列社會結成一個民族共同體。GT《啟導本》說法相同——迦南人的偶像遍地，為防止以色列人偏離正道去敬拜偶像，摩西指出只可在一個中心的地點敬拜神。


    **「他的名」在這裡不是一個稱呼。** GT《聖經精讀本》在第11節說明，舊約時代名字不僅顯明其性情與屬性，還體現人格與存在本身；因此神要將自己的所有權威、榮耀及整個存在都存放在自己親自選定的處所。


    **KC 的重點放在「那一個」這三個字上。** 他說「Scripture does not speak here of a place, but of the
    place.」（聖經在這裡講的不是某一個地方，而是那個特定的地方。），並數出本章六次、後面章節另有十五次，全書共二十一次。他還注意到一件事：舊約裡只有一個人真的去尋找過神選來立名的地方，就是大衛（詩132:3-6）；那個地方神沒有給地址，是要人去求問、去找。


    **地點之後怎麼看。** GT《雷氏研讀本》直接說今天我們的敬拜要集中在成了肉身的道，也就是基督身上。KC 引主耶穌對撒瑪利亞婦人的話（約4:21-24），說神今日居住並要人敬拜的地方不再是耶路撒冷或任何地理位置，而是教會這個屬靈的所在。BH
    的方向一樣，把中央聖所讀成基督的預表，並指出這一節強調的是神的主權——地點不是人挑的，是神挑的。'
  development: '申命記十二章立規矩，申命記十四章第一次處理執行上的難題。


    十二章整章講的是同一件事：獻祭只能在耶和華自己挑的那一個地方，措辭略有不同地出現了六次。那一章沒有交代住得遠的人怎麼辦。


    十四章24至26節補上了。經文先承認困難——當耶和華賜福與你的時候，那地方若離你太遠，那路也太長，使你不能把這物帶到那裡去——然後給出辦法：換成銀子，包起來拿在手中，到了那裡再買牛羊、清酒濃酒。GT《啟導本聖經申命記註釋》說明得很實際：以色列人定居之後住的地方分散，距離敬拜的中心太遠，不方便把田地畜牧所產帶去奉獻。


    值得注意的是這條體恤讓步的是什麼。可以換的是形式，第25節結尾仍然是「往耶和華─你神所要選擇的地方去」，第26節結尾仍然是在耶和華面前吃喝快樂。==賜福帶來的距離問題，解法是換掉貨物，不是換掉地點。=='
