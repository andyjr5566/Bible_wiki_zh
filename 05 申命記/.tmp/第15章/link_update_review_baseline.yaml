- title: 穿耳的儀式
  path: link_folder/背景/穿耳的儀式.md
  definition: 出埃及記二十一6 的穿耳不只是一個象徵動作，它有場所、有見證人、有可能留下的配件，是一套完整的手續。GT《舊約聖經背景註釋》從門的地位說起：「入口是聖潔的地方，在法律上亦具有特別意義。奴隸若是為了保存為奴時所成的家，而自願繼續為奴，合宜的作法是把他帶到主人的門口，然後用錐子刺透他的耳垂，直入門框，象徵式地將奴隸與那地方連在一起。他們可能還會為他加上耳環，來表示他終身為奴。」GT《啟導本聖經腳註》描述同一件事：「給奴僕穿耳，戴上耳環，系以金屬或泥制標記，以示對奴隸的主權。這個儀式似在主人的家門前舉行。」BH
    則指出這在周邊文化是常見作法，用以表示歸屬或效忠。
  development: 穿耳的意義在來源之間並未統一：有讀為產權標記的（《啟導本》、《中文聖經註釋》的名牌記號），有讀為順服記號的（CT、丁良才），也有明說證據不足的——GT《丁道爾聖經註釋》指出「並沒有考古證據，證明穿耳本身表示為奴」。這使本節成為一個罕見的例子：儀式的形式清楚，含意卻仍在討論中。
