- title: 神作為賜福的源頭
  path: link_folder/神學/神作為賜福的源頭.md
  definition: 一切福分的終極源頭是耶和華。創世記30:30雅各對拉班說：「耶和華隨我的腳步賜福與你」；拉班也承認：「耶和華賜福與我是為你的缘故」（30:27）。這兩方面的確認表明：賜福不是來自人的努力或偶像占卜，而是來自神。
  development: 聖經一貫教導神是萬福的源頭。申命記8:18指出「你得貨財的力量是祂給你的」；雅各書1:17說「各樣美善的恩賜和各樣全備的賞賜都是從上頭來的」。創世記30章中，無論是拉班的家業興旺還是雅各的後裔增加，源頭都是耶和華。
