- title: 錐子穿耳
  path: link_folder/原文/錐子穿耳.md
  definition: '出埃及記二十一6 記奴僕自願終身留下時的手續：主人帶他到門前，靠近門框，用錐子穿他的耳朵。STEP 原文數據顯示，「錐子」為 מַרְצֵעַ（martsea''，H4836，尖錐／穿孔器具），動詞「穿」為
    רָצַע（ratza''，H7527，穿刺／刺透）。CT 的原文字義給「錐子」為「尖鑽」、「穿」為「鑽孔，刺穿」，並註明「靠近」在原文並無此字；文意註解把這個動作解為「開通耳朵，含有『順服』之意（參詩四十6）」，「表示從此永遠聽從主人的話」。


    這個動作代表什麼，各家並不一致。GT 丁良才說它「是樂意聽從時常侍奉的標號」；GT《中文聖經註釋》提出實用的一面——「刺耳朵的另一作用，是使耳朵所穿的洞可佩帶屬於主人的名牌或記號」；GT《啟導本聖經腳註》同樣說是「戴上耳環，系以金屬或泥制標記，以示對奴隸的主權」。GT《丁道爾聖經註釋》則兩說並存並附上保留：穿耳「可能是私有財產的記號（正如今日牲口的耳號一樣）。然而並沒有考古證據，證明穿耳本身表示為奴，此舉亦有可能代表順服（詩四十6）」，並指祭司分別為聖時右耳垂要抹血（出二十九20），「可能也是這意思」。BH
    從周邊文化佐證：在古代近東的文化脈絡裡，穿耳是常見的作法，用以表示歸屬或效忠。'
  development: 穿耳的意象在舊約後續被拉向順服而非產權：詩篇四十6「你已經開通我的耳朵」用的是另一個動作，卻被 GT《丁道爾聖經註釋》與 CT 同時援引來解釋本節的含意。KC
    進一步把出二十一6 排進一條線裡，說詩四十指向祂進入世界、賽五十指向祂行過世界，而本節指向祂離開世界時甘願永遠留下作僕人。
