- title: 野味
  path: link_folder/主題/野味.md
  definition: '野味（game）指打獵所得的野生動物肉品。在創世記二十七章，它是以撒偏愛以掃的主要原因，也是以撒要求雅各冒充以掃時必須準備的食物。


    在律法裡，野味另有一個技術性的位置：牠們不是祭牲。申命記12:15、22 兩次用「羚羊與鹿」當作參照物，說明在城裡宰殺吃肉可以像吃這兩種動物一樣，不受禮儀身分限制。CT
    在申十二15 說羚羊與鹿乃屬野味，非用來獻祭，也沒有禮儀上的限制；BH 說明理由是牠們不像綿羊或牛那樣是家畜。所以這個詞在聖經裡橫跨兩種用法：一種是敘事裡的美味，一種是律法裡「可吃但不可獻」的類別。


    - 以撒三次提到愛吃野味（創二十七4、9、14），反映以撒因貪食而偏心（CT）

    - 以掃是skillful hunter（BH），善於打獵

    - 利百加用肥山羊羔肉代替野味來冒充（9節）

    - 野味代表肉體所喜歡的諂媚、誇獎、奉承等私慾（CT 靈意註解）

    - 以撒偏愛以掃只因愛吃他作的野味（CT，參創二十五28）'
  development: '### 為什麼是野味


    GT《舊約背景註釋》從飲食實況解釋這個要求：獵取野味是為通常單調無肉的膳食口味加添變化的方法之一，而「野味的肉可能又韌又膻，因此需要燜爛，並且加上香料，使它好吃一點」；煮食是男女分擔的工作。它並指出這頓筵席的功能不只是吃：以掃所預備的筵席「構成配得起這種大事的慶祝場面」，提供祝福所需的歡愉氣氛與合宜心境。


    也因此，第9節利百加用兩隻肥山羊羔頂替就有可行性。GT《聖經精讀本──創世記註解》註明理由很實際：「山羊的味道與野味相近」。KC 則援引箴二三3 稱這頓飯為「詭詐的食物」。


    ### 三次提到「愛吃」


    CT 與 GT《串珠聖經註釋》都數出本章三次提到以撒愛吃野味（4、9、14節），並據此判斷這反映他因貪食而偏心（比較創二五28）。丁良才的措辭最短：「以撒只是體貼肉體，並不體貼神。」KC
    把它讀成失明的原因而非結果——他對「美味」的偏好使他看不見主所看見的事。


    CT 由此給了一句可以核對的觀察：當一個人的心思被他的胃口所控制時，該講的話不敢講（比較創二六34-35 以掃娶外邦女子一事以撒始終沒有處理），不該講的話反而要講。


    - 以撒愛吃野味 → 偏愛以掃 → 無視神旨意 → 家庭分裂

    - 信徒若被肉體慾望支配，也會失去屬靈判力'
