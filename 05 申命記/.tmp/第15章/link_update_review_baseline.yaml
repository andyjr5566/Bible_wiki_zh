- title: 安息年
  path: link_folder/神學/安息年.md
  definition: 出二十三10-11 是安息年在約書中的首次規定：六年耕種，第七年叫地歇息。CT 列出神設立安息年的七樣用意，本節提供頭三樣：叫地歇息、使民中的窮人有吃的、所剩下的給野獸吃。GT《丁道爾聖經註釋》指出經文本身只給一個理由：「聖經只為『休耕年』提供了一個理由：使窮人有吃的，此後野獸也可以吃。」
  development: GT《丁道爾聖經註釋》把休耕與安息日並讀：「在宗教的層面上，休耕和守安息日同樣是以色列實踐信心，倚靠神供應所需的表現」，並指出野獸也有分不是原始人的禁忌，「而是極具神學思想的作為」。KC
    也說這一年是對百姓順服與信心的試驗。
  signals:
