book: 申命記
chapter: 15
candidates:
  # ── C 類：本章新建 ──
  - name: 豁免（she.mit.tah）
    type: 原文
    section: 原文
    evidence: "本章開頭四次出現這個字（v1、2 兩次、9），STEP 名詞是 she.mi.Tah（H8059，簡要詞典義 she.mit.tah: remission），動詞是 sha.Mot（H8058，簡要詞典義 sha.mat: to release，HVqaa 不定詞絕對式）與 v3 的 tash.Met（同為 H8058）。CT〔原文字義〕註「豁免」釋放，歇息，取消徵稅，文意註解說『豁免』原意指休耕(參出二十三11)，在此指免除債務。GT《申命記串珠聖經註釋》說「豁免」：原指釋放、歇息（出23:10），本指第七年不耕地。GT《聖經精讀本》記下兩種相反的看法：一是完全免除債務，二是只有安息年不再追債，並說本文似乎是指惟有安息年不可追討債務的規定。BH 說 remission 指債務的取消或赦免"
  - name: 沒有窮人與窮人永不斷絕（ev.yon）
    type: 解經爭議
    section: 解經爭議
    evidence: "第4節說「就必在你們中間沒有窮人了」，第11節卻說「原來那地上的窮人永不斷絕」。STEP 顯示兩節的「窮人」都是 'ev.Yon（H34，簡要詞典義 ev.yon: needy）。GT 收艾基斯《舊約聖經難題彙編》一整篇處理這個張力，從第4節開頭的希伯來字 'epes ki 的譯法切入，主張第4節講的是完全而恒久順服才會成就的情況；GT《啟導本聖經申命記註釋》說本節所強調的是「聽從」和「謹守」神的命令；GT《聖經精讀本》說第11節是從一般性意義上指出人世間常有需要幫助的窮人；KC 說第11節看起來與第4節矛盾，但矛盾只是表面的——第4節是神的心意，第11節是全知的神所作的預言；CT 也把第4節讀成條件句的結果"
    surfaces:
      - 沒有窮人了
      - 窮人永不斷絕
  - name: 鬆開手與揝著手（pa.tach、qa.phats）
    type: 原文
    section: 原文
    evidence: "第7至8節把兩隻手放在一起對照：「你不可忍著心、揝著手」與「總要向他鬆開手」。STEP 顯示第7節是 te.'a.Metz（H553，簡要詞典義 a.mats: to strengthen，本節逐字解 you will harden）加 le.va.ve./Kha（H3824）、tik.Potz（H7092，簡要詞典義 qa.phats: to gather，本節逐字解 you will shut）加 ya.de./kha（H3027G）；第8節是 fa.To.ach 加 tif.Tach（H6605A，簡要詞典義 pa.tach: to open，不定詞絕對式加未完成式），借給也是同樣的疊寫 ve./ha.'a.Vet 加 ta.'a.vi.Te./nu（H5670，簡要詞典義 a.vat: to lend）。CT〔原文字義〕註「忍著」頑固，不動搖；「揝著」拉在一起，關閉，並說『揝著手』與「鬆開手」的意思相反，意指捨不得；CT 話中之光說愛心，必須表現於行動，有張開的手。GT《申命記串珠聖經註釋》說「揝著手」與8節的「鬆開手」相對。KC 說 A hardened heart holds its hand closed.；BH 說張開的手代表慷慨與願意幫助，握緊的拳頭則代表自私與不情願"
    surfaces:
      - 忍著心、揝著手
      - 總要向他鬆開手
  - name: 多多地給不可空手而去（a.naq、re.qam）
    type: 原文
    section: 原文
    evidence: "第13至14節規定釋放奴僕時的補償：「不可使他空手而去，要從你羊群、禾場、酒醡之中多多地給他」。STEP 顯示「空手」是 rei.Kam（H7387，簡要詞典義 re.qam: emptily），「多多地給」是 ha.'a.Neik 加 ta.'a.Nik（H6059，簡要詞典義 a.naq: to ornament，不定詞絕對式加未完成式）。CT〔原文字義〕註「多多地給(原文雙同字)」作華麗的項鍊(比喻多多地給)，並說「空手」原文意指徒然勞力；文意註解說本句表示奴僕服事了六年之後，主人總得幫助他有創業立足的機會。GT《聖經精讀本》把三樣東西分別對應：羊群代表牲畜、禾場指禾穀、酒醡則代表水果。KC 說被釋放的奴僕要帶著滿手離開，給多少取決於主人怎樣看待耶和華給他的祝福；BH 說羊群、禾場、酒醡是古代以色列財富與生計的主要來源"
    surfaces:
      - 不可使他空手而去
      - 多多地給他
  # ── B 類：既有條目補本章累積 ──
  - name: 安息年
    type: 神學
    section: 神學
    evidence: "第1節「每逢七年末一年，你要施行豁免」，STEP 為 mi./Ketz（H7093，簡要詞典義 qets: end）加 she.va'（H7651）加 sha.Nim（H8141）。CT〔文意註解〕直接說「每逢七年末一年」就是安息年(參利二十五2~7)。GT《啟導本聖經申命記註釋》說「七年末一年」為安息年（利二十五2～7），並指利未記那一段只限農耕地，本章將此例適用到債項上，可能是因為靠田地收入維生的貧苦本國人一旦停耕會無力還債，才延伸此例。KC 指出在出埃及記與利未記，第七年只講地不可耕種、必須休耕，沒有提到豁免；本章才把豁免這個主題展開"
    surfaces:
      - 每逢七年末一年
  - name: 出23：10-11安息年執行
    type: 解經爭議
    section: 解經爭議
    evidence: "GT 收艾基斯《舊約聖經難題彙編》專門處理申命記與出埃及記兩處條文是否衝突：出二十三10-11 講的是土地連續耕種六年、第七年休耕，野生植物留給窮人或野獸；申十五1-11 則與耕耘土地無關，講的是第七年債主要豁免債項。艾基斯的結論是兩段經文之間沒有衝突存在，並回應那些以此主張五經出於多人之手的批評"
    surfaces:
      - 你要施行豁免
  - name: 匪類（be.liy.ya.al）
    type: 原文
    section: 原文
    evidence: "第9節「不可心裡起惡念」，STEP 為 da.Var（H1697G）加 ve.li.Ya.'al（H1100I，簡要詞典義 be.liy.ya.al: Belial: worthless），與既有條目所記申13:13「匪類」是同一個字。CT〔原文字義〕註「惡念(原文雙字)」不重要的，沒用的(首字)；言語，事件(次字)，文意註解說『惡念』指以自私為出發點的不良意念和心態。KC 說不給的理由來自一顆有罪的心"
    surfaces:
      - 惡念
  - name: 「希伯來人」的意義
    type: 原文
    section: 原文
    evidence: "第12節「你弟兄中，若有一個希伯來男人或希伯來女人被賣給你」，STEP 為 ha./'iv.Ri（H5680，簡要詞典義 iv.ri: Hebrew，陽性）與 ha./'iv.ri.Yah（同為 H5680，陰性）。CT〔原文字義〕註「希伯來人」來自遠處的人，過河的人，並在背景註解說亞伯拉罕原住在伯拉大河的東邊，蒙神呼召渡過大河移居迦南地，故稱為希伯來人。GT《啟導本聖經申命記註釋》說希伯來人一詞在此與以色列人同義，此處仍用希伯來人或因這個法例引自《出埃及記》，故未予更改"
    surfaces:
      - 希伯來男人或希伯來女人
  - name: 弟兄賣身為奴不可像奴僕看待
    type: 主題
    section: 主題
    evidence: "第12至18節是希伯來奴僕的釋放條例。GT《啟導本聖經申命記註釋》說本節至18節是《出埃及記》二十一2～6同一條例的修訂，包括希伯來婦女可以享有與男人同等地位、供給被釋的奴婢獨立生活所需，並說這些修訂的目的是使律法的條例能適應入住迦南後的新環境。GT《聖經精讀本》列出摩西律法對僕人的人權保障與待遇五項，並說與外邦殘忍的僕人制度相比較時體現出寬容、慈悲及人道主義精神。KC 說第七年釋放奴僕的規定顯明神要祂的百姓作自由的百姓，即使他們因自己的過錯失去了自由"
    surfaces:
      - 被賣給你
  - name: 事奉與作奴僕同一字根（a.vad）
    type: 原文
    section: 原文
    evidence: "第12節「服事你六年」與第18節「因他服事你六年」，STEP 都是 a.vad（H5647G，簡要詞典義 a.vad: to serve）。同一個字根在第19節換了譯法：「牛群中頭生的，不可用他耕地」，STEP 是 ta.'a.Vod（H5647I，簡要詞典義 a.vad: to serve: labour）。CT〔文意註解〕說以色列人在同族之間若因故賣身為奴，在主人家裡必須無償服事六年；同章第19節的「耕地」，CT 說即將屬神的挪來私用，故予禁止"
    surfaces:
      - 服事你六年
  - name: 為奴之家
    type: 主題
    section: 主題
    evidence: "第15節「要記念你在埃及地作過奴僕，耶和華─你的神將你救贖」，STEP 為 ve./za.khar.Ta（H2142，簡要詞典義 za.khar: to remember）加 'E.ved（H5650，簡要詞典義 e.ved: servant/slave）加 be./'E.retz mitz.Ra.yim（H776G 加 H4714G）。GT《申命記串珠聖經註釋》說以色列人昔日在埃及地為奴的經歷應驅使他們樂於遵守神的誡命（參5:15; 16:12; 24:18）。CT 說意指不要忘記從前在埃及地為奴時的痛苦經歷，自己既蒙神施拯救，就當成為幫助別人的動機；KC 說百姓離開埃及時自己也是滿載禮物出來的，神就是這樣做的"
    surfaces:
      - 在埃及地作過奴僕
  - name: 救贖
    type: 神學
    section: 神學
    evidence: "第15節「耶和華─你的神將你救贖」，STEP 為 va/i.yif.de./Kha（H6299，簡要詞典義 pa.dah: to ransom）。CT〔原文字義〕註「救贖」贖回，解救。BH 說 redeemed 指一次有力的釋放與拯救，在聖經的用法裡通常帶著代價或犧牲，指向神介入把以色列從埃及的奴役中釋放出來"
    surfaces:
      - 將你救贖
  - name: 頭生歸神
    type: 神學
    section: 神學
    evidence: "第19至20節「你牛群羊群中頭生的，凡是公的，都要分別為聖，歸耶和華─你的神⋯⋯每年要在耶和華所選擇的地方，在耶和華─你神面前吃」。STEP 為 ha./be.Khor（H1060，簡要詞典義 be.khor: firstborn）加 ha./za.Khar（H2145，簡要詞典義 za.khar: male）加 tak.Dish（H6942H，簡要詞典義 qa.dash: to consecrate: dedicate）。CT〔文意註解〕說神以頭生的代表全體，將頭生的獻給神也就是說一切都是屬神的。GT《聖經精讀本》說此定例的歷史性根據是逾越節事件，是為了紀念第十災時以色列百姓的頭胎皆因神的恩典得以救贖；GT《啟導本聖經申命記註釋》說出二十二30 規定頭生的牛羊在出生後第八天要獻給神，但若住地距敬拜的中心太遠便難辦到，現在規定一年之中任何時間都可以去"
    surfaces:
      - 牛群羊群中頭生的
  - name: 分別為聖
    type: 神學
    section: 神學
    evidence: "第19節「都要分別為聖，歸耶和華─你的神」，STEP 為 tak.Dish（H6942H，簡要詞典義 qa.dash: to consecrate: dedicate）。CT〔原文字義〕註「分別為聖」分別出來，使成聖。BH 說不可用頭生的牛耕地、不可剪頭生羊的毛，是因為這些牲畜完全屬於神；剪毛與耕作都代表私人的經濟利益，禁止這兩件事就是承認牠們整個歸神"
    surfaces:
      - 分別為聖
  - name: 立他名的居所（中央聖所）
    type: 主題
    section: 主題
    evidence: "第20節「每年要在耶和華所選擇的地方，在耶和華─你神面前吃」。CT〔文意註解〕說即指每年三大節期都到耶路撒冷過節獻祭後，依照獻祭的類別，祭肉有的歸祭司，有的歸獻祭者享用。GT《啟導本聖經申命記註釋》說現在規定一年之中任何時間都可以去，但似乎屬意與獻什一的事同時舉行，也許在住棚節。KC 指出在民數記那裡只有祭司可以在聖所附近吃這些，而在申命記這裡不談祭司也不談獻祭，神期待的是全體百姓都作祭司"
    surfaces:
      - 耶和華所選擇的地方
  - name: 沒有殘疾的祭牲
    type: 神學
    section: 神學
    evidence: "第21節「這頭生的若有什麼殘疾，就如瘸腿的、瞎眼的，無論有什麼惡殘疾，都不可獻給耶和華─你的神」。CT〔原文字義〕註「殘疾」瑕疵，缺陷；文意註解說因為獻祭的祭牲必須是健全沒有殘疾的(參利一3)；話中之光說一切獻給神的都要是完全的，只要有一點點的不完全，神都不能悅納。GT《申命記雷氏研讀本》說牲畜中頭生的要歸給耶和華，然而牠們必須是沒有殘疾才被接納（比較出二二29；民一八17,18；瑪一8）；GT《聖經精讀本》說被分別為聖的頭胎當預表耶穌基督的全然無瑕。BH 說瘸腿與瞎眼是使牲畜失去獻祭資格的具體例子"
    surfaces:
      - 若有什麼殘疾
  - name: 城門口公共場合
    type: 歷史
    section: 歷史
    evidence: "第7節「無論哪一座城裡」與第22節「可以在你城裡吃」，STEP 都是 she.'a.Rei./kha（H8179H，簡要詞典義 sha.ar: gate: town），字面是你的城門。BH 在第7節說城門是社群聚集、司法審理與交易的中心，因此照顧窮人的命令不只是私人或鄉間的事，而是公開的、群體的責任，並接到得4:1-11"
    surfaces:
      - 可以在你城裡吃
  - name: 潔淨與不潔淨
    type: 神學
    section: 神學
    evidence: "第22節「潔淨人與不潔淨人都可以吃，就如吃羚羊與鹿一般」。CT〔原文字義〕註「潔淨」(禮儀上) 潔淨的，純正；文意註解說指一般家畜的肉可以隨意享用(參申十二15)。BH 指出這一條打破了平常關於禮儀潔淨的限制——通常禮儀上不潔的人不可參與某些宗教活動或吃某些食物，這裡卻明文開了例外，凸顯這一次進食的非儀式性質"
    surfaces:
      - 潔淨人與不潔淨人
  - name: 野味
    type: 主題
    section: 主題
    evidence: "第22節「就如吃羚羊與鹿一般」，用的是既有條目所記那一組不在祭牲之列、卻符合潔淨條例的野生動物。CT 說指一般家畜的肉可以隨意享用(參申十二15)。BH 說羚羊與鹿按利11:1-8 是潔淨的動物，是以色列人常獵常吃的；用牠們來比方，等於說這種肉可以在非儀式的場合正常食用"
    surfaces:
      - 羚羊與鹿
  - name: 脂油和血都不可吃
    type: 神學
    section: 神學
    evidence: "第23節「只是不可吃他的血；要倒在地上，如同倒水一樣」。CT〔原文字義〕註「倒」傾倒，溢流；文意註解說以色列人禁止吃血，因為血中有生命(參利十七11~12)。GT《啟導本聖經申命記註釋》把它接回創世記九4 與利未記十七11。BH 說這條禁令最早在創9:4 對挪亞下達，利17:10-14 再重申，理由是血裡有生命、血被賜下用來在壇上贖罪；倒在地上像倒水一樣是把生命歸還給神"
    surfaces:
      - 不可吃他的血
  - name: 神作為賜福的源頭
    type: 神學
    section: 神學
    evidence: "本章五次把賜福接在命令之後（第4、6、10、14、18節），STEP 的動詞都是 ba.rakh（H1288，簡要詞典義 ba.rakh: to bless）。CT〔原文字義〕在第4至5節註「大大賜福(原文雙同字)」賜福，並說『大大賜福』意指恩上加恩，福上加福。KC 說豁免不會使人變窮，反而使人更富，因為神應許賜福並且不會失信；BH 說第10節的賜福應許是與慷慨相繫的，遵守就得福，反映的是撒種與收割的原則"
    surfaces:
      - 賜福與你
  - name: 錐子穿耳
    type: 原文
    section: 原文
    evidence: "第17節「你就要拿錐子將他的耳朵在門上刺透」，與既有條目所記出21:6 是同一個動作。STEP 顯示「錐子」是 ha./mar.Tze.a'（H4836，簡要詞典義 mar.tse.a: awl），「耳朵」是 'a.ze.N/o（H241G），「門」是 va./De.let（H1817C），動詞用的是 ve./na.ta.Tah（H5414H，簡要詞典義 na.tan: to give: put，本節逐字解 you will put it）。CT〔文意註解〕說開通耳朵含有『順服』之意(參詩四十6)，全句表示從此永遠聽從主人的話；CT〔原文字義〕在本節註「刺透」給，置，放。BH 說在古代近東穿耳是常見的作法，用以表示終身的委身與忠誠"
    surfaces:
      - 拿錐子將他的耳朵在門上刺透
  - name: 穿耳的儀式
    type: 背景
    section: 背景
    evidence: "第17節下半「他便永為你的奴僕了。你待婢女也要這樣」，STEP 的「永」是 o.Lam（H5769G，簡要詞典義 o.lam: forever: enduring），「婢女」是 la./'a.ma.te./Kha（H519，簡要詞典義 a.mah: maidservant）。GT《聖經精讀本》補上既有條目沒有記的一個細節：古代人視耳朵為隸屬的器官,因此,這是表示永遠為奴的儀式，並說希伯來人在舉行此儀式後將那錐子釘在主人家的門或門框上，證明至死為此家之奴。GT《啟導本聖經申命記註釋》說在耳朵上鑽孔也許可以繫上耳牌，標明奴婢的地位和所屬主人。CT 指出本節末句把婢女也納入同一手續"
    surfaces:
      - 他便永為你的奴僕了
  - name: 永遠服事的奴僕
    type: 神學
    section: 神學
    evidence: "第16節「他若對你說：我不願意離開你，是因他愛你和你的家，且因在你那裡很好」，與既有條目所記出21:5 是同一種自願。CT〔文意註解〕說指清楚表明他自動留下來的心意，並說意指他被主人的恩情打動，願意終身回報。GT《聖經精讀本》另給一個實際的緣由：這種情況大都是僕人因主人的好意與周旋得以結婚並有兒女之時發生。BH 說這句話顯出主僕之間的深厚連結，是建立在信任與彼此尊重上，而不只是義務；他並指這種自願的委身反映信徒甘心作基督僕人的心志"
    surfaces:
      - 我不願意離開你
  - name: 申15：1-11
    type: 互文
    section: 互文
    evidence: "既有條目由出22:25 那一章建立，記的是借貸給貧窮同胞的原則在本段被發展成豁免年制度與慷慨借給的命令。本章正是那一段：第2節「豁免的定例乃是這樣」立下規矩，第7至8節加上「總要向他鬆開手，照他所缺乏的借給他，補他的不足」，第11節再重申一次。CT 指出神的百姓借貸給弟兄目的不是為了投資，而是為了幫補窮乏的弟兄，所以不可收取利息(參申二十三19~20；出二十二25)"
    surfaces:
      - 豁免的定例乃是這樣
  - name: 申15：12-18
    type: 互文
    section: 互文
    evidence: "既有條目由出21 那一章建立，記的是本段補足出21:2-6 的兩件事：釋放時不可空手，以及女僕同享六年之限。本章正是那一段：第12節把希伯來男人與希伯來女人並列、第13至14節規定不可使他空手而去、要從羊群禾場酒醡之中多多地給他。GT《啟導本聖經申命記註釋》說本節至18節是《出埃及記》二十一2～6同一條例的修訂，包括希伯來婦女可以享有與男人同等地位、供給被釋的奴婢獨立生活所需，並說舊例只提希伯來男人，現在加了希伯來女人，可見婦女地位已有改善"
    surfaces:
      - 任他自由出去
  - name: 保護弱勢
    type: 主題
    section: 主題
    evidence: "第11節「總要向你地上困苦窮乏的弟兄鬆開手」。GT《聖經精讀本》把本章整段定位成保護弱者的定例，並指出它接續前一章末尾的第三十一奉獻，繼續談論安息年以色列百姓必須遵守的、作為貧困者債務者和奴僕的保護定例，又說摩西提出以色列出埃及事件（第15節）作為這些定例的根據。GT《申命記串珠聖經註釋》說雖然豁免年可減少以色列的窮人，但摩西知道國內仍將有不少窮人，故囑咐選民要不遺餘力的幫助弟兄，若忽略了這當負的責任便是罪"
    surfaces:
      - 困苦窮乏的弟兄
