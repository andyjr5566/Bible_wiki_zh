- title: 神作為賜福的源頭
  path: link_folder/神學/神作為賜福的源頭.md
  summary: '本章五次把賜福接在命令之後（第4、6、10、14、18節），STEP 的動詞都是 ba.rakh（H1288，簡要詞典義 ba.rakh: to bless）。CT〔原文字義〕在第4至5節註「大大賜福(原文雙同字)」賜福，並說『大大賜福』意指恩上加恩，福上加福；他在第10節說凡是人基於神的心、為神所作的一切，沒有一件不被報償的。KC 說豁免不會使人變窮，反而使人更富，因為神應許賜福並且不會失信；BH 說第10節的賜福應許是與慷慨相繫的，反映的是撒種與收割的原則。'
  relation: 本章的賜福不是泛泛的祝願，它每一次都掛在一個放手的動作後面：豁免債（第4、6節）、給窮乏的弟兄（第10節）、多多地給離開的奴僕（第14、18節）。同一句話重複五次，等於把整章三段律例串成同一個因果。（本回合順帶勘誤兩處：定義引創30:27 時把緣故的緣寫成了簡體字；主題發展引申8:18 時把句子改寫過，和合本作「因為得貨財的力量是他給你的」。）
