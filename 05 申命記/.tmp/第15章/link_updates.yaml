- title: 申15：1-11
  path: link_folder/互文/申15：1-11.md
  summary: 本章第1至11節正是這個節點所指的那一段。第2節「豁免的定例乃是這樣：凡債主要把所借給鄰舍的豁免了」立下規矩，第3節劃出範圍（借給外邦人的可以追討），第7至8節加上正面要求「總要向他鬆開手，照他所缺乏的借給他，補他的不足」，第9節防範惡念，第11節收束成一句吩咐。CT 指出神的百姓借貸給弟兄目的不是為了投資，而是為了幫補窮乏的弟兄，所以不可收取利息(參申二十三19~20；出二十二25)；他並說借出去了就不要指望如數收回。
  relation: 這個節點原是從出二十二25 建立的，記的是禁止取利那一條後來如何被推進。本章就是被推進的結果，而且推進得比註釋原先描述的更遠：除了定期豁免與鬆手的要求，第9節還把不肯借的動機本身定為罪。
