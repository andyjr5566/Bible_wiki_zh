- title: 穿耳的儀式
  path: link_folder/背景/穿耳的儀式.md
  summary: '第17節「他便永為你的奴僕了」，STEP 的「永」是 o.Lam（H5769G，簡要詞典義 o.lam: forever: enduring），「婢女」是 la./''a.ma.te./Kha（H519，簡要詞典義 a.mah: maidservant）。GT《聖經精讀本》補上一個既有記載之外的細節：古代人視耳朵為隸屬的器官,因此,這是表示永遠為奴的儀式，並說希伯來人在舉行此儀式後，將那錐子釘在主人家的門或門框上，證明至死為此家之奴。GT《啟導本聖經申命記註釋》說在耳朵上鑽孔也許可以繫上耳牌，標明奴婢的地位和所屬主人。'
  relation: 既有條目在出二十一那裡爭論門框是聖所的還是家中的；本章的來源直接把地點寫成主人的家門，而且多出一個處置——錐子本身留下來，釘在門或門框上當作憑證。這是既有記載沒有的一項細節。
  overview_review:
