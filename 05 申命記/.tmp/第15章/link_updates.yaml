- title: 野味
  path: link_folder/主題/野味.md
  summary: 第22節「就如吃羚羊與鹿一般」，用的是既有條目所記那一組不在祭牲之列、卻符合潔淨條例的野生動物。CT 說指一般家畜的肉可以隨意享用(參申十二15)。BH 說羚羊與鹿按利未記的分類是潔淨的動物，是以色列人常獵常吃的；用牠們來比方，等於說這種肉可以在非儀式的場合正常食用。
  relation: 申12 用羚羊與鹿說明在自己城裡宰牲吃肉是可以的，本章用同一組動物說明有殘疾的頭生牲畜可以照樣吃。兩次都是拿野味當量尺——它們既潔淨、又不能獻，正好標出可吃卻不神聖的那一格。
