- title: 保護弱勢
  path: link_folder/主題/保護弱勢.md
  summary: 第11節「總要向你地上困苦窮乏的弟兄鬆開手」。GT《聖經精讀本》把本章整段定位成保護弱者的定例，並指出它接續前一章末尾的第三十一奉獻，繼續談論安息年以色列百姓必須遵守的、作為貧困者債務者和奴僕的保護定例，又說摩西提出以色列出埃及事件（第15節）作為這些定例的根據。GT《申命記串珠聖經註釋》說雖然豁免年可減少以色列的窮人，但摩西知道國內仍將有不少窮人，故囑咐選民要不遺餘力的幫助弟兄，若忽略了這當負的責任便是罪。GT《啟導本聖經申命記註釋》說摩西律法不單只提出行為規範和社會運作的體制，還教導比制度更重要也更基本的倫理原則，用愛心與憐憫待人接物。
  relation: 本章保護的對象有三種：欠債的（第1至6節）、窮乏的（第7至11節）、為奴的（第12至18節）。三段共用同一個結構——先給制度，再給心態，最後給理由。而理由都指回同一件事：你自己曾經是那個需要被放過的人。
