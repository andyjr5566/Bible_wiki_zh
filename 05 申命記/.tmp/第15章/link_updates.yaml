- title: 永遠服事的奴僕
  path: link_folder/神學/永遠服事的奴僕.md
  summary: 第16節「他若對你說：我不願意離開你，是因他愛你和你的家，且因在你那裡很好」，與既有條目所記出21:5 是同一種自願。CT〔文意註解〕說指清楚表明他自動留下來的心意，並說意指他被主人的恩情打動，願意終身回報；〔原文字義〕註「離開」離開，出來，前往；「很好」好的，令人愉悅的。GT《聖經精讀本》另給一個實際的緣由：這種情況大都是僕人因主人的好意與周旋得以結婚並有兒女之時發生，並說在當時的希伯來社會主人對僕人的態度很溫和，完全有可能發生這種事情。BH 說這句話顯出主僕之間的深厚連結，是建立在信任與彼此尊重上。
  relation: 出二十一5 的理由有三項——我愛我的主人和我的妻子兒女；本章只留兩項：愛你和你的家，且因在你那裡很好。妻子兒女沒有出現在本章的措辭裡，GT《聖經精讀本》則從出21:4-5 把那個背景補回來。
