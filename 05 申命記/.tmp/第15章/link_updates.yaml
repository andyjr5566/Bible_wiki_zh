- title: 錐子穿耳
  path: link_folder/原文/錐子穿耳.md
  summary: '第17節「你就要拿錐子將他的耳朵在門上刺透，他便永為你的奴僕了。你待婢女也要這樣」，與既有條目所記出21:6 是同一個動作。STEP 顯示「錐子」是 ha./mar.Tze.a''（H4836，簡要詞典義 mar.tse.a: awl），「耳朵」是 ''a.ze.N/o（H241G），「門」是 va./De.let（H1817C），動詞用的是 ve./na.ta.Tah（H5414H，簡要詞典義 na.tan: to give: put）。CT〔文意註解〕說開通耳朵含有『順服』之意(參詩四十6)，全句表示從此永遠聽從主人的話。GT《申命記串珠聖經註釋》說主人可以為他舉行一項簡單儀式，在家門上拿錐子刺穿他的耳朵，他便永歸主人作奴僕；並說若婢女是作妻妾之用，則另有安排（見出21:7-11）。'
  relation: 出二十一6 的手續有一個本章沒有的環節：主人要先把他帶到審判官那裡。本章直接從奴僕開口說我不願意離開你，接到拿錐子刺耳，中間沒有第三方。另一個差別在對象——本章末句明文加上「你待婢女也要這樣」，把同一條出路給了女僕。
