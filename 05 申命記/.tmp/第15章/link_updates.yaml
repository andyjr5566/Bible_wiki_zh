- title: 城門口公共場合
  path: link_folder/歷史/城門口公共場合.md
  summary: '第7節「無論哪一座城裡」與第22節「可以在你城裡吃」，STEP 都是 she.''a.Rei./kha（H8179H，簡要詞典義 sha.ar: gate: town），字面是你的城門。BH 在第7節說城門是社群聚集、司法審理與交易的中心，因此照顧窮人的命令不只是私人或鄉間的事，而是公開的、群體的責任，並接到得4:1-11。'
  relation: 本章兩次用到這個詞，方向相反：第7節是責任落在城裡（有窮人就不可不管），第22節是許可落在城裡（有殘疾的頭生牲畜可以在這裡吃）。同一個地理範圍，一次界定義務，一次界定自由。
