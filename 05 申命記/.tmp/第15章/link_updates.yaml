- title: 脂油和血都不可吃
  path: link_folder/神學/脂油和血都不可吃.md
  summary: 第23節「只是不可吃他的血；要倒在地上，如同倒水一樣」。CT〔原文字義〕註「倒」傾倒，溢流；文意註解說以色列人禁止吃血，因為血中有生命(參利十七11~12)。GT《啟導本聖經申命記註釋》把它接回創世記九4 與利未記十七11。BH 說這條禁令最早在創9:4 對挪亞下達，利17:10-14 再重申，理由是血裡有生命、血被賜下用來在壇上贖罪；倒在地上像倒水一樣是把生命歸還給神。
  relation: 本章把這條禁令放在最寬鬆的那個位置上——連禮儀上不潔的人都可以吃這隻牲畜了，血仍然不可以吃。它因此標出整章唯一沒有跟著放寬的界線。
