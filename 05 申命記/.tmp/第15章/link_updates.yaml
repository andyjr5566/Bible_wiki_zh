- title: 申15：12-18
  path: link_folder/互文/申15：12-18.md
  summary: 本章第12至18節正是這個節點所指的那一段。第12節把希伯來男人與希伯來女人並列、第13至14節規定不可使他空手而去、要從羊群禾場酒醡之中多多地給他、第18節從主人的成本說明不可以為難事。GT《啟導本聖經申命記註釋》說本節至18節是《出埃及記》二十一2～6同一條例的修訂，包括希伯來婦女可以享有與男人同等地位、供給被釋的奴婢獨立生活所需，並說舊例只提希伯來男人，現在加了「希伯來女人」，可見婦女地位已有改善。
  relation: 這個節點原是從出二十一建立的，記的是本段補足了出21:2-6 的兩件事：釋放時不可空手，以及女僕同享六年之限。本章讓那兩項補充有了完整的文本，並多出第三項——第15節給的理由（你在埃及地作過奴僕）與第18節給的成本說明。（本回合順帶勘誤定義一處：舊版把申15:14 的引句改寫過，和合本作「耶和華─你的神怎樣賜福與你，你也要照樣給他」。）
