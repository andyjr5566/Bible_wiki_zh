book: 申命記
chapter: 15
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 安息年
  path: link_folder/神學/安息年.md
  summary: '第1節「每逢七年末一年，你要施行豁免」，STEP 為 mi./Ketz（H7093，qets: end）加 she.va''（H7651）加 sha.Nim（H8141）。CT〔文意註解〕直接說「每逢七年末一年」就是安息年(參利二十五2~7)。GT《啟導本聖經申命記註釋》說「七年末一年」為安息年（利二十五2～7），並指利未記那一段只限農耕地，本章將此例適用到債項上，可能是因為靠田地收入維生的貧苦本國人一旦停耕會無力還債，才延伸此例；他並說在安息年本國人的債項要全部豁免，外國人不獲此例保障。KC 指出在出埃及記與利未記，第七年唯一的規定是地不可耕種、必須休耕，沒有提到豁免，本章才把豁免這個主題展開。'
  relation: 這是安息年在律法書中的第三種內容。出二十三與利二十五處理的都是土地——第七年不耕不種；本章把同一個年份轉到人與人的債務關係上，並在第12節再轉到人身自由上。三段合起來，第七年管的是地、錢、人。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
    - 4
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 利未記:25
      - 申命記:15
- title: 出23：10-11安息年執行
  path: link_folder/解經爭議/出23：10-11安息年執行.md
  summary: GT 收艾基斯《舊約聖經難題彙編》專門處理申命記與出埃及記兩處條文是否衝突：出二十三10-11 講的是土地連續耕種六年、第七年休耕，野生植物留給窮人或野獸；申十五1-11 則與耕耘土地無關，講的是每逢第七年債主要豁免債項。他的結論是兩段經文之間沒有衝突存在，並引溫夏洛與吉青的研究回應那些以此主張五經出於多人之手的批評。
  relation: 既有條目問的是安息年怎麼執行——全國同時還是各田分別計算；本章帶來的是另一個層次的問題：出埃及記與申命記講的到底是不是同一件事。艾基斯的答案是兩者處理的是不同的對象（一個是地、一個是債），所以並不衝突。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 匪類（be.liy.ya.al）
  path: link_folder/原文/匪類（be.liy.ya.al）.md
  summary: '第9節「你要謹慎，不可心裡起惡念」，STEP 為 da.Var（H1697G）加 ve.li.Ya.''al（H1100I，簡要詞典義 be.liy.ya.al: Belial: worthless），與既有條目所記申13:13 的「匪類」是同一個字。CT〔原文字義〕註「惡念(原文雙字)」不重要的，沒用的(首字)；言語，事件(次字)，文意註解說『惡念』指以自私為出發點的不良意念和心態。GT《聖經精讀本》說求助遭到拒絕的鄰人將會在極度的困苦中呼求神，那呼求將成為求告審判長的控訴。KC 說不給的理由來自一顆有罪的心，一個心硬的人所顯出的是他不信神所應許的祝福。'
  relation: 申13 的 be.liy.ya.al 指的是一群人——從城裡出來勾引人去事奉別神的匪類；本章指的是一個念頭——第七年快到了所以不借。同一個字在申命記裡因此有兩種規模：一座城的背叛，與一個人心裡的盤算。第9節末尾把後果講得很重：他因你求告耶和華，罪便歸於你了。
  overview_review:
    signals:
    - development_blank
    accumulation_count:
    - 1
    - 2
    definition:
      decision: keep
      basis: no_identity_change
    development:
      decision: update
      synthesis_scope:
      - 申命記:13
      - 申命記:15
- title: 「希伯來人」的意義
  path: link_folder/原文/「希伯來人」的意義.md
  summary: '第12節「你弟兄中，若有一個希伯來男人或希伯來女人被賣給你」，STEP 為 ha./''iv.Ri（H5680，簡要詞典義 iv.ri: Hebrew，陽性）與 ha./''iv.ri.Yah（同為 H5680，陰性）。CT〔原文字義〕註「希伯來人」來自遠處的人，過河的人，並在背景註解說亞伯拉罕原住在伯拉大河的東邊，蒙神呼召渡過大河移居迦南地，故稱為希伯來人，又說聖經中第一次出現這名是用來稱呼亞伯拉罕(參創十四13)。GT《啟導本聖經申命記註釋》說希伯來人一詞在此與以色列人同義，此處仍用希伯來人或因這個法例引自《出埃及記》，故未予更改；他並指舊例只提希伯來男人，現在加了「希伯來女人」，可見婦女地位已有改善。'
  relation: 創十四13 的「希伯來人」是外人看亞伯蘭時給的稱呼；到了本章，同一個詞已經進了律法條文，而且是以色列人自己在用，指的就是同族的人。CT 的原文字義仍保留渡河那層意思，GT《啟導本》則指出這裡沿用它多半只是因為條文引自出埃及記。本章另有一項具體的變化：這個詞第一次以陽性與陰性成對出現。（本回合順帶勘誤主題發展一處：舊版把 GT 丁良才對這個稱呼的說明加上引號當成逐字引句，該句在創14 的來源檔查無逐字對應，已改為具名轉述。）
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 創世記:14
      - 申命記:15
- title: 弟兄賣身為奴不可像奴僕看待
  path: link_folder/主題/弟兄賣身為奴不可像奴僕看待.md
  summary: 第12至18節是希伯來奴僕的釋放條例。GT《啟導本聖經申命記註釋》說本節至18節是《出埃及記》二十一2～6同一條例的修訂，包括希伯來婦女可以享有與男人同等地位、供給被釋的奴婢獨立生活所需，並說這些修訂的目的是使律法的條例能適應入住迦南後的新環境。GT《聖經精讀本》列出摩西律法對僕人的人權保障與待遇五項——生命與肉體受保護、可訴諸法律、衣食住與安息日休息的保障、第七年得自由的特權、主人待僕人要像待雇工或兄弟（利25:40）——並說與外邦殘忍的僕人制度相比較時體現出寬容、慈悲及人道主義精神。CT 說以色列人在同族之間若因故賣身為奴，在主人家裡必須無償服事六年，到了第七年主人必須無條件釋放，不得要求贖金。
  relation: 利未記二十五章給的上限是禧年，本章給的上限是第七年——兩處都在限制為奴的期限，但起算點不同：利未記從禧年往回算，本章從賣身那一天往後算六年。本章另加一項利未記沒有的：釋放時不可空手，要從羊群、禾場、酒醡之中多多地給他。（本回合順帶勘誤三處：定義兩句丁良才的話與主題發展一句太23:8 的引句，都在利25 的來源檔與和合本查無逐字對應，已改為具名轉述。）
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: update
    development:
      decision: update
      synthesis_scope:
      - 利未記:25
      - 申命記:15
- title: 事奉與作奴僕同一字根（a.vad）
  path: link_folder/原文/事奉與作奴僕同一字根（a.vad）.md
  summary: '第12節「服事你六年」與第18節「因他服事你六年」，STEP 都是 a.vad（H5647G，簡要詞典義 a.vad: to serve）。同一個字根在第19節換了譯法：「牛群中頭生的，不可用他耕地」，STEP 是 ta.''a.Vod（H5647I，簡要詞典義 a.vad: to serve: labour）。CT〔文意註解〕說以色列人在同族之間若因故賣身為奴，在主人家裡必須無償服事六年；至於第19節的「耕地」，CT 說即將屬神的挪來私用，故予禁止。'
  relation: 本章把同一個字根用在兩種對象上，而規定正好相反：用在弟兄身上，六年之後必須停止；用在頭生的牲畜身上，一次也不可以。中間的分別在歸屬——弟兄是神救贖出來的人，頭生的是已經分別為聖歸神的牲畜。
  overview_review:
    signals:
    - many_accumulations
    accumulation_count:
    - 6
    - 7
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:5
      - 申命記:15
- title: 為奴之家
  path: link_folder/主題/為奴之家.md
  summary: '第15節「要記念你在埃及地作過奴僕，耶和華─你的神將你救贖；因此，我今日吩咐你這件事」，STEP 為 ve./za.khar.Ta（H2142，za.khar: to remember）加 ''E.ved（H5650，e.ved: servant/slave）加 be./''E.retz mitz.Ra.yim（H776G 加 H4714G）。GT《申命記串珠聖經註釋》說以色列人昔日在埃及地為奴的經歷應驅使他們樂於遵守神的誡命（參5:15; 16:12; 24:18）。CT 說意指不要忘記從前在埃及地為奴時的痛苦經歷，自己既蒙神施拯救，就當成為幫助別人的動機；KC 說百姓離開埃及時自己也是滿載禮物出來的，神就是這樣做的。'
  relation: 這一節的位置很關鍵：它不是放在段落開頭當背景，而是放在釋放奴僕、多多地給他之後，當作那條命令的理由。本章因此把為奴的記憶接到一個具體的動作上——你怎樣被贖出來，你就怎樣放人出去。
  overview_review:
    signals: []
    accumulation_count:
    - 5
    - 6
    definition: keep
    development: keep
- title: 救贖
  path: link_folder/神學/救贖.md
  summary: '第15節「耶和華─你的神將你救贖」，STEP 為 va/i.yif.de./Kha（H6299，簡要詞典義 pa.dah: to ransom）。CT〔原文字義〕註「救贖」贖回，解救。BH 說 redeemed 指一次有力的釋放與拯救，在聖經的用法裡通常帶著代價或犧牲，指向神介入把以色列從埃及的奴役中釋放出來，並說這是後來基督成就之終極救贖的預表。'
  relation: 本章用這個字時，語境不是敬拜也不是節期，而是勞資關係：主人放走奴僕的那一刻。經文把神的救贖擺成主人行動的樣板，理由寫在同一節裡——你自己就是被贖出來的那一個。
  overview_review:
    signals: []
    accumulation_count:
    - 3
    - 4
    definition: keep
    development: keep
- title: 頭生歸神
  path: link_folder/神學/頭生歸神.md
  summary: '第19至20節「你牛群羊群中頭生的，凡是公的，都要分別為聖，歸耶和華─你的神。牛群中頭生的，不可用他耕地；羊群中頭生的，不可剪毛。這頭生的，你和你的家屬，每年要在耶和華所選擇的地方，在耶和華─你神面前吃」。STEP 為 ha./be.Khor（H1060，be.khor: firstborn）加 ha./za.Khar（H2145，za.khar: male）加 tak.Dish（H6942H，qa.dash: to consecrate: dedicate）。CT〔文意註解〕說神以頭生的代表全體，將頭生的獻給神也就是說一切都是屬神的，並解釋兩項禁令：耕地即將屬神的挪來私用，剪毛是為商業用途，故不許可。GT《聖經精讀本》說此定例的歷史性根據是逾越節事件，是為了紀念第十災時以色列百姓的頭胎皆因神的恩典得以救贖；GT《啟導本聖經申命記註釋》說出二十二30 規定頭生的牛羊在出生後第八天要獻給神，但若住地距敬拜的中心太遠便難辦到，現在規定一年之中任何時間都可以去。'
  relation: 這是頭生條例在申命記裡的第二段。申14:23 把頭生的與十分之一並列，講的是帶到哪裡吃；本章講的是在那之前——這頭生的在牠還活著的時候就不可以拿來用。兩項禁令（不可耕地、不可剪毛）是律法書中第一次出現。（本回合順帶勘誤兩處：定義一句 CT 的話與主題發展一句 KC 的話，在出22、利27 的來源檔查無逐字對應，已改為具名轉述。）
  overview_review:
    signals: []
    accumulation_count:
    - 3
    - 4
    definition: update
    development:
      decision: update
      synthesis_scope:
      - 申命記:14
      - 申命記:15
- title: 分別為聖
  path: link_folder/神學/分別為聖.md
  summary: '第19節「凡是公的，都要分別為聖，歸耶和華─你的神」，STEP 為 tak.Dish（H6942H，簡要詞典義 qa.dash: to consecrate: dedicate）。CT〔原文字義〕註「分別為聖」分別出來，使成聖。BH 說不可用頭生的牛耕地、不可剪頭生羊的毛，正是因為這些牲畜完全屬於神；剪毛與耕作都代表私人的經濟利益，禁止這兩件事就是承認牠們整個歸神。'
  relation: 本章的分別為聖有一個很具體的檢驗方式：不是宣告，而是兩件不做的事。牲畜仍然在你的圈裡，但你不可以用牠工作、也不可以剪牠的毛——分別出來的意思在這裡是不再取用。
  overview_review:
    signals:
    - development_blank
    accumulation_count:
    - 8
    - 9
    definition: keep
    development:
      decision: keep
      basis: standing_debt
- title: 立他名的居所（中央聖所）
  path: link_folder/主題/立他名的居所（中央聖所）.md
  summary: 第20節「這頭生的，你和你的家屬，每年要在耶和華所選擇的地方，在耶和華─你神面前吃」。CT〔文意註解〕說即指每年三大節期都到耶路撒冷過節獻祭後，依照獻祭的類別，祭肉有的歸祭司，有的歸獻祭者享用。GT《啟導本聖經申命記註釋》說出二十二30 原規定頭生的牛羊出生後第八天要獻給神，若住地距敬拜的中心太遠便難辦到，現在規定一年之中任何時間都可以去，但似乎屬意與獻什一的事同時舉行。KC 指出在民數記那裡只有祭司可以在聖所附近吃這些，而在申命記這裡不談祭司也不談獻祭，神期待的是全體百姓都作祭司。
  relation: 本章給這個地方加上一個時間詞：每年。申12 定的是地點的唯一性，申14 處理的是距離太遠怎麼辦，本章則把頭生的牲畜納入同一個行程——它與十分之一一樣，要帶到那裡吃。
  overview_review:
    signals: []
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 沒有殘疾的祭牲
  path: link_folder/神學/沒有殘疾的祭牲.md
  summary: 第21至22節「這頭生的若有什麼殘疾，就如瘸腿的、瞎眼的，無論有什麼惡殘疾，都不可獻給耶和華─你的神；可以在你城裡吃；潔淨人與不潔淨人都可以吃，就如吃羚羊與鹿一般」。CT〔原文字義〕註「殘疾」瑕疵，缺陷；文意註解說因為獻祭的祭牲必須是健全沒有殘疾的(參利一3)；話中之光說一切獻給神的都要是完全的，只要有一點點的不完全，神都不能悅納，並說頭生的一有了殘疾，便失去作頭生獻上的資格。GT《申命記雷氏研讀本》說牲畜中頭生的要歸給耶和華，然而牠們必須是沒有殘疾才被接納（比較出二二29；民一八17,18；瑪一8）；GT《聖經精讀本》說若頭生的牛羊有缺陷就不能作祭物獻給神，只能供人食用，因為被分別為聖的頭胎當預表耶穌基督的全然無瑕。BH 說瘸腿與瞎眼是使牲畜失去獻祭資格的具體例子。
  relation: 既有的累積章都在講什麼樣的祭牲不可獻；本章多走一步，處理那隻被判定不合格的牲畜後來怎麼了——不是丟掉，而是帶回城裡當一般的肉吃，連禮儀上不潔的人都可以吃。判定的界線因此不是在牲畜本身的價值上，而是在牠能不能上壇。
