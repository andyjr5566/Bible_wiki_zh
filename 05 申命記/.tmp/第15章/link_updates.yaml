- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: 第22節「潔淨人與不潔淨人都可以吃，就如吃羚羊與鹿一般」。CT〔原文字義〕註「潔淨」(禮儀上) 潔淨的，純正；文意註解說指一般家畜的肉可以隨意享用(參申十二15)。BH 指出這一條打破了平常關於禮儀潔淨的限制——通常禮儀上不潔的人不可參與某些宗教活動或吃某些食物，這裡卻明文開了例外，凸顯這一次進食的非儀式性質。
  relation: 申14 用這組分類判動物，本章用它判人，而且結論是兩邊都可以。原因寫在前一節：那隻牲畜有殘疾、不能獻上，於是它就不再算作聖物，吃它的人是誰也就不再是問題。
