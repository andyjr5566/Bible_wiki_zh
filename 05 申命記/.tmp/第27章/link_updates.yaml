- title: 基利心山與以巴路山
  path: link_folder/地點/基利心山與以巴路山.md
  summary: 第4節指定石頭與壇立在以巴路山，第12至13節指定六個支派站基利心山祝福、六個支派站以巴路山宣布咒詛。STEP：be./Har（H2022G）'ei.Val（H5858C）。CT：以巴路山距離約但河淺灘僅約29公里，它與基利心山對峙，兩山之間為極深的裂谷，以巴路山頂光禿荒涼，象徵禍患；至於基利心山，距約但河約48公里，地處示劍之南，全山林木茂盛，象徵有福氣。GT《啟導本聖經申命記註釋》：「林木茂盛的基利心山在南，是福氣的象徵；牛山濯濯的以巴路山在北，象徵禍患。」BH 說兩山在示劍附近形成一個天然的圓形劇場。KC 指出以巴路山在本章兩個主題裡都居中心。
