  path: link_folder/主題/近親性關係的十二項條例.md
  summary: 第20、22、23節分別咒詛與繼母行淫、與同父或同母的姊妹行淫、與岳母行淫。GT《聖經精讀本──申命記註解》在20~23節下總註：這是與第七誡相關的對性犯罪的警告，本文尤其嚴禁了使神的神聖創造秩序極度紊亂的近親相奸罪與獸奸罪（利18:6~18;20:10~21）。GT《啟導本聖經申命記註釋》在這三節分別指回利未記18:8、18:9、18:17。CT 在三節分別指向利未記20:11-12、18:9、18:17，並說第22節是亂倫的行為、第23節是與母女兩人均有性關係，故不容許。
