- title: 在耶和華面前歡樂
  path: link_folder/主題/在耶和華面前歡樂.md
  summary: 第7節「且在那裡吃，在耶和華─你的神面前歡樂」。CT 的原文字義：「歡樂」歡喜，快樂；話中之光說獻燔祭是承認神是賜恩的神，獻平安祭是確認他們已經在恩典裡，因為他們已經進入了神的應許。BH 說吃平安祭是群體的事，象徵與神、也與人的相交。
  relation: 本條目前面幾次的歡樂都發生在中央聖所的節期裡；本章這一次發生在以巴路山——一座剛被指定為宣告咒詛的山上。歡樂與咒詛在同一場儀式、同一座山上前後相接。
