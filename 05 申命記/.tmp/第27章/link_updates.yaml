- title: 示劍（城）
  path: link_folder/地點/示劍（城）.md
  summary: CT 的話中之光：在地理的環境上，基利心山和以巴路山是在迦南地的心臟地帶，在兩山之間有示劍城，那地是亞伯拉罕第一次築壇的地方，也是雅各正式承認神是祂的神的地。CT 的背景註解另指雅各也在這裡第一次為神築壇，正式承認神是以色列的神（參創三十三20）。BH 說兩山在示劍附近形成一個天然的圓形劇場。
  relation: 本條目前面累積的都是創世記裡發生在示劍的事——亞伯拉罕的壇、雅各的壇、底拿的事、約瑟被差遣。本章是全書第一次把這個地方指定為全民族舉行立約儀式的所在，而且指定的時候他們還沒有進到那裡。
  overview_review:
