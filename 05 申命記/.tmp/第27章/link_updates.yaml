    definition: keep
    development: keep
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 第9節「摩西和祭司利未人曉諭以色列眾人」、第14節「利未人要向以色列眾人高聲說」。GT《聖經精讀本──申命記註解》區分兩者：這裡的「利未人」並非指被規定站在基利心山上的一般利未支派，乃是指站在兩座山的中間、抬著約櫃、照摩西的話向站在兩邊的百姓大聲宣告祝福與咒詛的「利未支派的祭司」。CT 說第9節的『祭司利未人』指接續亞倫擔任大祭司的以利亞撒和他的兄弟以他瑪兩人。KC 說利未人在第14節出場，他們事奉、宣讀律法並加以解釋，指出不順從的後果。
  relation: 本章讓利未支派同時出現在兩個位置：第12節利未名列站在基利心山祝福的六個支派之一，第14節利未人又站在中間向兩邊高聲宣告。GT《精讀本》正是為了處理這個看似矛盾才作出區分。
  overview_review:
