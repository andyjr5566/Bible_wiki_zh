- title: 不可為自己雕刻偶像
  path: link_folder/神學/不可為自己雕刻偶像.md
  summary: '第15節「有人製造耶和華所憎惡的偶像，或雕刻，或鑄造，就是工匠手所做的，在暗中設立，那人必受咒詛」。STEP：Fe.sel（H6459 pe.sel: idol）、u./ma.se.Khah（H4541A）、ma.''a.Seh ye.Dei cha.Rash（H4639G＋H3027G＋H2796，工匠手所做的）、ba./Sa.ter（H5643A se.ter: secrecy，在暗中）。GT《啟導本聖經申命記註釋》：製造偶像為十誡中的第一與第二誡的破壞。BH 指出偶像是人手所造的，本身沒有能力也沒有生命，這是聖經對偶像一貫的批判。'
  relation: 第二誡本身沒有提到「在暗中」；本章這一項把它補上了。這也是十二項咒詛裡的第一項——CT 指出前十一項通常都是暗中進行的罪惡，而這一項就是起頭。
  overview_review:
