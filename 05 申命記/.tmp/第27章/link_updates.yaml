  path: link_folder/主題/不可咒罵聾子絆倒瞎子.md
  summary: 第18節「使瞎子走差路的，必受咒詛」。GT《啟導本聖經申命記註釋》在這一節直接指回利未記19:14。GT《申命記串珠聖經註釋》：「使瞎子走差路」可象徵各種欺淩瞎子的行為。GT《聖經精讀本──申命記註解》：絆倒弱者或利用他們的弱點取利等在所有方面傷害、折磨弱者的行為，未能免受更加殘酷的律法之咒詛（利19:14）。CT：『使瞎子走差路』指代表故意欺騙瞎子的各種行為。BH 說這道咒詛點出保護與看顧弱者的道德責任，在古代近東，失明常與無助連在一起。
