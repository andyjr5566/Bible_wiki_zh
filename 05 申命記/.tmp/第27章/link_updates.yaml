  path: link_folder/神學/當孝敬父母.md
  summary: 第16節「輕慢父母的，必受咒詛」。CT 的原文字義：「輕慢」輕視，羞辱；文意註解說『輕慢父母』指對父母不孝。GT《啟導本聖經申命記註釋》要讀者看出埃及記二十12注。BH 說在以色列社會裡家庭是根本單位，敬重父母對維持社會秩序與守約的忠誠都很關鍵；輕慢包括帶來羞辱的言行，是嚴重的冒犯。
  relation: 第五誡是正面的命令（當孝敬），本章這一項是它的反面（輕慢的必受咒詛），而且是十二項裡緊接在偶像之後的第二項——先是對神的態度，再是對父母的態度。
