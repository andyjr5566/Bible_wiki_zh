  summary: '第8節「你要將這律法的一切話明明的寫在石頭上」。STEP：ba.''Er（H874，簡要詞典義 ba.ar: to make plain）加 hei.Tev（H3190，簡要詞典義 ya.tav: be good），兩個不定詞連用；同一個 H874 也是申1:5「摩西…講律法」的那個動詞。CT 的原文字義：「明明的（原文雙字）」美好、令人滿意（首字）；清楚、使之明顯。KC 說要把律法的話寫得很清楚，好讓經過的人可以毫不費力地讀到（哈2:2），這也意味著不可從中減去或遺漏什麼。'
