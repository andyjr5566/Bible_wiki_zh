  summary: 第21節「與獸淫合的，必受咒詛」。CT：『與獸淫合』是違逆神所創造的本性（參利二十15；羅一26~27）。GT《聖經精讀本──申命記註解》：獸奸罪與近親相奸罪、親男色者等一起是玷污這地的醜陋性犯罪，必須從以色列社會中除去（出22:19;利20:15,16）。GT《啟導本聖經申命記註釋》在這一節指回出埃及記二十二19與利未記十八23、二十15～16。BH 說在古代近東，獸交有時與異教的儀式和生殖崇拜有關，以色列被命令要遠離。
