- title: 咒詛（a.rar 與 qa.vav）
  path: link_folder/原文/咒詛（a.rar 與 qa.vav）.md
  summary: '第15至26節每一項都以「必受咒詛」宣告。STEP：''a.Rur（H779，簡要詞典義 a.rar: to curse，Qal 被動分詞），十二項全部以這個字開頭。CT 也指出原文每句都以「咒詛」開頭。GT《申命記串珠聖經註釋》說這些咒詛都是對個人的良心而發的，以色列民聚在一起，公開地裁定這些惡行的罪。'
  relation: 民22-24 的 a.rar 是巴蘭受雇要說卻說不出口的話；本章的 a.rar 是以色列自己站在山上，一句一句聽、一句一句答應下來的。同一個字，一邊是別人請不動的，一邊是自己領下來的。
