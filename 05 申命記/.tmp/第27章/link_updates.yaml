- title: 摩利橡樹
  path: link_folder/背景/摩利橡樹.md
  summary: CT 的背景註解：「以巴路山」位於迦南地交通中心示劍城的城北，靠近「摩利橡樹」（申十一30）；「摩利橡樹」是亞伯拉罕進入迦南時第一次停留的地方（參創十二6），神在這裡第一次應許「我要把這地賜給你的後裔」（創十二7），確認迦南就是應許之地。
  relation: 本條目前面記的是亞伯拉罕在這裡第一次領受應許；本章記的是他的後裔在同一片地方立石、築壇、宣告祝福與咒詛。CT 由此說百姓在這裡舉行立約的儀式，也是宣告神對列祖應許的實現。
  overview_review:
