- title: 立約
  path: link_folder/主題/立約.md
  summary: 第9至10節「你今日成為耶和華─你神的百姓了。所以要聽從耶和華─你神的話」。STEP：nih.Yei.ta（H1961，Niphal 第二人稱）le./'Am（H5971A）。CT：這裡並不是說今日才成為神的百姓，而是重申他們是神百姓的身分；他們是因為有立約百姓的地位，所以需要順服神，順服不是立約的前提，而是立約的結果。GT《啟導本聖經申命記註釋》：這裡記下的是重申神與以色列民立約的話，新一代像他們的上一代一樣，是神的子民，必須遵行神的誡命。
  relation: 申26:17-19 是雙方各自宣告的形式，本章第9至10節是同一份約的另一種說法——不是你認我認，而是先宣告身分（你今日成為神的百姓了），再從那個身分推出要求（所以要聽從）。
  overview_review:
