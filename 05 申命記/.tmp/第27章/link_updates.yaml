- title: 古代近東立約
  path: link_folder/背景/古代近東立約.md
  summary: GT《申命記串珠聖經註釋》：咒詛與祝福乃古時近東盟約的主要部分，臣屬若不忠於主人、背叛盟約，便遭受咒詛（受放逐、疾病、死亡等刑罰的恐嚇）；對那些忠信守約者，則應許興隆與祝福。BH 說把律法刻在石頭上，與古代近東把條約刻在石版或泥版上的作法相同。
  relation: 申26 記的是條約的宣告形式（雙方各說一次），本章記的是條約的另外兩個常見部件——刻在石頭上的文本，以及當眾宣讀的咒詛條款。兩章合起來，這份約的形式就齊了。
  overview_review:
