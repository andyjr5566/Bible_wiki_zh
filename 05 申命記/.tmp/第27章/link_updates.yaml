    definition: keep
    development: keep
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: 第7節「又要獻平安祭，且在那裡吃，在耶和華─你的神面前歡樂」。CT：『平安祭』此名詞在希伯來文表示「和好」或「福祉」，此祭為一私人的獻祭，所獻的可為感謝、還願或甘心獻的（參利七15~16），表明獻祭者對神的感恩、虔敬與奉獻，並藉此顯明神與人及人與鄰舍的和諧關係。GT《申命記串珠聖經註釋》說獻上燔祭和平安祭表示對神完全的奉獻，並藉著獻祭與神交通。KC 說平安祭表明基督在十字架上的工作，使神與祂百姓之間、以及神百姓彼此之間的交通成為可能。
  relation: 這是本章唯一一件與吃有關的事，也是整場儀式裡唯一帶著歡樂的動作。它排在燔祭之後、兩山宣告咒詛之前——先把祭獻完、把飯吃完，才開始聽那十二句話。
