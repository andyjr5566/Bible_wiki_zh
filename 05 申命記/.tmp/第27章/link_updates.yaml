- title: 土壇
  path: link_folder/神學/土壇.md
  summary: '第5至6節重申出20:24-26 的規定：在石頭上不可動鐵器，要用沒有鑿過的石頭築壇。STEP：lo'' ta.Nif（H5130B，簡要詞典義 nuph: to wave，揮動）bar.Zel（H1270，鐵）；「沒有鑿過的石頭」是 ''a.va.Nim she.le.mOt（H68G＋H8003，簡要詞典義 sha.lem: complete）。CT：『不可動鐵器』即指不可切割、研磨和鑿劈，用意在保持渾然天成，避免人工的玷污（參出二十25）。GT《聖經精讀本──申命記註解》給兩個理由：不可為外在的美麗所震攝，乃要用心靈和誠實單單敬拜神；不能用可流人之血的鐵器等不潔淨的工具來雕鑿。GT《啟導本》說這祭壇和會幕的壇不只用處不同，形式也各異。KC 說壇必須照神所定的方式建造，不容人的加工。'
  relation: 出20 是頒布十誡之後立刻給的規定，本章是進迦南時第一次實際執行它。原文用的形容詞是「完整的」石頭——不是說石頭沒有瑕疵，是說它沒有被人動過。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: '第6節「在壇上要將燔祭獻給耶和華─你的神」。STEP：ve./ha.''a.Li.ta（H5927I）o.Lot（H5930A o.lah: burnt offering）。CT：『燔祭』指整個祭物須在祭壇上經過火燒，使馨香之氣上升，全部獻給神。KC 指出這裡沒有提到贖罪祭，只有燔祭與平安祭，因為這座壇上的祭是向神表達感恩；燔祭表明基督在十字架上的工作，是完全獻給神的。'
  relation: 本條目累積過的燔祭多半在會幕或聖所的制度裡；本章的燔祭獻在一座剛用未鑿石頭堆起來的壇上，而且獻在宣告咒詛的那座山上。KC 特別點出這裡沒有贖罪祭——場合的重點不是處理罪，是表達感恩。
  overview_review:
