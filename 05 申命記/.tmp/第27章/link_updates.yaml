  path: link_folder/主題/築壇.md
  summary: 第5至6節「在那裡要為耶和華─你的神築一座石壇；在石頭上不可動鐵器」。STEP：u./va.Ni.ta（H1129 ba.nah）miz.Be.ach（H4196）'a.va.Nim（H68G）。KC 指出記念碑旁邊立著一座壇——藉著碑上所寫的，神向人說話；藉著壇，人歸向神；凡如此全心對神的話說了是的人，就會想要獻祭。BH 說壇是敬拜與獻身的記號，延續了亞伯拉罕等列祖築壇的作法（創12:7）。
