  summary: 第25節「受賄賂害死無辜之人的，必受咒詛」。CT 的原文字義：「賄賂」贈送；「無辜」乾淨的，免罪；文意註解說這指審理案件的審判官或見證人，因有分於任何不正當的金錢授受，以致屈枉正直，使無辜的一方被定死罪，或含冤而死。GT《聖經精讀本──申命記註解》：此律例嚴禁殺人與之相關的受賄行為（出20:13;23:7,8）。BH 說在古代近東賄賂是常見的問題，往往導致腐敗與不義，而這一節把它推到最重的後果上。
