  summary: '第19節「向寄居的和孤兒寡婦屈枉正直的，必受咒詛」。STEP：ger（H1616，簡要詞典義 ger: sojourner）；同節「屈枉正直」是 ma.Teh mish.Pat（H5186 na.tah＋H4941H mish.pat）。CT：『寄居的和孤兒寡婦』都是屬於弱勢族群；『屈枉正直』指不顧事實而偏袒有權有勢的一方。GT《聖經精讀本──申命記註解》：寄居的和孤兒寡婦是舊約時代的三大弱勢群體，象徵著貧窮、柔弱而被欺壓的，為社會所疏離的人群。'
