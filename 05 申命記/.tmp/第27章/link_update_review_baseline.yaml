- title: 不可挪移地界（ge.vul）
  path: link_folder/主題/不可挪移地界（ge.vul）.md
  definition: '申命記第十九章第14節只有一句話，卻夾在兩段刑事條例中間：「在耶和華─你神所賜你承受為業之地，不可挪移你鄰舍的地界，那是先人所定的。」


    ### 地界是什麼東西


    它是一塊實物。GT《申命記串珠聖經註釋》說地界是一塊刻有產業界線的石碑；GT《啟導本聖經申命記註釋》說古代社會劃分地界，立石為記，也用樹木等物作記號。CT
    的話中之光也說古代的「地界」可能以石頭或樹木作記號。


    GT《聖經精讀本》補上制度背景：在土地登記制度尚未發達的古代社會，境界標誌即地界起了劃分土地所有權的作用；這裡的地界指古代近東地區為了標誌田產的區域或行政區域，刻字而立的石頭。BH
    說的是同一件事——界石標示地界，移動它被視為嚴重的罪行。


    ### 移動它等於偷竊


    這是各家最一致的一句。GT《申命記雷氏研讀本》一句話帶過：這樣做就等於偷竊（比較二七17；伯二四2；箴二二28）。GT《啟導本》說挪移地界就是侵奪他人土地。GT《聖經精讀本》把它掛回十誡：任意挪移區分土地所有權的地界就是欺騙或搶奪鄰人之財產的犯罪行為，律法根據第八誡與第十誡而嚴禁這種行為。


    STEP 顯示這一節的用字：「挪移」是 ta.Sig（H5253，簡要詞典義 na.sag: to remove），「地界」是 ge.Vul（H1366G，ge.vul:
    border: boundary），「先人所定的」是 ga.ve.Lu ri.sho.Nim（H1379 加 H7223H，ri.shon: first:
    previous），而「承受為業之地」在同一節裡用了名詞與同源動詞——be./na.cha.la.te./Kha（H5159）加 tin.Chal（H5157）。


    ### 為什麼是一條律法而不只是禮貌


    兩個理由分別由不同來源給出。


    第一個是社會性的。GT《申命記串珠聖經註釋》推測立法動機：可能是要防止富戶恃著勢力，為了增添自己的土地而不惜欺負貧窮者，故定下此律例。


    第二個是神學性的。CT 的話中之光指出，以色列人的地界是先人從神的手中接過來的產業——神管理著每一個拈鬮人的手，通過拈鬮決定了地界，人擁有的只是神所賜的使用權，所以不可自行改變神在應許裡賜給人的產業。他因此把這條誡命讀成一個承認：不可挪移鄰舍的地界，就是承認神的權柄、承認神是應許之地的真正主人。


    ### 這一節管的是別人的產業，不是自己的


    KC 的切入點與其他三家不同。他說這一節講的不是照顧自己的產業，而是照顧鄰舍的產業——意思是每個人都要認可並尊重別人享有自己那一份的權利，要確保每個人都能完整地享用他的產業。他舉的反例是亞哈：亞哈奪走拿伯的產業（王上21:1-15）。KC
    並列出聖經其他責備這件事的地方（何5:10；箴22:28；申27:17；伯24:2；箴23:10）。


    CT 另引箴言與約伯記把它接到弱勢保護上：箴二十三10-11 說不可挪移古時的地界，也不可侵入孤兒的田地，因他們的救贖主大有能力；約伯記二十四2 把挪移地界與搶奪群畜並列，約伯認為那是神該刑罰的罪惡。'
