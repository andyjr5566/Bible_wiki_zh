- title: 為定與廢去（qum 與 pa.rar）
  path: link_folder/原文/為定與廢去（qum 與 pa.rar）.md
  definition: '本章的法律效力全靠三個動詞在跑，STEP 把它們標得一清二楚：


    | 中文 | 原文 | Strong | 字面 |

    |---|---|---|---|

    | 為定、堅定 | ya.Kum、ve./Ka.mu、he.Kim、ye.ki.Me./nu | H6965I（qum） | 站立起來、使它站立 |

    | 不應承 | he.Ni'' | H5106（nu） | 攔阻、禁止 |

    | 廢了、廢去 | ya.Fer、ye.fe.Re./nu | H6565A（pa.rar） | 使它破裂 |


    中文的「為定」讀起來像是「算數」，原文其實是「站起來」；「廢去」讀起來像是取消，原文是「打破」。一個願不是被登記或註銷，而是被立起來或被折斷。


    CT 的原文字義欄給的方向完全相同：「為定」站立，確立；「不應承」妨礙，禁止，拒絕；「廢了」挫敗，使無效。


    **v13 把兩個動詞並排放在同一句。** 「他丈夫可以堅定，也可以廢去」原文是 ye.ki.Me./nu（他要使它站立）對 ye.fe.Re./nu（他要使它破裂），兩個都是
    Hiphil 加受詞後綴，句型完全對稱。


    **v15 用了強調式。** 「若使這兩樣全廢了」是 ha.Fer ya.Fer——不定詞絕對式加未完成式，CT 也註明這裡是「原文雙同字」。同樣的寫法在
    v12 也出現過。'
