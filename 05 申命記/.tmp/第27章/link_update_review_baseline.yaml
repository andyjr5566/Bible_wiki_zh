- title: 衣襟（ka.naph）
  path: link_folder/原文/衣襟（ka.naph）.md
  definition: '希伯來文 ka.naph（H3671），STEP 的簡要詞典義是 wing。它在申命記第二十二章出現兩次，中文譯成兩個看不出關係的詞。


    | 節 | 和合本 | STEP 原文與譯義 |

    | --- | --- | --- |

    | 12 | 你要在所披的外衣上四圍做繸子 | kan.Fot（H3671），本節譯義 [the] corners of |

    | 30 | 不可掀開他父親的衣襟 | ke.Naf（H3671），本節譯義 [the] skirt of |


    同一個字，一處指外衣的四個角，一處指衣服的下襬。第12節的「外衣」另是 ke.su.te.Kha（H3682，ke.sut: covering），CT 給的原文字義正是「外衣」遮蔽物。


    ### 為什麼掀開衣襟等於侵犯婚姻


    第30節禁止的是娶繼母，而經文用的說法是「不可掀開他父親的衣襟」。四套來源裡，中文三家都把這個動作接到同一組經文。CT 說「『掀開他父親的衣襟』指侵犯父親的婚姻關係(參得三9)」，並在話中之光寫得更完整：「用衣襟遮蓋」(得三9；結十六8)代表結婚，「掀開他父親的衣襟」代表侵害父親的婚姻。GT《啟導本聖經申命記註釋》說：「男子把衣襟覆在女子身上象徵婚姻關係(得三9；結十六8)。掀開它，意同侵犯丈夫的權利。」GT《申命記串珠聖經註釋》註得最短：「「用衣襟遮蓋」就是結婚之意，(參得3:9;
    結16:8)故掀開他父親的衣襟即是侵害父親的婚姻。」


    STEP 顯示第30節的「掀開」是 ye.ga.Leh（H1540I，ga.lah: to reveal: uncover）；CT 給的原文字義是「掀開」揭開，顯露。「繼母」在原文則是兩個字：''E.shet
    ''a.Vi/v（H802H ish.shah: woman: wife 加 H1G av: father），字面是他父親的妻子，CT 標為「繼母(原文雙字)」父親(首字)；妻子(次字)。


    ### 各家怎麼讀這條禁令


    GT《聖經精讀本──申命記註解》說本節是禁止與繼母結婚或發生性關係的律例，並指近親相奸是違背創造位階秩序之犯罪，摩西律法多次嚴禁（利18:6-18；20:11-21）。GT《申命記雷氏研讀本》只寫一句：人不可取繼母為妻，並指向利未記十八章的腳註。BH
    說「dishonor his father''s marriage bed」（羞辱他父親的婚床）這個說法指向婚床所象徵的專屬與神聖，違犯它會使整個家族蒙羞；他並指出保羅在哥林多前書5章1節責備哥林多教會容忍一個娶了自己父親妻子的人。KC
    也引同一節，並說這裡缺的不只是對神所設立之婚姻的尊重，也缺對父母的尊重（創35:22；49:4）。


    ### 第12節的那一頭


    KC 從四個角讀出的是全面：他說外衣的四個角關乎我們在一切接觸中的整體行為。至於為什麼申命記這裡沒有提到民數記十五章38節的藍細帶子，他的解釋是這卷書講的是進入應許之地、不再是曠野。'
