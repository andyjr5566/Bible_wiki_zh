- title: 賄賂使智慧人的眼變瞎（sha.chad）
  path: link_folder/原文/賄賂使智慧人的眼變瞎（sha.chad）.md
  definition: '申命記第十六章第19節在禁令之後加了一句理由：「也不可受賄賂；因為賄賂能叫智慧人的眼變瞎了，又能顛倒義人的話。」


    STEP 顯示這一句用了兩個動作性很強的動詞。「賄賂」是 Sho.chad（H7810，簡要詞典義 sha.chad: bribe）；「叫……變瞎」是 ye.''a.Ver（H5786，簡要詞典義
    a.var: to blind），受詞是 ''ei.Nei cha.kha.Mim（H5869A＋H2450，智慧人的眼）；「顛倒」是 vi./sa.Lef（H5557，簡要詞典義
    sa.laph: to pervert），受詞是 div.Rei tza.di.Kim（H1697L＋H6662，義人的話）。


    **兩個受詞選得很刻意：不是笨人，是智慧人；不是惡人，是義人。** 也就是說，這條禁令防的不是明顯會被收買的人，而是本來判斷力最好、品格最可靠的那一種人。CT
    的文意註解說得直接：任何不正當的金錢授受，一定會蒙蔽人的心眼，叫人無法分辨是非曲直。


    **末句可以有兩種讀法，CT 都列了出來。** 他在「又能顛倒義人的話」下面寫：本句有二意——使公義的審判官作出不公正的判決，或使公義之人的見證變成虛假的見證。前一種讀法把「義人」讀成坐在席上的審判官，後一種讀成出庭的證人。GT《申命記串珠聖經註釋》採後一種方向，說這句「或作『又能叫義人說假話』」。


    **這條禁令是三項當中的一項。** CT 在第18節的註解裡把按公義審判的三原則排出來：不可屈枉正直（參出二十三6）、不看外貌（參箴二十四23）、不受賄賂（參出二十三8）。GT《聖經精讀本》從另一個角度列出歪曲審判的三個要素：基於貧富貴賤的人之外在標準、受賄、來自多數人及權貴的壓力與同他們的苟合。兩份清單前兩項相同，第三項各補了一塊——一個講金錢，一個講輿論與權勢。


    **BH 補上時代背景與後續回聲。** 他說賄賂在古代是常見的作法，常被用來影響判決、扭曲司法，因此這條禁令是防腐的保障；他並引箴17:23——惡人暗中受賄，以歪曲公理。'
