- title: 不可咒罵聾子絆倒瞎子
  path: link_folder/主題/不可咒罵聾子絆倒瞎子.md
  definition: '不可咒罵聾子，也不可把絆腳石放在瞎子面前，只要敬畏你的神（v14）。


    這兩個例子有個共通點：受害的人當場沒有辦法反抗，甚至根本不知道。CT 說這是「不可趁著人軟弱或缺乏的時候去占他的便宜或陷害他」。GT 丁良才點明其中的卑劣——咒罵一個聽不見、不能替自己辯白的人是惡事，背地裡咒詛人也是一樣。


    那為什麼要停手？因為還有第三者在場。CT 與 GT 丁良才用同一句話回答：窮人雖抵不住，聾子雖聽不見，瞎子雖看不見，神卻有能力能抵住、能聽見、也能看見。KC
    說得更短：聾子聽不見那咒罵，神卻聽得見，並且要嚴嚴責備那咒罵的人。


    BH 提醒這條命令有第二層讀法：絆腳石在聖經其他地方常指使人跌倒犯罪的東西，所以這裡不只禁止危害盲人的身體，也禁止在別人的信心上設障礙。GT《精讀本》則說，隨便咒詛耳聾的人、給看不見的人設置障礙，等於嘲笑那位看顧他們的神的慈愛。


    KC 另舉了一個不迴避的例子：連大衛都曾表現出對瘸子和瞎子的深深厭惡（撒下5:8），但神不是這樣，而祂的百姓應當像祂。'
  development: '本節的原則在律法書後段變成明文的咒詛。GT 丁良才引申命記27:18——「使瞎子走差路的，必受咒詛」，並用約伯的自述作正面榜樣：「我為瞎子的眼，瘸子的腳」（伯29:15）。


    新約把「絆腳石」從身體挪到良心。GT 丁良才與 KC 都引羅馬書14:13 與哥林多前書8:9：信徒寧可不用自己的自由，也不在弟兄面前放下絆跌人的東西。KC
    的說法是，我們若在某個真理上看得見，就有可能絆倒那在這事上還看不見的人。'
