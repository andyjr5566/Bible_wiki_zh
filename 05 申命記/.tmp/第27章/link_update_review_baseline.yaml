- title: 土壇
  path: link_folder/神學/土壇.md
  definition: 土壇是神在頒布十誡後指示以色列人建造的祭壇（出二十24-26）。神指示：可用土築壇，在上面獻燔祭和平安祭；若用石頭築壇，不可用鑿成的石頭，因為人的工具會污穢壇；上壇不可用臺階，免得露出下體。這些規定強調敬拜的純樸和謙卑——神的壇不是人手工藝術的展示，而是人謙卑朝見神的地方。
  development: 土壇的規定延續了族長時代的簡樸敬拜傳統——亞伯拉罕（創十二7）、以撒（創二十六25）和雅各（創三十五7）都曾築簡單的壇敬拜神。神應許「凡記下我名的地方，我必到那裡賜福給你」（24節），表明神的同在不受地點限制。新約中耶穌教導「時候將到，你們拜父也不在這山上，也不在耶路撒冷」（約四21），敬拜從特定地點轉向用心靈和誠實。
