- title: 擅敢行事與褻瀆耶和華的剪除處分
  path: link_folder/神學/擅敢行事與褻瀆耶和華的剪除處分.md
  definition: '民數記15:30-31 的判決：明知故犯的人不在贖罪祭的範圍內，必從民中剪除。


    第30-31節的原文是：「但那擅敢行事的，無論是本地人是寄居的，他褻瀆了耶和華，必從民中剪除。因他藐視耶和華的言語，違背耶和華的命令，那人總要剪除；他的罪孽要歸到他身上。」


    「擅敢行事」這個中文詞不太看得出原意。CT 在原文字義註明它是原文雙字：「升起，舉起(首字)；手(次字)」。GT《聖經精讀本──民數記註解》直接譯出來：「字面意思是“用高舉的手”」STEP
    原文資料可確認這個組合：בְּ/יָד רָמָה（be./Yad ra.Mah），יָד（yad，H3027G，hand）加上 רוּם（rum，H7311A，to
    exalt）——不是失手犯錯，是舉著手做的。


    要留意中文詞與原文詞不是一對一。申命記十七章12節也譯作「擅敢」，原文卻是另一個說法——STEP 顯示那裡是 ve./za.Don（H2087，簡要詞典義
    za.don: arrogance）。兩處講的都是明知而傲慢地違逆，用字並不相同；本條目所記的 be./Yad ra.Mah 專指民15:30-31 這一處的說法。'
  development: '中文的「擅敢」在民數記與申命記各出現過一次，原文卻不是同一個說法。民數記十五章30節是 be./Yad ra.Mah——舉著手做的；申命記十七章12節是
    ve./za.Don（H2087，簡要詞典義 za.don: arrogance），CT 的原文字義註它是傲慢、自大，並把「擅敢行事」解成行為傲慢、行事叛逆。GT《聖經精讀本》直接把這個詞解作驕傲或傲慢。


    兩處的處分方向一致：民數記那裡是必從民中剪除，申命記這裡是那人必治死，並把那惡從以色列中除掉。不同的是所抗拒的對象。民數記針對的是耶和華的言語與命令，申命記十七章針對的是神所設立的祭司與審判官所下的判語。BH
    就是這樣讀第12節的——擅敢行事指的是對已立之權柄的傲慢與抗拒，是對神所立次序的正面挑戰，並以民16 可拉的背叛為例。'
