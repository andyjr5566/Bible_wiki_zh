- title: 祭司的分（靠祭物養生）
  path: link_folder/主題/祭司的分（靠祭物養生）.md
  definition: '祭司沒有田地，他們的收入來自祭壇。利未記第六章把這件事寫成制度：素祭燒掉一把作紀念之後，「所剩下的，亞倫和他子孫要吃」（v16）；贖罪祭除了該燒的部分，「為贖罪獻這祭的祭司要吃」（v26）。神親自把這些稱為「從所獻給我的火祭中賜給他們的分」（v17）。


    **原文用了兩個不同的「分」字。** v17「賜給他們的分」是 חֵלֶק（H2506A，STEP 逐字解「share their」，分到的一份）；v18「作他們永得的分」換成
    חָק（H2706G，詞典義「statute: decree」，本節逐字解作「a prescribed portion of」）。前者指分到手的東西，後者指律法規定給他的定額。


    **祭司為什麼得靠這個活？因為他們沒有地。** GT 丁良才把兩件事扣在一起：「神叫伺候壇的祭司分領壇上的物（林前九13，民十八9），因此將迦南地分給十二支派的時候，祭司和其餘的利未人就沒有份（民十八7、20，書十三33，十八7）。」BH
    講的是同一件事：祭司「不像以色列其他支派那樣有地業」，這些供物就是他們的生活來源，好讓他們專心於屬靈職責（林前9:13-14）。


    **四份註釋都把它讀成新約教會的規矩。** CT：「神為現在的教會也是這樣命定，叫傳福音的靠著福音養生」，並引林前9:7、11、13-14、18；路10:7；加6:6，又補一句「神顧念事奉祂的人，親自供給他們所需用之物」。丁良才引同一串經文，還加了一句帶著時代處境的話——「這道理為中華基督教會的前途大關緊要」。


    **古代近東也有類似安排，但有一條紅線。** GT《舊約聖經背景註釋》：「不論崇拜者有沒有吃掉部分的祭牲，祭物的數量仍足夠供應祭司的食用。巴比倫的慣例也是如此，君王、祭司，和廟宇的其他人員都可以收取祭物的一部分。」接著它指出另一面：「早至蘇美時代的文獻，已經表示私吃分別為聖之物是滔天的罪行。」制度允許祭司吃，但吃法與地點被嚴格限定——要在會幕的院子裡、不帶酵、只限亞倫子孫中的男丁。


    KC 從吃的內容看出另一層：所有祭司吃的是同一份食物，「因此他們都會被塑造成同一個樣子，學會用同一種方式判斷萬事」。他並提醒，若有「祭司」是拿世界餵養自己的，祭司的事奉必然受虧損。'
  development: '這條制度不是利未記第六章才出現，卻在這裡第一次被寫成祭司自己該知道的操作條文。丁良才點出它與土地分配的關係：分迦南地時祭司和利未人沒有份（民18:7、20；書13:33、18:7），因為「神叫伺候壇的祭司分領壇上的物」（民18:9）。祭壇取代田產，成了這一族的產業。


    GT 丁良才在本章另外整理出祭司可在會幕院內吃的祭物共八種：贖罪祭的肉、贖愆祭的肉、會眾平安祭的肉、初熟莊稼一捆的子粒、百姓素祭所剩下的、七七節兩個作搖祭的餅、陳設的餅、潔淨大痲瘋者的一羅革油。這份清單橫跨利未記多章，說明「祭司的分」是一整套持續運作的供養安排，而不是單一祭別的附帶規定。


    CT 與丁良才都把這條線拉到新約：傳福音的靠福音養生（林前9:13-14）。同一個原則換了場景，但邏輯沒變——事奉聖所的，從聖所得供應。'
