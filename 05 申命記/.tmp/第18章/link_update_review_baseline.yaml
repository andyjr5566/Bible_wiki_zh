- title: 卦金（qe.sem）
  path: link_folder/原文/卦金（qe.sem）.md
  definition: '民數記22:7：「摩押的長老和米甸的長老手裡拿著卦金，到了巴蘭那裡」


    **原文寫的是「占卜」。** STEP 原文資料顯示，「卦金」在原文是 ke.sa.Mim（H7081），形態是陽性複數普通名詞（HC/Ncmpa），STEP
    給的本節譯義是 divinations，簡要義域是 qe.sem: divination。換句話說，經文並沒有用一個表示「錢」的字，而是直接用「占卜」的複數形，來指他們手裡帶著的東西。CT
    給的原文字義同樣是「卦金」占卜(費用)。


    **各家怎麼理解。** CT 說「『卦金』指求見的禮物」。BH 說占卜在古代近東是常見的作法，用來求問神明的心意；提到費用，說明這是一筆正式的交易，也表示巴蘭是個專業的占卜者；BH
    並指出這種作法在以色列的律法裡是被禁止的（申18:10-12）。


    **是報酬還是定金。** GT《舊約聖經背景註釋》提出一個具體的疑問：「事關重大的資訊當然可以賺取費用或報酬（見：撒下四10）。占卜師是宗教的從業員，提供服務可以索取酬金（撒上九8）。但巴蘭要到咒詛以色列人之後才能收費（民二十四11）。故此，這數額可能是報酬而非定金。」'
