- title: 義人與完全人
  path: link_folder/神學/義人與完全人.md
  definition: 創世記6章9節以 צַדִּיק（H6662，形容詞「公義的」）、תָּמִים（H8549H，形容詞「純全／無可指摘的」）和 הִתְהַלֶּךְ（H1980I，反身詞幹完成式，「行走」）三方面描寫挪亞。CT進一步把三者並讀為信靠神、存完全的心並在生活中與神同行；GT、KC與BH則從因信稱義、正直無虧和對神專一等角度加以發展。
  development: '### 神學意義／研讀意義


    - **義人**：因信稱義（來十一7；結十四14），非謂無罪

    - **完全人**：原文與書二四14「誠心實意」同；指對神單一純真的信心，不是行為無罪

    - **與神同行**：與以諾並列（創五24），在實際生活中親近神、顧到神旨意

    - 三者同義：世上無行為完全的人，但存心正直，神看為完全

    - 「完全人」的「完全」是相對的——相對於當時世代的敗壞'
