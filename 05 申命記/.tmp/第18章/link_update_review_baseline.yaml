- title: 神蹟奇事不是真先知的憑證
  path: link_folder/主題/神蹟奇事不是真先知的憑證.md
  definition: '申命記第十三章一開頭就設了一個很難的情境：有人自稱先知或做夢的，向你顯個神蹟奇事，而且第2節說「他所顯的神蹟奇事雖有應驗」——事情真的發生了。經文接著在第3節說：「你也不可聽那先知或是那做夢之人的話」。


    STEP 顯示第1節的兩個詞是分開的：「神蹟」是 ''ot（H226G，簡要詞典義 ot: sign: miraculous），「奇事」是 mo.Fet（H4159，mo.phet:
    wonder）；「做夢的」在原文是兩個字接在一起，cho.Lem cha.Lom（H2492B cha.lam: to dream ＋ H2472 cha.lom:
    dream），CT〔原文字義〕註的正是「做夢的(原文雙字)」做夢(首字)；夢(次字)。


    **判準不在能不能行，而在說了什麼。** GT《啟導本聖經申命記註釋》把話說死：「真先知的憑證不是有無行神蹟的能力（十七1），而是他的信息和工作是否符合神所啟示的客觀標準，是否合乎基本信仰。」它並補上另一項測驗——所說的預言完全應驗（十八22）——同時指出即令偶然應驗，只要目的是勾引人離開神的道，就必須防備、反對他。GT《申命記串珠聖經註釋》說得更直接：假先知縱使能行神跡奇事，若所說的話違反了神的律法、又鼓吹敬拜假神，以色列人就絕不能容許他們存在。


    **應驗本身是被容許的。** GT《申命記雷氏研讀本》指出：「要判斷真假先知，我們不能以預言之應驗為根據，卻要看他有否引導百姓遠離神。為了試驗神的子民，神也容許假先知的預言應驗」。CT
    在第3節把界線劃得很小心：這話並非告訴我們神主動利用假先知行神蹟奇事，因為邪靈也會行超自然的事，並且可能預測近期內所將發生的事；神乃是容許假先知行騙，以顯明人的存心。


    **兩個詞的分工。** GT《啟導本》另外分辨了「神蹟」與「奇事」：前者為指示將來的預兆（賽七11），後者是證明先知或作夢的確有能力的異事（出四21），不過二詞常用作同義詞。它並提醒夢在古時被認為是神啟迪人的途徑（民十二6），後來卻也成了假先知自欺欺人的手段（耶二十三16、25）。


    **KC 與 BH 都把重點放回話語上。** KC 說「It is not the sign or the wonder that is decisive,
    but the Word of God.」（決定性的不是神蹟或奇事，而是神的話。）他並指出神蹟奇事本來的作用只是支持所傳的信息（來2:3-4），撒但也能仿製神蹟，末世尤其如此（帖後2:9；啟13:14），而主耶穌自己就警告過假基督與假先知要顯大神蹟大奇事（太24:24）。BH
    說行神蹟的能力不是真先知獨有的，在古代近東的處境裡，神奇的作為有時正與異教作法和假神連在一起；重點是要拿信息和使者去對照神已經啟示的真理。GT《聖經精讀本》的結論相同：在信仰裡神跡奇事本身並不重要，重要的是是否榮耀神。'
