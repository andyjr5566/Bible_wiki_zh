- title: 先知
  path: link_folder/主題/先知.md
  definition: '聖經中第一次出現「先知」一詞在創世記二十章7節。亞伯拉罕被稱為先知，強調他作為神代言人的角色——一面為神向人說話，一面為人向神禱告。


    先知不是主要預測未來，而是傳達神的話語。亞伯拉罕的三重尊榮：君王（創十四14–16）、祭司（創十八23–33）、先知（創二十7）。先知最重要的職事是為人禱告。'
  development: '先知在舊約中逐漸發展為正式職分（摩西、撒母耳、以利亞等），新約中基督是終極先知（來一1–2）。


    ### 這個字第一次出現時的用法很特別


    GT《創世記雷氏研讀本》註明創20:7 是聖經第一次出現希伯來文一字，意思是「**宣佈，以中間人的身分發言**」，而這個用語通常指代表上級宣佈信息的人——該上級通常（但不一定）是神（比較出7:1，摩西對亞倫如同神，亞倫作他的先知）。KC
    的說法相同：「With ‘prophet’ we should not only think about predicting the future. It
    is not even the main idea. A prophet passes on the words from someone else (Exo
    7:1), here from God.」（講到先知，我們不該只想到預告未來，那甚至不是主要的意思；先知是把別人的話傳遞出去的人，這裡是把神的話傳出去。）


    但本章的用法有一個不合常規之處。GT《舊約背景註釋》〈創二十7 先知的代求〉指出：先知通常是傳達神明的信息，**而亞伯拉罕在此卻是為人得醫治代禱**（17節）。背景註釋認為這反映的是對先知比較廣義的看法——把他視為「與神明關係有力，能夠咒詛，也能把它除去的人」；王上13:6
    亦提及類似的先知角色（耶羅波安的手枯乾，求神人禱告使手復原）。它並補一句古代近東的分工事實：這個角色主要是由**施咒的祭司**所扮演的。


    ### 古代近東確實認得這個角色


    背景註釋以馬里鎮遺址為證：那裡挖掘到**五十多個記載不同先知所傳信息的文獻**，可見古代近東的人很明白先知是什麼。因此亞比米勒聽到「他是先知」時，不需要額外解釋就知道這意味著什麼——這也解釋了他為何立刻照辦。


    ### 首次出現用在一個剛失敗的人身上


    GT《啟導本聖經創世記註釋》點出這一幕的張力：這是聖經第一次提到「先知」，而且用在亞伯拉罕身上——他曾為所多瑪代求，「現在帶著慚愧也為亞比米勒禱告」（17節）。GT《串珠聖經註釋》把重點放在關係上：「先知」表明亞伯拉罕和神有特殊的關係，他的代禱大有功效。


    雷氏則把本章先知職分的具體效果數出來：亞伯拉罕的求情救了亞比米勒的性命，並解除其家眷不育的咒詛（7、17、18節）。CT 由此歸納先知功用的兩面——一面是為神向人說話，將神的道理薦與各人的良心（林後4:2）；一面是為人向神說話，把人帶到神面前為他禱告。CT
    並下了一句判語：「誰有神的話，誰就是先知；先知最重要的職事，是為人禱告。」


    CT 另提醒這一幕對神的態度：神在亞伯拉罕這樣的光景中還為他說好話、把功勞歸給他，可見神何等看重屬祂的人。


    ### 到了申命記，重點從「是不是先知」變成「該不該聽他」


    創20 與出4 處理的是這個角色是什麼；申命記13 處理的是同一個角色出問題時怎麼辦。


    申13:1-5 設的情境是有人自稱先知或做夢的，行了神蹟奇事，而且應驗了，卻叫人去隨從別神。經文的裁決寫在第3節——你也不可聽那先知或是那做夢之人的話。GT《啟導本聖經申命記註釋》把判準明說出來：「真先知的憑證不是有無行神蹟的能力（十七1），而是他的信息和工作是否符合神所啟示的客觀標準，是否合乎基本信仰。」


    這一章因此補上了前面幾章沒有的一面。創20 的先知是替人代求、與神有特殊關係的人；申13 提醒同一個頭銜可以被冒用，而且冒用者未必沒有能力。GT《申命記串珠聖經註釋》說假先知縱使能行神跡奇事，若所說的話違反了神的律法、又鼓吹敬拜假神，就絕不能容許他們存在。KC
    的結論相同——決定性的不是神蹟或奇事，而是神的話。


    三處合起來，先知這個身分的重量始終不在能力上：創20 是他能為人禱告，出4 是神給他記號作憑證，申13 則說明記號本身不能替他背書。'
