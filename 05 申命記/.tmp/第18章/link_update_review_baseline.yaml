- title: 何烈山
  path: link_folder/地點/何烈山.md
  definition: 何烈山是摩西牧羊時遇見燃燒荊棘、蒙神呼召的「神的山」，後來又成為以色列出埃及後事奉神、領受盟約啟示的地方。何烈常與西奈作同一山區或同一山的不同名稱理解；其確切現代位置有不同傳統與研究方案。
  development: 'CT 說「神的山是後來的稱呼，取這名起因於神在這山上召見摩西並降律法」（3:12；19:1-2、11）；GT《舊約背景註釋》給的理由相同而說得更嚴：摩西「把它描述為神的山，最有可能是他意識到以後幾章所發生的事件，使這山得到了新的地位；不是因為這裡發生過什麼事，或有什麼迷信的理由」，同段並補上時代背景——「古代世界和古典時代的人，相信山是神明居住的所在」。GT
    丁良才則記下神在這山上三次向人顯現：向摩西、向以色列人（18:5）、向以利亞（過了幾百年，王上19:8）。


    聖地的性質，GT《啟導本聖經腳註》寫得最直接：「『聖地』並非天生，而是因為有神在那裡；人同樣要奉獻自己為神所用，有神同在，才成為聖徒。」


    它與西乃山的關係，各家有三說。GT《聖經精讀本》列出：「①兩座山名稱雖異，其實是一座山；②一座山上的兩座峰，一個叫何烈一個叫西乃；③山的總稱叫何烈，特別把當中部分叫作西乃」，並說從地理位置上兩座山不能嚴格地分區；今天人們推測它是西乃半島最南端、海拔2,291米的耶別姆沙（Jebel
    Musa，摩西的山）。GT 丁良才記後兩說。GT《中文聖經註釋》指出兩個名字的字義正好相反——何烈是「不毛之地」或「乾旱之地」，西乃是「叢林密佈」——因此「這神的山究竟在何處……使我們困惑。但有一點是可以確定的，這神的山必然是在西乃半島之內」；GT《串珠聖經註釋》同說「其確實位置不詳」。'
