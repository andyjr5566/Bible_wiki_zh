- title: 神的揀選
  path: link_folder/神學/神的揀選.md
  definition: 神的揀選指神按自己的主權與恩典揀選個人或群體歸祂。創25 在雅各和以掃出生前即宣告「大的要服事小的」，顯示揀選超越出生次序與當時的行為表現；申4:37
    把以色列蒙揀選連於神對列祖的愛，申7:6-8 則說神揀選以色列作自己的子民，不是因他們人數眾多，而是因祂的愛及向列祖所守的誓。
  development: '創世記二十五章從一對尚未出生的兄弟說明神揀選的主權：雅各蒙揀選不由出生次序或出生前的行為決定。申命記第四章把視野擴到整個民族，將以色列的蒙選連於神愛他們的列祖，並以出埃及作為這揀選已進入歷史的證據。


    申命記第七章進一步排除人數眾多這個理由，將揀選放在神的愛與向列祖所守的誓上。第6節的聖潔、蒙揀選與特作自己的子民彼此相連，第9至11節隨即要求百姓認識神的信實並謹守誡命。揀選在本章建立以色列的約中身分，也帶出對神忠誠的生活責任，不能被解作族裔優越。


    申命記第十章加上一個對比的位置。第14節先把範圍拉到最大——天和天上的天，地和地上所有的，都屬耶和華；第15節才說他「但喜悅你的列祖，愛他們，從萬民中揀選他們的後裔」。GT《申命記串珠聖經註釋》點出「但」這個字的作用：它強調的正是這位掌管宇宙的耶和華竟然揀選了列祖和以色列人。==擁有全部的那一位，挑的只有一家。==


    STEP 在這一節給的兩個動詞也值得記下：「喜悅」是 cha.Shak（H2836A，簡要詞典義 to desire），CT 的〔原文字義〕作戀慕；「揀選」是
    va/i.yiv.Char（H977，ba.char）。前一個字帶著情感，後一個字帶著決定。GT《聖經精讀本──申命記註解》由此推出同一個結論：蒙揀選的百姓不能標榜自己的公義，只能感謝神的恩典並順服其旨意。


    申命記前面幾章講的揀選，對象都是整個民族——第四章連於神對列祖的愛，第七章排除了人數眾多這個理由。申命記十七章第15節把同一個動詞用在一個人身上：你總要立耶和華─你神所揀選的人為王。STEP
    顯示這裡是 yiv.Char（H977，簡要詞典義 ba.char: to choose），與前面幾處同一個字。


    GT《聖經精讀本》從這個條件讀出它的反面意思：立王的第一個條件必須是神所揀選的人，這暗示了以色列的真正之君是神，屬世君主只是神的代理人。BH 也把這一節接到後來實際發生的事——撒上9:15-17
    立掃羅、撒上16:1-13 立大衛，兩次都是神藉先知揀選的。'
