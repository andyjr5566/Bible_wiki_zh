- title: 火祭（isheh）
  path: link_folder/主題/火祭（isheh）.md
  definition: 希伯來文 isheh，指「經火焚燒的祭物」。利未記 3 章平安祭中，脂油、腰子、肝上網子、肥尾巴須在壇上焚燒，「獻與耶和華為馨香的火祭」（利
    3:5, 11, 16）。火祭表徵完全歸神、經得起火煉試驗的奉獻。
  development: '### 「火祭」這個詞實際出現在哪裡


    把和合本利未記出現「火祭」二字的節逐一數出來，範圍其實很集中：


    | 祭別 | 出處 |

    |---|---|

    | 燔祭 | 利1:9、13、17 |

    | 素祭 | 利2:2、3、9、10、11、16 |

    | 平安祭 | 利3:3、5、9、11、14、16 |

    | 贖罪祭 | 利4:35 |

    | 贖罪祭（貧窮人的細麵） | 利5:12 |

    | 祭司的分 | 利6:17、18 |

    | 贖愆祭與平安祭（祭司條例） | 利7:5、25、30、35 |


    從這張表看得出兩件事。一是「火祭」不是某一種祭的名字，而是橫跨五祭的共同標記——凡有一部分要在壇上焚燒的，都可以叫火祭。二是它在利6-7 章的用法轉了向：前五章多半用來形容獻上去的那一份（歸神的部分），利6:17-18
    與利7:35 卻用它來指祭司從中領受的那一份——「從所獻給我的火祭中賜給他們的分」。同一個詞，一頭指向壇上的煙，一頭指向祭司的飯桌。

    民數記把這個詞帶進了另一種用法。民數記第15章連續五次用「火祭」（v3、10、13、14、25），但重點不在哪一種祭，而在配料——從這一章開始，每一份火祭都要連著素祭與奠祭一起上壇（GT《民數記串珠聖經註釋》：「摩西五經中，這裡是第一次說明每次奉獻祭牲必須有素祭和奠祭陪同」）。同一章並把它擴到寄居的外人身上：「你們怎樣辦理，他也要照樣辦理」（v14）。利未記管的是「哪些祭算火祭」，民數記第15章管的是「一份火祭要帶什麼、誰可以獻」。



    新約把信徒的生命讀成活祭，同樣要經火試驗（羅12:1；林前3:13-15）。'
  signals:
  - first_in_book
