- title: 求問與訪問同一個字（da.rash）
  path: link_folder/原文/求問與訪問同一個字（da.rash）.md
  definition: '申命記第十二章開頭與結尾各有一個「問」。第5節說「你們就當往那裡去求問」，第30節說「也不可訪問他們的神」。中文用了兩個詞，原文是同一個。


    STEP 顯示第5節是 tid.re.Shu（本節逐字解 you will resort），第30節是 tid.Rosh（本節逐字解 you should
    enquire），兩處都是 H1875，簡要詞典義 da.rash: to seek。GT《申命記串珠聖經註釋》在第30節直接註明：「訪問」：原文與5節「求問」是同一個字。CT〔原文字義〕的兩處註解也給了同一組字義——第5節「求問」求助，尋找；第30節「訪問」求助，尋找。


    **這個動作本身沒有好壞，決定性的是對象。** CT 在第5節說『求問』意指到聖殿去敬拜神，在第30節說『訪問』意指去向偶像假神求問。GT《串珠》在第5節補上這個字在別處的用法，指它是到聖所去敬拜神（創25:22；摩5:5）。所以本章從第5節到第30節，其實是同一個動詞轉了一百八十度。


    **第30節禁的不只是照著做，連打聽都不行。** GT《啟導本聖經申命記註釋》解釋：「訪問」是為了信仰的緣故去求問，以色列人到了迦南後可能會想知道當地人祭祀的習俗，跟著去學習模仿。GT《申命記雷氏研讀本》說以色列人甚至不能詢問有關迦南人膜拜的事，恐怕他們會把迦南膜拜的元素摻雜在向神的敬拜裏，並比較羅十六19
    一個類似的勸告。CT 的話中之光把理由講得更白：神甚至不准以色列人過問周圍異教的事情，因為敬拜偶像的風氣滲透整個迦南地，沉迷於研究一些看來無害的風俗也很容易令人迷失；好奇心有時會令我們跌倒，對邪惡的事有過多的認識反而會令我們受這些邪惡的事引誘。


    **KC 與 BH 的方向相同。** KC 說我們不該出於好奇去接觸邪惡，那往往是踏進撒但領域的第一步，後果無法估量；他並指出這一類惡行在以色列歷史上成為被擄的原因之一（王下17:17-18）。BH
    說禁止打聽是為了防止混雜——古代近東是多神環境，一旦把外邦敬拜的元素併進對耶和華的敬拜，就違反了第一條誡命。


    **反過來，第5節的求問是被命令的。** BH 指出第5節用「尋找」這個動作，意味著這件事需要刻意與順服，不是被動等著。KC 讀到的也是同一點：神沒有給地址，是要百姓去找、去求問——他並舉大衛作例子，說舊約裡只有大衛真的為這件事求問過（詩132:3-5）。'
  development: '同一個動詞在申命記裡對過三種對象。十二章第5節命令百姓往耶和華所選擇的地方去求問；同章第30節禁止他們訪問迦南人的神——中文兩個詞，原文同一個字。申命記十七章第9節出現第三種對象：難斷的案子上到那地方以後，要求問祭司利未人與當時的審判官。STEP
    顯示這裡是 ve./da.rash.Ta（H1875）。


    三處連起來看，這個字的好壞從來不落在動作本身。BH 就第9節說，求問這個動作承認了神所設立之人的權柄，是對神所立次序的謙卑順服。求問神所選的地方是被命令的，求問神所設立的人也是；被禁止的只有一種對象。'
