- title: 先知
  path: link_folder/主題/先知.md
  summary: '第15至22節六次出現「先知」（STEP：na.Vi''，H5030）。第15、18節應許神要從弟兄中間興起一位先知像摩西；第18節說「我要將當說的話傳給他」，STEP 顯示是 ve./na.ta.Ti（H5414H，na.tan: to give: put）de.va.Ra/i（H1697G）be./Fi/v（H6310G，peh: lip），字面是把我的話放在他口中，CT〔話中之光〕註的正是「傳給他」原文是「放在他口中」。第19節說不聽的神必討他的罪；第20至22節規定兩宗死罪與應驗的檢驗。CT 說先知的職分既不像人所選舉設立的審判官，也不像世襲的君王，更不像與生俱來的祭司利未人，而是由神一個一個單獨興起的，並說神通常在百姓背道的時候才興起先知。GT《啟導本》說這裡並非規定要像祭司或審判官一樣設立一個固定的先知職務；GT《聖經精讀本》說先知就是傳達神旨意的代言人，並列出真先知話語具權威的兩個條件。KC 說君王和祭司有繼承，先知沒有，並說這位先知將是一位中保。BH 說先知是神與人之間的居間者。'
  relation: 創20 說明先知是什麼，出4 給出摩西與亞倫這個原型，民11、12 分辨受感說話與先知職分，申13 處理頭銜被冒用時怎麼辦；本章第一次正面說出這個角色從哪裡來，並把起因追到何烈山百姓自己的請求。申13 與申18 因此構成一對：一面是神真的會給，一面是給了以後仍要分辨。
