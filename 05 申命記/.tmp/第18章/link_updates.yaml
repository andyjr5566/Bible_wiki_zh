- title: 義人與完全人
  path: link_folder/神學/義人與完全人.md
  summary: '第13節：「你要在耶和華─你的神面前作完全人。」STEP 顯示是 ta.Mim（H8549H，簡要詞典義 ta.mim 為 unblemished: blameless），與創6:9 描寫挪亞的是同一個 Extended Strong。CT〔原文字義〕註「完全人」完全的，健全的，並解作「意即單單信靠神，不聽信任何邪術」（參創十七1）。GT《申命記串珠聖經註釋》說「完全人」是誠實無偽之人，如挪亞、約伯（伯1:1）。BH 在本節寫出音譯 tamim，說它含完整、真誠、無瑕之意，並說這不是指從未犯罪而是指活得正直忠實，又把挪亞與亞伯拉罕（創6:9、17:1）列為同一描述的對象。KC 說神要祂的百姓在祂面前是無可指摘的。'
