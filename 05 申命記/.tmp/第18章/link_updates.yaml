- title: 何烈山
  path: link_folder/地點/何烈山.md
  summary: 第16節：「正如你在何烈山大會的日子求耶和華─你神一切的話，說：求你不再叫我聽見耶和華─我神的聲音，也不再叫我看見這大火，免得我死亡。」STEP 顯示「何烈」是 be./cho.Rev（H2722）。CT 說『何烈山大會的日子』指以色列人聚集在西乃山（就是何烈山）的山腳下、等候神降律法的那段日子（參出十九17），並說『求你』就是求摩西（參申五23、27；來十二18~19）。GT《聖經精讀本》說大會的日子指以色列百姓為了從神領受十誡、經過兩天的潔淨期之後聚集在西奈山腳下的那一日。BH 說何烈是西乃山的另一個名稱。
