- title: 立他名的居所（中央聖所）
  path: link_folder/主題/立他名的居所（中央聖所）.md
  summary: 第6至7節：利未人若從所住的城出來，「一心願意到耶和華所選擇的地方」，就要奉耶和華他神的名事奉，像他眾弟兄利未人侍立在耶和華面前事奉一樣。STEP 顯示是 ha./ma.Kom（H4725）'a.Sher yiv.Char（H977）。CT 說『耶和華所選擇的地方』指聖所，即指後來在耶路撒冷所建的聖殿，並說每個利未人都有權遷移到那裡事奉。GT《聖經精讀本》說若有利未人因純正的宗教熱心懇切希望上到會幕所在的中央聖所去服事就當允許他，並說這樣的規定「防止了因獨佔中央聖所而有可能派生的特權意識」。BH 說這個被揀選的地方最終成為耶路撒冷。
  relation: 申12、14、15、16 章講的是把祭物與節期帶到那一個地方，申17 第一次讓人為了難斷的案件上去，本章則讓人搬過去長住事奉。這使中央聖所從一個獻祭與終審的地點，變成一個有職位、有配給、需要規定分配辦法的常設機構——第8節處理的正是機構化之後才會出現的問題。
