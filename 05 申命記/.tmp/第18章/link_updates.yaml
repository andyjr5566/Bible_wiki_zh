- title: 擅敢行事與褻瀆耶和華的剪除處分
  path: link_folder/神學/擅敢行事與褻瀆耶和華的剪除處分.md
  summary: '第20節「若有先知擅敢託我的名說我所未曾吩咐他說的話，或是奉別神的名說話，那先知就必治死」，第22節「是那先知擅自說的」。STEP 顯示 v20 是 ya.Zid（H2102，簡要詞典義 zud），v22 是 be./za.dOn（H2087，za.don: arrogance），後者與申17:12 是同一個 Extended Strong。CT〔原文字義〕在 v20 註「擅敢」行為傲慢，行事叛逆，在 v22 註「擅自」傲慢，自大，並說所犯的死罪有兩種：託神的名說神所未曾吩咐他說的話，以及奉別神的名說話。GT《申命記串珠聖經註釋》說「奉別神的名說話」違反十誡的第一誡，故須處死；GT《聖經精讀本》說這些人都是妄稱聖潔之神的名字或向神的名挑戰之徒。BH 說擅敢指的是傲慢與越權，先知未受差遣卻擅自行動。'
