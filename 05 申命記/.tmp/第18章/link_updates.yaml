  path: link_folder/主題/不可行法術觀兆.md
  summary: 第10節列出「觀兆的、用法術的」，第14節再提「觀兆的和占卜的」。STEP 顯示「觀兆」是 me.'o.Nen（H6049B，a.nan）、「用法術」是 me.na.Chesh（H5172，na.chash），與利19:26 是同一對字根。CT〔原文字義〕註「觀兆」帶出雲影、「用法術」觀測兆頭，並說『觀兆(observer of times)』指一種星象術、預測未來將要發生的事（參利十九26），『法術(enchanter)』指藉邪靈行超自然的現象。GT《啟導本》說「觀兆」可能指觀看星象、「用法術的」以法術示前途；GT《雷氏研讀本》說「用法術的」是「解釋預兆的人」，並說巴蘭所做的就是這種工作（比較民二四1）。
