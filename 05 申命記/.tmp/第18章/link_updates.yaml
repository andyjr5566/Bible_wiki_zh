- title: 侍立事奉（a.mad、sha.rat）
  path: link_folder/原文/侍立事奉（a.mad、sha.rat）.md
  summary: 第5節「使他和他子孫永遠奉耶和華的名侍立事奉」，第7節「就要奉耶和華─他神的名事奉，像他眾弟兄利未人侍立在耶和華面前事奉一樣」。STEP 顯示 v5 是 la./'a.Mod（H5975G）le./sha.Ret（H8334），v7 則把兩者拆開使用：ve./she.Ret（H8334）與 ha./'o.me.Dim（H5975G）。CT〔原文字義〕註「侍立」侍立，站立、「事奉」伺候，服事，並說『侍立，事奉』侍立指等候差遣，事奉指投入工作，兩者構成祭司利未人的主要職務（參申十8）。GT《申命記串珠聖經註釋》說「侍立事奉」是祭司的職務（參10:8）。BH 說站立是預備與服事的姿態。
  relation: 申10:8 用這一對字交代利未支派的職分，申17:12 用它作為判決有效力的根據，本章第5節則把它寫成揀選的目的本身——神揀選這個支派，就是為了讓他們侍立事奉。第7節又把兩個動詞拆開分配給新來的與原有的利未人，說明兩邊做的是同一件事。
