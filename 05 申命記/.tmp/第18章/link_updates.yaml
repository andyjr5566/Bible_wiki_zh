- title: 申18：10-12
  path: link_folder/互文/申18：10-12.md
  summary: 本條目所指的經文本身。第10至11節列出九項：使兒女經火、占卜的、觀兆的、用法術的、行邪術的、用迷術的、交鬼的、行巫術的、過陰的；第12節下判語「凡行這些事的都為耶和華所憎惡；因那些國民行這可憎惡的事，所以耶和華─你的神將他們從你面前趕出」。STEP 顯示九項各有不同字根（H5674A、H7080、H7081、H6049B、H5172、H3784、H2266、H2267、H7592、H178、H3049、H1875、H4191），第12節的「憎惡」是 H8441。CT〔原文字義〕逐項給字義，並指出「占卜」「用迷術」「交鬼」「過陰」在原文都是雙字，又說『迷術charmer』「指用符咒」、全聖經僅此一次提到。GT《聖經精讀本》說本文主要警告了占卜、法術等迷信行為，並說偶像崇拜極其廣泛地漫延于迦南人之間；GT《啟導本》說古時的人靠邪術求神問卜來測吉凶，甚至一國是否出戰也靠術士的觀兆、占卜來決定。BH 說這些作法在古代近東文化裡十分普遍。
  relation: 這是本條目名稱所指的那一段經文第一次以主場身分被處理。出22:18 只給刑度，利19、利20 分項禁止並補上刑罰，本章則把形態列全、給出理由，並在第13至15節接上替代方案——作完全人，聽神所興起的先知。定義因此從一句索引式的說明改寫為這段經文本身的內容；跨卷綜合一律寫在主題發展，出22 與利20 兩個逐章累積區塊維持原樣不動。
