- title: 寄居的
  path: link_folder/原文/寄居的.md
  summary: '第6節：「利未人無論寄居在以色列中的哪一座城」。STEP 顯示「寄居」是 gar（H1481A，簡要詞典義 gur 為 to sojourn），主詞是利未人而不是外人；同一節的「城」是 she.''a.Rei./kha（H8179H，sha.ar: gate: town）。CT 說『哪一座城』包括祭司在內的利未人共得四十八座城（參民三十五7）。GT《雷氏研讀本》說利未人「即不象其它支派那樣獲得分地，但有四十八座城是指明歸給利未人的」。BH 說利未人在各城之間的移動反映他們的事奉不被地點綁死。'
  relation: 前面幾章的「寄居的」講的是住在以色列中的外人（ger，H1616），需要被善待、被納入節期與什一；本章用的是同一字根的動詞，而且主詞換成利未人自己。理由寫在同章第1至2節——這個支派在以色列中無分無業，有城可住卻沒有地可分，所以經文用描寫外人的那個動詞描寫自己人。
