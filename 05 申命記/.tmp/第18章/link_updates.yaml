- title: 產業（na.cha.lah）
  path: link_folder/原文/產業（na.cha.lah）.md
  summary: 第1至2節四次出現這個字：祭司利未人和利未全支派「必在以色列中無分無業」（v1）、「他們在弟兄中必沒有產業；耶和華是他們的產業」（v2）。STEP 顯示是 ve./na.cha.Lah、ve./na.cha.la.T/o、ve./na.cha.Lah、na.cha.la.T/o（H5159），與之並列的「分」是 Che.lek（H2506A）。第8節另提到利未人賣祖父產業所得的（mi.ka.Ra/v，H4465）。CT〔原文字義〕註「分」一分(土地)、「業」產業，基業，並說「一切所捐的」原文與「業」同字。
  relation: 民數記那幾章用這個字處理誰承受哪一份地；本章用同一個字說明有一個支派被刻意排除在分配之外。同一個名詞在第2節裡同時是被拿走的東西與被賜下的東西——沒有 na.cha.lah，因為耶和華就是那 na.cha.lah。
