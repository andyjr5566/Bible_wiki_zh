- title: 利未人的什一奉獻
  path: link_folder/神學/利未人的什一奉獻.md
  summary: 第1節「火祭和一切所捐的」。CT〔文意註解〕說『一切所捐的』原文是「他的產業」，指什一奉獻（參民十八21）。GT《啟導本》也說祭司和利未人可以享受百姓的什一奉獻和部分祭物（參十四22及注；利二十七30；民十八21～29）。
