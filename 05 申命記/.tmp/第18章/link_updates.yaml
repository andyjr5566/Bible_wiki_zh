- title: 祭司的分（靠祭物養生）
  path: link_folder/主題/祭司的分（靠祭物養生）.md
  summary: '第3至5節：「祭司從百姓所當得的分乃是這樣：凡獻牛或羊為祭的，要把前腿和兩腮並脾胃給祭司」，再加初收的五穀、新酒和油與初剪的羊毛。STEP 顯示「當得的分」是 mish.Pat（H4941J，簡要詞典義 mish.pat 為 justice: custom），三個部位是 ha./ze.Ro.a''（H2220，arm）、ha./le.cha.Ya.yim（H3895H，jaw）、ha./ke.Vah（H6896，stomach）。CT 說『祭』指平安祭、『前腿』就是作舉祭之用的右腿（參利七32），『兩腮並脾胃』代表祭司所當得的祭肉。GT《申命記串珠聖經註釋》說這份清單「與利7:28-36; 民18:18-19細節上不同，但精義則一至」；GT《聖經精讀本》列出民18:8-20 規定為祭司之分的項目，並說如此具體地指出祭司之分是為了使百姓毫無怨言地將定量提供給祭司，也使祭司不能在規定之外再向百姓索取更多。BH 說這三個部位是牲畜的上選部分。'
  relation: 利未記第六、七章從祭壇的操作面把祭司該得的份寫成清單，本章從百姓的生活面再寫一次，項目不完全相同。第3節開頭用的字是 mish.Pat——它被寫成百姓該給的義務，而不只是祭司可拿的權利；GT《聖經精讀本》點出的兩個用意（防止百姓短給、也防止祭司多要）正是從這個角度來的。
