- title: 可憎的物（to.e.vah）
  path: link_folder/原文/可憎的物（to.e.vah）.md
  summary: 本章出現三次：第9節「那些國民所行可憎惡的事，你不可學著行」，第12節「凡行這些事的都為耶和華所憎惡；因那些國民行這可憎惡的事」。STEP 顯示分別是 ke./to.'a.Vot、to.'a.Vat、ha./to.'e.Vot（都是 H8441）。CT〔原文字義〕註「可憎惡的事」為製作並敬奉偶像，並說指拜偶像假神以及和偶像相關的事（參10~11節）。GT《聖經精讀本》說迦南人被趕出的原因是他們行了可憎之事，神並沒有因偏愛以色列百姓而除滅毫無過錯的迦南人。BH 說 detestable 一詞指神所憎惡的行為，並把它連到利18:24-30 玷污那地的說法。
  relation: 申14:3 用這個字管餐桌上的食物，申17:1 管獻上的祭物，申12:31、13:14、17:4 管敬拜的對象；本章管的是第四類——取得資訊的方法。第12節還把這個字寫成一項歷史判決的理由：列國被趕出，是因為行了這些事。
