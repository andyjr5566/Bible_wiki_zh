- title: 不可偏向交鬼行巫術的
  path: link_folder/主題/不可偏向交鬼行巫術的.md
  summary: '第11節列出「交鬼的、行巫術的」。STEP 顯示「交鬼的」是 sho.''El ''Ov（H7592 sha.al 加 H178 ov: medium），「行巫術的」是 yi.de.''o.Ni（H3049，yid.d.o.ni: spiritist），與利19:31、20:6、27 是同一對名詞。CT 說『交鬼的』指具通靈術、例如乩童女巫之類與邪靈污鬼來往的人（參利二十27），『巫術(necromancer)』指擁有異能、會行妖術的巫師（參利十九31）。GT《雷氏研讀本》說「交鬼的」是「靈媒」、「行巫術的」是「假裝認識靈幻世界的人」；GT《啟導本》說「行巫術的」和交鬼之法並用（賽八19）。BH 說靈媒被認為能在生者與死者之間居間傳話，並引利19:31 與撒上28 掃羅求問隱多珥交鬼婦人的下場。'
