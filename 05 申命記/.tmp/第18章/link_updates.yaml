  path: link_folder/原文/大會的日子（qa.hal）.md
  summary: '第16節「正如你在何烈山大會的日子求耶和華─你神一切的話」。STEP 顯示是 be./Yom（H3117G）ha./ka.Hal（H6951，簡要詞典義 qa.hal 為 assembly），與申9:10、10:4 完全相同；同一節的「求」是 sha.''Al.ta（H7592，sha.al: to ask），與第11節「交鬼的」sho.''El（同一編號 H7592）是同一個動詞，差別在求問的對象。CT 說這指以色列人聚集在西乃山山腳下等候神降律法的那段日子（參出十九17）。GT《聖經精讀本》說大會的日子指百姓為領受十誡經過兩天潔淨期後聚集在西奈山腳下的那一日（5:22;9:10;10:4;出19:11,16）。'
