- title: 神的揀選
  path: link_folder/神學/神的揀選.md
  summary: 第5節：「因為耶和華─你的神從你各支派中將他揀選出來，使他和他子孫永遠奉耶和華的名侍立事奉。」STEP 顯示「揀選」是 ba.Char（H977），第6節「耶和華所選擇的地方」用的 yiv.Char 也是同一個字。CT〔原文字義〕註「揀選」挑選，決定；「永遠」日子，有生之日，並說『他』指祭司利未人和利未全支派。CT 的話中之光說利未人事奉的資格是神賜給的。BH 說利未支派從十二支派中被揀出來有其獨特的呼召與目的，並把這件事接到出32:26-29 利未人在金牛犢事件中站在摩西一邊。
  relation: 申4、申7、申10 講的揀選對象是整個民族，申17:15 講的是一個人（王），本章講的是一個支派，而且揀選的內容不是身分而是職務——侍立事奉。第6節緊接著又把同一個動詞用在地點上。同一個字在申命記裡因此涵蓋了民族、君王、支派與地點四種對象。
