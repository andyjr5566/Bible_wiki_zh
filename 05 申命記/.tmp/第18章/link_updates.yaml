- title: 初熟
  path: link_folder/原文/初熟.md
  summary: '第4節：「初收的五穀、新酒和油，並初剪的羊毛，也要給他」。STEP 顯示兩次 re.Shit（H7225G，簡要詞典義 re.shit 為 first: beginning），後接 de.ga.ne./Kha（H1715）、ti.ro.she./Kha（H8492）、ve./yitz.ha.Re./kha（H3323），以及 gez（H1488，fleece）。CT 說初收的五穀新酒和油指初熟之物，是上好的（參民十八12），並在羊毛那一項註明：「聖經中僅此處提到羊毛歸祭司，初剪的羊毛未被玷污。」CT 的話中之光說把最好的和最先收穫的都給了祭司，是愛心的試驗，也是信心的確認。BH 說初熟之物象徵承認神的供應與主權，並把五穀、新酒、油列為古代近東飲食的主要作物。'
  relation: 出23:19 說初熟之物要送到耶和華你神的殿，民18:12 把它劃進祭司的份，本章則直接指名收件人是那位侍立事奉的祭司。本章還多了一項別處沒有的東西——初剪的羊毛，把初熟的範圍從地裡長出來的擴到牲畜身上剪下來的。
