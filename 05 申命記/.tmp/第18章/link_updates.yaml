- title: 神蹟奇事不是真先知的憑證
  path: link_folder/主題/神蹟奇事不是真先知的憑證.md
  summary: 第21至22節給出應驗這條測驗：「你心裡若說：耶和華所未曾吩咐的話，我們怎能知道呢？先知託耶和華的名說話，所說的若不成就，也無效驗，這就是耶和華所未曾吩咐的，是那先知擅自說的，你不要怕他。」CT 承認一般人確實無法當場知道，並把兩面都寫上——預言不應驗必定是假先知，預言有應驗也不一定是真先知；他還說判斷真先知不能單單以預言是否應驗為根據，還要看他所說的話是否與聖經的教導一致。GT《啟導本》說一個人說了預言卻不能應驗可以斷定為假先知，但「即使預言偶然得到應驗，也不一定是真先知」；GT《申命記串珠聖經註釋》說這裡所提的只是多種分辨假先知的方法之一。KC 說「The touchstone is and remains the Word of God.」（試金石始終是神的話。）BH 說預言的應驗是真偽的關鍵測驗，因為神的計畫不會落空。
  relation: 申13:1-5 處理的是有能力卻不可聽——神蹟奇事就算應驗了，只要那話把人帶去隨從別神就不可聽；本章處理的是另一端，沒有應驗就不必怕。兩章合起來，應驗這件事只能用來否定，不能用來肯定，而條目定義原本引用的十八22 這條測驗，本章正是它的出處。
