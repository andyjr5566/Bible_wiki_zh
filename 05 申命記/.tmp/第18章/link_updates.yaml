- title: 耶和華是事奉者的業與分
  path: link_folder/神學/耶和華是事奉者的業與分.md
  summary: 第2節：「他們在弟兄中必沒有產業；耶和華是他們的產業，正如耶和華所應許他們的。」STEP 顯示「產業」是 na.cha.Lah（H5159），與第1節的 Che.lek（H2506A）並列，與民18:20 是同一對字。CT 說這意指神負責利未人的生活問題，凡以色列人奉獻給神的都歸利未人享用；他在話中之光說這句話並不表明祭司和利未人得著了鐵飯碗，反而很容易叫他們沒有安全感，神是特意借著這樣的制度讓祭司、利未人和百姓一起學習在信心中跟隨神。GT《啟導本》說這是比喻的說法，意為百姓向耶和華所獻的是利未人生活的來源；GT《聖經精讀本》說這意味著神將全權負責利未人的所有生活問題。BH 說利未人的產業不是物質而是屬靈的，並引詩16:5。
  relation: 民18:20 是神對亞倫說的第一人稱，申14:27、29 是摩西對百姓說的否定式，本章第2節則把兩半同時說出來，而且加上「正如耶和華所應許他們的」——這句補語正是把讀者指回民18:20 的應許。這是同一組話在五經裡的第三種說法。
