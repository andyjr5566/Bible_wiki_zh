- title: 火祭（isheh）
  path: link_folder/主題/火祭（isheh）.md
  summary: 第1節「他們所吃用的就是獻給耶和華的火祭和一切所捐的」，這是「火祭」二字在申命記唯一一次出現。STEP 顯示是 'i.Shei（H801，簡要詞典義 ish.shah 為 food offering）。GT《申命記串珠聖經註釋》註「火祭」：此處指各類的獻祭；CT 則說火祭指經過火燒的一種獻祭，在任何的獻祭中凡把全部或一部分供物燒在壇上的都稱為火祭，並判斷這裡當然是指部分供物燒在壇上的。
  relation: 利未記用這個詞標記橫跨五祭的共同特徵，利6-7 把它轉去指祭司所領受的那一份；本章把這個轉向推到底——火祭在這裡直接被列為整個利未支派的糧食來源，而不是某一次獻祭的操作細節。兩家對範圍的讀法在此分歧，值得並陳。
