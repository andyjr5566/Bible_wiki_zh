book: 申命記
chapter: 22
candidates:
- name: 愛鄰舍與仇敵
  type: 主題
  evidence: 'v1-4 三次「不可佯為不見」。CT 話中之光：「『弟兄』指以色列人，但神百姓憐恤的對象不但是弟兄，也包括仇敵(出二十三4-5；太五44)」；GT《啟導本》：「1～4節的例也見《出埃及記》二十三4～5。這是將守望相助的精神推廣擴大到整個社會，連對待仇敵也應如此」；KC：「What applies in the case of an enemy (Exo 23:4), applies all the more to a brother.」'
  surfaces:
  - 不可佯為不見
- name: 可憎的物（to.e.vah）
  type: 原文
  evidence: 'v5「因為這樣行都是耶和華─你神所憎惡的」。STEP：תוֹעֲבַת to.''a.Vat（H8441，to.e.vah: abomination）。BH：「The use of the word "detestable" indicates the seriousness with which God views the violation of His created order.」'
  surfaces:
  - 所憎惡的
- name: 分別為聖
  type: 神學
  evidence: 'v9「都要充公」。STEP：תִּקְדַּשׁ tik.Dash（H6942I，qa.dash: to consecrate: forfeit）。GT《申命記串珠聖經註釋》：「「充公」：原是「成聖」：指交去聖所。」'
  surfaces:
  - 充公
- name: 不可使異類混雜（牲畜種子衣料）
  type: 主題
  evidence: 'v9-11 三道禁令與利19:19 同型。CT：「本段(9~11節)經文的用意，乃在維持信仰的純潔，不可兼容併蓄(參利十九19註解)」；GT《啟導本》：「兩種種子放在一道生長，可破壞品種的純正」；STEP v9：כִּלְאָיִם kil.''A.yim（H3610，kil.a.yim: mixture）。'
  surfaces:
  - 兩樣種子
  - 兩樣攙雜料
- name: 潔淨與不潔淨
  type: 神學
  evidence: 'v10「不可並用牛、驢耕地」。CT：「牛是潔淨的牲畜，驢是不潔淨的牲畜(參申十四4~8)」；BH：「The ox is a clean animal according to Levitical law (Leviticus 11:3), while the donkey is considered unclean (Leviticus 11:4).」；KC：「An ox is a clean animal and a donkey is an unclean animal.」'
  surfaces:
  - phrase: 牛、驢
    verses: [10]
- name: 衣服邊的繸子與藍細帶子
  type: 文化
  evidence: 'v12「你要在所披的外衣上四圍做繸子」。STEP：גְּדִלִים ge.di.Lim（H1434，ge.dil: tassel）。GT《啟導本》：「在外衣上作“繸子”，有提醒穿的人常守律法的作用(民十五38～39)，也是民族服裝的一個特色。」BH 把這做法追到民15:37-41。'
  surfaces:
  - 繸子
- name: 流無辜血的罪
  type: 神學
  evidence: 'v8「免得有人從房上掉下來，流血的罪就歸於你家」。STEP：דָּמִים da.Mim（H1818，dam: blood，複數）。BH：「Bloodguilt refers to the responsibility for shedding innocent blood, a serious offense in biblical law.」GT《啟導本》：「“流血的罪”看十九9；二十一1注。」'
  surfaces:
  - 流血的罪
- name: 當孝敬父母
  type: 神學
  evidence: 'v7「這樣你就可以享福，日子得以長久」。KC：「By the addition "that it may be well with you and that you may prolong your days", there is a connection between this regulation and the fifth commandment, that of honoring father and mother. A similar addition is given to the fifth commandment (Deu 5:16).」BH：「It is reminiscent of the fifth commandment in Exodus 20:12, which promises long life for honoring one''s parents.」'
  surfaces:
  - phrase: 日子得以長久
    verses: [7]
- name: 以色列的長老
