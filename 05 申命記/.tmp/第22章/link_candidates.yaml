- name: 舍客勒
  type: 原文
  evidence: 'v19「罰他一百舍客勒銀子」、v29「拿五十舍客勒銀子」。CT：「罰款一百舍客勒銀子(參19節)，約折合1150公克重，是女子聘禮身價的兩倍(參29節)」、「『五十舍客勒』約折合575公克」；GT《雷氏研讀本》：「罰款約相等於四十八安士(1.1千克)的銀子。」'
  surfaces:
  - 舍客勒
- name: 不可姦淫
  type: 神學
  evidence: 'v22「就要將姦夫淫婦一併治死」。GT《啟導本》：「希伯來人執行“不可姦淫”(出二十14)的誡命，只適用於男子與有夫之婦或與已受聘(訂婚)的女子行淫(利二十10；申二十二22～24,28～29)。」BH 也把本節接回出20:14。'
  surfaces:
  - 姦夫淫婦
- name: 引誘處女的律例
  type: 事件
  evidence: 'v28-29 與出22:16-17 是同一組案例的兩面。CT 話中之光：「男子沒有不娶的權力，但女子卻有拒絕的權力(出二十二16-17)」；GT《啟導本》列出污辱未許配女子的三項後果並註「女家若不許女兒嫁他，不可索還聘禮(出二十二16～17)」；KC 也整段引出22:16-17 作補充。'
  surfaces:
  - 沒有許配人的處女
- name: 不可同日宰母和子
  type: 主題
  evidence: 'v6「母鳥伏在雛上或在蛋上」。GT《聖經精讀本──申命記註解》註本節時把根據放在同一組律例上：「雖然律法賦予人掌管自然界的特權,但人總要根據神的慈愛與憐憫、維持、保護自然界(出23:19;利22:28)。」利22:28 正是不可同日宰母和子的條例。'
  surfaces:
  - 母鳥
- name: 男女不可易服的條例
  type: 主題
  evidence: 'v5「婦女不可穿戴男子所穿戴的，男子也不可穿婦女的衣服」。STEP：כְלִי khe.li（H3627，ke.li: article/utensil）與 שִׂמְלַת sim.Lat（H8071，sim.lah: mantle）。GT 艾基斯《舊約聖經難題彙編》整篇討論 keli 與 simlah 的字義範圍；GT《雷氏研讀本》：「在當時的社會，男性和女性的服裝十分相似」；GT《啟導本》講迦南異教儀式男女易服；KC 談創造次序與公開的表現。'
  surfaces:
  - 婦女不可穿戴男子所穿戴的
- name: 放母取雛的鳥窩條例
  type: 主題
  evidence: 'v6-7「不可連母帶雛一併取去。總要放母，只可取雛」。STEP：קַן kan（H7064，qen: nest）、צִפּוֹר tzi.Por（H6833，tsip.por: bird）、שַׁלֵּחַ תְּשַׁלַּח sha.Le.ach te.sha.Lach（H7971H，不定詞加強式）。CT：「取雛不取母，使生命可以延續」；GT《串珠》：「人不可以滅絕神在自然界中所造之物，須保護自然資源」；KC 從母性感情讀；BH 講永續與憐憫。'
  surfaces:
  - 不可連母帶雛一併取去
  - 總要放母
- name: 房上安欄杆的條例
  type: 主題
  evidence: 'v8「你若建造房屋，要在房上的四圍安欄杆」。STEP：מַעֲקֶה ma.''a.Keh（H4624，ma.a.qeh: parapet）、גַּג ga.Ge（H1406，gag: roof）。CT：「古時以色列人的房頂是平的，屋外有梯階可上房頂，供人休憩(參書二6)」；GT《精讀本》：「據猶大傳承,此時欄杆的高度當約有1米左右」；KC 讀成對新人的照顧；BH 講 bloodguilt。'
  surfaces:
  - 安欄杆
- name: 貞潔的憑據
  type: 文化
  evidence: 'v14-20 反覆出現「貞潔的憑據」。STEP：בְּתוּלִים be.tu.Lim（H1331，be.tu.lim: virginity，複數）。GT《啟導本》給了兩種說法：「“貞潔的憑據”可指初夜的落紅。也有人說是指結婚前仍有月事，以證明結婚時並未懷孕，確屬童貞」；GT《精讀本》：「就古代猶大的風俗而言,這是女子可證明其貞潔的唯一證據」；BH：「a cloth with bloodstains from the wedding night, which was kept as evidence of the bride''s virginity」。'
  surfaces:
  - 貞潔的憑據
- name: 誣告妻子不貞的三種懲罰
  type: 主題
  evidence: 'v18-19。GT《精讀本》：「記錄了誣告妻子尚未出嫁時有失貞潔的丈夫所要受到的三種刑罰」，即公開杖刑、罰一百舍客勒、終身剝奪休妻權；CT 逐項列同樣三點；GT《雷氏研讀本》：「“懲治他”的方法是鞭打他四十下(比較二五3)」；BH：「This lifelong commitment was a safeguard against further injustice.」'
  surfaces:
