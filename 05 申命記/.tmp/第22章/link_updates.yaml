  path: link_folder/事件/引誘處女的律例.md
  summary: 第28至29節：男子遇見沒有許配人的處女，抓住他與他行淫而被人看見，就要拿五十舍客勒銀子給女子的父親，娶他為妻，終身不可休他。CT 在話中之光說這一段「並不是認可婚前性關係，而是要求男子不可逃避責任」，並補上「男子沒有不娶的權力，但女子卻有拒絕的權力(出二十二16-17)」。GT《啟導本聖經申命記註釋》把後果列成三項：付足聘禮給女子的父親；女家若不許女兒嫁他，不可索還聘禮；娶他之後終身不可休棄。
  relation: 本章補上了出埃及記沒有寫的兩件事：聘禮的具體金額，以及娶了之後終身不可休妻。
