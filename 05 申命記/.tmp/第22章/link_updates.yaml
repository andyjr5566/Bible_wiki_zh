  path: link_folder/神學/流無辜血的罪.md
  summary: '第8節：建造房屋要在房上的四圍安欄杆，「免得有人從房上掉下來，流血的罪就歸於你家」。STEP 顯示「流血的罪」是 da.Mim（H1818，dam: blood 的複數形）。BH 說 bloodguilt 指的是流無辜血的責任，在聖經律法裡是嚴重的過犯。GT《啟導本聖經申命記註釋》把這個詞接回同卷前面的討論，並說「律法要求人在照顧自己之外，還應有公德，關心他人」。'
  relation: 本章讓這個詞出現在還沒有出事之前：屋主不必推人，只要沒有裝欄杆而有人摔下去，罪就歸到他家。
