  summary: 本章兩次以舍客勒定額：第19節罰誣告的丈夫一百舍客勒銀子給女子的父親，第29節玷污未許配之處女的男子要拿五十舍客勒銀子給女子的父親。GT《啟導本聖經申命記註釋》指出「“一百舍客勒銀”為一個女子聘禮的兩倍(比較29節)」。CT 說一百舍客勒「約折合1150公克重」、五十舍客勒「約折合575公克」；GT《申命記雷氏研讀本》說罰款「約相等於四十八安士(1.1千克)的銀子」。
