book: 申命記
chapter: 22
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 愛鄰舍與仇敵
  path: link_folder/主題/愛鄰舍與仇敵.md
  summary: 第1至4節三次吩咐「不可佯為不見」：弟兄的牛羊失迷了路要牽回來交給他，找不到失主就牽到自己家裡留著等他來尋找，衣服等失物同樣處理，牛驢跌倒在路上要幫他拉起來。CT 給的原文字義是「佯為不見」隱藏，遮掩，並說『失迷了路』原文含有被趕走的意思，顯然不是單純走迷了路，而是被人偷盜牽走；他在話中之光把這一段的原則定為「愛人如己」(利十九18)。GT《啟導本聖經申命記註釋》指出「1～4節的例也見《出埃及記》二十三4～5。這是將守望相助的精神推廣擴大到整個社會，連對待仇敵也應如此(出二十三5)。」KC 從第八誡的反面讀：「Not bringing back something our brother has lost, after having witnessed said loss occurring, is the same as stealing.」（親眼看見弟兄的東西掉了卻不送回去，等於偷竊。）
  relation: 本章把同一組動作的對象換成了弟兄，並且加上第2節的處理方式：找不到失主要把牲畜牽回自己家裡照看，等失主來尋找。CT 註『牽到你家』一心助人，不避被人嫌疑，光明正大，『留在你那裡』包括提供照看、餵食等——撿到之後還要替別人養著。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 出埃及記:23
      - 申命記:22
- title: 可憎的物（to.e.vah）
  path: link_folder/原文/可憎的物（to.e.vah）.md
  summary: '第5節用這個字為男女不可易服的禁令下理由：「因為這樣行都是耶和華─你神所憎惡的」。STEP 顯示這裡是 to.''a.Vat（H8441，簡要詞典義 to.e.vah: abomination）。BH 指出這個字在希伯來文脈絡裡常用來指偶像敬拜或性方面的可憎行為，並說這種強烈的措辭顯示神如何看待違反祂所定次序的行為。'
  relation: 這是本章唯一一次用到這個字，管的既不是敬拜、祭物、食物，也不是求問的方法，而是身上穿戴的東西。
  overview_review:
    signals: []
    accumulation_count:
    - 4
    - 5
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:14
      - 申命記:22
- title: 分別為聖
  path: link_folder/神學/分別為聖.md
  summary: '第9節說葡萄園若撒了兩樣種子，「免得你撒種所結的和葡萄園的果子都要充公」。GT《申命記串珠聖經註釋》註：「「充公」：原是「成聖」：指交去聖所。」STEP 顯示這個字是 tik.Dash（H6942I，簡要詞典義 qa.dash: to consecrate: forfeit）。CT 也說『充公』指分別為聖歸給聖所。'
  relation: 本章讓這個字出現在一個少見的位置：不是人主動把東西分別歸神，而是違例的收成被判歸聖所，人自己反而不能用。
  overview_review:
    signals:
    - development_blank
    accumulation_count:
    - 9
    - 10
    definition: keep
    development:
      decision: keep
      basis: standing_debt
- title: 不可使異類混雜（牲畜種子衣料）
  path: link_folder/主題/不可使異類混雜（牲畜種子衣料）.md
  summary: 第9至11節連下三道禁令：不可把兩樣種子種在葡萄園裡、不可並用牛、驢耕地、不可穿羊毛細麻兩樣攙雜料做的衣服。CT 說「本段(9~11節)經文的用意，乃在維持信仰的純潔，不可兼容併蓄(參利十九19註解)」。GT《申命記雷氏研讀本》對第10節說「兩種牲畜的步伐和拉力是不相等的」，對第11節另記一說：「據說拜偶像的祭司所穿的，就是這兩樣攙雜料做的衣服，以為這種衣服會產生魔力。」GT《申命記串珠聖經註釋》對第10節記另一種理解：「「牛驢耕地」：或指牛驢交配。」STEP 顯示第9節的「兩樣」是 kil.a.yim（H3610）。
  relation: 本章把利未記十九19 的概括禁令換成具體場景，並替混種補上後果——果子要充公。牛與驢的組合也在這裡第一次寫明，CT 指出牛是潔淨的牲畜、驢是不潔淨的牲畜，不可同負一軛。
