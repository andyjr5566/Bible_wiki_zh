  summary: 第22節：「若遇見人與有丈夫的婦人行淫，就要將姦夫淫婦一併治死。」GT《啟導本聖經申命記註釋》說明這條誡命的適用範圍：「希伯來人執行“不可姦淫”(出二十14)的誡命，只適用於男子與有夫之婦或與已受聘(訂婚)的女子行淫(利二十10；申二十二22～24,28～29)。」BH 也把本節接回出20:14，並說對雙方施以同樣的刑罰顯示兩人共同承擔責任。
