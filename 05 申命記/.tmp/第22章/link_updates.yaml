- title: 以色列的長老
  path: link_folder/文化/以色列的長老.md
  summary: 第15至19節由長老受理誣告新娘不貞的案子：女方父母把貞潔的憑據帶到本城門長老那裡，父親出面陳述，父母把那布鋪在本城的長老面前；長老要拿住那人、懲治他，並罰他一百舍客勒銀子給女子的父親。BH 說城中長老是受人敬重的領袖與審判官，常坐在城門口處理法律與民政事務。GT《啟導本聖經申命記註釋》另指出「在希伯來人社會中，女子的爭訟都由父親或丈夫出面擔負責任」。
  relation: 本章讓長老處理的是一樁憑物證定案的家事訴訟：他們要看那塊布，然後決定罰誰。
