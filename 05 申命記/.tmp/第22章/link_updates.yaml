- title: 衣服邊的繸子與藍細帶子
  path: link_folder/文化/衣服邊的繸子與藍細帶子.md
  summary: '第12節：「你要在所披的外衣上四圍做繸子。」CT 給的原文字義是「外衣」遮蔽物、「繸子」搓捻的繩索，(衣服邊的)流蘇，並說繸子含有提醒穿的人遵行律法的意思(參民十五37~41)。GT《啟導本聖經申命記註釋》說「在外衣上作“繸子”，有提醒穿的人常守律法的作用(民十五38～39)，也是民族服裝的一個特色」。STEP 顯示本節的繸子是 ge.di.Lim（H1434，簡要詞典義 ge.dil: tassel），做繸子的位置是 kan.Fot（H3671，本節譯義 [the] corners of）。'
  relation: 本章的重申只剩一句話，沒有再提藍細帶子，繸子的用字也和民數記不同。KC 為這個差別給了理由：申命記講的是應許之地而不是曠野。
