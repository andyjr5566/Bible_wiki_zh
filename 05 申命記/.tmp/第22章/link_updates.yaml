- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: 第10節「不可並用牛、驢耕地」。CT 說「牛是潔淨的牲畜，驢是不潔淨的牲畜(參申十四4~8)，不可同負一軛(參林後六14)。」BH 也說牛按利未記的分類是潔淨的動物（利11:3），驢則是不潔淨的（利11:4）；KC 同樣寫 An ox is a clean animal and a donkey is an unclean animal，並據此說信徒不能與不信的人一同為主作工。
  relation: 本章用這組分類解釋一條農事禁令：不是體力配不上，而是潔與不潔不能共軛。
