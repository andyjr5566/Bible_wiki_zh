  path: link_folder/神學/當孝敬父母.md
  summary: '第7節放走母鳥的規定後面接了一句應許：「這樣你就可以享福，日子得以長久。」KC 指出這個附加語與第五誡（申5:16）有同樣的句型，並把它讀成教會裡長輩與晚輩的關係；BH 也說這讓人想起出20:12 對孝敬父母所應許的長壽。STEP 顯示這裡是 Yi.tav（H3190，ya.tav: be good）與 ve.ha.''a.rakh.Ta ya.Mim（H748 a.rakh: to prolong 加 H3117K yom: day）。'
