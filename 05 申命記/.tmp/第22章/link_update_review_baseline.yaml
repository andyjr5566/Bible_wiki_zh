- title: 愛鄰舍與仇敵
  path: link_folder/主題/愛鄰舍與仇敵.md
  definition: 出二十三4-5 與第9節把愛的對象推到兩端：一端是仇敵（要牽回他失迷的牲畜、要幫他抬開重馱），另一端是寄居的（不可欺壓）。GT《聖經精讀本》為前者下了判語：「這種對仇敵的愛體現了摩西律法與外邦人的法律不同，具有神性起源。『愛仇敵』不是新約的教訓，在舊約早已有此教訓。」
  development: CT 把這種情感的轉移點了出來：「有話說：『惡憎及笠，愛屋及烏』；意思是說，人愛惡的情感，總是跟有關的主體連在一起。這種情感的轉移，實在全沒有道理。神的教導，剛好相反。」KC
    也說幫助仇敵同樣是好心腸的證據，而漠不關心不配作被召去彰顯神是誰的人。
