- title: 引誘處女的律例
  path: link_folder/事件/引誘處女的律例.md
  definition: 出二十二16-17：人若引誘沒有受聘的處女與她行淫，「他總要交出聘禮，娶她為妻」；女子的父親若決不肯將女子給他，「他就要按處女的聘禮，交出錢來」。CT
