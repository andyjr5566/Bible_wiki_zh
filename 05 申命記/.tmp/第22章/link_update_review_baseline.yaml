- title: 分別為聖
  path: link_folder/神學/分別為聖.md
  definition: 出埃及記 第13章 2節「以色列中凡頭生的，無論是人是牲畜，都是我的，要分別為聖歸我」——「分別為聖」原文 qadash，意為分離出來歸給神，使之聖潔、專屬於神。此詞在出埃及記中首次出現於此，承續逾越節（第12章）耶和華擊殺埃及頭生卻保全以色列頭生的救贖事件。頭生的分別為聖不是行為自潔，而是因神救贖的行動而歸屬神。
