- title: 衣服邊的繸子與藍細帶子
  path: link_folder/文化/衣服邊的繸子與藍細帶子.md
  definition: '民數記15:37-41 的規定：以色列人要世世代代在衣服邊上做繸子，並在底邊的繸子上釘一根藍細帶子。


    第38-39節的原文是：「你吩咐以色列人，叫他們世世代代在衣服邊上做繸子，又在底邊的繸子上釘一根藍細帶子。你們佩帶這繸子，好叫你們看見就記念遵行耶和華一切的命令」。


    STEP 原文資料可確認這幾個字：繸子是 צִיצִת（tzi.Tzit，H6734，tassel），「衣服邊」是 כָּנָף（ka.Naf，H3671，本義
    wing，指衣角），藍細帶子是 פְּתִיל תְּכֵלֶת（pe.Til te.Khe.let，H6616 cord＋H8504 blue）。BH 也用同一組詞，並說明藍色染料可能取自骨螺（Murex
    snail）。


    GT《舊約聖經背景註釋》指出這種染料「極為昂貴」，並劃出一條界線：「繸子是象徵性的，為鼓勵良好的行為而設」，不是護身符，「沒有驅除危險或試探的功用」。'
