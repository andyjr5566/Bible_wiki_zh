- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 第1、3、5節三次點名摩西：他在約但河東的曠野向以色列眾人說話、照耶和華所吩咐的都曉諭他們、在摩押地講律法。第9-12節他回憶自己說過「管理你們的重任，我獨自擔當不起」；第37節神對他說「你必不得進入那地」。
  relation: 本章是摩西臨終前一個多月的講話開場。CT：「就是摩西死前大約一個月。」他在這裡同時是三種身分——轉述神吩咐的人、當年設立官長的人、以及被判不得過河的人。
