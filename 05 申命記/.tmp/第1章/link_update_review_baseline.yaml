- title: 以實各谷的一掛葡萄
  path: link_folder/主題/以實各谷的一掛葡萄.md
  definition: '第23節：探子在以實各谷砍下葡萄樹的一枝，上頭一掛葡萄要兩個人用杠抬著，另外帶了石榴和無花果。第24節說明地名的由來——GT《民數記串珠聖經註釋》：「『以實各』：原文即『一掛』。」


    **那一掛有多大？各家給的數字不同。** GT 丁良才：「以實各谷在希伯侖以北，這谷中所產的葡萄，很是出名，有的大如紅棗，一掛約有十斤重。」GT《聖經精讀本》給的是現代的參照：「現在在巴勒斯坦有重4-5公斤的一掛葡萄。」


    **為什麼要兩個人抬？兩種讀法。** GT 丁良才認為不是因為重：「並不是因為一個人拿不動，乃是要保護那葡萄不受損傷。」CT 的讀法相反：「一掛葡萄需要『兩個人用杠抬著』，表示那地所產葡萄巨大沉重，非同尋常。」KC
    走第三條路，從象徵讀：「那一掛葡萄說到喜樂。喜樂是相交的結果……凡與人一同投入屬天福分的人——抬那一掛需要兩個人——必然歡喜。」


    **地名還有另一個來源。** GT 丁良才提出一個常被略過的可能：「有人以為這谷的名字，是因早先與亞伯蘭聯盟的以實各而起的（創十四13）；在此處所記的事，不過是給這谷又加了一個新意思。」


    **位置沒有確據。** GT《舊約聖經背景註釋》：「這地區有很多乾河，因此不可能肯定本節所指的是哪個地方。今日希伯崙附近的拉默特安萊以葡萄著稱，附近亦有一條乾河。」'
