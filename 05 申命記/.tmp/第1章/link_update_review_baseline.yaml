entries:
- title: 摩西
  path: link_folder/人物/摩西.md
  definition: 摩西是利未人暗蘭與約基別之子、米利暗與亞倫的弟弟，也是神後來呼召帶領以色列人出埃及、領受律法的僕人。出埃及記2章記述他在殺嬰令下蒙保全，被法老女兒收養，在埃及王宮長大；他認同受苦的希伯來同胞，卻因殺死埃及人而逃到米甸，在那裡成家並接受曠野生活的預備。
  development: '摩西的軌跡橫跨四卷書，是一條從「拒絕」到「中保」、再到「被超越的預表」的線。CT 把他在出埃及記裡的轉折分成三段：首四十年「自以為我能」（徒7:22），次四十年在何烈山前才承認「我不能」（出4:10），末四十年在曠野裡「認識神能」（申3:24）——出2-4章記的正是第一段到第二段的斷點。KC
    從出4:13 讀出這個斷點的性質：「那已經不能算是異議而是拒絕——拒絕不是謙卑」，神的回應不是移除他的軟弱，而是以同在與話語賦權他。從出7章他「照樣行了」開始，摩西的角色定型為中保：出17、32
    兩次代求（來源屢次讀出這是主耶穌代求職分的預表，來7:25），出19、24 成為約的傳達者與立約者（KC：摩西為使徒、亞倫為大祭司，二人一同預表基督，來3:1），出34
    領受神性情的宣告後下山，面皮發光而不自知——GT《丁道爾》說這與施洗約翰、保羅一樣不自知其超卓，正是真屬靈偉人的記號（民12:3）。到利未記，他的角色收窄成純粹的傳達者：利8章他還以「過渡期祭司」身分代行獻祭，利9章起祭司職分正式移交亞倫，此後利未記全書、直到民數記，都是「耶和華對摩西說」的授命模式反覆出現——CT
    指出這樣的模式在民數記裡至少記載了八十次以上。這條軌跡最後在出40章、被希伯來書明確定位為一個被超越的預表：摩西是神家中忠心的僕人（來3:5），基督卻是「治理神家的兒子」（來3:6）——KC
    說，摩西是主耶穌的圖畫，而主耶穌比摩西更大。



    ### 民數記後半：從中保到被判出局


    民數記16-20 這一段，摩西的中保角色被推到極處，也在同一段裡斷掉。可拉黨叛變時他與亞倫俯伏在地為全會眾求情（民16:22），瘟疫發作後又打發亞倫拿香爐跑進會眾中止住災殃（民16:47-48）；民17
    十二根杖的試驗、民18 祭司與利未人職分的重申，都是由他接令傳達。


    轉折在民20。神吩咐他向磐石說話，他卻斥責百姓為背叛的人、舉手用杖擊打磐石兩下，神因此宣告：「因為你們不信我，不在以色列人眼前尊我為聖，所以你們必不得領這會眾進我所賜給他們的地去。」CT
    的〔話中之光〕指出這次失敗的性質不在脾氣本身，而在它牽連了神：「摩西那一次的發脾氣影響到神的自己，把神也拖在裏面，叫以色列人分不清，以為流出水來給我們喝的是神，發脾氣罵我們的也是神。」GT《聖經精讀本──民數記註解》的判語更短：「他把自己的感情高舉在神公義的審判和神的話語之上,這就是摩西的過失。」


    值得注意的是這一章同時記下他的另一面。KC 把他在民20 遭遇的五件事列成一串——姊姊米利暗的死、百姓的暴動、自己的失敗與懲罰、以東的拒絕、哥哥亞倫的死——而他在這一連串打擊之後仍然照耶和華所吩咐的行（民20:27），親手為哥哥脫下聖衣。從出2
    的「自以為我能」到民20 的失去資格，這條線的收束並不是失敗，而是一個仍然順服、卻不能進去的僕人。'
- title: 約但河
  path: link_folder/地點/約但河.md
  definition: 約但河在聖經敘事裡反覆作為一條界線。CT 給「約但」的原文字義是「落下者，水地」（創13）與「下降」（民26）。創13:10 羅得舉目看見約但河的全平原，那地「如同耶和華的園子，也像埃及地」，他就選了它；創32:10
    雅各在河東禱告，回顧「我先前只拿著我的杖過這約但河，如今我卻成了兩隊了」；民數記則一再以「約但河東」標定以色列進迦南以前的位置——BH 說約但河是曠野與應許之地之間的界線，以色列人靠近它就意味著他們即將從漂流者變成定居者。
  development: '### 創32：全章只提一次，卻是禱告的樞紐


    創32:10：「我先前只拿著我的杖過這約但河，如今我卻成了兩隊了。」約但河在創32 只此一處出現，卻是整篇禱告的樞紐。


    GT 丁良才《創世紀註釋》註出兩件事：其一，雅各過約旦河往拉班那裡去的時候手中只拿一根杖，回來時他的家眷卻有了兩隊；其二，「這約旦河」——約旦河離雅各當時說話的地方不遠。第二點解釋了為什麼他用「這」：那條河就在視線可及之處，禱告時他指得到。


    ### 創32：「只拿著我的杖」


    CT 註：「只拿著我的杖」表示他那時身無分文，僅有的是他手中的拐杖。GT《聖經精讀本──創世記註解》補上一層：這是雅各的告白，訴說自己曾經身無分文、驚慌逃亡的處境——而「這根杖，成為神引導和保護的杖」。


    BH 把這一節接到更廣的正典脈絡：約但河在聖經歷史中是一個標記過渡與新開始的地理座標，後來以色列人正是過這條河進入應許之地（書三14-17）。雅各在此提起它，等於在數算自己人生的兩端。


    ### 創32：「兩隊」在十節之內出現三次


    創32:1-2 雅各看見神的軍兵，給那地方起名瑪哈念（二軍兵）；創32:7 他把人口與牲畜「分做兩隊」自保；創32:10 他在禱告中說自己「成了兩隊」。


    KC 指出第10節這句是在暗指第1-2節他所見的兩隊天使——他把家業的擴增歸榮耀給神。CT 則注意到第7節那一次的性質相反：剛看見神的兩隊軍兵，肉眼不再看見天使就懼怕起來，於是用自己的兩隊來自保。


    同一個詞在十節之內出現三次，分別屬於神、屬於他的恐懼、屬於他的感恩。


    ### 創32：一句禱告裡的謙卑


    第10節的上半句是「你向僕人所施的一切慈愛和誠實，我一點也不配得」。CT 註「慈愛」指神心的表現、「誠實」指神作事法則的彰顯。GT《聖經精讀本──創世記註解》另指出「誠實指對某件事的行為，不是指認識層面」——原本狡詐的雅各，經過二十年的生活親身體驗到神的誠實。


    KC 認為這一節是整篇禱告最美的部分：他在其中承認神在他一生中的恩惠與信實，離開時是孤身一人，如今富足到成了兩隊（見[[雅各禱告的榜樣]]）。


    ### 創33：它沒有被指名，卻是那條分界


    創33 沒有一節提到約但河，但第17至18節的移動跨過了它：CT 指出疏割在約但河以東，而雅各「可能在疏割住了一段日子，然後才渡過約但河來到迦南地的示劍」；GT《串珠聖經註釋》措辭相同——「他在疏割住了一段日子，便渡過約但河遷徙至迦南地的示劍」。


    第18節說他「平平安安地到了迦南地的示劍城」——「迦南地」這三個字標出了河的另一邊。渡河與進迦南在創33 是同一個動作。


    ### 兩次過河


    雅各一生有兩次值得對讀的過河記載。創32:10 是二十年前逃亡時的過河，往東；創33:18 是歸回時的過河，往西。GT 丁良才在創32:10 註「這約旦河」時說，約旦河離雅各當時說話的地方不遠——也就是說，他在河的東岸禱告，回顧的正是同一條河。


    一根杖過去，兩隊回來——這是創33「平平安安地到了迦南地」那句話真正的重量所在。


    ### 創33：河東的停留


    值得留意的是雅各並沒有立刻過河。第17節他先在河東的疏割蓋房搭棚，CT 推算他「可能在疏割住了不少年」，GT《創世記雷氏研讀本》給的數字是「可能在疏割停留了十年才前往示劍去」。


    換句話說，從第16節與以掃分手到第18節進入迦南，中間隔著十年和一條河。經文用兩節寫完，讀時容易當成連續的動作（見[[疏割居住是否屬靈倒退]]）。'
- title: 何烈山
  path: link_folder/地點/何烈山.md
  definition: 何烈山是摩西牧羊時遇見燃燒荊棘、蒙神呼召的「神的山」，後來又成為以色列出埃及後事奉神、領受盟約啟示的地方。何烈常與西奈作同一山區或同一山的不同名稱理解；其確切現代位置有不同傳統與研究方案。
  development: 'CT 說「神的山是後來的稱呼，取這名起因於神在這山上召見摩西並降律法」（3:12；19:1-2、11）；GT《舊約背景註釋》給的理由相同而說得更嚴：摩西「把它描述為神的山，最有可能是他意識到以後幾章所發生的事件，使這山得到了新的地位；不是因為這裡發生過什麼事，或有什麼迷信的理由」，同段並補上時代背景——「古代世界和古典時代的人，相信山是神明居住的所在」。GT
    丁良才則記下神在這山上三次向人顯現：向摩西、向以色列人（18:5）、向以利亞（過了幾百年，王上19:8）。


    聖地的性質，GT《啟導本聖經腳註》寫得最直接：「『聖地』並非天生，而是因為有神在那裡；人同樣要奉獻自己為神所用，有神同在，才成為聖徒。」


    它與西乃山的關係，各家有三說。GT《聖經精讀本》列出：「①兩座山名稱雖異，其實是一座山；②一座山上的兩座峰，一個叫何烈一個叫西乃；③山的總稱叫何烈，特別把當中部分叫作西乃」，並說從地理位置上兩座山不能嚴格地分區；今天人們推測它是西乃半島最南端、海拔2,291米的耶別姆沙（Jebel
    Musa，摩西的山）。GT 丁良才記後兩說。GT《中文聖經註釋》指出兩個名字的字義正好相反——何烈是「不毛之地」或「乾旱之地」，西乃是「叢林密佈」——因此「這神的山究竟在何處……使我們困惑。但有一點是可以確定的，這神的山必然是在西乃半島之內」；GT《串珠聖經註釋》同說「其確實位置不詳」。'
- title: 西珥山
  path: link_folder/地點/西珥山.md
  definition: 西珥山是死海南方至東南方的山區。創世記十四章稱它為「何利人的西珥山」，表明何利人早期居住於此；後來以掃住在西珥山，以掃的後裔以東人也以此地為中心，因此西珥山與[[以東]]密切相關，但山區名稱與國族、國土名稱仍各有側重。
  development: 西珥山的歷史呈現土地居民的更替：創世記十四章時是何利人的山地，至族長時期後段則成為以掃及其後裔的居所，並逐漸與以東的地域身分相連。
- title: 加低斯
  path: link_folder/地點/加低斯.md
  definition: 加低斯（Kadesh），全名加低斯巴尼亞，即創世記十四章的[[安密巴]]（意為「審判的泉」）。位於南地，是以色列人出埃及後最重要的曠野駐紮地，也是探子出發窺探迦南的地方。
  development: '### 背景註釋給的定位


    GT《舊約背景註釋》〈創二十1 加低斯和書珥〉把加低斯定為**西乃半島東北部的一個綠洲，在別是巴以南46哩**。創20:1 描述亞伯拉罕往南來到加低斯和書珥之間的直線上——這條線標出了他這次南遷所抵達的範圍：仍在迦南南緣，但已靠近埃及方向的邊界地帶。


    CT 給的原文字義是「聖，分開」，並以此發展出靈意：信徒必須背向世界（書珥＝牆）、過分別為聖（加低斯）的生活，不可走中間路線。這是靈意解讀，與地理資料屬不同層次。


    ### 同一地名在正典後續的份量


    加低斯（加低斯巴尼亞）在後來的敘事中遠比本章重要：以色列人出埃及後在此駐紮，十二探子由此出發窺探迦南並帶回報告（民13:26），會眾在此背逆而被判在曠野飄流。創20:1
    只是把它當作一個方位座標；它日後成為以色列曠野歷史的樞紐。丁良才在本節下即註明可參民13:26。'
- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  definition: 亞摩利人（Amorites），古代迦南地的重要民族之一，常作為迦南諸族的統稱。「亞摩利」意為「高處之人」或「西方人」。在創世記十四章中，亞摩利人指的是希伯崙一帶的部族，[[幔利]]、[[以實各]]、[[亞乃]]即為亞摩利人的首領。
  development: ''
- title: 希實本
  path: link_folder/地點/希實本.md
  definition: '希實本在民數記32 出現兩次：第3節是兩支派開口點名要的九座城之一，第37節說流便子孫建造了它。


    **它先前是誰的。** CT 一句話交代：「『希實本』原屬亞摩利王西宏的都城」。CT 給的名字字義是「堡壘」。


    GT《舊約背景註釋》給了位置，也留下一個沒解決的考古問題：「希實本（＝黑什班）是在馬達巴平原的西北角（尼波山東北三哩），它雖稱為 * 亞摩利王西宏的首都，卻沒有考古證據證明主前一二○○年之前有人在此長期居住」。


    GT 丁良才《民數記註釋》追了它後來的歸屬變化：「代上六81節說，希實本屬迦得支派，這是因為二支派暫時的居處混雜。希實本先前是那一代的京城，或者被迦得流便二支派同占了，後來本節的城邑都被摩押人恢復（賽十五4十六8，耶四十八32-33）。」GT《民數記串珠聖經註釋》講的是同一件事的另一半：「現屬流便的希實本，後來轉給迦得。」


    BH 的重點放在它的戰略地位：「希實本的地理位置使它成為貿易與軍事活動的中心樞紐」，並指出先知書裡它一再與摩押的敗亡連在一起。


    **原文層。** STEP 顯示第3節與第37節的「希實本」都是 chesh.Bon（H2809）。'
  development: '希實本在民數記裡出現兩次，兩次的身分完全不同。民21 它是亞摩利王西宏的京城，以色列擊敗西宏後把它連同附近村莊都佔了；到了本章，它已經是流便子孫動手重建的自家城邑。


    GT 丁良才與 GT 串珠都指出它後來還會再換手：從流便轉給迦得，最終被摩押人取回。'
- title: 以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）
  path: link_folder/互文/以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）.md
  definition: 民數記 21:21-31 記載以色列求經過西宏地被拒、在雅雜交戰、擊殺西宏並佔領希實本等地。此事在申命記 2:24-37、3:1-7 作為摩西回顧歷史的見證重述，強調神將西宏交在以色列手中；詩篇
    135:10-12、136:17-22 則將擊殺西宏列入「大能作為」，配合「因他的慈愛永遠長存」的副歌，成為以色列敬拜中紀念神信實的固定素材。
  development: 從歷史記載 → 律法書回顧 → 詩篇敬拜詠唱，形成多層次的神學傳承鏈。
- title: 巴珊
  path: link_folder/地點/巴珊.md
  definition: '民數記21:33：「以色列人轉回，向巴珊去。巴珊王噩和他的眾民都出來，在以得來與他們交戰。」這是以色列人在約但河東最北的一場仗。


    **它在哪裡。** CT 指出巴珊「位於雅博河以北，黑門山以南的高原(即今戈蘭高原)，境內牧草繁茂，盛產牛羊」。GT《啟導本聖經註釋》的說法相同：「巴珊在加利利海東北，為黑門山南面的一大片土地
    （申三8）。」GT《民數記串珠聖經註釋》補上它在版圖上的意義：「加利利海東北一帶地方，北部黑門山是神應許之地的北界（書11:17）。」GT《舊約聖經背景註釋》把四至講得最完整：北界為黑門山、東界為得如瑟山、西臨加利利海，「巴珊是個廣大、富庶的高原，以牧草著稱（詩二十二12；摩四1～3）」。


    **打下它意味著什麼。** GT《民數記串珠聖經註釋》把本章的三場仗連起來看：以色列人的腳蹤由南部邊境跨越約但河東高原，由南至北到達北部的邊界，繞行迦南地一周，「無論是南部何珥瑪戰役、東部亞摩利人之役及北部巴珊之役均節節獲勝，神大能的引導逐步實現祂的應許」。


    **以得來這座城很不尋常。** GT 丁良才《民數記註釋》記下一個少見的細節：這城是巴珊王的一座大城，「在這城底下，另有一座很稀奇的城，是在石頭中鑿成的，無非是一所避難的保障」。GT《舊約聖經背景註釋》指出以得來就是今日敘利亞的戴爾阿，雖然從未有考古學者進行挖掘，卻曾在埃及和烏加列的古籍當中提及。'
  development: ''
- title: 以色列戰勝巴珊王噩互文（申3：1-11；詩135：10-12；136：17-22）
  path: link_folder/互文/以色列戰勝巴珊王噩互文（申3：1-11；詩135：10-12；136：17-22）.md
  definition: 民數記 21:33-35 記載以色列轉向巴珊，噩王在以得來交戰被擊殺，連同眾子、眾民無一倖免，以色列得其地。申命記 3:1-11 詳細補充噩的鐵床尺寸，強調他是利乏音人餘民，神將這「巨人之王」也交付以色列；詩篇
    135:10-12、136:17-22 將擊殺噩與西宏並列，作為神擊殺「大君王、有名君王」的雙重見證，同樣嵌入「慈愛永遠長存」的敬拜脈絡。
  development: 從戰場報捷 → 律法書強調巨人之王的敗落 → 詩篇雙王並列讚美，凸顯神超越人力強權的主權。
- title: 摩押地
  path: link_folder/地點/摩押地.md
  definition: 摩押地是創世記36章以東王哈達擊敗米甸人的戰場背景之一。此處不展開摩押全史，只記其在本章以東王事蹟中的地理功能。
  development: 摩押地在本章呈現為以東王軍事活動的地理舞台。
- title: 南地
  path: link_folder/地點/南地.md
  definition: 原文意為「南，乾燥，乾旱之地」。位於別是巴以南的荒蕪旱地。亞伯蘭從埃及返回後住在南地。
  development: '### 一條反覆出現的南下路線


    「南地」（Negev）在創世記多次作為族長遷徙的方向標記：亞伯蘭因饑荒下埃及前後都經過南地（創12:9；13:1、3），創20:1 亞伯拉罕又「從那裡向南地遷去」。CT
    對這個方向給了一句提醒：南地靠近埃及，換句話說是**逐漸靠近埃及地**——在創世記的敘事邏輯裡，往南移動通常意味著離應許之地的核心愈來愈遠。


    KC 讀創20:1 時作了同樣的連結：亞伯拉罕離開住了將近二十年的幔利往南走，令人想起創12 章他同樣南行、最後進了埃及；這一次他沒有走那麼遠，停在基拉耳這個邊界地帶。KC
    的評語是：那時不是信心的路，這時也不是。


    ### 地理條件


    BH 描述南地是古迦南南部的沙漠地區，氣候乾旱、植被稀疏，族長（亞伯拉罕、以撒、雅各）都曾在此遷徙居住；其嚴苛環境使人必須倚靠神的供應。CT 給的原文字義是「南，乾燥，乾旱之地」，位於別是巴以南。'
- title: 迦南人
  path: link_folder/人物/迦南人.md
  definition: 迦南人為迦南地原住民族總稱（創10:15-19），含西頓人、赫人、耶布斯人、亞摩利人、革迦撒人、希未人、亞基人、西尼人、亞瓦底人、洗馬利人、哈馬人等。「迦南」意為「紫紅色之地」，因盛產紫紅染料。神命以色列盡滅迦南七族（申7:1-2），因其罪孽滿盈（創15:16）、習俗可憎（利18:24-30）。
  development: '- 迦南人代表「世界體系」：偶像崇拜、道德敗壞、暴力殘害（利18:24-30）

    - 亞摩利人罪孽「還沒有滿盈」（創15:16），神寬容有時限

    - 聖約族群在應許之地生存，非靠軍事外交，單靠神主權保守（創35:5；出23:27-30）'
- title: 亞伯拉罕
  path: link_folder/人物/亞伯拉罕.md
  definition: 聖經中信心之父，原名亞伯蘭，神將其名改為亞伯拉罕（創17:5），意為「多國之父」。神與他立約（亞伯拉罕之約），應許賜給他迦南地、使後裔極多、並在其中萬國因他得福（創12:1-3;
    15; 17）。
  development: '### 創21：順從、憂愁、與外邦人和睦


    創世記二十一章把亞伯拉罕放在三種處境裡，各家的著眼點不同，合起來剛好是一個人的三個面向。


    **憂愁不是不順從。** 第11節說他「因他兒子的緣故很憂愁」（CT 註「憂愁」的原文字義是「不以為然，沮喪」）。GT《聖經精讀本──創世記註解》給了兩個具體理由：一是按哈蘭當地的風俗，不能隨便驅逐給主人生過孩子的女僕；二是他對曾經以為就是立約之子的以實瑪利（創十七18）本有父愛。GT《啟導本聖經創世記註釋》與《串珠聖經註釋》都指出撒拉的要求違反了當時的法律。第14節「清早起來」隨即接上——CT
    說這表示他對神的話立即順從。憂愁與順從在同一段裡並存。


    **和睦不是妥協。** 精讀本在第24節稱他為「和平之子」（比照創十三9），說他從福音的精神出發欣然答應了亞比米勒的友好提議，並由此推出一句：真正的信仰人格不是排斥他人或獨善其身。但同一段裡他也沒有放棄權利——第25節他為被霸佔的水井指責亞比米勒。精讀本指出這是必要的次序：井是巴勒斯坦南部沙漠地帶遊牧民生存的必備條件、也是最大的財產，霸佔井水的行為常常成為戰爭的導火線，因此在締結友好同盟之前，必須先解決這個問題。


    **認識加深了一層。** 精讀本追蹤他對神的稱呼：最初稱耶和華為「至高的神」（創十四22），立割禮之約時已認得他是「全能的神」（創十七1），到本章第33節稱他為「耶和華永生神」——「告白神是與人立約並成就其約的神」（見[[耶和華永生神]]）。


    不過 KC 在同一段裡看見一根刺：亞比米勒要求他起誓不欺負自己與子孫（23節），這個要求本身就等於讓亞伯拉罕痛切地想起前一章的失敗。承認與提醒同時到來。


    ### 創22：他這一次沒有講價


    創世記十八章他為所多瑪與神反覆討價，一路從五十人講到十人；創二十二章神要他獻上以撒，他一句話也沒有回。CT 把這個對比說成他的難能可貴之處：對於神的要求，「亞伯拉罕並沒有表示質疑或據理力爭，反而定意默默地遵行」，並列出五項他沒有做的事——不與神理論、不為自己辯護、不為以撒求情、不與撒拉商量、清早起來立即行動。


    沉默不等於平靜。GT《聖經精讀本──創世記註解》明說：若以為他是以喜悅的心接受這道命令，「這是無視父愛、無人情味的解釋」；那一夜他很可能整夜不眠，心裡至少有三重矛盾（見[[清早起來]]）。經文只記他清早起來，沒有記這一夜。


    **他心裡在想什麼，只有新約說了。** KC 指出希伯來書十一章列舉的是舊約信徒憑信心所行的事，唯獨對亞伯拉罕記下他所想的——「他以為神還能叫人從死裡復活」（來十一19）；而他在自己的環境裡並沒有任何先例可以據以相信這件事。這個判斷在敘事裡留下兩處痕跡：對僕人說「我與童子往那裡去拜一拜，就回到你們這裡來」（5節），對以撒說「神必自己預備作燔祭的羊羔」（8節）。CT
    說前一句「應是憑信說話，而非誆言」；丁良才說後一句是他「不知不覺說了預言」（約一29）。


    **這是最後一次面對面。** GT 丁良才《創世紀註釋》在第16-18節下留了一句觀察：神在此指著自己起誓，而以色列人一切的好處都是藉著這誓來的（創二十四7、二十六3、五十24；出十三5；路一73；徒七17）；他接著補上一句——「亞伯拉罕雖然仍活了五十多年，聖書沒有記載神再顯現於他。」本章因此不只是他信心的高峰，也是他與神面對面往來的最後一次記載（見[[指著自己起誓]]）。


    ### 一個名字，四卷書共用的立約根基


    亞伯拉罕本人的故事在創世記結束，但「亞伯拉罕的神」這個稱呼卻在後面三卷書反覆出現，是神信實的憑據。出2:24 神聽見以色列人的哀聲，「記念祂與亞伯拉罕、以撒、雅各所立的約」；出3、4章神向摩西自稱亞伯拉罕的神，CT
    指出這個組合有三層意思——以色列眾先祖的神、活人的神（太22:32）、守約的神；出6章神更把「全能的神」（伊勒沙代）與「耶和華」分工——GT《舊約背景註釋》說前者是族長在世時就實現的那部分約，後者是長遠的應許，尤其是土地。出32章金牛犢事件後，摩西的代求正是回到這個名字：「求你記念你的僕人亞伯拉罕、以撒、以色列。你曾指著自己起誓說……」（v13）——亞伯拉罕之約成了摩西攔阻神烈怒最有力的根據。利26:42
    神應許被擄後仍要「記念我與雅各所立的約，與以撒所立的約，與亞伯拉罕所立的約」——四卷書、四百多年，同一句起誓沒有失效。'
- title: 以撒
  path: link_folder/人物/以撒.md
  definition: 以撒（Isaac），亞伯拉罕與撒拉所生之子，名字意為「喜笑」。他是應許之子，豫表基督。亞伯拉罕一百歲時生子以撒，應驗了神在創世記十五和十七章的應許。
  development: '### 為什麼要等這麼久


    GT《聖經精讀本──創世記註解》給了兩個理由，都不是為了考驗而考驗：一是等到以實瑪利成長為能夠獨立的年齡，二是為了強調以撒的誕生「全然藉著神的能力和護理」（來十一11-12），特意等到亞伯拉罕一百歲、身體已如死軀（羅四19）的時候。它並下了一句可以核對的斷語：「舊約沒有人像以撒一樣經過漫長的等待才出生。」


    年數的算法則要看從哪裡起算。GT《啟導本聖經創世記註釋》從創十二1-3 的呼召算起，得二十五年；精讀本從創十五4 的第一次啟示算起，說「是第一次啟示之後的第13年，到第14年神的約得以成就」。兩者並不衝突，只是起點不同。


    ### 以撒與基督：來源給的兩份對照


    GT 丁良才《創世紀註釋》在創二十一7 把以撒與耶穌的誕生排成五項：都是神所應許的（創十五4、十七16、十八10；路一26-38）；都是在神所定的時候生的（創十七21、十八10、14、二十一2；但九25）；都是在未生以前從神得名的（創十七19、二十一13；路一31；太一21）；都是因顯神跡而生的（創二十一7、十七16-17；羅四19；路一34-35）；都是人所喜悅的（創二十一6；路二10）。


    BH 給的三項比較簡略但方向相同：都是應許之子、都是神跡般的出生、都牽涉重大的獻祭（創二十二；來十一17-19）。精讀本則把預表的重心放在後來那一幕：「他預表基督，以撒的預表性生涯在摩利亞山事件（創二十二2）中一次性被呈獻出來」——換句話說，以撒作為預表，出生只是開端，摩利亞山才是完成。


    精讀本另指出以撒的位置在救贖史上的特殊性：他是「立約後的第一個果子」（林前十五20、23）。


    ### 斷奶：一個轉折被寫成筵席


    第8節的筵席在古代近東是慣例。GT《串珠聖經註釋》把它比作中國人的彌月酒——「當時的人喜歡在嬰孩斷奶那一天（大約三歲）大擺筵席歡宴賓客」；BH 也記斷奶通常在三歲左右，是從嬰兒期進入幼兒期的標誌。


    KC 從這個轉折讀出一層意義：斷奶表示以撒開始獨立，「他不再倚賴母親的食物，而是能夠自己取食」——這也是信徒走向屬靈獨立的圖畫，但 KC 隨即補上一句限定：這種成長不是與別人隔絕的成長，而是出於與主的個人關係，其間別人的幫助仍然十分寶貴（林前十二25）。


    而正是在這一天，衝突爆發了。以撒的成長之日，成了以實瑪利被逐之日。


    ### 創22：他當時幾歲，以及這為什麼要緊


    來源給的估算差距很大，而每一種都會改變第9節的性質。CT 說他「至少已是十來歲的少年人」，因為有力氣擔負燔祭的柴上山（6節），並記下另一說——「有謂以撒此時年約三十多歲，和主耶穌釘死十字架時的年歲相仿」。GT《串珠聖經註釋》引猶太歷史家約瑟夫，說以撒那時已二十五歲；GT
    丁良才《創世紀註釋》按猶太人的傳說也作二十五歲。BH 只說他「可能已是青年」。


    無論取哪一說，各家的推論方向一致：CT 指亞伯拉罕此時已是一百一十多歲的老人，「由此可見，以撒並未掙扎，自甘被老父捆綁」；丁良才說「他若不願意，必能勝過老父親」；串珠說「他若不甘心獻上，可以逃走」。年齡之所以要緊，是因為它決定第9節的「捆綁」是制伏還是同意。


    ### 他問的那一句


    第7節「請看，火與柴都有了，但燔祭的羊羔在哪裡呢？」——GT《聖經精讀本──創世記註解》從這句話推出兩件事：一是通過父親的教育，以撒已經熟悉獻祭規則；二是這是一個帶啟示性的提問。BH
    說這句話同時顯出他的信賴與敘事的張力：羊羔缺席，正把「神必預備」這個主題頂到台前。


    CT 讀出的是另一面：「以撒的問話肯定會叫亞伯拉罕覺得心痛。」GT《創世記雷氏研讀本》則把父子兩邊並提——「以撒對亞伯拉罕的信心和亞伯拉罕對以撒的體恤是很顯著的」。


    此後直到下山，經文再沒有記錄以撒的任何一句話。


    ### 「以撒的神」怎麼被後代使用


    以撒本人的故事在創世記結束於他一百八十歲辭世（創35:28-29），但「以撒的神」這個稱呼卻在後三卷書裡反覆出現。出3、4章神向摩西自稱「亞伯拉罕的神，以撒的神，雅各的神」，CT
    指出這是「守約的神」的標記——祂信守對亞伯拉罕、以撒、雅各個別的應許（給以撒的那一份見創26:3-4）；出6章神更把「全能的神」與「耶和華」分工，GT《舊約背景註釋》說前者是族長在世時就實現的那部分約。出32章金牛犢事件後，摩西的代求正是求神記念「亞伯拉罕、以撒、以色列」與祂所起的誓（v13）；利26:42
    神應許被擄後仍要記念這三代之約。以撒生前只不過是「敬畏神」的那一位（創31:42、53「以撒所敬畏的神」），死後卻成了神向後代子孫證明信實的三個名字之一。'
- title: 雅各
  path: link_folder/人物/雅各.md
  definition: 以撒與利百加的次子，以掃的孿生弟弟。名字意為「抓住腳跟的人」、「詭計者」、「代替者」（創25:26）。日後改名「以色列」（創32:28）。
  development: '### 創27：名字第一次被當作控訴


    第36節以掃說：「他名雅各，豈不是正對嗎？因為他欺騙了我兩次。」CT 註「雅各」的原文字義是「詭詐、篡奪」，GT《創世記雷氏研讀本》說這個名字的意思可以是「騙子」，BH
    則作「抓住腳跟的人」「取代者」。這是全卷第一次有人把這個名字當作指控使用。


    丁良才對這句控訴的公允性有保留：長子名分是以掃自己甘願起誓出賣的（創二五33），並非被強奪。所以以掃的話一半是真的——祝福確實是騙來的；一半不是。


    ### 他與神的距離，從稱呼看得出來


    第20節雅各說「因為耶和華**你的**神使我遇見好機會得著的」。CT 指出這個「你」字表明雅各此時對神缺乏主觀的認識與經歷；GT《啟導本聖經創世記註釋》把這條線索追到底：雅各一直到從哈蘭回來，才稱耶和華為「我的神」（創二八21；三三20）。KC
    從另一角度看同一句：說「你的神」正是以掃會用的口吻，因為以掃與耶和華沒有連結——雅各在扮演哥哥的時候，連神學語彙都換了。


    ### 起點與終點


    KC 把雅各的一生放在兩端之間看：他的歷史「始於欺詐與詭計」，而聖經記下他最後所作的一件事卻是敬拜（來十一21）。丁良才則指出中間那一段的代價：雅各雖騙得祝福，「當時並沒有得著神所應許的福氣；直等到他全然不依靠自己的時候才得著了」（創三三）。


    GT《聖經精讀本──創世記註解》把那二十年讀成必要的過程：使狡詐的雅各成聖、成為真實的以色列，需要時間——如同摩西的四十年曠野、以色列的七十年被擄。


    雅各在聖經中代表「屬靈的生命」（與以掃的「肉體」對比）：

    - 出生在後，得救不在乎人努力

    - 得救出於神揀選（「大的要服事小的」）

    - 喜歡與主交通（安靜）、活在教會中（帳棚）

    - 羨慕屬天福分（長子名分）

    - 肯出代價追求（以餅和紅湯交換）

    - 雖有屬靈渴望，但趁人之危的手段不正當

    - 日後經歷極大磨練，蒙福是靠神的揀選與保守


    ### 他的名字後來成了神信實的代號


    雅各死後，「雅各的神」反倒成了神向摩西自我介紹時最先掛上的稱呼之一——出3、4章神向摩西顯現，自稱「亞伯拉罕的神，以撒的神，雅各的神」（出4:5），CT 指出這是神「信守對三位先祖個別的應許」（給雅各的那一份見創28:13-14）；出33:1
    神重申「我曾起誓應許亞伯拉罕、以撒、雅各……要將迦南地賜給你的後裔」，把雅博渡口那一夜的應許接成離開何烈山、往迦南去的法理根據。CT 說出埃及記開頭幾節「可視為創世記的後書」——雅各家七十口下埃及的族譜（創46）正是出1章的起點；出6章的利未支派族譜也是從「以色列長子流便」順著雅各的兒子排下來的。利26:42
    神應許被擄後「記念我與雅各所立的約，與以撒所立的約，與亞伯拉罕所立的約」——GT 丁良才特別指出這裡的次序是「自下而上」，在聖經別處都是亞伯拉罕在先、雅各在後，唯獨這裡把雅各放在最前面。'
- title: 敬畏神、誠實、恨不義之財
  path: link_folder/神學/敬畏神、誠實、恨不義之財.md
  definition: 出18:21 為要揀選的人開出的條件是：「有才能的人，就是敬畏神、誠實無妄、恨不義之財的人。」原文 חַיִל（H2428）在本節作「能力」，詞義也帶有「力量」的色彩；丁道爾進一步指出此詞可讓人聯想到「有軍人風範」，引申為正直、可靠的品格。KC
    把它列成四項：有才能——判斷力健全而堅定的人；敬畏神——行事出於對神的敬畏，最終要在他們的審判職分上向祂交帳的人；可靠——說真話的人；恨不義之財——不受賄的人。CT
    則按對象分成三類：「對神：敬畏；對人：公正無私；對物：不貪不義之財。」
  development: '**後來的以色列並沒有守住這個標準。** 丁良才列出一整串反例：撒母耳的兒子（撒上8:3），以及眾先知連次所諫責的人（賽1:23；耶5:28；結22:27；彌3:11、7:3）；他並把「恨不義之財」接到申16:19、賽33:15、西3:5。GT《啟導本聖經腳註》把條件整理成四條：敬畏神也就是信靠神、遵行祂的旨意；誠實可靠；恨不義之財；有才能。GT《串珠聖經註釋》抓的是同一個重點：「挑選標準放在道德上，而不在才智或體魄上。」


    **新約的對應。** GT《丁道爾聖經註釋》說「新約對於參與事奉之基督徒的要求，也大同小異」，並舉徒6:3與提前3:1-3為例；KC 則把這四項資格直接應用到教會牧者的事奉上（彼前5:2-3）。'
- title: 葉忒羅建議分層治理
  path: link_folder/事件/葉忒羅建議分層治理.md
  definition: 葉忒羅建議分層治理（出18:17-23）以一句「你這做的不好」開場。CT 把建議的內容分成四項：摩西將百姓重大案件奏告神（v19下）；教導百姓使他們知道律例和法度（v20）；選賢與能，使他們分層負責審理不同程度的案件（v21-22）；將重大案件呈報摩西，由他審理（v22中）。GT《串珠聖經註釋》指出
    v22 才是整段的重心：「摩西衡量做事的標準應是按事情的重要性，而不是視乎事情屬宗教事宜抑民事。」
  development: '**「當行的道」是什麼意思。** GT《丁道爾聖經註釋》從這個詞讀出希伯來人對律法的整個看法：「『道』字對以色列人來說，經常當照字面意義，解釋為曠野經過的旅程。然而本節可能是指其象徵意義……這字可能故意響應上面譯作『法度』之字（to^ra^，『妥拉』）的原意，後者甚至可以譯成『路標』。從這角度看，希伯來人對於律法的概念，便完全沒有難解或令人望而卻步之處了：它是神在生命路途上為人安設的路標。」GT《串珠聖經註釋》同樣主張這裡「應用喻比式去解釋，即指他們生活的道路」。


    **「你為什麼獨自坐著」問的是一個管理學問題。** GT《丁道爾聖經註釋》說：「這是一位年老酋長智慧的詰問，授權下屬是他早已學會的重要課題。大小責任摩西都想一手包辦，無端令得自己心疲力絀，不少基督徒領袖都犯上了同樣毛病。這種行為未必是野心的表現，有時過分的關心和盡責都會使人如此。」它並指出一個常被忽略的後果：「百姓也因此疲憊不堪」，而「類似因素所造成的執法延滯，是後世押沙龍所以成功發動政變的因素之一」（撒下15:1-6）。


    **新約的對應。** GT《丁道爾聖經註釋》說「新約對於參與事奉之基督徒的要求，也大同小異」（徒6:3；提前3:1-3）；KC 則把這四項資格直接應用到教會牧者身上（彼前5:2-3），並接到神親自分派恩賜的原則：「祂把肢體俱各安排在身上，是照自己所喜悅的」（林前12:18），「叫肢體彼此相顧」（林前12:25）——「要緊的是彼此提醒這一點，免得一切事都只由少數幾個人去做。」'
- title: 曠野審判制度
  path: link_folder/背景/曠野審判制度.md
  definition: 曠野審判制度指出18:13-26 所設立的分層司法架構：千夫長、百夫長、五十夫長、十夫長隨時審判百姓，難斷的案件呈到摩西。GT《舊約聖經背景註釋》把它放進古代近東的框架裡：「審判官的『法院』『開庭』時，其座位是權柄的所在。這座位通常設置在城門口。葉忒羅建議摩西設立以摩西為首的等級制司法系統，君主政體下的君王會這樣做，部落社會的祭司或族長亦必如此行。」
  development: '**這制度分開的不是聖俗，是難易。** GT《丁道爾聖經註釋》特別提出這一點以糾正一個常見誤解：「以為本段是將摩西和長老的職責加以區分，一方負責『聖』事，一方負責『民』事，是個誤解；以色列一切司法都是聖事。法律不論怎樣執行，都不會越出獻祭和聖筵的範疇之內。所以本段所劃分的不是聖俗，而是難易：將傳統和啟示已經討論過的，從需要神新鮮話語處理的事務分別開來。」GT《舊約聖經背景註釋》的講法略有不同，它認為這制度確實「將『民事』的案件，從『宗教』的層面中分別出來，而摩西沒有介入前者的必要」——兩家在這一點上並不一致。


    **「審判官」這個頭銜的來歷。** GT《丁道爾聖經註釋》指出本段其實沒有用上這個術語，並補了它的背景：「『審判官』是個源自古代迦南的頭銜和職位（腓尼基人甚至在海外殖民地中，也保存了這頭銜），然而這職位有很重『勇士、領袖』的意味，和司法的關係反而較小；士師記中的士師就是箇中例子。」它並回顧了以色列在此之前的司法狀況：族長時代由族中家長執法；在埃及為奴時不可能有獨立的司法系統，埃及「督工」與以色列「工頭」只是勞工的組織；摩西早年試圖擔起首領和「審判官」的職務卻招來怨恨（出2:14）；此外每個支派仍有自己的首領，司法似乎也是他們的功用之一。


    **埃及的平行。** GT《舊約聖經背景註釋》給了一個具體的對照：「上述制度和埃及沒有很大的分別；法老保證會伸張正義，但仍設立以一位大臣為首的系統，這大臣坐在審判座上，稱為『瑪阿特之先知』（瑪阿特是真實和正義的女神）。」


    **與申命記1章的差異。** GT《中文聖經註釋》注意到申1:9-18 的敘述「與這裏的分配法稍有不同」，並由此推出一條原則：「因時制宜，因事制宜和因地制宜……在行政管理的原則上，甚至於官名與職責，都必須有伸縮性。」GT《啟導本聖經腳註》也把申1章列為同一件事的另一份記載，並指出「以色列人後來建國的典章制度很可能此時已開始成形」。'
- title: 審判官
  path: link_folder/原文/審判官.md
  definition: '出埃及記二十一6「他的主人就要帶他到審判官（或作：神；下同）那裡」。STEP 語言證據顯示，原文使用的詞是 הָאֱלֹהִים（ha-Elohim，H430），字面就是「神」；和合本在正文譯為「審判官」，並在小字保留「或作：神」的直譯。CT
    的原文字義列出「審判官，統治者，神」，文意註解也給出兩種理解：「（1）指神，到神面前發願立誓，永不反悔；（2）指公證人，證明雙方今後的身份關係乃出於甘心樂意，不再改變」；各家註釋進一步討論此處指聖所裁判或神所設立的審判官。


    各家在這裡明顯分歧。GT《中文聖經註釋》主張原文本來就是神：「原文的審判官是神。而這神的原文伊羅興，亦可繙成為其他的神（gods）。因此，原意是帶他到神壇那裏去起誓」。GT《丁道爾聖經註釋》說得更直接：「帶他到神那裡，即帶他到聖所（將『神』譯作『審判官』是解經，不是譯經；和合本作『審判官』）。」GT
    丁良才則走另一條路，認為譯作審判官並無不妥，因為「審判官代表神判斷是非（二十二8-9）」、「審判官是神的代表（參詩八十二1、6，約十34的神字）」。BH 也採人間法庭的讀法，指這裡的「審判官」是受委任的領袖或長老，負責在群體中維持公義與秩序，而他們是神律法的代表。'
  development: 「審判官」與「神」在原文是同一個字，這使以色列的審判制度在語言層面就帶著代表性：判斷是非的權柄不是人自有的，而是受託的。GT 丁良才把二十二8-9
    與本節並讀，正是循這條線索。
- title: 寄居的
  path: link_folder/原文/寄居的.md
  definition: 「寄居的」在出埃及記主要對應希伯來名詞 גֵּר（*ger*，H1616）與 תּוֹשָׁב（*to.shav*，H8453A）。STEP
    顯示 גֵּר 為「外僑／長居異鄉者」（sojourner），而 תּוֹשָׁב 則為「臨時居民／客旅」（resident alien）。GT《丁道爾聖經註釋》指出
    גֵּר 有專門的社會與盟約含意，指長居在以色列社區、受律法保護並可經割禮參與節期的外僑。
  development: '### 從「不可欺負」到「愛他如己」


    這個詞在律法書中的待遇是逐段升高的。出埃及記12章處理的還是資格問題：誰能吃逾越節的羊羔——GT《中文聖經註釋》辨析該章兩個「寄居的」在原文不是同一個字，短暫旅居的不可吃，長居而受割禮的則「像本地人一樣」。


    出埃及記22:21 與23:9 進到保護：不可欺壓寄居的，理由是「因為你們在埃及地作過寄居的」。


    利未記19:33-34 再往上一階。GT 丁良才指出這裡比前面兩處又進一步——從「不可欺負」推到「看他如本地人一樣」，並且「愛他如己」。STEP 顯示利19:34「並要愛他如己」與同章18節「卻要愛人如己」在原文是完全相同的說法，也就是說，寄居的外人與本國的弟兄在這條誡命下是同一個對象。GT《聖經精讀本》點出這條倫理的根據：它是為紀念以色列百姓在埃及地寄居為奴的生活而設的慈愛法規。


    丁良才並注意到這條例的實際效果——因為有這樣的規定，就有許多外人到迦南去居住。'
- title: 申1：17
  path: link_folder/互文/申1：17.md
  definition: 申1:17與出埃及記第二十三章的關聯：審判不可看人面，出23:2-3、6、8平行。
  development: 待累積
- title: 古代近東司法制度
  path: link_folder/背景/古代近東司法制度.md
  definition: GT《舊約聖經背景註釋》說明本章這一段律例的社會功能：「官僚若是腐敗，任何司法系統都會發生冤屈之事。為求維持司法程序的公正，本段勸誡審判官公平對待所有的人，不屈枉正直，不收受賄賂；警告見證人不得作假見證，以致無辜者被判有罪；又提醒全體以色列人他們有責任幫鄰舍，並且以慇懃公正對待外僑。」
  development: 周邊文獻同樣以保護弱者為統治者的職責。GT《舊約聖經背景註釋》舉出兩例：埃及《阿曼尼摩比的教訓》「勸誡人不可向窮人偷竊，欺騙殘廢人，或侵占寡婦的田地」；《善辯之農夫》中的演說「提醒法官說，作孤兒之父、寡婦之夫是他的責任」。以色列這一段的不同在於，它把要求同時放在見證人與審判官身上。
- title: 曠野飄流四十年
  path: link_folder/歷史/曠野飄流四十年.md
  definition: '第33-34節的判決：「你們的兒女必在曠野飄流四十年，擔當你們淫行的罪……按你們窺探那地的四十日，一年頂一日，你們要擔當罪孽四十年。」


    **四十年怎麼算？** CT：「四十年是指從出埃及開始算起，直到進入迦南地」，並說「一年頂一日」的算法「把以前已經在曠野裡所渡的年日也算進去了」。GT《啟導本聖經註釋》給出精確數字：「『四十年』是約數，實際上是三十八年零十個月。」GT
    丁良才也說神「後來卻發了憐憫的心，將以色列人已經在曠野的工夫都算在這四十年之內了」。


    **「一年頂一日」的意義。** GT《民數記串珠聖經註釋》：「強調神對罪惡的嚴厲，正如成語所謂：『一失足成千古恨』。」GT《聖經精讀本》從兩個目的來讀：「①讓百姓們明白自己的罪,也讓他們經歷罪所帶來的悲慘的結果;
    ②為了讓新一代（二十歲以下）的人年齡達到能對神的事負責的成熟年齡。」


    **懲罰的形式正是他們自己說過的話。** 第2節他們說「巴不得我們早死在埃及地，或是死在這曠野」，第28-29節神說「我必要照你們達到我耳中的話待你們。你們的屍首必倒在這曠野」。GT《民數記串珠聖經註釋》指出這句話在本段重複四次（v29、32-33、35）。CT
    在〔話中之光〕：「神用百姓最懼怕的方式懲罰他們，他們害怕死在曠野，神就懲罰他們在曠野飄流直至死去。」


    **KC 用一個詞形容這四十年的性質改變了。** ==「這百姓成了流浪的百姓。他們本是客旅，是往應許之地去的行路人。如今他們是流浪者，在曠野裡漫無目標地遊蕩。」==
    他並指出這四十年不是空白：「神要用那四十年教導他們，他們是誰、祂是誰。」


    **STEP 原文資料**顯示第34節「擔當」是 tis.''U（H5375J，詞典形 na.sa，詞典義 to lift: guilt）——與第18節神「赦免」罪孽的
    no.Se''（H5375I）是同一個動詞。==神舉起他們的罪孽（赦免），他們也要舉起自己的罪孽（擔當）。== 同節「疏遠」是 te.nu.''a.T/i（H8569，詞典義
    opposition），正對得上 CT 所註的「反對」。'
