- title: 迦勒
  path: link_folder/人物/迦勒.md
  definition: '迦勒是猶大支派耶孚尼的兒子（民13:6），十二探子之一，也是十二人中唯一在當場公開反對多數意見的人。


    **名字的意思，各家給的不完全一樣。** CT 的原文字義列出四個方向：「有才能的，勇敢，全心的，猛烈，狗」；GT《聖經精讀本》作「攻擊者」；KC 作「全心的」，並說「他配得這個名字。迦勒把自己毫無保留、完全獻上地交給耶和華和祂的事」。


    **他為什麼一個人出頭？** GT 丁良才給了一個很實際的理由：「大約是迦勒一人出頭說話。因為約書亞既是摩西的幫手，他若說話，百姓必想他有偏心。」


    **他的話在原文是兩重加強語氣。** STEP 原文資料顯示第30節「立刻上去」是 ''a.Loh na.''a.Leh（H5927G，詞典形 a.lah，不定詞絕對式配未完成式），「足能得勝」是
    ya.Khol nu.Khal（H3201，詞典形 ya.khol，同樣的結構）——正對得上 CT 所註的兩個「原文雙同字」。同節「安撫」是 va/i.Ya.has（H2013，詞典形
    ha.sah，詞典義 to silence），Hiphil 形。


    **他的信心不是無視危險。** KC：「迦勒完全清楚別人在講什麼。他沒有把事情說成另一個樣子，也沒有輕看危險。他不是對危險無感，而是一個相信神所說的話的人。這就是分別所在。」CT
    列出他能站得住的三個條件：「(1)有事實依據（迦勒親眼看見那地）；(2)有正確的態度（迦勒信靠神的應許）；(3)有足夠的信心。」'
  development: ''
- title: 專心跟從主與另一個心志
  path: link_folder/神學/專心跟從主與另一個心志.md
  definition: '第24節：「惟獨我的僕人迦勒，因他另有一個心志，專一跟從我，我就把他領進他所去過的那地。」


    **兩個關鍵詞在原文都很具體。** CT 的〔原文字義〕：「『另有一個心志』原文是『另有一個靈』……『專一跟從我』字面的意思是『完全跟在我後面』。」STEP
    原文資料完全對得上：「另有一個心志」是 Ru.ach ''a.Che.ret（H7307G 詞典義 spirit ＋ H312 詞典義 another）；「專一跟從」是
    va/y.ma.Le'' ''a.cha.Ra/i（H4390，詞典形 ma.le，詞典義 to fill ＋ H310A，詞典義 after），字面是「他在我後面填滿了」。GT《聖經精讀本》同樣說：「字面上可以解釋為『完全跟在我後面』。」


    **「另一個靈」指的是什麼？** KC 說得最具體：「迦勒不讓自己的心思被他所看見的影響，而是被耶和華所說的話影響。」BH：「當多數人懼怕、懷疑神的應許時，迦勒的靈以信心、勇氣與對神的信任為特徵。」CT
    在〔話中之光〕拆成三點：「不看艱難、不看自己、專心跟從主。」


    **這句話後來一路跟著迦勒。** KC 列出它在聖經中的再現：民32:12、申1:35-36、書14:8-9、14。GT《啟導本聖經註釋》指出應驗的地方：「看《約書亞記》十四6～15，知道迦勒的後裔的確得著他們的先祖作探子時所看見的希伯侖地，也就是亞衲族人居住的地方。」


    **神為什麼特別提迦勒而不提約書亞？** GT 丁良才的解釋是兩人都在內：「『唯獨我的僕人迦勒』——約書亞（30、38），摩西，亞倫，和一切的利未人也在內。」CT
    的說法相同：「『他』應當包括迦勒和約書亞（參30節）。」'
  development: ''
- title: 摩西不得進入應許之地
  path: link_folder/事件/摩西不得進入應許之地.md
  definition: '民數記27:12-14 正式通知摩西：他可以從亞巴琳山觀看神所賜的地，卻要像亞倫一樣死去，不能帶百姓進入。原因不是年老或接班安排本身，而是米利巴事件中，他和亞倫違背神的命令，沒有在會眾眼前尊神為聖。


    **這段把審判與恩典並列。**


    - 審判：神沒有因摩西長久服事就撤回米利巴的判詞。CT 與 BibleHub 都指出，公開代表神的領袖要為自己在百姓面前的行動負更重責任。

    - 恩典：神仍准他觀看土地，也用「歸到列祖／本民」描述他的死。KingComments 強調摩西聽見自己的終局後沒有苦毒，立刻為會眾求一位合適的牧者；GT
    也把後半章的接班人問題直接接在這項通知之後。

    - 應許：摩西不能進入，神賜地的計畫仍繼續。領袖會更替，神對以色列的應許不因一位領袖離世而中斷。


    STEP 使兩個關鍵動作更清楚。第13節「你必歸到」是 H622 אָסַף（a.saph，聚集）的 Niphal 形 וְ/נֶאֱסַפְתָּ（ve./ne.''e.saf.Ta，Hc/VNq2ms），context
    gloss 是「你將被聚集」；同節提到亞倫「被聚集」也是 H622 的 Niphal。第14節「尊我為聖」是 H6942G לְ/הַקְדִּישֵׁ/נִי（le./hak.di.She./ni，HR/Vhcc/Sp1bs），使役式不定詞附第一人稱單數受詞，context
    gloss 是「把我當作聖」。詞形確認動作，受罰原因則由神在本段親自說明。'
  development: 民數記20章先記米利巴的失敗與「不得領這會眾進地」的判詞；27章在第二次數點後確認摩西將死，並立即安排約書亞；申命記34章則記他從尼波山觀看全地、死在摩押地。三段依次交代原因、交接與實現。
- title: 約書亞
  path: link_folder/人物/約書亞.md
  definition: 約書亞，原名何西阿（民十三16），是嫩的兒子，隸屬以法蓮支派。約書亞在出埃及記第17章首次出現——摩西命他選出人來與亞瑪力人爭戰（v9），他照辦並用刀殺害亞瑪力王及其百姓（v13）。約書亞為摩西長期的幫手與未來的繼任領袖，日後帶領以色列人進入迦南地。KC
    等釋經學者指出，「約書亞」為希伯來名字，字義為「耶和華是拯救」或「拯救」，在希臘文中與「耶穌」相通；在表徵與預表神學上，約書亞象徵在屬靈引導下戰勝肉體阻礙並進入應許安息的歷程。
  development: 約書亞在出24:13作為摩西的助手隨摩西上神的山，出33:11記載他不離開會幕。丁良才指出他「同十一個探子窺探了迦南；唯獨他和迦勒忠心報告」（民14:1-9），「神後來也揀選他做以色列人的首領」（民27:18-23）；GT《啟導本聖經腳註》補上結局：「摩西死前將領導以色列人進迦南地的責任交給了約書亞」（書1:1-2）。GT《中文聖經註釋》指出摩西曾按手在他頭上（申34:9），「要藉他領以色列人進入迦南」（申1:38）。GT《聖經精讀本》對他在本章的形象下了判斷：從摩西把選兵與戰爭全權交給他一事可知，「他是一位具有誠實的信仰，而且是英勇無比的出色的領袖」。
- title: 海（紅海）
  path: link_folder/地點/海（紅海）.md
  definition: 出埃及記中的「紅海」，GT《啟導本聖經腳註》指出原文可直譯為「蘆葦海」（賈斯樂郝威給的音譯是 Yam Suph）。它究竟是哪一片水域，各家沒有共識：《啟導本》說古代「紅海」包括印度洋、波斯灣等水域，「以色列人所過的海當非今天的紅海」，並推測可能就是曼薩拉湖（Lake
    Menzaleh）；賈斯樂郝威傾向蘇彝士灣以北，並提到可能是開鑿蘇彝士運河時消失的 Lake Ballah；《舊約聖經背景註釋》按巴力洗分的位置推算最近的湖泊是巴拉湖；出十三另有苦湖（Bitter
    Lakes）一說。無論確切位置為何，第14章的核心事件——神使海水分開、以色列人走乾地過海、埃及全軍覆沒——發生在此。
  development: ''
- title: 得罪神
  path: link_folder/神學/得罪神.md
  definition: 「得罪神」是創世記39:9中約瑟拒絕犯罪的核心理由：「我怎能作這大惡，得罪神呢？」約瑟將通姦不視為單純得罪主人、得罪婦人、得罪社會道德，而是直指核心——犯罪本質上是得罪神（參詩51:4「我向你犯罪，惟獨得罪你」）。
  development: 「得罪神」觀點貫穿聖經：創20:6神攔阻亞比米勒不得罪神；創39:9約瑟怕得罪神；撒下12:13大衛認罪「我得罪了耶和華」；詩51:4「惟獨得罪你」；路15:21浪子「我得罪了天」；林前8:12「得罪弟兄就是得罪基督」。約瑟的敬畏神成為抗拒試探的終極屏障。
- title: 迦南大敗直到何珥瑪
  path: link_folder/歷史/迦南大敗直到何珥瑪.md
  definition: '第45節：「於是亞瑪力人和住在那山上的迦南人都下來擊打他們，把他們殺退了，直到何珥瑪。」


    **「何珥瑪」是一個雙關語。** CT：「『何珥瑪』是雙關語，原本是可以得到『庇護』的地理用詞，現在轉用來成為『完全毀滅』的所在。」GT《舊約聖經背景註釋》：「本節的『何珥瑪』是個雙關語。它在希伯來語的意思是『毀滅』，這正是入侵之以色列人所遭的厄運。」GT《民數記串珠聖經註釋》直接給字義：「『何珥瑪』：意思是『完全毀滅』。」


    **位置各家給的不同。** GT 丁良才：「何珥瑪在加低斯北，約有六十裡路……原名是洗法（士一17）。」GT《民數記串珠聖經註釋》：「位於別是巴東面六點三公裡（十英里）。」GT《舊約聖經背景註釋》：「指別是巴以東七哩半的地點，暫時考證為馬索斯遺址。」三份來源的距離與方位並不一致。


    **這場敗仗的範圍。** GT 丁良才從經文推出追擊的界線：「本節既說亞瑪力人殺退以色列人，直到何珥瑪，就顯明他們過了何珥瑪向南，就沒有再追趕以色列人。」


    **這是誰的失敗，來源說法一致。** CT：「意指他們在上山途中遭受敵人的阻擊。」KC：「基督徒若想憑自己的力量取用神的東西，就必成為仇敵手下的獵物。這正是我們在以色列人所作的事上看見的。」GT《聖經精讀本》從神的主權讀：「亞瑪力人是神不喜悅的民族,卻成了神剿滅以色列的工具。」BH
    也說這場攻擊「是以色列不順服與缺乏信心的直接後果」。'
  development: ''
- title: 宗主條約
  path: link_folder/背景/宗主條約.md
  definition: 宗主條約是古代近東國際關係中的一種條約形式，由大君王（宗主）與藩屬國簽訂。條約通常包含：宗主自我宣告身份、描述為藩屬所作的事、保證保護他們、要求藩屬專一效忠、列出必須履行的義務，並附加祝福和咒詛。十誡的文學結構與宗主條約高度相似——神作為大君王宣告身份和救贖作為，要求以色列專一效忠，列出誡命義務。
  development: '三章累積下來，宗主條約的各個部件在五經裡剛好湊齊了一整份。


    出埃及記第19章對應的是條約的開頭。GT《啟導本聖經腳註》把對應關係逐項列出：「此約的文字和形式很象宗主與屬國訂立的條約，有前言（3節），有宣言，說明宗主的高超與仁慈（4節），和屬國的義務與權利。」出埃及記第20章對應的是義務條款，GT《舊約聖經背景註釋》把十誡歸入條約而非法律：「就此而言，定言格式顯示十誡應當歸為盟約一類，不屬法律一類。」


    利未記第26章補上的是最後一段——祝咒條款本身。GT《舊約聖經背景註釋》舉出四份對照文獻：申命記二十八章、漢摩拉比法典（主前十八世紀）、以撒哈頓條約（主前680～669）、以及主前十三世紀埃及法老蘭塞二世和赫人君王哈圖西利斯三世之間的條約，並指出「咒詛照例遠比祝福為多，並且如同本段，其嚴重性逐步遞增」。它同時說明這種條款為什麼存在：「必須引進神明的善意和處分，才能保證法律和條約得到遵守。」利未記第26章有兩個咒詛可以直接對到具體文獻——第19節「天如鐵地如銅」也見於以撒哈頓條約，第29節食人的咒詛則見於主前七世紀的亞述條約。


    借形式不等於借內容，這個保留在三章裡反覆出現。GT《丁道爾聖經註釋》在出埃及記第20章下說得最清楚：「我們當然不是說以色列的律法故意抄襲赫人的宗主條約，只是說兩者都忠於當時普遍的文學和結構的模式。」GT《聖經精讀本》在出埃及記第19章下說得更直接：「約的主導權始終在神的手上，人類只不過是受惠者而已。」'
- title: 伯拉大河
  path: link_folder/地點/伯拉大河.md
  definition: 伯拉大河（Euphrates），即幼發拉底河，是西亞最長的河流之一，流經土耳其、敘利亞、伊拉克。是神應許之地的北界。
  development: '- 創2:14 的希伯來名是 פְּרָת（*pe.rat*，H6578），STEP 將它辨識為幼發拉底河；CT 進一步以「多結果子、甜」解釋名字。伯拉河在舊約又通稱「大河」（啟導本）'
- title: 摩西立首領
  path: link_folder/事件/摩西立首領.md
  definition: 摩西立首領（出18:24-26）是摩西聽從葉忒羅的建議、從以色列人中揀選有才能的人立為千夫長、百夫長、五十夫長、十夫長的事件。CT 把它分成兩步：「第一步，摩西先選賢與能」；「第二步，摩西按所選之人的才能，設立他們擔任各層官員」。GT《中文聖經註釋》給的評語是：「這是智慧人接受智慧勸告的良範。庸碌的人，只顧集權於一身，而成為獨裁者和獨夫，不願分權與分責給他人。」
  development: '**這些人不只是法官。** 丁良才指出「這些官長不但做首領，也做軍長」（民31:14）。GT《中文聖經註釋》從「隨時審判」讀出制度的實際好處：「在分層負責之後，那些行政兼司法的人，就可以隨時隨地處理百姓的紛爭案件，而不必遠道到摩西一人的跟前來，站在他的左右輪候許久才能得到審判的難處了」，並把
    v22 的雙重效果說明白：「不但自己輕省，也使事情易辦，並且促成合作和團結。」


    **「平平安安歸回他們的住處」指的是哪裡。** 丁良才把它讀成迦南；GT《中文聖經註釋》則反對這種讀法，並指出有學者據此主張這段是進迦南以後才有的說法——它的回答是實務性的：「凡對曠野有經驗的人，都知道一大群人無法聚居在一處，必須分開頗遠來支搭帳棚。因此，這句話是指百姓不必遠道來摩西那裏站在其左右輪候判斷，乃可以平平安安的在他們的住處，由下層的官長來處理他們的案件而已。」


    **KC 讀出的預表。** 「在千年國度的治理中，主耶穌會讓別人有分於祂的治理。信徒照著各人忠心的程度，得著管理若干城的權柄」（路19:16-19）。'
