- title: 流奶與蜜之地
  path: link_folder/神學/流奶與蜜之地.md
  definition: 「流奶與蜜之地」是神對以色列所要進入之迦南的豐饒描述。「奶」反映適合畜牧與群畜繁衍的環境，「蜜」可指蜂蜜或果實濃汁，合起來表達土地具有供應與出產。這不是說當地無人居住；本章隨即列出迦南諸族。
  development: '基督教來源常把此地應用為在基督裡的豐富享受。這可作神學應用，但經文本義首先指父祖蒙應許、由多族居住的迦南實地，包含日後進入、爭戰與忠於盟約的責任。


    ### 應許的條件面：利20 把它和「被吐出」放在一起


    出埃及記3章與13章講這句應許時，重點在拯救——神要領百姓出埃及、上到那流奶與蜜之地。民數記13章則是探子回報時的用語，那裡的問題是百姓信不信得過。


    利未記20:24 把同一句話擺在整章死刑條例的正後方，而且緊接著「我是耶和華你們的神，使你們與萬民有分別的」。更關鍵的是前面兩節：v22 先警告「免得我領你們去住的那地把你們吐出」。CT
    在這裡指出全本聖經的一條線索——因著人的罪，「地必為你的緣故受咒詛」（創3:17），人若受玷污和敗壞，地就不再為他效力。


    換句話說，在利未記20章，流奶與蜜不是無條件的背景設定，而是與「地會不會留下你」綁在一起的應許。GT 丁良才也在同一章指出，迦南人被逐正是因為他們的惡貫滿盈，以色列人若隨從這等風俗，神照樣要叫他們住不下去。'
- title: 越過耶和華的口（peh）
  path: link_folder/原文/越過耶和華的口（peh）.md
  definition: '民數記22:18：巴蘭說「我行大事小事也不得越過耶和華─我神的命」。同樣的話他在第38節又說了一次。


    **「命」原文是「口」。** STEP 原文資料顯示，第18節的「命」在原文是 pi（H6310I），簡要義域是 peh: lip: word，STEP 給的本節譯義作
    the mouth of。也就是說，原文的說法是：越過耶和華我神的口。


    **「越過」是哪一個字。** 同一節的「越過」是 la./''a.Vor（H5674D，HR/Vqcc 不定詞），STEP 給的簡要義域是 a.var: to
    pass: trespass——這個字既可指單純的經過，也可指逾越界線。


    **各家怎麼讀這句話。** GT 丁良才《民數記註釋》給了兩種可能：「巴蘭說這話，若不是顯明他知道自己不能隨意發言，只能說神所啟示他的話，就是假裝沒有為己的心，不貪世俗的富貴。」CT
    讀得更重：「『耶和華我神』在人前又假裝認識神，有敬虔的外貌，卻無敬虔的實意(參提後三5)」BH 則指出，巴蘭承認自己的能力不是自主的，而是受更高權柄支配，這一點在一個異邦先知口中格外值得注意。KC
    說巴蘭知道自己是神的囚犯。'
