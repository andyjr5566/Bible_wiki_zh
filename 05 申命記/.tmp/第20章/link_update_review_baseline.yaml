- title: 心消化（ma.sas）
  path: link_folder/原文/心消化（ma.sas）.md
  definition: '申命記1:28 百姓引述探子的話：「我們的弟兄使我們的心消化」。「消化」這個中文詞今天已經不太用在這個意思上。


    **原文是融化。** STEP 原文資料顯示是 he.Ma.su ''et- le.va.Ve./nu（H4549 ＋ H3824）：


    | 和合本 | 原文 | Extended Strong | 形態 | STEP 本節譯義 | 簡要詞典義 |

    |---|---|---|---|---|---|

    | 使⋯消化 | he.Ma.su | H4549 | Hiphil 完成 3cp | they have made melt | ma.sas: to melt
    |

    | 心 | le.va.Ve./nu | H3824 | 陽性單數＋1cp | heart/ our | le.vav: heart |


    Hiphil 是使役語態——不是心自己化了，是有人使它化了。經文接著就指出是誰：「我們的弟兄」，也就是那十個探子。


    **三家的說明一致。** CT 原文字義給「消化」＝溶化，溶解，並說「『心消化』意指失去勇氣和膽量」。GT《聖經精讀本》給了更完整的字面：「使我們的心消化：原文的字面意義是『使心消融並淌流』」，並說其結果是百姓徹夜哭號、妄言不如早死、輕舉妄動要回埃及（民14:1-4）。BH：「hearts
    melt」是形容恐懼與失去勇氣的生動說法，舊約常用來描述壓倒性的驚懼（書2:11）。


    **同一節的誇大。** 「城邑又廣大又堅固，高得頂天」——STEP 顯示原文是 ''a.Rim ge.do.Lot u./ve.tzu.Rot ba./sha.Ma.yim（H5892B
    城＋H1419A 大＋H1219 ba.tsar 設防＋H8064 天），字面是「城又大又設防到天上」。CT 說這是「言過其實」；GT《啟導本》舉出考古：「所居地的城牆，據考古學家發現，只有10至15公尺高。探子說『高得頂天』的確過甚其詞」；BH
    也說這是誇飾。GT《聖經精讀本》把它歸納成一句：「不信的特徵之一就是為私欲所牽引，誇大消極面。」'
  development: ''
  signals:
  - development_blank
  accumulation_count:
