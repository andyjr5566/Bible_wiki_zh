- title: 平安（shalom）
  path: link_folder/原文/平安（shalom）.md
  definition: '祝福詞停在「賜你平安」這句話上（v26）。這個字的範圍比中文的「平安」大得多。


    KC 給的定義最簡潔：「Shalom：不只是沒有戰爭，也包括興旺、公義與安康。」GT《啟導本》列得更細：平安「在希伯來人的觀念中為神賜給人的各種好處的總稱，包括健康、財富、安樂的生活、和平（沒有戰事），以及神的拯救等」。GT《民數記串珠聖經註釋》的註只有一句：「賜你平安：包括一切好處；健康、興隆等。」BH
    的說法一致——shalom 涵蓋完整、福祉與和諧，「不只是外在的，也是內在的」。


    CT 的原文字義在本節給的是「和平，健全，興旺」。


    **平安要往哪裡求**：CT 給了兩句很短的話。「我們不該在神之外求平安；真平安的捷徑乃是遵行神的旨意。」「信徒的『平安』，與客觀環境無關，也不受外界事物的影響。」


    **與基督的連結**：GT《啟導本》寫得最完整——「在主基督身上可以看見那豐富的平安。祂給人類平安，使人與神和好，祂就是耶和華的君」（約14:27、弗2:14、賽9:6）。BH
    的方向相同，並指出以賽亞書九6 稱祂為「和平的君」，而最終的平安要在神的國裡完全實現（啟21:4）。'
  development: 'STEP 原文資料顯示第26節的「平安」是 sha.Lom（H7965G，詞典形 sha.lom，詞典義 peace），在本章只出現這一次，位置就在整段祝福詞的最後一個實詞。


    同一節的「賜」是 ve./ya.Sem（H7760H，詞典形 sum，詞典義 to set: put），與第27節「奉我的名」的「奉」同字——平安是被「放」在人身上的，與神的名放在以色列人身上是同一個動作。


    GT《聖經精讀本》把祝福的三項內容連成一組影響：所有信徒都在神的權柄之下受到保護（詩121:4），而「住在神裡面的人，在任何環境中都能享受平安」（詩4:7-8）。'
