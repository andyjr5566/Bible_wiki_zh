- title: 神的同在
  path: link_folder/神學/神的同在.md
  definition: 神的同在（Presence of God）是聖經一條貫穿的主題——神與祂所揀選的人同在，是他們蒙福、外邦人也都看得見的事實。在創世記裡它以「神與某人同在」的敘述出現；到了出埃及記，它取得了具體的形式：神吩咐造聖所，「使我可以住在他們中間」（出25:8），而會幕的每一層結構都成為這個同在的外殼與界線。
  development: '「神的同在」橫跨三卷書、十七章累積下來，走的是一條從「對個人的口頭應許」到「一座蓋起來的居所」、再到「日常同行的規範」的線。


    **第一段是族長時期的口頭應許。** 創世記第26章神兩次對以撒說「我必與你同在」，連外人亞比米勒都看得出來：「我們明明地看見耶和華與你同在。」創世記第28章的時機更值得注意——雅各因欺騙父親被迫離家、以石為枕的那一夜，神說「我也與你同在」，而雅各醒來才發覺：「耶和華真在這裏，我竟不知道！」神的同在先於人的察覺，這一點在這兩章就定了調。出埃及記第3章把同樣一句話用在差遣上：摩西問自己憑什麼去見法老，神沒有回答他的資格問題，只應許「我必與你同在」。


    **第二段是出埃及記後半的核心工程：把同在蓋成一座房子。** 出埃及記第26章給的是外殼規格，四層遮蓋由內而外越來越樸素，而內幔把聖所與至聖所隔開——同在因此是可親近卻有界限的。第27章的燈在幔外常常點著，院子的門開在東邊；KC
    說院子入口「代表對人的邀請，要人親近神」。第29章45-46節把整段的目的講白：「我要住在以色列人中間，作他們的神」，GT《丁道爾》稱這兩節「就是以上經文的總綱和巔峰」。第30章的香壇與洗濯盆是進入同在前的預備；第37章的施恩座是神應許相會的具體座標。


    中間出過一次大事故。出埃及記第33章神宣告「我自己不同你們上去」，摩西力爭「你若不親自和我同去，就不要把我們從這裡領上去」，並指出神的同去正是「使我和你的百姓與地上的萬民有分別」的唯一記號。第34章這件懸案以立約的形式落定，第35章重啟建造——KC
    指出這顯明人的罪並未取消神的恩典，會幕如今臨到一個跌倒過的百姓中間。第36至39章是實體建造與清點，第40章雲彩遮蓋會幕、榮光充滿帳幕，應許正式成為事實。


    **第三段是同在住下來之後的日常。** 利未記第26章11-12節用兩個動作把它說完：「我要在你們中間立我的帳幕」，然後「我要在你們中間行走」。CT 分得很清楚：「上節是同住，本節是同行。」而這一次同在被寫成有條件的——它是七重蒙福應許的最高一層，前提是遵行律例、謹守誡命；同一章第30節又用同一個動詞說出反面：「我的心也必厭惡你們。」民數記第2章則把同在變成營地的空間秩序：會幕居中、四營環繞，無論安營或起行都不改變。GT
    丁良才從這個佈局讀出三樣教訓——神與人同在、都當倚靠神、都可親近神。'
  signals:
  - first_in_book
  accumulation_count:
