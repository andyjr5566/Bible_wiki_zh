- title: 亞瑪力
  path: link_folder/人物/亞瑪力.md
  definition: 亞瑪力（Amalek）是以掃的兒子以利法與妾亭納所生的兒子（創36:12），亞瑪力人的始祖。GT《中文聖經註釋》說「按聖經的傳統，亞瑪力人屬以東族，是以掃的兒子以利法的妾亭納所生的兒子的後人（見創卅六12、16）」，並給了名字的三個可能字義：「谷中居民」、「好戰者」或「生事者」；CT
    給的原文字義是「山谷的居住者」。到了出17:13-14、16，「亞瑪力」已用作整個民族的代稱——約書亞殺的是「亞瑪力王和他的百姓」，神要塗抹的是「亞瑪力的名號」。KC
    指出亞瑪力是撒但藉肉體軟弱攻擊信徒的圖畫，並點出他的出身：他是以掃的孫子，而以掃在希伯來書12:16被稱為「貪戀世俗的人」。
  development: GT《啟導本聖經腳註》指出亞瑪力是「極古的遊牧民族」，民24:20稱亞瑪力為「諸國之首」。這個名字之後在以色列歷史中一再出現：民14:43-45以色列人北進受阻、申25:17-19的記念與塗抹之命、撒上15章掃羅奉命滅亞瑪力、撒上30章大衛擊敗劫掠洗革拉的亞瑪力人，最後在代上4:43由西緬支派完成。GT《串珠聖經註釋》把v16讀成預言：「強調亞瑪力人終會完全消滅；這預言在希西家的時代果然應驗了。」而
    GT《聖經精讀本》指出這場敵對的性質不只是民族的：「特別是亞瑪力象徵著攻擊神的國和其百姓的敵基督的形象。」
