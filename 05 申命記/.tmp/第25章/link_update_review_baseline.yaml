- title: 可憎的物（to.e.vah）
  path: link_folder/原文/可憎的物（to.e.vah）.md
  definition: '申命記第十四章第3節只有一句：「凡可憎的物都不可吃。」它是第3至21節整段食物條例的標題句，後面所有的走獸、水族、飛鳥清單都掛在這一個詞下面。


    STEP 顯示這個字是 to.''e.Vah（H8441，簡要詞典義 to.e.vah: abomination，陰性單數），本節逐字解作 disgusting
    thing。


    **各家對這個詞的界定相當一致：它講的是禮儀，不是道德。** CT 的原文字義註「可憎的物」可憎惡的事物、(禮儀上)不潔的，文意註解說意指一切禮儀上不潔淨的活物。GT《申命記雷氏研讀本》一句帶過：即不潔淨的東西。GT《啟導本聖經申命記註釋》說得比較完整：「『可憎之物』指宗教上不潔淨的生物。這些動物不可以吃，也不可以拿來獻祭。」他並給出訂立條例的用意——不讓以色列人和神認為禮儀上不潔之物接觸，自覺地學習神的聖潔。BH
    也說這裡的 detestable 指按摩西律法算為不潔的動物，並指出這套區分不只關乎健康，更在教導以色列人分辨聖與不聖。


    **要注意這個字的方向。** 它說的不是那些動物本身有什麼問題，而是牠們與這一群人的關係——本章第7、8、10、19 節都是「與你們不潔淨」的句式。CT 也提醒，新約在這件事上有明確的轉向：主耶穌說凡從外面進入的不能污穢人（可七18），使徒行傳第十章又把潔淨的界線再打開一次。'
  development: '這個字在申命記裡的用法值得整段看。STEP 的鄰章查詢顯示同一個字（H8441）在申12:31、13:14、14:3、17:1、17:4
    各出現一次。


    除了本章這一次，其餘四次都指向偶像敬拜或違約：申12:31 說迦南人向他們的神行的是耶和華所憎嫌所恨惡的事，甚至把兒女用火焚燒；申13:14 用它形容一座城整體背叛去事奉別神；申17:1
    用它形容把有殘疾的牛羊獻上；申17:4 又用它形容個人去拜日月天象。


    換句話說，同一個字在這幾章裡既管敬拜的對象、也管獻上的祭物，還管餐桌上的食物。申命記十四章第3節把這個原本用來講偶像的詞放到吃的事上，正好接住了本章開頭的邏輯——身分若是神的兒女，分別就要一路延伸到最日常的地方。


    申命記十八章是這個字在申命記裡最密集的一處：第9節一次、第12節兩次，STEP 都是 H8441。


    它在這裡管的是第四類東西。前面幾章分別用它管敬拜的對象（申12:31、13:14、17:4）、獻上的祭物（申17:1）與餐桌上的食物（申14:3）；申十八9-12
    用它管的是取得資訊的方法——占卜、觀兆、法術、交鬼、過陰這一整套。


    第12節還把這個字寫成一項歷史判決的理由：「因那些國民行這可憎惡的事，所以耶和華─你的神將他們從你面前趕出。」GT《聖經精讀本》在這一節說得很直：神並沒有因偏愛以色列百姓而除滅了毫無過錯的迦南人；日後以色列自己陷入拜偶像之罪時，被周邊列強趕出那地的事實也如實地表明了這一點。


    申命記二十二5 又把它推到另一類東西上。這一次管的既不是敬拜的對象、祭物、食物，也不是求問的方法，而是身上穿戴的：婦女不可穿戴男子所穿戴的，男子也不可穿婦女的衣服，「因為這樣行都是耶和華─你神所憎惡的」。BH
    指出這個字在希伯來文脈絡裡常用來指偶像敬拜或性方面的可憎行為，而這裡把它用在日常服飾上。


    把申命記各處排起來，這個字管的範圍是一路外擴的：敬拜的對象（申12:31、13:14、17:4）、獻上的祭物（申17:1）、餐桌上的食物（申14:3）、求問的方法（申18:9-12）、與外邦人共處時會學到的事（申20:18「免得他們教導你們學習一切可憎惡的事」），最後是身上的衣服（申22:5）。==同一個字從聖所一路管到衣櫃。==


    申命記二十三章18節換了一個位置。前面幾章這個字管的都是「不可帶進生活裡」的東西——不可拜、不可獻、不可吃、不可求問、不可穿；這一次管的是「不可帶進殿裡」的東西：娼妓所得的錢與孌童所得的價，不可帶入耶和華的殿還願，「因為這兩樣都是耶和華─你神所憎惡的」。


    差別在於這一次被判為可憎的不是物件本身，而是它的來源。錢並沒有問題，問題在於怎麼賺來的。CT 在話中之光說得很清楚：「錯誤的手段並不能成就良善的目的，用行惡、行淫或詭詐而得的錢財奉獻，神絕不悅納。」KC
    也說我們獻給神的，不只是獻什麼重要，怎麼取得的同樣重要。


    ==同一個字先管人的餐桌與衣櫃，最後管到人的奉獻箱。=='
