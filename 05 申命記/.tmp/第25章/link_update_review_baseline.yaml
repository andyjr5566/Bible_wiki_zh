- title: 申25：17-19 記念亞瑪力
  path: link_folder/互文/申25：17-19 記念亞瑪力.md
  definition: 申命記25:17-19是摩西對出17亞瑪力之役的回顧與命令：以色列人要記念亞瑪力人「趁你疲乏困倦，擊殺你儘後邊軟弱的人，並不敬畏神」，將來得享平安時要「將亞瑪力的名號從天下塗抹了，不可忘記」。本章的四份來源都指向這處經文——它補上了出17:8所沒有交代的一件事：亞瑪力人攻擊的方式。
  development: GT《聖經精讀本》把神如此徹底懲罰亞瑪力人的原因列成兩點：「①他們不顧同一血源的關係，殘忍地襲擊了軟弱的、疲勞中的以色列百姓（申25:18）；②出埃及後與以色列的第一交戰國亞瑪力，日後在反以色列行動中從來都是帶頭活動。」它並指出這句話的應驗經過掃羅與大衛（撒上15:7；27:8），以及在希西家統治下由西緬支派完成（代上4:41-43）。GT《中文聖經註釋》則提醒申25:19的命令並未使亞瑪力人立即消失：「在後期的歷史中，我們找到亞瑪力人仍然是以色列人的死敵。」
