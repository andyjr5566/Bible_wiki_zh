- title: 四十的屬靈意義
  path: link_folder/原文/四十的屬靈意義.md
  definition: 創世記7章以 אַרְבָּעִים（H705，「四十」）記錄降雨與洪水持續的日數。CT、BH與其他註釋再結合摩西、以利亞、以色列曠野與耶穌受試探等經文，進一步把「四十」理解為試探、試煉、審判或預備的時期。
  development: '### 聖經中「四十」的其他實例


    | 實例 | 出處 |

    |---|---|

    | 摩西在西乃山四十晝夜 | 出廿四18；申九18 |

    | 以色列曠野漂流四十年 | 民十四33-34 |

    | 主耶穌曠野受試探四十天 | 太四1-2 |

    | 以利亞走四十晝夜到何烈山 | 王上十九8 |


    ### 神學意義／研讀意義


    - 洪水四十晝夜——神審判中的試煉期

    - 方舟經過四十天洪水——在基督裡經歷試煉仍得保全

    - 四十天後水開始漸消——試煉有盡頭，神的恩典夠用'
