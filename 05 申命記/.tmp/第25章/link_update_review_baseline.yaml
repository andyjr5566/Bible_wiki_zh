- title: 神的記念
  path: link_folder/神學/神的記念.md
  definition: 創世記8:1以 וַיִּזְכֹּר（H2142，Qal）說神「記念」挪亞、方舟裡的一切活物和牲畜，隨即使風吹地、水勢消退。註釋由這個敘事次序進一步把「神的記念」理解為持續關注、顧念並採取施恩行動。
  development: '### 持續的關懷


    「紀念」在聖經中常指神的**持續關注**，如尼希米記 5:19「記念」神、詩篇 25:7「記念」神的憐恤。這顯示神對祂子民的關懷是持續而非暫時的。


    ### 施恩的表現


    神的記念常與**施恩**連在一起，表明神在審判中仍願意轉為施恩。創八 1 與創一 2「神的靈運行在水面上」對照，含有**重新創造的意味**。



    ### 創八 1 的核心意義


    創八 1「神記念挪亞」是第8章的開端，表明神在洪水審判中並未忘記方舟裡的挪亞一家。這顯示：

    - 神終極的關心常在挪亞的方舟裡

    - 在如火般的震怒中，也燃燒著對人類的極大憐憫

    - **「在震怒中記念恩典」**


    ### 與三一神的連結


    「神記念挪亞」與三一神同工的神學連結：

    - 神顧念挪亞

    - 基督替死（方舟豫表基督）

    - 聖靈運行（風與靈原文同字）'
