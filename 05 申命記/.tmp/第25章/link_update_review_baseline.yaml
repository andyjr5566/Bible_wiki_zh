- title: 人的尊嚴
  path: link_folder/主題/人的尊嚴.md
  definition: 出埃及記二十一章用一連串條例把人的價值寫進法律：殺人償命（12節）、打罵父母同為死罪（15、17節）、拐帶人口必死（16節）、傷害孕婦須賠償甚至以命償命（22-23節）、打壞僕婢一眼一牙即須釋放（26-27節）、牛觸死僕婢牛仍要打死（32節）。GT《聖經精讀本》把這批條例的根據直接指向創世記：「死刑制度的聖經根據是『因為人類是照神的形像造的』（創9:6）。所以殺人不僅相當於破壞神的形像，而且是掠奪屬神的『性命』（血），所以難免一死。」該書並指整部立約書的內容特點之一是「強調了人類的尊嚴追求萬民平等的思想」。
  development: 本章把「人的價值」轉換成三種可執行的形式：不可用錢了結（人命）、不可用身分打折（僕婢的眼與牙）、不可用疏忽推卸（牛主與井主）。GT《舊約聖經背景註釋》指出古代近東同樣重視個人責任，差別在於以色列把人的一命從價目表裡拿了出來。
