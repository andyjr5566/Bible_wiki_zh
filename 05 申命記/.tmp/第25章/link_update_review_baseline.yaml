- title: 亞瑪力人
  path: link_folder/人物/亞瑪力人.md
  definition: 亞瑪力人（Amalekites），以掃之孫亞瑪力後裔組成的遊牧民族，住在南地一帶，是以色列人的世仇。他們在以色列人出埃及後最先攻擊以色列人（出十七8-16），神宣告必世世代代與亞瑪力人爭戰。
  development: '**他們住在哪裡。** GT《舊約聖經背景註釋》給的定位是「主前第二千年紀下半葉，居住在尼革和西乃半島一帶的遊牧或半遊牧民族」；GT《丁道爾聖經註釋》說他們「和其他遊牧民族一樣，漂流範圍很廣；放牧的地區大致稱為『尼革』（Negeb）或『南地』（民十三29）」，並指出「我們肯定知道他們曾在加低斯的綠洲安營（創十四7），因此他們在費蘭河的綠洲居住也不足為奇」。GT《中文聖經註釋》則據亞瑪力地在猶大南部近加低斯巴尼亞，反推利非訂應在西乃半島北部（見
    [[西乃山的地理]]）。


    **這場敵對持續了多久。** GT《啟導本聖經腳註》把整條線列了出來：以色列人從加低斯北進被阻，名單中有亞瑪力人（民14:43-45）；掃羅和大衛征伐的主要敵人也是亞瑪力人（撒上15、30章）；「這邊患到以色列人的王國建立後才敉平」（代上4:43）。GT《中文聖經註釋》補上士師時代：亞瑪力人協助亞捫人（士3:13）、米甸人（士6:3、33，7:12）來攻擊以色列。


    **創14的亞瑪力人是誰。** 李道生指出一個時序上的難題：早在亞伯拉罕的時代，四王與五王之戰中就有「亞瑪力全地的人被殺」（創14:7），「此處亞瑪力的名字，可能不是從以掃的後裔起的」。'
