      synthesis_scope:
      - 創世記:38
      - 申命記:25
- title: 救贖goel
  path: link_folder/神學/救贖goel.md
  summary: 第5至10節的叔嫂婚姻與贖回的責任重疊。KC 指出波阿斯的情況牽涉的是比較遠的家族成員，因為沒有弟兄，而且那裡的地也早已轉到別人手上，所以波阿斯必須同時作贖回的人和盡弟兄本分的人；BH 說這條律法也見於路得與波阿斯的故事，波阿斯在其中作至近的親屬。GT《啟導本聖經申命記註釋》記下條例的擴大：「死者若無兄弟，他的最近親屬也須負此義務（得四章）」。
  relation: 本條目前面收的贖回，處理的是人被賣、地被賣、血被流之後由親屬出面；本章加上的是另一種失去——一個人死了而沒有留下名字，也要由親屬出面補上。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
    - 4
    definition: keep
    development: keep
- title: 路得記4章法勒斯家譜
  path: link_folder/互文/路得記4章法勒斯家譜.md
  summary: 第5至10節是波阿斯行為的律法根據。CT 的話中之光：「實際上，主耶穌基督和大衛王的祖先俄備得，就是波阿斯和路得透過「叔嫂婚姻」所生的長子(太一5；得四17)。」GT《啟導本聖經申命記註釋》指出條例後來擴大到最近親屬（得四章），並說古代腳踏田地為依法取得土地所有權的象徵，把鞋從一人交給另一人為權利轉移的表示（參得四7,8）。KC 說波阿斯必須同時作贖回的人和盡弟兄本分的人。
  relation: 這條家譜能從法勒斯接到大衛，中間靠的就是本章這條律法：所生的長子歸死者名下，死者的名不至於在以色列中被塗抹。俄備得因此同時是波阿斯的兒子，也是瑪倫的後嗣。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
