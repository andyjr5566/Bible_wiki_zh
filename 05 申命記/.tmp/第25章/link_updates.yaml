  summary: 第19節是掃羅後來奉的那道命令的出處。CT：「最後，神命令掃羅王除滅亞瑪力人(參撒上十五2~3)，但他沒有徹底執行。」CT 並說亞瑪力人最終在希西家的時代基本被消滅（參代上四43），而後來想除滅猶太人的哈曼，可能是亞瑪力王亞甲的後裔（參斯三1）。KC 記的順序相同：掃羅受命抹除亞瑪力卻因不順從而失敗，大衛後來擊敗他們，最終的了結發生在希西家的日子（1Chr 4:41-43）。
