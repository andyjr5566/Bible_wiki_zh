- title: 以色列的長老
  path: link_folder/文化/以色列的長老.md
  summary: 第7至9節，長老在整個程序裡出現三次：寡嫂到城門長老那裡控訴，本城的長老召那人來問他，脫鞋與吐唾沫也在長老面前進行。STEP：ha./ze.ke.Nim（H2205G za.qen）。GT《聖經精讀本──申命記註解》把程序拆成四步：寡嫂告知城中長老、長老以審判官的資格開庭傳那男子、充分說明繼代結婚的意義與目的並勸其聽從、他若終不肯轉意才進行脫鞋與吐唾沫。BH 說長老是群體中受敬重的領袖與審判者，他們在場使程序具有問責性與正當性。
  relation: 本條目前面幾章的長老多半在判案或執行處置；本章的長老先勸後罰——中間那一步是勸他聽從，而且即使勸不動也不能強迫他娶，只能公開記下他的選擇。
  overview_review:
    signals: []
    accumulation_count:
    - 8
    - 9
    definition: keep
    development: keep
- title: 城門口公共場合
  path: link_folder/歷史/城門口公共場合.md
  summary: 第7節：「他哥哥的妻就要到城門長老那裡」。CT：『城門』指城門洞兩側的小房間，是以色列人處理交易和訴訟的公共會所（參得四1）。BH 說城門是古代以色列公民生活的中心，法律交易、公開宣告與司法都在那裡進行（得4:1-2；箴31:23），這個場景因此強調了寡婦控訴的正式與公開性質。
  relation: 本條目的定義已把申25:7 列進城門作為法律審判場所的清單；本章補上的是這場合的一個特點——在這裡由一位寡婦提出控訴，長老受理，被告當眾回答。
  overview_review:
    signals: []
    accumulation_count:
