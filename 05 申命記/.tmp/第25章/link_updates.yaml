    - 10
    definition: keep
    development:
      decision: keep
      basis: already_covered
      covered_by: 最後成了一個有編制的機構所在
- title: 公道天平法碼升斗
  path: link_folder/主題/公道天平法碼升斗.md
  summary: '第13至16節：囊中不可有一大一小兩樣的法碼，家裡不可有一大一小兩樣的升斗，當用對準公平的法碼與升斗，因為行非義之事的人都是耶和華所憎惡的。STEP：「法碼」是 ''E.ven（H68H，簡要詞典義 e.ven: stone: weight），「對準公平」是 she.le.Mah（H8003 完整）配 va./Tze.dek（H6664G 公義），兩樣器具各配一次。GT《啟導本聖經申命記註釋》指向利19:35 及注；KC 指出禁令的範圍不只是使用，連持有都不行，並說壞商人買進用大量器、賣出用小量器（摩8:5）。'
  relation: 利19:36 的「公道」是 tze.deq 一節連用四次；本章則是 shalem 加 tzedeq 兩個字疊起來，各配一樣器具。本章另外把違反的後果寫成兩面：守的人日子可以長久，行非義之事的人是耶和華所憎惡的。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 伊法
  path: link_folder/原文/伊法.md
  summary: 第14至15節的「升斗」原文就是伊法。STEP：v14 'ei.Fah 與 ve./'ei.Fah（H374）、v15 'ei.Fah，本章共三次。CT 的原文字義標明「兩樣的升斗（原文雙同字）」是伊法、升斗。第15節要求「當用對準公平的法碼，公平的升斗」，STEP 顯示配在伊法上的是 she.le.Mah（H8003 完整）與 va./Tze.dek（H6664G 公義）。
