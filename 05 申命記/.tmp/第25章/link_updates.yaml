book: 申命記
chapter: 25
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 審判不可行不義按公義審判
  path: link_folder/主題/審判不可行不義按公義審判.md
  summary: 第1節：「人若有爭訟，來聽審判，審判官就要定義人有理，定惡人有罪。」STEP：「爭訟」是 riv（H7379），「來聽審判」是走近 ha./mish.Pat（H4941G，審判之處），「定義人有理」是 hitz.Di.ku（H6663 tsa.daq 使役語態，宣告為義），「定惡人有罪」是 hir.Shi.'u（H7561）。CT 的文意註解替兩個對象下定義：『義人』指無辜的或被誣告的人，『惡人』指侵權加害別人的人。GT《啟導本聖經申命記註釋》說本節規定民間若有爭訟應交法庭處理，並指「義人」可譯為「無辜的」。BH 說無辜者得釋放是公義的根本原則，並引箴17:15 定惡人為義、定義人為惡都是耶和華所憎惡的。
  relation: 本章開頭這一節替全章定了方向：先把是非判清楚，接下來三節才處理判清楚之後可以做到什麼程度。同一組宣告為義／定為有罪的動詞，在本章之後就沒有再出現。
  overview_review:
    signals: []
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 審判官
  path: link_folder/原文/審判官.md
  summary: 第1至2節兩次出現「審判官」，第2節並規定他要叫受刑者當面伏在地上。STEP：本章的「審判官」是 ha./sho.Fet（H8199 sha.phat），第2節「叫他當面伏在地上」的動詞 ve./hi.pi.L/o（H5307G）主詞就是審判官；接著責打的動詞 ve./hi.Ka.h/u（H5221）沒有指名行刑者，並要在他面前（le./fa.Na/v，H6440H）進行。KC 指出鞭打必須在審判官面前執行，這強調判決要照著宣告的內容執行、而且要立刻執行；BH 說審判官在場確保刑罰不超過規定的上限。
  relation: 和合本在出21:6 也譯出「審判官」，但那裡小字註明「審判官或作：神」，原文與本章的 sho.Fet 不是同一個字。本章的用法是最單純的一種：一個在法庭上判案、並親自在場監督行刑的人。
  overview_review:
    signals: []
    accumulation_count:
    - 8
    - 9
    definition: keep
    development: keep
- title: 以色列刑罰的節制與程序保障
  path: link_folder/背景/以色列刑罰的節制與程序保障.md
  summary: 第2至3節是本條目所列限制中的一項，本章把它寫成完整條文：受刑者要當面伏在地上、按著他的罪照數責打、只可打他四十下不可過數。STEP：「按著他的罪」是 ke./Dei rish.'a.T/o（H1767 足夠＋H7564 罪惡，照他罪惡的分量），「照數」是 be./mis.Par（H4557），「不可過數」是 lo' yo.Sif（H3254G）。GT《啟導本聖經申命記註釋》：「次節規定刑罰應在審判官前執行，以昭公允，免得刑罰過分。」GT《聖經精讀本──申命記註解》把以色列的刑罰分成死刑、體罰與賠償刑三類，本段處理的是體罰。
  relation: 本條目的主題發展早已把體罰的上限在申命記25章、以四十下為限這一項列進那串限制清單；本章提供的是那一項的原文條文本身，連帶補上它的執行細節與理由——過數就是輕賤你的弟兄。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 四十的屬靈意義
  path: link_folder/原文/四十的屬靈意義.md
  summary: 第3節：「只可打他四十下，不可過數」。STEP：'ar.ba.'Im（H705），與創7 記洪水日數的是同一個字。KC 說四十在這裡代表一次完整的刑罰，並舉創7:12 與民14:33-34 為對照；BH 也說四十在聖經裡常象徵試煉或審判的時期。CT 的背景註解記下後來的實務：猶太人擔心責打超過四十下、輕賤了弟兄，寧可少打一下，保羅受過的正是這種刑罰（林後11:24）；GT《聖經精讀本──申命記註解》說後來的猶太人為預防計數錯誤，杖打時打到三十九下。
  relation: 這是本條目第一次遇到「四十」用來量次數而不是量時間，而且是一道不可超過的上限。後來的三十九下慣例，正是因為這個數目在這裡是上限而不是目標。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
    - 4
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 創世記:7
      - 申命記:25
- title: 人的尊嚴
  path: link_folder/主題/人的尊嚴.md
  summary: 第3節替四十下的上限給了理由：「若過數，便是輕賤你的弟兄了。」STEP：「輕賤」是 ve./nik.Lah（H7034 qa.lah，被輕看蒙羞），後面接 le./'ei.Nei./kha（在你眼前）；挨打的人原文稱為 'a.Chi./kha（H251I，你的弟兄／同胞）。CT 的原文字義把這個詞拆成藐視羞辱加上眼睛，並說『輕賤』原文是看不起、意指踐踏人權。GT《申命記串珠聖經註釋》：「為了維護人的尊嚴，體罰必須定下準則，不可隨意鞭打被告」。BH 說過度的刑罰會造成公開的羞辱與人格的損失，而在古代近東，公開羞辱往往比肉體痛苦更難承受。
  relation: 出21 保護的是被別人傷害的人，本章保護的是正在被合法處罰的人——律法在自己動手的時候替對方留了一道界線，理由不是他無辜，而是他仍然是你的弟兄。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 出埃及記:21
      - 申命記:25
- title: 工價與雇約
  path: link_folder/文化/工價與雇約.md
  summary: 第4節：「牛在場上踹穀的時候，不可籠住他的嘴。」STEP：lo' tach.Som（H2629 cha.sam，戴嘴套）、Shor（H7794）、be./di.Sh/o（H1758 dush，踐踏）。四套來源都把它讀成作工者當得供養的原則：CT 說本節後來轉用來說明工人得工價是應當的（提前5:18）與叫傳福音的靠著福音養生（林前9:9,14）；GT《啟導本聖經申命記註釋》說連牛在踹谷都許它吃場上的穀粒，為神工作的人豈不可以指望取得養身所需；KC：「Just as a criminal is deserving of punishment, so the laborer is worthy of his wages.」（罪人該受刑罰，同樣，作工的人配得工價。）BH 說籠住牠的嘴使牠工作時吃不到東西，這被視為不公。
  relation: 本條目前面兩章記的都是人與人談好的雇約——雅各與拉班的工價、申24 不可欠雇工過夜的工價；本章這一節連牲畜都算在內，而且不必談：牠踩的穀，牠當場就可以吃。
  overview_review:
    signals: []
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 古代近東婚姻習俗
  path: link_folder/歷史/古代近東婚姻習俗.md
  summary: 第5至10節的叔嫂婚姻。CT 的背景註解：這是古代中東和中亞許多民族的習俗，如果哥哥死了卻沒有兒子，弟弟應當娶嫂子為妻，所生長子歸於哥哥名下，使哥哥的產業有兒子可以繼承（參創三十八8），「古代赫人和亞述人都有相似的習俗」；文意註解也說中東一帶地方多有此風俗習慣。GT《聖經精讀本──申命記註解》說這風俗早在摩西時代的很久以前就遠傳於以色列社會與古代近東社會（創38:8-11），只是到了摩西時代才成為明文的律法。GT《啟導本聖經申命記註釋》說這風俗自古流行，視為天經地義。
  relation: 本條目前面收的是婚姻怎麼成立（聘金、禮物、家族協商、政治同盟），本章收的是丈夫死後婚姻怎麼延續。同一批社會共有這個習俗，差別在於以色列把它寫成了可以上法庭的條文。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
    - 4
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 創世記:29
      - 申命記:25
- title: 猶大與他瑪事件
  path: link_folder/歷史/猶大與他瑪事件.md
  summary: 第5至10節把創38 的先例立成律法。CT 在背景註解直接引創三十八8 說明叔嫂婚姻的作法；GT《啟導本聖經申命記註釋》說「兄弟續弟兄遺孀的婚姻風俗自古流行，視為天經地義（創三十八章）」；GT《聖經精讀本──申命記註解》指這風俗早在摩西時代的很久以前就遠傳於以色列社會與古代近東社會（創38:8-11）；KC 也說這個早已存在的習慣如今被立成法律（Gen 38:8）。
  relation: 創38 記的是這個義務沒有被履行時發生了什麼；申25:7-10 給的是同樣情況下的正式出路——寡嫂可以上到城門，請長老出面，讓不肯盡本分的人當眾承擔後果。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
