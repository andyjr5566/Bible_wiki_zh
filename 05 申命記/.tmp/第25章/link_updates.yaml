  path: link_folder/人物/亞瑪力人.md
  summary: 第17至18節。CT：『亞瑪力人』是以掃的子孫（創卅六12），是以色列人的世仇，除了先後兩次與以色列人爭戰（參出十七8~16；民十四39~45）以外，又擊殺以色列隊伍盡後頭的人。GT《申命記雷氏研讀本》說「亞瑪力人也許是迦南人中最殘忍野蠻的一族」。KC 說他們攻擊一個剛剛脫離為奴之地、毫無戰鬥經驗又從未招惹過他們的百姓，顯出一種不敬畏神的心態。BH 說他們挑的是因疲乏或體弱落在後面的人。
