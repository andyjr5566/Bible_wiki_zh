- title: 申32：11-12 如鷹攪動巢窩
  path: link_folder/互文/申32：11-12 如鷹攪動巢窩.md
  definition: 申命記32:11-12是摩西臨終前對神引導以色列的比喻——「又如鷹攪動巢窩，在雛鷹以上兩翅搧展，接取雛鷹，背在兩翼之上。這樣，耶和華獨自引導他，並無外邦神與他同在。」KC引用此段解釋出19:4「如鷹將你們背在翅膀上」——正如鷹確保雛鷹不掉落死亡，神也確保祂的百姓不致滅亡。BH指出申32:11-12展開出19:4的鷹的比喻——鷹攪動巢窩是訓練雛鷹飛翔，神也透過曠野旅程訓練以色列倚靠祂。
  development: 申32章是摩西臨終前的歌——回顧神對以色列的引導和警告。申32:11-12的鷹的比喻與出19:4形成首尾呼應——出埃及時神如鷹背以色列在翅膀上，曠野旅程中神如鷹訓練以色列飛翔。GT《丁道爾聖經註釋》指出出19:4
    所說的鷹「相信是巴勒斯坦的兀鷹」，這種鳥「能夠毫不費力地在高空盤旋翱翔，拉斯珊拉的迦南文獻經常提及」；而 GT《舊約聖經背景註釋》對「背在翼上」這個行為本身提出了博物學上的質疑，見
    [[如鷹背在翅膀上是鷹還是兀鷲]]。
