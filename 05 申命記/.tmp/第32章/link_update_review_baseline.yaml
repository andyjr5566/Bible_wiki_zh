- title: 陰間（Sheol）
  path: link_folder/原文/陰間（Sheol）.md
  definition: 「陰間」（Sheol，STEP 原文為 שְׁאוֹל，Strong H7585；創42:38 帶方向詞尾作 שְׁאוֹלָה，context
    gloss 為「underworld / realm of the dead」）。在舊約語境與解經研究中，CT／GT 等註釋指出 Sheol 指人死後所歸的地下世界，在此處經文常與死亡、哀傷與分離相連。創42:38
    雅各說「白髮蒼蒼、悲悲慘慘地下陰間」，是以修辭表達若失去便雅憫，他將悲痛至死；神學與背景研究進一步將舊約 Sheol 綜合理解為人死後所歸宿的處所。
  development: GT《聖經精讀本》為這個詞下了定義：「陰間：對希伯來人來說，是人（不論善惡）死後居住的地方，指地下世界。」它並指出「白髮蒼蒼，悲悲慘慘地下陰間去了」是一種文學手法，意思是「老人悲痛的死亡」（參創44:31）——雅各在聽到約瑟的死訊時也說過同樣的話（創37:34-35）。BH
    同說「陰間」是希伯來文中指墳墓或死人所在之處的字，而「白髮」既象徵年老與智慧，在這裡也承載著雅各的脆弱與哀慟。
