- title: 呼天喚地作見證（ud）
  path: link_folder/主題/呼天喚地作見證（ud）.md
  definition: '申命記4:26 摩西動用了一個法庭動作：「我今日呼天喚地向你們作見證」。


    **原文是一個字。** STEP 原文資料顯示「呼天喚地向你們作見證」裡的呼喚與作見證在原文是同一個動詞 ha.''i.do.Ti（H5749B），形態 Hiphil
    完成式一人稱單數（HVhp1cs），本節譯義作 I call as witnesses；簡要詞典義 ud: to testify。CT〔原文字義〕註明得很清楚：「呼…喚」（原文和「作見證」同字）；「作見證」提供證據，擔任證人。


    **天和地在這裡是證人，不是修辭。** GT《串珠聖經註釋》：「呼天喚地」：天和地是神和以色列民立約的見證人。CT 的說法相同：「『呼天喚地』指以天和地作為神與以色列人之間的見證人」。


    **BH 把它放回古代近東的法律習慣。** 「In ancient Near Eastern cultures, calling upon witnesses
    was a common legal practice to confirm the seriousness of a covenant or declaration.」（在古代近東文化裡，傳喚證人是確認一項盟約或宣告嚴肅性的常見法律做法。）他並指出「Similar
    language is found in Isaiah 1:2, where God calls upon heaven and earth to witness
    Israel''s rebellion.」（以賽亞書1:2 有類似說法，神在那裡呼天喚地見證以色列的悖逆。）


    **這個動作決定了第26-28節的語氣。** 傳喚證人之後接的是判決內容：速速滅盡、不能長久、盡行除滅、分散萬民、在那裡事奉木石的神。摩西不是在勸告，是在立案。'
  development: '### 同一個法庭動作，兩次被用來作相反的事


    摩西在申命記兩次呼天喚地，中間隔了二十六章。


    申4:26 是第一次。那裡的內容是預告：他呼天喚地作見證，說百姓若在那地行惡，必速速滅盡，並被分散在萬民中。見證是為了將來有一天可以回頭指認——這話當初說過。


    申30:19 是第二次，內容換了。這一次天地不是來聽判詞的，是來看抉擇的：見證立好之後接的是生死禍福擺在你面前，所以你要揀選生命。


    ==同一個動作，一次用來封住退路，一次用來打開選擇。==GT 說神的百姓不可呼召其他神祇，所以摩西就用天地來代表這見證的長久有效；GT《聖經精讀本──申命記註解》再補一層：摩西選擇天地作證人，是為了強調現今所立之約如同屹立不動的天地一樣不變、恒久。證人不會走，所以兩次呼喚的效力都還在。'
