- title: 何珥山
  path: link_folder/地點/何珥山.md
  definition: '民數記20:22-23：「以色列全會眾從加低斯起行，到了何珥山。」第23節接著說：「耶和華在附近以東邊界的何珥山上曉諭摩西、亞倫說」。亞倫死在這座山的山頂（v28），以色列人也是從這裡起行往紅海那條路走（民21:4）。


    **它在哪裡，沒有人敢說死。** CT 只寫「『何珥山』是亞倫去世之所(參25~26節)，其確實地點不詳」，並補上一個實際的觀察：以色列人在這裡避過正面與以東人發生衝突，離開以東人的視野。GT《啟導本聖經註釋》的說法相同：「何珥山的確切位置不詳，只知在加低斯巴尼亞東北，近以東邊界。」


    **兩個候選地點，各有難處。** GT《舊約聖經背景註釋》把問題攤開：「亞倫死地（但按照申十6，他卻死在摩西拉）的傳統地點是彼特拉附近的內比哈倫山（Jebel
    Nabi Harun），但此地卻不是在「以東邊界」上。在加低斯西面，接近以東邊界的馬德拉山（Jebel Madrah）是另一個可能，但當地缺乏足夠的水源。」BH
    記下的則是傳統的一邊：何珥山傳統上被認定為今日約旦彼特拉附近的 Jebel Harun。


    **GT 丁良才《民數記註釋》給了最多細節，也提醒了一個容易混淆的地方：**這山「在亞拉巴東靠近以東的邊界（23），比海面約高五百丈，當時以色列人安營在摩西拉（申十6），又名摩西錄（民三十三30），在阿珥的山根（民二十27），還有一座何珥山在迦南的北邊（三十四7注）」——聖經裡有兩座何珥山，本章這一座在南邊的以東邊界，另一座在迦南北界（民34:7-8）。'
