- title: 摩西擊打磐石兩下
  path: link_folder/事件/摩西擊打磐石兩下.md
  definition: '民數記20:8 神的吩咐是：「你拿著杖去，和你的哥哥亞倫招聚會眾，在他們眼前吩咐磐石發出水來」。第10-11節摩西做的卻是：「你們這些背叛的人聽我說：我為你們使水從這磐石中流出來嗎？摩西舉手，用杖擊打磐石兩下」。


    **他做對了三步，錯在第四步。** CT 把帳算得很清楚：「摩西首三件事的確遵照神的吩咐：(1)拿著杖去；(2)招聚會眾；(3)到磐石前。可惜第四步並未遵照神的吩咐。」他並指出兩層錯：「摩西不該用杖『擊打』磐石，更不該擊打『兩下』。」


    **錯了幾件事，GT 丁良才《民數記註釋》數出五件：**「摩西、亞倫的錯謬有五：1違逆主命（二十七14），2自大過分（10末句），3不信神（12），4不尊主為聖（12），5擅自發怒（10第三句，詩一百零六33，申九24，雅一20，三2，詩一百四十一3）。」


    **為什麼不可以再打。** GT 丁良才《民數記註釋》從預表說：「這磐石預表主耶穌（林前十4）。既然被擊打了一次（出十七6），就不可再打。摩西卻廢了這預表的意思」。CT
    的靈意註解相同：擊打磐石表徵將祂釘在十字架上，基督既已被釘，就不能再將祂重釘一次。KC 說得更細：第一次的擊打用的是審判的杖，如今神要顯明自己是施恩的神，人只需向那磐石說話——也就是向大祭司禱告——就能得著祝福。


    **水還是流出來了。** CT 註：「然而神真是滿有恩慈和憐憫，人雖作錯事，神還是先照祂所說的，使磐石湧流出水來，解決會眾的需要。」KC 從這裡提出一個不留情的判斷：祝福臨到不等於做法正確，祝福說的是神的良善與主權，不是說那個地方或那個人對。'
