- title: 如鷹背在翅膀上
  path: link_folder/神學/如鷹背在翅膀上.md
  definition: 出19:4「且看見我如鷹將你們背在翅膀上，帶來歸我」是西乃之約前言中的核心比喻。CT 給的原文字義是「鷹，禿鷹」，並把這個比喻分成三層：「（1）生活在高處：將我們帶領到屬天的境界；（2）能力強大：祂能拯救我們到底；（3）背負雛鷹：用愛心管教我們。」KC
    引申32:11-12 作解：「又如鷹攪動巢窩，在雛鷹以上兩翅搧展，接取雛鷹，背在兩翼之上。這樣，耶和華獨自引導他，並無外邦神與他同在」——「正如鷹確保牠的雛鳥不致墜落死亡，主也照樣確保祂的百姓不致滅亡」。BH
    說鷹的意象象徵神的保護、看顧與迅速的拯救。但這隻鳥究竟是什麼，以及這個行為是否真的存在，來源之間有分歧，見 [[如鷹背在翅膀上是鷹還是兀鷲]]。
  development: '**「條件」限的是享受，不是盟約本身。** GT《丁道爾聖經註釋》從這節接到 v5-6 的條件式應許，並作了一個要緊的分辨：「更令人聯想起，申命記中神盟約是有條件的觀念──『條件』只和『享受盟約』有關，因為神的盟約是無條件的賜予。惟有順服才能帶來祝福，以及保證在神面前的地位和特權。」它並指出這不是新的教訓：「以色列最初只需接受神的救恩，便能從埃及得到拯救。現時引進的觀念，是除了信心以外，他們還需要順服。這不是自相矛盾，而是信心回應之本質更詳盡的解釋。」KC
    的講法相同：「主把祂與祂的約相連的一切祝福，都繫於順服」（耶7:23；11:4、7）。


    **這隻鷹在迦南文獻裡也飛。** GT《丁道爾聖經註釋》指出「本節所說的鷹相信是巴勒斯坦的兀鷹。這種鷹能夠毫不費力地在高空盤旋翱翔，拉斯珊拉（Ras Shamra）的迦南文獻經常提及」。'
