- title: 摩押地
  path: link_folder/地點/摩押地.md
  definition: 摩押地是創世記36章以東王哈達擊敗米甸人的戰場背景之一。此處不展開摩押全史，只記其在本章以東王事蹟中的地理功能。
  development: '摩押地在本章呈現為以東王軍事活動的地理舞台。


    這塊地在六章之間換過三種身分。


    創世記三十六章的摩押地只是一個方位——以掃的後裔活動的區域邊上。民數記二十二至二十四章的它是舞台：巴勒在這裡出錢請巴蘭咒詛以色列，而巴蘭三次開口都變成祝福。申命記一至二章的它是行程上的一段路，以色列奉命不可擾害摩押人。


    申命記二十九1 給它第四種身分，也是最後一種：立約的地點。「這是耶和華在摩押地吩咐摩西與以色列人立約的話，是在他和他們於何烈山所立的約之外。」


