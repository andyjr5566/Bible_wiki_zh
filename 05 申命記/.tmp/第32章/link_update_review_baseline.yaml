- title: 作見證的歌（shi.rah 與 ed）
  path: link_folder/原文/作見證的歌（shi.rah 與 ed）.md
  definition: '第19節神吩咐摩西寫一篇歌，理由寫得很直白：「使這歌見證他們的不是」。第21節再說一次：「這歌必在他們面前作見證，他們後裔的口中必念誦不忘。」


    ### 這是法律用語


    STEP 顯示歌是 ha./shi.Rah（H7892B，簡要詞典義 shi.rah: song），見證是 le./''Ed（H5707，簡要詞典義 ed:
    witness）。第21節的「作見證」是動詞 Ve./''a.ne.tah（H6030B，簡要詞典義 a.nah: to answer，本節譯義 it will
    testify）。


    BH 就是這樣讀的：見證是一個法律用語，指證詞或證據。GT《聖經精讀本──申命記註解》把同一件事說得更清楚——在確認被揭發的某種犯罪事實時所必不可缺的正是證人，這首歌將會擔當確認以色列的確對神犯罪的證人作用。


    「念誦不忘」的原文寫法也值得看一眼：lo ti.sha.Khach mi./Pi zar.''/O（H7911，簡要詞典義 sha.khach: to forget，Niphal），字面是不會從他後裔的口中被忘記。


    ### 誰寫的


    第19節的「寫」在原文是複數祈使 kit.Vu（H3789），後面還跟著 la./Khem，也就是為你們自己。


    CT 在話中之光點出這一點：「你要寫一篇歌」原文是「你們要為自己寫下這篇歌」，並說這表明這首歌的作者是神自己，摩西和約書亞是執筆者。GT《申命記雷氏研讀本》同樣指出摩西和約書亞受命寫一首歌（動詞是複數的），藉以幫助百姓更容易記起約的各項要求。


    ### 為什麼用歌不用別的


    CT 給的理由很實際：古人不可能人人都擁有律法書，但人人都可以念誦不忘這首歌，世世代代流傳下去。


    KC 從另一頭說同一件事——一首歌可以被背下來、教給孩子，神話語的教導內容很可以透過一首歌傳下去；他並說國歌對一個民族最深的情感有強大的影響力，同時提醒人所作的歌必須按聖經查驗。BH
    說歌與詩在古代文化裡是有效的記憶工具。


    歌的內容記在第三十二章。'
