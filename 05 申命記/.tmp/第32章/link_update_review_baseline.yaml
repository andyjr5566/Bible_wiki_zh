- title: 如鷹背在翅膀上是鷹還是兀鷲
  path: link_folder/解經爭議/如鷹背在翅膀上是鷹還是兀鷲.md
  definition: 出19:4「我如鷹將你們背在翅膀上」是全章最常被引用的比喻，但它牽涉兩個各家並不一致的問題：這是哪一種鳥， 以及「把雛鳥背在翼上」這件事是否真的發生。GT《舊約聖經背景註釋》在這兩點上都與其他來源不同調，
    並另提出一個政治性的讀法。
  development: '**這是鷹還是兀鷲。** GT《舊約聖經背景註釋》說：「這鳥是鷹的可能性雖然不能排除，翼展達八至十呎的 兀鷲（griffin vulture）才是這鳥名慣常的翻譯。」GT《丁道爾聖經註釋》的判斷相近但用詞不同：
    「本節所說的鷹相信是巴勒斯坦的兀鷹。這種鷹能夠毫不費力地在高空盤旋翱翔，拉斯珊拉的迦南文獻 經常提及。」CT 的原文字義給的是「鷹，禿鷹」——兩義並存。

    **牠真的把雛鳥背在翼上嗎。** 這是分歧最大的一點。CT、KC、BH 與丁良才都按傳統讀法解這個比喻： KC 說「正如鷹確保牠的雛鳥不致墜落死亡，主也照樣確保祂的百姓不致滅亡」；BH
    說鷹以力量與高飛著稱， 代表神能把百姓從危險中提起，並帶有養育的一面。GT《舊約聖經背景註釋》卻直接對事實本身提出質疑： 「聖經參考書雖然經常提到大鷹在雛鳥飛累了時，會將牠們背負在翼上，或在牠們無法振翅飛翔時接著牠們
    （見：申三十二11），博物學家的觀察卻無法證實這個說法。實際上大部分鷹鷲都要到三、四個月大時才 首度試飛，那時牠們已經大致長成。再者博物學家的觀察都一致同意，第一次的飛翔通常都是在父母離巢
    外出時發生的。」

    **第三種讀法：這是一個政治的象喻。** 同一份註釋接著提出一個完全不同的方向：「另一個解釋是，如果所指的 是鷲的話，這個象喻可能具有政治意味。埃及女神內克貝特（Nekhbet）是鷲神，代表上埃及，是法老和全地的
    佑護者。以色列素來受埃及保護，直至耶和華將他們帶來歸祂自己為止。」——若這個讀法成立，v4 的重點就 不在鳥的育雛習性，而在保護者的更換：以色列從埃及鷲神的翼下，換到了耶和華的翼下。

    **這個分歧不影響比喻的用途。** 無論是鷹是鷲、無論育雛的細節是否精確，四份來源對這節的神學功能沒有 異議：它是立約的歷史序言，用來提醒百姓神為他們作過什麼。GT《中文聖經註釋》說得最完整：這節與
    v5-6 同屬「一種詩體的形式，筆法是用來使人容易記憶的」，而以色列人是「從這裏回頭思想過往的日子時」， 才真可說是被如鷹背在翅膀上帶到這裡來歸於神的。'
