  chapter: 32
  summary: '第15節「但耶書崙漸漸肥胖，粗壯，光潤，踢跳，奔跑，便離棄造他的神，輕看救他的磐石」。STEP 顯示這是 ye.shu.Run（H3484，簡要詞典義 ye.shu.run: Jeshurun，morphology 為專有名詞），同節三個動詞是 sha.Man.ta（H8080, to grow fat）、a.Vi.ta（H5666, to thicken）、ka.Si.ta（H3780, be sated），「踢跳」是 va/i.yiv.At（H1163, ba.at: to kick）。CT 的原文字義給「正直的人」，說這是以色列人的暱稱，並列出申33:5、33:26 與賽44:2；GT《申命記雷氏研讀本》說這是一個親暱的用詞；GT《聖經精讀本──申命記註解》記七十士譯本譯為「蒙愛者」、德里支譯成「正直人」或「義人」，並說摩西是諷刺性地用這個名字責備以色列本當過著與名字相符合的生活。GT《申命記串珠聖經註釋》說這裡用耶書崙乃針對並強調以色列的忘恩負義而言。KC 說這個名字的意思是真誠或正直，並說神把自己的屬性給了百姓，他們卻誇耀自己的義。BH 說這是以色列的詩體名稱，指這民族理想中的正直品格。'
  relation: '這個名字是本章的轉折點。前面第7至14節整段講神怎樣養大這個民族，第15節一開口就用他們最體面的名字，接著寫出他們養肥了以後做的事——離棄、輕看。名字與行為之間的落差，就是這首歌接下來要一路追究的事。'
