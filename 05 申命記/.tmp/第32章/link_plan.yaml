- name: 尼波山
  suggested_type: 地點
  evidence: 第49節「你上這亞巴琳山中的尼波山去，在摩押地與耶利哥相對」。CT 說尼波山在亞巴琳山脈中的北部一帶山嶺，又說在尼波山嶺中有一最高山峰名叫毗斯迦山，與約但河西面的耶利哥相對。GT《申命記串珠聖經註釋》說尼波是亞巴琳山區其中的一座山；GT《啟導本聖經申命記註釋》說尼波山可能是摩押地亞巴琳群山中的一座大山，位於死海之東，從那裡可以望見死海的北端，今天的尼波山立在山頂可以俯瞰約但河谷，傳統認為此即摩西遠眺美地之山，並說據申34:1，摩西是立在尼波山的毗斯迦山頂遙望的。GT《聖經精讀本──申命記註解》說亞巴琳山是位於死海東北部的山脈，此山脈中的尼波山海拔802米，是最適合俯瞰巴勒斯坦全景的場所。BH
    說尼波山是亞巴琳山脈中的一個山峰，傳統上定位在今日約旦境內，古教堂與銘文等考古發現顯示它長期具有宗教重要性。KC 說摩西可以在同一天登上尼波，從那山上看他如此渴慕的地。
  target_path: link_folder/地點/尼波山.md
