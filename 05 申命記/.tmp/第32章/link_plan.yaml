- name: 申32：43 外邦人歡呼的異文
  suggested_type: 解經爭議
  evidence: 第43節「你們外邦人當與主的百姓一同歡呼」。STEP 的 MT 只作 har.Ni.nu go.Yim a.M/o（H7442B＋H1471A＋H5971A，字面是列國啊，要為他的百姓歡呼），沒有天使敬拜那一句。GT《啟導本聖經申命記註釋》記下：死海發現的古卷，在「一同歡呼」後加有「眾天使一同敬拜」句，《希伯來書》一6曾予引用。BH
    所根據的英文譯本正是把這一句放進正文的，作諸天哪，要與他一同歡呼，願神的眾天使都敬拜他；BH 說呼召眾天使敬拜與希伯來書1章6節相合、指向彌賽亞式的理解。GT《聖經精讀本──申命記註解》另記保羅在羅馬書15章10節引用了本節前半，用以辯證外邦人也有資格加入福音。KC
    同樣說保羅在羅馬書引用第43節上半，證明神在舊約裡的心也已經向著以色列以外的列國。CT 說意指世人都當與以色列人一同歡呼。這是一處有文本證據可查的異文差異，四套註釋之間並非解經立場的對立，而是所據經文版本不同。
