    shi.Chet（H7843，sha.chat: to ruin），「弊病」是 mu.Ma/m（H3971B，mum: blemish）。CT 的原文字義給「乖僻」的是乖僻、扭曲的，給「彎曲」的是彎曲、扭曲，給「弊病」的是缺陷、瑕疵；文意註解說乖僻形容是非不明、固執己見，彎曲形容詭詐狡猾、故意扭曲，並說「有這弊病就不是他的兒女」原文是「他們因自己的缺陷，不能作他的後裔」。GT《聖經精讀本──申命記註解》說正如40年曠野史所證明，雖然神施行了無限的恩典，以色列百姓卻是不斷背叛那慈愛與恩典的神硬著頸項的悖逆百姓；GT《啟導本聖經申命記註釋》說以色列人的敗壞與神的純全剛好相反。KC
    指出保羅談論這個世界時用了同樣這幾個字（腓立比書2章15節），意思是神的百姓已經變得與世界一樣。BH 也接到腓立比書2章15節，並說弊病一詞連到獻祭制度裡祭物不可有殘疾的規定（利未記22章21節）。'
