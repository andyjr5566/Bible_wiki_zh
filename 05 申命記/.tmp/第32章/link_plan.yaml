- name: 伸冤報應在我（na.kam 與 shil.lem）
  suggested_type: 原文
  evidence: '第35節「他們失腳的時候，伸冤報應在我；因他們遭災的日子近了」。STEP 顯示這是兩個名詞：na.Kam（H5359，簡要詞典義 na.qam:
    vengeance）與 ve./shi.Lem（H8005，簡要詞典義 shil.lem: recompense），前面是 l/i（歸屬於我），「失腳」是
    ta.Mut rag.La/m（H4131，mot: to shake），「遭災的日子」是 Yom ei.Da/m（H3117G＋H343，ed: calamity）。CT
    給了原文直譯：「伸冤報應在我，時候要到，他們腳就要滑動；他們遭難的日子近了，那為他們所預備的，快要來臨了。」並註明依英文 ESV、NASB、KJV 譯本，又說羅馬書12章19節和希伯來書10章30節都引用了本節。GT《申命記串珠聖經註釋》說這表明神的審判可畏，必報應敵人、赦免與救贖自己的子民；GT《聖經精讀本》說這指出了神必定審判不虔誠之人的公義屬性；GT《啟導本聖經申命記註釋》說敵人的邪惡生活神都知道，到了時候必伸張正義。KC
    說神不立刻審判，人就繼續犯罪（傳道書8章11節），但他的報應必然來到，並說腳滑動是跌倒或墜落開始的圖畫（詩篇38篇17節、94篇18節）。BH 說伸冤強調神的主權與公義，人的報復有瑕疵、神的公義卻是完全的，並引羅馬書12章19節。'
