- name: 所多瑪的葡萄樹指誰
  suggested_type: 解經爭議
  evidence: 第32至33節「他們的葡萄樹是所多瑪的葡萄樹，蛾摩拉田園所生的；他們的葡萄是毒葡萄，全掛都是苦的。他們的酒是大蛇的毒氣，是虺蛇殘害的惡毒。」這兩節的「他們」指誰，四套註釋分成兩路。CT
    說意指外邦敵人是邪惡的種類，因為深深植根在惡中，所能發出的也是惡毒；第33節說意指外邦敵人的享樂乃是有害的毒素。GT《申命記雷氏研讀本》同樣說這裏指出外邦人是出自邪惡的種類，《啟導本聖經申命記註釋》也說這裡描寫了敵人的情況。但
    GT《聖經精讀本──申命記註解》走的是另一路：「他們的葡萄樹」統稱以色列（何西阿書10章1節、約珥書1章7節），並說詩篇作者與先知以賽亞曾說神從埃及挪出一顆上好的葡萄樹栽在迦南地（詩篇80篇8節、以賽亞書5章2節），所多瑪的葡萄樹意指以色列放棄神之選民的聖潔生活。KC
    兩種都列：先說這似乎是指以色列那些惡貫滿盈的仇敵，接著說這幾節也可以指以色列自己，他們本是被栽的佳美葡萄樹，卻因罪變成外邦葡萄樹的敗壞枝子（耶利米書2章21節），甚至超過了所多瑪的罪（耶利米書23章14節、以西結書16章48節）。BH
    則直接讀成以色列：說這是把以色列人的道德敗壞與所多瑪的惡名並列。
