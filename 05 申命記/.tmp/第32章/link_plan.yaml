- name: 照以色列人的數目立定萬民的疆界
  suggested_type: 解經爭議
  evidence: '第8節「至高者將地業賜給列邦，將世人分開，就照以色列人的數目立定萬民的疆界」。STEP 的 MT 讀法是 le./mis.Par be.Nei
    Yis.ra.El（H4557＋H1121A＋H3478，本節譯義 to [the] number of [the] people of Israel），「至高者」是
    el.yOn（H5945B，簡要詞典義 el.yon: Most High），「立定」是 ya.Tzev（H5324，na.tsav），「疆界」是 ge.vu.Lot（H1367，ge.vu.lah:
    border）。BH 說這一句歷來爭論很多：神的眾子可指神聖的存有或天使（約伯記1章6節、詩篇82篇1節），有些解釋主張每一國都被指派了一位守護的天使；另一方面七十士譯本與部分死海古卷抄本作以色列的眾子，暗示與雅各下埃及的七十名後裔相連（創世記46章27節）。GT《申命記串珠聖經註釋》同樣記下「以色列人的數目」或作「天使的數目」，並說古人相信每一個國家都有一位保護的天使（參但以理書10章13節）。GT《啟導本聖經申命記註釋》則走另一條線：可能指賜給他們的迦南地足夠他們的子子孫孫生存。CT
    說意指以色列人是神管理全地的優先考量，根據他們的需要而立定各國各民所住的疆界。KC 說巴別變亂口音把列國趕到各自的地界時，這個民族在現實中還不存在，卻已經存在於神的旨意裡，並引使徒行傳17章26節。四家取向不同，STEP
    只能確定 MT 的讀法，不能替各家裁決。'
