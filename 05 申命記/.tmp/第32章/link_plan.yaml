- name: 我使人死我使人活
  suggested_type: 神學
  evidence: '第39節「你們如今要知道：我，惟有我是神；在我以外並無別神。我使人死，我使人活；我損傷，我也醫治，並無人能從我手中救出來」。STEP 顯示這一節四個動詞都是第一人稱：a.Mit（H4191，mut:
    to die，本節譯義 I put to death）、va./a.chai.Yeh（H2421，cha.yah: to live，本節譯義 I may restore
    to life）、ma.Chatz.ti（H4272，ma.chats: to wound）、er.Pa（H7495，ra.pah: to heal），末句是
    ve./Ein mi./ya.D/i ma.Tzil（H5337，na.tsal: to rescue，字面是沒有一位能從我手中搶救的）。CT 說意指神使人死，也使人活；被神所創傷的，神也醫治；話中之光說死與生、損傷與醫治、管教與拯救都是出於他。GT《聖經精讀本──申命記註解》說在天地之間能夠掌管人之生死禍福的惟有宇宙萬物的創造主、統治者、永活的獨一之神耶和華；GT《申命記雷氏研讀本》說神有絕對的主權。KC
    說他行事完全自由，不向任何人交帳，卻從不任意而行，他的作為總有全然公義的根據並以祝福為目的；他並引撒母耳記上2章6節與何西阿書6章1至2節。BH 引哈拿的禱告（撒母耳記上2章6節）與何西阿書6章1節，說損傷與醫治的意象表達神管教他的百姓、也施行救贖與醫治。'
