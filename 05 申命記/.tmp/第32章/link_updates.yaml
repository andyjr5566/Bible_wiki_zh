  "summary": "本章第11至12節就是這個條目的出處經文：「又如鷹攪動巢窩，在雛鷹以上兩翅搧展，接取雛鷹，背在兩翼之上。這樣，耶和華獨自引導他，並無外邦神與他同在。」STEP\
    \ 顯示「鷹」是 ke./Ne.sher（H5404 ne.sher: eagle），「攪動」是 ya.Ir（H5782 ur: to rouse），「搧展」是\
    \ ye.ra.Chef（H7363B ra.chaph: to hover），「兩翼」是 ev.ra.T/o（H84 ev.rah: pinion）。CT\
    \ 說攪動巢窩使雛鷹掉落巢窩之外，迫使其展翅自救，母鷹迅即俯衝到雛鷹的正下方用兩翅接取，如此重複演練直到雛鷹學會飛翔。GT《申命記串珠聖經註釋》說神訓導以色列民亦如此，表面上要他們單獨面對艱難的環境，卻暗地裡護著他們。KC\
    \ 說每一次他們快要跌倒，他就在旁邊接住他們，並接到出埃及記19章4節。BH 說搧展這個希伯來字也可帶輕柔移動的意思，令人想起創世記1章2節神的靈運行在水面上。"
