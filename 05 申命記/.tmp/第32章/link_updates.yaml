- "title": "忌邪的神"
  "path": "link_folder/神學/忌邪的神.md"
  "summary": "第16節「敬拜別神，觸動神的憤恨，行可憎惡的事，惹了他的怒氣」，第21節「他們以那不算為神的觸動我的憤恨，以虛無的神惹了我的怒氣。我也要以那不成子民的觸動他們的憤恨，以愚昧的國民惹了他們的怒氣」。STEP\
