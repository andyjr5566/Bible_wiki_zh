- "title": "雅各"
  "path": "link_folder/人物/雅各.md"
  "summary": "第9節「耶和華的分本是他的百姓；他的產業本是雅各」。CT 說「耶和華的分」與「他的產業」同義，「他的百姓」與「雅各」同義。STEP 顯示本節作\
    \ ya.a.Ko（H3290）與 Che.vel na.cha.la.T/o（H2256M 加 H5159）。BH 說這裡用雅各很有意思，因為這位先祖的名字後來改為以色列，代表整個民族；所分得的產業一語表示這是刻意的揀選與具法律效力的認領，正如支派之間分地一樣。"
  "relation": "本章沒有記雅各本人的任何事，只借他的名字指整個民族，用來說明耶和華自己分到的那一份是什麼。"
