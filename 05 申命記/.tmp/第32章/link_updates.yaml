- "title": "亞倫"
  "path": "link_folder/人物/亞倫.md"
  "summary": "第50節神對摩西說「像你哥哥亞倫死在何珥山上，歸他的列祖一樣」。CT 的原文字義給「亞倫」的是帶來光的人，又說亞倫能在123歲的時候登上何珥山的山頂，摩西能在120歲登上尼波山的山頂，表明他們都是身體硬朗地被神接走的。KC\
    \ 說神也用亞倫之死的回憶來緩和摩西面對死亡的痛苦：摩西當時在場（民20:28），那必定是一場莊重而使他印象深刻的告別。BH 說亞倫像摩西一樣因違命不得進入應許之地，兩兄弟都死在山上，成為對照。第51節的「你們」也把亞倫一起算進米利巴水那件事裡。"
  "relation": "本章沒有亞倫的行動，只有他的死被拿來當摩西之死的樣板；同一節也順帶說明兩兄弟受的是同一個判決。"
