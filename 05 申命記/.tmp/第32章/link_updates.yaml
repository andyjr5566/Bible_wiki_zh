    - !!int "31"
    "definition": "keep"
    "development": "keep"
- "title": "約但河"
  "path": "link_folder/地點/約但河.md"
  "summary": "第47節「因為這不是虛空、與你們無關的事，乃是你們的生命；在你們過約但河要得為業的地上必因這事日子得以長久」。CT 說意指在迦南地居住的日子得以長久。GT《啟導本聖經申命記註釋》說摩西要百姓明白律法不是無足重輕的事物，而是他們的生命，遵行律法才能在神賜的土地上活得長久。BH\
    \ 說約但河是曠野與應許之地之間地理上與象徵上的分界，過約但河代表從飄流時期轉入神應許的成就。"
  "relation": "先前十九章多半把約但河當界線與行程節點；本章把它接到一個條件上——過河之後日子能不能長久，取決於這首歌與這律法有沒有被放在心上。"
  "overview_review":
