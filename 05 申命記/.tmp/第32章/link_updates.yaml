- "title": "摩西之歌"
  "path": "link_folder/神學/摩西之歌.md"
  "summary": "本章就是申31:19、22、30 預告的那首歌的歌詞本身，第44節說摩西和嫩的兒子約書亞去將這歌的一切話說給百姓聽。CT 的內容綱要把全歌分成六段：序言呼天喚地（1-3）、追述神恩與忘恩負義（4-18）、惹動神怒降災被擄（19-35）、神以憐憫使其脫離仇敵之手（36-43）、朗讀歌詞並勸守律法（44-47）、神命摩西上尼波山（48-52）。GT《聖經精讀本──申命記註解》稱它為見證之歌，說此歌的真正目的是預先防止以色列的墮落、墮落時使其認識到審判的原因正是自己所犯的罪孽、最後使其悔改重新歸向神的懷抱。GT《啟導本聖經申命記註釋》說天與地為神最永久的造物，被召來聽詩中的話語。KC\
    \ 說這是一首教育之歌，在其中我們學到兩件常遇見的事：我們自己是誰，神是誰；他又說這首歌描述以色列的全部歷史連同未來，從起源、被神建立與接納，到忘恩背道、被交給外邦、再被神接納，直到在千年國度裡的祝福與榮耀。雷建生《申命記解讀》說摩西不但是偉大的先知，也善於教百姓唱歌，他作過三次曉諭以後將信息改為歌唱的方式。"
  "relation": "出15 收的是過紅海之後的凱歌，申31 收的是這首歌的命令與功能；本章收的是歌詞本身。三處合起來，摩西之歌這個名稱底下實際上有兩首歌，本章是臨終那一首。"
  "overview_review":
    "signals": []
    "accumulation_count":
