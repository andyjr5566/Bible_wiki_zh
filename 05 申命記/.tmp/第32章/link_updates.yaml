- "title": "呼天喚地作見證（ud）"
  "path": "link_folder/主題/呼天喚地作見證（ud）.md"
  "summary": "第1節是摩西之歌的開場：「諸天哪，側耳，我要說話；願地也聽我口中的言語。」CT 說「側耳」原文是「聽、留心聽」，是本歌的第一個字，摩西呼喚天地側耳傾聽他所寫的歌，表示此歌極其重要。GT《聖經精讀本──申命記註解》說在序言部分摩西使用了極其莊嚴的語句，尤其是選擇天地作證人，欲以此強調此歌的不變性及宇宙性重大意義；GT《申命記串珠聖經註釋》說摩西以喚醒天地的口吻為始，表明天地就是此歌的無聲見證人；GT《啟導本聖經申命記註釋》說呼喚天地為這詩歌中的話作見證，並列出申4:26、31:28\
    \ 與賽1:2、彌6:1-2。KC 說天與地都被牽進這首歌裡，因為摩西所帶來的教導關乎整個宇宙。BH 說這呼應了先知傳統，先知常呼召受造界為神的話作見證，並把它接到申30:19\
    \ 呼天喚地見證生死之選的立約語言。"
  "relation": "前三次都是摩西在散文裡把天地叫來作證；本章是唯一一次把同一個動作放在詩歌的第一句，讓天地成為整首歌的聽眾。"
