- "title": "摩西"
  "path": "link_folder/人物/摩西.md"
  "summary": "第44至47節摩西和嫩的兒子約書亞把這歌的一切話說給百姓聽，摩西接著勸他們把警教的話放在心上、吩咐子孫謹守遵行；第48至52節神吩咐他上尼波山，並宣告他必死在那山上、不得進入迦南。CT\
    \ 的原文字義給「摩西」的是被拉的，並說神讓摩西往山上去觀看，一面是讓他看清楚神所要做的，一面也是藉著觀看來履行認領應許之地的法律手續。KC 說摩西把這首歌說完並應用到聽者的良心上之後，他作為百姓領袖的任務就結束了；他又說摩西在自己的一生中就是這百姓將要遭遇之事的寫照。BH\
    \ 說摩西臨近一生與領導職分的終點，他與約書亞同來標誌著領導權的交接。"
  "relation": "這是摩西在申命記裡最後一次開口。歌唱完、話說完，同一天神就叫他上山；本章把他的職分、他的過犯與他的結局收在同一段裡。"
