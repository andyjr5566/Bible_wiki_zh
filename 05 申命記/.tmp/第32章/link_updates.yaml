- "title": "約書亞"
  "path": "link_folder/人物/約書亞.md"
  "summary": "第44節「摩西和嫩的兒子約書亞去將這歌的一切話說給百姓聽」。CT 說「約書亞」原文是何西阿，這是約書亞原來的名字（參民13:16），原文字義給「約書亞」的是拯救、給「嫩」的是魚、後裔。GT《申命記雷氏研讀本》說「約書亞」或作何西阿，並要讀者參看民數記13章16節的腳註；GT《聖經精讀本──申命記註解》說何西阿是約書亞的縮字型，何西阿意指拯救。BH\
    \ 說約書亞是摩西所指定、神所揀選的繼承人（民27:18-23），他的在場也顯出神對以色列計畫的延續。"
  "relation": "申31 記的是按立與囑咐；本章讓他與摩西一同站在百姓面前把歌唱完，交接在這裡不是宣告，而是同台的一個動作。"
