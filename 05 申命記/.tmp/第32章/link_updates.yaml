  "summary": "第49節「觀看我所要賜給以色列人為業的迦南地」，第52節「我所賜給以色列人的地，你可以遠遠地觀看，卻不得進去」。CT 說「觀看」指肉眼目睹，不是指在異象中看見；又說神讓摩西往山上去觀看迦南地，一面是讓他看清楚神所要做的，一面也是藉著觀看來履行認領應許之地的法律手續。GT《啟導本聖經申命記註釋》說摩西眺望著迦南，稱頌神守約的信實。BH\
    \ 說迦南是神應許給亞伯拉罕和他後裔的地，代表神立約的成就；從尼波山觀看那地標誌著從應許到得著的過渡，雖然摩西自己不得進去。KC 說神為了減輕摩西的痛苦，在恩典中賜給這位忠心的僕人這一眼。"
  "relation": "先前三十章談的都是誰要進去、界線在哪裡、進去以後怎麼住；本章談的是一個看得見卻進不去的人，把應許之地的重量從地理換成了盼望。"
  "overview_review":
    "signals":
    - "first_in_book"
    "accumulation_count":
