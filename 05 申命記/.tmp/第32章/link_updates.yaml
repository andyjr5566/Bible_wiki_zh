  "path": "link_folder/原文/那地不得潔淨（ki.pher）.md"
  "summary": "第43節末「潔淨他的地，救贖他的百姓」用的正是本條目那個動詞。STEP 顯示這裡是 ve./khi.Per（H3722A，簡要詞典義 ki.pher:\
    \ to atone，本節譯義 he will make atonement for），受詞是 ad.ma.T/o（H127G a.da.mah: land:\
    \ soil）與 a.M/o（H5971A）。CT 說原文的意思是救贖他的地和百姓，表明神不但要恢復人，也要恢復地，並說當以色列人回歸迦南地，從前流血玷污的地得以潔淨。GT《聖經精讀本──申命記註解》說「救贖」具有「遮掩」或「和睦」之意，又說審判可以是警告或懲罰罪的手段，卻不是恢復與和睦的手段，若要重新恢復因罪作神仇敵的以色列並使之與神和好，流血的贖罪行為是必不可缺的（希伯來書9章22節）。KC\
    \ 在這一節直接引民數記35章33節，說地與受造界上有流血的罪，要在同一個工作的根據上得潔淨，並引歌羅西書1章19至20節。BH 說地與百姓得潔淨表示潔淨與復興。"
  "relation": "民35:33 用的是這個動詞的被動式，說地因流血而不得贖；本章用的是同一個動詞的主動式，主詞換成神自己，說他要為他的地贖罪。KC 在本節直接回頭引民35:33，把兩處接成同一條線。"
