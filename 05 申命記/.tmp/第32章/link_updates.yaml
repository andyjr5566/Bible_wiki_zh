    "development": "keep"
- "title": "作見證的歌（shi.rah 與 ed）"
  "path": "link_folder/原文/作見證的歌（shi.rah 與 ed）.md"
  "summary": "申31:19、21 說這首歌要作見證，本章第45至47節是摩西唱完後的收束：「摩西向以色列眾人說完了這一切的話，又說：我今日所警教你們的，你們都要放在心上」。CT\
    \ 說「警教」原文是「作證」，意指慎重地轉述神的話。第47節把份量講到底：「因為這不是虛空、與你們無關的事，乃是你們的生命」。GT《聖經精讀本──申命記註解》說摩西在照神的命令作此歌之後，再一次勸勉百姓要順服律法，重新闡明了順服就是生命、不順服就是死亡。GT《啟導本聖經申命記註釋》說摩西要百姓明白律法不是無足重輕的事物，而是他們的生命。KC\
    \ 說這幾節是歌中神的統治與下一章各支派祝福中神的計畫之間的過渡，歌的內容是失去之福的復還。BH 說公開誦讀顯出神與以色列立約關係的群體性，全體百姓必須聽見並明白這些話。"
