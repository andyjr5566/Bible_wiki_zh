  "summary": "第22節「因為在我怒中有火燒起，直燒到極深的陰間，把地和地的出產盡都焚燒，山的根基也燒著了」。CT 說「極深的陰間」原文是最低層的陰間，形容神的怒火極其深切。GT《啟導本聖經申命記註釋》說陰間為舊約中死人去處的總稱（創37:35）；GT《聖經精讀本──申命記註解》說在舊約時代對死亡世界的啟示尚不明確，因此舊約聖經所說的陰間指所有死人所居住的地下世界，內中包括義人與惡人，故本節意味著因其巨大的憤怒，神徹底的審判將會波及到地下。BH\
    \ 說陰間在古希伯來人的理解裡是死人的居所、是黑暗與隔絕之地，這句話表示神的審判無所不至、無處可逃，並引詩篇139篇8節。"
