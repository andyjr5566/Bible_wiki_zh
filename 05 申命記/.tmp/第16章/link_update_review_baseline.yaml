- title: 司法公義
  path: link_folder/神學/司法公義.md
  definition: 出二十三1-9 是約書中最集中討論司法的一段。GT《聖經精讀本》為它定調：「要體現一個社會的正義與否，最重要的是司法部門應該體現神的公義，進行公正的審判，絕不能允許根據權力和各方面的壓力而審判……因為法庭的墮落將會導致社會正義的崩潰。」BH
    也指出這裡的「公義」（mishpat）意味著公平、公正與律法的正當施行，反映神自己作為公義審判者的性情。
  development: 這段勸告的三個具體危險是隨眾、偏袒與賄賂。GT《丁道爾聖經註釋》就賄賂說：「賄賂是文化仍未調和的社會中經常存在的危險。任何以色列的審判官都必須在此站穩立場」，並舉撒母耳的兒子在這件事上失敗為例。KC
    則指出被影響的人不只是法官：「事實上人人都要作判斷，不只是為此設立的審判官。」
