- title: 住棚節（利23節期規定）
  path: link_folder/歷史/住棚節（利23節期規定）.md
  definition: '利未記23:33-43：七月十五日起守節七日，第一日與第八日都是聖安息，百姓要住在棚裡七天。


    **丁良才列出住棚節的五種特點**：是為酬恩（因收藏土產已完）；是最歡樂的節期；是紀念以色列人出埃及的事；有特別的獻祭法；預表以色列人將來所要得的安樂。


    **第八日在節期以內還是以外，丁良才給了四層證據說是以外**：聖經屢次說住棚節只有七天；到第七日下午以色列人就不再住在所搭的棚內；第八天的祭和前七天所獻的不同；猶太人在第八天不行前七天所行的打水禮。他並說明這日「可說是完畢節或終止節，因為是完畢神為以色列人所定一年有聖會的節期」，只是因為與七天相連，「所以有時也稱為住棚節的末日（約7:37）」。


    **兩項第二聖殿時期的儀式，丁良才記得很細。** 一是打水禮：每天黎明有一位祭司提著金壺往城外西羅亞池打水，音樂隊和百姓隨行，回到聖殿後與提酒的祭司同時把水和酒倒進祭壇上兩個底部有小孔的銀碗，七日天天如此。二是點燈：聖殿婦女院有四架金燈檯、每臺四盞大金燈，年幼的祭司每晚點著，「甚至滿城都能望得見這燈所發的光亮，這是要叫人紀念那在曠野引導以色列人的火柱」；有人拿著火把繞燈檯跳舞唱詩，利未人在十五級臺階上作樂。他並記下有註釋家認為主耶穌正是看見這些燈檯才說「我是世界的光」。


    **規模與紀念的內容。** GT 啟導本記下所獻祭牲「達189隻之多」，並說明節期正值秋收；雷氏研讀本給的數字相同。v43 說明理由：紀念神領以色列人出埃及時曾使他們住在棚裡。丁良才注意到一個用詞上的細節：「聖書上論以色列人在曠野的住處，除了本處以外，是單用『帳幕』兩個字，從沒有一次用這『棚』字。」他並指出這些棚「不是用曠野之灌木的枝條所搭的，乃是用迦南地美好的樹枝搭成的」。


    KC 讀出的是國度的預表：葡萄與橄欖的收成是這節期的緣由，酒是喜樂的圖畫、油是聖靈的圖畫，而第八日「展望永恆」。'
  development: '住棚節是全年最後也最長的節期，丁良才因此稱第八日為「完畢節或終止節」。它同時掛著三條線：農事上是收藏節（出23:16、34:22），歷史上紀念曠野住棚（v43），末世上各家都指向將來的安樂。


    GT 雷氏研讀本引撒迦利亞書14:16 指出這節期「也會在千禧年的時候舉行」；丁良才的第五個特點同樣引亞14:9-21。所羅門聖殿的獻殿禮（王上8:65）也在這節舉行，GT《舊約聖經背景註釋》與
    CT 都記下這一點。'
  signals:
  - first_in_book
  accumulation_count:
  - 2
  - 3
- title: 三大節期
  path: link_folder/神學/三大節期.md
  definition: 出二十三14-17 立下一年三次朝見神的規定，三個節期是除酵節、收割節、收藏節。GT《啟導本聖經腳註》指出這三個是七個節期的代表：「摩西律法中所定以色列人的宗教節期共有七個（利二十三章），以其中三個為代表。『除酵節』和『逾越節』屬同一個節期；『收割節』包括了『初熟節』和『七七節』在內。『收藏節』也包括了『吹角節』和『住棚節』。」
  development: CT 注意到守節的時間全落在收割期，因此本身就是信心的操練。GT《聖經精讀本》則說明制定節期的目的：「通過遵守節期來教訓人們，不僅過去被神救贖，而且至今仍是由於神而活著，以後還要與神同活。」KC
    也說節期使神成為他們生活的中心，別神便失去吸引力。
