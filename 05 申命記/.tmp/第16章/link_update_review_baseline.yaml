- title: 不可看人的外貌（na.khar）
  path: link_folder/原文/不可看人的外貌（na.khar）.md
  definition: '申命記1:17 對審判官下了三道禁令，其中兩道在原文都用到同一個字：臉。


    **原文結構。** STEP 原文資料顯示：


    | 和合本 | 原文 | Extended Strong | 形態 | STEP 本節譯義 |

    |---|---|---|---|---|

    | 不可看人的外貌 | lo''- ta.Ki.ru fa.Nim | H5234A ＋ H6440N | Hiphil 未完成 2mp ＋ 陽性複數 |
    you will pay regard to ＋ faces |

    | 不可懼怕人 | lo'' ta.Gu.ru mi./pe.nei- ''Ish | H1481C ＋ H6440L | Qal 未完成 2mp | you
    will be afraid ＋ of the face of |


    H5234A 的簡要詞典義是 na.khar: to recognize，H6440N／H6440L 是 pa.neh（臉、面）。字面上，這句話是「不可認臉」；下半句「不可懼怕人」則是「不可懼怕人的臉」。


    CT 給的原文字義與此相合：「外貌」＝面，臉；「貴」＝巨大的；「賤」＝小的，低微的。CT 並說明「看人的外貌」和「分貴賤」意思相同，即根據其身分地位。


    **三道禁令是一組。** CT 把三者串起來：不可按外貌、不可分貴賤、不可懼怕人（畏於權勢）。KC 把同一段列成審判官的四個條件，其中前三條正是這三道禁令，第四條是承認有些案件太難、要送到摩西那裡。


    **BH 的對照。** BH 指出偏袒在聖經裡一再被禁止（利19:15、雅2:1-9），而在古代近東，司法系統往往偏向有錢有勢的人，以色列被要求的標準與此不同；並把「聽訟不可分貴賤」接到出23:3、箴22:2。


    **另一個相關的原文細節。** 同節「若有難斷的案件」，STEP 顯示是 ha./da.Var ''a.Sher yik.Sheh（H1697L davar「word:
    case」＋H7185 qashah「to harden」），字面是「那件太硬的事」。CT 原文字義給「難斷」＝困難、「案件」＝言論，事件。'
