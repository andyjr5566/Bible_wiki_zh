- title: 無酵節
  path: link_folder/歷史/無酵節.md
  definition: 出埃及記12:15-20, 39 所記載，與逾越節同晚設立、為期七日的節期——從正月十四日晚上到二十一日晚上，以色列人要吃無酵餅、從各家中除去酵、凡吃有酵之物的必從以色列中剪除。CT
    指出酵在聖經中意味著罪和不良的教訓（林前5:8；太16:12）。BH 說明第17節「我正當這日把你們的軍隊從埃及地領出來」正是這節期的理由：它記念以色列人匆促離開埃及、來不及讓麵發起。第39節補記了這件事的實況——他們用埃及帶出來的生麵烤成無酵餅，因為被催逼離開、不能耽延。頭一日與第七日當有聖會，除了預備各人所要吃的以外，無論何工都不可做（第16節）。
  development: '**酵是怎麼一回事。** GT《舊約聖經背景註釋》說明當時的作法：酵來自麵團中的大麥成分，「每次在麵團中留下少許，發酵後加在下次的麵團中，以促進發酵過程。如果沒有留下這種『引酵劑』，整個過程就得從頭開始」，而要達到合適的發酵程度需時七至十二日。丁道爾補了一個很實際的猜想：這規矩「可能是衛生法則，每年都要從零開始，將摶麵盆刮洗乾淨」——木造的盆到了年底「即使不危害健康，也氣味難當」。


    **酵未必都是壞的。** GT《每日研經叢書》提醒：酵母因為結果通常是變壞，「在後來的猶太教與新約通常都有一種壞的意思。但是利未記七章十四節；廿三章十七節所論，卻表明並非一定如此」。丁道爾也說，在聖經裡酵有可能代表腐敗以及發酵過程的蔓延，「但只有新約才明確說出這個關連（太十六6；林前五6～8）」。


    **「剪除」有多重。** GT《串珠聖經註釋》說這是「被驅出團體。雖非死刑，卻是極厲害的責罰」。丁道爾說得更細：「這人若在沙漠被逐出以色列的營外，可能導致死亡。它雖非死刑，卻似乎預期有神的審判隨之而來。」


    **新約的引用。** 林前5:7-8「我們逾越節的羔羊基督已經被殺獻祭了。所以，我們守這節不可用舊酵……只用誠實真正的無酵餅」——丁道爾指出這裡把新的開端與邪惡的含義綜合起來了。'
  signals:
  - first_in_book
  accumulation_count:
  - 3
  - 4
- title: 無酵餅
  path: link_folder/原文/無酵餅.md
  definition: 出埃及記12:8, 15, 17, 18, 20, 39 多次提及。GT《丁道爾》記下它今日的樣子：「時至今日，逾越節前後任何猶太商店，都可以買到包裝好的無酵餅（英文通常寫作
    matzos）。」本章v8逾越節當夜與苦菜同吃、v15-20七日內要吃無酵餅、除酵、剪除吃酵者、v39以色列人帶出的生麵未發起烤成無酵餅。CT指出v39是歷史上第一次無酵餅的產生——因被催逼不能耽延、生麵未發起。BH指出酵在聖經表罪與敗壞影響——無酵餅表「分別為聖」的生活。新約林前5:7-8「我們逾越節的羔羊基督...所以守這節不可用舊酵...只用誠實真正的無酵餅」。
