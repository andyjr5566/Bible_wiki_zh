- title: 七七節（五旬節）
  path: link_folder/歷史/七七節（五旬節）.md
  definition: '七七節是逾越節後數算七週、在第五十日舉行的收割節，因此後來又稱五旬節。民數記28:26先用三個標誌辨認這一天：莊稼初熟、獻新素祭、舉行聖會並停止勞碌的工；第27-31節再列明加獻兩隻公牛、一隻公羊、七隻一歲羊羔和一隻公山羊，以及相配的素祭。


    STEP 顯示第26節「七七節」使用 H7620G shavuot「週」的複數形並帶第二人稱複數後綴；「初熟」是 H1061 bikkurim；「新的」是
    H2319H chadash 的陰性單數形，用來修飾 H4503G minchah「素祭」。這些原文資料確認節名、初熟與新收成供物的詞彙關係，不能單獨推出後來的歷史或基督教解讀。


    | 解讀層次 | 本章可說的內容 |

    |---|---|

    | 經文直接規定 | 初熟之日獻新素祭、召集聖會、停止日常勞動並加獻祭物 |

    | 摩西五經互文 | 利未記23章說明數算七個安息日並獻兩個有酵餅；本章集中補足公共祭物數量 |

    | 猶太傳統 | GT《背景註釋》和 BibleHub 記錄五旬節與西乃山頒律法相連的傳統 |

    | 新約互文 | GT、KingComments 與 BibleHub 把使徒行傳2章聖靈降臨放在五旬節的延伸脈絡中 |


    後兩層是後來的傳統和互文發展，不是 H7620G 的字典義。它們應與本章直接呈現的收割、初熟、群體聖會和公共獻祭分層閱讀。'
  development: 出埃及記稱它為收割節，利未記23章說明從初熟禾捆次日數算五十日並獻兩個有酵餅；民數記28章列出這一天額外的公共祭物。猶太傳統後來把它與西乃山頒律法相連，新約使徒行傳2章則記載聖靈在五旬節降臨，形成跨經卷的節期發展。
  signals:
