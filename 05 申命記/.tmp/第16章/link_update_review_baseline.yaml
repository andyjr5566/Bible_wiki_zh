- title: 審判不可行不義按公義審判
  path: link_folder/主題/審判不可行不義按公義審判.md
  definition: '審判的時候不可行不義，不可偏護窮人，也不可重看有勢力的人，只要按公義審判鄰舍（v15）。


    值得注意的是它禁止的偏袒有兩個方向。CT 說，這是對審判官和百姓官長的警戒——不論對方身分如何，都不可影響你的判斷。GT 丁良才把兩邊都講明：不可因犯法的人貧窮就衛護他，也不可因他富足有勢力就偏重他，更不可收受賄賂以致傷害無辜。BH
    也指出，窮人固然容易在司法中被剝削，但貧窮同樣不能成為改變判決的理由。


    GT《啟導本》歸納為一句話：不可基於社會或經濟的理由妨礙司法公正。KC 引約沙法設立審判官時說的話作正面例子：「你們應當敬畏耶和華，謹慎辦事，因為耶和華我們的神沒有不義，不偏待人，也不受賄賂」（代下19:7）。


    STEP 顯示原文在這裡用了兩個「臉」的說法：「不可偏護窮人」直譯是「不可抬起窮人的臉」，「不可重看有勢力的人」用的動詞是 ha.dar（H1921，尊崇）。同一個動詞在本章第32節再出現一次，那裡卻是命令——「也要尊敬老人」。同一個動作，在法庭上禁止，在白髮人面前卻是本分。'
  development: '公正審判是律法書一再重申的要求。GT 丁良才指向出埃及記23:1-9 的整段規定，GT《精讀本》再加上申命記16:18-20 設立審判官的條例。判準始終一樣：不可按外貌斷案，總要按公平斷定是非（約7:24）。


    新約把同一個要求搬進教會生活。GT 丁良才與 KC 都引雅各書：「你們若按外貌待人，便是犯罪，被律法定為犯法的」（雅2:9）；雅各所舉的例子正是照衣著把人分等級。GT《精讀本》另把這條原則接到末後——神必在聖潔中按公義施行審判。'
