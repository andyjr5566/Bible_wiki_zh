- title: 多多地給不可空手而去（a.naq、re.qam）
  path: link_folder/原文/多多地給不可空手而去（a.naq、re.qam）.md
  definition: '奴僕服滿六年可以走，這一點出埃及記就有了。申命記第十五章第13至14節加上的是走的時候要帶什麼：「你任他自由的時候，不可使他空手而去，要從你羊群、禾場、酒醡之中多多地給他」。


    STEP 顯示「空手」是 rei.Kam（H7387，簡要詞典義 re.qam: emptily）；「多多地給」是 ha.''a.Neik 加 ta.''a.Nik（H6059，簡要詞典義
    a.naq: to ornament），前一個是不定詞絕對式、後一個是未完成式，同一字根連寫兩次。


    **這個字的畫面感很強。** CT 的原文字義註「多多地給(原文雙同字)」作華麗的項鍊(比喻多多地給)——也就是說，這個動詞的字根與頸上的飾物有關，用來形容給的分量。STEP
    的簡要詞典義 to ornament 指的是同一件事。CT 又註「空手」原文意指徒然勞力，並解釋這一條的用意：本句表示奴僕服事了六年之後，主人總得幫助他有創業立足的機會，才算沒有徒然勞力。


    **給什麼，經文列了三樣。** GT《聖經精讀本》把它們分別對應：羊群代表牲畜、禾場指禾穀、酒醡則代表水果。STEP 的三個字分別是 mi./Tzo.ne./kha（H6629G，簡要詞典義
    tson: flock）、ga.re.ne./Kha（H1637，簡要詞典義 go.ren: threshing floor）、yik.Ve./cha（H3342，簡要詞典義
    ye.qev: wine）。BH 說這三樣正是古代以色列財富與生計的主要來源——牲畜、穀物、酒——所以這條命令涵蓋的是全部家業，不是零頭。


    **給多少，經文交給主人自己判斷。** 第14節下半說：「耶和華─你的神怎樣賜福與你，你也要照樣給他。」CT 解為以神對待自己的心腸，來對待離開的僕人。KC
    說被釋放的奴僕要帶著滿手離開，而他所得的取決於主人怎樣看待耶和華給他的祝福；他並補上一個實際的理由——透過這個奴僕，主人賺了不少；如果同樣的工作要雇人來做，花費會是兩倍。


    **第15節給的是根據。** 「要記念你在埃及地作過奴僕，耶和華─你的神將你救贖」。CT 從這裡讀出一個次序：人只有看見自己一切的所有都是神的恩典，才有可能以感恩的心與別人分享恩典。KC
    說的是同一件事——百姓自己離開埃及時也是滿載禮物出來的，神就是這樣做的。'
