  path: link_folder/歷史/城門口公共場合.md
  summary: '本章四次出現這個字（v5「各城中」、v11 與 v14「你城裡」、v18「各城裡」），STEP 都是 sha.ar（H8179H，簡要詞典義 sha.ar: gate: town）。第18節把審判官與官長設在這裡：「你要在耶和華─你神所賜的各城裡，按著各支派設立審判官和官長。」GT《啟導本聖經申命記註釋》說各城須設立審判官和協助他的官長。KC 說在應許之地公義是在城門口宣告的，而審判官的人數也會按各城的居民人數而定，並指摩西在這裡規定的是下級法庭怎麼設立——不是每一件事都要送到最高的那一級。'
