- title: 司法公義
  path: link_folder/神學/司法公義.md
  summary: v18 下半「他們必按公義的審判判斷百姓」與 v20「你要追求至公至義」，STEP 分別為 mish.pat- Tze.dek（H4941G＋H6664G）與 Tze.dek Tze.dek（H6664G 連寫兩次）加 tir.Dof（H7291）。CT〔靈意註解〕說表徵神喜悅人行事合乎神公義的手續，話中之光說保守在神的公義中，和他們承受地土有直接的關係。GT《聖經精讀本》說一語扼要摩西審判律例的根本精神就是基於神的公義精神，並說在這種意義上司法部門應當成為那時代社會正義的堡壘，又列出歪曲審判的三個要素。KC 說第18至20節列的是神自己定下的標準，蓄意偏離那個標準就是屈枉正直。
