- title: 為奴之家
  path: link_folder/主題/為奴之家.md
  summary: v12「你也要記念你在埃及作過奴僕。你要謹守遵行這些律例」。CT〔文意註解〕說意指藉著紀念先祖從前也曾度過貧困、悲慘的日子，轉而顧念自己周遭那些貧困、無依無靠的人們，如此守節乃是遵行律例的最好表現。GT《聖經精讀本》說在以色列社會所舉行的所有感恩慶典中，百姓當與貧窮的鄰人一起歡喜，這是因為以色列百姓當紀念自己在埃及為奴之時的悲慘生活，懷著對賜下如此豐盛恩典之神的感激之情。BH 說對為奴的記憶是要培養謙卑與感恩，並成為以公義與憐憫待人的道德要求。
