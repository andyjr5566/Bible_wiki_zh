- title: 在耶和華面前歡樂
  path: link_folder/主題/在耶和華面前歡樂.md
  summary: v11「都要在耶和華─你神所選擇立為他名的居所，在耶和華─你的神面前歡樂」、v14「都要歡樂」、v15「你就非常地歡樂」。CT〔原文字義〕註「歡樂」歡喜，快樂；「非常地歡樂」愉快的，高興的，並說『非常地歡樂』指極度地、確實地歡喜快樂。GT《申命記串珠聖經註釋》說「都要歡樂」：這是守住棚節的特色（12:18）。KC 說這一段以第3節的困苦之餅開頭、以第15節的完全歡樂結尾，並說歡樂的結果是要與周圍不如自己的人一同分享。
