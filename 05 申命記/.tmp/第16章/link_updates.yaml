- title: 古代近東賄賂
  path: link_folder/背景/古代近東賄賂.md
  summary: 'v19「也不可受賄賂；因為賄賂能叫智慧人的眼變瞎了」，STEP 為 ti.Kach Sho.chad（H3947H＋H7810，簡要詞典義 sha.chad: bribe）。BH 說賄賂在古代是常見的作法，常被用來影響判決、扭曲司法，因此這條禁令是防腐的保障，用以保住領袖與審判官的正直，並引箴17:23 說惡人暗中受賄以歪曲公理。GT《聖經精讀本》把受賄列為歪曲審判的三個要素之一（出23:8）。CT 說任何不正當的金錢授受，一定會蒙蔽人的心眼，叫人無法分辨是非曲直。'
