- title: 箴17：23
  path: link_folder/互文/箴17：23.md
  summary: 'v19 末句「又能顛倒義人的話」，STEP 為 vi./sa.Lef（H5557，簡要詞典義 sa.laph: to pervert）加 div.Rei tza.di.Kim（H1697L＋H6662）。BH 在本節明引箴17:23，說惡人暗中受賄以歪曲公理，正是既有條目由出23:8 建立的那一條線。CT〔文意註解〕說本句有二意：使公義的審判官作出不公正的判決，或使公義之人的見證變成虛假的見證；GT《申命記串珠聖經註釋》說這句或作「又能叫義人說假話」。'
  relation: 這個節點原是從出二十三8 建立的。本章第19節是律法書裡同一句話的第二次出現，而且措辭更完整——出埃及記那一處說的是「賄賂能叫明眼人變瞎了，又能顛倒義人的話」，本章把明眼人換成了智慧人。箴17:23 則是同一組用語在智慧書中的回聲。
