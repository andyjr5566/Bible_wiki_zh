- title: 亞舍拉（木偶）
  path: link_folder/背景/亞舍拉（木偶）.md
  summary: 'v21「你為耶和華─你的神築壇，不可在壇旁栽什麼樹木作為木偶」，STEP 為 ti.Ta''（H5193，簡要詞典義 na.ta: to plant）加 ''a.she.Rah（H842，簡要詞典義 a.she.rah: Asherah）加 ''Etz（H6086H）加 ''E.tzel miz.Bach（H681＋H4196）。CT〔原文字義〕註「木偶」樹叢(偶像崇拜用)，文意註解說『木偶』指代表異教的偶像假神，由樹幹雕成。GT《申命記雷氏研讀本》說「木偶」指亞舍拉的柱像；GT 收馬唐納《申命記》說耶和華的壇最終放在耶路撒冷的聖殿裡，那裡難以種樹，但可以樹立一個偶像的象徵，而後來確實出現了（王下二三6）。BH 說亞舍拉是迦南的女神，與生育有關，常與巴力一同受敬拜。'
