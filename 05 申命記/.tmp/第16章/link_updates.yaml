- title: 柱像
  path: link_folder/原文/柱像.md
  summary: 'v22「也不可為自己設立柱像；這是耶和華─你神所恨惡的」，STEP 為 ta.Kim（H6965I，簡要詞典義 qum: to arise: establish）加 ma.tze.Vah（H4676，簡要詞典義 mats.tse.vah: pillar），「恨惡」是 sa.Ne''（H8130，簡要詞典義 sa.ne: to hate）。CT〔原文字義〕註「柱像」樹墩，柱子(紀念物)；「恨惡」恨惡，懷恨，文意註解說指刻有一些符號或形像的石柱。GT《啟導本聖經申命記註釋》說「柱像」指男神巴力的石柱像；GT《申命記串珠聖經註釋》說木偶和柱像都是異教之神的象徵物。BH 說在古代近東，這類立石常被當成敬拜對象或紀念神明的標記。'
  relation: 本章與木偶配成一對：一個是木頭做的、屬女神，一個是石頭立的、屬男神。經文對兩者的措辭不同——木偶只說不可栽，柱像則加上一句評語：這是耶和華─你神所恨惡的。
