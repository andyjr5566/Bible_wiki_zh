  evidence: 第29節「隱祕的事是屬耶和華─我們神的；惟有明顯的事是永遠屬我們和我們子孫的」。GT《聖經精讀本──申命記註解》說本節明確地顯示了神的主權與啟示的漸進性，要求人勤奮研究明顯的事並教授給後人，並告知人隱祕的事在神的主權之下；它並指出使徒保羅在論到猶太人的背叛與恢復的講話結尾亦作了這番與摩西相同的告白（羅十一33至36）。KC
    說神已經藉著新約的光，把這裡所說的隱祕之事顯明給我們。
