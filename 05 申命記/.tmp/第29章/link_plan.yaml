  evidence: '第12節「為要你順從耶和華─你神今日與你所立的約，向你所起的誓」。STEP：le./''a.ve.re./Kha（H5674A，簡要詞典義
    a.var: to pass）bi/v.Rit（H1285，簡要詞典義 be.rit: covenant），字面是為要你進入他的約裡；立約的動詞是 ko.Ret（H3772H，簡要詞典義
    ka.rat: to cut，砍）。CT 的原文字義給「順從」的是逾越、通過，並說原文指通過劈開的祭物當中，表示誓約的成立（參創十五17）；他在話中之光另說「為要你順從」原文是「為要你進入」。GT《聖經精讀本──申命記註解》說「順從」具有進入或通過的意思，此詞源於在古代社會立約的雙方作為約的擔保，將牲畜劈成兩半、兩個人一起從被劈開的牲畜之間走過的習慣。BH
    說這個聚集的目的就是進入與神所立的約。'
  surfaces:
