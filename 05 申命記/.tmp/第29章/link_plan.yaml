- name: 心能明白眼能看見耳能聽見
  suggested_type: 主題
  evidence: 第4節「但耶和華到今日沒有使你們心能明白，眼能看見，耳能聽見」。CT 說本節並非表示神的無能，而是詫異以色列人見過那些神蹟奇事之後仍不能醒悟過來，彷彿眼瞎耳聾的人一樣。GT《申命記雷氏研讀本》說百姓看不見神為他們所做的一切的意義；GT《啟導本聖經申命記註釋》說這是說以色列人的頑梗不化、不聽神的話，並指保羅曾引用此經文來說明神並不棄絕人（羅十一7至8）；GT《聖經精讀本──申命記註解》特別提醒若錯誤地解釋本節就會誤認為以色列的無知與頑梗都是神的責任，但本節所指並非如此，乃是悖論性地警戒、責備了以色列。KC
    說這並不是因為耶和華不願意給，而是因為他們不要；他們從來沒有求他給。BH 說這裡的瞎與聾不是身體的，而是屬靈的遲鈍。
