- name: 惡根生出苦菜和茵蔯（rosh 與 la.a.nah）
  suggested_type: 原文
  evidence: '第18節「又怕你們中間有惡根生出苦菜和茵蔯來」。STEP：Sho.resh（H8328，簡要詞典義 she.resh: root）po.Reh（H6509，簡要詞典義
    pa.rah: be fruitful）rosh（H7219，簡要詞典義 rosh: poison）ve./la.''a.Nah（H3939，簡要詞典義 la.a.nah:
    wormwood）。CT 的原文字義給「惡根」的是根、給「茵蔯」的是茵蔯與苦毒（隱喻），並說惡根原文是根、指潛在的因素，苦菜和茵蔯是味苦具有毒性的植物，借用來形容不良後果。GT《啟導本聖經申命記註釋》特別指出此處的苦菜實為一種毒果，與出埃及記十二8的苦菜不同，後者無毒、是逾越節必吃的；並說本節末句最好譯為又苦又毒的果子。GT《申命記雷氏研讀本》說苦菜和茵蔯分別是有毒和苦澀的植物，一個拜偶像的人或群體能影響整個民族，類似的警告可見於希伯來書十二章15節。KC
    說茵蔯或苦膽是一種極苦的植物之名，並說這種毒像鴉片一樣起作用，因此曾被用來使受刑的人麻醉（太27:34）。BH 說根的比喻指某種看不見卻會生長蔓延的東西，毒果與苦果代表拜偶像與不忠帶來的毀壞。'
