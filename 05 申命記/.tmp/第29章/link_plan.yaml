  suggested_type: 神學
  evidence: '第29節「隱祕的事是屬耶和華─我們神的；惟有明顯的事是永遠屬我們和我們子孫的，好叫我們遵行這律法上的一切話」。STEP 顯示這兩個詞是成對的被動分詞：ha./nis.ta.Rot（H5641，簡要詞典義
    sa.tar: to hide）與 ve./ha./nig.Lot（H1540H，簡要詞典義 ga.lah: to reveal），都是陰性複數。CT 說隱祕的事指尚未被神啟示出來的事、或已在神的安排中但還未發生的事；明顯的事指已經啟示出來的事、或已經發生的事。GT《申命記雷氏研讀本》說這節重要的經文定下神啟示的界限和目的：有某些事情神選擇不說出來，而他所啟示的就是要他子民遵守的事情。GT《聖經精讀本──申命記註解》說本節明確地顯示了神的主權與啟示的漸進性，要求人勤奮研究明顯的事並教授給後人，並告知人隱祕的事在神的主權之下。KC
    的讀法比較特別：他把隱祕的事讀成神若必須因全民違背律法而懲罰他們時，仍對餘民施恩的作為，並說下一章就會顯出其中一些。BH 說明顯的事包括摩西的律法、先知的教訓，以及最終在新約裡耶穌基督的啟示。'
  surfaces:
  - phrase: 隱祕的事
    verses:
    - 29
  target_path: link_folder/神學/隱祕的事與明顯的事（sa.tar 與 ga.lah）.md
