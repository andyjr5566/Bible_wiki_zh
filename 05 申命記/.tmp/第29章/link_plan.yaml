- name: 劈柴挑水的人
  suggested_type: 文化
  evidence: 第10至11節列出站在耶和華面前的人，最後兩類是「營中寄居的」與「為你們劈柴挑水的人」。CT 說營中寄居的指自願隨以色列人飄流在曠野的外族人，劈柴挑水的人指服役的奴僕，並推測寄居的可能是與以色列人一起出埃及的外邦人（出十二38），劈柴挑水的可能是以色列人的外邦奴僕（書九21）。GT《申命記串珠聖經註釋》說劈柴挑水的人是社會的下層階級；GT《聖經精讀本──申命記註解》說本文以具體的例子明確論及不分男女老少、身份的貴賤、地位的高下及民族和血統，只要居住在以色列共同體內的人皆可以無差別地參與耶和華的聖約，並說在將身份乃至血統視為神聖的古代社會，這足以說是劃時代性事件。BH
    說砍柴挑水是常派給非以色列人或社會地位較低者的雜役，把他們納入立約儀式表示這約不分身分與職業。
