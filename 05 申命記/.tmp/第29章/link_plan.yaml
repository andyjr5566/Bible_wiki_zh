- name: 衣服沒有穿破鞋沒有穿壞（ba.lah）
  suggested_type: 原文
  evidence: '第5節「我領你們在曠野四十年，你們身上的衣服並沒有穿破，腳上的鞋也沒有穿壞」。STEP 顯示衣服與鞋用的是同一個動詞的兩種形態：va.Lu（H1086，第三人稱複數）與
    val.Tah（同一個 H1086，第三人稱陰性單數），簡要詞典義 ba.lah: to become old；CT 的原文字義也說「穿破」與「穿壞」原文同字。CT
    說這是形容不缺衣受寒，也不赤腳受磨，表示神的看顧無微不至（參申八4）。GT《聖經精讀本──申命記註解》說以色列的四十年曠野史是神慈愛與恩典的歷史。GT 另指出曠野的環境非常惡劣，衣服、鞋子幾年就會損壞，但百姓卻衣服沒有破、鞋沒有壞。KC
    說出埃及以來四十年，他們的衣服和鞋子沒有受到任何損壞。BH 說在曠野那樣嚴苛的環境下，任何物品都會很快磨損，這種保存是神超自然的介入。'
  surfaces:
