- "title": "漸進式的啟示"
  "path": "link_folder/神學/漸進式的啟示.md"
  "summary": "第29節「隱祕的事是屬耶和華─我們神的；惟有明顯的事是永遠屬我們和我們子孫的」。STEP 顯示這是同形態的兩個陰性複數被動分詞：ha./nis.ta.Rot（H5641，簡要詞典義 sa.tar: to hide）與 ve./ha./nig.Lot（H1540H，簡要詞典義 ga.lah: to reveal）。GT《聖經精讀本──申命記註解》說本節明確地顯示了神的主權與啟示的漸進性，要求人勤奮研究明顯的事並教授給後人，並告知人隱祕的事在神的主權之下，並指使徒保羅在論到猶太人的背叛與恢復的講話結尾亦作了這番與摩西相同的告白（羅十一33至36）；GT《申命記雷氏研讀本》說這節定下神啟示的界限和目的；KC 說神已藉著新約的光把這裡所說的隱祕之事顯明給我們。"
