- "title": "這約是與哪一代人立的"
  "path": "link_folder/解經爭議/這約是與哪一代人立的.md"
  "summary": "第14至15節「我不但與你們立這約，起這誓，凡與我們一同站在耶和華─我們神面前的，並今日不在我們這裡的人，我也與他們立這約，起這誓」。CT 說這意指包括不在場的人，即指年幼或缺席的以色列人以及某些寄居的和奴隸，並說立約不是只為當時活著而站在神面前的人，而是包括以後要來的人和在別處的人，因為神是永遠的神；GT《申命記串珠聖經註釋》說「今日不在我們這裡的人」指未出生的後代；GT《啟導本聖經申命記註釋》說第10至15節是全體以色列人、包括現在和將來的世代一同在神面前重申誓約；GT《聖經精讀本──申命記註解》說聖約的物件超越時空而無限擴大；KC 說連那些還在百姓腰中的人、將要來的世代都被包括在內；BH 說這把約延伸到未來的世代。"
