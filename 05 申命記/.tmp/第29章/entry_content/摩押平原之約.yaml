  chapter: 29
  summary: '第1節「這是耶和華在摩押地吩咐摩西與以色列人立約的話，是在他和他們於何烈山所立的約之外」。CT 說聖經學者將此約稱作巴勒斯坦之約，並說「之外」意指以西乃之約為基礎、加以重申和擴充；GT《雷氏》用同一名字並說它是附加在何烈山的摩西之約上；GT《啟導本》說神歷代所立之約都以西奈之約為基礎；GT《精讀本》說這並非指聖約的內容有所更新，而是指立約的物件有所改變，何烈山之約與摩押平地之約是本質上相同的約；KC 判斷相反，說這是一個額外的約、不是舊約的更新，並說它把列祖之約的恩典與何烈山之約的律法結合在一起；BH 說這是西奈之約的更新與擴充、不是取代。STEP：第12節立約動詞 ko.Ret（H3772H ka.rat），百姓那一邊是 le./''a.ve.re./Kha（H5674A a.var，進入）。'
  relation: '這一章的全部內容都掛在這個約上：第2至9節是立約前的回顧，第10至15節是立約的對象與範圍，第16至28節是背約的後果，第29節是立約之後人該做什麼。四套來源在這究竟是同一個約還是另一個約上的分歧，是本章最值得記下的一處。'
