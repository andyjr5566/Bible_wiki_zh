- title: 亞伯拉罕之約
  path: link_folder/神學/亞伯拉罕之約.md
  definition: 神與亞伯蘭所立的約（創十二1-3），包含七層應許。此約是整本舊約的轉捩點——在此之前是全人類的記錄，在此之後以以色列民族為焦點。
  development: '### 七層應許


    1. **必叫你成為大國**（2節）— 肉體後裔如塵沙多，屬靈後裔如眾星

    2. **必賜福給你**（2節）— 屬世和屬靈的福

    3. **叫你的名為大**（2節）— 「多國的父」「先知」「尊大的王子」「神的僕人」「神的朋友」

    4. **你也要叫別人得福**（2節）

    5. **為你祝福的，我必賜福與他**（3節）

    6. **那咒詛你的，我必咒詛他**（3節）

    7. **地上的萬族都要因你得福**（3節）— 應驗在基督身上


    ### 亞伯蘭放棄的三樣 ↔ 神回應的三樣


    - 本地 → **土地**（迦南地）

    - 本族 → **後裔**（大國）

    - 父家 → **祝福**（叫別人得福）


    這組對照出自 GT《聖經精讀本──創世記註解》：「亞伯蘭所放棄的三樣——本地,本族,父家,神以三樣應許——土地、後裔、祝福回應他。」


    ### 他放棄的是什麼？古代社會的實際代價


    GT《舊約背景註釋》把「離開父家」的份量講得很具體，這是靈訓層面容易略過的一層。〈創十二1 父家〉指出：「男子在古代世界中的地位，是作為父親家中的一份子。在一家之主死後，承繼人便得承襲其身分和責任。這地位亦與祖業和土地認同。**亞伯蘭離開父家，就是放棄了得到祖業和家產的權利。**」


    〈創十二1 立約應許〉接著說明為何土地與子孫正是他所交出的兩樣：「土地、家族、祖業都是古代社會最重要的因素。對農夫和牧人來說，土地就是生計。對城市人來說，土地代表他們政治上的地位。而子孫代表將來；兒女在父母年老時供給他們，使家系延續一代。他們能安葬父母，並且光宗耀祖。在一部分古代近東文化中，這是安享來生的必要條件。」結論一句最重：「亞伯拉罕放棄在父家之地位，同時亦自我剝奪了這些保障，**把生死、地位、將來、保障，全都放在耶和華手中**。」


    換句話說，神所應許的土地與後裔，正是亞伯蘭順服時親手交出去的那兩樣——約的內容與他所付的代價是同一組東西。


    ### 與巴別塔的對照


    CT 注意到一組刻意的呼應：巴別的人說「傳揚我們的名」（創十一4）卻不得其果，而從未求名的亞伯蘭，神卻說「叫你的名為大」（創十二2）。GT《聖經精讀本》把話說得更滿：「那些為了宣揚自己名字而建造傲慢巴別塔的人，歷史上根本找不著蹤影」，因此「人的名譽和權威唯獨來自神」。BH
    也指出同一點：亞伯蘭的偉大不是自造的，而是神所賜的。


    ### 約的重申


    此約至少相隔24年四次重申：創十二4；十三14-17；十五1-21；十七1-8


    ### 與[[挪亞之約]]的對比


    - 挪亞之約：神對全人類和一切活物的應許

    - 亞伯拉罕之約：神藉一個人使萬族得福


    ### 這約怎麼撐過四百年的沉默期


    從創12章立約到出埃及，中間隔了四百多年的寄居與為奴——GT《聖經精讀本》指出這段期限本身就是約的一部分：神按創15:13-16 的預言把居住期限定在四百三十年，「直到迦南地罪惡滿盈為止」，約瑟兄弟們原以為只住到饑荒結束，神卻另有法算。出2:24
    是這約在出埃及記裡第一次被提起——「神聽見他們的哀聲，就記念祂與亞伯拉罕、以撒、雅各所立的約」，GT《丁道爾聖經註釋》把這一節放進全書的骨架：「古以色列的眼中，整個救恩史可以歸納為『應許和成就』：神應許、神記念、神施行拯救。」利26:42、45
    神應許被擄後仍要「記念我與雅各所立的約，與以撒所立的約，與亞伯拉罕所立的約」——GT《聖經精讀本》說百姓正是根據這份應許祈求神的憐憫（出32:13；申9:27），而這約的核心終究是基督（創12:3；22:17-18；加3:16）。


    ### 到了申命記，這約變成一份即將兌現的清單


    創世記到民數記的累積裡，這約多半以「應許」和「記念」的形式出現——神應許、神記念、神施行拯救。申6 換了一種寫法：全章三次講到進入那地，每一次都補上神向列祖起過誓（第10、18、23節，STEP
    皆為 nish.Ba''，H7650），而三次後面接的都是具體的東西。第10節接的是城邑房屋水井葡萄園，第18節接的是那美地，第23節接的是父親要對兒子說的話。


    KC 特別點出這個重複，並說當神用起誓來確認自己的話，是為了在人的軟弱上加一層確據。他並把聖經裡神起誓的場合數成四次，而且每一次都扣著那地：創22:16-18
    因應許之子被獻上而應許眾多後裔與萬族得福，詩95:11 起誓背離的百姓必不得進入，詩110:1,4 在神右手邊的那一位身上成就應許，賽45:23 則指向基督掌權時萬膝跪拜、悔改的餘民在那地。申6
    的三次起誓就落在這條線上。這一點與利26:42 的「記念」形成對照：被擄的處境裡需要的是神記得，進地的前夕需要的是神起過誓——同一個約，在不同處境裡被拿出來用的那一面並不相同。


    申6:10 把這約的名單具名念了出來——亞伯拉罕、以撒、雅各三個名字並列，替後面第18節與第23節兩次不指名的「你列祖」定義了範圍。到這一步，約已經不是遠方的應許，而是下一代要接手的產業，所以它才會出現在第20至25節那段父子問答的答案裡。'
