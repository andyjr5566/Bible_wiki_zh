- title: 塗抹（ma.chah）
  path: link_folder/原文/塗抹（ma.chah）.md
  definition: '申命記第二十五章有兩處講到把一個名字抹掉，一處在開頭那半章，一處在結尾三節。STEP 顯示它們用的是同一個動詞。


    ### 同一個字，兩個相反的方向


    - 第6節：婦人生的長子必歸死兄的名下，免得他的名在以色列中塗抹了。STEP 顯示這裡是 yi.ma.Cheh（H4229A，簡要詞典義 ma.chah:
    to wipe），被動語態，主詞是死者的名。

    - 第19節：那時，你要將亞瑪力的名號從天下塗抹了，不可忘記。STEP 顯示這裡是 tim.Cheh（H4229A），主動語態的第二人稱，命令以色列去做這件事。


    CT 的原文字義給第6節的「塗抹」是擦去、消滅，文意註解說『名…塗抹』指後繼無人。BH 對第6節的說法相同：一個名字被抹掉，意味著一個人的傳承與紀念從群體中被除去；在以色列社會裡，被記得是與人的尊榮、與在神和百姓面前的地位連在一起的。BH
    對第19節的說法則是：這個命令表示徹底而完全的毀滅。


    同一個動詞，一次是要防止，一次是要執行。第6節整條叔嫂婚姻的制度，就是為了不讓一個以色列人的名被 ma.chah；第19節則要以色列人親手把亞瑪力的名 ma.chah
    掉。CT 的話中之光正是從這個對照收全章的：神既永遠紀念被管教的百姓、紀念牲畜、紀念沒有後代的人、紀念活出公義的人，也永遠紀念該被追討的亞瑪力人。


    ### 第19節抹掉的是什麼


    第19節的受詞值得看清楚。STEP 顯示和合本譯作「名號」的字是 Ze.kher（H2143，簡要詞典義 ze.kher: memorial），而不是第6節的
    shem（H8034，名）。CT 的原文字義給「名號」的正是記念物。


    這個字和第17節的動詞同一個字根。第17節「你要記念」是 za.Khor（H2142 zakhar），第19節「不可忘記」是 tish.Kach（H7911
    shakhach）。整段三節的原文結構是：以色列要 zakhar，亞瑪力的 zekher 要被抹去，而以色列不可 shakhach。


    KC 對第19節的判語是：對這個仇敵的判決，是要藉著完全的審判把牠的記念徹底抹去；他並把它與挪亞時代的洪水、所多瑪蛾摩拉的傾覆焚燒相比（創6:5-7；18:20-21；19:24-25）。CT
    則指出這道命令的執行拖了很久：神這個除滅亞瑪力人的命令，要等到希西家王年間才由西緬支派的人實現（參代上四41~43）。


    出埃及記17:14 早已用同一句話宣告過同一件事——「我要將亞瑪力的名號從天下全然塗抹了」——那裡是神自己說要做，這裡是交給以色列去做。CT 在第19節的話中之光就是這樣讀的：神宣告祂必世世代代和亞瑪力人爭戰（出十七16），而交給百姓的責任，就是要將亞瑪力的名號從天下塗抹了，不可忘記。'
