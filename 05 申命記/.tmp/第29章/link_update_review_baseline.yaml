- title: 這約是與哪一代人立的
  path: link_folder/解經爭議/這約是與哪一代人立的.md
  definition: '申命記第五章第3節說：「這約不是與我們列祖立的，乃是與我們今日在這裡存活之人立的。」摩西講這句話的時候，何烈山頒律已經過了四十年，站在他面前的多半是當年還是孩子、甚至還沒出生的人。這句話因此擺出兩個問題：「列祖」指誰，以及「不是……乃是」到底是排除還是強調。


    **「列祖」指誰。** CT 直接把它定成族長：『列祖』指亞伯拉罕、以撒、雅各；『我們』指當代以色列人。KC 的讀法一樣，說耶和華立這約的對象不是亞伯拉罕、以撒、雅各這幾位先祖，而是一群祂已經救贖出來的百姓。BH
    則把範圍放寬，說「fathers」既指列祖，也指那因悖逆而倒斃曠野的上一代（民14:29-35）。


    **「不是……乃是」是排除還是強調。** GT《申命記雷氏研讀本》把兩種可能並列寫出來：「本節的意思可能是（1）這約不但賜予昔日在西乃山的人，也賜予正在聽摩西講話的這一代人；或（2）西乃之約不是賜給列祖的（他們有亞伯拉罕之約；比較四31），而是賜給那些從埃及地出來的人（五6）」。第一種讀法把重點放在「延伸」，第二種放在「區別」。


    GT《啟導本聖經申命記註釋》選的是延伸這一路，並且說得最完整：神與上一代在何烈山所立的約，不因當日在場的人現已不在而失效，他們是全民的代表，這約乃與亞伯拉罕、以撒、雅各的後裔所立；「這約不單賜給出埃及的一代，也給以後的世世代代，對現在存活之人繼續有效，完全適用」。GT《申命記串珠聖經註釋》講得更短：「摩西強調神不單是和列祖立約，並且也和他當時的聽眾立約」——一個「不單……並且」，等於把第3節讀成加法而不是減法。


    KC 從人數上補了一個具體理由：摩西當面對著講話的這批人，在何烈山那時都還不到二十歲，儘管如此，他們代表了當時在何烈山的那群人。


    **原文能確認到哪裡。** STEP 顯示第3節的「列祖」是 ''a.vo.Tei./nu（H1G，簡要詞典義 father），「存活」是 chai.Yim（H2416A，簡要詞典義
    alive）；第2、3節的「立約」兩次都是 ka.Rat（H3772H，簡要詞典義 to cut: make(covenant)）加 be.Rit（H1285）。原文只告訴我們用字相同、對象換了人稱，「不是……乃是」該讀成排除還是強調，仍要由上下文和註釋判斷。


    CT 在話中之光裡給了第三個角度，把爭議轉成時間觀的問題：從受時間限制的人來說，這約明明是和四十年前的上一代立的，但不受時間限制的神卻清楚表明，這約是和「存活的人立的」；死了的列祖過去了，活著的人就和約有了直接的關係。'
