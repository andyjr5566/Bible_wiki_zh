- title: 漸進式的啟示
  path: link_folder/神學/漸進式的啟示.md
  definition: 漸進式的啟示（progressive revelation）指神在救贖歷史中分階段頒下命令，後來的命令可以取代先前的命令，而神的道德標準本身並未改變。GT
    所收賈斯樂郝威《聖經難解經文詮釋手冊》〈命題27〉以創世記為例提出這個概念：神造亞當後只命令他吃「一切結種子的菜蔬，和一切樹上所結有核的果子」（創一29），沒有提到肉；挪亞出方舟後卻被告知「凡活著的動物，都可以作你們的食物，這一切我都賜給你們如同菜蔬一樣」（創九3）。兩處命令看似矛盾，實則屬前後階段。賈斯樂郝威的判準很明確：「在此，並未牽連到任何實質道德標準的改變（因為神的本性不變）；在漸進式的救贖過程中，為了祂的受造物達到對祂事奉的一切目的，神有權改變對祂受造物的命令。」
  development: '這個概念的價值在於它劃出了一條界線：**改變的是命令，不變的是神的本性**。賈斯樂郝威用一個家庭的比喻把階段性說清楚——起先父母允許幼童用手拿東西吃，後來小孩稍長，父母要求他們用湯匙，等到再長成少年，父母要求用刀叉；「在整個小孩成長的過程中，父母的命令並沒有衝突」，變的只是隨情況遞變而來的要求。

    用這條界線讀創世記九章，可以看出准許吃肉與禁止吃血是同一次頒布中的兩件事，性質卻不同。**准許吃肉**是階段性的改變，屬漸進式啟示；**不可吃帶血的肉**則是同時新立的限制，GT《舊約背景註釋》指它「是聖經獨有的，古代世界沒有一個地方有相似的例證」。丁道爾對此的判斷是：對人而言吃肉是「神新容讓的事」，而「對於血的規定，才是全新的項目，在神學上意義十分深遠」——也就是說，這一節裡真正的新東西不是餐桌上多了肉，是生命歸屬權被明文標示出來。

    丁道爾另外提醒，准許吃肉「可能是一項新措施，也可能不是」：也許從前就是暗示的，只到現在才明言。這一點值得保留，因為它讓漸進式啟示不必被推得太遠——經文明確記錄的是命令的頒布，不必然等於人類飲食史的轉折點。'
