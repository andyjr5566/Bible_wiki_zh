- name: 敗壞與滅絕同一字根（sha.chat）
  type: 原文
  evidence: '第29節：「我知道我死後，你們必全然敗壞，偏離我所吩咐你們的道。」STEP 顯示這是 hash.Chet tash.chi.Tu/n（H7843，Hiphil，簡要詞典義 sha.chat: to ruin），不定詞絕對式加未完成式的加重寫法，本節譯義是 certainly to act corruptly 加 you will act corruptly；這正是申4:25「敗壞自己」與申4:31「不滅絕你」的同一個 H7843，本章第29節把它用在摩西對將來的預告上。「偏離」是 ve./sar.Tem（H5493I，簡要詞典義 sur: to turn aside），「日後」是 be./''a.cha.Rit hai./ya.Mim（H319 a.cha.rit: end 加 H3117G），「惹他發怒」是 le./hakh.''i.S/o（H3707，簡要詞典義 ka.as: to provoke）。CT 說摩西看透以色列人敗壞的本性，知道他們遲早會偏離正路，並把偏離正途的結果列成三項：行為邪惡、惹神發怒、招來禍患。GT《聖經精讀本──申命記註解》特別解釋「日後」：字面意義是「在那些日子的末後」，然而此詞並非指歷史的終結，而是單指「將來」的慣用語。GT《啟導本聖經申命記註釋》說「以手所作的」指偶像。KC 注意到第29節這番話與保羅在以弗所向長老告別的話（徒20:29）有顯著的呼應：摩西與保羅在告別的講話裡，都對自己一生所擺上的那群人的真實光景看得很透，也都說了關於自己離世之後那個群體會怎麼發展的預言性話語，而兩次都應驗了。BH 說這種道德與屬靈的全面下滑在士師記那一段歷史裡反覆出現。'
- name: 約書亞承接摩西
  type: 事件
  evidence: '第7至8節與第14、23節。第7節「摩西召了約書亞來，在以色列眾人眼前對他說」，第14節神叫兩人站在會幕裡由他親自囑咐，第23節是耶和華直接對約書亞說話。STEP 顯示第7節的「召」是 va/i.yik.Ra（H7121G），場合是 le./''ei.Nei khol Yis.ra.''El（在全以色列的眼前），交代的任務是 tan.chi.Le./nah（H5157，Hiphil，簡要詞典義 na.chal: to inherit，本節譯義 you will give as an inheritance it）。CT 說「召了約書亞來」是正式當眾任命新領袖，並把約書亞的兩大任務列出來：帶領以色列人攻佔迦南地，以及分配迦南地給各支派作為他們的產業。GT《啟導本聖經申命記註釋》說摩西早已在大祭司和會眾面前立約書亞繼他領導全民，現在囑咐約書亞率民進入應許美地，正式交托領袖的責任。GT《聖經精讀本──申命記註解》說這是摩西在以色列總會面前正式將自己的權力移交給繼承人，而他所說的激勵之言就是耶和華必與你同在，這是摩西藉著自己的40年曠野經驗所悟到的真理。KC 說摩西告別，卻沒有把百姓丟給他們自己；他帶著愛把領導權交出去，聽不到一句抱怨或責備。BH 說這次公開宣告是要全民認出並接受新領袖，也顯出權力交接的透明與可問責。'
  surfaces:
  - phrase: '摩西召了約書亞來'
    verses:
    - 7
- name: 摩西與約書亞的權柄差異
  type: 主題
  evidence: '第23節：「耶和華囑咐嫩的兒子約書亞說：你當剛強壯膽，因為你必領以色列人進我所起誓應許他們的地；我必與你同在。」STEP 顯示這一節的說話者是 Yah.weh 本身，而不是摩西——與第7節摩西對約書亞說話的場面剛好成對。GT《申命記雷氏研讀本》一句話點出差別：約書亞直接受命於神。GT《聖經精讀本──申命記註解》說這是摩西的繼承人約書亞直接從神領受以色列之統率權的場面，從神委任並激勵約書亞的話語中可以認識到實際引領以色列進入應許之地的主體正是耶和華神。CT 在話中之光說，凡神自己呼召的僕人，神不會讓他們靠著自己在各種難處中剛強壯膽，而是會清清楚楚地向他們啟示自己的同在和心意，消除他們心中的一切疑慮。KC 說在預言了百姓的偏離之後，約書亞需要再一次被鼓勵，而這一次是耶和華親自做的。'
  surfaces:
  - phrase: '耶和華囑咐嫩的兒子約書亞'
    verses:
    - 23
- name: 約書亞
  type: 人物
  evidence: '本章是約書亞正式接棒的一章：第3節說他必引導百姓過去，第7節摩西當眾任命他，第14節神叫他與摩西站在會幕裡，第23節耶和華親自囑咐他。STEP 顯示他的名字是 ye.ho.Shu.a（H3091G），第23節連名帶父名寫作嫩的兒子約書亞。CT 說第14節「約書亞」的原文字義是耶和華是拯救，並說第3節是介紹神所揀選的新領袖。GT《申命記雷氏研讀本》補上他的資歷：很久以前約書亞已經帶領軍隊（出十七9），而最近他更獲賜摩西的一些權力（民二七18~23）。KC 說在約書亞身上我們看見主耶穌藉著聖靈帶領他百姓的一幅圖畫。BH 說約書亞的名字意思是耶和華是拯救，並說他先前是摩西的助手與軍事領袖。'
- name: 摩西
  type: 人物
  evidence: '本章從頭到尾是摩西的最後一段工作：他告訴眾人自己一百二十歲了、不能照常出入（2節），當眾任命約書亞（7節），寫出律法交給祭司與長老（9節），奉命寫一篇歌並教導百姓（19、22節），把律法書交給利未人放在約櫃旁（24至26節），最後把這一篇歌的話都說與以色列全會眾聽（30節）。GT《聖經精讀本──申命記註解》把這一段定位為摩西的最後事工，說本文描繪了摩西知道自己的去日不遠，便竭盡全力完成神委任他之事的場面，其主要業績是對繼承人委任領袖權、記錄傳授律法、告別之歌與宣告的祝福。GT 另說摩西在此的舉止再一次使我們認識到他是何等地愛以色列百姓，同時也能看到真正的領袖與牧者的形象。GT《啟導本聖經申命記註釋》說雖然摩西即將離世，但他所關心的卻不是個人的後事，而是盡完最後的責任。CT 在話中之光說摩西雖不得過約但河，但他單單注意神自己，所以並不再計較這些地上的榮辱得失，而是鼓勵百姓前往承受應許。'
- name: 出入（領袖用語）
  type: 原文
  evidence: '第2節「不能照常出入」。STEP 顯示這是 la./Tzet ve./la./Vo（H3318G ya.tsa: to come out 加 H935G bo: to come），兩個動詞的不定詞並列。CT 說「出入」是意指「正常地擔當事工」或「精力旺盛地作工」的慣用語（參書十四11；撒上十二2），故這話暗示他在世的年日即將告終，不能再帶領百姓進入迦南。GT《聖經精讀本──申命記註解》給的說法相同，並同樣引書14:11 與撒上12:2 作為這個慣用語的旁證。GT《申命記雷氏研讀本》補一句：在體能上摩西是可以做到的（三四7），但神已經禁止他與百姓一起進入應許地。'
- name: 約櫃
  type: 主題
  evidence: '第9節說律法交給「抬耶和華約櫃的祭司利未子孫」，第25至26節說吩咐抬約櫃的利未人把律法書放在約櫃旁。STEP 顯示是 ''a.Ron be.Rit Yah.weh（H727 a.ron: ark 加 H1285 be.rit: covenant），抬的動詞是 ha./No.se.''Im（H5375H，簡要詞典義 na.sa: to lift: bear）。CT 說約櫃裡面放著盛有嗎哪的金罐、亞倫發芽的杖與刻有十誡的兩塊石版，約櫃外面則放著律法書；他並說第25節吩咐的是利未支派哥轄的子孫。KC 注意到一個細節：抬約櫃通常是利未人的職責（民4:15），在特別的場合才由祭司來抬（書3:3-8；6:6；代上15:11-12）。BH 說約櫃是以色列最神聖的器物，象徵神在百姓中間的同在。'
- name: 會幕（帳幕整體）
  type: 主題
  evidence: '第14至15節。神吩咐摩西與約書亞站在會幕裡，耶和華就在會幕裡的雲柱中顯現。STEP 顯示是 ''O.hel mo.''Ed（H168G o.hel: tent 加 H4150I mo.ed: meeting）。CT 說會幕是神和人相會的地方，一般會眾是在會幕門口與神相會、聽神說話，而這裡所說的「會幕裡」大概就是在聖所中，不是至聖所。GT《聖經精讀本──申命記註解》說以色列人處理或公佈重要問題時會聚集在聖幕前面，會幕此名正是來自於此。GT 引華爾頓《申命記背景注釋》說出埃及記的聖幕建成之前，會幕是位於營外作為啟示之處，然而聖幕現已啟用，並且也稱會幕。KC 說這是本卷書唯一一次提到會幕，也是本卷書唯一一次神的顯現；他並說真正的領導總是從在聖所裡、在主面前的一次特別注視開始，然後才能出去執行所交付的任務。GT《申命記雷氏研讀本》說此時是神最後一次在地上面對面與摩西說話。STEP 顯示兩人「站」的動詞是 ve./hit.ya.tze.Vu 與 va/i.yit.ya.tze.Vu（H3320，簡要詞典義 ya.tsav: to stand），「顯現」是 va/i.ye.Ra（H7200G，Niphal，本節譯義 he appeared）。'
- name: 雲柱火柱
  type: 歷史
  evidence: '第15節「耶和華在會幕裡雲柱中顯現，雲柱停在會幕門以上」。STEP 顯示是 ''a.Mud ''a.Nan（H5982G am.mud: pillar 加 H6051 a.nan: cloud），停住的動詞是 va/i.ya.''a.Mod（H5975G）。CT 說這句話顯示雲柱是在會幕裡而神是在雲柱中，並從裡外兩個視角解釋雲柱的位置。GT《啟導本聖經申命記註釋》說雲柱停在會幕門以上是向百姓表明神自己在作安排，好讓他們清清楚楚地知道自己是在跟從神、而不是跟從人。KC 說這是申命記全卷唯一一次神的顯現。GT 引華爾頓《申命記背景注釋》給了古代世界的背景：在古代世界，神明有光輝或火焰圍繞是很平常的信念；亞喀得語用梅嵐穆一語來描述這種神明榮耀可見的彰顯，這種彰顯通常是在煙或雲籠罩之下的；有人認為梅嵐穆的概念在迦南神話中是用阿南一語表達，與本節譯作「雲」的希伯來字眼相同，只是這字在聖經中的出現次數又少、意義又隱晦，因此不能太有把握。BH 說雲柱從出埃及記13章21至22節起就是神同在、保護與引導的記號。'
- name: 豁免（she.mit.tah）
  type: 原文
  evidence: '第10節「每逢七年的末一年，就在豁免年的定期住棚節的時候」。STEP 顯示是 she.Nat ha./she.mi.Tah（H8059，簡要詞典義 she.mit.tah: remission）。CT 說每逢七年的末一年即指安息年，豁免年亦即安息年，以色列人在那一年須豁免債務（參申十五1~11）並釋放奴隸（參申十五12~18）。GT《啟導本聖經申命記註釋》說這裡規定每逢七年的末一年，也就是豁免年的住棚節時，要舉行莊嚴的儀式，重申與神立的約。KC 說宣讀要在豁免債務的那一年、也就是安息年，並在收完全部莊稼之後所守的住棚節舉行，那是宣讀整部律法最合適的時候。BH 說豁免年的希伯來詞就是 Shemitah，那一年債務得以免除，反映神的憐憫與恩典。'
- name: 住棚節（利23節期規定）
  type: 歷史
  evidence: '第10節把宣讀律法的時間定在豁免年的住棚節。STEP 顯示是 be./Chag ha./su.Kot（H2282 chag: feast 加 H5521 suk.kah: booth）。CT 說住棚節每年七月十五日起守節七天（參利二十三33~43），表徵享受國度裡的安息。KC 說住棚節是在全部收成都收進來之後守的，並說安息年與住棚節都說到和平的國度：那是神一切應許都成就、各人住在自己原有產業裡的時候。KC 另注意到人的組成不同：在住棚節那一年，不只男丁在場（申16:16），婦女與孩子也一同前來。BH 說住棚節是以色列三大朝聖節期之一，紀念曠野的行程與神的供應。'
- name: 寄居的
  type: 原文
  evidence: '第12節把宣讀律法的對象列出來：男、女、孩子，並城裡寄居的。STEP 顯示是 ve./ge.re./Kha ''a.Sher bi/sh.''a.Rei./kha（H1616 ger: sojourner 加 H8179G sha.ar: gate），字面是在你城門內你的寄居者。CT 說這是指使眾百姓來過節並聽講律法（參尼八1，10）。BH 說把外人一併列入，凸顯這個立約群體的開放：不論性別、年齡或族裔，凡住在其中的都要來聽，這與神應許萬國都因亞伯拉罕的後裔得福是同一個方向。'
- name: 敬畏神
  type: 神學
  evidence: '第12至13節連著出現兩次：使他們聽、使他們學習，好敬畏耶和華你們的神；也使他們未曾曉得這律法的兒女得以聽見，學習敬畏耶和華你們的神。STEP 顯示第12節是 ve./ya.re.''U（H3372H，簡要詞典義 ya.re: to fear: revere），而聽與學是 yish.me.''U（H8085G）與 yil.me.Du（H3925H）。CT 把第12節的程序整理成六步：招聚、使聽、學習、敬畏神、謹守、遵行；他並在話中之光說不管他們經過了多少個七年，神都要他們一遍又一遍地聆聽律法，才能保持敬畏的心。BH 說這裡的敬畏不是恐懼，而是承認神的聖潔與主權，並引箴言9章10節說敬畏耶和華是智慧的開端。'
- name: 硬著頸項的百姓
  type: 神學
  evidence: '第27節：「因為我知道你們是悖逆的，是硬著頸項的。我今日還活著與你們同在，你們尚且悖逆耶和華，何況我死後呢？」STEP 顯示「悖逆」用了兩個相關的字：名詞 mer.ye./Kha（H4805H，簡要詞典義 me.ri: rebellion）與分詞 mam.Rim（H4784，簡要詞典義 ma.rah: to rebel）；「硬著頸項」是 ''a.re.pe./Kha ha./ka.Sheh（H6203 o.reph: neck 加 H7186 qa.sheh: severe）。CT 說硬著頸項意指剛硬、倔強、頑梗，如同不肯負軛的公牛（參出三十二9；三十三3；三十四9）；他並說對方還活著時人多少會顧念他的臉面，死了就會少一層的顧慮。KC 注意到摩西講他們的悖逆時，說的不是他們悖逆他，而是悖逆耶和華——對耶和華所做的，在他看來比對他自己所做的更重。BH 說硬著頸項的比喻來自不肯被軛引導的牛，並說摩西的在場曾是一種約束的力量。'
- name: 呼天喚地作見證（ud）
  type: 主題
  evidence: '第28節：「你們要將你們支派的眾長老和官長都招聚了來，我好將這些話說與他們聽，並呼天喚地見證他們的不是。」STEP 顯示動詞是 ve./''a.''I.dah（H5749B，Hiphil，簡要詞典義 ud: to testify，本節譯義 so I may call as witnesses），見證人是 ha./sha.Ma.yim 與 ha./''a.Retz（H8064 加 H776G）。CT 說呼天喚地以天地作見證人，表明所說的話非常重要。GT《啟導本聖經申命記註釋》在這裡要讀者參看三十19 的註。KC 提出兩種理解：一是天地指天上與地上的居民、人與天使，他們都會同意這首歌所講的真理；二是天地在這裡被當作人格化的見證人，因為天地由神的話托住並被引到他所定的目標，它們並不違抗神。BH 說召天地作見證是聖經常見的手法，申4:26 與賽1:2 都用過，凸顯這約的莊重與普世性。'
- name: 摩西之歌
  type: 神學
  evidence: '第19至22節與第30節：神吩咐摩西寫一篇歌，當日摩西就寫了，最後把這一篇歌的話都說與以色列全會眾聽。這首歌的內容記在三十二章。GT《申命記串珠聖經註釋》把它與出埃及記十五章那一首放在一起比較：在以色列人過紅海後，摩西曾向耶和華唱出勝利的凱歌；現在這首歌也一如前者，以耶和華的名字（屬性）為主題，述說他的慈愛、公義和憐憫；所不同的是這歌是摩西臨終之言。GT《啟導本聖經申命記註釋》把三十二章那首歌分成八部分：引言呼召天地見證並宣告神名、質詢和指控、追述耶和華神的好處、指出以色列人的背逆、宣佈全民被滅的處罰、轉機以色列民可獲拯救、耶和華神的應許、要以色列人感謝神。KC 說在律法書之後接著來的是這首歌，兩者合成一個整體：他的書裡有神的定旨，他的歌裡有他警告與施恩的作為；他並說這是一首悲傷的歌，卻以神恩典的得勝收尾。'
  surfaces:
  - phrase: '摩西就寫了一篇歌'
    verses:
    - 22
- name: 心裡偏離與被勾引（pa.nah 與 na.dach）
  type: 原文
  evidence: '第18節「因他們偏向別神所行的一切惡」與第20節「就必偏向別神，事奉他們」。STEP 顯示第18節的「偏向」是 fa.Nah（H6437G，簡要詞典義 pa.nah: to turn），與申30:17 那句「倘若你心裡偏離」用的是同一個動詞（那裡的字形是 yif.Neh）。CT 說這意指以色列人咎由自取，一切都因偏向假神、惹怒真神。GT《聖經精讀本──申命記註解》在第16節說隨從外邦神行邪淫這句話指出了迦南地不道德的拜偶像行為，同時暗示了拜偶像的行為就是背叛與耶和華所立慈愛之約的行為，追根究底是喪失耶和華信仰之純潔性的屬靈淫亂行為。BH 說第20節點出一個順序：先是吃得飽足、身體肥胖，然後才是轉向別神——豐足本身就是一場屬靈的考驗。'
  surfaces:
  - phrase: '偏向別神'
    verses:
    - 18
    - 20
- name: 流奶與蜜之地
  type: 神學
  evidence: '第20節：「因為我將他們領進我向他們列祖起誓應許那流奶與蜜之地，他們在那裡吃得飽足，身體肥胖，就必偏向別神，事奉他們，藐視我，背棄我的約。」CT 說神明知以色列人會變壞，卻因向著他們列祖的應許，仍舊帶領他們進入迦南地；然而以色列人卻因著一帆風順、豐衣足食，竟至藐視真神、偏向假神。KC 說神在一節之內就說盡了兩件事：他要成就他的應許、把他們帶進祝福的享受裡，而百姓要轉向別神、藐視他。BH 說流奶與蜜形容迦南地的豐饒與富足，是神供應的隱喻；但富足同時也是一場屬靈的考驗，可能使人自滿而忘記神。'
- name: 亞摩利人
  type: 人物
  evidence: '第4節：「耶和華必待他們，如同從前待他所滅絕的亞摩利二王西宏與噩以及他們的國一樣。」CT 說「他們」指迦南七族的人，並說亞摩利二王西宏與噩的事見民二十一21~35；他的原文字義另給了三個名字的意思：亞摩利是山居者，西宏是勇士，噩是長頸的。GT《申命記雷氏研讀本》要讀者參看第二章26節至三章11節。KC 說摩西用一切可能的方式鼓勵百姓與約書亞，他提起的正是勝過西宏和噩的那兩場仗；他並說回想神從前給我們的勝利，會叫我們面對將來的爭戰時得著鼓勵。BH 說亞摩利人在古代近東常被描寫成強悍好戰的一群，他們的敗亡因此格外能證明神的能力。'
  surfaces:
  - phrase: '亞摩利二王西宏與噩'
    verses:
    - 4
- name: 立約
  type: 主題
  evidence: '第16節：這百姓要「隨從外邦神行邪淫，離棄我，違背我與他們所立的約」。STEP 顯示「違背」是 ve./he.Fer（H6565A，Hiphil，簡要詞典義 pa.rar: to break），受詞是 be.ri.T/i（H1285 be.rit），而「所立的」正是立約的那個動詞 ka.Ra.ti（H3772H，簡要詞典義 ka.rat: to cut: make(covenant)）。第9節與第26節則兩次把約櫃寫成 ''a.Ron be.Rit Yah.weh，也就是耶和華之約的櫃。CT 說神預告以色列人在佔據迦南地之後，終將背棄他們所立的約，敬拜偶像假神。BH 說這裡的約指的是西奈之約，違約意味著違反了那份把以色列分別出來作神子民的協議。'
  surfaces:
  - phrase: '我與他們所立的約'
    verses:
    - 16
- name: 以色列的長老
  type: 文化
  evidence: '第9節說摩西把律法交給「抬耶和華約櫃的祭司利未子孫和以色列的眾長老」，第28節說要把支派的眾長老和官長都招聚了來。STEP 顯示第9節是 kol zik.Nei Yis.ra.''El（H2205G za.qen: old: elder），第28節是 kol zik.Nei shiv.tei./Khem ve./sho.te.rei./Khem（H2205G 加 H7626H she.vet: tribe 加 H7860 sho.ter: official）。CT 說第11節那個「你」指的是祭司和長老，並說支派的眾長老和官長就是治理各支派的人。GT《聖經精讀本──申命記註解》說長老與官長是負責審判、行政等公職的以色列社會的領袖，並推測摩西之歌可能是通過他們間接地傳給了百姓。KC 說律法書也交給了長老，他們因著年紀是百姓天然的領袖，應當作順服的榜樣。BH 說長老與官長並列，顯示屬靈與民政兩種領導都要與這約對齊。'
  surfaces:
  - phrase: '以色列的眾長老'
    verses:
    - 9
