book: 申命記
chapter: 31
candidates:
- name: 勉勵他使他膽壯（cha.zaq、a.mats）
  type: 原文
  evidence: '「剛強壯膽」這四個字在本章出現三次：第6節對眾百姓，第7節摩西對約書亞，第23節是耶和華親自對約書亞說。STEP 顯示這是兩個動詞的祈使式：chiz.Ku（H2388G，簡要詞典義 cha.zaq: to strengthen）與 ve./''im.Tzu（H553，簡要詞典義 a.mats: to strengthen）；第6節用複數（對眾人），第7節與第23節換成單數 cha.Zak ve./''e.Matz（對約書亞一個人）。這正是申3:28 那一組動詞，只是語幹與語態換了：那裡是摩西去使約書亞剛強（及物），這裡是要對方自己剛強起來（祈使）。CT 的原文字義給「剛強」的是堅固、強壯，給「壯膽」的是大膽、無懼；他在文意註解區分兩者：剛強重在指在信心上信靠神，壯膽重在指在心志上勇敢；同節的「害怕」指對戰爭的恐懼，「畏懼」指對敵人的懼怕。GT《聖經精讀本──申命記註解》說摩西對即將與新領袖約書亞一起進入迦南的百姓首先強調神的同行與幫助，即用耶和華信仰來武裝了他們，並說雖然以色列在戰術或戰鬥力方面處於劣勢，但只要他們是以神為隊長的耶和華之軍隊，任何勢力都敵不住以色列。KC 說這句鼓勵不是空洞的聲音，因為摩西自己已經活出來也經歷過；他並說一生與神同行的人特別有資格鼓勵別人。BH 說這個命令後來重複出現在約書亞記1章6至9節，並說剛強壯膽的根據不是人的能力，而是對神應許與同在的信靠。'
- name: 必不撇下你，也不丟棄你（ra.phah 與 a.zav）
  type: 原文
  evidence: '第6節對百姓、第8節對約書亞，說的是同一句：「他必不撇下你，也不丟棄你。」STEP 顯示這是兩個動詞：lo yar.pe./Kha（H7503，Hiphil，簡要詞典義 ra.phah: to slacken，本節譯義 he will abandon you）與 ve./lo ya.''az.Ve./ka（H5800A，簡要詞典義 a.zav: to leave: forsake）。第二個動詞在本章後面又出現兩次，方向卻反了過來：第16節說這百姓要 va./''a.za.Va./ni（同一個 H5800A，本節譯義 it will forsake me，和合本作「離棄我」），第17節說 va./''a.zav.Ti/m（同一個 H5800A，和合本作「我也必離棄他們」）。CT 的文意註解區分兩個中文詞：不撇下重在指必要成就他的應許，不丟棄重在指始終堅定他的同在。KC 的分法相近：不撇下的意思是我們隨時可以指望他給忠告與引導、給力量與勇氣；不丟棄的意思是他總與他的百姓同在，一路走到爭戰中、走到得地為業；他並把這句話接到馬太福音28章20節與希伯來書13章5節。BH 說這個應許在約書亞記1章5節被重述，並說這種不離開、不撇棄的措辭本身就是立約的語言。'
