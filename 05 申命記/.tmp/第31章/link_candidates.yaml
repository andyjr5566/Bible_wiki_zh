- name: 律法書放在約櫃旁
  type: 主題
  evidence: '第24至26節：摩西把這律法的話寫在書上，寫完之後吩咐抬約櫃的利未人，「將這律法書放在耶和華─你們神的約櫃旁，可以在那裡見證以色列人的不是」。STEP 顯示位置詞是 mi./Tzad（H6654，簡要詞典義 tsad: side，字面是在旁邊），受詞是 Se.fer ha./to.Rah（H5612H se.pher: scroll: book 加 H8451 to.rah: instruction），結果是 le./''Ed（H5707 ed: witness）。CT 說約櫃裡面放著盛有嗎哪的金罐、亞倫發芽的杖與刻有十誡的兩塊石版，約櫃外面則放著律法書，即指《申命記》。GT《聖經精讀本──申命記註解》給的說法一致，並多說一句：摩西的律法書可說是十誡的注釋本，故把律法書放在約櫃旁，使其成為世世代代見證神的書；它並推測利未人中的祭司似乎在約櫃旁再放置一個箱子，將律法書保存在裡面。GT《啟導本聖經申命記註釋》說這部書收藏在約櫃旁，也就是存放十誡石版的地方；它並記下有的解經家為求說明何以在本章插入24至29節，主張把24節的「這律法」和26節的「這律法書」都改為「這歌」，認為是後來的繕抄錯誤，但同時說這種解釋並無可靠證據支持。BH 說把律法書放在約櫃旁表示它的神聖與中心地位，並說它作為見證，是要在百姓失守時反過來指證他們。'
  surfaces:
  - phrase: '這律法書'
    verses:
    - 26
- name: 每七年宣讀律法（豁免年的住棚節）
  type: 主題
  evidence: '第10至13節定下一個週期：每逢七年的末一年，在豁免年的定期住棚節，以色列眾人來到神所選擇的地方朝見他時，要把這律法念給他們聽。STEP 顯示時間是 mi./Ketz She.va sha.Nim（H7093 qets: end 加 H7651 加 H8141）、she.Nat ha./she.mi.Tah（H8059，簡要詞典義 she.mit.tah: remission）與 be./Chag ha./su.Kot（H2282 chag: feast 加 H5521 suk.kah: booth）；「念」是 tik.Ra（H7121J，簡要詞典義 qa.ra: to call: read out）；第12節的「招聚」是 hak.Hel（H6950，Hiphil，簡要詞典義 qa.hal: to gather），「學習」是 yil.me.Du（H3925H，la.mad: to learn），對象包含 ha./''a.na.Shim、ve./ha./na.Shim、ve./ha./Taf（H582、H802G、H2945）與 ve./ge.re./Kha（H1616 ger: sojourner）。CT 說每逢七年的末一年即指安息年，豁免年也就是安息年，那一年須豁免債務並釋放奴隸；他並把第12節整理成六個步驟：招聚、使聽、學習、敬畏神、謹守、遵行，又在話中之光注意到神所指定的只是「念給他們聽」，而不是把解釋的意見告訴人。GT《申命記雷氏研讀本》說把律法的抄本交給祭司、定期誦讀約的條例，是當時宗主國條約典型的條件。GT《啟導本聖經申命記註釋》說全民都應有代表在神選定的地方參加，來聽律法的朗讀，提醒全民應盡的責任，並說兒童至少有一至兩次機會也可以和會眾站在一道參加。KC 說這七年一次的宣讀不是要取代家中的教導或祭司的教導，而是支持、確認，必要時修正其他一切教導，使全民的想法重新對齊神的話；他並指出安息年與住棚節都說到和平的國度。BH 說這種公開宣讀在尼希米記8章再次出現，並帶來一次全民的復興。'
