- name: 掩面不顧（sa.tar）
  type: 原文
  evidence: '第17節與第18節各出現一次。第17節說「我也必離棄他們，掩面不顧他們」，第18節說「我必定掩面不顧他們」。STEP 顯示第17節是 ve./his.tar.Ti fa.Na/i（H5641，Hiphil，簡要詞典義 sa.tar: to hide，加 H6440H pa.neh），第18節則是 has.Ter ''as.Tir（同一個 H5641 的不定詞絕對式加未完成式，本節譯義 certainly to hide 加 I will hide），是一種把語氣加重的寫法。CT 的文意註解說「離棄」意指不再給予特殊的優待（保守和照顧），「掩面不顧」意指不再垂聽訴苦和哭求。GT《聖經精讀本──申命記註解》引以賽亞書59章1至2節說明這句話的真意：並非因神拯救的膀臂縮短了才對以色列百姓遮掩恩典之面，而是因為以色列如烏雲般滿盈的罪孽遮掩了神的恩典之面。KC 說神向他們掩面，是把他恩寵與保護的記號從殿中撤走；他並說百姓感覺到神不在，還不等於真正的回轉。BH 說在古代近東，神明的臉代表關注與賜福，掩面表示因罪而中斷的關係。'
- name: 一百二十歲的摩西
  type: 主題
  evidence: '第2節：「我現在一百二十歲了，不能照常出入；耶和華也曾對我說：你必不得過這約但河。」STEP 顯示這一句是 ben me.''Ah ve./''es.Rim sha.Nah（H1121L ben 加 H3967 加 H6242 加 H8141，字面是一百二十歲之子），「不能」是 lo ''u.Khal（H3201，簡要詞典義 ya.khol: be able），「出入」是 la./Tzet ve./la./Vo（H3318G ya.tsa 加 H935G bo）。GT《啟導本聖經申命記註釋》給了一個背景對照：埃及文學著作中，智者的年壽為一百一十歲，摩西比他們還長壽10歲；並說一百二十歲為40的三倍，摩西的一生事業也是以每40年為一個階段。GT《聖經精讀本──申命記註解》把三個四十年列了出來：在埃及的宮廷中以王子的身份生活了40年，在米甸曠野地中以一個牧人的身份生活了40年，最後蒙神呼召以以色列領袖的身份度過了40年。GT《申命記雷氏研讀本》提醒「不能照常出入」不是體能問題：在體能上摩西是可以做到的（三四7），但神已經禁止他與百姓一起進入應許地。KC 說摩西自己在他所寫的詩篇裡提過人的年歲（詩90:1,10），並說他一百二十年的一生被聖經分成三段各四十年不是沒有原因的。BH 說一百二十歲在聖經裡常被看作完滿的一生，而三個四十年顯出他使命的完整。'
