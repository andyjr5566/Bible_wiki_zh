- title: 豁免（she.mit.tah）
  path: link_folder/原文/豁免（she.mit.tah）.md
  definition: '申命記第十五章第1節只有一句：「每逢七年末一年，你要施行豁免。」這一個詞管住了整章的前半段。


    STEP 顯示名詞是 she.mi.Tah（H8059，簡要詞典義 she.mit.tah: remission），第1、2、9 節共出現三次；動詞另有其形——第2節是
    sha.Mot（H8058，簡要詞典義 sha.mat: to release，不定詞絕對式），第3節是 tash.Met（同為 H8058），字面是讓你的手放開。


    **這個字原本講的不是錢。** CT 的原文字義註「豁免」釋放，歇息，取消徵稅；文意註解說『豁免』原意指休耕(參出二十三11)，在此指免除債務。GT《申命記串珠聖經註釋》說得一樣簡短：「豁免」：原指釋放、歇息（出23:10），本指第七年不耕地。也就是說，這個字先是用在土地上——第七年讓地歇一歇；申命記把同一個動作搬到債務上——第七年讓債歇一歇。


    **免掉多少，各家並不一致。** GT《聖經精讀本》把兩種相反的看法並列出來：第一種認為是完全免除債務，第二種認為只是安息年不再追債。他給了三個理由傾向第二種——「豁免」的原文含有歇息或耕種之意；經文說的是豁免了、不可追討；而且若每逢安息年就完全免除債務的話，以色列社會中就會消失借貸金銀的事情。BH
    則直接把 remission 讀成債務的取消或赦免，並指這是一項相當激進的經濟安排，用意在防止貧窮累積、促成社會的均平。


    **經文自己給的理由是「因為耶和華的豁免年已經宣告了」。** GT《聖經精讀本》說接近原文之意的是為了耶和華而豁免，意指以色列百姓紀念從耶和華所蒙的恩典與憐恤，以感恩的心，為了耶和華的榮耀而免除貧乏鄰人之債務。CT
    從這一句讀出三層意思：所有的財富都是神的，債主不過是替神管理；神向著人滿有同情、體恤的憐憫心；債主應本著向神感恩、向人同情之心，免除債務。


    **有一個例外寫在第3節。** 借給外邦人的可以追討，借給弟兄的要鬆手。GT《啟導本聖經申命記註釋》給的理由是身分與處境：外國人只是暫居性質，不屬社會基本成員，即令耕種土地也不須受第七年停止耕種的限制，應有力量還債。KC
    則把重點放在債主這一邊——他說能不追討的人，是已經進到第七年裡的人。'
