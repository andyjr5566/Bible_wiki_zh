- title: 硬著頸項的百姓
  path: link_folder/神學/硬著頸項的百姓.md
  definition: 出埃及記32:9記載，耶和華對摩西說：「我看這百姓真是硬著頸項的百姓。」原文為固定片語（CT原文字義：首字含硬著頸項、冥頑不靈、艱難之意；次字「頸項」意為頸、固執），取自農牧比喻——牛馬牲畜不肯順服駕馭者的牽引轉向。這句評斷緊接在百姓鑄造金牛犢、「快快偏離了我所吩咐的道」（8節）之後，是神對百姓本性的總結性論斷，並構成神考慮「將他們滅絕」（10節）的理由。GT引丁良才註釋指出，這比喻其後在聖經中反覆出現，形容以色列背逆不順從（申命記9:6、13，10:16；歷代志下30:8；使徒行傳7:51等），成為以色列悖逆本性的代表性稱謂。
  development: '這個稱呼在出埃及記是現場的判詞，到申命記變成了論證的前提。


    出32-34 的三次（出32:9、33:3、34:9）都緊貼著金牛犢事件：神在事發當場這樣描述這群人，摩西則在代求時把同一句話當成求憐憫的理由——正因為他們硬著頸項，才更需要神同行。


    申9 把這個稱呼移到了一個新位置。第6節是摩西的結論句：神將這美地賜你為業並不是因你的義，你本是硬著頸項的百姓；第13節則是神在回顧中親口再說一次。==同一句話由人說一次、由神說一次，中間夾著整段金牛犢的回憶。==
    也就是說，申9 不是在事件現場下判詞，而是在四十年之後把這個判詞當成證據使用：第7至24節那一長串悖逆史，就是這四個字的注解。


    各家對這個比喻取的動物並不一致。GT《申命記雷氏研讀本》說它來自那拒絕負軛的不聽話的牛，GT《申命記串珠聖經註釋》說源於不受制馭的野驢，GT《聖經精讀本》則不指定動物，只說這是聖經的慣用語，意指硬挺著頸項的百姓。三種說法指向同一個畫面：頸項一硬，軛就套不上去。'
