- title: 摩西與約書亞的權柄差異
  path: link_folder/主題/摩西與約書亞的權柄差異.md
  definition: '民數記27章既確認約書亞是真正的接班人，也保留他與摩西的權柄差異。約書亞獲得足以使全會眾聽從的尊榮，卻不像摩西那樣直接承接本章一再出現的「耶和華曉諭摩西」模式；第21節規定他要站在大祭司以利亞撒面前，由祭司憑烏陵為他求問。


    | 比較面向 | 摩西 | 約書亞 |

    |---|---|---|

    | 任務 | 帶百姓出埃及、經過曠野，頒布神的律法 | 帶新一代進入並取得所賜之地 |

    | 領受指示 | GT 指出摩西可與神面對面說話 | 藉以利亞撒和烏陵求問神的旨意 |

    | 公開權柄 | 原有尊榮使百姓長期聽從 | 從摩西的 hod 中領受尊榮，使全會眾承認他 |

    | 職分關係 | 同亞倫配搭帶領出埃及 | 同以利亞撒配搭進入地業，軍政帶領與祭司求問彼此配合 |


    STEP 對第20節 H1935 的資料是 me./hod./Kha，「從你的尊榮中」，前綴介系詞帶有取自其中的意思；第21節「判斷」是 H4941G，「烏陵」是
    H224 複數名詞。語言資料確認經文的授權和求問結構。GT《啟導本》明說摩西直接與神說話，約書亞要藉大祭司；丁良才則把約書亞的政治、軍事領導與以利亞撒的祭司職分看作互助。KingComments
    用「領導受祭司職分約束」概括這個次序，BibleHub 也強調以利亞撒在決策中的中介角色。


    **連續性與差異同時存在。** KingComments 強調按手與公開站立讓約書亞具有摩西接班人的位置和權威；GT 與第21節則顯示他取得神旨意的方式仍有界線。讀者可以因此明白：「接班」不是複製前任的一切特權，而是在神設定的新角色分工中得到足以完成使命的權柄。'
