- title: 摩西之歌
  path: link_folder/神學/摩西之歌.md
  definition: 摩西之歌是聖經中第一首記錄的讚美詩，記載於出埃及記15:1-18。摩西和以色列人過紅海後向耶和華唱歌，讚美神將法老的馬和騎馬的投在海中（v1），宣告「耶和華是我的力量、我的詩歌、我的拯救」（v2）、「耶和華是戰士」（v3）、「耶和華必作王直到永永遠遠」（v18）。全詩怎麼分段，各家不一：GT《丁道爾聖經註釋》分
    v1-12（以出埃及為主旨）與 v13-18（討論將來入侵迦南）；GT 丁良才分三段（1-5、6-10、11-18），並記另有註釋家分兩大段；GT《中文聖經註釋》分四小段（1下-2
    個人感恩、3-12 團體頌讚、13-16 外邦驚惶、17-18 栽植與作王）；GT《啟導本聖經腳註》則說先敘述埃及軍隊的傾覆（1-11），然後預祝耶和華勝利（12-17），以對神的頌揚作結（18）。
  development: 摩西之歌在聖經神學中具有獨特地位。它是啟示錄15:2-4「羔羊之歌」的原型——末後得勝者站在玻璃海上唱「神僕人摩西的歌和羔羊的歌」。GT《中文聖經註釋》指出這首詩的重點已放在神的聖所：「其他只是藉歷史的敘述，來顯明神的權能和力量，因此百姓要以神產業的山，祂為自己所造的住處──聖所，為一切思想和行動的中心。」GT《聖經精讀本──出埃及記註解》指出這首歌「還具有預言性的性質，它將與羔羊之歌（啟15:2-4）一同，在最後審判的那天被勝利者高唱」。KC
    也是同一個看法：這首歌在末後的日子還要再唱一次，由勝過獸的人站在玻璃海上唱「神僕人摩西的歌，和羔羊的歌」。CT 的〔話中之光〕早在 v1 就把這條線接上了：將來必看見許多從今世苦海中得了釋放的信徒，站在玻璃海上唱這歌。
