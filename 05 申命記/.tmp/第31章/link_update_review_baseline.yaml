- title: 敗壞與滅絕同一字根（sha.chat）
  path: link_folder/原文/敗壞與滅絕同一字根（sha.chat）.md
  definition: '申命記第四章裡有一組對照，中文譯成兩個不同的詞，原文卻是同一個字根。


    | 節次 | 和合本 | 原文 | Extended Strong | 主詞 |

    |---|---|---|---|---|

    | 25 | 敗壞自己 | ve./hish.cha.Tem | H7843 | 以色列 |

    | 31 | 不滅絕你 | ve./lo'' yash.chi.Te./kha | H7843 | 神 |


    STEP 原文資料顯示兩處的 Extended Strong 完全相同，簡要詞典義是 sha.chat: to ruin。第25節是 Hiphil 完成式二人稱陽性複數（你們必毀壞自己），第31節是
    Hiphil 未完成式三人稱陽性單數加二人稱陽性單數字尾（他不會毀壞你）。


    **中文把它們拆成了兩個詞。** CT〔原文字義〕在第16節與第25節都給「敗壞」毀壞，破壞；在第31節給「滅絕」毀滅，破壞。兩個中文詞其實譯的是同一個希伯來動詞。


    **這個對照本身就是本章後半的論證。** 第25節說以色列會自己毀壞自己；第31節說神不會毀壞他們。CT 在第31節說：「神的話是信實的（參提後二13；詩八十九33~34），祂不能背棄所立的約，所以不會棄絕神的子民。」


    GT《串珠聖經註釋》把這一節放在整段裡看：「『有憐憫的神』：憐憫是愛和憐恤的流露。在摩西的信念裡，神的公義（25-28）和慈愛是互不衝突的。」


    **BH 也注意到第25節的「敗壞」是道德性的。** 「The term "act corruptly" implies moral and spiritual
    decay, often associated with idolatry and disobedience to God''s laws.」（「行事敗壞」一詞意味道德與屬靈的腐壞，通常與拜偶像和違背神的律法相連。）


    同一個動詞，一次由人做在自己身上，一次是神明說祂不會做。'
  development: '申4 與申9 各給了這個字根的一半，而且是對著的一半。


    申4:25 講的是將來式的警告：若你們行耶和華眼中看為惡的事，就是敗壞自己。那裡的重點在於這種敗壞是自己動手的，不是外力造成的。


    申9 把同一個字根用在一場已經發生過的事上，而且用在兩個相反的方向。第12節神對摩西說，你從埃及領出來的百姓「已經敗壞了自己」（shi.Chet，Piel
    完成式）——警告在何烈山已經應驗過一次；第26節摩西向神祈禱說「求你不要滅絕你的百姓」（tash.Chet，Hiphil），求的是不要讓神親自動手做同一件事。


    兩章合起來，這個字根的邏輯就完整了：==人先把自己毀了，接下來的問題是神要不要照著毀下去。== 申4 說明毀壞從哪裡開始，申9 說明它為什麼沒有走到底——不是因為敗壞不夠嚴重，而是因為中間站了一個代求的人。


    申10 給了這個字根第三個時刻。第10節說「那次耶和華也應允我，不忍將你滅絕」，STEP 顯示「滅絕」在這裡仍是 sha.chat 的使役語幹（hash.chi.Te./kha，H7843），而「不忍」是另一個字
    ''a.Vah（H14，簡要詞典義 be willing）。


    ==三章連起來，這個字根走完了一條完整的線：== 申4 說人會這樣毀自己，申9 說人真的毀了自己、摩西求神不要照著毀下去，申10 給出答覆——神不願意。GT《申命記串珠聖經註釋》在申10:10
    的判語很短：神答應摩西的代禱，以色列民沒有被滅絕，神與子民的關係得以重新恢復。'
