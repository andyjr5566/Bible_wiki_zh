- "title": "勉勵他使他膽壯（cha.zaq、a.mats）"
  "path": "link_folder/原文/勉勵他使他膽壯（cha.zaq、a.mats）.md"
  "summary": "「剛強壯膽」在本章出現三次：第6節摩西對眾百姓，第7節摩西對約書亞，第23節是耶和華親自對約書亞說。STEP 顯示是同一組動詞的祈使式：chiz.Ku（H2388G，簡要詞典義 cha.zaq: to strengthen）與 ve./'im.Tzu（H553，簡要詞典義 a.mats: to strengthen）；第6節用複數（對眾人），第7、23節換成單數 cha.Zak ve./'e.Matz（對約書亞一個人）。CT 的原文字義給「剛強」的是堅固、強壯，給「壯膽」的是大膽、無懼，並在文意註解區分兩者：剛強重在指在信心上信靠神，壯膽重在指在心志上勇敢；同節的「害怕」指對戰爭的恐懼，「畏懼」指對敵人的懼怕。GT《聖經精讀本──申命記註解》說摩西首先強調的是神的同行與幫助，即用耶和華信仰來武裝了他們，並說雖然以色列在戰術或戰鬥力方面處於劣勢，但只要他們是以神為隊長的耶和華之軍隊，任何勢力都敵不住以色列。KC 說這句鼓勵不是空洞的聲音，因為摩西自己已經活出來也經歷過。BH 說這個命令後來重複出現在約書亞記1章6至9節，並說根據不是人的能力，而是對神應許與同在的信靠。"
  "relation": "申3:28 是摩西去使約書亞剛強，本章換成命令對方自己剛強；而且第23節說這話的不再是摩西，是耶和華自己。"
