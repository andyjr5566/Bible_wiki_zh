- "title": "敬畏神"
  "path": "link_folder/神學/敬畏神.md"
  "summary": "第12至13節連著出現兩次：使他們聽、使他們學習，好敬畏耶和華你們的神；也使他們未曾曉得這律法的兒女得以聽見，學習敬畏耶和華你們的神。STEP 顯示第12節是 ve./ya.re.'U（H3372H，簡要詞典義 ya.re: to fear: revere），而聽與學是 yish.me.'U（H8085G）與 yil.me.Du（H3925H）。CT 把第12節的程序整理成六步：招聚、使聽、學習、敬畏神、謹守、遵行；他並在話中之光說不管他們經過了多少個七年，神都要他們一遍又一遍地聆聽律法，才能保持敬畏的心。BH 說這裡的敬畏不是恐懼，而是承認神的聖潔與主權，並引箴言9章10節說敬畏耶和華是智慧的開端。"
  "relation": "本章把敬畏放在一串動作的中間：先聽、先學，才敬畏；敬畏之後才是謹守與遵行。"
