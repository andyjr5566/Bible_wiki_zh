- "title": "豁免（she.mit.tah）"
  "path": "link_folder/原文/豁免（she.mit.tah）.md"
  "summary": "第10節「每逢七年的末一年，就在豁免年的定期住棚節的時候」。STEP 顯示是 she.Nat ha./she.mi.Tah（H8059，簡要詞典義 she.mit.tah: remission）。CT 說每逢七年的末一年即指安息年，豁免年亦即安息年，以色列人在那一年須豁免債務（參申十五1~11）並釋放奴隸（參申十五12~18）。GT《啟導本聖經申命記註釋》說這裡規定每逢七年的末一年、也就是豁免年的住棚節時，要舉行莊嚴的儀式，重申與神立的約。KC 說宣讀要在豁免債務的那一年、也就是安息年，並在收完全部莊稼之後所守的住棚節舉行，那是宣讀整部律法最合適的時候。BH 說豁免年的希伯來詞就是 Shemitah，那一年債務得以免除，反映神的憐憫與恩典。"
  "relation": "申15 用這個字管債務與奴僕，本章用它管一件完全不同的事：律法要在那一年被念一次。"
