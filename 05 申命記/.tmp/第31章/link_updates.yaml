- "title": "摩西與約書亞的權柄差異"
  "path": "link_folder/主題/摩西與約書亞的權柄差異.md"
  "summary": "第23節：「耶和華囑咐嫩的兒子約書亞說：你當剛強壯膽，因為你必領以色列人進我所起誓應許他們的地；我必與你同在。」STEP 顯示這一節的說話者是 Yah.weh 本身，而不是摩西——與第7節摩西對約書亞說話的場面剛好成對。GT《申命記雷氏研讀本》一句話點出差別：約書亞直接受命於神。GT《聖經精讀本──申命記註解》說這是約書亞直接從神領受以色列之統率權的場面，從神委任並激勵約書亞的話語中可以認識到實際引領以色列進入應許之地的主體正是耶和華神。CT 在話中之光說，凡神自己呼召的僕人，神不會讓他們靠著自己在各種難處中剛強壯膽，而是會清清楚楚地向他們啟示自己的同在和心意，消除他們心中的一切疑慮。KC 說在預言了百姓的偏離之後，約書亞需要再一次被鼓勵，而這一次是耶和華親自做的。"
  "relation": "民27 那裡約書亞要站在祭司面前求問，本章第23節神卻直接對他說話；同一個人的權柄在兩處被寫成不同的樣子。"
