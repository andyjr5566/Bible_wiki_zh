- "title": "會幕（帳幕整體）"
  "path": "link_folder/主題/會幕（帳幕整體）.md"
  "summary": "第14至15節。神吩咐摩西與約書亞站在會幕裡，耶和華就在會幕裡的雲柱中顯現。STEP 顯示是 'O.hel mo.'Ed（H168G o.hel: tent 加 H4150I mo.ed: meeting），兩人「站」的動詞是 ve./hit.ya.tze.Vu 與 va/i.yit.ya.tze.Vu（H3320，簡要詞典義 ya.tsav: to stand），「顯現」是 va/i.ye.Ra（H7200G，Niphal，本節譯義 he appeared）。CT 說會幕是神和人相會的地方，一般會眾是在會幕門口與神相會、聽神說話，而這裡所說的「會幕裡」大概就是在聖所中，不是至聖所。GT《聖經精讀本──申命記註解》說以色列人處理或公佈重要問題時會聚集在聖幕前面，會幕此名正是來自於此；GT 引華爾頓《申命記背景注釋》說出埃及記的聖幕建成之前，會幕是位於營外作為啟示之處，然而聖幕現已啟用，並且也稱會幕。KC 說這是本卷書唯一一次提到會幕，也是本卷書唯一一次神的顯現。"
  "relation": "申命記全卷只在這一章提到會幕，而且是為了一件事：由神親自主持的交接。"
