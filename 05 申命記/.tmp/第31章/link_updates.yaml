- "title": "呼天喚地作見證（ud）"
  "path": "link_folder/主題/呼天喚地作見證（ud）.md"
  "summary": "第28節：「你們要將你們支派的眾長老和官長都招聚了來，我好將這些話說與他們聽，並呼天喚地見證他們的不是。」STEP 顯示動詞是 ve./'a.'I.dah（H5749B，Hiphil，簡要詞典義 ud: to testify，本節譯義 so I may call as witnesses），見證人是 ha./sha.Ma.yim 與 ha./'a.Retz（H8064 加 H776G）。CT 說呼天喚地以天地作見證人，表明所說的話非常重要。GT《啟導本聖經申命記註釋》在這裡要讀者參看三十19 的註。KC 提出兩種理解：一是天地指天上與地上的居民、人與天使，他們都會同意這首歌所講的真理；二是天地在這裡被當作人格化的見證人，因為天地由神的話托住並被引到他所定的目標，它們並不違抗神。BH 說召天地作見證是聖經常見的手法，申4:26 與賽1:2 都用過。"
