- "title": "出入（領袖用語）"
  "path": "link_folder/原文/出入（領袖用語）.md"
  "summary": "第2節「不能照常出入」。STEP 顯示這是 la./Tzet ve./la./Vo（H3318G ya.tsa: to come out 加 H935G bo: to come），兩個動詞的不定詞並列。CT 說「出入」是意指「正常地擔當事工」或「精力旺盛地作工」的慣用語（參書十四11；撒上十二2），故這話暗示他在世的年日即將告終，不能再帶領百姓進入迦南。GT《聖經精讀本──申命記註解》給的說法相同，並同樣引書14:11 與撒上12:2 作為這個慣用語的旁證。GT《申命記雷氏研讀本》補一句：在體能上摩西是可以做到的（三四7），但神已經禁止他與百姓一起進入應許地。"
