  "path": "link_folder/神學/流奶與蜜之地.md"
  "summary": "第20節：「因為我將他們領進我向他們列祖起誓應許那流奶與蜜之地，他們在那裡吃得飽足，身體肥胖，就必偏向別神，事奉他們，藐視我，背棄我的約。」CT 說神明知以色列人會變壞，卻因向著他們列祖的應許，仍舊帶領他們進入迦南地；然而以色列人卻因著一帆風順、豐衣足食，竟至藐視真神、偏向假神。KC 說神在一節之內就說盡了兩件事：他要成就他的應許、把他們帶進祝福的享受裡，而百姓要轉向別神、藐視他。BH 說流奶與蜜形容迦南地的豐饒與富足，是神供應的隱喻，但富足同時也是一場屬靈的考驗。"
