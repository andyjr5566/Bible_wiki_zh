- "title": "約書亞承接摩西"
  "path": "link_folder/事件/約書亞承接摩西.md"
  "summary": "第7至8節與第14、23節。第7節「摩西召了約書亞來，在以色列眾人眼前對他說」，第14節神叫兩人站在會幕裡由他親自囑咐，第23節耶和華直接對約書亞說話。STEP 顯示第7節的「召」是 va/i.yik.Ra（H7121G），場合是 le./'ei.Nei khol Yis.ra.'El（在全以色列的眼前），交代的任務是 tan.chi.Le./nah（H5157，Hiphil，簡要詞典義 na.chal: to inherit）。CT 說這是正式當眾任命新領袖，並把約書亞的兩大任務列出來：帶領以色列人攻佔迦南地，以及分配迦南地給各支派作為他們的產業。GT《啟導本聖經申命記註釋》說摩西早已在大祭司和會眾面前立約書亞繼他領導全民，現在正式交托領袖的責任。GT《聖經精讀本──申命記註解》說這是摩西在以色列總會面前正式將自己的權力移交給繼承人，而他所說的激勵之言就是耶和華必與你同在，這是摩西藉著自己的40年曠野經驗所悟到的真理。KC 說摩西告別，卻沒有把百姓丟給他們自己；他帶著愛把領導權交出去，聽不到一句抱怨或責備。BH 說這次公開宣告是要全民認出並接受新領袖，也顯出權力交接的透明與可問責。"
  "relation": "民27 是按手立他，本章是當眾把任務講明並由神親自囑咐；交接在這一章才真的完成。"
