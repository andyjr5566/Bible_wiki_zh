- "title": "約櫃"
  "path": "link_folder/主題/約櫃.md"
  "summary": "第9節說律法交給「抬耶和華約櫃的祭司利未子孫」，第25至26節說吩咐抬約櫃的利未人把律法書放在約櫃旁。STEP 顯示是 'a.Ron be.Rit Yah.weh（H727 a.ron: ark 加 H1285 be.rit: covenant），抬的動詞是 ha./No.se.'Im（H5375H，簡要詞典義 na.sa: to lift: bear），第26節的位置詞是 mi./Tzad（H6654，簡要詞典義 tsad: side）。CT 說約櫃裡面放著盛有嗎哪的金罐、亞倫發芽的杖與刻有十誡的兩塊石版，約櫃外面則放著律法書；他並說第25節吩咐的是利未支派哥轄的子孫。GT《聖經精讀本──申命記註解》說摩西的律法書可說是十誡的注釋本，故把律法書放在約櫃旁，使其成為世世代代見證神的書。KC 注意到抬約櫃通常是利未人的職責（民4:15），在特別的場合才由祭司來抬（書3:3-8；6:6；代上15:11-12）。BH 說約櫃是以色列最神聖的器物，象徵神在百姓中間的同在。"
