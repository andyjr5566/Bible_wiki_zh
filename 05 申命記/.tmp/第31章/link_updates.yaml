- "title": "約書亞"
  "path": "link_folder/人物/約書亞.md"
  "summary": "本章是約書亞正式接棒的一章：第3節說他必引導百姓過去，第7節摩西當眾任命他，第14節神叫他與摩西站在會幕裡，第23節耶和華親自囑咐他。STEP 顯示他的名字是 ye.ho.Shu.a（H3091G），第23節連名帶父名寫作嫩的兒子約書亞。CT 說第14節「約書亞」的原文字義是耶和華是拯救，並說第3節是介紹神所揀選的新領袖。GT《申命記雷氏研讀本》補上他的資歷：很久以前約書亞已經帶領軍隊（出一七9），而最近他更獲賜摩西的一些權力（民二七18~23）。KC 說在約書亞身上我們看見主耶穌藉著聖靈帶領他百姓的一幅圖畫。BH 說約書亞的名字意思是耶和華是拯救，並說他先前是摩西的助手與軍事領袖。"
