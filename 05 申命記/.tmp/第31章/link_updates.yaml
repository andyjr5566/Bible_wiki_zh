- "title": "雲柱火柱"
  "path": "link_folder/歷史/雲柱火柱.md"
  "summary": "第15節「耶和華在會幕裡雲柱中顯現，雲柱停在會幕門以上」。STEP 顯示是 'a.Mud 'a.Nan（H5982G am.mud: pillar 加 H6051 a.nan: cloud），停住的動詞是 va/i.ya.'a.Mod（H5975G）。CT 說這句話顯示雲柱是在會幕裡而神是在雲柱中，並從裡外兩個視角解釋：從會幕裡面看，雲柱是在會幕裡；從會幕外面看，雲柱是停在會幕門以上。GT《啟導本聖經申命記註釋》說雲柱停在會幕門以上是向百姓表明神自己在作安排，好讓他們清清楚楚地知道自己是在跟從神、而不是跟從人。GT 引華爾頓《申命記背景注釋》給了古代世界的背景：在古代世界，神明有光輝或火焰圍繞是很平常的信念；亞喀得語用梅嵐穆一語來描述這種神明榮耀可見的彰顯，這種彰顯通常是在煙或雲籠罩之下的；有人認為梅嵐穆的概念在迦南神話中是用阿南一語表達，與本節譯作「雲」的希伯來字眼相同，只是這字在聖經中的出現次數又少、意義又隱晦，因此不能太有把握。KC 說這是申命記全卷唯一一次神的顯現。BH 說雲柱從出埃及記13章21至22節起就是神同在、保護與引導的記號。"
  "relation": "前面幾卷雲柱是走在前頭引路，本章它停在會幕門口，作用換成了替一場交接背書。"
