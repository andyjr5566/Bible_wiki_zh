- "title": "硬著頸項的百姓"
  "path": "link_folder/神學/硬著頸項的百姓.md"
  "summary": "第27節：「因為我知道你們是悖逆的，是硬著頸項的。我今日還活著與你們同在，你們尚且悖逆耶和華，何況我死後呢？」STEP 顯示「悖逆」用了兩個相關的字：名詞 mer.ye./Kha（H4805H，簡要詞典義 me.ri: rebellion）與分詞 mam.Rim（H4784，簡要詞典義 ma.rah: to rebel）；「硬著頸項」是 'a.re.pe./Kha ha./ka.Sheh（H6203 o.reph: neck 加 H7186 qa.sheh: severe）。CT 說硬著頸項意指剛硬、倔強、頑梗，如同不肯負軛的公牛（參出三十二9；三十三3；三十四9）；他並說對方還活著時人多少會顧念他的臉面，死了就會少一層的顧慮。KC 注意到摩西講他們的悖逆時，說的不是他們悖逆他，而是悖逆耶和華。BH 說硬著頸項的比喻來自不肯被軛引導的牛，並說摩西的在場曾是一種約束的力量。"
