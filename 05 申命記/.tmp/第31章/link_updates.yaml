- "title": "敗壞與滅絕同一字根（sha.chat）"
  "path": "link_folder/原文/敗壞與滅絕同一字根（sha.chat）.md"
  "summary": "第29節：「我知道我死後，你們必全然敗壞，偏離我所吩咐你們的道」。STEP 顯示是 hash.Chet tash.chi.Tu/n（H7843，Hiphil），不定詞絕對式加未完成式的加重寫法，本節譯義是 certainly to act corruptly 加 you will act corruptly；「偏離」是 ve./sar.Tem（H5493I，簡要詞典義 sur: to turn aside），「日後」是 be./'a.cha.Rit hai./ya.Mim（H319 a.cha.rit: end 加 H3117G），「惹他發怒」是 le./hakh.'i.S/o（H3707，簡要詞典義 ka.as: to provoke）。CT 說摩西看透以色列人敗壞的本性，知道他們遲早會偏離正路，並把偏離正途的結果列成三項：行為邪惡、惹神發怒、招來禍患。GT《聖經精讀本──申命記註解》解釋「日後」字面意義是「在那些日子的末後」，然而此詞並非指歷史的終結，而是單指「將來」的慣用語；GT《啟導本聖經申命記註釋》說「以手所作的」指偶像。KC 注意到這番話與保羅在以弗所向長老告別的話（徒20:29）有顯著的呼應。BH 說這種道德與屬靈的全面下滑在士師記那一段歷史裡反覆出現。"
  "relation": "申4:25 是百姓敗壞自己、申4:31 是神不滅絕你，本章第29節把同一個字用在摩西對死後的預告上，而且用了加重的寫法。"
