- "title": "摩西之歌"
  "path": "link_folder/神學/摩西之歌.md"
  "summary": "第19至22節與第30節：神吩咐摩西寫一篇歌，當日摩西就寫了，最後把這一篇歌的話都說與以色列全會眾聽；歌的內容記在三十二章。GT《申命記串珠聖經註釋》把它與出埃及記十五章那一首放在一起比較：在以色列人過紅海後，摩西曾向耶和華唱出勝利的凱歌；現在這首歌也一如前者，以耶和華的名字（屬性）為主題，述說他的慈愛、公義和憐憫；所不同的是這歌是摩西臨終之言。GT《啟導本聖經申命記註釋》把三十二章那首歌分成八部分：引言呼召天地見證並宣告神名、質詢和指控、追述耶和華神的好處、指出以色列人的背逆、宣佈全民被滅的處罰、轉機以色列民可獲拯救、耶和華神的應許、要以色列人感謝神。KC 說在律法書之後接著來的是這首歌，兩者合成一個整體：他的書裡有神的定旨，他的歌裡有他警告與施恩的作為；他並說這是一首悲傷的歌，卻以神恩典的得勝收尾。"
  "relation": "出15 那首是得救之後的凱歌，本章預告的這首是臨終前的見證之歌；註釋把兩首放在一起讀，是因為主題同樣是耶和華自己。"
