- "title": "住棚節（利23節期規定）"
  "path": "link_folder/歷史/住棚節（利23節期規定）.md"
  "summary": "第10節把宣讀律法的時間定在豁免年的住棚節。STEP 顯示是 be./Chag ha./su.Kot（H2282 chag: feast 加 H5521 suk.kah: booth）。CT 說住棚節每年七月十五日起守節七天（參利二十三33~43），表徵享受國度裡的安息。KC 說住棚節是在全部收成都收進來之後守的，並說安息年與住棚節都說到和平的國度：那是神一切應許都成就、各人住在自己原有產業裡的時候；他並注意到在住棚節那一年不只男丁在場（申16:16），婦女與孩子也一同前來。BH 說住棚節是以色列三大朝聖節期之一，紀念曠野的行程與神的供應。"
  "relation": "利23 定的是怎麼守這個節，本章給它加了一項固定節目：七年一次的律法宣讀。"
