- "title": "摩西"
  "path": "link_folder/人物/摩西.md"
  "summary": "本章從頭到尾是摩西的最後一段工作：他說自己一百二十歲了、不能照常出入（2節），當眾任命約書亞（7節），把律法寫出來交給祭司與長老（9節），奉命寫一篇歌並教導百姓（19、22節），把律法書交給利未人放在約櫃旁（24至26節），最後把這一篇歌的話都說與以色列全會眾聽（30節）。GT《聖經精讀本──申命記註解》把這一段定位為摩西的最後事工，說本文描繪了摩西知道自己的去日不遠、便竭盡全力完成神委任他之事的場面，其主要業績是對繼承人委任領袖權、記錄傳授律法、告別之歌與宣告的祝福；GT 另說摩西在此的舉止再一次使我們認識到他是何等地愛以色列百姓，同時也能看到真正的領袖與牧者的形象。GT《啟導本聖經申命記註釋》說雖然摩西即將離世，但他所關心的卻不是個人的後事，而是盡完最後的責任。CT 在話中之光說摩西雖不得過約但河，但他單單注意神自己，所以並不再計較這些地上的榮辱得失，而是鼓勵百姓前往承受應許。KC 注意到摩西第29節的話與保羅在以弗所向長老告別的話（徒20:29）有顯著的呼應。"
  "relation": "他在這一章做的每一件事都不是為自己：交棒、交書、教歌、立見證，全部是為了他不在之後的日子。"
