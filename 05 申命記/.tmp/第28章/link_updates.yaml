- "title": "起泡的瘡"
  "path": "link_folder/原文/起泡的瘡.md"
  "summary": "第27節。STEP：bi/sh.Chin mitz.Ra.yim（H7822，簡要詞典義 she.chin: boil），與出埃及記九9至11 的起泡的瘡是同一個名詞；同節另有 H2914（tumor）、u./va./ga.Rav（H1618，eczema）、u./ve./Cha.res（H2775B，scabies）。CT 說埃及人的瘡可能指象皮病、一種很難治的皮膚病，並說牛皮癬與疥一種是濕的、另一種是乾的；GT《申命記串珠聖經註釋》說這可能是指以色列人在埃及時神懲罰當地百姓而加諸其身的一種皮膚病，並指第35節更明言此皮膚病乃出於神的攻擊和咒詛；GT《申命記雷氏研讀本》給的譯法是瘡癤、腫瘤或痔瘡、壞血病與疥癬；BH 說皮膚病在古代近東常被視為神明不悅的記號，且會使人在禮儀上不潔而被隔離。"
  "relation": "在出埃及記那裡它還帶著起泡與迸出兩個修飾語，到本章已經是一個不必解釋的病名——埃及的瘡。"
