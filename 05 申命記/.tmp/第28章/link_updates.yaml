- "title": "亞述"
  "path": "link_folder/地點/亞述.md"
  "summary": "第36節與第49至52節的遠方之民，各家都把亞述列為候選之一。GT《聖經精讀本──申命記註解》說第36節「你和你列祖素不認識的國」指亞述與被稱為迦勒底的巴比倫，他們將要於主前722與586年毀滅北以色列與南猶大，並指出以色列過約但河約在主前1405年左右，故當時不可能認識於主前1354年建立的亞述和於主前625年建立的巴比倫；GT《啟導本聖經申命記註釋》說「如鷹飛來攻擊」乃言亞述人攻擊力量的大而且快，並說「這民的言語你不懂得」說明一般以色列人不懂亞述與巴比倫的語言；CT 備註49至57節所描述的慘狀也應驗在巴比倫人之前的亞述人之侵攻北國以色列；GT 另指亞述人（賽五26；何八1）也是「如鷹飛來」的遠方敵人之一。"
  "relation": "本章的經文本身沒有指名任何國家，亞述是四套註釋在第36節與第49節下共同提出的候選；這是本卷第一次出現這個指認。"
