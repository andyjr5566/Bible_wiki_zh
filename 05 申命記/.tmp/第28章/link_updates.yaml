- "title": "宗主條約"
  "path": "link_folder/背景/宗主條約.md"
  "summary": "GT 指出在主前二十世紀的古代中東文明中，法律、條約通常以祝福和咒詛作為結束語，並且咒詛多於祝福，並舉出 Ur~Nammu、Lipit~Ishtar 和漢謨拉比法典、巴比倫的疆界石碑，以及埃及人、赫人、亞蘭人和亞述人的條約；它認為神俯就當時的聖經讀者，採用了他們熟悉的文學形式，這也成為摩西五經寫作年代的內證。GT《串珠聖經註釋》說申命記有關約的描述在內容與次序上均有當代約書的特色，二十八章列舉的眾多咒詛語與當代的盟約尤為接近，但神和百姓立的約與昔日近東的盟約在基本精神上是迥異的：前者屬宗教性、包括道德行為的責任，後者卻純粹是政治性的。GT 華爾頓《申命記背景注釋》另指被不同疾病所擾害是亞述條約文獻的咒詛之一。"
