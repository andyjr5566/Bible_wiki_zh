- "title": "敬畏神"
  "path": "link_folder/神學/敬畏神.md"
  "summary": "第58節「這書上所寫律法的一切話是叫你敬畏耶和華─你神可榮可畏的名」。CT 說本章中可怕的咒詛之言是為讓讀這些話的人生發敬畏神的心，知道神正如其名是當受尊榮且可畏懼的，因為祂說到就必做到；KC 說持守這書上的話與敬畏這名，總括了享受這些祝福所需要的一切；GT《聖經精讀本──申命記註解》把不敬畏神名字的放肆（58節）列為以色列受咒詛的三個原因之一；BH 說這裡的敬畏不是害怕，而是承認神的聖潔與威嚴。"
  "relation": "本章把敬畏接在那本寫下來的律法書上：不是聽來的，也不是父親講的，而是一整份寫定的文件所要達成的目的；而且這一節放在五十多節咒詛講完之後。"
