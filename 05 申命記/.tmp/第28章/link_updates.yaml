  "summary": "第23節「你頭上的天要變為銅，腳下的地要變為鐵」，與利未記二十六19 是同一個比喻而兩種金屬對調。STEP：sha.Mei./kha（H8064）ne.Cho.shet（H5178A，bronze）、ha./'A.retz（H776H）bar.Zel（H1270，iron），原文沒有「變為」這個動詞，是直接把天等同於銅、地等同於鐵。GT《聖經精讀本──申命記註解》在本節標出利未記二十六19，說這是用修辭手法表現了不下一滴雨的極度乾旱，並指及時雨象徵著神之恩典（12節）、極度乾旱地象徵了神的咒詛；GT《申命記串珠聖經註釋》說銅、鐵比喻天旱不降雨水、地硬不長五穀；CT 說意指天不下雨、乾旱成災、地不生長；BH 說銅是堅硬不透的金屬，這個比喻也連上禱告上達不到神那裡的意思。"
