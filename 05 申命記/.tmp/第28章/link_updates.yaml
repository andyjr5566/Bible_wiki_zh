- "title": "第六災：瘡災"
  "path": "link_folder/歷史/第六災：瘡災.md"
  "summary": "第27節「耶和華必用埃及人的瘡並痔瘡、牛皮癬與疥攻擊你，使你不能醫治」——STEP 顯示這裡是 bi/sh.Chin mitz.Ra.yim（H7822），與出埃及記九9至11 第六災是同一個名詞；BH 說第27節的瘡回指出埃及記九9至11 神降在埃及人身上的第六災，CT 說第35節的毒瘡即指埃及人的瘡。第60節「也必使你所懼怕、埃及人的病都臨到你，貼在你身上」用的是另一個字：STEP 顯示是 kol mad.Veh mitz.Ra.yim（H4064，簡要詞典義 mad.veh: disease），指埃及的一切疾病而不限於瘡；GT《聖經精讀本──申命記註解》說埃及人的病狹義上是指摩西在法老面前所行的十災，在廣義上是統稱神為了懲罰墮落的百姓而使用的所有懲戒手段。"
  "relation": "第六災原本打在埃及人身上，本章第27節把同一個病名調轉方向打向以色列；第60節再用一個更廣的字把他們在埃及看過的一切疾病都收進來，並說那是他們所懼怕的。"
