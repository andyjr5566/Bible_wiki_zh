  "summary": "第52至57節。CT 說這形容以色列人屆時將放棄鄉村田野，逃到有城牆防護的幾個城市中，被敵軍圍困，終至陷落；GT《申命記串珠聖經註釋》說神會興起外邦勢力攻擊他們，使他們受城困之苦；GT 說以色列的歷史上發生過好幾次殘酷的圍城（王下六24至29；二十五1至3；哀四10）；BH 說圍城是古代近東常見的軍事手段，圍城者切斷補給以逼降，並指城牆是以色列所倚靠的防禦而人的工事終究靠不住。"
