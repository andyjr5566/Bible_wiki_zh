- "title": "蝗災"
  "path": "link_folder/歷史/蝗災.md"
  "summary": "第38節與第42節兩次以蝗蟲收尾：帶到田間的種子雖多、收進來的卻少，樹木和地裡的出產必被蝗蟲所吃。CT 說被蝗蟲吃了代表一切減產的天然和人為災害因素；GT《聖經精讀本──申命記註解》說形成巨大的群、隨風移動而肆意吃掉農作物的蝗蟲是古代社會最具破壞力的災殃之一，在聖經中蝗蟲群與神的審判密切相關；KC 說神用蟲子與蝗蟲，使他們指望有結果的每一樣都令他們徹底失望。"
  "relation": "出埃及記第十章的蝗蟲是打埃及的第八災，本章的蝗蟲落在以色列自己的田裡，而且不記事件、只記結果。"
