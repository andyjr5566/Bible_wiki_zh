  "summary": "第51節「你的五穀、新酒，和油，以及牛犢、羊羔，都不給你留下，直到將你滅絕」。GT《聖經精讀本──申命記註解》在38至42節說莊稼、葡萄酒與油是迦南的三大出產、也是必不可缺的生活用品，並說這種缺乏並不是他們的懶惰所導致；KC 說咒詛會落在他們為享受這地的祝福所做的每一項工作上；GT 說第50至51節詳細形容侵略者的行為，他們不尊重生命、徹底劫掠百姓。"
