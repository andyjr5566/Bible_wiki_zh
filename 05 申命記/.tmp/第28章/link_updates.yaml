- "title": "秋雨春雨（yo.reh、mal.qosh）"
  "path": "link_folder/原文/秋雨春雨（yo.reh、mal.qosh）.md"
  "summary": "第12節「按時降雨在你的地上」。CT 說按時降雨意指按照農作物播種和收割的需要，而降秋雨春雨。STEP 顯示本章沒有用 yo.reh 與 mal.qosh 這兩個專名，只有 me.tar（H4306，簡要詞典義 ma.tar: rain）與 be./'i.T/o（H6256，簡要詞典義 et: time，在它的時候）。GT《申命記雷氏研讀本》在本節說從天上府庫降雨灌溉土地的是神，不是巴力。"
  "relation": "申十一14 把兩個雨季點名，本章只說「按時」；那兩個字之所以有內容，是因為前面已經把時候說清楚了。"
