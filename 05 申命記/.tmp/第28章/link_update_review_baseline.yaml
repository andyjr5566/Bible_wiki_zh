- title: 起泡的瘡
  path: link_folder/原文/起泡的瘡.md
  definition: 出埃及記9:9-10記載第六災「起泡的瘡」，原文為 שְׁחִין פֹּרֵחַ אֲבַעְבֻּעֹת（*shechin poreach
    ava'bu'ot*，H7822 搭配 H6524 與 H76）。其中 שְׁחִין（H7822）指發炎的瘡或疹子，פֹּרֵחַ（H6524）指迸發／發出，אֲבַעְבֻּעֹת（H76）指起泡／水泡。CT
    的原文字義把這個詞拆成兩層：「起泡」是水泡、瘡，「瘡」是迸出的疹子——合起來不是普通的瘡。GT《中文聖經註釋》說明加上「起泡」的分量：「起泡的瘡是表明非常致命而疼痛的毒瘡。起泡表明有膿汁。原文所用的瘡字，加上這起泡的，就不是普通的瘡了。」同一份註釋並指出這病在當地本有專名：「在埃及生瘡本是常事，故有『埃及瘡』（申28:27）的病名，正如『香港腳』是特產於香港的濕氣疹一樣。」
  development: GT《丁道爾》建議換一個譯法：「『瘡』翻作『紅腫之處』更佳……紅腫之處接而發出各種的『膿頭』或『潰瘍』。」它並列出舊解與新解：舊日解經家相信這是「尼羅河疥瘡」（Nilescab），「這種皮膚的頑疾，現時在尼羅河水漲溢時依然常見」，傳染性的痱子則是另一個可能。GT《聖經精讀本》從原文的字義補上感受：這個字有「被火燒」、「開始熱」、「沸騰」之意，可以想像那是「黑色發熱並帶有難忍的痛癢，慢慢變成膿皰的一種皮膚病」。GT《串珠聖經註釋》把病程說得最簡潔：「病徵是起膿，發炎，痛楚，情況非常嚴重，但不至於死。」BH
    則指出這病使行法術的在禮儀上不潔，無法再執行他們的職務。
