- title: 第六災：瘡災
  path: link_folder/歷史/第六災：瘡災.md
  definition: 出9:8-12。摩西取爐灰向天揚起，灰在埃及全地變作塵土，在人畜身上成了起泡的瘡；行法術的因自己身上也有瘡而站立不住。這爐是什麼爐，各家不一：KC
    讀為磚窯（象徵埃及作壓迫以色列的火爐），GT《舊約聖經背景註釋》則明白否定——「埃及的磚通常是曬乾而非窯燒的。本節所說的爐子規模頗大，因此可能是焚燒死畜屍骸之處」，GT《丁道爾》主張是「煤煙」，GT《中文聖經註釋》以第9節「可捧的固體物」反駁煤煙說（見〈爐灰的出處〉）。
  development: CT 的話中之光把這一災的反諷說得最清楚：「向天揚灰，原是埃及人的一種迷信作法，用意在免受災害。但此次反而叫他們身上生瘡潰爛，為要破除他們的迷信。」——GT《舊約聖經背景註釋》正好提供了那個習俗的背景：「埃及人有時用散灰作為遏止瘟疫的法術儀式。」CT
    靈訓要義並指出本災對付的是「埃及的醫治之神」，BH 據此點名 Imhotep 與 Sekhmet。至於這瘡的性質，GT《中文聖經註釋》連結利13:18-23
    的痲瘋診斷與王下20:1-7、伯2:7-8 的毒瘡，GT《丁道爾》也指出「摩西律法關乎醫藥的部分亦有使用這字（利13:18）」；BH 則單獨連到伯2:7 約伯的苦難。KC
    從煤煙讀出審判的預表：「煤煙說到在窯中焚燒所帶來的死」，是「神烈火般審判的憑據」。
