- title: 天如鐵地如銅（乾旱咒詛的意象）
  path: link_folder/主題/天如鐵地如銅（乾旱咒詛的意象）.md
  definition: '利未記26章19節用兩種金屬形容旱災：「我必斷絕你們因勢力而有的驕傲，又要使覆你們的天如鐵，載你們的地如銅。」


    STEP 語言資料顯示，「天」對應的比喻物是 בַּרְזֶל（bar.Zel，H1270，鐵），「地」對應的是 נְחֻשָׁה（ne.chu.Shah，H5154，銅）。值得注意的是同一組比喻在申命記二十八23
    是反過來的，GT 丁良才把這件事直接點出來：「這借喻在申二十八23節作『你頭上的天要變為銅，腳下的地要變為鐵』。」他自己對這兩個字的解釋是：「天久不下雨，地也不生長，甚至天干如鐵，地又黃又硬如銅。」


    GT《串珠聖經註釋》指出這一節是刻意寫來打臉第4節的：「『天如鐵 …… 地如銅』：與4節的『天下時雨』及『地出土產』諷刺地相對。神賜給他們的不再是時雨及土產，乃是旱災及失收。」GT《舊約聖經背景註釋》則給出這個比喻的來歷：「這個比喻性的咒詛，在申命記二十八章的咒詛部分，和以撒哈頓的條約（主前七世紀）中，都有出現。它暗示地本身將會與百姓為敵，變得堅硬如銅，原因是天的鐵門關閉，不復有雨降於其上。」BH
    的讀法一致：鐵天強調「立約破裂時神的審判無法穿透」，銅地象徵「土地的不育與荒瘠」。


    這節前半的「因勢力而有的驕傲」還藏著另一種古代讀法。STEP 顯示原文是 גְּאוֹן עֻזְּכֶם（ge.''on / ''u.ze.Khem，H1347＋H5797，字面「你們力量的驕傲」）。GT
    丁良才記下猶太人的另一種理解：「猶太人以為『因勢力而有的驕傲』幾個宇，是指著聖所說的，因為結二十四21節和本句的原文是－樣的，在那裡卻是指著聖所說的。迦勒底的譯本作『我必毀壞你們勢力所誇耀的聖所』。」按這個讀法，這一節預告的就不只是旱災，而是聖殿本身的傾覆——而本章
    v31 果然接著說「使你們的眾聖所成為荒場」。


    CT 把重點放在驕傲被對付這一面：「抵擋神、無視神的話語是因驕傲而有。驕傲是認為自己很了不起的錯覺，是罪惡的根源。」KC 的說法是：一切努力最後只剩「消耗力氣而換不到糧食」，「那必然會擊垮他們對自身力量的驕傲」。'
