- title: 五穀、新酒和油（da.gan、ti.rosh、yits.har）
  path: link_folder/原文/五穀、新酒和油（da.gan、ti.rosh、yits.har）.md
  definition: '申11:14 說按時的雨帶來三樣收成：「使你們可以收藏五穀、新酒和油」。


    STEP 顯示三者在原文是三個不同的名詞：דְגָנֶךָ（de.ga.Ne./kha，H1715，da.gan 簡要詞典義 grain）、וְתִירֹשְׁךָ（ve./ti.ro.she./Kha，H8492，ti.rosh，本節譯義
    new wine）、וְיִצְהָרֶךָ（ve./yitz.ha.Re./kha，H3323，yits.har，本節譯義 fresh oil）。動詞「收藏」是
    וְאָסַפְתָּ（ve./''a.saf.Ta，H622，a.saph 聚集）。


    **這三樣是那地的主要物產。** BH 說明它們在以色列的飲食與經濟裡各有位置：穀物是做餅的基本糧食，新酒是剛收成的葡萄所出、象徵喜樂與慶祝，油主要指橄欖油，用於烹調、點燈與膏抹；能把三樣收進倉裡，就代表一次成功的收成。


    KC 依詩104:14-15 把三者分別對應到三件事：穀物用來作食物，酒與喜樂相連，油使人的臉發光。他並從這三樣往前引，讀成信徒在那地上可以享用的份。


    **第15節把範圍再擴大一層。** 「也必使你吃得飽足，並使田野為你的牲畜長草」——CT 指出雨水不僅為生長五穀所需，並且有助牧草生長供牲畜食用，而五穀和牲畜又都是人類的食物來源，所以說「使你吃得飽足」。==雨落下來，一路管到人的飯桌與牲畜的草料。==


    這三樣在本章的位置是條件句的答應部分，前面是第13節的「若留意聽從」，後面是第16至17節的警告。GT《聖經精讀本──申命記註解》對這種鋪排下的判語是：摩西講章的特徵是先羅列順服神所帶來的祝福，之後再明示不順服所召來的咒詛。'
  development: '這三樣物產在申命記裡走了一圈：先是神給的，然後是要還回去的。


    申命記11:14 把它們放在應許的位置——若留意聽從誡命，神就按時降秋雨春雨，使人可以收藏五穀、新酒和油。三樣東西在那裡是順服的結果，也是那地與埃及不同的證據。


    到了申命記12:17，同一組三樣物產換了身分：它們的十分之一「都不可在你城裡吃」，要帶到耶和華所選擇的地方，在神面前與兒女、僕婢、利未人一同吃。GT《聖經精讀本》說這三樣是希伯來人視為耶和華神之特別禮物的迦南地三大特產，兩章合起來正好說明為什麼——正因為是神給的特別禮物，它的十分之一才要在神面前吃掉，而不是在自己家裡吃掉。


    從降雨到十一奉獻，這組詞在申命記裡承擔的是同一件事：把地的出產一路指回賜下出產的那一位。'
