- title: 遵行誡命必蒙福的七重應許（利26：3-13）
  path: link_folder/主題/遵行誡命必蒙福的七重應許（利26：3-13）.md
  definition: '利未記第26章3至13節是全書唯一一段完整的祝福清單。條件只有一句：「你們若遵行我的律例，謹守我的誡命」（v3）。接下來的十節，福氣一層層往上加。


    排在最前面的是雨。GT《舊約聖經背景註釋》解釋為什麼雨排第一：「地若不持續出產，人就不能存活。因此能否豐饒──即風調雨順，田地、葡萄收穫豐饒──是經常存在的顧慮。因此之故，古代近東很多神祇都和雨及風暴、豐饒、生長季節有關。」GT
    丁良才則把巴勒斯坦的雨季講得很細：秋雨在陽曆九月起頭，十二月到正月最多，「到了四月中旬就全然停止」，而三、四月間的春雨落在收割之前——「這兩季的雨水雖比冬天的雨水少，卻于猶太國的莊稼是最關緊要的」。


    豐收的程度用農事行程來形容：「你們打糧食要打到摘葡萄的時候，摘葡萄要摘到撒種的時候」（v5）。GT《啟導本聖經利未記註釋》把月份排出來：大小麥三月、五月開始收割，要一路打到八月葡萄成熟；葡萄從八月摘起，又摘到十、十一月撒種的時候——「說明一年到頭，田間出產豐收，來不及收割」。到了
    v10「你們要吃陳糧，又因新糧挪開陳糧」，丁良才說得更白：「就是為新糧騰地方，顯明陳糧未盡，新糧無地可容。」


    第二層是安全（v6-8）：惡獸絕跡、刀劍不入境，若真有人來犯，「你們五個人要追趕一百人，一百人要追趕一萬人」。第三層是人口與聖約的堅立（v9）。STEP 語言資料顯示，v9
    的「生養眾多」是 פָּרָה（H6509，使結果子）與 רָבָה（H7235A，使增多）這一對動詞，與創世記一28 給人的那句祝福同字；「眷顧」則是 פָּנָה（H6437G，轉向）。


    最高的一層留在最後（v11-13）：神要親自住下來、走動、認他們作子民。KC 把物質與屬靈兩層的關係說清楚：「除了這物質的祝福之外，還有屬靈的祝福。那就是祂住在他們中間、要作他們的神、他們要作祂子民的特權。物質的祝福同時也是神持續住在他們中間的證明。」而
    v13 用出埃及作結：「我也折斷你們所負的軛，叫你們挺身而走。」GT《舊約聖經背景註釋》解釋這個畫面：軛是「加諸牲畜後頸上的橫木」，百姓在埃及「肩負重擔，有如負軛的牛」，神打碎了它，使他們「能夠像自由人一般昂然而立，重獲自由和作為人的尊嚴」。


    CT 提醒讀這段的人一件容易忽略的事：「看看神所應許的福，就如空氣充滿人所在的空間一樣，可說是俯仰皆是，涵泳其間而不自知，而且是不必付任何代價。只有當人呼吸困難的時候，才可以體會空氣的可貴。」'
