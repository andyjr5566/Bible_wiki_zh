- title: 蝗災
  path: link_folder/歷史/蝗災.md
  definition: 出十1-20 記載的第八災。摩西向埃及地伸杖，耶和華使東風「一晝一夜」颳在埃及地上，到了早晨東風把蝗蟲颳了來，落在埃及四境，「以前沒有這樣的，以後也必沒有」（v14）。蝗蟲遮滿地面使地都黑暗了，吃盡冰雹所剩的一切菜蔬和樹上果子，「連一點青的也沒有留下」（v15）。法老急忙召摩西、亞倫認罪求代求；摩西離開法老去求耶和華，神轉了極大的西風把蝗蟲颳起吹入紅海，「在埃及的四境連一個也沒有留下」（v19）。但耶和華使法老的心剛硬，不容以色列人去。
  development: '**蝗蟲的規模。** GT《聖經精讀本》從原文說明這個字本身就帶著數量：「蝗蟲的希伯來語的意思是『成群』、『無數的大群』。」GT《舊約聖經背景註釋》給的數字更驚人：「蝗蟲每日食量與本身體重相等。蝗群有時大得可以覆蓋四百平方哩，而每平方哩的蝗蟲更可以多達一億」——「無論有什麼逃脫了冰雹大難的，此時無疑都不能倖免。」GT《每日研經叢書》則提醒蝗蟲本身並非禍害：「通常牠對人並不造成威脅，甚至能給人在菜肴上添作可口的副食（利11:21-22；太3:4）。但是就像許多其他的昆蟲和小動物一樣，一旦環境有利，它們便會吞吃人類所賴以生存的農作物，而威脅人類。」


    **為什麼落在埃及。** GT《中文聖經註釋》指出蝗災在埃及其實少見：「蝗蟲是中東常有的災禍，但在埃及則較少。所以這是神特別降下，為要顯出神之大能與榮耀，以及屈使法老低頭的災禍。」GT《舊約聖經背景註釋》說明牠們從哪裡來：「蝗蟲的繁殖地在蘇丹一帶，造成這一連串災禍的潮濕天氣，同時亦增添其數量。蝗蟲在二、三月間開始襲擊，隨著風向遷徙，或到埃及，或到巴勒斯坦。」同一份註釋並點出這一災在整個序列裡的位置：「埃及經濟已經崩潰，但其主要神明仍未蒙羞受辱」——那要等到下一災。


    **神的軍隊。** KC 用約珥書的話為這群蝗蟲定性：牠們是「耶和華的軍隊」（珥2:11）。GT《聖經精讀本》同樣指出「神正是把這些可怕的蝗蟲看作是自己的軍隊（珥2:25），並把它作為了第8個災難加在埃及人的身上」，並列出聖經其他以蝗蟲為災的段落（珥1:4-7；2:1-11；耶46:23；啟9:3-11）。GT《丁道爾》從先知書讀出同一條線：「從阿摩司（摩7:1-3）而至約珥（珥1:1-7），可怖的蝗蟲都是眾先知末世預言中毀滅的象徵，又是神審判的描繪。」KC
    則把它連到啟9:3，指出蝗蟲在那裡與邪靈的權勢相連。


    **東風與西風。** BH 指出東風在聖經裡本就與審判相連——創41:6 法老夢中的東風烤焦了穀穗——並說本章的風「日夜不停地吹，強調了神審判的確定與徹底」。CT
    從地理上說明蝗蟲的來路：「『東風』指從東邊吹來的風，埃及的東邊是紅海和亞拉伯曠野……那些蝗蟲可能是在中間的草原地帶繁殖，乘著強勁的風向遠處移動。」災的結束則用相反方向的風：GT《中文聖經註釋》指出「原文的西風是『海風』」，GT《舊約聖經背景註釋》補充「就以色列而言，海風就是西風。但對埃及來說，這風應該來自北或西北，將蝗蟲吹回海中」。CT
    注意到經文用了「轉」字——「表示改變風向」，並指出吹走同樣是神蹟：「正如吹來那麼多的蝗蟲乃是神蹟一樣，吹走所有的蝗蟲，連一隻也沒有留下，乃是另一個神蹟；神作事乾淨俐落。」


    **「紅海」是哪個海。** GT《中文聖經註釋》指出「原文的紅海是『蘆葦海』，而不是紅海」，並推測「較近事實的，可能是指蘇彝士灣至地中海之間的一些湖泊沼澤」；GT《啟導本》也記下原文作
    yam sup，「不可能是今天我們所知道的紅海」。KC 從這裡看出一個伏筆：所有蝗蟲都死在那海裡，而日後法老和他的馬兵也要死在同一個地方。


    **傳給後代。** KC 指出第八災對以色列人有一個特別的身分——它是「給以色列人的特別記號」，他們要據此把神向埃及所行的告訴後代；KC 並注意到約珥書有同樣的吩咐：「你們要將這事傳與子，子傳與孫，孫傳與後代」（珥1:3）。'
