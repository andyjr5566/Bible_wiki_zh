- title: 不聽從神的五層漸進懲罰（利26：14-39）
  path: link_folder/主題/不聽從神的五層漸進懲罰（利26：14-39）.md
  definition: '利未記26章14至39節不是一份平鋪的災難清單，而是一組會升級的警告：每一段都以「你們若還不聽從我」「若仍不改正歸我」開頭，接著加重一次。


    **兩家把段落切在不同的地方，值得先講清楚。** GT 丁良才在 v14 下把五段分成：各種疾病（14-17）、地無出產（18-20）、野獸為害（21-22）、真神降災（23-26）、全地荒涼（27-39）。CT
    的〔靈訓要義〕切法不同：第一層禍（16-17）、第二層禍（18-20）、第三層禍（21-26）、第四層禍（27-35）、第五層禍（36-39）——CT 把野獸和刀劍瘟疫併成同一層，末尾則把
    36-39 節的「心驚膽怯」獨立成一層。兩種切法都算得出五層，差別在於中段合併與末段獨立。丁良才另外標出五次警告各自的位置：第二次在 v18、第三次在 v21、第四次在
    v23、第五次在 v27，起點則是 v14-15。


    災難的內容依序是：驚惶與癆病熱病、仇敵轄管（v16-17）；旱災與失收（v19-20）；野獸奪去兒女牲畜、道路荒涼（v22）；刀劍、瘟疫、糧食按分量秤給（v25-26）；吃兒女的肉、邱壇日像被毀、城邑聖所荒涼、散在列邦（v29-39）。


    STEP 語言資料在兩處補上了漢語譯文看不出的細節。其一，v22「搶吃你們的兒女」的動詞是 שָׁכֹל（H7921A，詞典義 be bereaved，本節
    context gloss 作 make childless），意思重在「使人失去兒女」而不在「吃掉」；CT 的〔原文字義〕正是這樣給的：「喪失(親人)，使無後」。其二，v38「你們要在列邦中滅亡」的動詞是
    אָבַד（''a.vad.Tem，H6），詞典義是 to perish，而丁良才主張這裡取的是它義域的另一端：「『滅亡』兩個字不是歸於無有，乃是失喪的意思」，並舉出同一個字在申二十二3譯「失落」、撒上九3譯「丟了」、耶五十6譯「迷失」、結三十四6譯「失喪」，又以下文
    v40 他們仍能承認自己的罪為證。


    四家對這段的用意說法一致。GT《串珠聖經註釋》：「這裡所描述的禍害比所應許的祝福為詳盡，這做法含有很濃的教育作用……故此『畏懼』常常比『愛心』更能激發人行善的意志。」CT：「神對那些悖逆的百姓的管教是一步一步地加重。起初神是輕輕地給他們一點管教，他們不回頭，神就加重一點。」KC
    補上人這一方為什麼要走到第五層：「神施行管教的目的是要祂的百姓改變他們的行徑，但百姓卻反其道而行。」BH 則從立約的角度定性，說這是「宗主—藩屬條約」裡的咒詛條款，「刑罰與冒犯相稱」。'
