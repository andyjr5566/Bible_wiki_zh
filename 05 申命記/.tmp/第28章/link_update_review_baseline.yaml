- title: 秋雨春雨（yo.reh、mal.qosh）
  path: link_folder/原文/秋雨春雨（yo.reh、mal.qosh）.md
  definition: '申11:14 是條件句的答應部分：「必按時降秋雨春雨在你們的地上，使你們可以收藏五穀、新酒和油」。


    STEP 顯示這兩場雨在原文是兩個專有名詞：יוֹרֶה（yo.Reh，H3138，簡要詞典義 autumn rain）與 וּמַלְקוֹשׁ（u./mal.Ko.osh，H4456，spring
    rain）；「按時」是 בְּעִתּוֹ（be./''i.T/o，H6256 et 時候）。


    **它們是巴勒斯坦雨季的兩端。** CT 說秋雨又名早雨，約在陽曆九、十月間降雨，供應播種後所需雨水；春雨又名晚雨，約在陽曆三、四月間降雨，供應收割前所需雨水。GT《申命記雷氏研讀本》給的時間相同，並指出「這兩次降雨就是雨季的開始和結束」。GT《啟導本聖經申命記註釋》把農時講得更細：秋雨在十至十一月間、春雨在三至四月間，秋雨時播麥種、春雨時收割；雨季開始時夏天的乾旱消除、農地可以耕種，雨季將結束時原野一片碧綠、牲畜有了飼料。GT《申命記串珠聖經註釋》只用一句話帶過——每年的十月到四月是雨季的開始和結束。


    GT《聖經精讀本──申命記註解》把兩場雨的作用分開講：秋雨潤濕了旱季乾涸、堅硬的土地，起著使地易於耕種的作用；春雨落在秋收季節之前，起著使農作物結實更多的作用。BH
    的說法同一方向：早雨在十月或十一月開始，使土地變軟以便犁地播種；晚雨在三、四月，對作物成熟至關重要。


    **這兩場雨在本章是條件的兌現。** ==它們前面接著第13節的「若留意聽從」，後面接著第17節的「天閉塞不下雨」。== 同一件事被講了正反兩次：順服就按時降雨，偏離就不下雨。KC
    從時間讀出另一層：雨不是求就有，而是照神的時候降下，他把雨與順服連在一起。'
