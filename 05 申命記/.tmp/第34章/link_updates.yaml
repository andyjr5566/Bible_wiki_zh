- "title": "摩押平原"
  "path": "link_folder/地點/摩押平原.md"
  "summary": "第1節「摩西從摩押平原登尼波山」，第8節「以色列人在摩押平原為摩西哀哭了三十日」。這是本章唯一出現兩次的地名，也是全卷申命記講論的所在地。GT《啟導本聖經申命記註釋》說本章為申32:48～52\
    \ 的繼續，中間插入三十三章。BH 說摩押平原位於約但河東，是以色列人進入應許之地前最後的營地，摩西正是在這裡發表了他最後的講論與祝福；BH 又說這個地點凸顯了從摩西的領導過渡到約書亞的領導，因為以色列人正準備跨進迦南。CT\
    \ 說摩西從這裡登尼波山，上了那與耶利哥相對的毘斯迦山頂；GT《聖經精讀本──申命記註解》說從毗斯迦山所在的摩押平原到北部黑門山腳下的但約有160公里。"
  "relation": "民數記後半到申命記全卷都發生在這片平原上，本章是它最後一次出現：一個人從這裡走上山去不再回來，一群人在這裡把喪期守滿。跨過約但河的那一步，是在這裡站了很久之後才邁出去的。"
