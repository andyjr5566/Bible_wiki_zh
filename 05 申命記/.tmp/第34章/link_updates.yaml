- "title": "興起一位先知像我"
  "path": "link_folder/神學/興起一位先知像我.md"
  "summary": "第10至12節是全卷申命記的結語：「以後以色列中再沒有興起先知像摩西的。他是耶和華面對面所認識的。耶和華打發他在埃及地向法老和他的一切臣僕，並他的全地，行各樣神蹟奇事，又在以色列眾人眼前顯大能的手，行一切大而可畏的事。」STEP\
    \ 顯示第10節是 ve./lo kam na.Vi od be./Yis.ra.El ke./mo.Sheh（H6965B qum: to arise、H5030\
    \ na.vi: prophet），末句是 pa.Nim el pa.Nim（H6440H 重複，字面是臉對臉）。CT 說面對面喻指彼此親密的交往和友誼，並說神所設立的四種職事——審判官、君王、祭司、先知——都集中在摩西身上，舊約的其他先知只是重新強調摩西所頒佈的律法的原則。GT《聖經精讀本──申命記註解》從兩方面說明摩西為何特殊：一是在與神的親密關係上，神對摩西好像人與朋友說話一般、面對面說話（出33:11）；二是在彰顯神之權能的事情上。GT《啟導本聖經申命記註釋》說本書結尾三節對摩西的品格和能力作了詳述，他集先知、審判者、祭司和行政首長於一身，並說等到主基督來到世間後、這位人子所達到的境界則遠遠超過摩西；它並註明第12節有古卷在句首多「沒有誰像摩西那樣」數字。KC\
    \ 說在這幾句關於摩西的最後的話裡，他的失敗一次都沒有被提起，並說摩西在神的全家盡忠（來3:1-6），是那位完全忠心者的預表。"
  "relation": "申18:15 應許神要興起一位先知像摩西，本章末了卻說再沒有興起先知像摩西的。四家都不把這讀成矛盾——GT《啟導本聖經申命記註釋》說等到主基督來到世間後、這位人子所達到的境界遠遠超過摩西；本條目的主題發展也早已指出，兩句話合起來是把應許往前推，不是把它取消。"
  "overview_review":
    "signals": []
    "accumulation_count":
