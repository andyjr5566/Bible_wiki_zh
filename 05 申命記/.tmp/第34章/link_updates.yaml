- "title": "哀哭三十天"
  "path": "link_folder/文化/哀哭三十天.md"
  "summary": "第8節「以色列人在摩押平原為摩西哀哭了三十日，為摩西居喪哀哭的日子就滿了。」CT 的原文字義給「哀哭」首字的是哀號、給「居喪」的是哀悼、給「哀哭」次字的是哭泣，並說一般哀悼期為七日（參創五十10），但人們為大祭司亞倫（參民二十29）與神人摩西則哀哭了三十日；他在話中之光另說百姓為亞倫和摩西都哀哭了三十日，並不是因為悲傷，而是表達對神的僕人極大的敬意，也是表達對神的敬畏。GT《聖經精讀本──申命記註解》說哀悼期一般為七日，但人們為亞倫與摩西則哀哭了三十日。KC\
    \ 說為摩西之死哀哭三十日，與為他哥哥亞倫哀哭的日子一樣長（民20:29）。BH 說三十日的哀悼期是以色列文化中給重要人物的慣例，這段時間讓群體消化失落、適切地紀念死者，而哀悼期的結束標誌著從悲傷轉入行動。"
  "relation": "民20:29 是為亞倫，本章是為摩西——這個期限在五經裡只出現這兩次，而且是同一組人。BH 另注意到本章的收尾方式：哀哭的日子滿了，接著就是約書亞接手。"
