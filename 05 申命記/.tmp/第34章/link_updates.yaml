- "title": "大能的手"
  "path": "link_folder/神學/大能的手.md"
  "summary": "第12節「又在以色列眾人眼前顯大能的手，行一切大而可畏的事。」CT 的原文字義給「大能」的是強壯的、堅固的，給「可畏的事」的是敬畏、恐懼；他說這指諸如分開海水使成乾地、擊打磐石出水、天降嗎哪等大而可畏的事，雖然是神的能力使然，但都通過摩西的話和手杖顯在以色列人眼前。GT《啟導本聖經申命記註釋》說本書結尾三節對摩西的品格和能力作了詳述，他行神蹟奇事無人能及。BH\
    \ 說這些大能的作為包括埃及的災、分開紅海與賜下嗎哪，它們彰顯神的權能也印證摩西的領導，而且是在全以色列眼前發生的，使他的職分無可否認。"
