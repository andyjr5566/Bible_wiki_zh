- "title": "約書亞"
  "path": "link_folder/人物/約書亞.md"
  "summary": "第9節「嫩的兒子約書亞；因為摩西曾按手在他頭上，就被智慧的靈充滿，以色列人便聽從他，照著耶和華吩咐摩西的行了。」CT 的原文字義給「嫩」的是魚、後裔，給「約書亞」的是耶和華是拯救；他說約書亞原名何西阿、摩西另給他改名約書亞，他曾率領一批精選的軍隊殺敗亞瑪力人（參出十七9），又當過摩西的幫手（參出二十四13），其後又被摩西選為以色列全軍的統帥（參民二十七18~20）。GT《申命記串珠聖經註釋》說約書亞接任為摩西的繼承人；GT《聖經精讀本──申命記註解》說約書亞在此處的出現不僅自然地連接了本書與約書亞記，還暗示了已作好準備展開迦南征服戰。KC\
    \ 說約書亞接續摩西作百姓的領袖，不是接續作先知，而是接續作領兵取得應許之地的領袖。BH 說約書亞的名字意思是耶和華是拯救，他在出埃及記17章9至14節是軍事統帥、在民數記14章6至9節是兩個忠心探子之一。"
  "relation": "先前十六章記的是他受揀選、受按立、受囑咐；本章記的是他真的接了手，而且百姓真的聽從。KC 在這裡加了一個限定：他接的是領袖的位分，不是先知的位分。"
