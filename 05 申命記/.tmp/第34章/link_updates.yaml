- "title": "神與摩西面對面明說"
  "path": "link_folder/神學/神與摩西面對面明說.md"
  "summary": "第10節「以後以色列中再沒有興起先知像摩西的。他是耶和華面對面所認識的。」STEP 顯示末句是 ye.da.O Yah.weh pa.Nim\
    \ el pa.Nim（H3045 ya.da: to know 加 H6440H 重複，字面是臉對臉）。CT 說面對面喻指彼此親密的交往和友誼，並在話中之光說摩西可以與神直接說話（出三十三11），而約書亞則需要藉著祭司的烏陵和土明來尋求神的旨意（民二十七21）。GT《申命記雷氏研讀本》說神面對面與摩西說話（比較出三三11；民一二8），約書亞需要祭司幫助他去認識神的旨意；GT《啟導本聖經申命記註釋》說神直接向摩西說話、約書亞則須藉著祭司的烏陵和土明來尋求神的旨意，所以在摩西死後再沒有興起先知像摩西的；GT《聖經精讀本──申命記註解》說與其他先知不同，神對摩西好像人與朋友說話一般、面對面說話（出33:11），也使他親眼目睹神榮耀的臨在（出33:18~23）。KC\
    \ 說摩西與神的相交也是獨一無二的。BH 說不同於其他藉異象或夢領受的先知，摩西是直接而親身地與神說話。"
