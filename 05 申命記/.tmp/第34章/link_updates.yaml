- "title": "摩西不得進入應許之地"
  "path": "link_folder/事件/摩西不得進入應許之地.md"
  "summary": "第4節末「現在我使你眼睛看見了，你卻不得過到那裡去」，第5節「於是，耶和華的僕人摩西死在摩押地，正如耶和華所說的」。CT 說「使你眼睛看見了」必是神賜給他特殊的恩典，有晴朗的天氣加上很好的視力，才能一眼眺望南北約300公里、東西約100公里全境；他說不得過到那裡去的表面理由是因摩西在米利巴水犯錯（參民二十12），實際上有著屬靈的象徵意義：迦南美地預表天國、不能靠人的功績進去，摩西預表律法、人不能靠行律法進天國；他並在話中之光說神讓摩西觀看，一面是讓他看清楚神所要做的，一面也是藉著觀看來履行認領應許之地的法律手續。GT《聖經精讀本──申命記註解》給的兩層理由相同：表面理由是因在米利巴水事件時未能全然彰顯神的聖潔（民20:12），深層原因是為了曉諭人天國斷不能靠著人的功勞而進去，以及摩西象徵著律法。KC\
    \ 說神的定規是他不得過去，神的恩典是他看見了那地，看見的方式是別人都沒有過的。BH 說這句話突顯摩西早先違命的後果，也提醒神的聖潔與公義。"
  "relation": "先前六章記的是判詞、確認與複述；本章記的是判詞真的執行了。四家在這一節都不只講懲罰，也講恩典——他被帶上山看完了全地，而且那場觀看本身還帶著認領產業的法律作用。"
