  "path": "link_folder/主題/一百二十歲的摩西.md"
  "summary": "第7節「摩西死的時候年一百二十歲；眼目沒有昏花，精神沒有衰敗。」CT 說這可分成三個四十年：頭四十年「我能」、次四十年「我不能」、後四十年認識「神能」；他在話中之光說第一個四十年是安逸地在埃及王宮作王子，第二個四十年是被迫到米甸曠野作牧羊人，第三個四十年是蒙召作神的僕人和話語的出口，並說根據對古埃及木乃伊的檢測、當時一代人的平均壽命大約四十年，摩西一生的年日一共活了三代。KC\
    \ 也把摩西的一生分成三段四十年：在法老宮中四十年、在曠野與葉忒羅的羊群同在受神學校訓練四十年、在曠野與神的百姓同在四十年；他並引詩篇90篇3節說到人歸回塵土。BH\
    \ 說120歲這個年數分成三個四十年——在埃及、在米甸、帶領以色列，顯出他生命中預備、蒙召與成全三個階段。"
