- "title": "摩西"
  "path": "link_folder/人物/摩西.md"
  "summary": "本章從頭到尾都在講摩西：登山、觀看、死、被葬、被哀哭，最後三節是對他一生的總評。CT 的內容綱要把本章分成四段：在毗斯迦山頂上遠眺迦南美地（1~4節）、死時一百二十歲並由神埋葬在無人知曉之處（5~7節）、以色列人哀哭三十日與約書亞接續（8~9節）、簡述摩西之豐功偉業（10~12節）。GT《聖經精讀本──申命記註解》說本章記錄了偉大的神人摩西的死亡埋葬，並說摩西所要作的最後一件事就是歸到列祖之懷。KC\
    \ 說摩西七次被記在山上：作代求者（出17:8-16）、領受律法與會幕樣式（出24:12-18）、金牛犢之後為百姓代求（出32:30-32）、領受第二次的石版（出34:4）、在何珥山把祭司職分從亞倫轉給以利亞撒（民20:23-28）、在尼波山看那地（申34:1）、以及在變像山上與以利亞同和主耶穌一起（太17:1-8）。BH\
    \ 說摩西一貫被稱為耶和華的僕人，這個稱號突顯他的謙卑與順服。"
  "relation": "這是摩西在正典敘事裡最後一次登場，也是他唯一一次被稱為耶和華的僕人而死。KC 把他七次上山排成一條線，本章那一次是倒數第二次——最後一次要等到變像山。"
