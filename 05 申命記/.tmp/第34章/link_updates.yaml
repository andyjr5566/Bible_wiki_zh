- "title": "以色列"
  "path": "link_folder/原文/以色列.md"
  "summary": "第8節「以色列人在摩押平原為摩西哀哭了三十日」，第9節「以色列人便聽從他，照著耶和華吩咐摩西的行了」，第10節「以後以色列中再沒有興起先知像摩西的」，第12節「又在以色列眾人眼前顯大能的手」。本章四次提到這個群體，功能各不相同：哀哭的是他們、聽從新領袖的是他們、被說成再沒有出過像摩西那樣先知的也是他們、當年親眼看見大能作為的還是他們。STEP\
    \ 顯示第9節「聽從」是 va/i.yish.me.U（H8085H，簡要詞典義 sha.ma: to hear: obey），後接 va/i.ya.a.Su\
    \ ka./a.Sher tzi.Vah Yah.weh（H6213A 加 H6680 tsa.vah: to command）。GT《聖經精讀本──申命記註解》說約書亞在此處的出現不僅自然地連接了本書與約書亞記，還暗示了已作好準備展開迦南征服戰。BH\
    \ 說以色列人聽從約書亞標誌著領導權轉移中關鍵的一刻，這份順服對他們攻取迦南是必要的。"
  "relation": "全卷申命記寫滿了以色列的悖逆，最後一章卻用一句話收在他們的順服上——以色列人便聽從他，照著耶和華吩咐摩西的行了。這是摩西五經給這個群體的最後一個動作。"
