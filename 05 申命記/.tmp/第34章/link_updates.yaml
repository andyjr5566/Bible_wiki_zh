    - !!int "2"
    "definition": "keep"
    "development": "keep"
- "title": "瑣腓田與毘斯迦山頂"
  "path": "link_folder/地點/瑣腓田與毘斯迦山頂.md"
  "summary": "第1節「摩西從摩押平原登尼波山，上了那與耶利哥相對的毘斯迦山頂。」CT 的原文字義給「毗斯迦」的是裂縫，並說毗斯迦山頂又在尼波山嶺中有一最高山峰名叫毗斯迦山，與約但河西面的耶利哥相對。GT《聖經精讀本──申命記註解》說尼波山與毗斯迦山都是位於亞巴琳山脈的高峰，毗斯迦山是指尼波山的最高峰，此地最適於眺望迦南地；GT《啟導本聖經申命記註釋》說毗斯迦山很可能是尼波山的一座高峰，立在山頂可以鳥瞰迦南，此山海拔800公尺，雖然從山上遠眺東邊只可見到基列的高地、兩邊也只及猶大的群山，但已可代表全地；GT《申命記雷氏研讀本》要讀者參看民數記23章14節的腳註。BH\
    \ 說毘斯迦常被視為尼波山上的一個特定山峰或山脊，這個名稱可指高處或山頂，強調摩西所站的視野之高。"
  "relation": "先前三章的毘斯迦分別是巴蘭的觀察點、地界的座標，以及申3:27 那句「你且上毘斯迦山頂去」的預告。本章是那句預告的實現——摩西真的上去了，也在那裡看完了那地。"
