book: 申命記
chapter: 34
candidates:
- name: 耶和華的僕人摩西（e.ved 與 al pi）
  type: 原文
  evidence: '第5節「於是，耶和華的僕人摩西死在摩押地，正如耶和華所說的。」STEP 顯示「僕人」是 e.ved-（H5650，簡要詞典義 e.ved: servant/slave），而末句「正如耶和華所說的」原文是 al pi Yah.weh（H5921A 加 H6310I，簡要詞典義 peh: lip: word），字面是照耶和華的口；動詞是 va/i.Ya.mot（H4191 mut: to die）。CT 說本節表明不但他比一般人多活幾十年是神親自安排的，他在進迦南之前的死也是神親自安排的。GT《聖經精讀本──申命記註解》說神的偉大僕人摩西終於以120歲的高齡完成了其地上的事工之後，平安地進入了天上迦南，並說摩西的生涯是無怨無悔的勝利一生、也是全然委身於神的一生。KC 說是耶和華取去了摩西的生命。BH 說摩西一貫被稱為耶和華的僕人，這個稱號突顯他作為忠心領袖與先知的角色，也顯出他的謙卑與對神命令的順服；BH 並說本節這句話強調了神話語的應驗——神先前已告訴摩西他不得進入應許之地。'
- name: 神親自埋葬摩西
  type: 事件
  evidence: '第6節「耶和華將他埋葬在摩押地、伯毘珥對面的谷中，只是到今日沒有人知道他的墳墓。」STEP 顯示動詞是 va/i.yik.Bor（H6912，簡要詞典義 qa.var: to bury，第三人稱單數），地點是 va./gaY（H1516R gay: valley）與 mul beit pe.or（H4136 mul: opposite 加 H1047，簡要詞典義 bet pe.or: Beth-peor），「墳墓」是 ke.Vu.ra.T/o（H6900，簡要詞典義 qe.vu.rah: tomb）。CT 說神很鄭重的埋葬摩西的遺體，在人類歷史的記載中只有這麼的一次，並說神不藉著天使的手去埋葬摩西、而是他親自的將他埋葬；他又說神親自埋葬既是極大的榮耀，也是為了不讓人知道他的墳墓，好讓百姓學習敬拜神而不是敬拜神的僕人，並提到撒但曾經想利用摩西的遺體去引誘百姓敬拜偶像（猶9）。GT《啟導本聖經申命記註釋》說按猶太人傳統，耶和華神不讓人知道摩西的墳墓所在，恐怕後人去敬拜他的骸骨、陷於罪惡中；GT《聖經精讀本──申命記註解》說根據猶1:9 神似乎差遣天使長米迦勒，命令他將摩西的屍體葬在人所不知的地方。KC 說耶和華親自處理了他的埋葬，沒有人知道摩西的葬處，魔鬼卻知道，他為摩西的身體與天使長米迦勒爭辯（猶9）。BH 說這在聖經裡是獨一無二的，是唯一一處神直接參與埋葬的記載，並說墳墓的匿名使它不致成為偶像崇拜或朝聖的地點。'
  surfaces:
  - 耶和華將他埋葬
- name: 申命記34章的作者
  type: 解經爭議
  evidence: '本章記的是摩西的死與葬，因此作者是誰成為一個必須交代的問題，四套註釋都處理了。CT 在第1節的備註直說：由1~3節的敘述可知，本章是在摩西死後，約書亞率領以色列人進占迦南地全境、分配各支派的產業之後，才補寫的跋文。GT《聖經精讀本──申命記註解》把兩種可能並列：一是因摩西是特殊的先知（10節、民12:6~8），故有可能以預示性的洞察力記錄了自己死後的事；二是希伯來文學的慣例是在偉大故人的最後一部作品中附加他的死亡記事，故有可能在摩西去世後由繼承人約書亞或大祭司以利亞撒附加記錄；它並說不論本章是由誰記錄的，必定是因神的感動、記錄得毫無差錯。GT《雷氏研讀本》說第三十四章有關摩西之死的記載不可能出自摩西手筆，然而這明顯的事實卻絕對不能否定本書其餘部分是摩西所寫的。GT 另收艾基斯《舊約聖經難題彙編》一整段回應，用羅蘭德富遺著由甘仁補寫前言的實例作類比，說沒有有責任感的讀者會因著一段短短訃文便否認原作者的著作地位。KC 說這最後一章不是摩西寫的，約書亞應該就是被神使用來寫這段的人，並說百姓中大概沒有誰像約書亞那樣清楚摩西是何等不凡的人物。'
  surfaces:
  - 都指給他看
- name: 眼目沒有昏花精神沒有衰敗（le.ach）
  type: 原文
  evidence: '第7節「摩西死的時候年一百二十歲；眼目沒有昏花，精神沒有衰敗。」STEP 顯示「昏花」是 kha.ha.Tah（H3543A，簡要詞典義 ka.hah: to grow dim），「精神」是 le.Cho/h（H3893，簡要詞典義 le.ach: vigor），動詞 nas（H5127，簡要詞典義 nus: to flee，字面是他的精力沒有逃走）。CT 的原文字義給「昏花」的是逐漸微暗、逐漸衰弱，給「衰敗」的是消失、逃離，並說這表示摩西之死並非因為身體衰敗；他在話中之光說摩西能從海平面以下300多米的摩押平原登上海拔700多米的尼波山，表明他並不是因為身體衰敗而死。GT《申命記雷氏研讀本》說摩西不是因為身體衰敗而死；GT《啟導本聖經申命記註釋》說第7節指出摩西雖年事甚高、但仍具活力。KC 說摩西不是因為年老力衰而死，他的眼目沒有昏花、看得跟年輕時一樣清楚，並把這一點與以撒（創27:1）和雅各（創48:10）作對比。BH 說眼力的保存象徵屬靈的洞察與領導能力，並說他未減退的精力見證了神托住的能力。'
  surfaces:
  - 眼目沒有昏花，精神沒有衰敗
- name: 智慧的靈（ru.ach chokh.mah）
  type: 原文
  evidence: '第9節「嫩的兒子約書亞；因為摩西曾按手在他頭上，就被智慧的靈充滿，以色列人便聽從他，照著耶和華吩咐摩西的行了。」STEP 顯示這是 ma.Le Ru.ach chokh.mah（H4392 ma.le: full、H7307G ru.ach: spirit、H2451 chokh.mah: wisdom），按手的動詞是 sa.Makh（H5564，簡要詞典義 sa.makh: to support）加 ya.Da/v（H3027G，雙數）。CT 說智慧的靈形容聖靈能給予人智慧和聰明（參賽十一2），約書亞被聖靈充滿、擁有治理和軍事的才幹；他在話中之光另指出一個分工——按手在約書亞頭上的是摩西（民二十七18~23），用智慧的靈充滿約書亞的卻是神自己。GT《聖經精讀本──申命記註解》說按手是表示將摩西至今以來對以色列百姓所擁有的領袖權都交給後任領袖約書亞的公開委任儀式，並說約書亞在此處的出現不僅自然地連接了本書與約書亞記，還暗示了已作好準備展開迦南征服戰。KC 說約書亞接續摩西作百姓的領袖，不是接續作先知，而是接續作領兵得地的領袖。BH 說智慧的靈指的是治理與決斷上的神聖賦能，不只是人的見識而是神的恩賜，並以所羅門為例（王上3:9-12）。'
- name: 興起一位先知像我
  type: 神學
  evidence: '第10至12節是全卷申命記的結語：「以後以色列中再沒有興起先知像摩西的。他是耶和華面對面所認識的。耶和華打發他在埃及地向法老和他的一切臣僕，並他的全地，行各樣神蹟奇事，又在以色列眾人眼前顯大能的手，行一切大而可畏的事。」STEP 顯示第10節是 ve./lo kam na.Vi od be./Yis.ra.El ke./mo.Sheh（H6965B qum: to arise、H5030 na.vi: prophet），末句是 pa.Nim el pa.Nim（H6440H 重複，字面是臉對臉）。CT 說面對面喻指彼此親密的交往和友誼，又在話中之光說摩西可以與神直接說話（出三十三11），而約書亞則需要藉著祭司的烏陵和土明來尋求神的旨意（民二十七21）；他並說神所設立的四種職事——審判官、君王、祭司、先知——都集中在摩西身上，舊約的其他先知只是重新強調摩西所頒佈的律法的原則。GT《聖經精讀本──申命記註解》從兩方面說明摩西為何特殊：一是在與神的親密關係上，神對摩西好像人與朋友說話一般、面對面說話（出33:11）；二是在彰顯神之權能的事情上。GT《啟導本聖經申命記註釋》說本書結尾三節對摩西的品格和能力作了詳述，他集先知、審判者、祭司和行政首長於一身，並說等到主基督來到世間後、這位人子所達到的境界則遠遠超過摩西。GT《雷氏研讀本》註明本節有古卷在句首多「沒有誰像摩西那樣」數字。KC 說在這幾句關於摩西的最後的話裡，他的失敗一次都沒有被提起。'
  surfaces:
  - 再沒有興起先知像摩西的
- name: 瑣腓田與毘斯迦山頂
  type: 地點
  evidence: '第1節「摩西從摩押平原登尼波山，上了那與耶利哥相對的毘斯迦山頂。」CT 的原文字義給「毗斯迦」的是裂縫，並說毗斯迦山頂又在尼波山嶺中有一最高山峰名叫毗斯迦山，與約但河西面的耶利哥相對。GT《聖經精讀本──申命記註解》說尼波山與毗斯迦山都是位於亞巴琳山脈的高峰，毗斯迦山是指尼波山的最高峰，此地最適於眺望迦南地；GT《啟導本聖經申命記註釋》說毗斯迦山很可能是尼波山的一座高峰，立在山頂可以鳥瞰迦南，此山海拔800公尺，雖然從山上遠眺東邊只可見到基列的高地、兩邊也只及猶大的群山，但已可代表全地；GT《申命記雷氏研讀本》要讀者參看民數記23章14節的腳註。BH 說毘斯迦常被視為尼波山上的一個特定山峰或山脊，這個名稱可指高處或山頂，強調摩西所站的視野之高，是一處啟示與神聖相遇的地方。'
  surfaces:
  - 毘斯迦山頂
- name: 伯毘珥
  type: 地點
  evidence: '第6節「耶和華將他埋葬在摩押地、伯毘珥對面的谷中」。CT 的原文字義給「伯毗珥」的是裂罅之家、孔隙之家，並說伯毗珥位於尼波山區附近，距約但河東岸不到20公里。GT《申命記雷氏研讀本》說雖然摩西下葬的準確位置不得而知，但應該就在百姓安營的地方，伯毗珥在約但河口以東約10英里或16公里；GT《申命記串珠聖經註釋》說伯毗珥在毗斯迦山區附近（書13:20）。BH 說伯毘珥是與摩押神明巴力毘珥崇拜有關的地點，這個提及可能是要讀者想起以色列過去的拜偶像，並突顯摩西的忠心與以色列人在那地方的不忠形成對比（民25:1-3）。'
- name: 瑣珥
  type: 地點
  evidence: '第3節「南地和棕樹城耶利哥的平原，直到瑣珥，都指給他看。」CT 的原文字義給「瑣珥」的是不重要，並說瑣珥是死海南部的一個城市。GT《申命記串珠聖經註釋》說瑣珥是死海南部的一個城市；GT《啟導本聖經申命記註釋》說本節下半和2節所記各地為反時鐘方向自北而南列舉，從約但河東迦南北境的基列全地，經西海和棕樹城耶利哥的平原直到死海南端的瑣珥；GT《申命記雷氏研讀本》說瑣珥位於死海南端。BH 說瑣珥是死海東南邊緣附近的一座小城，歷史上與羅得的故事相連——所多瑪和蛾摩拉被毀時羅得逃到瑣珥（創19:20-23）；BH 並說本節提到瑣珥標示出摩西從尼波山所看見那地的南北全幅。'
- name: 基列
  type: 地點
  evidence: '第1節「耶和華把基列全地直到但」。CT 的原文字義給「基列」的是多岩之地，並說基列全地即約但河東面兩支派半所佔領的全境。GT《申命記串珠聖經註釋》說「基列全地直到但」即約但河東面由南至北的地域；GT《啟導本聖經申命記註釋》說雖然從山上遠眺，東邊只可見到基列的高地。BH 說基列是約但河東的一片地區，以乳香與肥沃著稱，代表摩西所能看見那片地的最北一段。'
- name: 但
  type: 地點
  evidence: '第1節末「耶和華把基列全地直到但」。CT 說但支派的轄境位於約但河西面的最北端黑門山腳下。GT《聖經精讀本──申命記註解》說從毗斯迦山所在的摩押平原到北部黑門山腳下的但，約有160公里，故摩西因神特殊的恩典才得以眺望到此。BH 說但位於以色列極北，標誌著應許之地的北界，這一句凸顯了神應許之地的廣闊——從基列蔥鬱的丘陵一直到遙遠的但。'
  surfaces:
  - 直到但
- name: 南地
  type: 地點
  evidence: '第3節「南地和棕樹城耶利哥的平原，直到瑣珥，都指給他看。」CT 說南地在約但河西面的最南端丘陵地帶。GT《啟導本聖經申命記註釋》把本節放進由北而南的列舉次序裡。BH 說南地是以色列南部的一片沙漠地區，氣候乾旱、植被稀疏，是應許給亞伯拉罕後裔之地的一部分（創12:1-9），也是列祖飄流過的地方，它嚴酷的環境象徵信心的試煉。'
- name: 耶利哥
  type: 地點
  evidence: '第1節「上了那與耶利哥相對的毘斯迦山頂」，第3節「南地和棕樹城耶利哥的平原」。CT 的原文字義給「耶利哥」的是它的月亮，並說耶利哥城的郊區一直以棕樹和熱帶氣候聞名。GT《申命記串珠聖經註釋》與《啟導本聖經申命記註釋》都把棕樹城耶利哥的平原列在由北而南的視野次序裡。BH 說耶利哥是世上最古老的有人居住城市之一，隔著約但河正對尼波山，它被稱為棕樹城；BH 並說本節提到耶利哥為接下來的征服預作伏筆——它是以色列人在約書亞帶領下攻取的第一座城。'
- name: 尼波山
  type: 地點
  evidence: '第1節「摩西從摩押平原登尼波山，上了那與耶利哥相對的毘斯迦山頂」。CT 說尼波山在亞巴琳山脈中的北部一帶山嶺。GT《聖經精讀本──申命記註解》說尼波山與毗斯迦山都是位於亞巴琳山脈的高峰，此地最適於眺望迦南地。KC 說摩西照神在申32:49 的吩咐登上尼波山，百姓一定盡可能地望著他；他沒有人扶就自己上到山頂，他不是力盡了、也不是厭倦了活著，只是安息在耶和華說他任務已了的決定裡，他心裡沒有懼怕死亡，他上山不是為了死，而是為了與神同在。BH 說尼波山是亞巴琳山脈中的一個山峰，位於今日約旦境內，考古發現顯示它曾是宗教上重要的地點，象徵從曠野飄流過渡到神應許的成就。'
- name: 摩押地
  type: 地點
  evidence: '第5節「耶和華的僕人摩西死在摩押地」，第6節「耶和華將他埋葬在摩押地、伯毘珥對面的谷中」。CT 說尼波山屬於摩押地。GT《聖經精讀本──申命記註解》說摩西終於以120歲的高齡完成了地上的事工。BH 說摩押地位於約但河東、在今日約旦境內，這片地在應許之地之外，摩西因米利巴那件事不得進入應許之地，他死在摩押標誌著以色列一個時代的結束；BH 又說摩押平原是以色列人進入迦南前最後的營地，摩西正是在這裡發表了他最後的講論與祝福。'
- name: 拿弗他利
  type: 人物
  evidence: '第2節「拿弗他利全地，以法蓮、瑪拿西的地，猶大全地直到西海」。CT 的原文字義給「拿弗他利」的是摔角，並說拿弗他利全地即拿弗他利支派的產業，分配在約但河西面的北部。GT《申命記串珠聖經註釋》說拿弗他利全地是約但河西面最北的地區。BH 說拿弗他利是雅各與辟拉所生之子的後裔，這片地在以色列北部，以肥沃與位置的戰略性著稱；BH 並說這裡提到拿弗他利，顯出摩西從尼波山所見視野之全。'
- name: 以法蓮
  type: 人物
  evidence: '第2節「以法蓮、瑪拿西的地」。CT 的原文字義給「以法蓮」的是我將獲雙倍果子，並說以法蓮、瑪拿西的地在約但河西面的中部。GT《申命記串珠聖經註釋》說以法蓮是中部地區。BH 說以法蓮與瑪拿西是約瑟的兩個兒子，兩個支派在以色列中都很顯赫；以法蓮的地居中，這一段提到他們的地是應驗了雅各在創世記48章5至6節給約瑟後裔的祝福。'
- name: 瑪拿西
  type: 人物
  evidence: '第2節「以法蓮、瑪拿西的地」。CT 的原文字義給「瑪拿西」的是導致遺忘。GT《申命記串珠聖經註釋》把以法蓮、瑪拿西的地列為中部地區。BH 說瑪拿西的地跨約但河兩岸，這一帶因農業出產與在以色列歷史中的中心地位而重要，示羅也在這一區——會幕曾設在那裡。'
- name: 猶大支派
  type: 人物
  evidence: '第2節「猶大全地直到西海」。CT 的原文字義給「猶大」的是讚美的，並說猶大全地在約但河西面的南部，西海即地中海。GT《申命記串珠聖經註釋》說猶大是南面之地；GT《聖經精讀本──申命記註解》說西海指地中海。BH 說猶大是最大也最有影響力的支派，大衛王與基督都由它而出，猶大地包括耶路撒冷；西海指地中海，標出應許之地的西界。'
  surfaces:
  - 猶大全地
- name: 亞伯拉罕
  type: 人物
  evidence: '第4節「耶和華對他說：這就是我向亞伯拉罕、以撒、雅各起誓應許之地，說：我必將這地賜給你的後裔。」CT 說亞伯拉罕、以撒、雅各是以色列人的三個偉大祖先，起誓應許之地即指迦南美地，是耶和華神先後向以色列人的列祖起誓應許必賜給他們和他們的後裔的（參創十七8；二十六3；三十五12）。BH 說這句話指的是亞伯拉罕之約，神在創世記12章7節、15章18節、17章8節與亞伯拉罕立約，應許把迦南地賜給他的後裔，這應許又向以撒（創26:3）與雅各（創28:13）重申。'
- name: 以撒
  type: 人物
  evidence: '第4節「這就是我向亞伯拉罕、以撒、雅各起誓應許之地」。CT 的原文字義給「以撒」的是他笑，並說這三位是以色列人的三個偉大祖先。BH 說這個應許在創世記26章3節向以撒重申，土地不只是實質的產業，也是神信實與他百姓被建立的屬靈記號。'
- name: 雅各
  type: 人物
  evidence: '第4節「這就是我向亞伯拉罕、以撒、雅各起誓應許之地」。CT 的原文字義給「雅各」的是抓住腳後跟的人、取代者，並註明神向雅各起誓應許之地見創三十五12。BH 說這個應許在創世記28章13節向雅各重申，土地的應許貫穿舊約，象徵神對他所揀選之民的持續委身。'
- name: 亞伯拉罕之約
  type: 神學
  evidence: '第4節神親口把這片地與列祖的誓約接上：「這就是我向亞伯拉罕、以撒、雅各起誓應許之地，說：我必將這地賜給你的後裔。」CT 說起誓應許之地即指迦南美地，是耶和華神先後向以色列人的列祖起誓應許必賜給他們和他們的後裔的（參創十七8；二十六3；三十五12）。GT《啟導本聖經申命記註釋》說摩西所看見的這就是神應許給以色列先祖的美地（出三十三1）；GT《聖經精讀本──申命記註解》說摩西必是頌贊守約的信實之神。BH 說這是聖經敘事中根基性的應許，土地不只是實質的產業，也是神信實的屬靈應許；BH 並說這應許藉約書亞征服迦南得著部分成就，也預表基督為信徒所取得的永遠基業（來9:15）。'
  surfaces:
  - 起誓應許之地
- name: 摩西不得進入應許之地
  type: 事件
  evidence: '第4節末「現在我使你眼睛看見了，你卻不得過到那裡去。」CT 說「使你眼睛看見了」必是神賜給他特殊的恩典，有晴朗的天氣加上很好的視力，才能一眼眺望南北約300公里、東西約100公里全境；他說不得過到那裡去的表面理由是因摩西在米利巴水犯錯（參民二十12），實際上有著屬靈的象徵意義：迦南美地預表天國、不能靠人的功績進去，摩西預表律法、人不能靠行律法進天國。GT《聖經精讀本──申命記註解》給的兩層理由相同：表面理由是因在米利巴水事件時未能全然彰顯神的聖潔（民20:12），但其深層原因是為了曉諭人天國斷不能靠著人的功勞而進去，以及摩西象徵著律法。KC 說神的定規是他不得過去，神的恩典是他看見了那地，看見的方式是別人都沒有過的。BH 說這句話突顯摩西早先違命的後果，也提醒神的聖潔與公義。'
  surfaces:
  - 你卻不得過到那裡去
- name: 一百二十歲的摩西
  type: 主題
  evidence: '第7節「摩西死的時候年一百二十歲」。CT 說這可分成三個四十年：頭四十年「我能」、次四十年「我不能」、後四十年認識「神能」；他在話中之光說第一個四十年是安逸地在埃及王宮作王子，第二個四十年是被迫到米甸曠野作牧羊人，第三個四十年是蒙召作神的僕人和話語的出口，並說根據對古埃及木乃伊的檢測、當時一代人的平均壽命大約四十年，摩西一生的年日一共活了三代。KC 也把摩西的一生分成三段四十年：在法老宮中四十年、在曠野與葉忒羅的羊群同在受神學校訓練四十年、在曠野與神的百姓同在四十年；他並引詩篇90篇3節說到人歸回塵土。BH 說120歲這個年數分成三個四十年——在埃及、在米甸、帶領以色列，顯出他生命中預備、蒙召與成全三個階段。'
  surfaces:
  - 年一百二十歲
- name: 按手
  type: 原文
  evidence: '第9節「因為摩西曾按手在他頭上，就被智慧的靈充滿」。STEP 顯示動詞是 sa.Makh（H5564，簡要詞典義 sa.makh: to support），受詞是 ya.Da/v（H3027G yad，雙數，字面是他的雙手）。CT 說按手意指交通、傳遞、合一，給人按手含有交接和祝福之意（參徒六6；十三3；提後一6）。GT《聖經精讀本──申命記註解》說這是表示將摩西至今以來對以色列百姓所擁有的領袖權都交給後任領袖約書亞的公開委任儀式。BH 說按手是重要的授職與祝福動作，象徵權柄的轉移與聖靈的賜下，這個作法貫穿聖經，如利未人的授職（民8:10）與新約教會領袖的設立（徒6:6）。'
- name: 神與摩西面對面明說
  type: 神學
  evidence: '第10節「以後以色列中再沒有興起先知像摩西的。他是耶和華面對面所認識的。」STEP 顯示末句是 ye.da.O Yah.weh pa.Nim el pa.Nim（H3045 ya.da: to know 加 H6440H 重複，字面是臉對臉）。CT 說面對面喻指彼此親密的交往和友誼，並在話中之光說摩西可以與神直接說話（出三十三11），而約書亞則需要藉著祭司的烏陵和土明來尋求神的旨意（民二十七21）。GT《申命記雷氏研讀本》說神面對面與摩西說話（比較出三三11；民一二8），約書亞需要祭司幫助他去認識神的旨意；GT《啟導本聖經申命記註釋》說神直接向摩西說話、約書亞則須藉著祭司的烏陵和土明來尋求神的旨意，所以在摩西死後再沒有興起先知像摩西的；GT《聖經精讀本──申命記註解》說與其他先知不同，神對摩西好像人與朋友說話一般、面對面說話（出33:11），也使他親眼目睹神榮耀的臨在（出33:18~23）。KC 說摩西與神的相交也是獨一無二的。BH 說不同於其他藉異象或夢領受的先知，摩西是直接而親身地與神說話。'
  surfaces:
  - 面對面所認識的
- name: 大能的手
  type: 神學
  evidence: '第12節「又在以色列眾人眼前顯大能的手，行一切大而可畏的事。」CT 的原文字義給「大能」的是強壯的、堅固的，給「可畏的事」的是敬畏、恐懼；他說這指諸如分開海水使成乾地、擊打磐石出水、天降嗎哪等大而可畏的事，雖然是神的能力使然，但都通過摩西的話和手杖顯在以色列人眼前。GT《啟導本聖經申命記註釋》說本書結尾三節對摩西的品格和能力作了詳述，他行神蹟奇事無人能及。BH 說這些大能的作為包括埃及的災、分開紅海與賜下嗎哪，它們彰顯神的權能也印證摩西的領導，而且是在全以色列眼前發生的，使他的職分無可否認。'
- name: 摩西
  type: 人物
  evidence: '本章從頭到尾都在講摩西：登山、觀看、死、被葬、被哀哭，最後三節是對他一生的總評。CT 的內容綱要把本章分成四段：在毗斯迦山頂上遠眺迦南美地（1~4節）、死時一百二十歲並由神埋葬在無人知曉之處（5~7節）、以色列人哀哭三十日與約書亞接續（8~9節）、簡述摩西之豐功偉業（10~12節）。GT《聖經精讀本──申命記註解》說本章記錄了偉大的神人摩西的死亡埋葬，並說摩西所要作的最後一件事就是歸到列祖之懷。KC 說摩西七次被記在山上：作代求者（出17:8-16）、領受律法與會幕樣式（出24:12-18）、金牛犢之後為百姓代求（出32:30-32）、領受第二次的石版（出34:4）、在何珥山把祭司職分從亞倫轉給以利亞撒（民20:23-28）、在尼波山看那地（申34:1）、以及在變像山上與以利亞同和主耶穌一起（太17:1-8）。BH 說摩西一貫被稱為耶和華的僕人，這個稱號突顯他的謙卑與順服。'
- name: 約書亞
  type: 人物
  evidence: '第9節「嫩的兒子約書亞；因為摩西曾按手在他頭上，就被智慧的靈充滿，以色列人便聽從他，照著耶和華吩咐摩西的行了。」CT 的原文字義給「嫩」的是魚、後裔，給「約書亞」的是耶和華是拯救；他說約書亞原名何西阿、摩西另給他改名約書亞，他曾率領一批精選的軍隊殺敗亞瑪力人（參出十七9），又當過摩西的幫手（參出二十四13），其後又被摩西選為以色列全軍的統帥（參民二十七18~20）。GT《申命記串珠聖經註釋》說約書亞接任為摩西的繼承人；GT《聖經精讀本──申命記註解》說約書亞在此處的出現不僅自然地連接了本書與約書亞記，還暗示了已作好準備展開迦南征服戰。KC 說約書亞接續摩西作百姓的領袖，不是接續作先知，而是接續作領兵取得應許之地的領袖。BH 說約書亞的名字意思是耶和華是拯救，他在出埃及記17章9至14節是軍事統帥、在民數記14章6至9節是兩個忠心探子之一。'
- name: 以色列
  type: 原文
  evidence: '第8節「以色列人在摩押平原為摩西哀哭了三十日」，第9節「以色列人便聽從他，照著耶和華吩咐摩西的行了」，第10節「以後以色列中再沒有興起先知像摩西的」，第12節「又在以色列眾人眼前顯大能的手」。本章四次提到這個群體，功能各不相同：哀哭的是他們、聽從新領袖的是他們、被說成再沒有出過像摩西那樣先知的也是他們、當年親眼看見大能作為的還是他們。STEP 顯示第9節「聽從」是 va/i.yish.me.U（H8085H，簡要詞典義 sha.ma: to hear: obey），後接 va/i.ya.a.Su ka./a.Sher tzi.Vah Yah.weh（H6213A 加 H6680 tsa.vah: to command）。GT《聖經精讀本──申命記註解》說約書亞在此處的出現不僅自然地連接了本書與約書亞記，還暗示了已作好準備展開迦南征服戰。BH 說以色列人聽從約書亞標誌著領導權轉移中關鍵的一刻，這份順服對他們攻取迦南是必要的，也顯出神藉摩西所賜的誡命一路延續下來。'
  surfaces:
  - 以色列人
- name: 哀哭三十天
  type: 文化
  evidence: '第8節「以色列人在摩押平原為摩西哀哭了三十日，為摩西居喪哀哭的日子就滿了。」CT 的原文字義給「哀哭」首字的是哀號、給「居喪」的是哀悼、給「哀哭」次字的是哭泣，並說一般哀悼期為七日（參創五十10），但人們為大祭司亞倫（參民二十29）與神人摩西則哀哭了三十日；他在話中之光另說百姓為亞倫和摩西都哀哭了三十日，並不是因為悲傷，而是表達對神的僕人極大的敬意，也是表達對神的敬畏。GT《聖經精讀本──申命記註解》說哀悼期一般為七日，但人們為亞倫與摩西則哀哭了三十日。KC 說為摩西之死哀哭三十日，與為他哥哥亞倫哀哭的日子一樣長（民20:29）。BH 說三十日的哀悼期是以色列文化中給重要人物的慣例，如民數記20章29節為亞倫舉哀那次；這段時間讓群體消化失落、適切地紀念死者，而哀悼期的結束標誌著從悲傷轉入行動——他們要在約書亞帶領下往前走。'
  surfaces:
  - 哀哭了三十日
- name: 摩押平原
  type: 地點
  evidence: '第1節「摩西從摩押平原登尼波山」，第8節「以色列人在摩押平原為摩西哀哭了三十日」。這是本章唯一出現兩次的地名，也是全卷申命記講論的所在地。GT《啟導本聖經申命記註釋》說本章為申32:48～52 的繼續，中間插入三十三章。BH 說摩押平原位於約但河東，是以色列人進入應許之地前最後的營地，摩西正是在這裡發表了他最後的講論與祝福；BH 又說這個地點凸顯了從摩西的領導過渡到約書亞的領導，因為以色列人正準備跨進迦南。CT 說摩西從這裡登尼波山，上了那與耶利哥相對的毘斯迦山頂；GT《聖經精讀本──申命記註解》說從毗斯迦山所在的摩押平原到北部黑門山腳下的但約有160公里。'
