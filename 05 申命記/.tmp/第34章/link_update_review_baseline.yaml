- title: 按手
  path: link_folder/原文/按手.md
  definition: 按手（סָמַךְ，samakh，H5564）是獻祭者（或受職的祭司）把手按在祭牲頭上的禮儀動作，是舊約獻祭程序中被反覆規定的一步（出29:10、15、19；利1:4；4:4；8:14）。各家對它的解釋高度一致地落在「認同」上：GT《串珠》說「『按手』：代表認同，祭牲之死相等於獻祭者之死」；GT《啟導本》說「『按手』表示認同，以祭牲代人獻上贖罪」；GT《丁道爾》說得最完整：「按手代表認同，是贖罪祭的通例，清楚表示：祭牲之死被認可為與獻祭者死亡相同。」CT
    的說法相同：「『按手在…頭上』意指和祭牲聯合為一，使祭牲擔當自己的罪過。」GT 引丁良才把這個動作拆成四層：「（一）祭司的罪歸於公牛；（二）公牛的義（或作無辜）歸於祭司；（三）公牛代替祭司死；（四）祭司代替公牛活。」GT《舊約背景註釋》另補上一個常被忽略的實務環節：「每隻祭牲牽到壇前時，祭司都必須檢查牠是否合格。檢查過後，祭司就要執行象徵認可的儀式，按手在牲畜上，為牲畜的死亡和犧牲的目標而負責。部分學者更提出這行動有肯定所有權的意思。」GT《精讀本》則把按手的用法整理成一個橫跨兩約的譜系：其意義「在於把自己所擁有的傳給別人」，形態「通常把手按放在被按手的頭上」，例子涵蓋獻祭（利1:4；4:4；8:14）、用石頭打死褻瀆者（利24:14）、醫治（可6:5；徒28:8）、領受聖靈（徒8:18-19）、委任職務（徒6:6；13:3）與恩賜的授與（提前4:14；提後1:6）；並附上一句警告：「按手不能隨便進行（提前5:22），只有在神委任的權威之下，才能以謙卑的心態按手。」
  development: '### 從按在祭牲頭上，到按在人頭上


    出29、利1、利3、利4、利8、利24 的按手都有同一個結構：獻祭的人（或祭司）把手按在祭牲頭上，表明祭牲代替他承擔後果。民數記第8章多出一層——人按在人身上。


    GT《啟導本》把本章的兩次按手排在一起，方向剛好相反：「先是以色列人按手在利未人的頭上，然後是利未人按手在牛的頭上（12節）。這兩個儀式的意義是很明顯的。第一次按手是利未人替代以色列人的長子獻給神贖罪；但人不可以當作祭物獻上，故要用牛來替代利未人。」


    換句話說，代替的鏈條在這裡有兩節：以色列人的長子由利未人代替，利未人再由公牛代替。GT《舊約聖經背景註釋》指出這個動作與獻祭時的步驟相同，「此舉象徵式地任命利未人充任以色列人的代表」；CT
    則從第一次按手讀出合一——利未人與以色列人「就聯合成為一個整體」，所以利未人的事奉「也是全以色列人的事奉」。'
