- title: 瑣珥
  path: link_folder/地點/瑣珥.md
  definition: 瑣珥（Zoar），死海平原五城之一，原名比拉（Belah，創十四2）。「瑣珥」意為「小」，故又稱「小瑣珥」。在創世記十九章中，羅得求神容許他逃到瑣珥而不逃到山上，神應允了，因此瑣珥在所多瑪、蛾摩拉被毀時得以保存。
  development: '### 位置：南端無疑，東西岸有分歧


    GT《串珠聖經註釋》寫「瑣珥城位於死海的西南」。GT《舊約背景註釋》則把它比對為死海**東南**部平原的薩非（Safi），並以主後六世紀馬底巴地圖中的「瑣阿拉」（Zoara）為佐證；BH
    同樣把它放在死海東南緣。兩說都把瑣珥放在死海南端，分歧只在東西岸。


    這個地名在辨識所多瑪、蛾摩拉時起了槓桿作用：背景註釋正是以瑣珥的位置、加上創十四10「西訂谷」的石漆坑，作為主張平原諸城在死海**南端**的兩項論據；而主張北端的論據則是距希伯崙的路程（北端18哩，南端40哩）與創十三10-12
    的「約但河的全平原」。薩非是死海東南部五個初銅器時代遺址之一，與巴貝德拉（所多瑪？）、農梅拉（蛾摩拉）、費法、坎納齊爾並列。


    ### 名字與敘事的雙關


    羅得求情時兩次形容這座城「小」（מִצְעָר，H4705：「這座城又小又近……這不是一個小的嗎？」創19:20），隨後城名便被稱作「瑣珥」（צֹעַר，H6820，創19:22），兩者在原文形成明顯的音韻與名字呼應。相關詞典（如
    BDB、GT 註釋）進一步將「瑣珥」與代表微小的字根（צָעַר，H6819）連結起來。丁良才把羅得那句反問的邏輯講出來：「這城既是小的，罪也未必大，因此就不必毀滅。」


    它原名比拉（創十四2），在第14章的五王名單中列在最後——GT 資料指這反映它是五城之中最小的一座。


    ### 為什麼羅得後來又離開


    第30節說羅得「因為怕住在瑣珥」而上山住洞。各家對這個「怕」給的解釋不同：CT 推測「大概是怕當地人以為二城之滅與羅得有關」；GT《創世記雷氏研讀本》並列兩種可能——當地人認為羅得對所多瑪被毀多少要負責，或羅得恐怕再有地震；丁良才則讀成信心問題，說羅得受了驚、不信天使第21節的話；GT《啟導本聖經創世記註釋》同向，並下了一句評語：「一個只圖一己利益以保安全的人，結局是沒有安全，一片恐懼。」


    CT 另指出一層敘事上的張力：逃到瑣珥並不是神起初的心意（17節命他往山上逃跑），羅得遲早仍須上山——第30節正是他自己走完了原先被吩咐的那條路。'
