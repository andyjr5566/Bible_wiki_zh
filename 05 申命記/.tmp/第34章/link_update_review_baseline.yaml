- title: 哀哭三十天
  path: link_folder/文化/哀哭三十天.md
  definition: '民數記20:29：「全會眾，就是以色列全家，見亞倫已經死了，便都為亞倫哀哭了三十天。」


    **三十天是特例，不是常例。** GT 丁良才《民數記註釋》把兩種期限分開：「以色列人為平常的人只舉哀七天，若是有名望的人，就為他哀哭三十天（創五十3-11，申三十四8）。」GT《聖經精讀本──民數記註解》給的說法相同，並替它定性：一般的哀哭時間是七天，為摩西和亞倫哀哭的時間持續了三十天，「相當於國葬。這是尊敬領袖的表現」。GT《舊約聖經背景註釋》也是同一條線：「正常的服喪期是七日（創五十10；撒上三十一13）。但為了表示他們的重要性，百姓為摩西（申三十四8）、亞倫都哀哭了三十天。」BH
    補上這個期限在猶太傳統裡的名稱：三十天的服喪期在猶太傳統中稱為 shloshim。


    **他們哭的是誰。** KC 提出一個很尖銳的觀察：他們為失去他而哭，而這個人正是他們生前屢次抱怨的對象；他由此歸出一句話——敬虔的人往往死後得到的尊榮多過生前。GT
    丁良才《民數記註釋》的觀察一模一樣：「名人活著的時候，往往被人輕看，死後卻被人尊重。」


    **他們怎麼知道他死了。** CT 註明一個細節：全會眾並沒有親見亞倫之死，「故這裡指他們接受了摩西和以利亞撒報告亞倫的死訊」。GT《舊約聖經背景註釋》另指出這場哀哭同時是領袖交接的場合，以利亞撒繼承父親大祭司之職、穿上他的聖服，後來約書亞亦同樣繼承摩西。'
