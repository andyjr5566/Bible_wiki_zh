- title: 以法蓮
  path: link_folder/人物/以法蓮.md
  definition: 「以法蓮」是約瑟次子，母親是亞西納（創41:52, 46:20）。CT 的原文字義作「使之昌盛，雙倍的果子，加倍的豐盛」；GT《串珠聖經註釋》說本意是「雙倍的果實」。約瑟解釋：「神使我在受苦的地方昌盛」（創41:52）。後成為以色列十二支派之一，常代表北國（何4:17,
    5:3）。
  development: 名字所指的地方本身就是重點：昌盛發生在「受苦的地方」。丁良才由此推出一句應用：「我們為主忍受苦難的地方，大概也就是得昌盛的地方。」CT
    也說：「誰苦受得越多，誰的靈命就越豐盛」，並把兩個名字排成次序——瑪拿西表明顛沛際遇的結束，以法蓮表明新生活豐盛的開展。GT《串珠聖經註釋》從家庭的角度解釋：神賜兒子給約瑟，使他在埃及地昌盛起來。KC
    則說主耶穌如今在榮耀裡，從榮耀中使一切與祂聯合的人多結果子。
