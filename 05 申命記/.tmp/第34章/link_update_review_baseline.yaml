- title: 摩西不得進入應許之地
  path: link_folder/事件/摩西不得進入應許之地.md
  definition: '民數記27:12-14 正式通知摩西：他可以從亞巴琳山觀看神所賜的地，卻要像亞倫一樣死去，不能帶百姓進入。原因不是年老或接班安排本身，而是米利巴事件中，他和亞倫違背神的命令，沒有在會眾眼前尊神為聖。


    **這段把審判與恩典並列。**


    - 審判：神沒有因摩西長久服事就撤回米利巴的判詞。CT 與 BibleHub 都指出，公開代表神的領袖要為自己在百姓面前的行動負更重責任。

    - 恩典：神仍准他觀看土地，也用「歸到列祖／本民」描述他的死。KingComments 強調摩西聽見自己的終局後沒有苦毒，立刻為會眾求一位合適的牧者；GT
    也把後半章的接班人問題直接接在這項通知之後。

    - 應許：摩西不能進入，神賜地的計畫仍繼續。領袖會更替，神對以色列的應許不因一位領袖離世而中斷。


    STEP 使兩個關鍵動作更清楚。第13節「你必歸到」是 H622 אָסַף（a.saph，聚集）的 Niphal 形 וְ/נֶאֱסַפְתָּ（ve./ne.''e.saf.Ta，Hc/VNq2ms），context
    gloss 是「你將被聚集」；同節提到亞倫「被聚集」也是 H622 的 Niphal。第14節「尊我為聖」是 H6942G לְ/הַקְדִּישֵׁ/נִי（le./hak.di.She./ni，HR/Vhcc/Sp1bs），使役式不定詞附第一人稱單數受詞，context
    gloss 是「把我當作聖」。詞形確認動作，受罰原因則由神在本段親自說明。'
  development: '民數記20章先記米利巴的失敗與「不得領這會眾進地」的判詞；27章在第二次數點後確認摩西將死，並立即安排約書亞；申命記3章補上判詞與實現之間的那一次請求；申命記34章則記他從尼波山觀看全地、死在摩押地。四段依次交代原因、交接、請求與實現。


    申命記3章是全本聖經唯一記下摩西為這件事開口懇求的地方：他求「容我過去，看約但河那邊的美地」，神的回答是「罷了！你不要向我再提這事」。被拒之後神並不是什麼都沒給——KC
    在這一章指出：「God allowed him to stand in a place from where he could see the whole
    land in its length and breadth (Num 27:12-14; Deu 34:1-4). God enabled him to
    look further than is conceivable with natural eyes.」（神讓他站在一個地方，能看見全地的長闊。神使他看得比肉眼所能想像的更遠。）民27
    交代的安排與申34 記下的實現，中間就是申3 的這次請求與這個替代方案。'
