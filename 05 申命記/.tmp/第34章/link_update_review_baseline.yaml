- title: 興起一位先知像我
  path: link_folder/神學/興起一位先知像我.md
  definition: '申命記第十八章第15節是全章的轉折。前面剛禁止百姓去問占卜的、觀兆的，這裡緊接著給出正當的替代：「耶和華─你的神要從你們弟兄中間給你興起一位先知像我，你們要聽從他。」


    ### 這個應許是怎麼來的


    第16至17節說明起因——是百姓自己求的。他們在何烈山受不了直接聽見神的聲音，求摩西代聽代傳，神的回答是「他們所說的是」。


    GT《聖經精讀本》把這一段標為先知制度的起源，並指出源頭在出埃及第一年三月百姓於何烈山領受十誡時，摩西在神與百姓之間擔當仲裁作用的那件事（出19:7,8）——當時摩西做的，就是把神的旨意告訴百姓，再把百姓所說的話傳達給神。


    GT《啟導本聖經申命記註釋》補上此刻的處境：百姓曾要求摩西替他們聽神的聲音來傳話，現在摩西快要離世，但有一人會繼續他做神的出口，而且「這個責任一直有人繼續下去」。BH
    也讀出同一件事：百姓求一位中間人，這正預示了先知在以色列要擔任的角色。


    ### 「一位」是一個人，還是一串人


    各家在這一點上分得很清楚，而且兩種讀法並不互相排斥。


    | 來源 | 對「一位先知」的理解 |

    | --- | --- |

    | GT《申命記串珠聖經註釋》 | 「一位」也可指一系列，「像我」乃是像摩西一樣把神的話傳給百姓 |

    | GT《聖經精讀本》 | 首先指摩西去世之後的幾個世代期間，在以色列百姓中所興起的所有屬神的先知；從終極意義來看則指耶穌基督 |

    | CT | 近期內可能指的是他的繼承人約書亞，但實際上指的是那要來的彌賽亞，就是基督 |

    | GT《申命記雷氏研讀本》 | 這職務最終由拿撒勒的耶穌來完成；摩西在事奉上是基督的預表 |


    四家對最終應驗的對象沒有分歧。KC 把新約的兩處引用列出（徒3:19-23；7:37），並從第15節的「從你們弟兄中間」讀出一件事——要作那位先知，主耶穌必須成為人。BH
    說得更平實：這句話指明那位先知會是以色列人，是從自己人中間出來的。


    ### 「像摩西」像在哪裡


    第18節給了具體內容：「我要將當說的話傳給他；他要將我一切所吩咐的都傳給他們。」


    STEP 顯示「傳給」在原文不是「說」而是「放」——ve./na.ta.Ti（H5414H，na.tan: to give: put）加 be./Fi/v（H6310G，peh:
    lip），受詞是 de.va.Ra/i（H1697G），字面是我要把我的話放在他口中。CT〔話中之光〕註的正是「傳給他」原文是「放在他口中」。


    STEP 另顯示「興起」在第15與18節是同一個字的兩個人稱：ya.Kim 與 ''a.Kim（H6965I，qum: to arise: establish）。CT
    由此點出先知職分的特別之處——它既不像人所選舉設立的審判官，也不像世襲的君王，更不像與生俱來的祭司利未人，而是由神一個一個單獨興起的。這也是 KC 在本章開頭注意到的差別：君王與祭司都有繼承，先知沒有。


    ### 聽從他不是建議


    第19節說「誰不聽他奉我名所說的話，我必討誰的罪。」GT《聖經精讀本》列出使先知話語具權威的兩個條件：真先知必須奉神的名、根據神的名而宣告話語；真先知必須只宣佈神所命令的話語。這兩點滿足時，所有百姓都有義務絕對順服。


    KC 從應許的處境讀出這位先知的身分：他將是一位中保，而不聽他話的人必死（來12:25）。CT 則從反面提醒——先知說的話通常不是人愛聽的，因為神多半在百姓背道的時候才興起先知。'
  development: '這條線在五經裡有起點也有懸而未決的結尾。


    起點在何烈山。GT《聖經精讀本》指出先知制度源於百姓在何烈山領受十誡時摩西擔當仲裁的事實（出19:7,8）——那次是臨時的安排，百姓怕死，摩西上下傳話。申命記十八章把那次臨時的安排寫成長期的應許，而且給了資格：從弟兄中間出來、像摩西、話由神親自放在他口中。


    結尾則留在同一卷書的最後。GT《申命記雷氏研讀本》在第15節把讀者指向申34:10，而那一節說的是「以後以色列中再沒有興起先知像摩西的」。同一卷書先應許有一位像摩西的先知，最後又記下再沒有人像摩西——兩句話合起來，是把這個應許往前推，不是把它取消。


    四套註釋在收束的方向上一致：CT 指向那要來的彌賽亞（參約一45），GT《啟導本》列出約一21、45；六14；七40；徒三22～26；七37，GT《聖經精讀本》與
    KC 同引徒3:22、7:37，BH 也把徒3:22-23 列為新約的引用。'
