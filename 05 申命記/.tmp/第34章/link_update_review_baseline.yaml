- title: 摩押平原
  path: link_folder/地點/摩押平原.md
  definition: '民數記22:1：「以色列人起行，在摩押平原、約但河東，對著耶利哥安營。」這是以色列出埃及後最後一個紮營地。


    **位置。** GT《舊約聖經背景註釋》說這是「約但河東死海北岸廣闊的平原或草原地帶，對岸是耶利哥平原（書四13）」，並指出「這位置恰可成為進入迦南地的跳板」。GT
    丁良才《民數記註釋》給出範圍：摩押平原從伯耶施末直到亞伯什亭（民33:49），先前屬摩押人，所以留下這個名字。


    **這裡發生了多少事。** GT《啟導本聖經註釋》說以色列人在此停留頗長一段時間，民22 到民36 所記的都發生在這裡，包括巴蘭說預言、以色列人拜偶像、第三次人口調查，以及一連串條例的宣佈。GT《聖經精讀本──民數記註解》補上一句：「申命記的整個內容是摩西在摩押平原所講的道。」


    **它此時已經易主。** 丁良才指出這片地先前屬摩押人；以色列紮營時，它已因亞摩利王西宏的征服而改變歸屬。'
