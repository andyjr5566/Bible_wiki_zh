- title: 神與摩西面對面明說
  path: link_folder/神學/神與摩西面對面明說.md
  definition: '民12:6-8 是全本聖經對「神怎樣向人說話」分得最清楚的一段。神把先知與摩西分成兩種等級：


    | | 一般先知（v6） | 摩西（v8） |

    | :--- | :--- | :--- |

    | 方式 | 在異象中顯現、在夢中說話 | 面對面說話 |

    | 清晰度 | ——（需要解讀） | 明說，不用謎語 |

    | 所見 | ——  | 必見耶和華的形像 |


    **「面對面」的原文字面是「嘴對嘴」。** GT《聖經精讀本》：「字面上的意思是『嘴對嘴』，是指神與摩西相見的時候並不是通過中間通道，而是象朋友一樣自然對話的意思（出33:11）。」STEP
    原文資料證實這個字面：第8節是 peh ''el- peh（H6310G，詞典義 lip／mouth）。


    **STEP 另顯示第6與第8節用了一組近乎同形的字。** 第6節「異象」是 ba./mar.''Ah（H4759A，詞典義 vision），第8節「明說」是
    u./mar.''Eh（H4758，詞典義 appearance）——兩個不同的 Strong 編號，拼寫卻只差一點。CT 給的原文字義正是「異象」景象，鏡子／「明說」眼前看到的。==先知得到的是「異象」，摩西得到的是「所見」。==


    **「見我的形像」不等於看見神的本體。** GT 丁良才：「神叫摩西所看見的，是照著他所能容受的（出三十三21-23）。摩西卻沒有看見神的本體（出三十三20，約一18，西一15，提前六16）。」CT
    也說「形像不是真體」。GT《啟導本聖經註釋》：「這當然不是指直接見到神未隱藏的面，而是一種可見的形狀。摩西曾要求見神的面，他見到了神的背。」STEP 顯示這個字是
    te.mu.Nat（H8544，詞典義 likeness）。


    **這段話的重點不在貶低先知，而在說明米利暗和亞倫錯在哪裡。** GT《民數記串珠聖經註釋》：「屬靈的權柄源於神親自的啟示（2），米利暗和亞倫所說的並沒有錯，可惜他們沒有分辨出他們得啟示的方法與摩西的有何不同。」'
