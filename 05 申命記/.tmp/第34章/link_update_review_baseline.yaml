- title: 以色列
  path: link_folder/原文/以色列.md
  definition: '希伯來文「以色列」（`יִשְׂרָאֵל`，*Yisrael*，H3478），專有名詞，由動詞 `שָׂרָה`（*sarah*，H8280，意為「角力、爭戰、較力、治理」）與名詞
    `אֵל`（*El*，H410，神）組合而成。


    創世記 32:28 記載神親自為雅各改名並解釋其涵義：「你的名不要再叫雅各，要叫以色列；因為你與神與人較力，都得了勝。」


    STEP 原文資料顯示，名詞中 el 清楚指涉「神」。註釋家進一步探討其多重字義與屬靈幅度：CT 註其原文字義為「那與神搏鬥的人，他要管理如神，神的王子，與神一同治理」；GT
    與雷氏研讀本則譯為「與神較力者」、「神的王子」（prince）或「他藉不斷禱告堅持」。何西阿書 12:3-4 更以「他在母腹中抓住哥哥的腳跟，壯年的時候與神較力，與天使較力，並且得勝，哭泣懇求」揭示了該名字深刻的神學與屬靈意涵。'
  development: '### 神給的解釋


    第28節：「你的名不要再叫雅各，要叫以色列；因為你與神與人較力，都得了勝。」解釋是神自己給的，四份來源都以這一句為準。


    CT 註其原文字義為「那與神搏鬥的人，他要管理如神，神的王子，與神一同治理」。GT 丁良才《創世紀註釋》譯作「在神面前為君王」。GT《啟導本聖經創世記註釋》作「與神較力者」。GT《串珠聖經註釋》作「那與神搏鬥的人」。GT《聖經精讀本──創世記註解》採「神的王子」（prince）。GT《創世記雷氏研讀本》給的是「他與神打架，或藉不斷的禱告堅持」，並指出這名字當中的
    el 是指「神」——雅各在第29節問對方的名字被拒絕，而「他的問題藉那賜給他的名已經得到答案」。


    各家在「與神」這一半完全一致，在動詞那一半各有側重（較力／搏鬥／堅持／治理）。這不是矛盾，是同一個字根的語意幅度。


    ### 「都得了勝」是什麼意思


    CT 註：神給雅各改名為以色列，表明神現在看雅各不再是「奪取者」，而是「較力者」；而「你與神與人較力，都得了勝」的意思是——你既勝過了我，你也必勝過以掃。GT
    丁良才說法相同，並補上一句應用：得勝神就是得勝人的妙法，神若與我們和好，我們就不用怕仇敵了（羅八31）。


    但「得勝」的內容要小心。KC 引何十二3-4 指出雅各是怎麼贏的：藉著哭泣懇求神的恩惠——「一個人只有走到自己力量的盡頭才會這樣做，而那正是神容讓自己被勝過的方式」。CT
    的措辭是：我們真的得勝的時候，就是敗在神手裏的時候。


    ### 改名這件事本身


    GT 華爾頓《創世記背景註釋》從制度面解釋：更改名字有作為起源故事的作用（如創十七5 亞伯蘭改名亞伯拉罕，以強調他是多國之父的立約應許），而使者詢問雅各的名字，「是提供機會突出名字改為以色列的一點」。


    他並指出改名的權力意涵：更改一人的名字是行使凌駕乎此人之上的權柄——宗主立藩屬為王，偶爾亦同時給他另起新名，以彰顯對藩屬的權勢。因此第28節不只是取一個好聽的名字，是一次身分的授予：雅各「從流浪者兼篡奪者，變成了盟約繼承人，被選為神子民的領袖」。


    GT《聖經精讀本──創世記註解》講的是同一件事：起名的行為代表命名者的所有權和統治權；把含有「欺騙奪去」之意的雅各換成含有「神的王子」之意的以色列，表明①原本失敗的名字受祝福後成為屬靈、勝利的名字；②根據伯特利之約，雅各正式成為立約的繼承人。


    ### 為什麼舊名沒有消失


    這是本條目最值得留住的一項觀察，來自 KC：此後「雅各」與「以色列」兩個名字在他的歷史中交替使用——用「雅各」時，一般是那個自己安排事情的軟弱雅各；用「以色列」時，看見的是他憑信心、倚靠神而行。而這一點與亞伯拉罕不同：亞伯蘭得了新名亞伯拉罕之後，經文再也沒有提過亞伯蘭。


    KC 由此讀出一層意思：神用「雅各」這個名字提醒我們，信徒只要還活在地上就仍需要祂的管教，因為肉體仍在他裏面；而祂的管教可以是糾正性的，也可以是預防性的——無論哪一種，都是祂恩典的憑據。


    ### 從一個人的名字，變成一整個民族的名字


    雅各改名以色列時，這名字還只屬於他一人；到出埃及記，它已經是集體身分。GT《丁道爾聖經註釋》在出1:1 指出這是「五經最後一次以『以色列的眾子』之名，來形容雅各的直系親屬——今後這名號便成為父系的集合稱謂，形容神的全部子民」。這個轉換在出5章第一次被說破：KC
    說「以色列的神」這個稱呼「在此第一次在聖經中與祂的百姓連在一起被提起」；同一章裡，法老口中的「以色列人」卻帶著蔑視（GT：原文直譯「這地的人」，在此語氣如「賤民」）——同一個名字，在神口中是尊榮，在法老口中是輕蔑。出16章「以色列全會眾」一詞首次出現，CT
    說這正是「新約時代『教會』的模型」。到出19章，神用「雅各」與「以色列」兩個名字同時稱呼百姓——KC 讀出這是神看見他們的軟弱（雅各），也看見祂所造的（以色列），與雅各本人身上「舊名沒有消失」的模式完全一致，只是規模從一個人放大成一整個民族。'
