- title: 亞伯拉罕之約
  path: link_folder/神學/亞伯拉罕之約.md
  summary: '第17節「照他向你列祖所起的誓使你人數增多」，STEP 為 ve./hir.Be./kha（H7235A，ra.vah: to multiply）＋nish.Ba''（H7650，sha.va: to swear）。BH 把這句接回神應許亞伯拉罕後裔繁多（創12:2、15:5）；KC 說滅城會損失人口，但這個順服的舉動連著神必再使他們增多的應許。'
  relation: 創世記各章與申5 至10 記的是這個約怎麼立、怎麼被重申。本章把它放在一個很特別的位置——全章講的是除掉，最後一句卻用這個約講增多，兩件事被寫在同一節裡。
