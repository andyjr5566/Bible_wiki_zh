- title: 殺盡米甸人的道德難題
  path: link_folder/解經爭議/殺盡米甸人的道德難題.md
  summary: 第15至17節命令用刀殺盡那城裡的居民與牲畜、財物堆積燒盡、那城永為荒堆。GT《申命記串珠聖經註釋》說整座城都該被摧毀，如同迦南地的城邑一樣；GT《聖經精讀本》說這樣的規定表明離棄神而追隨偶像是何等可怕的罪惡，並說在預表天國的應許之地迦南決不容忍任何罪的因素得以存在。第14節先要求探聽、查究、細細地訪問，果然是真才可動手。
  relation: 民31 的對象是米甸人，是外族。本章把形式相同的命令轉向以色列自己的一座城，觸發條件寫成拜偶像而不是族群；同時多了一道民31 沒有的查證程序。（本回合另作一處勘誤：定義區原把 KC 民31 的英文句以中譯形式放進「」，依 AGENTS.md 改為英文原句進「」、中譯進括號；依據為 raw_data/kingcomments_numbers_31.txt 的 That teaches us that we must distinguish in the exercise of judgment.）
