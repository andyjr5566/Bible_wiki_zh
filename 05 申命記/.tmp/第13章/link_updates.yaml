      covered_by: 見證人先下手，然後眾民也下手
- title: 神蹟（miraculous signs）
  path: link_folder/神學/神蹟（miraculous signs）.md
  summary: '第1至2節「向你顯個神蹟奇事」「他所顯的神蹟奇事雖有應驗」，STEP 為 ''ot（H226G，ot: sign: miraculous）與 mo.Fet（H4159，mo.phet: wonder）。CT〔原文字義〕註「神蹟」神蹟，記號；GT《啟導本聖經申命記註釋》分辨兩個詞——「神蹟」為指示將來的預兆，「奇事」是證明先知或作夢的確有能力的異事，不過二詞常用作同義詞；KC 說神蹟奇事本來的作用只是支持所傳的信息（來2:3-4），撒但也能仿製，末世尤其如此（帖後2:9；啟13:14；太24:24）。'
  relation: 出4、出10至12 收的是神蹟作為差遣憑證與教育下一代的正面用法。本章給的是同一件事的反面：神蹟即使真的應驗，也不能替說話的人背書。兩邊合起來，神蹟的效力始終取決於它所支持的那句話。
  overview_review:
