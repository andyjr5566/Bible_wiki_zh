- title: 石刑
  path: link_folder/背景/石刑.md
  definition: 石刑是古代以色列執行死刑最常用的方式，出埃及記第二十一章在兩處用到它：一是十二至十七節的四項死罪，二是二十八至三十二節處死觸死人的牛。GT《舊約聖經背景註釋》說明它為何成為慣例：「石刑是慣常的處死方法。如此沒有一個人需要為罪犯的死亡負責，整個社群都有分於消滅罪惡。」石刑的重點因此不只在致死的手段，更在責任的分擔——沒有一個特定的行刑者，整個群體共同承擔清除罪惡的行動。GT《啟導本聖經腳註》就本章十二至十七節的死罪指出：「方法多為用石頭打死（參利二十2、27；二十四16）；如屬殺人犯，則由死者的近親執行（參民三十五19；申十九12）」，可見在殺人案件中另有近親復仇者的角色。本章第二十八節把同一種刑罰施在牲畜身上，CT
    解釋其根據：「無論是人是獸，神必要追討流血害命的罪（參創九5）」，因此觸死人的牛必須處死，而且不可吃牠的肉。
  development: '### 從牛的刑罰到人的刑罰


    出埃及記21章講的石刑對象是牛：牛若觸死人，「總要用石頭打死那牛」。到利未記20章，同一種刑罰第一次明文用在人身上——v2 獻兒女給摩洛的人，v27 交鬼與行巫術的人。


    本章也是石刑「為什麼要全民動手」講得最清楚的一處。GT 丁良才記下程序：把犯人帶到營外，見證人先下手，然後眾民也下手（申17:7）；他的解釋是「神叫眾民在除罪的事上有份，為要叫他們受警誡」。GT《舊約聖經背景註釋》用另一個詞說同一件事——這是團體性的死刑，每個人都要參與，作為淨化禮。KC
    則把重點放在「誰的意志」：每個成員都丟一塊石頭，等於全民一同執行耶和華的旨意。


    GT《啟導本》另外列出聖經中受此死刑的罪：褻瀆神（利24:16）、拜偶像（申13:6-10）、不守安息日（民15:32-36）與交鬼（利20:27）——四種都屬於直接冒犯神的罪，這也說明石刑為什麼由全會眾執行而不是由某個官長執行。'
  signals:
  - first_in_book
  accumulation_count:
