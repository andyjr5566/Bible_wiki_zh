- title: 神蹟（miraculous signs）
  path: link_folder/神學/神蹟（miraculous signs）.md
  definition: 神蹟（miraculous signs）是神為證實祂的顯現與差遣而賜給使者施行的超自然記號。出埃及記第4章中，神賜摩西三個神蹟作為憑證——杖變蛇、手長大痲瘋、水變血——目的是「如此好叫他們信耶和華…是向你顯現了」（v5）。神蹟在此不是表演，而是神親自賦予的記號，用以勝過不信。
  development: GT《聖經精讀本》指出這些奇事在經文中有幾個不同的稱呼——標記（sign）、驚異（marvel）、預兆（portent）——並說這些名稱本身就說明了奇跡的根源與目的：「奇跡的根源是神，目的在於讓那些不信神的人通過神的能力能夠確信神。」神蹟在出埃及記中擴展為十災與過紅海，是神拯救以色列的核心行動模式。聖經整體中，神蹟常在啟示轉折點密集出現：出埃及、以利亞／以利沙先知事工、耶穌事工（約20:30-31「但記這些事要叫你們信」），以及使徒時代。神蹟的本質是神親自介入，不等同魔術或人的能力操作。
