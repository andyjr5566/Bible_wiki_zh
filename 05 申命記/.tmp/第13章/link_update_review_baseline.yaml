- title: 各人行自己眼中看為正的事
  path: link_folder/主題/各人行自己眼中看為正的事.md
  definition: '申命記第十二章第8節，摩西回頭評了一句自己這一代的現況：「我們今日在這裡所行的是各人行自己眼中看為正的事，你們將來不可這樣行」。


    這句話在本章有一個對照組。STEP 顯示第8節的「看為正」是 hai./ya.Shar（H3477G，簡要詞典義 ya.shar: upright）配上 be./''ei.Na/v（H5869I，a.yin:
    eye: appearance，本節逐字解作在他自己眼中）；第25節「你行耶和華眼中看為正的事」與第28節「行耶和華你神眼中看為善，看為正的事」用的是同一個
    ya.shar，只是後面換成 be./''ei.Nei Yah.weh（H5869H）。同一個判準詞，換了一雙眼睛。CT 在第28節把這個對照明講出來：『神眼中看為善，看為正的事』指與「自己眼中看為正的事」（參8節）不同，因為人的眼光自私、狹窄、短視，故不能用來衡量事物的對錯，而須依照神的觀點行事。第8節的註解也是同一句話的反面：『行自己眼中看為正的事』並不是神眼中看為正的事，且往往與神的心意相反。


    **摩西在講的是一段過渡期，不是在罵人。** GT《申命記串珠聖經註釋》解釋得最具體：自從出埃及一段日子以來，以色列民沒有永久居留住處，過著飄流曠野的生活，他們的敬拜方式自不免按著實際環境有所適應；曠野的飄泊不能給予以色列民有秩序的崇拜生活，因為他們還未得到神所應許的安息和產業。GT《聖經精讀本》講的是同一件事：雖然在西奈山領受了關於祭祀制度的規定，但在曠野之旅期間未能徹底遵行。GT《申命記雷氏研讀本》補上結論——在曠野飄流期間以色列人不是每次都能履行獻祭儀式的一切要求，但定居迦南之後就必定可以。所以第9節緊接著給理由：因為你們還沒有到那安息地。


    **這句話後來成了士師時代的判語。** GT《啟導本聖經申命記註釋》指出，《士師記》十七6和二十一25 記的「各人任意而行」正說明建立嚴格法律體制的必要，並說摩西在這裡訓示百姓，到了新土決不可再如此。KC
    與 BH 也都把第28節接到士21:25；BH 說那個時期的特徵是道德與屬靈的無政府狀態，常導致拜偶像與違背神的命令。


    **要注意這句話講的範圍。** GT《啟導本》說摩西在這裡著重解釋的是律法中道德層面的要義；但從本章上下文看，第8節直接針對的是獻祭地點與方式——第13節「不可在你所看中的各處獻燔祭」正是同一個問題的具體版本。CT
    的話中之光把它推到一般人身上：人在最大的事、宗教上面，很容易以為自己的意見都是對的，或盲目跟著別人跑；身體有毛病會慎重找可靠的醫生，對靈魂永遠的大事卻又非常草率。'
