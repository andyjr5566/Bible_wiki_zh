- title: 奴僕
  path: link_folder/原文/奴僕.md
  definition: 「奴僕」是出埃及記二十一章反覆出現的身分詞。CT 的原文字義只給兩個義項——「奴隸，僕人」——並在文意註解裡收緊為「指沒有人身自由的奴隸」；同章七節的「婢女」原文字義是「女奴，女僕」。GT《中文聖經註釋》把這個身分的法律地位講明：「古代的奴婢，實際上是奴隸，在法律上稱為有體動產（chattel）」，並列出成為奴隸的六種常見原因：「（一）戰爭擄掠的人口；（二）被統治的少數民族；（三）奴隸市場買來的；（四）因貧窮或負債而自己賣身的；（五）被拐帶出賣的；（六）家中奴僕所生的」，而本章所講的是第四種。GT《丁道爾聖經註釋》認為就這一段的內容而言，「稱這人為『契約僕役』（indentured
    laborer）可能更合適」；BH 也從「買」字下手，指出這裡的「買」表示的是一份契約協議，而不是對一個人的所有權。
  development: 奴僕在本章既是法律主體也是財產，兩種身分同時存在，張力沒有被解消。GT《丁道爾聖經註釋》對這個張力的判斷是：「妥拉和保羅一樣，接受奴隸制度是古代社會無法避免的一部分，然而這種新的人道主義終於為奴隸制度敲響了喪鐘」，並指以色列「只有小規模的農村或家庭奴隸，不像羅馬帝國可怕的『奴隸圍場』」。
