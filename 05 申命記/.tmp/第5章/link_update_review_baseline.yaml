- title: 雷轟即神的聲音
  path: link_folder/神學/雷轟即神的聲音.md
  definition: 出9:23「耶和華就打雷下雹」、第28節法老說「這雷轟和冰雹已經夠了」——這兩處的「打雷」與「雷轟」，原文直譯都是「神的聲音」。GT《聖經精讀本》註第23節：「打雷：字面意思『聲音』。這是指『神的聲音』（19:19；詩18:13），是神審判的吼聲的意思。因為雷聲表示神對人類的審判，所以最能生動地表現神的偉大。」
  development: 'GT《串珠聖經註釋》在第28節把這層意思連到法老的反應：「『雷轟』：在原文是『神的聲音』，其實在舊約裡，雷轟往往象徵神的聲音；法老也似乎體驗到：神在說話當中執行審判了。」


    GT《丁道爾》則先給一個語法上的保留，再把結論推到最強：「『雷轟』希伯來原文直譯是『神的聲音』，然而依照閃族慣用語法，應當譯作『極大的雷聲』。從西乃山以至福音書（出十九19；約十二29），『雷聲』素被視為神聲音的象徵。所以惟獨在本節，這句話當以最完整的意義，解作『神說出審判』。」——也就是說，別處可以只當作「極大的雷聲」，惟獨第28節要照字面讀。


    這一層意思在本章有一個具體的作用：第五、六兩災神都沒有出聲，第七災卻是打雷。GT《每日研經叢書》從物理面補上為何這麼可怕：「在比較不太高緯度的地方少有強烈的雷雨，這雷雨本身必然很可怕；那『火』（24節）當然是指閃電。」BH
    也把雷電讀成神同在的表記：雷與雹在聖經中常與神的審判相連，而閃電在西乃山（出19:16）同樣是神臨在的記號。'
