- title: 律法與恩典
  path: link_folder/主題/律法與恩典.md
  definition: 律法與恩典是聖經中描述神與人關係的兩個基本範疇。在出埃及記二十章，十誡的頒布次序彰顯了恩典先於律法的原則：神在頒布誡命之前，先宣告「我是耶和華你的神，曾將你從埃及地為奴之家領出來」（2節）——救贖恩典是律法要求的基礎。律法不是得救的條件，而是對已蒙救贖之人的生活方式指引。
  development: 新約中保羅清楚教導：人不是因行律法稱義，而是因信基督稱義（羅三20-28；加二16）。律法的功用是使人知罪（羅三20），引導人到基督那裡（加三24）。信徒不在律法之下，乃在恩典之下（羅六14），但律法的道德要求仍透過愛得以成全（羅十三8-10）。耶穌來不是要廢掉律法，乃是要成全（太五17）。
