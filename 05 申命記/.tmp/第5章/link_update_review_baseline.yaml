- title: 安息（第七日的歇息）
  path: link_folder/原文/安息（第七日的歇息）.md
  definition: CT 在出二十三12 給「安息」的原文字義是「中止，休息」、「歇息」是「休息，安靜」、「舒暢」是「振作，恢復活力」。本節與十誡的第四誡命令相同，理由卻不同——GT《丁道爾聖經註釋》指出：「每星期安息一日不僅是為紀念神的創造大工（出二十11）或從埃及得拯救（申五15），更是讓以色列暫停工作，牲口藉此歇息，奴隸和半奴隸身分的工人亦可趁機舒暢。」
  development: BH 指出這一節把安息日的社會公義面凸顯出來：連地位最低的人也得享安息，這正是律法一貫關懷邊緣者的表現。KC 則把它連到生產至上的處境：在產能決定生活的時代，「貪心與不信」當道，而神願意讓人分享祂的安息並與祂相交。
