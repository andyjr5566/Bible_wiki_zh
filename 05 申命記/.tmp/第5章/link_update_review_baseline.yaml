- title: 申5：6-21
  path: link_folder/互文/申5：6-21.md
  definition: 申命記五章6-21節是十誡在申命記中的重複記載，與出埃及記二十章1-17節基本完全相同，主要差異在於守安息日的理由：出二十11以神的創造為基礎（「因為六日之內，耶和華造天、地、海，和其中的萬物，第七日便安息」），申五15則以出埃及的救贖為基礎（「你也要記念你在埃及地作過奴僕；耶和華你神用大能的手和伸出來的膀臂將你從那裡領出來」）。
  development: 申命記的十誡重述發生在摩押平原，摩西在以色列人進入迦南前重申律法。申命記版本的安息日理由從創造轉向救贖，反映申命記對出埃及救恩和社會公義的重視——安息日不僅紀念創造，也紀念神將以色列從奴役中釋放，因此僕婢和寄居者都應得享安息。
