- title: 「記念」與「守」
  path: link_folder/原文/「記念」與「守」.md
  definition: 第四誡在出埃及記二十章8節用「記念」זָכוֹר（zakhor，H2142）作誡命開頭，CT 解為「記得，回想、不敢或忘」；申命記五章12節則改用「守」שָׁמוֹר（shamor，H8104），撒瑪利亞抄本在出二十8
    也作「守」（GT《中文聖經註釋》：「記念一詞，撒瑪利亞抄本則是『守』」）。相關註釋因此把兩者看成互補：不只是記得安息日，也要實際守住它。
