- title: 耶和華永生神
  path: link_folder/神學/耶和華永生神.md
  definition: '創世記二十一章33節，亞伯拉罕在別是巴栽垂絲柳樹，求告「耶和華永生神」的名。原文為 El Olam，意為「永恆的神」或「永活的神」。


    亞伯拉罕對神的認識逐步加深：至高的神（創十四22）→ 看顧人的神（創十六13）→ 全能的神（創十七1）→ 永生神（創二十一33）。GT《串珠聖經註釋》解「永生神」原是「永活的神」：他所敬拜的耶和華永遠活著、永遠不改變，「這位耶和華說過的話必然兌現，應許永不落空」。'
  development: 'GT《啟導本聖經創世記註釋》把這一連串稱呼列在一起，說它們「都是神向人顯露的一面，讓人認識到這位全知、全能、全有的創造主」：至高神（el
    elyon，創十四18）、看顧人的神（el roi，創十六13）、全能的神（el shaddai，創十七1）、永生神（創二十一33）、以色列的神（el-Beth-el，創三十五7）。


    GT《聖經精讀本──創世記註解》從亞伯拉罕這一邊讀同一條線：他最初稱耶和華為「至高的神」（創十四22），立割禮之約時已認得他是「全能的神」（創十七1），到本章稱他為「耶和華永生神」，是「告白神是與人立約並成就其約的神」——「表示亞伯拉罕對神的認識更深一層」。'
