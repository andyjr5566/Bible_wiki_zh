- title: 妄稱
  path: link_folder/原文/妄稱.md
  definition: 第三誡「不可妄稱耶和華你神的名」（出二十7）中，「妄稱」原文不是單一個「說」字：動詞 נָשָׂא（nasa，H5375）有「拿起／舉起／承接」的意思，名詞
    שָׁוְא（shav，H7723）則是「虛妄／空虛」。CT 給的原文字義是「『妄』虛妄，空虛；『稱』舉起，高舉，承擔」。因此相關註釋不只談髒話，而進一步討論假誓、施咒、借神的名達成自己的目的。GT《中文聖經註釋》給的界定是：「原義是不正當的、無良好目的的，非義的使用神的名，都是妄稱神的名」，並指出這個字的適用範圍在歷史中被逐步擴大——「在起初，不可妄稱耶和華你神的名所包括的，也許只是不可妄用神的名來作咒詛、祝福、行邪術或是起誓而言。後來卻給解釋得包含了較大的範圍」。
