- title: 遵行
  path: link_folder/原文/遵行.md
  definition: CT 在出二十四7 註明「遵行」在該節的原文是兩個字：首字為「做，製作，行出」，次字為「聽到，聽從」。這正是第3節與第7節兩次應許的差別所在——第3節百姓只說「我們都必遵行」，第7節則加上了「聽從」這一層。CT
    並註明第3節的「齊」原文字義是「一，一個」，指「異口同聲，或同心合意」。
  development: 遵行在聖經中是信心的果子：創22:18亞伯拉罕遵行得福、申28遵行得福/違背受咒、撒上15:22「聽命勝於獻祭」、太7:21「遵行我天父旨意的人才能進天國」、雅1:22「要作行道的人，不要單聽話」。基督完全遵行父旨意（約4:34,
    6:38, 17:4, 來10:7, 腓2:8），信徒在基督裡得以遵行（羅8:4, 加5:16, 弗2:10）。
