- title: 不可殺人
  path: link_folder/神學/不可殺人.md
  definition: 「不可殺人」（出二十13）是十誡的第六條誡命，禁止非法剝奪他人的生命。原文使用的希伯來動詞「ratsach」專指非法殺人（謀殺），有別於戰爭中的殺敵或合法的死刑執行。此誡命的核心是對人類生命神聖性的尊重——人是按神的形像造的（創一27），生命屬於神，人無權非法奪取。
  development: 新約中耶穌在登山寶訓深化第六誡的內涵：不僅殺人是罪，向弟兄動怒、咒罵弟兄也等同殺人（太五21-22）。耶穌強調內心的怒氣和仇恨是殺人的根源，呼籲人追求內心的潔淨和和好。約翰一書三15指出「凡恨他弟兄的，就是殺人的」。第六誡因此不僅關乎外在行為，更關乎內心態度。
  signals:
