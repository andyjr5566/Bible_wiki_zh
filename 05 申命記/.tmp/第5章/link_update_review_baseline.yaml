- title: 神頒布十誡
  path: link_folder/事件/神頒布十誡.md
  definition: 神頒布十誡是出埃及記二十章1-17節記載的核心事件：神在西乃山從天上向以色列全會眾直接頒布十條誡命。此事件伴隨雷轟、閃電、角聲和山上冒煙的威嚴顯現（18節），是聖經中神直接向全體百姓說話的罕見時刻。十誡的頒布是西乃之約的核心，奠定了以色列律法和倫理的基礎。
