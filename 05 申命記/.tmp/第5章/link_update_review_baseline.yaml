- title: 定言式法律
  path: link_folder/神學/定言式法律.md
  definition: 定言式法律（apodictic law）是古代法律的一種形式，以絕對、無條件的命令句式表達，通常以「你不可……」或「不可……」的否定式肯定語開頭，簡練絕對、不容例外、不解釋理由。與之相對的是條件式法律（casuistic
    law），以「人若……」或「倘若……」為引端，列出具體案例和處罰。十誡是定言式法律的典型代表，在古代近東法典中十分罕見，反映了以色列宗教的特殊性。
  development: 以色列的律法分為「定言式」和「條件式」兩大類。定言式法律是嚴峻的沙漠法律，不解釋發令的理由、沒有例外、不容辯駁，可能來源較早，是基本原則的化身。條件式法律則是以色列以外古代西亞洲法典中十分普遍的形式，一般視為基於早期大原則的後世案例。GT指出，五經中有五處定言式誡命段落：出二十1-17、出三十四11-26、利十九1-18、申五6-21、申二十七15-26。
