- title: 我是耶和華你的神
  path: link_folder/神學/我是耶和華你的神.md
  definition: 「我是耶和華你的神，曾將你從埃及地為奴之家領出來」（出二十2）是十誡的引言（或序言），宣告頒布誡命者的身份和權柄。神以救贖主而非創造主的身份宣告自己，將誡命建立在祂拯救以色列出埃及的恩典行動之上。此引言表明：誡命的頒布不是赤裸裸的律法要求，而是基於神先行的救贖恩典；神有權頒布誡命，因為祂是以色列的創造者、保存者和救贖者。
  development: 此引言在申命記五6重複出現。GT指出，猶太教視本節為第一誡，命令相信神——且不是一般的相信，而是相信為以色列行事的永生神。基督教傳統則視之為序言。無論視為第一誡還是序言，本節都將救贖的歷史與誡命相連，表明這位救贖主有權要求百姓遵守祂的命令。此引言對於連貫出埃及的主題和西乃山的主題有莫大的價值。
  signals:
