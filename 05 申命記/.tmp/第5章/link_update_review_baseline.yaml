- title: 百姓懼怕神的顯現
  path: link_folder/事件/百姓懼怕神的顯現.md
  definition: 百姓懼怕神的顯現是出埃及記二十章18-19節記載的事件：以色列百姓目睹神在西乃山顯現的威嚴景象——雷轟、閃電、角聲、山上冒煙——就都發顫，遠遠站立。他們對摩西說：「求你和我們說話，我們必聽；不要神和我們說話，恐怕我們死亡。」此事件反映罪人在聖潔神臨在下的自然反應——深刻的畏懼和對中保的需要。
