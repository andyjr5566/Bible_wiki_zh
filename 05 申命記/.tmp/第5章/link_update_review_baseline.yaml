- title: 不可姦淫
  path: link_folder/神學/不可姦淫.md
  definition: 「不可姦淫」（出二十14）是十誡的第七條誡命，禁止婚姻關係以外的性行為。此誡命維護婚姻的神聖性和忠誠，將性關係置於神所設立的婚姻盟約之內。在古代近東社會，婚姻是社會的基礎制度，姦淫被視為對信任和社群穩定的嚴重破壞。
  development: 舊約中姦淫是嚴重的罪，可判死刑（利二十10）。先知以婚姻的忠誠比喻神與以色列的盟約關係——以色列的偶像敬拜被稱為「屬靈的姦淫」（何西阿書）。新約中耶穌深化第七誡的內涵：凡看見婦女就動淫念的，心裡已經犯姦淫了（太五27-28）。保羅教導婚姻應反映基督與教會的關係（弗五25-32）。
