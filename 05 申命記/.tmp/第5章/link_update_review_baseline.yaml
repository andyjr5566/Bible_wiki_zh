- title: 典章
  path: link_folder/神學/典章.md
  definition: '「典章」是出埃及記二十一1「你在百姓面前所要立的典章是這樣」所用的詞，也是出二十一至二十三章這一整段律例的標題。STEP 語言數據顯示，「典章」原文為
    מִשְׁפָּטִים（mishpatim，H4941，單數 מִשְׁפָּט mishpat），字面指法律裁決、案例判例與司法判斷。CT 的原文字義給四個義項：「審判，公義，判決，量刑」，並解作「『典章』指據為審判的準則」。GT《聖經精讀本》從法庭場景說明這個字：「希伯來語是『判斷』（judgement）的意思。在法庭判斷是非或真假的時候以此為標準」，並指出「聖經中這種律例的根本精神是公義和慈悲」；BH
    也指出它常指判決或法律裁定，屬於十誡之後為群體提供細部應用的約中律法。


    各家對這個標題涵蓋多大範圍並不一致：GT《啟導本聖經腳註》說「『典章』是指本章和以後兩章中的各項律例和規範，也應該包括二十23～26的建壇的法則」；GT《中文聖經註釋》則把標題的範圍收得更窄——「所講的是民事與刑事的典章，即廿一2～廿二15的各種律例」，並明說約書另含的禮儀律例與社會道德律例「並不包含在本節的標題之中」。'
  development: '「典章」這個字在五經裡有兩個很不一樣的出場位置，合起來才看得出它的份量。


    出埃及記第21章1節是它作為標題的一次：「你在百姓面前所要立的典章是這樣」，底下接的是奴僕、人身傷害、牲畜責任等一連串判例。這一層的重點是具體化——誡命給原則，典章給判例。CT
    注意到判例的排序本身帶著信息：「照一般來說，殺了人該怎樣辦理是應當放在最前頭的……可是希奇得很，在神所傳下來的典章裏，這個死刑並不是擺在最前頭。最前頭的卻是一個釋放奴僕的條例。」BH
    則從立法者的角度說，這批律法「反映神的品格，以及祂要在祂子民中間有公義與公正的心意」。


    利未記第26章的兩次出場則落在相反的一側。第15節說百姓「厭惡我的典章」、第43節說他們「厭棄了我的典章」——這是這個字第一次出現在被違背的位置上；而第46節又把它收回到全卷書的總稱裡：「這些律例、典章，和法度是耶和華與以色列人在西乃山藉著摩西立的。」


    GT 丁良才在利未記第26章15節下用整段篇幅分辨了三個常被混用的詞。「誡命」原是指十條誡，也常作神一切命令的通稱；「典章」的原文「是指著古審判官累集的判語，這些判語漸漸地成了－種普通法，神也選擇了這些判語為自已的典章」；「律例」的原文「是指著律法上的定例，譬如獻祭和潔淨的條例」。他給的判準很實用：典章管的是「顯然逆理之行動，就是人人看為惡的事」，律例管的是「因律法禁止才顯為惡的事」；文體上典章與誡命「多是簡勁的，助人記憶」，律例「多是描摹的，助人明白」。'
