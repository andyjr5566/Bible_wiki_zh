- title: 不可貪戀
  path: link_folder/神學/不可貪戀.md
  definition: 「不可貪戀人的房屋；也不可貪戀人的妻子、僕婢、牛驢，並他一切所有的」（出二十17）是十誡的第十條誡命，禁止人對他人所擁有的一切產生貪婪的慾望。此誡命獨特之處在於它直接針對內心的思想和慾望，而非外在行為——貪戀是內心對他人財物、配偶或任何擁有物的不正當渴望。第十誡表明神的律法不僅規範外在行為，更洞察人心。
  development: 第十誡與創世記第三章的墮落敘事相連——夏娃對禁果的慾望導致了罪。新約中保羅指出貪婪就與拜偶像一樣（西三5），並教導「敬虔加上知足的心便是大利」（提前六6-10）。耶穌教導「你們要謹慎自守，免去一切的貪心，因為人的生命不在乎家道豐富」（路十二15）。第十誡呼籲人培養感恩和信靠神供應的心。
