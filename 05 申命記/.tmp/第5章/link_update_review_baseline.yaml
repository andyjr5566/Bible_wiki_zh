- title: 追討罪自父及子直到三四代
  path: link_folder/神學/追討罪自父及子直到三四代.md
  definition: 「恨我的，我必追討他的罪，自父及子，直到三四代」（出二十5c）是十誡第二條誡命附帶的警告，表明神對恨祂之人（拒絕祂、違背祂誡命之人）的罪進行跨代追討。此語句並非教導後代為祖先的罪承擔刑罰，而是指出罪的後果具有跨代影響——父母的罪惡往往連累兒女，使其患疾病、受窮乏。這是論罪惡在今世的結果，不是論罪惡將來的刑罰。
  development: BH指出，「三四代」是典型的閃族用語，表示延續的意思，不必照字面計算。這世界屬於神，人與人間又息息相關，一代違背神的律法，確然會對未來的世代有所影響——奴隸制度、剝削他人、帝國主義、環境污染、道德淪亡都是這原則的例子。以西結書十八章1-4節和20節清楚教導個人責任的原則：各人為自己的罪負責。耶利米書三十一章29-30節預告新約時代不再有「父親吃了酸葡萄，兒子的牙酸倒了」的俗語。
