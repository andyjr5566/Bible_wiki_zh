- title: 安息日
  path: link_folder/神學/安息日.md
  definition: 神賜福給第七日，並把它分別為聖，因為祂在這日歇下創造之工。創世記2章使用動詞 שָׁבַת（*sha.vat*，H7673A，「停止、歇下」），以及「分別為聖」的動詞
    קָדַשׁ（H6942G）；後來表示「安息日」的名詞（BH 作 *Shabbat*）與前者相關。註釋從第七日的祝福與成聖，進一步看見安息日神學的創造根基。
  development: '安息日在五經裡不是一條孤立的誡命，而是一路換理由重申的制度，每換一次就多一層意思。


    起點在創世記第2章：神歇了創造之工，賜福第七日並定為聖日。這一層是根據，不是規條——那時還沒有律法。到了出埃及記第16章，安息日先以生活節奏的方式出現：嗎哪六日降下、第六日雙倍、第七日沒有，百姓照著收就自然守了。CT
    由此指出安息日早在西乃律法之前已經存在。


    正式成為誡命是在出埃及記第20章的第四誡，理由回到創造：「六日之內耶和華造天地海和其中的萬物，第七日便安息。」出埃及記第23章12節換了理由——這次是為著牛驢、婢女的兒子和寄居的可以歇息，是人道的一層。出埃及記第31章又換一層：安息日是神與以色列世世代代之間的證據；GT
    引《丁道爾》把它與割禮並列，割禮是個人的立約記號，安息日是團體恆常奉行的記號。


    接下來兩章專門處理「有正當理由不守」的情況。出埃及記第34章21節加上農忙的但書，GT《啟導本聖經腳註》說明用意：「人們急於耕種收割，容易忽略安息，所以特別指出即令在農忙的日子也當守安息日。」出埃及記第35章則把它擺在會幕建造的開頭，並加上舊約僅見的禁火令——連為神造聖所的熱心，也不得逾越安息的界線。


    到利未記，安息日兩次與別的義務並列。利未記第19章把它接在孝敬父母之後（v3）、又接在敬重聖所之前（v30）；利未記第26章把守安息日與敬聖所並列，當作全章祝福咒詛宣告的兩項前提。而利未記第26章34-35節補上這條線最沉重的一段：安息日制度若被長期忽略，地要在被擄的年月裡替百姓把欠下的安息一次補回來——制度不會因為沒人遵守就作廢，只會改由土地代償。

    民數記第15章補上這條線唯一的一次執行紀錄。出埃及記第31章定了刑度（在安息日做工的必要治死），卻沒有界定什麼算「做工」；民15:32-36 有人在安息日撿柴，眾人把他帶到摩西面前，卻只能「收在監內；因為當怎樣辦他，還沒有指明」，等神親自判決。GT《民數記串珠聖經註釋》指出爭點正在這裡：作工或生火要治死是明文（出31:15；35:2-3），「但在安息日檢柴卻未有明文說明」——撿柴的目的是生火，所以判為蓄意違反。從創世記第2章的根據、出埃及記的誡命與記號、利未記的並列義務，到這裡才第一次看見它被執行；而執行的方式不是人照著條文推論，是等神開口。'
