- title: 寄居身分
  path: link_folder/神學/寄居身分.md
  definition: '寄居表示暫住在不屬於自己永久產業的地方。GT《聖經精讀本》指出希伯來語「寄居」一詞就是「暫時居住」的意思（創12:10；20:1；35:27）。族長雖生活在不同地區，仍以寄居者自稱，因他們等候神所應許的產業。


    創世記四十七章兩次出現這個字：約瑟的弟兄對法老說「我們來到這地寄居」（4節），雅各對法老說「我寄居在世的年日是一百三十歲」（9節）。'
  development: '### 一個字，兩種用法


    第4節的「寄居」是對法老說的居留申請。GT 丁良才讀出它的份量：「這兩個字顯明以色列人遲早要回到迦南。他們在埃及只不過是客旅；與信從在世上相似（來11:13；彼前2:11）。」GT《串珠聖經註釋》同樣說它「表明只是暫時住在歌珊地，希望可以重返迦南」；GT《創世記雷氏研讀本》指出弟兄們的回答很直率，並且保證他們只是打算在饑荒期間暫住，而不是定居在那裏。KC
    的說法一致：他們無意在那裡定居，因為他們真正的居所在迦南。GT《聖經精讀本》把這句話的效果說得最遠：這表示他們也隨先祖的信仰，堅信回歸迦南地的應許，「這種意識成了日後出埃及事件的背景」。


    第9節的「寄居」則是雅各對自己一生的總結。BH 指出這反映了聖經中「客旅」的主題，如來11:13 說族長們是「在世上是客旅、是寄居的」，詩39:12 也是同一個說法。KC
    注意到雅各是「一生都作寄居的，並且在法老面前承認這一點」。GT《聖經精讀本》讀出這句話背後的內容：雅各回憶自己未能真正擁有神應許祖父亞伯拉罕的迦南地，反而過著長久漂泊彷徨的日子。


    ### 寄居與歸葬


    同一章的結尾把這個身分推到極處：雅各要約瑟起誓「不要將我葬在埃及」（29節）。GT 丁良才給出兩個理由：他相信他的後裔必得迦南地為業；他要使他的子孫知道，埃及不是他們常住的地方。寄居因此不只是一個居留身分，而是一個至死不改的取向。

    ### 從家族身分到法律身分


    創世記第47章的「寄居」講的是雅各一家的處境；到了律法書，同一個身分變成一個有明文規範的法律類別。民數記第15章把它推到最遠：獻火祭時「你們怎樣辦理，他也要照樣辦理」（v14），第15-16節更定為永遠的定例——「在耶和華面前，你們怎樣，寄居的也要怎樣」；誤犯得赦免（v26）、歸同一條例（v29）、擅敢行事被剪除（v30），恩典與刑罰兩面都一體適用。KC
    認為外邦人被放在以色列人旁邊、地位相同，這在舊約其他地方看不到。STEP 原文資料顯示民15:30 這一對詞是 הָ/אֶזְרָח（ha./''ez.Rach，H249，native-born）與
    הַ/גֵּר（ha./Ger，H1616，sojourner）——本地人與寄居者被放進同一個句子裡對舉。


    這條線因此有兩端：在創世記，寄居是「這裡不是我的家」的自我認定；在民數記，寄居是「你在神面前不比本地人少什麼」的法律保障。'
