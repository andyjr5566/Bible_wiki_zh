- title: 當記念安息日守為聖日
  path: link_folder/神學/當記念安息日守為聖日.md
  definition: 「當記念安息日，守為聖日。六日要勞碌做你一切的工，但第七日是向耶和華你神當守的安息日」（出二十8-10a）是十誡的第四條誡命，命令以色列人記念安息日並將其分別為聖。安息日的基礎是神的創造——六日之內耶和華造天地海和其中的萬物，第七日便安息，所以神賜福與安息日，定為聖日（11節）。此誡命要求人在六日工作後，第七日停止一切勞碌，專心歸給神。
  development: 安息日在申命記五15以出埃及的救贖為另一基礎。新約中耶穌宣告「安息日是為人設立的，人不是為安息日設立的」（可二27-28），並在安息日醫治病人，彰顯安息日的真正目的——使人得釋放和醫治。希伯來書四9-10指出，安息日的終末應驗在基督裡的真安息——信徒因信進入神的安息，停止靠自己的行為稱義。
  signals:
  - first_in_book
  accumulation_count:
