- title: 主日與安息日的關係之爭
  path: link_folder/解經爭議/主日與安息日的關係之爭.md
  definition: '出31:13-17 把安息日立為神與以色列之間世世代代的立約記號，而新約信徒聚集的是七日的第一日。兩者是什麼關係，各家分歧明顯。

    一方視主日為對應的替代。CT 把兩組記號並排：「守安息日是神和以色列人團體立約的證據，受割禮是神和以色列人個人立約的證據（創17:11）。同樣的，守主日是神和教會立新約的證據，受浸是神和信徒個人立約的證據。」在這個框架下，CT
    把出31:14-15 的刑罰逐句應用到主日上：「新約信徒若忽略主日，恐怕會得不償失」「新約信徒若在主日照常做工，將來恐怕會從得勝者中被剔除」。

    另一方明確切斷這個連結。GT《丁道爾》：「基督徒的『主日』（啟1:10）和安息日並沒有直接關聯。主日是七日的第一日（林前16:2），是光和創造以及聖靈降臨之日，也是每週記念基督復活，祂子民特此聚集敬拜的日子（徒20:7）。如今信徒一切的時間都已屬神，並不限於七日之中的一日。」

    第三種立場居中。GT《中文聖經註釋》承認主日的實務地位，卻拒絕把它等同於新安息日：「禮拜日被稱為主日，並不是新安息日。這是紀念主耶穌復活的日子，也是紀念聖靈降臨和新約教會誕生的日子」；它並指出這個習慣的歷史成因（主後第四世紀初君士坦丁大帝改信基督後定這日為公眾假日），最後引羅14:5-10
    收尾：「亦不可論斷或輕看那些堅持要守某一日子的人。」同一則註釋也把重心從日子移開：從可2:23-28 看，「不是在日子，乃在人，更在於主」。'
