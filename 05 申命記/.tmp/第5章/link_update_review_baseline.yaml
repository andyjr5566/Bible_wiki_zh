- title: 不可偷盜
  path: link_folder/神學/不可偷盜.md
  definition: 「不可偷盜」（出二十15）是十誡的第八條誡命，禁止非法奪取他人的財產。此誡命維護私有財產權和社群中的信任關係，要求人尊重他人透過合法勞動所得的擁有物。偷盜不僅是法律犯罪，更是道德失敗——反映對神供應的不信任和對他人權益的漠視。
  development: 新約中保羅教導：「從前偷竊的，不要再偷；總要勞力，親手做正經事，就可有餘分給那缺少的人」（弗四28）。此教導不僅禁止偷盜，更呼籲生命的轉化——從奪取變為給予。偷盜的根源是對神供應的不信任（太六33），以及貪婪（第十誡）。第八誡因此與第十誡（不可貪戀）緊密相連。
