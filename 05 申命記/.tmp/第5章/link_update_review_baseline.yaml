- title: 曾有何民聽見神在火中說話還能存活
  path: link_folder/主題/曾有何民聽見神在火中說話還能存活.md
  definition: '申命記4:32-33 是摩西丟出的第一個反問：「你且考察在你以前的世代，自神造人在世以來，從天這邊到天那邊，曾有何民聽見神在火中說話的聲音，像你聽見還能存活呢？這樣的大事何曾有、何曾聽見呢？」


    **這個反問把範圍拉到極限。** CT 文意註解：「『考察』意指自我審問；『在你以前的世代』指回顧已往」；而「自神造人在世以來，從天這邊到天那邊」，「首句指時間，末句指空間，兩句合起來意指沒有例外」。CT
    對兩個問句都給同一個答案：「答案是沒有。」


    **BH 把時間軸接回創世記。** 「This phrase points back to the creation narrative in Genesis,
    where God created humanity in His image (Genesis 1:26-27). It establishes a timeline
    that begins with creation, emphasizing the continuity of God''s plan and purpose
    for humanity.」（這句話回指創世記的創造敘事，神在那裡按自己的形像造人；它建立起一條從創造開始的時間線，強調神對人類的計畫與心意始終連貫。）


    **「還能存活」這幾個字才是重點。** BH：「In the ancient Near Eastern context, encountering a deity
    was often associated with fear and potential death due to the overwhelming holiness
    and power of the divine. The fact that the Israelites lived after such an encounter
    highlights God''s protective nature and His desire for a relationship with His
    people.」（在古代近東的觀念裡，遇見神明常與恐懼和可能的死亡相連，因為神性的聖潔與能力太過壓倒。以色列人在這樣的遭遇之後仍然活著，突顯了神的保護，以及祂想與子民建立關係的心意。）


    **KC 用連續三個問句讀這一段。** 「Is it not of unsurpassable magnitude that a people are brought
    to the heart of God? Is it not an unsuspected happening that God speaks out of
    the fire and that those to whom He addresses Himself remain alive?」（一個民族被帶到神的心上，這規模豈不是無可超越？神從火中說話，而祂所對之說話的人竟然存活，這豈不是意料之外的事？）


    **這一問與第10-12節是同一件事的兩面。** 那裡記的是事件本身（山上有火、只聽見聲音），這裡是四十年後回頭作結論：這件事沒有第二例。'
