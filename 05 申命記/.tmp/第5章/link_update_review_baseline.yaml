- title: 十誡的條分法
  path: link_folder/神學/十誡的條分法.md
  definition: 十誡的條分法是指將出埃及記二十章1-17節（及申命記五章6-21節）的經文劃分為十條誡命的不同傳統方法。由於經文本身沒有註明各條的編號，歷史上形成了三種主要的條分法：猶太教的條分法、基督教傳統的條分法，以及改革教派（加爾文、慈運理）的條分法。三種分法的差異主要在於第一、二誡和第十誡的劃分方式。
  development: 不同的條分法反映不同的神學傳統和重點。猶太教重視祖傳的不動產，因此將「不可貪戀人的房屋」單列為一誡。改革教派在十六世紀剷除教堂雕像和畫像的背景下，特別提升禁止偶像為獨立的第二誡。天主教和路德教派則將3-6節合為第一誡，並將17節有關「貪戀」的事分為兩條（第九和第十誡）。這些差異不影響十誡的實質內容和道德權威——GT《丁道爾聖經註釋》為此下了一個要緊的分辨：「以上不同的立場和神學重點並無關連，意見分歧只是顯出傳統數目雖然是『十』，經文如何分列配合來構成這個總數，卻沒有定議。」它並把這個問題與另外兩個數目相提並論：十二使徒確實名字不能肯定，以及以色列不多不少十二支派的名字在數學上難以處理的問題。
