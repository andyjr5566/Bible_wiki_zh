- title: 當孝敬父母
  path: link_folder/神學/當孝敬父母.md
  definition: 「當孝敬父母，使你的日子在耶和華你神所賜你的地上得以長久」（出二十12）是十誡的第五條誡命，也是第一條附帶應許的誡命。此誡命要求人尊敬、順從和照顧父母，將家庭關係置於神聖的道德秩序中。孝敬父母不僅是家庭倫理，更是對神創造秩序的尊重——父母是神設立的權威代表，孝敬父母反映對神的敬畏。
  development: 第五誡是十誡中第一條附帶應許的誡命。新約中保羅在弗六2-3引用此誡命，稱之為「第一條帶應許的誡命」。耶穌責備法利賽人用「各耳板」的傳統廢棄孝敬父母的誡命（可七10-13），強調孝敬父母的實質而非形式。孝敬父母的原則在新約中延伸為一切信徒對屬靈長輩和領袖的尊重。
