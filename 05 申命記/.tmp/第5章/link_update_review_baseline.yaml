- title: 只聽見聲音卻沒有看見形像（te.mu.nah）
  path: link_folder/神學/只聽見聲音卻沒有看見形像（te.mu.nah）.md
  definition: '申命記4:12 記下西乃山那天最關鍵的一個細節：「耶和華從火焰中對你們說話，你們只聽見聲音，卻沒有看見形像。」


    **「形像」這個字是本章禁令的支點。** STEP 原文資料顯示是 te.Mu.nat（H8544），簡要詞典義 te.mu.nah: likeness；CT〔原文字義〕給的是「形像」形狀，樣子。同一個字在第15、16、23、25節反覆出現，把「沒有看見」與「不可雕刻」串成一條因果線：


    - 第12節：你們只聽見聲音，卻沒有看見形像

    - 第15節：所以，你們要分外謹慎；因為⋯你們沒有看見什麼形像

    - 第16節：惟恐你們敗壞自己，雕刻偶像，彷彿什麼男像女像

    - 第23、25節：再兩次重複同一個警告


    CT 在第15節把這個推論說明白：「『所以』表示因果關係⋯本句明確指出神的百姓必須『分外謹慎』的原因──當時頒佈律法的神是沒有形像的，真神是看不見的，人卻能聽得見祂說話的聲音。」


    **為什麼不給形像。** GT《聖經精讀本》：「神不僅是靈（約4:24），而且居住在人所不能靠近的光中（提前6:16），故沒有人見過神的容顏」，甚至摩西「也並不是親眼目睹過神的面容，只是看到神榮耀彰顯之後的光芒和背影」。


    CT〔話中之光〕給了一個正面的說法：「神讓他們看見神的榮耀、權能、莊嚴，卻不叫他們看到任何的形像⋯榮耀就是神的形像，神的形像是人的手所不能作的，一切從人手中作出來的只是偶像，絕不能是神。神讓他們有這一次的經歷，是要在他們的心思上作出拒絕偶像的基礎。」


    **BH 從「聽」與「看」的對比讀出信心的性質。** 「The emphasis on hearing rather than seeing points
    to the importance of God''s word and the faith that comes from hearing (Romans
    10:17).」（重點放在聽而不在看，指向神話語的重要，以及那從聽而來的信心。）


    **KC 從反面問。** 「How would they portray God? For they have not seen His likeness,
    but only heard His voice. If they did, they would take something from creation.」（他們要怎麼刻畫神？他們沒有看見祂的樣式，只聽見祂的聲音。若真要刻，就只能從受造之物裡取材。）'
