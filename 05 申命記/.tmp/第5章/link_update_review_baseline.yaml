- title: 烈火
  path: link_folder/原文/烈火.md
  definition: CT 在出二十四17 給「烈」的原文字義是「吞噬，燒毀」，並解本節為「以色列人所看見的，是神的榮耀顯現在山頂上，形狀好像烈火，因為我們的神乃是烈火（參來十二29）」。BH
    指出火在聖經中常代表潔淨與神的同在，而「吞噬的火」這個意象「凸顯神臨在既令人敬畏又可畏的性質，它燒盡一切不潔與罪」。
  development: '烈火在聖經中象徵神的聖潔臨在與審判：出3:2荊棘火燒不盡、出13:21夜間火柱、出19:18西乃山冒煙如火、出24:17榮耀如烈火、利9:24火從耶和華面前出來燒盡燔祭、來12:29神是吞滅的火、啟1:14基督眼目如火焰。信徒經歷「火的試煉」（彼前1:7,
    4:12）是分有基督苦難、得榮耀的過程。


    出埃及記24章與申命記4章之間有一個值得注意的轉折。出二十四17 說的是外觀——以色列人所看見的榮耀「形狀好像烈火」；GT 丁良才在那裡注意到同一團火對不同的人效果不同：「神雖是烈火，卻不傷害摩西」。到了申命記4:24，摩西不再用比喻，而是直接把它說成神的身分：「因為耶和華─你的神乃是烈火，是忌邪的神。」


    從「看起來像火」到「就是烈火」，中間隔的正是申命記4章那一整段偶像禁令——CT 說烈火「形容神的聖潔的性情和公義的審判」，而這句話是接在不可雕刻偶像的警告之後說的。'
