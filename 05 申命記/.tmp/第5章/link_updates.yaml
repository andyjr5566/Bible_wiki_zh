- title: 十誡
  path: link_folder/神學/十誡.md
  summary: 第6-21節整段重述十誡；第22節說這些話是神親口向全會眾說的，此外並沒有添別的話。GT《聖經精讀本》：「十誡是所有律法的核心與本質,並不是單純的律法,乃是神的『約』」，並指出盛放十誡的法櫃被稱為約櫃、記錄十誡的書被稱為約書。
  relation: 本章是十誡在五經裡的第二次完整記載。與出20 的差異可以逐項辨認，落在第四誡（起首多了「照耶和華所吩咐的」、名單補上牛驢與僕婢安息的目的、理由由創造換成救贖）、第五誡（多了「照耶和華所吩咐的」與「使你得福」）與第十誡（次序對調、第二個動詞換字、加上田地）；KC 另指出這裡後五誡之間用「和」串連，出20 沒有。
  overview_review:
    signals: []
    accumulation_count:
