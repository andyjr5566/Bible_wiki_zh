  summary: 第8-9節；STEP：fe.sel（H6459，簡要詞典義 idol）。CT：『雕刻』指包括木刻、石雕、泥塑、各種金屬的鑄造，以及繪畫、刺繡、針織、各種手工等。CT 並在〔問題改正〕擋掉一種過度應用：神在建造會幕和聖殿時「還特別選拔巧匠」製作基路伯、獅子、牛、棕樹等物件，可見禁令「與敬拜那些形像有關」，不適用於非以敬拜為目的的製作與觀賞。KC 說神是靈，不能被任何東西代表；任何人手造出來的像都只會是祂的漫畫。
  relation: 本章的第二誡與第一誡貼得很緊：第7節先排除別的神，第8至9節再排除為敬拜而造的形像，第9節下半用忌邪的神說明理由。CT 的〔問題改正〕是本章少見的界線題——它防的是把禁令擴大到一切造像與觀賞。
