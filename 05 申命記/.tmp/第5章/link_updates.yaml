- title: 安息（第七日的歇息）
  path: link_folder/原文/安息（第七日的歇息）.md
  summary: 第14節「使你的僕婢可以和你一樣安息」；STEP：ya.Nu.ach（H5117，nu.ach，簡要詞典義 to rest），與「安息日」的 sha.bat（H7676）不是同一個字。GT《啟導本》：「在神面前人人平等，從祂規定僕婢也應休息看出。神對貧苦的人特別關懷」。CT 指出申命記重述十誡特別強調安息日的誡命，重點是教導以色列人善待他們的奴僕，甚至牲畜，因為他們比誰都明白受重壓的困苦。BH 也說這一節強調的是平等與公義，確保僕婢與主人得到同樣的休息。
  relation: 出23:12 的理由是人道，本章的理由是救贖史；兩者在結果上重疊——都讓最底層的人得休息。本章多出來的一層是動機：不是因為憐憫的通則，而是因為你自己作過奴僕。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 遵行
  path: link_folder/原文/遵行.md
  summary: '第1節「你們要聽，可以學習，謹守遵行」與第32節「你們要照耶和華─你們神所吩咐的謹守遵行」；STEP：u./she.mar.Tem（H8104J，簡要詞典義 to keep: careful）＋la./''a.so.Ta/m（H6213A，a.sah）。CT：『謹守』重在指思想觀念的贊同和一致；『遵行』重在指行為上的遵照和實施。第27節百姓自己說「我們就聽從遵行」，用的是 sha.ma 加 a.sah。'
  relation: 出24:7 的「遵行」配的是「聽從」（a.sah＋sha.ma），本章第1、32節配的是「謹守」（sha.mar＋a.sah）。同一個 a.sah 在兩處各接一個不同的動詞，前者強調聽了就做，後者強調小心地照著做。
  overview_review:
