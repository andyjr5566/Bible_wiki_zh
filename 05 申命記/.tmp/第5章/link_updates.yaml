  summary: '第2-3節；STEP：ka.Rat（H3772H，簡要詞典義 to cut: make(covenant)）＋be.Rit（H1285）。GT《啟導本聖經申命記註釋》：「這是西奈之約的重申，必須成為他們生活的守則、信仰的依憑」；GT《聖經精讀本》指此約的特徵是神親自與已具備國家規模的整個以色列民族立約，而聖約的內容與本質與從前沒有差別。'
