- title: 百姓懼怕神的顯現
  path: link_folder/事件/百姓懼怕神的顯現.md
  summary: 第5節「因為你們懼怕那火，沒有上山」；第23-27節火焰燒山時，支派的首領和長老就近摩西，說「現在這大火將要燒滅我們，我們何必冒死呢？」並求他代聽代傳。第28節神說「這百姓的話，我聽見了；他們所說的都是」，第29節接著說惟願他們常存這樣的心敬畏祂。GT《聖經精讀本》：「這裡特意記錄了神喜悅百姓的此番仲裁之邀的事實」，並指出摩西再次詳細記錄自己的中保作用，是為了給他所傳的律法賦予神性權威。
  relation: 出20:18-19 記到百姓請求為止；本章補上神那一邊的回應，而且是肯定的。KC 讀出的重點在懼怕本身——在滿是火的山前，人才發現自己需要一位中保。
