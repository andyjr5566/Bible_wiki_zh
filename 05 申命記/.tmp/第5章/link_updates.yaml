    definition: keep
    development: keep
- title: 十誡的條分法
  path: link_folder/神學/十誡的條分法.md
  summary: 本章兩家分法相左。CT 把第五誡劃進第一塊石版：父母「象徵神是我們生命的源頭，所以第五誡刻在第一塊石頭，與有關神的第一至第四誡同列」；KC 則從第16節起算第二塊法版，說這裡開始是六條關於待鄰舍的誡命。GT《啟導本》另給一種兩兩配對的讀法：「第一和第二誡確立對神敬拜的原則，建立人神的關愛；第三和第四誡為對拜偶像的禁止；第五和第七誡關乎家庭的保障；第六和第八誡乃對個人的保護；第九和第十誡為人與人間關係的守則」。
  relation: 本章第一次讓這個分歧在同一批來源裡正面碰上：第五誡歸哪一塊石版，CT 與 KC 在第16節的註解給了相反的答案；GT《啟導本》則在第7節起的十誡總論裡根本不按石版分，改用兩兩配對。
  overview_review:
    signals:
