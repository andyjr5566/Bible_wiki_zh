- title: 定言式法律
  path: link_folder/神學/定言式法律.md
  summary: 第7-21節十條誡命全用「不可……」或「當……」的絕對句式；本章的理由句只出現在第9至11節與第15、16節，其餘各條只有命令本身。GT《聖經精讀本》在本章的十誡總論裡記下：「第一,十誡的體裁是,即『當……』或『不可……』」，並說十誡是所有律法的核心與本質，並不是單純的律法，乃是神的約。
  relation: 出20、21 的累積是從法典比較的角度確立這個分類；本章提供了同一組條文在四十年後被複述的例子——「當」與「不可」的句式沒有改，字句上的異動則分布在第四、第五與第十誡。
  overview_review:
    signals:
