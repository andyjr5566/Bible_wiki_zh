  summary: '第9節；STEP：Po.ked（H6485I，簡要詞典義 to reckon: visit）、shi.le.Shim（H8029 第三代）、ri.be.''Im（H7256 第四代）。GT《申命記串珠聖經註釋》：「這裡不是指過犯的本身，而是指罪惡的後果」。CT 指出這話與結十八20「兒子必不擔當父親的罪孽」看似相抵觸，因此另有所指——「按照常理，兒女和子孫難免受到父母、祖父母的連累，譬如疾病的遺傳、家境的貧困、觀念的傳遞、行為的模仿等」。BH 也說這不是直接的刑罰轉嫁，而是活在有罪環境裡的自然後果。'
