    na.khe.Ri（H376G＋H5237，簡要詞典義 nokh.ri: foreign）。CT〔文意註解〕說本節說出立王的條件有二：必須是神所揀選的人、必須是以色列人。GT《聖經精讀本》說指出可擁戴為君者的兩大條件，第一必須是神所揀選的人，這暗示了以色列的真正之君是神、屬世君主只是神的代理人；第二必須是屬以色列十二支派的人，並說這並非源自國粹主義思想，乃是意味著從信仰的角度以色列的王應該是受過純正的耶和華教育並具備耶和華信仰的人。GT《啟導本聖經申命記註釋》說摩西預見到百姓進了迦南地以後會要求立王來管治他們，以取代士師治國的制度。KC
