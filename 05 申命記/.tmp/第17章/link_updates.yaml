- title: 審判官
  path: link_folder/原文/審判官.md
  summary: '第9節與第12節兩次提到審判官，STEP 都是 ha./sho.Fet（H8199，簡要詞典義 sha.phat: to judge）。CT〔文意註解〕說『審判官』最初是摩西所任命(參出十八25~26)，後來是祭司(參民五15)、士師(參撒上二25)，再後來是君王所任命審理案件的官長(參撒下十五3)。GT《申命記串珠聖經註釋》說在神治的體制裡，祭司與審判官同是神的代表；祭司的責任是教導律法，審判官則是律法的執行者。BH 說審判官負責按神的律法施行公義、解決爭訟，是維持社會秩序的關鍵。'
  relation: 本章接在申16:18 各城設立審判官與官長之後，補上這套制度的頂端：地方判不下來的案件要上到耶和華所選擇的地方，見祭司利未人與當時的審判官。與地方審判官不同的是，中央這一組是祭司與審判官並列，第12節的刑罰也同時涵蓋兩者。
  overview_review:
    signals: []
