book: 申命記
chapter: 17
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 沒有殘疾的祭牲
  path: link_folder/神學/沒有殘疾的祭牲.md
  summary: 第1節「凡有殘疾，或有什麼惡病的牛羊，你都不可獻給耶和華─你的神，因為這是耶和華─你神所憎惡的」。CT〔原文字義〕註「殘疾」瑕疵，缺陷，污點；「惡病(原文雙字)」壞的，惡的(首字)；言論，事件(次字)，文意註解說『殘疾』指有缺點、瑕疵，亦即不完全之意，『惡病』原文任何壞氣味的東西。GT《申命記雷氏研讀本》說「惡病」是缺點或障礙；GT《啟導本聖經申命記註釋》說這是一般獻祭的例，可與十五21同看，並指出埃及記所載同一條例中無「惡病」字樣，當為摩西講解時加以說明的結果；GT 收馬唐納《申命記》說獻有殘疾的動物是給神次好的，因為這類牲畜在市場上可以用低廉的價格買到。KC 說一切獻給神的祭都是基督之祭的預表；BH 說 detestable 指令神憎惡、厭棄的事物，並引瑪1:8。
  relation: 本章第1節是這條規矩在申命記裡的又一次出現，位置卻很特別：它單獨一節放在整章之首，後面接的是拜天象、司法上訴與立王三段。串起四段的判準詞是同一個——第1節的「所憎惡的」與第4節的「可憎惡的事」在 STEP 是同一個字（H8441）。與申15:21 相比，本節多了「惡病」一詞，也多了把不合格祭牲判為可憎之物的措辭。
  overview_review:
    signals: []
    accumulation_count:
    - 7
    - 8
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:15
      - 申命記:17
- title: 可憎的物（to.e.vah）
  path: link_folder/原文/可憎的物（to.e.vah）.md
  summary: '本章兩次用到這個字：第1節「這是耶和華─你神所憎惡的」與第4節「準有這可憎惡的事行在以色列中」，STEP 的鄰章查詢顯示兩處都是 H8441（簡要詞典義 to.e.vah: abomination），第1節為 to.''a.Vat、第4節為 ha./to.''e.Vah。CT〔文意註解〕說『可憎惡的事』即指拜偶像的事。GT《聖經精讀本》說第2節的「惡」與定冠詞一起使用會有那邪惡之意，即指拜偶像的罪。BH 說 abomination 指令神憎惡的行為，在申命記的脈絡裡多半指偶像崇拜，而在以色列中發生這種事不只是違法，更是屬靈上的背叛。'
  relation: 本章把這個字用在兩件性質不同的事上：第1節是獻上有殘疾的祭牲，第4節是拜日月天象。條目原本記的是申14:3 把它用在食物上，本章則顯示同一個判準詞在同一章裡跨越了祭物與敬拜對象兩個範圍，也因此成為本章四段的共同標籤。
  overview_review:
    signals: []
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 憑幾個見證人的口
  path: link_folder/主題/憑幾個見證人的口.md
  summary: 第6節「要憑兩三個人的口作見證將那當死的人治死；不可憑一個人的口作見證將他治死」，STEP 為 'al pi she.Na.yim 'e.Dim（H5921A＋H6310I＋H8147＋H5707）與 'al pi 'ed 'e.Chad（H5707＋H259），與民35:30 是同一組字。CT〔原文字義〕註「將那當死的人治死(原文雙同字)」治死，處死，文意註解說『兩三個人的口』為防患挾仇報復，以免產生冤屈，故不可單憑一個人的話定罪。GT《聖經精讀本》說最少有兩人以上的證人作證才能判其有罪，這是為了防止人寶貴的生命因誣告或偽證而蒙冤受死的事情。KC 說惟有憑兩個或三個見證人的證詞才能執行公義；BH 說這條原則在新約被耶穌與保羅引用（太18:16、林後13:1）。
  relation: 這是這條門檻第一次進入申命記。條目原本記的是民35:30 把它定在故殺人的案件上，本章則把同一組原文用語搬到宗教罪——有人去事奉敬拜別神。本章第7節另加一道民數記沒有的設計：見證人要先下手，然後眾民也下手。
  overview_review:
    signals:
    - first_in_book
