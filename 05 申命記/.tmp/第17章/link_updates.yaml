- title: 寄居的
  path: link_folder/原文/寄居的.md
  summary: '第15節「不可立你弟兄以外的人為王」，STEP 為 ''ish na.khe.Ri（H376G＋H5237，簡要詞典義 nokh.ri: foreign），正是申14:21「外人」與申15:3「外邦人」的同一個字。CT〔文意註解〕說立王的第二個條件是必須是以色列人（『你弟兄』），亦即不可立外邦人為王。BH 說禁止立外邦人為王是為了防止周邊列國的異教作法滲入，並以所羅門娶外邦女子的後果（王上11:1-8）為例。'
