- title: 神的揀選
  path: link_folder/神學/神的揀選.md
  summary: '第15節「你總要立耶和華─你神所揀選的人為王」，STEP 為 yiv.Char（H977，簡要詞典義 ba.char: to choose）。GT《聖經精讀本》說立王的第一個條件必須是神所揀選的人，這暗示了以色列的真正之君是神，屬世君主只是神的代理人。BH 說這強調揀選的主權在神，並以撒上9:15-17 立掃羅、撒上16:1-13 立大衛為例。'
  relation: 條目先前累積的創25、申4、申7、申10 講的都是對個人或整個民族的揀選。本章把同一個動詞用在一個職位上：王必須是耶和華揀選的人。這也讓揀選成為本章立王條例的第一個條件，與第二個條件（必從你弟兄中立一人）並列。
