- title: 不可加添也不可刪減（ya.saph、ga.ra）
  path: link_folder/原文/不可加添也不可刪減（ya.saph、ga.ra）.md
  summary: '第16節末句「因耶和華曾吩咐你們說：不可再回那條路去」，STEP 的「不可再」是 lo'' to.si.Fu/n（H3254G，簡要詞典義 ya.saph: to add: again），與申4:2、12:32 的「不可加添」是同一個字根。CT〔文意註解〕說神的意思是以色列人不可回頭和埃及人打交道。同一節前半的三道禁令另用 ra.vah（H7235A，簡要詞典義 to multiply），與這個字根不同。'
  relation: 條目先前累積的申4、申5、申12 用這個字根講的都是不可對神的話加添。本章的用法換了方向：句子講的不是律法的份量，而是一條不准再走的路。同一節裡另有一個表示「多」的動詞 ra.vah 管三道禁令，兩個字並列可以看出它們不是同一回事。
