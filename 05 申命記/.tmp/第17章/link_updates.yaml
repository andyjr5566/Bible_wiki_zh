- title: 把那惡從你們中間除掉（ba.ar）
  path: link_folder/神學/把那惡從你們中間除掉（ba.ar）.md
  summary: '本章兩次出現這句話：第7節「這樣，就把那惡從你們中間除掉」與第12節「這樣，便將那惡從以色列中除掉」，STEP 兩處都是 u./vi.''ar.Ta（H1197I，簡要詞典義 ba.ar: to burn: purge）加 ha./Ra''（H7451B），只是範圍詞一次是 mi./kir.Be./cha（H7130G，你中間）、一次是 mi./Yis.ra.''El（H3478，以色列）。CT〔原文字義〕註「除掉」消耗，燒盡，文意註解說『那惡』指罪惡，也指罪人。GT《申命記串珠聖經註釋》說「惡」這字或作「惡人」，表示將罪和罪人看為一體，必須滅絕（參林前5:13）。BH 說這句話在申命記反覆出現，強調以色列要與周圍列國分別。'
  relation: 條目原本記的是申13:5 把這句話用在引誘人事奉別神的罪上。本章用了兩次，而且落在兩種不同的罪：第7節是拜日月天象的人，第12節是不服中央判決的人。兩處的範圍詞不同（你中間／以色列中），是同一公式在本章內部的變化。
  overview_review:
    signals:
    - development_blank
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:13
      - 申命記:17
- title: 城門口公共場合
  path: link_folder/歷史/城門口公共場合.md
  summary: '第5節「拉到城門外」與第8節「你城中若起了爭訟的事」，STEP 的第8節為 bi/sh.''a.Rei./kha（H8179H，簡要詞典義 sha.ar: gate: town）。CT〔文意註解〕說『城門』古時是在城門口公開審問案件(參申二十一19)。GT《聖經精讀本》說當時城門是社交與交易的公共場所，也是公開的審判場所。BH 說在古代以色列，城門不只是出入口，也是審判與公眾集會的地方，把人帶到城門就表示啟動一項正式的法律程序，並接到得4:1-11 與箴31:23。'
  relation: 本章讓城門同時擔起兩個角色，位置卻分開：第8節的爭訟起於城門這個地方，第5節的行刑則移到城門之外。條目先前累積的申14至16章講的是城門作為公共生活與審判的所在，本章補上它同時也是刑罰執行的界線。
  overview_review:
