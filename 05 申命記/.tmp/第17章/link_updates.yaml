- title: 耶和華作王
  path: link_folder/神學/耶和華作王.md
  summary: 第14節「我要立王治理我，像四圍的國一樣」。GT《聖經精讀本》指出這個要求本身的問題：以色列因處於神的直接統治之下，沒有必要另立屬世君主，故王政制度並不是神所喜悅的制度（撒上8:7）。KC 說撒上8 那一次百姓要的是照自己心意的王而不是照神心意的王，他們是要一個王來取代耶和華。BH 說立王的要求反映神的理想神權與百姓想與周圍列國看齊之間的張力，並指這被讀為對神王權的拒絕（撒上8:7）。
  relation: 這是這個題目第一次進入申命記。條目原本記的是出15:18 的宣告——耶和華必作王，直到永永遠遠。本章記下與它並列的另一句話：百姓將來會要求立一個像四圍的國那樣的王。第15節的回應沒有取消王位，而是把王放進神的揀選之下。
