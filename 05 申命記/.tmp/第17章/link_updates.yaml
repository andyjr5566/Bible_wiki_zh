- title: 出埃及
  path: link_folder/歷史/出埃及.md
  summary: '第16節「也不可使百姓回埃及去，為要加添他的馬匹，因耶和華曾吩咐你們說：不可再回那條路去」，STEP 為 ya.Shiv（H7725G，簡要詞典義 shuv: to return）加 mitz.Ray.ma/h（H4714G）與 la./Shuv ba./De.rekh ha./Zeh od（H1870K＋H5750）。CT〔文意註解〕說『馬匹』連同馬車、馬兵是軍事力量的象徵，埃及盛產馬隻；神的意思是以色列人不可回頭和埃及人打交道。GT《啟導本聖經申命記註釋》說「百姓回埃及」有人認為指用以色列的奴隸去交換埃及的馬匹，也有人說是與埃及結盟來增加國威，並引賽三十1-7、三十一1-3 為佐證。BH 說埃及代表過去的奴役，回到那裡等於否認神的拯救。'
  relation: 條目先前累積的各章講的是走出埃及這件事本身及其記念。本章從反方向用到它：王不可為了加添馬匹而使百姓回埃及去。出埃及在這一節不是被記念的往事，而是一條不准回頭的路。
