- title: 侍立事奉（a.mad、sha.rat）
  path: link_folder/原文/侍立事奉（a.mad、sha.rat）.md
  summary: '第12節「若有人擅敢不聽從那侍立在耶和華─你神面前的祭司」，STEP 為 ha./''o.Med（H5975G，簡要詞典義 a.mad: to stand: stand）加 le./Sha.ret（H8334，簡要詞典義 sha.rat: to minister），與申10:8 是同一對字。CT〔原文字義〕註「侍」伺候；「立」站立，文意註解說『那侍立在耶和華你神面前的祭司』這句話暗示他們在判斷之前求問神，因此他們的斷案也就是神的斷案。KC 說祭司最知道神的心意，因為他們習慣於在神面前。'
  relation: 條目原本記的是申10:8 用這一對字描述利未支派的職分。本章把同一對字放進司法場景，並讓它承擔新的作用：它成了判決具有效力的理由——因為判斷的人是侍立在神面前的，所以不服判決的處分才會這麼重。
  overview_review:
