- title: 不可偏離左右
  path: link_folder/主題/不可偏離左右.md
  summary: '第11節「他們所指示你的判語，你不可偏離左右」，STEP 的「偏離」是 ta.Sur（H5493I，簡要詞典義 sur: to turn aside），與申5:32 是同一個動詞；同一字根在本章第17節再出現一次，用來說王的「心偏邪」（ya.Sur le.va.V/o）。CT〔原文字義〕註「偏離」轉變方向，出發，文意註解說『不可偏離左右』即指不可擅自更改。BH 說不可偏離左右在聖經裡是一個常見的說法，指持守在正路上，並接到書1:7。'
  relation: 條目原本記的是申5:32 對全體百姓說的那一次。本章讓同一句話換了對象：第11節管的是中央法庭的判語，第20節管的是王。同一字根在第17節還被用來形容王的心偏邪，因此這句話在本章內部就出現了三種適用。
