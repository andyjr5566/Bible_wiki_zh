- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 第9節「去見祭司利未人」與第18節「就要將祭司利未人面前的這律法書」，STEP 都是 ha./ko.ha.Nim ha/l.vi.Yim（H3548＋H3881）。CT〔文意註解〕說『祭司利未人』意指從利未支派出來的祭司，故祭司乃是利未人。GT《啟導本聖經申命記註釋》說祭司、利未人負有保存律法和教導律法的責任（利十11），並說從本節可知在聖所中保存有一部律法書。BH 說利未祭司是神與百姓之間的中保，負責教導律法並獻祭。
  relation: 本章給這個支派兩個先前沒有寫明的位置：參與最高法庭的判案（第9、12節），以及保管王抄錄律法書所依據的正本（第18節）。條目先前累積的民數記各章鋪開的是帳幕搬運與職務分工，本章加上的是司法與文本保存。
