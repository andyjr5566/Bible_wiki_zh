- title: 立他名的居所（中央聖所）
  path: link_folder/主題/立他名的居所（中央聖所）.md
  summary: '第8節「你就當起來，往耶和華─你神所選擇的地方」與第10節「他們在耶和華所選擇的地方指示你的判語」。STEP 的第8節為 ha./ma.Kom（H4725，簡要詞典義 ma.qom: place）加 yiv.Char（H977）。GT《申命記串珠聖經註釋》說「神所選擇的地方」即最高法院。BH 說這一節把難斷的案件集中到神所指定的地方審理，確保了判決的一致性、也維持了全國的合一。'
