- title: 石刑
  path: link_folder/背景/石刑.md
  summary: '第5節「你就要將行這惡事的男人或女人拉到城門外，用石頭將他打死」，第7節「見證人要先下手，然後眾民也下手將他治死」。STEP 的第7節為 yad ha./''e.Dim（H3027G＋H5707）加 va./ri.sho.Nah（H7223G，簡要詞典義 ri.shon: first）與 ve./Yad kol ha./''Am（H3605＋H5971A）加 ba./''a.cha.ro.Nah（H314，簡要詞典義 a.cha.ron: last）。CT〔文意註解〕說古時執行死刑是讓群眾投石砸死犯人，又說『見證人要先下手』是為著防止作偽證，一則表示良心無虧，二則表示願受作偽證的刑責。GT《啟導本聖經申命記註釋》記下當時的作法：受刑的人給拉到城外，綁在架子上，行刑時證人先動手，拿大石頭打在犯人頭上，然後各人拿石頭擲在垂死的人身上；GT《聖經精讀本》說規定證人先下手是為了使證人為自己的證詞負不可推卸的責任。'
  relation: 條目原本記的是石刑作為群體共同執行的死刑方式，本章補上執行的先後次序：見證人的手在先、眾民的手在後，STEP 顯示原文用了 ri.shon 與 a.cha.ron 這一組對照的序數詞。行刑地點也寫得更明確——拉到城門外。
  overview_review:
    signals: []
    accumulation_count:
    - 5
    - 6
    definition: update
    development:
      decision: update
      synthesis_scope:
      - 出埃及記:21
