- title: 擅敢行事與褻瀆耶和華的剪除處分
  path: link_folder/神學/擅敢行事與褻瀆耶和華的剪除處分.md
  summary: '第12節「若有人擅敢不聽從」與第13節「眾百姓都要聽見害怕，不再擅敢行事」，STEP 的第12節為 ya.''a.Seh ve./za.Don（H6213A＋H2087，簡要詞典義 za.don: arrogance）。CT〔原文字義〕註「擅敢(原文雙字)」做，製作，完成(首字)；傲慢，自大(次字)，並把「擅敢行事」解成行為傲慢、行事叛逆。GT《聖經精讀本》把這個詞解作驕傲或傲慢。BH 說擅敢行事指的是對已立之權柄的傲慢與抗拒，是對神所立次序的正面挑戰，並以民16 可拉的背叛為例。'
  relation: 這是這個題目第一次進入申命記。條目原本記的是民15:30-31 的 be./Yad ra.Mah（舉著手做的），本章用的是另一個原文說法 ve./za.Don，中文同樣譯作「擅敢」。抗拒的對象也換了：民數記針對耶和華的言語與命令，本章針對神所設立之祭司與審判官所下的判語。
