- title: 光體作記號定節令
  path: link_folder/背景/光體作記號定節令.md
  summary: 第3節「或拜日頭，或拜月亮，或拜天象」把受造的星體當成敬拜的對象。CT 的話中之光說將天上浩瀚、無邊無際、無法透測的萬象當作敬拜的對象，有靈性的人卻去膜拜無靈性的天象，並說神所造的諸天是為著地，而地是為著有靈的人(參亞十二1)。GT《啟導本聖經申命記註釋》說四19已警告不可膜拜神所造的作記號、定節令的星體，現在重申此禁制。BH 在本節指出這些天體是神的創造，不是神明，並接到創1:14-19。
  relation: 這是這個題目第一次進入申命記。條目原本記的是創1:14-19 給日月星辰的位置——神所造、用來分晝夜作記號定節令的工具。本章記下這個位置被翻轉的樣子，並且給了處分：查有實據就要拉到城門外用石頭打死。
