- title: 求問與訪問同一個字（da.rash）
  path: link_folder/原文/求問與訪問同一個字（da.rash）.md
  summary: '第9節「去見祭司利未人，並當時的審判官，求問他們，他們必將判語指示你」，STEP 的「求問」是 ve./da.rash.Ta（H1875，簡要詞典義 da.rash: to seek），正是申12:5「求問」與12:30「訪問」的同一個字。CT〔原文字義〕註「求問」求助，尋找。BH 說求問這個動作本身就承認了神所設立之人的權柄，是對神所立次序的謙卑順服。'
  relation: 條目原本記的是申12 的兩端：第5節命令往神所選擇的地方求問，第30節禁止訪問別神。本章給了同一個字第三種對象——神所設立的人（祭司利未人與審判官）。三處合看，這個字的正負從來不在動作本身，而在對象。
  overview_review:
