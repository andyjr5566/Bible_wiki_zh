- title: 可憎的物（to.e.vah）
  path: link_folder/原文/可憎的物（to.e.vah）.md
  definition: '申命記第十四章第3節只有一句：「凡可憎的物都不可吃。」它是第3至21節整段食物條例的標題句，後面所有的走獸、水族、飛鳥清單都掛在這一個詞下面。


    STEP 顯示這個字是 to.''e.Vah（H8441，簡要詞典義 to.e.vah: abomination，陰性單數），本節逐字解作 disgusting
    thing。


    **各家對這個詞的界定相當一致：它講的是禮儀，不是道德。** CT 的原文字義註「可憎的物」可憎惡的事物、(禮儀上)不潔的，文意註解說意指一切禮儀上不潔淨的活物。GT《申命記雷氏研讀本》一句帶過：即不潔淨的東西。GT《啟導本聖經申命記註釋》說得比較完整：「『可憎之物』指宗教上不潔淨的生物。這些動物不可以吃，也不可以拿來獻祭。」他並給出訂立條例的用意——不讓以色列人和神認為禮儀上不潔之物接觸，自覺地學習神的聖潔。BH
    也說這裡的 detestable 指按摩西律法算為不潔的動物，並指出這套區分不只關乎健康，更在教導以色列人分辨聖與不聖。


    **要注意這個字的方向。** 它說的不是那些動物本身有什麼問題，而是牠們與這一群人的關係——本章第7、8、10、19 節都是「與你們不潔淨」的句式。CT 也提醒，新約在這件事上有明確的轉向：主耶穌說凡從外面進入的不能污穢人（可七18），使徒行傳第十章又把潔淨的界線再打開一次。'
  development: '這個字在申命記裡的用法值得整段看。STEP 的鄰章查詢顯示同一個字（H8441）在申12:31、13:14、14:3、17:1、17:4
    各出現一次。


    除了本章這一次，其餘四次都指向偶像敬拜或違約：申12:31 說迦南人向他們的神行的是耶和華所憎嫌所恨惡的事，甚至把兒女用火焚燒；申13:14 用它形容一座城整體背叛去事奉別神；申17:1
    用它形容把有殘疾的牛羊獻上；申17:4 又用它形容個人去拜日月天象。


    換句話說，同一個字在這幾章裡既管敬拜的對象、也管獻上的祭物，還管餐桌上的食物。申命記十四章第3節把這個原本用來講偶像的詞放到吃的事上，正好接住了本章開頭的邏輯——身分若是神的兒女，分別就要一路延伸到最日常的地方。'
