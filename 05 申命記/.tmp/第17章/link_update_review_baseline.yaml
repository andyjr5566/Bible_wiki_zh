- title: 不可偏離左右
  path: link_folder/主題/不可偏離左右.md
  definition: '申命記第五章以一句路線的話收尾。第32節：「所以，你們要照耶和華─你們神所吩咐的謹守遵行，不可偏離左右。」第33節接著說，神所吩咐你們行的都要去行，好叫你們存活得福、日子長久。


    **原文用的是走路的字。** STEP 顯示「偏離」是 ta.Su.ru（H5493I，簡要詞典義 to turn aside），「左右」是 ya.Min（H3225G，右）與
    u./se.Mol（H8040G，左）。第33節「你們都要去行」是 te.Le.khu（H1980I，簡要詞典義 to go: walk）；而「所吩咐你們行的」在原文是「所吩咐的一切道路」——「吩咐」是
    tzi.Vah（H6680），「道路」是 ha./De.rekh（H1870G，簡要詞典義 way: conduct）。兩節合起來是一組完整的走路比喻：有一條路，照著走，不要往兩旁岔出去。


    CT 的原文字義給「偏離」轉變方向，出發，並解成完全正直地照所教導的道路去行，不可偏向自己的心意。GT《聖經精讀本──申命記註解》的講法一樣直接：不可偏離左右指要正直走在神所吩咐的律法之路，這意味著只有神的話語才是所有人的唯一正道。


    BH 把這個意象接到聖經其他地方，說它象徵留在公義與真理的道路上，令人想起箴言4:27 不可偏向左右的勸告，也與耶穌所講那條通往生命的窄門（太7:13-14）相通。BH
    並指出，這在歷史處境裡是要緊的——以色列四圍都是風俗與神明各異的外邦。KC 則把這句話讀成條件：摩西催促百姓遵守神的誡命，不可偏離，無論左右；他們在那地的居留與福祉都繫於這樣的順服。


    **它與本章開頭是同一句話的兩端。** 第1節要人聽、學習、謹守遵行，第32節再說一次謹守遵行，只是這次加上不可偏離左右。中間隔著十誡本文與百姓求中保的那一段；摩西講完全部之後，回到最初那個要求，並且把它說成一條有方向的路。'
