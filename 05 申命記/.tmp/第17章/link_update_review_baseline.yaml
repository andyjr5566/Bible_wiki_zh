- title: 不可加添也不可刪減（ya.saph、ga.ra）
  path: link_folder/原文/不可加添也不可刪減（ya.saph、ga.ra）.md
  definition: '申命記4:2 是聖經裡最有名的「經文完整性」條款：「所吩咐你們的話，你們不可加添，也不可刪減」。


    **兩個動詞在原文是一組。** STEP 原文資料顯示：


    | 和合本 | 原文 | Extended Strong | 形態 | 本節譯義 |

    |---|---|---|---|---|

    | 不可加添 | to.Si.fu | H3254H | Hiphil 未完成 2mp | you must add |

    | 不可刪減 | tig.re.''U | H1639 | Qal 未完成 2mp | you must diminish |


    簡要詞典義分別是 ya.saph: to add 與 ga.ra: to dimish。CT〔原文字義〕給的是「加添」增加；「刪減」撤回。


    **這一對詞在別處也配成一組。** 同樣的 ya.saph／ga.ra 配對出現在民數記36章瑪拿西族長的計算裡——那裡算的是產業一邊減少、一邊加增（見[[產業減少（ga.ra）]]）。同一組動詞，在民36
    用在地業上，在申4 用在神的話上。


    **各家一致把它讀成聖經觀。** CT〔話中之光〕：「神的啟示完美無缺，必須完全遵行，不可增刪（參申十二32；箴三十6；傳三14）」，並說「這些命令（律法）是神完備的話語，人類以有限的智慧與知識，怎能潤飾祂完全的律法？人在神的律法上有所加添，就是畫蛇添足；如果刪減，則使之缺欠」。GT《雷氏研讀本》指出「申命記十二章32節和啟示錄二十二章18、19節一再重申這個警告」。


    **KC 把加添與刪減各配了一種人。** 他說：「The Pharisees add their own commandments to the law,
    they are the rituals of their days. The Sadducees remove from the law what they
    cannot reason mentally. They are the rationalists of their days.」（法利賽人把自己的誡命加在律法上，他們是那個時代的儀文主義者。撒都該人把心智推不通的部分從律法裡拿掉，他們是那個時代的理性主義者。）'
  development: '同一個 ya.saph 在下一章換了主詞。申4:2 是對百姓的禁令——「所吩咐你們的話，你們不可加添，也不可刪減」；申5:22 是對神自己的敘述——神從火中、雲中、幽暗中大聲曉諭全會眾之後，「此外並沒有添別的話」（STEP：ve./Lo''
    ya.Saf，H3254H）。禁令要求人不加，敘述說明神也沒有再加。


    同一個字根在第三處又出現一次，受詞卻不同。申5:25 百姓說「若再聽見耶和華─我們神的聲音就必死亡」，STEP 顯示這個「再」是 yo.se.Fim（H3254G）。第22節說的是神沒有再添話，第25節說的是百姓不敢再聽下去；同一個「加」的字根，一處指話語的完整，一處指承受的極限。


