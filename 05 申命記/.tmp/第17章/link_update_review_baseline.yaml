- title: 憑幾個見證人的口
  path: link_folder/主題/憑幾個見證人的口.md
  definition: '民數記35:30 為死刑定下證據門檻：「無論誰故殺人，要憑幾個見證人的口把那故殺人的殺了，只是不可憑一個見證的口叫人死。」


    **原文的說法是：照見證人的口。** STEP 原文資料顯示「憑幾個見證人的口」是 le./Fi ''e.Dim（H6310I peh「口」加 H5707
    ''ed「見證」，複數），「一個見證」是 ''Ed ''e.Chad（H5707 加 H259），動詞 ya.''a.Neh（H6030B）簡要詞典義是 to
    answer。同一節裡「見證人」用複數、「見證」用單數加「一」，門檻就落在這個數目差上。


    **幾個是幾個？** CT 註：「『幾個見證人』指兩個以上的見證人（參申十七6；來十28）」。GT 丁良才同樣引申命記十七6「要憑兩三個人的口作見證」。BibleHub
    Study 補上申命記十九15，並指出這個原則在新約被重述（太18:16；林後13:1）。KingComments 也引保羅的話：「凡事都要憑兩三個人的口作見證」（林後13:1），並提到主耶穌自己說過，若只有他為自己作見證，他的見證就不真（約5:31）——意思是不能在法律上被接受。


    **這條規定的用意有兩層。** CT 說：「『不可憑一個見證的口』這是為防止作假見證。」GT《聖經精讀本》則說：需要兩三個證人「是為了表明律法的公正性和慎重性,也暗示對生命的敬畏」。


    **「見證人」不等於「目擊者」。** 這是本章在 GT 拾穗裡被討論最多的一點。如果原文的 ''ed 只能指案發當場親眼看見的人，那麼絕大多數謀殺犯都無法被定罪。GT
    賈斯樂郝威《聖經難解經文詮釋手冊》與艾基斯《舊約聖經難題彙編》都從原文用法回答：


    - 利未記5:1 說「他本是見證，卻不把所看見的，所知道的，說出來」——「所知道的」已經把非目擊的知情者包含進來。

    - 出埃及記22:13 用同一個字指被野獸撕碎的屍身：那具屍體就是「證據」。

    - 創世記31:46-49 雅各與拉班立約時堆的石堆被稱為「作見證的石柱」——石頭當然不會目擊。

    - 約書亞記24:25-27 約書亞立的那塊石頭同樣被稱作見證。


    艾基斯由此下結論：無論是否牽涉殺人的案件，實物或文件都可以作為呈堂證物，「這頗相似於我們今天審訊各類案件時也有的證物」。CT 的講法一致：「『見證人』原意是指在場目睹的證人，可延伸為事發現場的犯罪證據」。


    **這條規定也把處決和私刑分開。** GT《舊約聖經背景註釋》指出程序的次序：罪名沒有兩個見證人就不能成立（民三十五30），成立之後，處決罪犯才成為報血仇者的責任（民三十五19～21；申十九12）。換句話說，報血仇的在第19節看起來像是可以一遇見就動手，實際上要走完第30節這道門。'
