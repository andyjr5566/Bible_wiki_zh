- title: 耶和華作王
  path: link_folder/神學/耶和華作王.md
  definition: 「耶和華必作王，直到永永遠遠」是摩西之歌的結語（出15:18），宣告神在祂子民中間永遠掌權作王。這宣告是摩西之歌的神學高峰——從讚美神在紅海的勝利，到預言迦南征服與聖所建立，最終匯聚於神永遠作王的認信。
  development: '**這一節是不是後期作品。** GT《丁道爾聖經註釋》說「這是後來詩篇的一個特色（如詩十16），部分學者視之為本段屬後期作品的證據」，但它舉反證：五經起碼另有兩處提到耶和華在以色列中為王（民二十三21；申三十三5）；「實際上耶和華作王也可以說是立約的必然結果之一。以色列若非一開始就相信耶和華是以色列的王，我們就很難解釋一個世紀後，思想保守的以色列人，為什麼會極力反對將這尊號冠於凡人身上」（士八23
    的基甸；撒上八6 的撒母耳）。


    **它稱頌的不是神話性的王權。** GT《舊約聖經背景註釋》特別區辨：「本節不是將耶和華描繪為制服了宇宙，統管屬下眾神的神話性君王。反之，祂是在歷史現實中統治祂藉自己所操縱的自然力量，拯救出來的子民。這詩所稱頌的，不是祂打敗了其他神明或宇宙中混沌的勢力，而是祂的能力勝過在歷史中存在的人類。」BH
    則從時間性讀：不像有時限的人間君王，神的統治沒有終結。


    **KC 把它讀成對信徒的保證。** 神為祂百姓所定的全盤計畫，無論是地上的以色列還是天上的教會，都必由祂完全成就；沒有一件事在神的手之外，也沒有仇敵能攔阻——相反地，祂知道怎樣使用仇敵來成就祂的計畫。'
