    另指出日後眾先知常使用這信息，來督促過著俘虜生活的以色列百姓悔改，並使其抱有盼望，也曾抓住這句話來懇求神的恩典(尼1:8，9)。KC 說以斯拉與尼希米時代的歸回是一次預先的應驗，但那幾乎只涉及從巴比倫歸回，而不是從各種各樣的民族中歸回。BH
    說這裡的分散就是所謂的 Diaspora，並說歸回不只是拿回土地，也是重新建立身分與在耶路撒冷的敬拜。'
