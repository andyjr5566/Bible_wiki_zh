    curse）並列。「陳明」兩節同字，是 na.Ta.ti（H5414H，簡要詞典義 na.tan: to give: put，本節譯義 I set），與第1節「陳明」同字。CT
    說這意指將生死存亡的關鍵，以及蒙福或受禍的道路擺明出來，就看你的選擇是甚麼；他並說神不強迫人，而是把兩種選擇、兩種後果向人「陳明」，讓人用自由意志來做抉擇。GT《啟導本聖經申命記註釋》說15~20節是本書所揭示的律法、誡命中福與禍的綜合總結。GT《聖經精讀本──申命記註解》說摩西明確地宣告了兩者之間決不可能有躊躇，兩者之外再沒有其它路可走(王上18:21)。KC
    說摩西用「生與福，死與禍」把他整篇律法講章的內容總結起來(比較申十一26)，並說這個抉擇在百姓進地的開頭擺出來，到了百姓在地上的歷史末了，耶利米又在他們被擄之前把同樣的抉擇擺在他們面前(耶21:8)。BH
    說這裡的「生」不只是活著，也包括屬靈的安好；「福」不只是物質，也包括平安、穩妥與滿足。'
