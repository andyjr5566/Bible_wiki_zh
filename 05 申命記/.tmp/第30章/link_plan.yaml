    ya.''a.leh（H5927G，簡要詞典義 a.lah: to ascend），第13節是 ya.''a.vor（H5674A，簡要詞典義 a.var:
    to pass），第14節的「近」是 ka.Rov（H7138，簡要詞典義 qa.rov: near）加 me.''Od（H3966，簡要詞典義 me.od:
    much），落點是 be./Fi./kha（H6310G peh）與 u./vi/l.va.ve./Kha（H3824 le.vav）。CT 說第12節意指不是如登天之難，第13節意指也不是遙不可及的事，並指出使徒保羅以「下陰間」取代「過海」；第14節『在你口中，在你心裡』形容它近在咫尺、輕而易舉的。GT《啟導本聖經申命記註釋》說要他們遵行的事既非難行也非高不可即，而是近在咫尺，明顯易懂，就在人的心中、口中。GT《申命記串珠聖經註釋》說誡命並不在高不可攀的天上，也不在遙不可及的海外，而是在人的口中、人的心裡，可見神的話可以在百姓中間實行。KC
    說這幾節的用意是要指出神向人或向他百姓所要求的並不是重擔，不需要任何個人的努力；他並說摩西也講到渡到海的那一邊去，好像那誡命是放在地上某個遙遠的地方，例如許多人往東方去，想在東方宗教裡找到自己的救恩。BH
    說在古代近東，神明的旨意常被看作神祕、只能透過祭司或神諭得知，而以色列不需要中間人；它並說海在古時是難以跨越的屏障，象徵距離與困難。'
