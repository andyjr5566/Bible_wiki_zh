- name: 揀選生命（ba.char）
  suggested_type: 主題
  evidence: '第19節「所以你要揀選生命，使你和你的後裔都得存活」。STEP 顯示動詞是 u./va.char.Ta（H977，簡要詞典義 ba.char:
