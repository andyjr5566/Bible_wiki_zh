- title: 喜悅善待也喜悅毀滅（su.s）
  path: link_folder/原文/喜悅善待也喜悅毀滅（su.s）.md
  definition: '申命記第二十八章63節：「先前耶和華怎樣喜悅善待你們，使你們眾多，也要照樣喜悅毀滅你們，使你們滅亡；並且你們從所要進去得的地上必被拔除。」


    這是全章最刺眼的一句話。


    ### 兩個「喜悅」是同一個字


    STEP 顯示前後兩個喜悅是同一個動詞的兩種時態：sas（H7797，完成式，他曾喜悅）與 ya.Sis（同一個 H7797，未完成式，他要喜悅），簡要詞典義是
    su.s: to rejoice。句子的結構是刻意做成鏡像的——ka./''a.Sher（H834D，正如）……ken（H3651C，照樣）。後面的兩個動詞也是成對的：le./hei.Tiv（H3190，善待）配
    u./le./har.Bot（H7235A，使增多），對上 le./ha.''a.Vid（H6，使滅亡）配 u./le./hash.Mid（H8045，使毀滅）。末句「被拔除」是
    ve./ni.sach.Tem（H5255，簡要詞典義 na.sach: to pull，被動語態）。


    ### 各家怎麼處理這句話


    CT 的解釋停在字面：喜悅表示神極大的意願，善待指施恩賜福，毀滅指咒詛受禍；拔除意連根拔起，指全然除滅。


    GT《聖經精讀本──申命記註解》正面處理了讀者一定會有的疑問：喜悅毀滅這句話悖論性地表現了神的公義屬性，因為神是斷不喜悅惡人滅在其罪惡之中的神；何況是自己在萬民當中所揀選、高興地使其作自己兒女的以色列百姓，神必不會喜悅他們在罪孽之中自己沉淪。它給的理解是：這句話當理解為神懇切地希望，即使是用強有力的懲戒之鞭來鞭打終不肯悔改的百姓，他們能夠認識到自己的罪惡並悔改。


    KC 讀第58至68節時說，整卷書都是對那地的熱情頌讚，但神在第63節說，如果他們對他和他的話不忠，他要樂意把百姓從那地上撕下來。BH 指出這一節的前半與後半正好照出聖約的兩面：祝福隨順服而來，咒詛隨悖逆而來，兩邊都是同一位神在行動。


    ### 這句話與第47節相呼應


    第47節說以色列「不歡心樂意地事奉」神，第63節說神「喜悅」毀滅他們。兩處的中文都有喜樂的意思，原文卻是不同的字：第47節是 be./sim.Chah（H8057，簡要詞典義
    sim.chah: joy）與 u./ve./Tuv le.Vav（H2898＋H3824，心裡的美好），第63節是 H7797。經文沒有把兩者連成一句話，但一章之內，先說人不肯歡喜事奉，再說神要歡喜毀滅，讀起來份量很重。'
