- title: 悔改
  path: link_folder/神學/悔改.md
  definition: 希伯來文 *šûḇ* (שׁוּב)「轉回、回轉」，希臘文 *metanoia* (μετάνοια)「心意更新、觀念改變」。聖經悔改包含三要素：①認罪——承認得罪神（詩51:4）；②離棄——斷然脫離罪惡行徑（箴28:13）；③歸向——單單倚靠神、順服真理（徒3:19；26:20）。
  development: '- 悔改非單一事件、乃一生方向的轉回（路15:17-20浪子回頭）

    - 神主權賜悔改（提後2:25），人當順服（徒11:18「神也賜給外邦人悔改得生命的心」）

    - 真悔改結出果子（太3:8；路3:8），非空洞情緒（林後7:10「神然的憂愁、生出沒有後悔的悔改」）'
