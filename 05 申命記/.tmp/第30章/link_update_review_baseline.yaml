- title: 人若遵行律例典章就必因此活著
  path: link_folder/神學/人若遵行律例典章就必因此活著.md
  definition: 神應許人若遵行祂的律例典章，就必因此活著；「活著」指免受神的懲治而死，得以存活得平安愉快。本節在新約中被引用（羅十5；加三12），顯明律法的應許本乎行為，但無人能完全遵行，唯有靠信心接受新生命才能活出神的旨意。
  development: '**利未記給原則，申命記把它放進進地前的講章。** 利18:5 用一句話把遵行與生命連起來——人若遵行神的律例典章就必因此活著——而保羅在羅10:5
    與加3:12 引用的正是這一節。


    申6:24-25 講的是同一件事，用的卻是另一組詞。第24節說神吩咐遵行這一切律例，是「使我們常得好處，蒙他保全我們的生命」（STEP「保全我們的生命」為
    le./chai.yo.Te./nu，H2421，簡要詞典義 cha.yah: to live），第25節接著說「這就是我們的義了」。遵行、存活、被算為義三件事在這裡被串成一句。


    兩處合起來，這條原則的邊界也就清楚了。GT《雷氏研讀本》在申6:25 說得很節制：遵守律法並不保證有永生，但這樣的順服卻構成得到約之祝福的權利，尤其是獲得土地的權利。換句話說，利18:5
    那個「活著」在申命記的語境裡有很具體的所指——留在那地、日子長久、常得好處；而新約引用這一節時把它推到永生的層面，是另一步的延伸，不是申6 自己下的結論。'
