- title: 未受割禮的心若謙卑（認罪悔改的條件）
  path: link_folder/神學/未受割禮的心若謙卑（認罪悔改的條件）.md
  definition: '利未記26章40-41節寫出了轉機的條件：先是「他們要承認自己的罪和他們祖宗的罪」，然後是「那時，他們未受割禮的心若謙卑了，他們也服了罪孽的刑罰」。


    STEP 語言資料把這兩句話的原文說清楚。「未受割禮的心」是 לְבָבָם הֶעָרֵל（le.va.Vam / he.''a.Rel，H3824＋H6189），字面就是他們那未受割禮的心，其中
    עָרֵל 詞典義即 uncircumcised；「謙卑」是 כָּנַע（yi.ka.Na''，H3665，詞典義 be humble），詞形是 Niphal（HVNi3ms），也就是使自己降卑的自反語態。


    最值得留意的是「服了罪孽的刑罰」這句話。原文動詞是 רָצָה（H7521），STEP 詞典義是 to accept，本節 context gloss 作
    they will accept——直譯是他們要接受他們的罪孽。CT 的〔原文字義〕給的是同一個方向：「服了」喜愛，滿意而同一個動詞在本章還出現在 v34
    與 v43：地要享受眾安息用的正是 רָצָה（同一個動詞，H7521），並且 v43 一節之內兩次都用到它——地「接受」它的安息，人「接受」他們的罪孽。同一個動詞把土地的補償與人的認罪扣在一起。


    各家對「未受割禮的心」的解釋一致。GT 丁良才：「未受割禮的心就是乖謬剛愎，不肯承認自已罪孽的心」。CT：「指剛愎乖僻、抗拒聖靈的心」（參徒七51）。KC
    講得更完整：他說他們那未受割禮的心，也就是他們憑己意悖逆而行的作為，來到了自我審判的地步；割禮說到對肉體的審判，而這正是神所尋求的。BH 則指出這個說法在舊約裡有它的系譜：申命記十16
    與耶利米書四4 都是神呼籲人行心的割禮，指向內在的改變，而不只是外在的順從。


    GT《聖經精讀本》把回轉的過程拆成三步：先是認罪——「只有在神的恩典之下，才能明白自己犯罪的事實」；再是承認罪後尋求神的幫助和恩典；最後是悔改，「從罪中回轉到神面前」。而
    GT 丁良才舉出實際照此禱告的人：尼希米（尼一4-11）、利未人（尼九5-38）、但以理（但九1-19）。'
  development: '同一個比喻在兩卷書裡出現，一處是條件，一處是命令。


    利26:40-41 是條件句：他們要承認自己的罪和他們祖宗的罪，「那時，他們未受割禮的心若謙卑了」，神就要記念他的約。話是對將來說的，主詞是他們。


    申10:16 換成命令：「所以你們要將心裡的污穢除掉，不可再硬著頸項。」CT 給的直譯是「為未受割禮的心行割禮」。STEP 顯示動詞是 u./mal.Tem（H4135A，mul），受詞是
    ''a.re.Lat le.vav./Khem（H6190H 加 H3824），也就是你們心的包皮。==動作要人自己動手。==


    BH 在利26 已經指出這條線：申命記十16 與耶利米書四4 都呼籲人行心的割禮，指向內在的改變而非僅僅外在的順從。GT《申命記雷氏研讀本》在申10 說這裡用作比喻，指使自己從罪惡裏分別出來；GT《啟導本聖經申命記註釋》補上與外在記號的關係——以色列人須受割禮才是社會正式成員，也必須把違背神的意向從心裡剷除。


    兩處合起來，這件事有了兩面：利26 說神等的是什麼，申10 說人現在該做什麼。'
