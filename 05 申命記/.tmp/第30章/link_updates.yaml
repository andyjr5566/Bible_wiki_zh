- "title": "摩押平原之約"
  "path": "link_folder/神學/摩押平原之約.md"
  "summary": "本章是摩押平原之約講詞的結尾。GT《聖經精讀本──申命記註解》說第15至20節是自29:1以下開始宣佈的摩押平地之約的結束部分，也是摩西三次講章的最後結語。GT《申命記串珠聖經註釋》說本章實際上是和29章相連的，摩西在此超越了選民違約所招來的咒詛（被擄他鄉），進而論及他們悔改歸向神可帶來的復興(1~10)，接著指出盟約條款的清楚、可行(11~14)，呼籲百姓遵守神的吩咐，選擇生命(15~20)。CT 把本章列在「巴勒斯坦之約(二)」之下，並說1~10節就像盟約中的赦免條款。"
  "relation": "二十九章立約，本章給條款的結尾：先是違約之後的赦免與復興，再是要百姓當場作出的抉擇。"
