- "title": "不聽從神的五層漸進懲罰（利26：14-39）"
  "path": "link_folder/主題/不聽從神的五層漸進懲罰（利26：14-39）.md"
  "summary": "本章1至10節是二十八章咒詛之後的赦免與復興條款。CT 在第1節說1~10節就像盟約中的赦免條款；在使人絕望的咒詛(參申二十九16~28)之後，神卻馬上發表了復興的應許；因為神的咒詛並不是要敗壞人，他所做的一切都是要恢復人，甚至使用咒詛來催逼人回轉。GT《聖經精讀本──申命記註解》說即使以色列因對神不順服而遭到了28:15~68所記錄的咒詛，但只要他們悔改歸向神，憐憫之神必重新恢復他們。CT 另說神允許以色列人經歷蒙祝福、偏離、受咒詛、又被挽回的歷史(1~10節)，都是要「作為鑒戒，並且寫在經上，正是警戒我們這末世的人」(林前十11)。"
  "relation": "利26 的五層警告在申28 被放大，而利26:40-45 的轉機到申30:1-10 才被寫成完整的一段：條件仍然是回轉。"
