- "title": "因信稱義"
  "path": "link_folder/神學/因信稱義.md"
  "summary": "第12至14節被保羅引用在羅馬書十6至8。CT 在第12節說意指不是如登天之難(參羅十6)，第13節說使徒保羅以「下陰間」取代「過海」(參羅十7)，第14節說「在你口中，在你心裡」(參羅十8)。GT《申命記雷氏研讀本》要讀者參看保羅在羅馬書十章6至10節對本段的引用；GT《啟導本聖經申命記註釋》說保羅曾引用14節的話來解釋福音可以廣傳；GT《申命記串珠聖經註釋》說保羅在羅10:5~8採用這思想，把它應用在基督身上，指明基督成為肉身，福音真道不難覓得；GT《聖經精讀本──申命記註解》說新約時代的保羅將本文應用在因信稱義的教義上。KC 講得最長：他說保羅在羅十講的是那些追求律法之義卻沒有達到目標的人，一個人惟有看見自己的努力毫無用處，才會看見基督是律法的總結；他說在上升這個字裡有靠自己的力量抵達天上的想法，只要還這樣想，基督的工作就被看輕、他就等於又被拉了下來；又說人不必藉著某種贖罪的方式下到深淵去塗抹自己的罪。KC 並注意到經文的次序：先提口再提心，因為別人只能從我們的言語和行為感受到我們的信心。"
  "relation": "本章第12至14節是新約用來講本乎信之義的舊約出處；申命記自己講的是誡命可行，保羅把同一組話讀成不必靠自己上天下海的義。"
