- "title": "人若遵行律例典章就必因此活著"
  "path": "link_folder/神學/人若遵行律例典章就必因此活著.md"
  "summary": "第16節「使你可以存活」與第19節「使你和你的後裔都得存活」把遵行與存活接在一起。STEP 顯示第16節是 ve./cha.Yi.ta（H2421，簡要詞典義 cha.yah: to live），第19節是 tich.Yeh（同一個 H2421）。KC 引羅10:5 與利18:5 說律法的目的就是行這事的人必因此活著，並說神藉此表明人可以靠遵行律法賺得自己的義，但沒有一個人守全了律法；得義還有另一條路，就是藉著信，而那時就再也談不上自己的義。GT《聖經精讀本──申命記註解》則說律法決不是束縛人的桎梏，神的律法反而是生命之燈，它使人認識到神公義與慈悲的屬性，並且使人意識到自己與神處於立約關係之下的事實。"
  "relation": "利18:5 給原則，本章把它放進最後的抉擇裡；同一句話 KC 讀出的是人守不住，GT 讀出的是律法本是生命之燈。"
