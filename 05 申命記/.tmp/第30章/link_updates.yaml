- "title": "悔改"
  "path": "link_folder/神學/悔改.md"
  "summary": "第2節與第10節「盡心盡性歸向耶和華─你的神」。STEP 顯示兩處動詞都是 shuv（第2節 ve./shav.Ta、第10節 ta.Shuv，同為 H7725G），後面接 be./khol le.va.ve./Kha u./ve./Khol naf.She./kha（H3824 le.vav 與 H5315G ne.phesh）。CT 說歸向指從原來背離的情況轉向神，聽從指進一步以行動來表明心境的改變。GT《聖經精讀本──申命記註解》把真悔改分成三步：首先，是認識到自己的錯誤並痛悔；其次，斷然離開那罪孽之地，回到神的懷抱；最後，過在神懷抱中，單單聽從神話語的正確生活。GT 另用浪子的比喻說明父親只是迫切地等待他悔改認錯而重新回到家裡，並說神咒詛以色列不是為咒詛而咒詛，是督促悔改的慈愛之鞭。KC 說歸回會從他們被分散的時候開始，神要在他們心裡作工，使他們渴望回到他和他的地那裡去，並且他們會認清自己是因為罪才被遷離那地，帶著羞愧向神承認。"
  "relation": "這是本條目第一次進入申命記。本章把悔改寫成一個有前後次序的動作，並且與神那一邊的回轉用同一個原文動詞。"
