- "title": "專靠（da.veq）"
  "path": "link_folder/原文/專靠（da.veq）.md"
  "summary": "第20節「且愛耶和華─你的神，聽從他的話，專靠他」。STEP 顯示是 u./le./da.ve.kah（H1692，簡要詞典義 da.vaq: to cleave，本節譯義 by cleaving）。CT 的原文字義給「專靠」的是附著、黏住。GT《聖經精讀本──申命記註解》說「專靠」具有「緊密相聯」、「緊緊粘合」之意，指親近神(10:20)且緊緊抓住神的話語，這就是摩西講章的主題，也是得享祝福與生命的秘訣。KC 說緊緊抓住他給人持續下去的力量。BH 說緊緊抓住帶著盟約中不動搖的忠誠，像何西阿書裡以婚姻的忠貞來形容的那樣。"
  "relation": "前面幾章這個字用在分辨誰還活著、要親近誰；本章把它放在全書最後一句，成為三個收尾動作的第三個。"
