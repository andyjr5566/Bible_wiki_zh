- "title": "亞伯拉罕之約"
  "path": "link_folder/神學/亞伯拉罕之約.md"
  "summary": "第20節「這樣，你就可以在耶和華向你列祖亞伯拉罕、以撒、雅各起誓應許所賜的地上居住」。STEP 顯示動詞是 nish.Ba'（H7650，Niphal，簡要詞典義 sha.va: to swear），對象依序是 le./'av.ra.Ham（H85）、le./yitz.Chak（H3327）與 u./le./ya.'a.Ko（H3290）。CT 說「居住」指安然且有意義的存活。BH 說這一句把這一代以色列人接回列祖的應許，強調神的約橫跨世代仍然有效，而地的應許本身出自創12:7、26:3、28:13。"
  "relation": "摩西第三篇講章的最後一句話落在這個約上：能不能住得長久，回到的是列祖那個誓言。"
