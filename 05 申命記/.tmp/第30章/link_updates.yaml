- "title": "呼天喚地作見證（ud）"
  "path": "link_folder/主題/呼天喚地作見證（ud）.md"
  "summary": "第19節「我今日呼天喚地向你作見證」。STEP 顯示動詞是 ha.'i.Do.ti（H5749B，Hiphil，簡要詞典義 ud: to testify，本節譯義 I call as witnesses），見證人是 ha./sha.Ma.yim（H8064）與 ha./'a.Retz（H776G）。CT 說呼天喚地以天地作見證人，表明面臨非常重大的關頭，必須作正確的抉擇。GT《啟導本聖經申命記註釋》說古代訂約習慣用所信奉的神祇來作見證人，中國人也慣用「皇天后土」作盟誓的憑證，這裡指出神所造天地見證此約。GT 另說呼喚見證是當時世俗條約的慣例，立約雙方的神祇都會被召來作見證，神的百姓不可呼召其他神祇，所以摩西就「呼天喚地向你作見證」(19節；四26)，用天地來代表這見證的長久有效。GT《聖經精讀本──申命記註解》說摩西選擇天地作證人，是為了強調現今所立之約如同屹立不動的天地一樣不變、恒久。BH 說在古代近東，召喚見證是使盟約生效的正式作法，並指出賽1:2 也召天地來聽神控訴以色列。"
  "relation": "申4:26 用這個動作預告分散，本章第19節用同一個動作立下抉擇：見證人一樣，被見證的事換了。"
