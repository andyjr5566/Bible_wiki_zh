- "title": "新約"
  "path": "link_folder/神學/新約.md"
  "summary": "第6節的心受割禮被幾家註釋接到新約的應許上。GT《申命記串珠聖經註釋》說「替他們的心行割禮」使他們願意順服(參耶31:31~34)；GT《聖經精讀本──申命記註解》說本節宣佈了神要給悔改歸來的以色列百姓賜下新的心，將要在他們裡面放置新靈，是在新約之下叫他們作新百姓的恩典，此新約在基督裡面靠著基督得以最後的完成。GT《申命記雷氏研讀本》把第6節列為重聚時「在百姓心裏施恩的工作」，並要讀者參看耶三一31~34 的腳註。KC 說一旦百姓接受了他們的彌賽亞基督，神就要把他的律法放在他們心思裡、寫在他們心上(來8:10)，他要寬恕他們的不義，不再記念他們的罪(耶31:31-34)。"
  "relation": "這是本條目第一次進入摩西五經：耶31 的應許在這裡有一個舊約自己的說法——神替人的心行割禮。"
