- title: 城門口公共場合
  path: link_folder/歷史/城門口公共場合.md
  summary: '本章四次出現「你城裡」（第21、27、29節）與「你的城中」（第28節），STEP 都是 bi/sh.''a.Rei./kha（H8179H，簡要詞典義 sha.ar: gate: town），字面是你的城門。BH 在第28節補上背景：「The gates of a city were often the center of civic life, where legal matters were settled and community decisions were made」（城門常是城市公共生活的中心，法律事務在那裡了結，社群決議也在那裡作成）。KC 說第三年的十分之一不帶到耶路撒冷，而是留在家裡邀請有需要的人。'
  relation: 創世記那幾章記的是城門這個地點本身——羅得坐在城門口、亞伯拉罕在城門前議價、示劍父子在城門口說話。到了申命記的律法用語，同一個字已經成為整座城的代稱：第28至29節說十分之一「積存在你的城中」，供「你城裡」的利未人、寄居的與孤兒寡婦取用，講的是全城的範圍，不是城門那一小塊地方。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
