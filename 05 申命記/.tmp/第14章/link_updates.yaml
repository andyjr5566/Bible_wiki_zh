      - 申命記:14
- title: 十分之一
  path: link_folder/原文/十分之一.md
  summary: '第22節「十分取一分」，STEP 顯示是同一字根連用兩次：''a.Ser（H6237，HVpcc 不定詞絕對式）加 te.''a.Ser（H6237，HVpi2ms 未完成式）；第23節與第28節的「十分之一」則是名詞 ma''.Sar（H4643，簡要詞典義 ma.a.ser: tithe）。GT《啟導本聖經申命記註釋》說什一奉獻歷史甚久，創世記二十八22 和利未記二十七章都記有此事；BH 說這作法可追到亞伯拉罕給麥基洗德（創14:20）與雅各的許願（創28:22），是承認一切祝福都出於神。'
  relation: '這一章同時用上了這個字的動詞與名詞兩種形式，而第22節的動詞疊寫正是條目定義裡創28:22 所記的那種加強語氣結構。本章第22至29節分別處理兩種用途：第22至27節帶到神所選擇的地方吃，第28至29節每逢三年留在本城周濟。（本回合順帶勘誤定義兩處：舊版把 STEP 的詞典義用引號寫成一句逐字引句，實際 STEP 簡要詞典義是 a.sar: to tithe，中文取十分之一、獻上一成是轉述不是原話；又把創28:22 的引句末字寫成祢，和合本作你。）'
  overview_review:
    signals: []
    accumulation_count:
    - 5
    - 6
    definition: update
