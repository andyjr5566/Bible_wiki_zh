book: 申命記
chapter: 14
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 不可效法外邦喪儀習俗（剃髮劃身刺花紋）
  path: link_folder/主題/不可效法外邦喪儀習俗（剃髮劃身刺花紋）.md
  summary: '第1節下半把這組禁令搬進申命記：「不可為死人用刀劃身，也不可將額上剃光。」STEP 顯示「用刀劃身」是 tit.go.de.Du（H1413，ga.dad: to cut，本節逐字解 you will cut yourselves），「額上剃光」是 ta.Si.mu（H7760A，sum: to set: make）加 ka.re.Chah（H7144，qor.chah: bald spot），而中文的「額上」在原文是 bein 加 ''ei.nei./Khem，字面是在你們眼睛之間。CT〔原文字義〕註「用刀劃身」刺穿，割劃自己，並說『額上剃光』意指僅留下長在頭頂的頭髮，而剃光四周。GT《申命記雷氏研讀本》說「這些為死人哀悼的做法——迦南人為了承認死者為神而有的做法——是神的子民所嚴禁的」；GT《聖經精讀本》說「此律例嚴禁為死人而自傷其身」，並補上一個社會常識——「在習慣上希伯來人不剃額上之發,故光頭大都是被羞辱與蔑視的對象」。KC 說神兒子面對死亡的方式與外邦人截然不同；BH 說「Cutting oneself was often a ritualistic act to appease or communicate with the dead or deities.」（自割常是一種儀式性的作法，用來安撫死者或神明，或與他們溝通。）'
  relation: 利未記十九章把這組禁令放在一連串聖潔生活條例裡，本章給的理由換了一個層次：第1節上半先說「你們是耶和華─你們神的兒女」，第2節再說「你歸耶和華─你神為聖潔的民」，禁令是從身分推出來的。GT《聖經精讀本》另補一點利未記沒有的社會背景——希伯來人本來就不剃額上的頭髮，光頭在當時是羞辱的記號，所以這條禁令不只是宗教分別，也是文化常識的延續。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 屬我的子民
  path: link_folder/神學/屬我的子民.md
  summary: '第2節「耶和華從地上的萬民中揀選你特作自己的子民」，STEP 為 le./''Am 加 se.gu.Lah（H5459，簡要詞典義 se.gul.lah: possession）。CT 的話中之光把這個詞的分量講了出來：「特作自己的子民」原文是「作自己貴重的財產」，指借著分配擄物或遺產而得的財寶；CT〔文意註解〕另說它指特選出來、專一且完全屬於神、作神產業的子民。BH 譯作 prized possession，並把它接到出19:5 的祭司的國度與聖潔的國民，以及彼前2:9。'
  relation: 這是同一個詞在律法書中的第三次出場：出19:5 在西奈山下第一次宣告，申7:6 把它與揀選、聖潔綁在一起，本章則把它當成飲食與奉獻兩段條例的理由。第2節與第21節兩次重複「你是歸耶和華─你神為聖潔的民」，顯示這個身分在本章不是點綴，而是每一條規定的根據。
  overview_review:
    signals: []
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: '本章第7、8、10、19 節四次判為「與你們不潔淨」，STEP 都是 ta.Me（H2931，簡要詞典義 ta.me: unclean）。GT《申命記串珠聖經註釋》整理出學者對區分原則的三大類看法——衛生（有研究測出不潔之物的毒性較高）、宗教（不潔之物象徵迦南宗教或與其獻祭有關）、細菌（兔子、沙番、無翅無鱗之物、蝙蝠等是帶菌者）——同時聲明：「這些都不是聖經直接說明的。」GT《聖經精讀本》給的是屬靈層次的三個理由，其中一個是要以色列人在最基本的飲食生活上也與外邦人全然區別。CT 引可七18-20 與徒十9-16 說明新約的轉向。'
  relation: 本章是這組分類在律法書中的第二次完整鋪陳，第一次在利未記十一章。判準沒有變，說法變了：本章不解釋為什麼，只反覆說「與你們不潔淨」——不潔是相對於這一群人說的，而理由寫在第2節與第21節的同一句話裡。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 8
    - 9
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 利未記:11
      - 申命記:14
- title: 分蹄倒嚼（潔淨走獸的判準）
  path: link_folder/主題/分蹄倒嚼（潔淨走獸的判準）.md
  summary: '第6節「凡分蹄成為兩瓣又倒嚼的走獸，你們都可以吃」，第7至8節給出例外。STEP 顯示「分蹄」是 maf.Re.set（H6536，pa.ras: to divide）加 par.Sah（H6541，par.sah: hoof），「倒嚼」是 ma.''a.Lat（H5927M，a.lah: to ascend: regurgitate）加 ge.Rah（H1625，ge.rah: cud）。CT〔靈意註解〕說分蹄表徵行動有分別，倒嚼表徵反覆思想神的話；〔話中之光〕把結構讀成一個原則：「分蹄與倒嚼必須是一同具有的，只有其中一樣還是不潔的。」KC 說「Both characteristics must be present.」（兩樣特徵都必須具備。）並把只重教義不重實踐比作法利賽人的說而不行。'
  relation: 利未記十一章給了同一條判準，但只點名不可吃的走獸；本章第4至5節先列出可吃的十種——牛、綿羊、山羊三種家畜，加上鹿、羚羊、麅子、野山羊、麋鹿、黃羊、青羊七種野生動物——再回頭講判準與例外。CT 指出前三種正是獻祭常用的祭牲，後七種不在祭牲之列卻同樣潔淨。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 利未記:11
      - 申命記:14
- title: 豬與異教祭祀的關聯
  path: link_folder/文化/豬與異教祭祀的關聯.md
  summary: 第8節「豬─因為是分蹄卻不倒嚼，就與你們不潔淨。這些獸的肉，你們不可吃，死的也不可摸」。CT〔靈意註解〕說『分蹄卻不倒嚼』表徵只有敬虔的外貌，卻背了敬虔的實意的人。BH 指出古代近東普遍把豬視為不潔，牠們常以廢棄物與腐肉為食，這條禁令把以色列與周邊吃豬肉的民族區分開來；他並說摸不潔動物的屍體會使人染上禮儀上的不潔，需要行潔淨禮。
  relation: 利未記十一7 給的是判準與判定，本章多了一句「死的也不可摸」——禁止的範圍從吃擴到接觸。STEP 顯示這裡的「死的」是 u./ve./niv.la.Ta/m（H5038），與第21節「凡自死的」是同一個字。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 有翅有鱗（潔淨水族的判準）
  path: link_folder/主題/有翅有鱗（潔淨水族的判準）.md
  summary: 第9至10節「水中可吃的乃是這些：凡有翅有鱗的都可以吃；凡無翅無鱗的都不可吃，是與你們不潔淨」。CT〔原文字義〕註「翅」即鰭，〔話中之光〕說翅指在水中能行動，鱗是為著與水隔開；〔文意註解〕列出無翅無鱗的例子——鰻、鱔、蛤、牡蠣、蝦、蟹、鯨魚、海豚。KC 說「The scales are an armor, a separation between the animal and the environment in which it is in.」（鱗是一副鎧甲，是這動物與牠所處環境之間的隔離。）並舉一組對照：「Lot is someone who had scales. He did not take part in evil.」（羅得是有鱗的人，他沒有參與惡事。）但羅得沒有鰭、逃不出去，約瑟正好相反。BH 說這條排除了周邊文化常吃的貝類與其他海中生物。
  relation: 本章的水族段比利未記十一9-12 精簡：利未記十一12 另加「凡水裡無翅無鱗的，你們都當以為可憎」的強烈用詞，本章只說「是與你們不潔淨」，與同章走獸段用同一個判定詞。判準本身完全相同，一句話兩個條件。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 不潔淨雀鳥（二十種可憎飛禽）
  path: link_folder/主題/不潔淨雀鳥（二十種可憎飛禽）.md
  summary: 第11至20節以「凡潔淨的鳥，你們都可以吃」開頭與結尾，中間第12至18節列出不可吃的鳥。CT〔原文字義〕逐一給出字義——「雕」禿鷹、「狗頭雕」兀鷹、「魚鷹」海鷗、「戴鴴」戴勝等；〔話中之光〕從名單本身歸納出三個共同點：殘忍（喜歡吃肉和血）、孤獨痛苦（喜歡陰暗的地方）、吃不潔污穢的食物。GT《申命記雷氏研讀本》說「這些雀鳥在利未記十一章13節的腳註已經加以識別」。KC 說飛鳥講的是靈界的事，清單以潔淨的鳥開始也以潔淨的鳥結束。BH 逐鳥說明時指出蝙蝠是這份名單裡唯一的哺乳類。
  relation: 這是同一份名單在律法書中的第二次出現。與利未記十一13-19 一樣，這一段只給名單、不給判準——走獸有分蹄倒嚼、水族有有翅有鱗，飛鳥沒有。第19節另加一條利未記在別處處理的規定：凡有翅膀爬行的物都不潔淨。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
