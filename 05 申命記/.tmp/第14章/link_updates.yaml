- title: 耶和華是事奉者的業與分
  path: link_folder/神學/耶和華是事奉者的業與分.md
  summary: '第27節「住在你城裡的利未人，你不可丟棄他，因為他在你們中間無分無業」，第29節再說一次。STEP 顯示「分」是 Che.lek（H2506A，簡要詞典義 che.leq: portion），「業」是 na.cha.Lah（H5159，簡要詞典義 na.cha.lah: inheritance），「丟棄」是 ta.''az.Ve./nu（H5800H，a.zav: to leave: neglect）。CT〔原文字義〕註「分」是一份土地，「業」是財產、產業。BH 說利未人不像其他支派得著地業，改為分散在各支派中倚靠什一與供物維生（民18:20-24）。'
  relation: 民數記十八20 用的是同一對字，但說的是正面那一半——我就是你的分，是你的產業。本章只說出否定的那一半，而且不是說給利未人聽的：對象換成一般百姓，這句話成了他們不可丟棄利未人的理由。同一個事實在兩卷書裡承擔的功能完全不同。
  overview_review:
    signals:
    - first_in_book
    - development_blank
    accumulation_count:
