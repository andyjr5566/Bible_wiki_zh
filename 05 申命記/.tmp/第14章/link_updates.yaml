    - 2
    definition: keep
    development: keep
- title: 出23：19不可用山羊羔母奶煮山羊羔
  path: link_folder/解經爭議/出23：19不可用山羊羔母奶煮山羊羔.md
  summary: '第21節結尾第三次出現這條禁令。STEP 為 te.va.Shel（H1310，ba.shal: to boil）加 ge.Di（H1423，ge.di: kid）加 ba./cha.Lev（H2461，cha.lav: milk）加 ''i.M/o（H517，em: mother）。CT 給二意：以母奶煮其子有殘忍之嫌，此乃迦南人異教徒祭祀習俗。GT《申命記串珠聖經註釋》說「以山羊羔母的奶煮山羊羔是迦南常見的宗教儀式，與巴力的崇拜有密切的關係，所以不可隨從」；GT《聖經精讀本》說「用山羊羔的生命之泉母奶煮山羊羔是藐視生命之尊嚴的極其野蠻的行為」，並指有時是為了做出可口的料理，有時是為了行邪術的目的。KC 指出這條命令另外兩次出現用字完全相同，並說奶是給那小羊活命用的，不該拿來與牠的死連在一起。'
  relation: 出二十三19 與出三十四26 兩次都把這條放在節期條款的結尾，本章把它放在食物條例的結尾——同一句話，第三個位置。它緊接在「因為你是歸耶和華─你神為聖潔的民」之後，因此在申命記裡不是節期規矩，而是聖潔身分的最後一項延伸。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 2
    - 3
    definition: keep
    development:
      decision: update
      synthesis_scope:
