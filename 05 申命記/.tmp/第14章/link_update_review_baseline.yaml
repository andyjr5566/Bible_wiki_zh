- title: 隨心所欲（av.vah、ne.phesh）
  path: link_folder/原文/隨心所欲（av.vah、ne.phesh）.md
  definition: '申命記第十二章三次出現「隨心所欲」：第15節「隨心所欲宰牲吃肉」、第20節「就可以隨心所欲地吃肉」、第21節「可以隨心所欲在你城裡吃」。


    STEP 顯示這是兩個字組成的片語：''a.Vat（H185，簡要詞典義 av.vah: desire）加上 naf.she./Kha（ne.phesh，你的），第15、21節的
    ne.phesh 標為 H5315I（簡要詞典義 soul: myself），第20節兩處標為 H5315L（簡要詞典義 soul: appetite）。CT〔原文字義〕在這三節都給同一組註解：「隨心」魂，自我；「所欲」渴望，意願。


    **這句話在本章是一項許可，不是一句警告。** 前面的規定把獻祭集中到唯一一處，這三節則明說日常吃肉不受此限——第15節接著說無論潔淨人不潔淨人都可以吃，就如吃羚羊與鹿一般。GT《申命記雷氏研讀本》從生活面補了一句：家庭的宴會當然可以在家裏舉行，而大部分以色列人平日都不多吃肉。


    **值得注意的是同一種渴望在曠野是被追究的。** CT 在第20節指出，「你心裡想要吃肉，說：我要吃肉」這一句是和在曠野飄流之時作對比，並註明民數記十一章4節。BH
    講的是同一件事：在曠野以色列人取得肉類有限，民11:4-6 記他們懷念在埃及吃的肉；而本章對這種渴望的處理是加以規範而不是加以譴責，因為神明白人的需要。


    **CT 由此讀出一個更大的原則。** 他的話中之光說，神使祂的子民脫離偶像的法則，不叫他們活在宗教的規條裡；律法的實意並不是要建立宗教，但以色列人把律法變成宗教，就叫他們在宗教的重壓下找不著出路。KC
    在第20至28節說的是另一個角度——這段是對前面許可的重複，而重複的力量在於使先前所說的更加確定（腓3:1），也因為重複對學習本身很要緊。


    **這項自由仍有兩個上限。** 第16、23至25節四次禁止吃血，第23節並要人「心意堅定」不可吃血；第17、26節則規定十分之一、頭生的、還願祭與分別為聖的物都不可在自己城裡吃，仍要奉到神所選擇的地方。'
