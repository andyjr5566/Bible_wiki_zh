- title: 豬與異教祭祀的關聯
  path: link_folder/文化/豬與異教祭祀的關聯.md
  definition: 利未記 11:7 指出豬「蹄分兩瓣，卻不倒嚼」而不潔淨，是以色列人所最憎嫌的（GT 丁良才引賽 65:4，66:3、17）。舊約聖經背景註釋：亞述的智慧文學以豬為不聖潔、不宜廟中使用，是神明所憎惡的，又有解夢文獻說吃豬肉是凶兆，但豬肉明顯是美索不達米亞常吃的食物之一；某些赫人儀式必須獻豬為祭，但這些豬不是放在壇上作神明的食物，而是吸收不潔後焚燒或埋葬，獻給冥界神祇為祭，豬在美索不達米亞也是獻給鬼魔的祭物；埃及以豬為食，希羅多德宣稱當地也以豬為祭，色特神尤其以豬為聖；以豬為祭物的例證主要來自希臘和羅馬，獻祭對象大都是冥界神祇；市鎮中的豬經常和狗一同食腐為生，更加令人噁心。以賽亞書
    65:4 和 66:3、17 反映了以色列人對豬的態度，前者更提及與崇拜死人的關聯，故此以豬為祭很可能就等於是獻祭給鬼魔或死人。
  development: 啟導本：不潔淨動物一般帶有的特性之一是「與異教祭祀有關，如豬、狗等」；設立這些條例的目的有防止以色列人仿效埃及、迦南等異教祭祀方式，讓以色列人在飲食上像在道德與精神生活上一樣保持聖潔的說法。新約時代，保羅教導「入口的不能污穢人，因為不是入他的心，乃是入他的肚腹」（可
    7:15,18-19），食物的禮儀潔淨已經撤去（羅 14:14,20；可 7:18-19；林前 10:25；提前 4:3-4；徒 10:14-15，GT 丁良才引），但「分別為聖」的屬靈原則不變。
