- title: 分蹄倒嚼（潔淨走獸的判準）
  path: link_folder/主題/分蹄倒嚼（潔淨走獸的判準）.md
  definition: 利未記 11:3 訂定陸地走獸潔淨的雙重標準：「蹄分兩瓣」（蹄完全分開成兩半）且「倒嚼」（反芻）。兩者缺一不可（v4-8）：駱駝、沙番、兔子只倒嚼不分蹄；豬只分蹄不倒嚼，均屬不潔淨。CT
    話中之光：分蹄表徵行動有分別，倒嚼表徵反覆思想神的話（參路 2:19）；豬「分瓣，卻不倒嚼」，表明「一個人說愛聖經，但看他是否在日常生活中離開罪惡」。CT
    又引「神的話是活潑的，是有功效的。比一切兩刃的劍更快，甚至魂與靈，骨節與骨髓，都能刺入剖開，連心中的思念和主意都能辨明」，說明蹄分兩瓣提醒人須體會神話語的鋒利，才有默想尋求美善的目的。
  development: 聖經精讀本：具備分蹄、倒嚼兩條件的動物有牛、羊、山羊、鹿等（申 14:4-6），都是食草溫順、不加害其他動物的動物。GT 丁良才註：宰殺牲畜的條例詳記在利未記十七
    3-12、14 節。
