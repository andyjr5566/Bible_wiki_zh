- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  definition: '「潔淨」與「不潔淨」是貫穿利未記的一組基本分類，決定一個人或一樣東西能不能靠近神、能不能參與敬拜生活。這組字在原文是同一批字根的正反兩面：以利未記12章為例，STEP
    顯示「不潔淨」是動詞 טָמֵא（H2930A），「潔淨的日子」是名詞 טֹהַר（H2892A），「就潔淨了」是動詞 טָהֵר（H2891）。


    **要緊的是，這裡的「不潔淨」不等於「犯罪」。** GT《舊約聖經背景註釋》說「不潔不一定是能夠避免的，不潔的理由往往與犯罪毫無關係……這雖是禮節上而非倫理上的問題」；BH
    說這是「需要潔淨的禮儀狀態」而不是道德判決；CT 也寫「不潔淨並不是指有罪或污穢」。不潔會因接觸而傳遞給別人，罪卻不會——這是兩者最明顯的分別。


    KC 把利未記十一到十三章讀成一條線：十一章講的是人從外面沾來的污穢，十二章講的是人自己身上的不潔，十三章的大痲瘋則是同一件事發作出來。


    這組區分最早的痕跡出現在洪水的記載裡：創八 6-12 挪亞放出烏鴉與鴿子，**烏鴉代表不潔淨，鴿子代表潔淨**。'
  development: '### 潔淨與不潔淨的區分


    創八 6-12 顯示潔淨與不潔淨的區別：

    - **烏鴉**：不潔淨，飛來飛去不肯回方舟

    - **鴿子**：潔淨，尋找乾燥潔淨之處落腳


    這象徵**舊造與新造的區別**，以及**屬肉體與屬靈的狀態**。


    ### 聖靈與潔淨之境


    創八 12「鴿子不再回來」顯示：

    - 聖靈只在清潔無污的環境中安家

    - 靠著聖靈治死地上的肢體（羅八 13）

    - 叫基督安心裏（弗三 17）



    ### 烏鴉：不潔淨的象徵


    創八 6-7 烏鴉代表：

    - **不潔淨鳥類**（利十一 13、15）

    - **舊造敗壞性情**（弗四 22）

    - 飛來飛去不肯回方舟，象徵屬肉體的人只顧眼前


    ### 鴿子：潔淨的象徵


    創八 8-12 鴿子代表：

    - **潔淨鳥類**

    - **聖靈的表號**（太三 16）

    - 尋找乾燥潔淨之處落腳，象徵重生的人以基督為安息'
