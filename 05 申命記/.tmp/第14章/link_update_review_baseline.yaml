- title: 有翅有鱗（潔淨水族的判準）
  path: link_folder/主題/有翅有鱗（潔淨水族的判準）.md
  definition: 利未記 11:9-12 訂定水族潔淨標準：「凡在水裡……有翅有鱗的，都可以吃」，無論淡水鹹水皆適用。啟導本：無翅無鱗者例如鰻、鱔、蛤、牡蠣、蝦、蟹、鯨魚、海豚等，均列為「可憎」；用「有翅有鱗」區分，重點是容易辨認，確保以色列人身體健康、儀文上保持潔淨。CT
    靈意註解：翅指在水中能行動，鱗是為著與水隔開，表徵能在世界自由行動卻又不受世界侵害；「鱗」表示聖潔（參帖前 4:4），今天世上的罪水氾濫成災（參耶 6:7），基督徒若無聖潔的「魚鱗」防水必致危險。
  development: 啟導本補充：本節至 12 節所說潔淨的水生物，通常深水與淺水中都有，但不潔淨的大都生活於淺水中，賴腐敗的食物維生，易傳染疾病。雷氏研讀本：這規則把鰻魚、貝殼類海產、龍蝦、螃蟹、蠔等排除出可吃的海產之列（比較申
    14:9,10）。
