- title: 頭生歸神
  path: link_folder/神學/頭生歸神.md
  definition: 出二十二29-30：「你要將頭生的兒子歸給我」，牛羊頭生的也要這樣，「七天當跟著母，第八天要歸給我」。CT 說明長子歸神的根據在逾越節：每一家的長子原該與埃及地所有的長子一同被殺，「卻因神的羔羊的血得蒙保守，故須分別為聖歸給神，但毋須像牲畜一樣被殺獻上，可以改用贖金贖出來」。
  development: '頭生歸神這條線在兩卷書裡走了兩步。


    出埃及記二十二29-30 給的是命令與時程：「你要將頭生的兒子歸給我」，牛羊頭生的也一樣，而且「七天當跟著母，第八天要歸給我」。第八天這個時間點各家解釋不同——GT
    丁良才說是為母的好處，GT《聖經精讀本》說是讓幼畜吃七天的奶且「過了7天牲畜才有模有樣」，GT《舊約聖經背景註釋》則並列三種可能：對應男嬰第八日受割禮、人道對待牲口、或「試圖使獻祭與七日的創世循環相協調」。


    利未記二十七26-27 走的是相反方向：它不再交代怎麼獻，而是規定**不可以再獻**。理由只有一句——「因為這是耶和華的」。頭生的牲畜本來就已經歸神，人不能拿它來充當自己許的願。KC
    由此推出一個原則：「奉獻同時也是一種義務。我們不是自己的人，我們是『重價買來的』，因此有責任榮耀神。」


    同一章 v27 另外處理不潔淨牲畜所生的頭生，規定比出埃及記寬鬆——丁良才指出從前是用羊羔贖驢、不代贖就打折頸項，本章則「將這條例略加更改推廣，使這條例包括一切不潔淨之頭生的牲畜，神准物主用銀贖回，也准祭司賣與別人」。那一半的累積收在[[頭生歸神為聖]]。'
