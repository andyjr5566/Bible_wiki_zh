- title: 孤兒寡婦
  path: link_folder/主題/孤兒寡婦.md
  definition: '申10:18 接在一串至高稱號之後，說明這位不以貌取人的神實際上在做什麼：「他為孤兒寡婦伸冤，又憐愛寄居的，賜給他衣食。」


    STEP 顯示這節的原文結構是三個動作接三種人：עֹשֶׂה מִשְׁפַּט יָתוֹם וְאַלְמָנָה（''o.Seh mish.Pat ya.Tom
    ve./''al.ma.Nah，H6213A 加 H4941H 加 H3490 加 H490）——動詞是「做」，受詞是「公義的判斷」，對象是孤兒與寡婦；接著是
    וְאֹהֵב גֵּר（ve./''o.Hev Ger，H157G 加 H1616，愛寄居的）；最後是 לָתֶת לוֹ לֶחֶם וְשִׂמְלָה（La./tet
    l/o Le.chem ve./sim.Lah，H5414G 加 H3899G 加 H8071），le.chem 的簡要詞典義是 food，sim.lah
    是 mantle，也就是中文的「衣食」。CT 的〔原文字義〕註明「伸冤」在原文是雙字：首字是作、製作、完成，次字是審判、伸張公義——與 STEP 的結構對得上。


    **這三種人在古代社會的處境是同一類。** GT《聖經精讀本──申命記註解》說孤兒寡婦「是社會經濟上的弱者階層」，容易蒙不白之冤或遭到虐待；寄居的則是離開本族本鄉、混居在希伯來人中的人，既沒有屬於自己的地產，也沒有法律權利。GT《啟導本聖經申命記註釋》講得更概括：這是社會上貧弱的一群，容易遇到經濟上的困難、受到強者的欺凌。CT
    說得最短：孤兒寡婦與寄居的「代表一切弱勢的人們」，而伸冤、憐愛、賜衣食意指同情體恤、為他們尋求好處。


    **舊約其他地方也把神放在這個位置上。** CT 引詩68:5，說神在他的聖所作孤兒的父、作寡婦的伸冤者；GT《聖經精讀本》引的是同一處。BH 指出摩西律法一再強調照顧這些人（出22:22-24、詩68:5），並指出為他們伸張公義帶著主動介入的意思——神顧念他們，也替受欺壓的人採取行動，這條線一路延伸到先知書（賽1:17、耶22:3）。


    **這件事對以色列是有要求的。** 第19 節緊接著說：所以你們要憐愛寄居的，因為你們在埃及地也作過寄居的。GT《申命記串珠聖經註釋》由此下了一個總判斷：「摩西的律法自始至終都貫徹著憐憫弱者的教訓。」KC
    從性質上說明同一件事：神愛寄居的，這也適用在我們身上；凡自己經歷過患難、又在神那裡蒙了憐憫的人，對同樣在患難中的人應當有深切的同情。


    **新約把它當成信仰的檢驗。** BH 提到雅各書1:27 把純正的信仰描述成照顧孤兒寡婦。CT 的話中之光則把安慰的方向轉向弱者本身，勸他們把一切憂慮卸給神、坦然到神面前，並靜默倚靠、耐性等候。'
