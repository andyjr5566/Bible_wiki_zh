- title: 出23：19不可用山羊羔母奶煮山羊羔
  path: link_folder/解經爭議/出23：19不可用山羊羔母奶煮山羊羔.md
  definition: 出二十三19 下半的禁令沒有給理由，因此成為舊約最受討論的條文之一。GT 賈斯樂郝威列出解經者提過的八個理由：拜偶像的行為、法術以求土地豐饒、以滋養羔羊之物煮羔羊的殘忍、奶與羊肉不易消化、藐視親子關係、褻瀆收藏節、神要人用橄欖油而非奶油、過於奢侈享樂——並坦言：「事實上，我們並不知道為何神如此的吩咐以色列人。」
  development: GT《舊約聖經背景註釋》另提兩個可能：收藏節期間正是山羊出生的季節而牠們是祭筵的一部分；或者是因為「未斷奶的羊羔胃中可能仍有母乳」，而母乳可能含血、使祭肉沾染不潔。BH
    指出這條後來成為猶太飲食律法中肉奶分離的根據。KC 則從自然秩序讀：奶是用來餵養、使小羊存活的，不是用來與牠的死連在一起。
