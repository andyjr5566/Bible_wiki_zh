- title: 不潔淨雀鳥（二十種可憎飛禽）
  path: link_folder/主題/不潔淨雀鳥（二十種可憎飛禽）.md
  definition: 利未記 11:13-19 列舉二十種不可吃的雀鳥：鵰、狗頭鵰、紅頭鵰、鷂鷹、小鷹、烏鴉、鴕鳥、夜鷹、魚鷹、鷹、鴞鳥、鸕鷀、貓頭鷹、角鴟、鵜鶘、禿鵰、鸛、鷺鷥、戴鵀與蝙蝠，多為食肉猛禽或吃腐肉、昆蟲的鳥類（串珠聖經註釋）。CT
    靈意註解：這類鳥的特點——①殘忍，喜歡吃肉和血，聖徒不可殘忍逼迫掠奪他人；②孤獨痛苦，鴞鳥、貓頭鷹、鵜鶘等喜歡陰暗地方；③吃不潔污穢的食物，屍首在哪裡鷹也必聚在那裡。KC：飛鳥在聖經中常代表在空中活動的居民，「空中的飛鳥」通常帶負面意味（太
    13:4,32；啟 18:2），代表在屬天範疇活動卻不潔淨的邪靈勢力。
  development: GT 丁良才：申十四 12-18 節記二十一種（多一種「鸇」），原文用字寫法有別，或為抄寫之誤，或為總稱。啟導本：這裡所列的若干鳥類雖經譯為中文，但甚難確定其所指，例如
    16 節的「鴕鳥」若譯為「梟」或「角梟」應較準確，因鴕鳥不屬凶禽；不潔或與這些鳥類食帶血肉類有關。
