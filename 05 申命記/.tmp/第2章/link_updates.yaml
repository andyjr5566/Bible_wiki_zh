- title: 西珥山
  path: link_folder/地點/西珥山.md
  summary: '第1節「我們在西珥山繞行了許多日子」；第5節「因我已將西珥山賜給以掃為業」；第8節「離了我們弟兄以掃子孫所住的西珥」。GT《聖經精讀本》：「西珥山: 在這裡並非指某一特定的山,乃是指整個以東山地」；CT：「『西珥山』在死海的南邊，屬於以東地；『繞行』指繞過以東地」；GT《雷氏研讀本》：「“以掃”的後裔獲賜“西珥山”（整個以東地帶，死海以南的多山地帶；參看創三六6～8）為產業」。STEP 顯示第5節是 har se.''Ir（H2022G＋H8165G）。'
  relation: 本章的西珥山有兩個身分：第1節是繞了三十八年的地方，第5節是神明令不可碰的產業。第3節「你們繞行這山的日子夠了，要轉向北去」把這兩件事接起來。
