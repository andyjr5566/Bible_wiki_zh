- title: 海（紅海）
  path: link_folder/地點/海（紅海）.md
  summary: 第1節「此後，我們轉回，從紅海的路往曠野去，是照耶和華所吩咐我的」。CT：「『從紅海的路』指取道阿卡巴灣」；GT《啟導本》：「“紅海”當指阿卡巴灣」；BH 指出往紅海的路是離開應許之地、退回曠野的方向，是回到試驗與倚靠神的地方。
  relation: 本章開頭的紅海是退回去的方向——申1:40 神叫他們轉回紅海的路，第2章第1節就是照做。第8節以拉他與以旬迦別在紅海最北端，是這條路的終點，也是往北轉的起點。
