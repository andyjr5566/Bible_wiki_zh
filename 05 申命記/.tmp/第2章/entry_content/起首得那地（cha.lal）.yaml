  chapter: 2
  summary: |-
    第24節「起首得他的地為業」與第25節「從今日起」在原文同為 H2490C（cha.lal，簡要詞典義 to profane/begin: begin）：v24 是 ha.Chel（Hiphil 命令 2ms，與 Rash「去得」並排），v25 是 'a.Chel（Hiphil 未完成 1cs）。CT 在第31節指出「『從此起首』（原文無此詞）」。KC 指出神在第24與31節都說「起首去得」，並說神所賜的仍須由人去攻取。
  relation: 這個字是本章的轉軸：第1-23節三次禁令用的是 ga.rah 的否定式，第24節同一個 ga.rah 變成命令，前面再加上「起首」。第25節「從今日起」用同一個字，把整件事釘在同一天開始。
