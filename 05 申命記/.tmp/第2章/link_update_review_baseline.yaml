- title: 海（紅海）
  path: link_folder/地點/海（紅海）.md
  definition: 出埃及記中的「紅海」，GT《啟導本聖經腳註》指出原文可直譯為「蘆葦海」（賈斯樂郝威給的音譯是 Yam Suph）。它究竟是哪一片水域，各家沒有共識：《啟導本》說古代「紅海」包括印度洋、波斯灣等水域，「以色列人所過的海當非今天的紅海」，並推測可能就是曼薩拉湖（Lake
    Menzaleh）；賈斯樂郝威傾向蘇彝士灣以北，並提到可能是開鑿蘇彝士運河時消失的 Lake Ballah；《舊約聖經背景註釋》按巴力洗分的位置推算最近的湖泊是巴拉湖；出十三另有苦湖（Bitter
    Lakes）一說。無論確切位置為何，第14章的核心事件——神使海水分開、以色列人走乾地過海、埃及全軍覆沒——發生在此。
  development: ''
- title: 西珥山
  path: link_folder/地點/西珥山.md
  definition: 西珥山是死海南方至東南方的山區。創世記十四章稱它為「何利人的西珥山」，表明何利人早期居住於此；後來以掃住在西珥山，以掃的後裔以東人也以此地為中心，因此西珥山與[[以東]]密切相關，但山區名稱與國族、國土名稱仍各有側重。
  development: 西珥山的歷史呈現土地居民的更替：創世記十四章時是何利人的山地，至族長時期後段則成為以掃及其後裔的居所，並逐漸與以東的地域身分相連。
- title: 曠野飄流四十年
  path: link_folder/歷史/曠野飄流四十年.md
  definition: '第33-34節的判決：「你們的兒女必在曠野飄流四十年，擔當你們淫行的罪……按你們窺探那地的四十日，一年頂一日，你們要擔當罪孽四十年。」


    **四十年怎麼算？** CT：「四十年是指從出埃及開始算起，直到進入迦南地」，並說「一年頂一日」的算法「把以前已經在曠野裡所渡的年日也算進去了」。GT《啟導本聖經註釋》給出精確數字：「『四十年』是約數，實際上是三十八年零十個月。」GT
    丁良才也說神「後來卻發了憐憫的心，將以色列人已經在曠野的工夫都算在這四十年之內了」。


    **「一年頂一日」的意義。** GT《民數記串珠聖經註釋》：「強調神對罪惡的嚴厲，正如成語所謂：『一失足成千古恨』。」GT《聖經精讀本》從兩個目的來讀：「①讓百姓們明白自己的罪,也讓他們經歷罪所帶來的悲慘的結果;
    ②為了讓新一代（二十歲以下）的人年齡達到能對神的事負責的成熟年齡。」


    **懲罰的形式正是他們自己說過的話。** 第2節他們說「巴不得我們早死在埃及地，或是死在這曠野」，第28-29節神說「我必要照你們達到我耳中的話待你們。你們的屍首必倒在這曠野」。GT《民數記串珠聖經註釋》指出這句話在本段重複四次（v29、32-33、35）。CT
    在〔話中之光〕：「神用百姓最懼怕的方式懲罰他們，他們害怕死在曠野，神就懲罰他們在曠野飄流直至死去。」


    **KC 用一個詞形容這四十年的性質改變了。** ==「這百姓成了流浪的百姓。他們本是客旅，是往應許之地去的行路人。如今他們是流浪者，在曠野裡漫無目標地遊蕩。」==
    他並指出這四十年不是空白：「神要用那四十年教導他們，他們是誰、祂是誰。」


    **STEP 原文資料**顯示第34節「擔當」是 tis.''U（H5375J，詞典形 na.sa，詞典義 to lift: guilt）——與第18節神「赦免」罪孽的
    no.Se''（H5375I）是同一個動詞。==神舉起他們的罪孽（赦免），他們也要舉起自己的罪孽（擔當）。== 同節「疏遠」是 te.nu.''a.T/i（H8569，詞典義
    opposition），正對得上 CT 所註的「反對」。'
  development: ''
- title: 以掃
  path: link_folder/人物/以掃.md
  definition: 以撒與利百加的長子，孿生兄弟中的哥哥。名字意為「有毛的」（創25:25），因出生時身體發紅、渾身有毛而得名。又名「以東」（創25:30，意為「紅」）。
  development: '### 創26：他自己娶妻


    第34-35節是以掃在本卷中第一次以「自己作決定的人」出現。KC 的對照很直接：以掃像該隱——兩人的記載都是他們**自己**娶妻，而亞當與以撒的妻子都是從耶和華那裡領受的；以掃所選的，正出自耶和華說要除滅、趕出的那些民族（出二三23、28）。


    GT《聖經精讀本──創世記註解》把這件事與前一章接起來：他曾輕看長子的名分，如今對待婚姻也一樣輕率。GT《啟導本聖經創世記註釋》則把它讀成對約的無知——他「不看重也不明白神賜給亞伯拉罕和以撒的約」。第35節說這兩個媳婦「常使以撒和利百加心裡愁煩」，丁良才指出這兩節是第二十七章的小引：利百加下一章的行動，動機在此已先鋪好（詳見[[以掃娶外邦女子]]）。


    至於他到底娶了幾個妻子、名字何以在創二十六、二十八、三十六章互不相同，四來源給了不同的整理方式，見[[以掃有幾個妻子]]。


    以掃在聖經中代表「屬肉體」的生命（與雅各的「屬靈」對比）：

    - 出生在先、憑血氣行事、野性未馴

    - 喜歡在世界活動（田野）

    - 看重眼見之物（紅湯），輕視屬天福分（長子名分）

    - 被希伯來書作者稱為「貪戀世俗」的代表（來12:16-17）

    - 豫表人天然的生命'
- title: 以東
  path: link_folder/地點/以東.md
  definition: 以掃的別名（創25:30），也是以掃後裔所建立的國家名稱、及其居住之地。位於死海東南方，盛產紅色砂岩。名字意為「紅」。地理上包含西珥山區（創14:6;
    36:8-9），以掃住在西珥山（創36:8-9），即以東地（創32:3「西珥地，就是以東地」）。
  development: '### 一個名字，三種來源


    「以東」在創世記二十五章出現得很曲折。第25節以掃「身體發紅」——CT 註「紅」的原文與「以東」同音同字，而「毛」的原文與「西珥」（以東地的一座山名）同音同字。第30節他為了紅豆湯開口，「因此以掃又叫以東」。


    換句話說，這個名字同時扣住了他的外表與他的一次選擇。GT《聖經精讀本──創世記註解》把後者說得更直白：以掃的膚色本來就發紅，加上這次紅豆湯事件，「人們以譏笑的口吻叫他『以東』（紅）」。BH
    也指出這個名字後來成為他後裔的族名，而以東人定居在死海以南的地區。


    ### 兩國從出生就分開


    第23節的神諭把個人恩怨提升為國族史：「兩國在你腹內；兩族要從你身上出來。」CT 指雙胞胎在腹中相爭預示將來以色列人和以東人相爭（撒下八12-14；代下二十五11-24）。GT《聖經精讀本──創世記註解》說這預言在日後雅各子孫征服以掃子孫的歷史中如實成就（撒下八13-14；代下二十一8）。BH
    舉大衛制伏以東人（撒下八14）為例，並指以東的結局在俄巴底亞書中被宣告。


    GT 華爾頓《創世記背景註釋》在此加了一個要緊的界線：這個神諭「與其說是關於兒子本身，不如說神諭所討論的，是二人要建立之家系至終將會如何」，而「這種神諭不會對父母提供如何對待子女的細節」。以東與以色列的關係，是族系層面的事，不是兄弟性格的直接延伸。


    ### 分寸


    KC 提醒一個常被跨越的時間差：經文在這裡並沒有說神恨惡以掃——那句話寫在瑪拉基書一2-3，是一千四百年之後，「在以掃於他的後裔身上顯明了他真正的惡與悖逆的本性之後」才說的。KC
    並說：若以掃安於神在他出生之前所給他的位置，他本可以從中得著完全的祝福。'
- title: 神所定的邊界
  path: link_folder/神學/神所定的邊界.md
  definition: '民數記34:12 在四界畫完之後收在一句話上：「這四圍的邊界以內，要作你們的地。」界線本身，是本章的主題。


    **KingComments 整章都在講這件事。** 他在導言就說：領人走過曠野的那隻手，也是為祂所領的百姓定下那地邊界的手。接著他解釋界線的功能——界線把屬於神的與不屬於神的分開；我們有必要知道該征服什麼、不該征服什麼。他的結論是：超出神的界線，意味著失去祝福。


    **CT 讀到的是保護與使命兩面。** 他在第12節的〔話中之光〕說：「神給人一定的邊界，人不能越過那極限。大致說來，這界限給以色列天然的防衛界域，可以清楚認定，不跟鄰國混合。這不僅是國防的條件，更有保守分別為聖的戰略意義。」但他隨即補上另一面：神給他們安全的邊界並非要他們閉關自守，同時卻有積極的使命——早在宣召亞伯拉罕時，神就說「你也要叫別人得福」。


    **GT《聖經精讀本》從四圍的環境講。** 它指出在神所定下的邊界之外，居住著被偶像污染的強大外邦人；神之所以把這樣的危險和障礙放在以色列周圍，是為了教導以色列百姓順服神話語是最蒙福的生活。它並強調這不是說神的主權只在迦南地有效——神向所有人和全地行使自己的主權。


    **南界的天然屏障。** GT《聖經精讀本》另外注意到南界的地形：這條邊界線上有「曠野」「河流」「坡」和「海」等天然要塞，是以色列的神細緻的保守；神用超自然的能力看顧他們，同時也通過這些天然的屏障保護他們。


    **CT 在第13節把界線接到讀者身上。** 他說：「我們應該知道生活的限度與可能。我們必須注意境界，知道我們擴展的範圍，以致確定我們的行止，在基業上的止限。」'
  development: ''
- title: 亞拉巴
  path: link_folder/地點/亞拉巴.md
  definition: '亞拉巴是一條南北向的大裂谷，申命記第一章開場就把摩西講話的位置放在這裡。


    **範圍有多大。** CT 與 GT《啟導本》給的說法一致：「『亞拉巴』指約但河流域從北邊的加利利海到死海南端以迄阿卡巴灣的河谷地帶。今天死海南岸仍叫做亞拉巴（Wady
    el-Arabah）」。BH 的描述也相同：從死海延伸到阿卡巴灣的沙漠地帶。換算下來，這條裂谷縱貫了以色列人整趟行程的東側。


    **它同時是三個東西。** 第1節「疏弗對面的亞拉巴」是摩西講話的地點；第7節「就是亞拉巴、山地、高原、南地」則把它列為應許之地的一個地理分區；第5節說摩西講律法的地方在「約但河東的摩押地」，CT
    說明那就是「亞拉巴⋯的中南部」。同一個名字在同一章裡既指講話的現場，也指要去得的地。


    **死海也用這個名字。** CT 與 GT 都指出，聖經裡死海又名「亞拉巴海」（申四49；書三16；十二3；王下十四25）。所以讀到「亞拉巴」時要看上下文是指整條裂谷還是那片海。


    **原文。** STEP 原文資料顯示第1節與第7節都是 ba./''a.ra.Vah（H6160G），簡要詞典義 Arabah。CT 給的原文字義是「沙漠曠野，乾草原」。'
  development: ''
- title: 以旬迦別
  path: link_folder/地點/以旬迦別.md
  definition: '以旬迦別是民數記33:35-36 的第三十二站，以色列人從阿博拿起行後在此安營，再從這裡到尋的曠野加低斯。


    **它後來成了以色列的海港。** GT 丁良才《民數記註釋》一句話交代：「『以旬迦別』——就是所羅門製造船隻的海口（王上九26，代下八17）。」


    GT《舊約聖經背景註釋》給了位置與兩個候選地：「以旬迦別（王上九26），位於亞喀巴灣頭的海港，若非克萊費遺址（Tell el-Kheleifeh）就是在法爾昂島上（Jezirat
    Far''on，這是本區惟一具有大規模海港遺跡的地點）」。


    BH 補了它的產業：考古證據顯示它是貿易與工業的重要中心，尤其是銅的冶煉；並說它靠近以東地，正是以色列後來要求假道通過的那一帶。


    **名字的意思。** CT 給的字義是「人的骨幹」。STEP 顯示第35節的原文是兩個字 ''etz.Yon Ga.ver（H6100，詞典形 ets.yon
    ge.ver）。


    **它在行程上的位置很關鍵。** GT《舊約聖經背景註釋》把整段行程分成四個階段，其中第二階段就是「從西乃曠野到以旬迦別（16～35節）」，第三階段是「從以旬迦別到尋的曠野之加低斯（36節）」——以旬迦別正好是兩個階段的接點。'
  development: ''
- title: 摩押地
  path: link_folder/地點/摩押地.md
  definition: 摩押地是創世記36章以東王哈達擊敗米甸人的戰場背景之一。此處不展開摩押全史，只記其在本章以東王事蹟中的地理功能。
  development: 摩押地在本章呈現為以東王軍事活動的地理舞台。
- title: 摩押人
  path: link_folder/人物/摩押人.md
  definition: 摩押人（Moabites），[[摩押]]的後裔，羅得與大女兒亂倫所生的民族。居住在死海東岸的高原。與以色列人有親族關係（同為亞伯拉罕/羅得後裔），但歷史上常為敵。
  development: '### 疆界


    GT 李道生《舊約聖經問題總解》給的四至最完整：摩押人原住在死海東邊的摩押平原，東至亞拉伯曠野，南達以東地，西界死海，北界亞嫩河之北面至尼波山之境。GT《創世記雷氏研讀本》說法一致（死海以東，比較民二一13）。這條北界日後成為爭端的起點：以色列人擊殺阻撓他們的亞摩利王西宏，把亞嫩河北邊原屬摩押的土地分給流便和迦得二支派（民二一21-31），李道生指摩押人「心裡不服」——士師時代摩押王伊磯倫轄制以色列，正接在這件事之後。


    ### 與以色列的往來史


    李道生把整條線索排了出來，可以看出敵對並非始終如一：


    - 以色列回到迦南時，摩押王請巴蘭咒詛他們，繼而設謀誘惑以色列犯罪（民二二–二五2；彌六5）。GT《啟導本聖經創世記註釋》把後半段說得更具體——摩押人曾引誘以色列人犯嚴重的淫亂罪（民二五1-5）。要分清楚：咒詛出於巴蘭之口，而民二五1-3
    的引誘是藉摩押女子行的。

    - 因此有申二三3 的定例：摩押人的子孫雖過十代，也永不可入耶和華的會。

    - 士師時代：伊磯倫轄制以色列，後為以笏所殺（士三）。

    - 拿俄米的媳婦路得是摩押女子（得一1-4）。

    - 掃羅曾打敗摩押（撒上十四47）；大衛避掃羅時曾求摩押王收留他父親（撒上二二3-4），日後卻又攻打摩押使之進貢（撒下八2；詩六十8）。

    - 所羅門的嬪妃有摩押女子，並為她們的神基抹建築邱壇（王上十一1-7）。

    - 所羅門死後摩押復興，至暗利在位時再度失敗；亞哈死後摩押又背叛（王下三5），後為以色列王、猶大王和以東王所敗，但不久又自立。

    - 眾先知都曾預言摩押必受刑罰（摩二1-3；賽十五–十六、二五10；番二8-11；耶四八；結二五8-11）。主前七百餘年摩押進貢亞述；猶大人從巴比倫回歸時，阿拉伯的拿巴底安族已佔據摩押地，其權勢日漸衰微。


    ### 起源敘事的兩種讀法


    GT《舊約背景註釋》反對把創19:30-38 讀成政治敵意下的抹黑：摩押語和亞捫語都很接近希伯來語，考古調查也顯示主前十四至十二世紀之間有人在該地區再度定居；這個出身敘事「不太可能僅僅是有政治或種族歧視動機的誹謗話」。


    GT《聖經精讀本──創世記註解》從另一端說同一件事：本段不是為了體現以色列對摩押人的憎惡而編寫，因為以色列最偉大的君王大衛正是摩押女子路得的後代（太一5-6）。丁良才也記下這一點，並把它讀成基督降世虛己的一部分——主耶穌的家譜中同時有摩押人和亞捫人（得四10，參太一5；代下十二13，參太一7）。'
- title: 羅得
  path: link_folder/人物/羅得.md
  definition: 哈蘭的兒子，亞伯蘭的侄兒。跟隨亞伯蘭出吾珥和哈蘭，後來選擇約旦河平原，住在所多瑪。
  development: '### 屬靈意義


    - 羅得豫表**屬肉體的信徒**：看見應許之地，卻選擇世界的平原

    - 他在所多瑪的遭遇（創十九）是對屬世信徒的警告

    - 雖然最終被拯救，卻是一無所有地出來

    - 他的選擇最終導致被擄、家產被毀、喪失妻子和女婿、與女兒亂倫


    ### 「義人」與敘事之間的張力


    彼後二7-8 稱羅得為義人，本章卻幾乎看不出來——KC 把這個落差當作理解他的起點：「亞伯拉罕與羅得之間的差別，大概是兩個信徒之間所能想像的最大差別。」他並注意到一項敘事事實：耶和華沒有親自向羅得顯現。在前一章，祂能在筵席中與亞伯拉罕分享自己的心意；到了所多瑪，來的只有兩位天使，而且是晚上。


    丁良才對第16節的注解把兩邊都保住了：羅得得救是因為耶和華憐恤他，同時也是因為他有信心，「並不是因為他有功德」（羅九15-16）。GT《聖經精讀本──創世記註解》把原因數成三項：根本原因是神的慈愛（16節），但也包括羅得最小限度的信心（1-8節）與亞伯拉罕懇切的禱告（18:23-32）——它並指出羅得的根本錯誤不在那一夜的舉動，而在「沒有堅決離開罪惡滿盈的城市，及至那時還生活在那裡」。


    ### 位置的三級推進


    KC 把幾章之間的變化排成一條線：先住在所多瑪**附近**，後住在所多瑪**裡面**，本章已經坐在所多瑪的**城門口**（即進入市議會）。第9節暴民的回話從反面確認了這條線的極限——「這個人來寄居，還想要作官哪！」他再怎麼融入，在他們眼中始終是外人。KC
    把這句話讀成靈性黑暗中的一線微光，雖然那光很微弱。


    各家對他坐在城門口的推論強度不一：CT 與《啟導本》說是有身分地位的人，《創世記雷氏研讀本》推得最遠說他是該城的審判官，GT《舊約背景註釋》則收在社會接納上。經文只寫他坐在那裡（見[[城門口公共場合]]）。


    ### 結束的方式


    CT 指出他離開瑣珥上山，其實是走完了第17節原先吩咐他的那條路——只是這一次的動機是「怕」（30節）。KC 與精讀本都注意到敘事的收尾：聖經沒有記載羅得何時何地死亡，他就這樣從歷史中消失；新約提到他（路17:28-29、32；彼後二7-8）也只是一帶而過。詳見[[羅得的世俗選擇與後果]]。'
- title: 以米人
  path: link_folder/人物/以米人.md
  definition: 以米人（Emim），古代摩押地的原住民，身材高大如亞衲人，屬利乏音人的一支。「以米」意為「可怕者」或「可畏的」。
  development: ''
- title: 利乏音人
  path: link_folder/人物/利乏音人.md
  definition: 利乏音人（Rephaim），古代迦南地的巨人族。名字意為「落下者」或「衰弱者」，但與其身材高大的記載構成反諷。申命記二10-11稱他們為「以米人」，身高如亞衲人，為利乏音人的一支。
  development: ''
- title: 亞衲族與偉人拿非林
  path: link_folder/背景/亞衲族與偉人拿非林.md
  definition: '第22、28、33節三次提到亞衲族，最後一次把他們接到「拿非林」。


    **名字與身量。** CT 給的原文字義是「亞衲」頸；GT《民數記串珠聖經註釋》：「『亞衲』：意為『頸項』，可能與他們身材高大有關。」KC 從同一個字義讀出性格：「『亞衲』意思是『長脖子』，指的是驕傲、高傲。」他並逐一解釋亞衲三子的名字。


    **經文以外沒有史料。** GT《舊約聖經背景註釋》講得很直接：「所列的都是胡利人（即聖經中的何利人）的名字。亞衲的子孫通常被視為『巨人』（和合本：『偉人』），但『巨大』可能是更合適的形容。聖經以外的史料完全沒有提到過亞衲族人。」但同一份來源給了兩項旁證：「阿納斯塔西第一蒲草紙（主前十三世紀）中的一封埃及函件，卻形容迦南有些勇猛戰士，直立有七至九呎之高。兩副來自主前十二世紀，體高七呎左右的女性骸骨，亦在外約但的薩伊德葉遺址出土。」


    **「拿非林」是什麼，古今都沒有定論。** GT《舊約聖經背景註釋》：「聖經惟一肯定提到『內非林』之處，是創世記六4。但該節經文並沒有提供什麼有關他們身分的資料……時代最早的釋經者（兩約之間時期）對這字之理解，可分為視其為巨人、英雄、墮落天使三派。」CT
    的說法是：「『偉人』原文是拿非林，一種身材魁偉的巨人，被懷疑是變種人類（參創六4）。」STEP 原文資料顯示第33節這個字是 ha./ne.fi.Lim（H5303，詞典義
    Nephilim），第22節的「亞衲」是 ''a.Nak（H6061）。


    **他們後來被趕出去了。** GT《啟導本聖經註釋》與《聖經精讀本》都指出：亞衲人雖高大，後來為迦勒擊敗逐走（書十五14）。GT 丁良才算了時間：「約過了五十年，迦勒就趕出這亞柄族的三個族長。」'
  development: ''
- title: 何利人
  path: link_folder/人物/何利人.md
  definition: 何利人（Horites），古代[[西珥山]]的原住民。「何利」意為「洞穴居民」，他們住在以東地的山洞中。後被以掃的後裔以東人取代（申二12、22）。
  development: ''
- title: 加低斯
  path: link_folder/地點/加低斯.md
  definition: 加低斯（Kadesh），全名加低斯巴尼亞，即創世記十四章的[[安密巴]]（意為「審判的泉」）。位於南地，是以色列人出埃及後最重要的曠野駐紮地，也是探子出發窺探迦南的地方。
  development: '### 背景註釋給的定位


    GT《舊約背景註釋》〈創二十1 加低斯和書珥〉把加低斯定為**西乃半島東北部的一個綠洲，在別是巴以南46哩**。創20:1 描述亞伯拉罕往南來到加低斯和書珥之間的直線上——這條線標出了他這次南遷所抵達的範圍：仍在迦南南緣，但已靠近埃及方向的邊界地帶。


    CT 給的原文字義是「聖，分開」，並以此發展出靈意：信徒必須背向世界（書珥＝牆）、過分別為聖（加低斯）的生活，不可走中間路線。這是靈意解讀，與地理資料屬不同層次。


    ### 同一地名在正典後續的份量


    加低斯（加低斯巴尼亞）在後來的敘事中遠比本章重要：以色列人出埃及後在此駐紮，十二探子由此出發窺探迦南並帶回報告（民13:26），會眾在此背逆而被判在曠野飄流。創20:1
    只是把它當作一個方位座標；它日後成為以色列曠野歷史的樞紐。丁良才在本節下即註明可參民13:26。'
- title: 亞捫人
  path: link_folder/人物/亞捫人.md
  definition: 亞捫人（Ammonites），[[便亞米]]的後裔，羅得與小女兒亂倫所生的民族。居住在約但河東的高原。與以色列人有親族關係，但歷史上常為敵。
  development: '### 疆界與族名


    GT 李道生《舊約聖經問題總解》記亞捫人住在約但河的東邊，南境與北境連接拉巴城（撒下十一1；結二五5）。GT《創世記雷氏研讀本》說得更精確：亞捫人住在死海的**東北**面（比較申二37），與摩押人（死海以東）分處南北。BH
    指其地約當今日的約旦一帶。


    族名的字義與始祖的人名要分開。CT 給「亞捫」的原文字義是「含糊的，先天的，忠誠的」，李道生取「先天的」；至於「便亞米」這個人名，各家多解作「我民之子」或「我父之子」（詳見[[「便亞米」名字含義]]）。


    ### 與以色列的往來史


    李道生的敘述比摩押那一線更短，但幾個節點很清楚：


    - 以色列進迦南時亞捫已成大族，李道生據撒上十一2、摩一13 說「其人民最殘忍」。

    - 他們屢次與迦南人爭戰，始終沒有取得約但河西之地。

    - 以色列人逼近迦南時，亞捫人拒絕他們經過屬地，又請巴蘭咒詛以色列，因此有申二三3-4、尼十三1-2 的定例——永不准入耶和華的會，成為世仇（詩八三7）。

    - 士師時代與以色列交戰（士十–十一）。

    - 所羅門納亞捫女子拿瑪為妃，生羅波安（王上十四21）。

    - 背叛約阿施王的，是亞捫婦人示米押的兒子撒拔（與摩押婦人示米利的兒子約薩拔一同；代下二四26）。

    - 亞捫人所拜的神名叫米勒公，又叫摩洛；所羅門因娶摩押和亞捫女子為妃嬪，陷在敬拜這些偶像的罪中（王上十一1、4-8）。GT《聖經精讀本──創世記註解》把這一項與摩押並提：由罪而生的這兩個民族離開神，祭拜基抹和巴力毗珥，向摩洛獻嬰兒（民二一29；申四3）。


    ### 起源敘事不是抹黑


    GT《舊約背景註釋》指出亞捫語與希伯來語很接近，考古調查也顯示主前十四至十二世紀之間有人在該地區再度定居；雖然亞捫在歷史中大部分時間都是敵國，這個出身敘事「不太可能僅僅是有政治或種族歧視動機的誹謗話」。記載族長事蹟的動機之一，本來就是說明迦南和外約但所有民族的起源。'
- title: 非利士人
  path: link_folder/地點/非利士人.md
  definition: 非利士人（Philistines），地中海東南岸（今迦薩走廊一帶）的居民。創世記中最早出現於亞伯拉罕時代——創二十一32、34記亞比米勒與軍長非各「回非利士地去了」，亞伯拉罕則在非利士人的地寄居多日；到以撒時期則與以色列人時有衝突（創二十六）。各家都指出他們並非當地原住民，而是由外遷入：GT《舊約背景註釋》說他們屬於海上民族侵略者的一部分，在迦南南部五個城邦中定居。
  development: '### 從立約到敵對


    創世記裡的非利士人形象前後不同，這一點值得留意。創二十一章的結局是締約：亞比米勒承認神與亞伯拉罕同在，主動求約，雙方在別是巴解決水井之爭，亞伯拉罕隨後「在非利士人的地寄居了多日」。到創二十六章，同樣的地方、同樣的王號，關係卻轉為摩擦——他們塞住亞伯拉罕時期所挖的水井，牧人與以撒的牧人爭競，最後亞比米勒要以撒離開。


    GT《啟導本聖經創世記註釋》把這條線索讀成慣性而非偶然：比較創二十一25 與創二十六26 就知道「亞比米勒的人常常霸佔水井；到了以撒時代，故態復萌，需要再用談判來解決」。


    ### 他們是什麼人


    GT《舊約背景註釋》給的是聖經以外的輪廓：法老蘭塞三世（主前1182～1151）的記錄是聖經以外第一次提到非利士人，他們屬於海上民族侵略者的一部分，在迦南南部五個城邦中定居；埃及人僱他們為傭兵，並且與他們通商。


    族長時代的非利士人與這一批是否同一群，是本卷最實質的年代問題——GT《啟導本聖經創世記註釋》認為「亞伯拉罕時代的非利士人和後來的不同」，可能來自歐洲、居巴勒斯坦西南海岸從事貿易；GT《創世記雷氏研讀本》說法相同。完整的四家並陳見[[亞伯拉罕時代是否已有非利士人]]。'
- title: 非利士人出自迦斯路希或迦斐託
  path: link_folder/解經爭議/非利士人出自迦斯路希或迦斐託.md
  definition: 創世記10:14的希伯來文排列通常把「從那裡出來的有非利士人」接在迦斯路希人之後，但本章中文經文寫作「從迦斐託出來的有非利士人」。申命記2:23、阿摩司書9:7和耶利米書47:4也把非利士人與迦斐託相連。
  development: 常見解釋包括：非利士人與迦斯路希支系有家譜關係，後來從迦斐託遷入；或抄傳、標點與括號位置造成不同讀法。迦斐託常被聯繫到克里特或愛琴海地區，但精確辨識仍有討論。現有資料不能重建一條毫無疑問的單一路線。
- title: 亞嫩河
  path: link_folder/地點/亞嫩河.md
  definition: '民數記22:36：巴勒往摩押京城迎接巴蘭，「這城是在邊界上，在亞嫩河旁」。


    **它是一條界河。** CT 說「『亞嫩河』是摩押和亞摩利的邊界(參二十一13)」。GT 丁良才《民數記註釋》補上這條界線怎麼來的：「亞摩利人的王西宏，曾占了摩押地，直到亞嫩河。」也就是說，這條河之所以成為邊界，是因為摩押在此之前打了敗仗。


    **巴勒為什麼到這裡等。** GT《民數記串珠聖經註釋》說亞嫩河是摩押人和亞摩利人的邊界，以色列人就在河邊紮營，「所以巴勒到此迎接巴蘭，希望巴蘭迅速地辦完他所願望的事」。BH
    則從防務角度看：邊界是最脆弱的地方，巴勒的控制力在此最弱。


    CT 給的原文字義是「亞嫩」湍急的溪流。'
  development: ''
- title: 接連的山谷（na.chal）
  path: link_folder/原文/接連的山谷（na.chal）.md
  definition: '民數記24:6：「如接連的山谷，如河旁的園子」——這半節的第一個比喻，各家譯法差距很大。


    **STEP 在同一個 Strong 底下給了兩種東西。** 原文是 ki/n.cha.Lim ni.Ta.yu（H5158B），STEP 給的本節譯義是
    like wadis（乾河谷）…they are stretched out，簡要義域列的卻是 na.chal: palm-tree（棕樹）。也就是說這個字的義域本身就橫跨「河谷」與「棕樹」兩邊。


    **各家落在不同一邊。**


    - CT 讀作山谷：〔原文字義〕「接連」延長，擴展；並說是「形容以色列人的帳棚接連成排，起伏如同山谷」。

    - KC 也讀作山谷，並補上水：他說巴蘭看見他們像伸展開來的谷地，指的是有溪流穿過、供水給這些谷地的山谷。

    - BH 所用的譯本直接作棕樹林（palm groves），並說棕樹林在古代近東很常見，尤其在綠洲一帶。

    - GT《舊約聖經背景註釋》則把整句連起來看：「他俯望他們的陣營，將他們比喻為沉香和香柏的樹林。」


    **兩邊都指向同一個結論。** 不管是連綿的河谷還是成片的棕樹林，這個比喻要說的是同一件事：從高處俯看，那一片營帳是有水、有生命、鋪展得開的。'
  development: ''
- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  definition: 亞摩利人（Amorites），古代迦南地的重要民族之一，常作為迦南諸族的統稱。「亞摩利」意為「高處之人」或「西方人」。在創世記十四章中，亞摩利人指的是希伯崙一帶的部族，[[幔利]]、[[以實各]]、[[亞乃]]即為亞摩利人的首領。
  development: ''
- title: 希實本
  path: link_folder/地點/希實本.md
  definition: '希實本在民數記32 出現兩次：第3節是兩支派開口點名要的九座城之一，第37節說流便子孫建造了它。


    **它先前是誰的。** CT 一句話交代：「『希實本』原屬亞摩利王西宏的都城」。CT 給的名字字義是「堡壘」。


    GT《舊約背景註釋》給了位置，也留下一個沒解決的考古問題：「希實本（＝黑什班）是在馬達巴平原的西北角（尼波山東北三哩），它雖稱為 * 亞摩利王西宏的首都，卻沒有考古證據證明主前一二○○年之前有人在此長期居住」。


    GT 丁良才《民數記註釋》追了它後來的歸屬變化：「代上六81節說，希實本屬迦得支派，這是因為二支派暫時的居處混雜。希實本先前是那一代的京城，或者被迦得流便二支派同占了，後來本節的城邑都被摩押人恢復（賽十五4十六8，耶四十八32-33）。」GT《民數記串珠聖經註釋》講的是同一件事的另一半：「現屬流便的希實本，後來轉給迦得。」


    BH 的重點放在它的戰略地位：「希實本的地理位置使它成為貿易與軍事活動的中心樞紐」，並指出先知書裡它一再與摩押的敗亡連在一起。


    **原文層。** STEP 顯示第3節與第37節的「希實本」都是 chesh.Bon（H2809）。'
  development: '希實本在民數記裡出現兩次，兩次的身分完全不同。民21 它是亞摩利王西宏的京城，以色列擊敗西宏後把它連同附近村莊都佔了；到了本章，它已經是流便子孫動手重建的自家城邑。


    GT 丁良才與 GT 串珠都指出它後來還會再換手：從流便轉給迦得，最終被摩押人取回。'
- title: 以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）
  path: link_folder/互文/以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）.md
  definition: 民數記 21:21-31 記載以色列求經過西宏地被拒、在雅雜交戰、擊殺西宏並佔領希實本等地。此事在申命記 2:24-37、3:1-7 作為摩西回顧歷史的見證重述，強調神將西宏交在以色列手中；詩篇
    135:10-12、136:17-22 則將擊殺西宏列入「大能作為」，配合「因他的慈愛永遠長存」的副歌，成為以色列敬拜中紀念神信實的固定素材。
  development: 從歷史記載 → 律法書回顧 → 詩篇敬拜詠唱，形成多層次的神學傳承鏈。
- title: 使者
  path: link_folder/原文/使者.md
  definition: 出埃及記二十三20「看哪，我差遣使者在你前面，在路上保護你，領你到我所預備的地方去」。STEP 語言數據顯示，「使者」原文為 מַלְאָךְ（mal'akh，H4397，字根源自差派之意），指奉差遣的使者或天使；經文緊接著宣告「因我的名在祂裡面」（כִּי
    שְׁמִי בְּקִרְבּוֹ，H8034/H7130）。CT 在本節給「使者」的原文字義是「使者，天使」，並主張這位「應當不是指一般的天使，而是指神所特別差遣、負有特殊任務的『立約的使者』（參瑪三1），表徵那將要來的基督，故實際上可視為神自己」。GT《丁道爾聖經註釋》則主張譯法本身要保持開放：「這個字最好是譯作『使者』而不譯作『天使』，讓上文下理來決定使者的性質。」
  development: GT《舊約聖經背景註釋》從神名的觀念說明第21節：「耶和華將自己的名授與這天使的意思，就是說人要順從他，如同順從神一樣。神一切的臨在和能力，都與這位使者同在。」CT
    也說「奉我名」即「在神的名裡，而神的名即指神的實際，故祂就是神自己」。
- title: 大道（原文作王道）
  path: link_folder/文化/大道（原文作王道）.md
  definition: '民數記20:17：「只走大道（原文作王道），不偏左右，直到過了你的境界」；第19節以色列人再說一次：「我們要走大道上去」。


    **這條路在哪裡。** GT《啟導本聖經註釋》給的走向最具體：「“大道”當系指外約但溝通南北的通商大道，從阿卡巴灣口直上大馬色（今大馬士革）。」GT《民數記串珠聖經註釋》的描述相同：這是「約但谷東面高原南北直通之路」，走這條路可省時省力。GT《聖經精讀本──民數記註解》寫得更細：「指從約旦東向北,經過亞摩利和摩押以及以東到達以旬迦別的國際大道及其支路。」BH
    補上它的商業份量：這是一條從亞喀巴灣通到大馬士革的古代貿易幹道。


    **為什麼非走這條不可。** GT 丁良才《民數記註釋》從地形解釋：「從亞拉巴到以東山地有一條深溝，沿路有好些泉源和草地，在以東西邊，以色列人往來，只有這條路可走。」換句話說，以色列人不是挑一條方便的路，是只有這一條路可走。


    **它有多老。** GT《靈修版聖經註釋》指出：「大道（原文作王道）是古代車隊所行走之道路。在以色列人來到之前，早已成為主要的公路。」


    **走這條路的承諾。** CT 說明以色列人為什麼特別聲明只走大道：意指不會騷擾居民，破壞他們的安寧，造成不便等；不喝井裡的水的意思也不是滴水不沾，而是「不免費汲水(參19節)」。'
  development: ''
- title: 約但河
  path: link_folder/地點/約但河.md
  definition: 約但河在聖經敘事裡反覆作為一條界線。CT 給「約但」的原文字義是「落下者，水地」（創13）與「下降」（民26）。創13:10 羅得舉目看見約但河的全平原，那地「如同耶和華的園子，也像埃及地」，他就選了它；創32:10
    雅各在河東禱告，回顧「我先前只拿著我的杖過這約但河，如今我卻成了兩隊了」；民數記則一再以「約但河東」標定以色列進迦南以前的位置——BH 說約但河是曠野與應許之地之間的界線，以色列人靠近它就意味著他們即將從漂流者變成定居者。
  development: '### 創32：全章只提一次，卻是禱告的樞紐


    創32:10：「我先前只拿著我的杖過這約但河，如今我卻成了兩隊了。」約但河在創32 只此一處出現，卻是整篇禱告的樞紐。


    GT 丁良才《創世紀註釋》註出兩件事：其一，雅各過約旦河往拉班那裡去的時候手中只拿一根杖，回來時他的家眷卻有了兩隊；其二，「這約旦河」——約旦河離雅各當時說話的地方不遠。第二點解釋了為什麼他用「這」：那條河就在視線可及之處，禱告時他指得到。


    ### 創32：「只拿著我的杖」


    CT 註：「只拿著我的杖」表示他那時身無分文，僅有的是他手中的拐杖。GT《聖經精讀本──創世記註解》補上一層：這是雅各的告白，訴說自己曾經身無分文、驚慌逃亡的處境——而「這根杖，成為神引導和保護的杖」。


    BH 把這一節接到更廣的正典脈絡：約但河在聖經歷史中是一個標記過渡與新開始的地理座標，後來以色列人正是過這條河進入應許之地（書三14-17）。雅各在此提起它，等於在數算自己人生的兩端。


    ### 創32：「兩隊」在十節之內出現三次


    創32:1-2 雅各看見神的軍兵，給那地方起名瑪哈念（二軍兵）；創32:7 他把人口與牲畜「分做兩隊」自保；創32:10 他在禱告中說自己「成了兩隊」。


    KC 指出第10節這句是在暗指第1-2節他所見的兩隊天使——他把家業的擴增歸榮耀給神。CT 則注意到第7節那一次的性質相反：剛看見神的兩隊軍兵，肉眼不再看見天使就懼怕起來，於是用自己的兩隊來自保。


    同一個詞在十節之內出現三次，分別屬於神、屬於他的恐懼、屬於他的感恩。


    ### 創32：一句禱告裡的謙卑


    第10節的上半句是「你向僕人所施的一切慈愛和誠實，我一點也不配得」。CT 註「慈愛」指神心的表現、「誠實」指神作事法則的彰顯。GT《聖經精讀本──創世記註解》另指出「誠實指對某件事的行為，不是指認識層面」——原本狡詐的雅各，經過二十年的生活親身體驗到神的誠實。


    KC 認為這一節是整篇禱告最美的部分：他在其中承認神在他一生中的恩惠與信實，離開時是孤身一人，如今富足到成了兩隊（見[[雅各禱告的榜樣]]）。


    ### 創33：它沒有被指名，卻是那條分界


    創33 沒有一節提到約但河，但第17至18節的移動跨過了它：CT 指出疏割在約但河以東，而雅各「可能在疏割住了一段日子，然後才渡過約但河來到迦南地的示劍」；GT《串珠聖經註釋》措辭相同——「他在疏割住了一段日子，便渡過約但河遷徙至迦南地的示劍」。


    第18節說他「平平安安地到了迦南地的示劍城」——「迦南地」這三個字標出了河的另一邊。渡河與進迦南在創33 是同一個動作。


    ### 兩次過河


    雅各一生有兩次值得對讀的過河記載。創32:10 是二十年前逃亡時的過河，往東；創33:18 是歸回時的過河，往西。GT 丁良才在創32:10 註「這約旦河」時說，約旦河離雅各當時說話的地方不遠——也就是說，他在河的東岸禱告，回顧的正是同一條河。


    一根杖過去，兩隊回來——這是創33「平平安安地到了迦南地」那句話真正的重量所在。


    ### 創33：河東的停留


    值得留意的是雅各並沒有立刻過河。第17節他先在河東的疏割蓋房搭棚，CT 推算他「可能在疏割住了不少年」，GT《創世記雷氏研讀本》給的數字是「可能在疏割停留了十年才前往示劍去」。


    換句話說，從第16節與以掃分手到第18節進入迦南，中間隔著十年和一條河。經文用兩節寫完，讀時容易當成連續的動作（見[[疏割居住是否屬靈倒退]]）。'
- title: 法老心剛硬三字
  path: link_folder/原文/法老心剛硬三字.md
  definition: 出埃及記中描繪法老心剛硬的三個原文字詞：חָזַק（*cha.zaq*，H2388G，加強／堅固，7:13等處）、כָּבֵד（*ka.ved*，7:14形容詞
    H3515「沉重」；其他動詞形式 H3513「使沉重」）、קָשָׁה（*qa.shah*，H7185，剛硬／嚴酷，7:3等處）。CT 在4:21的註解說《出埃及記》裡所用的「剛硬」共有三個不同的原文字，分別意指「堅定不移，不肯改變態度」「剛硬，無情」「沉重，麻木不仁」。
  development: 'GT中文聖經註釋指出三字的漸進意義：

    1. *ka.ved*（沉重）——7:14「法老心裡固執」，原文是沉重的，不易被搬動和改變

    2. *cha.zaq*（加強、堅定）——七13,22「法老心裡剛硬」，堅持己意不願改變

    3. *qa.shah*（剛硬）——完全剛硬、頑固不化


    CT指出「固執」原文意指「沉重」——凡存心和觀念太過沉重的人，不容易被別人搬動和改變。


    這三字也對應三個主體：法老自己剛硬他的心（八15,32, 九34）、法老心自己剛硬（七13,22, 八19）、神使法老心剛硬（九12, 十1,20, 十一10,
    十四4,8）——顯示剛硬過程中神主權與人責任的交織。頭幾個災前是法老自己剛硬（八15,32），後幾個災是神使他剛硬——任憑他堅持自己選擇的方向。'
- title: 滅絕
  path: link_folder/原文/滅絕.md
  definition: 出埃及記二十二20「祭祀別神，不單單祭祀耶和華的，那人必要滅絕」。STEP 語言數據顯示，「必要滅絕」原文為動詞 יָחֳרָם（yochoram，H2763，字根
    חָרַם charam），名詞形態為 חֵרֶם（cherem，H2764），指被分別出來專屬於神之毀滅、禁止人私用的完全滅絕。CT 在本節給「滅絕」的原文字義是「滅絕，毀滅，劈開」，並解「祭祀別神，不單單祭祀耶和華的」為「在耶和華真神以外，禁止祭祀任何偶像假神」。GT《丁道爾聖經註釋》指出這個字帶著獻上的意味：犯這罪的人被列為「稱聖當滅之物」，並說「迦南人要怎樣被以色列人殺盡，這人也要怎樣滅絕」。BH
    同樣說明這個概念是「分別出來歸神毀滅」。
  development: 「滅絕」在本節指向的不是單純的處死，而是被歸為當滅之物。GT《丁道爾聖經註釋》以「稱聖當滅之物」表達這個雙義：被歸入其中的人與一切屬他的都須徹底摧毀，正如迦南人被以色列人殺盡一樣。
- title: 基列
  path: link_folder/地點/基列.md
  definition: 基列意為「多岩石的」，指約旦河東岸的山地地區，包括從加利利海附近雅穆克河到死海北端的大部分約旦高原。以生產香料、乳香、沒藥聞名（創37:25、耶8:22、46:11）。士師睚珥、耶弗他皆為基列人（士10:3、11:1）。
  development: '### 一個名字，兩層意思


    李道生《舊約聖經問題總解》（GT 收錄）在創卅一21~23 給了本條目最完整的一份資料：基列意即多岩石的，位於約但河東面，約書亞照摩西吩咐把此地分給迦得人、流便人、瑪拿西半支派的人（申三四1、書二二9、士二十1）；境內多丘陵，林木茂盛，生產香料及乳香、沒藥（民三二1、創三七25、耶八22、四六11）。


    它並整理出這地在後世的角色：以色列人進迦南前先取基列全地（民三二26-29、申二24～三12）；著名的士師睚珥與耶弗他皆是基列人（士十3、十一1）；先知以利亞曾寄居此地（王上十七1）；大衛受膏為王時，押尼珥在瑪哈念立伊施波設為以色列王，治理基列及約但河東邊等地方（撒下二1-11）。


    ### 一項容易混淆的同名


    李道生另提醒一個可核對的區別：士師記七3 所說的「基列山」與基列地無關——基甸安營的地方在約但河的兩邊，而基列地位於約但河的東邊；有神學家以為士七3 的基列山乃是基利波山（撒上二八4、三一1、代上十1）。


    ### 在本章的位置


    基列在創世記三十一章是邊界。雅各過了大河（21節）進入這一帶，拉班在此追上（23節），雙方在此立石堆與柱子（45-46節），並約定「我必不過這石堆去害你，你也不可過這石堆和柱子來害我」（52節）。GT
    華爾頓《創世記背景註釋》指出豎立石柱表示這是疆土性的協議，所標示的正是邊界——基列因此不只是雅各路過的地方，而是這份條約所劃的那條線本身（見[[立約石堆與柱子]]）。

    基列「香料/乳香/沒藥」預表基督「滿有恩典真理」（約1:14）與「生命氣息」（約20:22）；基列醫治膏（耶8:22）指向大醫治者耶穌（可2:17），士師睚珥/耶弗他預表基督拯救者身分。'
- title: 雅博渡口
  path: link_folder/地點/雅博渡口.md
  definition: 雅博河（今稱雅卡河 Wadi Zerqa）為約但河東側主要支流，發源於亞蒙地、向西流經基列、在死海北約30-38公里處注入約但河。希伯來文「雅博」與「摔跤」諧音（GT《聖經精讀本──創世記註解》：「摔跤」的詞根具有「塵土飛揚地撕打」之意，可能與河名有關），CT
    註其原文字義為「摔跤」、「湧出」、「潑出」、「倒空」。渡口為人畜可涉渡之淺灘（士3:28）。
  development: '### 渡口本身就有意義


    GT 華爾頓《創世記背景註釋》給了本條目最有份量的一段：渡口或涉渡點的功用與城門差不多，兩者都是某些地區的出口和入口，在軍事上都有戰略價值（見士三28、十二5；耶五一32），故此都與權能有關——「這權能包括了實質的勢力，和超自然的能力」。他因此說：「雅各進入應許之地，與他在湍急之雅博河渡口旁與一位超自然者搏鬥這兩回事有關聯，是不難想像的。」


    換句話說，摔跤發生在這個地點不是偶然。渡口是進出的關口，而雅各正要進入應許之地；他在關口被攔下。


    ### 它在哪裡


    各家給的數字略有出入，但指的是同一條河。CT 註「這河是約但河東面的分支，在死海以北約卅餘公里處注入約但河」；GT《串珠聖經註釋》作「約卅二公里」；GT《啟導本聖經創世記註釋》說「雅博是基列的一條小河，現名雅卡河（Wadi
    Zerqa），在死海北約30公里處，向西流入約但河」；GT《創世記雷氏研讀本》則作「大約在死海以北二十四英里（38公里）入約但河」。GT 丁良才《創世紀註釋》從另一端定位：「雅博河在加利利海和死海的當中，與示劍相對，流入約旦河。」


    GT《聖經精讀本──創世記註解》補了一項水文事實：這條支流「只有到了雨季才有水流」；而「渡口」是人和家畜可以渡過的較淺小溪（士三28）。這說明第22-23節那一夜為什麼能把兩妻、兩使女、十一個兒子連同所有家產都送過去。


    ### 河名與那一夜


    GT《創世記雷氏研讀本》指出「雅博」這名字與希伯來文解作「角力」的字有關（參第24節）。GT《聖經精讀本──創世記註解》講得更細：「摔跤」的詞根具有「塵土飛揚地撕打」之意，可能與河名有關，含有「緊緊抱住躺下」或「緊緊貼住」之意——並認為這河名「是後人為紀念雅各在這裡的特殊經歷而取」。CT
    則只註原文字義：「摔跤，湧出，潑出，倒空。」


    要留意精讀本這個說法的性質：河名是否因雅各而得，經文沒有說；它是一種推論。可以確定的只是字音的相近，以及敘事者把摔跤放在這條河邊。'
- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  definition: BH 在出二十二20 指出「必要滅絕」背後的觀念是希伯來文的 herem——把某物分別出來歸神毀滅。GT《丁道爾聖經註釋》用同一個概念解釋本節：犯這罪的人被列為「稱聖當滅之物」，「迦南人要怎樣被以色列人殺盡，這人也要怎樣滅絕」，並在論這一組律法時說「獻祭給耶和華以外神祇的人都要『稱聖』歸作『當滅之物』，他和一切屬他的都須徹底摧毀」。
  development: 'herem 這個字在兩卷書裡出現的位置不同，份量也不同。


    出埃及記二十二20 是把它用在一條刑律上：獻祭給耶和華以外神祇的人「必要滅絕」。BH 在那裡點出背後的觀念——「把某物分別出來歸神毀滅」；GT《丁道爾聖經註釋》說得更重：這人被列為「稱聖當滅之物」，「迦南人要怎樣被以色列人殺盡，這人也要怎樣滅絕」，「他和一切屬他的都須徹底摧毀」。


    利未記二十七28-29 則是把它寫成一條完整的產權條例，並且第一次把兩種情況分開。第28節說永獻之物「都不可賣，也不可贖」，第29節說當滅的人「都不可贖，必被治死」。CT
    指出兩處原文同字：「『永獻』與『當滅』在希伯來文均用herem一字。」STEP 語言資料進一步顯示，差別在語態——v28 的動詞是 Hiphil（人主動把東西獻上毀滅），v29
    是 Hophal（人被獻上毀滅）。這正好對上 GT 丁良才對兩節的分工：「在28節是論各人隨意行的，在本節是論官長所可以行的。」


    兩卷合起來看，herem 的關鍵不在「毀滅」而在「不可取回」。GT《啟導本聖經利未記註釋》用亞干的案子說明後果：神指定某些戰利品或俘虜完全歸祂、人不可佔有（書六17），而「亞干的罪招神烈怒，正是因為取了永獻之物」。這也解釋了利未記二十七章為什麼要把它列進三類不可再許之物——已經是神的，就不能再當成自己的東西獻一次。'
