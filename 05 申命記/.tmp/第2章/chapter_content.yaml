organization: "### 繞行夠了，轉向北去（v1-3）\n\n第一章停在加低斯，第二章從那裡轉身。第1節「此後，我們轉回，從[[海（紅海）|紅海]]的路往曠野去⋯我們在[[西珥山]]繞行了許多日子」——GT《聖經精讀本》把「許多日子」說明白：「指加低斯巴尼亞探子事件之後的38年。」同一段還澄清了一個容易誤讀的地名：「西珥山：在這裡並非指某一特定的山，乃是指整個以東山地。」\n\
  \n第3節神說「你們繞行這山的日子夠了，要轉向北去」。這句話與申1:6「你們在這山上住的日子夠了」是同一個句型，只是對象換了——一次是何烈山，一次是西珥山。GT《聖經精讀本》說明轉向的具體走法：「即已到了恢復迦南之時，不繞過以東山區的南端，向死海東部的亞嫩河北上。」\n\
  \nKC 從第1節的「我們」讀出一件事：摩西把自己也算了進去。因著別人的不信，所有人——包括約書亞、迦勒和摩西自己——都得跟著轉回；全體的不忠，對每一個忠心的人都有後果。\n\
  \n### 三次不可：以東、摩押、亞捫（v4-23）\n\n本章前二十三節反覆用同一組句型下禁令，三次的結構完全一樣。\n\n| 節次 | 對象 | 血緣 |\
  \ 神已賜給他們的地 |\n| --- | --- | --- | --- |\n| 4-7 | [[以掃]]的子孫（[[以東]]人） | 雅各的哥哥 | [[西珥山]]\
  \ |\n| 9-12 | [[摩押人]] | [[羅得]]的長女之後 | [[亞珥]] |\n| 19-23 | [[亞捫人]] | 羅得的次女之後 | 亞捫人之地\
  \ |\n\nGT《聖經精讀本》把理由歸納成兩點：「①以東是雅各之兄以掃的後裔⋯摩押與亞捫人則是亞伯拉罕的侄子羅得的後裔⋯都是與以色列相親的兄弟民族；②神也已賜給他們世俗的產業之地（5,9,19節）。」\n\
  \n禁令用的兩個動詞值得分開看。STEP語言資料顯示「擾害」是 ta.tzar（H6696B，簡要詞典義 tsur: to provoke），「爭戰」是 tit.ga.Ru\
  \ 或 tit.Gar（H1624 ga.rah，to stir up，Hithpael），後面常帶 mil.cha.Mah（H4421 battle）。這組詞在第24節會反過來變成命令（見\
  \ [[不可擾害也不可爭戰（tsur、garah）]]）。\n\n「為業」這個名詞則在本章出現四次，其中三次講的不是以色列的地——STEP語言資料顯示是 ye.ru.Shah（H3425），而第24節「得他的地為業」是同一字根的動詞\
  \ Rash（H3423H）（見 [[為業（ye.ru.shah）]]）。KC 從這裡讀出一個原則：「神與這些別的民族也有關係，祂也把地賜給了列國（第9、19節）。」CT\
  \ 在第5節的〔話中之光〕說得更貼身：「神的兒女要知道自己的地界，不能羨慕別人，也不該妒忌別人為甚麼先得了地上的成就」（見 [[神所定的邊界]]）。\n\n第5節把不給的程度量到最小：「連[[腳掌可踏之處]]，我都不給你們。」CT\
  \ 說這是「形容寸土之地」，STEP語言資料顯示是三個名詞疊起來的 mid.Rakh kaf- Ra.gel（H4096＋H3709H＋H7272）。\n\n\
  第6節則規定他們怎麼取得補給：[[用錢買糧買水]]。GT《聖經精讀本》：「本節是指以色列在通過以東地時不可像侵略者那樣無禮妄動，乃要像路過的旅人一樣彬彬有禮。」第7節說明他們付得起：「這四十年，耶和華─你的神常與你同在，故此你[[你一無所缺|一無所缺]]。」\n\
  \n### 三段插敘：誰住過這些地（v10-12、20-23）\n\n本章有三段括號裡的補充，寫的都是同一件事——這些地先前住著別人。\n\n```mermaid\n\
  flowchart LR\n    A[\"以米人<br/>（摩押人的叫法）\"] -->|被取代| B[\"摩押人\"]\n    C[\"何利人\"] -->|被以掃子孫除滅|\
  \ D[\"以東人\"]\n    E[\"利乏音人<br/>亞捫人稱散送冥\"] -->|耶和華除滅| F[\"亞捫人\"]\n    G[\"亞衛人<br/>住鄉村直到迦薩\"\
  ] -->|被迦斐託人除滅| H[\"迦斐託人\"]\n```\n\n[[利乏音人]]這個族群有三個名字。GT《啟導本》把它們排在一起：「摩押人稱他們為『[[以米人]]』（創十四5）；猶大人稱他們為[[亞衲族與偉人拿非林|亞衲人]]（民十三33；士一20）；亞捫人叫他們做[[散送冥]]（20節）。」其中散送冥全本聖經只出現這一次，CT\
  \ 給的原文字義是「陰謀者」。\n\n[[何利人]]的身分近年有修正。GT《啟導本》：「過去以為何利人為穴居部落民族，因其希伯來文名中的hor有『穴』的意思，現在已知為主前一千五百年時住在巴勒斯坦北部和敘利亞一帶的強大赫倫人（Hurrians）。」\n\
  \n第23節的[[亞衛人]]被從[[迦薩]]一帶趕走，取代他們的是[[非利士人|迦斐託人]]。GT《聖經精讀本》：「指非利士人（耶47:4;摩9:7），其土著地為愛琴海沿岸地區的Crete。『非利士』本身具有『移民』（immigrant）之意」（見\
  \ [[非利士人出自迦斯路希或迦斐託]]）。\n\nKC 把這幾段插敘讀成一個提醒：以色列從中可以看見神掌管一切，並為每一國定下居住的地方；而那些曾經令人生畏的居民既已被趕出，這對以色列本該是鼓勵。\n\
  \n### 過撒烈溪：三十八年到此為止（v13-16）\n\n第13節「現在，起來過[[撒烈溪]]！於是我們過了撒烈溪。」第14節接著算帳：「自從離開[[加低斯|加低斯巴尼亞]]，到過了撒烈溪的時候，共有三十八年。」\n\
  \n```mermaid\ntimeline\n    title 從加低斯到撒烈溪\n    出埃及第二年 : 首次離開加低斯巴尼亞 : 拒絕上去\n   \
  \ 其後三十八年 : 曠野飄流 : 那世代的兵丁陸續死去\n    出埃及第四十年 : 過撒烈溪 : 兵丁滅盡 : 轉向亞嫩谷\n```\n\nCT 從這個數字推出一個具體結果：「『都從營中滅盡』由此可見，那一代人的平均壽命，沒有超過六十歲。」第15節說這不是自然凋零：「耶和華的手也攻擊他們，將他們從營中除滅，直到滅盡。」KC\
  \ 讀到同一件事：他們藐視了神看顧的手，就得面對祂管教的手；等最後一人死去，那隻手就不再與他們相對（見 [[三十八年與那世代的兵丁滅盡]]、[[曠野飄流四十年]]）。\n\
  \nGT《聖經精讀本》對這一代軍人的評語不客氣：他們雖然與亞瑪力人爭戰過、有作戰經驗，「但因他們違背了指揮官的命令，神卻毫無迷戀地除去了他們，將征服迦南的偉業託付給了毫無戰鬥經驗的新世代」。\n\
  \n### 起首：同一個動詞從禁令變成命令（v24-25）\n\n第24節是全章的轉軸：「你們起來前往，過[[亞嫩河|亞嫩谷]]；我已將[[亞摩利人]][[希實本]]王西宏和他的地交在你手中，你要與他爭戰，得他的地為業。」\n\
  \n前面三次說「不可爭戰」用的 ga.rah，這裡變成命令式 ve./hit.Gar；前面說「我不賜給你們為業」，這裡說「得他的地為業」。STEP語言資料另顯示第24節的「起首」是\
  \ ha.Chel、第25節的「從今日起」是 'a.Chel，同為 H2490C（cha.lal，簡要詞典義 to profane/begin: begin）（見\
  \ [[起首得那地（cha.lal）]]）。CT 在第31節註明「『從此起首』（原文無此詞）」——中文那句是補出來的。\n\n第25節宣告效果：「我要使天下萬民聽見你的名聲都驚恐懼怕，且因你發顫傷慟。」CT\
  \ 的原文字義把四個詞逐一拆開，STEP 的逐字資料完全對得上：\n\n| 和合本 | CT 原文字義 | 原文 | Extended Strong |\n|\
  \ --- | --- | --- | --- |\n| 驚恐 | 恐懼 | pach.de./Kha | H6343 |\n| 懼怕 | 害怕，不安 | ve./yir.'A.te./kha\
  \ | H3374 |\n| 發顫 | 發抖，震動 | ve./ra.ge.Zu | H7264 |\n| 傷慟 | 扭曲，扭動 | ve./cha.Lu |\
  \ H2342I |\n\n「傷慟」在中文像是悲傷，原文其實是身體扭動（見 [[使天下萬民驚恐懼怕]]）。\n\n### 談判、剛硬、開戰（v26-33）\n\n\
  動武之前先談。第26節摩西從[[基底莫]]的曠野差遣[[使者]]，「用和睦的話」請求借道。GT《聖經精讀本》指出這符合律法：「在爭戰之前先提出和親是符合律法（20:10）的行為。」\n\
  \n請求的內容有三項：只走[[大道（原文作王道）|大道]]不偏左右、糧水照付、只求步行過去。GT《聖經精讀本》說明這條路是什麼：「只走大道：具有『只走道，只走道』的意思⋯此道與民21:22的『王道』（Kings\
  \ Highway）是同一道路，是古代東方幾個主要國際道路之一。」\n\n第30節說明談判為什麼破裂：「因為耶和華─你的神使他心中剛硬，性情頑梗。」STEP語言資料顯示是\
  \ hik.Shah 'et- ru.Ch/o（H7185＋H7307G ru.ach）與 ve./'i.Metz 'et- le.va.V/o（H553＋H3824\
  \ le.vav）——和合本譯作「心中」的那個字是靈，譯作「性情」的才是心。CT 的原文字義早就這樣註：「『心中』靈，氣，風；『性情』內心」（見 [[法老心剛硬三字]]）。\n\
  \n這句話怎麼讀，各家重心不同。GT《雷氏研讀本》：「雖然是西宏自己作出決定，但摩西從神控制歷史的希伯來人觀點而說出這句話（民二一23）。」GT《串珠》：「按神的計畫，希實本王西宏使自己的心剛硬⋯故此，人不可忽視自己的行動，因神的預定與人的責任是不能分割的。」GT《聖經精讀本》：「並不是指敵意使原本善良的希實本王西宏變得頑梗，乃是指任他持有剛硬的心。」KC\
  \ 說神使他剛硬只是確認了那早已存在的不肯回轉的態度（見 [[神使西宏心中剛硬與人的責任]]）。CT 只講結果：「他這個態度迫使以色列人訴諸武力。」\n\n第32節在[[雅雜]]開戰，第33節「耶和華─我們的神將他交給我們」。\n\
  \n### 盡都毀滅與所得之地（v34-37）\n\n第34節寫戰後處置：「我們奪了他的一切城邑，將有人煙的各城，連女人帶孩子，盡都[[滅絕|毀滅]]，沒有留下一個。」\n\
  \nGT《啟導本》在這裡指出這是一個專用字，但爬取下來的來源檔在該處字形缺漏：「『毀滅』的希伯來原文作（），為一專用字，指在為神而作的聖戰中，將所有戰俘、擄物完全殲滅，當作對神的奉獻。」STEP語言資料補上了缺的那個字：va./na.cha.Rem（H2763A，簡要詞典義\
  \ cha.ram: to devote/destroy，Hiphil）（見 [[滅絕（herem）]]）。CT 說明這種處置的適用範圍：「意指不留一個活口，通常只有在聖戰的指令下才這樣作，例如在耶利哥城（參書六17）。」\n\
  \nGT《啟導本》另列出戰後處理的三種型態：人畜財物通通毀滅、消滅人但留下財產、只消滅男丁——本章第35節屬第二種：「惟有牲畜和所奪的各城，並其中的財物，都取為自己的掠物。」\n\
  \n第36節劃出所得之地的範圍：從亞嫩谷邊的[[亞羅珥]]和谷中的城，直到[[基列]]。而全章最後一句話回頭接上了第一章：「沒有一座城高得使我們不能攻取的。」GT《雷氏研讀本》點明它在回應誰：「『高得使我們不能攻取』。高高的城牆把以色列人嚇壞了（一28）。」CT\
  \ 註明「攻取」在原文無此字，STEP 也證實本節只有 kir.Yah 'a.Sher sa.ge.Vah mi.Me./nu（H7151＋H7682＋H4480A），字面是「沒有一座城對我們太高」（見\
  \ [[沒有一座城高得使我們不能攻取]]）。\n\n> [!important] 全章收在一句「沒有挨近」\n> 第37節：「惟有亞捫人之地，凡靠近[[雅博渡口|雅博河]]的地，並山地的城邑，與耶和華─我們神所禁止我們去的地方，都沒有挨近。」KC\
  \ 特別指出這一節的作用：這裡摩西強調的是以色列的順服——經文不是只記不信與它的後果，遵行神旨意的事也被記下來了。打得贏的仗打了，不准碰的地一步也沒踏。"
