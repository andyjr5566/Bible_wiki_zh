- title: 以眼還眼
  path: link_folder/神學/以眼還眼.md
  definition: 「以眼還眼，以牙還牙，以手還手，以腳還腳，以烙還烙，以傷還傷，以打還打」（出二十一24-25）是同態復仇法在聖經裡最有名的表述。CT 把兩節分開解：24
    節「是指身上相同的部位」，25 節「是指身上相同的傷害程度」，並引法蘭士（R. T. France）說明立法方向：「這樣說的用意不是去鼓勵復仇，而是通過法律的規定，言明懲處不得重於罪行本身，以防止血仇的不斷升級。」GT《串珠聖經註釋》歸納為「犯罪者所受的刑罰應與罪惡相稱……這維護了法律對各階層人士的公正，例如有錢人不能單繳交罰款來代替他因傷人而須受的刑罰」，並補上一句評價：「可惜這種公平的刑罰原則後來並未有確實地執行。」
  development: 出埃及記首立此原則，利未記二十四19-20 與申命記十九21 重申。新約中基督在登山寶訓引用它並推深一層，教導門徒「不要與惡人作對」（太五38-39）。KC
    說明這不是廢掉原則而是換了場域：律法所要求的一向是公義的，「以眼還眼」本身沒有錯，但它「應當由有權柄的法庭施行，而不是用在個人報復上」；主用「只是我告訴你們」所指出的，是門徒該有的心。
  signals:
