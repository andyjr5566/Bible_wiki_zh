- title: 以眼還眼的適用範圍
  path: link_folder/解經爭議/以眼還眼的適用範圍.md
  definition: '出埃及記二十一24-25 的「以眼還眼」該由誰執行、執行到什麼程度，本章來源給的答案並不相同，構成三層爭議：由法官還是由個人執行；照字面還是折成錢；是否適用於奴婢。


    GT《丁道爾聖經註釋》把第一層說得最清楚：「挪士指出這是引導法官作出判決的司法原則，不能作為人際關係的方針。然而通俗的猶太教信奉的卻顯然是後者，不然基督也沒有必要棄絕這個普遍的解釋了（太五38、39）。」KC
    同樣主張「這應當由有權柄的法庭施行，而不是用在個人報復上」。第二層，GT 丁良才說「按傷的輕重罰錢，未必實實在在的以傷還傷」，GT《中文聖經註釋》也說「按照中東一帶的習慣和猶太人拉比的解釋，上述的以Ｘ還Ｘ也不是完全按字句執行的」，只有在極端仇恨或以低身分傷害高身分者時才有可能照字句執行。'
  development: 多數學者認為同態復仇法是司法原則，限制量刑不超過傷害程度，而非鼓勵個人報復。新約中基督在登山寶訓中超越此原則，教導「不要與惡人作對」（太5:38-39），以愛仇敵取代報復，但同態復仇法作為司法公義的基礎原則仍具意義。
