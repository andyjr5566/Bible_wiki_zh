- title: 憑幾個見證人的口
  path: link_folder/主題/憑幾個見證人的口.md
  definition: '民數記35:30 為死刑定下證據門檻：「無論誰故殺人，要憑幾個見證人的口把那故殺人的殺了，只是不可憑一個見證的口叫人死。」


    **原文的說法是：照見證人的口。** STEP 原文資料顯示「憑幾個見證人的口」是 le./Fi ''e.Dim（H6310I peh「口」加 H5707
    ''ed「見證」，複數），「一個見證」是 ''Ed ''e.Chad（H5707 加 H259），動詞 ya.''a.Neh（H6030B）簡要詞典義是 to
    answer。同一節裡「見證人」用複數、「見證」用單數加「一」，門檻就落在這個數目差上。


    **幾個是幾個？** CT 註：「『幾個見證人』指兩個以上的見證人（參申十七6；來十28）」。GT 丁良才同樣引申命記十七6「要憑兩三個人的口作見證」。BibleHub
    Study 補上申命記十九15，並指出這個原則在新約被重述（太18:16；林後13:1）。KingComments 也引保羅在林後13:1 說的，凡事都要憑兩三個人的口作見證；他並提到主耶穌自己說過，若只有他為自己作見證，他的見證就不真（約5:31）——意思是不能在法律上被接受。


    **這條規定的用意有兩層。** CT 說：「『不可憑一個見證的口』這是為防止作假見證。」GT《聖經精讀本》則說：需要兩三個證人「是為了表明律法的公正性和慎重性,也暗示對生命的敬畏」。


    **「見證人」不等於「目擊者」。** 這是本章在 GT 拾穗裡被討論最多的一點。如果原文的 ''ed 只能指案發當場親眼看見的人，那麼絕大多數謀殺犯都無法被定罪。GT
    賈斯樂郝威《聖經難解經文詮釋手冊》與艾基斯《舊約聖經難題彙編》都從原文用法回答：


    - 利未記5:1 說「他本是見證，卻不把所看見的，所知道的，說出來」——「所知道的」已經把非目擊的知情者包含進來。

    - 出埃及記22:13 用同一個字指被野獸撕碎的屍身：那具屍體就是「證據」。

    - 創世記31:46-49 雅各與拉班立約時堆的石堆被稱為「作見證的石柱」——石頭當然不會目擊。

    - 約書亞記24:25-27 約書亞立的那塊石頭同樣被稱作見證。


    艾基斯由此下結論：無論是否牽涉殺人的案件，實物或文件都可以作為呈堂證物，「這頗相似於我們今天審訊各類案件時也有的證物」。CT 的講法一致：「『見證人』原意是指在場目睹的證人，可延伸為事發現場的犯罪證據」。


    **這條規定也把處決和私刑分開。** GT《舊約聖經背景註釋》指出程序的次序：罪名沒有兩個見證人就不能成立（民三十五30），成立之後，處決罪犯才成為報血仇者的責任（民三十五19～21；申十九12）。換句話說，報血仇的在第19節看起來像是可以一遇見就動手，實際上要走完第30節這道門。'
  development: '民數記三十五章把兩三個見證人的門檻定在故殺人的案子上，申命記十七章把同一條門檻搬到另一種案子：有人去事奉敬拜別神。STEP 顯示申17:6
    用的是與民35:30 同一組字（''al pi、''e.Dim）。門檻本身沒有變，適用的範圍卻從人命案擴到了宗教背叛。


    申命記十七章還多加了一道民數記沒有的設計。第7節規定見證人要先下手，然後眾民也下手。CT 說這是為著防止作偽證，一則表示良心無虧，二則表示願受作偽證的刑責；GT《聖經精讀本》說之所以規定證人先下手，是為了使證人為自己的證詞負不可推卸的責任。證據門檻管的是作證的人數，這一條管的是作證的人要不要為自己的話付代價。'
  signals: []
  accumulation_count:
  - 2
  - 3
- title: 不可作假見證陷害人
  path: link_folder/神學/不可作假見證陷害人.md
  definition: 「不可作假見證陷害人」（出二十16）是十誡的第九條誡命，禁止在司法或其他場合提供不實的證詞陷害他人。在古代以色列，司法系統高度依賴證人的口頭證詞，沒有現代法醫或偵查技術，因此假見證可能導致嚴重的司法不公——包括冤屈的懲罰甚至死刑。此誡命維護真理和公義，要求人在言語上誠實，不可用謊言損害他人的名譽、財產或生命。
  development: 新約中保羅教導信徒「要棄絕謊言，各人與鄰舍說實話」（弗四25）。耶穌教導「你們的話，是，就說是；不是，就說不是；若再多說，就是出於那惡者」（太五37）。第九誡不僅關乎法庭證詞，更關乎日常生活中的誠信——基督徒的言語應反映真理，因為神是真理的神。
  signals: []
  accumulation_count:
  - 3
  - 4
- title: 審判官
  path: link_folder/原文/審判官.md
  definition: '出埃及記二十一6「他的主人就要帶他到審判官（或作：神；下同）那裡」。STEP 語言證據顯示，原文使用的詞是 הָאֱלֹהִים（ha-Elohim，H430），字面就是「神」；和合本在正文譯為「審判官」，並在小字保留「或作：神」的直譯。CT
    的原文字義列出「審判官，統治者，神」，文意註解也給出兩種理解：「（1）指神，到神面前發願立誓，永不反悔；（2）指公證人，證明雙方今後的身份關係乃出於甘心樂意，不再改變」；各家註釋進一步討論此處指聖所裁判或神所設立的審判官。


    各家在這裡明顯分歧。GT《中文聖經註釋》主張原文本來就是神：「原文的審判官是神。而這神的原文伊羅興，亦可繙成為其他的神（gods）。因此，原意是帶他到神壇那裏去起誓」。GT《丁道爾聖經註釋》說得更直接：「帶他到神那裡，即帶他到聖所（將『神』譯作『審判官』是解經，不是譯經；和合本作『審判官』）。」GT
    丁良才則走另一條路，認為譯作審判官並無不妥，因為「審判官代表神判斷是非（二十二8-9）」、「審判官是神的代表（參詩八十二1、6，約十34的神字）」。BH 也採人間法庭的讀法，指這裡的「審判官」是受委任的領袖或長老，負責在群體中維持公義與秩序，而他們是神律法的代表。'
  development: '「審判官」與「神」在原文是同一個字，這使以色列的審判制度在語言層面就帶著代表性：判斷是非的權柄不是人自有的，而是受託的。GT 丁良才把二十二8-9
    與本節並讀，正是循這條線索。


    ### 從按人數分層到按城設立


    出十八25 記摩西在曠野照葉忒羅的建議設立審判官，分法是按人數——千夫長、百夫長、五十夫長、十夫長；申1:15 記的是同一件事。那時全民住在一個營裡，分層就夠了。


    申命記十六18 換了分法：「你要在耶和華─你神所賜的各城裡，按著各支派設立審判官和官長。」不再按人數分層，改按地點設立。KC 點出這個轉換的原因與後果：在曠野時審判官是按人數設立的，這裡則連於他們將要散居的各城；他並指摩西在這裡規定的是下級法庭怎麼設立——不是每一件事都要送到最高的那一級。


    GT《啟導本聖經申命記註釋》把這一節放進更大的架構裡：本節至十八22 是有關以色列人行政體制設立的規定，包括審判官、王、祭司及先知。


    ==定居改變了司法的形狀。== 一個營可以靠分層管理，許多座城只能靠在每一座城裡都設一個。


    申命記十六章第18節命令在各城設立審判官與官長，申命記十七章補上這套制度的頂端。第9節說難斷的案子要上到耶和華所選擇的地方，去見祭司利未人與當時的審判官；STEP
    顯示十七章兩次的審判官都是 ha./sho.Fet（H8199），與十六章同一個字。


    值得注意的是這一次審判官不是單獨出現。GT《申命記串珠聖經註釋》說在神治的體制裡，祭司與審判官同是神的代表；祭司的責任是教導律法，審判官則是律法的執行者。地方的審判官各自坐在自己的城門口，中央這一組則是祭司與審判官並列。'
  signals:
  - many_accumulations
  accumulation_count:
  - 6
  - 7
- title: 以色列的長老
  path: link_folder/文化/以色列的長老.md
  definition: 以色列的長老是家族、宗族與群體中具代表性和權威的年長領袖。以色列在埃及尚未建立王國或正式國家官僚體制時，長老已能被招聚、聽取神的信息，並與摩西一同代表百姓前往法老面前。
  development: 長老的權柄與後來祭司、士師、君王職分不同，主要根植於家族和群體代表。經文也顯示領袖的聽從仍須建立在神顯現、應許與話語上，不是只因摩西的個人魅力。
  signals: []
