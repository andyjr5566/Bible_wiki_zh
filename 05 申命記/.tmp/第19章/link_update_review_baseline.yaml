- title: 殺人（ratsach）
  path: link_folder/原文/殺人（ratsach）.md
  definition: 第六誡「不可殺人」（出二十13）使用希伯來動詞 רָצַח（ratsach，H7523；經文作 לֹא תִּרְצָח，lo tirtzach），STEP
    本節直接作「murder／謀殺」。丁道爾、BH、賈斯樂郝威等再進一步把它與一般的「殺」作區分，因此認為「不可謀殺」比「不可殺人」更能表達本節重點。不過《舊約背景註釋》提醒，רָצַח
    在舊約實際語料中的用法比單一的「非法謀殺」更複雜，也可出現在誤殺等語境；因此不能只靠 STEP 的 brief lexicon 建立完整的戰爭、死刑或所有殺人行為分類。CT
    的原文字義是「謀殺，殺死」；GT《中文聖經註釋》另澄清一個常見誤讀：「原文並無人字。但殺字的含義卻是殺人，而不是如有些宗教之誡命所說：不可殺牲。」
