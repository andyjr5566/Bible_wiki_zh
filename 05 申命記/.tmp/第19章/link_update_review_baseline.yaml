- title: 申19：1-13
  path: link_folder/互文/申19：1-13.md
  definition: 申19:1-13與出埃及記第二十一章的關聯：申命記19章重申並擴展出21:13的逃城制度，規定在以色列所得為業的地中設立三座逃城，並可在約旦河東再添三座，使誤殺人者就近逃往。申命記強調逃城的目的是「使誤殺人的都可以逃到那裡存活」，體現神對生命的保護。
