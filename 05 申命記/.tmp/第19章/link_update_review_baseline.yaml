- title: 謀殺與誤殺的區分
  path: link_folder/神學/謀殺與誤殺的區分.md
  definition: 出埃及記二十一12 先立通則「打人以致打死的，必要把他治死」，13-14 兩節隨即為它劃出例外與加重。CT 把兩節對舉：13 節「意指不是蓄意謀殺對方，而是碰巧意外死在他的手中」，14
    節則「意指蓄意設下計謀殺害人命」，即使「他尋求神的庇護，也不能如願，必要治死他」。GT《丁道爾聖經註釋》認為這個區分在古代法律裡格外可貴：「這麼早就將蓄意殺人和誤殺分別處理，極是可圈可點：因為原始的血債血償，是不管兇手是否故意的。」BH
    也指出「在古代以色列的律法中，意圖是判定罪責的關鍵」。
  development: 本章只給原則，民數記三十五章與申命記十九章補上程序、地點與判準。GT《丁道爾聖經註釋》指出這種立法方式在五經中反覆出現：「這條律法和五經很多地方一樣，為當時苛刻而迅速的制裁，定下嚴格的規限。」
