- title: 立他名的居所（中央聖所）
  path: link_folder/主題/立他名的居所（中央聖所）.md
  summary: '第17節：「這兩個爭訟的人就要站在耶和華面前，和當時的祭司，並審判官面前」。STEP 顯示「爭訟」是 ha./Riv（H7379，簡要詞典義 riv: strife），「站」是 ve./''a.me.Du（H5975G，a.mad: to stand）。GT《聖經精讀本》說由此可知關於偽證罪或誣告罪的案件是由中央聖所的大法庭來審理（17:8,9）。KC 說站在祭司與審判官面前就等於把自己呈在耶和華面前，祭司在神面前要把這事帶到耶和華那裡。BH 說站在耶和華面前表明這場程序的嚴肅性，也表明神是最終的審判者與見證者。'
  relation: 本章沒有再提「耶和華所選擇的地方」這個說法，只用「站在耶和華面前」帶過；而 GT《聖經精讀本》把它認定為申17:8-9 那個上訴機構。這與申17 已經記下的第二種功能（難斷案件的終審）是同一件事，本章只是給它多加了一種案件類型。
