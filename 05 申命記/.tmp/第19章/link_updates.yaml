- title: 憑幾個見證人的口
  path: link_folder/主題/憑幾個見證人的口.md
  summary: 第15節：「人無論犯什麼罪，作什麼惡，不可憑一個人的口作見證，總要憑兩三個人的口作見證才可定案。」STEP 顯示「見證人」是 'ed／'e.Dim（H5707），「口」是 pi（H6310I），「定案」是 ya.Kum da.Var（H6965I 加 H1697G），字面是這事就立得住。CT 說『憑兩三個人的口』為防患挾仇報復，以免產生冤屈，故不可單憑一個人的話定罪。GT《申命記雷氏研讀本》說有關作見證的要求在殺人罪案裏已經詳述，這裡「引用至所有的刑事罪案」；GT《啟導本聖經申命記註釋》說這是保持司法公正的規定，法庭必須有足夠的證據才能定案，並說新約時代使徒也引用舊約的先例來解決教會內的爭執（提前五19；太十八16）；GT《聖經精讀本》說規定至少有兩名以上的證人說出一致的證詞才能使罪成立，是為了防止誣告或作偽證。KC 說新約教會處理犯罪也要照這條原則（太18:15-16），並說對在教會中擔任顯著職分的人尤其如此（提前5:19）。BH 說在書面紀錄稀少的古代近東，口頭見證至關重要，多人見證是防止誣告的保障。
  relation: 民35:30 把這條門檻定在死刑案上，申17:6 用在事奉別神的案子上；本章第15節把它推到最寬——人無論犯什麼罪，作什麼惡。同一章接著第16至21節補上偽證的罰則，等於在放寬適用範圍的同時，把濫用這條規則的代價也寫了出來。
