- title: 審判官
  path: link_folder/原文/審判官.md
  summary: '第17至18節：兩造要站在耶和華面前、和當時的祭司並審判官面前，「審判官要細細地查究」。STEP 顯示「審判官」是 ha./Sho.fe.Tim（H8199，簡要詞典義 sha.phat: to judge），「細細地查究」是 ve./da.re.Shu（H1875，da.rash: to seek）加 hei.Tev（H3190，ya.tav: be good）。CT〔原文字義〕註「細細地」美好，令人滿意、「查究」尋訪，調查，並說『細細地查究』指殷勤地追查線索，辨明真偽。GT《聖經精讀本》說由此可知關於偽證罪或誣告罪的案件是由中央聖所的大法庭來審理（17:8,9）；GT《啟導本聖經申命記註釋》說審判事宜由審判官和通曉律法的祭司辦理。KC 說審判官必須仔細查明指控，並會與祭司討論所查得的結果。BH 說審判官與祭司分別承擔民事與宗教職責，兩者在以色列社會裡是結合的。'
  relation: 申16:18 要求按城設立審判官，申17:8-13 讓他們與祭司組成終審機構；本章寫出他們在一樁具體案件裡實際要做的動作——查究。第17節同時說明層級：這不是地方城門口那一級，而是站在耶和華面前的那一級。審判官在這裡不是宣判者而是查證者，判決要等查究之後才出現。
