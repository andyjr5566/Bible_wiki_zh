- title: 謀殺與誤殺的區分
  path: link_folder/神學/謀殺與誤殺的區分.md
  summary: '第4節給出判定公式「凡素無仇恨，無心殺了人的」，第5節給出實例（同入樹林砍柴、斧頭脫了把飛落在鄰舍身上），第11至12節給出反面（恨他的鄰舍、埋伏著起來擊殺他，長老要把他從逃城帶出來）。STEP 顯示「無心」是 bi/v.li- Da.''at（H1097 加 H1847，簡要詞典義 da.at: knowledge），「素無仇恨」是 lo''- so.Ne''（H8130）接 mi./te.Mol shil.Shom（H8543 加 H8032），「斧頭脫了把」是 ve./na.Shal ha./bar.Zel（H5394，na.shal: to slip，加 H1270 iron），「埋伏」是 ve./''A.rav（H693）。CT 註『素無仇恨』指平日相處沒有恩怨糾葛、『無心殺了人的』指沒有預謀純屬意外，並說預謀殺人者即使逃到任何一座逃城也不能獲得庇護。GT《聖經精讀本》列出蒙惠的兩個條件，並說若不符合即便已藏身於逃城之內也不能受到保護；GT《串珠聖經註釋》說犯人逃入逃城後應由長老開庭審查他殺人是出於故意抑或無心。KC 說砍柴的例子讓界線變清楚——樹林誰都可以進、砍柴誰都可以做，事情不是出於預謀而純粹是意外，有了這個例子，任何類似案件都可以拿來比對評估。BH 說意圖是判定罪責的關鍵，並把它接到太5:21-22。'
  relation: 出21:12-14 立原則，民35:16-23 給凶器與宿怨的判準；本章補上兩樣前面沒有的東西——一個可以套用的公式（素無仇恨、無心），和一個可以比對的實例（斧頭脫把）。判定的人也在本章第一次被指名：本城的長老。這個區分因此從一條原則變成一套可以執行的程序。
