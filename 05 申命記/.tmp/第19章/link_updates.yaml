book: 申命記
chapter: 19
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 逃城
  path: link_folder/互文/逃城.md
  summary: '本章第1至13節是逃城制度在申命記的正式條文。第2節命令在所賜為業的地上分定三座城，第3節要求把地分為三段並預備道路，第4至6節界定受保護的條件，第8至9節給出再添三座的條件，第11至13節排除蓄意殺人者。STEP 顯示「逃」是 ya.Nus／la./Nus（H5127，簡要詞典義 nus: to flee），「分為三段」是 ve./shi.lash.Ta（H8027，sha.lash: to do three）。GT《申命記串珠聖經註釋》說設立的原因是為了保護生命，使誤殺人者可以得著安全的避難所；GT《聖經精讀本》說逃城制度是為了防止流無辜之血與報仇的惡性循環而立的社會仲裁制度，向素無仇恨地偶然殺人者提供安全藏身處。KC 說逃城是利未人與祭司的城，逃進去的人來到一個蒙福的地方，並說誤殺人者要住到大祭司死為止（民35:32），這段時間他被剝奪了享用自己產業的權利。BH 說這些城分布全地以確保任何人都到得了。'
  relation: 出21:13 只給了「一個地方」，民35 定出六座並訂下住到大祭司死為止的規則，申4:41-43 是摩西實際點名河東三座；本章補上的是河西那三座的命令，以及前面幾處沒有的兩件事——通往逃城的道路要自己修，蓄意殺人者要由長老從城裡帶出來。制度的重點因此從有沒有地方可逃，推到到得了嗎、進去了就一定安全嗎。
  overview_review:
    signals: []
    accumulation_count:
    - 3
    - 4
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 民數記:35
      - 申命記:19
- title: 申19：1-13
  path: link_folder/互文/申19：1-13.md
  summary: 本條目名稱所指的整段經文首次以主場身分被處理。第8至9節給出條件式擴充：耶和華若照向列祖所起的誓擴張境界，而百姓謹守遵行、愛耶和華、常常遵行他的道，「就要在這三座城之外，再添三座城」。GT《申命記雷氏研讀本》說這三座城從來沒有加添上去，因為以色列人並沒有佔領應許賜給亞伯拉罕的所有土地，並指大衛所征服的較大疆土不久就失去了；GT《申命記串珠聖經註釋》說即把城的數目由六座增至九座，因以色列人沒有完全佔據全迦南，故這三座外添的逃城以後並沒有記載（參書20章）；GT《啟導本聖經申命記註釋》說這件事在以色列人的歷史上沒有實現，因為他們不但未能得到整個應許之地，而且因為倒行逆施、國家分裂，遭到國破家亡的命運。KC 說那擴張本身也取決於他們對耶和華的順服。
  relation: 本章是這個條目指涉的經文所在，因此定義從一句以出21 為視角的索引式說明，改寫為這段經文自己的內容。原定義把再添的三座說成可在約旦河東再添，與本章第8至9節不合——河東三座早已由申4:41-43 分定，這裡添的三座是在境界擴張之後另加，四套來源都是這樣讀的，一併勘誤。
