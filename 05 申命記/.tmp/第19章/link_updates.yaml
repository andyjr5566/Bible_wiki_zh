- title: 以色列的長老
  path: link_folder/文化/以色列的長老.md
  summary: 第12節：「本城的長老就要打發人去，從那裡帶出他來，交在報血仇的手中，將他治死。」STEP 顯示是 zik.Nei i.R/o（H2205G 加 H5892B），字面是他那座城的長老們。CT 說『本城的長老』指那擁有審判權的官長，通常年歲較長。GT《申命記串珠聖經註釋》說犯人逃入逃城後應由長老開庭審查他殺人是出於故意抑或無心；如果是蓄意謀殺則應判死罪，把他交給報血仇的人；GT《聖經精讀本》說發生殺人案的那城長老當派人去逃城逮捕藏身其中的殺人犯，之後在城門當著眾人之面斷定殺人者是否出於蓄意。BH 說長老是群體中受敬重的領袖與決策者，負責維持公義與秩序，常在法律事務上擔任審判者。
  relation: 前面幾章的長老多半是代表——代表百姓見神、受靈、立約。本章第12節把他們寫成執法者：他們要跨出自己的城，把人從另一座城帶出來，並決定交不交給報血仇的。逃城制度能不能運作，關鍵就在這一群人身上。
