- title: 以眼還眼的適用範圍
  path: link_folder/解經爭議/以眼還眼的適用範圍.md
  summary: 第21節出現在法庭程序（第17至20節）之後，本章三家因此都特別聲明它的適用範圍。GT《聖經精讀本》說關於嚴格的同害復仇法，「這絕不是個人性的復仇方法而只是說明了由司法機關執行刑罰」，並說律法在個人性層次上強調要無限地寬容饒恕，在社會性層次上則強調為了實現公義、維持秩序及防止犯罪應當嚴格地執行法律。CT 說「這一節所定的原則是給審判官使用的，並不適用於個人的報復」，並說這種處罰犯人的態度對古時在公義與公平的審判上「的確是一種突破」，因為那時大多數國家都使用專制的方法來處罰罪人；他另指出以牙還牙並不是放縱個人報私仇（參太五38～39）。GT 收馬唐納《申命記》說這例往往被誤解為有懷恨的成分，其實不然——它不是殘酷行為的特許，而是訂定其限度，確保犯人免受酷刑。KC 說主耶穌並沒有廢掉這條報應的律法，官方的執法機關仍然完全適用，他所做的是宣告它不能用在個人恩怨上（太5:38-42）。
  relation: 本條目定義列出的三層爭議中，第一層是由法官還是由個人執行。本章給了最強的一項證據：這條原則出現的位置是法庭判決之後，對象是被查實的偽證者。三家在本章的說法完全一致，第一層爭議在這裡幾乎可以定案；第二層與第三層（照字面還是折成錢、是否適用於奴婢）本章沒有觸及。
