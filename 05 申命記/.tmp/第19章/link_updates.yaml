- title: 不可作假見證陷害人
  path: link_folder/神學/不可作假見證陷害人.md
  summary: '第16至21節是第九誡的罰則條文。第16節「若有凶惡的見證人起來，見證某人作惡」，STEP 顯示是 ''ed- cha.Mas（H5707 加 H2555，簡要詞典義 cha.mas: violence），「作惡」是 sa.Rah（H5627，sa.rah: revolt）；第18節「若見證人果然是作假見證的」是 ''ed- she.ker（H8267，she.qer: deception）；第19節「如同他想要待的」是 ka./''a.Sher za.Mam（H2161，za.mam: to plan）。CT 說神看作假見證的人是兇惡的見證人，因為作假見證是不公不義的行為，陷害無辜的人，令人含冤莫明；他並說第19節意指以其欲加之罪，將同等罪刑加在作假見證的人身上。GT《串珠聖經註釋》說「兇惡」描寫作假見證者陷害別人的陰毒心態（參詩35:11），「作惡」可指叛道反教；GT 收馬唐納《申命記》說在申命記看來假見證是一項極為嚴重的罪，應處的刑罰和被誣告的人一旦罪名成立所受的刑罰完全相等，這項極嚴厲的懲罰目的是為了防止社會上發生這一類的假見證。KC 說假見證不可不受懲罰（箴19:5,9），若指控被判定為假，起訴者就要受他原本要加給對方的刑罰。BH 說假見證威脅整個社會秩序與立約關係，並把它連到主耶穌受審時的假見證（可14:56-59）。'
  relation: 出20:16 與申5:20 立下禁令，民35:30 把見證門檻用在死刑案上；本章第一次寫出查實之後怎麼辦——待他如同他想要待的弟兄，並在第20節說明用意是讓別人聽見都害怕。誡命本身管的是不要作假見證，本章管的是作了要付出什麼代價。
  overview_review:
    signals: []
