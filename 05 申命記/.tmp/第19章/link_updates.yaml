- title: 產業（na.cha.lah）
  path: link_folder/原文/產業（na.cha.lah）.md
  summary: '第14節：「在耶和華─你神所賜你承受為業之地，不可挪移你鄰舍的地界」。STEP 顯示名詞與同源動詞在同一節連用——be./na.cha.la.te./Kha（H5159）加 tin.Chal（H5157，na.chal: to inherit）；第3節另有 yan.chi.le./Kha（H5157）指神使你承受為業。GT《聖經精讀本》說在土地登記制度尚未發達的古代社會，地界起了劃分土地所有權的作用。KC 說這一節講的不是照顧自己的產業，而是照顧鄰舍的產業。'
  relation: 民數記那幾章用這個字處理分配，申命記十八章用它說明利未支派刻意沒有分到；本章第14節出現第三種用法——不是問這一份歸誰，而是問你有沒有動到別人那一份。同一節同時用了名詞與同源動詞，把「所承受的」與「承受這件事」綁在一起。
