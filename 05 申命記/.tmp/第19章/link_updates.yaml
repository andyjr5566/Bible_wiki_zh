- title: 求問與訪問同一個字（da.rash）
  path: link_folder/原文/求問與訪問同一個字（da.rash）.md
  summary: '第18節「審判官要細細地查究」。STEP 顯示是 ve./da.re.Shu（H1875，簡要詞典義 da.rash: to seek）加 hei.Tev（H3190，ya.tav: be good）。CT〔原文字義〕註「查究」尋訪，調查，並說指殷勤地追查線索，辨明真偽。'
  relation: 這個動詞在申命記有兩種用法並行。一種是問對象：申12:5 往神所選擇的地方求問、申12:30 訪問迦南人的神、申17:9 向祭司利未人求問、申18:11 向死人求問。另一種是查事實：申13:14 探聽一則背道的傳聞、申17:4 細細地探聽。本章第18節屬於後者，而且與申17:4 是同一個片語（da.rash 加 hei.tev），差別在主詞——申17:4 是「你」自己查，本章是審判官在法庭上查。
