- title: 把那惡從你們中間除掉（ba.ar）
  path: link_folder/神學/把那惡從你們中間除掉（ba.ar）.md
  summary: '第19節「這樣，就把那惡從你們中間除掉」，STEP 顯示是 u./vi.''ar.Ta ha./Ra'' mi./kir.Be./cha（H1197I，簡要詞典義 ba.ar: to burn: purge，加 H7451B 加 H7130G），與申13:5、17:7 完全相同。第13節用同一個動詞而換了受詞：「卻要從以色列中除掉流無辜血的罪」，是 u./vi.''ar.Ta dam- ha./na.Ki（H1197I 加 H1818 加 H5355A）。CT〔原文字義〕在兩處都註「除掉」點燃，消耗。GT《啟導本聖經申命記註釋》說本書多次要求除惡，不只主張嚴懲作惡者，也要把那惡本身去除，並列出十三5、十七7、二十一21 等處。BH 說除去罪咎是為了保持群體的潔淨與立約關係。'
  relation: 這句公式在申13 用於引誘拜別神的人，申17 用於擅敢不聽判決的人；本章第19節用於作假見證的人。同一章的第13節則把同一個動詞用在一項罪咎上——流無辜血的罪，而不是一個人。要除掉的東西因此從人擴到事，這是這個公式在申命記的第三站。
