- title: 以眼還眼
  path: link_folder/神學/以眼還眼.md
  summary: 第21節：「你眼不可顧惜，要以命償命，以眼還眼，以牙還牙，以手還手，以腳還腳。」STEP 顯示五組都是同一個名詞前後對舉：Ne.fesh be./Ne.fesh（H5315H）、'A.yin be./'A.yin（H5869A）、shen be./Shen（H8127G）、yad be./Yad（H3027G）、Re.gel be./Ra.gel（H7272）。CT 說舊約的律法容許人討回公道，對別人所施的惡待可還以相等程度的報復，目的乃在阻止隨意侵犯別人，並說此處乃對作假見證的人施以同樣的懲罰；他另說這條例是審判官量刑的根據，表明在律法面前人人平等、罪罰相當，量刑不可過重也不可過輕。GT《啟導本聖經申命記註釋》說在法律面前人人平等，生命受到同樣保障，人乃按神的形像而造，此例非鼓勵復仇，所強調的乃積極愛護生命；GT《聖經精讀本》說在古代近東法律中除了舊約之外，明確論到同害復仇法的法典只有漢莫拉比法典，並說舊約只有三處論及，即本節與出21:23-25、利24:17-21。BH 說這條原則旨在防止過度處罰與私人報復，確保回應與冒犯相稱。
  relation: 這一節收在本章最後，與第13節前後呼應：兩處開頭都是「你眼不可顧惜」，STEP 顯示都是 ta.Chos 加 ei.ne./Kha（H2347 加 H5869A）。第13節不可顧惜的是蓄意殺人者，第21節不可顧惜的是作假見證的人；本章因此用同一句話把兩段條例的結尾綁在一起。它也緊接著第19節「你們就要待他如同他想要待的弟兄」，是那句話的量刑細則。
