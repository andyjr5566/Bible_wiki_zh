- title: 殺人（ratsach）
  path: link_folder/原文/殺人（ratsach）.md
  summary: '本章三次用這個字指誤殺人者（第3、4、6節），STEP 顯示是 ro.Tze.ach／ha./ro.Tze.ach（H7523，簡要詞典義 ra.tsach: to murder）。第11節寫蓄意殺人時，經文換的不是動詞而是描述——「若有人恨他的鄰舍，埋伏著起來擊殺他」，STEP 顯示「恨」是 so.Ne''（H8130，sa.ne: to hate）、「埋伏」是 ve./''A.rav（H693，a.rav: to ambush）。CT〔原文字義〕註「誤殺」非蓄意殺害、「無心(原文雙字)」缺少，沒有(首字)；意識，知識(次字)。GT《聖經精讀本》說摩西律法限制了蒙惠對象的範圍，只有在素無仇恨且完全無心的情況下才能停留在逃城。'
  relation: 本條目的定義已記下一項爭議：ratsach 是否只能譯作謀殺。本章提供了直接的語料——同一個字在第3至6節通篇指的是意外致死的人，而蓄意的那一種要靠「恨」與「埋伏」兩個另外的字來標明。這使定義裡《舊約背景註釋》的提醒得到本章的印證：這個字的用法比單一的非法謀殺更複雜。
