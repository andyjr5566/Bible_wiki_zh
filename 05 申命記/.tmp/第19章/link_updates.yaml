- title: 摩西分定河東三座逃城（ba.dal）
  path: link_folder/事件/摩西分定河東三座逃城（ba.dal）.md
  summary: '第2節「就要在耶和華─你神所賜你為業的地上分定三座城」，第7節「所以我吩咐你說，要分定三座城」。STEP 顯示「分定」是 tav.Dil（H914，簡要詞典義 ba.dal: to separate），與申4:41 摩西在河東分定三座城是同一個字。CT〔原文字義〕註「分定」分開，分別出來，並說『分定三座城』即指約但河西三座逃城（參民三十五14）。GT《啟導本聖經申命記註釋》說這之前摩西已在約但河東為兩個半支派設立了三座，六座逃城平均分配在約但河東西兩岸的北、中與南三部分；GT《聖經精讀本》說律法規定應當從分給利未人的48座城邑中特意分別出六座來作為逃城（民35:6），河東三座是比悉、基列的拉末與巴珊的哥蘭，本節吩咐設立餘下三座，據書20:7 是加利利的基低斯、示劍與基列亞巴（希伯侖）。GT《雷氏研讀本》說摩西已經在約但河東岸分出三座，這時又在西岸分出三座。'
  relation: 本條目記的是申4:41-43 那次已經完成的行動；本章用同一個動詞下的是還沒完成的命令。兩處合起來，六座逃城的設立分成兩半：河東由摩西親自做完，河西留給進地之後的百姓。GT《聖經精讀本》另補上河西三座的實際名字，使這條命令有了後續的落點。
  overview_review:
