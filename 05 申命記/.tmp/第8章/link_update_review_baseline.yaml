- title: 神的試驗
  path: link_folder/神學/神的試驗.md
  definition: '神試驗人不是因祂無知需要知道，乃是為使受試驗者顯出實際光景，更深認識自己。神的試驗（test）使人成長得益（[[申命記|申八16]]）；魔鬼的試探（temptation）則使人墮落（[[雅各書|雅一15]]）。


    聖經中神的試驗有多種形式與目的，包括考驗順服（[[創世記]]第22章亞伯拉罕獻以撒）、考驗是否遵行法度（[[出埃及記]]第16章嗎哪收取規定）、以及使人謙卑認識自己（申八2）。'
  development: 神的試驗在聖經中有多種形式：考驗順服（創22亞伯拉罕獻以撒）、考驗是否遵行法度（出16嗎哪收取）、使人謙卑認識自己（申8:2）。出17則翻轉試驗主題——不是神試驗百姓，而是百姓試探神（瑪撒）。申6:16警告「不可試探神」，來3:8-9以此為鑑戒。雅1:2-4指出試驗生忍耐，彼前1:7指出試驗使信心比金子更寶貴。
