- title: 嗎哪
  path: link_folder/主題/嗎哪.md
  definition: 嗎哪（希伯來文意源自「這是什麼呢？」）是神在曠野四十年間從天降下供應以色列人的超自然糧食。樣子像芫荽子、顏色是白的、滋味如同攙蜜的薄餅（出16:31）。每天早晨隨露水降下，以色列人各按飯量收取一俄梅珥；第六日降雙倍，第七日（安息日）則沒有。嗎哪預表耶穌基督為生命的糧（約6:31-35）。
  development: 嗎哪在舊約中被詩篇回顧為「天上的糧食」（詩78:24-25），在新約中被耶穌引用為自己的預表——「我是從天上降下來的活糧」（約6:51）。啟示錄2:17應許得勝者得「隱藏的嗎哪」。來9:4記載盛嗎哪的金罐放在法櫃中。嗎哪從曠野食物發展為基督論的核心預表。
  signals:
  - first_in_book
