- title: 你一無所缺
  path: link_folder/主題/你一無所缺.md
  definition: '申命記2:7 是本章唯一一句正面總結四十年的話：「因為耶和華─你的神在你手裡所辦的一切事上已賜福與你。你走這大曠野，他都知道了。這四十年，耶和華─你的神常與你同在，故此你一無所缺。」


    **原文的說法是「你未曾缺過一件東西」。** STEP 原文資料顯示是 lo'' cha.Sar.ta da.Var（H2637 cha.ser「to lack」＋H1697I
    davar「word: thing」）；同節的「四十年」是 ''ar.ba.''Im sha.Nah（H705＋H8141），「已賜福與你」是 be.rakh./Kha（H1288
    ba.rakh）。


    CT 給的原文字義是：「一切事」＝行為，工作；「賜福」＝祝福，屈膝；「所缺」＝缺乏，需要。CT 並解釋兩個片語：「手裡所辦的一切事」意指日常生活；「一無所缺」指供應生活所需，充分有餘。


    **這句話同時是前一節命令的前提。** 第6節叫他們用錢買糧買水，第7節說明他們付得起。KC 就是這樣讀的：儘管一路上滿了怨言與抱怨，神仍與他們同在，他們一無所缺。


    **飄流的年日怎麼定性，各家不同。** GT《聖經精讀本》把它讀成雙面的：「即使是這曠野40年的流浪期是懲罰其叛逆與不信的時期，但這並不是為懲罰，乃是磨練並養育自己百姓」。CT
    的〔話中之光〕則保留了另一面：「在外邦人看來，這是很大的賜福；但對神的兒女來說，那是曠野的熬煉，是浪費了的年月，是違背神的懲罰。神實在養活了他們⋯不過，得了普通的福，而倒斃曠野。」


    **BH 從供應讀神的看顧。** 它指出這一節說的是神在整段曠野路上的守護，如同牧人看顧羊群；並把「一無所缺」接到腓立比書4:19 神照祂的豐富供應一切所需。'
