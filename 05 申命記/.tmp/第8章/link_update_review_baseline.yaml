- title: 為奴之家
  path: link_folder/主題/為奴之家.md
  definition: 出13:3「你們要紀念從埃及為奴之家出來的這日」，第14節父親答覆兒子時再說一次：「耶和華用大能的手將我們從埃及為奴之家領出來。」CT
    給的原文字義是：「為奴」＝奴隸、僕人；「家」＝房屋、地方、家族、家庭。CT 並說明這是在指什麼地方：「『埃及為奴之家』指埃及地是以色列人在彼被奴役作苦工的地方」。
  development: '**這是一個會沿用下去的稱呼。** GT《聖經精讀本》指出這四個字後來成了埃及的別稱：「對埃及的別稱，以後常常使用（20:2；申5:6；6:12）。其目的在於讓以色列百姓紀念在埃及悲慘的生活，並感謝神的救贖之恩。」十誡的開場白（出20:2）用的正是同一句話。


    **它與「這日」是綁在一起的。** 第3節的命令不是「紀念埃及」，是「紀念從埃及為奴之家出來的這日」。CT 指出「紀念」的意思是「遵照條例行事，對當日所發生的事不敢或忘」，而「這日」指的是出來的頭一日，也就是正月十五日。GT《中文聖經註釋》說明整段（第3-10節）的用意就在這裡：「藉這機會教育兒女有關神的大能和揀選他們的恩慈。」


    **BH 讀出的是一個對照。** 埃及被稱作「奴役之家」，強調的是以色列人所受的苛待與壓迫，而這句話所標誌的是「從捆綁到自由」的轉變。CT 的話中之光把它接到讀者身上：「我們在蒙恩得救之前，原來是在這世界的王手下被奴役的奴僕，如今已經被釋放出來得著自由了，千萬不要再受罪惡的轄制了。」


    **KC 指出脫離不是終點。** KC 說百姓被提醒守這節期，是在耶和華已經成就的救贖這個場合上；神每次講到祂與百姓的關係，都一再回到那次拯救。祂救他們出來，不是要他們為自己活，是要他們為那位拯救他們的活。'
  signals: []
  accumulation_count:
  - 3
  - 4
- title: 出埃及
  path: link_folder/歷史/出埃及.md
  definition: 出埃及記12:37-42 所記載以色列人從埃及起行的歷史事件——從蘭塞起行往疏割、除了婦人孩子步行的男人約有六十萬、許多閒雜人並羊群牛群同行、用埃及帶出的生麵烤成無酵餅、住在埃及共430年、正滿430年那天耶和華的軍隊從埃及地出來、這夜是耶和華的夜。BH
    指出六十萬指的是步行的男丁，很可能是壯年可上陣的人，連婦人孩子在內總數約二百萬。CT 指出第37節的六十萬「是個約數」，並把第41節的「正滿了」讀作「似乎有意強調連一天也不提早也不延遲」；第37節從蘭塞起行則呼應出1:11——以色列人曾在那裡為法老建造積貨城。
