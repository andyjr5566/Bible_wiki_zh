- title: 「記念」與「守」
  path: link_folder/原文/「記念」與「守」.md
  definition: 第四誡在出埃及記二十章8節用「記念」זָכוֹר（zakhor，H2142）作誡命開頭，CT 的原文字義給「記得，回想」，文意註解另說『紀念』意指「不敢或忘」；申命記五章12節則改用「守」שָׁמוֹר（shamor，H8104），撒瑪利亞抄本在出二十8
    也作「守」（GT《中文聖經註釋》：「記念一詞，撒瑪利亞抄本則是『守』」）。相關註釋因此把兩者看成互補：不只是記得安息日，也要實際守住它。
  development: '申命記第5章補上了這組異文的另一半實據。申5:12 確實作「守」——STEP 顯示誡命起頭的動詞是 sha.Mor（H8104G，簡要詞典義
    to keep），與出20:8 的 zakhor 是兩個不同的字。


    值得注意的是「記念」並沒有從申命記的第四誡裡消失，它換了受詞。申5:15 的「你也要記念你在埃及地作過奴僕」用的是 ve./za.khar.Ta（H2142，za.khar）——同一個字根，記的卻不是安息日，而是為奴的日子。GT
    引艾基斯在處理兩處十誡差異時正好點到這件事：摩西在守安息日的誡命裡沒有提及神在六日內的創造之工，卻插入了記念從埃及為奴之家出來的內容，而以色列人聽了這句話，「更會出於恩慈地記念他們社會中的低下階層」。


