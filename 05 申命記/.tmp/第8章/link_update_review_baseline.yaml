- title: 神的供應
  path: link_folder/主題/神的供應.md
  definition: 神的供應（God's provision）指神在曠野旅程中對以色列人物質需求的超自然滿足——包括從天降下嗎哪作糧食、差遣鵪鶉作肉食、使苦水變甜、賜下十二股水泉等。神的供應原則是：按時、按需、不可囤積、每日倚靠。這原則在新約中延伸為「日用的飲食今日賜給我們」（太6:11）。
