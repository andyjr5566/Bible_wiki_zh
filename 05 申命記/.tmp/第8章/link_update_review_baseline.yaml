- title: 律例（choq）
  path: link_folder/原文/律例（choq）.md
  definition: '申命記第四章從第1節就把「律例」擺在最前面：「以色列人哪，現在我所教訓你們的律例典章，你們要聽從遵行」。這個詞在本章出現在第1、5、6、8、14、40、45節，是全章的骨架。


    STEP 原文資料顯示，本章的「律例」是 chu.Kim（複數，H2706G），簡要詞典義 statute: decree；第40節與「誡命」並列時仍是同一個字根。


    **三家對這個字的界定。**


    | 來源 | 說法 |

    |---|---|

    | CT〔原文字義〕 | 「律例」法規，法令，條例 |

    | GT《串珠聖經註釋》 | 「律例」：專指一些永久性的列寫出來的行為規範。 |

    | BH | 「"Statutes" often denote permanent laws, while "ordinances" can refer to
    specific regulations or judgments.」（「律例」通常指常設的法律，「典章」則可指特定的規範或判決。） |


    三家的共通點都落在同一件事上：律例是常設的、寫定的、不隨情況更動的。CT 在文意註解裡把它與典章配成一組：「『律例』指律法，是神向人的要求；『典章』指審判，是神對人是否遵行律法的判定」。


    **它與十誡的分工。** CT 在第14節說明得最清楚：律例典章與十條誡不同，「十條誡是神親自頒佈的基本原則法令，猶如憲法；律例典章是神通過摩西所頒佈的細則法令」。


    **GT 提醒不要分得太死。** GT《聖經精讀本》指出「聖經混用了律例與典章（王上8:58；詩119:12-16），難以進行嚴謹的區分。故律例與典章當被理解為是相互強調『所有律法與教訓』的重複手法」。'
  development: '申命記第5章把這個詞的來源路線補齊了。申4 的律例是摩西教訓百姓的內容——「現在我所教訓你們的律例典章，你們要聽從遵行」；申5:31
    則往上追一層，寫出它怎麼到摩西手上：神打發百姓回帳棚之後對摩西說「至於你，可以站在我這裡，我要將一切誡命、律例、典章傳給你；你要教訓他們」。


    兩章合起來是一條完整的鏈：神交給摩西，摩西教訓百姓，百姓謹守遵行。申5:1 與 5:32 是百姓那一端的責任，5:31 是這條鏈的上游，而 5:22 說明了為什麼需要這條鏈——十誡是神親口對全會眾說的，此外並沒有添別的話，其餘的律例典章則藉中保轉達。GT《聖經精讀本》在申5:31
    對三個詞的關係下了一句判斷：「『律例和典章』則重複說明了『誡命』這一詞的含意」，與它在申4 提醒「聖經混用了律例與典章…難以進行嚴謹的區分」是同一個方向。'
