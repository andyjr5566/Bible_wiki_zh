- title: 火蛇（saraph）
  path: link_folder/原文/火蛇（saraph）.md
  definition: 希伯來文 saraph（שָׂרָף），詞根意為「燃燒」，指「燃燒者」或「火蛇」。民數記 21:6 耶和華使火蛇進入百姓中間咬人，許多以色列人死亡。該詞亦見於以賽亞書
    14:29、30:6 形容飛行的火蛇。「火」可能指毒液灼燒感、蛇體顏色，或作為神審判烈怒的隱喻。
  development: 從具體毒蛇物種延伸為神審判工具的神學象徵，後在先知書作為威脅意象再現。
