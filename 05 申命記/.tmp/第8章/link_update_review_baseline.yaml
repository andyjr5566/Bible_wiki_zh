- title: 磐石出水
  path: link_folder/事件/磐石出水.md
  definition: 磐石出水（出17:1-7）是神在利非訂藉摩西擊打何烈的磐石使水流出的神蹟。百姓缺水與摩西爭鬧（v1-3），摩西呼求耶和華（v4），神吩咐他拿先前擊打河水的杖、帶幾個長老從百姓面前走過去（v5），在何烈的磐石那裡擊打，水就流出來（v6），摩西給那地方起名叫瑪撒和米利巴（v7）。GT《中文聖經註釋》總結這一段的走向：「每次有人的怨言，就必有神的作為……這裏給我們看到的，是神的慈愛和恩典再次的彰顯。」
  development: '**神蹟，還是被神使用的自然現象？** CT 把兩種可能都留著：「這是具有屬靈意義的神蹟奇事，神可以使乾而硬的磐石流出水來；不過，神也可以利用自然環境，使乾河床下面豐富的水源經過中空的巨石而湧流出來。」GT《舊約聖經背景註釋》給了自然解釋的機制，卻同時指出它的難處：「沉積岩在石面底下，有時有可以聚水的囊穴。石上滲水出顯示水囊的存在，擊打石面就能放出裡面積存的水。但和上述的事件一樣，水量之多是這種理論無法解釋的。」


    **「那塊磐石」還是「一塊磐石」。** GT《丁道爾聖經註釋》從冠詞入手：「依照閃族語文的慣例，磐石一字附有定冠詞，因為所指的是『這』塊石頭；然而照英文文法，同樣情況下應使用不定冠詞。但德萊維則認為這詞意指全座山巖，而非一塊巖石。」它並指出「本節譯作『磐石』的希伯來字，和民數記二十章所用的字眼不同」。


    **後世的回顧。** 丁良才把舊約引用這件事的經文列了出來：民20:8-11、詩78:15-16、20、詩105:41、詩114:8、賽48:21；KC 也引詩78:15-16與詩114:8。丁良才另附一組對照：「聖書中記磐石所出的有四：（一）磐石出水（出十七6）；（二）磐石出火（士六21）；（三）磐石出蜜（詩八十一16）；（四）磐石出油（申三十二13）。」'
