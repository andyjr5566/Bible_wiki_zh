- title: 得福（ya.tav）
  path: link_folder/原文/得福（ya.tav）.md
  definition: '申命記第五章有三個地方用了同一個動詞 ya.tav，中文卻譯成兩種完全不同的說法。第16節孝敬父母「使你得福」，第29節神願百姓和子孫「永遠得福」，這兩處都好懂；第28節神評論百姓的請求說「他們所說的都是」，用的也是這個字。


    STEP 把三處列在一起：第16節 Yi.tav、第28節 hei.Ti.vu、第29節 yi.Tav，全是 H3190，簡要詞典義 be good。第28節是使役語幹，STEP
    給的本節譯義是 they have done well。


    CT 的原文字義在兩個地方分別給了這個字，而且對得上：第16節「得福」美好，歡喜；第28節「都是」美好，喜歡，令人滿意。把兩條並起來看，第28節神說的不是「他們講對了」這種判分數的話，而是「他們這樣講很好」。


    **第33節換了另一個字。** 同樣譯成「得福」，第33節「使你們可以存活得福」在 STEP 是 ve./Tov（H2895，簡要詞典義 be pleasing），與前三處的
    H3190 不是同一個編號，雖然字義方向相同。中文把四處都寫成得福或都是，原文分成兩組。


    **這個字把賞賜和評語連在一起。** 第16節的「得福」是誡命本身附帶的應許，CT 稱它是十誡中唯一可得福分的應許；第29節是神自己說出來的心願，KC 讀成神的心向著祂的百姓，切望他們持續的福樂，而這福樂只在遵行祂的話裡找得到。BH
    在第16節說得更平實：這一段把順服和安康連了起來，暗示家庭裡的敬重與社會的和諧、個人的興旺相關；在第29節則指出，順服所帶來的安康在申命記裡是整個國家的事，涵蓋興盛、平安與保護。'
  development: '**兩章重複同一個模式：H3190 講應許，另一個字補在旁邊。** 申5 有三處 H3190——第16節孝敬父母「使你得福」、第28節神說百姓所說的「都是」、第29節願他們和子孫「永遠得福」——而第33節的「得福」換成了
    H2895。申6 的分布幾乎一樣：第3節「得以享福」與第18節「使你可以享福」同為 H3190，第24節的「常得好處」則換成 H2896B。


    也就是說，這兩章都不是只用一個字在講「好」。中文把四五個位置一律寫成得福、享福或好處，原文卻在 ya.tav 與 tov 兩組之間交替，而交替的位置又相當固定：帶條件的應許句多半落在
    H3190，收尾的總結句則常換成 tov 那一組。


    兩章合起來還看得出這個字的另一個特點——它不只用在賞賜上。申5:28 神評論百姓的請求用的也是這個字，CT 在那裡給的中文是「美好，喜歡，令人滿意」。所以
    ya.tav 在申命記裡既是神應許給人的東西，也是神對人所說之話的評語；申6:3 與18節的兩次應許，和申5:28 那句評語，用的是同一個詞。'
