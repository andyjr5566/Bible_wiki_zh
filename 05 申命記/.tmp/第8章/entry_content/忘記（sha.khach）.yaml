name: 忘記（sha.khach）
type: 原文
secondary_types: [神學]
aliases: [忘記]
status: formal
definition: >-
  「忘記」是申命記第8章後半的關鍵詞，第11、14、19節都出現，其中第19節連著寫了兩次。STEP 顯示這幾處都是 H7911，詞元是 שָׁכַח（sha.khach），簡要詞典義寫作
  to forget：第11節作 tish.Kach（HVqi2ms），第14節作 ve./sha.khach.Ta（Hc/Vqq2ms），第19節則把同一個字連著寫兩次——前一個標為
  HVqaa，後一個標為 HVqi2ms，本節譯義是 certainly [if] <to forget> 與 you will forget，和合本譯作「你若忘記」。


  CT 的〔原文字義〕在第11與14節都給「停止關心，不記得」。這個中文說法點出了希伯來文這個字的份量：它不只是記憶力的問題。BH
  說得更直接，忘記神意味著蓄意忽略他的誡命、不承認他的主權與供應，不是記性一時失誤，而是離開了立約的關係。


  本章把「忘記」放進一個很具體的處境。CT 在第11節指出，若不謹慎，便會忘記神，從而不守他的話——三個動作是連著的。第12到14節接著把這條路寫得更細：吃得飽足、建造美好的房屋、牛羊加多、金銀增添、所有的全都加增，然後心高氣傲，然後忘記耶和華。列出來的沒有一樣是壞事，危險藏在後面。


  GT《申命記串珠聖經註釋》把11到20節整段的主旨概括為選民不可驕傲而忘記神，摩西一再提醒百姓，他們所擁有的一切都是神的恩賜。KC
  在同一段說摩西再次敲響警鐘，要人記得耶和華，並指出人會驕傲，正是因為忘了自己本是失喪的、忘了神怎樣救了自己、忘了一路上是誰在供應。第19節把後果講到底：忘記之後就是隨從別神、事奉敬拜，接著是滅亡。
accumulations:
  - book: 申命記
    chapter: 8
    summary: >-
      第11、14、19節三次警告忘記耶和華，STEP 皆為 H7911（sha.khach，簡要詞典義 to
      forget）；第19節以 HVqaa 加 HVqi2ms 的連寫形式出現，本節譯義是 certainly [if] <to forget> /
      you will forget。CT 的〔原文字義〕給「停止關心，不記得」，並指出不謹慎就會忘記、忘記就不守神的話。
    relation: >-
      本章後半的警告都繞著這個字轉：飽足、房屋、牛羊、金銀之後是心高氣傲，心高氣傲之後是忘記，忘記之後是隨從別神與滅亡。它與本章前半反覆出現的「記念」正好相對。
