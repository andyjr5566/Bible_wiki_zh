- title: 你一無所缺
  path: link_folder/主題/你一無所缺.md
  summary: 第9節說在美地「你在那地不缺食物，一無所缺」；STEP 原文資料的動詞是 tech.Sar（H2637，cha.ser，簡要詞典義 to lack），與申2:7 的「一無所缺」同一個字根；同節的「不缺食物」另用 ve./mis.ke.Nut（H4544，簡要詞典義 poverty）。BH 說這句保證強調神完全的供應與看顧。
  relation: 申2:7 講的是四十年曠野裡的一無所缺，本章講的是進地之後的一無所缺；同一個承諾跨過兩種完全相反的環境。
