- title: 火蛇（saraph）
  path: link_folder/原文/火蛇（saraph）.md
  summary: 第15節把火蛇列為曠野的危險之一；STEP 原文資料作 na.Chash sa.Raf（H5175 與 H8314A 並列）。GT《啟導本聖經申命記註釋》說「火蛇」可能因人被此蛇咬後炎腫似火而得名，並指民21:6 提到此種毒蛇；GT《聖經精讀本》說此蛇帶有巨毒，被咬會感到如火燒般的痛苦，並推測似乎是指常見於古代近東沙漠的角蝰。BH 也把毒蛇與蠍子並列為沙漠中真實的威脅。
  relation: 民21 記的是火蛇作為審判工具進入營中，本章則把牠列進神領百姓走過的環境本身，重點從審判轉到神的保守。
  overview_review:
