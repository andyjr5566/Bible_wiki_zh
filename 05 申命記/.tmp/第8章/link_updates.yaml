  path: link_folder/事件/磐石出水.md
  summary: 第15節回顧神「曾為你使水從堅硬的磐石中流出來」；STEP 原文資料作 mi./Tzur（H6697H）配 Ha./cha.la.Mish（H2496，簡要詞典義 flint），CT 的原文字義給「堅硬」是打火石。GT《啟導本聖經申命記註釋》指出這是出17:6 及民20:8 所記擊打出水的磐石，但那兩處沒有「堅硬」字樣；GT《申命記串珠聖經註釋》說神為選民曾兩次叫磐石出水，第一次在何烈山（出17:6），另一次在加低斯（民20:8）。
  relation: 本章把兩次磐石出水收成一句回顧，並加上「堅硬」這個原出處都沒有的形容，強調水是從打火石般的岩石裡出來的。
