- title: 人若遵行律例典章就必因此活著
  path: link_folder/神學/人若遵行律例典章就必因此活著.md
  summary: 第1節把謹守遵行一切誡命與「好叫你們存活，人數增多，且進去得耶和華向你們列祖起誓應許的那地」接在一起。GT《聖經精讀本》說得最直接：「謹守遵行神的誡命，這並不單單是祝福的問題，乃是關乎生死的問題」，並指上一代因不順服而在曠野四十年間被除滅淨盡就是活生生的證明。CT 也提醒本節有三個步驟：存活、人數增多、進去。
  relation: 利18 給的是原則，申6 把它放進進地前的講章，本章再加上一個反面證明——上一代確實沒有活著進去。
