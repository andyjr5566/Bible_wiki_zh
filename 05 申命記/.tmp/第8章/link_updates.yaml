- title: 神賜福賜財富能力 (申8-18)
  path: link_folder/互文/神賜福賜財富能力 (申8-18).md
  summary: 本章第18節就是這個條目的出處經文：「你要記念耶和華─你的神，因為得貨財的力量是他給你的，為要堅定他向你列祖起誓所立的約，像今日一樣。」STEP 原文資料顯示「力量」是 Ko.ach（H3581B），「得」是 la./'a.Sot（H6213I，本節譯義 to acquire），「貨財」是 Cha.yil（H2428H）。GT《聖經精讀本》指出這意味著所有財物都是神的，人只是管理那些財物的管家；BH 引代上29:12 說財富與尊榮都出於神。
  relation: 創33 是這節在雅各身上的活出，本章是它被說出來的地方；第17節先寫出人心裡的自誇，第18節才給出正解。
