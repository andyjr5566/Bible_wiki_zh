- title: 以色列啊你要聽（sha.ma）
  path: link_folder/原文/以色列啊你要聽（sha.ma）.md
  summary: '第20節把滅亡的原因定在「不聽從耶和華─你們神的話」；STEP 原文資料作 tish.me.''U/n（H8085H，簡要詞典義 to hear: obey）配 be./Kol（H6963A，voice）。CT 的原文字義給「話」是聲音，文意註解把「聽從」解作順從，「不聽從」就是不遵照神的話去行。'
  relation: 申5 用這個字召集會眾，申6 把它變成每天都要說的話，本章則第一次用它的否定式——不聽從就是滅亡的理由。
