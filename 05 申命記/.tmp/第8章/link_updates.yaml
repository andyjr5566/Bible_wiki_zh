- title: 神的供應
  path: link_folder/主題/神的供應.md
  summary: 本章把曠野的供應列成一串：第3節的嗎哪、第4節「你的衣服沒有穿破，你的腳也沒有腫」、第15節從堅硬磐石流出的水、第16節再一次的嗎哪。GT《申命記雷氏研讀本》推測衣服的供應也許部分透過與其它人交換物品、部分是神奇妙地賜予（比較申29:5）；CT 說第4節形容不缺衣受寒、也不赤腳受磨，表示神的看顧無微不至。
  relation: 出16 記的是嗎哪供應的制度，本章把四十年的供應整批收攏，並指出供應的目的是叫人知道人活著不是單靠食物。
