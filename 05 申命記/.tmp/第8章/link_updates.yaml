- title: 曠野飄流四十年
  path: link_folder/歷史/曠野飄流四十年.md
  summary: 第2至5節與第14至16節兩度回顧這四十年，並第一次正面給出目的：苦煉、試驗、要知道人心內如何，最終是叫人終久享福。第4節記下兩個細節——衣服沒有穿破、腳也沒有腫。CT 把試煉的目的整理成四項：顯明存心是否肯守神的誡命、學會活著靠神口裡所出的一切話、父神的管教使人得益處、叫人終久享福。GT《申命記串珠聖經註釋》說這段流浪的日子是以色列民一種謙卑的經驗，好使他們學會順服和感恩。
  relation: 民14 記的是四十年的判決，申1 至申2 記的是走完這段路的長度與結果，本章則第一次說明神為什麼要讓這一代這樣走。
  overview_review:
    signals:
