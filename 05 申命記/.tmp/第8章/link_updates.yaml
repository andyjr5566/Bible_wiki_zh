- title: 申8：3 人活著不是單靠食物
  path: link_folder/互文/申8：3 人活著不是單靠食物.md
  summary: '本章第3節就是這個條目的出處經文。STEP 原文資料顯示「人活著」兩次都是 yich.Yeh（H2421）配 ha./''a.Dam（H120G），「食物」是 ha./Le.chem（H3899H，簡要詞典義 food: bread），「口裡所出的」是 mo.Tza''（H4161）配 fi-（H6310G）。CT 說主耶穌曾引用這句話來對付魔鬼（太4:4），暗示正如食物可維持肉身的性命，神口裡所出的一切話是維持靈命不可或缺之物；GT《聖經精讀本》補充這句話並不單與屬靈生命相關，也與肉體的生命相關——即使沒有糧食，只要神願意，也能用嗎哪等方式維持人的生命。'
  relation: 出16 是這節的背景事件，本章是它被說出來的地方；摩西在這裡把四十年的嗎哪經歷總結成一句可以帶進美地的話。
