- title: 遵行
  path: link_folder/原文/遵行.md
  summary: 第1節「謹守遵行」與第6節「遵行他的道」。STEP 原文資料在第1節作 tish.me.Ru/n（H8104J）配 la./'a.Sot（H6213A，本節譯義 to observe），第6節則作 la./Le.khet（H1980I，by walking）配 bi/d.ra.Kha/v（H1870G，ways）。CT 分辨第1節的兩個動作：「謹守」重在指思想觀念的贊同和一致，「遵行」重在指行為上的遵照和實施。
  relation: 本章把遵行放在兩個不同的位置：第1節接著「好叫你們存活」，第6節接著敬畏；同一個要求既關乎存活，也關乎與神的關係。
