- title: 「記念」與「守」
  path: link_folder/原文/「記念」與「守」.md
  summary: 本章把這一對字用在整篇講章的骨架上：第2、18節兩次「記念」（STEP 原文資料為 H2142，za.khar），第1、2、6、11節的「謹守／守／謹慎」則都是 H8104（sha.mar）。CT 在第11節註明「守」在原文和「謹慎」是同一個字。
