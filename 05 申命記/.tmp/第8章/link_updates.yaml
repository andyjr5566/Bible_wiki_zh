- title: 得福（ya.tav）
  path: link_folder/原文/得福（ya.tav）.md
  summary: 第16節「叫你終久享福」STEP 原文資料作 le./hei.tiv./Kha（H3190，ya.tav）配 be./'a.cha.ri.Te./kha（H319，簡要詞典義 end）。GT《聖經精讀本》說這是神藉著許多逆境試驗聖徒的目的，與起初以甜美話語誘惑、終久卻使人滅亡的撒但之作為有本質上的區別。
  relation: 申5 與申6 把這個字用在誡命的應許上，本章則把它放在四十年苦煉的終點——同一個字從遵行就得福延伸成受過管教之後終久得福。
