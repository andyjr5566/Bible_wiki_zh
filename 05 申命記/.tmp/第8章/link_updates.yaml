- title: 神的試驗
  path: link_folder/神學/神的試驗.md
  summary: 第2節與第16節兩次說曠野四十年是要試驗以色列；STEP 原文資料為 H5254G（na.sah）。GT《聖經精讀本》分辨這不是出於惡意使人掉進陷阱的試探，而是為了使人領悟真理並最終得到祝福的善意考試；GT《啟導本聖經申命記註釋》提醒「這裡不是說神不知道他們的內心」，這裡的知道「是指人的道德情操經過考驗之後所顯出的真情況」。
  relation: 本章把試驗的目的寫得最完整：顯明人心、教人靠神的話而活，並在第16節收在叫人終久享福。
  overview_review:
