- title: 苦難與管教
  path: link_folder/神學/苦難與管教.md
  summary: 第5節以父子關係定位神在曠野的作為：「耶和華─你神管教你，好像人管教兒子一樣」；STEP 原文資料為 H3256（ya.sar）。GT《申命記串珠聖經註釋》說管教「意即訓誨和責備」，並說管教通常意味著對受教者的殷切期望；GT《聖經精讀本》稱之為以為父之心加諸的愛的鞭打，並引來12:5-11。CT 說這是有積極用意的責備和訓誡，雖有忿怒的懲罰，卻不是出於恨的動機。KC 與 BH 同樣連到來12。
  relation: 本章把整整四十年的艱苦統攝在「管教」一個詞底下，並說明管教的目的是使人得益處、終久享福。
