- title: 太4：1-11 耶穌在曠野受試探引用申命記
  path: link_folder/互文/太4：1-11 耶穌在曠野受試探引用申命記.md
  summary: 本章第3節是耶穌三次引用申命記中的一次，四家都指出這個引用：CT 說主耶穌曾引用這句話來對付魔鬼；GT《申命記雷氏研讀本》說耶穌面對魔鬼試探的時候引述本節的下半節（太四4）；GT《聖經精讀本》說基督因飢餓受撒但誘惑之時正是用這句話來回答的（太4:4；路4:4）；KC 說主耶穌知道神並沒有把石頭給人作食物，父不必行神蹟也能供給他（太4:3-4）。
  relation: 申6:13 與申6:16 出自摩西講章的另一段，本章第3節補上第三處引用，也就是耶穌回應第一個試探時所用的那一句。
