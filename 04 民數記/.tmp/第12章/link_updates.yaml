book: "民數記"
chapter: 12
updates:
  - title: "米利暗"
    path: "link_folder/人物/米利暗.md"
    summary: "身為早期希伯來讚美詩領隊與以色列三大領袖之一的女先知米利暗，於哈洗錄宿場結合兄弟亞倫借古實女子名義指責摩西神職唯一性；其傲行惹來會幕智榮烈雲嚴懲，長大痲瘋白徹如雪，幸賴弟弟流淚哀祈而以關鎖營外七天的隔離代價換得神潔赦免。"
    relation: "嚴肅警戒基督聖徒與屬神群隊領導者：即便是神所重用起創大局的核心前賢，亦無逃脫於狂妄驕傲心靈審察與口舌相殺之天威法則；身歷罪殃必須順受悔心沉息打擊方復天賜恩榮。"
  - title: "先知"
    path: "link_folder/主題/先知.md"
    summary: "耶和華在會幕雲柱中清楚界說先知啟示的分屬品級：對天下般般普眾先知，上帝乃採幽隱之夜間夢兆與靈明之象徵性異象授出微詞，絕無類同時處面對面深吐清辭的大職明禮。"
    relation: "樹立聖言傳統至關重要的啟示規範論述：領得暗隱夢境與零散靈示恩寵並不必代表其人能與至上聖約的忠信主幹使首分取對等榮光或謀取統治大命。"
  - title: "大痲瘋（tsara'at，皮膚病診斷條例）"
    path: "link_folder/原文/大痲瘋（tsara'at，皮膚病診斷條例）.md"
    summary: "米利暗因狂口批判上帝任命的首席中保摩西，在會幕神殿上遭榮耀威氣挪散之後，肉首即時顯然迸降大痲瘋災惡，「白徹如雪、體容猶若母胎暴死未完腐殘之相」，成神威立降極速體罪標記。"
    relation: "強力印見 tsara'at 傳染惡癬於古代社會除了生理災染，極度帶有作為神上帝公判背約、驕狂僭上及狂言犯罪者即時詛棄懲擊的神聖判宣意義。"
  - title: "大痲瘋是否等同於罪的懲罰之爭"
    path: "link_folder/解經爭議/大痲瘋是否等同於罪的懲罰之爭.md"
    summary: "民數記十二10記載神大震暴怒拋去、米利暗瞬間全身被雪白大痲瘋覆沒的血紅事實，成為解讀經海中主張大痲瘋屢屢象徵天上譴惡抗訴大科的核心佐鐵定證。"
    relation: "向雙軌神學研經派別指出明光：雖然非遍世疾患全起自直接個人違忤，但在關涉進犯默約靈柄與狂譭至死的大逆風口，神確常運用斯瘟作直接現行斷代之神法刑印。"
  - title: "患痲瘋者的哀悼記號（獨居營外）"
    path: "link_folder/主題/患痲瘋者的哀悼記號（獨居營外）.md"
    summary: "面對大祭司亞倫與摩西懇情乞恕醫宥的急呼，天君裁決縱宥命亦需重守聖體隔約——如父親投唾臉龐苦辱七夕，令女首依然嚴格遭到關鎖隔離於全軍邊城界野七天之後，方可由眾民護行收帶迎歸陣屋。"
    relation: "展布聖約之法高度超然公允的高尚極點：至頂偉望或女領首階，遇染災不潔亦無法取越或輕忽任何一樁避忌隔離的潔身聖則；全民同住等待更彰顥群眾共荷神義的集體關愛與承責。"
  - title: "哈洗錄"
    path: "link_folder/地點/哈洗錄.md"
    summary: "作為以色列前進至綠牆庇宅定居的首座避地，哈洗錄見證了這起兄嫂譭責摩西並降痲瘋禍禍、全國七天暫息不肯發動腳步耐心陪伴元老療雪還光的沉鬱沉思古史。"
    relation: "詮陳生命憩止驛所的另面奧妙：休息庇護地哈洗錄常常也是人靈卸防、家族妒意翻騰露隙而遭受極嚴煉淨打磨的深重考場；歷盡潔罪隔離、大兵隊旗方可再向新途奔騁。"
  - title: "巴蘭的曠野"
    path: "link_folder/地點/巴蘭的曠野.md"
    summary: "待米利暗盡渡七天關營外雪恥醫平神禮重生，百萬選族隊武再起精神離開哈洗錄宿宅，盛大進入無際浩漢的高嶺荒塞——巴蘭的曠野紮建主營，直奔遣探前線。"
    relation: "將上帝大隊引至前途歷史轉捩的核心關口：歷經領導群隊爭鋒止風以及潔淨同治休正，團隊乃克以堅新信仰向無涯荒嶺扎陣，預備叩打迦南命脈的新一刻天門。"
