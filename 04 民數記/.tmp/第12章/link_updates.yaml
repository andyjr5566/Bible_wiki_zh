book: 04 民數記
chapter: 12
updates:
- title: 米利暗
  path: link_folder/人物/米利暗.md
  summary: 第1節她的名字排在亞倫之前，第10節長大痲瘋的只有她，第15節全營為她停了七天。GT 丁良才說明她的身分與份量：「米利暗是女先知，又是摩西的姐姐（出十五20-21，彌六4），所以她在以色列的婦女中最出名。」GT 李道生《舊約聖經問題總解(上)》另給了她名字的字義：「米利暗Miriam（意背叛）。」
  relation: 本章是米利暗在聖經中戲份最重、也最不堪的一章。KC 引彌迦書把她與摩西、亞倫並列為神所差的三個人：「我曾將你從埃及地領出來，從作奴僕之家救贖你，我也差遣摩西、亞倫和米利暗在你前面行」（彌6:4）——正因為她本來就有神所給的地位，第2節那句「難道耶和華單與摩西說話」才更嚴重。CT 在〔靈意註解〕點出這場衝突的層級：「米利暗是女先知，亞倫是大祭司，他們兩人代表以色列宗教信仰中的兩大力量。」她受罰之重，也對得起這個份量——GT 丁良才：「可見尊貴的人也必因罪受罰。」
- title: 先知
  path: link_folder/主題/先知.md
  summary: 第6節是神對「先知」這個職分最直接的定義：「你們中間若有先知，我耶和華必在異象中向他顯現，在夢中與他說話。」STEP 原文資料顯示「先知」是 ne.Vi.'a./Khem（H5030，詞典形 na.vi，詞典義 prophet），「異象」是 mar.'Ah（H4759A），「夢」是 cha.Lom（H2472）。
  relation: 前一章摩西才說「惟願耶和華的百姓都受感說話」，本章神就把先知的位置與摩西的位置分開。GT《舊約聖經背景註釋》指出這種職分在當時並不特殊：「這時期古代近東已經有根深蒂固的先知制度。如經文所述，異夢和異象是慣常的啟示方式。」它並舉出馬里城「有五十多個文獻，記載當地官員向馬里王心利林（Zimri-Lim）稟報先知的言語」，然後指出差別所在：「異夢和異象經常使用象徵，需要詮釋。但要明白神對摩西的啟示，卻不用破解這種謎語。」
- title: 大痲瘋（sara'at）
  path: link_folder/原文/大痲瘋（sara'at）.md
  summary: 第10節：「雲彩從會幕上挪開了，不料，米利暗長了大痲瘋，有雪那樣白。」STEP 原文資料顯示這裡用的是動詞形式 me.tzo.Ra.'at（H6879，詞典形 tsa.ra，詞典義 be leprous），Pual 分詞陰性——與利13:45 講患者本人時用的是同一個字。GT 丁良才指出這病在刑罰序列中的位置：「除死以外，長大麻風就是最大的刑罰。」
  relation: 本章給了這個詞一個利未記沒有的用法：它不是體檢結果，而是當場降下的審判。GT《舊約聖經背景註釋》從症狀反推它不是漢森氏病：「在古代近東，漢森氏病（現代痲瘋病的名稱）要到亞歷山大大帝時代，才有發生的記錄。本段和舊約其他地方所形容的皮膚病，比較接近牛皮癬或濕疹。第12節將之比作死胎，進一步證實這診斷。因為這象喻所形容的是皮膚剝脫，不是組織壞死，後者才是漢森氏病的症狀。夭折胎兒的膚色由紅轉棕灰，接著皮膚開始脫落。」也就是說，第12節亞倫那句「肉已半爛的死胎」本身就是一條診斷線索。GT 丁良才另指出亞倫的角色轉換：「這或者是亞倫頭一次遵神論長大麻風者所定的條例（利十三十四章）。」
- title: 大痲瘋是否等同於罪的懲罰之爭
  path: link_folder/解經爭議/大痲瘋是否等同於罪的懲罰之爭.md
  summary: 第10節米利暗在神發怒之後立刻長大痲瘋，是全本聖經裡罪與病因果最明確的一次。GT《聖經精讀本》一句話帶過當時的社會理解：「當時大麻風被視為是受咒詛之人所患的病。」
  relation: 本章與利未記的條例形成對照：利13-14 講的是診斷與潔淨程序，完全不追究成因；本章則把病直接接在特定的罪之後。兩者並列，正好界定這個爭議的邊界——本章能證明神確實可以用皮膚病作審判，卻不能反推每一個患者都犯了什麼罪。KC 從另一個方向讀同一件事：米利暗的大痲瘋「是神對以色列反抗恩典臨到外邦人這件事的審判的鮮明寫照」，重點在事件的性質而不在病的成因。
- title: 患痲瘋者的哀悼記號（獨居營外）
  path: link_folder/主題/患痲瘋者的哀悼記號（獨居營外）.md
  summary: 第14-15節：「現在要把她在營外關鎖七天，然後才可以領她進來。」於是米利暗關鎖在營外七天，百姓沒有行路。STEP 原文資料顯示「關鎖」是 ti.sa.Ger（H5462，詞典形 sa.gar，詞典義 to shut），Niphal 形；「領她進來」是 te.'a.Sef（H622，詞典形 a.saph，詞典義 to gather）。
  relation: 利13:46 的條例在這裡有了一個活的案例，而且加了一層。GT 丁良才注意到米利暗受的比條例更重：「長大麻風得潔淨的人，必須在自己的帳棚外暫住幾天（利十四8、10）；但神吩咐米利暗不但要在帳棚外，也要在營外居住七天。」KC 指出這七天不是因為神還沒赦免：「認罪之後並沒有立刻的醫治……惡有時嚴重到即使已經赦免，刑罰仍必須執行。當主公開的見證受了損害時，情形就是這樣。」全營停留七天則把後果擴大到整個群體——CT：「神的計畫常因人的無知而受耽延。」
- title: 哈洗錄
  path: link_folder/地點/哈洗錄.md
  summary: 第16節：「以後百姓從哈洗錄起行，在巴蘭的曠野安營。」民11:35 記百姓走到哈洗錄住下，本章整起事件——米利暗與亞倫的譭謗、神在會幕門口的裁決、米利暗長大痲瘋與七天關鎖——就發生在這一站。
  relation: 哈洗錄是本卷中少數「什麼事都在這裡發生完才走」的營地。百姓為了等米利暗，在此多停了七天（v15）。BH 把它放回行程表裡看：哈洗錄是以色列人出埃及途中安營的站口之一，見於民11:35 與民33:17，而從哈洗錄起行「標誌著往應許之地的旅程繼續向前」。
- title: 巴蘭的曠野
  path: link_folder/地點/巴蘭的曠野.md
  summary: 第16節：百姓從哈洗錄起行，「在巴蘭的曠野安營」。CT 由此推斷兩地的關係：「表示哈洗錄仍位於巴蘭的曠野範圍之內。」GT《啟導本聖經註釋》指出它的戰略位置：「巴蘭在迦南最南端，以色列人應該就快進入美地。」
  relation: 本節是民數記前後兩段的接縫。GT《民數記串珠聖經註釋》：「這件事發生在哈洗錄，接著民數記描述在巴蘭曠野的加低斯（13:26）所發生的事。其實以色列人途中經過不少的地方（33:18-36）此處並無說明旅程共需時多久，也沒有記下重要事件，可能以色列民因上述事件已學習到順服的功課。」GT 丁良才另補一個站口對照：民33:18 記他們從哈洗錄起行安營在利提瑪，「有注釋家以為這利提瑪的地點，是靠近加低斯的一條山谷」。下一章的探子就是從這裡出發。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 第1節亞倫與米利暗一同譭謗摩西，是本卷第一次記他站到摩西的對立面；第10-11節他看見米利暗長大痲瘋，立刻改口稱摩西「我主啊」，承認「我們愚昧犯罪」。GT 丁良才指出這個稱呼的份量：「亞倫這樣稱他的兄弟，顯明他再不敢將自己和摩西列為平等。」
  relation: 本章顯出亞倫性格上的同一個弱點第二次發作。KC：亞倫「再一次顯出他軟弱的性格。他曾順從百姓的意思，給了他們一隻金牛犢（出32:1-2）。如今他姐姐——看來是帶頭的那一位——在他耳邊說了些關於摩西的話，他又一次順從，跟著她起來反對摩西」。GT 丁良才的判斷相同：「亞倫本來是個沒有主意的人。」GT《聖經精讀本》另指出他認錯的用語也是重複的：「亞倫在西乃曠野陷在拜金牛犢的罪中時，也是用這樣的話向摩西承認了自己的錯誤（出32:22）。」他沒有受同樣的刑罰，兩份 GT 子來源都歸因於他的大祭司身分。KC 則注意到他認罪之後隨即「回到他中保的正確位置上」——第11至12節那段話是他替米利暗求情。
- title: 雲柱火柱
  path: link_folder/歷史/雲柱火柱.md
  summary: '本章雲彩出現兩次，方向相反：第5節「耶和華在雲柱中降臨，站在會幕門口」，第10節「雲彩從會幕上挪開了」。GT 丁良才指出這兩處與民9 的用字不同：「在原文上『挪開』兩個字和九17節的『收上去』三個字不同。雲彩收上去，就是以色列人起行的記號；雲彩挪開，就是耶和華發怒的標幟。」CT 的〔原文字義〕同樣註明「『挪開』原文與『收上去』不同字，前者意思是轉變方向，後者則是上升」。STEP 原文資料證實這一點：第10節是 sar（H5493G，詞典形 sur，詞典義 to turn aside: remove），與民9:17 用的字不同。'
  relation: 民9 建立的是雲彩的常規語言：停就安營、收上去就起行。本章給了同一朵雲第三種動作——挪開，而它的意思是審判。CT 說第5節的雲柱在此的功能是設庭：「『在會幕門口』表示在那裡設立臨時法庭。」GT《舊約聖經背景註釋》從周邊文化補一筆：「在迦南文獻中，主神伊勒也是在帳幕居住，並且從帳幕中（這是神明集會之處）頒布旨意和判語。」
- title: 摩西的代求
  path: link_folder/神學/摩西的代求.md
  summary: 第13節：「於是摩西哀求耶和華說：神啊，求你醫治她！」這是摩西在整章裡說的唯一一句話——被譭謗時他沒有出聲，替譭謗他的人求情時才開口。CT 註「『哀求』表示懇切呼求」；GT 丁良才只用四個字評語：「摩西以善報惡。」
  relation: KC 把這一節放在整章的結構裡看：「我們在這段記載中聽見摩西所說的第一句話，是一位代求者的話。他成了中保。他真正的偉大就在這裡。一點怨恨也看不見。」CT 在靈訓要義收成一條原則：「為同工代禱是和解的最佳對策。」與民11:2 那次代求相比，這一次的對象變了——上一次他為發怨言的百姓求，這一次他為攻擊自己的姐姐求。BH 也指出這一點：摩西為米利暗求，「即使她曾如此對他說話」。
