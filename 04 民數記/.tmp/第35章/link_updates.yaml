book: 民數記
chapter: 35
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 第1、9節兩次「耶和華曉諭摩西說」，本章的利未人城邑與逃城兩段律例都是神向摩西頒佈的。CT 註第1節：本章繼三十四章釐定應許之地的四面邊界和指定分配土地的人之後，確定了利未人的城邑和逃城制度。
  relation: 摩西在本章不只是傳話。GT 丁良才《民數記註釋》指出六座逃城的分定分成兩手：「河東的三座城是摩西親自選定的（申四43），河西的三座城是約書亞規定的（書二十7）」，並記下摩西另吩咐日後完全佔領應許之地時要再添三座（申十九8-9）——他在生前定完自己能定的一半。
- title: 摩押平原
  path: link_folder/地點/摩押平原.md
  summary: 第1節「耶和華在摩押平原─約但河邊、耶利哥對面曉諭摩西說」。GT《聖經精讀本》把以色列在摩押平原所領受的條例逐項列出：第二次數點人口（26章）、迦南的征服計畫（33章）、獻祭和節期的條例（28-30章）、迦南地的分配原則（34章）、分配之地的繼承法（27、36章）、利未人的城邑和逃城制度（35章），以及進入迦南的準備。
  relation: 本章是摩押平原這一串預備工作裡的第六項。地點沒有換，內容卻已經從數點與分地推進到進迦南之後的司法制度——百姓人還在河東，律例先為河西寫好。
- title: 約但河
  path: link_folder/地點/約但河.md
  summary: 第1節「約但河邊」是頒佈律例的地點；第10節「你們過約但河，進了迦南地」是條例生效的時點；第14節「在約但河東要分出三座城，在迦南地也要分出三座城」則以這條河把六座逃城分成兩半。
  relation: 約但河在本章是一條行政分界線。CT 註第14節解釋為什麼河東也要三座：「因河東地區遼闊，為了方便誤殺者逃命，故分設三座逃城。」GT 丁良才並指出河東三座是摩西親自選定的（申四43），河西三座則由約書亞規定（書二十7）——同一套制度，被這條河切成先後兩段完成。
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: 第1節「耶和華在摩押平原─約但河邊、耶利哥對面曉諭摩西說」。CT 註『摩押平原約但河邊』即指約但河東岸的平原。
  relation: 耶利哥在本章只是一個方位標記，卻標出百姓此刻的位置：他們正對著即將攻取的第一座城，而神在這裡先把進城之後的司法制度交代完畢。
- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 第10節「你們過約但河，進了迦南地」；第14節「在迦南地也要分出三座城」。CT 註「進了迦南地」即指攻取了迦南地之後。
  relation: 逃城制度是為定居之後設計的。KingComments 注意到這個安排本身的意味：神預設了地上會有殺人的事——對百姓來說，那地代表豐盛的生活，神在這裡卻預見了相反的情形。第33-34節更把這片地的性質說明白：它是神自己住的地方，所以流人血會使它不得潔淨。
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 第2-8節：以色列各支派要從自己的地業中撥出城邑與郊野給利未人，共四十八座，其中六座是逃城。CT 註第2節：「因利未人並未分配產業之地給他們，除了能得到以色列人出產的十分之一供給他們生活所需之外，尚需居住之地」。GT《啟導本聖經註釋》算出這些城連郊野只有約四十平方公里、占迦南總面積不過千分之一，「所以利未人仍可說是在以色列人中間沒有產業的支派」。
  relation: 本章給利未人的是居住權而不是產權——CT 在〔話中之光〕直說「利未人只有居住權，而沒有產權」。KingComments 並指出散居全地是雅各預言（創49:7）的應驗：利未曾行凶暴當受審判，神卻使那審判變成祝福，因為分散，他們才能在各處教導百姓神的律例。
- title: 產業（na.cha.lah）
  path: link_folder/原文/產業（na.cha.lah）.md
  summary: 第2節「從所得為業的地中」（STEP 顯示是 mi./na.cha.Lat，H5159）、第8節「各支派要按所承受為業之地」（na.cha.la.T/o，H5159；動詞 yin.Cha.lu，H5157）、第28節「才可以回到他所得為業之地」（'a.chu.za.T/o，H272）。
  relation: 本章讓這個字在兩個相反的方向上出現：利未人是唯一沒有 na.cha.lah 的支派，城邑要按別人的 na.cha.lah 比例撥出；而誤殺者失去的也正是回到自己產業的權利，要等大祭司死了才能取回。
- title: 利未人城邑房屋隨時贖回
  path: link_folder/主題/利未人城邑房屋隨時贖回.md
  summary: GT《舊約聖經背景註釋》在民三十五1-5 段直接把讀者指回這條條例：講到利未人在這些城邑中的產權時，註明「見：民二十五32～34」（即利未記二十五32-34）。
  relation: 利未記二十五32-34 保障的房屋，正是本章第2-8節所撥給的四十八座城裡的房屋；本章給出地，利記那一段給出它們不可永久脫手的理由——利未人沒有別的地業，這些房子是他們唯一可居住的產業。
- title: 逃城
  path: link_folder/互文/逃城.md
  summary: 本章第6、9-15、25-28、32節是逃城制度最完整的一段：六座城、河東三座河西三座（第14節）、外人與寄居的同樣適用（第15節）、審判程序（第12、24-25節）、住到大祭司死為止（第25、28節）、不可用贖價提前回家（第32節）。GT《啟導本聖經註釋》列出六座城名：河東的比悉（流便）、拉末（迦得）、哥蘭（瑪拿西半支派），河西的基低斯（拿弗他利）、示劍（以法蓮）、希伯侖（猶大）。KingComments 注意到迦南地的三座都在高處，遠遠就看得見。
  relation: 出埃及記二十一13 只給了「一個地方」，本章把它做成制度。GT《聖經精讀本》定位得很準：神設立報血仇的法則（創9:5,6），「但是在進入迦南之前又制訂了報血仇的例外規定——逃城制度」。CT 在靈意註解裡讀出三層設計：河東河西各三座是「救恩的便利性，隨手可得」，涵蓋外人與寄居的是「救恩的涵蓋性，無所不包」，而蓄意殺人者不得庇護則是「救恩不可濫用」。
- title: 殺人（ratsach）
  path: link_folder/原文/殺人（ratsach）.md
  summary: 本章 20 次出現這個字。STEP 原文資料顯示，和合本第6、11、12、25-28節譯作「誤殺人的」與第16-21、30、31節譯作「故殺人的」，原文都是 ro.Tze.ach（H7523，詞典形 ra.tsach），Qal 主動分詞；分別兩者的不是動詞本身，而是第11、15節多出來的 bi/sh.ga.Gah（H7684，簡要詞典義 unintentionally）與第20-23節描述的仇恨、埋伏。第30節「把那故殺人的殺了」的動詞同樣是 ra.tsach（yir.Tzach，H7523）。
  relation: 出二十13 第六誡用的就是這個字，本章則是全本聖經對它最細的一次分類。GT 賈斯樂郝威《聖經難解經文詮釋手冊》正是為這個張力寫了答問：出二十13 所禁的是謀殺，而民三十五所准許的「是讓人認識到殺人就必被處死的責任。這兩者之間並無衝突」；報血仇也只施於謀殺人者，而且必須是被謀殺者的近親男士。
- title: 謀殺與誤殺的區分
  path: link_folder/神學/謀殺與誤殺的區分.md
  summary: 第16-21節列故殺、第22-23節列誤殺、第24節交給會眾判。GT《民數記串珠聖經註釋》歸納判準：「謀殺的動機可從武器的種類或先前的仇怨判斷。若用可置人死地的武器，如鐵器、木器，就是蓄意殺人。就算不用殺人器具，只是推倒、扔物或用手打人以致對方死亡，若怨恨的動機確鑿，也屬謀殺。」CT 把凶器逐項註開：「鐵器」代表一切能傷害人的凶器、「石頭」指臨時入手可得能傷人致死之物、「可以打死人的木器」指粗大堅硬的木器。
  relation: 出二十一12-14 只給原則，本章補上判準與程序。KingComments 從凶器推回意圖：一個人手裡拿著那樣東西打人，他必定知道那能打死人，本來就不該拿它對付別人。GT《聖經精讀本》把整段的重心說出來：「神在行為的結果背後,首先關注其原因和動機(太5:21-28;15:19)」，並稱這條以故意與無意為判準的界線「是理解人的軟弱的神滿有慈愛的關懷」。
- title: 救贖goel
  path: link_folder/神學/救贖goel.md
  summary: '第12、19、21、24、25、27節的「報血仇的」，STEP 原文資料顯示原文是 go.''El ha./Dam（H1350H 加 H1818），H1350 的簡要詞典義是 to redeem: avenge。KingComments 直接點出這層雙重身分：「報血仇的」在希伯來文就是 goël，同一個字也用於贖回失去的家業時的「至近親屬」。CT 的原文字義同樣把「報血仇」拆成兩個字：血（首字）、贖回（次字）。'
  relation: 同一個字在利未記二十五章是贖回地業與人身的至近親屬，在本章卻是追討人命的人。GT 丁良才把兩種本分並列：人若賣身或變賣產業，至近親屬要為他贖回；人若被殺，至近親屬要為他報仇。本章把後一種本分收進司法程序——第30節先要有幾個見證人，罪名成立之後，處決才成為報血仇者的責任。
- title: 古代近東血仇制度
  path: link_folder/背景/古代近東血仇制度.md
  summary: 第19、21、27節報血仇的可以親自處死故殺人的。GT《舊約聖經背景註釋》指出這制度的兩面：「聖經律法雖然清楚顯示『報血仇者』有責任為被殺害的親屬復仇，這種家族間的血仇對於司法的執行卻有不良的影響。設立六個逃城的目的，就是給人有回復冷靜的時間，以及為被告提供正當程序。」
  relation: 本章是血仇制度被律法收編的地方。GT 丁良才列出舊辦法的三個缺點：「1被告的人有時無法證明自己無罪；2無法分辨故殺誤殺；3往往因互相報仇的緣故，兩家用死力相爭。故此神設立逃城，要免這些弊病。」GT《舊約聖經背景註釋》並指出處決的順序被改寫了——罪名沒有兩個見證人就不能成立（第30節），成立之後處決才成為報血仇者的責任。
- title: 古代近東祭壇庇護
  path: link_folder/背景/古代近東祭壇庇護.md
  summary: GT《舊約聖經背景註釋》在民三十五6-34 段說明逃城與祭壇庇護的關係：為被告提供庇護、免得他被報血仇者所殺的方法，「可能有延伸或替代出埃及記二十一12～14『庇護性祭壇』的作用」，並給了一個祭司角度的理由——祭司團體可能擔心犯法者抓住祭壇的角，有污穢祭壇和聖所之虞；把庇護地區擴大到整個逃城，玷污就不會發生，被告在審訊之前也可以有較佳的住宿環境。
  relation: 壇的角是一個點，逃城是一整座城，這是本章對舊制度的改造。KingComments 補上實務理由：進了迦南之後，很多情況下跑到耶路撒冷壇那裡都太遠，來不及躲開報血仇的（申19:6），所以神給了逃城。GT《舊約聖經背景註釋》另指出古代近東雖到處都有地位特殊的聖城或王城，「但這種城邑所提供的保障，通常只是法定義務上的豁免」。
- title: 全會眾
  path: link_folder/人物/全會眾.md
  summary: 第12節「等他站在會眾面前聽審判」、第24節「會眾就要照典章，在打死人的和報血仇的中間審判」、第25節「會眾要救這誤殺人的脫離報血仇人的手」。STEP 原文資料顯示是 ha./'e.Dah（H5712），第24節的動詞是 sha.fe.Tu（H8199），第25節「救」是 hi.Tzi.lu（H5337，簡要詞典義 to rescue）。
  relation: 本章讓會眾同時擔任兩個角色：判斷者，也是保護者。CT 把第12節「站在會眾面前聽審判」拆成四層意思——案件不能私了、需經過公開審訊、依據見證和證據、由審判官下達公正的判決；他並在靈意註解說這一節是「『愛』與『公義』在此得到平衡；『權利』與『義務』兩全」。
- title: 典章
  path: link_folder/神學/典章.md
  summary: '第12節「聽審判」、第24節「會眾就要照典章」、第29節「要作你們世世代代的律例典章」。STEP 原文資料顯示第12節是 la./mish.Pat（H4941G）、第24節是 ha./mish.pa.Tim（H4941G），簡要詞典義 justice: judgement。CT 註第24節『典章』指據以判定相關行為是否合法的判例和章程，第29節則把『律例』與『典章』分開——「『律例』指律法，是神向人的要求；『典章』指審判，是神對人是否遵行律法的判定」。'
  relation: 本章的典章不是抽象原則，而是一套可執行的判例：凶器、動機、有無埋伏都寫進條文，會眾照著它在打死人的和報血仇的中間判斷。第29節並把適用範圍推到「一切的住處」與「世世代代」——CT 註這指以色列人的國境，包括約但河東和河西的迦南地。
- title: 不可作假見證陷害人
  path: link_folder/神學/不可作假見證陷害人.md
  summary: 第30節「只是不可憑一個見證的口叫人死」。CT 在本節註明這道限制的用意：「『不可憑一個見證的口』這是為防止作假見證。」GT 丁良才引申命記十七6「要憑兩三個人的口作見證」，BibleHub Study 另引申命記十九15 與新約的重述（太18:16；林後13:1）。
  relation: 第九誡禁止的是作假見證這個行為，本章則從程序上讓假見證難以致命：一個人的證詞不足以定死罪。CT 把兩者接在一起——多人見證的要求，本身就是為防止作假見證而設的制度性防線。
- title: 死刑的罪行
  path: link_folder/神學/死刑的罪行.md
  summary: 第16、17、18、21節四次「故殺人的必被治死」，第31節「他必被治死」。STEP 原文資料顯示第31節末尾是 Mot yu.Mat（H4191，不定詞絕對式配 Hophal），語氣是加重的必定被治死；同節「犯死罪的」是 ra.Sha'（H7563，簡要詞典義 wicked）。CT 註第31節：「意指生命無價，用意在防止審判官和受害者家屬貪財，也防止有錢人仗財害命。」
  relation: 本章把死刑的執行條件收得比出埃及記更緊：要有兩個以上的見證人（第30節），不可以贖價替代（第31節），且必須先經會眾按典章判定為故殺（第24節）。GT《舊約聖經背景註釋》以當時的法律作對照——「赫人和中亞述的法律，都容許贖價買回兇手的性命」，以色列的律法在這一點上不留出口。
- title: 寄居的
  path: link_folder/原文/寄居的.md
  summary: 第15節「這六座城要給以色列人和他們中間的外人，並寄居的，作為逃城」。STEP 原文資料顯示是兩個字：Ger（H1616）與 to.Shav（H8453A），簡要詞典義都是 sojourner。CT 把兩者分開：「『他們中間的外人』指傾向猶太教但尚未正式歸化的外邦人；『寄居的』指不接受猶太教禮儀的外邦人。」GT 丁良才的分法是：外人是暫時在以色列人中的外邦人，寄居的是住在以色列人中的外邦人。
  relation: 逃城是本章唯一明文把外邦人一併納入的制度。CT 在靈意註解說這「表徵救恩的涵蓋性，無所不包」；GT《聖經精讀本》說得更直白：外人也能享受逃城制度的恩惠，「這說明神不僅是以色列的神,也是外邦人的神」；KingComments 同樣指出，外人和寄居的既然可以使用逃城的特權，逃城也就預表了外邦人的避難所。
- title: 受膏的祭司
  path: link_folder/人物/受膏的祭司.md
  summary: 第25節「直等到受聖膏的大祭司死了」、第28節「等到大祭司死了。大祭司死了以後，誤殺人的才可以回到他所得為業之地」、第32節「使他在大祭司未死以先再來住在本地」。STEP 原文資料顯示第25節是 ha./ko.Hen ha./ga.Dol（H3548 加 H1419A）'a.Sher- ma.Shach 'o.T/o be./She.men ha./Ko.desh（H4886、H8081、H6944G）。CT 註「受聖膏的大祭司」指大祭司在上任供職時須先受膏（參出四十15）。
  relation: 本章給了大祭司一個在別處沒有的司法功能：他的死解除誤殺者的罪咎。GT《舊約聖經背景註釋》說明這仍屬祭司的本職——大祭司「就在死時，依然在祭儀上服事百姓，消除流人之血所構成的罪咎」。CT 從另一面看同一件事：「大祭司一代過一代的死了，唯有我們的主長遠活著。」
- title: 聖膏油
  path: link_folder/原文/聖膏油.md
  summary: 第25節「直等到受聖膏的大祭司死了」。STEP 原文資料顯示是動詞 ma.Shach（H4886，簡要詞典義 to anoint）加 be./She.men ha./Ko.desh（H8081 油 加 H6944G 聖），字面是用聖別的油膏他。CT 註這指大祭司在上任供職時須先受膏（參出四十15）。
  relation: 出埃及記三十章規定聖膏油的成分與用途，本章則讓受膏這件事產生法律效力：被聖膏所膏的那一位死了，逃城裡的人就得自由。GT 丁良才把這一層說出來——大祭司受聖膏是預表基督，所以他的死預表基督的死，有兩種功效：「1使罪惡得塗抹；2使罪人被釋放」。
- title: 贖命的價銀
  path: link_folder/原文/贖命的價銀.md
  summary: 第31節「故殺人、犯死罪的，你們不可收贖價代替他的命」、第32節「那逃到逃城的人，你們不可為他收贖價」。STEP 原文資料顯示原文是 kho.fer（H3724A，簡要詞典義 ransom），與出二十一30 的「贖命的價銀」同一個字。GT《舊約聖經背景註釋》以當時的法律對照：「赫人和中亞述的法律，都容許贖價買回兇手的性命。亞述法律則採取中間途徑，給予死者最近的親屬權利，選擇處死兇手還是接受贖價。」
  relation: 出二十一30 容許用贖價換命，本章把這條路對故殺人的完全封死，並且連誤殺者也不准用錢提前結束流放。GT 丁良才把兩節的理由分開講：第31節是因為「借著求公義，倒成了貪財的心願；所以神全然禁止這事」，第32節則「一面免得人生貪心，一面免得財主比窮人少受刑罰」。他並在第31-34節總結：「金銀或能使那被殺之人的親屬止息怒氣，卻不能使造那人之主的震怒止息。」
- title: 血
  path: link_folder/主題/血.md
  summary: '第33節「因為血是污穢地的；若有在地上流人血的，非流那殺人者的血，那地就不得潔淨」。STEP 原文資料顯示本節三次出現 Dam（H1818），「流」是 shu.pakh 與 sho.fe.Kh/o（H8210H，詞典形 sha.phakh，簡要詞典義 to pour: kill）。'
  relation: 本章的血有兩種作用：被流的血使地污穢，流血者的血使地得贖。GT《舊約聖經背景註釋》給的理由是：「由於血是生命之源、神的賜與，因此流血所造成的玷污只有藉著流血，才能塗抹。即使是祭牲的血，也必須倒在壇上，作為宰殺牠的人的贖價（見：利十七11）。」這也是本章禁收贖價的根據——能了結流人血之罪的只有血，不是錢。
- title: 污穢
  path: link_folder/主題/污穢.md
  summary: 第33節「這樣，你們就不污穢所住之地，因為血是污穢地的」。STEP 原文資料顯示動詞是 ta.cha.Ni.fu 與 ya.cha.Nif（H2610，詞典形 cha.neph，簡要詞典義 to pollute），Hiphil 形；CT 的原文字義給「被褻瀆，被污染」。
  relation: 本章把污穢從禮儀層面推到土地層面：不是人不潔淨，是地不潔淨。CT 列出土地會不潔淨的兩種原因——「(1)是否敬拜偶像假神；(2)是否流無辜之人的血。為著第一種情形，神命以色列人除滅迦南人；為著第二種情形，神命以色列人嚴格執行逃城制度。」
- title: 玷污自己也玷污地
  path: link_folder/神學/玷污自己也玷污地.md
  summary: 第34節「你們不可玷污所住之地，就是我住在其中之地」。STEP 原文資料顯示動詞是 te.ta.Me'（H2930A，詞典形 ta.me，簡要詞典義 to defile），與第33節「污穢」（cha.neph）不是同一個字。CT 註第34節：所住之地若被玷污，便不宜讓神居住其中；而若沒有神的同住，便不適宜供人居住。
  relation: 利未記十八、二十章講的是性與宗教罪行玷污地，本章補上另一種：流無辜之人的血。CT 在第33節把兩者並列為土地不潔的兩種原因。CT 並在〔話中之光〕引溫漢（Gordon Wenham）：「由於聖潔的神不能住在污穢的地方，而不審判其中的居民，以色列一定要特別留意保持土地的純潔，流人血的罪一出現，就要立刻處理。本段把流人血的罪挑出來討論，是因為它造成的污穢是最嚴重的。」
- title: 神住在人間
  path: link_folder/神學/神住在人間.md
  summary: 第34節「就是我住在其中之地，因為我─耶和華住在以色列人中間」。STEP 原文資料顯示這一節用了兩個不同的動詞：以色列人「所住之地」是 yo.she.Vim（H3427 ya.shav），神「住在」是 sho.Khen（H7931 sha.khan，簡要詞典義 to dwell）。
  relation: 本章把神的同住變成一條司法理由：因為神住在這地，所以流人血不能不追討。CT 在靈意註解裡說，救恩的目的正是帶給人以馬內利（太一23），神與人同在；GT 丁良才則從被害者一面讀這一句——「意思說，被殺之人的血，常在我眼前，這血的聲音常向我哀告（創四10，太二十三35，啟六10）」。
