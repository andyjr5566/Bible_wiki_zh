book: 04 民數記
chapter: 15
updates:
- title: 火祭（isheh）
  path: link_folder/主題/火祭（isheh）.md
  summary: 第3、10、13、14、25節反覆出現「火祭」。GT《民數記串珠聖經註釋》說明它不是新的一種祭：「並不是一種新祭，而是指民數記列舉的五祭中，須用火燒獻上的祭物。」CT 的註解一致：『火祭』指須用火焚燒的獻祭。
  relation: 本章讓火祭成為一組搭配的總稱：從這裡開始，火祭不只是牲口，還要連著素祭與奠祭一起上壇。第13-14節並把它擴到本地人與外人身上——「凡本地人將馨香的火祭獻給耶和華，都要這樣辦理」，外人「怎樣辦理，他也要照樣辦理」。同一個名詞，管的範圍在本章被擴大了兩次。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 第3、8節與平安祭並列，第24節則是全會眾誤犯時要獻的祭。CT 分辨兩者的差別：「『燔祭』整個祭物用火焚燒；『平安祭』僅部分祭物用火焚燒，其餘的歸祭司享用」。
  relation: 本章給燔祭加了兩件新事。第一，每一隻燔祭牲口都要配定量的素祭與奠祭（GT《民數記串珠聖經註釋》：「摩西五經中，這裡是第一次說明每次奉獻祭牲必須有素祭和奠祭陪同」）。第二，全會眾誤犯的贖罪程序裡多了一隻公牛犢的燔祭，這是利未記第4章所沒有的。GT 丁良才《民數記註釋》解釋為什麼要多這一隻：「這祭是因有錯誤（當行的不行）獻的，所以注重當獻給主（22）。利四13節的祭，是為誤犯的罪（不當行的而行）獻的，所以注重必須贖罪。」該做而沒做的，光除罪不夠，還要用燔祭把「以後要做」補回去。
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: 第3、8節兩次與燔祭並列，都是「為要還特許的願，或是作甘心祭，或是逢你們節期獻的」。CT 註『特許的願，或是作甘心』指平安祭中的兩種；GT 丁良才《民數記註釋》說得更直接：「甘心祭和逢節期所獻的祭，多是平安祭。」
  relation: 本章不談平安祭本身的儀式，只管它的配料：獻平安祭與獻燔祭一樣，都要按牲口大小配上細麵、油與酒。KC 由此指出一個重點——不可以把流血的祭與不流血的祭分開，十字架的工作與那一位在地上的完全人生，神要人一起記住。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: 第4、6、9、24節。本章第一次規定素祭必須與血祭同獻——GT《民數記串珠聖經註釋》：「摩西五經中，這裡是第一次說明每次奉獻祭牲必須有素祭和奠祭陪同。」CT 註『素祭』指不含祭牲的獻祭，並逐級列出份量：綿羊羔配細麵伊法十分之一、公綿羊配十分之二、公牛配十分之三。
  relation: 素祭在本章從「一種祭」變成每一種祭的必要配件。GT 丁良才《民數記註釋》追出這個作法的根源：神從起初吩咐早晚獻羊羔時，就要同獻細麵伊法十分之一與油一欣四分之一，又用酒作奠祭（出二十九40），本章把它整理成一張按祭牲分級的對照表。GT《民數記串珠聖經註釋》另指出份量本身的意義：「這裡所指定的分量相當大，暗示將來在應許地的收成必定很豐富。」
- title: 奠酒
  path: link_folder/文化/奠酒.md
  summary: 第5、7、10、24節的「奠祭」。CT 註『奠祭』指澆奠酒；GT《啟導本聖經註釋》說明它的性質：「“奠祭”為以奠酒為祭，不是獨立的獻，乃配其他祭物而獻。」份量與油相同：羊羔一欣四分之一、公綿羊一欣三分之一、公牛半欣。
  relation: 本章是奠祭第一次被正式排進每一次獻祭的清單。GT《聖經精讀本──民數記註解》註：「在民數記中奠祭沒有被單獨提及。這是獻給耶和華的最單純、最普遍的祭物之一,多與素祭一起提及。」KC 從酒的意象讀出獻上時的喜樂，並引腓2:17 保羅說自己願意作「澆奠的祭」澆在腓立比人的信心上——倒出去的東西不是損失，是喜樂。
- title: 馨香之氣
  path: link_folder/神學/馨香之氣.md
  summary: 第3、7、10、13、14、24節共六次「馨香」。CT 在原文字義註明這是原文雙字：「安靜，舒坦，寧靜(首字)；香氣，芳香(次字)」。STEP 原文資料可確認這兩個字：רֵיחַ（Rei.ach，H7381，scent）與 נִיחֹחַ（ni.Cho.ach，H5207，soothing）。
  relation: 本章把「馨香」這個詞用在三種場合：一般的還願與甘心祭（v3-10）、外人所獻的祭（v13-14）、以及全會眾誤犯之後所獻的燔祭（v24）。BH 指出這個詞不是在講氣味，而是表示這份祭被神接納。同一個詞橫跨喜慶與贖罪兩種場合，說明蒙悅納的關鍵不在場合，在於是否照著吩咐獻上。
- title: 伊法
  path: link_folder/原文/伊法.md
  summary: 第4、6、9節用伊法計量素祭的細麵：綿羊羔十分之一、公綿羊十分之二、公牛十分之三。CT 逐一換算：約二點二公升、四點四公升、六點六公升。GT《啟導本聖經註釋》給整數對照：「一伊法約等於20公升，一欣約等於4公升」。
  relation: 本章讓伊法成為一把按祭牲分級的尺。GT 丁良才《民數記註釋》另附一句換算基準：「每伊法等於6欣」（GT《民數記串珠聖經註釋》的表註）。份量隨祭牲加大而遞增，等於把「獻多少」寫成可以計算的規格，不由獻祭的人自由心證。
- title: 舉祭
  path: link_folder/原文/舉祭.md
  summary: 第19、20、21節：進迦南、吃那地的糧食以後，要用初熟的麥子磨麵做餅當舉祭獻上。CT 說明這是什麼動作：「指將手中的祭物，垂直向上舉起，上下擺動，表示獻給神」，原文字義是「升高，高舉」。GT《民數記串珠聖經註釋》指出這份祭物歸祭司享用（利7:32）。
  relation: 本章把舉祭從聖所搬進了家裡。以前的舉祭是節期的公眾儀式，這裡是主婦做餅時先取一塊舉起來。GT《啟導本聖經註釋》記下後世的作法：「猶太人二次被擄後仍保持此風俗，把餅投入家中的火爐裡當作“小祭”，火爐成為祭壇，每個家成為神的居所。」KC 也強調同一點：這裡講的不是節期那樣的特別場合，而是每天的日常。
- title: 初熟
  path: link_folder/原文/初熟.md
  summary: 第20、21節「你們要用初熟的麥子磨麵，做餅當舉祭奉獻」。GT 丁良才《民數記註釋》把先前已有的三種初熟之物條例列了出來——用火烘禾穗作素祭（利二14）、初熟的一捆大麥作搖祭（利二十三10）、兩個搖祭的餅（利二十三17）——並判斷「本節的吩咐，大概是在這三層以外」。
  relation: 初熟的原則在本章從田裡延伸到廚房。GT《啟導本聖經註釋》說明這一步的意義：向神獻初熟之物早有定例，包括長子和頭生的牲畜，「現在把這個原則延伸到家居生活」；並指出保羅引用過這個作法——「所獻的新面若是聖潔，全團也就聖潔了」（羅十一16），用少數的獻上說明整體的歸屬。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: 第24、25、27節。本章的贖罪祭分兩種規格：全會眾誤犯獻一隻公山羊（v24），個人誤犯獻一隻一歲的母山羊（v27）。兩段都以同一句話收尾：「必蒙赦免」。
  relation: 本章與利未記第4章的差別，各家都特別點出來。GT 丁良才《民數記註釋》：「這祭是因有錯誤（當行的不行）獻的，所以注重當獻給主（22）。利四13節的祭，是為誤犯的罪（不當行的而行）獻的，所以注重必須贖罪。」KC 的分法相同：利未記第4章講的是做了不該做的事，這裡講的是沒做該做的事。GT《聖經精讀本──民數記註解》另從兩種規格的落差讀出一個原則：「這說明在耶和華神面前比起個人犯罪,集體犯罪是更嚴重的(利4:27-5:13)。」CT 則劃出贖罪祭的界線：它是指明給誤犯罪的人享用的，明知故犯的人不在此列（v30）。
- title: 寄居身分
  path: link_folder/神學/寄居身分.md
  summary: 第14、15、16、26、29、30節反覆出現「外人」「寄居的」。第15-16節說得最完整：「至於會眾，你們和同居的外人都歸一例，作為你們世世代代永遠的定例，在耶和華面前，你們怎樣，寄居的也要怎樣。你們並與你們同居的外人當有一樣的條例，一樣的典章。」STEP 原文資料顯示第30節這一對詞：「本地人」是 הָ/אֶזְרָח（ha./'ez.Rach，H249，native-born），「寄居的」是 הַ/גֵּר（ha./Ger，H1616，sojourner）。
  relation: 本章給寄居者的位置，KC 認為在舊約裡是獨一無二的：外邦人被放在以色列人旁邊、地位相同，這在舊約其他地方看不到，因為舊約通常保持區別。而這個位置是雙向的：恩典適用（v26 得赦免），刑罰也適用（v30 被剪除）。GT 丁良才《民數記註釋》從實用面解釋用意：「本節的規矩，是要勉勵外人，也敬拜耶和華，不敬拜別神。」GT《啟導本聖經註釋》把它接回更早的應許：「事實上，神與人立約時早已包括萬族（創十二3）。」
- title: 故意犯罪沒有贖罪祭
  path: link_folder/神學/故意犯罪沒有贖罪祭.md
  summary: 第30-31節是這條原則在五經裡最直接的一段：「但那擅敢行事的，無論是本地人是寄居的，他褻瀆了耶和華，必從民中剪除。」「擅敢行事」是本條目的別名。CT 在原文字義註明它是原文雙字：「升起，舉起(首字)；手(次字)」；GT《聖經精讀本──民數記註解》直接譯出來：「字面意思是“用高舉的手”」STEP 原文資料可確認這個組合是 בְּ/יָד רָמָה（be./Yad ra.Mah），由 יָד（yad，H3027G，hand）加 רוּם（rum，H7311A，to exalt）構成。
  relation: 本章把「有祭可獻」與「沒有祭可獻」的分界線畫在動機上，不在後果上。前面八節（v22-29）處理的都是誤犯，結論一律是「必蒙赦免」；第30節換了一種人，前面所有的贖罪程序對他一概不適用。GT《啟導本聖經註釋》用《希伯來書》的警告作結：「我們得知真道以後，若故意犯罪，贖罪的祭就再沒有了，惟有戰懼等候審判」（十26～27）。KC 描述這種人的狀態：他不是沒有力氣抵擋罪，而是清楚知道自己在做什麼、也知道後果，卻沒有任何東西攔得住他。第32-36節的撿柴案例，就是這條原則的第一個實例。
- title: 剪除
  path: link_folder/原文/剪除.md
  summary: 第30-31節兩次出現：「必從民中剪除」「那人總要剪除」。CT 註原文字義是「砍掉，砍下」。STEP 原文資料顯示第31節用了 הִכָּרֵת תִּכָּרֵת（hi.ka.Ret ti.ka.Ret，H3772I）不定詞絕對式加未完成式的重複，正對應和合本「總要剪除」的加重語氣。
  relation: 本章給這個詞配上了明確的適用對象：不是誤犯的人，是「擅敢行事」的人。GT《舊約聖經背景註釋》說明它的執行面：「從民中剪除」一語「表示進行懲罰的包括了人、神雙方的媒介──大概是官方處死，神絕其家系」。同一份註釋在解釋第30節的「褻瀆」時，也把刑度連到同一個地方——犯人必須「從民中剪除」。緊接著的第32-36節就給了一個由人執行的版本：全會眾在營外用石頭打死那人。
- title: 安息日
  path: link_folder/神學/安息日.md
  summary: 第32-36節是安息日律法在正典中唯一一次被實際執行的記載：有人在安息日撿柴，被帶到摩西、亞倫並全會眾那裡，收在監內等候神的判決，最後在營外被石頭打死。
  relation: 本章補上了律法沒有寫的那一格。GT《民數記串珠聖經註釋》指出爭點：在安息日作工或生火要被治死是明文（出31:15；35:2-3），「但在安息日檢柴卻未有明文說明」——而撿柴的目的是生火，所以這是蓄意違反不可生火的條例。CT 的說法一致：撿柴是為生火，但安息日連生火也不可以（參出三十五3），撿柴是否犯法尚無明文可查。GT《聖經精讀本──民數記註解》把這件事放回安息日的本質：安息日是神與以色列百姓之間約的記號（出20:8-11；31:12-17），明知而仍勞作的人「被視為對神旨意的挑戰」。KC 則從安息的意義讀這個案例：安息日是神要人分享祂的安息，撿柴生火是靠自己的火取暖。
- title: 石刑
  path: link_folder/背景/石刑.md
  summary: 第35-36節：「全會眾要在營外用石頭把他打死」，而且第36節記下全會眾確實照辦了。這是安息日律法唯一一次被執行。
  relation: 本章補上兩個關於石刑的細節。第一是地點：GT 丁良才《民數記註釋》註「在營外」的用意——「免得營盤被污穢了（參徒七58，來十三12）」；GT《舊約聖經背景註釋》說得更一般：「處決不論是群體性與否，都要在營外執行，以求避免因與屍體接觸而沾染不潔。」第二是執行者：CT 指出全會眾參與執行死刑，可令會眾受到警戒（參徒五5，10~11）；KC 也從這裡讀出一個原則——這是全體的事，不是少數人的事。STEP 原文資料顯示第35節的「總要把那人治死」是 מוֹת יוּמַת（Mot yu.Mat，H4191），同一個動詞連用兩次，與 CT 原文字義所註的「總要…治死(原文雙同字)」相符。
