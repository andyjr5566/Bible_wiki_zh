name: "全會眾誤行過錯與大眾贖罪定例"
type: "神學"
status: "formal"
definition: "設立於民數記第15章22至26節中關於群眾整起犯偏之解救與赦免的雙祭儀式指則：「你們有時誤行了這一切的命令……就是耶和華吩咐的。要是這誤行是全會眾沒有察知而做出的，全會眾就要獻上一隻公牛犢作為馨香的燔祭……還要加上一隻公山羊作為贖罪祭。」凸顯對於無意過忽的洗淨處理不單要有潔免贖禮，亦必同行全然向上歸服熱心的公牛獻燔。"
accumulations:
  - book: "民數記"
    chapter: 15
    summary: "當民大體皆因忽識或知識晦翳等因素整體失守上帝宣告之條綱時，領隊代表需同心領進一隻公牛為直昇之燔火祭，加奉應應適度的供品麵酒與一頭贖咎贖過山羊；使大宗群得恩宥洗罪脫離定死災刑。"
    relation: "展示公眾罪責清理與重申誓義同步運作的律法結構：集體糊塗過欠固然需血供贖羊潔蕩污端；更需同步奠付壯年直立之燔犢，說明群體赦免之關鍵在於重光「一體歸榮天父」之火熱誓約。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT15.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT15.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/15)"
