name: "衣服邊的繸子與藍細帶子"
type: "文化"
status: "formal"
definition: "出於民數記第15章37至39節上神向選眾開辦的象徵服裝與儀規傳統：「你吩咐以色列人，叫他們世世代代在衣服邊上做繸子，又在底邊的繸子上釘一根藍細帶子。你們佩戴這繸子，好叫你們看見就記念並遵行耶和華的一切命令...」。此生活配具寓言把屬神子民從天召選之榮美與法度具像於隨身行衣，隨觀隨警心持天上思召。"
accumulations:
  - book: "民數記"
    chapter: 15
    summary: "天主敕旨摩西指命各階猶胞當在寬袍周邊安刺整肅繸飾並添佩青湛蔚藍綢線；其視覺用意不在世居巧妍，在於時刻引導眼睛瞻看之時，頓思上蒼萬鈞誡理而不妄偏道行。"
    relation: "設立可視性紀念物在世俗生活中抗逆流的屏壁功能：藉由在布角垂縫指代遠空朝上良恩的「藍色細條繸緣」，把信仰誓約昇維成為無休長在、遏定血肉心意妄動漫淫的永動提醒裝置。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT15.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT15.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/15)"
