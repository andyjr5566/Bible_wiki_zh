name: "不隨從己心眼目行邪淫與成為聖潔"
type: "神學"
status: "formal"
definition: "頒載在民數記第15章39至41節的大章結語中，為上主要救贖選民脫離盲目流蕩所定論的心性指點與極終歸道至真願意：「不隨從自己的心意、眼目行邪淫，像你們素來所行的一樣。使你們記念並遵行我的一切命令，成為聖潔，歸與你們的神。我是耶和華你們的神，曾把你們從埃及地領出來，作你們的神。我是耶和華。」"
accumulations:
  - book: "民數記"
    chapter: 15
    summary: "在全章各款獻牲祭酒比例、誤觸及擅恣辨法暨繸飾禮訓之後，上帝宣告全部制令與記憶飾條的真正中樞對靶—即隔攔百姓盲往放懷沉溺心慾眼看之迷路，引渡靈德步上成聖尊仰高潔歸屬大朝。"
    relation: "宣告信仰生命由內至外的聖化終向：人在本能慣習中最易由自主偏意與視覺勾攝滑落為心靈不忠（行邪淫）；而唯有把拯救恩主「是從苦地救挽我靈的真主」銘懷無墜，方可以聖淨不苟見銘於至大神前。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT15.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT15.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/15)"
