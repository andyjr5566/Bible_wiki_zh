name: "進迦南地後的獻祭定例與神愛恩慈"
type: "主題"
status: "formal"
definition: "記載於民數記第15章1至2節的主題轉折：在上一章宣告第一代以色列民因背信而須在曠野飄流直至終亡的沉重刑判後，神的主動啟示卻即時切入另一層面的確據：「你們到了我所賜給你們居住的地...」。此律例指明在嚴厲管教中，神立約的根本初衷與得勝之應許依然延續。對新一代子民而設立的這類敬拜法規，揭露上主的審判永遠定錨於他良善得勝的恩愛終局。"
accumulations:
  - book: "民數記"
    chapter: 15
    summary: "於曠野宣告成年悖者斷無份直入樂地後，耶和華對於將要踏上帝業的新世代頒下日後安享賜福並獻齊諸馨香祭之憲綱，宣示立願將承行至底、管束並非使聖民自絕。"
    relation: "彰顯管教刑判與主體恩愛的動態統一體系：哪怕人類叛任自誤、歷劫浪沙，但在上帝全遠帶扶的主旨中，安歇於應許地土及獻告馨香的榮宴必為堅守定論。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT15.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT15.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/15)"
