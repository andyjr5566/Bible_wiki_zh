name: "進迦南地後的獻祭定例與神愛恩慈"
type: "主題"
secondary_types: []
aliases: ["進迦南地的獻祭", "到了居住地後的定例"]
status: formal
definition: |
  神在第14章宣示百姓要在曠野流浪四十年並漂流消逝後，第15章隨即即興於開頭吩咐：「你們到了我所賜給你們居住的地」，並且訂定在那新土地上敬拜、休養與獻祭的具體常規。這一轉折深具屬靈得勝的厚望：管教與刑罰絕不會阻斷上帝立約與得勝的終極恩意；縱使當代背逆的會眾無法直步入地，美地歸宿仍然確定預留與保留給新生的一代，彰顯耶和華救贖主顯榮不渝的信實與超越歷史洪流的憐恤無限。
accumulations:
  - book: "民數記"
    chapter: 15
    summary: "在曠野宣告百姓不得入地後，耶和華立刻開啟進入美地後的各類火祭與平安祭法例，向下一代保證神的恩至終不廢，帶有深深的復活祈望。"
    relation: "此核心引領出民數記審判中見恩愛的神學真旨—嚴懲乃是為成全神聖子民在真安息與應許之境內對至高大君尊榮無比的甘樂歸與。"
