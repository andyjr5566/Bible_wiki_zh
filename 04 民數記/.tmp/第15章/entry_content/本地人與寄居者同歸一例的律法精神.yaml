name: "本地人與寄居者同歸一例的律法精神"
type: "神學"
status: "formal"
definition: "體現於民數記第15章13至16節和29至30節，天父上主一而再於宣告獻祭與犯罪處斷規準期間所確切頒定的律法平權哲思：「本國生的人要獻馨香的火祭……至於寄居在你們中間的外人，無論世世代代誰跟你們共居，如果要獻上馨香的火祭給耶和華，就要像你們一樣辦理。會眾啊，你們和寄居中間的外人都要遵行這一樣的條例。」"
accumulations:
  - book: "民數記"
    chapter: 15
    summary: "無論於讚好歡慶之各種配比的燔與和平享典，抑或關於無心而涉偏誤或故縱擅逆罪案之裁辦原則，上帝再四勒示：猶瑟正支子女與在營共留之異部客群皆在至上法權與恩恕底線前全處同樣判遇和接見原則。"
    relation: "展露五經法權的開放豁免度與一體性：超然拯救之盟不可被血緣封閉為單族把玩之私具；信仰的尊從、享恩及涉罰權利以真實尋求與同居敬拜為界限，預示普世大國不偏待身源的廣納底心。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT15.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT15.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/15)"
