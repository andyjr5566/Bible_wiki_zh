book: 民數記
chapter: 25
candidates:
- name: 非尼哈
  type: 人物
  evidence: v7 從會中起來手裡拿著槍，v11 神親自稱讚他，v12-13 得平安的約。
  surfaces:
  - 非尼哈
- name: 以利亞撒
  type: 人物
  evidence: v7、v11 兩次記「祭司亞倫的孫子，以利亞撒的兒子非尼哈」。
  surfaces:
  - 以利亞撒
- name: 亞倫
  type: 人物
  evidence: v7、v11「祭司亞倫的孫子」——非尼哈的祭司資格由此而來。
  surfaces:
  - 亞倫
- name: 摩西
  type: 人物
  evidence: v4 神吩咐他處置族長，v5 他轉吩咐審判官，v6 他在會幕門前哭泣。
  surfaces:
  - 摩西
- name: 米甸
  type: 人物
  evidence: v6、v15 米甸女人，v17 擾害米甸人，v18 米甸首領的女兒哥斯比。
  surfaces:
  - 米甸
- name: 摩押人
  type: 人物
  evidence: v1「百姓與摩押女子行起淫亂」。
  surfaces:
  - 摩押女子
- name: 巴力（迦南主神）
  type: 背景
  evidence: v3、v5 以色列人與巴力毘珥連合；巴力是迦南的豐饒之神。
- name: 忌邪（嫉妒）
  type: 原文
  evidence: v11「以我的忌邪為心，使我不在忌邪中把他們除滅」；STEP 顯示同節動詞名詞同根三次。
  surfaces:
  - 忌邪
- name: 忌邪的神
  type: 神學
  evidence: v13「因他為神有忌邪的心，為以色列人贖罪」。
  surfaces:
  - 忌邪的心
- name: 贖罪
  type: 神學
  evidence: v13「為以色列人贖罪」；STEP 作 va/y.kha.Per（H3722A）。
  surfaces:
  - 贖罪
- name: 會幕（帳幕整體）
  type: 主題
  evidence: v6「摩西和以色列全會眾正在會幕門前哭泣的時候」。
  surfaces:
  - 會幕
- name: 西緬
  type: 人物
  evidence: v14「是西緬一個宗族的首領」。
  surfaces:
  - 西緬
- name: 審判官
  type: 原文
  evidence: v5「於是摩西吩咐以色列的審判官說」。
  surfaces:
  - 審判官
- name: 耶和華擊打百姓的瘟疫
  type: 事件
  evidence: v8 瘟疫止息，v9 遭瘟疫死的有二萬四千人，v18 瘟疫流行的日子。
  surfaces:
  - 瘟疫
- name: 巴蘭（比珥的兒子）
  type: 人物
  evidence: CT、GT、KC 都指出本章的計謀出自巴蘭（民31:16、啟2:14）。
- name: 掛在木頭上_懸屍示眾
  type: 歷史
  evidence: v4「在我面前對著日頭懸掛」；CT 說指處死後掛在木架上示眾，日落之後才能將屍首取下來。
- name: 巴蘭的教訓（啟2：14）
  type: 互文
  evidence: v18「用這詭計誘惑了你們」；CT 明說這出自巴蘭的教訓（參啟二14）。
- name: 什亭（亞伯什亭）
  type: 地點
  evidence: v1「以色列人住在什亭」；GT 說全名是亞伯什亭，是約書亞探子入侵迦南的出發點。
  surfaces:
  - 什亭
- name: 巴力毘珥
  type: 背景
  evidence: v3、v5「以色列人與巴力毘珥連合」；GT 說原文是「毘珥之巴力」的意思。
  surfaces:
  - 巴力毘珥
- name: 連合（tsa.mad）
  type: 原文
  evidence: v3、v5 的「連合」；KC 說這個字有「同負一軛」的力量，CT 給的字義是束緊、綁在一起。
  surfaces:
  - 連合
- name: 行起淫亂（za.nah）
  type: 原文
  evidence: v1「百姓與摩押女子行起淫亂」；CT 說有宗教與情欲雙重意思。
  surfaces:
  - 行起淫亂
- name: 對著日頭懸掛是什麼刑罰
  type: 解經爭議
  evidence: v4「在我面前對著日頭懸掛」；CT 給的字義是處死、脫臼，丁良才說先斬首級再懸掛，GT《背景註釋》說處死的方法不明。
  surfaces:
  - 對著日頭懸掛
- name: 摩西是否照神的吩咐處死族長
  type: 解經爭議
  evidence: v4 神吩咐處死所有族長，v5 摩西卻只吩咐殺與巴力毘珥連合的人；GT 串珠明說摩西並沒有照做。
  surfaces:
  - 你們各人要把他們殺了
- name: 亭子（qub.bah）
  type: 原文
  evidence: v8「跟隨那以色列人進亭子裡去」；CT 說是供休息的帳棚，GT《背景註釋》說似乎是個聖室。
  surfaces:
  - 亭子
- name: 由腹中刺透（qo.vah）
  type: 原文
  evidence: v8「便將以色列人和那女人由腹中刺透」；GT《啟導本》說「腹」可指女人性器官。
  surfaces:
  - 由腹中刺透
- name: 二萬四千與林前10：8 的二萬三千
  type: 解經爭議
  evidence: v9「那時遭瘟疫死的，有二萬四千人」；林前10:8 作二萬三千，GT 收了兩篇難題專文處理。
  surfaces:
  - 二萬四千人
- name: 帶到他弟兄那裡去是什麼意思
  type: 解經爭議
  evidence: v6「帶著一個米甸女人到他弟兄那裡去」；GT《靈修版》說譯作「帶到他的內室去」更佳，《背景註釋》另列兩種讀法。
  surfaces:
  - 到他弟兄那裡去
- name: 平安的約
  type: 主題
  evidence: v12「我將我平安的約賜給他」；GT 引賽54:10、瑪2:5，串珠說祭司的職事使神與人和好。
  surfaces:
  - 平安的約
- name: 心利（撒路的兒子）
  type: 人物
  evidence: v14「名叫心利，是撒路的兒子，是西緬一個宗族的首領」。
  surfaces:
  - 心利
- name: 哥斯比（蘇珥的女兒）
  type: 人物
  evidence: v15、v18「那被殺的米甸女人，名叫哥斯比」；CT 給的名字字義是「虛假的」。
  surfaces:
  - 哥斯比
- name: 蘇珥（米甸首領）
  type: 人物
  evidence: v15「這蘇珥是米甸一個宗族的首領」；CT 說蘇珥是米甸五王中的一位（參三十一8）。
  surfaces:
  - 蘇珥
- name: 擾害（tsa.rar）
  type: 原文
  evidence: v17、v18 的「擾害」；GT 串珠說意思是把對方當作敵人。
  surfaces:
  - 擾害
- name: 詭計（ne.khel）
  type: 原文
  evidence: v18「因為他們用詭計擾害你們……用這詭計誘惑了你們」；STEP 顯示同節名詞與動詞同根。
  surfaces:
  - 詭計
- name: 米甸人為何被追討而摩押人沒有
  type: 解經爭議
  evidence: v17「你要擾害米甸人，擊殺他們」；引誘的是摩押女子，被追討的卻是米甸人。
  surfaces:
  - 擊殺他們
- name: 非尼哈的行為是否可效法
  type: 解經爭議
  evidence: v7-8 他手裡拿著槍刺透兩人；GT 丁良才說這是特別的辦法、現在不可效法，KC 卻說非尼哈的靈必須成為我們所有人的特徵。
  surfaces:
  - 手裡拿著槍
- name: 非尼哈後裔承接大祭司（士20：28）
  type: 互文
  evidence: v13「作為永遠當祭司職任的約」；CT、GT、KC 都指出這應許後來應驗。
  surfaces:
  - 永遠當祭司職任的約
- name: 詩106：28-31 記念毘珥的事
  type: 互文
  evidence: KC 說這件罪在以色列歷史中被牢牢記住，並引書22:17、詩106:28-31、何9:10。
