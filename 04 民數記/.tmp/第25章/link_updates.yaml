book: 民數記
chapter: 25
updates:
- title: 非尼哈
  path: link_folder/人物/非尼哈.md
  summary: 民數記25:7-8、11-13：他從會中起來拿槍刺透心利與哥斯比，瘟疫止息；神親自稱讚他，並把平安的約與永遠的祭司職任賜給他和他的後裔。
  relation: 本章是非尼哈一生最關鍵的一章，也是他得著永遠祭司職任的根據。CT 提醒他的身分：「他是亞倫的孫子，有聖職的膏油。」神給的理由只有一句——「因他在他們中間，以我的忌邪為心」。這件事今天可不可以效法，四套來源意見相反：GT 丁良才說「非尼哈所作的，是特別的辦法，是我們現在不可效法的」，KC 卻說「非尼哈的靈必須成為我們所有人的特徵」。
- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  summary: 民數記25:7、11：兩次記「祭司亞倫的孫子，以利亞撒的兒子非尼哈」——非尼哈的祭司資格由他而來。
  relation: 本章把以利亞撒放在系譜的中間位置。GT 丁良才注意到經文為什麼要重複：「聖書上這樣兩次詳細記載非尼哈的履歷，暗指他不是平民，乃是一位任公家職務最熱心出色的一位少年人。」GT《啟導本》另補上家族背景：以利亞撒是亞倫第三子，他的兩個哥哥拿答與亞比戶因為獻凡火而被天火燒死。而非尼哈後來繼承的正是他父親的大祭司職分（士二十28）。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 民數記25:7、11：「祭司亞倫的孫子」——本章兩次以這個身分介紹非尼哈。
  relation: 亞倫本人在本章已經去世（民20:28），但他的名字仍是非尼哈行動的合法性來源。CT 在〔話中之光〕從這裡讀出祭司的另一面：「說到祭司，給人的印象總是溫文爾雅，道貌岸然。不錯，不過那只是假冒為善的人。神的祭司是非分明，絕不是沒有原則的好好先生，臨事畏怯的軟骨蟲，只知道妥協以求存。」KC 則把亞倫、以利亞撒、非尼哈三代並列，說三人各自是主耶穌的一幅圖畫。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 民數記25:4-6、10、16：神兩次曉諭他，他轉吩咐審判官，並與全會眾在會幕門前哭泣。
  relation: 本章的摩西處在一個少見的位置：他在哭，而不是代求。KC 特別指出這一點：「這裡我們找不到一個為百姓代求的摩西。這說出了這罪的嚴重。這裡沒有代求，只有審判。」CT 也注意到：「沒有旁的經文記載摩西哭。」另有一處爭議與他直接相關——第4節神吩咐處死所有族長，第5節他轉達的卻是另一套對象，GT 串珠據此判他「並沒有照做」。
- title: 米甸
  path: link_folder/人物/米甸.md
  summary: 民數記25:6、14-15、17-18：米甸女人哥斯比、米甸首領蘇珥，以及神吩咐擾害米甸人。
  relation: 本章是米甸從摩西的姻親之地轉為神所吩咐擊殺對象的轉折點。引誘出面的是摩押女子，被追討的卻是米甸人——GT 丁良才的解釋是「米甸人在引誘以色列人泛罪的事上作了禍首」，GT《啟導本》則說「神要消滅的是屬摩押族的米甸人，而非所有的米甸族」。經文第18節自舉兩項證據：毘珥的事與哥斯比的事。
- title: 摩押人
  path: link_folder/人物/摩押人.md
  summary: 民數記25:1-2：「百姓與摩押女子行起淫亂」，摩押女子叫百姓來一同給他們的神獻祭。
  relation: 前三章摩押王巴勒花錢買咒詛而失敗，本章摩押女子不花一分錢就達成了他買不到的效果。GT《聖經精讀本》把手法講得很清楚：「摩押女子一開始並沒有強迫以色列的男子拜偶像,而是邀請他們參加淫亂的宴席,使他們自然地跪拜偶像。」GT 串珠指出「摩押女子」也包括與他們聯盟的米甸人。BH 另補上宗教背景：摩押人所拜的基抹，其宗教實踐常包含儀式性賣淫。
- title: 巴力（迦南主神）
  path: link_folder/背景/巴力（迦南主神）.md
  summary: 民數記25:3、5：「以色列人與巴力毘珥連合」——毘珥山上的地方巴力。
  relation: 本章是巴力這個名字第一次成為以色列實際跌倒的對象。GT《舊約聖經背景註釋》指出這件事的份量：「這次事件，顯然是他們第一次與迦南 * 豐饒和風雨的神祇巴力有所接觸，因為巴力一名並沒有在創世記之中出現。這次接觸以災難收場，成了神對拜偶像反應嚴厲的先例。」GT 串珠說「『巴力』意即主人，迦南各地均有自己的神」，並指出巴力崇拜日後在以色列歷史中影響甚大。
- title: 忌邪（嫉妒）
  path: link_folder/原文/忌邪（嫉妒）.md
  summary: 民數記25:11、13：「以我的忌邪為心，使我不在忌邪中把他們除滅」；「因他為神有忌邪的心」。
  relation: 本章是這個字根最密集的一處：STEP 顯示第11節一節之內用了三次——動詞 be./kan.'/O（H7065）與名詞 kin.'a.T/i（H7068）兩度，第13節再用一次動詞 ki.Ne'。CT〔原文字義〕給的兩個義項是「嫉妒，發熱心」與「狂熱，妒忌」。GT《聖經精讀本》劃出一條界線：「希伯來語中『忌邪』是指神自己的忌邪之心,而不是指為神而有的人感情上的嫉妒。」也就是說非尼哈做的是以神的忌邪為心。
- title: 忌邪的神
  path: link_folder/神學/忌邪的神.md
  summary: 民數記25:11、13：神說非尼哈「以我的忌邪為心」，因此「使我不在忌邪中把他們除滅」。
  relation: 本章讓忌邪這個屬性同時顯出兩面：它是降災的原因，也是止息的理由。CT 說「『我的忌邪』指神妒忌祂的子民轉去敬拜偶像假神」，並在〔話中之光〕解釋為什麼一個人的行動能止住怒氣：「神看到有人以他的忌邪為心，神公義的性情得了滿足。」GT《聖經精讀本》從愛的角度說同一件事：「神以完全的愛愛自己的百姓,同樣向他們要求完全的愛。」
- title: 贖罪
  path: link_folder/神學/贖罪.md
  summary: '民數記25:13：「因他為神有忌邪的心，為以色列人贖罪」——STEP 作 va/y.kha.Per（H3722A，簡要義域 ki.pher: to atone）。'
  relation: 本章的贖罪不是透過祭牲，而是透過一個除罪的行動。CT 在第8節說「非尼哈的行動，贖了以色列人全族的罪，使神不再懲罰他們」；GT 串珠說非尼哈的行動「證明祭司保守會眾聖潔的職事，是帶有代贖功能的」；GT《啟導本》說處死犯罪的人「有若獻上為以色列人贖罪的祭」。KC 說當他執行了這個審判，瘟疫就停了，非尼哈藉此成就了贖罪。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 民數記25:6：「摩西和以色列全會眾正在會幕門前哭泣的時候」。
  relation: 本章的會幕門前是兩件事同時發生的地方：全會眾在那裡哭泣，心利卻當著他們的面把米甸女人帶走。CT 說「『會幕門前』是集合眾人，發號司令的地方」。BH 指出會幕是敬拜的中心與神在百姓中間的居所，因此這一幕的對比特別刺眼；KC 則問那哭泣是為了瘟疫，還是也為了所犯的不忠。
- title: 西緬
  path: link_folder/人物/西緬.md
  summary: 民數記25:14：心利「是西緬一個宗族的首領」。
  relation: 本章讓西緬支派付出了具體代價。CT 由心利的身分推論：「說明西緬支派受首領誤導之害極深，以致兩次數點人數相差很多，從五萬九千三百人，減少到二萬二千二百人（參二13；二十六14）」，並判斷這次瘟疫死者可能大部分屬西緬支派。GT 丁良才則從另一頭看：「可見非尼哈有勇敢，不問犯罪的是什麼人，西緬支派的人多受了引誘。」
- title: 審判官
  path: link_folder/原文/審判官.md
  summary: 民數記25:5：「於是摩西吩咐以色列的審判官說：凡屬你們的人，有與巴力毘珥連合的，你們各人要把他們殺了。」
  relation: 本章是審判官第一次被派去執行死刑。CT 說這是「經摩西授權審判屬下的各級審判官（參出十八21~22）」；GT 丁良才指出管轄範圍的差別：「唯有摩西管轄族長的事，審判官只能管轄屬自己的人。」GT《聖經精讀本》另作分辨，說審判官「主要擔當審判的事情,與士師記中出現的士師有些不同」。BH 說這顯示了權柄的下放。
- title: 耶和華擊打百姓的瘟疫
  path: link_folder/事件/耶和華擊打百姓的瘟疫.md
  summary: 民數記25:8-9、18：瘟疫因非尼哈的行動止息，死者二萬四千人；第18節再提「當瘟疫流行的日子」。
  relation: '本章的瘟疫是全書規模最大的一次。STEP 顯示「瘟疫」是 ha./ma.ge.Fah（H4046，簡要義域 mag.ge.phah: plague），「止息」是 va./te.''a.Tzar（H6113，簡要義域 a.tsar: to restrain）。CT 說「『瘟疫』是耶和華的刀（參代上二十一12），神藉瘟疫懲罰以色列人」。人數與林前10:8 的二萬三千相差一千，四套來源給了四種調和方式。GT《舊約聖經背景註釋》另指出聖經沒有記下症狀，因此無從判斷是哪一種疫病。'
- title: 巴蘭（比珥的兒子）
  path: link_folder/人物/巴蘭（比珥的兒子）.md
  summary: 民數記25 全章：經文本身沒有提到巴蘭，但四套來源都把這場計謀歸給他（民31:16、啟2:14）。
  relation: 上一章巴蘭起來回本地去，看似退場；本章證明他沒有真的離開。GT 丁良才在第1節就點名：「巴蘭將這敗壞以色列人的毒方，教導摩押人和來甸人（三十一16，啟二14）。」GT《啟導本》說他「可能因詛咒不遂，乃出此下策來毀滅以色列民」。KC 的說法最完整：「在前面幾章，巴蘭沒能使神對祂的百姓不忠。神一直信實地持守祂看待百姓的方式。如今仇敵試著從百姓那一邊下手。」他並說：「巴蘭知道怎麼用一個詭計把百姓從神那裡拉開，使他們對神不忠。」
- title: 掛在木頭上_懸屍示眾
  path: link_folder/歷史/掛在木頭上_懸屍示眾.md
  summary: 民數記25:4：「將百姓中所有的族長在我面前對著日頭懸掛」——STEP 本節譯義作 impale（H3363）。
  relation: 本章是這個處置第一次由神親自下令。CT 說「『懸掛』指處死後掛在木架上示眾，日落之後才能將屍首取下來」；GT 丁良才說「指先斬了首級，以後又被懸掛起來（5），這是極大的淩辱（撒下二十一9），顯明他們在神面前是咒詛的（申二十一23）」。GT《舊約聖經背景註釋》則坦言「處死的方法雖然不明」，並補上一條背景：「將屍體插在柱上示眾是 * 亞述的常例。」
- title: 巴蘭的教訓（啟2：14）
  path: link_folder/互文/巴蘭的教訓（啟2：14）.md
  summary: 民數記25:18：「用這詭計誘惑了你們」——CT 明說這出自巴蘭的教訓（參啟二14）。
  relation: 本章就是啟2:14 所指的那件事本身。CT 說得最直接：「『用詭計擾害…用這詭計誘惑』出自巴蘭的教訓，他曾教導巴勒將絆腳石放在以色列人面前，叫他們吃祭偶像之物，行姦淫的事（參啟二14）。」KC 另指出一個關鍵差別：啟示錄2 章談的是巴蘭的「教訓」而不是他的「詭計」——同一個手段，到了新約已經變成一套教義，主張神的百姓不必與世界分別。
