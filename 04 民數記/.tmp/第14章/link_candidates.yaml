book: "民數記"
chapter: 14
candidates:
  - name: "仇敵是我們的食物"
    type: "神學"
    evidence: "民數記第十四章9節中迦勒與約書亞面對強大迦南人所發出的偉大至高信仰宣示：「但你們不可背叛耶和華，也不要怕那地的居民；因為他們是我們的食物，並且蔭庇他們的已經離開他們。有耶和華與我們同在，不要怕他們！」表徵神子民不以高偉困難與巨敵為恐懼，反將靈性與試煉的爭戰視為促使靈魂與信力剛強長進、賴上帝權能必能輕而易舉克吞打沉的養分與滋養食物。"
    surfaces:
      - "我們的食物"
  - name: "迦南大敗直到何珥瑪"
    type: "歷史"
    evidence: "第44至45節記載以色列眾民於加低斯聽受漂流刑判後，未遵上帝禁止擅敢自恃上山與亞瑪力及迦南兵團決戰，遭遇痛心奔潰與粉碎殺退：「於是亞瑪力人和住在那山上的迦南人都下來擊打他們，把他們殺退了，直到何珥瑪。」何珥瑪雙關意指原本堪受「庇護的所在」落致淪成「完全的毀滅」的懲判性史料。"
    surfaces:
      - "殺退了，直到何珥瑪"
  - name: "試探神十次"
    type: "互文"
    evidence: "第22節上帝口親宣定對埃及與曠野漫途一再目睹上神無限威望卻屢生疑恨的民之嚴懲總結：「這些人雖看見我的榮耀和我在埃及與曠野所行的神蹟，仍然試探我這十次，不聽從我的話。」囊括自出埃及紅海抱怨、瑪拉哭苦水、汛曠野爭餅肉、留存或安息日強取嗎哪、利非訂無水鬥口、西乃跪犢，以至他備拉、基博羅哈他瓦與加低斯十事之靈命警鑑。"
    surfaces:
      - "試探我這十次"
  - name: "曠野飄流四十年"
    type: "歷史"
    evidence: "第33至34節宣讀以色列人於民數記第十四章遭遇的神聖終局刑決：「你們的兒女必在曠野飄流四十年，擔當你們淫行的罪，直到你們的屍首在曠野消滅。按你們窺探那地的四十日，一年頂一日，你們要擔當罪孽四十年。」以窺伺四十日換一年至成年背約者全仆廢於黃河的嚴格鍛鍊。"
    surfaces:
      - "曠野飄流四十年"
      - "擔當罪孽四十年"
  - name: "摩西代求與神的豐盛慈愛"
    type: "神學"
    evidence: "第17至19節摩西為免阻天威在異俗前蒙辱，棄捨自我大國宏利，依出埃及記三十四章揭顯之恩誓大呼：「求你照你的大慈愛赦免這百姓的罪孽……耶和華不輕易發怒，並有豐盛的慈愛，赦免罪孽和過犯；萬不以有罪的為無罪，必追討他的罪，自父及子，直到三、四代。」挽銷大撲殺瘟禍的重要祭司和好禱歌。"
    surfaces:
      - "豐盛的慈愛"
  - name: "專心跟從主與另一個心志"
    type: "神學"
    evidence: "第24節耶和華真訓對於義僕迦勒等純聖心性之天恩封譽：「惟獨我的僕人迦勒，因他另有一個心志，專一跟從我，我就把他領進他所去過的那地；他的後裔也必得那地為業。」表徵與眾民不信墮怯截然殊途的超凡心志（希伯來文為「另有一個靈」），唯執仰看信實不顧人世難度、全然不二走隨聖神引指的名譽勝履。"
    surfaces:
      - "另有一個心志"
      - "專一跟從我"
  - name: "報惡信之人的瘟疫與存活者"
    type: "事件"
    evidence: "第36至38節銘記在迦南北界堪查還本後向以眾誇飾拿非林惡情的三派八首十長，於神大光示威下瞬間染身重疾：「這些報惡信的人都遭瘟疫，死在耶和華面前。其中惟有嫩的兒子約書亞和耶孚尼的兒子迦勒仍然存活。」惟約書亞與迦勒因為獨護真道不惑民情得以毫無損傷立安活過的警性紀實。"
    surfaces:
      - "報惡信的人都遭瘟疫"
      - "仍然存活"
  - name: "假意悔改與冒死擅自作戰"
    type: "事件"
    evidence: "第40至44節記載以民遭宣告放徙後痛哀稱咎，反無視順服至旨意強衝山脊：「清早起來，上山頂去，說：我們在這裡，我們有罪了；情願上耶和華所應許的地方去。」摩西勸阻說「不要上去；因為耶和華不在你們中間」，他們卻擅敢上山，反在失去聖神約櫃與先知之助衛中直入深仇刀下遭受羞慚敗奔。揭出偽悔未真正依從天上靈度，不過是一番掩面強詞之放浪叛途。"
    surfaces:
      - "情願上耶和華所應許的地方去"
      - "擅敢上山頂去"
  - name: "神公義追討與禍延子孫的釋經探討"
    type: "解經爭議"
    evidence: "針對第18節及出埃及記神宣讀「萬不以有罪的為無罪，必追討他的罪，自父及子，直到三、四代」與以西結書「兒子必不擔當父親的罪孽」（結18:20）個人受審原則如何平行並解的經學議論；剖白家庭風紀、道德流弊與靈修傳遞在時空中帶予苗裔之後效因果關係。"
    surfaces:
      - "自父及子，直到三、四代"
      - "必追討他的罪"
  - name: "耶和華的榮光與會幕的及時顯現"
    type: "主題"
    evidence: "第10節面對百萬蠢動暴眾正舉巨石謀把見證義將二人殺除於暴喝瞬隙：「但全會眾說：拿石頭打死他們二人。忽然，耶和華的榮光在會幕中向以色列眾人顯現。」無限上天的神蹟燦耀突忽暴閃降駕在會幕至尖以止制民變並伸衛義民的高光聖幕相守實例。"
    surfaces:
      - "耶和華的榮光"
      - "在會幕中向以色列眾人顯現"
