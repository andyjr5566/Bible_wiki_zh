organization: "### 從哭號到另立首領（v1-5）\n\n探子的報告在一夜之間變成全面的叛變。GT 丁良才數出營裡發生的三種動作：==「1喧嚷，2號哭，3發怨言。號哭是不信的結果；頌揚是信心的結果。」==（見[[以色列人的怨言]]）\n\
  \n百姓說的話有兩層。第一層是寧可死：「巴不得我們早死在埃及地，或是死在這曠野。」GT 丁良才點出其中的矛盾：「以色列人因為怕死，就巴不得早死，可見他們的愚拙。」第二層是回頭：「我們不如立一個首領回埃及去吧！」CT：「他們執意棄絕摩西、亞倫，亦即棄絕神。」KC\
  \ 指出這件事在數百年後仍讓人羞愧——尼希米的禱告特別提到它：「他們不肯聽從，也不記念你在他們中間所行的奇事，竟硬著頸項，居心背逆，自立首領，要回他們為奴之地」（尼9:17）。\n\
  \n摩西和亞倫「俯伏在以色列全會眾面前」。CT 分析他們的處境：安撫無效之後，只剩兩種結局——「他們自己因惹怒暴徒而死於非命」或「大多數會眾因惹神怒，必遭神擊殺而亡」，所以「他們別無他策，只有俯伏在地」。KC\
  \ 注意到一個細節：他們是俯伏在百姓面前，不是在耶和華面前，「這樣顯出他們彷彿被百姓的心思壓垮了」。\n\n### 兩個人對六十萬人（v6-10）\n\n[[約書亞]]與[[迦勒]]撕裂衣服，把民13:30\
  \ 的話再說一次。GT 丁良才指出這是約書亞在這件事上第一次開口：「到了這地步。約書亞才說了話……一面要勸戒百姓，一面要盡自己的本分。」\n\n第9節那句話把前一章的比喻整個翻了過來（見[[仇敵是我們的食物]]）：民13:32\
  \ 十個探子說那地「吞吃居民」，這裡迦勒說那地的居民「是我們的食物」。STEP語言資料顯示「食物」在原文就是 lach.Me./nu（H3899H，詞典形 le.chem，詞典義\
  \ food: bread），字面是「他們是我們的餅」。\n\nCT 把這段話讀成信心的五個原則：\n\n| # | 迦勒與約書亞說的 | 內容 |\n| :---\
  \ | :--- | :--- |\n| 1 | 不可背叛耶和華 | 順服神 |\n| 2 | 不要怕那地的居民 | 不懼怕仇敵和困難 |\n| 3 | 他們是我們的食物\
  \ | 以仇敵和困難為食物 |\n| 4 | 蔭庇他們的已經離開他們 | 撒但不敢與神對抗 |\n| 5 | 有耶和華與我們同在 | 有神同在 |\n\n「蔭庇他們的已經離開他們」在原文也很具體：STEP語言資料顯示「蔭庇」是\
  \ tzi.La/m（H6738，詞典形 tsel，詞典義 shadow），「離開」是 sar（H5493G，詞典形 sur，詞典義 to turn aside:\
  \ remove）——==與民12:10「雲彩從會幕上挪開了」是同一個動詞。== CT 解「蔭庇他們的」為「他們所拜偶像假神背後的魔鬼」；BH 則放回當時的觀念：在古代近東，城邑與民族被認為在自己神明的保護之下。\n\
  \n會眾的回應是要拿石頭打死他們。就在這一刻，耶和華的榮光顯現（見[[耶和華的榮光與會幕的及時顯現]]）。KC 數過這件事在本卷出現四次——民14:10、16:19、16:42、20:6——==「而且總是在人看來已經無望的情況下」。==\n\
  \n### 摩西的第二次「我不要」（v11-20）\n\n神提出的方案與出32 完全相同：滅了這百姓，另立摩西的後裔為大國。GT 丁良才：「神說這話，是第二次（參出三十二10），可見摩西絲毫沒有為己的心。」\n\
  \n摩西的回答分三層（見[[摩西代求與神的豐盛慈愛]]、[[摩西的代求]]）。GT 丁良才拆得很清楚：「1靠主的榮耀（13-17），2仗主的應許（17-18），3依主的憐憫（19）。」\n\
  \n第一層的論證有時代背景。GT《舊約聖經背景註釋》：「神明提供守護是古代近東普遍接受的信念……當城市或團體之間發生爭鬥時，他們的神祇亦參與戰事。負方的神明名譽掃地，往往遭其崇拜者所摒棄。」摩西正是拿這個來求。\n\
  \n第二層他引的是神自己說過的話（出34:6-7）。STEP語言資料顯示第18節「不輕易發怒」是 'E.rekh 'a.Pa.yim（H750，詞典義 slow\
  \ ＋ H639G，詞典義 face: anger），字面是「怒氣長」，正對得上 CT 所註的「忍耐的，慢慢發怒的（首字）；怒氣，鼻孔（次字）」；「豐盛的慈愛」的第二個字是\
  \ Che.sed（H2617A，詞典義 kindness，本節譯義 covenant loyalty）；「萬不以有罪的為無罪」是 ve./na.Keh lo'\
  \ ye.na.Keh（H5352 用了兩次的加強語氣）。\n\n**神說「我照著你的話赦免了他們」，但這句話有兩面。** CT 指出它同時含兩層：不再如殺一人般滅絕全體，也照摩西自己引的「萬不以有罪的為無罪」追究不信的罪。KC\
  \ 說的是同一件事：「神垂聽禱告並且赦免。這不表示祂不罰惡，而是祂延後審判。」第18節下半那句「自父及子，直到三、四代」另有爭議（見[[神公義追討與禍延子孫的釋經探討]]）。\n\
  \n### 判決：照他們自己說過的話（v21-38）\n\n神先總結歷史：「仍然試探我這十次」（見[[試探神十次]]）。CT、GT 丁良才與 GT《啟導本聖經註釋》三份清單完全對得上，從紅海一路數到加低斯巴尼亞；GT《民數記串珠聖經註釋》則換成按性質分三類的算法。\n\
  \n然後是判決本身，而判決的內容就是他們自己的話：\n\n```mermaid\nflowchart TD\n    A[\"v2 巴不得我們死在這曠野\"]\
  \ --> B[\"v28 我必要照你們達到我耳中的話待你們\"]\n    B --> C[\"v29 你們的屍首必倒在這曠野\"]\n    D[\"v3\
  \ 我們的妻子和孩子必被擄掠\"] --> E[\"v31 但你們的婦人孩子，我必把他們領進去\"]\n    F[\"民13:25 窺探四十日\"] -->\
  \ G[\"v34 一年頂一日，擔當罪孽四十年\"]\n```\n\nGT《民數記串珠聖經註釋》數過這句判詞出現的次數：「既然他們情願死在曠野（2），神就讓他們的屍首真的倒在曠野（此句在本段複述四次，29,\
  \ 32-33, 35）」。CT 在〔話中之光〕點出這個判法的性質：==「神用百姓最懼怕的方式懲罰他們，他們害怕死在曠野，神就懲罰他們在曠野飄流直至死去。」==\n\
  \n[[曠野飄流四十年|四十年]]是怎麼算出來的（見[[四十的屬靈意義]]）：按窺探的四十日一年頂一日。CT 說四十年從出埃及起算；至於實際年數，GT《啟導本聖經註釋》算出：「『四十年』是約數，實際上是三十八年零十個月。」KC\
  \ 用一個詞說出這四十年改變了什麼：==「這百姓成了流浪的百姓。他們本是客旅，是往應許之地去的行路人。如今他們是流浪者，在曠野裡漫無目標地遊蕩。」==\n\n\
  STEP語言資料在這裡連出一組對照：第18節神「赦免」罪孽是 no.Se'（H5375I，詞典形 na.sa，詞典義 to lift: forgive），第34節百姓「擔當」罪孽是\
  \ tis.'U（H5375J，同一個 na.sa，詞典義 to lift: guilt）。==同一個動詞：神舉起他們的罪孽，他們也要舉起自己的罪孽。== 本章的判決是赦免與擔當同時成立，而原文用同一個字承擔了兩邊。\n\
  \n例外只有兩個人（見[[專心跟從主與另一個心志]]）。第24節「另有一個心志，專一跟從我」在原文都很具體——STEP語言資料顯示是 Ru.ach 'a.Che.ret（另一個靈）與\
  \ va/y.ma.Le' 'a.cha.Ra/i（字面「他在我後面填滿了」），正對得上 CT 的兩處原文字義。\n\n十個報惡信的探子當場死亡（見[[報惡信之人的瘟疫與存活者]]、[[耶和華擊打百姓的瘟疫]]）。KC\
  \ 描繪那個場面：==「十二個探子可能正站在一起，在百姓中間……約書亞和迦勒仍然站著。這對以色列人必定說了很多話——當一整個民族倒下的時候，這兩個人仍舊站著。」==（見[[十二探子窺探迦南地]]）\n\
  \n### 太晚的膽量（v39-45）\n\n百姓聽見判決就「甚悲哀」，清早起來要上山頂去（見[[假意悔改與冒死擅自作戰]]）。各家都不認為這是悔改。GT 丁良才：「以色列人既然不聽從神的話，就顯明他們是假意認罪」，並列出聖經中因怕刑罰認罪的六個人：法老、本章的百姓、巴蘭、亞幹、掃羅、猶大。KC\
  \ 說得更直接：==「他們想用第二個罪——莽撞的自信——去彌補第一個罪，就是懼怕。但神絕不把祂的名交給悖逆。」==\n\nGT 丁良才把前後兩次對照起來：==「先前主保護他們的時候，他們還害怕，後來主不保護他們了，他們反倒膽大起來。這兩件事都是出於不信：1不信神的應許，2不信神的警誡。」==\n\
  \n第44節記下誰沒有去：「耶和華的約櫃和摩西沒有出營。」GT 丁良才補充：「利未人、約書亞，和好些百姓，也沒有出營。」STEP語言資料顯示「擅敢」是 va/i.ya'.Pi.lu（H6075B，詞典形\
  \ a.phal，詞典義 to presume），Hiphil 形，對得上 CT 所註的「膨脹，輕率疏忽」。\n\n結果是被[[亞瑪力人]]與迦南人殺退直到何珥瑪（見[[迦南大敗直到何珥瑪]]）。這個地名本身是雙關語——CT：「原本是可以得到『庇護』的地理用詞，現在轉用來成為『完全毀滅』的所在。」\n\
  \n整件事的代價，GT《啟導本聖經註釋》算得很清楚：==「一條只須十一天的路程（申一2），現在要繞足足38年。」== 而這一站的名字，後世反覆回顧：民32章、申一20～40、詩九十五10、一〇六24、摩二10、五25、林前十章、來三7～四13（見[[加低斯巴尼亞事件]]）。同一塊[[迦南地|地]]，民13\
  \ 是證物，民14 成了審判的內容。"
