book: 04 民數記
chapter: 14
updates:
- title: 迦勒
  path: link_folder/人物/迦勒.md
  summary: 第6-9節他與約書亞撕裂衣服、勸阻全會眾；第10節全會眾要拿石頭打死他們；第24節神親口稱他「我的僕人迦勒」；第30、38節他是那一代兩個進得去的人之一。STEP 原文資料顯示第24節「另有一個心志」是 Ru.ach 'a.Che.ret（H7307G ru.ach ＋ H312 a.cher，字面「另一個靈」），「專一跟從」是 va/y.ma.Le' 'a.cha.Ra/i（H4390 ma.le ＋ H310A a.char，字面「他在我後面填滿了」）——正對得上 CT 的兩處原文字義。
  relation: 民13 是他的立場，民14 是那個立場的代價與回報。他在本章先冒了生命危險（v10 全會眾要用石頭打死他），然後得到全章唯一的正面判決。KC 指出這個評語後來成了他的固定稱號（民32:12；申1:35-36；書14:8-9、14），並說他「不讓自己的心思被他所看見的影響，而是被耶和華所說的話影響」。GT《啟導本聖經註釋》指出應許兌現的地方：書14:6-15 記他所得的正是希伯崙——本章他曾親眼看過、亞衲族所住的那座城。
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第6節他與迦勒一同撕裂衣服，第7-9節一同向全會眾作見證，第30、38節一同被列為例外。GT 丁良才指出這是他第一次在這件事上開口：「到了這地步。約書亞才說了話……一面要勸戒百姓，一面要盡自己的本分。」
  relation: 民13 他沉默、迦勒發言，民14 兩人一同站出來。GT《啟導本聖經註釋》讀出其中的意義：「約書亞在此時發言，勇敢堅定又高瞻遠囑，是率領新一代進入迦南的新領袖。」BH 也指出他的身分在此已隱然成形：他日後要接續摩西帶百姓進地，而本章的判決正是把那一代篩到只剩他與迦勒。這是他從「摩西的幫手」轉向獨立見證人的一章。
- title: 摩西的代求
  path: link_folder/神學/摩西的代求.md
  summary: 第13-19節是摩西在民數記篇幅最長的一次代求。GT 丁良才把理由拆成三層：「1靠主的榮耀（13-17），2仗主的應許（17-18），3依主的憐憫（19）。」第20節神回答：「我照著你的話赦免了他們。」
  relation: 這一次與出32 的金牛犢事件同型——神同樣提出「叫你的後裔成為大國」，摩西同樣沒有接。GT 丁良才：「神說這話，是第二次（參出三十二10），可見摩西絲毫沒有為己的心。」KC 說得更完整：「摩西沒有想到自己；他想的只是神的榮耀與百姓的好處。」但這次的結果與出32 不同：神赦免了，判決仍然下來。CT 指出關鍵在摩西自己引的那句話——他先承認「萬不以有罪的為無罪」，再求慈愛的赦免，所以神照著他的話赦免，也照著他的話追討。GT《舊約聖經背景註釋》另指出第13-16節的論證建立在古代近東的觀念上：戰敗一方的神明名譽掃地，摩西正是拿這個來為神的名求。
- title: 以色列人的怨言
  path: link_folder/歷史/以色列人的怨言.md
  summary: 第1-4節是全卷怨言的頂點：喧嚷、哭號、發怨言、要另立首領回埃及。GT 丁良才數出三種動作：「在營裡發生了三種舉動：1喧嚷，2號哭，3發怨言。號哭是不信的結果；頌揚是信心的結果。」第27節神親自定性：「這惡會眾向我發怨言，我忍耐他們要到幾時呢？」
  relation: 本章讓怨言第一次得到正式的判決，而判決的內容正是怨言本身的內容。第2節他們說「巴不得我們早死在埃及地，或是死在這曠野」，第28-29節神說「我必要照你們達到我耳中的話待你們。你們的屍首必倒在這曠野」。GT《民數記串珠聖經註釋》：「這種邪惡的咒語結果真的應驗，成為他們所得的懲罰。」KC 則指出第4節那句「立一個首領回埃及去」的份量——尼希米在數百年後的禱告裡仍為這件事羞愧（尼9:17）。
- title: 加低斯巴尼亞事件
  path: link_folder/歷史/加低斯巴尼亞事件.md
  summary: 本章整章就是這個事件本身：探子回報之後百姓的反應（v1-10）、神的判決（v11-35）、十個探子當場死亡（v36-38）、擅自上山的慘敗（v39-45）。GT《聖經精讀本》直接以此為名：「加低斯巴尼亞事件是以色列出埃及以後所犯的最大的悖逆事件。」
  relation: 民13 是這個事件的前半，本章是後半，也是它得名的原因。GT《啟導本聖經註釋》算出代價：「一條只須十一天的路程（申一2），現在要繞足足38年。」CT 在民13 的〔話中之光〕已預告了這一站在全卷中的位置——摩西、亞倫、米利暗三人日後也都在加低斯失去進地的資格。GT《啟導本聖經註釋》另列出後世反覆回顧這件事的經文：民32章；申一20～40；詩九十五10；一〇六24；摩二10；五25；林前十章；來三7～四13。
- title: 十二探子窺探迦南地
  path: link_folder/事件/十二探子窺探迦南地.md
  summary: 第36-38節是這次任務的結局：「摩西所打發、窺探那地的人回來，報那地的惡信……這些報惡信的人都遭瘟疫，死在耶和華面前。其中惟有嫩的兒子約書亞和耶孚尼的兒子迦勒仍然存活。」STEP 原文資料顯示第36、37節的「惡信」是 di.Bat（H1681，詞典義 slander），與民13:32 是同一個字。
  relation: 民13 記這十二個人出發與回報，本章記他們的下場。KC 描繪那個場面：「十二個探子可能正站在一起，在百姓中間。然後耶和華用瘟疫擊殺那十個不信的探子。約書亞和迦勒仍然站著。」他並指出十人的罪為何加重：「他們自己犯了罪，也使別人犯罪。」GT《啟導本聖經註釋》從法律面解釋這個刑罰的性質：這是作假見證應得的報應。同一趟路、同一份見聞，結局由當初的判斷決定。
- title: 四十的屬靈意義
  path: link_folder/原文/四十的屬靈意義.md
  summary: 第33-34節把民13 的四十天換算成四十年：「按你們窺探那地的四十日，一年頂一日，你們要擔當罪孽四十年。」GT《民數記串珠聖經註釋》：「『一年頂一日』：強調神對罪惡的嚴厲，正如成語所謂：『一失足成千古恨』。」
  relation: 這是這個數字在聖經中最直接的一次轉換：日換成年，探查的期限變成刑罰的期限。BH 指出「四十」在聖經中常與試驗、審判相連，並舉洪水四十晝夜（創7:12）、摩西在西乃山四十天（出24:18）、耶穌禁食四十天（太4:2）為例。實際年數各家算法略有出入——CT 說四十年從出埃及起算，GT《啟導本聖經註釋》算出「實際上是三十八年零十個月」，GT 丁良才則說神「將以色列人已經在曠野的工夫都算在這四十年之內了」。
- title: 亞瑪力人
  path: link_folder/人物/亞瑪力人.md
  summary: 第25節神指出「亞瑪力人和迦南人住在谷中」，並吩咐百姓轉回；第43、45節他們把擅自上山的以色列人殺退直到何珥瑪。GT 丁良才點出神吩咐轉回的實際用意：「神叫他們轉回曠野，是要他們免得受亞瑪力人和迦南人所害。」
  relation: 出17 亞瑪力人主動攻擊以色列、被約書亞殺敗；本章反過來——以色列人主動上去、被他們殺退。差別在有沒有神的同在：第42節摩西的警告是「耶和華不在你們中間」，第44節記下「耶和華的約櫃和摩西沒有出營」。GT《聖經精讀本》把這個翻轉說得很直接：「亞瑪力人是神不喜悅的民族,卻成了神剿滅以色列的工具。」GT 賈斯樂郝威《聖經難解經文詮釋手冊》命題17 另處理一個文本問題：第25節說他們住在谷中、第45節說他們從山上下來，他給了兩種解法——不同族群分居兩處，或同一批人住在對低地而言算是山上的高原。
- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 本章反覆以「那地」指稱迦南，而每一次的說話者不同、態度也不同：百姓說「耶和華為什麼把我們領到那地，使我們倒在刀下呢」（v3），迦勒與約書亞說「那地原是流奶與蜜之地」（v8），神說「他們斷不得看見我向他們的祖宗所起誓應許之地」（v23），又說「你們所厭棄的那地」我必把你們的婦人孩子領進去（v31）。
  relation: 民13 這地第一次被親眼看見，民14 它第一次成為判決的標準。CT 註第31節：「『你們所厭棄的』其實是他們自我貶低，不敢進去攻取那地。」KC 引詩106:24 給這一章下了定義：他們「藐視那美地」，「因為不信祂的話」——並說「否認神所賜的，其實就是否認神自己」。同一塊地，在民13 是證物，在民14 成了審判的內容。
- title: 耶和華擊打百姓的瘟疫
  path: link_folder/事件/耶和華擊打百姓的瘟疫.md
  summary: 第12節神說「我要用瘟疫擊殺他們，使他們不得承受那地」；第37節十個報惡信的探子「都遭瘟疫，死在耶和華面前」。CT 指出這是神慣用的手段之一，並舉出五經中的其他實例（出五3；九15；利二十六25）。
  relation: 本章讓這個條目出現一次未執行的宣告與一次執行的刑罰：第12節的瘟疫因摩西代求而沒有臨到全民，第37節的瘟疫則當場落在十個探子身上。GT《舊約聖經背景註釋》對它的性質保留：「譯作『瘟疫』的字眼十分模糊，不足以確定所指的是何種疾病；雖然部分學者認為這是形容鼠疫。舊約通常視瘟疫為神對嚴重瀆聖或褻瀆罪行的刑罰。」與民11:33 的災殃相比，這一次的對象是明確指名的十個人，而不是整群百姓。
