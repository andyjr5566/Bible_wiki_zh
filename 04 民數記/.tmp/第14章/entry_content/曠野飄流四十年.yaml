name: 曠野飄流四十年
type: 歷史
secondary_types: []
aliases: []
status: formal
definition: |-
  第33-34節的判決：「你們的兒女必在曠野飄流四十年，擔當你們淫行的罪……按你們窺探那地的四十日，一年頂一日，你們要擔當罪孽四十年。」

  **四十年怎麼算？** CT：「四十年是指從出埃及開始算起，直到進入迦南地」，並說「一年頂一日」的算法「把以前已經在曠野裡所渡的年日也算進去了」。GT《啟導本聖經註釋》給出精確數字：「『四十年』是約數，實際上是三十八年零十個月。」GT 丁良才也說神「後來卻發了憐憫的心，將以色列人已經在曠野的工夫都算在這四十年之內了」。

  **「一年頂一日」的意義。** GT《民數記串珠聖經註釋》：「強調神對罪惡的嚴厲，正如成語所謂：『一失足成千古恨』。」GT《聖經精讀本》從兩個目的來讀：「①讓百姓們明白自己的罪,也讓他們經歷罪所帶來的悲慘的結果; ②為了讓新一代（二十歲以下）的人年齡達到能對神的事負責的成熟年齡。」

  **懲罰的形式正是他們自己說過的話。** 第2節他們說「巴不得我們早死在埃及地，或是死在這曠野」，第28-29節神說「我必要照你們達到我耳中的話待你們。你們的屍首必倒在這曠野」。GT《民數記串珠聖經註釋》指出這句話在本段重複四次（v29、32-33、35）。CT 在〔話中之光〕：「神用百姓最懼怕的方式懲罰他們，他們害怕死在曠野，神就懲罰他們在曠野飄流直至死去。」

  **KC 用一個詞形容這四十年的性質改變了。** ==「這百姓成了流浪的百姓。他們本是客旅，是往應許之地去的行路人。如今他們是流浪者，在曠野裡漫無目標地遊蕩。」== 他並指出這四十年不是空白：「神要用那四十年教導他們，他們是誰、祂是誰。」

  **STEP 原文資料**顯示第34節「擔當」是 tis.'U（H5375J，詞典形 na.sa，詞典義 to lift: guilt）——與第18節神「赦免」罪孽的 no.Se'（H5375I）是同一個動詞。==神舉起他們的罪孽（赦免），他們也要舉起自己的罪孽（擔當）。== 同節「疏遠」是 te.nu.'a.T/i（H8569，詞典義 opposition），正對得上 CT 所註的「反對」。
accumulations:
- book: 民數記
  chapter: 14
  summary: 第33-34節神按窺探的四十日判定四十年的飄流，一年頂一日。CT 說四十年是從出埃及起算；GT《啟導本聖經註釋》算出實際是三十八年零十個月。第28-29節的判決正是照他們自己在第2節說過的話——「屍首必倒在這曠野」在本段重複四次。
  relation: 這一段把民13 的四十天變成四十年，也把民11-13 的怨言結算成一個世代的代價。KC 指出他們的身分因此改變：從往應許之地去的客旅，變成漫無目標的流浪者。STEP 原文資料顯示第34節「擔當」與第18節「赦免」是同一個動詞 na.sa——赦免與擔當在同一章裡由同一個字承擔。
