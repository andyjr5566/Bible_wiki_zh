name: "神公義追討與禍延子孫的釋經探討"
type: "解經爭議"
status: "formal"
definition: "圍繞於民數記第14章18節以及五經各章神自露本性言辭—「耶和華不輕易發怒，並有豐盛的慈愛，赦免罪孽和過犯；萬不以有罪的為無罪，必追討他的罪，自父及子，直到三、四代」—與《以西結書》第十八章所強調「兒子必不擔當父親的罪孽」（結18:20）個人自主受裁雙引觀點如何融構理解及對位共生的釋經與道德法理探求。"
accumulations:
  - book: "民數記"
    chapter: 14
    summary: "當眾會意圖廢約造反折向、摩西代請廣饒赦恩時，其懇引言文中既陳述深厚慈憫又保留著「不輕以有罪為無罪、必追究罪報及子，致三、四代」的公正律文。權威解經史與釋道註疏（如丁良才與各經典註釋大匠）皆分析澄明：此句追究三四代非昧妄毀損個人受賞論，而屬歷史群性傳統下道德破敗與悖妄氣勢如何在現世生活結構和精神教習下蔓及衍生後代所面臨的不免共責歷境。"
    relation: "明定經典中公義不阿與靈命因果遺緒的和諧框架：追罪禍延指陳人類悖逆作為在群體遺風、習俗與歷史現實中所延伸之長遠現實代償與沉痛苦殃；與單一個人若秉忠不犯則獨荷己意審決之公明原道毫無排突。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT14.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT14.htm)"
