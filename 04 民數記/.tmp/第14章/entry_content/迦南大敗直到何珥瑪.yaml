name: "迦南大敗直到何珥瑪"
type: "歷史"
status: "formal"
definition: "記載於民數記第14章44至45節的重大戰鬥悲劇：當以色列眾民聽受長達四十年流浪沙漠的審判令出，企圖補救而違抗摩西和耶和華「不與之同在」之嚴正禁示，強持武裝仰攻南區山嶺，招致亞瑪力人和迦南部伍自山巔衝殺打退，軍損沿程遠直追赴高深南部聚所「何珥瑪」的痛徹恥負。"
accumulations:
  - book: "民數記"
    chapter: 14
    summary: "會眾無視摩西所論及「現在千萬勿往自欺前邁；上帝現已不在君友之間了」的鄭重勸勉，妄行未奉聖諭、約櫃未曾移動、帶信先知摩西皆不相偕隨往的情態下攻闖，遭受堅立高地的亞瑪力兵和在地諸 Canaan 部眾殺擊全潰，終敗退落到名垂雙意—暗射毀滅場—之何珥瑪。"
    relation: "闡述違命自決與無神靈覆庇下人擇軍功的虛敗真實：當恩誓與帶領已經告收時，依侍自身悲痛悔懨或激進衝鋒均不受聖理納許；無有從上主親臨肯同，前衝攻地終僅剩敗潰與傾滅一處苦終。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT14.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT14.htm)"
