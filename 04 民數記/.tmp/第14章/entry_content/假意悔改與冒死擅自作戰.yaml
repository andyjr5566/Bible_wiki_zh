name: "假意悔改與冒死擅自作戰"
type: "事件"
status: "formal"
definition: "指記載於民數記第14章40至44節中，當以色列民眾得知長歲月流徙大限刑判後，所產生出來自傲、片面且違拒順服道引的偽性轉回悲情：「清早起來，上山頂去，說：我們在這裡，我們有罪了；情願上耶和華所應許的地方去。」即使領座摩西再三苦口揭示神已棄離不出陣的原則，會團仍自持血力仰登山地戰役而墜倒蒙恥。"
accumulations:
  - book: "民數記"
    chapter: 14
    summary: "眾民聽悉長世留沙苦死哀報後生出莫大愧戚，妄言求贖並違命執念推衝南部大峰爭戰；摩西正言警明此皆自違命令、上主與神約聖櫃均未嘗離開行殿前引；他們仍執心奔殺衝高，結果慘遭嚴陣待進的亞瑪力及 Canaan 土兵擊穿殺退至遠荒之地何珥瑪。"
    relation: "分辨宗教悲恨情感與真正遵從神的本質落差：出於惋惜失地而湧至的強持罪悔或激烈攻勢，實則是抗定規執我的極端轉換；未曾蒙上帝同處及聖言默認之下的擅謀自取，唯終墜落地敗陣與重恥的失神光景。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT14.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT14.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/14)"
