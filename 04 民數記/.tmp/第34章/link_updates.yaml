book: 民數記
chapter: 34
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 第1、16節耶和華兩次曉諭摩西——一次講地界、一次講人選；第13節摩西把分地的原則吩咐以色列人：「這地就是耶和華吩咐拈鬮給九個半支派承受為業的。」
  relation: 本章摩西的角色是轉述與交辦：地是神畫的、人是神點的，他把兩份指示轉給以色列人與日後執行的以利亞撒、約書亞。這也是民數記裡他最後幾次以中介身分出現。
- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  summary: 第17節「要給你們分地為業之人的名字是祭司以利亞撒和嫩的兒子約書亞」，他被列在約書亞之前。CT 註以利亞撒是亞倫的兒子、接續他擔任大祭司。
  relation: GT《民數記串珠聖經註釋》註分地由十二位領袖一起負責、不由大祭司或約書亞單獨主持以示公允；KC 則說眾首領自己也在以利亞撒與約書亞的權柄之下。民32:28 摩西交代給他的那份條件，到本章擴大成整片迦南地的分配權責。
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第17節與以利亞撒同列為分地的主責人。CT 回顧他原為摩西的少年助手、與迦勒同為探子、幾乎被用石頭打死，後蒙神指定為摩西的接班人（民27:22-23）。
  relation: KC 註分地的人除約書亞和迦勒之外都屬第二代——本章的名單標誌著世代交替，而他是跨越兩代的兩個人之一。
- title: 迦勒
  path: link_folder/人物/迦勒.md
  summary: 第19節「猶大支派有耶孚尼的兒子迦勒」，列在十位支派首領之首。CT 註此時他年歲與約書亞不相上下、大約將近八十歲（書14:10）；GT 丁良才註十位首領中只有迦勒的名字在別處聖經也提到。
  relation: GT 丁良才另有一個觀察：「猶大在先，或因這支派的首領是早先做探子的迦勒。」四十年前他是十二探子之一，如今他成了分地名單的第一位。
- title: 流便
  path: link_folder/人物/流便.md
  summary: 第14節「流便支派和迦得支派按著宗族受了產業」，第15節「這兩個半支派已經在耶利哥對面、約但河東、向日出之地受了產業」。因此第13節的分地只給九個半支派。
  relation: 民32 他們求的地，在本章成了一句用來解釋九個半支派這個數字的插話——同一件事在兩章的位置完全不同。
- title: 迦得（萬幸）
  path: link_folder/人物/迦得（萬幸）.md
  summary: 第14節與流便支派並列，已在約但河東按著宗族受了產業，因此不列在第16-29節的分地名單裡。
  relation: 民32 迦得是提議的主導者，本章它只出現在一句解釋裡；GT《啟導本》註第16節只提九個半支派的首領，正是因為流便、迦得和瑪拿西半個支派已經安置在外約但。
- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  summary: 本章瑪拿西出現兩次，位置相反：第14節「瑪拿西半個支派也受了產業」講的是河東的那一半；第23節「約瑟的子孫瑪拿西支派有一個首領，以弗的兒子漢聶」講的是要在河西分地的那一半。
  relation: 同一個支派在同一章裡分屬兩邊，是民32 那次分裂留下的長期後果；BH 也註瑪拿西被分成東西兩半，是理解以色列地理與政治格局的關鍵。
- title: 約瑟
  path: link_folder/人物/約瑟.md
  summary: 第23節「約瑟的子孫瑪拿西支派有一個首領」。BH 註提到約瑟是要把分地接回神與亞伯拉罕、以撒、雅各所立的約，並說約瑟的一生是神看顧與信實的見證。
  relation: 約瑟一支在本章同時出現在兩份名單裡：瑪拿西半支派在河東（14節），瑪拿西與以法蓮各出一位首領在河西（23-24節）。
- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  summary: 第19節列在十位首領之首：「猶大支派有耶孚尼的兒子迦勒。」GT 丁良才註：「猶大在先，或因這支派的首領是早先做探子的迦勒。」GT《啟導本》註記述的次序似依分配土地的順序，從猶大和西緬開始、二支派分配在南部。
  relation: 民32 猶大支派是靠著睚珥的血緣間接出現；本章它以名單第一位的身分正式登場，並且它的次序就是日後從南到北得地的次序。
- title: 西緬
  path: link_folder/人物/西緬.md
  summary: 第20節「西緬支派有亞米忽的兒子示母利」，在名單裡緊接猶大之後。BH 註西緬的地業後來落在猶大境內（書19:1-9），與本章名單裡它緊接猶大的位置相合。
  relation: GT《啟導本》註名單從猶大和西緬開始，是因為這兩個支派分配在南部——名單的次序本身就是一張由南往北的地圖。
- title: 便雅憫
  path: link_folder/人物/便雅憫.md
  summary: 第21節「便雅憫支派有基斯倫的兒子以利達」。CT 給的名字字義：便雅憫「右手之子」、基斯倫「信心」、以利達「神喜愛的」。BH 註便雅憫地界日後包含耶路撒冷。
  relation: 便雅憫在本章只以一位首領的名字出現，但它在名單裡的位置（猶大、西緬之後）預示了它日後的地界就在猶大與以法蓮之間。
- title: 但支派
  path: link_folder/人物/但支派.md
  summary: 第22節「但支派有一個首領，約利的兒子布基」。CT 給的字義：但「審判」、約利「被放逐」、布基「口，浪費的」。BH 註但支派的地業在北部，後來與拜偶像連在一起（士18）。
  relation: 本章給但支派的是一份責任：布基要代表本支派參與分地。BH 把這份責任與但支派日後的偏離對照著讀。
- title: 以法蓮
  path: link_folder/人物/以法蓮.md
  summary: 第24節「以法蓮支派有一個首領，拾弗但的兒子基母利」，緊接在瑪拿西之後。BH 註以法蓮位置居中、日後常代表北國以色列。
  relation: 約瑟的兩個兒子在本章的名單裡前後相接（23-24節），這是他們在河西各自得地的正式安排。
- title: 西布倫（同住）
  path: link_folder/人物/西布倫（同住）.md
  summary: 第25節「西布倫支派有一個首領，帕納的兒子以利撒番」。CT 給的字義：西布倫「高貴的」、帕納「細緻的」、以利撒番「神所保護的」。BH 引創49:13 雅各的預言，說西布倫必住在海口、成為停船的港口。
  relation: 本章名單由南往北排，西布倫落在偏北的一段——它日後的地業與雅各預言的海口位置相合。
- title: 以薩迦（價值）
  path: link_folder/人物/以薩迦（價值）.md
  summary: 第26節「以薩迦支派有一個首領，阿散的兒子帕鐵」。CT 給的字義：以薩迦「有價值」、阿散「非常強壯」、帕鐵「神拯救」。BH 引代上12:32 說以薩迦人通達時務。
  relation: 以薩迦在名單裡緊接西布倫，兩個支派日後的地業也相鄰——本章的次序與後來實際的地圖對得上。
- title: 亞設（有福）
  path: link_folder/人物/亞設（有福）.md
  summary: 第27節「亞設支派有一個首領，示羅米的兒子亞希忽」。CT 給的字義：亞設「快樂的」、示羅米「和平的」、亞希忽「尊嚴的弟兄」。BH 註亞設分得迦南北部肥美之地，應驗創49:20 雅各的預言。
  relation: GT《啟導本》註名單「終於亞設和拿弗他利，所得土地在北部」——亞設是這條由南往北的次序中倒數第二位。
- title: 拿弗他利
  path: link_folder/人物/拿弗他利.md
  summary: 第28節「拿弗他利支派有一個首領，亞米忽的兒子比大黑」，是十位首領名單的最後一位。CT 給的字義：拿弗他利「摔角」、比大黑「被神救贖」。BH 引賽9:1-2 說拿弗他利地日後要見大光。
  relation: 名單以拿弗他利收尾，正因為它的地業在最北——這條由南往北的排列，是 GT 丁良才與《啟導本》都指出的線索。
- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 第2節「你們到了迦南地，就是歸你們為業的迦南四境之地」、第29節「在迦南地把產業分給以色列人」。CT 註本章的迦南地指約但河西之地（民32:32；書22:11、32）。
  relation: 民33 迦南是還沒進去的目的地，本章它第一次被畫出邊界、指定分配人——同一個地名在兩章之間從方向變成了範圍。
- title: 以東
  path: link_folder/地點/以東.md
  summary: 第3節「南角要從尋的曠野，貼著以東的邊界」。STEP 顯示「貼著」在原文的中心詞是 ye.Dei（H3027K，詞典形 yad），字面是在以東的手上；CT 的原文字義欄則註「貼著」原文無此字。
  relation: 民20 以東拒絕假道、民33 的行程表繞著它走，本章它成了應許之地南界的參照物——同一個鄰國，從障礙變成了界標。
- title: 加低斯
  path: link_folder/地點/加低斯.md
  summary: 第4節「直通到加低斯巴尼亞的南邊」。CT 註加低斯巴尼亞又名加低斯、位於尋的曠野南部；GT《舊約聖經背景註釋》說南界南達位於尋的曠野的加低斯巴尼亞，最後往西在阿里什乾河轉入地中海。
  relation: 民13-14 它是失敗的地點、民33 是四十年飄流的起點，本章它只是南界上的一個座標——同一個地名在民數記裡走完了三種身分。
- title: 鹽海
  path: link_folder/地點/鹽海.md
  summary: 第3節「南界要從鹽海東頭起」、第12節「這界要下到約但河，通到鹽海為止」——南界的起點與東界的終點都是鹽海。CT 註鹽海又名亞拉巴海（申3:17），即今死海。
  relation: KC 注意到這個首尾呼應：四界的描述從鹽海開始、也在鹽海結束；他並指出鹽海是所多瑪、蛾摩拉被毀的長久提醒。
- title: 約但河
  path: link_folder/地點/約但河.md
  summary: 第12節「這界要下到約但河，通到鹽海為止」、第15節「約但河東、向日出之地」。CT 註約但河和死海成為迦南地的東部天然邊界；GT《舊約聖經背景註釋》說最明顯的界線是東界和西界——約但河和地中海。
  relation: 民32 它是兩支派不肯過的河、民33 是行程表的終點座標，本章它是應許之地的東界——三章給了同一條河三種功能。
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: 第15節「這兩個半支派已經在耶利哥對面、約但河東、向日出之地受了產業」。CT 註『耶利哥對面』即指約但河東，因耶利哥位於約但河西。
  relation: KC 對這個定位有一個讀法：兩個半支派的產業與耶利哥連在一起、又特別提到那是日出的一邊，或許正指出他們半心半意的立場。
- title: 拈鬮分地（go.ral）
  path: link_folder/主題/拈鬮分地（go.ral）.md
  summary: 第13節「這地就是耶和華吩咐拈鬮給九個半支派承受為業的」。GT《聖經精讀本》註在這裡用拈鬮的方法，是為了讓以色列百姓明白土地的主人是神，以此防止對自己所分得的土地心存不滿。
  relation: 'STEP 顯示第2節「歸你們為業」的動詞是 na.phal（H5307I，詞典義 to fall: allot）——「落下」與「拈鬮」在本章是同一個畫面的兩端：鬮落下，地就歸屬。'
- title: 產業（na.cha.lah）
  path: link_folder/原文/產業（na.cha.lah）.md
  summary: 第2節「歸你們為業」的名詞是 be./na.cha.Lah（H5159）；第14、15節「受了產業」、第29節「把產業分給以色列人」用的是同一個字根。STEP 顯示第17節的動詞 yin.cha.Lu 是 H5157，與名詞同源。
  relation: 民27 這個字處理女兒的繼承、民32 處理支派要不要換地、民33 是分地的辦法，本章則把它用在整片迦南地的分配與執行人選上。
- title: 兩支派半求河東之地為業
  path: link_folder/事件/兩支派半求河東之地為業.md
  summary: 第14-15節重提流便、迦得與瑪拿西半支派已在約但河東受了產業，因此第13節的分地只給九個半支派。CT 註這是他們獲得摩西允准、有條件地分配在約但河東（民32:33）。
  relation: 民32 的決定在本章變成一項行政事實：分地名單少了三個支派的代表。CT 在〔話中之光〕說神一再題起兩個半支派在河東的事，是要讓百姓懂得正確活在祝福中的途徑。
- title: 埃及河
  path: link_folder/地點/埃及河.md
  summary: 第5節「從押們轉到埃及小河，直通到海為止」，是南界的最後一段。CT 註它是與埃及接壤的一條沙漠地小河（書15:4、47）；GT 丁良才註它就是埃及和非利士兩國當中的河。
  relation: 創15:18 它是神應許亞伯拉罕之地的南界起點，本章它是實際畫出來的南界終點——同一條河出現在應許與執行的兩端。
- title: 埃及河的地理辨識
  path: link_folder/解經爭議/埃及河的地理辨識.md
  summary: 第5節的「埃及小河」是應許之地的西南界點。GT《聖經精讀本》明說：「這個地方不是指埃及的尼羅河,而是指從巴蘭曠野流向地中海的沙漠河。」BH 也把它認定為阿里什乾河（Wadi El-Arish）而非尼羅河；GT《舊約聖經背景註釋》說南界最後往西在阿里什乾河轉入地中海。
  relation: 創15 那裡爭議的是「埃及河」是不是尼羅河，本章三套資料一致指向阿里什乾河，是這個辨識最集中的一次表態。
