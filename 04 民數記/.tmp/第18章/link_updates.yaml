book: 04 民數記
chapter: 18
updates:
- title: 立約的鹽
  path: link_folder/主題/立約的鹽.md
  summary: 第19節：「這是給你和你的後裔、在耶和華面前作為永遠的鹽約（鹽即不廢壞的意思）。」STEP 原文資料可確認這個詞組是 בְּרִית מֶלַח（be.Rit Me.lach，H1285 covenant＋H4417M salt）。
  relation: 各家的解釋集中在鹽的兩個性質上。GT 丁良才《民數記註釋》從立約的場合說：「古時的人，多在筵席上訂立條約（創三十一46），因此就將鹽作為雙方立約的標記。因為鹽在各種食物中，是不可少的。」GT《啟導本聖經註釋》從防腐說：「鹽能保持食物不易腐壞，古代近東民族多以鹽象徵永久。」BH 補上跨文化的證據：巴比倫、波斯、阿拉伯、希臘的文獻都證實了這個象徵性的用法。GT《舊約聖經背景註釋》另提出一個少見的角度：鹽有妨礙發酵過程的功用，而酵是悖逆的象徵，「所以鹽自然就成為防止悖逆的代表」——把這句話放回民16 剛發生過的叛變旁邊看，格外有意思。
- title: 至聖的供物（聖與至聖之分）
  path: link_folder/主題/至聖的供物（聖與至聖之分）.md
  summary: 第9-13節把祭司所得的東西分成兩級，吃的人與吃的地方都不同：至聖之物（素祭、贖罪祭、贖愆祭中不經火的部分）只有祭司家的男丁可以吃（v10）；聖物（舉祭、搖祭、初熟之物等）則「凡在你家中的潔淨人都可以吃」（v11、13）。CT 註明「潔淨人」指本身沒有不潔的狀況、也未沾染不潔（參利11-15章）。
  relation: GT 丁良才《民數記註釋》指出兩級的差別不只在人，也在地點：前一級要在會幕裡吃，後一級可以在家中吃。GT《舊約聖經背景註釋》說明為什麼分級：至聖的分是帶入會幕至聖特區的供物，指定歸給亞倫父子作為他們負擔重責的獎賞，「這些分與其他祭物不同，是不可分給家人同吃的」。KC 從這個分級讀出一層屬靈的意思：兒子代表真正在盡祭司職分的信徒，女兒代表原則上是祭司、實際上沒有進到裡面的信徒；素祭、贖愆祭、贖罪祭需要屬靈的成熟才吃得下，平安祭則是剛信主的人也能立刻享受的。
- title: 舉祭
  path: link_folder/原文/舉祭.md
  summary: 本章把舉祭用在三個層次上：以色列人獻給耶和華的聖物中的舉祭歸祭司（v8、19）、全國出產的十分之一是「獻給耶和華為舉祭的」（v24）、利未人再從所得的十分之一中取十分之一作舉祭獻上（v26、28）。STEP 原文資料顯示第19節的「舉祭」是 תְּרוּמֹת（te.ru.Mot，H8641，contribution），而「所獻給耶和華」的動詞是 יָרִימוּ（ya.Ri.mu），詞典形 רוּם（rum，H7311A，to exalt）。
  relation: 民15 的舉祭是廚房裡的第一塊餅，民18 的舉祭變成整套供養制度的名字。GT 丁良才《民數記註釋》把祭司所得列成八項，第八項就是「一切的舉祭」。值得注意的是那個動詞的另一個用法：民16:13 大坍、亞比蘭自立為王轄管之前，民16:30 的「擅敢行事」字面是「用高舉的手」，出自同一個 רוּם。同一個「舉起」的動作，一次是舉手抗拒神，一次是舉祭獻給神。
- title: 十分之一
  path: link_folder/原文/十分之一.md
  summary: 第21節首次指明什一奉獻的歸屬：「凡以色列中出產的十分之一，我已賜給利未的子孫為業；因他們所辦的是會幕的事，所以賜給他們為酬他們的勞。」第26-28節再加一層：利未人要從所收的十分之一中取十分之一獻給耶和華，歸給祭司亞倫。
  relation: GT《啟導本聖經註釋》指出本章在什一制度史上的位置：奉獻土地出產十分之一本為古制，亞伯拉罕、雅各都獻過（創14:20；28:22），「此處首次指明歸給利未族」。GT《民數記串珠聖經註釋》也指出利未人須作什一奉獻是首次的記載。CT 的〔話中之光〕把原則講得最直接：「利未人也需要作十一奉獻，支持神的工作。沒人有權不將所得的獻一部分給神。」GT 丁良才《民數記註釋》另記下現實的一面：以色列人往往忽略十分之一捐輸的事（瑪3:9-10），「甚至利未人屢次受了經濟上的困難（尼十三10）」。
- title: 贖銀五舍客勒
  path: link_folder/文化/贖銀五舍客勒.md
  summary: 第15-16節：頭生的人總要贖出來，不潔淨牲畜頭生的也要贖出來；「其中在一月之外所當贖的，要照你所估定的價，按聖所的平，用銀子五舍客勒贖出來（一舍客勒是二十季拉）」。CT 換算：五舍客勒約折合57.5公克，季拉約0.575公克。
  relation: GT 丁良才《民數記註釋》澄清一個容易誤解的地方：「要贖出來」不是叫祭司出五舍客勒銀子（這是父母當出的），乃是要祭司辦理這事，而那贖價的銀子必歸與祭司。他並指出這條規定的演進：先前神曾定規凡頭生的驢要用羊羔贖出（出13:13），「但恐驢主有時沒有羊羔，所以神後來就讓祭司估定價值（利二十七27）」。GT《舊約聖經背景註釋》另註明單位：這個舍客勒「等於銀子二十季拉（11.5克）」，而且「本節所指的，不是要到主前四世紀才出現的錢幣」。
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 本章把利未人的職責與待遇一次交代清楚：他們要與祭司聯合、服事祭司、看守會幕、辦理帳幕一切的事（v2-4），但不可挨近聖所的器具和壇（v3）；他們在以色列人中不可有產業，代替產業的是全國出產的十分之一（v21-24）。
  relation: KC 從名字讀出這個定位：利未人要歸入祭司，不是反過來——利未（Levi）的意思正是「聯合」（創29:34）；每一項利未人的服事，都要以讓祭司能更好地獻祭為目標。GT 丁良才《民數記註釋》列出他們不得有產業的三樣益處：「1利未人少有世務纏身，就能專心侍奉神；2他們代替百姓辦理事神的事，百姓供給他們一切的需用，因此就能生出彼此相愛互助的精神；3他們被分散在十二支派中，因此越發能盡引導教訓百姓的責任。」民16 是利未人越界爭祭司職分，民18 是同一批人的界線與待遇被正式寫定。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: 本章是祭司職分的完整章程：職責（v1-7）、供養（v8-19）、產業（v20）。第7節把兩件事並在一起說：「我將祭司的職任給你們當作賞賜事奉我。凡挨近的外人必被治死。」
  relation: GT 丁良才《民數記註釋》把祭司所得列成八項：「1一切分別為聖之物（8），2一切素祭，贖罪祭和贖愆祭中所存留不被焚的（9-10），3一切的搖祭（11），4一切初熟的五穀，並初成的油和新酒（12），5一切被獻之初熟的果子（13），6一切被永獻的（14），7一切頭生的人和牲畜（15），8一切的舉祭（19）。」而第20節把這一切收在一句話上：「我就是你的分，是你的產業。」CT 提醒賞賜的另一面：「任何權利的另一面都是責任，所以祭司在享有特殊的權利的同時，不能不負起特殊的責任。」
- title: 永遠當祭司的職任
  path: link_folder/神學/永遠當祭司的職任.md
  summary: '本章三次用「永得的分」「永遠的鹽約」來定這個職分的期限（v8、11、19），第23節也說利未人辦會幕的事「要作你們世世代代永遠的定例」。STEP 原文資料顯示第19節「永遠」的字是 עוֹלָם（o.Lam，H5769G，forever: enduring），在同一節出現兩次。'
  relation: 永遠的另一面是責任。GT《啟導本聖經註釋》指出：如果祭司或利未人未盡職守、以致有外人侵犯到他們的職務，須負疏於防守的責任；「祭司和利未人要擔當神的震怒，眾民的性命才得保存」。KC 則把這個「永遠」接到基督身上：本章的主題仍是我們倚靠主耶穌的祭司職分，而那是一個在復活能力裡的祭司職分。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 本章是全本聖經唯一一次神直接對亞倫說話而不經摩西（v1、8、20）。CT 註明原因：「神在此處單獨對亞倫說話，是因為本章的話是有關祭司和利未人的職責。」GT 丁良才《民數記註釋》講得更細：平常神曉諭摩西，或摩西和亞倫，甚至只關係亞倫一個人的事也先吩咐摩西；這一次直接對亞倫說，「大概也是神因為十六章上的事，要在百姓面前尊重亞倫的職分，使百姓也尊重他」。
  relation: 民16 他被叛黨指名攻擊，民17 他的杖發了芽，民18 神親自對他說話——三章連起來是同一件事的三個階段：先是職分被質疑，再是職分被印證，最後是職分被寫成章程。GT 丁良才《民數記註釋》歸納本章的兩個宗旨：「1要顯明祭司的職分何等尊貴，2要安慰百姓的心（參十七12-13）。」而神給他的產業是第20節那一句：「我就是你的分，是你的產業。」
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 本章前 24 節神都直接對亞倫說話，摩西到第25節才出現：「耶和華吩咐摩西說：你曉諭利未人說」……CT 說明為什麼這一段改由摩西轉達：「神將對亞倫所說的話(參1~24節)，向摩西證實，因為他是以色列全會眾的首領。」
  relation: 這是摩西在民數記裡少見的一章——他幾乎整章缺席。GT《民數記串珠聖經註釋》讀出其中的安排：神吩咐祭司的事情是直接向亞倫說的，但吩咐利未人的事卻間接透過摩西，「再次顯明利未人不能享有祭司與神直接相交的特權」。GT 丁良才《民數記註釋》補上一個實際的理由：第26節所吩咐的十分之一也是為供給亞倫和他的子孫，所以神把這些事吩咐摩西。
- title: 初熟
  path: link_folder/原文/初熟.md
  summary: 第12-13節把初熟之物整批劃給祭司：「凡油中、新酒中、五穀中至好的，就是以色列人所獻給耶和華初熟之物，我都賜給你。凡從他們地上所帶來給耶和華初熟之物也都要歸與你。」CT 註「初熟之物」原意是時間上最初成熟的穀物和果子，但也可能指品質上最好的（參出23:19；耶24:2）。
  relation: 民15 的初熟是家裡第一塊餅要舉起來獻上，民18 是這些獻上去的東西最後歸誰。GT 丁良才《民數記註釋》把「一切初熟的五穀，並初成的油和新酒」與「一切被獻之初熟的果子」分列為祭司所得八項中的第四、第五項。GT《舊約聖經背景註釋》則指出這一項的範圍：永歸祭司及其家人（不包括兒媳及僱工）之物件的最後一項，是一切初熟的收成（五穀、油、酒）和頭生牲畜的肉。
- title: 贖愆祭（asham）
  path: link_folder/原文/贖愆祭（asham）.md
  summary: 第9節把贖愆祭列入至聖之物：「以色列人歸給我至聖的供物，就是一切的素祭、贖罪祭、贖愆祭，其中所有存留不經火的，都為至聖之物，要歸給你和你的子孫。」第10節限定吃的人與態度：「你要拿這些當至聖物吃；凡男丁都可以吃。你當以此物為聖。」
  relation: 本章給贖愆祭定了它在供養制度中的位置：它與素祭、贖罪祭同屬最高一級，只有祭司家的男丁能吃、而且要在會幕裡吃。GT《舊約聖經背景註釋》說明這一級的性質：這些供物「一部分要燒在壇上，餘下的則成為祭司的聖食物」，只有在儀式上潔淨、聖潔程度足以食用聖供物的祭司才可以吃。KC 另從吃的人讀出屬靈的分級：這三種祭只給亞倫的兒子吃，不給女兒——要吃得下這幾樣，需要屬靈的成熟。
- title: 搖祭
  path: link_folder/原文/搖祭.md
  summary: 第11節：「以色列人所獻的舉祭並搖祭都是你的；我已賜給你和你的兒女，當作永得的分；凡在你家中的潔淨人都可以吃。」第18節再提一次：「像被搖的胸、被舉的右腿歸你一樣。」CT 分辨兩個動作的差別：舉祭是把祭物上下垂直擺動，搖祭是前後水平擺動。
  relation: 本章把搖祭歸進「聖物」那一級——不是至聖之物，所以祭司全家的潔淨人都能吃，而且可以在家中吃。GT《舊約聖經背景註釋》提醒這裡有例外：「本節所指的不是所有的搖祭，因為有些搖祭必須燒盡（出二十九22～25），又有一些是祭司中男丁專用的（利十四12～14）。」KC 則從第18節的胸與右腿讀出意思：胸代表主耶穌的愛，右腿代表祂的能力，而這正是剛信主的人也能立刻享受的一份。
- title: 舍客勒
  path: link_folder/原文/舍客勒.md
  summary: 第16節給出頭生者的贖價與換算：「按聖所的平，用銀子五舍客勒贖出來（一舍客勒是二十季拉）」。CT 換算成公制：五舍客勒約折合57.5公克，季拉約0.575公克。
  relation: 本章的舍客勒是「聖所的平」，也就是會幕所使用的標準衡量。GT《舊約聖經背景註釋》給的數字略有不同，並加了一個年代上的提醒：「贖回孩童和不潔牲畜所用的舍客勒，等於銀子二十季拉（11.5克）。本節所指的，不是要到主前四世紀才出現的錢幣。」BH 也強調同一件事：聖所舍客勒是一個特定的重量標準，比一般舍客勒重，用意是讓宗教交易有統一而公平的計算。
