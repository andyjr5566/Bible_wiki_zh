book: "04 民數記"
chapter: 18
updates:
  - title: "立約的鹽"
    path: "link_folder/主題/立約的鹽.md"
    summary: "民數記18:19宣告，耶和華將以色列人獻與祂為舉祭的一切聖物賜與亞倫及其兒女作永得的分，這是「在耶和華面前作為永遠的鹽約」。鹽象徵防腐、持守與長久不過期，表示上帝對大祭司之供奉養助如同不磨滅不變改之定約，歷久彌新而絕無悔退。"
    relation: "加添立約之鹽在祭司俸祿上的歷史定位，與利未記的素祭用鹽相呼應，見證上帝對其僕人世世代代的信實盟守。"

  - title: "至聖的供物（聖與至聖之分）"
    path: "link_folder/主題/至聖的供物（聖與至聖之分）.md"
    summary: "民數記18:9-10再次嚴肅確認了舊約禮制下「至聖的供物」與「聖物」的分等法則：素祭、贖罪祭與贖愆祭中存留不經火的皆屬「至聖之物」，僅有亞倫家的男丁能在聖處作至聖物吃食；而凡民奉獻的搖祭和平安祭肉等一般「聖物」，則放寬讓祭司合家潔淨家屬食用。"
    relation: "擴張了利未記2至7章對於「至聖之分與聖分」規矩落地執行的神話體，闡揚上天對全然恭順祭儀的神權品序區辨與對各戶得祿的分度守成。"

  - title: "舉祭（terumah）"
    path: "link_folder/原文/舉祭（terumah）.md"
    summary: "民數記18章為舉祭（terumah）提供了全般生活及事奉供應之總定綱：不論是以色列民敬獻於眾供中初熟甘甜珍貴油酒與牲羊之聖物舉起，還是全族的什一出產歸利未，乃至利未人在入庫後將頂上至好的一份再向亞倫家上呈敬獻之「十分之一中的十分之一」，通屬奉給上帝並作為賜食的舉祭。"
    relation: "徹底把舉祭的運用自利未記祭牲之祭台向社會生活供應網延伸：說明從獻祭果麥至祭師俸資雙軌輪轉中，奉獻的核心皆仰依於『舉起向主』的誠意與敬虔。"

  - title: "十分之一"
    path: "link_folder/原文/十分之一.md"
    summary: "民數記18:21-24是聖經史上最早清晰定型全以色列所獻十分之一將充作利未人看守會幕賞酬（即以勞資為產業）的明文憲律；並且在25-32節中首次規定：利未人絕不可因侍從職守而免回歸，仍要從領受的十分之一裡挑選上好精華的一成再次呈獻於大祭司亞倫及耶和華，成就『十分之一中的十分之一』新定例。"
    relation: "補充並擴大從創世記自願敬餽至利未記二十七章田物之例後的神意體系：把什一納獻落為保障無地者生計與信仰互靠互榮的良制。"

  - title: "贖銀五舍客勒"
    path: "link_folder/文化/贖銀五舍客勒.md"
    summary: "民數記18:15-16進一步將贖銀制度推廣為後代的長期法度：除首生牛隻綿羊等神聖供牲需直呈祭火血肉揚輝歸予祭司不可自贖外，凡頭生的男子或是非潔之獸皆當回贖；且重申規定自產滿一月外之對象，皆須按聖所標準——「銀子五舍客勒（一舍客勒即二十季拉）」全額辦妥，轉獻亞倫眾家長用。"
    relation: "延續民數記第三章點數 273 員多餘長子贖罪銀的權變處置，此處正式將其轉定為橫跨各世代、永世通存不衰的聖所長子常規贖額法度。"

  - title: "利未支派"
    path: "link_folder/人物/利未支派.md"
    summary: "民數記18:2-4與21-32記載上帝對利未支派事奉與生計的永久規範：他們獲召為亞倫的聯合團隊，在會幕周邊執行戍守與庶務以抵擋天怒，雖被禁止碰觸金器與祭壇，卻被賦予收取全以色列什一出產的法定薪勞，並定立再從十分之一中取百分之五（至上之一成）為舉祭歡歸大祭司與上帝。"
    relation: "徹底確立了利未支派作為「防護中保」及「民薪轉承」的經濟與事奉制度，闡釋為何依職無土卻坐領歲收與雙倍敬虔的聖潔定則。"

  - title: "亞倫和他兒子（祭司）"
    path: "link_folder/人物/亞倫和他兒子（祭司）.md"
    summary: "民數記18章完整規範了大祭司一家（亞倫和他兒子）的核心使命與生活保障：他們領戴獨家的金香壇內奉職紅線並擔當聖所與職任罪孽；上帝便將全國聖食中的至聖火餘歸為男丁食享、將各類和平舉祭與搖香右首賜為全家永享之鹽約俸賞，且更宣布主自己即是他們唯一的頂高業份。"
    relation: "把亞倫門戶在曠野試煉後遭民眾驚疑猜羨的外意轉為聖愛釋明，證明天授祭司乃是在最重責前承受天地主座長供不缺至福中宰。"

  - title: "永遠當祭司的職任"
    path: "link_folder/神學/永遠當祭司的職任.md"
    summary: "民數記18:7宣告主將祭司職任作為恩典的「賞賜事奉」頒行予亞倫父子，並設下任何世俗野將妄謀挨近必遭到神火殺死的高險屏護；在上帝絕對的主權揀封跟無改誓立之不損「鹽約」護衛之下，該職務絕非靠強武世鬥獵取，而是作為世代不易、神恩護守之大成傳世聖事。"
    relation: "重磅加固祭司長存傳承的本源理由，不僅源於舊約血脈吩咐，根基深植在神旨不變榮寵白贈的永續聖誓中，並為福音基督做祭首立竿。"
