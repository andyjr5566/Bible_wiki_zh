name: "上帝給予大祭司的特別賞賜與供職責任"
type: "神學"
secondary_types:
  - "文化"
  - "主題"
status: formal
definition: |
  耶和華在安排了繁重的殿堂守衛和贖愆責任之時，將「祭司的職任」不作天下苦差以論，而是直宣將其實現和託交給亞倫一系「當作賞賜事奉」。這一恩賜的本質，宣告了大衛以先至聖大祭祀的最高特權不為世間宗法競買奪佔或自炫勞勳的神權禮讚；得擔神火、掌血親殿皆因永生活主至為洪瀚的超額寵報；任何企圖強行染指、踰矩插足的未經呼召外民，定蒙刑戮受誅。
accumulations:
  - book: "民數記"
    chapter: 18
    summary: "神宣告大祭司看管至聖壇前全套奧儀的核心資格，並重申此為上天厚施予其家系的恩賜大禮，拒絕凡界競越與傲爭。"
    relation: "向世間自義爭權的暗黑人意宣發天道翻覆令：祭司之權極無人間武功與名望可圖，乃唯信者從主聖懷平白領得的垂顧長惠。"
    content: |
      當群氓仍為可拉餘烈和自身近門即亡的不堪絕地深深哀慟無際，耶和華自最高威嚴宣下了一言解毒且點洗萬載大恩的神性總斷：「你和你的兒子要為壇和幔子內的一切事，守祭司的職任...我將祭司的職任給你們當作賞賜事奉我。凡挨近的外人必被治死」（民十八7）。黃迦勒以極熱與極深的領悟剖揭這名曰「賞賜事奉」的大祭奇寶：「瞎眼的眾生竟把侍奉真神認成苦工與鎖累，甚至誤視作自傲揚尊的籌碼，卻忘盡這能直往帳內、行進烈石法堂的中保使分，完全是超脫地荒沉塵與人罪重累後的特赦大榮和奇貴恩餽！得近長王決非苦勞報稅，實是浩瀚聖靈獨出心懷頒來之無上至賞！」（CT）。

      丁良才與舊約傳統解說也對這一核心名意及祭祀體統精嚴申張：「希伯來文本中的「賞賜」強調此為不可用錢買、不可以家系血力或政爭掠拿的白白受遺！這把以民那慣犯之把爭當大長、圖謀權位之劣魔撕個稀爛；唯神點喚者享受金光聖殿無限平安事職，妄越這恩賞境界者只會被火誅絕！」（GT）。BibleHub 亦徹夜放光稱讚其終極天梯架設：「把罪擔轉換成賞賜的大職務，正正預繪出耶穌作為大天祭官甘心投往絕苦十架以為喜樂榮冕的偉圖；侍奉即賞，不求外俗！」（BH）。

      KingComments 亦放言直對這一榮寵厚使進唱千世禮拜的讚詩：「世人之情偏好推拒真正扛擔的孤默重罪，偏向自攬虛浮頭銜；這裡永神打破沉霧宣告：我已以最厚恩心將為天下解罪消怒的大禮物敬頒爾輩！此使職不是你應當勒贖別民之鞭，乃天王為存免蒼生浩劫而專獻給蒙眷大僕的長世無憂珍餽！」（KC）。此筆浩言宣揚到底：事上帝即成世界首大享祿受澤之事。
