name: "耶和華為祭司在死寂人境唯一的無地之分與永世產業"
type: "神學"
secondary_types:
  - "文化"
  - "主題"
status: formal
definition: |
  在中東民族重地、競逐耕原泥野與地緣堡壘的曠古世代中，耶和華對於立誓終身事使祂榮聖至愛的祭司家族宣達了一項看破塵途的深邃斷語：「你在他們的境上不干一町疆途、毫分沒占桑土；然而唯有我——至崇永世創宰——是你在以色列大荒長途和百般眾生頂裡頭最唯一的無對份額、極大至樂之豐美世祖遺業！」這一神學根源將屬靈侍使與爭取人境領土野心徹底割裂，宣示無尚無瑕的主格偉懷正是凌駕千川百城、成就最富盈不盡無休底祿產業。
accumulations:
  - book: "民數記"
    chapter: 18
    summary: "主於民二十節申論，亞倫宗族於迦南沃野不獲一撮耕疇定分，卻被升越封進擁戴上帝自身極勝靈藏為永世無量豐實大業。"
    relation: "此浩宣直把信僕由奪地成家世俗老枷重重打破，建樹唯得永生愛主為其生命終年唯一珍基的顛峰見證。"
    content: |
      當無盡鹽約喜聲猶響於會堂大殿側畔，一位天宰隨手在曠原黃土對著中保眾僕拉出一線最深痛又最拔奇遠的高世分領判詞：「耶和華對亞倫說：你在以色列人的地上不可有產業，在他們中間也不可有分。我就是你的分，是你的產業」（民十八20）。黃迦勒在此痛放驚叫、領受至美絕情：「俗世貪權奪爭者眼中只盯城隅泥土、稻金畜產，殊不知屬天真正長年護從火簾大府的忠貞王使，已然被宣令不用爭奪寸寸隨朽毀土；原因無他，那創制百穹巨洋與億姓金泉的至聖君神——親身便作你胸頭生世永遠不會枯朽耗折的大富樂地！你無寸土可鋤，卻因常抱永生天父而兼管並享極天萬世！」（CT）。

      丁良才與《舊約聖書大全簡析》亦長嘯刻繪此超越列邦慣律的名義真理：「以色列眾家得山水禾疇以為世代香木，獨留利未祭族空腹不領城郊野田（除居住及蓄畜牧坡）；天父不是叫彼等寒飢乞討，乃立此鐵石律示告眾神軍：神主本性方即永恆真正領富之源；無地才能專仰大聖賜恩，使彼不墜沉悶浮屠界！（參申十9；書十三14）」（GT）。BibleHub 大開其門指向千劫救恩的大美：「當這屬人眼力嫌哭荒寒無地之夜，早晨陽露照見天帝本榮便是宇宙最純豐饒；得耶穌至好同行已遠超越得著四表名土！」（BH）。

      KingComments 更將斯詩曲推至深遠天階的萬代高歌：「『我必為你的大份額』— 此等天音直向一切為神勞枯捨生的大侍祭唱響大歡歌！人奪俗業恐死懼敗，你看安息榮君直入胸前成長歲不毀的極冠珍業；沒有浮名疆野之愁，換受主君浩大甘恩相伴永存的大富！」（KC）。此神道一揮即碎百載泥疆鎖夢。
