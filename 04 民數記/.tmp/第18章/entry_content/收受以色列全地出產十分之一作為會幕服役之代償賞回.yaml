name: "收受以色列全地出產十分之一作為會幕服役之代償賞回"
type: "文化"
secondary_types:
  - "神學"
  - "歷史"
status: formal
definition: |
  在中東新興國家聖約法制中，耶和華特別制訂並重申了一座既深且厚的屬民反哺天道聖供體系——「十分之一」。此制度明示，因為利未支派眾長兵勇於承當沉重凶險、日夜戍守全會幕而終年無法投入農疇墾營、不享諸強地段；故天上帝王下詔：將以色列整地耕霖農作所產生的首富第一金順之額度——實存「十分之一」，盡數直提繳呈以犒答並維續全部利未僕從生活甘和需求；這是一方神天親定的「事奉代償工金」，使得天家勞工獲得飽潤永世安享的長效薪泉。
accumulations:
  - book: "民數記"
    chapter: 18
    summary: "耶和華昭示以色列全地產出之純潔十分之一額度均命給歸利未族口當常俸，用以報慰彼苦挑看帳衛所的勞心神擔。"
    relation: "建構並揭明屬神社群天和互動及靈工不受辱欠的恩賞法則：世上不求桑田祿位的守望大師必自黎苗收實的頂端盡喜得養。"
    content: |
      當天上發言宣告專任伺奉使團必將捨免天下耕畝長業時，那深識人性寒餓哀嘆、且不任苦僕餓衰絕愁的大上帝，長臂揮定無以倫比的社會回哺與薪供宏規：「至若利未子孫，我看，我已將以色列中出產的十分之一，也就是作他們眾人辦會幕之事的酬勞，通給了他們...因為以色列人奉獻給耶和華為舉祭的十分之一，我已給與了利未人為業」（民十八21-24）。黃迦勒熱血宣贊如此公義之盛制：「盲昧世靈每嫌供濟主宰事奉使僕者似有掠索貧民之嫌；神天在此痛撕惡執、重定真公：那肯拼亡替全邦看家擋煞、分承聖怒火刑之勇工，乃在為大地耕者流汗死衛！彼既在屬世領疇捨盡土權，聚天下豐禾十中取一生津甘祿以作其千載安養酬答，這是何其良美、極其光照人靈之長活榮則！」（CT）。

      丁良才與舊約經書聖山文化典目更精深探求這一「十分之一」歷史宏構的莊重大用：「古近東先世常存把歲禾一分提獻邦王之慣儀，神君在曠道明指本屬真神的大權年收不必留虛、盡入無地貧軍利未眾僕之長腹，這不曾只是哀憐濟乞，而是鐵鑄的酬苦工值與法律厚祿！藉斯一朝金盟，耕民敬歡獻金以全心事帝，侍僕甘心戍夜不受餓恐，造就神國第一光盛和合史證！」（GT）。BibleHub 大彰其指向無限長恩的福音呼喚：「十分之一乃見證物財皆源出上帝金恩；以子歸給勞軍，證明事王之家終身得福飽食、無有一點貧空！」（BH）。

      KingComments 更將這千古佳章化成一重永遠相敬相連的天堂家訓：「當會眾甘從辛苦手穀分抽至醇真利獻給大主，其實就在培育永不熄燈的神安樂牆；神愛護事候殿場的人如同己目，斷不讓你流離！這種神命代償把凡人偏計得失的自私之垢大肆洗淨，領進千歌百慶的奉歡國度！」（KC）。此筆一頒成建永邦事上帝不致挨衰的心靈甘林。
