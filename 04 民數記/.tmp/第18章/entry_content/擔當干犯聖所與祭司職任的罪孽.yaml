name: 擔當干犯聖所與祭司職任的罪孽
type: 神學
status: formal
definition: '民數記18:1：「你和你的兒子，並你本族的人，要一同擔當干犯聖所的罪孽。你和你的兒子也要一同擔當干犯祭司職任的罪孽。」


  這是第17章那句哀嘆（凡挨近耶和華帳幕的是必死的。我們都要死亡嗎？）的答覆。神的辦法不是把百姓推遠，是派人站在中間。


  「擔當」這兩個字在原文裡有兩層意思。GT 丁良才《民數記註釋》說得最清楚：「這兩個字，在原文上有兩個意思：一受刑，二贖罪（參出二十八38）。在基督裡，這兩個意思卻歸於一，因為祂不但受了世人應受的刑罰，也贖了世人所犯的罪愆。」


  CT 把兩種責任分開：「要一同擔當干犯聖所的罪孽」指有責任阻止任何人擅闖會幕；「干犯祭司職任」指不遵守祭司的條例。'
accumulations:
- book: 民數記
  chapter: 18
  summary: 'STEP 原文資料顯示第1節的「擔當」是 תִּשְׂאוּ（tis.''U，H5375J），詞典形 נָשָׂא（na.sa，to lift: guilt）——與民14:18 神「赦免」罪孽、民14:34 百姓「擔當」罪孽是同一個動詞。同節的「罪孽」是 עָוֹן（''a.Von，H5771G），「祭司職任」是 כְּהֻנָּה（ke.hu.Nah，H3550）。'
  relation: 這條規定的效果是雙向的。GT《啟導本聖經註釋》說明：如果祭司或利未人未盡職守、以致有外人侵犯到他們的職務，須負疏於防守的責任；「祭司和利未人要擔當神的震怒，眾民的性命才得保存」。GT《民數記串珠聖經註釋》舉了兩個剛發生過的例子：祭司要擔當干犯祭司職任的罪，例如利未人可拉入聖所獻香之罪；祭司與利未人則要擔當干犯聖所的罪，二百五十個首領入聖所獻香便是一例。KC 則把它應用到今天：真正在盡祭司職分的信徒，會為所處的群體感到有份的責任。
