name: "利未人自十分之一中向神獻呈至佳十分之一奉為至聖供物"
type: "神學"
secondary_types:
  - "文化"
  - "主題"
status: formal
definition: |
  在中東信仰秩序中，耶和華以嚴毅高聖的的公平定律宣告：既是作為事奉上天而獲領眾邦民人手奉之「十分之一」代償俸金的利未職使，切莫以苦役身分而妄想享有豁免敬尊聖神的獻祭自豪；主吩咐他們，必定需自遍野匯入其府上的整盤良禾收益底中，再精挑揀選出首屈一指、最純正極致的尖面核心第一好處，化作再度的「十分之一」當作至聖的舉祭禮供，莊敬提撥給掌朝大祭司。這一體系徹底粉碎了「神職可以輕忽敬順責任」的迷思，證實人人皆當向神深竭至美真心。
accumulations:
  - book: "民數記"
    chapter: 18
    summary: "神諭勒令利未軍群必須自收納全地歲出十分之一總量之中，摘出最好最純的一半十分之一奉為大主至佳貢實交配大祭司。"
    relation: "向凡在天家事任的信民發布無阿自驕戒條：全身上下無論如何辛勤看殿，仍然不得遺忘以己入息裡頭頂美上乘回獻賜榮上帝。"
    content: |
      當全以色列甘誠為神僕把黃金禾歲提撥十分之一奉養時，那深識靈傲與人性怠惰隱弊的造宰，對著享此尊養的利未千眾猛振一鐸萬勝警世長歌：「你又要曉諭利未人說：你們從以色列人那裡取了我給你們的十分之一，就是你們作他們的工資，你們就要從這十分之一中，取十分之一，為耶穌和華的舉祭...你們要從所受的一切禮物中，把至好的、至聖的交與耶和華為舉祭...就不會因這份擔當死亡罪責」（民十八25-32）。黃迦勒在此深刻洞明這無所避縱、萬民歸心的平等神律：「人情慣見苦心辦道者每生越縱特權的昏惑，自認為我行工多已足以抵沖獻奉責任，甚至以得賞驕狂不知圖思反哺！上帝在此撕決狂思，定規再宣：既享天恩薪糧，必定照樣自金收谷息中再挑至精首半提奉上帝與頂尊阿倫！毫無豁免特休之說，怠誤不呈便致蒙譴禍罰！」（CT）。

      丁良才與舊約文化背景註解把古原曠漠上不可摧裂的「再獻十中取一」進階制度作精準剖析：「古代祭場盛重等差，這裡主令利未人在坐擁盛產時必須提拔最上好的純油淨穀——即至極鮮上之份——送返高位亞倫。這不但平定天下無貧欠分階的平衡聖愛，更敲響了一道萬軍必隨的自潔號鼓：事候帝格之道決不是聚財饕餮之地；當你奉上首精大貢，你手中其餘食養才蒙真正洗濯成聖（與稼耕自獲無二），得以欣騰無懼地全口安生！」（GT）。BibleHub 亦光彰宣道者當存順卑獻靈：「即便替民扛罰的神兵至士，在真君高聖殿光前也僅屬受惠微臣，當長久存歡喜奉獻頂上真好品香之心！」（BH）。

      KingComments 更將斯雙層十恩禮運作推作萬代高歌：「這一神訓展示如此完滿：恩流不停歇、層層上升直至無天造王極前！百姓愛牧，牧臣奉聖，人人互帶敬畏喜樂心念把自己獲恩最豐碩光麗的真善雙面還寄造父之懷；不漏一人私享自肆，打落世心一切特許狂語！」（KC）。此鐵語破散人意特待猜妄，永護天工成聖。
