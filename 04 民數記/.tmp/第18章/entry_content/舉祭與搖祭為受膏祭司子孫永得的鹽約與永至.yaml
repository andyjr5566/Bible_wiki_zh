name: "舉祭與搖祭為受膏祭司子孫永得的鹽約與永至"
type: "文化"
secondary_types:
  - "神學"
  - "主題"
status: formal
definition: |
  耶和華既派亞倫及其家系在見證聖壇之前挑當至高而兇險的贖惡罪務，便以慈世不渝的超然大手為其籌謀定下無上優厚的心靈與豐盛物質安養，將百信眾民端奔獻上的所有舉祭、搖祭、沒入火中的除罪和平珍肉，以至於土上極美第一滴甜酒、精芳首麥與清厚橄欖好油，盡悉指名送還賜予約家之奉道使僕。上帝宣言這是借永不會朽爛衰臭、清正不渝的古老東方純真契約——「鹽約」，作你家門和世世大恩永流與受奉酬給的不僕憑證。
accumulations:
  - book: "民數記"
    chapter: 18
    summary: "上帝把諸多聖別而免投殘災大火中的上乘珍麥、清醇佳釀及至優淨肉大供指定交賜亞倫及其潔明子女家嗣，且封為不可衰解的一代鹽約。"
    relation: "破除塵界苦役自給與哀餓寒愁的神道保障，表明凡盡力投神護贖者必定享受來自不壞定誓的浩蕩純餽常至。"
    content: |
      自神殿發出「擔大干犯災禍之使」此震駭宣言之後，天上那位決不忍叫專勞事靈僕帥忍挨乾飢冷愁的高恩大主，長長引下無量寬憫的豐盈天糧宣告：「你以色列人歸與耶和華一切的物，就是所舉的供物，我都給了你和你的兒女...凡所獻的供物，都要存於你們。這是耶和華在你們和你們後代前頭，作至遠存續的鹽約」（民十八8-19）。黃迦勒熱切開釋此等榮歸奉獻的無比聖愛：「莫忘那真正拋棄世俗爭利、捨生挺立金簾黑殿前的中保使職，絕不被天君丟去吃枯糠爛葉；凡百黎攜進殿宇極香、頂鮮、最甘芳優厚的平安熟食與金酒初花，通當化做使君長嗣歡騰取用的聖餐珍養！這表明真王絕不虧少任何專一仰望天家的高使！」（CT）。

      丁良才與舊約文化背景註解把古原曠漠上不可摧裂的「鹽約」聖誓作深入追源與輝映：「古代黎凡特王君與盟友惃惃約下重誓，必拿至乾不可壞朽、能抗邪禦滅的精海潔鹽分嘗為誌（利二13；代下十三5）；鹽性千年無衰不變，暗指此供給合誓決無悔滅可能，乃永安常駐的大約！這替終年擔打苦難事職的人性家園構築了一面永遠屹立的金甲後盾！」（GT）。BibleHub 及深度辭海更闡說其超越屬天的活道：「至聖品飲與純榮平安祭肉唯乾淨者堪嚐，顯出侍君生機須在無疵之中與永真上帝同宴歡和；鹽即絕了貪念魔垢的心中之聖約，世俗推奪者毫不配沾」（BH）。

      KingComments 對此千載長青的喜恩糧誓留下澎湃長謳：「這美麗的聖山盟誓不僅宣告主如何飽潤亞倫之戶，更揭曉主怎樣用永遠的新鹽妙契包垂天下所有蒙揀大信！作上帝長兵不必驚哭衣穿飯渴，當全地之豐好極華源源湧向帳庭時，最鮮首珍全會奉作蒙召中保無限安饗之恩禮！」（KC）。一紙不腐精鹽直護萬載千福的大長生契約。
