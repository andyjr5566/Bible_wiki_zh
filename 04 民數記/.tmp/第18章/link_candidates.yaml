candidates:
  - name: "擔當干犯聖所與祭司職任的罪孽"
    type: "神學"
    source: "民數記第十八章第一至五節：耶和華對亞倫曉諭，大祭司一家與利未眾人聯手捍衛聖潔，要一同擔當干犯聖所與祭司職任的罪孽。"
    justification: "指明神聖服事的崇高與威嚴：祭司與利未人立於會幕前為百姓抵擋耶和華的忿怒與威譴，其職分既是恩賜亦是防衛界限；若未受託付以外人擅入，必承受神聖刑罰。"

  - name: "祭司與利未人的職任為神之賞賜"
    type: "神學"
    source: "民數記第十八章第六至七節：神言明將利未人揀選出來歸與亞倫為賞賜，又將祭司的職任給亞倫和他兒子（祭司）當作賞賜來事奉神。"
    justification: "表明侍奉神絕非世俗對榮耀與權位的競逐，而是上帝在恩典中直接賜予的禮物與特權；唯有在使役與敬虔中仰靠主意，始為領受神家福杯之路。"

  - name: "耶和華是事奉者的業與分"
    type: "神學"
    source: "民數記第十八章第二十節及二十四節：耶和華對亞倫及利未子孫諭命，他們在以色列人中不可有土地為產業；『我就是你的分，是你的產業。』"
    justification: "舊約啟示中對神僕與信徒最高的一項屬靈供應應許：說明放下 earthly inheritance 並非剝削或短缺，因為造化之主本身的無限豐盛成了信奉者終極長安無虛的財富歸屬。"

  - name: "利未人的什一奉獻"
    type: "神學"
    source: "民數記第十八章第二十五至三十二節：耶和華定規利未人從以色列人民收取什一奉獻做為工酬後，務需從這十分之一中取百分之五（又一十分之一）的至好的舉起歸予亞倫與神。"
    justification: "顯露屬靈奉獻與見證雙軌成全原則：無論有多沉重繁長的事宰任務或身在如何殊榮的恩差前，全然不能推卻獻呈恩好給主的責任；將最好珍貴先交回，所剩方被視同正安之賜享調安而無死譴。"

  - name: "古代近東以什一奉獻為神職薪酬"
    type: "文化"
    source: "民數記第十八章第二十一至二十四節及《舊約聖經背景註釋》：探究古近東美索不達米亞、埃及與迦南各地中稅制奉貢習性與以民國社互哺供賞制度的異同史考。"
    justification: "彰顯上帝在舊約時期命題建置的高質關切：周邊帝邦之稅項率皆輸奔入君王掌院及皇朝霸政；唯以國在神旨統理下，經明令將頂純穀果直奉辛作看幕擋譴的利未戶員，實現信仰彼此顧守與自給之道。"

  - name: "立約的鹽"
    type: "主題"
    source: "民數記第十八章第十九節：凡以色列人所獻給耶和華的聖物舉祭，均賜與亞倫和其家屬作為永得的分，「在耶和華面前作為永遠的鹽約」。"
    justification: "重申古代近東與上帝立盟中的永遠不朽精神：鹽約表徵神聖應許與供職酬祿的穩定、持守與不過期，印證上帝恩賞不容廢弛。"

  - name: "至聖的供物（聖與至聖之分）"
    type: "主題"
    source: "民數記第十八章第九至十節：區分火祭中存留未焚之「至聖的供物」（素祭、贖罪祭、贖愆祭），僅限亞倫家男丁在聖處食用。"
    justification: "界定會幕事奉與享福權益的聖潔等級，彰顯神明聖所禮度中的秩序與莊嚴，並對照新約信徒敬畏享受基督聖工的態度。"

  - name: "舉祭（terumah）"
    type: "原文"
    source: "民數記第十八章第八、十一、十九、二十八節：一再提及上帝將以色列人歸屬為主之「舉祭」（terumah）全撥交與祭司和利未眾人。"
    justification: "指確舉祭不僅限於殿內燃獻之物，更向外鋪構出祭司工薪與利未支派維生之全幅社會宗教供應機制，以舉高表彰對神至高的承認。"

  - name: "十分之一"
    type: "原文"
    source: "民數記第十八章第二十一至二十四節：神將以色列人出產的十分之一，全面賞給利未支派作為看幕使事之工酬和永續遺業。"
    justification: "奠立全聖經對於什一奉獻最核心的法典精神：將民間地頭歲出轉任為辛作護靈神臣的生活泉養，打造彼此依傍榮耀之上天國憲。"

  - name: "贖銀五舍客勒"
    type: "文化"
    source: "民數記第十八章第十五至十六節：凡一切自胎生出之外人首子與非潔淨獸羔，長滿一月者須以聖所秤銀五舍客勒贖回致歸亞倫。"
    justification: "使第三章點收多餘第一伯長子的贖銀變換，正式成為貫隨往後長遠祭職歲月中的恆規神課與家庭信仰奉納制度。"

  - name: "利未支派"
    type: "人物"
    source: "民數記第十八章第二至四節、二十一至三十二節：利未全體蒙選陪伴祭長合隊行護帳之役，又自民取一成俸餉、再自中精轉良貢。"
    justification: "明確勾塑出利未族團於荒漠征途及千秋歷史上的定位：沒有地皮私產，唯用護帳屏火之辛勞承受人民反哺並恭維祭座天朝。"

  - name: "亞倫和他兒子（祭司）"
    type: "人物"
    source: "民數記第十八章第一、七、九至十九節：大亞倫父子領銜主掌殿內血供壇香，肩佩重愆並承受天地第一甘美恩俸鹽契。"
    justification: "表露亞倫宗家在上帝主權恩選底下的殊聖尊銜：擔禍第一、侍天專職，且在無垠塵疆中得以坐賞天神本座無與倫比的回賜與厚待。"

  - name: "永遠當祭司的職任"
    type: "神學"
    source: "民數記第十八章第七節：上帝親言「我將祭司的職任給你們當作賞賜事奉我」，這使侍立者得把奉祭血儀傳承下去，永遠守衛聖地。"
    justification: "徹底詮明祭職之所以能夠橫越多代永存不壞，皆靠主君以主導不搖承命喜悅白白授出之特別禮物與浩揚賞報，不可藉世俗強勢奪篡。"
