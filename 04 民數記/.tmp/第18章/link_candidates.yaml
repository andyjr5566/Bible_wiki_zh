candidates:
  - name: "祭司與利未人聯合承擔干犯聖所與神職的重任"
    type: "神學"
    source: "民數記第十八章第一至七節：大祭司亞倫與哥轄暨利未眾人聯手捍衛聖潔特權的生死職務與嚴肅神旨。"
    justification: "直指舊約乃至整個基督真道之聖潔圍欄與中保代死機制：事奉極具大幸同時肩承重罪警衛；未受宣命外人若擅步直赴必定罹戮，預卜新約教會大體系各遵恩旨同為上帝永固帳戶擔苦盡忠。"

  - name: "上帝給予大祭司的特別賞賜與供職責任"
    type: "神學"
    source: "民數記第十八章第七節：『我將祭司的職任給你們當作賞賜事奉我。凡挨近的外人必被治死。』"
    justification: "徹底將天家『高爵祭職』自世人企求競戰的金權本色洗脫；證明得任中保與祭師是極白白救回來的浩盪主靈特別恩赦（榮寵賞賜），絕不容傲心驕將強手把持或倒妄推賴為苦勞奴累。"

  - name: "舉祭與搖祭為受膏祭司子孫永得的鹽約與永至"
    type: "文化"
    source: "民數記第十八章第八至十九節：耶和華自眾多無須火化之至聖平安祭肉、初成佳酒油麥乃至永遠不壞、以純監『鹽約』奠言大存的千秋祭餽。"
    justification: "展示出天道最為深長美麗而持實常在之天養契約——古東聖邦慣拿不可朽變腐毀的鹹實堅海鹽明言永遠不易；以此保訓大祭司及盡奉使員一身上下既竭誠不懈侍上帝於金廷，主即以不移甘誓餽賞長糧永弗落空。"

  - name: "耶和華為祭司在死寂人境唯一的無地之分與永世產業"
    type: "神學"
    source: "民數記第十八章第二十節：主王直諭亞倫『你在以色列人地城境上不占桑田產業、眾世無分；唯獨我至王即你天身所占底份、為爾厚福珍貴浩蕩豐產！』"
    justification: "這是全部經書最崇聖深微而動人心魄的一座頂層心命宣告：宣白奉神人於茫紅蒼苦地間莫求泥耕田畝之貪厚小權，緣於創造海靈浩聖君宰耶穌己主真身化屬其永久藏庫大賞、直成無極最豪大富有者。"

  - name: "收受以色列全地出產十分之一作為會幕服役之代償賞回"
    type: "文化"
    source: "民數記第十八章第二十一至二十四節：神下令集眾邦五穀地恩出產第一分即十分之金谷，盡供利未無田親身常吃以為辛苦扛看天廷辛差酬謝。"
    justification: "這是神權聖土第一期奠定以國本出產反哺聖禮使眾的生活宏圖；不但揭現侍奉主者堪受薪敬非屬掠取強捐，更加宣召眾信把耕耘日薪誠敬交投合欢奉揚的神人攜助互存盛道。"

  - name: "利未人自十分之一中向神獻呈至佳十分之一奉為至聖供物"
    type: "神學"
    source: "民數記第十八章第二十五至三十二節：利未侍軍從群生手領所得一成恩物底內，必挑摘當中首一號最淨最好的頂半珍分再度提為上帝之金貴新貢轉敬呈大祭長司。"
    justification: "擊碎了一切『伺侯主靈即可以豁免奉天之責任』的盲昏誤識；展明自愛眾牧神工同樣得將收授酬養裡的尖高之純（首金之精）崇真奉還！漏忘交酬必招身陷污逆罰咎；行道乃無虞受福享壽於世前。"
