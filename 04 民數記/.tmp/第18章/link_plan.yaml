B_needs_update:
- name: 亞倫
  suggested_type: 人物
  evidence: 本章是全本聖經唯一一次神直接對亞倫說話而不經摩西（v1、8、20）。GT 丁良才《民數記註釋》說明原因：本章的話與亞倫和他的子孫大有關係，「大概也是神因為十六章上的事，要在百姓面前尊重亞倫的職分，使百姓也尊重他」。KC 也指出這是唯一的一次。既有條目累積至民17，缺本章。
  match_type: exact
  existing_title: 亞倫
  existing_path: link_folder/人物/亞倫.md
- name: 摩西
  suggested_type: 人物
  evidence: 第25節神轉而吩咐摩西，把利未人也要納十分之一的規定交代下去。CT 說明為什麼這一段改由摩西轉達：「神將對亞倫所說的話（參1~24節），向摩西證實，因為他是以色列全會眾的首領。」GT《民數記串珠聖經註釋》指出這正顯明利未人不能享有祭司與神直接相交的特權。既有條目累積至民17，缺本章。
  match_type: exact
  existing_title: 摩西
  existing_path: link_folder/人物/摩西.md
- name: 初熟
  suggested_type: 原文
  evidence: 第12-13節「凡油中、新酒中、五穀中至好的，就是以色列人所獻給耶和華初熟之物，我都賜給你」。CT 註「初熟之物」原意是時間上最初成熟的穀物和果子，但也可能指品質上最好的（參出23:19；耶24:2）。GT《舊約聖經背景註釋》把它列入祭司特權清單。既有條目累積至民15，缺本章。
  match_type: exact
  existing_title: 初熟
  existing_path: link_folder/原文/初熟.md
- name: 贖愆祭（asham）
  suggested_type: 原文
  evidence: 第9節「一切的素祭、贖罪祭、贖愆祭，其中所有存留不經火的，都為至聖之物」。GT《舊約聖經背景註釋》指出這三種祭的一部分要燒在壇上、餘下的成為祭司的聖食物；KC 另指出這三種祭只給亞倫的兒子吃，不給女兒。既有條目累積至民6，缺本章。
  match_type: exact
  existing_title: 贖愆祭（asham）
  existing_path: link_folder/原文/贖愆祭（asham）.md
- name: 搖祭
  suggested_type: 原文
  evidence: 第11節「以色列人所獻的舉祭並搖祭都是你的」；第18節「像被搖的胸、被舉的右腿歸你一樣」。CT 分辨兩者的動作：舉祭是上下垂直擺動，搖祭是前後水平擺動。GT《舊約聖經背景註釋》另指出本節所指的不是所有的搖祭，因為有些搖祭必須燒盡（出29:22-25）。既有條目累積至民8，缺本章。
  match_type: exact
  existing_title: 搖祭
  existing_path: link_folder/原文/搖祭.md
- name: 舍客勒
  suggested_type: 原文
  evidence: 第16節「按聖所的平，用銀子五舍客勒贖出來（一舍客勒是二十季拉）」。CT 換算：五舍客勒約折合57.5公克，季拉約0.575公克。GT《舊約聖經背景註釋》：「贖回孩童和不潔牲畜所用的舍客勒，等於銀子二十季拉（11.5克）。本節所指的，不是要到主前四世紀才出現的錢幣。」既有條目累積至民3，缺本章。
  match_type: exact
  existing_title: 舍客勒
  existing_path: link_folder/原文/舍客勒.md
