organization: "### 祭司與利未人於會幕中的職務大定與中保責任（v1-7）\n\n民數記第十八章在整個出埃及舊約敘事及神界權柄體統的揭露當中，扮演著一座將災禍的震懾順利導引至安定垂顧與平安秩序的雄壯神道橋樑。上接第十至十七章所一再重演的大規模騷動：由可拉黨反悖所牽扯出的爭奪祭權狂焰、兩百五十尊銅香爐遭神火燒殘的慘酷收場、大地龜裂破滅的凶途、乃至亞倫發芽熟杏木杖擺陳在法櫃前的最後裁判。經歷一連串心肝皆破的浩大炎罰後，以色列百姓陷入了一層極具絕望色彩的心魂崩潰之中，狂嘯發嚎著：「我們死啦！我們滅亡啦！都滅亡啦！凡挨近耶和華帳幕的是必死的。我們都要死亡嗎？」（十七12-13）。全能天父既深恤屬血人類在經歷震慄後的極度無依，便在此破曉開卷，面向亞倫直接大宣垂恤生機，重立這套分憂解怒、由大祭祀家世替天下擋罪的無上中保大架構——正是[[祭司與利未人聯合承擔干犯聖所與神職的重任]]與相關重令（v1-5）。「耶和華對亞倫說：你和你的兒子，並你本族的人，要一同擔當干犯聖所的罪...又要使你弟兄利未支派，就是你祖宗支派的人，一同過來，陪伴你，事奉你...免得他們和你們一同死亡」（v1-3）。\n\
  \n黃迦勒在其釋讀中無限深致地領受此中中保的浩嘆偉歌：「屬肉世界的常情莫不是對殿堂高職垂涎熱愛，爭逐居榮得譽的表層好處，知之者稀者莫大如這鐵言真判：受召居位絕非自炫無虞榮寵，反倒是站往炎雷浩災尖谷前頭、甘心分吃並一肩雙拱頂下來致聖威怒下的可怕罪障與死亡刑重！神叫事使一眾聯結同禦，正是去撐造一面長青的屏障護道，叫那些盲昏蠢民得以安居會棚外圈而非碰入大誓死亡深谷」（CT）。\n\
  \n```mermaid\nflowchart TD\n    A[\"以色列全眾絕死悲嚎：「我們靠近會幕皆定盡滅」\"] --> B[\"全能主父降下一對二聯重牆的生死守護諭命\"\
  ]\n    B --> C[\"外牆防線：利未大宗士族分團伴從（負責護視會棚全具物庶務）\"]\n    B --> D[\"內核金峰：大祭司亞倫與正系子息（死死死戍核心金約幔及全獻血燔祭座）\"\
  ]\n    C & D --> E[\"形成萬世弗破安民大牆：消止上帝威譴聖怒不再斬擊荒奔愚氓\"]\n```\n\n丁良才及舊約經典背景釋註深入辨明此內外兼防的聯璧機制：「希伯來文中利未本名原來即懷抱著『聯接與同棲』的大思；今日他們榮耀地從合萬之眾裡拔領前進相扶阿倫事司，但在絕嚴至聖的黃金秘堂上，主心斬決下了生死紅線：僅祭長神君之胤才得越近燒火和心心贖契！此既宣講神性無情偏袒容不得自取妄動，同時卻是把千層天盾加疊護固」（GT）。\n\
  \n而在極其分明嚴苛的擔罰戒宣之後，造化真靈大言高昇，為天下千古奉行使命的高潔工臣澆下長露和甘恩喜音，大顯那聖榮真旨，也正是[[上帝給予大祭司的特別賞賜與供職責任]]（v7）。「你和你的兒子要為壇和幔子內的一切事，守祭司的職任...我將祭司的職任給你們當作賞賜事奉我。凡挨近的外人必被治死。」KingComments\
  \ 氣勢無限澎湃地闡發這一至高正名與福音喜宴：「悖言流黨始終錯拿屬神天職作成傲慢強凌的權位競爭，耶和華自金闕發力把其劣心敲得粉碎！主宣口指出：那長年涉險承死苦戰的贖罪聖祀，全因創造聖慈憐惠平平無由餽授於大信心使之賞饋恩寶；凡世貪功外漢意欲強行偷篡這大榮幸寵必然滅禍！」（KC）。BibleHub\
  \ 更把這榮大天道延伸探向無私聖父：「唯神自遣的使帥堪背罪軛；能作上主身前中保者即屬平空獲賞無限喜靈！天下無比的大大樂事，正在於敢擔人苦而成全順命殿祀」（BH）。\n\
  \n| 事主聯防護制分區 | 所擔當的核心神職領域 | 所需承負的神聖天討與榮寵天誓 |\n| :--- | :--- | :--- |\n| **利未同宗輔隨戰團**\
  \ | 看守帳幕四表庶務、執管運移、守望庭外阻擋狂俗進侵。 | 不可近踏黃金心器及燔火重陵；誤越即死；以同伴身姿成固防衛重壕。 |\n| **亞倫長職大祭本院**\
  \ | 直往至聖幔幕最奧深地；掌使熱燒火地及鮮純紅血獻揚。 | 自承干犯聖所重過之生責；為天父格外恩賜的『榮愛喜賞』大遺產，專吃中保千恩。 |\n\n> [!note]\
  \ 事道承罪大榮\n> - 「神把至危至顯的重務名狀作白授好禮；此語解散了人世把神位當狂耀榮祿的愚夢，證明甘肩刑責才是得帝獎顧的心鑰。」(CT)\n> - 「利未之伴與阿倫之守將會幕死河轉成天下樂源；莫愁不能登火壇，當嘆有神中保相挺生靈！」(BH)\n\
  \n### 祭司至高的永恆賞祿與不可廢毀之鹽約（v8-20）\n\n在親聲立誓將會所沉罪大關全權歸交於亞倫正統系身中之後，天道之王隨即展開了曠歷古今天下最廣厚豐蔚的回慰之典。創造主決不叫甘願終歲藏臥於荒寒會帳、捨棄四向泥疆追獵的小民陷入半縷餓空枯老，而是借此洪大宣告奠約下了神聖厚實的供給——即[[舉祭與搖祭為受膏祭司子孫永得的鹽約與永至]]（v8-19）。「耶和華對亞倫說：我已將我的舉祭，就是以色列人一切的分別為聖的物，交給你看守...全獻給君主不可投火燒化的各等素貢、罪過除赦、安懷歡宴祭品...凡全境首綻甜潤橄欖華油、絕頂麥金芳穗與早時酒蜜都將化為爾嗣終古歡慶不竭的新餽。此是我在真面與爾後裔子苗結鑄萬載毫無料減變遷的鹽約」（v8-19）。黃迦勒沉浸讚歎這一席神榮珍餉的無限善待：「請俯聽我們至聖真光對於為義當勞不求虛利者的宏偉保單！世上獵權常伴算斗與憂竭，但侍守真光的主工豈是一寒苦奴？上帝把自己案表前最高厚喜美的大恩珍味直接端赴為阿倫一家甘潤長餉！凡全族未玷不汙之口通當坦無懼慮與主宴樂此厚寵長祿」（CT）。\n\
  \n```mermaid\ntimeline\n    title 大殿鹽約不可腐替的萬曆酬賚長卷\n    早發甘露佳禾 : 百姓向神歸呈全土首滴珍麥醇油喜釀\
  \ : 盡數指定劃赴亞倫公廚喜飲\n    不經火毀喜祭 : 所有未曾焚作白煙之無罪神肉及精粉高團 : 直成祭臣聖嗣飽懷歡榮佳膳\n    長簽古卷精鹽 : 用決不磨朽腐臭、萬代保剛潔純的鹹安鹽契\
  \ : 宣告此恩無際恆存不遷莫移\n```\n\n丁良才及舊約嚴格背景釋疑對這難以摧替的「鹽約」聖誓及奉祭制度作出深入開拓：「古經近東列土長世結交莫大的邦交厚誓，多喜捉進純堅不蛀莫死莫亡的海海極白堅鹽作為無情悔移之憑證（參利二13；代下十三5）；天光不用片麻危簡，卻親宣把萬流佳歲歸成祭工世代享受長甘的純堅鹽卷，直令天下窺探猜算天朝俸祿者肅然噤唱！」（GT）。BibleHub\
  \ 及精湛經疏更大唱基督同餐甘旨：「平安良犧非庸徒得嘗，證明順道忠勤使臣日日享有與至天活君筵上分光榮幸，沒有塵食衰老」（BH）。\n\n而在如此璀璨不腐的萬里聖糧宣告尾聲，耶和華自太初極峰猛烈落下了一發令千邦大地俯首相隨、將生死物利看空拔淨至極的神性最高榮示，也成了千載至崇傳承——即[[耶和華為祭司在死寂人境唯一的無地之分與永世產業]]（v20）。「耶和華對亞倫說：你在以色列人的地上不可有產業，在他們中間也不可有分。我就是你的分，是你的產業。」黃迦勒熱狂淚出闡寫這種拋卻沙原、直得創皇神軀為終年財富的大超脫：「蠢頑血心總是哭叫不分片隅田疆必定老於乞絕；哪裡透知能把天地長海一肩直捏的永生成創神——祂聖格神榮本人必定成為你的無限田壤與厚盈金庫！你放棄了在微賤紅泥間奪奪殺殺一息領丘，反而承入活天大主神軀、遍享浩大歡欣榮足的天下至偉產遺！」（CT）。KingComments\
  \ 也縱吟出悠雅長贊：「『我本身便是爾的大定分』——這是任何邦王無以媲對的極恩盟語；當常士抱田防懼成虛，事帝重匠直接在永主心肝中躺享有定無缺，千古成冠！」（KC）。\n\
