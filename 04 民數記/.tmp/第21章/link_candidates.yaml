candidates:
- name: 戰勝亞拉得王
  type: 歷史
  source: 民21:1-3：亞拉得王擄了以色列人幾個人，以色列人發願盡行毀滅其城邑，得勝後那地方名叫何珥瑪。
  justification: 新一代第一場勝仗，發生在三十八年前戰敗的同一個地名上；原候選名為章摘句，無法跨章累積。
- name: 厭惡淡薄的食物與火蛇之災
  type: 事件
  source: 民21:4-7：百姓因路難行心中煩躁，說「我們的心厭惡這淡薄的食物」，耶和華使火蛇進入百姓中間。
  justification: 本章怨言與管教的完整段落；「淡薄」的原文 qeloqel 有專門的來源討論。原候選名為章摘句。
- name: 舉銅蛇望而得活
  type: 神學
  source: 民21:8-9：「你製造一條火蛇，掛在杆子上；凡被咬的，一望這蛇，就必得活。」
  justification: 全章最重要的預表，約3:14 直接引用；四套來源都有大段註解。原候選名為章摘句。
- name: 耶和華的戰記
  type: 文化
  source: 民21:14：「所以耶和華的戰記上說：蘇法的哇哈伯與亞嫩河的谷」。
  justification: 一本已佚失的古代詩歌集；CT、GT 丁良才、GT《啟導本》、GT《串珠》、GT《精讀本》、GT《舊約聖經背景註釋》、GT《靈修版》與 BH 都有註解，原候選名把它與行程表混在一起。
- name: 井之歌（比珥掘井）
  type: 文化
  source: 民21:16-18：以色列人到了比珥，唱歌說「井啊，湧上水來！」，這井是首領和民中的尊貴人用圭用杖所挖所掘的。
  justification: 出埃及以來第二首歌；用圭用杖的原文有可查的證據。原候選名為章摘句。
- name: 基抹（摩押的神）
  type: 背景
  source: 民21:29：「摩押啊，你有禍了！基抹的民哪，你們滅亡了！」
  justification: CT、GT 丁良才、GT《啟導本》、GT《串珠》、GT《精讀本》、GT《舊約聖經背景註釋》（含米沙碑文與埃卜拉神祇名單）、KC 與 BH 八處都有註解，語料庫無節點。
- name: 巴珊
  type: 地點
  source: 民21:33：「以色列人轉回，向巴珊去。巴珊王噩和他的眾民都出來，在以得來與他們交戰。」
  justification: CT、GT 丁良才、GT《啟導本》、GT《串珠》與 GT《舊約聖經背景註釋》都描述了它的位置與物產，語料庫無節點。
- name: 火蛇（saraph）
  type: 原文
  source: 民21:6：「於是耶和華使火蛇進入百姓中間，蛇就咬他們。」
  justification: 既有條目的本章累積是機器亂碼，需重寫；STEP 可確認原文是兩個名詞並列。
- name: 銅蛇（nehushtan）
  type: 原文
  source: 民21:9：「摩西便製造一條銅蛇，掛在杆子上」。
  justification: 既有條目的本章累積是機器亂碼，需重寫；STEP 可確認蛇與銅兩字的字形關係。
- name: 亞摩利人
  type: 人物
  source: 民21:13、21-31：亞嫩河從亞摩利的境界流出來；西宏是亞摩利人的王。
  justification: 既有條目的本章累積是機器亂碼，需重寫；GT《舊約聖經背景註釋》另有整段亞摩利人歷史。
- name: 迦南大敗直到何珥瑪
  type: 歷史
  source: 民21:3：「那地方的名便叫何珥瑪（就是毀滅的意思）」。
  justification: 民14 已累積；該條目講的正是三十八年前在同一個地名上的慘敗，本章是反敗為勝。
- name: 嗎哪
  type: 主題
  source: 民21:5：「我們的心厭惡這淡薄的食物。」CT 與 GT 丁良才都註明「這淡薄的食物」指嗎哪。
  justification: 出16 等已累積；本章是百姓對嗎哪最重的一次表態，也是嗎哪在民數記的最後一次出現。
- name: 百姓厭棄嗎哪（約6：31-35）
  type: 互文
  source: 民21:5 百姓厭惡淡薄的食物。
  justification: 該條目講的就是百姓厭棄嗎哪；本章是舊約這條線的最後一次，且緊接著就是火蛇之災。
- name: 摩西
  type: 人物
  source: 民21:7-9：百姓求摩西禱告，摩西為百姓禱告；神吩咐他製造銅蛇，他就照做。
  justification: 出2-民20 已累積；本章是他第五次為百姓代求，GT 丁良才把五次列成一張清單。
- name: 利乏音人
  type: 人物
  source: 民21:33：巴珊王噩。CT 註「『巴珊王噩』他的身量高大，是最後一個利乏音人(申三11)」。
  justification: 創14 等已累積；本章是利乏音人最後一位君王被滅的記載。
- name: 大道（原文作王道）
  type: 文化
  source: 民21:22：「只走大道（原文作王道），直到過了你的境界。」
  justification: 民20 才建立；本章向西宏提出的請求用的是同一套說詞，是這條路的第二次出場。
- name: 曠野飄流四十年
  type: 歷史
  source: 民21:12 安營在撒烈谷。GT 丁良才註「當時十四35節的話全然應驗了」。
  justification: 民14、民20 已累積；撒烈谷是申2:13-15 明指四十年判詞應驗的地點。
- name: 何珥山
  type: 地點
  source: 民21:4：「他們從何珥山起行，往紅海那條路走」。
  justification: 本章累積已合格，保留節點。
- name: 以東
  type: 地點
  source: 民21:4：「要繞過以東地」。
  justification: 本章累積已合格，保留節點。
- name: 亞捫人
  type: 人物
  source: 民21:24：直到亞捫人的境界。
  justification: 本章累積已合格，保留節點。
- name: 摩押
  type: 人物
  source: 民21:11、13、15、20、28-29：本章行軍路線的地標與詩歌的對象。
  justification: 本章累積已合格，保留節點。
- name: 以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）
  type: 互文
  source: 民21:21-31 是這個互文的來源端。
  justification: 本章累積已合格，保留節點。
- name: 以色列戰勝巴珊王噩互文（申3：1-11；詩135：10-12；136：17-22）
  type: 互文
  source: 民21:33-35 是這個互文的來源端。
  justification: 本章累積已合格，保留節點。
- name: 銅蛇被毀滅預表除去偶像（王下18：4）
  type: 互文
  source: 民21:8-9 是這個互文的來源端。
  justification: 本章累積已合格，保留節點。
