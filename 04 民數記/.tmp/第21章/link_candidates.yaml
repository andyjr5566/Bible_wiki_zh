candidates:
  - name: "亞拉得人襲擊探路者及神賜下徹底戰勝之何珥瑪"
    type: "歷史"
    status: "formal"
    summary: "南部迦南一隅之亞拉得王聞曉以色列軍循古昔探子路上進而突率奇兵偷掠隊員；民軍對主誠懇垂祈立誓滅惡歸聖，蒙天帝聽納俯憐而將宿亂全境連城推潰；此舊朝蒙恥之地轉奉神光稱定為表意毀滅盡焚的何珥瑪勝場。"
    occurrences:
      - "民21:1-3"
    source_refs:
      - "ccbiblestudy CT: 民21:1-3 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT21.htm）"
      - "ccbiblestudy GT: 民21:1-3 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT21.htm）"
      - "KingComments: Num 21:1-3 king of Arad defeated at Hormah（https://www.kingcomments.com/en/bible-studies/Num/21）"
      - "BibleHub: Num 21:3 dedicated them to destruction Hormah（https://biblehub.com/study/numbers/21.htm）"
    cross_references:
      - "戰勝希實本與巴珊二大頑梗敵軍與佔領其廣澤領土"

  - name: "百姓抱怨難路痛厭淡薄食物與耶和華使火蛇咬人"
    type: "事件"
    status: "formal"
    summary: "部隊遭遇繞行以東曲折艱苦程塗時民心焦暴轉厭，非但對摩西暴言抗訴更把降下養靈的天使仙餅譏毀為毫無可羨的淡薄粗殘食物；神主悲奪施庇好幕縱使熾痛遍體的兇煞猛火蛇奔竄侵咬，折喪無匹盲眾生靈以儆心意墮塵。"
    occurrences:
      - "民21:4-6"
    source_refs:
      - "ccbiblestudy CT: 民21:4-6 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT21.htm）"
      - "ccbiblestudy GT: 民21:4-6 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT21.htm）"
      - "KingComments: Num 21:4-6 fiery serpents sent among people（https://www.kingcomments.com/en/bible-studies/Num/21）"
      - "BibleHub: Num 21:6 fiery serpents bite the people（https://biblehub.com/study/numbers/21.htm）"
    cross_references:
      - "摩西為民祈禱製作銅蛇掛於杆上見證望蛇生得治"

  - name: "摩西為民祈禱製作銅蛇掛於杆上見證望蛇生得治"
    type: "神學"
    status: "formal"
    summary: "當被咬創眾民泣罪稱伏投靠僕中善宰摩西求哀得赦，主發恩謀不用直接去苦而是令摩西鍛製毫無毒牙卻貌如火龍的純金銅蛇揚掛長桿；受厄病者一睜信眼望即生靈解苦，此乃曠古至神拯救全依贖主被揭之神聖榮恩預示。"
    occurrences:
      - "民21:7-9"
    source_refs:
      - "ccbiblestudy CT: 民21:7-9 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT21.htm）"
      - "ccbiblestudy GT: 民21:7-9 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT21.htm）"
      - "KingComments: Num 21:7-9 the bronze serpent on a pole（https://www.kingcomments.com/en/bible-studies/Num/21）"
      - "BibleHub: Num 21:8 look at it and live（https://biblehub.com/study/numbers/21.htm）"
    cross_references:
      - "百姓抱怨難路痛厭淡薄食物與耶和華使火蛇咬人"

  - name: "以耶亞巴琳經亞嫩河與戰記上述蘇法的哇哈伯"
    type: "地點"
    status: "formal"
    summary: "以色列前衛渡過阿伯安宿朝向摩押東野日升境地的以耶亞巴琳及深邃撒烈川，穩扎於亞摩利人與摩押國間天然地塹高川亞嫩河對面；上帝行道長錄收定於散迭兵典戰記所歌吟之蘇法地帶哇哈伯及亞珥深坂顯彰萬道威恩。"
    occurrences:
      - "民21:10-15"
    source_refs:
      - "ccbiblestudy CT: 民21:10-15 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT21.htm）"
      - "ccbiblestudy GT: 民21:10-15 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT21.htm）"
      - "KingComments: Num 21:10-15 Book of the Wars of the Lord（https://www.kingcomments.com/en/bible-studies/Num/21）"
      - "BibleHub: Num 21:13 encamped on the other side of the Arnon（https://biblehub.com/study/numbers/21.htm）"
    cross_references:
      - "比珥活水泉谷與眾首領用圭用杖挖井引頌讚凱歌"

  - name: "比珥活水泉谷與眾首領用圭用杖挖井引頌讚凱歌"
    type: "事件"
    status: "formal"
    summary: "當行蹤進泊表義神言福源古地之比珥時，耶和華悅言呼集群黎不待哀訴即承誓開泉供應涼澤；會家拋下沉怒展唇拉吟湧泉快樂古章，十二首宰伴領貴者持使神權手尺名杖破開阻塞掏透水脈，喜受不息恩渠從天滋溉。"
    occurrences:
      - "民21:16-20"
    source_refs:
      - "ccbiblestudy CT: 民21:16-20 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT21.htm）"
      - "ccbiblestudy GT: 民21:16-20 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT21.htm）"
      - "KingComments: Num 21:16-20 well of Beer song of springing up（https://www.kingcomments.com/en/bible-studies/Num/21）"
      - "BibleHub: Num 21:17 sing to it Spring up O well（https://biblehub.com/study/numbers/21.htm）"
    cross_references:
      - "以耶亞巴琳經亞嫩河與戰記上述蘇法的哇哈伯"

  - name: "戰勝希實本與巴珊二大頑梗敵軍與佔領其廣澤領土"
    type: "歷史"
    status: "formal"
    summary: "在和盟受困於亞摩利霸王西宏嚴攔狂戰與巴珊壯身烈候噩直向以得來大驅殺機後，上天督護並誓授全域付刀無餘；神的靈兵一掃二雄堅堡營聚並收盡摩押奮舊爭端希實本千春廣郊，徹底坐佔約但河面大東邊界之豐餘草原。"
    occurrences:
      - "民21:21-35"
    source_refs:
      - "ccbiblestudy CT: 民21:21-35 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT21.htm）"
      - "ccbiblestudy GT: 民21:21-35 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT21.htm）"
      - "KingComments: Num 21:21-35 defeat of Sihon and Og（https://www.kingcomments.com/en/bible-studies/Num/21）"
      - "BibleHub: Num 21:24 put him to the sword took possession（https://biblehub.com/study/numbers/21.htm）"
    cross_references:
      - "亞拉得人襲擊探路者及神賜下徹底戰勝之何珥瑪"
