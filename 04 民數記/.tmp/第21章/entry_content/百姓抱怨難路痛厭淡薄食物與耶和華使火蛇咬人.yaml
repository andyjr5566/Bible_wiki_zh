name: "百姓抱怨難路痛厭淡薄食物與耶和華使火蛇咬人"
type: "事件"
secondary_types:
  - "歷史"
status: formal
definition: |
  指民數記第二十一章中，以色列會眾為了繞過以東地而行紅海之路，因途徑崎嶇且氣候嚴酷，內心急躁不安，公然抱怨神與摩西，甚至褻瀆天賜的嗎哪為「淡薄的食物」。這種忽視神恩與背叛 covenant 的行為招致神聖的管教，耶和華使火蛇進入百姓中咬傷他們，導致許多以色列人死於蛇毒。此役凸顯了信仰成長中的反覆考驗，並指明恩典中的順服不可因為生活困境或日食如一而產生墮落與厭煩。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "會眾因繞過以東地路程困窘急躁，出言詆毀神與摩西並痛貶嗎哪，引發上帝懲以致命火蛇而遍身受害。"
    relation: "顯示以色列全體對曠野考驗的舊有忍耐力薄弱與頑悖習性，呼應基督對人愚頑棄絕靈食之責而須尋得重生之路。"
    content: |
      以色列群眾於南境獲勝之後，隨即遭遇繞行以東的考驗：「他們從何珥山起行，遵著紅海的那條路走，要繞過以東地。百姓因這路途煩躁，就謗讟神和摩西說：你們為什麼把我們從埃及領出來、使我們死在曠野呢？這裡沒有糧，沒有水，我們的心厭惡這淡薄的食物」（民二十一4-5）。這成為曠野旅程中最後一次針對食物與行路所發的大規模背逆抱怨。
      
      黃迦勒與丁良才的解註剖析，所謂「淡薄的食物」是指輕視天賦的嗎哪，視其為平淡、缺乏滋潤與厭煩之物。在靈性教導上，反映出人類對神長年信實供應的日久麻木與厭膩。會眾不思感謝沙漠裡奇蹟的生存支持，卻倒退回對埃及世俗飲食的眷戀，構成對神聖攝理與愛護的公然侵犯。
      
      KingComments 與 BibleHub Commentary 解讀這一場災罰的原因：耶和華隨之「使火蛇進入百姓中間，蛇就咬死許多以色列人」（民二十一6）。這裡的火蛇（Saraph）在原文中是指咬傷後產生灼熱苦痛、劇烈中毒症狀的毒蛇。神以管教手法提醒群眾：能長期安處無邊荒漠而不受各類蟲蛇猛獸滅害，完全仗賴神聖護佑的幕所與赦憐；當百姓選擇棄絕神的率領時，保護之手暫斂，天然的危機立刻成了致命的災愆。
