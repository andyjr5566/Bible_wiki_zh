name: "百姓抱怨難路痛厭淡薄食物與耶和華使火蛇咬人"
type: "事件"
secondary_types:
  - "神學"
  - "歷史"
status: formal
definition: |
  在古老進遷曠野道路晚期，以色列軍團為躲退與難纏肉體鄰邦以東的武裝衡犯，順自何珥高峰遠遶紅海漫長旱塗，遭遇山石崎嶇而寸心急躁苦亂；當此試練之中，新一輩軍萌再次被老舊罪性拖擒，公然張唇狠斥至善施救的天君與長途良宰摩西，痛詬引出埃土乃逼奔絕沙赴凶程，更以極致褻慢字詞詛咒自天穹常時長垂滋護的聖靈仙餅「嗎哪」，譏稱為毫無可顧與食如白臘的「淡薄食物」；如此深厭從天上來的恩供與心懷狂野的自傲，直促神王徹收護從庇佑妙邦之神手，使該地荒漠間常往宿蟄的毒熾蠻龍——烈毒熾血的「火蛇」蜂湧衝竄群眾之間狠嚙殺害，折斷萬千口出狂毒不屑君榮者之驕性命期。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "因繞行紅海遠塗長旱愁狂，群盲出言毒攻好主並口厭嗎哪為淡薄陋飯，即遭受主手令縱狂猛火蛇狠噬成大死地。"
    relation: "向世代直揭縱情抱怨神光與厭嫌清醇靈蜜必使保護退讓而引縱魔龍凶口；申言信途決莫嫌恨屬神施賞的平凡平淡。"
    content: |
      以色列千春步伍既享勝戰而後，立經一段至為折磨與枯考耐性的迂道：「他們從何珥山起行，往紅海那條路走，要繞過以東地。百姓因這路難行，心中甚是煩躁... 說：『你們為什麼把我們從埃及領出來、使我們死在曠野呢？這裡沒有糧，沒有水，我們的心厭惡這淡薄的食物。』於是耶和華使火蛇進入... 死了許多。」（民二十一4-6）。黃迦勒揭批人心對天上常恩好餅生出之醜厭罪情：「瞧啊！前途剛呼救主得勝，今日踏進繞行以東之苦程，肉體的『煩躁（原文沮喪窘困）』即克猛爆！最令良天大帝浩痛與怒傷者，絕非你在沙間汗冷苦累，而是在於『厭惡這淡薄的食物』！這言深諷神賞三十餘春救活百萬良兒的聖潔天上嗎哪是如此不堪目擊的貧素與空無；直至現日世俗靈徒亦如是：凡口中稱看『神純言為味如白水、講說千次淡薄毫無世華豐腴』的，他的內部已將靈榮丟唾成俗物，即刻向嗜吞人性的魔毒打敞了大洞！」（CT）。

      丁良才與拾穗則探微古代近東生態與受罰因緣：「『火蛇（saraph）』在曠古南部早為繁滋的絕毒惡虺，色如燃碳或稱指噬身發高燒酷腫致命；古來神大衛屏為黎庶展遮浩光擋除蛇毒威迫（參申八15）；如今狂眾翻口把養生仙餱罵為無益糟粕，護身恩幔豈可久蔽於褻主之群？保護之手才罷，毒靈兇口立刻蜂而大殺！」（GT）。BibleHub 把這一場遍染蛇毒狂叫的營中夜局目為人性輕生神權之必然對償：「舌出寒怨恨薄神供，即償烈焰毒痕於己軀；恩自非強塞之禮，心嫌天食者正是在乞自毀之烈毒入營！」（BH）。

      KingComments 更多方悲呼願現代信士長存知足謝禮的神潔雅志：「千萬看透這『心甚煩躁』與『厭嫌平淡』是一根多可怕且直通火地牢鎖的狂釘！靈界征徒常貪妄得步大樂與平野快飛；一待遭阻需走偏遠繞疆路、久咬樸善純清神糧時，即怪吼救恩是沉累！要知道，嫌厭天天長下、毫無浮誇甜蜜卻常足護命的真如仙肉者，便是將自己拋下蛇海，使屬世狂咬把你性靈全吃成死竭的長灰啊！」（KC）。此言深刻把咒罵平靜日常神的恩賜鍛做驚神自省的大警訓。
