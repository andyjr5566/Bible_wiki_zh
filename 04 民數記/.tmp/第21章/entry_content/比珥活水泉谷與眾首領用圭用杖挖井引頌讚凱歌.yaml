name: "比珥活水泉谷與眾首領用圭用杖挖井引頌讚凱歌"
type: "事件"
secondary_types:
  - "歷史"
status: formal
definition: |
  記於民數記第二十一章中，當以色列部眾越進至比珥（Beer，希伯來文意為「井」或「水井」）時，耶和華未等會眾喊怨，主動向摩西宣告將召聚眾民並恩賜豐富活水。會中並未興起爭訟，反而啟發了著名的「井啊，湧上水來」讚美詩歌；十二支派的主導首領及尊貴同工們，單純攜手依靠象徵統治權限的「權圭」和引導行進的「名杖」合作深掏鬆動沉滯井土，隨即使澎湃恩泉奔躍不止。這事凸顯了信靠者以感恩頌榮替代質疑哀訴，更能經歷神極大豐沛恩流的生活準則。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "上帝於比珥名邑主動開口賞賜甘泉，以國民群體不發一怨高倡掘井讚美之歌，首領依賴圭與杖通力掏泉歡領豐溢恩水。"
    relation: "揭破米利巴哭喊爭奪之世態，宣示以尊嚴禮歌與虔誠同心合工取代驕逆悲歌，方為引汲無窮屬靈解厄泉津的正途。"
    content: |
      以色列步伍告別乾旱哀號，於神指示下欣然踏過甘甜泉域：「以色列人從那裡起行，到了比珥。從前耶和華對摩西說：招聚百姓，我好給他們水喝，說的正是這井」（民二十一16）。在這裡，毫無往夕對荒旱哭噪之無禮姿容；反而激昂詠出以色列名滿天下的古代勞役歡願歌詩：「井啊，湧上水來！你們要向這井歌唱... 這井是領袖和民中的尊貴人，用圭、用杖，所挖所掘的」（民二十一17-18）。
      
      黃迦勒以生動神學視點申論：「讚美使人得飲神泉，怨言只會牽來管教」。這件活井往史揭穿一個鐵旨：當民無急念苦喊、安心以歌樂恭候主命時，恩賜即已充沛流於腳旁；各部領軍貴客與使老不用粗猛重兵，僅憑象徵主授神權之「權圭（Scepter）」與持持相伴的「仗杖（Staff）」聯結通力挖掘，表意信仰靈性需要上下同心摒棄阻礙內中恩典之沙石。
      
      KingComments 與 BibleHub 深沉指出：這份泉谷勝賞正呼應以賽亞書第十二章三節：「你們必從救恩的泉源歡然取水」；此泉不單是止喝解乾的新命之恩，也是伴隨隊伍安順通過瑪他拿、拿哈列、巴末而登臨俯臨廣澤之毗斯迦峰的高舉先導。
