name: "比珥活水泉谷與眾首領用圭用杖挖井引頌讚凱歌"
type: "事件"
secondary_types:
  - "神學"
  - "地點"
status: formal
definition: |
  在古以色列人在南東荒涼行程裡破毒揚帆而往後前征的歷程中，有一幕全然毫無投訴哭苦、轉為長詠甘美恩悅之輝煌篇幅，那即是安營到達象徵「賜活井泉」之勝處——「比珥（Beer）」；在此古乾林野地，不再依傍人民絕望咒叫與摩西失措狠打大磐，而是造天王君自動喜言向摩西下頒慈誠口諭：「把萬家族眾聚起，我必將活蜜寒水盡予他們一口豪飲」！會民滿懷天樂不用兵荒爭執，應時張放千喉長唱喜樂天章：「井啊！快快為民湧發歡流！爾們應依是恩井歌賀」；更見那代表不惑信靈的一代十二高長首領以及七十位至崇貴長者，以自己領家統御之高貴皇階「權圭」並仗行足下所拄「手杖」，在野地合力誠心勤力挖掘掏剔；如此手心同一除去雜泥堵塞、盡讓井喉深水滾滾長躍之情，向千世宣告聖徒若願卸了肉身障壁並施發稱恩歡唱，必召奔活水甘泉不休直冒。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "部隊行造以『井』為意之比珥荒壤，上帝首言歡賜涼泉，大眾拉嗓揚詠泉水上奔並由眾貴率士手提領節寶圭杖力勤深挖。"
    relation: "向追靈大旅闡白頌許上帝的真歡讚音遠比起苦怨與哭打更好招降甘喜大源；申宣肉心去滯則活恩自然湧射無竭。"
    content: |
      以色列步徒過度長河深苦後，抵泊了前代鮮見之醇美聖樂甘泉會地：「以色列人從那裏起行，到了比珥（就是井的意思）。從前耶和華吩咐摩西說：『招聚百姓，我好給他們水喝』，說的就是這井。當時，以色列人唱歌說：井啊，湧上水來！你們要向這井歌唱。這井是首領和民中的尊貴人用圭用杖所挖所掘的。」（民二十一16-18）。黃迦勒抓握了這杯美樂天酒的靈韻光輝：「看啊！此間大異常規：昔在米利巴是千人厲罵引發刑罰；在茲『比珥』全無一點口恨和索討，全是上帝自願張慈愛曰『招他們聚去我賜喜泉』！最為歡騰的是大夥聽音不再發問『何在水否』，立即張放了至真信念的大頌美音：『井啊，為咱大湧而進！』這『向井高唱』正是真信士的最高密意：埋怨招致蛇吻，讚美乃開鑿活水不涸的首度長金匙！而那『尊貴與眾將攜權圭手杖深掏』，深寓靈旅領頭心隨天道不順血氣，手運用屬上帝威福的無窮靈信把淤塞心泉的自欲黑泥全力挖除，你瞧靈水定不受阻常喜歡馳！」（CT）。

      丁良才與拾穗則就井脈與地名全圖遞陳妙理：「『比珥』位於摩押古平野之隅，此地正是後年宣稱為眾林湧源之『比珥以琳（Beer-elim）』（參賽十五8）；值得長瞻者，乃接連所列那好勝如流的漫遊藍圖：『往瑪他拿（Mattanah，主賜的禮儀）、抵拿哈列（Nahaliel，神的天堂長流）、造巴末（Bamoth，最高傲的頂峰）』——此乃向全會宣告：曠野所得的美井並非人謀神功，是神贈施與的好恩禮，更如天上聖域滾奔流往最高聖光殿閣的美喜源脈！」（GT）。BibleHub 將這一頁首長合杖破泥的情狀目作權位者服苦歸靈的神崇示威：「權柄不是爭競打壓之兵，而是作率眾撥苦、手持金杖幫民解渴揚恩的勞樸器物！」（BH）。

      KingComments 更多力喝歌勸請長夜苦行的大群神侍常懷歌音：「千萬緊抱這面比珥泉井上向野放聲長歌的新靈訣窍！人當處急困時常哭狂掙扎，殊不知真正的開水好杖乃是你喜發大唱神恩榮力的那張甘心歡舌！看透這奧義：天意喜樂時，莫要再待雨落方才展臉；早早提捏你的信歌如寶圭往地中剔鑿，神王早已待那湧往極天的冷冽生命之河向著知足讚聲破塵狂發啊！」（KC）。此言極是喜亮把野井掏通升華做靈界樂聲開啟主供的金匙。
