name: "亞拉得人襲擊探路者及神賜下徹底戰勝之何珥瑪"
type: "歷史"
secondary_types:
  - "事件"
status: formal
definition: |
  記載民數記第二十一章中，住南地的迦南人亞拉得王聽說以色列人從亞他林路（探子之途）而來，便主動發動襲擊並擄去部分以色列民。面對這次挫折，以色列會眾未如以往發怨言或打算折返埃及，而是全體向上帝許願：若耶和華將這民交付他們，他們便將這些人的城邑完全毀滅（獻為至聖的祭物）。上帝應允他們的祈求，以色列人隨即戰勝並毀滅了迦南人及其城邑，將該地命名為「何珥瑪」（Hormah，意為完全毀滅或至聖化）。此役代表第二代以色列人在信仰態度與靈性順從上的成熟與信心的恢復。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "亞拉得王襲擊以色列人並擄去部分人質，以色列眾人未發怨言而是向上帝敬虔許願，得蒙垂聽後將迦南諸城獻予徹底毀滅，名為何珥瑪。"
    relation: "對照三十八年前第一代百姓因不信而在此地慘遭擊殺的歷史，標誌著新一代以信賴神恩逆轉過往的失敗與榮辱。"
    content: |
      在漫長漂流末年，以色列大軍抵達南部邊境，遇見迦南地代表威脅的亞拉得王主動侵襲：「住南地的迦南人亞拉得王，聽說以色列人從亞他林路來，就和以色列人爭戰，擄了他們幾個」（民二十一1）。在過去，類似的挫敗必定引發群眾哭泣與要求重返埃及；然而此次會眾展現了截然不同的信心反應：「以色列人向耶和華發願說：你若將這民交付我手，我就把他們的城邑盡行毀滅」（民二十一2）。
      
      黃迦勒與《基督徒文摘》分析，何珥瑪在希伯來文中帶有「奉獻給神以完全毀滅」之意（herem）。三十八年前，第一代以色列人在此地因自恃血氣擅自出征而受辱大敗（參民十四45）；今日第二代會眾則完全依靠神，順從並承認對迦南地的神聖宣戰不是出於掠奪物資的私慾，而是對上帝公義審判的順服。
      
      丁良才與《舊約聖經背景註釋》指出，亞他林路（Atharim）是通往南部 Negev 區域重要的古代通商與巡檢路線。這一次勝仗是進入迦南諸多戰役中首場完全依靠許願而成的明確勝利，確認了神依然主導帶領以色列向前，並開啟了進攻應許之地的序言。
