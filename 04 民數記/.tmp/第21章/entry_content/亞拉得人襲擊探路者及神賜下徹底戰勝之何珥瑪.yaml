name: "亞拉得人襲擊探路者及神賜下徹底戰勝之何珥瑪"
type: "歷史"
secondary_types:
  - "地點"
  - "事件"
status: formal
definition: |
  在古希伯來歷史中，於流亡苦年晚夕的南向邊陲之上，久踞別是巴以南乾熱貧荒地區的迦南豪強亞拉得王，驚聞神民浩浩沿昔年探測迦南的神秘高嶺舊蹤（即「亞他林路」）節節進發，竟恃前代傷退民兵的歷史優勢仗意而至，施辣狡襲劫擄多位散卒陣民；遇此欺辱折殺，新朝百姓未蹈驚哀崩散廢途，而群致誠祈誓願向至愛天君誓表心誠——若神授敵軍潰沒，將克盡神家至潔誓禮全燔廢盡彼境；耶和華悲憫聽命縱許雄輝威勝，會兵把魔強古軍與滿目迷堡徹底盪焚，並把當年挫辱埋羞之地正名稱揚為象徵盡殺獻神之永世得勝勝址——「何珥瑪（Hormah）」。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "南部豪主亞拉得王襲擄零隊神氓引發民誓神盟，在舊辱探路邊隅直殺敵鋒焚盡村邦成全勝神名何珥瑪。"
    relation: "明揭舊日跌足的恥處必賴新生依誠堅恩方可扭成至榮喜樂歌址；向世昭彰爭敵得勝惟賴傾心將一切污毒毀滅奉獻於神威底下。"
    content: |
      以色列於四十年行旅前緣即嘗挫於探軍驚怯的退敗往蹤，今朝當他們步踐前途舊塵時，深仇悍主隨期而至：「住南地的迦南人亞拉得王，聽說以色列人從亞他林路來，就和以色列人爭戰，擄了他們幾個人。以色列人向耶和華發願... 我就把他們的城邑盡行毀滅。耶和華應允... 他們就把迦南人和迦南人的城邑盡行毀滅。那地方的名便叫何珥瑪。」（民二十一1-3）。黃迦勒在此洞見翻盤得勝的新生命奧旨：「『亞他林路』字義正如舊古探路，而那『何珥瑪』正是三十八年逝歲中愚莽出衝卻遭敵窮寇殺至之地（參民十四45）！你曉得此境對眾心本具有多沉痛的驚怖舊創；如今亞拉得惡鬼依仗從前勝情撲撕擄人，意表信徒靈旅定需再度撞面對抗前朝之大失敗！幸耶斯民轉了性情：人弗發抱怨哭罵，轉投向『向耶和華發願』——發意絕不貪取世敵名利財貝，惟定堅誠將污欲全盤盡燬奉主為聖；這立時開啟救父大恩力，叫人在同個陷沒泥谷『何珥瑪』，奇蹟般揮斬成全城毀盡、得歸天神最高殊耀勝局！」（CT）。

      丁良才與拾穗則追索南疆地質與神兵誓訓意涵：「『亞拉得』位於希伯崙南逾二十七里處，地接乾燥乾坡；初期仇敵出奇不意得取小勝，無非是上帝暫任驕魔施威好策進子弟不敢半毫不驚警！而百姓『盡行毀滅』在舊約原文即呼『永獻（cherem）』，宣述自己絕不從干戈撈捕任何銀粟妻妾，完全把這群假神敵邦破殺當成讚主之禮！」（GT）。BibleHub 將這一重揚威戰紀書記為自恨到重興榮光的經典跨度：「苦痛從不是停滯的終止符，人當向那掠搶靈魂得平安的老宿戰陣大聲宣告神約，使何珥瑪那沉鬱喪音化成了燒燬邪惡的凱朝聖鼓！」（BH）。

      KingComments 更垂意激昂讚賞現代真光之兵民：「切休畏悸那一片往年教你遍體麟傷的退步故荒！那昔日在眼皮底重痛挫擊你的亞拉得宿業，當今天軍肯下死心誓將血氣淫風割拋去竟一席，定逢長愛至大者聽哀大發巨光！你要瞧出：凡是主民同甘心奉把舊人肉體焚於主火之下者，哪怕最慘烈的跌仆傷丘，終會轉寫成你光榮宣告神永不受創之巍武紀念神臺！」（KC）。此語厚厚把羞處反興為天戰勝境之良證。
