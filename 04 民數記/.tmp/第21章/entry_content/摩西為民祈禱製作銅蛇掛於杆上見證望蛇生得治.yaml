name: "摩西為民祈禱製作銅蛇掛於杆上見證望蛇生得治"
type: "神學"
secondary_types:
  - "事件"
  - "歷史"
status: formal
definition: |
  記載民數記第二十一章中，當以色列百姓遭受火蛇咬傷、面臨死亡時，主動懺悔並懇求摩西代禱。耶和華並未將全場野蛇根除，而是指示摩西製造一條沒有毒素的銅蛇，將其高舉於杆上；任何被蛇咬的百姓，只要憑著對神救贖應許的信賴抬頭仰望，便隨即活命。這一歷史奇蹟不僅在舊約中示範了神威與慈宥的挽救方法，在新約中亦由耶穌基督親自闡述，成為基督在高處成全救恩、為垂死信眾成就唯一活路的深刻預表。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "面對懺悔受病哀求之眾民，上帝命摩西打製無毒之銅蛇高架杆端，中毒者一抬首看仰即宣告康復得活。"
    relation: "向舊新兩約昭示罪人在受刑定狀中，唯一救除死亡的關鍵不在自我修整與自割罪縛，而在信心仰瞻上主設立的預表贖主。"
    content: |
      當苦痛的炎害迫臨，眾民認罪垂祈：「我們怨瀆耶和華和你，有罪了。求你禱告耶和華，叫這些蛇離開我們」（民二十一7）。神聽許代請之後所設之對策超越人的思考：「耶和華對摩西說：你製造一條火蛇，掛在杆子上；凡被咬的，一望這蛇，就必得活。摩西便製造一條銅蛇... 凡被蛇咬的，一望這銅蛇就活了」（民二十一8-9）。
      
      黃迦勒於《基督徒文摘》及各界研經史深刻分析這象徵中的神學奧義：銅蛇具備那會吞噬生命之火蛇的形像，體內卻毫無劇毒；這正如新約之宣示，基督耶穌以「罪身」之樣相被懸掛在冷木之末，其實質卻純淨無辜（羅八3；2）。銅於祭禮與幔陣構造上代表公義無私之神聖審判，而旗杆高舉則標示公務宣揭；救贖非經由藥石治療或血功補救，單出於「仰眼一望（look and live）」——此動詞象徵降棄掙扎與信誠的完全交付。
      
      KingComments 與 BibleHub 解讀這仰望之神髓：病危者不看傷口、不靠手藝、不起紛爭，唯依主令望向上天之見證者；《約翰福音》三章十四至十五節耶穌之引道：「摩西在曠野怎樣舉蛇，人子也必照樣被舉起來」，將曠野望桿化為超越苦死大難與尋贖生命的永遠福音柱石。
