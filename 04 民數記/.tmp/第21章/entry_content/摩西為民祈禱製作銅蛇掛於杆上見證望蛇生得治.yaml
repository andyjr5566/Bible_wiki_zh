name: "摩西為民祈禱製作銅蛇掛於杆上見證望蛇生得治"
type: "神學"
secondary_types:
  - "事件"
  - "歷史"
status: formal
definition: |
  在希伯來律例與神蹟解厄的歷史紀錄中，於南蠻旱漠被火蛇慘痛大害追剿至崩的以色列百姓，終識認口舌傲慢對戰天主的大惡而群奔投赴長宰摩西座前，垂顏悔怨苦籲乞請向天老祈止殃害；慈祥為父的靈王摩西寬意代請，耶和華奇謀並非當即施放術法剪盡全谷惡虺，反而付下超越億秋靈理的奧妙偉言——密旨把具有火蛇恐怖厲態卻絕無半毫炎性與死骸劇毒的明鍛金亮「銅蛇」，揚烈擎於筆立高升的「旗杆」之巔；全軍無論垂困將卒，單靠誠念「一望」是揚立的吉象，立刻生靈復春、蛇毒頓盡得治；斯事為長世宣揚不滅的預表榮威：被釘掛高升神木的耶穌基督承擔罪容毫無犯罪，向舉目仰盼的苦沉靈性沛下惟此一路的起死新康大活。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "因遭猛龍噬斃悔過苦伏摩西代哀，天王出諭手製赤耀純金銅蛇掛立高杆頂端，遍地被毒眾生一舉目盼望立起得救新榮。"
    relation: "預示耶穌承挑罪奴之容背縛受刑十字木樑；向普地宣告唯一勝絕罪性跟魔龍慘毒之妙徑全靠存誠仰盼為君高舉解罪之聖者。"
    content: |
      以色列步伍於魔毒夜嚎裡覓得了真正永世解救神光的先驅古樣：「百姓到摩西那裏，說：『我們怨瀆...有罪了。求你禱告耶和華...』耶和華對摩西說：『你製造一條火蛇，掛在杆子上；凡被咬的，一望這蛇，就必得活。』摩西便製造一條銅蛇... 凡被蛇咬的，一望這銅蛇就活了。」（民二十一7-9）。黃迦勒以磅礡宏筆將此高桿勝景拆開了救恩五重天意：「這『銅蛇揚杆』何等浩大，正如新約君王宣告的深契：『摩西在曠野怎樣舉蛇，人子也必照樣被舉起來』（約三14-15）！請解透這一件精巧絕頂的雙象神話：所有傷身害靈的火蛇是含真生劇毒之罪的鬼煞；但你所看打做出來的『銅蛇』，具有那張恐怖狂暴的凶龍之貌，內部卻絲毫沒掛一點必死毒液！此正如基督為你我著上了取死的罪惡血氣肉軀之外衣，卻聖潔無瑕沒有半絲罪行和暗邪（羅八3）；『杆子』便刺出那是嚴刑審定人的高高十字巨樹，『銅』字正是至尊公正鐵血無誤之神聖審判！你我看：這救法是天地真君『親手自設』、『無所偏狹人人好享』、『言重如山必保成就』、更在仰望間『快無比立刻超升』、甚至除此一索一目『天地全然無他途可找』的高上極路！」（CT）。

      丁良才與拾穗則剖繪出『仰眼望上』並非魔法幻覺，而是信徒傾誠轉意捨去本我的心靈功課：「『一望（look）』在古道決非輕拋斜視，那是屏息停除手分亂抓抗病的掙扎，完全以虛誠眼眶托盼那天旨；古人遇死不思靠塗草煎藥，單抬頸觀望冷涼杆端銅件；這一眼表證向神手全然俯心順服與信仰承歡！」（GT）。BibleHub 把這一矗古蛇銅像讚揚為跨出罪淵無極光明的無悔榮誓：「何其深刻，主容那帶傷你生命的蛇容改在沒血沒毒的水晶銅身上示敞，告訴你那能吞滅生命的仇恨根源已被全數捕縛釘落大空之上！」（BH）。

      KingComments 更多次以含愛忠告引牽我眾勿落盲想或世法之網：「世人間最可怕是不甘抬臉去認罪與瞧一望那位代你被掛上苦架的心哀慈兄；人總是拼力圖解拯救自救；這一段銅杆故事直叩眾耳：放手爾之殘鬥，單以破愧哭淚之眼盯著那代挑盡世罪態的小羊大父，你就於秒瞬把百倍毒心忘塵，昂身笑歸活榮大地！」（KC）。此語將枯旱望杆高揚成為普天眾望無上喜慶的福音金峰。
