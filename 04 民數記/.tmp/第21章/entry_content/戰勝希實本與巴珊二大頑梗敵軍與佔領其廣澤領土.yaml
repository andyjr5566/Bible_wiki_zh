name: "戰勝希實本與巴珊二大頑梗敵軍與佔領其廣澤領土"
type: "歷史"
secondary_types:
  - "神學"
  - "事件"
status: formal
definition: |
  在希伯來律例與舊約遠征史中，當以色列軍師即將進踐約旦河東綠埜大澤、完成渡西攻土之關鍵戰略時刻，部隊遭逢了兩個鎮踞北方與大高原的魔王勢力拒戰激戰：先是在出言平和買路遭冷拒後，亞摩利剛悍霸主西宏提率盡朝大伍於雅雜張刀相抵，結果倒遭上宰伸臂剿除殆盡；隨後是占駐雅博以北肥渥大平原的最後一位極巨大巨人王——利乏音種族的「巴珊王噩」，統領舉國殺陣迎敵於副都以得來（Edrei），也得遇造主安神誠諭「莫怕是鬼」，在一夕間連父兄並全朝盡被神戈斬淨；此二勝將象徵撒但黑暗牢固陣營的前陣連城徹底拉毀，讓以色列安然坐領希實本至底本以及盛產良芻牛畜的巴珊浩漫無際樂境。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "在和約遭封之下神國雄軍盡剿不留寸命打倒了希實本的西宏與長頸巨人王噩，吞坐了由亞嫩迄巴珊一線極大名疆。"
    relation: "向追隨主光的大軍示曉無論遇何極高魔魁或幽頑古寨，單存敢戰敢信的天朝定力自必如破紙毀牆打收敵人豐邑為良安樂地。"
    content: |
      以色列出荒長役迎來了於河東極光照眼之超世大交鋒：「西宏不容...要攻擊以色列人... 以色列人用刀殺了他，得了他的地，從亞嫩河到雅博河... 以色列人轉回，向巴珊去。巴珊王噩和他的眾民都出來，在以得來與他們交戰。耶和華對摩西說：『不要怕他！因我已將他和他的眾民，並他的地，都交在你手中...』於是他們殺了他和他的眾子，並他的眾民，沒有留下一個，就得了他的地。」（民二十一21-35）。黃迦勒在此直指魔宮要衝被扯破的神靈凱戰：「此二王正是魔鬼與血世合流抵阻天民邁進常歡國所架的最固碉樓：你瞧『西宏（Sihon）』寓表自傲狂勇，那其首都『希實本（Heshbon）』本字正釋呼固不可拔之巨牆『堡壘』；而後又殺到那『噩（Og）』王面前，其人正是極偉魁豪的利乏音怪獸、意徵暗界幽毒凶靈大張吞威！人以常理去論早已雙膝寒涼，然而天帝一振聲振言說：『勿需駭畏這狂鬼！』隨後你必能仗持聖信大威把魔家打築千秋的硬心魔牆一棒攻滅、把他的肉土長草全盤奪取坐為安休樂土！」（CT）。

      丁良才與拾穗則從古史王疆跟戰地疆野詳析戰紀：「此戰拉長了一連串古都變換：西宏王是先前才破打破前鄰摩押人主並引為笑詠嘲唱者（參26-30節），其心暴猛甚高；然而以軍毫不退隱，於『雅雜（Jazron，狂滅狂踏之地）』力破前軍；次又旋向直壓『巴珊（Bashan，極密膏木多實之谷）』！那巴珊地跨戈蘭美野，是極肥畜乳園，王噩自恃是前古代巨大武王（參申三11），統率死壯至極副廷『以得來（Edrei）』相阻；神家兵猛於一宿全斬弗赦一餘！是得約但絕海前一片東望最安豐野！」（GT）。BibleHub 把這一遍滅敵霸域書以極壯無匹之凱程序歌：「把先仇笑歌轉成讚帝大章！那前陣得意誇笑摩押無神庇的希實本詩謠，轉瞬間在永生大帥手中碎為飛沙！」（BH）。

      KingComments 更多次揮淚勸誡基督勇武之生，絕對勿怯世途中最高巨駭之怪牆：「常有至巨關卡豎立在你要踏涉流蜜福原之前的倒數一瞬！你看魔使把極高大巨人噩與希實本雄寨推到最深渡口前想喊駭靈民；千萬咬定神父那一語破雲浩言：『莫恐不退、我看他如朽木土塊！』你要挺身敢跨，凡肯衝前揮刀揚主名者，你所遇過的那些漫年困你、看似駭岸摩天的心苦與暗惡頑障，盡定被你倒拖毀棄，化做使你豐得無限牧土喜澤的最佳戰袍與大好美酒啊！」（KC）。此筆浩烈打下對拒敵勇戰得豐祿土域為信仰大勝的最上榮階。
