name: "戰勝希實本與巴珊二大頑梗敵軍與佔領其廣澤領土"
type: "歷史"
secondary_types:
  - "事件"
status: formal
definition: |
  指述於民數記第二十一章後段，以色列軍進攻迦南高地前夕對河東大國展開的決定性破軍勝利。面對占奪希實本、驕勇不饒的亞摩利王西宏，以及雄據肥碩巴珊好土與巨人統帥背景的巴珊王噩，摩西首以和緩通牒請行平順商旅主路遭拒；西宏與噩先後強驅重兵出擊迎擊以色列人。上帝堅宣告誡以色列勿懷驚憂，主動將二強王與其豐廣田產悉數交付神民掌握；以色列人奮起勝戰到底，完全毀滅並接收了自亞嫩河延伸至約但河與戈蘭廣大野界的所有主權。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "面對以西宏與噩為首的亞摩利及巴珊兩大強豪出兵攔截與進攻，上帝勉勵神軍一舉進討取得全區國境。"
    relation: "替進赴上帝所賜流奶蜜地建立不可磨滅的初期武勳，確認即令遇巨大難敵，靠主同在必能攻克領有豐盛美地。"
    content: |
      以色列於河東路徑最終遇到了古文明中最強盛硬仗的主政軍團。摩西首遣平和懇信引乞商務大路通過強盛亞摩利君王西宏（Sihon of Heshbon）之疆：「求你容我們從你的地經過... 總走王道」（民二十一22）。然而西宏恃勢剛愎，不特厲言拒斥，更揮全團重軍奔襲以色列於雅雜谷。耶和華保守民伍，以色列人在一激間用刃討敗其眾，盡驅收歸了自亞嫩河迄至雅博河及亞捫防線前所有的充美良田（民二十一23-24），甚至讓過往稱雄攻佔摩押地帶的古作《希實本諷刺勝曲》全然改觀。
      
      黃迦勒與丁良才闡釋，這破敗西宏之旅是一回神手恩威大賞；接著無懈軍姿揮鋒北揚，遇上了素常憑驕碩牧谷盛業自雄的長身古伯巴珊王噩（Og of Bashan；參看申命記載之巨人之祖遺留者）。王噩領重卒屯至以得來邀約決戰。
      
      KingComments 與 BibleHub 強烈指明：在此強對衝鋒場景前，萬靈大宰賜落溫柔強諭：「不要怕他！因為我已將他和他的眾民，並他的地，都交在你手中」（民二十一34）。神軍依照勝敵西宏之道全面挺退壞散之軍，徹底取得廣豪中東壯漠至美麗與豐碩之牛牧與綠茵河東草原，向未來子孫立言：只要依靠上主引路，即便遇有城墻高昂、力勝千兵之雄邦，同樣當被踏作平登迦南勝國之平路踏腳石。
