name: "以耶亞巴琳經亞嫩河與戰記上述蘇法的哇哈伯"
type: "地點"
secondary_types:
  - "歷史"
  - "事件"
status: formal
definition: |
  在希伯來大出亡長途由南蠻北轉的決勝階段中，經歷銅蛇恩望重療之以色列軍營昂首喜赴新生，首站依宿代表喜水皮袋的阿伯曠土，隨後節節邁向對望於摩押日升平野的高陵遺址——「以耶亞巴琳」，並且一路橫踐乾寂草溪的撒烈谷；最終主力兵團踏進並安息在中東古代極深地塹之戰略界分——深縱如崖、將亞摩利權豪與摩押邦界劃作一條冰鎮神線的「亞嫩河（River Arnon）」畔對岸；此等一路浩歌絕途破敵、逢水遇恩而過川渡嶺的前進史記，被先朝良君纂進於宣道至榮的史書《耶和華的戰記（The Book of the Wars of the Lord）》之內，千歲不衰地載稱神兵無匹如何席捲大破蘇法（Suphah）周郊之哇哈伯（Waheb）凶地與向亞珥深城坡谷推擊打平的偉烈皇威。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "神群繞越紅海行旅進扎日臨摩押極荒之以耶亞巴琳、撒烈古谿谷及浩浩大界亞嫩河南崖，此役榮勝事載在耶和華之戰記中蘇法的哇哈伯大掃蕩。"
    relation: "向追縱神途大眾揭露天主陪伴行腳是何等有節不息之勇歌；表揚不論跨荒過谿皆為天君自領破斬強權之巍壯聖蹟。"
    content: |
      自仰瞻銅桿生命怒振後，希伯來大營在地理視野與戰略方格內掀出了北上的壯麗新程：「以色列人...安營在以耶亞巴琳，與摩押相對的曠野，向日出之地。從那裏起行... 安營在亞嫩河那邊。這亞嫩河是在曠野... 是摩押的邊界，在摩押和亞摩利人搭界... 所以耶和華的戰記上說：『蘇法的哇哈伯與亞嫩河的谷，並向亞珥城眾谷的下坡，是靠近摩押的境界。』」（民二十一10-15）。黃迦勒在此從靈裡拉出了這一張水脈相隨與破險無懼的大路勝藍：「這般途中有極妙之意：『阿伯』自始即寓言喜戴滿皮袋喜涼大水；而踩進『以耶亞巴琳』即為遠山古墟、面向『日出之地』！你曉得，當你我不肯在蛇毒苦淚裡沉淪，一仰看救主的赦赦大喜，你的靈性行道立刻奔出了漫漫幽谷和黑暗絕壁，直接面迎日出東升的榮耀曙明！再來邁跨『撒烈』杞木荒途直至深深浩谷的大疆『亞嫩』——此等漫行絲毫不會斷了天上恩漿，天父要宣導：這條靈途乃是一趟又一趟高蹈無竭得力往前的大凱進！」（CT）。

      丁良才與拾穗則就近東古經名冊與天塹峽灣考據甚深：「『亞嫩河（Arnon）』發源於東境摩押曠岸，向死海中端縱斷，為寬可抵三里、長切五百公尺深的巨岩深溝，是千秋區隔北境亞摩利霸權與南鄰摩押國的強硬障壘；此時引出那部史稱《耶和華的戰記》，足顯當時代以色列英雄以詩句頌唱神為他們破開關隘、攻伐敵壘的頌章；『蘇法之哇哈伯（Waheb in Suphah）』乃當時邊塞險城或強陣風之谷，表定此不靠俗士兵革，全是天上大元帥替民清場！」（GT）。BibleHub 將這一頁穿渡諸河的頌詞稱許作信仰不退之壯盛碑銘：「古戰錄縱歸雲塵不留全文，遺留下蘇法谷這般英氣奔雲之對比，乃意勉子民：路非孤跡，主踏每階必伴詩音！」（BH）。

      KingComments 更多度以激昂胸口揚揚引誓為千世旅兵擊昂出戰金鐘：「莫小視你走一程安營一路的沉穆步伐；你看他們不再作冤哀奴工，走到一河越過一川即有戰紀長書大呼勝利！願今朝屬主聖徒全存『面朝日出之域』的光偉大志；遇亞嫩洪坑與舊敵交鋒，放聲呼喊那位曾把蘇法風谷打成樂安的永生王力，祂絕不同俗世半途中輟，必引你連破萬里荒沙踩上奶蜜新都！」（KC）。此筆立將深野跋山縱險翻寫成為天地無倫的喜躍征曲。
