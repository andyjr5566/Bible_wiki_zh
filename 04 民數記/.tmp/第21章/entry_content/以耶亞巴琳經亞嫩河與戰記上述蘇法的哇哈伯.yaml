name: "以耶亞巴琳經亞嫩河與戰記上述蘇法的哇哈伯"
type: "地點"
secondary_types:
  - "歷史"
status: formal
definition: |
  指民數記第二十一章紀錄以色列人自逃脫毒蛇傷害後，軍團重振信仰意志向東非曠野進程中依序度過的重要地緣節點。由日出方向（摩押之東）的以耶亞巴琳，經歷撒烈谷，直到割分摩押與亞摩利人王疆的界河「亞嫩河」。在這條挺進路上，作者徵引了早已散佚的古史綱鑑《耶和華的戰記》，用以見證上帝帶領聖徒經過蘇法的哇哈伯與各溪水之口，無畏行經強鄰與陡崖之疆，重顯上帝親任君勇帶導百姓履破難路無窮勝功。
accumulations:
  - book: "民數記"
    chapter: 21
    summary: "記載以色列人行旅經由日出的曠野向亞嫩谷口越邁，依據古史《耶和華的戰記》見證上帝於蘇法及哇哈伯水涯施與的大能領導。"
    relation: "向聖民確立征討迦南前夕之曠野行蹤是出於上帝歷史戰局的主導與指引，強調信仰隊伍從黑暗走向向日黎明的靈性轉移。"
    content: |
      自繞徑路中脫離苦痛試煉後，以色列人在行程中揭幕了邁向進取的章節：「他們從那裡起行，安營在阿伯；又從阿伯起行，安營在以耶亞巴琳，在摩押東緣，向日出之處的曠野... 從那裡起行，安營在亞嫩河那邊」（民二十一10-13）。一連串紮營之地的記載顯示行軍井然有序。
      
      丁良才與《舊約聖經背景註釋》指出，以耶亞巴琳（Iye-Abarim，意指亞巴琳山區的堆墟）代表面向「日出之地」；這地帶成為告別苦寂曠野漂流、面向光明向日之途的標竿。亞嫩河（Arnon）則是險峻深入沙谷的自然河流與極其重要的國土分界線，阻隔了南方的摩押與北方擴張強橫的亞摩利軍團。
      
      為引薦神率眾度谷不負重望，經文罕有地摘錄古代史冊《耶和華的戰記》（Book of the Wars of the Lord）：「蘇法的哇哈伯，和亞嫩河的支流；並向亞珥城坡斜長流下去，靠近摩押邊界」（民二十一14-15）。此經典證明，無論走進多深峭的絕谷或是臨兵悍境，真正的得勝與神蹟並不僅在兵器殺陣中，而是由信賴的耶和華神在前領引成軍。
