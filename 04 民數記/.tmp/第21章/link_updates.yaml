book: 04 民數記
chapter: 21
updates:
- title: 何珥山
  path: link_folder/地點/何珥山.md
  summary: 第4節「他們從何珥山起行，往紅海那條路走，要繞過以東地」——本章從這裡開始。CT 說明這座山在前一章的份量：「『何珥山』是亞倫去世之所(參二十25~26)，其確實地點不詳」。GT 丁良才《民數記註釋》由民33:38 與民20:29 推算起行的時間：「以色列人起行，大概是第四十年六月初幾日，還是天氣炎熱的時候。」
  relation: 何珥山是亞倫埋骨之處，也是新一代真正動身的起點。GT 丁良才《民數記註釋》說明接下來那段路為什麼難走：「以色列人既不能經過以東地（二十20-21），就必須沿著亞拉巴下到亞克巴海灣。亞拉伯地是有沙土碎石的平原，而且水草很缺乏，故此百姓因這路難行，心中甚是煩燥，況且他們越走，離迦南越遠。」剛葬完大祭司、又被迫繞遠路——火蛇之災就發生在這一段路上。
- title: 以東
  path: link_folder/地點/以東.md
  summary: 第4節以色列人「要繞過以東地」。以東在民20:20-21 已經拒絕借道，本章一開頭就是那個拒絕的後果。GT 丁良才《民數記註釋》寫出改走的路線：「以色列人既不能經過以東地（二十20-21），就必須沿著亞拉巴下到亞克巴海灣。」CT 註第10節的阿伯時也用以東定位：「『阿伯』位於阿卡巴灣的北面，以東地的東境」。
  relation: 同一段路上，以東只能繞過去，亞摩利人卻可以打下來，差別在血緣。GT 丁良才《民數記註釋》指出：「以東人、摩押人、亞捫人，都是他拉的後裔，和以色列人一樣（創十一27）。亞摩利人卻是迦南的後裔（創十15-16）」。神禁止以色列人騷擾前三者，卻沒有禁止他們攻打亞摩利人——本章的路線圖，其實是一張親屬關係圖。
- title: 摩押
  path: link_folder/人物/摩押.md
  summary: 摩押在本章是行軍路線的地標。第11節「安營在以耶亞巴琳，與摩押相對的曠野」；第13節「原來亞嫩河是摩押的邊界，在摩押和亞摩利人搭界的地方」；第15節「向亞珥城眾谷的下坡，是靠近摩押的境界」。CT 註亞珥城：「『亞珥城』摩押的舊京城，位於亞嫩河的北邊，摩押王巴勒到此迎接巴蘭(參二十二36)。」CT 並列出「摩押」的原文字義是「他父親的」。
  relation: 本章的摩押還不是對手，只是一條不可越過的邊界。第26節回顧了摩押吃過的一場敗仗：「這希實本是亞摩利王西宏的京城；西宏曾與摩押的先王爭戰，從他手中奪取了全地，直到亞嫩河。」以色列人打敗西宏，等於接手了原本屬於摩押的地——卻沒有動摩押自己的地界，因為 GT 丁良才《民數記註釋》指出從撒烈谷到亞嫩河是摩押人的地（申2:9-12）。這條界線一直守到下一章：摩押王巴勒不是被攻打，是自己害怕，才請巴蘭來咒詛。
- title: 亞捫人
  path: link_folder/人物/亞捫人.md
  summary: 第24節：「以色列人用刀殺了他，得了他的地，從亞嫩河到雅博河，直到亞捫人的境界，因為亞捫人的境界多有堅壘。」亞捫人是這場勝仗的停止線。CT 說明這兩條河是亞摩利人的南北境界，並列出「亞捫」的原文字義是「部落的」。
  relation: 亞捫的地沒有被取，有兩個不同層次的原因。GT 丁良才《民數記註釋》先給軍事上的：「亞捫人的境界多有堅壘，所以西宏王不能得勝。」——連西宏都攻不下來，所以那塊地不在西宏手上，自然也不在戰利品之內。但以色列人自己不去取，「卻另有別的緣故（申二18-19）」：申2:19 記神吩咐不可擾害亞捫人，因為那地是賜給羅得子孫的。GT 丁良才並指出以東人、摩押人、亞捫人都是他拉的後裔，與以色列人同源。
- title: 以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）
  path: link_folder/互文/以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）.md
  summary: 本章21-31節是這個互文的來源端：以色列人差使者求西宏借道，只走大道、不進田地葡萄園、不喝井水；西宏不但拒絕，還招聚眾民出到曠野，在雅雜開戰，結果被殺，以色列人得了從亞嫩河到雅博河的地。CT 指出這場仗的性質：「雖然以色列人有意越過約但河東面的亞摩利人，但神的旨意是要剪除他們」。GT 丁良才《民數記註釋》註明第21節「本句續13節（參申二24-27）」——申2 記的正是同一件事。
  relation: 這是以色列人在約但河東的第一場正式征戰，也是他們第一次真正得地。GT《啟導本聖經註釋》評估它的份量：所攻佔的外約但「成為以色列人最早定居的地方（參三十二章），且為以後進攻迦南的基地」，並指出「戰勝西宏與噩二王的事寫入了《詩篇》（一三五11；一三六19～20），足見此戰役的重要」。本條目所收的申2、申3、詩135、詩136，記的都是這一章打下來的地。
- title: 以色列戰勝巴珊王噩互文（申3：1-11；詩135：10-12；136：17-22）
  path: link_folder/互文/以色列戰勝巴珊王噩互文（申3：1-11；詩135：10-12；136：17-22）.md
  summary: 本章32-35節是這個互文的來源端：以色列人轉回向巴珊去，巴珊王噩出來在以得來交戰，結果「他們殺了他和他的眾子，並他的眾民，沒有留下一個，就得了他的地」。CT 註明噩的身分：「『巴珊王噩』他的身量高大，是最後一個利乏音人(申三11)」。GT《舊約聖經背景註釋》補上那個著名的細節：他的床「是鐵的，長九肘，寬四肘」（13呎×6呎）。
  relation: GT 丁良才《民數記註釋》在第35節下直接列出後代反覆回顧這場勝仗的經文：「（申三1-17，詩四十四3，一百三十五10-12，一百三十六17-22）」——本條目所收的申3、詩135、詩136 就是從這裡來的。他並指出這場勝仗有兩種效果：「1使迦南人恐懼（申二25，書二10，九10），2為以色列人也有教訓（申三21-22）。」西宏與噩兩場仗連在一起，日後成了以色列傳誦神大能的固定例證。
- title: 銅蛇被毀滅預表除去偶像（王下18：4）
  path: link_folder/互文/銅蛇被毀滅預表除去偶像（王下18：4）.md
  summary: 本章8-9節是這個互文的來源端：摩西照神的吩咐造了一條銅蛇掛在杆子上，「凡被蛇咬的，一望這銅蛇就活了」。CT 特別指出醫治的憑藉不在銅蛇本身：「並不是銅蛇能醫治百姓，乃是他們對神醫治的信心發生功效。他們的信仰，藉順從神的吩咐表明出來。」
  relation: CT 這句分辨，正是王下18:4 那件事的預告：等到百姓開始向銅蛇燒香，救恩的記號就變成了偶像，希西家把它打碎。銅蛇原本指向的是別人——CT 說它「表徵凡被古蛇撒但傷害的人，只要承認自己有罪，相信而仰賴救主基督，就必蒙恩得救」。器物本身沒有能力，能力在它所指向的那一位；一旦人盯著器物看，同一件東西就從救命的變成要命的。
- title: 火蛇（saraph）
  path: link_folder/原文/火蛇（saraph）.md
  summary: 記載於民數記21:6中，因為以色列眾人在繞道以東路途期間對耶和華與摩西萌生極端的怨怒與抗語，上帝為行施律法正義與管教，解除了對會眾免於毒蟲侵擾的自然保護；於是南地荒野常見之具有劇毒咬傷性質的「火蛇（saraph）」迅速入侵民群營地中咬擊反對人眾，引致民眾知罪垂首尋找中保呼援。
  relation: 深化舊約神權政治中「叛神輕棄供應必遭災難懲戒」的立約公義觀點，昭見當聖度容忍到達極致便必有現世苦厄臨頭，促迫選民省查歸正。
- title: 銅蛇（nehushtan）
  path: link_folder/原文/銅蛇（nehushtan）.md
  summary: 民數記21:8-9詳細闡述當遭受火蛇劇毒咬擊的群眾奔赴摩西跟前泣訴自懺時，上帝所頒定的大拯救藥方：命他以銅熔造一尊肖似火蛇儀觀的「銅蛇」高掛於旌杆頂上。本項安排要求被咬之民不必倚靠個人意志施力挽救或求索民間奇藥，僅單憑全體向主應許的絕對信實目光仰瞻桿上名物，即便即刻獲得無餘全癒。
  relation: 建構希伯來古道至高且最清晰的拯救象徵之一：銅蛇空載行殃之獸肖形卻絲毫無有內藏致命劇毒，徹底預表著往後大日裡，耶穌基督懷抱罪人形貌為億千會眾被高挑架上替擔大詛的榮救根義（參閱《約翰福音》3:14-15）。
- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  summary: 民數記21:21-31紀錄駐領約但河東南北重區的亞摩利君宰西宏與以色列人間的領土過道角力；西宏面對使從以謙誠「只走王家商路」為要的借道信書一概冷絕，甚至主動召集大軍揮旗阻赴雅雜開展激鬥。經天主宣告賜戰有憑下，以色列正規軍大勝自取敗害之敵，成功接管並留駐從亞嫩溪直臨雅博川之間的極美水田與邦塞。
  relation: 構成聖群邁程東方進佔長春好地最首發的一局公義武爭成功紀錄；證實對待抗拒主意之強邦不惜自取覆滅者，上帝有權悉數卸脫其領域而歸為長年繼承者應許豐品。
