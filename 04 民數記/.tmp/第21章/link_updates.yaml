updates:
  - target: "火蛇（saraph）"
    book: "民數記"
    chapter: 21
    summary: "記載以色列人於行經以東難途心懷忿怒攻擊上帝與摩西，神鬆開保守垂賜大沙漠之「火蛇（saraph）」咬斃會中群逆；經痛自悔恨求赦後獲得銅蛇赦救。"
    relation: "向舊約聖徒揭露天然大意氣與厭斥上帝天恩之大罪必遭自然界致殘懲撻，證明神之律法管教兼具公義與警醒。"

  - target: "銅蛇（nehushtan）"
    book: "民數記"
    chapter: 21
    summary: "應答於炎毒厄傷中垂涕悔改呼援的子眾，耶和華命摩西打造全擁魔煞姿貌而不夾毫塵毒血的銅蛇擎樹旗頂；見證只要全心單倚仰望，即刻盡免蛇傷起立復常。"
    relation: "成就基督教義最崇榮不朽的基督中保十字架替死預表，揭露救恩並不假手自身修補而是一念投誠仰望主恩。"

  - target: "亞摩利人"
    book: "民數記"
    chapter: 21
    summary: "占踞雅博河及亞嫩谷口之北方名悍亞摩利傲君西宏，嚴悍拒卻摩西低懷求借大道行過的好意請求，自起千師殺赴雅雜戰事；遭得神命奮戰之以色列人大舉屠退盡奪肥疆。"
    relation: "作為攻往迦南全境初期破伐罪孽至極邦國之實證；彰釋仰護主旨行戰得勝者能安越魔難疆壁、盡領極厚河東佳土。"
