book: 04 民數記
chapter: 21
updates:
- title: 火蛇（saraph）
  path: link_folder/原文/火蛇（saraph）.md
  summary: 民數記21:6：「於是耶和華使火蛇進入百姓中間，蛇就咬他們。以色列人中死了許多。」STEP 原文資料顯示這裡是兩個名詞並列：נָחָשׁ（ha./ne.cha.Shim，H5175，詞典義 serpent）與 שָׂרָף（ha./se.ra.Fim，H8314A，詞典義 serpent）；第8節神吩咐摩西造的則只說一個 שָׂרָף，沒有提材質。
  relation: 「火」是怎麼來的，來源給了兩種說法。GT 丁良才《民數記註釋》兩個並陳：「這些蛇咬了人，受傷的地方就紅腫，所以稱為火蛇。也有注釋家說，是因為這些蛇的皮色像銅似的。」GT《啟導本聖經註釋》採前一種：「所以稱為“火蛇”，大約因經此種毒蛇咬過的人，皮膚腫脹發炎如火，或痛楚如被火燒。」GT《舊約聖經背景註釋》則從動物學保留：本段沒有清楚說明蛇的種類，可能是沙漠蝮蛇的一種。GT 李道生《舊約聖經問題總解》把它比作印度的眼鏡蛇，並說它「匿於草木中，或曝曬於曠野之沙土上」。關鍵的一點是這些蛇並非新來的——GT 丁良才《民數記註釋》指出：「以色列人所過的曠野，本來有蛇不少（申八15）；但神常保護他們，直到祂發惡的時候。」
- title: 銅蛇（nehushtan）
  path: link_folder/原文/銅蛇（nehushtan）.md
  summary: 民數記21:9：「摩西便製造一條銅蛇，掛在杆子上；凡被蛇咬的，一望這銅蛇就活了。」STEP 原文資料顯示這個詞組是 נְחַשׁ נְחֹשֶׁת（ne.Chash ne.Cho.shet，H5175 蛇＋H5178A 銅），而「杆子」是 נֵס（Nes，H5251H，詞典義 ensign），帶有旗號、標竿的意思。
  relation: 蛇與銅這兩個字的字形極為接近，這是本節最常被提到的原文現象。GT 李道生《舊約聖經問題總解》記下這一點：「此蛇有注釋家認為其皮色像銅似的，據呂振中譯本注稱，希伯來文[銅]字與[蛇]字很相似。」GT《民數記串珠聖經註釋》另從顏色說明為什麼用銅：「銅蛇用銅製成，因為銅的顏色像血，帶有救贖的象徵，所以祭壇也是用銅包裹的」。CT 的解釋相同並補上預表：銅在聖經中是審判的意思，「所有的火蛇都有毒，只有銅蛇是沒有毒的，那就是預表耶穌是沒有罪的」。GT《舊約聖經背景註釋》提供了考古上的旁證：「按希伯來語這蛇是用銅（copper），而非英譯本的「青銅」（bronze）製造」，而亭納地區的一座神殿內室出土過一條長約五吋的銅製蛇像。這條銅蛇後來被以色列人帶進迦南，成了燒香的對象，最後被希西家打碎（王下18:4）。
- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  summary: 民數記21:13、21-32：亞嫩河「從亞摩利的境界流出來」；以色列人差使者去見亞摩利人的王西宏求借道遭拒，在雅雜擊敗他，得了從亞嫩河到雅博河的地，並占了雅謝、趕出那裡的亞摩利人。
  relation: 本章是以色列人第一次真正得地，而對象正是亞摩利人。GT 丁良才《民數記註釋》說明為什麼這一次可以打：「神沒有禁止以色列人擾害亞摩利人，像禁止他們騷擾以東和摩押人一樣（參申二9、19），乃是命以色列人與他們爭戰（申二24）」——差別在血緣與神的命令，不在強弱。同一則註釋也交代了他們的來歷：亞摩利人是迦南的後裔（創十15-16），「亞摩利人原來或從迦南的北邊遷到約旦河外，占了摩押地，直到亞嫩河」。GT《舊約聖經背景註釋》從美索不達米亞與埃及的記錄補上更長的歷史：主前二千年之後亞摩利人是美索不達米亞人數頗眾的民族，埃及的記錄把他們列為主前十四世紀時奧朗底河以南、一直延伸到外約但的幾個王國之一。KC 則從創15:16 提出時間的理由：神早已預告亞摩利人的審判，只是要等他們的罪孽滿盈，而那個時刻現在到了。
- title: 迦南大敗直到何珥瑪
  path: link_folder/歷史/迦南大敗直到何珥瑪.md
  summary: 民數記21:1-3：亞拉得王擄了以色列人幾個人，以色列人發願得勝之後，「那地方的名便叫何珥瑪（就是毀滅的意思）」。
  relation: 民14:45 是以色列人在這個地名上慘敗的記載，本章是同一個地名上的翻案。CT 的〔話中之光〕把兩件事直接並列：「何珥瑪是以色列人從前失敗的地方(參民十四45)，如今就在那地反敗為勝，而且是大大的得勝。米利巴記錄了百姓的虧欠，何珥瑪記錄了百姓的信心恢復。」GT《民數記串珠聖經註釋》的說法相同：這是「一雪三十八年前的恥辱（14:45）」。GT《舊約聖經背景註釋》另說明地名的來歷：「希伯來語中「何珥瑪」一字的意思是「毀滅」。在此用作地名，是紀念以色列人的勝利。」不過兩章的何珥瑪是不是同一處，GT 丁良才《民數記註釋》記下一段複雜的沿革：以色列人走後迦南人重新建造這城又用原名洗法，進迦南以後又得了這城，「仍改名為何珥瑪（書十二14，士一17）」。
- title: 嗎哪
  path: link_folder/主題/嗎哪.md
  summary: 民數記21:5：「這裡沒有糧，沒有水，我們的心厭惡這淡薄的食物。」CT 與 GT 丁良才《民數記註釋》都註明「這淡薄的食物」指的就是嗎哪。STEP 原文資料顯示「淡薄的」是 קְלֹקֵל（ha./ke.lo.Kel，H7052，詞典義 worthless）。
  relation: 這是嗎哪在民數記裡最後一次出現，也是百姓對它最重的一次表態。GT《啟導本聖經註釋》指出這個字的分量：百姓「把神賜嗎哪褻瀆地稱為“淡薄”（原文qeloqel有“不屑”、“討厭”之意）的食物」。GT 丁良才《民數記註釋》把它接到今天：「就是厭惡那從天上降下來的嗎哪，到如今也有許多人照樣以神的道理為淡薄的食物。」KC 抓住的是這句抱怨本身的矛盾：他們說沒有糧沒有水，其實他們有，只是吃膩了。值得注意的是後果——民11 抱怨嗎哪換來的是鵪鶉與瘟疫，本章換來的是火蛇；兩次的共同點是神先把他們所輕看的供應收回。
- title: 百姓厭棄嗎哪（約6：31-35）
  path: link_folder/互文/百姓厭棄嗎哪（約6：31-35）.md
  summary: 民數記21:5：「我們的心厭惡這淡薄的食物。」這是舊約這條線的最後一次。
  relation: 約6:31-35 主耶穌把自己稱作從天上降下來的真糧，而本章記下的正是百姓對那預表之物最徹底的一次厭棄。BH 在本章把兩者接了起來：嗎哪是基督這位生命之糧的預表，百姓對這份神蹟供應的嫌棄，預示了人對基督的拒絕。GT 丁良才《民數記註釋》把應用留在今天：「到如今也有許多人照樣以神的道理為淡薄的食物。」這一次厭棄的後果緊接著就來——火蛇進入百姓中間；KC 讀出其中的次序：當百姓輕看生命的糧，火蛇與死亡就臨到。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 民數記21:7-9：百姓認罪後求摩西禱告，「於是摩西為百姓禱告」；神吩咐他製造一條火蛇掛在杆子上，「摩西便製造一條銅蛇，掛在杆子上」。第32節他又打發人去窺探雅謝。
  relation: 本章的摩西只剩兩件事：代求與照做，而這兩件事都被記下了第一次與最後一次。GT 丁良才《民數記註釋》指出一個第一次：「按聖書所記，這是以色列人頭一次直接請求摩西為他們禱告。」同一則註釋把他以善勝惡的五次列成清單——出17:4、民12:1、民14:12、民16:41，本章第7節是第五次，也是最後一次。在民20 受了不得進迦南的判詞之後，他在本章沒有再爭辯，神說造蛇他就造蛇，神沒說的他一句也沒加。KC 從約3:14 指出這根杆子最終指向誰：摩西怎樣在曠野舉蛇，人子也必照樣被舉起來。
- title: 利乏音人
  path: link_folder/人物/利乏音人.md
  summary: 民數記21:33：「巴珊王噩和他的眾民都出來，在以得來與他們交戰。」CT 註：「『巴珊王噩』他的身量高大，是最後一個利乏音人(申三11)」。
  relation: 本章記下利乏音人最後一位君王被滅。GT 丁良才《民數記註釋》說明以色列人為什麼怕他：「以色列人怕噩王，不但是因為他的身量高大（參申一28，三11，撒上十七11），也是因為他的城邑堅固」。GT《舊約聖經背景註釋》記下申3:11 的那個細節：噩被形容為利乏音人（巨人）的最後一位，他的床是鐵的、長九肘寬四肘，並指出有關這人的資料歷史付諸厥如，但以色列傳統多次慶祝這次的勝利。KC 從噩身上讀出另一層：關於他，經文只給了一個特徵——那張巨大的床，也就是他把地用在自己的享受上。
- title: 大道（原文作王道）
  path: link_folder/文化/大道（原文作王道）.md
  summary: 民數記21:22：「求你容我們從你的地經過；我們不偏入田間和葡萄園，也不喝井裡的水，只走大道（原文作王道），直到過了你的境界。」
  relation: 這是同一套說詞第二次出場。民20:17 對以東說的與本節幾乎一字不差，兩次的結果卻完全相反：以東拒絕，以色列繞道；西宏拒絕，以色列開戰。GT 丁良才《民數記註釋》說明差別在神的命令而不在對方的態度：「神沒有禁止以色列人擾害亞摩利人，像禁止他們騷擾以東和摩押人一樣（參申二9、19），乃是命以色列人與他們爭戰（申二24）」，而以色列人仍然先用好話向他們通融。GT《民數記串珠聖經註釋》另指出這條路的實際價值：死海東面的高原上有這條大道通過，「所以以色列人選擇從這條路進約但谷再入迦南地」。
- title: 曠野飄流四十年
  path: link_folder/歷史/曠野飄流四十年.md
  summary: 民數記21:12：「從那裡起行，安營在撒烈谷。」GT 丁良才《民數記註釋》在這一節只註了一句：「當時十四35節的話全然應驗了。」
  relation: 民14 是判詞下達的那一章，民20 是刑期屆滿的那一章，本章則記下應驗的地點。GT《聖經精讀本──民數記註解》把本章的行程讀成一個轉折：從何珥山出發沒有能直接進入迦南，而是繞過曠野路行軍到毗斯迦山，走的是狹窄陡峭的小路，但並沒有經歷像前次那樣的失敗。GT《民數記串珠聖經註釋》從地理上說明同一件事：「以色列人現在可以挖井取水，因為他們已離開曠野，進到肥沃的土地了。」也就是說，四十年的判詞在撒烈谷結束，而井之歌就唱在它之後不遠。
