  \ |\n| **厭辱淡薄天糧** | 狂齒叱罵每日天上好嗎哪是平白無趣可憎的餱食，輕縱恩榮 | 神斂卻庇光讓熱土間常居的猛殺大火龍放縱橫衝、傷斃浪民 |\n\
  | **伏哭乞哀求醫** | 心醒投抱僕王長跪承禍、痛白自欺背叛恩恩上帝好愛 | 大令打鑄光潔亮容無血素巨「銅蛇」昂掀高桿頂，憑一望便得復世生大美 |\n\n\
