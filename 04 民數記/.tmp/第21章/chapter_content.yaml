organization: "### 初嘗戰鬥成果：亞拉得人突襲與奉獻何珥瑪凱歌（v1-3）\n\n民數記第21章開啟了以色列第二代會眾在漫長曠野鍛鍊後，正向 Canaan\
  \ 大省邁赴征討勝利新程的大格局序曲（v1-3）。故事的首發衝突始於地理節點南地 —— [[亞拉得人襲擊探路者及神賜下徹底戰勝之何珥瑪|「駐臨南方要道之迦南君王亞拉得驚見兵至進侵掳民，以民肅穆求父下願徹底破亡其縣定名何珥瑪」]]。此一度遇擊之地理正近於昔往三十八年前初代會老任性恃暴受辱被擊之地（參考\
  \ 民數記 14:45）；未曾預想新世代群庶展放的反應，並非恐嚇或暴退與舊世般叫罵退回，反而是沈穩自斂退至於神權君誓下力倡大奉獻契 —— 即呼喊若神交付便願履行聖禮徹底「毀其境為禁絕之物」（Herem）。主隨其願行戰力奪，那曾經為敗喪與恥笑老舊荒墳的新荒麓，就從今日成為勝利開天幕之「何珥瑪（全守奉獻上帝大裁決地）」歷史豐碑！\n\
  \n```mermaid\ntimeline\n    title 民數記第21章 自繞路考驗至戰無不勝東境接收進度\n    初擊勝兆 : 遇擊於南部邊疆立願不怠\
  \ : 洗去早恥獲領何珥瑪\n    毒禍與恩 : 避經 這裡以東荒路心焦謗糧 : 落遭遇 劇毒火蛇 後蒙 赦福銅蛇 垂拯\n    長途歡吟 : 進涉至 東北地\
  \ 亞嫩大疆與 歡騰比珥 泉谷 : 與神順命 同歌頌井長涼\n    掃河東兩君 : 揮劍平定 西宏驕國 與 北端壯悍噩兵 : 收存廣大美麗麥丘歸作子嗣聖遺\n\
  ```\n\n### 途行繞遠的枯倦大怨、火蛇猛災與仰視銅蛇赦病極至預表（v4-9）\n\n正如現實世道進攻歷程總見反覆修磨，部伍甫獲初捷不久，因為被拘無可踐越東側同屬祖家境野（見\
  \ [[以東]] 與自居之邊疆高點 [[何珥山]] ），軍列逼退向南牽出超長弧形去曲赴以東。在一串荒遠熱塵壓折途中，深潛而未除潔的肉血暴根竟再次於民眾胸臆爆宣，演變成為嚴重冒逆名節之\
  \ [[百姓抱怨難路痛厭淡薄食物與耶和華使火蛇咬人|「群音浩蕩罵責上帝長途枯倦更公然鄙棄天使天糧為可厭的淡薄粗料致招 猛毒火蛇 撲咬災過」]]（v4-6）。此乃破辱信仰道德底層的一擊：《拾穗》等各路考證顯發，會群不獨攻擊長征勞路，更悍行污蔑養育一身筋膜近半世秋雨的靈糧嗎哪為「淡薄」（原文乃貧乏空洞、淺淡惹厭的無堪劣食）！聖安神怒便收手解下了曠川對蠻野惡蟲長伴的神力防盾，大漠廣產具猛灼火性與紅熱刺牙的\
  \ [[火蛇（saraph）]] 全軍殺進眾居室幕，噬痛橫生喪聲動原。\n\n```mermaid\nflowchart TD\n    A[\"繞出以東熱漠勞心厭荒\"\
  ] -->|心發浮奢抗上| B[\"眾口狂謗嗎哪無華為極嫌之 淡薄食物\"]\n    B -->|上帝撒下荒蟲天然防壁| C[\"凶焰絕辣之 火蛇 全營流放肆無所懼咬擊民體\"\
  ]\n    C -->|痛定思省倒伏代禱| D[\"摩西承順恩命：融純銅冶鍛毫無料害 救贖銅蛇\"]\n    D -->|免去自尋功德自治之勞| E[\"\
  傷夫仰投全信一眼視臨旗竿頂 上品赦恩\"]\n    E --> F[\"神愛長發：舊災轉歇 即時告愈成義\"]\n```\n\n這一席慘劇因民自省折首哀告，催立起整幅基督教深邃天約裡光昭天下、堪為首屈一指的至聖代贖模樣\
  \ —— 此便是歷史永頌的 [[摩西為民祈禱製作銅蛇掛於杆上見證望蛇生得治|「先知隨順上靈告禱承敕鍛建神跡 榮光銅蛇 高頂幡上，垂盼病者憑一念單信瞻視旋即大康復」]]（v7-9）。這項拯救工藝精嚴有致：天上至明上帝並不宣命仗斬絕百害、亦不教授丹參秘藥，偏教摩西手打一座外顯宛肖\
  \ [[銅蛇（nehushtan）|魔毒厄蛇之態、其內核絲毫无一滴蛇霜死血之純銅蛇形]] 高擎長竿頂！一重宣揚見解直越古今：這象徵著未來天道獨往罪群、由受罰逆徒表象遮肩然心髓純厚至淨的神聖救恩主人\
  \ —— Jesus 基督（直承約3:14-15語調），竟親為天下眾冤擔過上挑於辱架頂端！世間被咬至死沉者無復自逞修行才幹，凡肯一向此桿伸送微誠一仰信目的愚者，皆當夜於至聖慈座得成榮安康健！惟至警示重重，《聖說》更附引\
  \ [[銅蛇被毀滅預表除去偶像（王下18：4）|「及王國時序人失敬純恩反將 榮身銅蛇 妄為香拜神明而遭王斧砸除」]] 互史（王下18:4），警語信眾切謹當敬大聖賜福主人而非把沉沉器具倒推成了偶像大害！\n\
  \n| 荒途歷險與事變節奏 | 前後民心起落與神明管促舉止 | 豐美教義深奧及世約象徵論證 |\n| :--- | :--- | :--- |\n| **出走何珥謗譏淡薄涼霜**\
  \ | 厭倦路遠反罵天使恩糕嗎哪為堪嫌薄料；招引紅舌火蛇。 | 彰釋恩賜不可傲心存戲慢棄；無恩眷時人倫於險路原毫無抵禦才防。 |\n| **冶打無毒赤銅懸幡直頂**\
  \ | 高立仿若禍身毫無毒性之銅器；免藥石自理唯求向竿單揚深盼一念。 | 至深啟演十字聖架中保獨受屈辱表徵，萬世子民藉純心投望即便洗禍長蘇。 |\n\n###\
  \ 大漠退終轉上向東高岸、古卷戰錄印契與比珥挖井之詩（v10-20）\n\n經歷火蛇血鍊與恩竿自建的高光歷練後，那長期盤阻進程之繞境老歲順終告捷；這是一幅長江廣涉的遷安畫冊\
  \ —— 由以東極外踏駐，迎臨大水洗入東土的 [[以耶亞巴琳經亞嫩河與戰記上述蘇法的哇哈伯|「步過洗魯駐望亞嫩河口、且見刻往昔主王浩卷《耶和華戰記》上歌載蘇法的哇哈伯等天然偉關」]]（v10-15）。以耶亞巴琳落位荒野最極；及全軍跨至摩押名郊（見\
  \ [[摩押]] 與周側之 [[亞捫人]] 地隅），大流奔暢的亞嫩河成了不可侵逆的堅實兩界！上帝那失落古書長歌「戰記」所揚傳之名要關谷「蘇法的哇哈伯」，宣告著神手早在百古已指派妥妥，全無差忒地領軍將踏入應許前驛的踏步地帶。\n\
  \n```mermaid\nmindmap\n    root(\"曠途退畢踏走 歡泉歡興 與 北侵雙雄捷記\")\n        破漠聽泉之喜\n    \
  \        (\"跨臨亞嫩勝域古卷天書親記 蘇法谷榮\")\n            (\"駐踩泉都比珥毫無論恨父聲和親笑集聚賜露\")\n      \
  \      (\"首長提擒理政名品 王圭禮杖 俯身率眾歡吟詠恩\")\n        蕩掃河東一隅\n            (\"亞摩利昂昂強主西宏自毀通關求好大盟而討焚身\"\
  )\n            (\"雄據北疆極野大河大君 噩王 與其驍雄連番傾挫莫留殘旅\")\n            (\"極廣麥豐厚邑皆歸 神宣信眾為承遺好本\"\
  )\n```\n\n而這世代蛻凡去俗之頂級見證，便是無上喜樂溢滿荒坡的聖地歡章 —— 這就是馳譽長史的 [[比珥活水泉谷與眾首領用圭用杖挖井引頌讚凱歌|「進歇名邑比珥莫起埋怨心恨，喜逢天主主動喝合甘水；先王大首喜把公朝理務王圭祭杖同戳鬆原詠恩開泉」]]（v16-18）。反思先民每遇苦旱便呼天哭號，如今至善後嗣一過此土卻滿有信怡和靜默安隨！天父亦喜從其意親宣引宴賜以清奔之美井；全體貴勳棄甩架貌擒仗朝職要物長圭祭手同挖鬆土，唱頌「井兮深湧、高歌為揚」的大浩甘霖凱調！此乃新舊交接真正圓滿大顯神喜之最美光芒：新世從此非復被動受拖之亡野者，成了在喜順和音間共耕喜樂神樂園的真信心繼主！\n\
  \n| 開地關口與詩樂意蘊 | 社群與長老於進攻路途中的舉致 | 重啟心神盟誓之高偉示範力 |\n| :--- | :--- | :--- |\n| **洗魯橋畔吟覽早載勝書**\
  \ | 列駐亞嫩邊溝重憶戰記宏詞揚呼君恩全順。 | 地界不移，見證主親誓保守選眾安順破圍入站之不動明言。 |\n| **長官捉手用圭杖鑿破喜川** | 歡悅莫叫苦痛，首臣聯手蹲戳原面揚和頌井高賦。\
  \ | 心態脫退前人奴疑愁霧，以信順大詠迎求無窮美流的高雅新境界。 |\n\n### 挺劍河東全得大勝：潰退亞摩利驕朝及巴珊頑主噩（v21-35）\n\n本章中末，直引出建構未來希伯來史詩宏大基址之「兩河東岸霸主大清除行動」\
  \ —— 宣告了名流宇宙的 [[戰勝希實本與巴珊二大頑梗敵軍與佔領其廣澤領土|「宣平誠摯通商良儀於驕豪敵邦遭怒犯反打，聖師藉主旨掃卻西宏並揮師長殄巴珊凶王噩的長久基業」]]（v21-35；此歷史豪戰深深交疊於後代宣德讚典間，分別為\
  \ [[以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）]] 與 [[以色列戰勝巴珊王噩互文（申3：1-11；詩135：10-12；136：17-22）]]\
  \ 。首發戰火為統領中北平壤豪國的亞摩利驕龍西宏（見 [[亞摩利人]] ），當先軍捧往誠篤禮文求履公商走軌、發死言斷無冒占農池之約，渠竟橫揮暴志集軍進軍於野道雅雜衝挑合戰；神恩助戰使民旅盡屠強主，將其從亞嫩長谿向至雅博幽嶺所攬全等榮邑（曾自摩押昔主手前猛掠來奪者）一統入庫留住！\n\
  \n此凱歌意氣千尋，連隨引爆第二進擊征服巨碑：那盤坐遠北極澤山陵的霸王巴珊主王「噩」，仗恃山河厚力聯結龐大名從出鋒自向以得來撲擊我眾。天恩直接安撫眾手：「休怯怕其凶相，因為我都付掌！」子眾奮身橫衝連絕此傲王身骨兼他雙王儲及長旅千萬莫有一逃！這套秋爽大順不僅全數收得壯豐良麥極產地，更是將信仰之師從漫遊漂逐之貧丁，一舉晉封為能依命攻堅克難、雄掌沃地新王邦的聖誓天軍！\n\
  \n### 靈訓總結與新約救濟全景印設（v1-35）\n\n總結民數記第21章，從哭悼老世老路進至戰呼河東風雲的大歷史跨幅中，聖傳指釋了至深不渝的神性榮恩共存大規：雖途有難涉熱曲易牽出人性怨毒招蛇害，只要單一倚望耶和華隨命早造、無半絲魔性毒素卻甘懷受苦獸容之救護懸幡\
  \ —— Jesus 十架主神之完美化身，罪痛病殤立可冰散；更能使哭淚之師脫胎為立居井岸詠舞同掘活甘流的新聖群體！當他們攜神力往掃世苦仇敵西宏與傲骨老王噩時，神權天兵再莫恐怯於凶蠻兵車，唯因主權在頂！這從自憐悲歌一翻直上成為勝史古讚、由毒蛇肆荒步向收割東隅浩野豐禾的神榮史冊，千真無差地預演了凡以信仰瞻望得贖基督救恩的徒侶，必定奔出舊土世途的苦寒羈絆、穩進永樂國邑享受得勝安寧之終局榮幸！"
