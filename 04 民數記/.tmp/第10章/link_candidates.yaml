candidates:
  - name: "銀號"
    type: "文化"
    description: "民數記10章神吩咐摩西用錘出來的純銀製作兩枝號，交由祭司吹奏。號聲用於招聚會眾、指揮各營起行、在戰爭中呼求神的幫助，以及在節期歡慶時作為紀念。銀在聖經中象徵救贖，號聲代表神的命令與引導。"
  - name: "拔營起行"
    type: "歷史"
    description: "以色列人在出埃及第二年二月二十日，雲彩從法櫃的帳幕收上去，他們便首次按著神所指示的軍隊編組，井然有序地離開西乃的曠野，向應許之地進發。"
  - name: "巴蘭的曠野"
    type: "地點"
    description: "以色列人離開西乃曠野後，雲彩停住並安營的地點。位於西乃半島中東部，是以色列人曠野飄流期間的一個重要區域。"
  - name: "何巴"
    type: "人物"
    description: "米甸人流珥（葉忒羅）的兒子，摩西的內兄（或岳父，依翻譯而異）。摩西懇求他與以色列人同去，借重他對曠野地形的熟悉作為「眼目」，他後來其後裔（基尼人）與以色列人同住。"
  - name: "約櫃前行與停住的宣告"
    type: "神學"
    description: "當約櫃起行時，摩西宣告「耶和華啊，求你興起！願你的仇敵四散」；停住時宣告「耶和華啊，求你回到以色列的千萬人中」。這顯示約櫃代表神的同在與引領，神親自作為軍隊的元帥為百姓爭戰與尋找安息之所。"
