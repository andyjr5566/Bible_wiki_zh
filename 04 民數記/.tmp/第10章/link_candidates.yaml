candidates:
  - name: "銀號"
    type: "文化"
    evidence: "第2節：「你要用銀子做兩枝號，都要錘出來的，用以招聚會眾，並叫眾營起行。」神吩咐摩西用純銀錘出兩枝號，交由亞倫和他兒子（祭司）作祭司的吹奏。這號用以招聚全會眾或首領，與引導各營按部就班起行，為以色列曠野行軍的重要信號與儀禮器物。"
    surfaces:
      - "號"
  - name: "會幕（帳幕整體）"
    type: "主題"
    evidence: "第3節：「吹這號的時候，全會眾要到你那裡，聚集在會幕門口。」會幕為會眾聚集聽受摩西吩咐，以及事奉朝拜神的核心場所。"
    surfaces:
      - "會幕"
  - name: "燔祭"
    type: "神學"
    evidence: "第10節：「在你們快樂的日子和節期，並月朔，獻燔祭和平安祭，也要吹號...」快樂日、節期及月朔奉獻燔祭時皆需吹銀號，作為在耶和華面前的紀念。"
    surfaces:
      - "燔祭"
  - name: "平安祭"
    type: "神學"
    evidence: "第10節：「...獻燔祭和平安祭，也要吹號，這都要在你們的神面前作為紀念。」平安祭表達與神並百姓互相比鄰的團契歡慶，伴隨吹號更顯敬拜的感恩與神聖榮耀。"
    surfaces:
      - "平安祭"
  - name: "法櫃的帳幕"
    type: "地點"
    evidence: "第11節：「第二年二月二十日，雲彩從法櫃的帳幕收上去。」指停靠有法櫃的聖幕，雲彩自幕上收起是神賜發前進信號的啟動標誌。"
  - name: "雲彩"
    type: "原文"
    evidence: "第11-12、34節記載雲彩自法櫃的帳幕收回並停住在巴蘭的曠野，日間行路亦有耶和華的雲彩覆蓋於上方，體現神有形有體的引導與庇蔭。"
    surfaces:
      - "雲彩"
  - name: "拔營起行"
    type: "歷史"
    evidence: "第12-28節詳載以色列眾人首度仰賴神雲彩與吹號前引，自西乃曠野解散帳幕而朝著巴蘭曠野有序列隊移動的歷史軍旅紀錄。"
    surfaces:
      - "起行"
      - "往前行"
      - "行路"
  - name: "西乃的曠野"
    type: "地點"
    evidence: "第12節：「以色列人就按站往前行，離開西乃的曠野...」此為以色列民駐紮垂望西乃山、獲受聖約與組成了軍營的起始地。"
  - name: "巴蘭的曠野"
    type: "地點"
    evidence: "第12節：「...雲彩停住在巴蘭的曠野。」位於西乃半島中東部的廣大遼闊無垠乾旱區，為此番大遷徙第一階段安營指止的目的地。"
  - name: "革順子孫"
    type: "人物"
    evidence: "第17節：「帳幕拆卸，革順的子孫和米拉利的子孫就抬著帳幕先往前行。」革順家為利未主要宗族之一，負責拆卸並隨前後營起隊同行運載帳幕的布幕、外覆及門簾。"
    surfaces:
      - "革順的子孫"
  - name: "米拉利子孫"
    type: "人物"
    evidence: "第17節：「帳幕拆卸，革順的子孫和米拉利的子孫就抬著帳幕先往前行。」米拉利支系分擔神殿帷板、柱子及座墩的搬運職務，須早在哥轄人攜載聖物駐臨前把主台帳幕搭妥。"
    surfaces:
      - "米拉利的子孫"
  - name: "哥轄子孫"
    type: "人物"
    evidence: "第21節：「哥轄人抬著聖物先往前行。他們未到以前，抬帳幕的已經把帳幕支好。」哥轄人為尊榮親近聖化之宗族，專職肩負並押行會幕中最核心神聖的至聖擺器群。"
    surfaces:
      - "哥轄人"
  - name: "何巴"
    type: "人物"
    evidence: "第29-32節記載摩西至誠力勸米甸人流珥的兒子何巴攜行同行，期願依仗何巴對漫川大曠野地形的純熟熟悉而兼任行程引路與安營覓點的良善「眼目」。"
  - name: "流珥葉忒羅與何巴的稱謂關係"
    type: "解經爭議"
    evidence: "第29節稱：「摩西對他岳父（或作：內兄）─米甸人流珥的兒子何巴─說...」聖經中對摩西岳父有稱流珥（創、出）、葉忒羅（出），而處所對何巴乃岳父或內兄之身份歸向有原文字義與古舊稱呼習語上的爭議辨明。"
    surfaces:
      - "岳父"
      - "內兄"
  - name: "約櫃"
    type: "主題"
    evidence: "第33節：「耶和華的約櫃在前頭行了三天的路程，為他們尋找安歇的地方。」此指乘裝法版契約的神聖方櫃，超越前導於眾人在荒野中率行爭戰尋營。"
    surfaces:
      - "耶和華的約櫃"
  - name: "約櫃前行與停住的宣告"
    type: "神學"
    evidence: "第35-36節記載約櫃每當起進與留頓定居，摩西皆必定隨行作出莊嚴禱詞宣告，以此明證並呼告真神主動為選民四散仇敵、又歡欣榮耀與千萬會民永樂同居的心境與信念。"
  - name: "安營與纛"
    type: "主題"
    evidence: "第14、18、22、25節四次以「纛」標記四大營的行進單位：「按著軍隊首先往前行的是猶大營的纛」「按著軍隊往前行的是流便營的纛」「按著軍隊往前行的是以法蓮營的纛」「在諸營末後的是但營的纛」。民1-2 訂下的安營格局在本章第一次實際移動，四個纛依序拔營。CT 註「『纛』指旗幟」。"
    surfaces:
      - "纛"
  - name: "銀號與主再來天使吹號（太24：31）"
    type: "互文"
    evidence: "第2節銀號用以招聚會眾。GT《民數記串珠聖經註釋》由此接到末世：「主再來的時候，更有天使吹號，招聚神的選民（太24:31）。」GT《啟導本聖經註釋》也說「到末後的日子，神的使者要用『號筒的大聲』將選民從四方招聚攏來（太二十四31；參啟8～9章）」；BH 在第2、5、6、7節反覆接到帖前4:16 的號筒聲。"
  - name: "銀號與聖殿敬拜（代下5：12）"
    type: "互文"
    evidence: "第10節規定節期、月朔獻祭吹號。GT 丁良才指出「當所羅門的時候，有一百二十枝（代下五12）」，並上溯「當刃劍的時候，有七枝號筒（代上十五24）」；GT《民數記串珠聖經註釋》說「日後聖殿敬拜也用銀號（王下11:14）」；GT《聖經精讀本》列出快樂的日子的實例，包含所羅門奉獻聖殿（代下5:12；7:6）。"
  - name: "古代近東的戰場傳訊方式"
    type: "背景"
    evidence: "GT《舊約聖經背景註釋》在第3～7節說明本章號聲制度的軍事背景：「作戰時傳達訊息，有好幾種方法。無論是戍防陣線還是空曠地區，烽火都得到廣泛使用。高舉的杖和標槍，有時亦能傳遞簡單的訊息。晚銅器時代（亦即本處經文的當代）的埃及，已經有在軍事和宗教上使用號角訊息的例證了。號角可以混合長短的角聲，傳達預定的信號。」"
  - name: "銀號形制（直筒喇叭口）"
    type: "文化"
    evidence: "第2節「你要用銀子做兩枝號」。GT 對形制與長度留下兩個並不一致的數字：《民數記串珠聖經註釋》據猶太史家說「銀號的直管約四十五毫米長，開端像喇叭」，《啟導本聖經註釋》據約瑟夫說「銀號為直筒形，長約45公分，末端張開如喇叭」。GT《舊約聖經背景註釋》另舉考古實例：「法老圖坦卡門的墓中，就有一個這樣的樂器（長度幾達兩呎的銀號）」，並說明銀的提煉用灰吹法。GT 丁良才與《啟導本》都把它與羊角製的「角」分開。"
  - name: "銀號製作工藝（錘出法）"
    type: "文化"
    evidence: "第2節「都要錘出來的」。CT 註「『錘出來』表示整體的材質沒有摻雜，是純銀作的，金燈台也是錘出來的(參出二十五31)」，並把「錘出來(原文雙字)」拆為「錘打金屬(首字)；做，製作，完成(次字)」。GT《民數記串珠聖經註釋》說「整枝號筒要用人手錘出來（1），正如聖所中的器具一樣」。"
  - name: "摩西請何巴作嚮導是否顯出信心不足"
    type: "解經爭議"
    evidence: "第29-32節摩西兩次挽留何巴作「眼目」。CT〔靈意註解〕判為「摩西請求岳父同行，好作眼目，表示他的信心不足」；KC 也說「That is not a good thing... Moses should have left it at that」。GT《聖經精讀本》正面反對：「這並不表示摩西的不信，而是為了更加有效地調動百萬以上的以色列百姓所需要的」；GT 賈斯樂郝威《聖經難解經文詮釋手冊》命題9 另從分工角度回答。四套來源在此三比一（或二比二）分歧。"
  - name: "約櫃在前頭行與在營中的位置"
    type: "解經爭議"
    evidence: "第33節說「耶和華的約櫃在前頭行了三天的路程」，但民二17 與本章第21節把哥轄人抬的聖物排在第二營之後。GT 賈斯樂郝威《聖經難解經文詮釋手冊》命題10 列出三種解法（兩個約櫃說、平時居中特殊時在前說、「在前頭行」指領導地位而非位置）；CT 與 GT 丁良才都採「特別緣故才轉到前頭（書三6）」；KC 則讀成職分翻轉——約櫃離開被保護的中心位置，反過來成為保護百姓的那一位。"
