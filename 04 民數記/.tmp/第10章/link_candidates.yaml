candidates:
  - name: "銀號"
    type: "文化"
    evidence: "第2節：「你要用銀子做兩枝號，都要錘出來的，用以招聚會眾，並叫眾營起行。」神吩咐摩西用純銀錘出兩枝號，交由亞倫和他兒子（祭司）作祭司的吹奏。這號用以招聚全會眾或首領，與引導各營按部就班起行，為以色列曠野行軍的重要信號與儀禮器物。"
    surfaces:
      - "號"
  - name: "會幕（帳幕整體）"
    type: "主題"
    evidence: "第3節：「吹這號的時候，全會眾要到你那裡，聚集在會幕門口。」會幕為會眾聚集聽受摩西吩咐，以及事奉朝拜神的核心場所。"
    surfaces:
      - "會幕"
  - name: "燔祭"
    type: "原文"
    evidence: "第10節：「在你們快樂的日子和節期，並月朔，獻燔祭和平安祭，也要吹號...」快樂日、節期及月朔奉獻燔祭時皆需吹銀號，作為在耶和華面前的紀念。"
    surfaces:
      - "燔祭"
  - name: "平安祭"
    type: "原文"
    evidence: "第10節：「...獻燔祭和平安祭，也要吹號，這都要在你們的神面前作為紀念。」平安祭表達與神並百姓互相比鄰的團契歡慶，伴隨吹號更顯敬拜的感恩與神聖榮耀。"
    surfaces:
      - "平安祭"
  - name: "法櫃的帳幕"
    type: "地點"
    evidence: "第11節：「第二年二月二十日，雲彩從法櫃的帳幕收上去。」指停靠有法櫃的聖幕，雲彩自幕上收起是神賜發前進信號的啟動標誌。"
  - name: "雲彩（anan）"
    type: "原文"
    evidence: "第11-12、34節記載雲彩自法櫃的帳幕收回並停住在巴蘭的曠野，日間行路亦有耶和華的雲彩覆蓋於上方，體現神有形有體的引導與庇蔭。"
    surfaces:
      - "雲彩"
  - name: "拔營起行"
    type: "歷史"
    evidence: "第12-28節詳載以色列眾人首度仰賴神雲彩與吹號前引，自西乃曠野解散帳幕而朝著巴蘭曠野有序列隊移動的歷史軍旅紀錄。"
    surfaces:
      - "起行"
      - "往前行"
      - "行路"
  - name: "西乃的曠野"
    type: "地點"
    evidence: "第12節：「以色列人就按站往前行，離開西乃的曠野...」此為以色列民駐紮垂望西乃山、獲受聖約與組成了軍營的起始地。"
  - name: "巴蘭的曠野"
    type: "地點"
    evidence: "第12節：「...雲彩停住在巴蘭的曠野。」位於西乃半島中東部的廣大遼闊無垠乾旱區，為此番大遷徙第一階段安營指止的目的地。"
  - name: "革順子孫"
    type: "人物"
    evidence: "第17節：「帳幕拆卸，革順的子孫和米拉利的子孫就抬著帳幕先往前行。」革順家為利未主要宗族之一，負責拆卸並隨前後營起隊同行運載帳幕的布幕、外覆及門簾。"
    surfaces:
      - "革順的子孫"
  - name: "米拉利子孫"
    type: "人物"
    evidence: "第17節：「帳幕拆卸，革順的子孫和米拉利的子孫就抬著帳幕先往前行。」米拉利支系分擔神殿帷板、柱子及座墩的搬運職務，須早在哥轄人攜載聖物駐臨前把主台帳幕搭妥。"
    surfaces:
      - "米拉利的子孫"
  - name: "哥轄子孫"
    type: "人物"
    evidence: "第21節：「哥轄人抬著聖物先往前行。他們未到以前，抬帳幕的已經把帳幕支好。」哥轄人為尊榮親近聖化之宗族，專職肩負並押行會幕中最核心神聖的至聖擺器群。"
    surfaces:
      - "哥轄人"
  - name: "何巴"
    type: "人物"
    evidence: "第29-32節記載摩西至誠力勸米甸人流珥的兒子何巴攜行同行，期願依仗何巴對漫川大曠野地形的純熟熟悉而兼任行程引路與安營覓點的良善「眼目」。"
  - name: "流珥葉忒羅與何巴的稱謂關係"
    type: "解經爭議"
    evidence: "第29節稱：「摩西對他岳父（或作：內兄）─米甸人流珥的兒子何巴─說...」聖經中對摩西岳父有稱流珥（創、出）、葉忒羅（出），而處所對何巴乃岳父或內兄之身份歸向有原文字義與古舊稱呼習語上的爭議辨明。"
    surfaces:
      - "岳父"
      - "內兄"
  - name: "約櫃"
    type: "主題"
    evidence: "第33節：「耶和華的約櫃在前頭行了三天的路程，為他們尋找安歇的地方。」此指乘裝法版契約的神聖方櫃，超越前導於眾人在荒野中率行爭戰尋營。"
    surfaces:
      - "耶和華的約櫃"
  - name: "約櫃前行與停住的宣告"
    type: "神學"
    evidence: "第35-36節記載約櫃每當起進與留頓定居，摩西皆必定隨行作出莊嚴禱詞宣告，以此明證並呼告真神主動為選民四散仇敵、又歡欣榮耀與千萬會民永樂同居的心境與信念。"
