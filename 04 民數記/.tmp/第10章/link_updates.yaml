book: "04 民數記"
chapter: 10
updates:
- title: "會幕（帳幕整體）"
  path: "link_folder/主題/會幕（帳幕整體）.md"
  summary: "民數記第10章記載祭司於銀號長吹齊作的隆重時節，命令天下萬眾一律在會幕門口集合聽命；在首航起駕旅途中，會幕主架幕板由革順與米拉利宗支率先搬運行先，並趕及哥轄神使負載聖地內部寶重來到前先即時架置搭定。"
  relation: "會幕在本章完全展示神全盤引領動靜節奏中唯一的宇宙軸心地位；散處之眾人非憑奔競己謀，而是仰借此一至愛見證宇居，方顯救贖大身凝聚得一的神安規例。"
- title: "燔祭（olah）"
  path: "link_folder/原文/燔祭（olah）.md"
  summary: "第10節言明凡遇全民快慰福慶、例定歲時並每屆初夕之月朔，以色列眾族皆當向世父呈奉聖全燔祭，並由亞倫後系掌祭者伴依盛烈吹號聲齊揭揚聞。"
  relation: "此儀宣認信徒縱享諸般歡慶交融泰然盛境，亦須一旨仰定全然順靠奉亡無隱於天的燔祭見證；隨著宣號而起之樂，將信友向王無暇的順忠推上高天憶恤的盟誼基台。"
- title: "平安祭（shelamim）"
  path: "link_folder/原文/平安祭（shelamim）.md"
  summary: "以色列民於一切佳節與歡愉年月之初向耶和華大立和好同歡之平安祭時，必定同佐盛烈無加之錘鑄銀號呼鼓，以此常顯在父王前的親愛紀念與盟約印書。"
  relation: "平安祭的馨美交誼藉此在銀響震空之聲裡臻升高華；救贖之神宣信容納子民之悅慶筵交，使至聖得和的主榮印照萬家心胸。"
- title: "法櫃的帳幕"
  path: "link_folder/地點/法櫃的帳幕.md"
  summary: "出埃及第二年二月二十日，榮光護身之神雲自藏立有見證經籍之法櫃的帳幕上方浩渺騰拔而起；以此靈雲引收作至寶密契，激揚十二支派自古幽的西乃荒境向浩曠神途整部大齊的長發。"
  relation: "顯明天地神威不僅停留於言語寫訓之古簡內，更能以無比真實大威赫赫的真存在自其安駐寓居之聖幕居點隨時領起會陣穿砂蕩險。"
- title: "雲彩（anan）"
  path: "link_folder/原文/雲彩（anan）.md"
  summary: "日間破途履涉，神的雲彩常蓋於以色列千萬行旅之上為其遮厲引向；既從西乃長宵收昇起征，末後更安怡停降於巴蘭無窮之茫曠中。"
  relation: "此靈彩大披表意父主對世俗疲乏眾心不棄不休的神愛同進；凡隨護神榮生氣的大引率從步履走，民身即便履越炙苦深川仍獲大聖蔭慰之全備遮被。"
- title: "西乃的曠野"
  path: "link_folder/地點/西乃的曠野.md"
  summary: "是處既為猶太全隊結盟習儀經一歲大鑄化身的孕母之殿，本章以「二月二十日以色列人…離開西乃的曠野」宣告此昔居安寧沉潛聖學階站順圓成畢業。"
  relation: "證明信徒不當終日溺醉或滯淹初遇施訓聖靈的密境甘巢，當隨主大風拔步奮馳，從學道體認轉而闖向動態征敵並操守實踐的天旅大局。"
- title: "革順子孫"
  path: "link_folder/人物/革順子孫.md"
  summary: "本隊伍承擔帷幄厚重的運送聖職，當主堂巨篷開始行使拆遷之令，革順的家眾即時肩扶千鈞蓋錦搭頂重陣踏行在猶大第一方旗大隊強固中胸而先行起往。"
  relation: "彰顯屬靈家朝事繁務勞之重役毫無下賤低遜，實屬撐架耶和華地上行營不可歇的基礎聖柱；他們穩靠軍行相助之護屏下，體顯了軍陣爭戰與神儀工匠親親協調的和真互補。"
- title: "米拉利子孫"
  path: "link_folder/人物/米拉利子孫.md"
  summary: "當一眾營旌大集出駕時，米拉利的後進勤苦肩起厚木巨棟、大閂跟銀質沉榫與革順親軍一同搶在流便大營先途起駕；這令他們得有寬足先辰早臨下一中驛趕前建搭無差。"
  relation: "他們早勤先造的預役品位是全般神殿能夠井然落成、好納隨後臨抵之聖儀秘物最核心之前鋒功勞，盡解聖殿中雖無華彩外現之巨木重鐵也是長安神國極尊大務。"
- title: "哥轄子孫"
  path: "link_folder/人物/哥轄子孫.md"
  summary: "哥轄宗裔繼處大營樞位，背馱會堂中心各等大聖至尊的秘禮重儀在流便中軍保護後徐驅常發，使前行搭護小兵知悉隨時奉置之聖體快當榮臨。"
  relation: "徹底確立了救世永在的大靈要居眾軍正衷同動共享之定意；以肉軀肩頂這批至嚴榮儀而絕無假借異獸大車，標言親靈子民須敬將最寶真主的崇要尊分長舉一身。"
- title: "流珥葉忒羅與何巴的稱謂關係"
  path: "link_folder/解經爭議/流珥葉忒羅與何巴的稱謂關係.md"
  summary: "在荒路出動臨界夕上，摩西向米甸強望「流珥的兒子何巴」苦言邀請陪伴以資路向眼目；此段在稱與位段重揭「岳父或內兄」雙層同源字訓（chotean）所遺留的大解詮辨釋。"
  relation: "表達經學典釋當中，外亞血族對早期會旅涉苦相濟的濃厚因緣，亦宣白古往語言對家庭姻系尊重與彈性延稱於信眾同歸大榮天路途中的歷史映印。"
- title: "約櫃"
  path: "link_folder/主題/約櫃.md"
  summary: "當曠世始軍跨別神山揮軍啟騁起程之際，向常靜寓萬眾央心的神約寶櫃竟然特旨脫序而出前領，帶頭破道疾巡三天悠路，自挑平廣良址祈庇萬姓享擁舒然歇息與全喜休怡。"
  relation: "「前行三日求平靜」這段震魂宣史，最精醇刻畫了為人身嘗幽冥而三朝得復勝歸之主，不避萬苦自駕先道劈荊滅魔，使殘兵瘦雛在王身永固護愛裡重尋得永遠可依之安身美蔭。"
