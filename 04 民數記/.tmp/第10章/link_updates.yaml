book: 04 民數記
chapter: 10
updates:
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 會幕在本章出現三次，每次身分都不同：第3節是集合點——兩枝號齊吹時，全會眾要「聚集在會幕門口」；第17節是被拆卸的對象——「帳幕拆卸，革順的子孫和米拉利的子孫就抬著帳幕先往前行」；第21節是趕工的目標——哥轄人抬聖物到達之前，帳幕必須已經支好。
  relation: GT《聖經精讀本》點出本章最容易被略過的一件事：「會幕不是固定的結構，是能移動（能拆裝）的帳篷。這是神對以色列百姓的照顧，使他們能在曠野的旅程中也能事奉神。」KC 則注意到第3節的集合不是例行公事：「耶和華邀請祂的百姓進到祂面前，『到會幕門口』……聚會不該是一種慣性，而是發生在那位用祂寶血的代價買贖了我們的主的邀請之下。」
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: v10「在你們快樂的日子和節期，並月朔，獻燔祭和平安祭，也要吹號，這都要在你們的神面前作為紀念」——燔祭在此與吹號連在一起，屬節期與月朔的例行獻祭。
  relation: 利未記記的是燔祭「怎麼獻」，本章記的是「什麼時候獻」——快樂的日子、節期、月朔。燔祭至此不再只是個人自願的奉獻，也成了全會眾按時序舉行的公共敬拜的一部分。GT《聖經精讀本》另指出一個常被略過的界線：吹號只配在「與罪惡沒有關係的祭」上，「獻祭時吹號的儀式，是在祭物被神悅納時，希望號聲也被悅納」——所以是燔祭與平安祭，不是贖罪祭。
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: 民10:10 規定在歡樂的日子、節期與月朔獻燔祭與平安祭時，要吹號：「這都要在你們的神面前作為紀念。」
  relation: 利3 立下平安祭的條例，民10:10 把它與吹銀號綁在一起，指定用在節期與月朔的場合——同一種祭，從個人自願的感恩擴及全民按時序舉行的節慶。CT 在本節重述這祭的性質：「此名詞在希伯來文表示『和好』或『福祉』……表明獻祭者對神的感恩，虔敬與奉獻，並藉此顯明神與人及人與鄰舍的和諧關係」；GT《聖經精讀本》則說在這種祭上吹號「象徵著喜樂」。
- title: 法櫃的帳幕
  path: link_folder/地點/法櫃的帳幕.md
  summary: 第11節：「第二年二月二十日，雲彩從法櫃的帳幕收上去。」這是全章的起點——雲彩離開帳幕上方，以色列人才開始第一次拔營。
  relation: CT 給「法櫃」的原文字義是「見證」。STEP 原文資料顯示第11節的原文是 mish.Kan ha.'e.Dut（מִשְׁכַּן，H4908，詞典義 tabernacle；עֵדוּת，H5715，詞典義 testimony），字面即「見證的居所」；同節「收上去」是 na.'a.Lah（H5927H，詞典形 a.lah，詞典義 to ascend），Niphal 被動形——是雲彩「被收上去」，不是它自己升上去。神起行的號令，發自那個以「見證」為名的地方。
- title: 雲彩
  path: link_folder/原文/雲彩.md
  summary: 本章雲彩出現兩次：第11-12節記它從法櫃的帳幕收上去、帶百姓離開西乃的曠野，最後停住在巴蘭的曠野；第34節記行路途中「日間有耶和華的雲彩在他們以上」。CT 指出「耶和華的雲彩」這個說法「表示與普通的雲彩不同，是神同在的象徵，又稱雲柱，神用它來指示以色列人所當行的路（參申一33）」。
  relation: 第9章講的是雲彩停與行的規則，本章是這規則第一次被執行。STEP 原文資料顯示第11節的「雲彩」是 he.'a.Nan（עָנָן，H6051，詞典義 cloud）。CT 在本章一律把雲彩讀為聖靈的表徵。BH 則用另一個名稱稱它：這朵雲就是後世所說的「舍吉拿的榮耀」，神榮耀的可見顯現，白天遮蔭、夜間發光。
- title: 西乃的曠野
  path: link_folder/地點/西乃的曠野.md
  summary: 第12節：「以色列人就按站往前行，離開西乃的曠野。」以色列人在這裡停留了將近一年——CT 說「距離這日子，以色列人在西乃曠野安營十一個多月（參出十九1）」，KC 也說他們在西乃山下待了差不多一年。
  relation: GT 丁良才把這一節看作全卷的分水嶺：「本書的樞紐，在10和11節當中。」GT《啟導本聖經註釋》說明它切開的兩段有多長：「自本節到二十二1，記載以色列民從西奈起程到達摩押平原一共38年的生活。」在西乃的這一年不是空白：GT《聖經精讀本》列出這段時間裡完成的事——與神立約、接受律法、建立會幕、接受祭祀制度，最後為了行軍數點人數，並評論說「以色列百姓一年時間的等候不是時間和精力的浪費，而是培養成熟人格和增強國力所必需的時間」。
- title: 革順子孫
  path: link_folder/人物/革順子孫.md
  summary: 第17節：「帳幕拆卸，革順的子孫和米拉利的子孫就抬著帳幕先往前行。」他們排在猶大營之後、流便營之前，是第一批隨行的利未人。BH 說明分工：革順人負責幕幔、蓋、簾（民4:24-26）。
  relation: 他們先走是有實際理由的。CT 解釋：「『先往前行』指跟隨在猶大營的後面，這樣，當他們到達新的營地，可以立即支搭起來，好讓哥轄的子孫所搬運的聖物（器具）到達時，馬上搬進去，不容不相干的人碰觸。」KC 也把這個安排歸給神的智慧：百姓再次安營時，革順與米拉利人已經可以動工。
- title: 米拉利子孫
  path: link_folder/人物/米拉利子孫.md
  summary: 第17節與革順子孫同時起行。BH 說明兩者的分工不同：米拉利人負責的是骨架——豎板、閂、柱子、帶卯的座（民4:31-32）。CT 則把兩族的職責合起來描述：「將會幕和外院的框架拆卸，有幕幔、幕板、院帷、柱子、閂、帶卯的座等，分別由革順的子孫和米拉利的子孫負責搬運。」
  relation: 米拉利人抬的是整座帳幕裡最不起眼卻最先需要的部分：沒有豎板與座，幕幔無處可掛。他們與革順人一起搶在哥轄人之前抵達，是為了讓聖物一到就有地方安放（第21節）。
- title: 哥轄子孫
  path: link_folder/人物/哥轄子孫.md
  summary: 第21節：「哥轄人抬著聖物先往前行。他們未到以前，抬帳幕的已經把帳幕支好。」他們排在流便營之後，位置在整支隊伍的中段。CT 列出他們所抬的「聖物」：約櫃、金香壇、金燈台、陳設餅的桌子、洗濯盆、祭壇等器具和它們的附件。
  relation: GT《聖經精讀本》指出哥轄人的職責與另外兩族有明確界線：「哥轄子孫與革順和米拉利子孫不同，只能抬著搬運聖物（4:5-20;7:6-9）。因為這些聖物都是用在聖潔的事上。」KC 用一句話點出這個排序的用意：約櫃是整個行列的中心，正如神所吩咐的。CT 在本節的〔話中之光〕也強調：「不管隊形如何變動，神的聖物包括約櫃在內，始終是在隊形的正中間。」
- title: 流珥葉忒羅與何巴的稱謂關係
  path: link_folder/解經爭議/流珥葉忒羅與何巴的稱謂關係.md
  summary: 民10:29 稱「摩西的岳父米甸人流珥的兒子何巴」，摩西邀他同行作曠野的嚮導。同一個希伯來字在此再次同時可讀為「岳父」與「內兄」，是本爭議在五經中的第三個落點。STEP 原文資料給出這個字的身分：第29節「岳父」是 cho.Ten（חֹתֵן，H2859A），簡要詞典義是 relative（親戚），本節譯義才落在 father-in-law；詞形是 Qal 主動分詞（HVqrmsc），本身並不指定是哪一種姻親。
  relation: 這一節把「流珥」「何巴」兩個名字直接連在一起（何巴是流珥的兒子），因此凡主張流珥即葉忒羅的讀法，都必須把何巴解為摩西的內兄；而出18:27 摩西讓岳父回本地、卻在此請何巴留下，正是 CT 用來論證兩人並非同一人的根據。本章的三份 GT 子來源各補一角：《舊約聖經背景註釋》說「用來形容女子男性近親的字眼含義很廣泛，同一個字可以解作女子的父親、兄弟，甚至祖父」；《聖經精讀本》說「因為岳父的希伯來語也有『妻兄』的意思」；李道生《舊約聖經問題總解(上)》列出五項分析，並提到「按猶太人拉比的考證，葉忒羅共有七個兒子。何巴是其中之一」。
- title: 約櫃
  path: link_folder/主題/約櫃.md
  summary: 民10:33-36 以色列人離開耶和華的山，往前行了三天的路程，「耶和華的約櫃在前頭行了三天的路程，為他們尋找安歇的地方」；約櫃往前行時摩西說「耶和華啊，求你興起」，停住時說「耶和華啊，求你回到以色列的千萬人中」。
  relation: CT 指出抬約櫃的哥轄子孫通常跟在流便營後面，但若遇特別緣故約櫃便會轉到前頭（參書3:6）；本章是約櫃由隊伍正中轉為在前頭引路的場合，並記下摩西為約櫃起行與停住所說的兩句話。這個位置變化引出一個歷來的爭論，各家解法見「約櫃在前頭行與在營中的位置」。STEP 原文資料另補一層呼應：第33節「安歇的地方」是 me.nu.Chah（H4496H，詞典義 resting），第36節「停住」是 nu.Ch/oh（H5117，詞典形 nu.ach，詞典義 to rest）——約櫃去尋找的與它自己所做的，出自同一個字根。
- title: 安營與纛
  path: link_folder/主題/安營與纛.md
  summary: 民1-2 訂下的四纛格局，在本章第一次實際移動。第14、18、22、25節四次以「纛」標記行進單位：猶大營的纛在前，流便營的纛第二，以法蓮營的纛第三，但營的纛「在諸營末後」。STEP 原文資料顯示這四處用的都是 De.gel（דֶּ֫גֶל，H1714，詞典義 standard），全章共四次，正好對應四營。
  relation: 安營的次序與起行的次序是同一套。GT 丁良才把這件事寫得很清楚：「以色列人起行的次序，和安營的次序一樣（二17）」，並指出這個排法有防衛上的考量——「四營中的第一營（就是最先之營）的人數，和第四營（就是最後之營）的人數，都是很多（參二章之表），所以能保護當中第二第三兩營。」BH 補上各營旗號的傳統形象：猶大的纛傳統上與獅子相連（創49:9），流便的纛與人的形象相連（創49:3），以法蓮的纛可能是牛。CT 只給一句原文字義：「『纛』指旗幟」。
- title: 銀號與主再來天使吹號（太24：31）
  path: link_folder/互文/銀號與主再來天使吹號（太24：31）.md
  summary: 民10:2 規定銀號的第一個用途是「招聚會眾」。GT 的三份子來源都由此接到末世的招聚：《民數記串珠聖經註釋》「主再來的時候，更有天使吹號，招聚神的選民（太24:31）」；《啟導本聖經註釋》「到末後的日子，神的使者要用『號筒的大聲』將選民從四方招聚攏來（太二十四31；參啟8～9章）」；《聖經精讀本》「耶穌將與號角聲一同再臨(太24:31)」。
  relation: 同一個動作在兩端出現：曠野裡由祭司吹號把散開的會眾召到會幕門口，末了由天使吹號把選民從四方召聚。BH 在第2、5、6、7節四處反覆接到帖前4:16 的同一意象，並指出號聲之所以能擔此職，是因為它在舊約本來就「清晰而帶權威，能穿透日常生活的嘈雜」。
- title: 銀號與聖殿敬拜（代下5：12）
  path: link_folder/互文/銀號與聖殿敬拜（代下5：12）.md
  summary: 民10:10 規定「在你們快樂的日子和節期，並月朔，獻燔祭和平安祭，也要吹號」，並定為「世世代代永遠的定例」（第8節）。GT 丁良才追蹤這條定例後來的規模：本章兩枝，大衛運約櫃時七枝（代上十五24），所羅門獻殿時一百二十枝（代下五12）。
  relation: GT《聖經精讀本》把「快樂的日子」定義為「不是指特定的日子，而是指發生喜樂之事的任何日子」，並列出後代實際吹號的場合：搬運約櫃、所羅門奉獻聖殿、立聖殿根基、修建耶路撒冷城牆、恢復神的律法和祭祀制度。GT《民數記串珠聖經註釋》一句話總結：「日後聖殿敬拜也用銀號（王下11:14）。」曠野裡臨時的行軍信號，最後成了聖殿裡固定的敬拜編制。
- title: 銀號形制（直筒喇叭口）
  path: link_folder/文化/銀號形制（直筒喇叭口）.md
  summary: 民10:2「你要用銀子做兩枝號」。GT 兩份子來源給的長度差了十倍，值得並列：《民數記串珠聖經註釋》據猶太史家說「銀號的直管約四十五毫米長，開端像喇叭」；《啟導本聖經註釋》據約瑟夫說「銀號為直筒形，長約45公分，末端張開如喇叭，吹時可發出大、小、長、短信號」。經文本身沒有給尺寸。
  relation: 本章多次強調這是「銀」號，而不是羊角號。GT《啟導本聖經註釋》把兩者分開：「以色列人另有一種用羊角製成的彎曲形喇叭，稱之為『角』，也在節期和爭戰時使用（參書六4～7；代上十五28）。」STEP 原文資料顯示第2、8、9、10節用的字都是 cha.tso.tse.rah（חֲצֹצְרָה，H2689，詞典義 trumpet）。GT《舊約聖經背景註釋》另舉出實物旁證：「法老圖坦卡門的墓中，就有一個這樣的樂器（長度幾達兩呎的銀號）」，並說明銀料用灰吹法（cupellation）從鉛礦提煉，主前第三千年紀吾珥的銀匠已經懂得用銀子製造樂器和首飾。
- title: 銀號製作工藝（錘出法）
  path: link_folder/文化/銀號製作工藝（錘出法）.md
  summary: 民10:2 規定兩枝銀號「都要錘出來的」。CT 說明這道工序的意思：「表示整體的材質沒有摻雜，是純銀作的，金燈台也是錘出來的（參出二十五31）」，並把「錘出來（原文雙字）」拆為「錘打金屬（首字）；做，製作，完成（次字）」。STEP 原文資料在第2節正好對上兩個字：mik.Shah（מִקְשָׁה，H4749，詞典義 beating）與 ta.'a.Seh（H6213H，詞典形 a.sah，詞典義 to make）。
  relation: GT《民數記串珠聖經註釋》把銀號歸入同一類器物：「整枝號筒要用人手錘出來（1），正如聖所中的器具一樣。」出25章的施恩座基路伯與金燈臺用的是同一道工法，本章把它從聖所內部的器具延伸到日常發號施令的工具。KC 從被錘打這個動作讀出另一層：這銀號所發的是那位「為我們被神的刀擊打」的好牧人的聲音（亞13:7上）。
