name: "銀號"
type: "文化"
status: "candidate"
brief: "神吩咐摩西用純銀錘出兩枝號，由祭司吹奏，用於招聚會眾、指揮起行、爭戰與節期獻祭。"
trigger_sources:
  - "民數記 第10章"
current_data: |-
  民數記第十章記載，神吩咐摩西用銀子錘出兩枝號，交由亞倫子孫作祭司的吹奏。不同的吹號方式傳達不同的指令：單吹一枝召集眾首領；雙號齊吹招聚全會眾到會幕門口；吹出大聲（急促聲）則是指揮各營起行的信號。
  
  在屬靈含義上，銀子在聖經中象徵救贖，「錘出來」象徵經過十字架的壓榨與苦難。祭司吹銀號，代表以色列人的行動與生活完全受神話語的指揮與引導。此外，在面對仇敵爭戰，或在快樂的日子、節期和月朔獻祭時，也要吹號，這不僅是在神面前蒙記念，也見證了神的救贖與同在是百姓得勝與喜樂的根基。
