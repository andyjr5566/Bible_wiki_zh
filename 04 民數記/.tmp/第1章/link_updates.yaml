- title: 外人近前來必被治死
  path: link_folder/主題/外人近前來必被治死.md
  summary: 民1:51 下半：「近前來的外人必被治死。」CT 指出「外人」意指非利未人，「包括以色列其他支派和外族人」；GT《啟導本》說法相同：從會幕的侍奉來說，非利未人的以色列人也都是外人（參出29:33；利22:12）。GT 丁良才則把「外人」讀得更窄，注為「就是外族人」（參民16:40，利22:12註）——兩種讀法在同一份 GT 拾穗裡並列。第53節給出這條禁令的理由：利未人在法櫃帳幕四圍安營，「免得忿怒臨到以色列會眾」。GT《聖經精讀本》說利未人「擔當著護衛神聖潔的任務」，並舉撒母耳記上第5章為例，說神以死亡刑罰無視並破壞神聖潔的人。CT 的〔話中之光〕把利未人的營讀成一條界線：讓百姓「在每天的生活中學習尊神為大，不越過神的界限，免得引來死亡」，但同時也是保護——「有利未人的營在，外人就不會亂闖進神的會幕，人就可以平安的活在神的同在裡」。BH 指出這道嚴厲警告凸顯帳幕的聖潔，以及未經授權就靠近神同在的嚴重性；它並在第53節連到拿答、亞比戶獻凡火的事（利10:1-2），說明不合規矩的敬拜會招致立即的審判。
