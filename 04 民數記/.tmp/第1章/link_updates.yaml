- title: 十二族長協助數點
  path: link_folder/事件/十二族長協助數點.md
  summary: 民1:4「每支派中必有一人作本支派的族長，幫助你們」，名單見 v5-15，v16 稱他們「都是從會中選召的，各作本支派的首領，都是以色列軍中的統領」，v17 記摩西、亞倫「帶著這些按名指定的人」。CT 把三個職銜分開解釋：「選召」意指才能出眾、被神按名指定；「首領」意指官長，平時治理本支派的事務；「統領」意指將領，戰時統帥本支派的軍士。GT 丁良才推測這些族長「大概是摩西先前所分派的首領」（參出18:21-26）。這批名字的字義，四份來源給的並不一致，最明顯的是西緬支派的示路蔑：CT 作「神的朋友」，GT《啟導本》作「神是我的拯救」，KC 依 Grant《Numerical Bible》作「與神和好」，BH 作「神是我的平安」。猶大支派的拿順也一樣：CT 作「男巫」，KC 作「先知」。KC 自己就對這件事提出警告：名字在聖經裡有其意義，但要緊的是保持警醒、不要落入幻想，「有些名字有多個意思。要有一定把握地確定一個名字的意思，最好查閱幾本聖經人名辭典；如果幾本都給同一個意思，那多半就是正確的意思。」KC 另指出這些名字裡多半有神的名字在響——「El」就是「神」，這顯示以色列人在埃及寄居期間並沒有忘記他們的神，而是把對神的記念放進了給孩子取的名字裡。
  relation: '[[數點民數]]、[[家室與宗族]]、[[二十歲以外能打仗的]]、[[以色列人的軍隊]]、[[摩西]]、[[亞倫]]、[[拿順]]'
- title: 拿順
  path: link_folder/人物/拿順.md
  summary: 民1:7「屬猶大的，有亞米拿達的兒子拿順」，v16 說他與其餘十一人同是「本支派的首領」兼「以色列軍中的統領」。各家給的字義不一：CT 的原文字義作「男巫」，KC 依 Grant《Numerical Bible》作「先知」，父名亞米拿達 CT 作「我的親屬是高貴的」、BH 作「我的親屬是尊貴的」。GT 丁良才補上兩層身分：「拿順是亞倫的妻兄（出六23），也是大衛的先祖」（得四）。BH 指出拿順出現在馬太福音一4 與路加福音三32 耶穌的家譜裡，並記下一則猶太傳統：拿順備受推崇，人常把信心之舉歸給他，例如紅海分開之前第一個踏進海裡的就是他。CT 另指出猶大支派本身相當特殊——大衛王和其後猶大國諸王都出自該支派，主耶穌也是大衛的後裔（羅1:3）。
  relation: '[[猶大支派]]、[[十二族長協助數點]]、[[數點民數]]、[[亞倫]]'
- title: 六十萬零三千五百五十人（出38：26）
  path: link_folder/事件/六十萬零三千五百五十人（出38：26）.md
  summary: 民1:45-46「這樣，凡以色列人中被數的，照著宗族，從二十歲以外，能出去打仗、被數的，共有六十萬零三千五百五十名」——與出38:26 收贖命銀時所點的總數一字不差。GT《啟導本》：全部可以作戰的男丁總數為603,550，「與第一次人口統計的總數一樣（出三十八26）」，也接近三十八年後第三次統計的601,730人（民26:51）。GT 丁良才據這個相同的數字主張兩次計算「是相連的」，理由之一正是「利未人在民一章上沒有被數點（一48-49，二33），在出三十八上他們也沒有被數點，因為二次的數目是一樣的」。KC 給的間隔是九個月，並指出前一次普查每個被數的人要付半舍客勒銀子作贖價，銀子因此成了救贖代價的表記。GT《啟導本》另補上這個總數後來的下場：這603,550人「其中除了迦勒和約書亞二人，全都在曠野的旅程中死去，沒有進入迦南地」。BH 指出這個數目不含利未人，是神向亞伯拉罕應許後裔如同星辰的應驗（創15:5）。
  relation: '[[數點民數]]、[[兩次普查的關係]]、[[六十萬人的數目]]、[[利未支派]]、[[二十歲以外能打仗的]]'
- title: 古代近東的人口統計
  path: link_folder/背景/古代近東的人口統計.md
  summary: 民1:2-3 這次點名造冊的性質，GT《舊約聖經背景註釋》用一則背景說明：「古代的人口統計是為徵召壯丁而設的，召來的男丁有時得服兵役，有時要參與官方的建築工程。政府往往同時課取人頭稅，人頭稅有時甚至是人口統計的動機。」同一則註釋並把本章與出30:11-16 綁在一起：「這次統計的目的雖是徵召軍兵，與出埃及記三十11～16（參註釋）為收取殿稅而作的統計，卻不無關係。」BH 從役齡的角度給了同一件事的另一面：二十歲在古代近東文化中通常就是能持兵器、參與共同防衛的年齡，而出30:14 用的也是同一個年齡下限——兵籍與稅籍在這個門檻上重合。GT《舊約聖經背景註釋》另在 v52 指出營地形制同樣有近東背景：軍營呈方形是這時代埃及的慣例，而主前九世紀的亞述藝術顯示君王位居受保護的中央。
  relation: '[[數點民數]]、[[兩次普查的關係]]、[[安營與纛]]、[[二十歲以外能打仗的]]'
- title: 六十萬人的數目
  path: link_folder/解經爭議/六十萬人的數目.md
  summary: 民1:46 的603,550 是二十歲以上男丁，換算成全體人口的規模，本章來源給出三種處理。GT《啟導本》一面給數字一面記下質疑：「這裡的總數只限20歲以上的男丁，若連婦孺及利未人，總人口當在二百萬左右。不少史家為此龐大數字作出種種解釋，認為按當時地理、資源等等，決不可能養活……龐大人口。」它並沒有站在任何一邊，而是把重點轉開：「不問史家如何解說，數點人口的屬靈教訓是十分明白的。」GT 丁良才算的數字更高：「連婦女、孩子，統共有二百四十余萬，可見是神的保護。」GT《聖經精讀本》則直接把它當神蹟處理：「以色列百姓的數目，第四代或第五代（約430年）只有男丁（二十歲以外）已達到六十萬，若靠自然能力這是不可能的，只有靠神超自然的恩典和能力才有可能。」GT《舊約聖經背景註釋》在【民一46 人口的數目】下沒有另立說法，而是把討論指回出埃及記十二37 的註釋。
  relation: '[[數點民數]]、[[六十萬零三千五百五十人（出38：26）]]、[[兩次普查的關係]]、[[以色列人的軍隊]]'
