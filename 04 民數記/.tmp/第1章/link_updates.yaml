- title: 以法蓮
  path: link_folder/人物/以法蓮.md
  summary: 民1:32-33 以法蓮 40,500 人。GT 丁良才指出瑪拿西雖是約瑟的長子，以法蓮支派的名字卻被列在先（創48:19-20），人數也多（申33:16）；但在曠野飄流的時候這支派的人數卻減少了八千名（民26:37）。同一份註釋另指出族長以利沙瑪「是約書亞的祖父（代上七26-27）」。GT《聖經精讀本》指出小兒子以法蓮列在哥哥瑪拿西前，在行軍和安營時成為中心，是因為以法蓮是神主權性的揀選，得到了比瑪拿西更大的祝福（創48:13-14,17-19）。GT《舊約聖經背景註釋》指出拉結眾子的支派位於西面，居首的是被立為約瑟長子的以法蓮。BH 指出以法蓮後來成為北國以色列的代表支派，其領袖名字以利沙瑪意為「我的神已經聽見」。
  relation: '[[瑪拿西]]、[[十二支派起源]]、[[安營與纛]]、[[約書亞]]'
- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  summary: 民1:34-35 瑪拿西 32,200 人，當時人數最少。GT 丁良才指出瑪拿西當時人數最少（創48:19），但在曠野飄流期間卻加增了二萬零五百名（民26:34），參伯12:23「使邦國興旺而又毀滅」。GT 精讀本指出神超越人的意思成就自己的工作，在神揀選的工作面前人應該謙卑讚美神的旨意（羅9:18-29）。BH 指出瑪拿西後來分裂為約旦河東西兩個半支派，產業廣大反映雅各對約瑟眾子的祝福（創48:19）。
  relation: '[[以法蓮]]、[[十二支派起源]]、[[安營與纛]]'
- title: 數點民數
  path: link_folder/事件/數點民數.md
  summary: 民1:1-46 記神吩咐摩西、亞倫在西乃曠野會幕中，按家室、宗族、人名，逐一計算「從二十歲以外、能出去打仗」的男丁，由十二支派族長協助，當日完成，共點得六十萬零三千五百五十名；利未支派不列入軍籍（v47-49）。STEP 原文資料顯示「數點」是全章的主導動詞：פָּקַד（pa.qad，H6485，詞典義 to reckon）在本章出現二十二次，從第3節的命令、第19節的執行，到第21至46節每個支派的「被數的」，用的都是同一個字。第47節講利未人沒有被數時，STEP 標的 morphology 換成 Hothpaal 被動式（context gloss 作 they were enrolled），是本章唯一一次用這個語態。另一個關鍵動詞是 נָשָׂא（na.sa，H5375，詞典義 to lift），本章只出現三次：第2節的「計算」（שְׂא֗וּ，se.U，逐字是「舉起」全會眾的頭）、第49節「也不可…計算他們的總數」（תִשָּׂ֑א，ti.Sa），以及第50節利未人「要抬帳幕」（יִשְׂא֤וּ，yis.U）。CT 的原文字義註記與此相合：它把第2節的「計算」與第50節的「抬」都注為「舉，承擔」。GT《聖經精讀本》指出這次數點「是一個轉折，使以色列民族從一個自然的群體形成神權國家體制」。KC 給的是另一個角度：數點是所有權的憑據，而且是逐個點名——「這表示百姓對神來說不是一團大眾，個人不會被群體吸收掉；神認識他們每一個，一個也不會漏掉。」
  relation: '[[利未支派]]、[[家室與宗族]]、[[二十歲以外能打仗的]]、[[十二族長協助數點]]、[[兩次普查的關係]]、[[六十萬零三千五百五十人（出38：26）]]'
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 民1:47-53：利未人「沒有按著支派數在其中」，神吩咐「惟獨利未支派你不可數點，也不可在以色列人中計算他們的總數」（v49），改派他們管法櫃的帳幕與其中器具、負責拆卸豎立搬運、在帳幕四圍安營並謹守，「免得忿怒臨到以色列會眾」（v50-53）。STEP 原文資料顯示第49、50 兩節在原文上是一組對照：第49節「不可數點」用 פָּקַד（pa.qad，H6485）的 Qal（תִפְקֹ֔ד，tif.Kod），第50節「只要派利未人管」用的是同一個原形的 Hiphil 命令式（הַפְקֵ֣ד，haf.Ked，H6485J，context gloss 作 appoint）；同樣地，第49節「不可…計算他們的總數」用 נָשָׂא（na.sa，H5375）的「舉起／點算」義（תִשָּׂ֑א，ti.Sa），第50節「他們要抬帳幕」用的是同一個原形的「扛負」義（יִשְׂא֤וּ，yis.U）。同一個字在相鄰兩節裡從「不可數」翻成「要派」、從「不可點」翻成「要抬」。CT 的〔話中之光〕正好落在這個轉折上：「在以色列人的數點上，神沒有數點利未人，不是利未人不配為神的目的上前線作戰，而是神要他們承擔更重要的任務，為神的軍隊鞏固後方。」GT 丁良才指出利未人另有一套數法：不像十二支派只數二十歲以外能打仗的，利未人是「從一個月以外的，一切男子就都被數點了」（民3:14-39）；他並指出利未人早在金牛犢事件中就已為耶和華熱心（出32:26-29；申33:8-9），也曾幫助祭司（出38:21），「他們到這時候方被分派襄辦帳幕的事」。GT《啟導本》補上支派內部結構：利未有三子革順、哥轄和米拉利（創46:11），摩西和亞倫都是哥轄的子孫；早期利未人侍奉的年歲為三十至五十歲，後來將開始服務的年齡降到二十歲（代下31:7）。KC 指出利未人不在戰士之列，他們照管帳幕並就近紮營，而這裡稱「法櫃的帳幕」講的是對外見證的一面。
  relation: '[[數點民數]]、[[安營與纛]]、[[外人近前來必被治死]]、[[會幕（帳幕整體）]]、[[二十歲以外能打仗的]]'
- title: 安營與纛
  path: link_folder/主題/安營與纛.md
  summary: 民1:52-53：以色列人「照他們的軍隊，各歸本營，各歸本纛」安營，利未人則「在法櫃帳幕的四圍安營」。CT 指出這是說各支派各有指定的營地和旗幟，而利未人安營在會幕四周、亦即以色列人營地的中央。STEP 原文資料顯示「本纛」的原形是 דֶּ֫גֶל（de.gel，H1714，詞典義 standard），「本營」是 מַחֲנֶה（ma.cha.neh，H4264，詞典義 camp）。GT《舊約聖經背景註釋》在這一節給了兩則背景，指的是兩個不同的文明：一則論營盤形狀——「軍營呈方形，是這時代埃及的慣例」，而「主前九世紀的亞述藝術也顯示，君王位居受保護的中央」；一則論旗幟——「埃及軍兵每個部隊都是以神祇為名，旗幟（纛）之上都有所屬神祇的標記」，因此假定每個支派都有象徵該支派事物在其纛上「是理所當然的事」。同一則註釋隨即提出另一種讀法：「但另一方面，亦有釋經家將這字解作軍兵的單位，而非旗幟。」GT《聖經精讀本》則把重點放在方位：以會幕為中心支搭自己的帳幕，「這表示他們應過以神為中心的生活」。BH 指出纛在古代近東的軍事與典禮場合用來表明歸屬與團結，並把它接到新約：信徒同樣被召聚在基督的旗幟之下（來12:1-2），也呼應以賽亞書11:10「耶西的根立作萬民的大旗」。
