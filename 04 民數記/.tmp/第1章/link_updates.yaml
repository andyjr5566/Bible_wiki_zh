- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 民1:1 記載「耶和華在西乃的曠野、會幕中曉諭摩西說」，此時會幕已建立一個月（出40:17），利未記律例已頒佈完畢。本章以會幕為全以色列安營的中心——利未人四圍安營守護（v50-53），十二支派分四營環繞外圍。v50,53 特別稱「法櫃的帳幕」；GT 丁良才解釋這個稱呼的由來：「帳幕稱為法櫃的帳幕，因為法櫃本是帳幕中最要緊的聖器。」GT《聖經精讀本》補上兩個附屬名詞的所指：「其中的器具」指陳設餅桌、燈檯、燔祭壇等器具的附屬用品，「屬乎帳幕的」指橛子和繩子等。GT 丁良才並把立會幕之後的事排成一張十五件事的次序表，從正月初一立會幕一路排到二月二十日以色列人離開西乃；本章的數點民數排在第十一件（二月初一日），緊接在守逾越節之後、設立四營（民二）之前。STEP 原文資料顯示「帳幕」的原形是 מִשְׁכָּן（mish.kan，H4908），「法櫃」是 עֵדוּת（e.dut，H5715，詞典義 testimony）。KC 指出此處稱「法櫃的帳幕」側重外在見證的面向，教會也是真理的柱石和根基（提前3:15）。BH 視會幕為基督道成肉身「住在我們中間」的預表（約1:14）。
  relation: '[[利未支派]]、[[安營與纛]]、[[數點民數]]、[[約櫃]]'
- title: 西乃的曠野
  path: link_folder/地點/西乃的曠野.md
  summary: 民1:1 精確定位事件地點為「西乃的曠野」，民1:19 重申摩西「在西乃的曠野數點他們」。CT 指出西乃原文字義「多刺的」，曠野原文字義「荒野」。GT《舊約聖經背景註釋》說明「西乃的曠野」是指以色列安營之山四周的曠野地帶；同一份註釋另注「參較本節和出埃及記四十17，顯示聖幕已經立好一個月了，而百姓在西乃安營也已經差不多一年了」。GT《聖經精讀本》把時間再算細一點：這一天也是「以色列百姓整理陣營將要離開西乃曠野的前二十天」（民10:11）。STEP 原文資料顯示這個地名由兩個字組成，原形分別是 מִדְבָּר（mid.bar，H4057B，詞典義 wilderness）與 סִינַי（si.nay，H5514H）。BH 指出西乃曠野是以色列人領受律法之地，也是曠野旅程的起點。
  relation: '[[西乃山]]、[[會幕（帳幕整體）]]、[[出埃及第二年二月初一日]]'
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 民1:1 記載「耶和華…曉諭摩西說」——CT 指出「耶和華…曉諭摩西」這樣的模式「本書至少記載了八十次以上」，任何屬靈的領袖必須經常直接從神得著頭手的話語；GT《串珠聖經註釋》在思想問題裡把它換算成密度：這句話在民數記出現八十次，「平均每章二點二次」。摩西與亞倫一同執行數點（v3,17,44），當日招聚全會眾（v18），「耶和華怎樣吩咐摩西，他就怎樣在西乃的曠野數點他們」（v19）——CT 靈意註解視此為「必須完全順從神的命令」，文意註解則點出對照：「意指摩西並非擅自數點以色列人（參撒下二十四10）」，GT 丁良才說得更直接：「大衛擅自數點了民數，故此有罪。」GT 賈斯樂郝威《聖經難解經文詮釋手冊》命題1 用本節處理摩西著作權問題，指出這些書卷「都有明言記載是摩西所寫的（民一1，卅三2）」，新約也多次引用民數記並提到是摩西寫的（徒七13；林前十2-8；來三7-16）。KC 指出摩西與亞倫一同數點預表主耶穌——祂被稱為「我們所信認的使徒和大祭司」（來3:1），也是君王兼祭司（亞6:13）。
  relation: '[[亞倫]]、[[十二族長協助數點]]、[[數點民數]]、[[利未支派]]'
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 民1:3「你和亞倫要照他們的軍隊數點」；v17「摩西、亞倫帶著這些按名指定的人」；v44「是摩西、亞倫…所數點的」。CT 指出亞倫原文字義「帶來光的人」。GT 丁良才在 v7 補上一層親屬關係：猶大支派的首領「拿順是亞倫的妻兄（出六23），也是大衛的先祖」（得四）。KC 指出摩西與亞倫二人合在一起預表主耶穌被稱為「我們所信認的使徒和大祭司」（來3:1），也預表君王兼祭司（亞6:13）。BH 強調亞倫作為大祭司與摩西一同組織百姓，數點是神聖委派的任務，凸顯秩序與結構的重要性。
  relation: '[[摩西]]、[[十二族長協助數點]]、[[數點民數]]、[[拿順]]'
- title: 十二支派起源
  path: link_folder/神學/十二支派起源.md
  summary: 民1:20-43 按十二支派逐一數點，以法蓮與瑪拿西取代約瑟和利未成為兩個正式支派以補「十二」之數——雅各在埃及時曾將約瑟的兩個兒子立為自己的兒子（創48:5），利未支派已蒙揀選在會幕中侍奉不列在十二支派當中（GT 啟導本）。GT 精讀本指出數點人數使以色列從自然群體形成神權國家體制，所要進行的戰爭是以建立神國度為目的的聖戰，神是以色列的元帥。GT 背景註釋詳述四營安排：猶大為眾支派之首領導東營（聖幕入口朝東），長子流便領導南營，但支派為北營之首（因為但是妾生眾子最長的一個），拉結眾子的支派位於西面、居首的是被立為約瑟長子的以法蓮。
  relation: '[[流便]]、[[猶大支派]]、[[但支派]]、[[以法蓮]]、[[瑪拿西]]、[[利未支派]]、[[安營與纛]]'
- title: 以色列人的軍隊
  path: link_folder/神學/以色列人的軍隊.md
  summary: 民1:3 限定數點對象為「從二十歲以外，能出去打仗的」，全章每支派重複此條件。CT 的原文字義註明一件事：「打仗」與「軍隊」在本節是同一個原文字；STEP 原文資料印證了這一點——兩處同屬 Strong H6635，原形是 צָבָא（tsa.va，詞典義 army／war）。CT 文意註解說「男丁」按原文含有頭顱的意思，「意指能夠出去打仗、為國家拋頭顱灑熱血的男子」；靈意註解則說「從二十歲以外，能出去打仗的」表徵「生命必須成熟的信徒，才能有分於屬靈的戰爭」，並列出「能出去打仗」的三個條件：「首先是認清了爭戰的目的，其次是知道爭戰的法則，再次就是熟練爭戰的方法。」GT《聖經精讀本》指出以色列百姓所要進行的戰爭「是以建立神國度為目的的聖戰，而不是單單以掠奪和領土擴張為目的的戰爭」，並且「神是以色列的元帥」，預表新約教會以耶穌為元首與撒但爭戰（弗6:10-17）。KC 區分信徒的三重身分：祭司（在聖所讚美神）、利未人（服事教會）、精兵（真理受攻擊時起來站住），並強調入伍者要放下個人利益、聽從命令（路7:8）。
  relation: '[[二十歲以外能打仗的]]、[[數點民數]]、[[利未支派]]、[[安營與纛]]'
- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  summary: 民1:26-27 猶大支派 74,600 人，人數最多。CT 指出猶大支派相當特殊——大衛王和其後的猶大國諸王都出自該支派（太1:3,6），甚至主耶穌也是大衛的後裔（羅1:3）。GT 丁良才指出猶大支派人數最多（創49:8），後來成了為首的支派（民2:3, 7:12）。GT 精讀本指出猶大作為利亞的第四個兒子得到神屬靈的祝福，成了領導以色列的屬靈長子（創49:8-12），後來耶穌基督也誕生在猶大支派（太1:2；啟5:5）。GT 背景註釋指出猶大為眾支派之首，領導最重要的東營（聖幕入口朝東）。BH 指出猶大支派是「猶大支派的獅子」（啟5:5）耶穌基督的支派。
  relation: '[[十二支派起源]]、[[安營與纛]]、[[流便]]、[[但支派]]'
- title: 但支派
  path: link_folder/人物/但支派.md
  summary: 民1:38-39 但支派 62,700 人，人數僅次於猶大。GT 丁良才指出但子孫的後代加增甚多——但原來只有一個兒子名戶伸（創46:23；民26:42），若以色列人在埃及共住四百三十年就沒有什麼難處。GT 精讀本指出但支派後來從以色列支派中脫離出去，獨自流離、拜偶像、行惡（士18:1-31），最後從啟示錄的十二支派名單中消失（啟7:5,8），這成就了雅各對但的預言（創49:16-18）。GT 背景註釋指出但支派為北營之首，因為但是妾生眾子最長的一個。BH 指出參孫是但支派最著名的成員（士13-16）。
  relation: '[[十二支派起源]]、[[安營與纛]]、[[猶大支派]]、[[流便]]'
- title: 流便
  path: link_folder/人物/流便.md
  summary: 民1:20-21「以色列的長子，流便子孫的後代」46,500 人。CT 指出流便因犯淫亂而失去長子的名份，被猶大和約瑟兩人分得。GT 丁良才指出流便因犯罪失了尊榮（創49:3-4），當時流便支派的人數不多。GT 背景註釋指出長子流便領導南營。BH 指出流便是雅各與利亞的長子，因與辟拉的不當關係失去長子權（創35:22, 49:3-4），支派後來定居約旦河東的牧場（民32:1-5）。
