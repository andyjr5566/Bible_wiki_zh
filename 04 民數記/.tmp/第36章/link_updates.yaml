book: 民數記
chapter: 36
updates:
- title: 西羅非哈的女兒
  path: link_folder/人物/西羅非哈的女兒.md
  summary: 第6節神為她們定下但書「他們可以隨意嫁人，只是要嫁同宗支派的人」；第10-12節記下結果——她們照吩咐嫁了伯叔的兒子，嫁入瑪拿西子孫的族中，產業仍留在同宗支派中。STEP 原文資料顯示第11節名字依序是 mach.Lah（H4244G）、tir.Tzah（H8656G）、cha.ge.Lah（H2295）、mil.Kah（H4435H）、no.'Ah（H5270），「伯叔的兒子」是 li/v.Nei do.dei./Hen（H1121A 加 H1730I）。GT 丁良才註明這五個名字在聖經中共記在四處：民二十六33、民二十七1、民三十六11 與書十七3。
  relation: 民27 是她們爭取到的權利，民36 是隨那權利而來的義務。CT 說得很直接：「意指西羅非哈的女兒們為守住父親的產業，得到了一般女子所沒有的特權，也就必須履行與她們的目的相關的義務。」GT《聖經精讀本》說她們「放棄自己的感情,順服了神的旨意」；KingComments 則把這件事放在整卷書的收尾位置——她們順服耶和華所說的話，在本族之內嫁娶，這卷滿是百姓悖逆的書，結束時卻滿有盼望。
- title: 女兒承受產業的條例
  path: link_folder/主題/女兒承受產業的條例.md
  summary: 第2節族長們回顧民27 的判例，第8節則把個案推成通則：「凡在以色列支派中得了產業的女子必作同宗支派人的妻，好叫以色列人各自承受他祖宗的產業。」GT 丁良才：「神為西羅非哈的女兒所定的，成了以色列眾人應守的常典。」GT《民數記串珠聖經註釋》把兩次判決的原則並排：民27 是「父親的產業不應因無兒子而落入外人手上，應由女兒或近親承受」，民36 是「一個支派的產業不應因女子出嫁而歸入另一支派，各支派應保全祖傳的產業」。
  relation: 本章補上民27 沒有處理的後果。GT《民數記串珠聖經註釋》並指出兩者的輕重：「這問題比上一個更為重要，承業的女子應以此原則為大前提，選擇自己支派的人作婚姻物件。」GT《聖經精讀本》從律法發展的角度說明這不是前後矛盾：「律法和條例的完善具有漸進性和預表(來10:1),而不是說神的智慧有局限或律法本身有矛盾。」
- title: 產業（na.cha.lah）
  path: link_folder/原文/產業（na.cha.lah）.md
  summary: 本章十二次出現。STEP 原文資料顯示第2節是 be./na.cha.Lah（H5159）、第3-4節是 na.cha.la.Ta/n 與 mi./na.cha.Lat、第7節是 be./na.cha.Lat、第9節是 be./Na.cha.la.T/o、第12節是 na.cha.la.Ta/n。CT 原文字義給「產業，基業，地業」。
  relation: 本章讓這個字第一次跟婚姻綁在一起：產業不只會因無子而斷，也會因出嫁而移。GT《舊約聖經背景註釋》給出這種在意的理由：「土地是盟約的賜與，因此每個家庭所得的地業，就是這家庭在盟約之中的分」，並補上一句對照——「古代近東其他國家雖然也很重視土地的產權，土地有如此深刻之宗教意義的，卻一個也沒有。」
- title: 拈鬮分地（go.ral）
  path: link_folder/主題/拈鬮分地（go.ral）.md
  summary: 第2節「耶和華曾吩咐我主拈鬮分地給以色列人為業」；第3節「我們拈鬮所得的產業就要減少了」。STEP 原文資料顯示是 be./go.Ral 與 u./mi./go.Ral（H1486），簡要詞典義 allotted；CT 原文字義給「鬮，卵石」，並在第2節註明「拈鬮分地」指按照拈鬮決定地點，然後視人數多寡而調整大小（參二十六56）。
  relation: 拈鬮的結果在本章成了不可更動的理由。CT 在第9節〔話中之光〕說：各支派所得的產業不是他們自己選擇爭奪的結果，是拈鬮分得的，「這是說，是神所安排，所命定的」；因此「各守各的產業」不只是消弭紛爭的辦法，更是敬畏神、遵守神規定的表現。
- title: 禧年（第五十年）
  path: link_folder/原文/禧年（第五十年）.md
  summary: 第4節「到了以色列人的禧年，這女兒的產業就必加在他們丈夫支派的產業上」。STEP 原文資料顯示是 hai./yo.Vel（H3104），簡要詞典義 jubilee/horn；CT 原文字義給「第五十年，號角」，並註明以色列人產業的買賣到了禧年所有權仍須歸還原主（參利二十五10）。GT《啟導本聖經註釋》解釋禧年是每過七個安息年、也就是四十九年之後的第五十年。
  relation: 本章是禧年少見的一次反向作用：照常理禧年會把賣出的地還給原主，這裡卻反而把轉移固定下來。GT 丁良才點明「到禧年的時候，這地必不歸與我們的支派」，並指出即使瑪拿西人先把女兒的地買回來，到了禧年那地還要歸與丈夫的支派；GT《聖經精讀本》的說法一致——一旦到了禧年，地重新回到繼承產業的女子手中，「所以在禧年以後這個地將永遠屬於丈夫的支派」。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 第1節族長們來到摩西面前提問；第5節「摩西照耶和華的話吩咐以色列人說：約瑟支派的人說得有理」；第10、13節兩次記下耶和華藉摩西的吩咐。第2節族長們兩次稱他「我主」——GT 丁良才注意到這個用詞不常見：「按聖書上所記，唯獨亞倫和約書亞曾稱摩西為主。」
  relation: 本章是摩西在民數記裡最後一次擔任判例的中介。CT 註第5節：「顯然，摩西曾將此問題求問神，得到神的答覆（參二十七5~6）」；GT《聖經精讀本》也說這句話「暗示摩西並沒有按自己的主張發表意見,而是按神的啟示說話」。第13節收束全卷時說這些命令典章是「藉著摩西」頒下的——STEP 原文資料顯示原文是 be./yad- mo.Sheh（H3027J），字面「藉摩西的手」。
- title: 瑪吉
  path: link_folder/人物/瑪吉.md
  summary: 第1節「約瑟的後裔，瑪拿西的孫子，瑪吉的兒子基列，他子孫中的諸族長」。CT 在背景註解裡把這一族算了一遍：「瑪拿西僅有一個兒子瑪吉，瑪吉又僅有一個兒子基列，而基列有六個兒子(參二十六29~32)。這樣，瑪拿西支派中的八個家族，一個是兒子，一個是孫子，另外六個都是曾孫。」
  relation: 本章來提問的不是瑪吉族本身。CT 註：「瑪吉族和基列族的產業分配在約但河東，而此次的問題與這兩族無關，故可能他們的族長可能缺席」；GT 丁良才說法相同：「瑪姬人的族長不在其內⋯⋯因為他們在約旦河東已經得了基業」，來的是基列子孫六族的族長。
- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  summary: 第1節「瑪拿西的孫子」；第12節「他們嫁入約瑟兒子、瑪拿西子孫的族中；他們的產業仍留在同宗支派中」。STEP 原文資料顯示是 me.na.Sheh（H4519G）。
  relation: 本章的整個問題是瑪拿西支派提出來的，也在瑪拿西支派內部解決。CT 在第5節〔話中之光〕評價這個處理：「在神的眼裡，祖宗所遺留的產業是神聖不可侵犯的，所以他非常大度地採納瑪拿西人提出的意見，既可以滿足西羅非哈的女兒作為女性繼承人的訴求，也可以滿足瑪拿西首領土地不流向外支派的訴求。」
- title: 約瑟
  path: link_folder/人物/約瑟.md
  summary: 第1節「約瑟的後裔」；第5節「約瑟支派的人說得有理」；第12節「他們嫁入約瑟兒子、瑪拿西子孫的族中」。GT 丁良才註第5節：「約瑟支派，就是以法蓮、瑪拿西支派。但在此處摩西特指基列人。」BH 也指出約瑟藉以法蓮與瑪拿西兩個兒子得了雙份的產業。
  relation: 本章是民數記最後一次以「約瑟支派」為名的發言。神的判語「說得有理」正是給這一支的——與民27 神對西羅非哈女兒說的同一句話相同，兩次都是先肯定提問者，再把個案立成通則。
- title: 瑪拿西半支派為何留在河東
  path: link_folder/解經爭議/瑪拿西半支派為何留在河東.md
  summary: CT 註第1節：「瑪吉族和基列族的產業分配在約但河東，而此次的問題與這兩族無關，故可能他們的族長可能缺席。」GT 丁良才說法相同：「瑪姬人的族長不在其內⋯⋯因為他們在約旦河東已經得了基業」，並判斷來提問的「乃是基列子孫六族的族長（參書十七2）」。
  relation: 河東與河西的分野在本章變成了一份出席名單：地已經拿到手的那兩族沒有來，地還沒分到的六族才是提問的人。這也從側面說明本章的顧慮是針對將來過河之後的分地，不是針對已經定案的河東產業。
- title: 典章
  path: link_folder/神學/典章.md
  summary: '第13節「這是耶和華⋯⋯藉著摩西所吩咐以色列人的命令典章」。STEP 原文資料顯示是 ha./mitz.Vot（H4687，簡要詞典義 commandment）加 ve./ha./mish.pa.Tim（H4941G，簡要詞典義 justice: judgement）。CT 原文字義給「命令」作「命令，誡命」、「典章」作「審判，律例，公義」，並在文意註解分開解釋：「『命令』原文意思是誡命，即指所須遵守的律法；『典章』指審判，是神對人是否遵行律法的判定。」'
  relation: 本節是民數記全卷的結語，也是「典章」這個詞在本卷最後一次出現。GT 丁良才指出它蓋的範圍：「本節是民數記的總結；將神在摩押平原，和在西奈山所吩咐的命令典章，列為平等（參利二十六46，二十七34）」——摩押平原這一批律例的權威，不低於西乃山那一批。
- title: 摩押平原
  path: link_folder/地點/摩押平原.md
  summary: 第13節「這是耶和華在摩押平原─約但河邊、耶利哥對面─藉著摩西所吩咐以色列人的命令典章」。STEP 原文資料顯示是 be./'ar.Vot mo.'Av（H6160I 加 H4124I）。
  relation: 摩押平原在本節從駐地變成一個立法地標。GT 丁良才指出這一節把神在摩押平原與在西奈山所吩咐的命令典章列為平等；BH 也說摩押平原是以色列人進應許地之前的最後駐紮處，摩西在此發表了記在申命記裡的最後講論。
- title: 約但河
  path: link_folder/地點/約但河.md
  summary: 第13節「摩押平原─約但河邊」。GT《啟導本聖經註釋》：「本書以『約但河邊、耶利哥對面』作結，說明以色列人此際遠望隔岸美地，已為定居作好準備。他們將永居斯土，因為這是神賜給亞伯拉罕子孫為業之地。」
  relation: 民數記以這條河作結，而全書的問題也正卡在河的兩岸之間：瑪吉族與基列族已在河東得了基業，本章提問的六族要等過河之後才分地。BH 指出約但河在聖經敘事裡是曠野與應許地的分界，過河由約書亞帶領（書3-4）。
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: 第13節「耶利哥對面」。STEP 原文資料顯示是 ye.re.Cho（H3405G）。
  relation: 耶利哥是民數記最後一個地名。BH 指出它是應許地中第一座被攻取的城（書6），與摩押平原隔河相望的位置，正說明神應許的實現已經近在眼前。
- title: 家室與宗族
  path: link_folder/主題/家室與宗族.md
  summary: 第1節「基列⋯⋯他子孫中的諸族長」用 le./mish.Pa.chat 與 mi./mish.pe.Chot；第6節的判決是 le./mish.Pa.chat ma.Teh 'a.vi./Hem；第12節記結果又用 mi./mish.pe.Chot 與 ma.Teh mish.Pa.chat 'a.vi./Hen。STEP 原文資料顯示 mish.pa.chah 是 H4940（簡要詞典義 family），與 H4294H ma.Teh（tribe）在同一個片語裡並列。
  relation: 本章讓這兩層單位的界線變成一個實際的解經問題：「同宗支派」到底指整個支派，還是支派裡的那個宗族？CT 在第6節備註中並列兩解，GT 丁良才也列出兩個解法並偏向宗族說——「以色列人既然要按宗族分地⋯⋯第一個解法或近乎是」。本條目本來就記下各家對這兩層單位誰大誰小的說法不一，本章正是那個分歧的一個具體後果。
