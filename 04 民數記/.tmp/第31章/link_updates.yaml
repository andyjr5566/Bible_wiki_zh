book: 民數記
chapter: 31
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1-2 神吩咐摩西在米甸人身上報仇，報完仇就要歸到本民那裡；全章由他發怒、下令潔淨、主持分配、收取金子。
  relation: 這是摩西親自執行的最後一場戰役。KingComments 說神不容許祂的僕人離開世界，直到他看見那完全的報復：「我們在這裡也看見，僕人不會在任務完成之前被取去。」
- title: 米甸
  path: link_folder/人物/米甸.md
  summary: v1-12 以色列出兵擊殺米甸，殺盡男丁與五王、燒毀城邑營寨、擄走婦女孩子與牲畜財物。
  relation: GT《舊約聖經背景註釋》說米甸領土主要在阿拉伯半島西北部的亞喀巴灣東面，考古顯示晚銅器時代已有村莊、築牆之城與大規模灌溉系統，「但米甸人一名，至今仍未在古代文獻中提及」；本章打的只是與摩押聯手、在西宏境內的那一部分。
- title: 摩押人
  path: link_folder/人物/摩押人.md
  summary: 本章的報復對象只有米甸，經文完全沒有提到摩押人。
  relation: GT 丁良才在 v2 給的理由是：「神沒有提到摩押人，或者是因為引誘以色列人的事，是米甸人的罪（二十五17）。」
- title: 基土拉
  path: link_folder/人物/基土拉.md
  summary: KingComments 與 BibleHub 都在 v2 指出，米甸是亞伯拉罕從基土拉所生的後裔（創25:1-2）。
  relation: 本章因此是一場親族之間的戰爭：KingComments 說米甸是「弟兄之民」，卻與摩押聯手要毀滅以色列。
- title: 非尼哈
  path: link_folder/人物/非尼哈.md
  summary: v6 摩西打發祭司以利亞撒的兒子非尼哈同去，他手裡拿著聖所的器皿和吹大聲的號筒。
  relation: KingComments 說領軍的不是約書亞而是非尼哈，因為這一仗要潔淨以色列因與米甸連結而來的玷污，而他先前已經用刀對米甸執行過審判（民25:7-8），「他是知道神聖潔的人」。
- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  summary: v6、12-13、21、26、29、31、41、51、54 以利亞撒全程參與；v21-24 由他向兵丁宣告潔淨的條例，v29、41 由他收取歸耶和華的舉祭。
  relation: GT 串珠說大祭司不可接觸死屍，所以帶兵的是他的兒子非尼哈；GT 丁良才則指出 v21「這是大祭司．第一次給百姓解釋神借著摩西所傳的律例」。
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 本章的軍事行動由非尼哈隨行，約書亞沒有出現。
  relation: KingComments 特別點出這件事：「領袖不是約書亞，而是祭司非尼哈」，理由是百姓失敗的處境要求由祭司來帶領這場潔淨性的爭戰。
- title: 摩西立首領
  path: link_folder/事件/摩西立首領.md
  summary: v14 摩西向千夫長、百夫長發怒，v48-54 又是這批軍長主動來獻金。
  relation: BibleHub 回指出18:21-25 葉忒羅建議摩西按千、百、五十、十設立首領的分層編制，說本章的軍隊編制正建立在那套結構上，也使問責有明確對象。
- title: 巴蘭（比珥的兒子）
  path: link_folder/人物/巴蘭（比珥的兒子）.md
  summary: v8 巴蘭與米甸五王一同被刀殺；v16 摩西指出米甸婦女是「因巴蘭的計謀」叫以色列人在毘珥的事上得罪耶和華。
  relation: CT 說 v8 這一句「暗示巴蘭不是死在戰場上，乃是後來被殺的」；GT 串珠說他無功而退之後仍回到米甸人中，教他們用婦女引誘以色列人犯罪。KingComments 說他的名字與五王並列，看來是他們的謀士。
- title: 巴蘭的教訓（啟2：14）
  path: link_folder/互文/巴蘭的教訓（啟2：14）.md
  summary: v16 是舊約唯一明說巴蘭出計謀的經文；GT 丁良才在此直接把「巴蘭的計謀」連到啟二14。
  relation: BibleHub 也引啟2:14 說巴蘭的教訓是絆腳石，並說他雖然無法直接咒詛以色列，卻獻計使他們陷在罪裡。STEP 顯示 v16 的「計謀」原文是 bi/d.Var（H1697G），字面是藉巴蘭的話。
- title: 蘇珥（米甸首領）
  path: link_folder/人物/蘇珥（米甸首領）.md
  summary: v8 蘇珥是被殺的米甸五王之一；GT 丁良才與《聖經精讀本》都指出這些王其實是亞摩利王西宏轄下的首領（書13:21）。
  relation: CT 註明「『蘇珥』他的女兒哥斯比曾引誘以色列人心利犯姦淫，結果被非尼哈刺死(參二十五14~15)」——民25 刺死哥斯比的非尼哈，民31 帶領的軍隊殺了她的父親。
- title: 哥斯比（蘇珥的女兒）
  path: link_folder/人物/哥斯比（蘇珥的女兒）.md
  summary: 本章沒有直接提到哥斯比，但 v8 殺的蘇珥正是她的父親。
  relation: CT 與 GT 串珠都在 v8 補上這層關係；民25 的事件與民31 的戰役因此由同一個家族串起來。
- title: 巴力毘珥
  path: link_folder/背景/巴力毘珥.md
  summary: v16 摩西指出米甸婦女叫以色列人「在毘珥的事上得罪耶和華，以致耶和華的會眾遭遇瘟疫」。
  relation: STEP 顯示這裡是 'al- de.var- pe.'or，而同一節前面的「巴蘭的計謀」是 bi/d.Var——一節之內用了兩次同一個字 da.var。毘珥的事正是本章出兵的原因（民25:16-18）。
- title: 耶和華擊打百姓的瘟疫
  path: link_folder/事件/耶和華擊打百姓的瘟疫.md
  summary: v16 回溯毘珥事件的後果：「以致耶和華的會眾遭遇瘟疫」；STEP 標為 H4046 ha./ma.ge.Fah。
  relation: CT 說當時因瘟疫死的有二萬四千人（民25:9）；GT 收錄的兩篇難題文章都以這個死亡數字作為本章滅絕命令的前提。
- title: 非尼哈的行為是否可效法
  path: link_folder/解經爭議/非尼哈的行為是否可效法.md
  summary: v6 神藉摩西指派非尼哈隨軍，等於再一次認可他在民25 的行動。
  relation: KingComments 說他之所以領軍，正因為他已經用過一次刀來審判米甸，「他是知道神聖潔的人」；本章因此成為評估民25 那一刺的重要旁證。
- title: 米甸人為何被追討而摩押人沒有
  path: link_folder/解經爭議/米甸人為何被追討而摩押人沒有.md
  summary: 本章只出兵打米甸；GT 丁良才在 v2 指出神沒有提到摩押人。
  relation: 他給的理由是「引誘以色列人的事，是米甸人的罪（二十五17）」；GT《啟導本聖經註釋》也說本章報復的並非全部米甸人，只是與摩押人聯合的那一部分。
- title: 銀號
  path: link_folder/文化/銀號.md
  summary: v6 非尼哈手裡拿著「吹大聲的號筒」；STEP 標為 H2689 cha.tzo.tze.Rot，正是民10:2 的銀號。
  relation: GT《舊約聖經背景註釋》說「本節的希伯來文字眼卻是指金屬的號筒」，大概用青銅或銀製造，可以發出四至五個音調，在軍事與宗教上都有用處；KingComments 說非尼哈帶著號筒是為了叫耶和華聽見（民10:9）。
- title: 吹角的日子（te.ru.'Ah）
  path: link_folder/原文/吹角的日子（te.ru.'Ah）.md
  summary: v6「吹大聲的號筒」的「吹大聲」是 H8643 ha./te.ru.'Ah，STEP 本節譯義作 the alarm。
  relation: 同一個字在民10:5-6 是拔營的號令、民23:21 是巴蘭聽見的營中歡呼、民29:1 是吹角節的日子名；本章是它在民數記的第四種用法——出戰的號令。
- title: 摩押平原
  path: link_folder/地點/摩押平原.md
  summary: v12 打勝的隊伍把擄物帶到摩押平原，就是約但河邊與耶利哥相對的營盤。
  relation: BibleHub 說這是以色列進迦南前的最後一站，本章的戰役、潔淨與分配全都在這裡進行。
- title: 約但河
  path: link_folder/地點/約但河.md
  summary: v12 的營盤在約但河邊，與耶利哥相對。
  relation: BibleHub 說約但河是以色列從曠野漂流轉入應許之地的地理界線；本章是渡河之前最後一場由摩西執行的戰役。
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: v12 說營盤「在約但河邊與耶利哥相對」。
  relation: BibleHub 指出耶利哥正是渡河之後第一座被攻取的城（書6），本章的位置因此已經在望見迦南的距離之內。
- title: 不潔之人出到營外
  path: link_folder/主題/不潔之人出到營外.md
  summary: v13 摩西、以利亞撒與會眾一切的首領都出到營外迎接打仗回來的人。
  relation: CT 說這「一面表示隆重歡迎，另一面在營外處理不潔之物或將其聖別」；BibleHub 也說營被視為聖潔，凡不潔或可能致污的都要留在營外。
- title: 營外七天等候（潔淨禮）
  path: link_folder/主題/營外七天等候（潔淨禮）.md
  summary: v19 命令打仗回來的人在營外駐紮七日，凡殺了人的、摸了被殺的，連同擄來的人口都要潔淨。
  relation: GT《舊約聖經背景註釋》說這七日淨化儀式必須在營外進行，「免得玷污其餘的百姓」；GT 丁良才另從動機解釋：「這樣的規矩，是要叫以色列人不重看打仗的事（參代上二十八3）。」
- title: 第三日與第七日的除污穢禮儀
  path: link_folder/文化/第三日與第七日的除污穢禮儀.md
  summary: v19 明定「第三日，第七日，都要潔淨自己」，v24 再說第七日要洗衣服才可進營。
  relation: CT 說這就是民19:19 的灑水潔淨之禮；BibleHub 說第三日是初步潔淨、第七日是全程完成，兩次合起來才算徹底。
- title: 除污穢的水
  path: link_folder/神學/除污穢的水.md
  summary: v23 說能見火的經火之後「還要用除污穢的水潔淨他」；STEP 標為 be./Mei ni.Dah（H4325G 加 H5079，lexicon 作 impurity）。
  relation: 本章是這水用在戰利品上的一次實地應用；KingComments 說潔淨在以利亞撒的責任之下進行，他必須確保嚴格照民19 的規定辦。
- title: 無殘疾與未曾負軛的紅母牛
  path: link_folder/神學/無殘疾與未曾負軛的紅母牛.md
  summary: CT 在 v23 說「『除污穢的水』指用純紅母牛的灰所調製的水(參十九9)」；GT《聖經精讀本》也說是用紅母牛的灰作成的水（19:2-10）。
  relation: 民19 立的規矩在本章第一次用在整批戰利品與整支軍隊上，範圍從人擴及衣服、皮物、山羊毛織的物、木器與六種金屬。
- title: 舉祭
  path: link_folder/原文/舉祭.md
  summary: v29、41、52 三次把獻給耶和華的那一份稱為舉祭：出征者的貢物歸祭司，軍長的金子也作舉祭獻上。
  relation: CT 說舉祭「指為感謝而獻的平安祭，祭物拿在手裡呈垂直上下擺動，獻後歸給祭司享用(參五9)」；本章把它用在戰利品與戰後感恩兩處。
- title: 供物（qorban）
  path: link_folder/原文/供物（qorban）.md
  summary: v50 軍長把金器「都送來為耶和華的供物」；STEP 標為 H7133A ka.re.Ban。
  relation: 這個字在整卷民數記只出現兩次，另一次是民28:2 神說的「我的供物」；一次是神規定的節期義務祭，一次是人自願獻上的戰後感恩。
- title: 利未人的什一奉獻
  path: link_folder/神學/利未人的什一奉獻.md
  summary: v30、47 規定會眾那一半每五十取一交給看守耶和華帳幕的利未人。
  relation: GT 啟導本指出「祭司從作戰者所得分中取五百分之一，利未人從會眾所得分中取五十分之一。祭司所得為利未人的十分之一，符合《民數記》十八26的規定」；CT 算出利未人所得佔全部戰利品的百分之一。
- title: 舍客勒
  path: link_folder/原文/舍客勒.md
  summary: v52 千夫長、百夫長所獻給耶和華為舉祭的金子共有一萬六千七百五十舍客勒。
  relation: CT 說約折合192公斤，GT 啟導本說合190公斤，GT 串珠說一舍客勒約等於四克，GT《舊約聖經背景註釋》說所獻的金子重約六百磅——同一個數字四家給了四種換算。
- title: 半舍客勒（贖罪銀）
  path: link_folder/原文/半舍客勒（贖罪銀）.md
  summary: GT《舊約聖經背景註釋》在 v50 把軍長的金器連到出30 的人口統計贖價：「按照出埃及記三十12的律法，每次人口統計之後，都要為每個男丁收取贖命的價銀。」
  relation: KingComments 也把出30 用銀子贖罪列為以物質贖罪的少數例外之一；本章的金器是在數點軍隊、確認無一人陣亡之後才繳付的。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: v54 摩西與以利亞撒把金子帶進會幕，「在耶和華面前作為以色列人的紀念」；STEP 標為 'O.hel mo.'Ed 加 H2146 zi.ka.Ron。
  relation: GT《聖經精讀本》說這紀念物「指當作神對以色列的憐憫和保護的記號」；CT 說金子收藏在會幕裡，供紀念神的憐憫和保守。
- title: 贖命的價銀
  path: link_folder/原文/贖命的價銀.md
  summary: GT《舊約聖經背景註釋》在 v50 說「按照出埃及記三十12的律法，每次人口統計之後，都要為每個男丁收取贖命的價銀」，並指出繳付贖價的用意是避免瘟疫（民8:19）。
  relation: 本章的軍長正是在 v49 清點軍隊、確認無一人短少之後才獻上金器，因此《背景註釋》把這筆金子讀成人口統計的贖命價銀，而不是為某一項罪贖罪。
- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: v19-24 整段處理打仗帶來的禮儀不潔：接觸死屍的人、擄來的人口、衣服皮物木器與六種金屬都要潔淨。
  relation: GT《聖經精讀本》說「能與神交通的人之基本條件是『聖潔』」；本章顯示即使是奉神命令執行的行動，仍然會使人沾染禮儀上的不潔，需要按民19 的程序處理。
- title: 十二族長協助數點
  path: link_folder/事件/十二族長協助數點.md
  summary: v26 神吩咐摩西、以利亞撒與會眾的各族長一同計算所擄來的人口和牲畜總數。
  relation: BibleHub 說這是民政、祭司與支派三方領導的組合，確保分配的問責與透明；與民1 數點百姓時族長協助的作法是同一套機制。
- title: 計算總數（抬起頭）
  path: link_folder/原文/計算總數（抬起頭）.md
  summary: v26 與 v49 兩次出現「計算總數」，STEP 顯示原文都是 na.se.'U 加 rosh（H5375V＋H7218H，字面把頭抬起來）。
  relation: 同一個結構在民1:2 與民26:2 用來數點以色列全會眾；本章一次用在戰利品清點上，一次用在確認軍隊無一人短少上。
