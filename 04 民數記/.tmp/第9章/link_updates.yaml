book: 民數記
chapter: 9
updates:
- title: 逾越節
  path: link_folder/歷史/逾越節.md
  summary: 本章第1-5節記以色列人在西乃的曠野守出埃及以後的第一個逾越節，時間是第二年正月十四日黃昏。KC 提供一個少見的統計：全本聖經只有七次真正記下逾越節被守的紀錄——出12:11、民9:5、書5:10、代下30:15、代下35:1、拉6:19、路22:15，並說「這使人想起在基督教裡守主的記念之餐的次數是何等稀少」。GT《啟導本》指出逾越節在正月十四日舉行、相當於陽曆四月，緊接著是除酵節，一共慶祝八天。BH 說明尼散月是逾越節之月，紀念以色列的得救。
  relation: KC 另把逾越節在三卷書中的位置排成一條線：出埃及記的逾越節是唯一的一次，指人悔改、得贖、進入曠野；民數記的是旅途中的記念；約書亞記的則是提醒一切屬天福分都源於那羔羊。GT《民數記串珠聖經註釋》指出本章的位置也有講究：上一章利未人代替頭生子歸神，「以色列人在這時再守逾越節，可更深體會分別為聖事奉神的意義」。
- title: 西乃的曠野
  path: link_folder/地點/西乃的曠野.md
  summary: 本章第1、5節兩次點名地點：「耶和華在西乃的曠野吩咐摩西」「他們就在西乃的曠野……守逾越節」。CT 說明這是「西乃山腳下周邊的曠野地帶，尚未出發飄流在更廣闊的曠野之前所駐營的地方」。BH 指出以色列人在此紮營將近一年，領受律法、建造會幕，是以色列成為約民的關鍵場景。
  relation: 本章是以色列人離開西乃之前在此發生的最後幾件事之一；GT 丁良才指出這段記載放在第1章之前，是因為第二月的逾越節「正在以色列人離開西奈山以前」（民10:11）。
- title: 死屍不潔
  path: link_folder/神學/死屍不潔.md
  summary: 本章第6-7節記「有幾個人因死屍而不潔淨，不能在那日守逾越節」，他們到摩西、亞倫面前申訴。GT 丁良才推測這幾個人「大概是米沙利和以利撒反」，並還原了一條時間線：會幕正月初一立起、亞倫父子受分派七天、第八日拿答亞比戶被火焚燒、米沙利與以利撒反奉摩西的命把他們埋葬，約在正月初八，而摸死屍不潔七天（民19:11），正好卡在逾越節上。他為此下結論：「因此他們在兩難之間：1不敢不守逾越節……2又不敢貿然守節，因為他們是不潔的。」KC 特別指出這不是有意識的罪，「不是從他自己發出來的不潔」。
  relation: 民數記第19章給的是紅母牛除污穢水的完整條例，本章則是這條不潔規定第一次與節期正面相撞，並因此引出補行逾越節的特例。
- title: 補行逾越節
  path: link_folder/歷史/補行逾越節.md
  summary: 本章第10-12節設立二月十四日的補行逾越節，適用於因死屍不潔或在遠方行路的人。BH 指出這個安排在後世有專名——「a second Passover, known as Pesach Sheni」。CT 從中讀出三件事：律法的局限性、神不是單單講究形式的神、「比起對人的刑罰，神更願意與人和睦，願意饒恕人，是充滿慈愛的神」。GT 丁良才另澄清一個傳統：「猶太人有遺傳說，第二月的逾越節只有一天，不必除酵，但這是與聖書不合。」
  relation: KC 為這條特例劃了一道界線，與 CT 的慈悲讀法並置：「這條規定並不表示神降低或放寬祂的標準。祂從不這樣做……見證的軟弱絕不該改變標準。但神確實把處境考慮進去，我們也必須如此。」他並舉代下30 希西家的逾越節為實例——許多人未潔淨就吃了，希西家為他們禱告，耶和華就醫治百姓。
- title: 遠方行路
  path: link_folder/文化/遠方行路.md
  summary: 本章第10節把「在遠方行路」與「因死屍而不潔淨」並列為可以補行逾越節的兩種情形，第13節則反過來說明：潔淨而又不行路的人若推辭不守，就要被剪除。BH 指出這條寬容「反映律法對生活實況的理解與彈性」，使每個以色列人不論處境都有機會盡本分。KC 的讀法帶一層警覺：遠行的人「是自己把自己從耶和華所在的地方挪開了，那是他自己的選擇」。
  relation: 這兩種情形的性質其實不同——不潔是被動臨到的，遠行多半是自己安排的；而神把兩者一併納入特例，同時在第13節堵住了沒有理由的推辭。
- title: 無酵餅
  path: link_folder/原文/無酵餅.md
  summary: 本章第11節規定補行逾越節時「要用無酵餅與苦菜，和逾越節的羊羔同吃」。CT 說明無酵餅指未經發酵的麵包，「酵在聖經中意味著罪和不良的教訓」（林前5:8、太16:12）。GT《聖經精讀本》的說法一致：無酵餅「象徵著沒有罪的生活」（林前5:6）。BH 說明無酵餅（matzah）同時紀念以色列人出埃及的匆促——麵團來不及發起來。
  relation: 與出12 的原初條例相連；本章的意義在於二月的補行逾越節「必須有一定的禮儀，令人有同樣的肅敬小心」（GT 丁良才），並沒有因為改期而簡化。
- title: 苦菜
  path: link_folder/原文/苦菜.md
  summary: 本章第11節與無酵餅、羊羔並列。CT 說明苦菜「指有苦味的菜，暗示以色列人從前在法老的奴役之下過著痛苦的生活」；GT《聖經精讀本》的說法相同：「象徵著以色列百姓在埃及遭受的苦難。」BH 指出苦菜（maror）使人具體嚐到為奴的苦，並把這份苦連到基督為世人的罪所受的苦。
  relation: 承接出12 的逾越節餐制；本章把它一併搬到二月，作為改期不減料的具體證據。
- title: 逾越節羔羊
  path: link_folder/歷史/逾越節羔羊.md
  summary: 本章第12節重述兩條與羊羔有關的規定：「一點不可留到早晨；羊羔的骨頭一根也不可折斷。」CT 指出骨頭不可折斷「因為骨頭具有象徵性的意義」（詩34:20、約19:36）。GT《民數記串珠聖經註釋》說明為何要在此複述這兩點——它們「具有重要的預表意義：耶穌基督完全的代贖祭，要完整的獻上……並完全給被贖者享用」。GT《聖經精讀本》為「一點不可留到早晨」給了實務理由：應該在原地吃完，「因為不能因外人或野獸沾染汙穢」。BH 指出不留到早晨也呼應出埃及當夜的匆促與救贖的完整。
  relation: 與出12 的原初規定相連；約翰福音19:33、36 記主耶穌的腿沒有被打斷，四套來源都把那一節讀為本條例的應驗。
- title: 剪除
  path: link_folder/原文/剪除.md
  summary: '本章第13節：「那潔淨而不行路的人若推辭不守逾越節，那人要從民中剪除。」CT 解釋這是指「凡沒有正當的理由而不肯遵守逾越節的人，都要被治死」。GT《聖經精讀本》給的界定較窄：「指從百姓的營中被逐，不能享受神律法的恩惠（包括法律上，經濟上，社會上，儀式上）。」GT 丁良才把這條警誡讀成一個原則：「有人知道行善，卻不去行，這就是他的罪了」（雅4:17）。BH 指出被剪除意味著被逐出約民群體，其嚴厲反映了逾越節在立約關係中的分量。STEP 原文資料顯示本節該字是 ve./nikh.re.Tah（H3772I，詞典形 ka.rat，詞典義 to cut: eliminate），Niphal 被動形。'
  relation: 利未記多處的剪除多半針對故意的罪行；本章的特別之處是它針對「不作為」——沒有正當理由而推辭不守節。KC 由此讀出「那就是有意的」，而神已經在二月的特例裡先給了一次機會。
- title: 寄居的與本地人同歸一例
  path: link_folder/主題/寄居的與本地人同歸一例.md
  summary: 本章第14節：「若有外人寄居在你們中間，願意向耶和華守逾越節……不管是寄居的是本地人，同歸一例。」GT 丁良才、GT《民數記串珠聖經註釋》與 GT《聖經精讀本》都指出同一個前提：這是已經受過割禮、歸入以色列的外邦人（出12:48-49）。CT 從中讀出神的心意：「表徵神願意叫萬人（包括外邦人）都蒙恩得救」（提前2:4）。BH 把它連到新約：法律上的一視同仁預示了在基督裡「並不分猶太人、希臘人」（加3:28）。
  relation: 利未記24章的同歸一例講的是刑事判決上的平等，本章講的是節期參與上的平等；GT 丁良才並指出在舊約世代「敬畏神，聽從神的外邦人，也能蒙恩」（徒10:35）。
- title: 雲柱火柱
  path: link_folder/歷史/雲柱火柱.md
  summary: 本章第15-23節是全本聖經對雲柱最詳細的一段描述：「立起帳幕的那日，有雲彩遮蓋帳幕，就是法櫃的帳幕；從晚上到早晨，雲彩在其上，形狀如火」（v15），此後雲彩收上去就起行、停住就安營，無論是兩天、一月或一年。GT 丁良才指出雲柱預表聖靈與以色列人同在，「有三樣的幫助：1護庇他們，2光照他們，3引導他們」。GT《聖經精讀本》列出四點：是以色列的引導者、表示神與以色列同在、是神救贖行為的歷史見證、彰顯了神的愛。BH 稱這朵雲為 Shekinah glory，是神榮耀可見的顯現。
  relation: 出13:21-22 記雲柱第一次出現在出埃及的路上，出40:34-38 記它降在剛立起的會幕上，本章則把它變成一套可以遵行的行動規則。KC 注意到一個容易略過的細節：這裡的雲「其實是帳幕的遮蓋，而帳幕在這裡被稱為『法櫃的帳幕』」，所以雲所連於的是神所託付的見證；他並數過「遵耶和華的吩咐」在第18、20、23節共出現七次。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 本章第8節是摩西在本卷書裡很有代表性的一句回答：「你們暫且等候，我可以去聽耶和華指著你們是怎樣吩咐的。」CT 說他「不敢擅自作主，定意尋求神的旨意」；KC 講得更直接：「能說出自己不知道某件事、並且帶著祂必回答的信心把事情帶到神面前，這是真正的偉大。」GT《聖經精讀本》補一句：「摩西所求的是神的旨意，而不是人操之過急的結論。」本章末節並以「都是憑耶和華吩咐摩西的」作結（v23）。
  relation: 民數記多次出現百姓帶著難題來找摩西、摩西轉而求問神的模式；本章是這個模式最早也最乾淨的一次——問題出在條例沒有涵蓋的處境，而答覆為往後世世代代立了一條新規（v10「你們和你們後代中」）。GT 丁良才並列出同型的例子：摩西（民27:5）、尼希米（尼2:4）、約書亞（書9:6-15）。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 本章第6節記那幾個因死屍不潔的人「當日他們到摩西、亞倫面前」。BH 指出摩西與亞倫在此分別代表律法與祭司職分，百姓向他們陳情反映了在信仰事務上尋求中保與指引的必要。
  relation: 本章亞倫並未單獨發言，卻站在受理陳情的位置上；這與前一章他把利未人當作搖祭獻上、以及第6章他領受祝福職分，同屬祭司在群體中的中介角色。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 本章第15節給了帳幕一個少見的稱呼：「有雲彩遮蓋帳幕，就是法櫃的帳幕。」此後第17-22節反覆以雲彩在帳幕上的停留或收上，決定全營的安營與起行。CT 指出「就是法櫃的帳幕」是說會幕中最重要的物件就是約櫃。BH 說明「Tent of the Testimony」之名指向櫃中的約版。
  relation: 出埃及記講帳幕的建造，民數記1-4章講環繞它安營與搬運它的分工，本章則讓它成為全營行止的唯一指標——帳幕在哪裡停，百姓就在哪裡停。STEP 原文資料顯示第22節有一個中譯看不見的呼應：「雲彩……停留」的第二個字是 sha.khan（H7931，to dwell），正是「帳幕」mish.kan（H4908）的同源字。
- title: 希西家守二月逾越節（代下三十）
  path: link_folder/互文/希西家守二月逾越節（代下三十）.md
  summary: 本章第11節所立的二月十四日補行逾越節，正是希西家後來援引的規矩。GT 丁良才在該節直接點名：「後來希西家照本節的規矩，就將大逾越節改了挪到第二月（代下30:1-15）。」KC 進一步引代下30:18-20：許多人未潔淨卻吃了逾越節，希西家為他們禱告求「善良的耶和華」赦免那些立定心意尋求神的人，「於是耶和華垂聽希西家的禱告，就醫治百姓」。
  relation: 代下30 是本章條例在歷史中被實際引用的一次；而希西家所處理的情況比本章更寬——那裡的人並非因死屍不潔或遠行，而是根本沒有按聖所的潔淨規矩自潔。KC 用這個例子說明神「把處境考慮進去」，同時強調「這並不表示神降低或放寬祂的標準」。
- title: 三位祭司能否宰殺所有逾越節羊羔
  path: link_folder/解經爭議/三位祭司能否宰殺所有逾越節羊羔.md
  summary: GT 丁良才在本章第3節提出這個算術上的難題：「有人看三位祭司不能宰殺逾越節那麼多的羊羔，把血都灑在壇上。」他給了兩個解法：「（一）本逾越節的禮節和後來之逾越節的規則有些不同，申十六25節或暗示以色列人的家長早已在別處宰了逾越節的羊羔；（二）或者另有利未人與祭司幫忙（參出二十四5，代下三十16，三十五11）。」他在第5節另處理了一個相關的供給問題——曠野哪來這麼多羊羔，並給了三層解法。
  relation: 這個問題在代下30 的大逾越節上有實際的答案（利未人代宰），而本章是它第一次成為問題的場合：以色列人剛出埃及一年，全營六十萬男丁在曠野守節。
