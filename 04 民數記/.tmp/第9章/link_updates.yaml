- "title": "雲彩引導行程"
  "path": "link_folder/神學/雲彩引導行程.md"
  "summary": "民數記第九章反覆強調，以色列人完全根據雲彩的動向（收上或停留）來決定起行或安營，無論時間長短皆全然順服神的引導。"
  "relation": "民數記第九章提供了最詳盡的雲彩引導紀錄，展現以色列人對神主權的順服，預表信徒順從聖靈的引導。"
