book: "民數記"
chapter: 9
updates:
- title: "逾越節"
  path: "link_folder/歷史/逾越節.md"
  summary: "以色列人在出埃及後的第二年正月十四日黃昏，於西乃的曠野遵守逾越節；凡耶和華所吩咐摩西的，百姓皆照樣遵行（第1-5節）。"
  relation: "這是以色列人離開埃及後在曠野首次遵守逾越節（即聖經記載的第二次逾越節），表明神民在啟程前往迦南之前，必須依循救贖定例堅固自己的信仰立場。"
- title: "西乃的曠野"
  path: "link_folder/地點/西乃的曠野.md"
  summary: "以色列人於第二年正月在此地守逾越節；隨著會幕立起，日夜皆有雲彩和火的異象遮蓋會幕，作為全體以色列民起行與安營的引導空間（第1-5、15-23節）。"
  relation: "西乃的曠野是以色列民在曠野成軍與啟程的重要停留與操練處；神民在此處既學習持守守節定例，也學習對神同在（雲彩的升降與停留）的順服與等候。"
- title: "死屍不潔"
  path: "link_folder/神學/死屍不潔.md"
  summary: "逾越節當天，有幾個人因接觸人的死屍而受了禮儀上的不潔淨，依常例不能在正日的黃昏獻耶和華的供物（第6節；註釋家推測他們可能是剛為拿答與亞比戶處理後事的米沙利與以利撒反，參利十1-5）。"
  relation: "禮儀上的死屍不潔妨礙了信民與神相交，但也因受阻人渴慕追求敬拜與呈訴，激發出神對受困者憐憫包容的補行定例，彰顯出嚴格律法要求與體恤憐憫的兼顧與平衡。"
- title: "補行逾越節"
  path: "link_folder/歷史/補行逾越節.md"
  summary: "耶和華聽從摩西的請求並明確指示：凡在以色列民或其後代中間，因死屍而不潔淨、或是因在遠方行路而趕不及出席者，皆可獲許在延後一個月後的「二月十四日黃昏」補行守節（第10-11節）。"
  relation: "此項補行逾越節的特例展現了律法執行上的彈性與神對向慕自己者的顧恤；然而補行者依然須緊守吃苦菜無酵餅及不留剩骨不折等逾越節核心常規，表明憐憫絕不降低祭事本身的嚴格聖潔水準。"
- title: "遠方行路"
  path: "link_folder/文化/遠方行路.md"
  summary: "本章規定，除了遭受死屍不潔攔阻者之外，身在遠路或外地無法於正月十四日如期到達會場守逾越節的以色列民及其後裔，同樣享有在隔月（二月十四日）辦理補守逾越節的資格（第10節）。"
  relation: "將「遠方行路」的空間地理阻隔納入例外彈性之列，說明逾越節不僅是形式與特定日期上的固守，更是重視子民信仰心態的連結與全家參與的精神。"
- title: "無酵餅"
  path: "link_folder/原文/無酵餅.md"
  summary: "本章重申，不論是正月按期舉行的常規逾越節，或是二月召開的補行逾越節，眾人吃逾越節羊羔時必同時佐以除去酵粉的「無酵餅」與苦菜一同品用（第11節）。"
  relation: "聖經中以酵指稱世間的罪與邪惡腐敗的影響；於食用代贖主恩的筵席上必定搭配無酵餅，指明經歷拯救恩惠者自身必以與罪隔離、並充滿誠實無偽自處的生活相呼應（參林前五8）。"
- title: "苦菜"
  path: "link_folder/原文/苦菜.md"
  summary: "本章明文要求二月補行逾越節之際，吃用的席上應當持續包含帶有苦味的苦菜（第11節）。"
  relation: "苦菜的苦澀口感扮演了強烈的感官紀念角色；它提醒得蒙拯救的人不可遺忘先人一往在埃及忍受苦役壓迫的日子，並教導後世帶著謙虛不忘初情與痛惡前患的追索態度俯領神恩。"
- title: "逾越節羔羊"
  path: "link_folder/歷史/逾越節羔羊.md"
  summary: "神宣明無論是正點祭或二月延申大慶進食逾越節的羊羔時均不可稍失分毫規則：祭享至旦不存片肉，並「骨頭一根也不可折斷」（第12節）。"
  relation: "「骨頭一根也不可折斷」的預定準繩，為經卷對新約救贖羔羊在十架殉行時不受外損斷折最豐美的實體導預（約十九36），盡顯無罪主耶穌那保證超嚴又堪載萬古永贖大成之力道與純一功效。"
- title: "剪除（kareth）"
  path: "link_folder/原文/剪除（kareth）.md"
  summary: "經文針對存心怠慢拒順者給與懲治警示：假若百姓身心潔而順、復無路途相隔，卻恣意推辭抗阻當往慶宴與向主酬心，便必定迫遭「從民中剪除」之罪報（第13節）。"
  relation: "和受無可推免意外攔阻者的通融形成反例，嚴懲「從民中剪除」說明神對輕看得救定例無端玩忽與任情怠懶的心性保持零容忍；漠視盟禮恩義的自負意向將自取隔於約外而擔自造大過。"
- title: "寄居的與本地人同歸一例"
  path: "link_folder/主題/寄居的與本地人同歸一例.md"
  summary: "神明令布宣：留宿在百姓營中的異族人及長投靠客若誠懷歸真志意行奉逾越常禮，即須循和以色列本地常規行禮，兩下絕無差異或有增補二途——一例必同歸依（第14節）。"
  relation: "「同歸一例」展現律法大典容博天地並以平等互信接待天下異地向信民的心：存忠信仰順入天家客旅絕無被阻拒降抑，一併共享均一神眷榮寵與無二重令典章，蔚成未來大化恩庇之開篇。"
