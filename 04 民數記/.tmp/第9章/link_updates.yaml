book: "04 民數記"
chapter: 9
updates:
- title: "逾越節"
  path: "link_folder/歷史/逾越節.md"
  summary: "以色列人在出埃及後的第二年正月十四日黃昏，於西乃的曠野遵守逾越節，凡耶和華所吩咐摩西的，百姓皆完全照樣遵行。"
  relation: "這是以色列人出埃及後第一次重拾紀念神拯救的聖節，象徵天路子民奔馳於曠野前必須在基督代贖的血約中站穩救恩立場。"
- title: "西乃的曠野"
  path: "link_folder/地點/西乃的曠野.md"
  summary: "以色列人於第二年正月在此駐守逾越節，體驗隨後起立之法櫃帳幕受到日夜雲霓引領成行成紮的蒙神庇托之處。"
  relation: "西乃的曠野作為選民整頓武備的搖籃，在此操練「全守定例」與「徹底仰隨神雲起安」，使神國度向度在此實作具現。"
- title: "死屍不潔"
  path: "link_folder/神學/死屍不潔.md"
  summary: "逾越節當天，若干平民因身染死屍而不潔（據論可能是處理拿答和亞比戶後事之以利撒反等人），按既有定規禁止參入該日的耶和華聖典獻祭。"
  relation: "此無奈阻難彰顯出聖善神面前絕不用染瑕獻享；即便並非存心干犯，潔禮依然無法苟安，這才開啟恩膏兼蓄的補償節典探詢，見證了神浩哉嚴厲背後的體貼救恩。"
- title: "補行逾越節"
  path: "link_folder/歷史/補行逾越節.md"
  summary: "耶和華聽取摩西呈案後特創嶄新定律，允命凡因死屍污陋或涉行遠疆不及趕赴之子民，得以於延後一個月後的『二月十四日黃昏』依例如儀補行逾越節。"
  relation: "這條延遲一個月補辦的特殊法度打破律條刻板呆陋之心，展現上帝顧憐子民內蘊之殷切神恩，但也藉必依足規條（用苦菜無酵餅與全體保存羊羔）誓彰救世基督絕不因時衰貶其榮。"
- title: "遠方行路"
  path: "link_folder/文化/遠方行路.md"
  summary: "除因喪屍不潔之外，身居外鄉或正遭旅途耽溺、無法於正殿正月十四趕赴會場守衛逾越祭的以色列民或其後世裔祖，同樣獲得展期至翌月如法補辦之欽定禮待。"
  relation: "這個律法寬限把屬靈門路展開到客邦羈旅客中，顯示聖潔守節不是地域鎖隔的苛捐牢羈，更說明基督大恩也眷顧遠走流離之靈的真愛懷抱。"
- title: "無酵餅"
  path: "link_folder/原文/無酵餅.md"
  summary: "於正月逾越節及二月延慶的補行大聚之中，信友均須偕取除去麵酵的純靜聖糧──無酵餅，連同苦菜與主羔一併吃納。"
  relation: "無酵意味著將生活裡的腐淫與罪行悉除（參林前五8），信徒享納拯救之餘必以真實與聖德相和，切實活出不受暗罪發酵滲漬的生活。"
- title: "苦菜"
  path: "link_folder/原文/苦菜.md"
  summary: "神在示達逾越重修細節時宣訂，無酵餅背後不可缺落具陳辛澀與深幽酸楚風味的綠梗──苦菜。"
  relation: "苦菜無言卻無比強硬地呼召民眾追懷遭役法老魔掌的悲淒和哀歎；於今生奔勝中常懷悔贖之心與前境苦禍的警悟，正是敬拜神羔的靈糧絕伴。"
- title: "逾越節羔羊"
  path: "link_folder/歷史/逾越節羔羊.md"
  summary: "不論正規首慶或二月補度，皆應持宰至嚴如例之祭供羊羔。聖法戒告吃用其身者：至曉不可滯留一點肉段，一根筋骨皆不得砸爛毀傷。"
  relation: "這個嚴正規約是整卷舊約最強大的基督神聖預見之一；日後在各耳他上耶穌雖身披千萬打撻殉死，雙腿骨節卻毫末未折（約十九36），象徵祂無比豐美全成又足以撐住天地人寰的完整贖身力挽。"
- title: "剪除（kareth）"
  path: "link_folder/原文/剪除（kareth）.md"
  summary: "假使任何身體素常清爽（無沾死喪之弊）、步履恬靜未出門行路的「潔淨而不行路者」若放肆推諉怠慢、悍拒赴辦筵節，上帝下命把此人從民眾根脈裡慘厲『剪除』。"
  relation: "這個駭人極刑的嚴苛揭曉了恩約的神髓絕對零容忍「玩忽輕易與冷血棄約」。正如蓄意藐踏血仇再無第二次懊罪進路，蒙救選眾如果公然甩背上帝祭筵，唯有擔下千載萬世的永遠沉迷與剝奪。"
- title: "寄居的與本地人同歸一例"
  path: "link_folder/主題/寄居的與本地人同歸一例.md"
  summary: "上帝宣告若是身處大會營內的異鄉投靠客（且曾經割禮順服神訓者）心生盼慕祈欲行守逾越主禮，其必須踐履行事莫不與在地生民『同歸一例』，兩路並行弗乖違。"
  relation: "這是宣告天約恩慈無邊容懷全地人土的大業基底；基督十字偉訓不限拘身於宗門地狹或族群疆界，不分本客，向其奉敬以誠信之民即得以共享同樣甘甜至美恩典以及聖嚴真理的同一覆護。"
