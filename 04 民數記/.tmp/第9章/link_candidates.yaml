book: "民數記"
chapter: 9
candidates:
  - name: "逾越節"
    type: "歷史"
    evidence: "正月十四日黃昏的時候，以色列人在西乃的曠野守逾越節，記念神的拯救。"
  - name: "西乃的曠野"
    type: "地點"
    evidence: "以色列人出埃及地以後，第二年正月，神在此吩咐摩西守逾越節。"
  - name: "死屍不潔"
    type: "神學"
    evidence: "有人因接觸死屍而不潔淨，按禮儀規定不能在正月守逾越節。"
  - name: "補行逾越節"
    type: "歷史"
    evidence: "神特別恩准因死屍不潔或在遠方行路的人，可以在二月十四日補守逾越節。"
  - name: "遠方行路"
    type: "文化"
    evidence: "身在遠方而無法趕回參與正月逾越節的以色列人，被允許在二月補行。"
  - name: "無酵餅"
    type: "原文"
    evidence: "守逾越節時必須與羊羔同吃的食品，不可有酵。"
  - name: "苦菜"
    type: "原文"
    evidence: "守逾越節時必須與羊羔同吃，記念在埃及受奴役的痛苦。"
  - name: "逾越節羔羊"
    type: "歷史"
    surfaces: ["羊羔"]
    evidence: "逾越節獻的羊羔，一點不可留到早晨，且骨頭一根也不可折斷。"
  - name: "剪除(kareth)"
    type: "原文"
    evidence: "若有人潔淨且未行路，卻推辭不守逾越節，那人必須從民中剪除，擔當自己的罪。"
  - name: "寄居的與本地人同歸一例"
    type: "主題"
    surfaces: ["寄居的", "外人", "寄居"]
    evidence: "外人若願意向耶和華守逾越節，其律例典章與本地人同歸一例。"
  - name: "日間雲彩、夜間雲中有火"
    type: "神學"
    surfaces: ["雲彩", "火"]
    evidence: "從晚上到早晨，雲彩在帳幕上形狀如火，象徵神的同在與引導。"
  - name: "雲彩引導行程"
    type: "神學"
    surfaces: ["起行", "安營", "住營"]
    evidence: "以色列人完全根據雲彩的收上與停住來決定起行或安營，全然順服神的指示。"
