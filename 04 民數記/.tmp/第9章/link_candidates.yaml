candidates:
  - name: "補行逾越節"
    type: "歷史"
    description: "民數記9章規定，若有人因死屍而不潔淨或在遠方行路，無法在正月十四日守逾越節，可以在二月十四日補行，展現了神律法的恩典與彈性。"
  - name: "死屍不潔"
    type: "神學"
    description: "接觸死屍在儀禮上算為不潔淨，無法參與逾越節等聖會。這象徵罪與死亡的玷汙，必須經過潔淨程序才能恢復與神的交通。"
  - name: "日間雲彩、夜間雲中有火"
    type: "神學"
    description: "會幕立起後，日間有雲彩、夜間有火柱遮蓋，象徵神的同在、保護與引導。"
  - name: "雲彩引導行程"
    type: "神學"
    description: "以色列人完全根據耶和華藉雲彩的指示來決定起行或安營，無論停留一天、一月或一年，皆全然順服，象徵信徒對神主權與聖靈引導的絕對順服。"
  - name: "遠方行路"
    type: "文化"
    description: "若有以色列人因在遠方行路無法守正月的逾越節，神恩准其於二月十四日補行，這反映神體恤人的真實困境，但也嚴格要求不可無故推辭。"
