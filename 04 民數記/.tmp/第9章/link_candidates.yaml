book: 民數記
chapter: 9
candidates:
- name: 逾越節
  type: 歷史
  evidence: 正月十四日黃昏的時候，以色列人在西乃的曠野守逾越節，記念神的拯救。
- name: 西乃的曠野
  type: 地點
  evidence: 以色列人出埃及地以後，第二年正月，神在此吩咐摩西守逾越節。
- name: 死屍不潔
  type: 神學
  evidence: 有人因接觸死屍而不潔淨，按禮儀規定不能在正月守逾越節。
- name: 補行逾越節
  type: 歷史
  evidence: 神特別恩准因死屍不潔或在遠方行路的人，可以在二月十四日補守逾越節。
- name: 遠方行路
  type: 文化
  evidence: 身在遠方而無法趕回參與正月逾越節的以色列人，被允許在二月補行。
- name: 無酵餅
  type: 原文
  evidence: 守逾越節時必須與羊羔同吃的食品，不可有酵。
- name: 苦菜
  type: 原文
  evidence: 守逾越節時必須與羊羔同吃，記念在埃及受奴役的痛苦。
- name: 逾越節羔羊
  type: 歷史
  surfaces:
  - 羊羔
  evidence: 逾越節獻的羊羔，一點不可留到早晨，且骨頭一根也不可折斷。
- name: 剪除
  type: 原文
  evidence: 若有人潔淨且未行路，卻推辭不守逾越節，那人必須從民中剪除，擔當自己的罪。
- name: 寄居的與本地人同歸一例
  type: 主題
  surfaces:
  - 寄居的
  - 外人
  - 寄居
  evidence: 外人若願意向耶和華守逾越節，其律例典章與本地人同歸一例。
- name: 雲柱火柱
  type: 歷史
  surfaces:
  - 雲彩
  - 火
  - 起行
  - 安營
  - 住營
  evidence: 從晚上到早晨，雲彩在帳幕上形狀如火，象徵神的同在與引導；以色列人完全根據雲彩的收上與停住來決定起行或安營，全然順服神的指示。
- name: 摩西
  type: 人物
  evidence: v1、4、5、6、8、9、23 貫穿全章：神在西乃曠野吩咐摩西守逾越節，不潔的人到摩西面前申訴，摩西說「你們暫且等候，我可以去聽耶和華指著你們是怎樣吩咐的」，末節「都是憑耶和華吩咐摩西的」。
- name: 亞倫
  type: 人物
  evidence: v6「當日他們到摩西、亞倫面前」；BH 指出摩西與亞倫代表律法與祭司職分，是中保角色。
- name: 會幕（帳幕整體）
  type: 主題
  evidence: v15「立起帳幕的那日，有雲彩遮蓋帳幕，就是法櫃的帳幕」；v17-22 雲彩在帳幕上停住或收上去，決定安營與起行。
- name: 法櫃的帳幕
  type: 地點
  evidence: v15「就是法櫃的帳幕」；CT 原文字義註「法櫃」見證，並指出會幕中最重要的物件就是約櫃。
- name: 希西家守二月逾越節（代下三十）
  type: 互文
  evidence: GT 丁良才在 v11 指出：「後來希西家照本節的規矩，就將大逾越節改了挪到第二月（代下三十1-15）。」KC 也引代下30:18-20 希西家為未潔淨卻吃逾越節的人禱告、耶和華醫治百姓，作為本章條例的實例。
- name: 三位祭司能否宰殺所有逾越節羊羔
  type: 解經爭議
  evidence: GT 丁良才在 v3 提出：「有人看三位祭司不能宰殺逾越節那麼多的羊羔，把血都灑在壇上。」他給了兩個解法：本次逾越節的禮節與後來不同（申16:5 或暗示家長早已在別處宰羊羔），或另有利未人與祭司幫忙（出24:5、代下30:16、35:11）。
