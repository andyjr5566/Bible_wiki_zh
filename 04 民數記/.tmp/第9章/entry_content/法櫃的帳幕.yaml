name: "法櫃的帳幕"
type: "地點"
secondary_types: ["物品"]
aliases: ["法櫃的帳棚"]
status: "formal"
definition: "以色列人在曠野中敬拜神的中心樞紐，內藏放置律法版（法櫃）的至聖所。會幕的核心意義在於它是神與人相會、神啟示自己旨意並彰顯同在的神聖所在。"
accumulations:
  - book: "民數記"
    chapter: 9
    summary: "本章記載，自立起帳幕那日起，日間有雲彩遮蓋這法櫃的帳幕，夜間雲彩在其上形狀如火，象徵神的同在與引導。"
    relation: "「法櫃的帳幕」突顯了會幕的核心是法櫃（見證），代表神公義的律法。雲彩遮蓋其上，表明神的榮耀與同在是奠基於祂信實的聖約與律法之上，並以此成為以色列人起行與安營的絕對指引。"
related_entries:
  - "日間雲彩、夜間雲中有火"
  - "雲彩引導行程"
sources:
