organization: "民數記第九章記載了以色列人在西乃曠野守第二次逾越節的經歷，並設立了補行逾越節的恩典條例。隨後，經文詳細描述了神如何藉著會幕上的雲彩與火柱，具體而微地引導以色列全會眾的起行與安營，展現出神在曠野中對百姓的同在與帶領。\n\
  \n### 第二年正月的逾越節（v1-5）\n\n以色列人出埃及地以後的第二年正月，耶黃華在西乃的曠野吩咐摩西，要以色列人按著所定的日期（正月十四日黃昏）守逾越節。這是以色列人在曠野中守的第一次逾越節，也是出埃及後的第二次。\n\
  \n這標誌著神救贖歷史中的重要時刻。逾越節不僅是記念神在埃及擊殺長子、拯救以色列人的歷史事件，更是讓屬神的百姓確認自己蒙拯救的地位與生存目的。根據《CT》的觀點，逾越節的實際是「接受蒙拯救的地位」，不守這節期就是在神的應許上無分無關了。以色列人全然遵照耶和華的吩咐行了，表明了他們對神話語的順服。\n\
  \n### 補行逾越節的條例（v6-14）\n\n在守節的日子，有幾個人因為接觸死屍而帶來了儀式上的不潔淨，無法參與這場聖會。在舊約神學中，[[死屍不潔]]象徵著罪與死亡的玷汙，因此他們被暫時隔絕於神的供物之外。這幾個人（《CT》推測可能是為拿答、亞比戶辦理後事的米沙利和以利撒反）帶著對無法守節的遺憾，來到摩西和亞倫面前詢問。\n\
  \n面對這個律法未曾涵蓋的特例，摩西沒有憑自己的聰明定奪，而是要他們暫且等候，自己去尋求神的指示。神隨後頒布了特別的恩典條例：\n\n> [!important]\
  \ 神的彈性與恩典\n> 神恩准凡因死屍不潔，或在遠方行路的人，可以在二月十四日黃昏[[補行逾越節]]。這展現了神體恤人的真實困境，祂「不是單單講究形式的神，而是能深深理解人的內心，並根據他們所處的環境施慈悲的神」（《GT》精讀本）。\n\
  \n然而，這份恩典並不意味著律法標準的降低。補行者仍必須完全遵照逾越節的一切律例典章，包括吃無酵餅與苦菜、羊羔一點不可留到早晨，且骨頭一根也不可折斷。同時，神嚴厲警告，若有人本身潔淨且沒有遠行，卻「推辭不守逾越節」，這人必從民中剪除。這表示神絕不容忍對救恩的輕忽與故意離棄。此外，寄居的外邦人若願意守節，也同歸一例，顯示神願意萬人蒙恩得救的心意。\n\
  \n### 雲彩與火柱的引導（v15-23）\n\n自從會幕立起的那日，神便以具體的形態顯現祂的同在：日間有雲彩遮蓋帳幕，夜間雲彩形狀如火（[[雲柱火柱]]）。這不僅是神保護與光照的記號，更是以色列人曠野旅程的絕對指標。\n\
  \n以色列人的行程完全取決於雲彩的動向（[[雲柱火柱]]）：\n- **起行**：雲彩幾時從帳幕收上去，以色列人就幾時起行。\n- **安營**：雲彩在哪裡停住，以色列人就在那裡安營。\n\
  \n經文用極其細膩且重複的語句，描述了雲彩停留時間的種種可能：或一天、或幾天、或一月、或一年。這種不可預測性，徹底考驗並訓練了以色列百姓的順服。\n\n```mermaid\n\
  flowchart TD\n    A[\"觀看會幕上的雲彩\"] --> B{\"雲彩的動向\"}\n    B -- 停留（無論長短） --> C[\"住營不起行\"\
  ]\n    B -- 收上去（無論晝夜） --> D[\"即刻起行\"]\n    C -. 等候神的時間 .-> A\n    D -. 跟隨神的引導 .->\
  \ A\n```\n\n正如《KC》所指出的，雲彩的引導預表了聖靈在信徒生活中的引導。信徒在曠野般的世界中，不應憑自己的經驗或理性來規劃道路，而必須完全仰望聖靈，將主權交託給神。以色列人「遵耶和華的吩咐起行，也遵耶和華的吩咐安營」，這份全然的順服，是他們在充滿死亡與危機的曠野中，唯一能平安到達應許之地的保障。"
