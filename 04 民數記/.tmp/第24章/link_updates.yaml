book: 民數記
chapter: 24
updates:
- title: 巴蘭（比珥的兒子）
  path: link_folder/人物/巴蘭（比珥的兒子）.md
  summary: 民數記24 全章：v1 他不再去求法術，v2 神的靈臨到他身上，v3-9 與 v15-24 說出第三、第四篇詩歌，v25 起來回本地去。
  relation: 本章是巴蘭這個人身上證據最矛盾的一章。一方面 v2 說「神的靈就臨到他身上」，v13 他自己說「耶和華說什麼，我就要說什麼」；另一方面 CT 直言他「說這話顯得很清高，其實他言不由衷。照他的本心是貪不義之財的（參彼後二15）」。KC 的判語落在良心：他所知道關於神的一切，從來沒有觸及他的良心。v25 他回本地去，GT 丁良才指出這不是結束——他仍住在米甸人中，用別的方法謀害以色列人。
- title: 巴勒
  path: link_folder/人物/巴勒.md
  summary: 民數記24:10-14、25：v10 他向巴蘭生氣拍手，v11 收回原本承諾的尊榮，v25 也各自回去。
  relation: 本章是巴勒退場的一章。CT 把這段關係的性質說白了：「巴蘭和巴勒走在一起，一開始就是一種赤裸裸的金錢交易」，而巴蘭沒有履約，巴勒自然不付薪酬。他自己說出原因：「我想使你得大尊榮，耶和華卻阻止你不得尊榮。」KC 說巴勒是帶著嘲諷講這句話的，藉此指出巴蘭順從耶和華的下場。
- title: 曠野
  path: link_folder/地點/曠野.md
  summary: 民數記24:1：「巴蘭見耶和華喜歡賜福與以色列，就不像前兩次去求法術，卻面向曠野。」
  relation: '本章的曠野是觀看的方位。CT 說「卻面向曠野」指面向摩押的平原觀看以色列人。BH 另從象徵面讀：曠野在聖經中常是試煉與神聖相遇的地方，巴蘭轉向曠野等於轉向神的視角。STEP 顯示這裡是 ha./mid.Bar（H4057B，簡要義域 mid.bar: wilderness）。'
- title: 斷沒有法術可以害雅各
  path: link_folder/神學/斷沒有法術可以害雅各.md
  summary: 民數記24:1：「就不像前兩次去求法術」——STEP 顯示這裡的「法術」是 ne.cha.Shim（H5173），與民23:23 宣告無效的「法術」同一個字。
  relation: '前一章巴蘭親口宣告法術對雅各無效，這一章他就不再用了。STEP 讓這條線變成可驗證的：民23:23 的「法術」與民24:1 的「法術」是同一個 Strong（H5173，簡要義域 na.chash: divination）。GT《聖經精讀本》讀出的動機是算計——他認為前兩次失敗是因為在神面前使用了法術；GT《舊約聖經背景註釋》讀出的是機制——一旦知道耶和華的意思是要祝福以色列，他就放棄了機械式的方法。'
- title: 神的靈在人身上
  path: link_folder/神學/神的靈在人身上.md
  summary: 民數記24:2：「神的靈就臨到他身上」——這是巴蘭三次詩歌中唯一一次靈直接臨到，而不是神把話放在他口中。
  relation: 本章提供這個主題最極端的案例：靈臨到的是一個異教術士。CT〔話中之光〕先劃界：「並不是因為巴蘭內心蒙神喜悅。神為了成就自己的旨意使用了巴蘭，與巴蘭的意志無關」，並說這不同於內住在信徒裡面的聖靈工作。GT 丁良才列了三個同型的例子：掃羅的使者（撒上十九20）、掃羅（撒上十九23）、該亞法（約十一49-52）。KC 也拿不信的掃羅作對照。STEP 顯示原文是 Ru.ach 'E.lo.Him（H7307G＋H430G）。
- title: 安營與纛
  path: link_folder/主題/安營與纛.md
  summary: 民數記24:2：「巴蘭舉目，看見以色列人照著支派居住。」
  relation: 本章從外邦人的視角驗證了民2 那套營盤佈局。CT 說這指「看見以色列人分別支派安營，井然有序」；KC 說巴蘭在曠野看見的百姓不是散亂叛逆的，而是按支派安營、處在神面前的次序中。STEP 顯示「支派」是 li/sh.va.Ta/v（H7626H），與 v17 的「杖」（H7626G）同一字根——他看見十二個 she.vet 安營，最後宣告一個 she.vet 要興起。
- title: 詩歌（ma.shal）
  path: link_folder/原文/詩歌（ma.shal）.md
  summary: 民數記24:3、15、20、21、23 五次出現「題起詩歌」，是這個字在整組巴蘭敘事中最密集的一章。
  relation: '本章把 ma.shal 的分段功能顯示得最清楚：第四篇詩歌（v15-24）用「題起詩歌」四次切成四段——摩押與以東、亞瑪力、基尼人、亞述與基提。KC 正是依這四次重複把第四篇分成四部分。STEP 顯示五處都是 me.sha.L/o（H4912，簡要義域 ma.shal: proverb）。'
- title: 眼目明亮（ga.lah）
  path: link_folder/原文/眼目明亮（ga.lah）.md
  summary: 民數記24:4、16：「眼目睜開而仆倒的人說」——STEP 顯示「睜開」是 u./ge.Lui（H1540I），與民22:31 神開巴蘭眼睛用的是同一個字。
  relation: 同一個「揭開」在本章成了巴蘭的自我稱謂，而且連用兩次。民22:31 是一次性的事件（遮蔽被拿走，他看見耶和華的使者）；本章則變成他宣告身分的套語。同一節裡的「眼目閉住」是另一個字 she.Tum（H8365），與這個 ga.lah 分屬兩個詞。
- title: 香柏木（潔淨儀式用）
  path: link_folder/文化/香柏木（潔淨儀式用）.md
  summary: '民數記24:6：「如水邊的香柏木」——STEP 作 ka./''a.ra.Zim（H730，簡要義域 e.rez: cedar）。'
  relation: 本章的香柏木不用於儀式，而是比喻。CT 說沉香樹和香柏木「這兩種樹木的樹身都非常高大」，是以樹身取譬；KC 說那是木質耐久的、莊嚴的香柏樹。GT《舊約聖經背景註釋》另提醒一個地理事實：「香柏樹通常並不生於水邊，所指的可能是任何一種針葉樹。」
- title: 野牛之力（re.em）
  path: link_folder/原文/野牛之力（re.em）.md
  summary: 民數記24:8：「神領他出埃及；他似乎有野牛之力」——與民23:22 同一句式在本章再次出現。
  relation: 'STEP 顯示這個片語是 ke./to.''a.Fot re.''Em（H8443＋H7214），本節譯義是 like [the] horns of a wild ox，簡要義域 to.a.phah: peak、re.em: wild ox。也就是說中文的「力」在原文是「角」。CT 說這是「形容超乎平常的力量，是人所無法抵擋的」，並直接連回民23:22。'
- title: 母獅與公獅的比喻
  path: link_folder/主題/母獅與公獅的比喻.md
  summary: 民數記24:9：「他蹲如公獅，臥如母獅，誰敢惹他？」——與民23:24 的獅子意象在本章收束。
  relation: 民23:24 的獅子是起來獵食的，本章的獅子是躺下休息的。KC 把這個差別講得很細：據說獅子睡覺時不必找地方躲藏，牠可以在任何地方躺下，因為沒有誰敢攻擊牠。CT 說這是「形容有如萬獸之王，隨時準備吞吃敵國」。STEP 顯示「公獅」是 ka./'a.Ri（H738A）、「母獅」是 u./khe./la.Vi'（H3833C），兩處的本節譯義都作 like a lion。
- title: 祝福與咒詛
  path: link_folder/主題/祝福與咒詛.md
  summary: 民數記24:9-10：「凡給你祝福的，願他蒙福；凡咒詛你的，願他受咒詛」；v10 巴勒抱怨「你這三次竟為他們祝福」。
  relation: 本章是這個主題在巴蘭敘事裡的收尾：受雇來咒詛的人，第三次仍然祝福。CT 說 v9 這句「是承接亞伯拉罕和雅各的福氣（參創十二3；二十七29）」。GT 串珠說得更直接：「神祝福以色列的最高峰，就是表明『祝福以色列的必蒙祝福，咒詛以色列的必受咒詛』。」BH 指出 v10「三次」在聖經數字裡表示完全，強調這個祝福不可更改。
- title: 咒詛（a.rar 與 qa.vav）
  path: link_folder/原文/咒詛（a.rar 與 qa.vav）.md
  summary: 民數記24:9：「凡咒詛你的，願他受咒詛」——STEP 顯示這兩處都是 a.rar（H779），與民22:6、12 及民23:7 同字。
  relation: 本章讓兩個咒詛動詞的分工收攏：巴勒僱人來做的是 qa.vav，而巴蘭最後說出口的判語用的是 a.rar——正是創12:3 的那個字。STEP 顯示 v9 的「咒詛你的」ve./'o.re.Rei./kha 與「受咒詛」'a.Rur 同為 H779，morphology 分別是 Vqrmpc 與 Vqsmsa。
- title: 咒詛你的我必咒詛他（創12：3）
  path: link_folder/互文/咒詛你的我必咒詛他（創12：3）.md
  summary: 民數記24:9 下半：「凡給你祝福的，願他蒙福；凡咒詛你的，願他受咒詛。」
  relation: 這是亞伯拉罕之約的用語第三次出現在巴蘭口中，也是最完整的一次。CT 說這句「是承接亞伯拉罕和雅各的福氣(參創十二3；二十七29)」；KC 說巴蘭以一個重述神對亞伯拉罕及其後裔應許的宣告，結束了他的第三篇詩歌；BH 說這重申了創12:3 的約，並指出對神百姓的對待方式直接連著神的祝福或審判。GT《聖經精讀本》另加一層提醒：以色列不是福的主體，而是代理人。
- title: 越過耶和華的口（peh）
  path: link_folder/原文/越過耶和華的口（peh）.md
  summary: 民數記24:13：「巴勒就是將他滿屋的金銀給我，我也不得越過耶和華的命」——與民22:18 幾乎逐字相同。
  relation: 本章是巴蘭第二次搬出這句話，而且是在交易破裂後當面重述。CT 給的原文字義是「越過」逾越，超過；「命」口。CT 對這次重述的評語不客氣：「巴蘭說這話顯得很清高，其實他言不由衷」，並說「只是他無法說咒詛以色列人的話，並非他不願意說」。BH 則從先知職分讀：真先知的可信度就在於忠於神所給的信息。
- title: 以東
  path: link_folder/地點/以東.md
  summary: 民數記24:18：「他必得以東為基業，又得仇敵之地西珥為產業」。
  relation: 本章的以東出現在第四篇詩歌的第一段，與摩押並列為那位要來者所要制伏的對象。GT《聖經精讀本》解釋這裡為何稱他們為仇敵：他們雖在血統上是以掃的後裔，卻敵擋以色列、妨礙他們進軍迦南。GT 串珠與 BH 都把應驗放在大衛征服以東（撒下8:14）。CT 給的原文字義是「以東」紅。
- title: 西珥
  path: link_folder/地點/西珥.md
  summary: 民數記24:18：「又得仇敵之地西珥為產業」。
  relation: 本章的西珥與以東並列。CT 說「『西珥』是以東的首都，地處西珥山」；GT 串珠說「『西珥』：以東境內的一座山（申2:1, 18），也可指以東的首都」；BH 說西珥是以東人所居山地的另一個名稱，提到它是為了強調對以東的完全轄制。CT 給的原文字義是「西珥」多毛的。
- title: 亞瑪力
  path: link_folder/人物/亞瑪力.md
  summary: 民數記24:20：「巴蘭觀看亞瑪力，就題起詩歌說：亞瑪力原為諸國之首，但他終必沉淪。」
  relation: 本章是亞瑪力第一次被列入正式的神諭審判。「諸國之首」怎麼解，各家不同：CT 說可指西乃半島一帶眾多國家中力量最強大的，也可指第一個與以色列人對敵的；GT《舊約聖經背景註釋》說可能是亞瑪力人的自稱，又可能是表示他們是首先與以色列人對敵的民族。STEP 顯示 v20 的結尾「終必沉淪」是 'a.Dei 'o.Ved（H5704＋H8），與 v24 論基提的結尾用的是同一組字。
- title: 基尼人
  path: link_folder/人物/基尼人.md
  summary: 民數記24:21-22：「巴蘭觀看基尼人，就題起詩歌說：你的住處本是堅固；你的窩巢做在巖穴中」，接著是「然而基尼必至衰微，直到亞述把你擄去」。
  relation: 本章是基尼人第一次進入巴蘭的神諭，而且被列在被譴責的一邊。GT《舊約聖經背景註釋》點出這個轉折：基尼人在這神諭以先雖被視為友邦（出二16～22，摩西之岳父），在本段卻與亞瑪力人同列。STEP 顯示 v21 用族名 ha./kei.Ni（H7017），v22 改用 Ka.yin（H7014A）；同段的「窩巢」ki.Ne./cha（H7064）與族名相近，CT 明說這是雙關語。
- title: 亞述
  path: link_folder/地點/亞述.md
  summary: 民數記24:22、24：「直到亞述把你擄去」、「苦害亞述，苦害希伯」。
  relation: '本章的亞述是全書最有爭議的一個地名。STEP 顯示原文是 ''a.Shur（H804G，簡要義域 ash.shur: Assyria），morphology 為專有地名。但它指哪一個政治實體，四套來源給出五種互相衝突的判定——從新亞述帝國、亞述加巴比倫的合稱，到迦南的亞書利族、西奈半島北部的小部落亞塞爾。GT《舊約聖經背景註釋》的理由是年代：若讀成新亞述帝國，這神諭的焦點甚或寫作日期就變得太後期。'
- title: 彌賽亞
  path: link_folder/神學/彌賽亞.md
  summary: 民數記24:17：「有星要出於雅各，有杖要興於以色列」——CT 說本句暗示巴蘭看見了彌賽亞。
  relation: 本章是五經中最早、也最完整的一段彌賽亞式神諭，而且出自一個外邦術士之口。CT 說 v17「我看他卻不在現時；我望他卻不在近日」表明所看見的並非當今或近期的人物；KC 說巴蘭看見祂，「卻不在現時」是指還未臨在，「不在近日」是指在遠處。GT《啟導本》給了兩層應驗：三百年後的大衛王朝是歷史層，大衛家的王權包括彌賽亞的國度是神學層。
- title: 巴蘭是先知還是術士
  path: link_folder/解經爭議/巴蘭是先知還是術士.md
  summary: 民數記24:1-4：他放棄法術、神的靈臨到他身上、他自稱得見全能者的異象——本章同時提供正反兩邊的證據。
  relation: 本章讓這場爭論更難裁決。支持先知一邊的證據：v2 神的靈直接臨到（前兩次只是把話放在他口中），v4、v16 他自稱得聽神的言語、得見全能者的異象。支持術士一邊的證據：CT 說 v4「眼目睜開而仆倒」正是「指行法術的人，正常的先知看見異象時並不仆倒」，GT 丁良才同樣說「忠心于主的先知，見異象的時候，沒有這樣撲倒的」。KC 的處理方式是把兩件事分開：他確實看見了很多，但那與他個人的信心無關。
- title: 巴蘭的七篇詩歌
  path: link_folder/主題/巴蘭的七篇詩歌.md
  summary: 民數記24:3-9、15-19、20、21-22、23-24：本章載了其餘五篇，全組詩歌在 v24 結束。
  relation: 本章是這組詩歌的收尾。「題起詩歌」在本章出現五次（v3、15、20、21、23），KC 依 v15、20、21、23 四次重複把第四篇詩歌分成四部分：摩押與以東、亞瑪力、基尼人、以及列強的覆滅。GT《啟導本》則說巴蘭「接上題了三首短詩，預言其他民族的前途，完成了圓滿的『七』的數目」。KC 另指出本章第四篇詩歌完全是關於將來的。
- title: 巴蘭的教訓（啟2：14）
  path: link_folder/互文/巴蘭的教訓（啟2：14）.md
  summary: 民數記24:25：「於是巴蘭起來，回他本地去」——GT 丁良才指出這不是他與以色列的關係的終點。
  relation: 本章表面上結束了巴蘭的戲份，但 GT 丁良才《民數記註釋》明白指出後續：「但巴蘭仍舊住在米甸人中，用別的方法，謀害以色列人（民三十一8、16，啟二14）。」GT《聖經精讀本》在 v10~14 段也預告了同一件事：後來巴蘭為了得到金錢，先讓巴勒誘惑以色列百姓犯罪。這條線直接接到下一章巴力毘珥的事。
- title: 全能的神（El Shaddai）
  path: link_folder/神學/全能的神（El Shaddai）.md
  summary: 民數記24:4、16：「得見全能者的異象」——STEP 顯示原文是 sha.Dai（H7706），morphology 標為 HNpt（專有名詞．稱號）。
  relation: 本章是這個神名在民數記中的出現處，而且是從外邦人口中說出來的。它在 v4 與 v16 各出現一次，v16 另加上「至高者」（el.Yon，H5945B）。BH 指出這個稱號強調神至高的權能與權柄，使巴蘭的異象具有分量。CT 說「『全能者』指神是無所不能的大能者」。
- title: 至高的神
  path: link_folder/神學/至高的神.md
  summary: '民數記24:16：「得聽神的言語，明白至高者的意旨」——STEP 顯示原文是 el.Yon（H5945B，簡要義域 el.yon: Most High）。'
  relation: 本章是這個稱號在巴蘭詩歌中第一次出現。KC 特別點出這一點：「這裡巴蘭用了神的一個新名字：至高者。這是神在千年國度中的名字。」他並連回創14:18-20。CT 說「『至高者』指神高於一切的權勢（參但四17）」，並說「『意旨』指神所定無可改變的旨意」。BH 指出這個稱號常用在神聖啟示與智慧的脈絡中。
- title: 希伯
  path: link_folder/人物/希伯.md
  summary: 民數記24:24：「苦害亞述，苦害希伯」——STEP 顯示原文是 'E.ver（H5677G），morphology 為專有名詞陽性。
  relation: 本章是希伯這個名字第一次出現在預言性的神諭裡，也因此引出一個難題。多數來源讀作希伯來人或閃的後裔：CT 說「『希伯』指希伯來人」，GT 丁良才說「希伯就是閃之後裔的總稱，亞述也在其中（創十21-22）」。但 GT《舊約聖經背景註釋》指出這樣讀不合上下文，因為那會使以色列反而遭受咒詛，並明說這個名字至今仍未有令人滿意的解釋。
- title: 摩押地
  path: link_folder/地點/摩押地.md
  summary: 民數記24:17：「必打破摩押的四角」——這是巴蘭在摩押王面前，對摩押本身說出的判語。
  relation: 本章的摩押從委託人變成被判的對象。KC 指出字面：經文說的是「摩押的諸角」，意思是摩押的邊界。CT 說「『四角』指國境的四周邊緣，有的譯本翻作國家的首領；全句意指摩押必被完全征服」。GT 串珠把應驗放在大衛：三百多年後大衛果然打敗摩押、降伏以東（撒下8:2、14）。STEP 顯示「四角」pa.'a.Tei（H6285）是雙數形。
- title: 神的主權
  path: link_folder/神學/神的主權.md
  summary: 民數記24:13、23：「耶和華說什麼，我就要說什麼」；「哀哉！神行這事，誰能得活？」
  relation: 本章是全書裡神主權最集中的一章，而且證據來自反對方。巴勒承認「耶和華卻阻止你不得尊榮」；巴蘭承認自己不得越過耶和華的命；v23 這句反問則把範圍推到所有人。KC 說生命只有在與神的聯結中才可能，對在祂之外的人，適用的就是這一問。BH 引伯12:10 說一切活物的生命都在神手中。CT 說連當時那樣強大的亞述也要滅亡，因為這是出於神的作為，人無法與神對抗。
