book: 民數記
chapter: 7
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 本章第1、4-9、11及89節記載摩西膏抹帳幕使之成聖、接收十二首領奉獻之車牛分配給利未人、並進會幕聽見神在施恩座二基路伯中間向他說話。
  relation: 摩西作為神與以色列全會眾之間的中保，掌管奉獻物之神聖分配，並代表百姓在至聖所領受神微聲的親密啟示。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 本章第8節提及米拉利子孫在祭司亞倫的兒子以他瑪手下搬運會幕框架。
  relation: 確立大祭司亞倫及其子孫對利未各家族事奉搬運的統轄權。
- title: 以他瑪
  path: link_folder/人物/以他瑪.md
  summary: 本章第8節記載米拉利子孫分得四輛車與八隻牛，在祭司亞倫之子以他瑪手下搬運會幕柱子、板閂與帶卯的座。
  relation: 承接民數記第4章28與33節定例，記載以他瑪實質監督革順與米拉利子孫搬運設備之使用。
- title: 革順子孫
  path: link_folder/人物/革順子孫.md
  summary: 本章第7節記載摩西把兩輛車與四隻牛分配給革順子孫，照他們所辦的搬運事務使用。
  relation: 與民數記4:24-28革順族職務對照，因其負責搬運輕便的幕幔與蓋罩，獲得兩車四牛的車輛支援。
- title: 米拉利子孫
  path: link_folder/人物/米拉利子孫.md
  summary: 本章第8節記載摩西把四輛車與八隻牛分配給米拉利子孫，照他們所辦的搬運事務使用。
  relation: 與民數記4:31-33米拉利族職務對照，因其負責搬運沈重固體的板、閂、柱、座，獲加倍四車八牛支援。
- title: 哥轄子孫
  path: link_folder/人物/哥轄子孫.md
  summary: 本章第9節記載摩西未分配車與牛給哥轄子孫，因他們辦理至聖所聖物的事，必須在肩頭上抬聖物。
  relation: 承接民數記4:15與代上15:15定例，強調哥轄子孫扛抬最神聖器具時必須以肩親自承擔的神聖法則。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 本章第15、87節記載十二首領按日行奉獻壇之禮時，每位獻上公牛犢、公綿羊、一歲公羊羔各一，十二天共獻36隻燔祭牲。
  relation: 與利未記第1章燔祭對照，展現以色列十二支派全心奉獻、全人完全馨香獻給神的神聖敬拜。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: 本章第16、87節記載十二首領按日行奉獻壇之禮時，每位獻上一隻公山羊作贖罪祭，十二天共獻12隻公山羊。
  relation: 承接利未記第4章官長贖罪祭定例，代表全支派認罪求神潔淨，維持神在軍營中的聖潔同在。
- title: 平安祭（shelamim）
  path: link_folder/原文/平安祭（shelamim）.md
  summary: 本章第17、88節記載十二首領按日行奉獻壇之禮時，每位獻上公牛2隻、公綿羊5隻、公山羊5隻、一歲公羊羔5隻作平安祭，十二天共獻204隻平安祭牲。
  relation: 與利未記第3章平安祭對照，作為奉獻壇之禮中比重最大之祭物，展現神人共賞、感恩和好的極大喜樂。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: 本章第13、87節記載十二首領奉獻之銀盤與銀碗中均盛滿調油細麵作素祭，連同燔祭同獻。
  relation: 呼應利未記第2章素祭定例，以無酵調油細麵表徵基督聖潔無瑕疵的人性與信徒聖潔生活。
- title: 施恩座
  path: link_folder/主題/施恩座.md
  summary: 本章第89節記載摩西進會幕與神說話時，聽見聲音從法櫃的施恩座以上、二基路伯中間向他說話。
  relation: 與出埃及記25:22及利未記16:2施恩座啟示對照，記載神在二基路伯施恩座以上向摩西發聲微聲交談的神聖高潮。
