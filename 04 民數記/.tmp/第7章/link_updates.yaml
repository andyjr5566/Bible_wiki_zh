book: 民數記
chapter: 7
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 本章第1節記「摩西立完了帳幕」，第4-6節記他向神請示後收下首領的車牛並分給利未人，第89節記他進會幕聽見神說話。KC 注意到中間那一段的特別之處：這些禮物不在神給摩西的會幕指示裡，摩西似乎不知道該怎麼處理，是神說可以收下。BH 指出摩西與神的溝通方式在先知中是獨一的——不是異象或夢，而是面對面說話（出33:11）。
  relation: 本章讓摩西同時扮演兩個角色：向神請示以決定人所獻禮物的去向，以及在一切奉獻結束之後獨自進會幕領受神的話。GT 丁良才指出他雖不是祭司卻能進會幕與神說話，「因為他是神的僕人」。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 本章第8節提到革順與米拉利子孫「都在祭司亞倫的兒子以他瑪手下」，把利未人的搬運工作繫在亞倫家族的督導之下。BH 指出這顯示利未職事有清楚的層級與問責，而亞倫家族的祭司體系最終指向基督這位大祭司（來4:14-16）。
  relation: 承接民數記第4章亞倫父子督導利未三族的安排；本章是這套督導制度第一次在實際資源分配上運作。
- title: 以他瑪
  path: link_folder/人物/以他瑪.md
  summary: 本章第8節記米拉利子孫（連同革順子孫）「都在祭司亞倫的兒子以他瑪手下」，四輛車八隻牛就是交在這個督導體系裡。CT 註明「他們」指革順子孫和米拉利子孫（民4:28、33）。CT 的原文字義給「以他瑪」的字義是「棕櫚岸」。BH 指出以他瑪是亞倫最小的兒子，受託監督米拉利人，顯示利未職事中的層級與問責，也是新約教會設立長老執事監督與服事的先聲。
  relation: 與民數記第4章的督導分工相連；本章把督導的內容從「搬什麼」擴充到「用什麼搬」。
- title: 革順子孫
  path: link_folder/人物/革順子孫.md
  summary: 本章第7節記摩西「把兩輛車，四隻牛，照革順子孫所辦的事交給他們」。CT 說明理由：他們負責搬運比較輕的幕幔、帷子、門簾（民4:24-26），所以只給兩輛車。GT《聖經精讀本》的說法相同：比起辦理柱子和座的米拉利子孫，他們「不怎麼需要車和牛」。BH 指出這種按實際需要配給的方式，體現神照各人的呼召裝備他的百姓。
  relation: 為民數記第3-4章革順族的職務補上實際的運輸配額；KC 把幕幔的職事讀為「對外的見證，就是福音」。
- title: 米拉利子孫
  path: link_folder/人物/米拉利子孫.md
  summary: 本章第8節記摩西「把四輛車，八隻牛，照米拉利子孫所辦的事交給他們」，因為他們負責搬運較重的板、閂、柱子和帶卯的座（民4:31-32）。GT 丁良才特別澄清一句容易誤讀的話：這「不是說米拉利子孫單有這四輛車為搬運會幕的對象，乃是說他們從以色列眾首領所獻的六輛車中得了四輛」。BH 指出四車八牛的配額反映他們所負之物的沉重，也反映神對細節的顧念。
  relation: 為民數記第3-4章米拉利族的職務補上實際的運輸配額；KC 把板與柱子的職事讀為「對信徒的照顧，就是牧人的服事」。
- title: 哥轄子孫
  path: link_folder/人物/哥轄子孫.md
  summary: '本章第9節說「車與牛都沒有交給哥轄子孫；因為他們辦的是聖所的事，在肩頭上抬聖物」。GT《聖經精讀本》指出他們辦理的是「會幕中最重要的工作」（民4:5-15）。BH 說明肩抬是出25:14 與民4:15 所定的方式，表明這些器具「不是當作一般貨物對待」。STEP 原文資料顯示本節「肩頭」是 ka.teph（H3802）、「抬」是 na.sa（H5375H，to lift: bear）、「事」是 a.vo.dah（H5656H，service: ministry）。'
  relation: 承接民數記第4章哥轄族搬運至聖器具的規定，並在本章成為一條有後果的定例：GT 丁良才與《聖經精讀本》都以大衛用車拉約櫃害死烏撒為儆戒，KC 另指出非利士人用車是出於無知，大衛則是忘記了定例。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 本章第15、87節記每位首領獻公牛犢一、公綿羊一、一歲公羊羔一作燔祭，十二天合計三十六隻。CT 說明燔祭「指整個祭物須在祭壇上經過火燒，使馨香之氣上升，全部獻給神」。BH 指出這三種祭牲各有象徵：公牛代表力量與領導，公綿羊連於代替性的獻祭（創22），一歲公羊羔代表無瑕與純潔。
  relation: KC 注意到本章燔祭列在贖罪祭之前，與前一章用鳥獻祭時贖罪祭在先的次序相反；他認為不同種類的燔祭「表明主耶穌為神所做的有不同的層面」。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: 本章第16、87節記每位首領獻公山羊一隻作贖罪祭，十二天合計十二隻。CT 指出「『公山羊』是官長犯罪所獻的祭牲（參利4:23）」，GT《聖經精讀本》的說法相同並補上理由：首領「不過是以色列百姓中的一個罪人，所以只獻上贖罪祭」。BH 說明贖罪祭處理的是無心之罪與不潔，公山羊在利未記律法中常用於此。
  relation: 承接利未記第4章按身分分級的贖罪祭體系，並在本章用在一個特定身分上——官長。KC 觀察到在本章的供物裡「贖罪的層面並不佔最大的地位」，首領們更多是以燔祭與平安祭來表達他們所看見的。
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: 本章第17、88節記每位首領獻公牛二、公綿羊五、公山羊五、一歲公羊羔五作平安祭，十二天合計二百零四隻——是本章數量最多的一項。GT《聖經精讀本》由此推論：「以最少的祭物獻為贖罪祭，用最多的祭物獻為平安祭，暗示著實際上為奉獻壇的禮物是作為感謝而獻上的平安祭」，並指出這裡獻上的是平安祭三類中的感謝祭。BH 說明平安祭是自願的敬拜行動，表達感恩與相交。
  relation: 與利未記第3、7章的平安祭定例相連；本章以壓倒性的數量凸顯感謝的份量。KC 指出平安祭「表達神與祂百姓之間、以及百姓彼此之間的相交」，在首領的供物裡佔了顯著的地位。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: 本章第13、87節記銀盤與銀碗「都盛滿了調油的細麵作素祭」。CT 解釋素祭在希伯來文「含有禮物或貢物的意味，是一種自願的獻祭」，並指出它「間接供應祭司們生活所需的食物」。GT《啟導本》從制度面補一句：素祭是祭司收入的重要來源，先講各族長獻上素祭「是對此制度的肯定」。GT《舊約聖經背景註釋》說明所用的細麵「是小麥磨成麵粉後，留在篩子裡面的粗麵粉」。BH 指出細麵代表人勞力的最好成果，油則常連於聖靈與膏抹。
  relation: 呼應利未記第2章的素祭定例；本章的特別之處是它同時承擔了供養祭司的制度性功能。GT《聖經精讀本》另指出調油的細麵「象徵著聖靈的工作」，首領們獻上它「象徵著他們對神的事奉是在聖靈裡的事奉」。
- title: 施恩座
  path: link_folder/主題/施恩座.md
  summary: 本章第89節記摩西「聽見法櫃的施恩座以上、二基路伯中間有與他說話的聲音」。CT 說明施恩座「英文名叫『憐恤座或慈悲座』（Mercy Seat），希伯來原文字根有『遮蓋』的意思，因此，它是約櫃上面的一塊精金做的厚蓋板，具有『遮蓋罪或贖罪』的功用」。GT《聖經精讀本》指出施恩座以上、二基路伯中間是神與人相見的地方（出25:22），希伯來書把這個地方稱作施恩的寶座（來4:16）。BH 說明施恩座是約櫃的金蓋，被視為神在地上的寶座。STEP 原文資料顯示本節該字是 kap.po.ret（H3727），語境譯義為 atonement cover。
  relation: 把出埃及記25:22 的應許落實成一次實際發生的事件。KC 指出這件事記在首領甘心奉獻之後並非偶然——神「唯有當我們有一顆甘願的心、滿了對主耶穌的欣賞時」，才真能分享祂的心思。
- title: 供物（qorban）
  path: link_folder/原文/供物（qorban）.md
  summary: 本章第3節「他們把自己的供物送到耶和華面前」，指的是十二支派首領自願帶來的六輛篷子車與十二隻公牛。GT《民數記串珠聖經註釋》為本章的供物劃了一條界線：「禮物是額外的，並不是神清楚指定的，因此摩西須尋問神是否接受這些禮物（4）……至於祭物，則是神清楚指明的。」GT《舊約聖經背景註釋》另指出第84-88節所列的牲畜並非立刻被獻為祭，「牠們暫時只是聖所的牲口，到有需要時才用得上而已。這些運作的基本所需，可說是聖所喬遷的禮物」。
  relation: '利未記第1-7章的供物講的是神指定的五種祭；本章把同一個字用在神沒有指定、出於人自願感動的禮物上，因此摩西必須先請示神是否收下。STEP 原文資料為這個字的字根義提供了本章的實例：第3節「供物」是 qor.ban（H7133A），同節「他們把這些都奉到帳幕前」的「奉到」則是同源動詞 qa.rav（H7126H，to present: bring）——供物就是被帶到近處的東西，而首領所做的就是把它帶到近處。'
- title: 贖罪祭與贖愆祭的分別
  path: link_folder/神學/贖罪祭與贖愆祭的分別.md
  summary: 本章第13-17節的供物只有燔祭、素祭、贖罪祭與平安祭四種，沒有贖愆祭。三套來源給的理由不一樣：CT——首領「不是為個人的罪行獻祭，而是代表全支派之人在神面前乃是罪人，故僅獻贖罪祭」；GT《民數記串珠聖經註釋》——「贖愆祭是要贖人際間的罪咎（參利5章），而本段的獻祭是以神為中心，故此無需獻贖愆祭」；GT《聖經精讀本》——「他們沒有犯應該向神賠償的特別罪」。
  relation: 利未記第5章是從條文本身分辨兩祭，本章則從一個實際場合反過來界定：當獻祭的場合是以神為中心、不涉及人際虧負或聖物挪用時，贖愆祭就不出現。三種理由都落在同一個判準上——贖愆祭處理的是「有東西要賠」的罪。
- title: 約櫃
  path: link_folder/主題/約櫃.md
  summary: 本章第89節稱它為「法櫃」：「摩西進會幕要與耶和華說話的時候，聽見法櫃的施恩座以上、二基路伯中間有與他說話的聲音。」CT 說明法櫃就是約櫃，「裡面存放兩塊法版（參出25:16）、嗎哪（參出16:34）、亞倫發過芽的杖（參來9:4）」。BH 指出櫃中的法版即十誡，而施恩座是神在地上的寶座，是祂與摩西說話的定點。
  relation: 本章從兩端碰到約櫃：第9節哥轄子孫必須用肩頭抬聖物（後來大衛違例而害了烏撒的命），第89節則是神從櫃上的施恩座向摩西說話。STEP 原文資料顯示第89節「法櫃」是 'a.Ron（H727，ark）配 e.dut（H5715，testimony），字面就是「見證的櫃」，與 CT 原文字義所註的「法」見證、「櫃」箱子相符。
