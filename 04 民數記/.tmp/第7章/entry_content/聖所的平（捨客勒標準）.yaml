name: 聖所的平（捨客勒標準）
type: 文化
secondary_types: []
aliases:
- 聖所的平
status: formal
definition: 「都是按聖所的平」（v13, 85, 86）是民數記第7章衡量所有奉獻金銀器皿重量的法定標準。「聖所的平」（shekel of the sanctuary）指存放於會幕聖所內作為官方度量衡基準的標準舍客勒法碼（一舍客勒約折合11.5公克；CT、GT）。在希伯來律法體系中，凡奉獻給神的金銀禮物、贖罪銀或物價評估，均必須精準符合「聖所的平」，絕不容許有世俗欺詐、偷工減料或主觀偏差（出30:13, 利27:25；CT、GT）。在屬靈上，「聖所的平」表徵一切事奉、奉獻、生命品質與真理實踐，都必須受神聖所與神公義法規的客觀衡量，唯有符合神標準的奉獻才蒙悅納（CT、KC）。
accumulations:
- book: 民數記
  chapter: 7
  summary: 本章第13、85、86節強調十二支派首領奉獻的銀盤（130舍客勒）、銀碗（70舍客勒）與金盂（10舍客勒）均嚴格按聖所的平秤重核算。
  relation: 確立舊約律法中以「聖所的平」作為衡量奉獻與物價之最高神聖標準與文化制度。
