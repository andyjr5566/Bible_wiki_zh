- name: 施恩座
  type: 主題
  evidence: v89「法櫃的施恩座以上」。
- name: 民數記第七章的時序與編排
  type: 背景
  evidence: v1「摩西立完了帳幕」把時間拉回出40:17 的第二年正月初一日，早於民1:1 的二月初一。GT 丁良才：「本章的事，原該列在利八10節以後，不過記在此處，免得有防礙於記載西奈山垂律法的事。」GT《啟導本》：作者希望民數記可以集中講獻祭和祭司的按立，再敘述全民出發前的準備與利未人工作的分配，之後才介紹十二支派奉獻禮物。GT《民數記串珠聖經註釋》給了三個理由（先交代車牛分配需接上文利未人職務、律法禮儀先於實踐記載以免破壞整體性、奉獻是以神為中心生活的最高回應）。KC 列出從正月初一到二月二十日雲彩收上起行的完整事件序列。
- name: 供物（qorban）
  type: 原文
  evidence: v3「他們把自己的供物送到耶和華面前」；CT：『供物』指供給神的禮物。GT《民數記串珠聖經註釋》分辨禮物與祭物：「禮物是額外的，並不是神清楚指定的，因此摩西須尋問神是否接受這些禮物（4）……至於祭物，則是神清楚指明的。」GT《舊約聖經背景註釋》指出 v84-88 所列的牲畜並非立刻被獻為祭，「可說是聖所喬遷的禮物」。
- name: 贖罪祭與贖愆祭的分別
  type: 神學
  evidence: v16、87 只獻贖罪祭而未獻贖愆祭，三家給的理由各不相同：CT——首領「不是為個人的罪行獻祭，而是代表全支派之人在神面前乃是罪人，故僅獻贖罪祭」；GT《民數記串珠聖經註釋》——「贖愆祭是要贖人際間的罪咎（參利5章），而本段的獻祭是以神為中心，故此無需獻贖愆祭」；GT《聖經精讀本》——「是因為他們沒有犯應該向神賠償的特別罪」。
- name: 約櫃
  type: 主題
  evidence: v89「聽見法櫃的施恩座以上、二基路伯中間有與他說話的聲音」；CT：『法櫃』指約櫃，裡面存放兩塊法版、嗎哪、亞倫發過芽的杖。GT《聖經精讀本》：施恩座以上、二基路伯中間是神與人相見的地方（出25:22），希伯來書稱之為施恩的寶座（來4:16）。
