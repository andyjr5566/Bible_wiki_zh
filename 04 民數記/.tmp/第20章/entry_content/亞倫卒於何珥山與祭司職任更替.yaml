    summary: "著力載實摩西順率聖命將亞倫那一身上奉至美贖祈重責的大祭司極崇寶服從山際穩穩剝落、直接加授給直承嫡嗣以利亞撒身心；亞倫於焉仰笑歸化頂頭終壽，軍民痛悼三十秋淚告敬老英榮逝。"
    relation: "成就大祭司職事超越生平人體死亡界線的榮譽存續法統；預引希伯來書經緯指摘舊邦人體祭司總因死亡交班退去，仰對永世榮衣長御不動真僕耶穌的無邊長存।"
