  - "文化"
aliases: []
status: "formal"
source_scope: "collected_only"
definition: |
  在民數記第二十章之收尾劇目裡，舊約律法祭儀傳承史上最肅靜凝練的世代大移交在以東疆側之何珥山頂拉開最後之悲壯史實：「摩西把亞倫的衣服剝下來，穿在他兒子以利亞撒身上；亞倫死在山頂那裡。」年達一百二十三歲（ 參 數三十三39 ）的希伯來首位正統受膏至高祭長，依隨神明在米利巴爭水案所降「不得入應許聖地」之鐵約決斷，必須於此刻辭退血氣職務、就此長眠榮歸大邦。然而與先鋒兄姊米利暗無言獨離或日後摩西單向山尖隱化稍呈殊異者，這裡經上帝格外細密設計，成就了一整圈隆重而嚴正的聖袍脫轉與榮顯登繼：「你要帶亞倫和他的兒子以利亞撒上何珥山，把亞倫的衣服剝下，穿在他兒子身上。」
  丁良才《拾穗》、《舊約聖經背景註釋》與黃迦勒文札深廣明釋這段聖衣更迭的核心法權價值：在耶和華會所制度前，代表神赦、胸排十二族石牌與以弗得肩榮大衣本就是大祭司合法位階本身；摩西遵照天意先為未死之老祭首褪裝，立即幫新生好兒穿著如舊，宣示至誠替人挑受眾染與事主的「大祭司贖罪神功」毫無一秒空窗與中歇，使死亡雖然能摧沒犯罪塵骸的亞倫本人，卻永不曾能斷截、吞滅耶和華對選眾聖約之眷顧垂愛與無止相繼。 KingComments與BibleHub雙刃切析：如此於山野萬民共觀底下的轉掌，不單斷弭了可拉流黨當歲曾對以利亞撒權威之覬覦與質疑；同時仰悲俯慟三十整月的曠野哀泣（為亞倫落奠大哭三十天，民二十29 ），既表顯了對初代大牧厚工勞勛的不忘懷念，更在長軸新約希伯來神學視角下宣講：一切出自塵性之亞倫等輩皆須交出華袍衰離，乃存等那真正一世永任、長穿聖榮絕不罷官的永恆中保耶穌基督（ 參 來七23-24 ），作天下長生不老不廢的究竟圓成。
