name: "米利巴水之地顯神至聖與禁止摩西進加南之地威名"
type: "神學"
secondary_types:
  - "事件"
  - "歷史"
status: formal
definition: |
  在希伯來律例與大能歷史記錄裡，尋歡不逐而化作干戈苦爭的米利巴水不唯是一道荒陵活流之勝，乃是造天獨主在百姓紛爭仇囂與僕從乖失之中強烈向寰景「顯為自己為不二至聖、決不隨順肉氣同沾」的純白分水極境；在此偉大反諷中，造命者固不吝對缺水愚群傾下滾滾洪波深澤，同期卻以如冰威裁向擅行發性而不願在萬家面前揚君聖德的兩位頂聖高祖摩西、亞倫宣告極痛封門終決——嚴令彼等皆遭剝奪親掌節仗帶軍闖抵豐盛乳蜜應許疆場之聖國榮路。
accumulations:
  - book: "民數記"
    chapter: 20
    summary: "上帝縱降甘泉遍解愚氓爭鬧苦怨而使加低斯泉稱作米利巴，同期對擅自行權不把造王揚極為聖的摩西、亞倫下令永不入南土家國之浩懲。"
    relation: "嚴告神之見證超越任何靈首舊節功業；明志僕工倘以人性狂語亂了真純恩流，必付無緣進抵流乳完滿新居之浩重苦痛。"
    content: |
      自古靈命轉捩點極難尋求出如此交纏恩耀與威嚴的神聖現場：「耶和華對摩西、亞倫說：『因為你們不信我，不在以色列人眼前尊我為聖，所以你們必不得領這會眾進我所賜給他們的地去。』這水名叫米利巴水（米利巴就是爭鬧的意思），是因以色列人向耶和華爭鬧，耶和華就在他們面前顯為聖。」（民二十12-13）。黃迦勒在靈意註解底端痛下斷句：「你看這裡『米利巴』字義雖呼相吵交鬥，主卻不在人的惡裡陷沒，祂用這奔潮自揚聖潔榮耀與與眾迥別！最驚懼者當在耶和華的控狀：『不我為聖！』這裡原文真諦實呼『沒拿我分別為聖！』摩西口喝罵人、又怒杖敲石引波，叫盲黎以為那位翻波供飲的好神正是那位抓杖厲罵、脾氣暴急的狂客！將天主拉進自己人意的壞地步，大大損了世俗眼裡的至高純慈神靈見證，這是天大罪厄！所以上帝絕對不會因為你四十年勤倦長勞便肯隨意縱去；不能進迦南，意表生命雖經長工，仍無從享獲豐醇的流奶完滿榮極安休！」（CT）。

      丁良才與拾穗則從群居法律與領袖代表之責申辦理由：「人咸妄猜處罰是否苛劇，要知道領導越近聖階，所肩之威責無休是加十等；亞倫此行莫曾起言申救反而並顏怨恨，二人攜力未仗口語大能去表信，反依人勇耍棒示威；聖帝必須借此鐵奪軍符，宣告凡心難掩天地獨勝無瑕的崇尊勝境！」（GT）。BibleHub 將這一座爭之泉野命名做兩相輝映之史詩教導：「泉谷水出為證主永無食言與仁育無限，兩舊臣斷奪帶職登境則是天庭無情驅退舊氣好權的一紙休書！」（BH）。

      KingComments 再度長聲呼泣地求乞當世領眾神役心如秋冰徹亮：「我們何易埋首狂傲中，竟以怒威頂冒神聲自負為神除惡！只要我們敢讓一毫俗怒假借靈言傾倒，即刻成褻瀆『分別為聖』！此番悲泣代名提醒爾大泉縱得暢意狂飲，主手公決仍舊鐵心揮落，務願每一員侍王心君把己消歇，好教真正主榮不打折向世界常燃不昧！」（KC）。此言極是深警當世忘軀歸服不居主功的千載名論。
