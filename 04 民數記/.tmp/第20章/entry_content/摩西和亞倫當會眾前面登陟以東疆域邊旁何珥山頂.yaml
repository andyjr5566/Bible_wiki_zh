name: "摩西和亞倫當會眾前面登陟以東疆域邊旁何珥山頂"
type: "地點"
secondary_types:
  - "事件"
  - "歷史"
status: formal
definition: |
  在西伯來古代大出遊進程中，轉離了與以東血戰無助的兵鋒，浩浩萬生進泊至連貫於以東國疆極邊外壁的至巍高峰——何珥山；在此無匹之危巖天台上方，主上直降聖論叫摩西伴提暮老君伯亞倫與正待授籙之年輕子豪以利亞撒，在一條條百千萬尋天百姓目不轉睛地屏然凝瞻下，並步爬越入蒼雲之嶺；這一頁公然向群萌示敞的登山大幕，標表天地之間生死職交決非幽暗苟息之隱忍，而是一期承上啟下、告絕奮世往跡而去迎開聖務新光的榮貴地台。
accumulations:
  - book: "民數記"
    chapter: 20
    summary: "軍萌繞境即住何珥靈峰之麓，主使三人迎對千萬人矚同朝絕巔直征，使那作伴世歲大半百的舊職王長迎朝善末。"
    relation: "將老成舊僕與承祿子臣一起向巔共登的景象刻印在全民心田，宣證屬上帝事業的升墜絕不因個體終息便斷光遠道。"
    content: |
      自從放棄突過強頑王道的痴念後，軍旅進逼向一座見證史蹟巨變的天宇危崖：「以色列全會眾從加低斯起行，到了何珥山。耶和華在附近以東邊界的何珥山上曉諭摩西、亞倫...『你帶亞倫和他的兒子以利亞撒上何珥山...』摩西就照耶和華所吩咐的行。三人當著會眾的眼前上了何珥山。」（民二十22-27）。黃迦勒細意研繹此程高嶺奇事的神韻情髓：「『何珥山』正懸於世俗強權以東地疆隔側，神讓苦路至此開現山境；你看三人手偕同步上路，絕不同於當年獨有摩西潛隱雲霧密峰深受兩表，此回神指要『當著會眾眼前』揭破這場哀壯征途！亞倫知道自己上這一趟必定骨枯死穴無法隨還，居然仍無抱怨、步伐坦直；這種無私受刑且願意公然展示自降順神裁奪的溫亮心德，正是長官極致榮德之極光！」（CT）。

      丁良才與拾穗則探古溯往以確考名山歷史光景：「雖然今日爭辨何珥具體安址未罷，但古賢確切信奉那一帶連絕以東的石山；猶太傳神論言此峰高廣極致，叫山下大圍安營群氓能縱視三人緩邁上嵐；會中皆曉大老前途凶冥，然而老少二徒同時受宣同向無際天山直走，那正顯示天權絕對主導一切枯榮好轉！」（GT）。BibleHub 把這一遍公然越嶺目之為安頓靈家秩序的高牆重基：「死縱非人歡，在會前成義登山卻成不衰盛譽；神並無密斬老臣令軍萌心驚，反而讓他手捧榮譽冠袍步入山霞！」（BH）。

      KingComments 更多方鼓舞今生服苦於無常境裡的浩大團結：「切莫憐哭歲末無歸悲歌；看啊，大老攜新徒無有嫉懼不退反前；上帝帶領這場越山絕劇旨在叫列民得讀天歌妙諦——任由舊光垂竭歸息山巔，那陪同踏往巍巍嶺門的必還有一雙青春壯盛與天權伴生之手！」（KC）。此筆大讚神意安穩於山顛的榮壯悲慈。
