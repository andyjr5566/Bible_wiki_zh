definition: |
  在希伯來出埃與曠野漂流紀事至第四十年開局，民數記第二十章一筆定音地記載了一樁揭示漫長舊齡完結的痛仰時刻：「正月間，以色列全會眾到了尋的曠野，就住在加低斯。米利暗死在那裡，就葬在那裡。」昔日那位在尼羅河蘆葦叢頂聰敏守護嬰孩摩西、紅海絕域前揚掌擊鼓領唱盛頌《紅海歌》的女先知米利暗（ 出十五20 ），經過四十年沙漠跋涉與毀譽消散後，正式走到生命的定數。黃迦勒《文摘》及丁良才《拾穗》等原解精靈深刻對明此厄場點與年限的神聖悲痛底色：其一，這一時間正是漫長的三十八年無名放逐「舊人死亡倒斃期」滿結之交，象徵首代熱心有加卻未嘗盡脫天然舊造性格（如 哈洗羅群嘲爭權之事， 參 民十二 ）的高層首腦正式歸幕；其二，「加低斯」這方絕口正是當年十二探子引發背命干犯而遭到誓咒禁足絕途的深海起點，於原處辭喪，彰顯大宰審斷浩瀚不私，雖身為第一家族之親率依然不得不服循舊體死毀之極限法則。
  KingComments與BibleHub精確申辨其靈性及歷史傳承定位：米利暗一死不啻向整世代敲起告終預警，預告以摩西、亞倫與米利暗三個老生帶領元組，既承載著血脈出獄的開門豪邁，卻因各自帶著天然人意的急縱或驕妄，無法終局擔當領導百姓衝赴應許聖園之責。於是一方沙原小厝默厝米利暗身骸於加低斯荒域，為接下來整組大祭司班底革更與摩西自身受訓退除開啟了嚴莊哀婉的首幕見證。
accumulations:
