    chapter: 20
    summary: "紀錄曠野行程至極末第四十年之開年春月，女先知米利暗隨征隊邁宿當前重辱地的加低斯巴尼亞近域病離終絕並留塚黃沙的完整悲悼。"
    relation: "標誌出以舊埃及天然舊性為主之帶領領主必須次第沒落於迦南之外；強力呼應上主早年頒布於尋荒沙海之判則一視同仁無私，唯新生命體系可承聖約大邦。"
