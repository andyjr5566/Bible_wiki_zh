name: "女先知米利暗卒於加低斯為肉體軟弱與領袖管教見證"
type: "事件"
secondary_types:
  - "歷史"
  - "人物"
status: formal
definition: |
  在中近東曠野艱苦長路步入第四十載之正月初，全地會民復度安歇於歷史災厄勝衰關隘——尋的曠野與加低斯境界；此際昔日統領海灣慶舞與頌主長謠的女先知米利暗在此孤寂氣絕，並直接入土定葬；其遺落沙丘未能陪隨凱陣衝返應許嘉域的結局，向歷代昭銘：在全高至正的天朝軍序內，凡牽染舊日自為與口舌競榮之爭者，不問功業幾許或領袖榮階，皆經神公義秤桿實踐徹底管教，使老死遺性全然告終，無預永生福地前衛傳承。
accumulations:
  - book: "民數記"
    chapter: 20
    summary: "正月初軍行重歸尋野加低斯舊厄之野，女聖師米利暗身歸塵冥深域即穴成故，標明奮迅功宿之世長終老死而永失進駐天許王境之地。"
    relation: "向神聖盟群昭顯長明警告，明證任由榮勳無比，苟沾自矜口論必遇王刑定止；申明天國繼進惟賴無疵忠信。"
    content: |
      以色列民群自出埃及歷次失守後，徘徊塵漠足逾三十八季遙，終究在一月春風裡又重登這道命運的分歧高野：「正月間，以色列全會眾到了尋的曠野，就住在加低斯。米利暗死在那裏，就葬在那裏。」（民二十1）。黃迦勒在此洞見這段古史深處無從開免的嚴正警訊：「全黨再踏『加低斯』一處舊衰之地，何期震耳欲聾！當年若非懦信怯前必不過如斯困苦；更加重痛者，乃女領袖米利暗終死定棺此丘。你若溫讀 Exodus 便知，彼在碧水海濱何等激昂領唱揚讚造宰大力，又是昔年攜看弱幼摩西免遭漂沒的仁慈家姊！然因壯中傲狂非議神僕，身招大痲瘋雖獲赦解，極偉人爵也依終逃不出肉體驕矜所帶進的大結局——死於極野而不進蜜鄉！這乃對靈堂宿望名臣最驚魂打底的好金鐵箴言！」（CT）。

      丁良才與拾穗隨及解析古代時間進程對生命傳承的定約：「此際已是去埃離地四十年仲初，神家既欲破啟河東直壓宣名誓土，舊世代領軍必得盡將歷史擔席轉付新生；米利暗之卒乃宣佈首代豪情謝卻、老人氣性死除。」（GT）。BibleHub 把這一抔長沙野丘塑定為天人信程轉折主碑：「在沙漠歸塵並不僅是一紙生死簿錄，經文刻意書出此墓駐在探敵挫衰加低斯故地，直把人性驕功與不顧天約的重痛烙刻於史籍深房！」（BH）。

      KingComments 更垂淚向信旅大眾懇懇勸懷神命公正毫無私偏的本義：「切切謹防因居舊老資歷或功成前朝便狂肆放從！女先知縱有浩天良緣與神言榮光，一旦跌涉偏意嫉競即難踰主界；看護心懷虛心服順，莫令驕容使你阻留於望土高崖之前！」（KC）。此語深重打透無私上帝長愛且公明的治法大經。
