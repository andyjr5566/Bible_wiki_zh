definition: |
  「何珥山」（ Mount Hor ； 希伯來意轉「峰中之尊峰或巍峻山崙」）是民數記第二十章中，隨著以色列人受阻於以東狂傲邊防、引旗東繞至其疆陸分水周畔之處時所泊至的歷史靈要地界；聖書明確宣示此點位「在以東地的邊界那處」，作為以色列人經歷加低斯波折退入另波巡旅前的神聖行臺。正是於此極孤雲峰、上連天下視沙的宏曠壯麗場上，耶和華傳出大祭司第一任開闢宰長亞倫歲終解位的驚世欽囑。
  丁良才《拾穗》與《舊約聖經背景註釋》悉密指明此方偉岫的地理與崇聖定位：考古傳統雖多分置其於佩特拉西南不遠處的高懸主峰（ Jabal Harun ），但最顯明的核心在於其挺兀而立、堪以容許上座巨職之交遞公開袒於山腳全族眾人浩視底下（「當著全會眾的眼前上了何珥山」，民二十22-25 ）。黃迦勒之文解、KingComments與BibleHub同心申出斯方巔域的神學紀念含蓄：和西乃高山授律、 Nebo（尼波山）瞻望迦南皆分庭爭勝，何珥山出現在野路即終前夕，不僅標識以色列行將揮辭漂泊哭海轉入征拔摩押荒原的起站，更成為把承辦天理長流的最高祭統——由生前垂犯過失歸死的亞倫直交賜生以利亞撒手裡——進行天命承接更新的不滅豐碑地標。
accumulations:
