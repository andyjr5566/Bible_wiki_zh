    chapter: 20
    summary: "紀錄那高峙於以東重國嚴邊防界旁邊之聳立主山西脊；即是上帝指令摩西率帶年暮亞倫及其榮儲以利亞撒攀赴於萬眾放目雲瞻下辦理職使移解的新舊榮枯聖陵。"
    relation: "架構出舊事舊神長因干犯得死歸葬與全新職人迎衣續香的巨大時空轉任交會臺；指證祭祀繼嗣經需於最高見證山上由上帝公權力督察交遞之肅穆程序。"
