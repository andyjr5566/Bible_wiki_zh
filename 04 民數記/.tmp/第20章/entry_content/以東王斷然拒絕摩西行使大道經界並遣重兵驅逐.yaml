name: "以東王斷然拒絕摩西行使大道經界並遣重兵驅逐"
type: "歷史"
secondary_types:
  - "地點"
  - "事件"
status: formal
definition: |
  在西元前中東古代荒漠大長征歷劫將達目標之冬夏交鋒期，摩西仰待親緣手足之友善舊盟，自加低斯遣發外交專使馳造相望之「紅土長國」以東王城，以苦楚四百載身歷無休患痛為信，乞期得以付費買水並遵踏中央修繕良嚴的「王道（The King's Highway）」經越疆土；詎知承繼以掃舊意、嗜奉血緣自利的以東主后斷言橫心全絕，非但悍然喝罵更親統巨兵大衛盛戈殺向邊線迎截；此等嚴絕逼迫使不妄開爭鋒的聖盟社群順奉上主平安與不依賴肉體之良義，轉塗別塗長途迂回。
accumulations:
  - book: "民數記"
    chapter: 20
    summary: "摩西向擁有古親兄弟名望的以東王發求行道於王家的平途與付銀取飲申請，卻遭剛橫好主拒辭且被精金甲刃盛臨武力防逼遶行。"
    relation: "向信奉聖旅昭告血脈與世俗肉身關係決難仗倚，示現靈軍情願自受大虧遠赴歧荒莫妄逞氣爭競威。"
    content: |
      以色列步隊正往加南樂海衝越，極需穿越以東千歲地緣：「摩西從加低斯差遣使者去見以東王，說：『你的弟兄以色列人這樣說：你...都知道，求你容我們從你的地經過... 只走大道（原文作王道），不偏左右...』以東王說：『你不可從我的地經過...』就率領許多人出來，要用強硬的手攻擊... 於是他們轉去，離開他。」（民二十14-21）。黃迦勒抓住了歷史疆界底面所深藏的對付骨肉與心氣交惡神旨：「『以東』正是昔時為紅湯斷送貴嗣的以掃傳冑，意蘊專奉紅世、一己肉體的勢頭；你雖垂聲泣問，說『我們是親手足』、又自許守嚴軍心專踩修廣王途絕對分毫不取；肉體的狂邪定然對聖靈抱以老遠血仇、立刻挺刃橫迎！這極真實宣揚一條生命好則：你絕對不能想踩靠舊日人間情脈或假藉肉心行道；被截受苦只應學從謙和主性彎出絕境『轉去離開』，好叫神大能不依人戈狂血取名！」（CT）。

      丁良才與拾穗隨往近東歷史名路與邊疆態勢引敘：「那『王道（King's Highway）』本是貫亙南北的極大商業要途，從亞卡巴海直到大馬色；人咸怪何辜遭以東如此忌怕，實則以掃群生深懼如繁星萬千壯丁直涉核心地，定傾家危，遂動千乘威權推阻；以色列兵此行莫發血意與兄開爭，轉從曠谷迂行，深遂上帝勿得侵佔予彼疆的久旨！」（GT）。BibleHub 將這一紙受辱退歸的文狀標示為天眾耐苦守命的好證： 「無禮遭擋非必興兵對抗，靈家戰役惟視造王軍指；寧可被逐多步風雷路，莫把寶光流入與俗情同氣的混濁撕仗！」（BH）。

      KingComments 更厲聲高歌這『轉去，離開他』是脫塵入聖極偉大的凱揚步驟：「當以東之怒挺向你看似軟弱無極的進征路時，莫要哭笑世態險絕，那是神不許你將肉體情誼充作走望天鄉的階梯！面對俗意強梗與兵鋒冷對，最有極致權揚的新君子正是敢順轉途者——轉身而去逃離血氣無望戰圈，唯有繞往主光專為聖徒所築就的新勝荒甸！」（KC）。此筆直致將被擋遷走演譯為堅立信程自潔不倚塵情的好碑。
