definition: |
  在曠野行程將盡、新代以色列後眾回返加低斯燥渴山谷時，民數記第二十章記載了希伯來先知首席摩西身處絕途喧嘩中所遭遇的最慘重跌倒悲役：「摩西舉手，用杖擊打磐石兩下，就有許多水流出來，會眾和他們的牲畜都喝了。」與出埃及記第十七章利非訂「初度磐石擊碎出泉」的至尊預表強相呼應且又全然逆回：當年上帝是公開站穩岩崖之前，直接敕旨摩西提拿擊打長江之杖狠狠向死岩打落，象徵那即將前赴十架蒙受創打的至高聖靈中保——耶穌基督——唯因挨吃一次酷打便敞開永遠全勝的流恩大幕（ 參 來七27； 1-2 ）。而如今四十年歲寒將屆，這群新生庶流遇到枯口難堪再度循故老狂詬喊罵之夕，上帝極具憐愍與忍恕的定訓根本不是要動怒杖刑，乃是溫聲吩咐摩西和亞倫拿手擎榮光聖杖：「在他們眼前向磐石說話，磐石就必發出水來。」
  黃迦勒之《文摘》及丁良才《拾穗》皆痛快批點這致命的落差內膜：摩西積欠了長逾四十載遭頑愚之眾日辱刻磨的心理重荷，一時受口氣激發、靈智昏憒，遂在大會聚落之前失守敬畏：一則越俎代庖吐出高妄與恨厲言責：「你們這些悖逆的人聽說吧！我與亞倫為你們使水從這磐石中流出來嗎？」這把拯救聖靈本有的大權歸納為自我的自矜施能；二則他公然輕逆上旨「惟靠發言調水」的無玷象徵，竟然提拿舊性粗魯長桿衝鋒高岩一連盲率連砸整整「兩下」。 KingComments與BibleHub直批斯舉不僅是僕役急火氣粗，實質在舊約預表工廠裡構成極為慘重的屬靈摧壞——因其企圖讓已被擊受辱無須復死的磐石主權再次受重拳暴掠，打破「基督一次成聖獻出活水」的完美靈泉宣揚；雖天主仍憫慈寬恩放暴泉水賜給牛童快慰，然而其錯必引發無法寬饒的高座重判。
accumulations:
  - book: "民數記"
    chapter: 20
    summary: "詳記於加低斯重蹈缺水狂亂時，摩西不顧上帝但限其站前『向磐石說話』之溫恤旨令，急氣大噴血誓喝眾為悖逆之輩並擅舉老木神杖一連狂敲石嶺兩把而犯天怒。"
    relation: "徹底劃明第一度利非訂杖打與加低斯但需呼求言明的預表位階層次；指正恩保既已忍苦一回，天下眾信與臣牧此後不可妄逞一私氣血、憑仗重弄殺戮手腕宣主赦憐。"
