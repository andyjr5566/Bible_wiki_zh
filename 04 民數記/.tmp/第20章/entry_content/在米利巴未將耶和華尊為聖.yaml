definition: |
  在民數記第二十章描畫摩西失態重砸石岩換引涼濤事況落幕一瞬，神主自虛空垂下的天罰審判毫無含混與縱私遲緩，其一字千斤地將整起爭亂得名歸咎與罪狀定讞告諭世途：「因為你們不信我，不在以色列人眼前尊我為聖，所以你們必不得領這會眾進我所賜給他們的境涯去。」此間宣告不僅為當地的干戈賦名為第二個歷史「米利巴（ strife ；亦叫爭鬧）」，更宣告了一個令人震顫的聖法規準：事奉神的重任之王與領銜官司，哪怕其名深重如摩西、長大如亞倫，凡敢於事奉行動間忽捨順信天意、倒錯主尊之席者，縱獲垂垂半世紀血戰戰果，仍然難逃威光如洗的「未尊為聖」大掠免權。
  黃迦勒《基督徒文摘》與丁良才《拾穗》等多維典釋深刻揭穿這神學罪本的三道交芒：其一，「不信我」，摩西和亞倫見民眾咆哮吼罵而忘記全主全能的應許慈悲，質疑光憑安閒說話能否平解滔滔眾憤，轉取一腔狂急去賣弄暴刑神杖力氣；其二，「不尊上帝為聖」，神宰本旨願藉平柔甘意開裂冷崖施捨浩水來顯出極為寬宥、有別於世界仇恨的神恩聖化容顏，摩西卻搶登台上盛逞其一人血氣臭怒與責謾咒斥（「我們……使水流出嗎？」），致使全眾目睹到的是暴人私焰而並非上蒼聖潔長厚；其三，這一沉墮觸犯了最高律法的公正一致，如KingComments與BibleHub直白剖解，正因為神得依舊於泉心大顯為聖，就堅拒姑息領主掩天威的大禍。兩席最崇的開創元勳受定奪取了領導足踐奶蜜良甸之契，留下警勸古今世途一切主役：越居至真聖工的代表，其遭主眼察驗自淨奉奉「為聖」的比重也無比嚴毅龐峻。
