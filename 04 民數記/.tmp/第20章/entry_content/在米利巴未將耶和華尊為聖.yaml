    summary: "記載耶和華對摩西及亞倫於磐石開水戰役中擅自震怒怒責且連擊聖石兩舉宣下沉毅法責；斷定二伯怠犯了『不信我與不正在群民仰盼前面尊天意為至聖』，奪決二人涉境迦南的大志並賜名新泉稱作米利巴之戰見證。"
    relation: "架設起事神代表與顯揚神明本聖雙峰同齊之絕對誡綱；直示救賞再廣、神功再著，縱有稍微凌越主意私賣暴狂而辱遮靈王聖愛者，必於至上公正法壇遭受相應的至誠失榮剪決。"
