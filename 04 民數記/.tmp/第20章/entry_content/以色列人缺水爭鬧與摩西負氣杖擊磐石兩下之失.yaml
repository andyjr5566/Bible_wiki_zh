name: "以色列人缺水爭鬧與摩西負氣杖擊磐石兩下之失"
type: "事件"
secondary_types:
  - "神學"
  - "歷史"
status: formal
definition: |
  在中東曠野遷徒程途中，會眾再駐加低斯之時逢遇井溪枯旱乏水，新生代民眾如同被懲之前民皆然，群情洶湧而聚合攻擊領導使僕，深恨何沒共殞在昔日苦瘟沉灰中；神主悲仁賜令摩西攜取昔昔震威手杖與兄同迎枯巖，「吩咐」是固石大放浩湯喜流；豈料摩西遭激負性而心潮失律，未仰王誠宣告主德，反而怒叱「背叛者豈我為爾推泉」，且率情揮揚杖頭一連兩下敲殛巨岩；雖上帝慈憫果出滾滾奔泉以解愚氓乾苦，然如此輕藐尊言之驕怒與逾制殛殺，宣告了歷史上領袖越權不顧主見證的浩劫巨憾。
accumulations:
  - book: "民數記"
    chapter: 20
    summary: "面對新一代子民重發乾枯爭喝舊怨的痛鬥，神王原示僅消純詞一言直遣大巖推蜜；奈摩西狂怒狂擊磐石雙波，成就違逆主德自高見證之巨大遺恨。"
    relation: "明定服事高主絕對不容率意使血氣高奪王廷名份，向後邦宣明拯救本源歸依恩信言靈而決不屬人工憤罰。"
    content: |
      以色列民群自起程三十八秋深抵枯谷時，心田的飢渴焦燥毫不劣減往歲：「會眾沒有水喝，就聚集攻擊摩西、亞倫... 耶和華曉諭摩西說：『你拿著杖去... 在他們眼前吩咐磐石發出水來...』 摩西說：『你們這些背叛的人聽我說：我為你們使水從這磐石中流出來嗎？』摩西舉手，用杖擊打磐石兩下，就有許多水流出來...」（民二十2-11）。黃迦勒以鋒疾的刀刃向信仰領導之隱患開剖：「眾民雖為缺水無休叫喧、反咒長征好恩，其罪早定；唯上帝既出妙信只要神僕去『吩咐磐石』，意在向這般未馴小輩彰表唯恩獨恩！奈何摩西久經狂語摧磨競發己怒，口出兩次回環自大妄稱：『我為爾等招水否？』此皆致命字眼！他把天地獨運的光恩轉拉至一己怒潮下，更加一揮『兩擊』這早已表證一夕被受苦難重釘過好十字主座的榮神巨石！這既污損救贖不必二施的純真道源，也深重玷損他在神群面底至高的公義榜樣！」（CT）。

      丁良才與拾穗將這種領袖與信眾雙邊互動中的危度直呈於目：「猶太明道多認磐石久固即表萬春良源；人徒妄加手刃去行痛擊，不僅是不顧耶和華口諭，更意旨不甘純信無為之偉；幸虧大能者決不因臣虜狂妄便禁封慈河，先滾翻蜜溜恩飽畜氓，而後坐判定斷僕犯！」（GT）。BibleHub 把這一齣既有怒杖飛揮又有涼波傾注的故事喻為人世悲憐與王權奇勝的美恨交織：「世俗總想藉暴怒跟苦懲來挽復威榮，神說話只需簡默高宣即獲巨海；你揮兩擊，卻砍斷了使天君在百姓眼裡被尊仰為唯一慈光好榮的神聖機會！」（BH）。

      KingComments 更痛極流涕地追喊當代奉事之靈軍必須把持自謙心城：「僕人最巨危機莫如把別眾退步視作發揚一己高聖與狂叫的舞臺；你看摩西叱駡百姓為逆徒，又揚杖耀己力，自認代君執棍行威；上帝在斯宣告：你的驕鬧比小戶哭苦更加沉酷！看啊，至美喜冰縱流出救生，傲僕自己反斷阻前路！這乃訓昭爾永不以人意蓋奪主榮的千秋絕世大警鐘！」（KC）。此筆立將古途枯泉爭競煉造成照鑒信仰人心的無假良光。
