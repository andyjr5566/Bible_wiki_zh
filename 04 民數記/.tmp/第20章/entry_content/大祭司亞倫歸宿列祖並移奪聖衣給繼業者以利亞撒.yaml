name: "大祭司亞倫歸宿列祖並移奪聖衣給繼業者以利亞撒"
type: "神學"
secondary_types:
  - "人物"
  - "事件"
status: formal
definition: |
  在希伯來律例與神家世代興衰進程中，當長年勞勤卻難脫米利巴爭端負失的大祭司亞倫走至地旅盡期時，主道並未施暴斬斷其任，而命牽攜於高遠清嚴的何珥山頂施行史籍中最光芒奪目的信仰交銜：摩西敬拜命旨將大哥身上那一席閃熾金鑽及靈魂呼喚的大祭司聖潔錦衫一一解褪，原原本本密裹著繼嗣雄子以利亞撒；就在聖衣安披之際，老雄才氣極安止卒告終返於列祖陰靈長眠之邦，唯有新君伴父山下榮興；如此一剝與一重加，直宣告舊血氣朽散止盡、但上帝屬性榮工長年連鎖無止不斷之深湛至聖傳承。
accumulations:
  - book: "民數記"
    chapter: 20
    summary: "在何珥靜絕孤巔，老神伯亞倫順甘容褪至貴金袍大聖禮衫任子衣替，含歡息心辭世赴返神安舊祖居境。"
    relation: "藉打破一己常年在位私名榮寵，彰揚神天事業永恆寄身靈職寶衣；昭明勞歇死去絲毫不能使主旨天命稍止一步。"
    content: |
      希伯來舊世代隨征老首長如何走至終焉，此間未滿沉沉死氣，反多一番驚喜與高華：「『把亞倫的聖衣脫下來，給他的兒子以利亞撒穿上；亞倫必死在那裏，歸他列祖。』... 摩西把亞倫的聖衣脫下來，給他的兒子以利亞撒穿上，亞倫就死在山頂那裏... 全會眾，就是以色列全家，見亞倫已經死了，便都為亞倫哀哭了三十天。」（民二十26-29）。黃迦勒在字幕長吟間發露救恩傳承的永活好蜜：「看這妙境！這裡並不容情哀說一席哭歌；『聖衣脫去又向兒子套築』，乃向全世界呼釋極震撼的好音：侍者歲促命限，唯代表求告替宥的王靈任份與聖膏權火毫不死毀！老大祭司縱經缺失須得受死歸祖，那一席無污之衣依舊隨青年良儲重光；你看那是父去老歲塵退、新恩春苗無邊繁生，老舊的肉體事奉終告安寢，唯長春的大祭司基督職事常燃向今永立不敗！」（CT）。

      丁良才與拾穗隨及由舊禮學論說埋殮未言的大秘密：「古傳家者咸嘆兩生下嶺竟莫招不潔之痛，故此盛讚上帝可能正如葬摩西之妙德一樣躬自為忠臣藏塚；這裡『剝脫』一詞字真且猛，毫不姑息舊情，然長子喜接好袍，就使滿門免於悲寒奪職，歡享事榮繼世；全區家黎為茲垂淚三十寒霄，追慕引者老去！」（GT）。BibleHub 將這一紙脫衫登赴冥途之作標為生死榮辱至高的安慰書：「老兵去矣、不留一絲悲慍於舊事；把最自豪的天名聖衣雙手拋讓後人，方能以心寬如野的好姿歸臥仙塚！」（BH）。

      KingComments 更揚鞭大讚斯事給全神國侍奉人師留守的最重寶金言銘：「人切休狂愚妄料一日沒有自己便倒地全休！神作工何等灑淨自在，老祭長命止何珥尖嵐，立有壯男手擁名衣直指長塗！永得抱定順甘脫放的偉大襟懷；你要知道：你我不過是天光寶著片刻過境之薪火；你一日走息，造王自有浩無餘悔的美恩長在，驅策年輕繼役持冠衝上最偉大之榮耀黎明！」（KC）。此言厚厚把死之寂愁翻轉為天工傳永生不滅的光耀詩賦。
