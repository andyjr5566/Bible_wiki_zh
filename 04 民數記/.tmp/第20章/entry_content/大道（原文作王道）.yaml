name: 大道（原文作王道）
type: 文化
status: formal
definition: '民數記20:17：「只走大道（原文作王道），不偏左右，直到過了你的境界」；第19節以色列人再說一次：「我們要走大道上去」。


  **這條路在哪裡。** GT《啟導本聖經註釋》給的走向最具體：「“大道”當系指外約但溝通南北的通商大道，從阿卡巴灣口直上大馬色（今大馬士革）。」GT《民數記串珠聖經註釋》的描述相同：這是「約但谷東面高原南北直通之路」，走這條路可省時省力。GT《聖經精讀本──民數記註解》寫得更細：「指從約旦東向北,經過亞摩利和摩押以及以東到達以旬迦別的國際大道及其支路。」BH 補上它的商業份量：這是一條從亞喀巴灣通到大馬士革的古代貿易幹道。


  **為什麼非走這條不可。** GT 丁良才《民數記註釋》從地形解釋：「從亞拉巴到以東山地有一條深溝，沿路有好些泉源和草地，在以東西邊，以色列人往來，只有這條路可走。」換句話說，以色列人不是挑一條方便的路，是只有這一條路可走。


  **它有多老。** GT《靈修版聖經註釋》指出：「大道（原文作王道）是古代車隊所行走之道路。在以色列人來到之前，早已成為主要的公路。」


  **走這條路的承諾。** CT 說明以色列人為什麼特別聲明只走大道：意指不會騷擾居民，破壞他們的安寧，造成不便等；不喝井裡的水的意思也不是滴水不沾，而是「不免費汲水(參19節)」。'
accumulations:
- book: 民數記
  chapter: 20
  summary: STEP 原文資料把和合本的小字註直接印證了。第17節的「大道」在原文是兩個字：דֶּרֶךְ（De.rekh，H1870I）加 מֶלֶךְ（ha./Me.lekh，H4428I），而 STEP 給這兩個編碼的簡要義域分別就是「(King's) Highway」與「King's」——也就是說原文本身寫的是「王的道路」，正是和合本小字所註的「原文作王道」。同一節「不偏左右」的「偏」是 נָטָה（ni.Teh，H5186），「右」是 יָמִין（ya.Min，H3225G）、「左」是 שְׂמֹאל（u./se.Mol，H8040G）。
  relation: 這條路是本章外交交涉的實質標的：以色列要的不是以東的土地、水或作物，只是通行權。CT 逐句列出這份保證的內容——不走田間和葡萄園意指僅僅經過絕不踐踏損壞作物，若喝水必給價值，只求快快通過。被拒絕之後，以色列被迫繞遠路，民21:4 記下百姓因這路難行、心中甚是煩躁，火蛇之災就發生在那一段。這條大道日後仍是外約但的主幹道，民21:22 以色列向亞摩利王西宏提出的請求用的是同一套說詞。
