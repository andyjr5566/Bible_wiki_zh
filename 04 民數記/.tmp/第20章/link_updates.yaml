book: "民數記"
chapter: 20
updates:
  - target: "米利暗"
    book: "民數記"
    chapter: 20
    summary: "記述引導過黃洋聖蹟與身處哈洗羅爭論後的新晨極限，在漂流期屆滿四十年春至時，領袖先鋒群一號人物女先知米利暗終逝死並下沉封丘於加低斯安靜黃地。"
    relation: "開啟第一世代屬血氣之帶領階層逐出凡途轉辭的無私見證；確認了律政判決之客觀絕無親疏留情。"

  - target: "加低斯"
    book: "民數記"
    chapter: 20
    summary: "身作往夕三十八年前大辱退征與審定流散的哭地，今日於野期遲遲第四十寒年首度在臨；成就為收容女先知米利暗卒葬古墓、且再度為渴奔出水引誘摩西暴擊聖岩的神罰名所。"
    relation: "作為舊以色列漫荒苦途始末交叉的大事記名驛，彰驗出雖過四十年苦訓人性爭鬧本質依舊軟軟難改的深默教訓。"

  - target: "磐石出水"
    book: "民數記"
    chapter: 20
    summary: "相較第一度於利非訂奉上帝公旨狠擊岩角放溪，第二次於加低斯荒淵上帝唯令「出言說話」引渠；無奈摩西憤怒喊斥且盲狠擊兩掌，致雖然浩水重奔暢解牛牧狂渴，神老大怒奪權。"
    relation: "確立初次打擊足以全預基督一度為眾挨痛破創化赦的好泉；嚴白禁阻二次以舊血氣仗手重折恩賜主威之僭舉。"

  - target: "米利巴（Meribah）"
    book: "民數記"
    chapter: 20
    summary: "繼往史出埃及記初賜名後，上主因此次以色列民眾在大旱中再掀喧呼痛抗與領袖狂為，依神威本有護光再次敕命名曰「米利巴（爭吵挑釁水之地）」，垂諸常範。"
    relation: "將人性頂撞強索之爭與上帝無懼爭鬧逆風仍存善顯聖救靈雙重奇威同留永久名碑。"

  - target: "以東"
    book: "民數記"
    chapter: 20
    summary: "作為承接古始弟兄世嗣的以掃之國，在接到摩西請求依順王家大道謙讓借過而且互不折騷苦井良草時，擺出凶怒臉相堅定拒言免道並親拉厚戈鐵馬嚴封堵防。"
    relation: "標示出舊土親疏敵對與排他猜恨對神民遷往迦南的長期地緣牽絆；為後來諸王與審罰經史投射遠祖嫌嫌根恨。"

  - target: "亞倫"
    book: "民數記"
    chapter: 20
    summary: "受因米利巴挑泉失態未將神名舉聖之共判，行屆一百二十三歲長眉大始祖亞倫恭承神召共跋至以東極頂何珥雲峰；任袍解卸後平泰善安息離卒於高臺，引得百萬幕陣垂傷痛哭三十朝。"
    relation: "畫定人身祭長至高功勛不能免罪超越人軀死亡大界；帶引永恆長安耶穌那毫不受終朽隔阻的極致常在聖任。"

  - target: "以利亞撒"
    book: "民數記"
    chapter: 20
    summary: "依順上宰慎選與全群眾目直視的宏觀場景底，隨親直涉極聳何珥荒頂；被嚴格剝傳掛下父長亞倫一身表彰萬神大赦祈靈至強的祭司巨服，正式繼升世長繼位接宗。"
    relation: "護定屬天中保禱護與大祭司禮法工課之傳承無縫一氣長存；打爛群眾懷疑叛猜以確立天道任命一脈堅強。"
