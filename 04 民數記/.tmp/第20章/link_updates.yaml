book: 04 民數記
chapter: 20
updates:
- title: 米利暗
  path: link_folder/人物/米利暗.md
  summary: 民數記20:1：「米利暗死在那裡，就葬在那裡。」地點是尋的曠野的加低斯，時間是出埃及後第四十年正月。
  relation: CT 的〔話中之光〕把她的一生分成三段來對照：「女先知米利暗在幼年時的表現何其勇敢(參出二7~9)，在中年時領導歌舞何其振奮人心(參出十五20~21)，然而在老年時竟因嫉妒而失敗(參民十二1~2)。」KC 的觀察在民12 之後補了一段：她自從攻擊摩西的權柄以後幾乎沒有再出現過，也許再沒有取回從前的地位；他由此提出一個教訓——一個人的大罪即使得了赦免，也未必能取回犯罪以前在神工作中的影響力。他並指出她的死使出埃及的喜樂沉寂：那是她過紅海之後唱出來的喜樂（出15:20-21）。GT《民數記串珠聖經註釋》記下她與亞倫相隔五個月先後離世，BH 則把她的死讀成一個世代的結束。
- title: 加低斯
  path: link_folder/地點/加低斯.md
  summary: 民數記20:1、14、16、22：以色列全會眾住在加低斯，摩西從加低斯差遣使者去見以東王，最後從加低斯起行到何珥山。第16節以色列人自己說：「如今，我們在你邊界上的城加低斯。」
  relation: 這是加低斯在民數記裡的最後一次出場，而且是一次回頭。CT 算過這筆帳：「以色列人從加低斯(參十三26)到加低斯，其間，過了三十八年，不知走了多長的路，結果卻仍在原地踏步。」GT 丁良才《民數記註釋》指出這是「以色列全會眾末次都聚集到加低斯」，並引申1:46 說以色列人在加低斯住了許多日子。BH 補上考古上的線索：加低斯被認定為 Tell el-Qudeirat 遺址，當地發現過古代防禦工事的遺跡。本章也再次帶出加低斯屬於哪個曠野的老問題——民13:26 說是巴蘭曠野，本章第1節說是尋的曠野。
- title: 以東
  path: link_folder/地點/以東.md
  summary: 民數記20:14-21：摩西差使者去見以東王求借道；第23節說何珥山「在附近以東邊界」。
  relation: 這是以東第一次在敘事中正面拒絕以色列。GT《舊約聖經背景註釋》說明它的地理範圍與考古現況：以東是死海以南直到亞喀巴灣的地區，考古學家最近在本區幾個定居的遺址中挖掘到少量晚銅器時代的陶器，「但卻找不到建築物或文字記錄」，而埃及人稱這地區的遊牧民族為肖蘇（Shosu）。GT《啟導本聖經註釋》說明以色列為什麼想走這條路：「以東地位於死海之南，以色列人北上摩押，借道以東最便利。」被拒之後，以色列只能繞道，而 CT 指出後來神指示以色列人繞過以東地（參二十一4）。
- title: 以東與以色列的敵對
  path: link_folder/神學/以東與以色列的敵對.md
  summary: 民數記20:18、20：以東王兩次拒絕，第二次「就率領許多人出來，要用強硬的手攻擊以色列人」。
  relation: GT《民數記串珠聖經註釋》把這一次放在整條敵對線的起點上：「雖然以掃與雅各和解了，但他們的後裔卻世代對敵，以東人此際首次不念舊情，日後更變本加厲（參摩1:11）。」BH 從創25:23 給利百加的預言讀同一件事：兩國要從她腹中分出。但本章同時保留了另一面：GT 丁良才《民數記註釋》記下「以東人雖然這樣待以色列人，神卻禁止以色列人憎惡他們（申二十三7）」，而以色列雖有六十萬一千三百名能打仗的人，也沒有動武。KC 由此讀出一個原則：以東不只是一個民族，更是一種弟兄關係，這決定了以色列不可以向它爭戰。
- title: 磐石出水
  path: link_folder/事件/磐石出水.md
  summary: 民數記20:8-11：神吩咐摩西吩咐磐石發出水來，摩西卻「舉手，用杖擊打磐石兩下，就有許多水流出來」。
  relation: 這是磐石出水的第二次，也是唯一一次以審判收場。GT《啟導本聖經註釋》列出本章與出17 的三點不同：出埃及記只提摩西，此處提到摩西與亞倫；此處要摩西去拿杖，因這杖已擺在神面前；「也是最大的不同處，是神要摩西去吩咐磐石出水，而非像第一次那樣叫他擊石出水」。KC 另提出一個少見的推想：出17 那次流出的水一路跟著百姓走過曠野，大概因百姓的不信而乾了，所以他們如今才會沒有水。STEP 原文資料顯示本章的「磐石」是 סֶלַע（Se.la，H5553H，詞典義 crag），而出17:6 用的是另一個編碼（H6697H，詞典義 rock）。
- title: 磐石預表基督
  path: link_folder/神學/磐石預表基督.md
  summary: 民數記20:8、11：神吩咐向磐石說話，摩西卻擊打了兩下。
  relation: 本章把這個預表推進了一步：不只是磐石代表基督，而是「不可再打」本身有意思。GT 丁良才《民數記註釋》說得最白：「這磐石預表主耶穌（林前十4）。既然被擊打了一次（出十七6），就不可再打。摩西卻廢了這預表的意思」。CT 的靈意註解相同：擊打磐石表徵將祂釘在十字架上，基督既已被釘，就不能再將祂重釘一次。KC 把兩次的分別講成兩種杖：第一次用的是審判的杖，如今神要顯明自己是施恩的神，人只需向那磐石說話；他並引來7:25 說基督如今長遠活著替我們祈求。GT《聖經精讀本──民數記註解》從供應面收尾：磐石之所以能出水是因為神話語的能力，而不是摩西擁有任何能行神跡的能力。
- title: 林前10：4 靈磐石就是基督
  path: link_folder/互文/林前10：4 靈磐石就是基督.md
  summary: 民數記20:8、11 的磐石。CT、GT 丁良才、GT《聖經精讀本──民數記註解》與 KC 在本章都引了林前10:4。
  relation: 出17 是被擊打的那一次，本章是不該再被擊打的那一次——林前10:4 說那隨著他們的靈磐石就是基督，這句話因此在兩章之間得到不同的用法。GT《聖經精讀本──民數記註解》把新約的對應寫得最完整：神通過磐石耶穌基督，向高呼屬靈乾渴的人提供了屬靈的活水。BH 也在本章多處提到基督是那靈磐石，並把摩西未能尊神為聖與基督完全的順服對照。
- title: 賽53：4-5 磐石被擊打
  path: link_folder/互文/賽53：4-5 磐石被擊打.md
  summary: 民數記20:11：「摩西舉手，用杖擊打磐石兩下」。
  relation: 本章的重點正是已被擊打過一次就不可再打。CT 的靈意註解把兩件事連起來：擊打磐石表徵將祂釘在十字架上，基督既已被釘，就不能再將祂重釘一次，明明的羞辱祂（參來六6）。KC 說明第一次擊打的意義：因為基督被神擊打的手所擊打，活水的江河才湧出；那一擊發生在曠野旅程的起頭，而祂受苦「一次」是為義的代替不義的（彼前3:18）。從賽53 的角度看，本章記的是一個被擊打過的救主再一次被擊打——這正是摩西的錯處所在。
- title: 米利巴（Meribah）
  path: link_folder/原文/米利巴（Meribah）.md
  summary: 民數記20:13：「這水名叫米利巴水（米利巴就是爭鬧的意思），是因以色列人向耶和華爭鬧」。第24節再提一次：「因為在米利巴水，你們違背了我的命。」
  relation: STEP 原文資料顯示本章第13節的「米利巴」是 מְרִיבָה（me.ri.Vah，H4809H），而出17:7 的米利巴是 H4809G——兩處在 Extended Strong 上分屬不同編碼；同節「爭鬧」的動詞則是 רִיב（ra.Vu，H7378）。GT 丁良才《民數記註釋》也把兩處分開：「「米利巴」——就是加低斯的米利巴（二十七27，申三十二51）。還有一個米利巴（參出十七27，民二十七14注）。」GT《舊約聖經背景註釋》從地理上說明兩處的距離：「出埃及記十七章的米利巴水位於西乃山一帶，利非訂一地。如今他們則在利非訂東北偏北一百五十航空哩處的加低斯。然而地點雖異，此為爭鬧（米利巴）之水則一。」本章給這個名字加上了一層新的意思：出17 的爭鬧是百姓與摩西，本章第13節說的是「以色列人向耶和華爭鬧」，而爭鬧的結果是連摩西亞倫也一同受罰。CT 的〔話中之光〕點出一個對比：「「米利巴水」在人這一邊是爭鬧，但在神這一邊卻顯為聖。」
- title: 瑪撒米利巴是一次還是兩次
  path: link_folder/解經爭議/瑪撒米利巴是一次還是兩次.md
  summary: 該條目的定義直接寫到民20:1-13 記載加低斯另一次磐石出水、那地也叫米利巴，本章正是那一次。
  relation: GT《啟導本聖經註釋》在本章直接處理了這個問題，並列出三點不同：「1.《出埃及記》只提摩西，此處提到摩西與亞倫；2.此處要摩西去拿杖，因這杖已擺在神面前（十七10～11；二十8），此事顯然發生在亞倫的杖開花結果之後；3.也是最大的不同處，是神要摩西去吩咐磐石出水，而非像第一次那樣叫他擊石出水。」他的結論很明確：有人以為此處所記與《出埃及記》乃同一事，「其實，二事有很多不同處」。GT《民數記串珠聖經註釋》的判斷相同：兩段「是記載相距四十年在不同地方發生的事」。STEP 原文資料另提供了兩項可機械核對的差異：本章的「磐石」是 H5553H（詞典義 crag），出17:6 是 H6697H（詞典義 rock）；本章的「米利巴」是 H4809H，出17:7 是 H4809G。
- title: 十二探子自巴蘭或加低斯巴尼亞出發之解經爭議
  path: link_folder/解經爭議/十二探子自巴蘭或加低斯巴尼亞出發之解經爭議.md
  summary: 該條目的定義直接引了民20:1，指出民20:1 與民33:36 把加低斯放在尋的曠野。本章第1節正是那一句：「以色列全會眾到了尋的曠野，就住在加低斯。」
  relation: 本章的 GT 收了另一份專門處理這個問題的材料。GT 賈斯樂郝威《聖經難解經文詮釋手冊》給出三個並列的解法：「(1) 有些學者相信確實有兩個地方都稱為「加低斯」，而且個別在兩個不同的曠野中；(2)「加低斯」這個名稱可以指一個城市，也可指這個城市所位居的地區；(3)如果這個同一個城市是位在兩個曠野之間，如此兩地就合宜的被聯繫起來。」CT 在本章第1節也記下同一個分歧：有解經家認為此加低斯與民13 的加低斯不同，「不過，也有解經家認為它們同指一地(參申一19；二14)」。GT《舊約聖經背景註釋》則從地理上補一句：尋的曠野位於巴蘭曠野北面，「以色列居住有相當時日的綠洲加低斯，也是在尋的曠野裡面」。
- title: 受膏的祭司
  path: link_folder/人物/受膏的祭司.md
  summary: 民數記20:25-28：亞倫的大祭司職分在何珥山山頂移交給以利亞撒。
  relation: 這是大祭司職分第一次實際換人，而不是條例上的規定。GT《啟導本聖經註釋》說明它的份量：「亞倫祭司職位的轉移，為以色列民生活中的大事，因此要舉行儀式，為以利亞撒穿上亞倫的聖衣，讓會眾清楚看見，由亞倫開始的一個時代已告終結，由下一代繼起的新時代已經開始。」GT 丁良才《民數記註釋》從這裡看見整個制度的限制：「亞倫既死了，就顯明他為祭司的職分不完全（參來七23-25）。」GT《聖經精讀本──民數記註解》把限制分成兩層：祭司職分的不完全性與暫時性——人因罪惡和死亡不能完全履行職責，也只在活著的時候才能擔當職分，所以需要很多祭司。KC 補一個細節：以利亞撒是亞倫的第三個兒子，而三這個數字說到主耶穌第三天復活。
- title: 聖衣（祭司聖服）
  path: link_folder/主題/聖衣（祭司聖服）.md
  summary: 民數記20:26：「把亞倫的聖衣脫下來，給他的兒子以利亞撒穿上」；第28節記下實際執行。
  relation: 出28-29 是聖衣的製作與初次穿上，本章是它第一次從一個人身上轉到另一個人身上。GT 丁良才《民數記註釋》把這個對稱寫出來：「摩西既把聖衣給亞倫穿上（利八6-9），也就把這聖衣替他脫下來；後來大祭司的職分，一代一代也是這樣傳下來的。」CT 指出這個動作的份量：「聖衣的移交，代表事工職任的傳承，有時甚至代表聖靈能力的傳承(參王下二13~14)。」GT《聖經精讀本──民數記註解》把話說得最直接：大祭司實行祭司職務時必須穿上這件衣服，所以給以利亞撒穿上這件衣服「意味著接替大祭司的職分」。STEP 原文資料顯示這裡的「聖衣」是 בֶּגֶד（be.ga.Da/v，H899B，詞典義 garment），「脫下來」是 פָּשַׁט（H6584，to strip）、「穿上」是 לָבֵשׁ（H3847，to clothe）。
- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  summary: 民數記20:25-28：以利亞撒隨父親上何珥山，在山頂穿上亞倫的聖衣，與摩西一同下山；從這一刻起他是以色列的大祭司。
  relation: 民19 他還是奉命辦事的祭司，本章他接下了整個職分。CT 從這個安排讀出世代交替：亞倫表徵老的一代，以利亞撒表徵新的一代。KC 走得更遠，他指出以利亞撒是與「地」有關的大祭司——亞倫是帶領百姓走曠野路的大祭司，以利亞撒則要把百姓帶進那地；而在亞倫死之前，他親眼看見以利亞撒穿上了他的衣服。GT 丁良才《民數記註釋》另提到一個實務上的限制：「以利亞撒既受了大祭司的職任，連自己父母的屍體也不敢挨近，恐怕沾染不潔（利二十一11）」，因此埋葬亞倫的多半不是他。
- title: 杖
  path: link_folder/神學/杖.md
  summary: 民數記20:8-11：「你拿著杖去」「從耶和華面前取了杖去」「摩西舉手，用杖擊打磐石兩下」。
  relation: '**這根杖是誰的，四套來源在本章有明確分歧。** CT 註它是當日擊打磐石所用的杖（參出十七5~6）；GT 丁良才《民數記註釋》講得最明白：「這杖大約不是亞倫發過芽的杖（十七5），乃是摩西在埃及施行神跡的杖，11節原文作他的杖」；GT《民數記串珠聖經註釋》同一立場：「摩西所取的杖（9）並非亞倫的杖 （17:8），而是他領以色列人出埃及屢施神跡所用的杖（出4:2, 17）」。KC 的判斷相反，他認為摩西要拿的正是亞倫那根發過芽的杖。STEP 原文資料可以支持丁良才所說的「原文作他的杖」：第11節是 בְּמַטֵּהוּ（be./ma.Te./hu，H4294G）帶第三人稱單數所有格後綴，而第8節神說的只是「那杖」（ha./ma.Teh）——同一個 H4294G，正是民17 那個同時指「杖」與「支派」的字。GT《聖經精讀本──民數記註解》另提醒一件事：「摩西手裡拿著的杖本身不能發揮任何的能力。這個杖象徵神的權威」。'
- title: 耶和華的榮光
  path: link_folder/神學/耶和華的榮光.md
  summary: 民數記20:6：「摩西、亞倫離開會眾，到會幕門口，俯伏在地；耶和華的榮光向他們顯現。」
  relation: 本章的顯現與民16 那次不同：那一次榮光顯現之後是瘟疫，這一次沒有審判。KC 把這個對比講得最明白：耶和華這一次沒有像先前那樣用瘟疫管教百姓，沒有審判、也沒有怒氣，接下來要出現的是祂恩典的新證據。GT《舊約聖經背景註釋》說明榮光為什麼在這時顯現：摩西亞倫在危急關頭轉向神尋求帶領幫助，以懇求者的身分俯伏於地，「神的榮耀（kabod）因他們謙卑哀求而顯現，提供解決的辦法」。同一則註釋另指出神的光輝或能力以可見的方式出現在美索不達米亞史詩中十分普遍，他們稱之為梅嵐穆。BH 則把它讀成神留意百姓困境、預備施行拯救的記號。
- title: 曠野飄流四十年
  path: link_folder/歷史/曠野飄流四十年.md
  summary: 民數記20:1「正月間」是出埃及後第四十年正月；亞倫死於同年五月一日（民33:38）。本章是四十年飄流的終點。
  relation: 民14 記下四十年的判詞，本章記下刑期屆滿時的樣子。GT《啟導本聖經註釋》把這段空白說得很坦白：「曠野三十餘年的流浪生活，本書大半未予記錄。這期中百姓很可能逐水草而居，靠嗎哪而活，在曠野中繞行一周，又回到舊日傷心之地的加低斯。」KC 從另一面寫同一段：聖經對這四十年幾乎沒有記載，但那是一場死亡的行軍，天天有人死去，直到那不信的一代全部倒斃在曠野。不過同一份 GT《啟導本聖經註釋》也指出新一代確實不同了：「這一群飽曆艱辛，在風沙中鍛煉成熟的粗獷善戰之民」，與三十八年前聽到探子報告就號啕大哭的上一代比較，顯然已脫胎換骨。
- title: 以掃貪戀世俗（來12：16）
  path: link_folder/互文/以掃貪戀世俗（來12：16）.md
  summary: 民數記20:14：摩西向以東王稱「你的弟兄以色列人」。CT 在本節的靈意註解直接引來十二16：「『以東』是以掃的後裔，表徵貪戀世俗的人(參來十二16)。」
  relation: 創33 是雅各與以掃表面和好的那一章，本章是他們的後裔第一次正面翻臉。GT《民數記串珠聖經註釋》把這條線接起來：「雖然以掃與雅各和解了，但他們的後裔卻世代對敵，以東人此際首次不念舊情，日後更變本加厲（參摩1:11）。」KC 讀法相近但走屬靈的應用：以東的名字與亞當有關，以東代表我們的肉體，而肉體與神為仇（羅8:7）；對它不是爭戰，是照著聖靈行、繞過去。CT 的靈意註解走的是同一條線：借道而行表徵與肉體打交道，以東王拒絕表徵不能靠肉體行事，轉去離開他表徵不體貼肉體。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 民數記20 記下亞倫的結局：他與摩西一同受判詞（v12），在何珥山被脫下聖衣（v26、28），死在山頂，全會眾為他哀哭三十天（v29）。他死時一百二十三歲（民33:39）。
  relation: '**他為什麼連帶受罰。** CT 給了兩個可能：亞倫此時大概和摩西同心生會眾的氣；或當摩西舉杖時，亞倫沒有勸阻他。GT 丁良才《民數記註釋》的說法相近，並提醒第10節原文有「我們」兩個字。CT 由此歸出一條原則：遇到教會領袖明顯犯錯時，切莫置身事外。**他怎麼死的。** KC 指出他是在尊嚴與平安中離世，不是被從百姓中剪除，而且死前親眼看見兒子穿上了他的衣服。STEP 原文資料也顯示第29節「已經死了」用的是 גָּוַע（ga.Va，H1478），與第1節寫米利暗的 מוּת（H4191）不是同一個字。GT 丁良才《民數記註釋》另記下神對他的體恤：「這樣看來，神在亞倫活著（參十七章）和臨終的時候，都使他有大尊榮。」'
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 民數記20 是摩西一生的轉折點：他在米利巴擊打磐石兩下（v11），被神判定「不信我，不在以色列人眼前尊我為聖」（v12），因此不得領會眾進迦南。
  relation: '**錯在哪裡，各家的側重不同。** CT 說他前三步都照做了，錯在第四步；GT 丁良才《民數記註釋》數出五件錯：違逆主命、自大過分、不信神、不尊主為聖、擅自發怒。GT《聖經精讀本──民數記註解》講得最重：「他把自己的感情高舉在神公義的審判和神的話語之上,這就是摩西的過失。」CT 的〔話中之光〕點出實際的傷害：「摩西那一次的發脾氣影響到神的自己，把神也拖在裏面，叫以色列人分不清，以為流出水來給我們喝的是神，發脾氣罵我們的也是神。」**但本章同時記下他的另一面。** KC 把他在這一章遭遇的五件事列成一串——姊姊的死、百姓的暴動、自己的失敗與懲罰、以東的拒絕、哥哥的死——而他在這一連串打擊之後仍然「照耶和華所吩咐的行」（v27），KC 因此說他是我們面對挫折時的榜樣。'
- title: 何珥山
  path: link_folder/地點/何珥山.md
  summary: 民數記20:22-23、25、27：以色列全會眾從加低斯起行到了何珥山，神在這裡宣告亞倫的結局，三人當著會眾的眼前上了山。
  relation: CT 指出以色列人選這條路的實際考量：他們在這裡「避過正面與以東人發生衝突，離開以東人的視野」。GT 丁良才《民數記註釋》另提醒加低斯與何珥山未必只有一站路：「這兩個地方未必相離只有一站路。十33節顯明以色列人安營的地方，有時彼此相離幾天的路程。」CT 也註明神說話的位置：「會眾大概就在山腳下安營，而神就在山中某處(in mountain)對摩西、亞倫兩人說話。」這座山因此同時是一個地理座標與一個制度的界碑：亞倫的大祭司職分在山頂上結束，以利亞撒的職分在同一個山頂上開始。
- title: 大道（原文作王道）
  path: link_folder/文化/大道（原文作王道）.md
  summary: STEP 原文資料把和合本的小字註直接印證了。第17節的「大道」在原文是兩個字：דֶּרֶךְ（De.rekh，H1870I）加 מֶלֶךְ（ha./Me.lekh，H4428I），而 STEP 給這兩個編碼的簡要義域分別就是「(King's) Highway」與「King's」——也就是說原文本身寫的是「王的道路」，正是和合本小字所註的「原文作王道」。同一節「不偏左右」的「偏」是 נָטָה（ni.Teh，H5186），「右」是 יָמִין（ya.Min，H3225G）、「左」是 שְׂמֹאל（u./se.Mol，H8040G）。
  relation: 這條路是本章外交交涉的實質標的：以色列要的不是以東的土地、水或作物，只是通行權。CT 逐句列出這份保證的內容——不走田間和葡萄園意指僅僅經過絕不踐踏損壞作物，若喝水必給價值，只求快快通過。被拒絕之後，以色列被迫繞遠路，民21:4 記下百姓因這路難行、心中甚是煩躁，火蛇之災就發生在那一段。這條大道日後仍是外約但的主幹道，民21:22 以色列向亞摩利王西宏提出的請求用的是同一套說詞。
