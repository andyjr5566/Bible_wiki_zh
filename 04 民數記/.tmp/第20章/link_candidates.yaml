candidates:
  - name: "女先知米利暗卒於加低斯為肉體軟弱與領袖管教見證"
    type: "事件"
    status: "formal"
    summary: "於以色列民漂流曠野長涯滿四十年之正月初，全會眾再度步向當初墜入重恥的加低斯孤境；曾於紅海率舞揚歌的女先知米利暗於茲宣告氣絕命安並就地藏墳，其未逮進踏迦南榮境的結局深刻彰現上主對靈導高層肉體驕軟與舊歲漫宿管教的凜然法則。"
    occurrences:
      - "民20:1"
    source_refs:
      - "ccbiblestudy CT: 民20:1 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "ccbiblestudy GT: 民20:1 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "KingComments: Num 20:1 death of Miriam（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "BibleHub: Num 20:1 death and burial of Miriam（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "大祭司亞倫歸宿列祖並移奪聖衣給繼業者以利亞撒"

  - name: "以色列人缺水爭鬧與摩西負氣杖擊磐石兩下之失"
    type: "事件"
    status: "formal"
    summary: "當民群重陷枯旱苦谷毫無靈漿引解時，新代狂民竟如舊人痛詬領袖威逼離埃赴絕路；神宰慈宣但出純語吩咐磐石放泉，摩西卻負怒怨訶會群反以牧杖狠擊巨石兩回，彰出僕士於群情波瀾裡遺忘獨信宣信、狂執自我高揭的靈海遺恨。"
    occurrences:
      - "民20:2-11"
    source_refs:
      - "ccbiblestudy CT: 民20:2-11 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "ccbiblestudy GT: 民20:2-11 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "KingComments: Num 20:2-11 striking the rock twice（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "BibleHub: Num 20:11 smiting the rock with the rod（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "米利巴水之地顯神至聖與禁止摩西進加南之地威名"

  - name: "米利巴水之地顯神至聖與禁止摩西進加南之地威名"
    type: "神學"
    status: "formal"
    summary: "神王縱以深恩憐信施讓荒溪暴灌足供黎兆暢飲，依仗神恩彰出永世不同流俗的絕對榮域並更稱該泉為爭鬧見證米利巴；同期天主嚴直對不奉純心高舉主意為聖的摩西與亞倫發下奪權哀諭，宣告二老失權率徒步登流奶果盈應許美甸。"
    occurrences:
      - "民20:12-13"
    source_refs:
      - "ccbiblestudy CT: 民20:12-13 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "ccbiblestudy GT: 民20:12-13 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "KingComments: Num 20:12-13 punishment of Moses and Aaron（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "BibleHub: Num 20:12 not believe to sanctify Me（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "以色列人缺水爭鬧與摩西負氣杖擊磐石兩下之失"

  - name: "以東王斷然拒絕摩西行使大道經界並遣重兵驅逐"
    type: "歷史"
    status: "formal"
    summary: "摩西向擁有古遠弟兄血源以掃家胄出使以東王廷，虔諾自費薪資踏循官廷王家公路絕不傷田踐莊及掠食清井；詎料頑劣主侯冷心斷棄懇情，提領盛陣兵革強持威兵嚴遏防境，迫使以色列不借刀戈順祈主旨旋塗遶行他塗。"
    occurrences:
      - "民20:14-21"
    source_refs:
      - "ccbiblestudy CT: 民20:14-21 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "ccbiblestudy GT: 民20:14-21 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "KingComments: Num 20:14-21 Edom refuses passage（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "BibleHub: Num 20:20 Edom came out against him（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "摩西和亞倫當會眾前面登陟以東疆域邊旁何珥山頂"

  - name: "摩西和亞倫當會眾前面登陟以東疆域邊旁何珥山頂"
    type: "地點"
    status: "formal"
    summary: "於轉離以東國界干戈後，浩長軍旅抵泊接毗以東近防林澤的巍巍地標何珥良山；神宰命示摩西領伴垂暮老神長亞倫以及待任貴儲以利亞撒公開受萬千軍萌肅然遠矚踏山攀雲，於靜穆絕頂展開榮枯謝罪與舊制新世歷史重交。"
    occurrences:
      - "民20:22-25"
      - "民20:27"
    source_refs:
      - "ccbiblestudy CT: 民20:22-25, 27 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "ccbiblestudy GT: 民20:22-25, 27 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "KingComments: Num 20:22-25, 27 Mount Hor boundary of Edom（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "BibleHub: Num 20:22 in sight of all the congregation（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "大祭司亞倫歸宿列祖並移奪聖衣給繼業者以利亞撒"

  - name: "大祭司亞倫歸宿列祖並移奪聖衣給繼業者以利亞撒"
    type: "神學"
    status: "formal"
    summary: "在冷肅高敞的何珥峰尖，摩西親赴遵行王宰密詔把亞倫身上象徵無雙天民代祈贖愆的大祭司榮光聖衫珍切為解並轉被授其承嗣好首以利亞撒；亞倫於焉含安卒赴冥土列仙安歸，萬世社群仰泣三十寒晨告奠舊靈幕首長之勞歇與浩任之未死留續。"
    occurrences:
      - "民20:26"
      - "民20:28-29"
    source_refs:
      - "ccbiblestudy CT: 民20:26, 28-29 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "ccbiblestudy GT: 民20:26, 28-29 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "KingComments: Num 20:26, 28-29 transfer of holy garments to Eleazar（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "BibleHub: Num 20:28 stripped Aaron of his garments（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "女先知米利暗卒於加低斯為肉體軟弱與領袖管教見證"
