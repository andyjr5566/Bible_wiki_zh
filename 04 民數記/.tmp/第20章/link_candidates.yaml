candidates:
  - name: "米利暗卒於加低斯"
    type: "事件"
    status: "formal"
    summary: "以色列人漂流曠野三十八年後，於第四十年正月初一全隊抵達尋的曠野之加低斯；女先知米利暗在此終老離世並埋葬當地，宣告一代引領出埃及經歷大紅海讚揚高蹈的歷史先知因肉體驕軟與漫長審判正式交卸勞作。"
    occurrences:
      - "民20:1"
    source_refs:
      - "基督徒文摘: 民20:1 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "拾穗與舊約聖經背景註釋: 民20:1 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "研經註解: KingComments Num 20:1 death of Miriam（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "研經註解: BibleHub Num 20:1 death and burial of Miriam（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "亞倫卒於何珥山與祭司職任更替"
      - "加低斯"

  - name: "摩西擊打磐石兩下"
    type: "事件"
    status: "formal"
    summary: "在加低斯乾旱荒谷，會眾因絕境缺水放肆爭鬧痛詬神僕；耶和華本命摩西與亞倫手持職杖召集千黎「向磐石說話」便必湧現長奔救命狂水，摩西卻負激於憤怒怒斥群體為『悖逆的人』並擅自提杖舉手狠擊巨石兩回。"
    occurrences:
      - "民20:2-11"
    source_refs:
      - "基督徒文摘: 民20:2-11 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "拾穗與舊約聖經背景註釋: 民20:2-11 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "研經註解: KingComments Num 20:2-11 striking the rock twice（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "研經註解: BibleHub Num 20:11 smiting the rock with the rod（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "在米利巴未將耶和華尊為聖"
      - "磐石出水"
      - "米利巴（Meribah）"

  - name: "在米利巴未將耶和華尊為聖"
    type: "神學"
    status: "formal"
    summary: "儘管耶和華存忍恤信讓荒岩噴射奔流滿足眾兆乾渴，神王依舊直斥摩西與亞倫因血性狂傲與懷疑致『不信我在以色列人眼前尊我為聖』，就此降下嚴肅定讞：剝奪二位舊老引領本國軍眾涉越應許迦南金境的最後榮恩。"
    occurrences:
      - "民20:12-13"
    source_refs:
      - "基督徒文摘: 民20:12-13 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "拾穗與舊約聖經背景註釋: 民20:12-13 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "研經註解: KingComments Num 20:12-13 failure to sanctify God（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "研經註解: BibleHub Num 20:12 because ye believed me not（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "摩西擊打磐石兩下"
      - "米利巴（Meribah）"

  - name: "以東王拒絕以色列人假道"
    type: "歷史"
    status: "formal"
    summary: "摩西遣使從加低斯致書擁有以掃血緣的弟兄邦侯以東王，言辭謙誠闡敘過往出埃受劫與當下渴求行駛中央商貿大路王道之宿願，應諾買資而吃決不傷害半畝農井；奈何以東鐵心重拒並遣厲陣鐵騎耀武堵截，迫使上民轉走遶行。"
    occurrences:
      - "民20:14-21"
    source_refs:
      - "基督徒文摘: 民20:14-21 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "拾穗與舊約聖經背景註釋: 民20:14-21 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "研經註解: KingComments Num 20:14-21 Edom refuses passage（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "研經註解: BibleHub Num 20:20 Edom came out against him（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "以東"
      - "何珥山"

  - name: "何珥山"
    type: "地點"
    status: "formal"
    summary: "座落於以東嚴闊疆界近旁的巍巍山脊，即為以色列大軍受以東抗讓而退轉駐紮的極肅古地；耶和華欽點摩西伴著高垂暮宿的亞倫及子以利亞撒步登山麓嶺巔，在千本萬目見證底下實施終生職權革換與行禮傳代。"
    occurrences:
      - "民20:22-25"
      - "民20:27"
    source_refs:
      - "基督徒文摘: 民20:22-25, 27 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "拾穗與舊約聖經背景註釋: 民20:22-25, 27 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "研經註解: KingComments Num 20:22-25, 27 Mount Hor boundary of Edom（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "研經註解: BibleHub Num 20:22 mount Hor by the coast of Edom（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "亞倫卒於何珥山與祭司職任更替"
      - "以東"

  - name: "亞倫卒於何珥山與祭司職任更替"
    type: "神學"
    status: "formal"
    summary: "在何珥靜肅山顛，摩西遵守主旨將大祭司身上極表恩澤擔罪的舊造聖衣解卸完始裝轉著其新儲世承之子以利亞撒肩前；亞倫隨宣終齡百八三寒卒臥山尖榮歸祖國，會幕百萬部眾聞言放哀為茲垂舊率督致悲仰嘆三十長日。"
    occurrences:
      - "民20:26"
      - "民20:28-29"
    source_refs:
      - "基督徒文摘: 民20:26, 28-29 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT20.htm）"
      - "拾穗與舊約聖經背景註釋: 民20:26, 28-29 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT20.htm）"
      - "研經註解: KingComments Num 20:26, 28-29 transfer of holy garments to Eleazar（https://www.kingcomments.com/en/bible-studies/Num/20）"
      - "研經註解: BibleHub Num 20:28 stripped Aaron of his garments（https://biblehub.com/study/numbers/20.htm）"
    cross_references:
      - "何珥山"
      - "米利暗卒於加低斯"
