book: 民數記
chapter: 28
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 耶和華藉摩西把每日、安息日、月朔和春季節期的公共獻祭條例吩咐以色列人。GT 與 KingComments 把本章放在第27章領袖交接之後閱讀：摩西將離世，神所指定的敬拜秩序卻繼續。
  relation: 本章的摩西主要是忠實傳令者；他個人的終程不改變神當得的祭物。領袖可更換，群體向神的日常、每週、每月和年度敬拜不能隨之中斷。
- title: 供物（qorban）
  path: link_folder/原文/供物（qorban）.md
  summary: 第2節「我的供物」是 STEP H7133A qarban，陽性單數附屬形並帶第一人稱單數後綴；CT 的原文字義列為奉獻物、禮物。它與「我的食物、我的火祭、我的馨香」共同構成全章總綱。
  relation: qarban 不只說人拿來的東西，也在詞形上被標為屬神。它把後續所有精確數量放回關係中心：祭物按神指定的時間靠近並獻給祂。
- title: 火祭（isheh）
  path: link_folder/主題/火祭（isheh）.md
  summary: 第2、3、6、8、13、19、24、27節反覆稱祭物為火祭；STEP 以 H801 isheh 標示這個祭壇用語。CT 解釋，祭物全部或一部分燒在壇上，都可用火祭概括。
  relation: 本章以火祭把每日羊羔、月朔祭牲和節期祭牲連成一套獻給神的公共敬拜；它是獻祭方式的總稱，不能因此抹去燔祭、素祭和贖罪祭各自功能。
- title: 馨香之氣
  path: link_folder/神學/馨香之氣.md
  summary: 第2、6、8、13、24、27節反覆說祭物成為馨香。STEP 在第2節辨認 H7381 re.ach「香氣」和 H5207 nichoach「舒暢／悅納」，其中 H5207 帶第一人稱單數後綴，與「我的供物」系列呼應。
  relation: 馨香描述祭物蒙神悅納，不是評估實際氣味。四套註釋都由此發展敬拜或基督獻祭的解讀；原文層可確認詞彙組合，神學意義仍由獻給耶和華的上下文支持。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: STEP 的 H5930A olah 在本章出現十四次；每日、安息日、月朔、無酵節與七七節都以燔祭為主要祭類。KC 特別注意本章燔祭遠多於贖罪祭，解讀為祭物全然歸神的重心。
  relation: 燔祭是全年公共敬拜的骨架：每日一早一晚不斷，特殊時日再增加牛、羊與羊羔。各註釋的基督預表屬神學發展，經文直接層則強調全然焚燒、馨香與無殘疾。
- title: 每日獻祭（常獻燔祭）
  path: link_folder/神學/每日獻祭（常獻燔祭）.md
  summary: 第3-8節規定每日兩隻一歲、無殘疾的公羊羔，早晨與黃昏各一隻，並各配細麵、油和酒。STEP 以 H8548 tamid 表示持續、不間斷，第6節又說這祭已在西乃山命定。
  relation: 常獻燔祭是全章不可取代的底層；安息日、月朔、無酵節和七七節祭物一律加在它之外。它使群體每天開始和結束都由同一套向神的奉獻環抱。
- title: 在黃昏的時候
  path: link_folder/原文/在黃昏的時候.md
  summary: 第4、8節指定每日第二隻羊羔在黃昏／晚上獻上。STEP 顯示片語由 H996G「在……之間」加 H6153 的雙數「兩個晚上」構成，兩節使用相同原文時間結構。
  relation: 中文兩節分別譯「黃昏的時候」和「晚上」，原文卻把它們連成同一固定時段。這為常獻燔祭提供每日第二個時間錨點，與早晨祭前後相應。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: 本章所有燔祭依祭牲大小配上細麵調油的素祭：公牛每隻三個伊法十分量、公羊兩個、羊羔一個；第26節七七節的 H4503G minchah 又受 H2319H「新的」修飾。
  relation: 素祭在本章不是獨立散落的附註，而是燔祭的固定配套，也把穀物收成帶入公共敬拜。七七節「新素祭」顯示同一祭類可特別使用新收成。
- title: 伊法
  path: link_folder/原文/伊法.md
  summary: 第5、9、12-13、20-21、28-29節以伊法十分之一、十分之二、十分之三計量細麵。STEP 以 H374 ephah 標示容量單位，H6241 issaron 則表示一個伊法的十分量，且在本章反覆十三次。
  relation: 伊法與欣分別計量乾料和液體；本章穩定的三、二、一個十分量，使公牛、公羊、羊羔的素祭配比可以直接比較，不必倚賴有差異的現代容量換算。
- title: 奠酒
  path: link_folder/文化/奠酒.md
  summary: 第7-15、24、31節把酒作為燔祭的液體配套。STEP 以 H5262 nesekh 標示奠祭，以 H5258A nasakh 表示澆奠；第7節特用 H7941 she.khar 醇酒，第14節則用 H3196 yayin 酒。
  relation: 奠酒的分量隨羊羔、公羊、公牛由四分之一、三分之一到二分之一欣增加。GT 丁良才保留澆在壇旁或祭物上的兩種位置理解，但兩說都確認酒是獻給耶和華的祭物。
- title: 西乃山
  path: link_folder/地點/西乃山.md
  summary: 第6節明說每日常獻燔祭是在西乃山所命定；CT、GT、BibleHub 都回指出埃及記29:38-42的早晚羊羔條例。民數記28章是在進地前重申並納入完整祭祀日曆。
  relation: 西乃山把本章的新一代與立約初期的敬拜命令連起來。領袖和世代都將更換，每日獻祭的根源仍是神在西乃所頒的命令。
- title: 安息日
  path: link_folder/神學/安息日.md
  summary: 第9-10節規定每安息日另加兩隻一歲、無殘疾的羊羔、伊法十分之二細麵及奠祭；GT《舊約背景註釋》強調這是一份代表全體百姓的祭，各家不必各獻一次。
  relation: 安息日不是暫停每日獻祭，而是在早晚常獻燔祭上再增加一層。這個每七日一次的公共節奏，也與月朔和年度節期共同構成以時間敬拜神的架構。
- title: 燔祭平安祭同獻的素祭與奠祭比例
  path: link_folder/神學/燔祭平安祭同獻的素祭與奠祭比例.md
  summary: 第12-14、20-21、28-29節反覆採用民15的比例：公牛配伊法十分之三細麵和半欣酒，公羊配十分之二和三分之一欣，羊羔配十分之一和四分之一欣。
  relation: 同一比例跨月朔、無酵節和七七節重複，使祭牲大小、乾料與液體形成可預測的整體。經文自己的分數比來源間不一致的現代公升換算更穩定。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: 月朔、無酵節與七七節各加一隻公山羊作贖罪祭（15、22、30節）。STEP 標示 H2403H chattat；第22、30節「為你們贖罪」是 H3722A kaphar 的 Piel不定詞。
  relation: 本章祭物以燔祭為多，卻在三個大型公共時日保留贖罪祭，顯示群體慶祝、感恩與親近神時仍需面對罪。它同樣加在每日常獻祭之外。
- title: 逾越節
  path: link_folder/歷史/逾越節.md
  summary: 第16節指定正月十四日為耶和華的逾越節；本章沒有重述宰羔羊與塗血程序，而讓次日開始的七日無酵節祭例緊接其後。四套註釋都回顧出埃及拯救背景。
  relation: 本章把逾越節作春季節期的起點，焦點不是家庭筵席細節，而是救贖記念之後全會眾每日另加的祭物。逾越與無酵緊密相連，仍可按日期和功能區分。
- title: 基督預表（逾越節羔羊）
  path: link_folder/神學/基督預表（逾越節羔羊）.md
  summary: 本章只標示逾越節日期，沒有重述逾越羊羔條例；CT、GT、KingComments 與 BibleHub 都藉出埃及及新約互文，把羔羊的死與基督的救贖相連。
  relation: 民28的直接重點是節期公共祭物，基督預表是註釋家由正典互文提出的神學發展。分層閱讀可同時保留本章焦點與逾越羔羊在基督教解讀中的位置。
- title: 無酵節
  path: link_folder/歷史/無酵節.md
  summary: 正月十五日起七日吃無酵餅，第一日和第七日有聖會並停止勞碌的工；七日每天另獻兩公牛、一公羊、七羊羔、一公山羊及相配素祭，全部加在常獻祭之外。
  relation: 無酵節緊接逾越節，把一次救贖記念展成七日的群體生活。經文以重複祭物、首末聖會和日常勞動的停止，呈現整段時間被分別出來。
- title: 聖會
  path: link_folder/文化/聖會.md
  summary: 第18、25、26節在無酵節首日、末日及七七節規定聖會。STEP 顯示 H4744 miqra「召集」與 H6944 qodesh「聖潔」構成「聖潔的召集」，三處都與不可作勞碌的工並列。
  relation: 聖會不是個人自行過節，而是全體被召聚到分別為聖的時間中。GT《聖經精讀本》將停止勞動解作專心事奉神，CT也強調大家一同過節。
- title: 勞碌的工（a.vo.dah）
  path: link_folder/原文/勞碌的工（a.vo.dah）.md
  summary: 第18、25、26節都禁止「勞碌的工」。STEP 的結構是 H4399 melakhah「工作」加 H5656I avodah「勞動／服役」，和同節的聖會形成清楚對照。
  relation: 禁令不是單純追求休閒，而是挪開通常維持生計的工作，使無酵節首末日與七七節能成為群體專注敬拜的時間。
- title: 沒有殘疾的祭牲
  path: link_folder/神學/沒有殘疾的祭牲.md
  summary: 第3、9、11、19、31節反覆要求祭牲沒有殘疾；STEP 第31節以 H8549G tamim 的複數形容詞表達完整、無瑕。CT總結常獻與特獻的所有祭牲都必須完美無缺。
  relation: 品質要求貫穿每日羊羔、安息日、月朔及節期祭牲，表明祭物增加不能以降低品質交換。數量、時間和完整性同樣由神規定。
- title: 初熟
  path: link_folder/原文/初熟.md
  summary: 第26節七七節「初熟」是 STEP H1061 bikkurim，帶定冠詞的陽性複數名詞。GT、KingComments 和 BibleHub 都把它放在小麥收成及向神獻新糧的節期背景中。
  relation: 初熟使七七節的公共獻祭連到土地出產；百姓先把新收成獻給神，承認食物與季節供應出於祂。它與利23初熟禾捆相關，但兩個節期動作須區分。
- title: 五旬節兩個有酵餅的搖祭條例
  path: link_folder/主題/五旬節兩個有酵餅的搖祭條例.md
  summary: 民28:26只說七七節獻新素祭；CT、GT、KingComments 以利23:16-17補充為新麥作成兩個有酵餅獻上。本章另列兩公牛、一公羊、七羊羔及一公山羊的公共祭物。
  relation: 利23說明代表性初熟餅，民28補上節日公共祭物，兩處互補而不能彼此替代。兩章祭牲數目也有差異，CT與GT都保留「條例改變」或「另加一套」兩種解法。
- title: 五旬節與律法頒布
  path: link_folder/背景/五旬節與律法頒布.md
  summary: 民28:26-31直接說的是七七節、初熟、新素祭、聖會與加獻祭物；GT《舊約聖經背景註釋》和 BibleHub 另記猶太傳統把這一天與西乃山頒布律法相連。
  relation: 本章提供五旬節的收割與獻祭基礎，頒律法連結則是後期節期傳統，不是 H7620G「七週」或本段詞句本身的含義；兩層應正面並列。
- title: 聖靈分賜預表五旬節（徒2：1-4）
  path: link_folder/互文/聖靈分賜預表五旬節（徒2：1-4）.md
  summary: 七七節在逾越節後七週、第五十日舉行。GT、KingComments 與 BibleHub 都由此連到使徒行傳2:1-4五旬節聖靈降臨和教會形成；民28本身則只記初熟、新素祭、聖會及祭物。
  relation: 時間與節名為新約事件提供節期背景，初熟也成為註釋家的神學圖像；但聖靈降臨是跨卷互文發展，不應倒寫成民28原文字義。
- title: 節期祭物詳情另見民數記28-29章
  path: link_folder/背景/節期祭物詳情另見民數記28-29章.md
  summary: KingComments 與 GT 都比較節期經文的不同焦點：利23集中節期日期與意義，民28-29集中各日公共祭物。本章涵蓋每日、安息日、月朔、逾越／無酵及七七節，民29接續下半年節期。
  relation: 本章證實民28-29是祭物詳表，不能只靠利23補出所有數量。七七節兩處祭牲數目不同，來源保留條例變動或另加一套的兩種理解，也提醒讀者逐段辨明資料層次。
