name: 群體性獻祭
type: 主題
secondary_types:
- 文化
- 神學
aliases:
- 公共獻祭
- 全會眾的獻祭
status: formal
definition: |-
  群體性獻祭指民數記28章所列、按固定日期為整個以色列群體獻上的祭。經文直接向「以色列人」頒布一套共同時間表；實際獻祭由聖所祭司執行，祭物卻代表全會眾，不是要求每個家庭在每個時段各自重複獻同一套數量。

  GT《啟導本》及《背景註釋》和 KingComments 都將這一章的定期公共祭，與民數記15章個人按心願或特殊情況所獻的祭區分：

  | 比較 | 民數記15章 | 民數記28章 |
  |---|---|---|
  | 主要場景 | 個人所獻祭物的配套規則 | 全體百姓的定期公共敬拜 |
  | 啟動方式 | 個人的還願、自願或指定情況 | 日、週、月和節期到來 |
  | 是否持續 | 隨個別獻祭發生 | 每天不斷，並按日曆加祭 |

  本章沒有取消個人的敬拜責任，而是補上群體共同生活不可缺少的層面。即使當天沒有任何個人自願獻祭，早晚常獻燔祭仍須為全體百姓獻上；到了安息日、月朔或節期，公共祭物又按條例增加。這使會眾不只共享土地和領袖，也共享一套面向神的敬拜節奏。
accumulations:
- book: 民數記
  chapter: 28
  summary: 神吩咐以色列人按固定日期獻上每日、安息日、月朔和春季節期的祭物，形成代表全體會眾的公共獻祭制度。
  relation: 個別百姓的自願敬拜之外，全群體也以共同、持續而有秩序的方式向神獻祭；領袖交接不使這項群體責任中斷。
