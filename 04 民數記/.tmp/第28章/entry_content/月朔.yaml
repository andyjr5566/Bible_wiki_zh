status: formal
definition: |-
  「月朔」是每個月開始之日。民數記28:11-15規定，以色列每到月初，要在每日常獻燔祭以外另獻一整套公共祭物：

  | 祭物 | 數量 | 素祭細麵 | 奠酒 |
  |---|---:|---:|---:|
  | 公牛 | 2隻 | 每隻伊法十分之三 | 每隻半欣 |
  | 公羊 | 1隻 | 伊法十分之二 | 三分之一欣 |
  | 一歲羊羔 | 7隻 | 每隻伊法十分之一 | 每隻四分之一欣 |
  | 公山羊贖罪祭 | 1隻 | 經文未列配套 | 經文未列配套 |

  STEP 顯示民28:11「每月朔」由 H7218J rosh 的複數附屬形（各起頭之意）與 H2320G chodesh 的複數附屬形、第二人稱複數後綴（你們的月份之意）組成。民28:14 又以 H2320G 重申「這是每月的燔祭，一年之中要月月如此」。原文結構支持中文每月的起頭這個譯法，也顯示這不是一年一次的節日。

  GT《背景註釋》和 BibleHub 把月朔放在古代陰曆文化中說明：看見新月標誌新月份開始，鄰近文化也有月相相關慶典；以色列的條例則明確把當日祭物獻給耶和華。月朔祭物與大型節期相當豐富，顯出月序更新也是會眾共同敬拜的重要時刻。
accumulations:
