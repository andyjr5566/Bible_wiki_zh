- title: 安營與纛
  path: link_folder/主題/安營與纛.md
  summary: 民2 把第1章的原則畫成具體的圖。v2「以色列人要各歸自己的纛下，在本族的旗號那裡，對著會幕的四圍安營」。CT 指出各支派各有指定的營地和旗幟，而十二支派分作四組各占一個方位圍著會幕安營，形成十字隊形。STEP 原文資料顯示「纛」在本章出現八次（v2、3、10、17、18、25、31、34），原形是 דֶּ֫גֶל（de.gel，H1714，詞典義 standard）；緊接著的「旗號」是另一個字，原形 אוֹת（ot，H226H，詞典義 sign／indicator）；各營首領的「首領」則是 נָשִׂיא（na.si，H5387A，詞典義 leader）。GT《啟導本》描述營盤的形狀：紮營排列是個正方形，會幕在正中央，祭司在會幕的東面，利未的三個支派米拉利、革順和歌轄各在北、西和南三面；並指出「對著會幕」也可譯為「與會幕間有相當距離」，約書亞記三4 規定約櫃與支派安營間的距離為二千肘（約一千公尺）。GT《民數記串珠聖經註釋》補上兩點：一是各面三個支派的準確位置「本章未有清楚說明」，從上下文看最自然的次序是順時鐘方向；二是這個陣形「也是聖城的模式」，以西結（結40章）與約翰（啟21章）所見的聖城都有類似結構。至於纛上畫什麼，串珠說聖經未有記載，只依猶太人的傳統推測：猶大是獅子、流便是人首、以法蓮是牛、但是鷹。GT《聖經精讀本》給的版本更細，連顏色都有：猶大是畫著獅子的綠旗（據創49:9「猶大是個小獅子」）、流便是畫著人的紅旗、以法蓮是畫著牛犢的黃旗、但是畫著鷹的紅白旗；它並整理出舊約表示旗幟的三個詞——旌旗（用於很多會眾或軍隊）、大旗（有標竿之意，指人們聚集之處）、旗（用法與旌旗相近，但用於較少的會眾或家族）。GT《啟導本》另指出四組支派的排列「和他們的母系有很大關係」。KC 從纛引出一段對今日的提醒：在基督教界高舉的旗幟並不造成合一，反而造成分裂——有人用一個人的名字或一套教義的名字立旗，凡贊同的就聚到那面旗下，「每一面旗都是把自己與別人分別開來的旗，而那不是神所要的」；神所立的中心只有一個，就是主耶稣，那真正的會幕，祂要將四散的兒女聚集為一，祂自己就是那「超乎萬人之上」的旗（歌5:10）。BH 指出用旗幟編組在古代近東文化中很普遍，既維持行進與安營的秩序，也讓各支派在共同身分之下保有自己的識別；它並把纛接到雅歌二4「以愛為旗」，說旗幟在聖經裡也能象徵神的同在與引導。
  relation: '[[行軍次序]]、[[會幕（帳幕整體）]]、[[利未支派]]、[[以色列人的軍隊]]、[[神的同在]]'
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 民2:17「隨後，會幕要往前行，有利未營在諸營中間。他們怎樣安營就怎樣往前行，各按本位，各歸本纛」；v33「惟獨利未人沒有數在以色列人中，是照耶和華所吩咐摩西的」。GT 丁良才指出「有利未營在諸營中間」就是哥轄族（民10:17註），而「他們怎樣安營，就怎樣往前行」（民10:11-28），「這樣神的住處常在選民中間」（參詩46:5）。GT《聖經精讀本》說得更具體：這裡指哥轄子孫抬著聖物往前行（民10:21）；帳幕中的聖物與帳幕分開，「佔據了以色列所有支派中最中心的位置」，神就是這樣讓百姓即使在行軍中也維持以神為中心的信仰生活。KC 指出會幕是全體百姓的中心，他們起行的命令就從那裡發出；安營是為了敬拜與親近神，起行是為了防衛與保護，兩者講的都是神與祂百姓之間的關係，而利未人在這兩種活動裡都有自己特定的職分，與兩者都分不開。BH 指出會幕居中既象徵神在百姓當中，也有實際作用：這個位置讓神的同在對每一個支派同樣可及；利未人在行進中緊貼會幕，正表明他們作為神與百姓之間中保的特殊呼召。
  relation: '[[會幕（帳幕整體）]]、[[安營與纛]]、[[行軍次序]]'
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 民2:2「對著會幕的四圍安營」；v17「隨後，會幕要往前行，有利未營在諸營中間」。全章以會幕為絕對中心，四營環繞，利未人緊鄰會幕安營。CT 說：「以會幕為中心，就是以主為中心。人的難處是以自己為中心，若中心從自己的身上轉移到主身上，人所有的難處就全可以解決了。」GT《聖經精讀本》：神以會幕為中心安置以色列各支派的營，「這象徵神作為以色列真正的統治者，臨在於他們的生活中」；人存在的價值和意義，「是把神迎接在自己的生活中心裡」。GT 丁良才在全章末了歸納出三樣教訓：「會幕在以色列人當中，有三樣教訓：（一）神與人同在，（二）都當倚靠神，（三）都可親近神。」STEP 原文資料顯示 v2 的「對著」原形是 נֶ֫גֶד（ne.ged，H5048，詞典義 before），STEP 逐字譯作「from/ before」——這個帶前置詞的寫法正對應 GT《啟導本》所說「對著會幕」也可譯為「與會幕間有相當距離」。BH 指出這段距離本身有兩層意思：一面顯出神的聖潔與人當存的敬畏，一面也留出空間讓利未人執行看守與抬運的職務。
  relation: '[[安營與纛]]、[[利未支派]]、[[行軍次序]]、[[神的同在]]'
- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  summary: 民2:3「在東邊，向日出之地，照著軍隊安營的是猶大營的纛」；v9「凡屬猶大營…共有十八萬六千四百名，要作第一隊往前行」——四營之中人數最多。CT 指出「東邊，向日出之地」是因為會幕門口即面向東邊（出27:13,16），摩西和亞倫也安營在東邊的內層，「可見是最重要的方位」。STEP 原文資料顯示這一句在原文用了兩個不同的「東」字：一個原形是 קֵ֫דֶם（qe.dem，H6924B），另一個是 מִזְרָח（miz.rach，H4217H）——和合本的「在東邊」與「向日出之地」正好各對一個。GT《聖經精讀本》指出猶大支派站在行軍行列的前面，預表耶穌作為全人類的救主和君王站在全人類的前面，把人引到永遠的國度裡（約10:4），而耶穌正是藉著猶大支派的血統道成肉身（太1:3-16）；它並說這個位置成就了雅各對猶大的預言（創49:10），預言在大衛時期展開（撒下2:4-7；5:1-3），「並通過耶穌基督得以成就」（來7:14）。KC 指出猶大的意思是「讚美」，而「讚美的靈就是能力的靈」（代下20:22），教會聚集最主要的目的就是讚美與敬拜神；他並指出因流便、西緬、利未三個兄長犯罪（創49:3-7），猶大才成為弟兄中的首位（創49:8），成為彌賽亞所出的王室支派（創49:10；得4:18-22）。BH 補上東方在聖經裡的象徵：伊甸園在東方，會幕入口朝東，而瑪拉基書四2 說「公義的日頭」要升起，東方因此也與彌賽亞的來到相連。
  relation: '[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]、[[拿順]]'
- title: 流便
  path: link_folder/人物/流便.md
  summary: 民2:10「在南邊，按著軍隊是流便營的纛」；v16「凡屬流便營…共有十五萬一千四百五十名，要作第二隊往前行」。GT《聖經精讀本》指出「在南邊」按行軍的方向看就是右邊，而對希伯來人來講右邊意味著「力量」和「祝福」，可以理解為這是對以色列的長子流便的特殊照顧（出15:6；傳10:2）。STEP 原文資料顯示這裡的「南」原形是 תֵּימָן（te.man，H8486，詞典義 south）；KC 則把它讀作字面上的「右邊」，並說右邊在聖經裡講的是尊榮的地位——主耶穌「坐在高天至大者的右邊」（來1:3；8:1；10:12；12:2），而信徒在基督裡也同得這個地位，因為神叫我們「在基督耶穌裡與祂一同坐在天上」（弗2:6）。KC 另指出流便的意思是「看哪，一個兒子」，會眾聚集時正是一群知道自己是神兒子的人聚在一起。GT 丁良才說明南營的組成用意：流便、西緬是利亞之長子和次子的後裔，「這樣就使他們少生嫉妒猶大支派的心」，迦得則是利亞之婢女悉帕之長子的後裔。BH 指出流便雖是長子、其營仍列第二而不居首，是因他先前的過犯（創49:3-4）；但排在猶大之後仍屬尊位，這個次序本身就把「在前的要在後」的原則先擺了出來（太19:30）。
  relation: '[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]'
- title: 以法蓮
  path: link_folder/人物/以法蓮.md
  summary: 民2:18「在西邊，按著軍隊是以法蓮營的纛」；v24「凡屬以法蓮營…共有十萬零八千一百名，要作第三隊往前行」。GT《聖經精讀本》指出西邊是帳幕的後邊，瑪拿西、便雅憫支派以以法蓮支派為中心安營，他們都是拉結的子孫。GT 丁良才說以法蓮、瑪拿西、便雅憫「都是同一個祖母（拉結）的子孫，他們在法櫃後行走」，並指出「此處可解明詩八十1-2節的話」，而這些支派所得的地都相連接。STEP 原文資料在這一節提供了一個直接的印證：「在西邊」的原形是 יָם（yam，H3220H），而 STEP 的簡要義域同時列出 sea 與 west 兩義。KC 正是從這一點展開：西邊字面上是「海的那一邊」，而海在聖經裡講的是信徒生活中的試煉與難處，人在這些試煉中為神結出果子（參創1:20-23）；他並指出以法蓮的意思是「加倍的果子」，用作西邊的掌旗支派十分相稱。BH 指出西邊面向日落，象徵完成與安息；以法蓮日後成為北國以色列的代表支派，這個居首的位置已經先在營盤裡顯出來。
  relation: '[[安營與纛]]、[[行軍次序]]、[[瑪拿西]]、[[十二支派起源]]'
- title: 但支派
  path: link_folder/人物/但支派.md
  summary: 民2:25「在北邊，按著軍隊是但營的纛」；v31「凡但營被數的，共有十五萬七千六百名，要歸本纛作末隊往前行」。GT《聖經精讀本》指出北邊是安置各支派陣營時最後提到的地方，而但支派是「除了猶大以外被數點的人數最多」的支派，是勇敢的人群，擔負著守衛以色列陣營後方的重要任務。GT 丁良才說明北營三支派的母系：但支派是從拉結的婢女辟拉所生之長子的後裔，亞設支派是悉帕的後裔，拿弗他利是辟拉的後裔。STEP 原文資料顯示這裡的「北」原形是 צָפוֹן（tsa.phon，H6828G，詞典義 north）；KC 則從字面讀出另一層：北面是最暗的一面、離日頭最遠，而「北」的字面意思是「隱藏」，代表神在地上的見證中陰暗的那一面——聚會照常舉行，卻可能因為隱而未現的罪而失去能力，只剩習慣。KC 並指出雅各稱但為「蛇」（創49:17），但人後來有一個可疑的「殊榮」：是頭一個把偶像帶進以色列的（士18:30）。BH 從防務的角度解釋殿後的意義：但營走在最後，保護整個隊伍的後方，確保沒有人掉隊；它並指出以賽亞書五十二12 用同一個意象說神自己要作以色列的後盾。
  relation: '[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]'
- title: 以色列人的軍隊
  path: link_folder/神學/以色列人的軍隊.md
  summary: 民2 全章按軍隊編排四營，每營三支派，各有首領、人數與行軍次序：v9「要作第一隊往前行」、v16「要作第二隊往前行」、v24「要作第三隊往前行」、v31「要歸本纛作末隊往前行」。CT 指出十二支派分作四組各占一個方位圍著會幕安營，形成十字隊形，並說「會幕裡面的內容是十字架，安營的隊形也是十字架，裡外都是十字架」。GT《聖經精讀本》指出以色列百姓所要進行的戰爭「是以建立神國度為目的的聖戰」，神是以色列的元帥，百姓只要順服神的命令就能獲得勝利；它並把出埃及旅程中的以色列百姓稱為「曠野教會」（林前12:4-31）。GT《民數記串珠聖經註釋》從結果回看組織：數以百萬計的以色列民「能夠有條不紊地安營和起行，在曠野中生活了四十年而蒙保守，都是因為神起初匠心的組織和編排」；當神的子民以神為中心、按次序而行（林前14:40），「便能夠克服很多環境和人事的問題」。KC 指出四面纛所對的正是外來影響進來的四個方向，神的百姓要靠著那位住在他們中間的主的能力去面對。BH 指出「軍隊」一詞指的是軍事編制單位，這種編組讓百姓在行進與紮營時都能保持秩序，既是實務需要，也表明神不是混亂的神，乃是和平與秩序的神（林前14:33）。
  relation: '[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]、[[利未支派]]'
- title: 十二支派起源
  path: link_folder/神學/十二支派起源.md
  summary: 民2 的四營分組反映母系結構：東營（猶大、以薩迦、西布倫）皆利亞所生；南營（流便、西緬、迦得）是利亞所生加上利亞婢女悉帕所生；西營（以法蓮、瑪拿西、便雅憫）皆拉結所生或所出；北營（但、亞設、拿弗他利）皆婢女所生（但、拿弗他利為拉結婢女辟拉所生，亞設為利亞婢女悉帕所生）。GT《啟導本》把這件事說成一條原則：「這四組支派的排列和他們的母系有很大關係」，並逐組列出各支派的母系。GT 丁良才進一步給出其中一組的用意：南邊有流便、西緬（利亞之長子和次子的後裔），「這樣就使他們少生嫉妒猶大支派的心」，並迦得（利亞之婢女悉帕之長子的後裔）。KC 點出十二這個數字如何補足：流便和西緬是利亞最年長的兩個兒子，利未不列入數點，補上他位置的是悉帕的長子迦得；以法蓮、瑪拿西、便雅憫都是拉結的後裔，約瑟由他的兩個兒子代表；但、亞設、拿弗他利則三個都是使女所生。BH 指出這樣按宗族家室編組，維繫的是支派身分與產業繼承權，也讓神對亞伯拉罕、以撒、雅各的應許在每一個支派身上都看得見。
  relation: '[[安營與纛]]、[[利亞]]、[[拉結]]、[[辟拉]]、[[悉帕]]'
- title: 十二族長協助數點
  path: link_folder/事件/十二族長協助數點.md
  summary: 民2 重複第1章的十二族長名單，但這次是按營盤方位分組列出：東營拿順（猶大）、拿坦業（以薩迦）、以利押（西布倫）；南營以利蓿（流便）、示路蔑（西緬）、以利雅薩（迦得）；西營以利沙瑪（以法蓮）、迦瑪列（瑪拿西）、亞比但（便雅憫）；北營亞希以謝（但）、帕結（亞設）、亞希拉（拿弗他利）。STEP 原文資料顯示本章稱他們為 נָשִׂיא（na.si，H5387A，詞典義 leader），與第1章第16節「首領」「統領」的用字分工不同——本章從頭到尾只用這一個詞。CT 在本章逐節補上各人的名字字義，例如以利押作「神是父」、迦瑪列作「神的獎勵」、帕結作「神的事件」、亞希拉作「我兄弟是惡毒的」。CT 另在 v18 補上一層家世：以法蓮的首領「『以利沙瑪』是約書亞的祖父（參代上七26~27）」。BH 指出這些首領的職責不只是點名造冊，還包括在支派會議中代表本族、確保本族遵行神藉摩西所頒的律例，並在民數記第七章按同一順序獻上奉獻壇的禮物。
  relation: '[[安營與纛]]、[[行軍次序]]、[[數點民數]]'
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 民2:2「對著會幕的四圍安營」；v17「隨後，會幕要往前行，有利未營在諸營中間。他們怎樣安營就怎樣往前行」。全章以會幕為絕對中心，四營環繞，利未人緊鄰會幕安營，無論安營或起行，會幕始終居中。GT 丁良才：「會幕在以色列人當中，有三樣教訓：（一）神與人同在，（二）都當倚靠神，（三）都可親近神。」GT《聖經精讀本》：神以會幕為中心安置以色列各支派的營，這象徵神作為以色列真正的統治者，臨在於他們的生活中；人存在的價值和意義，是把神迎接在自己的生活中心裡。GT《民數記串珠聖經註釋》：營陣是四方形，會幕在中心，祭司利未人環繞著會幕安營，十二支派也朝向會幕；這陣形象徵神住在子民中間，也是聖城的模式——以西結（結40章）與約翰（啟21章）所見的聖城都有類似的結構。KC：戰事的一切都圍繞著會幕，它是軍隊的中心；會幕是百姓的中心，他們起行的命令從那裡發出；安營是為了敬拜與親近神，起行是為了防衛與保護，兩者所講的都是神與祂百姓之間的關係。BH 指出會幕居中不只是位置安排：它使神的同在對每個支派同樣可及，也表明敬拜應當是群體生活的核心，而不是邊緣的活動。
  relation: '[[會幕（帳幕整體）]]、[[安營與纛]]、[[利未支派]]、[[行軍次序]]'
- title: 以薩迦（價值）
  path: link_folder/人物/以薩迦（價值）.md
  summary: 民2:5「挨著他安營的是以薩迦支派。有蘇押的兒子拿坦業作以薩迦人的首領」，v6 其軍隊54,400 名，隸屬東邊猶大營。CT 的原文字義給了三個名字：「以薩迦」有價值、「蘇押」渺小、「拿坦業」神的賜予；並指出猶大、以薩迦和西布倫三人都是同母兄弟，利亞所生（創35:23），這三個支派「在軍隊的編組裡同屬最先起行的一組」。BH 指出以薩迦以「通達時務」著稱（代上12:32），這份洞察力也許正是它被安置在領頭的猶大身旁的原因；其地業日後落在肥沃的耶斯列平原，並在士師記第五章出兵支持底波拉與巴拉。
  relation: '[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]、[[猶大支派]]'
- title: 西布倫（同住）
  path: link_folder/人物/西布倫（同住）.md
  summary: 民2:7「又有西布倫支派。希倫的兒子以利押作西布倫人的首領」，v8 其軍隊57,400 名，隸屬東邊猶大營。CT 的原文字義：「西布倫」高貴的、「希倫」力量、「以利押」神是父；並指出西布倫與猶大、以薩迦同為利亞所生，三個支派同屬最先起行的一組。BH 指出西布倫的地業靠海、便於貿易，應驗雅各的預言「西布倫必住在海口，必成為停船的海口」（創49:13）；這個支派在以色列歷史上多次出兵，士師記第四、五章記它支持底波拉與巴拉，而以利押作為首領，在民數記第二章既列名於營盤也列名於軍事編制。
  relation: '[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]、[[猶大支派]]'
- title: 迦得（萬幸）
  path: link_folder/人物/迦得（萬幸）.md
  summary: 民2:14「又有迦得支派。丟珥的兒子以利雅薩作迦得人的首領」，v15 其軍隊45,650 名，隸屬南邊流便營。CT 的原文字義：「迦得」軍隊、「丟珥」他們認識神、「以利雅薩」神已加添；並指出迦得和亞設同為悉帕所生（創35:26），「卻在軍隊的編組中，分別列在不同的組」。GT 丁良才說明南營這樣編組的用意：流便、西緬是利亞之長子和次子的後裔，「這樣就使他們少生嫉妒猶大支派的心」，迦得則是利亞之婢女悉帕之長子的後裔。BH 指出迦得之名意為「福分」或「隊伍」，反映這個支派善戰的名聲；其地業在約但河東的基列，土地適合大量牲畜，位置也使它時常首當其衝。
  relation: '[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]、[[流便]]'
- title: 亞設（有福）
  path: link_folder/人物/亞設（有福）.md
  summary: 民2:27「挨著他安營的是亞設支派。俄蘭的兒子帕結作亞設人的首領」，v28 其軍隊41,500 名，隸屬北邊但營。CT 的原文字義：「亞設」快樂的、「俄蘭」憂慮的、「帕結」神的事件；並指出亞設和迦得同為悉帕所生，卻分列不同的營。GT 丁良才在北營的說明中指出「亞設支派，是悉帕的後裔」，與但、拿弗他利（辟拉的後裔）同組。BH 指出亞設之名意為「快樂」或「有福」，其地業沿地中海岸一帶富庶，應驗雅各的預言「亞設之地必出肥美的糧，且出君王的美味」（創49:20），而首領帕結的名字意為「神與我相遇」或「神介入」。
  relation: '[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]、[[但支派]]'
- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  summary: 民2:20「挨著他的是瑪拿西支派。比大蓿的兒子迦瑪列作瑪拿西人的首領」，v21 其軍隊32,200 名，隸屬西邊以法蓮營。CT 的原文字義：「瑪拿西」導致遺忘、「比大蓿」磐石已贖回、「迦瑪列」神的獎勵；並指出以法蓮和瑪拿西同為約瑟的兒子，「但因約瑟得到長子雙份的特權，故同被升格成為兩個支派」。GT《聖經精讀本》指出西邊是帳幕的後邊，瑪拿西、便雅憫兩支派以以法蓮支派為中心安營，他們都是拉結的子孫。GT 丁良才補充這三個支派「在法櫃後行走」，此處可解明詩80:1-2 的話，而他們所得的地都相連接。BH 指出瑪拿西日後分成約但河東西兩個半支派，地業廣大；首領迦瑪列的名字意為「神是我的獎賞」，父名比大蓿意為「磐石已贖回」。
  relation: '[[以法蓮]]、[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]'
- title: 便雅憫
  path: link_folder/人物/便雅憫.md
  summary: 民2:22「又有便雅憫支派。基多尼的兒子亞比但作便雅憫人的首領」，v23 其軍隊35,400 名，隸屬西邊以法蓮營。CT 的原文字義：「便雅憫」右手之子、「基多尼」我的砍伐者、「亞比但」我父是公義；並指出便雅憫與以法蓮和瑪拿西同為拉結所出（創35:24）。GT 丁良才指出這三個支派「都是同一個祖母（拉結）的子孫，他們在法櫃後行走」，並說「此處可解明詩八十1-2節的話」。KC 也把這三個支派連到詩篇八十篇：詩人求神在以色列受苦的日子引領他們，像在曠野旅程的日子那樣顯出祂的能力（民10:35）。BH 指出便雅憫雖是較小的支派，日後卻出了以色列的第一位王掃羅（撒上9:1-2）與使徒保羅（腓3:5）。
  relation: '[[以法蓮]]、[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]'
- title: 西緬
  path: link_folder/人物/西緬.md
  summary: 民2:12「挨著他安營的是西緬支派。蘇利沙代的兒子示路蔑作西緬人的首領」，v13 其軍隊59,300 名，隸屬南邊流便營。CT 的原文字義：「西緬」聽見、「蘇利沙代」我的磐石是全能的、「示路蔑」神的朋友；並指出西緬是雅各的次子，與流便同為母親利亞所生。GT 丁良才說明編組用意：流便、西緬是利亞之長子和次子的後裔，「這樣就使他們少生嫉妒猶大支派的心」。KC 指出流便和西緬是利亞最年長的兩個兒子，而利未既不列入數點，補上他位置的是悉帕的長子迦得。BH 給示路蔑的字義是「神的朋友」或「與神和好」，父名蘇利沙代意為「我的磐石是全能者」；它並指出西緬的地業日後落在猶大境內（書19:1-9），這個支派後來逐漸併入猶大。
  relation: '[[流便]]、[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]'
- title: 拿弗他利
  path: link_folder/人物/拿弗他利.md
  summary: 民2:29「又有拿弗他利支派。以南的兒子亞希拉作拿弗他利人的首領」，v30 其軍隊53,400 名，隸屬北邊但營。CT 的原文字義：「拿弗他利」摔角、「以南」有眼睛、「亞希拉」我兄弟是惡毒的；並指出拿弗他利和但兩兄弟為同母辟拉所生（創35:25）。GT 丁良才在北營的說明中指出「拿弗他利是辟拉的後裔」。KC 指出北營三個支派都是使女所生：但是拉結的使女辟拉的長子，亞設是利亞的使女悉帕的次子，拿弗他利則是辟拉的次子。BH 指出拿弗他利的地業在迦南北部、靠近加利利海，日後正是耶穌大部分傳道工作所在，應驗以賽亞書九1-2 關於加利利要見大光的預言。
  relation: '[[但支派]]、[[安營與纛]]、[[行軍次序]]、[[十二支派起源]]'
- title: 拿順
  path: link_folder/人物/拿順.md
  summary: 民2:3「有亞米拿達的兒子拿順作猶大人的首領」——猶大營居東、作第一隊往前行，拿順因此是全軍最前面的支派首領。CT 在本章重述他的兩層身分：「拿順是亞倫的妻兄（參出六23），也是大衛的先祖」。STEP 原文資料顯示本節的「首領」原形是 נָשִׂיא（na.si，H5387A，詞典義 leader），與第1章第16節「首領」「統領」兩詞分工的寫法不同。KC 指出在馬太福音第一章的家譜裡，這位支派首領被列在主耶穌的祖先之中（太1:4），而猶大之所以成為王室支派，是因為流便、西緬、利未三個兄長犯罪（創49:3-7），猶大才成為弟兄中的首位（創49:8；得4:18-22）。BH 補上一層姻親關係：亞米拿達的女兒以利沙巴嫁給了首任大祭司亞倫，因此拿順這一支同時牽著王室與祭司兩條線，而這兩條線最終在基督身上合一——祂既是君王，也是大祭司。
  relation: '[[猶大支派]]、[[十二族長協助數點]]、[[行軍次序]]、[[安營與纛]]'
- title: 六十萬人的數目
  path: link_folder/解經爭議/六十萬人的數目.md
  summary: 民2:32 重述總數603,550。GT《舊約聖經背景註釋》在【民二3～32 統計的人數】下，把「千」字可讀作「部隊」的那條折衷路線用本章的逐營數字實際算了一遍：「由於希伯來語的『千』字（'lp）的寫法和譯作『軍事部隊』的字眼相同，『七萬四千六百名』（4節）也可譯作『七十四個部隊，（共）六百人』。第32節的總數，本來則是五百九十八個部隊（'lp），五千（'lp）五百人。經文在抄寫傳遞之時，這兩個字可能發生混淆，加在一起成為『六百零三千』（即六十萬三千）。這解釋若對，則以色列出埃及的人數大約有二萬。」本章因此是這條解法唯一有逐營數字可供驗算的地方——它同時要處理四個營的小計與全體的總計。
  relation: '[[以色列人的軍隊]]、[[行軍次序]]、[[六十萬零三千五百五十人（出38：26）]]'
- title: 六十萬零三千五百五十人（出38：26）
  path: link_folder/事件/六十萬零三千五百五十人（出38：26）.md
  summary: 民2:32「這些以色列人，照他們的宗族，按他們的軍隊，在諸營中被數的，共有六十萬零三千五百五十名」——與民1:46 及出38:26 同數。CT 指出這是四個營加起來的總數（參9、16、24、31節），並解釋這一節的兩個詞：「『宗族』指十二支派；『軍隊』指猶大、流便、以法連、但等四個營。」v33 隨即重申「惟獨利未人沒有數在以色列人中」，CT 說明32節的諸營並不包括利未營，「因為他們另有任務，負責搬運會幕和其中的器具」。KC 指出民數記第一章提到的戰士數目在此重複，而且與各支派相符：每個戰士都在自己的支派裡就了位，每個支派也都按神所指定的纛在會幕前站定了位置；他並說巴蘭看見這個陣容時發出的呼聲正是「雅各啊，你的帳棚何等華美！以色列啊，你的帳幕何其華麗」（民24:5）。
  relation: '[[以色列人的軍隊]]、[[行軍次序]]、[[利未支派]]、[[六十萬人的數目]]'
