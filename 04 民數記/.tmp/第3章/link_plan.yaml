- name: 舍客勒
  suggested_type: 原文
  evidence: 民3:47「你要按人丁，照聖所的平，每人取贖銀五舍客勒（一舍客勒是二十季拉）」。CT 的原文字義指出一件事：「『平』(原文與「舍客勒」同字)」——STEP
    原文資料印證這一點，本節三處（五舍客勒、聖所的平、一舍客勒）同為 Strong H8255，原形 שֶׁ֫קֶל（she.qel）。GT《啟導本》給換算：一舍客勒約合今11.4克，一季拉約合今0.6克，而全部贖銀1365舍客勒約合今15.5公斤。CT
    給的換算略有出入：五舍客勒「約折合57點5公克」、1365舍客勒「約折合15697點5公克」。GT《舊約聖經背景註釋》說舍客勒的平均重量是十一又五分之二克，並指出古籍另提到可能更重的「重舍客勒」，而「此處提及的聖所法碼可能較『市用』舍客勒標準更有價值和重量」；它並換算出五舍客勒「大約相等於半年的工資」。
  match_type: exact
  existing_title: 舍客勒
  existing_path: link_folder/原文/舍客勒.md
