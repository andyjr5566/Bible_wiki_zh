C_new_formal:
- name: 利未人總數的三百之差
  suggested_type: 解經爭議
  evidence: 民3:39 說被數的利未人「共有二萬二千名」，但把三族的分數加起來（革順7,500、哥轄8,600、米拉利6,200）卻是22,300，多出三百。CT
    指出這個差額，並提出版本證據：「《希臘文七十士譯本》哥轄族是八千三百名，而非八千六百名。」GT《啟導本》採同一條路並說明原因：「這多出來的300人來自抄寫的錯誤。28節哥轄族的總男丁數應為8300」，因為「3」與「6」的希伯來文字形極易誤抄。GT《民數記串珠聖經註釋》先記下猶太拉比的說法——「這三百名是利未人長子之數，他們不能代替以色列的長子」——但隨即指出這個算法「未有在15節預先聲明，本章也沒有記載點算利未人長子的指示」，因此判斷「較佳的解釋」仍是抄寫之誤。GT
    丁良才與《聖經精讀本》則採拉比那條路：丁良才說「這三百名大概是利未人頭生的男子，所以不能代替別人」，精讀本說得更明確：利未支派的長子也是分別為聖歸耶和華的，「所以不能代替其他支派的長子」。
  target_path: link_folder/解經爭議/利未人總數的三百之差.md
