- name: 摩西
  suggested_type: 人物
  evidence: 民3:1「耶和華在西乃山曉諭摩西的日子，亞倫和摩西的後代如下」——本章開頭把亞倫列在摩西之前。CT 給兩個理由：亞倫是長子，而且「摩西作為以色列人的領袖，他的職位並不傳給他的子孫」。GT
    丁良才說得更完整：「亞倫的名字記在先，不但因為亞倫是長子，也是因為摩西的職任只屬本人一身（摩西的兒子被列在利未人中，代上二十三14），亞倫的職任卻要歸與他的子孫，故此本章只提到亞倫的後裔，未曾論及摩西的子孫。」GT《聖經精讀本》補一句：沒有記錄摩西的後代，可能是因為他們都是普通的利未人（代上23:4-17）。全章由摩西執行數點（v16、39、42、49），並由他把贖銀交給亞倫（v51）。
  match_type: exact
  existing_title: 摩西
  existing_path: link_folder/人物/摩西.md
- name: 西乃山
  suggested_type: 地點
  evidence: 民3:1「耶和華在西乃山曉諭摩西的日子」，v14 則作「耶和華在西乃的曠野曉諭摩西說」——同一章裡山與曠野並用。CT 說 v1 指的是出埃及後第二年二月初一日（參民1:1），「或者指其後的短暫日子」；GT
    丁良才說法相同：「就是以色列人出埃及以後第二年二月初一日（一1），不然，就是大概的話。」BH 指出西乃山是神頒布十誡與律法之處，是立約與啟示的地方，也預表信徒要聚集的天上錫安山（來12:18-24）。
  match_type: exact
