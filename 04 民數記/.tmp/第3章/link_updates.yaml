- title: 亞倫的祭司譜系
  path: link_folder/人物/亞倫的祭司譜系.md
  summary: 民3:2-4 列出亞倫四子：長子拿答，還有亞比戶、以利亞撒、以他瑪，並說明「都是受膏的祭司，是摩西叫他們承接聖職供祭司職分的」（v3）。CT 的原文字義把「承接聖職」拆成兩個字：「充滿」加「手」——原文的說法是「充滿他們的手」。拿答、亞比戶因獻凡火而死且沒有兒子（v4），祭司這條線因此只由以利亞撒與以他瑪往下傳。GT 丁良才處理過一個常見的疑問：只剩兩三位祭司，怎麼辦得了民數記與利未記所記的全部事務？他給了四層理由，其中兩層是：這些律例原是為以色列人到迦南定的，而「以色列人在曠野沒有完全遵守民數記上的條例（申十二8）」；另外「利未人是特為幫助祭司分派的」。他並指出這條線後來擴得很開：「當大衛年間，以利亞撒的後裔分為十六班祭司。以他瑪的後裔分為八班（代上二十四3-4）。」GT《啟導本》指出祭司的地位高於利未全族其餘的人，「可以接觸祭壇、祭牲的血、進入會幕，是全民的教導者和代求者」，權柄大責任也大。BH 指出受膏是分別為聖的記號，這個承接聖職的儀式詳載於利未記第八章，而祭司作為神與人之間的中保，預表基督這位終極的大祭司。
