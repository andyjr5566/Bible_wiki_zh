- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: '民3 是利未支派第一次被單獨數點。神吩咐「你要照利未人的宗族、家室數點他們。凡一個月以外的男子都要數點」（v15）——這個年齡下限與第1章十二支派的二十歲完全不同，因為這次數的不是兵，是代替以色列長子歸神的人。CT 由此讀出一句：「『一個月以外』生命的價值不在乎年歲，一律平等。」STEP 原文資料顯示本章有一組同字對照：v10「你要囑咐亞倫和他的兒子謹守自己祭司的職任」與 v15「你要照利未人的宗族、家室數點他們」，用的是同一個動詞 פָּקַד（pa.qad，H6485）——前者 STEP 標的 exact Extended Strong 是 H6485J（詞典義 to reckon: overseer），context gloss 作「you will appoint」；後者是 H6485A（詞典義 to reckon: list），context gloss 作「enroll」。同一個字，一次是派職，一次是點名。GT 丁良才指出利未支派的人數與別支派相差很遠：「以色列人中最小的支派是瑪拿西，這支派中二十歲以上的人，還有三萬二千二百名。但利未支派中連一月以上之男子的數目，和這數比較起來，還少一萬名之譜。」GT《民數記串珠聖經註釋》指出利未人蒙選的理由不在血緣而在忠心：他們獲選「並不是因為摩西、亞倫是利未人，而是因著利未人在金牛犢事件中對神所顯明的忠心（出32:25-29）」。KC 從同一件事讀出恩典：利未的先祖以暴力和殘忍著稱（創49:5；34:25-31），但神使自以為是又殘忍的人成為奉獻的信徒，藉此榮耀祂自己。BH 指出利未人不像其他支派得地業，他們的產業就是耶和華自己（民18:20-24），這份分別預表新約信徒作為「有君尊的祭司」被分別出來歸神（彼前2:9）。'
  relation: '[[利未三族分工]]、[[利未人代替長子]]、[[會幕（帳幕整體）]]、[[亞倫]]、[[亞倫的祭司譜系]]、[[贖銀五舍客勒]]'
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 民3:1「亞倫和摩西的後代如下」——亞倫的名字排在摩西前面，這是本章一開頭就出現的異例。CT 給兩個理由：亞倫是長子（出4:14），而且「摩西作為以色列人的領袖，他的職位並不傳給他的子孫」。GT 丁良才把第二個理由說得更完整：「摩西的職任只屬本人一身（摩西的兒子被列在利未人中，代上二十三14），亞倫的職任卻要歸與他的子孫，故此本章只提到亞倫的後裔，未曾論及摩西的子孫。」GT《聖經精讀本》補一句：沒有記錄摩西的後代，可能是因為他們都是普通的利未人（代上23:4-17）。v9 神把利未人「給亞倫和他的兒子」；v10 吩咐他們「謹守自己祭司的職任」；v48、51 贖銀最後也交在亞倫和他兒子手裡。CT 的〔話中之光〕把兩兄弟的事奉分成兩層：「神的話是像摩西說的，而神的工作卻是由亞倫和他的後代去作的；亞倫的事奉是顯在人眼前的，是外面看得見的，摩西的事奉是在與神的交通中的，是在靈裡面的。」KC 也把兩人並列：在摩西身上看見神話語的權柄，在亞倫身上看見對我們軟弱的體恤，兩者在主耶穌身上完全合一（來3:1；4:12-16）。BH 指出亞倫作為首任大祭司，他的祭司職分預表基督永遠的祭司職分（來5:4-5）。
