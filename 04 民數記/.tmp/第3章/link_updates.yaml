- title: 凡火
  path: link_folder/主題/凡火.md
  summary: 民3:4「拿答、亞比戶在西乃的曠野向耶和華獻凡火的時候就死在耶和華面前了。他們也沒有兒子。」CT 的原文字義把「凡」注為「疏離的，令人憎嫌」，並解釋內容：「『凡火』指祭壇以外任何地方取來的火；而祭壇上的聖火來自神自己（參利九24），其後早晚添柴，不可熄滅（參利六12）。」GT《聖經精讀本》把定義推得更廣：凡火「指按自己的意志，而不是按神的旨意事奉神的一切行為」，並補一句「再華麗的祭祀和事奉，如果無視神的旨意，神是絕對不會悅納的（賽1:10-17）」。KC 從權柄的角度說同一件事：拿答和亞比戶沒有把神所說的話的權柄放在眼裡，以為可以照自己的方式近前，那是他們自己發明的祭司職分——這樣的祭司職分會斷絕，因為裡面沒有一樣是出於神的。BH 指出「凡火」是未經神指定的香（參出30:9），這個舉動代表偏離神的明文指示，也成為往後所有敬拜者的警告：不可按自己的方式親近神。CT 的〔話中之光〕另從這件事引出一個常被混淆的分別：「拿答和亞比戶並不是不工作，他們是死在工作中，但是他們的死卻是被神一直定罪的……事奉不能脫離工作，但工作不就是事奉。」
  relation: '[[拿答]]、[[亞比戶]]、[[亞倫的祭司譜系]]、[[外人近前來必被治死]]'
- title: 外人近前來必被治死
  path: link_folder/主題/外人近前來必被治死.md
  summary: 民3:10 下半與 v38 下半各出現一次「近前來的外人必被治死」——這句話在民數記第1章第51節也出現過，但指的範圍不一樣。GT 丁良才把這件事點得最清楚：「這句話有幾個意思，在一51節就指著凡不是利未人的，在本處卻指著凡不做亞倫子孫的（參利二十二10）。」KC 用同一組對照說明：本章第10節的「外人」是不屬亞倫家的人，而民數記第1章第51節講的是不屬利未支派的人；他並補一句——拿答和亞比戶原本是有資格的，卻仍舊死了，因為他們是照自己的方式近前。STEP 原文資料顯示這兩處用的是同一個字：本章的「外人」是 זוּר（zur，H2114A，詞典義 be a stranger），緊接的「近前來的」是另一個字（H7131，context gloss 作 approaching）——也就是說，範圍的寬窄不是字義決定的，而是上下文決定的：在利未人的段落裡它指非利未人，在祭司的段落裡它指非亞倫子孫。CT 在本章註為「『外人』意指非利未人，包括以色列其他支派和外族人」，GT《聖經精讀本》則從功能解釋：沒有被神呼召、也沒有被膏立為祭司的人進到神面前必被治死，「這死亡是神為了護衛自己的聖潔所採取的緊急措施」。GT《舊約聖經背景註釋》給了一則近東背景：利未人在聖所周圍安營、奉命格殺擅自進入者，「古代的聖所不是容許公眾集會的場地，而是神明的居所」；赫人與馬里的文獻都視祭司為守衛者，而巴比倫人相信擔任廟宇入口守衛的還有鬼魔或保護性的靈。BH 指出這道禁令凸顯的是接近神必須經由合法的中保，而這一點最終在基督身上得著解答（來10:19-22）。
  relation: '[[利未支派]]、[[亞倫]]、[[凡火]]'
- title: 十二支派起源
  path: link_folder/神學/十二支派起源.md
  summary: v17-20 利未三子（革順、哥轄、米拉利）及其後裔家室：革順生立尼、示每；哥轄生暗蘭（摩西亞倫之父）、以斯哈、希伯倫、烏薛；米拉利生抹利、母示。v21-37 三族按宗族分為八族（立尼族、示每族、暗蘭族、以斯哈族、希伯倫族、烏薛族、抹利族、母示族），各按安營方位與職掌分工。GT（精讀本）：家譜不是毫無意義之名字的羅列，背後包含神拯救以色列的歷史。KC：利未人的祖先利未以暴力和殘忍為特徵（創49:5;34:25-31），但神榮耀自己，使自以為是和殘忍的人成為奉獻的信徒。
