- title: 利未人代替長子
  path: link_folder/神學/利未人代替長子.md
  summary: 民3:11-13、40-51 把「利未人代替長子」這件事從原則講到實際結算。神說「我從以色列人中揀選了利未人，代替以色列人一切頭生的」（v12），理由在 v13：「我在埃及地擊殺一切頭生的那日，就把以色列中一切頭生的，連人帶牲畜都分別為聖歸我。」STEP 原文資料顯示 v12「代替」用的是 תַּחַת（ta.chat，H8478H，詞典義 underneath／instead）；同一節的「一切頭生的」其實由兩個詞組成——בְּכוֹר（be.khor，H1060，詞典義 firstborn）與 פֶּ֫טֶר（pe.ter，H6363A）配 רֶ֫חֶם（re.chem，H7358，詞典義 womb），逐字是「頭胎開母腹的」。結算的數字是：利未人22,000（v39），以色列頭生男子22,273（v43），多出273 人（v46），每人付五舍客勒贖銀。GT《啟導本》注意到這個比例很不尋常：民1:46 的男丁有603,550，長子卻只有22,273，「平均一個家庭要生育27個男孩」；它提出一個可能——603,550 或許是指在埃及出生的壯年男子，而22,273 名長子則為以色列民離開埃及後所生。GT《民數記串珠聖經註釋》把比例算得更寬（可能達1/40），並從另一頭解讀：這反常的比例反映每家都有眾多子女，正印證神在出埃及前已應驗對亞伯拉罕的應許。GT《舊約聖經背景註釋》給了一則少見的背景：不少古代文化有崇拜祖先的祭儀，而「長子要負起祭祖的責任，所以繼承家神（經常是先人的像）的也是他」；因此把長子身分轉授給利未人，就等於用「由祭司維持管制的全國性宗教活動」取代了「由長子負責保持的家庭式先祖崇拜」。GT 賈斯樂郝威《聖經難解經文詮釋手冊》命題4 處理的是另一個問題——既然神要的是所有長子，為何只有利未支派歸神？他的答覆是：因為長子本就屬神，「神有權選擇其『代替者』」。KC 指出這個交換顯出事奉所立的兩根柱子：一是重生與基督寶血的潔淨，二是與主聯合並為主分別為聖。BH 則把它接到基督：利未人代替長子的替換，預表那位「在一切被造的以先」的長子（西1:15）為人類付上贖價。
  relation: '[[利未支派]]、[[贖銀五舍客勒]]、[[亞倫]]'
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1「耶和華在西乃山曉諭摩西的日子，亞倫和摩西的後代如下」——摩西與亞倫同列為利未世系的屬靈父輩。v5-10 神透過摩西吩咐利未支派服事亞倫。v11-13 神曉諭摩西利未人代替頭生的原則。v14-16 摩西遵命數點利未人。v38 摩西、亞倫和亞倫的兒子在帳幕前東邊安營。v40-51 摩西數點以色列頭生的、收取贖銀交給亞倫父子。CT：摩西的名字列在亞倫之後，因亞倫是長子且摩西職位不傳子孫；摩西的事奉在靈裡與神交通中，是亞倫事奉的指導。GT（丁良才）：摩西的職任只屬本人一身，亞倫的職任卻歸與子孫，故本章只提亞倫後裔未提摩西子孫。KC：摩西和亞倫一同預表主耶穌——摩西代表神話語的權柄，亞倫代表體恤我們軟弱的大祭司（來3:1;4:12-16）。
  relation: '[[亞倫]]、[[利未支派]]、[[亞倫的祭司譜系]]'
- title: 西乃山
  path: link_folder/地點/西乃山.md
  summary: v1「耶和華在西乃山曉諭摩西的日子」——指以色列人出埃及後第二年二月初一日（民1:1）或其後短暫日子。v4「拿答、亞比戶在西乃的曠野向耶和華獻凡火的時候就死在耶和華面前了」。v14「耶和華在西乃的曠野曉諭摩西說」——數點利未人的命令。CT：西乃山是神頒佈律法與會幕指示的地點，也是拿答亞比戶獻凡火被審判的地點。
  relation: '[[利未支派]]、[[凡火]]、[[亞倫]]'
- title: 舍客勒
  path: link_folder/原文/舍客勒.md
  summary: 民3:47「你要按人丁，照聖所的平，每人取贖銀五舍客勒（一舍客勒是二十季拉）」。CT 的原文字義在這裡點出一件事：「『平』（原文與『舍客勒』同字）」。STEP 原文資料印證了這一點——本節的「五舍客勒」「聖所的平」「一舍客勒」三處同為 Strong H8255，原形 שֶׁ֫קֶל（she.qel）；「季拉」則是另一個字 גֵּרָה（ge.rah，H1626）。同一節的「按人丁」用的是 גֻּלְגֹּ֫לֶת（gul.go.let，H1538，詞典義 head），與民數記第1章第2節「按頭數」是同一個字。換算各家略有出入：GT《啟導本》說一舍客勒約合今11.4克、一季拉約合今0.6克，全部贖銀1365舍客勒約合15.5公斤；CT 給的是五舍客勒「約折合57點5公克」、1365舍客勒「約折合15697點5公克」。GT《舊約聖經背景註釋》說舍客勒的平均重量是十一又五分之二克，並指出古籍另提到可能更重的「重舍客勒」，而「此處提及的聖所法碼可能較『市用』舍客勒標準更有價值和重量」。同一則註釋給了一個很有感的換算：五舍客勒「大約相等於半年的工資」。KC 從另一個角度看這個數字：這筆贖價是百姓被數點時所付半舍客勒（出30:13）的十倍。BH 指出聖所的舍客勒是聖幕與後來聖殿通用的標準法碼，比通用舍客勒重，這種標準化本身就表明宗教交易必須公正劃一。
  relation: '[[贖銀五舍客勒]]、[[利未人代替長子]]'
- title: 出13：2,15
  path: link_folder/互文/出13：2,15.md
  summary: v13「因為凡頭生的是我的；我在埃及地擊殺一切頭生的那日，就把以色列中一切頭生的，連人帶牲畜都分別為聖歸我；他們定要屬我。我是耶和華」——此節回溯出13:2「以色列中凡頭生的，無論是人是牲畜，都是我的，要分別為聖歸我」及出13:15「那時法老幾乎不容我們去，耶和華就把埃及地所有頭生的，無論是人是牲畜，都殺了。因此，我把一切頭生的公牲畜獻給耶和華為祭，但將頭生的兒子都贖出來」。CT：凡頭生的是我的——因神付出犧牲祂獨生愛子的代價而取得的。GT（精讀本）：神對頭生之人的特別要求，是以擊殺埃及地的長子拯救以色列百姓的逾越節事件為基礎（出13:1-16）。KC：利未人代替頭生的根基是逾越節羔羊之血（出12:1-28;13:1-13）。
  relation: '[[利未人代替長子]]、[[利未支派]]'
- title: 彼前2：9
  path: link_folder/互文/彼前2：9.md
  summary: GT（精讀本）引用彼前2:9說明：在新約時代，在基督耶穌裡的信徒作為祭司是被神分別為聖直接事奉神的人（彼前2:9;啟1:6;5:10;西1:24）。利未人事奉預表新約信徒皆為「屬靈利未人」、全體聖徒皆祭司。KC：利未人被賜給亞倫，正如信徒被賜給基督（約17:6;6:37），服事目的是使眾信徒成為更好的祭司。
  relation: '[[利未支派]]、[[利未人代替長子]]'
