- name: 利未人任職年齡的差異
  suggested_type: 解經爭議
  evidence: v24 說「從二十五歲以外」，民4:3、23、30 卻說三十歲。CT：「這裡的二十五歲以外，大概是指五年的見習階段，等滿三十歲才正式任職。」GT 丁良才：「有注釋家以為利未人從二十五歲以外，先有數年的練習，到三十歲才正式就職。」GT《聖經精讀本》另指出代上23:24 把年限降到了二十歲。KC 同樣讀為預備期，並以保羅歸主後先往阿拉伯、再到安提阿事奉為例（徒9:20、加1:17、徒11:25-26、徒13:2-3）。
  match_type: exact
  existing_title: 利未人任職年齡的差異
  existing_path: link_folder/解經爭議/利未人任職年齡的差異.md
- name: 三十歲直到五十歲（利未人任職年齡）
  suggested_type: 主題
  evidence: v24-26 定下起訖：二十五歲前來任職，五十歲停工退任，之後「只要在會幕裡，和他們的弟兄一同伺候，謹守所吩咐的」。CT：「五是人在神面前負責的數目。從二十五歲（五乘五），開始辨事……作工期間也是五乘五，二十五年。」GT《民數記串珠聖經註釋》把 v26 譯為「幫助他們的弟兄謹守責任」，並指出「利未人的獻身事奉是終身盡忠職守的」。GT《舊約聖經背景註釋》另從古代近東債奴服務的類比說明利未人在債主（神）家中提供指定的服務、由祂供養。
  match_type: exact
  existing_title: 三十歲直到五十歲（利未人任職年齡）
