C_new_formal:
- name: 利未人受職與祭司受職的差別
  suggested_type: 主題
  evidence: GT《啟導本》：「利未人受職儀式與祭司不同，祭司都要受膏（出二十八41；二十九1～9；利八12），利未人只須經過一個潔淨的儀式……祭司和利未人的不同處，是祭司可以接近祭壇、能獻祭，利未人則不能，只可以在會幕內輔助祭司。」GT《民數記串珠聖經註釋》：「祭司被膏抹成聖，才開始在會幕中事奉神（利8），利未人的事奉可說是較為次一級，只需行潔淨的禮儀便可。」GT 丁良才：「摩西曾分派祭司（利八章），照樣也要分派利未人，但聖書上說是潔淨他們。」GT 丁良才另指出利未人「親近聖物也沒有什麼特別的禮服，所以要洗他們的衣服」。KC：利未人不在祭司之上，而是他們的僕人（路22:27）。
  target_path: link_folder/主題/利未人受職與祭司受職的差別.md
