book: 民數記
chapter: 5
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 本章第1、5、11節記載耶和華多次曉諭摩西，傳達不潔隔離、認罪賠償與疑恨試驗律例。BH 指出本章三段條例都以「耶和華曉諭摩西說」開頭（v1、5、11），每一次都重申摩西作為神與百姓之間中保的角色，而這些條例的權威來自神而非人的裁量。KC 補一句本章的位置：營盤已經編排好了，接下來要做的是把惡從營中除去，好讓那位他們力量所繫的神能與他們同在。
  relation: 摩西作為神與以色列民的中保，將關乎民營潔淨與家庭和睦的神聖律例忠實傳達給百姓。
- title: 大痲瘋（sara'at）
  path: link_folder/原文/大痲瘋（sara'at）.md
  summary: 本章第2節指令將長大痲瘋者送出營外隔離（v2）。GT指出此處大痲瘋指一般的傳染性皮膚疾病（如癬癩）；CT靈意表徵從人裏面罪性顯露出來的罪污；KC指出其預表爆發未經審判的罪。GT《啟導本》在本章特別限定這個詞的範圍：此處雖用「大痲瘋」一詞，「但指的只是疥一類的皮膚病，不用太久便可治好」（參利13 及民12:10-16）。GT《舊約聖經背景註釋》則把這類疾病的性質討論指回民數記十三章2節的註釋，並指出巴比倫文獻也提過類似限制，皮膚病患者被逼隔離，「很可能是在墳墓附近居住」。BH 說明這道隔離同時有兩層作用：實務上防止疾病擴散，象徵上代表罪的玷污性；而利未記13-14 章給了診斷與潔淨的細則。
  relation: 延伸利未記13-14章大痲瘋診斷與潔淨條例，落實大軍行軍安營時隔離不潔者的具體行政與屬靈防線。
- title: 漏症（身患漏症的條例）
  path: link_folder/原文/漏症（身患漏症的條例）.md
  summary: 本章第2節指令將患漏症者（性器官不正常流疾）送出營外。CT靈意表徵天然生命的洩漏與不潔；GT指出其指長期性器官流疾（利15章），預表不潔者不得立於神面前。GT《啟導本》在本章界定得很清楚：「漏症」指性器官長期不潔的排泄物，「潔淨以後須獻祭的那一種」（見利15；路8:43-48）。GT《聖經精讀本》從血的角度解釋為什麼算不潔：以色列百姓把血視為生命，因此血的流出意味著死亡（申12:23）。BH 指出這類條例涵蓋自然的與病理的分泌，重點在於禮儀上的潔淨，以及親近神所需要的分別。
  relation: 延伸利未記15章漏症條例，將性器官流疾之不潔者納入營外隔離防線。
- title: 認罪
  path: link_folder/主題/認罪.md
  summary: 本章第7節規定若犯了人常犯的罪干犯耶和華，「他要承認所犯的罪」。CT靈意指出不僅要向受害人認罪，更要向神認罪（約壹1:9）；GT《精讀本》指出向對方認罪是求原諒並承認神真理的正當性。GT 丁良才把本章第6至7節犯罪者該做的事列成四項：「1承認所犯的罪；2將所虧負的如數賠還；3另外要加上五分之一，歸與所虧負的人；4要獻贖罪祭（或作贖愆祭）。」他並指出第6節「那人就有了罪」講的是「良心有虧的人，不是指著因犯罪被捉拿的人」。GT《聖經精讀本》說明認罪的雙重指向：向對方承認自己的錯是為了求得對方原諒，也是為了承認神真理的正當性，把自己交托給神公義的審判；「悔改就應該同時面向人和神」。BH 指出舊約的認罪常是公開的承認（利5:5；書7:19-20），不只是口頭陳述而是真誠面對自己的過犯，並預示約翰一書一章9節所說的認罪與潔淨。
  relation: 與利未記5-6章贖愆祭之認罪條例呼應，強調人際間虧負之對付必須以真誠認罪與賠償為基礎。
- title: 加五分之一贖回原則
  path: link_folder/主題/加五分之一贖回原則.md
  summary: 本章第7節規定虧負人者除原數賠還外，「另外加上五分之一，也歸與所虧負的人」。CT指這是懲罰性賠償；BH指出加兩成（20%）可懲戒不誠實並補償受害人之不便；GT背景比較漢摩拉比法典加六分之一利息。GT《舊約聖經背景註釋》為本章的賠償比例給了一個外部對照：本段的案例是有人在法庭正式宣誓、訛騙他人而後來追悔，聖經的命令是向受害者、其親屬或祭司「照原數另加兩成賠款，再獻上適當的贖愆祭」；而「漢摩拉比法律典型的處罰，則在賠款之上加上六分之一，作為利息」。BH 指出加五分之一既是對不誠實的嚇阻，也是對受害者不便的補償，同一個比例在利未記六章5節與二十七章多處出現，可見它在以色列法制中的分量。
  relation: 承接利未記5:16、6:5、27:13等「加五分之一」補償原則，確立舊約律法關於侵權賠償與恢復同心和睦的公義法則。
- title: 贖愆祭（asham）
  path: link_folder/原文/贖愆祭（asham）.md
  summary: 本章第8節規定賠償虧負之外，犯罪者仍需獻上一隻公羊作為贖罪/贖愆祭。CT與GT說明賠償處理人際損害，贖愆祭公羊處理對神的干犯，兩者並行不可偏廢。GT 丁良才指出第8節「贖罪的公羊」就是利未記六章6節所吩咐的贖愆祭。GT《聖經精讀本》說明它與加五分之一的關係：加上五分之一的行為包含賠償的意思，呈現的是神的公義，而這件事「與贖愆祭的意義有關（利5:14-6:7）」。BH 指出這隻公羊處理的是同一件事的另一面：賠償對付的是虧負人的部分，贖愆祭對付的是干犯神的部分，兩者缺一不可。
  relation: 呼應利未記5:14-6:7贖愆祭條例，強調任何得罪人的罪本質上皆干犯了神，必須藉血祭贖罪。
- title: 舉祭
  path: link_folder/原文/舉祭.md
  summary: 本章第9節規定「以色列人一切的聖物中，所奉給祭司的舉祭都要歸與祭司」。CT說明舉祭指將祭物垂直向上舉起擺動表示獻給神，後歸祭司享用；BH指出這是對無土地產業之祭司階層的日常生活供應保障。
  relation: 與利未記7:14、32與民數記18章舉祭定例呼應，劃清聖物中歸給祭司應得之分的合法權益。
- title: 聖物
  path: link_folder/主題/聖物.md
  summary: 本章第9-10節規定以色列人分別為聖之物與舉祭聖物一律歸給祭司。CT說明聖物係指分別出來歸給神為聖的祭物與禮物；GT《精讀本》說明「分別為聖」意即離開人的手完全獻給神。GT 丁良才解釋第9節的「舉祭」是什麼：就是「那在耶和華面前被舉起來，卻沒有被燒在祭壇上的祭物」，這些祭物既已獻上就屬乎耶和華，「故此耶和華使這些祭物歸與獻此祭的祭司」。GT《民數記串珠聖經註釋》提醒一個容易混淆的界線：賠償若歸給祭司，「這補償不能代替贖罪時應當獻上的祭物及應當歸給祭司的禮物（舉祭），若將二者混淆，便是進一步的取巧犯罪」。BH 指出祭司沒有地業（民18:20-21），靠百姓的供物維生，這條規定因此同時是供養制度的一環，也是新約「傳福音的靠福音養生」的先聲（林前9:13-14）。
  relation: 連結利未記與民數記關於聖物劃歸、禁私用及供給祭司聖職的律法體系。
- title: 忌邪（嫉妒）
  path: link_folder/原文/忌邪（嫉妒）.md
  summary: 本章第14與30節「疑恨的心」（原文 qin'ah：妒忌、狂熱），指丈夫對妻子生了疑忌的心。GT與KC說明此疑恨若出自維護婚姻純潔之真愛，本身不構成犯罪；KC並延伸至神對祂子民不貞（拜偶像/世俗妥協）的神聖忌邪（林後11:2）。STEP 原文資料顯示本章第14節「疑恨的心」在原文是名詞 קִנְאָה（qin.ah，H7068，詞典義 jealousy）配上「靈」字，逐字是「疑恨的靈臨到他身上」；緊接的動詞則是同一字根的 קָנָא（qa.na，H7065）。CT 的原文字義正好把兩者分開注：名詞作妒忌、狂熱，動詞作嫉妒、發熱心，各出現兩次。GT《聖經精讀本》為這種疑心定位：丈夫因家庭的和睦所懷有的疑心「並不構成罪」。KC 說得更正面：這裡的忌邪不該被看成負面的性情，而是「真誠的愛在所愛的對象不以愛回應時，會有的正當感受」。BH 指出這個希伯來詞也可以帶有保護性的熱心之意，在古代近東的脈絡裡，婚姻中的忌邪牽涉的是血脈與繼承，因此不只是私人情緒，也是法律與社會問題。
  relation: 深化舊約中關於忌邪/嫉妒之原文涵義，從神對選民的神聖忌邪延伸至人際婚姻中維護純潔的保護性疑忌。
- title: 搖祭
  path: link_folder/原文/搖祭.md
  summary: 本章第25節規定祭司要從婦人手中取疑恨的素祭，「在耶和華面前搖一搖」。CT說明這是將素祭前後擺動獻給神；本章將搖祭用於無油無乳香的大麥面素祭，是搖祭用於非平安祭脈絡的特例。CT 解釋第25節的動作：「搖一搖」指前後擺動，祭司要從婦人手中取那疑恨的素祭，在耶和華面前搖一搖，然後拿到壇前。BH 指出在神面前搖一搖是把供物呈給神、承認祂主權的動作，也是一種分別為聖的表示——把這件事從人的手中移交到神的審斷之下。
  relation: 補充出埃及記29章、利未記7章、8章、14章、23章搖祭體系，展現搖祭動作在疑恨審判儀式中的獨特應用。
- title: 紀念份
  path: link_folder/原文/紀念份.md
  summary: 本章第26節規定祭司要從疑恨素祭中「取出一把，作為這事的紀念，燒在壇上」。CT說明紀念指將這事向神陳明；GT《精讀本》說明這是作為獻給「神的證據」。CT 說明第26節的動作與用意：祭司「要從素祭中取出一把，作為這事的紀念」，而「紀念」指將這事向神陳明；先獻祭，後叫婦人喝苦水。GT《聖經精讀本》把「紀念」注為「獻給神的證據」。STEP 原文資料顯示第18節「思念的素祭」用的正是 זִכָּרוֹן（zikh.ron，H2146，詞典義 memorial）。BH 指出取一把燒在壇上的做法與利未記二章2節的素祭一致，而在本章的脈絡裡，它是把整件事帶到神面前存記、等候神判斷的動作。
  relation: 呼應利未記2:2、5:12常規素祭取出一把作為紀念份燒在壇上的典章，將疑案陳明於神面前。
- title: 伊法
  path: link_folder/原文/伊法.md
  summary: 本章第15節規定疑恨素祭的份量為「大麥麵伊法十分之一」。GT說明十分之一伊法約折合2.2公升，此乃個人獻素祭的標準乾量單位。CT 給本章的換算：「伊法十分之一」約折合二點二公升。GT《民數記串珠聖經註釋》給的數字相同（2.2公升）。BH 指出這個明確的分量反映獻祭制度的秩序與精確，而所用的是大麥而非小麥，在當時代表較低的身分或較卑微的供物。
  relation: 與出埃及記16:36、利未記5:11、6:20等處伊法容量單位及十分之一伊法素祭份量相互對照。
- title: 洗濯盆（銅盆）
  path: link_folder/主題/洗濯盆（銅盆）.md
  summary: 本章第17節祭司盛在瓦器裡的「聖水」，CT與GT均指出係取自會幕外院的銅洗濯盆（出30:18）。GT《精讀本》指出洗濯盆的水象徵潔淨信徒靈魂的活水與基督寶血。CT 指出第17節的「聖水」意指從洗濯盆取出來的水（參出30:18）。GT 丁良才說法相同：「就是從浴盆中取出來的水。」GT《聖經精讀本》注意到一個反轉：洗濯盆的水本來是祭司進聖所或近壇前洗手腳用的，目的正是洗去帳幕地上的塵土；這裡卻把帳幕地上的塵土放進水中，「是指使水起到反作用的意思」——象徵生命的水變成死亡與審判的水。BH 指出用瓦器盛這水也有意思：瓦器是常見而卑微的器皿，呼應人由塵土造成、生命脆弱的事實（創2:7）。
  relation: 連結出埃及記30:18與40:30洗濯盆之潔淨功能，將事奉洗滌聖水延伸用於試驗隱密罪惡的儀式中。
- title: 污穢
  path: link_folder/主題/污穢.md
  summary: 本章貫穿「污穢」主題：v3「免得污穢他們的營」，v13, 19, 20, 27, 29「背著丈夫行了污穢的事」。CT與GT指出污穢包含疾病、死亡、罪惡與性不貞，神同住的軍營與婚姻絕不容許污穢。STEP 原文資料在本章給出一組可以機械查證的對應：GT《民數記串珠聖經註釋》說本章所記的罪「皆源於不忠實」，並點名第6節的「干犯」、第12節與第27節的「得罪」原文是同一個字、意思是「不忠實」。STEP 的比對結果與此完全相符：מָעַל（ma.al，H4603，詞典義 be unfaithful）在本章正好出現三次，位置正是 v6、v12、v27，此外再無其他出處。CT 的原文字義也在這三處注出同樣的意思（行為不忠或奸詐、不忠實或背叛的行為）。BH 指出「不忠實」一詞在舊約常用來描寫以色列對神的背約，而婚姻中的不忠與屬靈上的不忠在聖經裡本就互為表裡（如何西阿書）。
  relation: 連結利未記11-15章與民數記全書關於潔淨與污穢的神學架構，維護神同在之軍營的絕對聖潔。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: 本章第15、18、25-26節規範「疑恨的素祭」，使用最粗賤的大麥麵，且絕不可澆油、不可加乳香（v15）。CT與KC指出此乃特殊的贖罪審判性素祭，無油無乳香因為神絕不在不義中得喜樂。GT《民數記串珠聖經註釋》指出本章的素祭是個特例：通常加油和乳香代表喜樂和感恩（利2:15），此處不加，是要表明獻者的不潔和悲哀贖罪的心態（參利5:11）。GT《聖經精讀本》另給技術性理由：這素祭不與燔祭或平安祭一同獻上，只單獻素祭。STEP 原文資料顯示第18節這份供物的原形是 מִנְחָה（min.chah，H4503G，詞典義 offering），而修飾它的兩個名稱一個是 זִכָּרוֹן（memorial），一個是「疑恨」的複數形。BH 指出油與乳香通常使供物更為芬芳、象徵喜樂與感謝，此處刻意省去，正凸顯這不是慶典而是一場嚴肅的查驗。
  relation: 為利未記第2章與第6章素祭體系補充針對婚姻疑忌、不加油乳香的特殊素祭變體。
