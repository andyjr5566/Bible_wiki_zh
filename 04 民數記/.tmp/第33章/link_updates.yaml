book: 民數記
chapter: 33
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 第1節「在摩西、亞倫的手下出埃及地」；第2節「摩西遵著耶和華的吩咐記載他們所行的路程」；第50節耶和華在摩押平原約但河邊、耶利哥對面曉諭摩西，交代進迦南後的四道吩咐。
  relation: 本章是摩西一項少被注意的工作的記錄。CT 在〔話中之光〕說：「從蘭塞到約旦河的行程，歷時近40年，摩西從未間斷地『記載』了整個過程。」四十二站的清單就是他這項工作的成品。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 第1節與摩西並列為出埃及的領導；第38-39節「祭司亞倫遵著耶和華的吩咐上何珥山，就死在那裡」，年一百二十三歲，時間是出埃及後四十年五月初一日。
  relation: GT 丁良才註「聖書上只在本處記亞倫去世的日期」，並對照他站在法老面前時年八十三歲（出7:7）；CT 註他比摩西年長三歲。本章是亞倫一生的兩個端點在同一章裡出現。
- title: 亞倫卒於何珥山與祭司職任更替
  path: link_folder/神學/亞倫卒於何珥山與祭司職任更替.md
  summary: 第38-39節給了這件事唯一的確切日期：出埃及後四十年五月初一日，亞倫遵著耶和華的吩咐上何珥山死在那裡，年一百二十三歲。BH 註何珥山是大祭司職分由亞倫轉給以利亞撒的地方，這標誌著一個時代的結束。
  relation: CT 在〔話中之光〕把它讀成整代人的界線：「亞倫死了，表示舊以色列時代已經不復存在」。這一節夾在行程表中間，是全章唯一有日期的一點。
- title: 蘭塞
  path: link_folder/地點/蘭塞.md
  summary: 第3、5節：正月十五日、逾越節的次日，以色列人從蘭塞起行，是四十二站的第一站。CT 註蘭塞也是以色列人定居埃及的地方（創47:11）；BH 註它常與蘭塞二世所建的比蘭塞城相對應，考古證據顯示出埃及的傳統年代它正是一座興盛的城。
  relation: 它是本章行程表的起點，也是 GT《舊約聖經背景註釋》列為「至少暫時可考」的地名之一。
- title: 疏割
  path: link_folder/地點/疏割.md
  summary: 第5、6節第二站。CT 給的字義是「畜棚，貨攤」；BH 註疏割意為「棚」或「臨時住處」，指出這個名字與住棚節紀念曠野漂流的緣由相接（利23:42-43）。
  relation: 它在本章的位置是離開定居生活、進入曠野的第一步；名字本身就說明了往後四十年的居住形態。
- title: 以倘
  path: link_folder/地點/以倘.md
  summary: 第6、7節第三站「曠野邊的以倘」。CT 從字義「海邊」推它靠近紅海邊；GT 丁良才另有一說：「本章6節的以倘，原來在死海旁邊。」第8節另有「伊坦的曠野」，CT 說它「聖經中僅在此提到一次，可能是書珥曠野的一部分」，GT 丁良才則說「伊坦曠野，就是書珥曠野」。
  relation: 以倘與伊坦曠野的關係是本章少數兩家給法不同的地理細節：CT 說可能是書珥曠野的一部分，GT 說就是書珥曠野。
- title: 比哈希錄
  path: link_folder/地點/比哈希錄.md
  summary: 第7、8節。CT 依出14:2 判定第四站的站名應為比哈希錄，實際安營處是在巴力洗分和密奪兩處埃及防營之間、靠近比哈希錄的海邊；BH 註這名字可能意為「峽谷之口」。
  relation: 第7節的「轉到」是關鍵：CT 註以色列人奉神命令轉回頭，不是轉回原出發地，而是轉變方向朝紅海行進——這一轉正是把法老追兵引出來的安排。
- title: 巴力洗分
  path: link_folder/地點/巴力洗分.md
  summary: 第7節「是在巴力洗分對面」。CT 註它可能是密奪北面的另一座防城，埃及在那裡佈置了一批邊防軍；BH 註這個名字很可能與埃及人所拜的一位神明有關，可能是一座山或一座廟。
  relation: 它與本章第4節「耶和華也敗壞他們的神」形成對照：以色列人過海的地點，正對著一座以外邦神為名的地方。
- title: 密奪
  path: link_folder/地點/密奪.md
  summary: 第7節「就在密奪安營」。CT 註密奪是埃及東面國境上設有守望塔的防城，根據文獻埃及在那裡築了一道邊牆；BH 註密奪意為「塔」或「堡壘」，顯示這是一處有軍事意義的地點。
  relation: 它與巴力洗分一同標出以色列人過海前所處的位置：兩座埃及防營之間。
- title: 書珥的曠野
  path: link_folder/地點/書珥的曠野.md
  summary: 第8節「經過海中到了書珥曠野，又在伊坦的曠野走了三天的路程」。CT 註書珥曠野一般相信位於西乃半島的西北角，以色列人由此地轉向南方；GT 丁良才說伊坦曠野就是書珥曠野（出15:22）。
  relation: 這是過紅海之後的第一段陸路，也是三天無水的那一段——CT 在別處註這象徵屬靈道路上難免有乾渴之經歷。
- title: 瑪拉
  path: link_folder/地點/瑪拉.md
  summary: 第8、9節第五站。CT 註在此丟一棵樹在水裡，變苦水為甜水（出15:23）。GT《民數記串珠聖經註釋》指出瑪拉在它的六程排法裡是第一程的第五站，與第五程第五站的加低斯同為「神供水的地方」。
  relation: 串珠的六程排法把瑪拉與加低斯放在對稱的位置上，兩處都是神在缺水時供水之地。
- title: 以琳
  path: link_folder/地點/以琳.md
  summary: 第9節「以琳有十二股水泉，七十棵棕樹」。CT 把十二與七十讀成十二支派與七十位長老；GT《聖經精讀本》同樣說「『十二』和『七十』是以色列十二支派的數和長老的數(11:16),從這一點上象徵著整個以色列」；BH 另外提出七十棵棕樹也可能對應創10 所列的七十國。
  relation: 它緊接在瑪拉之後：苦水的下一站就是十二股水泉。CT 在〔話中之光〕註摩西沒有述說在瑪拉所受百姓的埋怨，卻詳談以琳的水泉與棕樹。
- title: 海（紅海）
  path: link_folder/地點/海（紅海）.md
  summary: 第10、11節第七站「安營在紅海邊」。CT 註《出埃及記》中沒有提到這一站。GT《民數記串珠聖經註釋》的六程排法把過紅海放在第七站的位置上，與第一站的出埃及、第十二站的頒律法並列為三個節點。
  relation: 本章讓紅海出現兩次：第8節是「經過海中」的事件，第10節是「安營在紅海邊」的站口，一個是行動、一個是地點。
- title: 汛的曠野
  path: link_folder/地點/汛的曠野.md
  summary: 第11、12節第八站。CT 註它位於向南往西乃的半途上，是一片長滿荊棘的曠野，難於找到食物；以色列人抱怨，在此地開始有降嗎哪的神蹟（出16:13-15）。
  relation: GT 串珠指出第八站（汛的曠野）與第一站在事件類型上對稱：兩處都是神蹟奇事，一處是擊殺長子，一處是天降嗎哪。
- title: 利非訂
  path: link_folder/地點/利非訂.md
  summary: 第14、15節「安營在利非訂；在那裡，百姓沒有水喝」。CT 註在那裡發生兩件大事：杖打磐石流出水來給百姓喝（出17:6-7），以及與亞瑪力人爭戰得勝、築壇起名耶和華尼西（出17:8-15）。
  relation: 這是四十二站清單中少數幾處附帶說明事故的站口。KC 指出清單裡被提到的事件，都不是指向百姓罪的事件——利非訂記的是缺水，不是爭鬧。
- title: 西乃的曠野
  path: link_folder/地點/西乃的曠野.md
  summary: 第15、16節第十二站。CT 註它位於西乃半島的南端，境內有西乃山，又稱神的山，神就在那山頂上降下律法。GT 串珠把第十二站列為六程排法中的第三個節點：在這裡頒發律法。
  relation: 在本章的清單裡，西乃只是四十二站中的一站，佔的篇幅和其他任何一站一樣——出埃及記19 章到民數記10 章之間發生的一切，在這裡只剩一行。
- title: 基博羅哈他瓦
  path: link_folder/地點/基博羅哈他瓦.md
  summary: 第16、17節第十三站。CT 註原文字義是「貪慾之人的墳墓」，在吃鵪鶉之際被瘟疫殺死了很多人（民11:34）。
  relation: 它是判斷他備拉與基博羅哈他瓦是否同一地的關鍵：本章的行程表列了基博羅哈他瓦，卻沒有列民11:3 的他備拉。
- title: 哈洗錄
  path: link_folder/地點/哈洗錄.md
  summary: 第17、18節第十四站。CT 註在此地發生米利暗長大痲瘋的事，行程被耽延了七天（民12:10、15）；BH 註哈洗錄意為「圍場」或「村落」。
  relation: GT 串珠的排法把第十四站與第七站對應，兩處都與米利暗有關（過紅海後的米利暗之歌與哈洗錄的米利暗事件）。
- title: 加低斯
  path: link_folder/地點/加低斯.md
  summary: 第36、37節「從以旬迦別起行，安營在尋的曠野，就是加低斯」。CT 註加低斯是第三十三站，並在〔話中之光〕說它是以色列惹神怒氣最嚴重的地方、四十年飄流從那裡開始。GT 丁良才與 CT 都提出利提瑪可能就是加低斯的古名。
  relation: CT 注意到一件事：在行程的記錄裡神不題加低斯這個名字（指第18節的利提瑪），並讀成「神的赦免使加低斯的失敗沒有留下在記錄中」——直到第36節才以「尋的曠野，就是加低斯」出現。
- title: 何珥山
  path: link_folder/地點/何珥山.md
  summary: 第37-41節：從加低斯起行安營在何珥山，那是以東地的邊界；亞倫死在這裡。CT 註其確實地點不詳，僅知以色列人避過正面與以東人發生衝突、離開以東人的視野。
  relation: GT 串珠的六程排法指出第四、五、六程的第六站都是領袖去世或安葬之處，何珥山是其中之一。
- title: 以東
  path: link_folder/地點/以東.md
  summary: 第37節「安營在何珥山，以東地的邊界」。BH 註以東是以掃後裔之地，與以色列既是親族又是對頭；民20:14-21 以東拒絕以色列假道，迫使他們繞遠路，本章第41節之後的幾站正是這條繞道。
  relation: 本章的行程表把以東的拒絕變成了地理事實：撒摩拿、普嫩、阿伯這幾站，就是繞行以東邊界留下的痕跡。
- title: 底本
  path: link_folder/地點/底本.md
  summary: 第45、46節「安營在底本迦得」。CT 與 GT 丁良才都說這名字大概是因迦得人修補底本城起的（參民32:34），是亞嫩河北面的古城。
  relation: 同一座城在民32 是迦得子孫建造的城邑之一，在本章是行程表上的第三十九站——名字裡多出來的「迦得」正是兩章之間的連結。
- title: 亞巴琳山
  path: link_folder/地點/亞巴琳山.md
  summary: 第47、48節第四十一站「安營在尼波對面的亞巴琳山裡」。CT 註亞巴琳山是死海和約但河東邊那一帶山嶺的總稱，北部一帶名叫毗斯迦，其中最高峰名叫尼波，與河西的耶利哥相對。
  relation: GT 串珠指出摩西死在亞巴琳山（申32:49-50），這使它成為六程排法中第六程的第六站——與何珥山、摩西錄同屬領袖離世之地。
- title: 摩押平原
  path: link_folder/地點/摩押平原.md
  summary: 第48、49、50節第四十二站，也是最後一站：「他們在摩押平原沿約但河邊安營，從伯耶施末直到亞伯什亭。」CT 註兩地從南到北相距約二十公里，表示以色列軍營展開長達約有二十公里。
  relation: 第50節起耶和華就在這裡曉諭摩西進迦南後的吩咐——行程表的終點同時是下一段律法的起點。
- title: 什亭（亞伯什亭）
  path: link_folder/地點/什亭（亞伯什亭）.md
  summary: 第49節「從伯耶施末直到亞伯什亭」。CT 給的字義是「刺槐之草地」；GT《舊約聖經背景註釋》把它列為可考地名之一，位置是克夫雷因乾河畔的漢曼遺址或東面不遠的克夫雷因遺址。
  relation: BH 指出這裡正是民25 以色列人與摩押女子犯罪之處——本章把它當作營地北界平鋪直述地記下，沒有提那件事。
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: 第48、50節「摩押平原約但河邊、耶利哥對面」。GT《啟導本聖經註釋》註耶利哥在約但河西，與以色列安營的什亭隔河遙遙相對；此處特別提到耶利哥，因它屬迦南重鎮，也是以色列人進迦南最先攻打的一座城。
  relation: 行程表的最後一站是以耶利哥為參照座標定位的——清單結束在能望見下一個目標的地方。
- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 第51節「你們過約但河進迦南地的時候」；第40節「住在迦南南地的迦南人亞拉得王」。第52-56節整段吩咐都是關於進入迦南之後要怎麼做。
  relation: 本章的結構是回顧與前瞻各半：前四十九節是走過的路，五十節起是要進的地。KC 說回顧之後，現在得到的是前瞻。
- title: 約但河
  path: link_folder/地點/約但河.md
  summary: 第48、49、50節安營在摩押平原約但河邊；第51節「你們過約但河進迦南地的時候」。
  relation: 在民32 它是兩支派不肯過的那條河，在本章它是行程表的終點座標與下一段命令的起點——同一條河，兩章的作用完全不同。
- title: 瑪拉苦水變甜
  path: link_folder/事件/瑪拉苦水變甜.md
  summary: CT 在第8節註「『瑪拉(Marah)』第五站(參出十五23)，在此丟一棵樹在水裡，變苦水為甜水」；BH 也在同節回顧這件事，說苦水變甜是信心與順服的試驗。
  relation: GT 串珠把瑪拉放在六程排法的第一程第五站，與第五程第五站的加低斯並列為「神供水的地方」——本章讓這兩次供水在結構上對稱。
- title: 過紅海
  path: link_folder/歷史/過紅海.md
  summary: 第8節「從比哈希錄對面起行，經過海中到了書珥曠野」。CT 註『經過海中』指神使用神蹟，使以色列人走在乾地上，到達紅海的對岸（出14:21-22）。
  relation: 本章把這件事壓縮成半句話。GT 串珠的六程排法卻把它放在第七站的位置上，與第一站的出埃及、第十二站的頒律法並列為三個結構節點。
- title: 戰勝亞拉得王
  path: link_folder/歷史/戰勝亞拉得王.md
  summary: 第40節「住在迦南南地的迦南人亞拉得王聽說以色列人來了」。CT 註亞拉得在南地的北部，位於希伯崙以南約二十七公里；BH 註這句話標誌著迦南人開始有組織地防備以色列人。
  relation: CT 在〔話中之光〕讀出的重點是時間：「四十年的時光沒有改變他們得勝的行程，終於叫迦南人知道他們來了。」
- title: 曠野飄流四十年
  path: link_folder/歷史/曠野飄流四十年.md
  summary: 第38節「以色列人出了埃及地後四十年」是本章唯一一次點出四十年這個數字。GT《聖經精讀本》算過一筆帳：從埃及到摩押是一般旅行者一週就能走完的短距離，以色列卻走了四十年。
  relation: 本章是這四十年的完整清單。同一份清單被讀出兩種相反的重點：KC 讀成神只記進度，《聖經精讀本》讀成犯罪與苦難的記錄。
- title: 逾越節
  path: link_folder/歷史/逾越節.md
  summary: 第3節「正月十五日，就是逾越節的次日，以色列人從蘭塞起行」。CT 註這也是無酵節的第一日（利23:6；民28:17）；KC 指出這個時間點預設了逾越節所代表的事與脫離埃及為奴之間的直接關聯。
  relation: 四十二站的第一站有明確日期，而且這個日期是接在逾越節後面的——整趟行程的起算點是那一夜的羔羊。
- title: 第十災（殺長子之災）
  path: link_folder/歷史/第十災（殺長子之災）.md
  summary: 第4節「那時，埃及人正葬埋他們的長子，就是耶和華在他們中間所擊殺的」。CT 註在逾越節的那一夜神擊殺埃及人所有的長子（出12:29）；GT 丁良才註這顯明那時以色列人本有起行的好機會。
  relation: 本章把出埃及那一刻拍成了兩個並排的鏡頭：一邊是埃及人在埋葬長子，一邊是以色列人昂然無懼地走出去。
- title: 十災
  path: link_folder/歷史/十災.md
  summary: 第4節「耶和華也敗壞他們的神」。CT 註這指神降十災（書24:5），就是對埃及人所崇拜的眾神施行審判；GT《聖經精讀本》說降在埃及地上的災難並不局限於人和自然，也包括他們所事奉的神。
  relation: 本章用一句話總括十災的意義：它們不只是自然災害，而是對埃及萬神殿的審判。STEP 顯示原文正是 'a.Sah 加 she.fa.Tim（H8201，詞典義 judgment）。
- title: 米利暗卒於加低斯
  path: link_folder/事件/米利暗卒於加低斯.md
  summary: GT《啟導本聖經註釋》在第38節註：「米利暗死後半年亞倫也死了；亞倫死後六個月，摩西也隨著去世（比較申一3；三十四章）。」本章記下的亞倫死期，成了推算三位領袖離世時間的基準點。
  relation: 本章沒有記米利暗的死，但它提供的日期讓她的死可以被定位——這是行程表少數帶年月日的一處。
- title: 拈鬮分地（go.ral）
  path: link_folder/主題/拈鬮分地（go.ral）.md
  summary: 第54節「你們要按家室拈鬮，承受那地；人多的，要把產業多分給他們；人少的，要把產業少分給他們。拈出何地給何人，就要歸何人。」CT 把原則列成三項：以家室為單位、按照拈鬮結果、土地大小依據人數多少。GT 丁良才註以色列人分地不但要按支派拈鬮，也要按宗族和家屬拈鬮。
  relation: CT 在〔話中之光〕點出這裡的張力：「拈鬮的方法是很難達成人多就多得，人少就少得的要求的，但神定規了這樣作。」他把這解成對神的權柄與恩典的信心承受。
- title: 產業（na.cha.lah）
  path: link_folder/原文/產業（na.cha.lah）.md
  summary: 第54節兩次「產業」都是 H5159 na.cha.lah；STEP 顯示這一節前後由兩個 Hitpael 動詞 hit.na.chal.Tem 與 tit.ne.Cha.lu（H5157）包住，中間的「多分」與「少分」則是 ra.vah（H7235A，使變多）與 ma.at（H4591，使變少）。
  relation: 民27 用這個字處理女兒的繼承，民32 用它處理支派要不要換地，本章用它處理全地的分配辦法——同一個字一路擴大到整片迦南。
- title: 邱壇與日像被毀（拜偶像的終極審判）
  path: link_folder/主題/邱壇與日像被毀（拜偶像的終極審判）.md
  summary: 第52節「又拆毀他們一切的邱壇」。CT 註必須拆毀一切建在高地上的異教神廟和神壇等崇拜設施；STEP 顯示「邱壇」是 ba.mo.Ta/m（H1116，詞典形 ba.mah，簡要詞典義 high place），動詞是 sha.mad（H8045）。
  relation: GT 丁良才記下後來的結果：以色列人不遵行，反倒在邱壇上獻祭，並且迷信邱壇和在邱壇上拜偶像的事，以為是侍奉耶和華。
- title: 不可為自己雕刻偶像
  path: link_folder/神學/不可為自己雕刻偶像.md
  summary: 第52節「毀滅他們一切鏨成的石像和他們一切鑄成的偶像」。BH 把這道命令接回十誡的第一、二誡（出20:3-4），並指出這些偶像多是巴力與亞舍拉之類神明的形像，以木、石或金屬製成。
  relation: 十誡禁止以色列人自己造偶像，本章這一節則要求他們毀掉別人已經造好的——同一條誡命的另一面。
- title: 迦南七族（迦南地原住民）
  path: link_folder/背景/迦南七族（迦南地原住民）.md
  summary: 第52節「就要從你們面前趕出那裡所有的居民」、第55節「倘若你們不趕出那地的居民」。BH 註這地的居民即迦南人，以拜偶像與道德敗壞著稱，趕出他們不只是軍事征服，也是屬靈的清理。
  relation: 本章第55-56節把不趕出的後果說得極重：所容留的必作眼中的刺、肋下的荊棘，神素常有意怎樣待他們也必照樣待以色列。
- title: 拆毀偶像律例
  path: link_folder/事件/拆毀偶像律例.md
  summary: 第52節一節之內列出三類必須毀滅的對象：鏨成的石像、鑄成的偶像、邱壇；STEP 顯示對應三個不同的動詞 ya.rash（H3423H）、a.vad（H6，用了兩次）、sha.mad（H8045）。GT《聖經精讀本》指出同樣的指示也見於出23:31、利26:1、申7:2 等處，說明這是必須執行的命令。
  relation: 這是進迦南前重申的舊命令。KC 說饒過神的仇敵是一種危險的人道之情，並指出約書亞在告別演說裡用了同樣的話警告百姓（書23:11-13）。
- title: 越過耶和華的口（peh）
  path: link_folder/原文/越過耶和華的口（peh）.md
  summary: '第2節「摩西遵著耶和華的吩咐記載他們所行的路程」與第38節「祭司亞倫遵著耶和華的吩咐上何珥山」；STEP 顯示兩處的「吩咐」都是 pi（H6310I，詞典形 peh，簡要詞典義 lip: word），字面是耶和華的口。'
  relation: 民22 巴蘭說他不能越過耶和華的口，本章則是摩西與亞倫照著耶和華的口去做——同一個詞，一邊是不敢逾越的界線，一邊是照著執行的依據。
- title: 他備拉與基博羅哈他瓦是否同一地
  path: link_folder/解經爭議/他備拉與基博羅哈他瓦是否同一地.md
  summary: 本章第16-17節的行程表列了基博羅哈他瓦，卻沒有列民11:3 的他備拉——這正是主張兩地是同一地的第一項理由：那份四十二站的清單本身就可以逐一比對。
  relation: 本章因此是這場爭議最直接的證據來源——四十二站的清單本身就是一份可以逐一比對的名單。
- title: 昂然無懼
  path: link_folder/原文/昂然無懼.md
  summary: 第3節「在一切埃及人眼前昂然無懼地出去」。CT 註『昂然無懼』原文是「高舉的手」，形容仇敵無能為力、因此放膽行動；GT《聖經精讀本》同樣說這是「高舉的手」的意思，是強調神的能力時經常使用的手法；KC 說這是耶和華高舉的手，代表祂在救贖中崇高而有能力的作為。STEP 顯示是 be./Yad（H3027G）加 ra.Mah（H7311A，詞典形 rum，詞典義 to exalt）。
  relation: 本章第4節緊接著說明這底氣的來源：那時埃及人正葬埋他們的長子，耶和華也敗壞了他們的神。
