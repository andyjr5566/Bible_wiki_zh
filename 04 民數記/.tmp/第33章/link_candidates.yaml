book: 民數記
chapter: 33
candidates:
- name: 摩西
  type: 人物
  surfaces:
  - 摩西
  evidence: 第1節「在摩西、亞倫的手下出埃及地」；第2節「摩西遵著耶和華的吩咐記載他們所行的路程」；第50節耶和華在摩押平原曉諭摩西。
- name: 亞倫
  type: 人物
  surfaces:
  - 亞倫
  evidence: 第1節與摩西並列為出埃及的領導；第38-39節亞倫遵耶和華的吩咐上何珥山，死在那裡，年一百二十三歲。
- name: 亞倫卒於何珥山與祭司職任更替
  type: 神學
  evidence: 第38-39節記亞倫的死與年歲；GT 丁良才註「聖書上只在本處記亞倫去世的日期」；BH 註何珥山是大祭司職分由亞倫轉給以利亞撒的地方。
- name: 蘭塞
  type: 地點
  surfaces:
  - 蘭塞
  evidence: 第3、5節：正月十五日以色列人從蘭塞起行，是四十二站的第一站；CT 註它也是以色列人定居埃及的地方（創47:11）。
- name: 疏割
  type: 地點
  surfaces:
  - 疏割
  evidence: 第5、6節第二站；CT 給的字義是「畜棚，貨攤」；BH 註疏割意為「棚」或「臨時住處」，與住棚節的緣由相接（利23:42-43）。
- name: 以倘
  type: 地點
  surfaces:
  - 以倘
  evidence: 第6、7節第三站「曠野邊的以倘」；CT 從字義「海邊」推它靠近紅海邊；GT 丁良才則說「本章6節的以倘，原來在死海旁邊」。
- name: 比哈希錄
  type: 地點
  surfaces:
  - 比哈希錄
  evidence: 第7、8節；CT 依出14:2 判定第四站的站名應為比哈希錄，實際安營處在巴力洗分和密奪兩處埃及防營之間。
- name: 巴力洗分
  type: 地點
  surfaces:
  - 巴力洗分
  evidence: 第7節「是在巴力洗分對面」；CT 註它可能是密奪北面的另一座防城；BH 註這名字與埃及人所拜的神明有關。
- name: 密奪
  type: 地點
  surfaces:
  - 密奪
  evidence: 第7節「就在密奪安營」；CT 註密奪是埃及東面國境上設有守望塔的防城，根據文獻埃及在那裡築了一道邊牆。
- name: 書珥的曠野
  type: 地點
  surfaces:
  - 書珥曠野
  evidence: 第8節「經過海中到了書珥曠野」；CT 註它位於西乃半島的西北角，以色列人由此轉向南方；GT 丁良才說伊坦曠野就是書珥曠野。
- name: 瑪拉
  type: 地點
  surfaces:
  - 瑪拉
  evidence: 第8、9節第五站；CT 註在此丟一棵樹在水裡，變苦水為甜水（出15:23）。
- name: 以琳
  type: 地點
  surfaces:
  - 以琳
  evidence: 第9節「以琳有十二股水泉，七十棵棕樹」；CT 與 GT《聖經精讀本》都把十二與七十讀成十二支派與七十長老。
- name: 海（紅海）
  type: 地點
  surfaces:
  - 紅海
  evidence: 第10、11節第七站「安營在紅海邊」；CT 註《出埃及記》中沒有提到這一站。
- name: 汛的曠野
  type: 地點
  surfaces:
  - 汛的曠野
  evidence: 第11、12節第八站；CT 註以色列人在此抱怨，並在此地開始有降嗎哪的神蹟（出16:13-15）。
- name: 利非訂
  type: 地點
  surfaces:
  - 利非訂
  evidence: 第14、15節「安營在利非訂；在那裡，百姓沒有水喝」；CT 註在那裡發生兩件大事：杖打磐石流出水來，以及與亞瑪力人爭戰得勝。
- name: 西乃的曠野
  type: 地點
  surfaces:
  - 西乃的曠野
  evidence: 第15、16節第十二站；CT 註境內有西乃山，神就在那山頂上降下律法。
- name: 基博羅哈他瓦
  type: 地點
  surfaces:
  - 基博羅哈他瓦
  evidence: 第16、17節第十三站；CT 註原文字義「貪慾之人的墳墓」，在吃鵪鶉之際被瘟疫殺死了很多人。
- name: 哈洗錄
  type: 地點
  surfaces:
  - 哈洗錄
  evidence: 第17、18節第十四站；CT 註在此地發生米利暗長大痲瘋的事，行程被耽延了七天。
- name: 加低斯
  type: 地點
  surfaces:
  - 加低斯
  evidence: 第36、37節「安營在尋的曠野，就是加低斯」；CT 註加低斯是以色列惹神怒氣最嚴重的地方，在那裡開始了四十年的飄流。
- name: 何珥山
  type: 地點
  surfaces:
  - 何珥山
  evidence: 第37-41節：以東地的邊界，亞倫死在那裡；CT 註以色列人避過正面與以東人發生衝突。
- name: 以東
  type: 地點
  surfaces:
  - 以東地
  evidence: 第37節「安營在何珥山，以東地的邊界」；BH 註以東是以掃後裔之地，與以色列既是親族又是對頭。
- name: 底本
  type: 地點
  surfaces:
  - 底本迦得
  evidence: 第45、46節「安營在底本迦得」；CT 與 GT 丁良才都說這名字大概是因迦得人修補底本城起的（參民32:34）。
- name: 亞巴琳山
  type: 地點
  surfaces:
  - 亞巴琳山
  evidence: 第47、48節第四十一站；CT 註亞巴琳山指死海和約但河東邊那一帶山嶺的總稱，其中北部山區名叫毗斯迦，最高峰名叫尼波。
- name: 摩押平原
  type: 地點
  surfaces:
  - 摩押平原
  evidence: 第48、49、50節第四十二站；CT 註兩地從南到北相距約二十公里，表示以色列軍營展開長達約有二十公里。
- name: 什亭（亞伯什亭）
  type: 地點
  surfaces:
  - 亞伯什亭
  evidence: 第49節「從伯耶施末直到亞伯什亭」；CT 給的字義是「刺槐之草地」；BH 註亞伯什亭意為「皂莢樹的草場」，也是民25 以色列與摩押女子犯罪之處。
- name: 耶利哥
  type: 地點
  surfaces:
  - 耶利哥
  evidence: 第48、50節「約但河邊、耶利哥對面」；GT《啟導本》註耶利哥屬迦南重鎮，也是以色列人進迦南最先攻打的一座城。
- name: 迦南地
  type: 地點
  surfaces:
  - 迦南地
  evidence: 第51節「你們過約但河進迦南地的時候」；第40節「住在迦南南地的迦南人亞拉得王」。
- name: 約但河
  type: 地點
  surfaces:
  - 約但河
  evidence: 第48、49、50、51節：安營在摩押平原約但河邊，並吩咐他們過約但河進迦南地。
- name: 瑪拉苦水變甜
  type: 事件
  evidence: CT 在第8節註『瑪拉』是第五站，在此丟一棵樹在水裡，變苦水為甜水（出15:23）；BH 也在同節回顧這件事。
- name: 過紅海
  type: 歷史
  evidence: 第8節「從比哈希錄對面起行，經過海中到了書珥曠野」；CT 註『經過海中』指神使用神蹟，使以色列人走在乾地上，到達紅海的對岸。
- name: 戰勝亞拉得王
  type: 歷史
  surfaces:
  - 亞拉得王
  evidence: 第40節「住在迦南南地的迦南人亞拉得王聽說以色列人來了」；CT 註亞拉得在南地的北部，位於希伯崙以南約二十七公里。
- name: 曠野飄流四十年
  type: 歷史
  evidence: 第38節「以色列人出了埃及地後四十年」；CT 註利提瑪與加低斯該是同一地方，加低斯是在那裡開始了四十年飄流的地方。
- name: 逾越節
  type: 歷史
  surfaces:
  - 逾越節
  evidence: 第3節「正月十五日，就是逾越節的次日」；CT 註這也是無酵節的第一日；KC 指出這預設了逾越節所代表的事與脫離埃及為奴之間的直接關聯。
- name: 第十災（殺長子之災）
  type: 歷史
  evidence: 第4節「那時，埃及人正葬埋他們的長子，就是耶和華在他們中間所擊殺的」；CT 註在逾越節的那一夜神擊殺埃及人所有的長子（出12:29）。
- name: 十災
  type: 歷史
  evidence: 第4節「耶和華也敗壞他們的神」；CT 註這指神降十災，就是對埃及人所崇拜的眾神施行審判。
- name: 米利暗卒於加低斯
  type: 事件
  evidence: GT《啟導本》在第38節註：「米利暗死後半年亞倫也死了；亞倫死後六個月，摩西也隨著去世」，把本章記的亞倫死期放進三位領袖相繼離世的時間軸。
- name: 拈鬮分地（go.ral）
  type: 主題
  surfaces:
  - 拈鬮
  evidence: 第54節「你們要按家室拈鬮，承受那地；人多的，要把產業多分給他們；人少的，要把產業少分給他們」；CT 把分地原則列成三項。
- name: 產業（na.cha.lah）
  type: 原文
  surfaces:
  - 產業
  evidence: 第54節兩次「產業」；STEP 顯示是 H5159 na.cha.lah，前後由兩個 Hitpael 動詞 hit.na.chal.Tem 與 tit.ne.Cha.lu（H5157）包住。
- name: 邱壇與日像被毀（拜偶像的終極審判）
  type: 主題
  surfaces:
  - 邱壇
  evidence: 第52節「又拆毀他們一切的邱壇」；CT 註必須拆毀一切建在高地上的異教神廟和神壇等崇拜設施。
- name: 不可為自己雕刻偶像
  type: 神學
  evidence: 第52節「毀滅他們一切鏨成的石像和他們一切鑄成的偶像」；BH 把這道命令接回十誡的第一、二誡（出20:3-4）。
- name: 迦南七族（迦南地原住民）
  type: 背景
  evidence: 第52、55節「就要從你們面前趕出那裡所有的居民」「倘若你們不趕出那地的居民」；BH 註這地的居民即迦南人，以拜偶像與道德敗壞著稱。
- name: 拆毀偶像律例
  type: 事件
  evidence: 第52節列出鏨成的石像、鑄成的偶像、邱壇三類必須毀滅的對象；GT 丁良才註以色列人後來並不遵行，反倒在邱壇上獻祭。
- name: 越過耶和華的口（peh）
  type: 原文
  surfaces:
  - 遵著耶和華的吩咐
  evidence: '第2節「摩西遵著耶和華的吩咐記載他們所行的路程」與第38節「祭司亞倫遵著耶和華的吩咐上何珥山」；STEP 顯示兩處的「吩咐」都是 pi（H6310I，詞典形 peh，簡要詞典義 lip: word），字面是耶和華的口。'
- name: 他備拉與基博羅哈他瓦是否同一地
  type: 解經爭議
  evidence: 本章第16-17節的行程表列了基博羅哈他瓦，卻沒有列民11:3 的他備拉——這正是主張兩地是同一地的第一項理由。
- name: 曠野四十二站
  type: 主題
  surfaces:
  - 路程
  evidence: 第1-49節整份行程表。CT 把它分成四段（十二站、二十一站、九站、過河前的吩咐），並逐站給出名字字義與靈意；GT《民數記串珠聖經註釋》把四十二站排成六程各七站，並指出程與程之間的對應。
- name: 行程表在古代近東的體裁
  type: 背景
  evidence: GT《舊約聖經背景註釋》：「行程表的體裁在古代近東的年表中十分常見，例子之一是主前九世紀 * 亞述王的年表。」並提到埃及遠征敘利亞─巴勒斯坦的記錄中也保存了行程表。
- name: 民21 與民33 的站名為何不同
  type: 解經爭議
  evidence: GT 丁良才列出三種緣故（名字是以色列人自己起的、因地形起名、同時在兩處安營）；GT 引賈斯樂郝威《聖經難解經文詮釋手冊》命題29 給出七點解答；CT 註第31節申10:6 的記載剛好相反。
- name: 遵著耶和華的吩咐記載路程
  type: 主題
  surfaces:
  - 記載
  evidence: 第2節「摩西遵著耶和華的吩咐記載他們所行的路程」；KC 強調這不是照摩西的吩咐、而是照耶和華的吩咐；STEP 顯示「遵著耶和華的吩咐」的中心詞是 pi（H6310I），字面是照耶和華的口。
- name: 神的回顧只記進度不記背叛
  type: 神學
  evidence: KC：在這份列表裡神說的不是背叛，而是前進；神不是在那些倒下的人身上看見祂的百姓，而是在那些站立住的人身上看見。CT 也註加低斯這個名字沒有出現在行程記錄裡，是神的赦免使加低斯的失敗沒有留下在記錄中。
- name: 昂然無懼
  type: 原文
  surfaces:
  - 昂然無懼
  evidence: 第3節「在一切埃及人眼前昂然無懼地出去」；CT 註原文是「高舉的手」；GT《聖經精讀本》同樣說是「高舉的手」的意思；KC 也說字面是「以高舉的手」。STEP 顯示是 be./Yad（H3027G）＋ ra.Mah（H7311A，詞典形 rum，詞典義 to exalt）。
- name: 敗壞他們的神
  type: 原文
  surfaces:
  - 敗壞他們的神
  evidence: 第4節「耶和華也敗壞他們的神」；CT 原文字義給兩個字：做、製作、完成（首字）；審判（次字）。GT《聖經精讀本》說「敗壞」是「他施行審判」的意思；《靈修版聖經註釋》說可以直譯為「耶和華審判他們的眾神」。STEP 顯示是 'a.Sah（H6213A）＋ she.fa.Tim（H8201，詞典形 she.phet，詞典義 judgment）。
- name: 眼中的刺與肋下的荊棘
  type: 原文
  surfaces:
  - 眼中的刺
  - 肋下的荊棘
  evidence: 第55節；CT 註『眼中的刺』形容令人難受，『肋下的荊棘』形容無法動彈、寢食難安；GT《聖經精讀本》指出「刺」的原文是複數。STEP 顯示兩個詞是不同的字：si.Kim（H7899）與 tz.ni.Nim（H6796），都是陽性複數。
- name: 毀滅迦南偶像的三道命令
  type: 主題
  surfaces:
  - 鏨成的石像
  evidence: 第52節一節之內用了三個動詞與三類對象：趕出居民、毀滅鏨成的石像與鑄成的偶像、拆毀邱壇。CT 原文字義逐一標注；STEP 顯示三個動詞分別是 ya.rash（H3423H）、a.vad（H6）、sha.mad（H8045）。
- name: 以旬迦別
  type: 地點
  surfaces:
  - 以旬迦別
  evidence: 第35、36節第三十二站；GT 丁良才註「就是所羅門製造船隻的海口（王上九26，代下八17）」；GT《舊約背景註釋》定位在亞喀巴灣頭；BH 註它是銅冶煉與貿易的重鎮。
- name: 普嫩
  type: 地點
  surfaces:
  - 普嫩
  evidence: 第42、43節第三十六站；CT 註有聖經學者認為它是比嫩的別名；GT《舊約背景註釋》定位在死海以南三十哩的費楠廢墟；BH 註它以銅礦聞名。
- name: 摩西錄
  type: 地點
  surfaces:
  - 摩西錄
  evidence: 第30、31節第二十七站；CT 註聖經學者認為摩西錄就是申10:6 的摩西拉，亞倫的死亡和埋葬以及以利亞撒的接任發生在那裡；GT 丁良才註這是多數字式、申10:6 的摩西拉是單數字式。
- name: 比尼亞干
  type: 地點
  surfaces:
  - 比尼亞干
  evidence: 第31、32節第二十八站；CT 註又名比羅比尼亞干或亞干井，《申命記》的記載剛好相反；BH 註申10:6 稱它為「亞干子孫的井」，說明那裡有水。
- name: 亞倫去世的日期
  type: 主題
  surfaces:
  - 五月初一日
  evidence: 第38-39節：出埃及後四十年五月初一日，亞倫上何珥山死在那裡，年一百二十三歲。GT 丁良才註「聖書上只在本處記亞倫去世的日期」，並註亞倫站在法老面前時年八十三歲；BH 註這個明確的日期為敘事提供了歷史錨點。
