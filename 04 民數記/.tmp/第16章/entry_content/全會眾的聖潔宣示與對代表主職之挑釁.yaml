name: "全會眾的聖潔宣示與對代表主職之挑釁"
type: "神學"
status: "formal"
definition: "記載在民數記第16章3節，叛徒領袖向摩西與亞倫發出的著名抗訴聲名：「你們擅自尊大！全會眾個個既是聖潔，耶和華也在他們中間，你們為什麼自高，超過耶和華的會眾呢？」此宣告在表面上引用神曾經宣許以色列全族作為聖潔國民的應許（出十九6），然而在詮釋和用法上卻以此推翻神對於特定事奉次序的特別呼召，假借平等聖潔的名義來解構並挑戰上帝所指定的中保治理架構。"
accumulations:
  - book: "民數記"
    chapter: 16
    summary: "可拉集團利用群體共有之聖潔概念與主同在的誓明作為口號，指責領導者摩西和大祭司亞倫攬權專高；藉曲解普世神恩的含意宣稱眾人均有權主理同樣神職。"
    relation: "界定真確事奉次序與偽君權平等論之區別：上帝子民全體入約受榮雖為事實，但這並非否定聖靈與上天在教會中區分特定中保主職、委派專人統率與守衛聖堂秩序的自主主權。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT16.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT16.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/16)"
