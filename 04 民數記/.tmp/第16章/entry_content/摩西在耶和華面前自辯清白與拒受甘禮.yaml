name: "摩西在耶和華面前自辯清白與拒受甘禮"
type: "神學"
status: "formal"
definition: "呈現於民數記第16章15節中，當遭受叛黨無理痛罵與橫霸指詰之際，摩西心發真沉良怒而非持弄屠私力，親身歸向天父面表澄淨無辜之申情代斷：「求你不要享受他們的供物；我並沒有奪過他們一匹驢，也沒有害過他們一個人。」表明其為神大任奔逐生平毫不謀涉世俗君主強徵牲財和威脅壓傷民德的清朗典範；並宣告仰賴高上帝終絕拒退傲群狂者私獻奉牲禮的裁定求告。"
accumulations:
  - book: "民數記"
    chapter: 16
    summary: "面對侮恨重責的抗命大員，摩西在忿懷之間唯堅持奔入至高者聖台為自我守義陳證，揚布在世無爭毫財亦從不管壓民眾，請求上蒼收起賜悅他們的祭禮顧盼。"
    relation: "豎立舊約真正牧者和中介管治於大災攻心時的答信標識：被冤時不出出於世俗反撲自衛，乃獨把己身無染、絕不傷生與廉勤牧眾的前跡全呈耶和華面見；交倚施恩誓神實時展揚拒縱愚僭祭品的長威判道。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT16.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT16.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/16)"
