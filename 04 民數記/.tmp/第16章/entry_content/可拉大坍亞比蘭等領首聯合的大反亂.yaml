name: "可拉大坍亞比蘭等領首聯合的大反亂"
type: "事件"
status: "formal"
definition: "記載於民數記第16章1至3節的群體抗命事件：利未支派哥轄的子孫可拉，夥同流便支派的子民大坍、亞比蘭和安，並且招聚了在會眾中擁有聲望和領導職責的二百五十名首領，共同針對摩西的統帥職務與亞倫的祭司權務提起有組織之挑戰與否定。依據地理背景，哥轄支系與流便支派在會幕營防規劃中同駐守於南區（民二10；三29），造成地緣上的政治密謀與權益共鳴，試圖藉此推翻耶和華託付於中保摩西與亞倫的獨佔治理體制。"
accumulations:
  - book: "民數記"
    chapter: 16
    summary: "可拉代表利未宗室爭取更高榮譽的祭司權力，大坍與亞比蘭則欲取回流便作為雅各長子的世俗統治與政治世襲名位；雙方集結二百五十名首長向領導體制提出集體爭訟。"
    relation: "顯示以色列在曠野過渡期間內部神權治制與宗族政治野心的大摩擦：質疑神選呼召不單是針對人類領袖的抗議，而在神學本質上觸發了對上帝揀選與差遣權能之背道離亂。"
sources:
