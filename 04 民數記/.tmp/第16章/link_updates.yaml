book: 04 民數記
chapter: 16
updates:
- title: 可拉的背叛（預告）
  path: link_folder/人物/可拉的背叛（預告）.md
  summary: 本章就是這個條目所預告的事件。可拉聯合流便支派的大坍、亞比蘭與安，再拉進二百五十個「有名望選入會中的」首領，公開攻擊摩西與亞倫（v1-3），最後與大坍、亞比蘭一同被地吞滅。GT 丁良才《民數記註釋》列出他的動機：「可拉在這件事上，存三樣不良的心：1驕傲，2嫉妒，3貪婪。」CT 另指出一個具體的心結：他不滿哥轄宗族的首領由烏薛的兒子以利撒反擔任。
  relation: 出6 只是族譜裡的一個名字，民16 是那個名字變成一個專有名詞的地方——新約直接稱之為「可拉的背叛」（猶11）。KC 把兩批叛黨要的東西分開：大坍、亞比蘭伸手要的是摩西的領導權，可拉伸手要的是亞倫的祭司職分；他想要的是一個把自己抬高到百姓之上、好作神與百姓之間中介的位置。而 CT 與 GT 丁良才都指出一件事：被吞的不包括可拉的眾子（民26:11），所以後世還有可拉的後裔——GT《啟導本聖經註釋》說他們日後在聖殿供職（代上6:22），還撰寫過詩篇（詩84-86篇詩題）。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 本章是摩西的領導權第二次被公開挑戰，也是他一生中代求密度最高的一章。第4節「摩西聽見這話就俯伏在地」；第15節向神自辯「我並沒有奪過他們一匹驢，也沒有害過他們一個人」；第22、45節兩次俯伏為全會眾求情。GT 丁良才《民數記註釋》數出摩西一生四次作以色列人的中保挽回主怒——金牛犢、民十四的怨言、可拉背叛、以及次日的民怨——本章一章就佔了兩次。
  relation: 本章讓摩西的三種反應同時出現，而且次序很清楚：先俯伏（v4），再交給神裁決（v5-7），被辱罵到極處才發怒——但 KC 指出他發怒的對象不是人而是向神說，他沒有自己動手執法。GT 丁良才把這一點寫成一句話：「我們發怒的時候，告訴主比和人說強得多了。」CT 的觀察補上另一面：那麼多人站在那裡說話，只有摩西一人俯伏在地；他沒有個人的感覺，不表白，也不爭執。KC 另注意到一個對比：神說要滅絕全會眾時，摩西沒有趁機除掉對手，可拉一黨卻把百姓一起拖下水。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 亞倫在本章從被攻擊的對象變成救人的人。第3、11節他與摩西一同被指控；第46-48節摩西吩咐他拿香爐、盛上壇上的火、加上香，跑到會中為百姓贖罪，「他站在活人死人中間，瘟疫就止住了」。CT 指出「你的香爐」是大祭司的金香爐（參利十六12；來九4），並注意到亞倫此時已經九十歲左右，「可以想像他的急切之情」。
  relation: 民12 是亞倫自己攻擊摩西，民16 是別人攻擊亞倫，而他的回應是跑進瘟疫裡替人求情。GT 丁良才《民數記註釋》把全章收成一句對比：「可拉燒香招了災，亞倫燒香卻消了災，罪人與義人所作的，往往有這樣的分別。」他並指出這一幕的預表意義：「亞倫這樣行，作了耶穌的預表。正如基督愛我們為我們捨己，作馨香的供物獻與神（弗五2），使一切信靠祂的人免受刑罰。」GT《舊約聖經背景註釋》另指出這個動作有多反常：祭司的慣例是不得接觸死人，「顯然這是惟一遏阻瘟疫的方法」。
- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  summary: 第37-39節神指名由「祭司亞倫的兒子以利亞撒」從火中撿起那二百五十個香爐、把火撒在別處，再把香爐錘成片子包壇。GT 丁良才《民數記註釋》說明為什麼是他而不是他父親：「摩西只吩咐以利亞撒從燒死人的火中檢出香爐，卻沒有吩咐他父親亞倫，因為大祭司亞倫不敢污穢自己（利二十一10-12）。」
  relation: 這是以利亞撒第一次單獨領受一項指名的任務，而任務的內容正好與他日後的身分相稱：在一場為祭司職分而起的叛變之後，由未來的大祭司親手把叛黨的器皿變成祭壇的外皮。KC 也從他的排行讀出一層意思：他是亞倫的第三個兒子，亞倫死後由他接任大祭司。CT 指出這批香爐是銅的（v39），而 GT《聖經精讀本──民數記註解》說明「把火撒在別處」是因為那是香爐裡的火、不是壇上的火，撒開才能把聖潔的香爐分別出來。
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 本章是一場由利未人帶頭的叛變。可拉出自哥轄族，第8-10節摩西兩次稱他們「利未的子孫」，並提醒他們已經被分別出來親近神、辦耶和華帳幕的事，「這豈為小事？你們還要求祭司的職任嗎？」CT 說明利未人的職務內容：辦耶和華帳幕的事是看守並搬運會幕和其中器具，替會眾當差是替他們處理祭牲和祭物。
  relation: GT《舊約聖經背景註釋》在本章把利未人與祭司的界線劃得最清楚：聖幕與祭壇周圍的聖潔特區交由利未人照管，他們的責任是監視帶祭物來的以色列人、防止他們違犯律例或擅進祭司專用的聖潔地區；祭司則在祭壇負責實際執行儀式和獻祭，「祭司需要負起較大的責任，對」儀式的執行亦有更大的權力。民3、民4 立的是這條界線，民16 是這條界線第一次被人從內部推擠——而 CT 把爭執的本質從地位移開：「歸根結柢，是對於神權柄的態度問題。」
- title: 流便
  path: link_folder/人物/流便.md
  summary: 第1節的大坍、亞比蘭與安都出自流便子孫；第12-14節他們兩次回絕摩西的召見，並指控他「自立為王轄管我們」。CT 與 GT 丁良才《民數記註釋》給的動機一致：流便原是以色列的長子，因淫行失去長子的名分（創49:3-4），子孫可能因此心生不滿。GT《聖經精讀本──民數記註解》說得更直接：他們「可能為了挽回他們失去的位置而結黨」圖謀通過群體的力量恢復失去的勢力。
  relation: 創49 那句對流便的評語在本章結出了果子。這一支的營位也是叛變成形的條件之一——CT 與 GT 丁良才都指出流便營與哥轄營同在會幕南邊（民2:10；3:29），「所以多有同心合謀的機會」。民1、民2 記的是流便在營中的位置與人數，民16 記的是這個位置怎麼被用來結黨。
- title: 全會眾
  path: link_folder/人物/全會眾.md
  summary: 「全會眾」在本章被三方各用了一次：叛黨拿它當口號（v3「全會眾個個既是聖潔」）、可拉拿它當後盾（v19 招聚全會眾到會幕門前）、最後它自己成了被審判的對象（v41「以色列全會眾都向摩西、亞倫發怨言」）。
  relation: STEP 原文資料顯示第3節那句口號裡其實有兩個不同的字：前半的「會眾」是 עֵדָה（'e.Dah，H5712），後半「耶和華的會眾」是 קָהָל（ke.Hal，H6951）。GT《聖經精讀本──民數記註解》對這組詞作過整理，並指出七十士譯本把「會中」譯為 ekklesia，新約司提反講道用同一個字指曠野中的以色列群體（徒7:38）。本章最值得注意的是全會眾的角色轉變：第22節摩西為他們求情時說「一人犯罪，你就要向全會眾發怒嗎」，神應允了；到第41節他們自己成了發怨言的人。
- title: 以色列的長老
  path: link_folder/文化/以色列的長老.md
  summary: 第25節：「摩西起來，往大坍、亞比蘭那裡去；以色列的長老也隨著他去。」CT 指出這表示長老們與摩西同心一致行動；GT 丁良才《民數記註釋》補上他們實際做了什麼：「眾長老也幫助摩西勸百姓離開那些惡人的帳棚（26）。」
  relation: 本章的長老是唯一站對邊的一群人。叛變的核心是「二百五十個首領，就是有名望選入會中的人」（v2），GT《舊約聖經背景註釋》指出以色列的長老與議會成員本來就是按支派宗族任命的，戚族之間彼此競爭是部落聯盟的常見現象；同一個制度裡，有人拿它來結黨，也有人拿它來替摩西勸阻百姓。
- title: 香爐
  path: link_folder/文化/香爐.md
  summary: 香爐是本章的判決工具，也是本章的紀念物。第6-7節摩西提議用它裁決；第17-18節二百五十人各拿一個，與摩西、亞倫同站在會幕門前；第37-39節它們被錘成片子包壇；第46節亞倫又用大祭司的金香爐止住瘟疫。GT《舊約聖經背景註釋》說明形制：「這些香爐最有可能是可兼用來剷起煤炭的長柄小鍋。由於他們在裡面燒香，這也是活動的香壇。」
  relation: 為什麼選香爐當裁決的工具？KC 的解釋是：燒香是祭司最接近神的一項職事。GT《舊約聖經背景註釋》補上一句實務上的警告：「燒香是祭司獨有的權利，況且若是做得不得其法，不論有無祭司身分，都是十分危險的事（利十1～2）。」利10 拿答、亞比戶的先例就在那裡，GT 丁良才因此說可拉一黨「早已受了警誡」。本章的結局把同一個器皿的兩種用法擺在一起：二百五十個香爐招來火，亞倫的一個香爐止住瘟疫。
- title: 銅壇（燔祭壇）
  path: link_folder/主題/銅壇（燔祭壇）.md
  summary: 第38-39節：那二百五十個香爐被錘成片子，用來包壇。CT 註明包的是哪一座壇：「『包壇』是指包銅祭壇(參出二十七2)，而非香壇，因為香壇是金包的(參出三十七26)。」GT《民數記串珠聖經註釋》的說法一致：祭壇已用銅包裹，香壇卻未有，「這新的外表成為後世以色列人警告的記號」。
  relation: 本章給銅壇加上了一層新的外皮，也加上了一段新的意義。CT 指出這個記號的作用：每當以色列人獻祭時，可以睹物生情，想起可拉一黨人的悲慘結局。KC 從材質讀出另一層：銅沒有被火燒掉，所以看見這座壇的人，會同時想起可拉的審判，和那個經得起審判的。出27 造的是壇，民16 是這座壇第一次因為一場叛變而改變外觀。
- title: 耶和華的榮光
  path: link_folder/神學/耶和華的榮光.md
  summary: 本章榮光顯現了兩次，兩次都在人聚集攻擊摩西亞倫的時候：第19節可拉招聚全會眾到會幕門前，「耶和華的榮光就向全會眾顯現」；第42節會眾聚集發怨言時，「有雲彩遮蓋了，耶和華的榮光顯現」。CT 指出這代表神的臨在，也代表神要在他們中間施行審判。
  relation: GT 丁良才《民數記註釋》註第42節那一次與平常不同：「不是照常停在會幕上，乃是表示耶和華特意進入了會幕」GT《聖經精讀本──民數記註解》則指出榮光顯現有雙重性質：「神的介入具有審判惡人和保護義人的雙重性質。」出16、出40、利9 的榮光是恩典的記號，民16 是同一個記號用在審判上的一章——而兩次顯現之後，跟著的都是摩西亞倫俯伏代求。
- title: 摩西的代求
  path: link_folder/神學/摩西的代求.md
  summary: 本章有兩次代求，中間只隔一天。第22節：「摩西、亞倫就俯伏在地，說：神，萬人之靈的神啊，一人犯罪，你就要向全會眾發怒嗎？」第45節神再說要滅絕會眾，「他們二人就俯伏於地」，接著摩西吩咐亞倫拿香爐去為百姓贖罪。CT 解釋「萬人之靈的神」這個稱呼有兩層用意：神深知萬人裡面的存心，他們只不過因為無知而被人利用；也是求神以憐憫為懷。
  relation: GT 丁良才《民數記註釋》把摩西一生的代求排成一張清單：「摩西四次做了以色列人的中保，挽回主怒：1民拜金犢（出三十二11-14），2民發怨言（民十四11、12、13-19），3可拉背叛（民十六19-21）（22），4民怨摩西（民十六45、46-50）。」四次裡有兩次在本章。STEP 原文資料顯示第22節那個稱呼是 אֵל אֱלֹהֵי הָ/רוּחֹת לְ/כָל־ בָּשָׂר（'el 'e.lo.Hei ha./ru.Chot le./khol ba.Sar，H410G＋H430G＋H7307G＋H1320）；KC 指出同一個名字在民27:16 又出現一次，表示神洞悉人的心思意念。
- title: 中保
  path: link_folder/神學/中保.md
  summary: 第48節：「他站在活人死人中間，瘟疫就止住了。」GT《民數記串珠聖經註釋》：「何等美麗的一幅的圖畫，叫人想起耶穌基督在十字架上所成就的救恩。」GT 丁良才《民數記註釋》：「亞倫這樣行，作了耶穌的預表。」GT《聖經精讀本──民數記註解》把站的位置讀成職分：站在生與死中間的亞倫，預表著區分生與死的審判主、神人之間作中保的耶穌基督。
  relation: 出24、出32 的中保是摩西；民16 第一次讓大祭司站上這個位置，而且方式很特別——KC 直接點出：這裡的贖罪是用香、不是用血，這是例外。GT《聖經精讀本──民數記註解》的說法一致：「當犧牲祭物的血流出來的時候才能贖罪」但是在這裡通過亞倫焚燒的香，就是通過象徵著亞倫禱告的香贖了罪香代表禱告（詩141:2；啟5:8；8:3-4），所以本章的中保形象不是獻上祭物，而是本人擋在中間求情。
- title: 以色列人的怨言
  path: link_folder/歷史/以色列人的怨言.md
  summary: 第41節：「第二天，以色列全會眾都向摩西、亞倫發怨言說：你們殺了耶和華的百姓了。」CT 的評語很短：會眾並沒有得到教訓，反而認為是摩西、亞倫假借神的名陷害人命。GT 丁良才《民數記註釋》另點出他們用詞的錯誤：「會眾用這話稱呼那些背叛主的人，十分錯了，因為他們不配承受這名分」
  relation: 本章的怨言有一個前面幾章沒有的特徵：它發生在親眼看過審判的第二天。KC 把三天排出來：第一天叛變，第二天代求與審判，第三天百姓整體被捲進去——看過的審判並沒有改變他們。STEP 原文資料另在第11節留下一個線索：摩西說可拉一黨「向他發怨言」，動詞 תַלִּינוּ（ti.lo.nu，H3885B，lun，to grumble）是使役語態，字面是你們使人發怨言——第41節全會眾的怨言，正是這個字的後果。
- title: 耶和華擊打百姓的瘟疫
  path: link_folder/事件/耶和華擊打百姓的瘟疫.md
  summary: 第46-50節：忿怒從耶和華那裡出來，瘟疫發作；亞倫拿香爐站在活人死人中間，瘟疫才止住。第49節記下代價：「除了因可拉事情死的以外，遭瘟疫死的，共有一萬四千七百人。」這是五經裡規模最大的一次。
  relation: GT《舊約聖經背景註釋》描述它的性質：「這個殺死了一萬四千七百人的瘟疫，是以曾經殺死埃及長子之「滅命使者」的姿態出現。其能力大得摩西要下令亞倫拿燒著香的香爐，站到死人和快要死的人中間，才能制止進一步的毀滅。」同一份註釋也承認限度：「靠著經文要診斷這是何種病症，是不可能的」CT 算出全部事件的總數：因可拉事情死的約三百人，加上瘟疫的一萬四千七百人，約有一萬五千人死於非命。與出32、民11、民14 的瘟疫相比，本章的止住方式最特別——不是靠代求的話，是靠一個人跑到現場站在中間。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: 整章的爭點就是祭司職分歸誰。第10節摩西一語道破可拉的意圖：「你們還要求祭司的職任嗎？」第40節給出結論：「使亞倫後裔之外的人不得近前來在耶和華面前燒香，免得他遭可拉和他一黨所遭的。」
  relation: 本章用三件事把這個職分釘死。第一是裁決方式：GT《舊約聖經背景註釋》指出「燒香是祭司獨有的權利」，所以用香爐試驗等於直接測試職分歸屬。第二是刑罰：火燒滅了那二百五十個擅自獻香的人，BH 把它與烏西雅王並列（代下26:16-21）。第三是紀念物：叛黨的香爐被錘成銅片包在壇上，讓後世每次獻祭都看得見。GT《民數記串珠聖經註釋》總結這次事件對祭司職事的效果：百姓從前可能以為祭司的工作只是獻祭的禮儀、任何人都可作，「經此事件後，百姓及任祭司者都不敢輕視祭司事奉的效能了」。
