  suggested_type: 背景
  evidence: GT《舊約聖經背景註釋》【民六24～26 古代近東的祝福】：耶路撒冷凱特夫欣嫩（Keteph Hinnom）墓穴出土兩個長約一吋的銀製卷軸護身符，主前六、七世紀，內含本段祝福，是現存最早的聖經經文例證；藉神明的臉光得著憐憫見於主前十二世紀美索不達米亞典籍碑文與烏加列函件；召請神明賜下看護照顧與安樂的句子常見於烏加列與亞喀得問安；西乃半島北部孔蒂拉特阿吉魯主前九世紀大甕上有「願耶和華賜福給你，保護你」字樣。初民相信祝福咒詛本身具有能力。
  target_path: link_folder/背景/凱特夫欣嫩銀卷與古代近東祝福文.md
