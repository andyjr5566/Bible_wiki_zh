- name: 拿細耳人三禁令與三種民間宗教
  suggested_type: 背景
  evidence: GT《舊約聖經背景註釋》【民六8 拿細耳人的背景】：三樣禁戒之物代表豐饒崇拜（葡萄）、感應法術（頭髮）、死人祭儀（被死人污染），可能並非意外，因為這是耶和華崇拜設法消滅的三大民間宗教。【民六3～4】葡萄與迦南豐饒崇拜的關聯（何三1 葡萄乾餅）；【民六5】馬里先知附頭髮供占卜、腓尼基碑文向亞施他特獻剃下的頭髮；【民六6～7】死人祭儀。
  target_path: link_folder/背景/拿細耳人三禁令與三種民間宗教.md
