book: 民數記
chapter: 6
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 本章第1與22節兩次記「耶和華曉諭摩西說」，分別引出拿細耳人的條例（v2-21）與祭司祝福文（v23-27）。BH 指出這種直接的神聖溝通在摩西五經反覆出現，凸顯後續指示的權柄來自神本身，也凸顯摩西作為先知的獨特地位（申34:10）。
  relation: 摩西在本章的角色是把兩套完全不同性質的定例——平民自願的獻身，與祭司奉神之名的祝福——一併領受並傳達；GT 丁良才推測祝福文頒布的時間「大概是在利二十七34節以前」。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 本章第23節神指名「你告訴亞倫和他兒子說」，把為以色列人祝福的職分交給祭司家族，第27節則說明其效力：「他們要如此奉我的名為以色列人祝福；我也要賜福給他們。」BH 指出亞倫是神所立的第一位大祭司，其後裔承擔聖職，是基督這位終極大祭司的預表（來4:14-16）。
  relation: 確立祭司奉神之名祝福百姓的職分。GT《聖經精讀本》強調這個權限「是以萬福之根源—神的權威為基礎，而不是以祭司自己的權威為基礎」；KC 則指出這份吩咐交給「亞倫和他兒子」，教會同樣參與在這祝福的分送裡（羅8:19）。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 本章三處提到燔祭：第11節意外沾染死屍時以一隻鳥獻燔祭，第14與16節還俗時獻一歲公羊羔作燔祭。BH 說明燔祭（olah）全牲燒盡，象徵完全的降服與獻上。GT《聖經精讀本》在還俗段落點出它的用意：「說明雖然拿細耳人的義務結束了，但向神的奉獻並沒有結束。」
  relation: KC 注意到兩處的次序相反——用鳥獻祭時贖罪祭在先（v10-11），還俗獻祭時燔祭列第一；他把兩隻鳥解讀為從天降到地的那一位，第一隻作贖罪祭、第二隻作燔祭。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: 本章第11、14、16節三次提到贖罪祭：沾染時用一隻鳥，還俗時用一隻一歲母羊羔。為什麼還俗也要獻，GT 丁良才的理由是「人最好最聖的事都被罪惡玷污，除非流血獻祭，就不得蒙悅納」；GT《聖經精讀本》的理由是「所有的人在神面前都是罪人（羅3:10）」，並指出祭司「在獻上燔祭之前首先獻上了贖罪祭」是因為罪的問題要先解決。BH 說明贖罪祭（chattat）處理的是無心之過，使人從不潔中得潔淨。
  relation: 承接利未記第4章的贖罪祭體系，並在本章加上一個特別的處境：連自願獻身、力求無罪生活的人，在期滿時仍要獻贖罪祭。KC 把這一點放到事奉上：若我們得以繼續任何事奉，「首要的仍是體認這件事之所以可能，是因為主耶穌作了贖罪祭」。
- title: 贖愆祭（asham）
  path: link_folder/原文/贖愆祭（asham）.md
  summary: 本章第12節規定意外沾染死屍的拿細耳人要「牽一隻一歲的公羊羔來作贖愆祭」。CT 分辨兩者的差別：「贖罪祭的罪是指在根本上籠統得罪了神，而贖愆祭的愆是指在零碎的行為上得罪了神。」GT《舊約聖經背景註釋》給了另一個角度：另獻羊羔作贖愆祭，「因為如此違願算為背信」。BH 說明 asham 用一歲公羊羔顯出贖罪的代價與價值。
  relation: 與利未記5-6章及民數記5:8 的贖愆祭定例相連；本章把它用在一個特殊處境上——玷污並非出於故意，補贖仍不可省。
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: 本章第14、17、18節規定還俗時獻一隻沒有殘疾的公綿羊作平安祭，並把剃下的離俗長髮放在平安祭下的火上焚燒。GT《聖經精讀本》說明平安祭在這裡是「向神獻上的感謝祭，因為自己還了所許的願」，也是「為了繼續與神交通」而獻。BH 指出平安祭（shelamim）表達和好與相交。
  relation: KC 為第18節下了一句全書性的斷語：「除了拿細耳人的這頭髮以外，我們在任何地方都沒有讀到人身上的任何東西與祭物相連。這證明神極其看重人向祂獻身所作的事。」GT《聖經精讀本》讀的方向不同，認為這個動作象徵離俗日子裡的分別為聖「都是因神的恩典」。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: 本章第15與17節規定還俗時同獻一筐無酵調油的細麵餅與抹油的無酵薄餅，並隨附素祭與奠祭。CT 說明「調油」指細麵用油調和、「抹油」指在生麵團表面抹上油，並解釋素祭在希伯來文「含有禮物或貢物的意味，是一種自願的獻祭」，同時「間接供應祭司們生活所需的食物」。BH 指出無酵象徵純潔與脫離罪，油則常代表聖靈與膏抹。
  relation: 呼應利未記第2章的素祭定例。STEP 原文資料顯示第15節這份供物的原形是 min.chah（H4503G，詞典義 offering），同節的「細麵」是 so.let（H5560）、「調」是 ba.lal（H1101A，to mix）、「抹」是 ma.shach（H4886，to anoint）。
- title: 搖祭
  path: link_folder/原文/搖祭.md
  summary: 本章第20節規定祭司要拿已煮的公羊前腿與兩塊無酵餅「作為搖祭，在耶和華面前搖一搖」。CT 說明「搖祭」是「將祭物按水平方向前後擺動」。BH 說明搖祭是把供物象徵性呈給神的動作，同時表明祭司在神與百姓之間的中介角色。STEP 原文資料顯示本節「搖祭」是 te.nu.phah（H8573，詞典義 wave offering），動詞「搖一搖」則是同源的 nuph（H5130B，詞典義 to wave）。
  relation: 與出埃及記29章、利未記7章的搖祭定例相連；本章的特別之處是祭司在慣常的胸與腿之外多得一條前腿與兩個餅，GT《民數記串珠聖經註釋》解釋為「表明拿細耳人的事奉是超額的」。
- title: 舉祭
  path: link_folder/原文/舉祭.md
  summary: 本章第20節說搖祭之物「與所搖的胸、所舉的腿同為聖物，歸給祭司」。CT 指出「所搖的胸、所舉的腿」是「另一個條例指定給祭司享用的祭物」（利7:32）。BH 說明胸與腿是祭牲中的上選部位，歸給祭司顯出這個職分所受的尊重，而祭司沒有地業、靠供物維生，這條規定同時是供養制度的一環（林前9:13-14）。STEP 原文資料顯示本節「所舉的」是 te.ru.mah（H8641，詞典義 contribution）。
  relation: 承接利未記7:32 與民數記5:9 的舉祭定例；在本章它與搖祭並列，一起界定拿細耳人還俗時歸給祭司的份。
- title: 奠酒
  path: link_folder/文化/奠酒.md
  summary: 本章第15與17節兩次提到「同獻的素祭和奠祭」，是拿細耳人還俗獻祭的一部分。CT 說明「奠祭」指澆酒為祭，原文字義註為「奠酒」。BH 說明奠祭通常用酒，澆奠出來象徵把生命傾倒出來事奉神，與素祭一同構成獻祭中「維生與慶賀」兩面的完整表達。KC 則說奠祭「說到主耶穌在地上的一生對神所是的喜樂」。
  relation: 把奠酒放進拿細耳人還俗的祭禮中。本章的處境有一層對照：拿細耳人在離俗期間一滴葡萄製品都不能沾，期滿獻祭時卻要獻上以酒為內容的奠祭，之後才可以喝酒（v20）。STEP 原文資料顯示第15節「奠祭」的原形是 ne.sekh（H5262，詞典義 drink offering）。
- title: 祝福與咒詛
  path: link_folder/主題/祝福與咒詛.md
  summary: 本章第22-27節是祭司奉神的名為以色列人祝福的正式祝禱文。GT《舊約聖經背景註釋》為它補上古代近東的認知背景：「初民相信祝福咒詛本身具有能力，能使之自行實現」，而本段所記的「大概是祭司在參加某種儀式的人離開聖所時，給他們所祝的福」。CT 在章末加了一條用詞上的分辨：「人對人是『祝福』，神對人是『賜福』。」
  relation: 在創27 的族長祝福與利26 的立約賞罰之外，本章提供第三種型態：由神親自制定、交給祭司照本宣讀、並由神親口保證兌現的祝福（「他們要如此奉我的名為以色列人祝福；我也要賜福給他們」，v27）。GT《民數記串珠聖經註釋》稱它是「1-6章神旨意及其目的之高峰」。
