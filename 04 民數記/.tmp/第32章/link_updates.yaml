book: 民數記
chapter: 32
updates:
- title: 流便
  path: link_folder/人物/流便.md
  summary: 第1節起流便子孫與迦得子孫聯名求約但河東的雅謝地和基列地為業。CT 註兩支派同屬第二隊、安營在會幕南邊，方便彼此商量；GT 丁良才也說「按民二10、14節，這兩個支派在一營中，所以有同心商議的好機會」。第37-38節流便子孫建造希實本、以利亞利、基列亭、尼波、巴力免、西比瑪。
  relation: 本章是流便支派在民數記裡最後一次以主動角色出現。GT 串珠指出流便雖是長子理應排名在先，但主謀實為迦得支派，所以第6、25、29、31、33節都把迦得排在前面。
- title: 迦得（萬幸）
  path: link_folder/人物/迦得（萬幸）.md
  summary: 迦得子孫是本章提議的實際主導者。GT 串珠：「流便是長子，理應排名在先，但此事的主謀人實為迦得支派，所以下文多次以迦得排首（6, 25, 29, 31, 33）。」第34-36節迦得子孫建造底本、亞他錄、亞羅珥、亞他錄朔反、雅謝、約比哈、伯寧拉、伯哈蘭，並壘羊圈。
  relation: BH 註迦得支派以勇士著稱；本章他們承諾帶兵器行在以色列人前頭，正是這個名聲的具體表現。
- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  summary: 第33節摩西把亞摩利王西宏的國與巴珊王噩的國給了迦得、流便與約瑟的兒子瑪拿西半個支派；第39-42節記瑪吉、睚珥、挪巴三支瑪拿西子孫各自佔地。瑪拿西半支派到第33節才出現在名單裡，經文沒有交代他們何時加入。
  relation: 四套註釋對這個半支派為何留在河東給了四種解釋（見〔瑪拿西半支派為何留在河東〕）；KC 認為是前兩個支派的態度造成了另一個支派的分裂。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 本章摩西一人擔起全部角色：第6-15節責備兩支派並回顧加低斯巴尼亞的往事、第20-24節立下條件式應許並警告「你們的罪必追上你們」、第28-30節把條件交代給以利亞撒與約書亞、第33節與第40節分地。
  relation: 全章沒有一句話是從耶和華曉諭摩西開始的。CT 在第20節註「摩西的回話顯然沒有先求問神」；GT 串珠說他只按對律法的瞭解作決定、神既未有清楚曉諭即等於默許。這是本章的解經爭議之一。
- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  summary: 第2節兩支派來見「摩西和祭司以利亞撒，並會眾的首領」；第28節摩西為他們囑咐以利亞撒、約書亞與眾支派的族長。CT 註以利亞撒接續父親亞倫作大祭司，是以色列人的宗教最高領袖。
  relation: 摩西知道自己不會親眼看見這份協議履行，所以把執行權交給日後負責分地的以利亞撒與約書亞；BH 註這顯示祭司職分在按神的律法引導百姓上的角色。
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第12節約書亞與迦勒同列為專心跟從神、可以看見應許之地的兩人；第28-30節摩西把河東協議的條件交代給他執行。KC 註約書亞後來確實照辦（書22:1-4）。
  relation: 本章是約書亞從被提名者轉為執行者的一步：摩西立下的條件要由他驗收，河東之地也要由他確認交付。
- title: 迦勒
  path: link_folder/人物/迦勒.md
  summary: 第12節：「惟有基尼洗族耶孚尼的兒子迦勒和嫩的兒子約書亞可以看見，因為他們專心跟從我。」摩西在責備兩支派時把他和約書亞舉為反例。
  relation: CT 註「專心跟從我」字面是「完全跟在我後面」；STEP 顯示動詞是 H4390 ma.le（詞典義 to fill）。迦勒的名字在這裡不是稱讚，而是拿來對照那一代人的失敗。
- title: 基尼洗人
  path: link_folder/人物/基尼洗人.md
  summary: 第12節稱迦勒為「基尼洗族耶孚尼的兒子」。BH 註基尼洗人是被併入猶大支派的族群，這種吸納顯示神的約延伸到以色列血統之外。
  relation: 在一章談支派地界的敘事裡，一個外族出身卻專心跟從神的人被舉為榜樣，與兩支派憑眼見選地形成對照。
- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  summary: 第33節「亞摩利王西宏的國」；第39節瑪吉的子孫往基列去、佔了那地、趕出那裡的亞摩利人。STEP 顯示第39節「趕出」是 H3423H ya.rash（詞典義 to possess）的 Hiphil。
  relation: 河東之地是先從亞摩利人手中奪得，才有本章的分配問題；KC 註這地原屬亞捫人，後被亞摩利王西宏與噩奪去，以色列人才得以攻取。
- title: 約瑟
  path: link_folder/人物/約瑟.md
  summary: 第33節「約瑟的兒子瑪拿西半個支派」。GT 丁良才在第39節註瑪吉的兒子曾被養在約瑟的膝上（創五十23）。
  relation: 約瑟一支在本章第一次出現地界上的分裂：瑪拿西的一半在河東，另一半日後在河西。
- title: 亞伯拉罕
  path: link_folder/人物/亞伯拉罕.md
  summary: 第11節耶和華起誓的內容：從埃及上來、二十歲以外的人斷不得看見「我對亞伯拉罕、以撒、雅各起誓應許之地」。
  relation: 摩西在勸阻兩支派時援引的是列祖之約：那地不是新的機會，而是三代人以前就起誓應許的產業。
- title: 以撒
  path: link_folder/人物/以撒.md
  summary: 第11節「亞伯拉罕、以撒、雅各」三代列祖並列，是摩西回顧耶和華起誓內容時的引語。
  relation: 本章唯一一次提到以撒，用途是界定「應許之地」的範圍——約但河西的迦南，不是河東。
- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  summary: CT 與 GT 丁良才都指出第41節的睚珥其實出自猶大支派：希斯崙的兒子西割娶瑪吉的女兒所生，隨母親家族才稱為瑪拿西的子孫（代上二21-22）。GT 並說「這樣看來，睚珥的父親西割，原來屬猶大支派」。
  relation: 本章末尾的地名哈倭特睚珥因此橫跨兩個支派的血緣；GT 丁良才進一步推測有些猶大人跟從睚珥、後來也住在睚珥的村莊。
- title: 迦南人
  path: link_folder/人物/迦南人.md
  summary: CT 註第21節「等他趕出他的仇敵」的『祂的仇敵』指迦南人。兩支派承諾帶兵器過河，要打的正是這一場仗。
  relation: 本章的協議建立在一個前提上：河西的仗非打不可。GT《聖經精讀本》說征服迦南的戰爭不是按人的意志可打可不打的戰爭。
- title: 亞捫人
  path: link_folder/人物/亞捫人.md
  summary: KC 在導論註約但河東之地原屬亞捫人，後被亞摩利王西宏與噩奪去，以色列人因此得到攻取的許可（民21:21-35）。GT《舊約背景註釋》註雅謝位於亞捫邊界上。
  relation: 亞捫的邊界決定了兩支派所求之地的東界；日後士師時代河東支派與亞捫的衝突，起點就在這一章的定居。
- title: 基列
  path: link_folder/地點/基列.md
  summary: 第1節「雅謝地和基列地是可牧放牲畜之地」；第26節兩支派把妻子孩子羊群留在「基列的各城」；第29節摩西說履約後就把基列地給他們為業；第39-40節瑪吉的子孫佔了基列，摩西就把基列賜給瑪吉。
  relation: GT 丁良才註基列有廣狹兩義：廣義指約但河東的全地（連巴珊在內），狹義指從加利利海之南到死海之北的一段。本章第26、29節用的是廣義，第39-40節用的是狹義。
- title: 巴珊
  path: link_folder/地點/巴珊.md
  summary: 第33節「巴珊王噩的國」。CT 註噩的國在北邊、西宏的國在南邊，兩國合起來就是分給兩支派半的全部土地。
  relation: 巴珊是瑪拿西半支派日後地業的主要部分；GT 丁良才註瑪吉人所得的地業多在巴珊地。
- title: 約但河
  path: link_folder/地點/約但河.md
  summary: 本章出現五次（第5、19、21、29、32節），每一次都是身分界線：「不要領我們過約但河」（v5）、「我們的產業是坐落在約但河東邊這裡」（v19）、「所有帶兵器的人都要在耶和華面前過約但河」（v21）。
  relation: KC 以過約但河象徵進入屬天的福分，因此把兩支派的請求讀成寧要地上的福分而放棄屬天的分。這個讀法是 KC 全章的骨架。
- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 第30節「就要在迦南地你們中間得產業」、第32節「我們要帶兵器，在耶和華面前過去，進入迦南地」。摩西把不履約的後果定為：河東的地不算，只能在迦南地眾支派中間分產業。
  relation: GT《聖經精讀本》註這樣的措施是為了防止以色列分裂，而不是兩個支派的特權——不參戰就必招來其他支派的怨恨。
- title: 摩押平原
  path: link_folder/地點/摩押平原.md
  summary: GT 丁良才註第36節伯寧拉、伯哈蘭這兩座城位於摩押平原；KC 註兩支派當時所在之地就是摩押平原。
  relation: 民數記後段的敘事都發生在摩押平原：數點、產業條例、節期獻祭、米甸之役，直到本章的河東分地，全在同一個營地做成。
- title: 亞述
  path: link_folder/地點/亞述.md
  summary: GT 丁良才在第1節就指出「後來亞述人，先擄掠了約旦河東的流便人、迦得人，和瑪拿西半支派的人（代上五26）」；GT《啟導本》說這二支派半在以色列亡國之前便為亞述國攻入、最先遭到被擄的命運；KC 引代上5:25-26 全段。
  relation: 本章的選擇與這個結局被幾套註釋連在一起：外約但土地肥沃卻缺少軍事屏障，成了最先失守的一線。
- title: 為定與廢去（qum 與 pa.rar）
  path: link_folder/原文/為定與廢去（qum 與 pa.rar）.md
  summary: 第7、9節「使以色列人灰心喪膽」的動詞是 H5106（詞典形 nu，簡要詞典義 to forbid），與民30:5、8、11 那個父親或丈夫「不應承」女子所許的願是同一個字——H5106 在民數記只出現在這五處。GT《聖經精讀本》從詞源給的方向一致：「這句話是“使心傾斜”的意思,源於具有“禁止”,“反對”,“拒絕”等意思的希伯來語。」
  relation: 民30 的 nu 是家長對願的合法攔阻，民32 的 nu 是兩支派對全會眾的攔阻——受詞從願換成了以色列人的心。GT 串珠並指出本章的協議正是按起願的條例處理的。
- title: 業地（a.chuz.zah）
  path: link_folder/原文/業地（a.chuz.zah）.md
  summary: 本章的「為業」是 H272 a.chuz.zah：第5節兩支派求把這地給他們為業、第22節摩西說那地必在耶和華面前歸他們為業、第29節履約後把基列地給他們為業、第32節「我們所得為業之地」是 'a.chu.Zat na.cha.la.Te./nu，兩個名詞疊在一起。第30節的「得產業」則是同源動詞 H270 a.chaz。
  relation: 民27 用這個字處理的是女兒在父族中可持有的一份地；民32 用同一個字處理的是整個支派要不要換一片地。中文都譯成「為業」或「產業」，STEP 的 exact Strong 讓兩個名詞的分工看得出來。
- title: 產業（na.cha.lah）
  path: link_folder/原文/產業（na.cha.lah）.md
  summary: 第18節「我們不回家，直等到以色列人各承受自己的產業」的動詞是 H5157 na.chal 的 Hitpael；第19節兩次「產業」是 H5159 na.cha.lah；第32節「我們所得為業之地」把 H272 與 H5159 疊用。
  relation: 民27 那裡 na.cha.lah 講的是父親傳下來的繼承份，本章講的是支派在全地分配中該得的一份——同一個字從家族層級擴大到支派層級。
- title: 專心跟從主與另一個心志
  path: link_folder/神學/專心跟從主與另一個心志.md
  summary: 第11節「因為他們沒有專心跟從我」與第12節「因為他們專心跟從我」把同一個說法正反並用。CT 註：「『專心跟從我』字面的意思是『完全跟在我後面』，意指一心一意跟從神，不受任何外在因素的影響。」STEP 顯示是 mil.'U（H4390，詞典形 ma.le，詞典義 to fill）加 'a.cha.Rei（H310A，詞典義 after）。
  relation: CT 在本章的〔話中之光〕把重點接到迦勒身上：「迦勒『另有一個靈』，纔能進入基督的豐滿。」第12節則把約書亞與迦勒並列為同受此評的兩人。
- title: 流便失去長子名分
  path: link_folder/神學/流便失去長子名分.md
  summary: BH 在第1節註：流便是雅各的長子，但他的支派因流便的過犯（創49:3-4）沒有保住領導地位。本章的敘述正好印證這一點——GT 串珠指出主謀是迦得支派，所以第6、25、29、31、33節都把迦得排在流便之前。
  relation: 長子名分的失落在本章不是明說的教訓，而是敘事順序上的痕跡：兩個支派聯名，排名卻由後來者領頭。
- title: 拈鬮分地（go.ral）
  path: link_folder/主題/拈鬮分地（go.ral）.md
  summary: KC 在第33-42節指出河東之地不是照拈鬮分的：「這不是像將在應許之地那樣照拈鬮而行。他把他們自己選的地給了他們。在那地裡，每一個支派得到的是神所選的分。」GT《聖經精讀本》同樣指出原本土地分配是通過拈鬮以神的主權決定（民26:55），摩西這次並沒有用這個方法。
  relation: 民26 定下的分地原則是人數定多少、拈鬮定方向；本章是這個原則的第一個例外，也是幾套註釋判斷摩西這次是否未求問神時的主要依據。
- title: 戰利品的分配辦法
  path: link_folder/主題/戰利品的分配辦法.md
  summary: GT 丁良才在第1節註「牲畜，極其眾多」時直接標出（三十一32-47），也就是米甸之役的戰利品清單。兩支派牲畜的規模與上一章剛分完的戰利品直接相接。
  relation: 上一章那份平分給出征者與全會眾的牲畜清單，成了本章這個請求的物質前提：牲畜多到需要一片牧場，問題才會被提出來。
- title: 十二探子窺探迦南地
  path: link_folder/事件/十二探子窺探迦南地.md
  summary: 第8-9節摩西回顧：「我先前從加低斯巴尼亞打發你們先祖去窺探那地，他們也是這樣行。他們上以實各谷，去窺探那地回來的時候，使以色列人灰心喪膽。」他把兩支派的請求直接類比為當年十個探子報惡信。
  relation: STEP 顯示第9節「使以色列人灰心喪膽」與第7節是同一個動詞 H5106；摩西用同一個字把三十八年前的探子和眼前的兩支派放在一起評斷。
- title: 以實各谷的一掛葡萄
  path: link_folder/主題/以實各谷的一掛葡萄.md
  summary: 第9節「他們上以實各谷，去窺探那地回來的時候」。BH 註以實各谷正是探子砍下那掛要用槓抬的葡萄之處（民13:23），這個地方本身就是那地豐美的證據。
  relation: 摩西提以實各谷是有意的：探子親眼見過那地的好，回來仍報惡信。本章兩支派同樣是「看見」了地才開口，只是看見的是河東。
- title: 加低斯巴尼亞事件
  path: link_folder/歷史/加低斯巴尼亞事件.md
  summary: 第8節「我先前從加低斯巴尼亞打發你們先祖去窺探那地，他們也是這樣行」。摩西把三十八年前的整段事——打發探子、報惡信、耶和華起誓、飄流四十年——搬出來警戒兩支派。
  relation: CT 的內容綱要把第6-15節直接標為「摩西警戒勿重犯加低斯巴尼亞的過錯」；這是加低斯巴尼亞在民數記裡最後一次被援引。
- title: 曠野飄流四十年
  path: link_folder/歷史/曠野飄流四十年.md
  summary: 第13節「耶和華的怒氣向以色列人發作，使他們在曠野飄流四十年，等到在耶和華眼前行惡的那一代人都消滅了」。第15節摩西警告：若他們退後不跟從，神還要把以色列人撇在曠野。
  relation: CT 註四十年是概數，轉向之後實際約三十八年（申2:14）。GT 丁良才則指出以色列人雖已出了曠野，未得迦南以前飄流的事不能算是完了——摩西的警告因此不是修辭。
- title: 摩西不得進入應許之地
  path: link_folder/事件/摩西不得進入應許之地.md
  summary: KC 註兩支派求「不要領我們過約但河」這句話必定刺痛了摩西——他自己極想進去卻不被准許；KC 並說這也必定傷了耶和華的心，因為祂為百姓揀選了這地，這些支派卻說他們不要進去。
  relation: 本章摩西的激動有一層來自他自己的處境：他把協議交給以利亞撒與約書亞執行，正是因為他知道自己看不到履約的那一天。
- title: 以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）
  path: link_folder/互文/以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）.md
  summary: 第33節：「摩西將亞摩利王西宏的國和巴珊王噩的國，連那地和周圍的城邑，都給了迦得子孫和流便子孫，並約瑟的兒子瑪拿西半個支派。」CT 註西宏的國在南邊。第3節兩支派點名要的希實本正是西宏的都城。
  relation: 民21 的戰勝在本章變成產權：打下來的國成了可以分配的地。兩支派的請求之所以成立，前提就是這場勝仗。
- title: 以色列戰勝巴珊王噩互文（申3：1-11；詩135：10-12；136：17-22）
  path: link_folder/互文/以色列戰勝巴珊王噩互文（申3：1-11；詩135：10-12；136：17-22）.md
  summary: 第33節「巴珊王噩的國」與西宏的國一同分給兩支派半。CT 註噩的國在北邊，後來由約書亞把最北邊分給瑪拿西半支派。
  relation: 噩的國是瑪拿西半支派留在河東的地理基礎；GT 丁良才註瑪吉人所得的地業多在巴珊地。
