  type: 事件
  evidence: v28-30；CT 說這是出於神顯出神蹟；GT《啟導本》說除了伊甸園的蛇，全部聖經只有這裡記載動物開口說話；GT《背景註釋》舉埃及《兩兄弟的故事》與亞述《阿希卡爾的教訓》作古代近東對照
  surfaces:
  - phrase: 耶和華叫驢開口
    verses:
