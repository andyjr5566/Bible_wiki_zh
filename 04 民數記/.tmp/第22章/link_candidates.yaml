- name: 祝福與咒詛
  type: 主題
  evidence: v6「你為誰祝福，誰就得福；你咒詛誰，誰就受咒詛」；v12「因為那民是蒙福的」；GT《背景註釋》整段說明古代近東咒詛的力量與儀式
- name: 驢
  type: 背景
  evidence: v21-33 巴蘭備上驢、三次打驢；CT 說當時中東地區驢適於短途旅行、駱駝適於長途旅行
  surfaces:
  - phrase: 驢
- name: 先知
  type: 主題
  evidence: GT《背景註釋》說巴蘭「具有國際性的真先知信譽」「不獨是個占卜者而已」，KC 則說他不是耶和華的先知；四套來源對他的先知身分看法分歧
- name: 刀劍
