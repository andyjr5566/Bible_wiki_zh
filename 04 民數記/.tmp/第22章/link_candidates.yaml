- name: 巴蘭是先知還是術士
  type: 解經爭議
  evidence: GT《背景註釋》說他「具有國際性的真先知信譽」「不獨是個占卜者而已」；GT《啟導本》列四點說他不是聖潔的先知；KC 說他是假先知、撒但的僕人；書13:22 稱他為術士
- name: 神既准巴蘭去又向他發怒
  type: 解經爭議
  evidence: v20 神說「你就起來同他們去」，v22 卻說「神因他去就發了怒」；賈斯樂郝威《聖經難解經文詮釋手冊》與艾基斯《舊約聖經難題彙編》各有一則專門處理；GT《背景註釋》另有〈神差派後反又敵擋〉
- name: 神的允許與神的命定
  type: 神學
  evidence: CT 反覆分辨兩者：「神的命定並沒有改變…他放棄了神的命定，而接受了神的允許」「真正愛慕神的人是不甘心接受神的允許的」；神的容許乃是表徵神的「任憑」（羅一24、26）；GT 丁良才說「神先因恩典不淮巴蘭去，後因發怒任憑他去」並引詩106:15、箴1:31、詩81:12、賽66:4、耶2:19
- name: 神的主權
  type: 神學
  evidence: GT《聖經精讀本》說神是萬有之主、掌管萬事、按自己聖潔的旨意成就歷史，並說神掌管了巴蘭的意志和口；BH 反覆說 God can use anyone to fulfill His purposes
- name: 巴力（迦南主神）
  type: 背景
  evidence: v41「巴力的高處」；KC 說這是聖經中第一次提到巴力，並說明巴力（意為「主」）是迦南人的主神、亞斯她錄是主要的女神，士師時期在以色列取得固定地位，亞哈與耶洗別時代成為國教
- name: 代爾阿拉的巴蘭銘文
  type: 背景
  evidence: GT《舊約聖經背景註釋》記載 1967 年夫朗肯率領的荷蘭考古團在約旦代爾阿拉遺址發現刻字灰泥殘片，鑑定為主前八五○年左右、用亞蘭文寫成，提到比珥的兒子巴蘭是個先見
- name: 古代近東的神諭機制
  type: 背景
  evidence: GT《舊約聖經背景註釋》說有五十多個馬里文獻記載口傳的神諭，不同神明透過一般人或僧侶向馬里王心利林傳達信息；同一則註釋把巴蘭的直接神諭與占卜（檢查祭牲、觀察雀鳥飛行）分開
- name: 巴蘭的道路（彼後2：15-16）
  type: 互文
  evidence: CT 引彼後二15「隨從比珥之子巴蘭的路，巴蘭就是那貪愛不義的工價的先知」；KC 說新約三處引用中這是第一處
- name: 巴蘭的錯謬（猶11）
  type: 互文
  evidence: CT 引猶11「為利往巴蘭的錯謬裡直奔」；KC 列出新約三處引用之一
- name: 巴蘭的教訓（啟2：14）
  type: 互文
  evidence: CT 引啟二14「有人服從了巴蘭的教訓。這巴蘭曾教導巴勒將絆腳石放在以色列人面前」；KC 列為新約三處引用之一
- name: 咒詛你的我必咒詛他（創12：3）
  type: 互文
  evidence: BH 在 v6、v12、v13、v17 反覆引創12:3 說神應許賜福給祝福亞伯拉罕的、咒詛咒詛他的，指出巴勒的計畫從一開始就注定落空
- name: 開眼得見天上軍兵（王下6：17）
  type: 互文
  evidence: BH 在 v31 引王下6:17 以利沙僕人被開眼看見天軍作對照，說明神使人看見屬靈實際
