name: 耶利哥
type: 地點
secondary_types: []
aliases: []
status: formal
definition: |
  民數記22:1 以色列人在摩押平原安營，「對著耶利哥」。這是耶利哥在民數記裡第一次出現，此時它還隔著約但河，在河的西面。

  **位置關係。** CT 說得很清楚：「『耶利哥』耶利哥平原就在摩押平原的對面，中間隔著約但河，即約但河的西面。」

  **它有多老。** BH 指出耶利哥是世上最古老的有人居住城市之一，位置緊鄰約但河，具戰略地位。

  **它預示了什麼。** BH 說這裡提到耶利哥，是為接下來征服迦南預作伏筆——以色列繞城七日、城牆倒塌那一戰就從這裡開始；同時也點出以色列進入應許之地要面對的軍事難度。CT 給的原文字義是「它的月亮」。
accumulations:
- book: 民數記
  chapter: 22
  summary: 民數記22:1：「以色列人起行，在摩押平原、約但河東，對著耶利哥安營。」
  relation: 耶利哥在本章只出現一次，卻是一個方向指標：以色列營帳的正對面就是迦南的第一座城。BH 指出這一筆是為日後攻取耶利哥預留伏筆。對摩押王巴勒而言，這也意味著以色列的目標其實不是摩押——他所懼怕的，是一支正面向約但河西岸的隊伍。
