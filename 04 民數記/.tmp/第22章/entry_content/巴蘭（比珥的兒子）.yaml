name: 巴蘭（比珥的兒子）
type: 人物
secondary_types: []
aliases: []
status: formal
definition: |
  比珥的兒子巴蘭，來自幼發拉底河邊毘奪的異邦術士兼先見，民數記22-24 章的核心人物。

  **他的名聲。** CT 說他「是米所波大米人，一位出名的異教術士，摩押王巴勒慕名差人去邀請他」。GT《啟導本聖經註釋》說他「能用觀兆解夢、妖術等等來預卜吉凶休咎」。GT《舊約聖經背景註釋》給的評價明顯不同：他「具有國際性的真先知信譽」，而且「他不獨是個占卜者而已」——「巴蘭每次都似乎是直接與神溝通」。

  **他和耶和華的關係。** 民22:18 他自稱「耶和華─我神」。GT《舊約聖經背景註釋》對此保留：「巴蘭很可能只是認識以色列之神的名聲（見：書二9～11喇合的話），又或對每個神都是如此稱呼，來誇耀自己先知的威信而已」，並說「我們沒有必要堅持巴蘭所事奉的，惟獨是耶和華」。KC 說得更重：壞人也能用非常敬虔的言語；巴蘭把這幾個字當成一個公式在用，這裡談不上任何關係。

  **聖經如何評價他。** KC 統計得很完整：他的名字出現在八卷聖經書卷裡，而且一律是負面的——民22-24、民31:8、31:16、申23:3-5、書13:22、24:9-10、尼13:1-2、彌6:5、彼後2:15-16、猶11、啟2:14。新約三處引用各給了一個詞：「巴蘭的道路」（彼後2:15）、「巴蘭的錯謬」（猶11）、「巴蘭的教訓」（啟2:14）。

  **他的結局。** GT 李道生《舊約聖經問題總解》指出，巴蘭後來主動教導巴勒把絆腳石放在以色列人面前，使以色列人與摩押女子行姦淫、向假神獻祭，「而陷眾民於險惡的罪中，使二萬四千人遭受瘟疫死亡之禍」，而他自己「最後的結局，竟然死於刀下」。
accumulations:
- book: 民數記
  chapter: 22
  summary: 民數記22:5-41：巴蘭兩度接待巴勒的使者、兩度求問神，最後隨使臣同去；途中三次打驢、被耶和華的使者攔阻、蒙開眼，末了上到巴力的高處。
  relation: 本章把巴蘭的兩面同時攤開：他嘴上說「巴勒就是將他滿屋的金銀給我，我行大事小事也不得越過耶和華─我神的命」，行動上卻在神已經明說不可之後又去求問第二次。CT 說他「假裝並不貪財，許多神棍在人前也是這樣說的」。GT《聖經精讀本》則指出他嘴上說再多金銀也要遵行神旨意，「借著這樣的話暴露了自己是表裡不一的人」。而神並沒有因此改變祝福以色列的心意——反倒把這個被錢驅使的人，變成宣告祝福的器皿。
