name: 巴力（迦南主神）
type: 背景
secondary_types: []
aliases: []
status: formal
definition: |
  民數記22:41 的「巴力的高處」，KC 說是聖經第一次提到巴力；更準確地說，是迦南主神巴力作為敬拜對象首次登場——「巴力」這個字本身更早已見於出14:2 的地名巴力洗分。

  **它是誰。** KC 說明得最完整：巴力（意思是「主」）是迦南人的主神，亞斯她錄則是主要的女神。

  **它在以色列歷史中的位置。** KC 接著給了一條線：這種偶像崇拜在士師時期於以色列取得固定的地位；撒母耳出來事奉的最初幾年，這偶像曾從地上除去，但後來又回來了；到亞哈作十支派之王的時候，他那更邪惡的妻子耶洗別把巴力崇拜變成以色列的官方宗教。

  **這個地點的性質。** KC 說巴勒把巴蘭帶到巴力的高處，而那是一個完全獻給撒但的地方，撒但躲在「巴力」這個名字後面；第一次的咒詛嘗試就要從這裡開始。

  **摩押人自己拜的是誰。** BH 在民22:3 指出，摩押人敬拜的是基抹；一群相信獨一真神的百姓出現在境內，對他們的信仰本身就是一個挑戰。

  CT 補上一個本卷內的線索：巴力是摩押人所拜的偶像假神，又名巴力毘珥（參民25:5）。
accumulations:
- book: 民數記
  chapter: 22
  summary: 民數記22:41：「巴勒領巴蘭到巴力的高處；巴蘭從那裡觀看以色列營的邊界。」
  relation: 本章結束在巴力的高處上，這不只是地理，也是接下來三章的屬靈定位。KC 指出這是聖經第一次提到巴力，而巴勒選擇從這裡開始第一次咒詛的嘗試。這個名字在民數記裡還會再出現——民25 章以色列人與摩押女子行淫、拜巴力毘珥，而 GT 李道生指出那件事正是巴蘭出的主意。
