organization: "### 一個看得見的威脅，和一個看不見的計畫（v1-6）\n\n以色列人走完了曠野的路，在 [[摩押平原]] 紮下營。對岸就是 [[耶利哥]]，中間只隔著\
  \ [[約但河]] ——營帳的方向已經說明了一切：他們要過河，不是要打摩押。但 [[巴勒|西撥的兒子巴勒]] 看見的只有前一場戰爭的結果。GT《民數記串珠聖經註釋》把他的處境說得很清楚：「亞摩利人比摩押人強大，所以當以色列人取道摩押時，摩押人肯供給糧食和水」，只期望亞摩利人會擊敗以色列人，而「現在亞摩利人慘敗，摩押人就更恐懼了」\n\
  \n這份恐懼其實沒有根據。GT《聖經精讀本──民數記註解》指出：「摩押並不是以色列百姓要剿滅的物件(申7:1),所以沒有必要害怕以色列百姓經過。」KC 說得更重——惡人總是在沒有危險的地方看見危險，因為他們良心有虧。\n\
  \n於是巴勒換了戰場。GT《串珠》點出這一步背後的世界觀：「古代的民族有一相同信念，認為國家的興衰有系於一國之神的強弱。現在巴勒要請他國之神來幫忙。」他派人去請\
  \ [[巴蘭（比珥的兒子）|比珥的兒子巴蘭]]，一位住在幼發拉底河邊 [[毘奪（巴蘭的本鄉）|毘奪]] 的名術士。KC 由此指出巴勒最根本的誤判：他把以色列的神當成一位民族性的偶像，就像每個國家都有自己的神一樣；他只知道神是聖潔的，卻完全不知道神的恩典。\n\
  \n> [!important] 讀者一開始就知道，以色列卻不知道\n> KC 提醒，這三章的對話發生在以色列全然不知情的時候，就像約伯記一開頭神與撒但的對話一樣——而結果也一樣：仇敵的攻擊反成了神賜福的場合。\n\
  \n### 兩次求問，兩個答案（v7-21）\n\n長老們手裡拿著 [[卦金（qe.sem）|卦金]] 上門。**STEP語言資料**顯示這個詞的原文是 ke.sa.Mim（H7081），字面就是「占卜」的複數形；CT\
  \ 說它「指求見的禮物」，GT《舊約聖經背景註釋》則追問：「但巴蘭要到咒詛以色列人之後才能收費（民二十四11）。故此，這數額可能是報酬而非定金。」\n\n第一次求問，神的答覆沒有轉圜：「你不可同他們去，也不可咒詛那民，因為那民是蒙福的。」CT\
  \ 指出這句話的份量：「暗示即使以色列向神犯了罪，行了當咒詛的事，但他們始終是神的百姓，所以並不是被外邦人咒詛滅亡的對象。」這正是 [[咒詛你的我必咒詛他（創12：3）|創12:3\
  \ 那句應許]] 的效力所在。\n\n巴蘭轉述給使臣的版本卻少了一半。GT 丁良才《民數記註釋》抓得很準：「憑這一句可知巴蘭有願意去的意思。巴蘭並沒有說神不准我咒詛以色列人，因為那民是蒙福的（12）。」使臣回報時又再削一次，只說「巴蘭不肯和我們同來」。\n\
  \n第二批使臣「比先前的又多又尊貴」。丁良才說：「先前被差的人，總看出巴蘭猶疑不定，以為他是多要些卦金。」巴蘭這時說了本章最漂亮的一句話——再多金銀也不能 [[越過耶和華的口（peh）|越過耶和華我神的命]]\
  \ ——然後緊接著請他們再住一夜，好「等我得知耶和華還要對我說什麼」。CT 對這句的評語是：「去與不去，都假借神的意思。」\n\n```mermaid\nsequenceDiagram\n\
  \    participant B as \"巴勒\"\n    participant M as \"使臣\"\n    participant N as\
  \ \"巴蘭\"\n    participant G as \"神\"\n    B->>M: \"第一批：長老＋卦金\"\n    M->>N: \"求你來咒詛這民\"\
  \n    N->>G: \"在你這裡的人都是誰？\"\n    G-->>N: \"不可去，也不可咒詛，那民是蒙福的\"\n    N->>M: \"耶和華不容我和你們同去\"\
  \n    M->>B: \"巴蘭不肯和我們同來\"\n    B->>M: \"第二批：又多又尊貴＋極大尊榮\"\n    M->>N: \"不容什麼事攔阻你\"\
  \n    N->>G: \"等我得知還要對我說什麼\"\n    G-->>N: \"起來同他們去，只要遵行我的話\"\n    N->>B: \"備上驢同去\"\
  \n```\n\n[[神的允許與神的命定|神在第20節的允許]] 與第12節的禁止怎麼並存，是本章最常被問的問題。CT 的分法是：「神的命定絲毫沒有改變，改變的是巴蘭的道路，他放棄了神的命定，而接受了神的允許。」丁良才的說法相同——「神先因恩典不淮巴蘭去，後因發怒任憑他去（12、35）。神往往如此待人」——並列出詩一百零六15、箴一31、賽六十六4、耶二19\
  \ 一串同型經文。KC 則說神常常給人與他們自己的願望相符的差事，正如祂給以色列一個像掃羅那樣的王。\n\n### 路上的三次攔阻（v22-35）\n\n第22節出現全章最刺眼的一句：站在路上作攔阻者的，正是\
  \ [[耶和華的使者]]。**STEP語言資料**顯示「[[敵擋（sa.tan）|敵擋]]」的原文是 le./sa.Tan（H7854），簡要義域 sa.tan:\
  \ Satan——但 GT《舊約聖經背景註釋》立刻劃出界線：「本節用這個字只是形容天使在此扮演的敵對角色而已」，不是約伯記裡那位有格性的控訴者。\n\n接下來的三個回合，[[驢]]\
  \ 一次比一次沒有退路：\n\n| 回合 | 地形 | 驢的反應 | 巴蘭的反應 |\n| --- | --- | --- | --- |\n| 一（v23）\
  \ | 開闊的路上 | 跨進田間 | 打驢，要牠回轉上路 |\n| 二（v24-25） | 葡萄園的窄路，兩邊有牆 | 貼靠牆，把巴蘭的腳擠傷 | 又打驢 |\n\
  | 三（v26-27） | 狹窄之處，左右都沒有轉折的地方 | 臥在巴蘭底下 | 發怒，用杖打驢 |\n\n丁良才把這個結構整理成兩組數字：驢做了四件事（跨進田間、貼牆、臥下、開口說人話），巴蘭打了三次（打、再打、用杖打）。GT《啟導本聖經註釋》下的評語最直接：「一個自以為法力無邊的術士卻看不見神的天使，連驢也不如。」\n\
  \n[[驢開口說話|驢開口]] 是全章的轉折。GT《啟導本》指出：「除了伊甸園的蛇（創三1），全部聖經只有這裡記載動物開口說話。不同的是：蛇的話出乎魔鬼，驢說話是神叫它（28節）。」KC\
  \ 細讀驢說的三句話：牠承認巴蘭對牠的所有權、指出自己一生忠心服事、並且指出反常的不是牠而是他；但 KC 同時強調，這些問句沒有預言性的內容，只是任何一隻被虐待的動物都會問的話。真正反常的是巴蘭的反應——驢說了人話，他竟毫不驚訝，只顧著和牠爭辯。\n\
  \n然後神開了他的眼睛。**STEP語言資料**在這裡給出一個容易被中文譯法蓋掉的分別：第28節開驢的口用的是 H6605A（to open），第31節 [[眼目明亮（ga.lah）|使巴蘭的眼目明亮]]\
  \ 用的卻是 va/y.Gal（H1540I），簡要義域 ga.lah: to reveal: uncover——不是把壞掉的眼睛修好，而是把一層遮蔽揭開。CT\
  \ 說這裡的眼睛「並不是指巴蘭身體的眼睛，而是指他屬靈的眼睛，也就是說指他屬靈的認知能力」；BH 則引 [[開眼得見天上軍兵（王下6：17）|王下6:17 以利沙的僕人被開眼]]\
  \ 作對照。兩處差別很大：僕人看見的是保護，巴蘭看見的是對著自己的 [[刀劍|刀]]。\n\n### 從邊界到巴力的高處（v36-41）\n\n巴勒親自趕到 [[亞嫩河]]\
  \ 旁的邊界城迎接。丁良才指出這條界線的由來：「亞摩利人的王西宏，曾占了摩押地，直到亞嫩河。」——摩押的國界之所以在這裡，本身就是一場敗仗的結果。GT《串珠》說巴勒到此迎接，是「希望巴蘭迅速地辦完他所願望的事」。\n\
  \n一行人先到 [[基列胡瑣]]，巴勒在那裡宰牛羊設宴（第40節小字註明「原文作獻」）。丁良才對這一節有個具體的推想：「巴勒一面獻祭，一面請巴蘭和陪伴他的使臣坐席。巴勒大概將這些牛羊獻給耶和華，因為巴蘭是耶和華的先知。」\n\
  \n隔天早晨，巴勒把巴蘭帶上 [[巴力的高處（Bamoth-baal）|巴力的高處]]。**STEP語言資料**顯示這在原文其實是一個地名（H1120H／H1168I，兩字都標為專有地名），和合本的意譯讓讀者容易忽略它是個地點。KC\
  \ 指出這是聖經第一次提到 [[巴力（迦南主神）|巴力]]，並說這是一個完全獻給撒但的地方；他同時看出巴勒選址的用意——從這裡巴蘭看不到全民，只看得到一部分，好讓他小看這個民族。CT\
  \ 則說這個「觀看以色列營的邊界」有兩種解法：看到的是最遠處的營盤，或只是最近處的營盤。\n\n### 這個人到底是誰（跨章脈絡）\n\n[[巴蘭是先知還是術士|巴蘭的身分]]\
  \ 在四套來源之間沒有共識，而分歧的關鍵是判準不同：\n\n| 來源 | 判準 | 結論 |\n| --- | --- | --- |\n| GT《舊約聖經背景註釋》\
  \ | 溝通方式（直接領受、以神諭形式宣告） | 「具有國際性的真先知信譽」，不獨是個占卜者 |\n| GT《啟導本聖經註釋》 | 敘事線索與後續行為 | 不是聖潔的先知，列出四點理由\
  \ |\n| GT《民數記串珠聖經註釋》 | 動機 | 「巴蘭並不是耶和華的先知（本章從沒有用這詞）」 |\n| KC | 信息內容（有無指出不忠與悔改） |\
  \ 假先知、撒但的僕人 |\n| CT | 職業身分 | 「一位出名的異教術士」 |\n\nGT《啟導本》自己提出並回答了隨之而來的問題：受感說話的人不一定是聖潔的——連受神罰的掃羅王仍可說預言（撒上19:23-24）；「神可以用任何人替祂說話，巴蘭能說神要說的話，不一定就表示他聖潔」。這一點與\
  \ [[代爾阿拉的巴蘭銘文|考古發現的代爾阿拉銘文]] 互相呼應：主前九世紀的約旦已有一份亞蘭文文獻，把比珥的兒子巴蘭記成一個夜間領受神明信息的先見。\n\n\
  至於他的結局，新約用三個詞記住了他：[[巴蘭的道路（彼後2：15-16）|彼後2:15 的「巴蘭的道路」]]、[[巴蘭的錯謬（猶11）|猶11 的「巴蘭的錯謬」]]、[[巴蘭的教訓（啟2：14）|啟2:14\
  \ 的「巴蘭的教訓」]]。本章的 [[咒詛（a.rar 與 qa.vav）|咒詛]] 從頭到尾沒有成功，而 GT 李道生《舊約聖經問題總解》指出，他後來換了一條路——教巴勒把絆腳石放在以色列人面前，「而陷眾民於險惡的罪中，使二萬四千人遭受瘟疫死亡之禍」。外面的咒詛動不了這民，能傷害他們的只有他們自己的不忠。"
