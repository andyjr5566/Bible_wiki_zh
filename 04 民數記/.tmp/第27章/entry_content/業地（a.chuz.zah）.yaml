name: 業地（a.chuz.zah）
type: 原文
secondary_types:
- 主題
aliases:
- a.chuz.zah
status: formal
definition: |-
  業地 a.chuz.zah 是 STEP 對 H272 的詞典音譯與義域，簡要義為 possession（所持有的產業）。民數記27章出現兩次：

  - 民27:4 אֲחֻזָּה（'a.chu.Zah），HNcfsa，陰性名詞單數絕對形：女兒求在父親的弟兄中得到一份可持有的產業。
  - 民27:7 אֲחֻזַּת（'a.chu.Zat），HNcfsc，陰性名詞單數附屬形：神命摩西把一份地業給她們。

  CT 對民27:4「產業」的原文字義寫作「財產，遺產」，民27:7「為業」也作「財產，遺產」。四套註釋把它放在具體土地制度中理解：五位女兒所求並非抽象名分，她們要在父親兄弟所得的支派土地中實際取得一份，維持生活並保存父家。

  民27:7 隨即用 H5159 na.cha.lah 說「父親的產業」。前者著重可持有的業地，後者著重由父親傳下的繼承份。中文都可能譯成「產業」，STEP 的 exact Strong 與 morphology 讓讀者看見經文在同一節使用了兩個不同名詞。
accumulations:
- book: 民數記
  chapter: 27
  summary: H272 a.chuz.zah 出現在第4節女兒的請求和第7節神的裁決，分別為陰性單數絕對形與附屬形，指她們在父族中實際可持有的業地。
  relation: 這個詞使法律裁決落到具體土地，不只保留家名；它與 H5159 承受的產業之意並列，分別呈現持有物和繼承份。
