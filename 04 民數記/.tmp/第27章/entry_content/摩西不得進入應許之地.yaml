name: 摩西不得進入應許之地
type: 事件
secondary_types:
- 神學
aliases:
- 摩西只能觀看迦南地
- 摩西不得進迦南
status: formal
definition: |-
  民數記27:12-14 正式通知摩西：他可以從亞巴琳山觀看神所賜的地，卻要像亞倫一樣死去，不能帶百姓進入。原因不是年老或接班安排本身，而是米利巴事件中，他和亞倫違背神的命令，沒有在會眾眼前尊神為聖。

  **這段把審判與恩典並列。**

  - 審判：神沒有因摩西長久服事就撤回米利巴的判詞。CT 與 BibleHub 都指出，公開代表神的領袖要為自己在百姓面前的行動負更重責任。
  - 恩典：神仍准他觀看土地，也用歸到列祖（原文作本民）描述他的死。KingComments 強調摩西聽見自己的終局後沒有苦毒，立刻為會眾求一位合適的牧者；GT 也把後半章的接班人問題直接接在這項通知之後。
  - 應許：摩西不能進入，神賜地的計畫仍繼續。領袖會更替，神對以色列的應許不因一位領袖離世而中斷。

  STEP 使兩個關鍵動作更清楚。民27:13 你也必歸到你列祖是 H622 אָסַף（a.saph，聚集）的 Niphal 形 וְ/נֶאֱסַפְתָּ（ve./ne.'e.saf.Ta，Hc/VNq2ms），context gloss 可譯作你將被聚集；同節提到亞倫被聚集也是 H622 的 Niphal。民27:14「尊我為聖」是 H6942G לְ/הַקְדִּישֵׁ/נִי（le./hak.di.She./ni，HR/Vhcc/Sp1bs），使役式不定詞附第一人稱單數受詞，context gloss 可譯作把我當作聖。詞形確認動作，受罰原因則由神在本段親自說明。
development: |-
  民數記20章先記米利巴的失敗與不得領這會眾進地的判詞；27章在第二次數點後確認摩西將死，並立即安排約書亞；申命記34章則記他從尼波山觀看全地、死在摩押地。三段依次交代原因、交接與實現。
accumulations:
- book: 民數記
  chapter: 27
  summary: 神命摩西從亞巴琳山觀看所賜之地，接著像亞倫一樣被聚集歸到本民；米利巴未在會眾眼前尊神為聖，是他不得進地的明確原因。
  relation: 這項通知沒有使摩西轉向自己；他隨即為會眾求領袖。章末的公開交接顯示神的應許和百姓的牧養在摩西離世後仍要繼續。
