name: 產業（na.cha.lah）
type: 原文
secondary_types:
- 主題
aliases:
- na.cha.lah
status: formal
definition: |-
  「產業」na.cha.lah 是民數記27:7-11 繼承次序反覆使用的核心詞，STEP 的 exact Strong 是 H5159，簡要詞典義為 inheritance（承受的產業）。本章共出現六次：民27:7 兩次，民27:8-11 各一次。

  | 節次 | 詞形資料 | 本節作用 |
  |---|---|---|
  | 27:7 前一處 | na.cha.Lah，HNcfsa | 陰性名詞單數絕對形：「一份產業」 |
  | 27:7 後一處 | na.cha.Lat，HNcfsc | 陰性名詞單數附屬形：「父親的產業」 |
  | 27:8-11 | na.cha.Lat 加第三人稱陽性單數後綴，HNcfsc/Sp3ms | 逐級說明「他的產業」交給誰 |

  這六次重複把法律問題鎖定在「誰承受死者原有的那一份」。CT 在民27:7 把這個詞解作基業、地業之意，並說女兒可取回父親的產業、傳給後代；GT、KingComments 與 BibleHub 都從土地、家名和支派延續來解釋它。

  **中文同譯「產業」時仍要分詞。** 民27:4 女兒求「分給我們產業」用的是 H272 a.chuz.zah，偏向可持有的地業；民27:7-11 的 H5159 則是法律次序中被傳遞的繼承份。民27:7 同時出現兩者：先把地給她們「為業」（H272），再把父親的「產業」（H5159）轉給她們。兩個詞在本段互相補充，不能只看中文表面就合併成一個原文字。
development: |-
  STEP 在已完成 machine validation 的民數記26-27章中，各找到 H5159 六次：26章處理支派按人數分得地業，27章處理一個家庭內地業如何傳遞。這個相鄰章的安排讓「分地」從全國尺度縮小到家族尺度；此 occurrence 結論只涵蓋已驗證的查詢範圍。
accumulations:
- book: 民數記
  chapter: 27
  summary: 第7-11節六次使用 H5159 na.cha.lah，透過絕對形、附屬形與所有格後綴反覆指向父親留下並逐級轉給親屬的產業。
  relation: 原文的密集重複顯示本段焦點是同一份家族繼承份如何不致消失；H5159 與表示持有地業的 H272 在第7節並列，語義互補。
