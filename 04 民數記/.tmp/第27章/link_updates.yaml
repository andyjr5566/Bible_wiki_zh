book: 民數記
chapter: 27
updates:
- title: 西羅非哈的女兒
  path: link_folder/人物/西羅非哈的女兒.md
  summary: 五位女兒在會幕門口公開說明父親沒有兒子、也未參與可拉叛亂，請求保留父家的名字和產業；神判她們有理，並由此訂出沒有兒子時的繼承次序。KC 著重她們尚未進地就求地業的信心，CT、GT、BH 則補上父家留名、法律先例和女性保障。
  relation: 第26章只把她們列在數點名冊中作伏筆，本章使伏筆成為全國律例；往後民36處理支派內婚姻限制，書17記她們實際取得地業。STEP 又區分 v4 的 H272 業地與 v7-11 六次 H5159 繼承份。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 摩西把前所未有的繼承案件帶到神面前；得知自己將因米利巴事件不能進地、只可觀看後，他沒有為自己爭位，反而求神立牧者，最後完全照命公開按立約書亞。
  relation: 本章集中呈現摩西晚年領導的三個特質：不以不知道答案為恥、接受神對自己的判決、在離世前把百姓需要和有秩序的交接放在自己之前。第13節 H622 的 Niphal 詞形描寫他將「被聚集」歸到本民。
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 神點名嫩的兒子約書亞為接班人，說他裡面有靈；摩西在以利亞撒和全會眾面前按手、囑咐並分授尊榮，使百姓聽從他。日後他要由以利亞撒憑烏陵替他求問，按所得命令帶會眾出入。
  relation: 約書亞由長期作助手和探子時的忠信，進入公開領導。KC 說曠野三十八年間少有他的記載，神卻一直認識並塑造他；本章也顯示他的權柄有神選、聖靈能力、公眾承認與祭司求問四重結構。
- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  summary: 以利亞撒先在會幕門口參與西羅非哈女兒的公開案件，後又在全會眾面前見證約書亞受任；神規定他日後要憑烏陵在耶和華面前替約書亞求問。
  relation: 本章把大祭司放在法律裁決與領袖交接兩個公共場景中。GT 以軍政領導與祭司求問的互助解釋約書亞、以利亞撒的配搭；KingComments 則強調領導要受祭司職分所代表的神聖指引約束。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 神用亞倫的死亡作摩西終局的對照：摩西觀看土地後，也要像哥哥亞倫一樣被聚集歸到本民；第14節又重申兩人在尋的曠野違命、未在會眾眼前尊神為聖。
  relation: 亞倫雖已離世，他在何珥山的交接仍成為摩西面對死亡與安排接班的先例。STEP 顯示 v13 描寫摩西「將被聚集」與亞倫「已被聚集」都用 H622 的 Niphal 詞形。
- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  summary: 第1節用瑪拿西—瑪吉—基列—希弗—西羅非哈的完整家譜，確認五位女兒所屬的父家與支派；她們要求的是在父親弟兄中分得地業，不是脫離瑪拿西另立一份。
  relation: 第26章記瑪拿西人口增至五萬二千七百並首次列出五位女兒，本章說明她們為何必須被記名。案件使支派人口、家族名分和實際分地連成一體，也為民36保留瑪拿西支派地業的限制鋪路。
- title: 會幕門口
  path: link_folder/地點/會幕門口.md
  summary: 西羅非哈的女兒站在會幕門口，在摩西、以利亞撒、眾首領與全會眾面前提出繼承案件；這不是私下陳情，而是眾人可見、可承認的公共法律程序。
  relation: 會幕門口在本章兼具敬拜中心與公共裁決場所的功能。BH 特別強調全會眾在場帶來公開性；神的回答隨後也從個案成為全以色列的律例典章。
- title: 可拉的背叛（預告）
  path: link_folder/人物/可拉的背叛（預告）.md
  summary: 五位女兒主動聲明父親沒有與可拉同黨聚集攻擊耶和華，而是在自己的罪中死去；這為父親的死因和家族繼承資格作出必要區分。
  relation: 第26章重述可拉、大坍、亞比蘭的集體叛亂與審判，本章從一個家庭的法律申訴回看那事件。經文既不美化西羅非哈，也不把可拉同黨的特殊罪名錯加在他身上。
- title: 加低斯
  path: link_folder/地點/加低斯.md
  summary: 第14節括註把摩西、亞倫違命的湧水之地定位為尋的曠野加低斯米利巴水；GT《舊約背景註釋》並把事件置於加低斯巴尼亞綠洲附近的地理環境。
  relation: 加低斯在本章不是新事件地點，而是神重申摩西不得進地原因時的歷史座標；它把民20的水事件直接帶進領袖更替的脈絡。
- title: 摩西擊打磐石兩下
  path: link_folder/事件/摩西擊打磐石兩下.md
  summary: 第14節沒有重述擊石細節，卻由神概括其核心：摩西與亞倫在會眾爭鬧時違背命令，未在湧水之地、眾人眼前尊神為聖。STEP 將「尊我為聖」標為 H6942G 的使役式不定詞。
  relation: 民20記行動與即時判詞，本章則顯示長期後果：摩西只能觀看土地，必須把帶領進地的使命交給約書亞。事件因此成為摩西終程與公開交接的直接因果背景。
- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 本章兩半都朝向迦南地：五位女兒在尚未取得土地時就求父家產業，摩西則從亞巴琳山觀看神所賜之地，卻不能親自帶百姓進去。
  relation: 迦南地把產業條例和領袖交接連成一章。前半處理各家如何保有所得，後半處理摩西離世後誰帶領全會眾進去；神賜地的應許超越個別家庭和領袖的更替。
- title: 禧年（第五十年）
  path: link_folder/原文/禧年（第五十年）.md
  summary: 本章沒有直接出現「禧年」，GT 在解釋女兒承業時引利25與禧年制度：土地屬神，家庭是受託管理者；因困境轉出的地到禧年仍要歸回原有家族。
  relation: 禧年背景說明為何西羅非哈女兒所求不只是一般財產收益，而是神所賜、應在家族與支派中延續的地業。民36日後限制婚姻跨支派，也沿著同一保存地業的原則發展。
- title: 地不可永賣（地權屬神）
  path: link_folder/神學/地不可永賣（地權屬神）.md
  summary: GT 以「土地永遠歸耶和華所有」解釋本章繼承制度：以色列人可按家族管理所得之地，卻沒有脫離神與支派秩序的絕對處分權；禧年、贖回和近親承業共同防止家族永久失地。
  relation: 第12節神稱迦南為「我所賜給以色列人的地」，第7-11節又規定父家產業逐級轉給親屬。兩段合起來呈現神是賜地者，家庭是承受與管理者。
- title: 歸到他列祖
  path: link_folder/主題/歸到他列祖.md
  summary: 神說摩西看過土地後要像亞倫一樣「歸到列祖（原文作本民）」。STEP 顯示 v13 的「你將被聚集」ve./ne.e.saf.Ta 與「他已被聚集」ne.e.Saf 都是 H622 的 Niphal 詞形。
  relation: 本章把這個死亡委婉語用在受米利巴判罰、卻仍在尊嚴中完成交接的摩西身上；受罰不能進地與被聚集歸回本民並列，不需要互相抵消。
- title: 在米利巴未將耶和華尊為聖
  path: link_folder/神學/在米利巴未將耶和華尊為聖.md
  summary: 第14節由神重申摩西不得進地的罪名：在尋的曠野、會眾爭鬧與湧水之時違背命令，沒有在會眾眼前尊祂為聖。STEP 的 H6942G le./hak.di.She./ni 是使役式不定詞，context gloss 為「把我當作聖」。
  relation: 第20章記失敗本身，第27章在領袖交接前再次宣讀原因，顯示公開代表神的人要在眾人面前準確彰顯祂的聖潔；神的計畫繼續，領袖本人仍承擔行動後果。
- title: 聖靈
  path: link_folder/神學/聖靈.md
  summary: 中文第18節稱約書亞為「心中有聖靈的」人；STEP 直接資料是 H7307G ru.ach 的陰性單數，context gloss 為「a spirit」。CT、GT、KC、BH 都按神揀選和任命的脈絡，解作神所賜、使約書亞能承擔領導的靈。
  relation: 第16節「萬人之靈」使用同一 H7307G 的陰性複數 ru.Chot，第18節回到約書亞裡面的單數。掌管眾人之靈的神選出裡面有靈的人，使領袖資格先建立在神的洞察與能力上。
- title: 按手
  path: link_folder/原文/按手.md
  summary: 神在第18節命摩西按手在約書亞頭上，第23節記摩西照做。STEP 顯示兩處均為 H5564 sa.makh：前者 Hc/Vqq2ms「你要按」，後者 Hc/Vqw3ms「他按了」；詞典簡要義域為支持。
  relation: 本章的按手用於公開任命與權柄交接。CT 解作交通、傳遞與合一，GT 丁良才說有正式派定和特別恩賜兩面，《舊約背景註釋》另列出古代近東授職伸手的圖像平行。
- title: 烏陵和土明
  path: link_folder/原文/烏陵和土明.md
  summary: 神規定約書亞要站在以利亞撒面前，由大祭司憑烏陵的判斷替他在耶和華面前求問。STEP 將「烏陵」標為 H224、帶定冠詞的複數名詞，「判斷」為 H4941G。
  relation: 烏陵使領袖交接保有一條可辨認的求問程序。GT 對比摩西直接與神說話、約書亞藉大祭司領受指示；BH 與 KingComments 也強調政治軍事領導仍依賴祭司在神面前所得的方向。
