organization: "### 三天就開始抱怨（v1-3）\n\n以色列人離開西乃的曠野才三天，第一件被記下來的事就是[[以色列人的怨言|發怨言]]。KC 把這個落差說得很清楚：「我們卻聽不見他們有任何喜樂。他們在路上只走了三天，就開始抱怨。」\n\
  \n抱怨的內容經文沒有說。GT《民數記串珠聖經註釋》：「以色列人發怨言的原因，經文並無說明，但很可能與他們初出埃及時的怨言源出一轍──他們缺乏水和食物。」GT\
  \ 丁良才另提出一個實際的可能：「以色列人住在西奈約有一年的工夫沒有行路，巴蘭曠野的道路比西奈的更加難走，他們或者因此發怨言。」\n\nSTEP語言資料顯示這一節的句子結構本身就帶著評價：「發怨言」是\
  \ ke./mit.'O.ne.Nim（H596，詞典形 a.nan，詞典義 to complain），Hithpael 分詞前面加了 ke（如同）；「惡語」則是單獨一個字\
  \ ra'（H7451B，詞典義 bad: evil）。==字面是「百姓像那些抱怨惡事的人」==——他們並沒有真的遇上什麼災殃，只是表現得像遇上了。KC 引達祕譯本腳註讀的正是這個結構：「他們的舉止像是遇上了什麼災殃的人。」\n\
  \n火燒到「營的邊界」。三家給了三種讀法：CT 說這是「達到閒雜人所住的地方」；GT《民數記串珠聖經註釋》說這「是初步的警告，並不算是嚴重的懲罰，因為火只燒了一些營幕的物件，似乎沒有毀滅生命」；KC\
  \ 讀成距離——「離神的中心最遠的人，最先落在神懲罰的手下」。\n\n火止住是因為有人代求（見[[摩西的代求]]）。CT 只用一句話收：「由此可知代禱的重要性。」KC\
  \ 把這件事放大：「幸而百姓中有一位代求者……教會裡人也抱怨、也埋怨眼前的光景，但那藉代求除去惡的幫助在哪裡？」那地就叫[[他備拉]]，意思是燃燒。它到底是不是一個獨立的地方，另有爭議（見[[他備拉與基博羅哈他瓦是否同一地]]）。\n\
  \n### 為肉哭號：記得的與忘記的（v4-9）\n\n第二次抱怨從[[閒雜人]]起頭（他們的身分見[[閒雜人是誰（出12：38）]]），再蔓延到全體。GT《聖經精讀本》：「罪就是這樣具有很強的傳染性，在很短的時間內會把整個群體毀滅。」GT\
  \ 丁良才用三個比方說同一件事：「一點面酵能發起全團，一枚爛果能帶壞全簍，一個不好的學生能敗壞全校。」\n\nGT 丁良才把百姓這番話裡的問題列成五條，值得整條照錄：\n\
  \n| # | 以色列人的錯誤 | 出處 |\n| :--- | :--- | :--- |\n| 1 | 單記埃及的食物 | v5 |\n| 2 | 不記埃及的苦楚\
  \ | v5 |\n| 3 | 藐視神所預備的 | v6 |\n| 4 | 論理不公 | v7-9 |\n| 5 | 捨不得宰殺各人的牛羊 | v4、6，參22\
  \ |\n\n第五條最容易被略過：他們並不是真的沒有肉。CT 在〔話中之光〕指出「以色列人還有從埃及帶出來的牲畜，可以宰吃（參22節）」；GT《舊約聖經背景註釋》補上原因：「他們雖有牲口，但卻不願宰殺，免得削減牧群的數目。再者這些肉類是慶典食品，不是他們日常的食物。」他們想吃的是尼羅河的魚——同一份來源說「他們在埃及住在河邊，吃慣了魚類」。\n\
  \n這五條不是孤立的。丁良才在同一段把民11 到民14 讀成一條連續的線（見[[以色列人一連五次違背神]]），本章佔了前兩級。\n\n```mermaid\n\
  timeline\n    title 民11-14 一連五次違背神（GT 丁良才）\n    十一1-3 : 發出怨言\n    十一4-35 : 貪求肉食\n\
  \    十二章 : 嫉妒摩西\n    十三章至十四39 : 譭謗美地\n    十四40-45 : 擅自前往\n```\n\n第7至9節是插敘，客觀描述[[嗎哪]]的樣子與作法（見[[嗎哪的物理特性]]）。GT《民數記串珠聖經註釋》指出這段話「是作者對嗎哪客觀的描述，不屬於以色列人埋怨之言」，用意正是反駁百姓「心血枯竭」的說法——STEP語言資料顯示這個詞是\
  \ naf.She./nu（H5315L，詞典義 soul: appetite）配 ye.ve.Shah（H3002，詞典義 dry），字面就是「我們的胃口乾了」。\n\
  \n> [!note] 一個各家讀法相反的細節\n> 本章第8節說嗎哪滋味「好像新油」，出16:31 卻說「如同攙蜜的薄餅」。CT 判為不衝突：「兩者的描述並不衝突，只是烹製方法和過程不同，各有千秋」；GT\
  \ 賈斯樂郝威《聖經難解經文詮釋手冊》命題11 也這樣解——一個是原初的味道，一個是煮過以後的。KC 卻把這個差異當成重點：==「這裡沒有提到『滋味如同攙蜜的薄餅』（出16:31）。」==\
  \ 在他讀來，甘甜不見了。\n\n百姓對嗎哪的態度，在新約有一個對應的場景（見[[百姓厭棄嗎哪（約6：31-35）]]）。\n\n### 摩西也發怨言（v10-15）\n\
  \n百姓哭號，摩西也垮了。這段話的力度可以量出來——GT 丁良才數過：「『我……我……我』——共有十二個我字」，並直接評語：「摩西幾乎失了盼望，他不喜歡民發怨言，自己卻發怨言。」（見[[摩西的靈命低谷與重擔求死]]）\n\
  \nSTEP語言資料顯示第15節那句求死的話，原文是同一個動詞用了兩次：ha.re.Ge./ni（H2026，詞典形 ha.rag，詞典義 to kill，命令式）配\
  \ ha.Rog（同一個 H2026，不定詞絕對式），正對得上 CT 所註的「立時…殺了（原文雙同字）」。同節「苦情」是 be./ra.'a.T/i（H7451C，詞典義\
  \ distress: harm），與第1節百姓所發的「惡語」ra' 同一字根——==百姓抱怨自己的苦，摩西求神別讓他看見自己的苦，用的是同一個字。==\n\n\
  各家對這段話的評價方向一致，重點不同：\n\n| 來源 | 怎麼看摩西這段話 |\n| :--- | :--- |\n| CT、GT《啟導本聖經註釋》 | 「不少偉大的聖者，在苦難的時刻，也出現過信心的危機。這見於以利亞、施洗約翰，也見於彼得」\
  \ |\n| GT 丁良才 | 另舉以利亞（王上十九4-10）與約拿（拿四1-3）為同類 |\n| GT《聖經精讀本》 | 「任何了不起的神的工人，都有人性軟弱的一面」\
  \ |\n| KC | 摩西「忘了照顧肉身、背負百姓本來就不是他的事，而是神的事（出19:4；申1:31）。神也並沒有期待他做這些」 |\n| BH | 這段話顯出「即使最忠心的領袖也會被壓垮」\
  \ |\n\n神的回應沒有一句責備。GT 丁良才：「耶和華憐恤摩西，並沒有責備他。」CT：「神的恩典是大的，對摩西的懷疑並沒有過深的責備。」\n\n### 七十個人分擔一副擔子（v16-30）\n\
  \n神的答覆是制度性的：招聚七十個[[以色列的長老|長老]]，把降於摩西身上的[[聖靈|靈]]分賜他們（見[[七十長老制度起源]]）。\n\nSTEP語言資料在這裡連出一條線：第12節「抱」、第14節「擔當」、第17節「同當」與「獨自擔當」，==全部是同一個動詞\
  \ na.sa（H5375H，詞典義 to lift: bear）==；第17節的「重任」則是同根名詞 ma.Sa（H4853A，詞典義 burden）。摩西說「我扛不動」，神的答覆用的正是同一個字：「他們就和你同當……免得你獨自擔當。」\n\
  \n分出去，摩西會不會少掉什麼？KC 用一個比喻回答：「這就像一塊燃燒的木頭。那塊燃燒的木頭若點燃另一塊木頭，它自己的火一點也不會減少，反而使火更大。」STEP語言資料顯示第17、25節「分賜」是\
  \ a.tsal（H680），簡要詞典義是 to reserve，本節譯義是 share。\n\n```mermaid\nflowchart TD\n    A[\"\
  百姓哭號要肉\"] --> B[\"摩西向神訴苦：我獨自擔當不起\"]\n    B --> C[\"神：招聚七十長老到會幕\"]\n    C --> D[\"\
  靈分賜七十人，他們受感說話\"]\n    C --> E[\"兩人留在營裡，靈同樣停在他們身上\"]\n    E --> F[\"約書亞：請禁止他們\"]\n\
  \    F --> G[\"摩西：惟願耶和華的百姓都受感說話\"]\n    B --> H[\"神：明天必給你們肉吃\"]\n    H --> I[\"\
  風把鵪鶉刮來\"]\n    I --> J[\"肉在牙齒間，災殃臨到\"]\n```\n\n七十長老受感說話「以後卻沒有再說」。這件事在當時的世界並不陌生（見[[古代近東的超脫預言]]），但它的功能是印證而不是預測——GT\
  \ 丁良才：「神這一次使他們受感說話，無非是要顯明他們的職分，是神認可的。」\n\n真正的高潮是留在營裡的那兩個人（見[[伊利達與米達]]）。KC 指出他們缺席反而成了證據：「我們可以看見神護理中一個特別的引導，就是這兩個人不在場——因為這樣才顯出驅動這些長老的確實是神的靈，不是摩西給了他們那靈，而是神自己。」[[約書亞]]要摩西禁止他們，摩西的回答成了本章最被引用的一句：「你為我的緣故嫉妒人嗎？惟願耶和華的百姓都受感說話！」\n\
  \nCT 在〔話中之光〕把這句話讀成人格的量度：「如果一個人真正偉大，他盼望人人都與他一樣，甚至要比他強。他因人們有敬虔的心而歡喜，別人有更大的恩賜而高興。」KC\
  \ 則指出這個心願後來有了下文：它「在約珥那裡成了耶和華的應許：兒女要說預言」（珥2:28-29）——這條線一路接到五旬節（見[[先知]]、[[聖靈分賜預表五旬節（徒2：1-4）]]）。\n\
  \n### 鵪鶉、貪慾與墳墓（v31-35）\n\n神說到做到。風把[[鵪鶉遷徙|鵪鶉]]從海面刮來（見[[鵪鶉遮營]]），數量之大讓摩西先前的懷疑顯得可笑——他曾說「難道給他們宰了羊群牛群，或是把海中所有的魚都聚了來，就夠他們吃嗎？」\n\
  \n| 經文說的 | 各家的換算與說法 |\n| :--- | :--- |\n| 一天的路程 | CT：折合每天約二十餘公里 |\n| 離地面約有二肘 | CT\
  \ 與 GT《啟導本聖經註釋》：約一公尺；GT《民數記串珠聖經註釋》寫作「九十毫米」 |\n| 至少的也取了十賀梅珥 | CT：約二千二百公升；GT《舊約聖經背景註釋》：估計四十或六十蒲式耳\
  \ |\n| 終日終夜並次日一整天 | CT：共計約三十六小時 |\n\n「離地面約有二肘」是飛在一公尺高，還是堆到一公尺厚？GT《啟導本聖經註釋》兩說並存，並指出後一種讀法比較能解釋一人一天取到十賀梅珥；GT\
  \ 艾基斯《舊約聖經難題彙編》主張後者，理由是「『地面』之前的前置詞’al應翻譯作『超出』……而不是『上』」。STEP語言資料顯示第31節這個介系詞在本節的譯義正是\
  \ above。\n\n災殃隨即臨到（見[[耶和華擊打百姓的瘟疫]]）。STEP語言資料顯示第33節「擊殺」是 va/i.Yakh（H5221，詞典形 na.khah，詞典義\
  \ to smite），Hiphil 使役形，主語是耶和華——經文把這件事直接歸給神的作為。至於災殃的實際形式，CT 判「大概是瘟疫」並註「指食物中毒」，GT《舊約聖經背景註釋》從鵪鶉沒有醃過推出同一結論。\n\
  \n那麼神究竟是因為什麼降災（見[[神賜鵪鶉又降災的因果]]）？GT 賈斯樂郝威《聖經難解經文詮釋手冊》命題13 的結論很直接：==「神並非因為百姓吃了鵪鶉而懲罰他們；而是因為百姓貪婪和忘恩的心態。」==\
  \ CT 在〔話中之光〕給了同一個教訓的另一種說法：「你不要用不滿的態度向神祈求任何事物，或許祂會應允你，但是你要付上很大的代價。」\n\n那地就叫[[基博羅哈他瓦]]，意思是貪欲之人的墳墓。STEP語言資料顯示這個名字是從第4節長出來的：第4節「大起貪欲的心」的第二個字是\
  \ ta.'a.Vah（H8378，詞典義 desire），第34節地名的後半正是同一個字；同節「起貪欲之心的人」也是同一個字根（H183，詞典形 a.vah）。==貪慾起於第4節，埋在第34節，用的是同一個字。==\n\
  \nKC 在這裡下了一句話：「他們墓碑上的題字是：『貪慾的百姓』。我們的墓碑上會寫什麼？」百姓從這裡走到[[哈洗錄]]——那正是下一章的場景。"
