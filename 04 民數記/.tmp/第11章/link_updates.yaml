book: 04 民數記
chapter: 11
updates:
- title: 閒雜人
  path: link_folder/人物/閒雜人.md
  summary: 第4節：「他們中間的閒雜人大起貪欲的心；以色列人又哭號說：誰給我們肉吃呢？」CT 註明這是「加入以色列人隊伍的烏合之眾（參出十二38）」，GT《啟導本聖經註釋》說得更直白：「『閒雜人』指不屬以色列血統但和他們一起離開埃及的外族人。」STEP 原文資料顯示本節這個詞是 ha./saf.Suf（H628，詞典義 rabble），與 CT 所註的原文字義「烏合之眾，聚集」相合。
  relation: 本章讓這群人的作用第一次顯出來：怨言是從他們身上起頭，再蔓延到以色列人。GT《聖經精讀本》：「可以看到閒雜人的怨言在以色列百姓中間蔓延。罪就是這樣具有很強的傳染性，在很短的時間內會把整個群體毀滅。」GT 丁良才用三個比方說同一件事：「一點面酵能發起全團，一枚爛果能帶壞全簍，一個不好的學生能敗壞全校。」KC 則從動機解釋為什麼是他們先開口：「他們不屬於那些前面有盼望的人。他們不渴慕應許之地，只為此時此地而活，不為將來。」
- title: 閒雜人是誰（出12：38）
  path: link_folder/解經爭議/閒雜人是誰（出12：38）.md
  summary: 第4節是這群人在民數記唯一一次被點名。他們的身分沒有經文明說，各家只能從用字與處境推。CT 給的原文字義是「烏合之眾，聚集」；STEP 原文資料顯示本節用的是 ha./saf.Suf（H628，簡要詞典義 rabble），是一個獨立的名詞，不是出12:38 那個「混雜群」的同一個字。
  relation: 出12:38 記他們跟著出埃及，民11:4 記他們在曠野帶頭發難——兩處合起來，才構成這個爭議的完整輪廓。GT《民數記串珠聖經註釋》推測「這些人可能是一度寄居埃及的其他民族（出12:38），他們對以色列的神認識不深，先求自己的滿足過於盼望神的應許」。KC 從結果反推身分：他們「對神的百姓造成污染」，而且「掛名的基督徒總會把屬肉體的基督徒拉到自己一邊」。經文沒有記他們後來的下場。
- title: 嗎哪
  path: link_folder/主題/嗎哪.md
  summary: 第6節百姓說「除這嗎哪以外，在我們眼前並沒有別的東西」，第7-9節則插入一段對嗎哪的客觀描述。CT 指出「嗎哪」的意思是「這是什麼呢？」（參出十六15），並注意到一處與出埃及記不同的記載：本章第8節說滋味「好像新油」，出16:31 卻說「如同攙蜜的薄餅」。
  relation: 同一個差異，兩家讀法相反。CT 判為不衝突：「兩者的描述並不衝突，只是烹製方法和過程不同，各有千秋」；GT 賈斯樂郝威《聖經難解經文詮釋手冊》命題11 也這樣解——出16:31 說的是原初的滋味，本節說的是煮過以後的味道。KC 卻把這個差異當成重點：「這裡沒有提到『滋味如同攙蜜的薄餅』（出16:31）。我們讀神的話時所享受的、與主耶穌之間關係的那份甘甜（結3:3），在這裡不見了。」他並指出百姓「用神沒有吩咐的方式處理嗎哪」。BH 則從正面收：嗎哪是基督的預表，正如主耶穌自稱生命的糧（約6:31-35）。
- title: 嗎哪的物理特性
  path: link_folder/背景/嗎哪的物理特性.md
  summary: 第7-9節是全本聖經對嗎哪描述最細的一段：形狀像芫荽子，外觀像珍珠（BH 作 gum resin，樹脂），可以用磨推、用臼搗、煮在鍋中、做成餅，滋味好像新油，夜間隨露水降下。
  relation: GT《舊約聖經背景註釋》把各種自然解釋攤開來看，也指出它們的極限：最常見的說法是「吸食檉柳樹汁之小蚜蟲的分泌物」，另有人認為是西乃半島南部漢瑪達所產的甜汁；但這種分泌物只在公曆五至七月、有檉柳之處出產，「全季節的產量也不過是五百磅左右。相對而言，聖經記載每人每日的收集量是半磅」——數量對不上。同一份來源連「芫荽子」這個比擬都保留：「芫荽在沙漠極少出現，這字較有可能是泛指有白色種籽的沙漠植物。」GT《民數記串珠聖經註釋》與《啟導本聖經註釋》也都說今天西乃野地雖偶見類似之物，卻「不同於聖經中所描寫的嗎哪」。
- title: 百姓厭棄嗎哪（約6：31-35）
  path: link_folder/互文/百姓厭棄嗎哪（約6：31-35）.md
  summary: '第6節：「現在我們的心血枯竭了，除這嗎哪以外，在我們眼前並沒有別的東西。」STEP 原文資料顯示「心血」是 naf.She./nu（H5315L，詞典義 soul: appetite），「枯竭」是 ye.ve.Shah（H3002，詞典義 dry），字面是「我們的胃口乾了」——正對得上 GT《民數記串珠聖經註釋》所註的「『心血枯竭』：指沒有胃口」。'
  relation: 曠野裡的人厭棄從天降下的糧，約翰福音六章的人求的也仍是地上的餅。BH 在第6節直接把兩處接起來：嗎哪是基督的預表，主耶穌在約6:31-35 自稱生命的糧，「以色列人對嗎哪的嫌棄預示了許多人對基督的拒絕」。KC 用的是同一組經文：嗎哪是「那從天上降下來的糧，叫人吃了就不死」（約6:50），而人若再被世界吸引，「就等於藐視主耶穌，以為祂給我們的不夠」。GT《聖經精讀本》另列出嗎哪在聖經中的幾種身分：天上的糧食（詩78:24；105:40）、屬靈的靈糧（林前10:3）、得勝之人要得的賞賜（啟2:17）。
- title: 以色列的長老
  path: link_folder/文化/以色列的長老.md
  summary: 第16節：「你從以色列的長老中招聚七十個人，就是你所知道作百姓的長老和官長的。」GT《聖經精讀本》分開兩個詞：長老是「神根據摩西的要求，選立了幫助摩西的七十位長老」，官長則是「以色列軍隊的領袖，可能是指行政負責人」。
  relation: KC 認為這兩個詞指的其實是同一批人，只是著重點不同：「用『長老』一詞是強調他們是有經驗、有智慧的人，重點在這個人；用『官長』或『監督』時，重點則在他們所擔任的職務。」他並指出新約也是同樣的用法（徒20:17、28；多1:5、7）。BH 也說這些人「已經因著領導與行政上的角色被community 認可」，先有名望才受託。
- title: 七十長老制度起源
  path: link_folder/歷史/七十長老制度起源.md
  summary: 第16-17、24-25節：神吩咐摩西招聚七十個長老站在會幕四圍，把降於摩西身上的靈分賜他們，好與他同當管百姓的重任。CT 讀「七十」為完全的數目：「七十個人表徵完全且完整的程度。」
  relation: GT 丁良才把這件事與出埃及記的兩個先例分得很清楚：出24:19 早已有七十個長老同摩西上山；出18:21 葉忒羅的建議設立的是千夫長、百夫長、五十夫長、十夫長，「所選的官長共有七萬八千多人」，而本章「耶和華只叫摩西立七十長老，神的靈又感動他們說預言，特為幫助摩西引領百姓。這兩件事的地點、時候、原因、人數、辦夫都是不同」。他另記下一個猶太傳統：「猶太人有遺傳說，這七十個長老，就是以色列國公會成立的起點」，但隨即補上反證——「聖書上也證明這公會不久便取消了，因為當士師和以色列諸王年間，聖書上全沒提到公會」。BH 也提到同一個傳統：這七十人「日後對應猶太人的公會（Sanhedrin），那也是七十人」。
- title: 聖靈
  path: link_folder/神學/聖靈.md
  summary: 第17、25節：「我要把降於你身上的靈分賜他們。」STEP 原文資料顯示「分賜」是 ve./'a.tzal.Ti（H680，詞典形 a.tsal，簡要詞典義 to reserve，本節譯義是 share）；「靈」是 ha./Ru.ach（H7307G，詞典義 spirit）；第25節「停在」是 ke./No.ach（H5117，詞典形 nu.ach，詞典義 to rest）。
  relation: 「分賜」會不會讓摩西減少？KC 用一個比喻回答：「這就像一塊燃燒的木頭。那塊燃燒的木頭若點燃另一塊木頭，它自己的火一點也不會減少，反而使火更大。神的靈也是這樣。」GT《民數記串珠聖經註釋》則指出舊約聖靈工作的一個特點：「舊約時代，聖靈的降臨多是暫時性的，所以七十個長老受感時說話，以後卻沒有再說。」GT《聖經精讀本》補上舊約的其他實例（士3:10；6:34；撒上10:6、10；11:6；16:13），並對照今日：「現在聖靈永遠居住在信徒的心裡。」
- title: 聖靈分賜預表五旬節（徒2：1-4）
  path: link_folder/互文/聖靈分賜預表五旬節（徒2：1-4）.md
  summary: 第25節七十長老受靈說話，第29節摩西說「惟願耶和華的百姓都受感說話！願耶和華把他的靈降在他們身上」。BH 在第17節指出這一幕「預表新約的五旬節，那時聖靈分賜給眾信徒（徒2:1-4）」。
  relation: KC 把兩處的形式對起來看：教會起頭時「如火焰的舌頭分開落在每一個聚集的信徒身上（徒2:3）……這種分賜並沒有使聖靈減少，反而讓別人看見這個人被祂充滿」。他並指出摩西的心願後來變成了應許：「摩西的哀嘆在約珥那裡成了耶和華的應許：兒女要說預言」（珥2:28-29）。GT《聖經精讀本》從成就的一面說同一件事：摩西的期待「通過基督的受死和聖靈的內住得到了完全的成就」。
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第28節：「摩西的幫手，嫩的兒子約書亞，就是摩西所揀選的一個人，說：請我主摩西禁止他們。」CT 指出「『摩西所揀選的』指約書亞列在七十個長老之中。這時約書亞的年紀大約在五、六十歲」。BH 說明他的出身：以法蓮支派，名字意為「耶和華是拯救」，是希臘文「耶穌」的希伯來對應。
  relation: 這是本章唯一一次記下約書亞的判斷，而他判錯了。摩西的回答「你為我的緣故嫉妒人嗎」成了對他的教導。GT 丁良才把這件事接到福音書：「（參可九38-40），約書亞以為這兩個人要分門結黨。」KC 說主耶穌後來教門徒的正是同一課（可9:38-41），而保羅也從主學到同樣的心（腓1:15-18）。BH 從長線看：這一刻是約書亞的學習經驗，他此時「還沒有明白神對祂百姓更寬的計畫」。
- title: 鵪鶉遷徙
  path: link_folder/背景/鵪鶉遷徙.md
  summary: 第31節：「有風從耶和華那裡刮起，把鵪鶉由海面刮來。」GT《舊約聖經背景註釋》說明這是候鳥的常態：「這種體小而肥的候鳥每年三至四月間，從蘇丹北部遷徙到歐洲時，往往途經西乃半島。牠們一般是順風飛行，側風有時會將牠們驅逐到地上（或水中）去。在筋疲力盡之際，牠們會低飛到很容易被人捕捉的高度。」
  relation: 時間點對得上遷徙季。GT《民數記串珠聖經註釋》指出「聖經記載兩次的捕取鵪鶉都是在猶太人的二月分（參出16:1；民10:11），即西曆四、五月間，正是鳥兒在春向北方移棲的時候」。GT《啟導本聖經註釋》補上現代的觀察：「現在偶然仍有阿拉伯人趁秋季在西奈沙漠中張網捕捉成群低飛的鵪鶉，數目恒逾數十萬隻。」風向也有出處——GT 丁良才指是「從亞克巴海灣吹來的東南風（詩七十八26）」，並提醒這是第二次：「這是神第二次使以色列人吃鵪鶉，頭一次是早一年的工夫（出十六13）。」
- title: 鵪鶉遮營
  path: link_folder/事件/鵪鶉遮營.md
  summary: 第31-32節：鵪鶉飛散在營的四圍，「這邊約有一天的路程，那邊約有一天的路程，離地面約有二肘」；百姓終日終夜並次日一整天捕取，至少的也取了十賀梅珥。CT 換算：一天的路程「折合每天約二十餘公里」，二肘「大約一公尺高」，十賀梅珥「約折合二千二百公升」。
  relation: 「離地面約有二肘」到底是飛在一公尺高，還是堆積一公尺厚？GT《啟導本聖經註釋》兩說並存：「『離地面約有二肘』指鵪鶉低飛離地面約一公尺。但原文所用（）（離）一字也可指鵪鶉堆集地面達一公尺高」，並指出後一種讀法比較能解釋一人一天取到十賀梅珥。GT 艾基斯《舊約聖經難題彙編》主張後者：「『地面』之前的前置詞’al應翻譯作『超出』……而不是『上』。」STEP 原文資料顯示第31節這個介系詞的本節譯義正是 above（在其上方）。數量的換算各家也不一：CT 作二千二百公升，GT《舊約聖經背景註釋》說「十賀梅珥有估計是四十蒲式耳的，也有估計是六十蒲式耳的」，而 GT《民數記串珠聖經註釋》把二肘寫成「九十毫米」——與 CT、《啟導本》的一公尺相差十倍。
- title: 哈洗錄
  path: link_folder/地點/哈洗錄.md
  summary: 第35節：「百姓從基博羅哈他瓦走到哈洗錄，就住在哈洗錄。」CT 給的原文字義是「駐紮」，並指出這是「離開西乃的曠野後的第二站（參三十三17）」。
  relation: 位置未定。GT《舊約聖經背景註釋》說「部分學者暫時考證為卡德拉泉（'Ain el-Khadra）」，GT《啟導本聖經註釋》則說「基博羅哈他瓦與哈洗錄二地確址不詳」。BH 提醒這個地名在下一章還會再出現：米利暗與亞倫毀謗摩西、米利暗長大痲瘋，就發生在哈洗錄（民12:1-10）——本章的結尾正是下一章的開場。
- title: 摩西的代求
  path: link_folder/神學/摩西的代求.md
  summary: 第2節：「百姓向摩西哀求，摩西祈求耶和華，火就熄了。」STEP 原文資料顯示「祈求」是 va/i.yit.pa.Lel（H6419，詞典形 pa.lal，詞典義 to pray），Hithpael 形；「火就熄了」是 va./tish.Ka'（H8257，詞典形 sha.qa，詞典義 to sink），字面是火「沉了下去」。
  relation: 這是民數記第一次記下摩西的代求，模式與出埃及記幾次完全相同：百姓求他、他求神、災就止住。CT 只用一句話收：「由此可知代禱的重要性。」GT《聖經精讀本》從字義往前推一層：「在這裡『祈求』源於希伯來語『判斷』一詞，在這裡是『仲裁』、『祈求』的意思」，並接到雅5:16、19、20。KC 把這件事放大到整個教會史：「幸而百姓中有一位代求者。因著摩西的代求，火所代表的審判就止住了。」他接著問：「教會裡人也抱怨、也埋怨眼前的光景，但那藉代求除去惡的幫助在哪裡？」
- title: 以色列人的怨言
  path: link_folder/歷史/以色列人的怨言.md
  summary: '本章是全卷怨言最集中的一章，一章兩起：第1-3節在他備拉，第4-35節在基博羅哈他瓦。STEP 原文資料顯示第1節「發怨言」是 ke./mit.''O.ne.Nim（H596，詞典形 a.nan，詞典義 to complain），Hithpael 分詞前面帶著 ke（如同）；「惡語」則是單獨一個字 ra''（H7451B，詞典義 bad: evil）——字面是「像那些抱怨惡事的人」。'
  relation: 這個字面結構正是 KC 所引達祕譯本腳註的讀法：百姓「像是那些抱怨遭遇不幸的人」，也就是說，「他們的舉止像是遇上了什麼災殃的人」。CT 歸出怨言的三個來歷：「(1)不知足；(2)不信主；(3)存噁心。」GT 丁良才另指出一個時間分界：「在垂律法以先，民發怨言的時候，神並沒有降罰……到垂律法以後，民發怨言，神卻降罰。」本章正落在後者。
- title: 先知
  path: link_folder/主題/先知.md
  summary: 第25-29節：七十長老受感說話「以後卻沒有再說」；伊利達與米達在營裡說預言；摩西回答約書亞說「惟願耶和華的百姓都受感說話！願耶和華把他的靈降在他們身上！」STEP 原文資料顯示「受感說話」是 va/i.yit.na.be.'U（H5012，詞典形 na.va，詞典義 to prophesy）。
  relation: 本章把「先知」從個別的職分推向全體的可能。GT《啟導本聖經註釋》說明這個動作的性質：「『受感說話』可譯為『說預言』。神的靈與人同在的一個跡象是說預言（撒上十6～13；結二4等）。」KC 指出摩西的心願後來成了應許——約珥書2:28-29 說兒女要說預言、老年人要作異夢、少年人要見異象——並比較兩約的差別：「舊約裡我們看見聖靈一般不使用百姓中的每一個人，祂主要藉著君王、祭司和先知作工。將來就不同了。」
- title: 耶和華擊打百姓的瘟疫
  path: link_folder/事件/耶和華擊打百姓的瘟疫.md
  summary: 第33節：「肉在他們牙齒之間尚未嚼爛，耶和華的怒氣就向他們發作，用最重的災殃擊殺了他們。」STEP 原文資料顯示「擊殺」是 va/i.Yakh（H5221，詞典形 na.khah，詞典義 to smite），Hiphil 使役形，主語是耶和華；「災殃」是 ma.Kah（H4347，詞典義 wound）。
  relation: 本節正是這個條目定義所引的實例——GT《丁道爾聖經註釋》在出32:35 把那裡的擊打解為「五經常見的那種立時而短暫的懲罰（如：民十一33）」。本章讓那個類型有了完整的敘事：災殃當場發生、當場埋葬，地名就此定下。至於災殃的形式，CT 判為「大概是瘟疫」並註「指食物中毒」；GT《民數記串珠聖經註釋》說「很可能是保存肉類不當或匆忙進食，不顧衛生所引起的瘟疫」；GT《舊約聖經背景註釋》從鵪鶉沒有醃過推出同一個結論。經文本身沒有描述症狀。
