book: "民數記"
chapter: 11
updates:
  - title: "閒雜人"
    path: "link_folder/人物/閒雜人.md"
    summary: "以色列出國陣容當中的閒雜人（原隨出埃及之他族混流與缺乏恩實認信基礎的遊隨民）在經歷沙漠苦行路途時，率先放肆大起肉體世俗的貪慾之願，繼而推倒傳染整體以色列人，致使眾人向神的安排和摩西痛批反對、爭求血肉美食。"
    relation: "向天國門徒深刻警惕教會與團契內部肉體思想及世界舊情的不守信情結；這類未曾斷除埃及沉溺的情慾思緒常是破壞團體靈命的導火索，易惑弄聖徒輕慢神的供應。"
  - title: "閒雜人是誰（出12：38）"
    path: "link_folder/解經爭議/閒雜人是誰（出12：38）.md"
    summary: "民數記十一4精細重陳埃及地出巡者背後，大量跟駕、未具神聖恩命割禮認信根柢之混集種族如何在本屆歷史事件場中擔演騷擾、起造奢念反忤事端；解讀者咸共以此實錄佐對出埃及記第十二章記載，證實舊習交結必然萌生災禍。"
    relation: "進一步奠立舊約聖經中關乎『外袍隨順者不等於得受靈糧者』的釋出經典脈絡：沒有聖約真信仰支持者難安度險漠磨難，且必在患厄中煽燃懷疑背道的業因。"
  - title: "嗎哪"
    path: "link_folder/主題/嗎哪.md"
    summary: "作為萬主之上長年不休奉降的獨屬天上恩糧，嗎哪遭到沉迷舊日魚菜辛鮮的選民集體狂言唾棄：「除這嗎哪以外，我們眼白沉默沒物！」幸為聖筆立銘，天意在此細說其清皎勝雪、如油滋甜、逐日夜隨聖露密至的大美真實，長加表證父權榮賜心懷。"
    relation: "強力對峙人世驕心貪心與神天上極其恩純滋餵救濟的心命之差；提醒走曠沙漠之眾無論時運何如單一沉靜，神天天新鮮賜與的屬靈嗎哪（也就是耶穌本身）方為真實滋飽生命的真歸源。"
  - title: "嗎哪的物理特性"
    path: "link_folder/背景/嗎哪的物理特性.md"
    summary: "民數記十一7-9罕有細膩錄存了嗎哪作為曠野天產恩品的極緻物質形容：粒潔勝如白芫荽子，晶剔如南海珍珠；並且羅載了古老先民以磨石研轉、杵白臼舂打和起釜沸煮以成新油美味燒餅的完整食藏技藝史證。"
    relation: "藉由實是存在的絕緻觸感與無上口福描述，擊斥當時哭鬧之眾妄宣『心血竭盡』之荒無誣陳；告切靈人：神的恩膏帶有精細多變而絕勝世界的生命油醇與靈糧甘味，應以敏切頌主敬心仰享之。"
  - title: "百姓厭棄嗎哪（約6：31-35）"
    path: "link_folder/互文/百姓厭棄嗎哪（約6：31-35）.md"
    summary: "民數記第十一章中舊國之民寧要辛烈魚蒜而公開厭離清涼無味天饋嗎哪的史記，無匹生動並深刻預言了後世約翰福音中猶太世生一如既往偏迷地上暫足魚餅、反向回拒真神聖子為主生長老命之靈食耶穌的反向鏡鑑。"
    relation: "貫徹舊約歷史預言到新約彌賽亞開恩說白的互文體制：唯有棄拋依倚敗朽肚腹口念而單獨瞻倚由上大願宣化永生之主耶穌，人魂才真離散舊世厭怠死厄。"
  - title: "以色列的長老"
    path: "link_folder/文化/以色列的長老.md"
    summary: "當摩西個人神勇牧職瀕臨全量疲潰求告父神救宥之刻，上帝命令揀發全國民間夙負賢重聲瞻之長者首長共七十英哲共赴會幕庭堂，轉賦靈威成為擔分重權的常年公國代表及決義基幹。"
    relation: "開闢見證聖國王法架構一項超越氏族私人倫從向全面國家行政責任演進的一幕；指出屬地領袖不但需享氏族尊望，更須赴登神壇大門深承神膏澆授，方可真實持分聖家牧領重任。"
  - title: "七十長老制度起源"
    path: "link_folder/歷史/七十長老制度起源.md"
    summary: "由於以色列人在他備拉與往後貪求場上哭音震動整個沙漠，摩西無法一身力挺負荷，耶和華施恩命建此七十高位先儒領長同壇受膏分御萬家重擔的恢宏政章；斯舉向被推列為古代宗教自治公會（Sanhedrin）法制精神的原形雛起。"
    relation: "確立上帝行政意念偏愛多元共治與合權擔服的至美藍圖：神意無妄苛強求少數英哲身竭身斷去背扛舉宗罪難，反樂頒巨命分向同承聖意的團隊聖執長者。"
  - title: "聖靈"
    path: "link_folder/神學/聖靈.md"
    summary: "在上王殿周七十翁齊駕會陣和甚至包括留處自家雜宅內的伊利達與米達之所，上神親駕威雲，將加置於摩西冠表身上的厚重靈光神力切割移散深頒注及群領身魄；聖靈一下沉停便生出即時讚嘆長語的大能震發。"
    relation: "彰表聖靈作工充滿超越時空囚禁、無拘疆場界線與分賦轉借而不竭損減耗的超然大主權；預曉世人真正事奉力量皆自唯一聖神厚靈澆被所源開而出。"
  - title: "聖靈分賜預表五旬節（徒2：1-4）"
    path: "link_folder/互文/聖靈分賜預表五旬節（徒2：1-4）.md"
    summary: "民十一25-29摩西對年輕近佐約書亞誓發千載絕世願仰：「惟期天下萬靈悉作王神得助神民，求主要拿大能聖靈灌充普被人人身胸！」此話直破歲月成就不世大恩，完美成為新約 使徒行傳 第二章五旬節神明無限沛雨靈恩散落信眾千戶的精闢巨先知呼籲與先哲定宣。"
    relation: "見證新舊契約交融相映的神蹟最高端：舊朝領先偉伯悲中見善、祝禱聖靈無礙開放普及，終在新約聖靈降下神愛無數全體教會眾弟兄均恩皆霑的極光大慶裏得獲無偏成就。"
  - title: "約書亞"
    path: "link_folder/人物/約書亞.md"
    summary: "於神恩大散營郭、二名領錄未往廟側元老在內狂說神語之時，熱心維護尊師摩西至高正統領導神權的年輕佐將約書亞慌遽進諫求止，卻從導師長慈廣容對談重膺真王大胸無際靈風至治教育的至聖洗練。"
    relation: "教誡少年英豪神民：雖懷耿直尊護正法赤心，亦應謹慎不可墮於本位建制妒忌與獨佔心理；應向聖領與神主學習心納百眾同受宣口、仰觀神靈恩能自散翱翔的浩然美度。"
  - title: "鵪鶉遷徙"
    path: "link_folder/背景/鵪鶉遷徙.md"
    summary: "經由海洋與浩瀚春候季風吹捲引駕，神差動無盡大鳥鵪鶉千億而抵，低空撲佈滿大界兩臂肘厚高。學術史籍與地誌佐明亞太地帶每年皆常見成批過荒水鴨鵪鶉翻涉，神藉無上帝手威行狂化這天候異象回應貪民恣愛。"
    relation: "展示天君不僅具宰主萬界地氣海候蟲禽習向之宇宙絕對掌御，亦宣告神蹟可透過超強運用既得天象事變直貫臨盆；而這浩烈賞致也隱隨神度衡量凡間不知止盡縱望肆求的審定先觸。"
  - title: "鵪鶉遮營"
    path: "link_folder/事件/鵪鶉遮營.md"
    summary: "作為應報選黎對嗎哪天供恨厭哭訴吃鮮的大悲局結局，耶和華降鵪鶉盈滿千里四疆，「牙間之肉未曾咬熟、天王焰火公嚴審禍迅霆急下，令該區狂餐之貪縱平民眾萬死一傾」，而永落慘沉悲號基博羅哈他瓦。"
    relation: "提出深刻難卻的嚴肅屬靈生死箴言：上帝依憑世血私狂妄想投賜無限縱求滿足之宴，多非賞歡福澤，往往正是向沉墜自甘棄離心魔之世魂給予公判刑罰的最殘酷定局。"
