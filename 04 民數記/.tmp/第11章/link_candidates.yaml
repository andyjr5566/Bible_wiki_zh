candidates:
  - name: "他備拉"
    type: "地點"
    evidence: "第1-3節：「眾民發怨言，他們的惡語達到耶和華的耳中...耶和華的火便在他們中間焚燒...人就叫那地方為他備拉，因為耶和華的火在他們中間焚燒。」他備拉字義為「焚燒」，為以色列人在曠野初次集體抱怨受神猛烈審判之址，彰顯神的公義聖潔容不得褻瀆威榮的怨言。"
    surfaces:
      - "他備拉"
  - name: "閒雜人"
    type: "人物"
    evidence: "第4節：「他們中間的閒雜人大起貪慾的心；以色列人又哭嚎說：誰給我們肉吃呢？」此指當初隨同以色列人一道逃離埃及的外族搭車者或混雜族裔；他們缺乏真實聖約根基與對神的確信，遇難則心生懷舊，鼓動及蠱惑整體選民墜入貪慾沉淪中。"
    surfaces:
      - "閒雜人"
  - name: "閒雜人是誰（出12：38）"
    type: "解經爭議"
    evidence: "第4節明確指出曠野哭嚎、厭棄天降糧食的騷亂首要發動源為「閒雜人」。針對其具體族屬與靈性象徵，研經學者深入比對出埃及記第12章，闡釋其中混雜了未真正割禮信從埃及與混血移民，象徵教會與屬靈群體內部隱伏的混雜世界情慾因素。"
  - name: "嗎哪"
    type: "主題"
    evidence: "第6-9節：「現在我們的心血枯乾了，除了這嗎哪以外，在我們眼前並沒有別的。...這嗎哪彷彿芫荽子，又好像珍珠。」天降嗎哪為神持續供應聖民於乾曠沙漠保全性命的核心恩膏，代表長居神主權下之專一神聖維持和對天上靈糧的仰望。"
    surfaces:
      - "嗎哪"
  - name: "嗎哪的物理特性"
    type: "背景"
    evidence: "第7-9節詳盡紀實了嗎哪的天然構造與烹煮調配特色：「彷彿芫荽子，又好像珍珠。百姓周圍行走，把嗎哪收起來，或用磨石磨，或用臼搗，在鍋裡煮，又做成餅，滋味好像新油...」提供了關於恩雨食糧精細的外形、白如冰霜、晶瑩若真珠與芳味美甘的古籍印證。"
  - name: "百姓厭棄嗎哪（約6：31-35）"
    type: "互文"
    evidence: "第6節記錄選民口出狂言：「現在我們的心血枯乾了，除了這嗎哪以外，在我們眼前並沒有別的。」此種貪鄙世俗腥香與輕看天養主食的靈性背叛，深刻遙指新約約翰福音第六章群眾僅尋獵壞死物慾與排拒耶穌為天上永生活命之糧的屬靈對稱。"
  - name: "摩西的靈命低谷與重擔求死"
    type: "神學"
    evidence: "第10-15節記載摩西因百姓痛哭無度，感同重任壓頂如肩負滿街嬰崽難支，極度絕望之際懇請急呼：「你若這樣待我，我若在你眼前蒙恩，求你立時將我殺了，不叫我見自己的苦楚。」顯明無私領袖在肉軀與壓力之至端奔走時深廣的情緒磨耗與人性倚賴祈求。"
  - name: "以色列的長老"
    type: "文化"
    evidence: "第16節：「耶和華對摩西說：你從以色列的長老中召集七十個人...」各支派依氏族長幼宗分所尊仰之元老與首長，在此轉化為具有國家管治共力之法定職位者。"
    surfaces:
      - "以色列的長老"
      - "長老"
  - name: "七十長老制度起源"
    type: "歷史"
    evidence: "第16-17、24-25節載錄耶和華俯准解免摩西一身肩護的全族大擔，正式於會幕周圍創設召集七十位長老承接恩澤靈能的典示治理架構；這不僅為古以色列王邦中樞組織的關鍵起步，更常被推認是日後猶太最高聖會「公會（Sanhedrin）」精神與法制雛形的本源。"
  - name: "聖靈"
    type: "神學"
    evidence: "第17、25、29節申明耶和華親自「把降與他（摩西）身上的靈分給那七十個長老，靈停在他們身上的時候，他們就受感說話」，呈現出聖靈超越性、傳染式與施為性的賜命職責與大能作為。"
    surfaces:
      - "靈"
  - name: "聖靈分賜預表五旬節（徒2：1-4）"
    type: "互文"
    evidence: "第25節神將單賦摩西的大靈擴向七十牧翁，暨第29節摩西深情宣說：「惟願耶和華的百姓都受感說話，願耶和華把他的靈降在他們身上！」此先知性偉大心願至真穿透歲月，精闢對照且預言了新約五旬節聖靈大澆灌全民皆作靈神住所的救世美殿。"
  - name: "伊利達與米達"
    type: "人物"
    evidence: "第26-27節：「但有兩個人留在營裡，一個名叫伊利達，一個名叫米達。他們本在那些被錄的人中...靈停在他們身上，他們就在營裡受感說話。」這對並未即刻赴往會幕壇場卻仍無減享有真神灌施說話權益的兩老，見證神恩無限、跨越凡人組織地域隔礙與場域鎖錮的絕對自主。"
    surfaces:
      - "伊利達"
      - "米達"
  - name: "約書亞"
    type: "人物"
    evidence: "第28節：「摩西的助手，嫩的兒子約書亞，就是摩西所揀選的一個人，說：請我主摩西禁止他們。」年輕的約書亞基於守護摩西核心權柄與制度規條的赤心，向師表提出制裁干犯者的建言，反印出聖神大老超卓廣大的氣度與屬天視界。"
    surfaces:
      - "約書亞"
  - name: "鵪鶉遷徙"
    type: "背景"
    evidence: "第31-32節記載海風颳動將盛量鵪鶉送降以色列圍營左右；歷史地理考察釋義，春申時期地中海與亞喀巴灣地區本有大宗飛鳥涉越遷徙之習；耶和華調動並急加壯大此種天道巨象，以應酬乃至制裁人慾求狂妄之慾血渴望。"
  - name: "鵪鶉遮營"
    type: "事件"
    evidence: "第31-33節記載鵪鶉厚厚如雨落滿會眾家陣邊際，「一天的路程…高約兩肘」，百姓貪昧不眠收獵甚至鋪滿地皮；但當「肉在他們牙齒之間尚未嚼爛，耶和華的怒氣就向他們發作，用最重的災殃擊殺了他們。」展示出貪念肆心雖臨快足卻立即牽翻天威災禍的反諷結局。"
    surfaces:
      - "鵪鶉"
  - name: "基博羅哈他瓦"
    type: "地點"
    evidence: "第34節：「人就叫那地方為基博羅哈他瓦，因為他們在那裡葬埋那起貪慾的人。」名字語源原義是「貪慾之塚」或「埋慾深冢」，為此場神明賞賜狂歡驟轉作送命地獄場景的慘定紀念館。"
    surfaces:
      - "基博羅哈他瓦"
  - name: "哈洗錄"
    type: "地點"
    evidence: "第35節：「百姓從基博羅哈他瓦起行，到哈洗錄，就住在哈洗錄。」為西乃大漠向東或北出駕的隨序長安綠野處，為經歷焚營與埋骨悲劫過後，剩者重拾修整暫寧的歷史宿所。"
    surfaces:
      - "哈洗錄"
  - name: "摩西的代求"
    type: "神學"
    evidence: "第2節：「百姓向摩西哀求，摩西祈求耶和華，火就熄了。」CT 註「由此可知代禱的重要性」；GT《聖經精讀本》指出「在這裡『祈求』源於希伯來語『判斷』一詞，在這裡是『仲裁』、『祈求』的意思」，並說「為鄰舍的生命和得救祈求是大有功效的(雅5:16,19,20)」；KC 說「幸而百姓中有一位代求者。因著摩西的代求，火所代表的審判就止住了」，並接到主耶穌的代求（羅8:34；來7:25）。此條目已累積出8、10、32、33、34 等章，尚無民11。"
  - name: "以色列人的怨言"
    type: "歷史"
    evidence: "本章是全卷最集中的怨言記載，一章兩起：第1-3節在他備拉，第4-35節在基博羅哈他瓦。CT 歸出怨言的三個來歷：「(1)不知足(參5~6節)；(2)不信主(參詩七十八18~20疑惑主的慈愛和權柄)；(3)存噁心(參太十二34末二句)」；GT 丁良才另指出律法頒布前後神的處理不同：「在垂律法以先，民發怨言的時候，神並沒有降罰……到垂律法以後，民發怨言，神卻降罰」。此條目已累積出14、15、16、17，尚無民11。"
  - name: "先知"
    type: "主題"
    evidence: "第25-29節是全卷關於「受感說話」最集中的一段：七十長老受感說話「以後卻沒有再說」，摩西則說「惟願耶和華的百姓都受感說話！願耶和華把他的靈降在他們身上」。KC 指出這個心願在約珥書2:28-29 成了耶和華的應許；GT《啟導本聖經註釋》說「『受感說話』可譯為『說預言』。神的靈與人同在的一個跡象是說預言（撒上十6～13；結二4等）」。此條目已累積創20、出4、民12，尚無民11。"
  - name: "他備拉與基博羅哈他瓦是否同一地"
    type: "解經爭議"
    evidence: "第3節命名他備拉，第34節命名基博羅哈他瓦，兩地之間沒有任何行程記載。CT 直接判定：「『他備拉』是基博羅哈他瓦(參34節)的別稱，因為他備拉並未記載在站口之中(參三十三16)」；GT 丁良才列出三項理由並補上「若是這樣，本段的事，就是在基博羅哈他瓦遇見的（34，參申九22）」；GT《舊約聖經背景註釋》也說「我們有理由相信此地可能也即是基博羅哈他瓦（34節），因為兩地之間並沒有旅程的記載」。三份來源同向，但都以「可能」措辭。"
  - name: "神賜鵪鶉又降災的因果"
    type: "解經爭議"
    evidence: "第31-34節：神應百姓所求賜下鵪鶉，肉還在牙齒間就降下最重的災殃。GT 賈斯樂郝威《聖經難解經文詮釋手冊》命題13 專門處理這個問題，結論是「神並非因為百姓吃了鵪鶉而懲罰他們；而是因為百姓貪婪和忘恩的心態」；GT 艾基斯《舊約聖經難題彙編》則從實務面解釋災殃的性質；GT《舊約聖經背景註釋》指出「鵪鶉通常必須先用鹽醃過才擺出來曬乾。經文沒提這一點，可能表示他們忽略了這步驟。是以本段的災殃可能是食物中毒」。CT 也判為食物中毒，KC 則完全從神的忍耐到了盡頭來讀。"
  - name: "以色列人一連五次違背神"
    type: "主題"
    evidence: "GT 丁良才在第5節把民數記11至14章讀成一條連續的墮落線：「以色列人一連五次違背神：1發出怨言（十一1-3），2貪求肉食（4至末），3嫉妒摩西（十二章），4譭謗美地（十三章十四1-39），5擅自前往（十四40至末）。」同一段他另列出百姓在本章犯的「五種錯誤」。這條線索橫跨四章，是理解民11-14 敘事結構的骨架。"
  - name: "古代近東的超脫預言"
    type: "背景"
    evidence: "GT《舊約聖經背景註釋》在第25節說明「受感說話」的時代背景：「以色列和古代近東，都有超脫（ecstatic）預言──即似乎是人在『著魔』或魂遊象外的狀態下所說出之預言──的記載。超脫的先知在美索不達米亞的稱號是穆胡（muhhu）。在以色列，超脫往往令先知被視為狂人（例如見：撒上十九19～24；耶二十九26）。只是它在本節的結果並不是說預言，而是作為神能力臨到長老身上的表徵。就此而言，它可說是和使徒行傳二章如火焰之舌頭相同。」"
  - name: "耶和華擊打百姓的瘟疫"
    type: "事件"
    evidence: "第33節：「肉在他們牙齒之間尚未嚼爛，耶和華的怒氣就向他們發作，用最重的災殃擊殺了他們。」CT 判「『最重的災殃』大概是瘟疫」，並註「『怒氣就向他們發作』指食物中毒」；GT《民數記串珠聖經註釋》說「此處並無說明災殃是什麽（33），很可能是保存肉類不當或匆忙進食，不顧衛生所引起的瘟疫」。此條目已累積出32，且其定義本身即引用民十一33 為五經「立時而短暫的懲罰」的實例，卻尚無民11 累積。"
