organization: "### 瘟疫之後（v1-4）\n\n本章開頭四個字就把時間定住了：「瘟疫之後」。KC 認為這是全書的界碑：『瘟疫之後』這個說法標誌著民數記這卷書歷史中的一個轉折點。他接著解釋，前一章[[耶和華擊打百姓的瘟疫|那場瘟疫]]是擊打這百姓作為曠野時期的百姓的最後一場大瘟疫，曠野的旅程結束了。GT《聖經精讀本》說的是同一件事：這意味著充滿罪惡的曠野生活結束了，以色列人要以新的秩序進入迦南地。\n\
  \n說話的對象也換了人。CT 指出：「因亞倫已死（參二十28），故從此神改向[[摩西]]和新任大祭司[[以利亞撒]]說話。」[[第二次數點人口|這次數點]]辦在[[摩押平原]]、[[約但河]]東邊、與[[耶利哥]]相對的地方——正是渡河前的最後一站。\n\
  \n[[計算總數（抬起頭）|「計算總數」]]在原文是一個動作片語。STEP語言資料顯示第2節是 se.'U 'et- rosh（H5375V＋H7218L），本節譯義是\
  \ lift up ... the head of，字面就是把頭抬起來；CT〔原文字義〕給「總數」的答案也只有兩個字：人頭。KC 另注意到一個次序問題：這次數點不只點「能出去打仗的」，也是「按他們的宗族」點的，而後者才是更重要的，因為經文先提它。\n\
  \nKC 在動筆之前先劃了一條界線：沒有神明確的吩咐而數點百姓，是一件罪；他舉大衛落在這罪裡（代上21:1-7）作對照——分別就在於這一次是神先開口。\n\n\
  ### 名單裡的兩段往事（v5-11、v19-22）\n\n族譜本可以只列名字，本章卻兩次停下來講一段不光彩的事。KC 注意到這個模式：猶大的名單和流便的名單一樣，都在開頭回顧了一段黑暗往事。\n\
  \n[[流便]] 那一段回到[[可拉大坍亞比蘭等領首聯合的大反亂|可拉、大坍、亞比蘭的背叛]]，並重述了[[地破裂吞吃可拉與大坍亞比蘭之家與其財物|地開口吞人]]與火燒二百五十人的結局，最後用四個字收尾：[[作了警戒（nes）|「他們就作了警戒」]]。STEP語言資料顯示這裡的「警戒」是\
  \ le./Nes（H5251H，簡要義域 nes: ensign），本節譯義是 a warning sign——字面是他們成了一個記號。\n\n緊接著是本章最短的一節：[[可拉的眾子沒有死亡]]。原因四家講法不同：CT\
  \ 與 GT《聖經精讀本》說是因為他們沒有參與父親的罪，KC 卻明白拒絕這個解釋——他說他們屬於一個註定滅亡的家族，除了神的恩典之外找不到別的動機。而四套來源都追蹤到同一個結局：[[哥轄子孫|可拉的後裔]]後來在聖殿管理作樂，詩篇多篇題名歸給他們。\n\
  \n[[猶大支派]] 那一段回到[[珥和俄南死在迦南地（創38：6-10）|珥和俄南的死]]。這件往事在本章有實際後果：CT 指出猶大五族裡有兩族其實是孫輩，補的正是他們留下的空缺，而其中的希斯倫一線通向大衛與基督的家譜。\n\
  \n### 數字說了什麼（v12-51）\n\n```mermaid\nflowchart TD\n  A[\"民1 西乃曠野：603550\"] --> B[\"\
  三十八年曠野\"]\n  B --> C[\"民26 摩押平原：601730\"]\n  C --> D1[\"減少最多：西緬 −37100\"]\n  C -->\
  \ D2[\"增加最多：瑪拿西 +20500\"]\n  C --> D3[\"總差額：−1820\"]\n```\n\n[[西緬支派人數銳減|西緬]] 是本章最刺眼的數字：二萬二千二百名，比民1\
  \ 少了三萬七千一百人。原因四套來源一致，都指向前一章：CT 說「大概是因為他們中有多人受了米甸人的引誘，西緬支派的族長心利（參二十五14），也在其中」；GT《聖經精讀本》給了比例，說減少了\
  \ 63%，而且這個支派從第三大變成最小。丁良才另記下一個後續：摩西臨終祝福十二支派時（申33），沒有提到西緬。\n\n[[瑪拿西支派人數大增|瑪拿西]] 走的是相反方向：五萬二千七百名，增加兩萬零五百人，是增幅最大的支派——本章也因此把它排在[[以法蓮]]\
  \ 之前。原因兩家講法不同：GT《精讀本》說這證明這個支派在曠野生活中比其他支派更順服；KC 則把它歸給[[西羅非哈的女兒]]——她們對產業有特別的關切，而神看重這一點。同一個[[約瑟]]\
  \ 家，以法蓮反而少了八千名。\n\n至於其餘幾個下降的支派，[[支派人數減少的原因之爭|要不要給理由]]本身就是分歧。CT 與丁良才注意到[[流便]]、西緬、[[迦得（萬幸）|迦得]]\
  \ 三個支派都在會幕南邊安營、與可拉相鄰，因此推出「同情者」的解釋；GT《啟導本》則直說「但其他支派何以減少則原因不明」，而丁良才自己在論[[拿弗他利]] 與以法蓮時，也兩次承認不知道理由。人數居全軍第二的[[但支派]]則是另一種張力：本章只給六萬四千四百的數字，[[但支派至終定居於何地|後來的歷史]]卻顯示他們始終沒能守住約書亞記十九章所分得的平原地業，被迫北遷拉億——本章的高數字與日後的失守，形成一組本章材料本身回答不了的懸案。\n\
  \n| 支派 | 民1 | 民26 | 增減 |\n|---|---:|---:|---:|\n| 流便 | 46500 | 43730 | −2770 |\n\
  | 西緬 | 59300 | 22200 | −37100 |\n| 迦得 | 45650 | 40500 | −5150 |\n| [[猶大支派]] | 74600\
  \ | 76500 | +1900 |\n| [[以薩迦（價值）]] | 54400 | 64300 | +9900 |\n| [[西布倫（同住）]] | 57400\
  \ | 60500 | +3100 |\n| 瑪拿西 | 32200 | 52700 | +20500 |\n| 以法蓮 | 40500 | 32500 | −8000\
  \ |\n| [[便雅憫]] | 35400 | 45600 | +10200 |\n| [[但支派]] | 62700 | 64400 | +1700 |\n\
  | [[亞設（有福）]] | 41500 | 53400 | +11900 |\n| 拿弗他利 | 53400 | 45400 | −8000 |\n| 總數\
  \ | 603550 | 601730 | −1820 |\n\n名單中間插進兩處女性的記載（第33節西羅非哈的五個女兒，與第46節亞設的女兒西拉）。第33節的[[西羅非哈的女兒]]有明確理由——四套來源都說這是民27\
  \ 與民36 繼承權問題的伏筆，而 GT《精讀本》正面處理了它造成的技術矛盾：這違背了第2節「只數點能出去打仗的人」的原則，但因為這次數點也是為了分地，所以可以接受。第46節的[[亞設的女兒西拉]]則沒有給理由；CT\
  \ 推測她可能有傑出的表現，BH 引的是猶太傳統。\n\n總數才是最大的意外。上一代二十歲以上的人全數死盡，新的一代卻補回幾乎同樣的人數。KC 說儘管有這一切的災殃，這百姓的人數幾乎沒有減少，這是神極大的神蹟，也是祂恩典的證明。\n\
  \n### 分地的兩把尺（v52-56）\n\n數點的第二個目的在這裡揭曉。GT《民數記串珠聖經註釋》整理得最清楚：「分配地業是根據兩個原則：１ 按以上統計的人數，人數多的支派便多分地業；２\
  \ 地點的選擇卻用[[拈鬮分地（go.ral）|拈鬮]]作出決定，以免支派間因地理環境、土質不同而產生爭執。」丁良才一句話概括：「分地的時候，一按人數定多少，二按拈鬮定方向。」\n\
  \nSTEP語言資料顯示「拈鬮」是 be./go.Ral（H1486），本節譯義是 by lot；CT〔原文字義〕給的是一個很具體的畫面：「拈鬮」小鵝卵石。為什麼要用這個方法，GT\
  \ 串珠說拈鬮在當時是尋求神旨意的一個方法（箴16:33），GT《精讀本》另列兩個實際理由：認識到自己所得的地是神預備的，以及避免因土地好壞而生爭鬥。GT《舊約聖經背景註釋》給了一條外部平行：「在美索不達米亞，*\
  \ 馬里的君王也是用這方法將封地分配給藩屬和退伍者。」\n\n### 利未人與最後一句判語（v57-65）\n\n[[利未支派|利未人]] 另行數點，範圍也不同：一個月以外的男丁，共二萬三千。名單走到[[暗蘭]]\
  \ 與[[約基別]] 這一家時，經文順帶交代了[[米利暗]]、亞倫與摩西的出身，也順帶記下[[拿答]]、[[亞比戶]] 獻[[凡火]] 而死。KC 說利未這個蒙特權支派的數點，同樣讓人想起他們作祭司歷史開頭那件黑暗的事——拿答與亞比戶的不忠並沒有被遮蓋。\n\
  \n第62節給了利未人不被計入以色列人中的理由：「因為在以色列人中，沒有分給他們產業。」CT 把這句話翻成正面：「[[耶和華是事奉者的業與分|利未人雖然沒有分得固定的地業，但神自己就是他們的產業]]（參十八20），這是最上好的福分。」\n\
  \n全章以一句應驗收尾。[[他們必要死在曠野（民14：29-35）|「他們必要死在曠野」]]——STEP語言資料顯示第65節用的是 Mot ya.Mu.tu（H4191\
  \ 出現兩次，morphology 為 HVqaa＋HVqi3mp），本節譯義是 certainly to die ... they will die，是希伯來文表達強調的固定組合。[[數點民數|第一次被數的人]]中，除了[[迦勒]]\
  \ 與[[約書亞]] 以外連一個也沒有存留。CT 補了一個限定：這是指十二支派當時二十歲以上的人而言，摩西與以利亞撒兩人除外。丁良才則注意到一個時間差：以色列人在曠野時已大略知道這件事，「到這次數點民數的時候，才真詳細知道了」。\n\
  \nKC 給的結語只有兩句：神成就了祂審判的話，正如祂成就祂祝福的話；神總是照著祂所說的去行。"
