book: 民數記
chapter: 26
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 民數記26:1-4 神吩咐他與以利亞撒數點；v52-56 神吩咐他分地的原則；v63 他與以利亞撒完成數點。
  relation: 本章是摩西主持的最後一次數點。CT 指出說話對象已經改變：「因亞倫已死（參二十28），故從此神改向摩西和新任大祭司以利亞撒說話。」KC 則先劃出界線：沒有神明確的吩咐而數點百姓是一件罪，這一次是神先開口。v65 CT 另補一個限定：「連一個人也沒有存留」是指十二支派當時二十歲以上的人，摩西與以利亞撒兩人除外。
- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  summary: 民數記26:1、3、63：三次與摩西並列主持第二次數點；v60 列為亞倫的第三子。
  relation: 本章是以利亞撒以大祭司身分正式接手的第一件全國性事務。CT 說神從此改向摩西和新任大祭司以利亞撒說話；BH 指出這顯示祭司職分的延續，以及祭司在這個過渡期維繫立約關係的責任。v60-61 同時記下他的兩位兄長拿答與亞比戶因獻凡火而死。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 民數記26:1「祭司亞倫的兒子以利亞撒」；v59-60 他的父母與四個兒子；v64 第一次數點時他仍在。
  relation: 亞倫本人在本章已經去世，但他的名字在三處出現：作為以利亞撒的父親、作為約基別與暗蘭的兒子、以及作為第一次數點的主持人之一。v60-61 不隱瞞他家的失敗——KC 說利未這個蒙特權支派的數點，同樣讓人想起他們作祭司歷史開頭那件黑暗的事。
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 民數記26:65「除了耶孚尼的兒子迦勒和嫩的兒子約書亞以外，連一個人也沒有存留」。
  relation: 本章是約書亞與迦勒作為唯二存留者被正式點名的地方。GT 串珠說：「上一次記錄得的六十多萬人名，全部已在曠野中死去，現在所數點的名字，全屬新的一代，惟有兩位有信心的探子（迦勒和約書亞）仍然存留，成為美好的見證」（參民14:28-30）。CT 給名字的原文字義是「耶和華是拯救」。
- title: 迦勒
  path: link_folder/人物/迦勒.md
  summary: 民數記26:65 與約書亞是第一次被數的人中唯二存留的。
  relation: 本章把迦勒的存留放在一句判語的結算裡：「因為耶和華論到他們說：他們必要死在曠野。」CT 給「迦勒」的原文字義是「能幹的，勇敢，全心的」，給「耶孚尼」的是「他將被面對」。CT〔話中之光〕的評語是：凡是在危險的環境中，不顧眾人的反對，堅決為神的見證站住的，似乎被人棄絕，卻是被神所紀念的。
- title: 摩押平原
  path: link_folder/地點/摩押平原.md
  summary: 民數記26:3、63「摩西和祭司以利亞撒在摩押平原與耶利哥相對的約但河邊」。
  relation: 本章兩次點名這個地點，前後包住整份名單。CT 指出以色列人是在摩押王巴勒召巴蘭之前就來到摩押平原安營（參二十二1）。BH 說這裡是進入迦南前的最後紮營處，標記著從曠野飄流轉入征服迦南的過渡。
- title: 約但河
  path: link_folder/地點/約但河.md
  summary: 民數記26:3、63「與耶利哥相對的約但河邊」——數點的地點在約但河東岸。
  relation: 本章的約但河是一條還沒有跨過的界線。CT 說明方位：「『約但河邊』指約但河東邊；『對着耶利哥』耶利哥位於約但河西邊」。BH 把它讀成曠野與應許之地之間的分界，過河象徵進入神的應許。CT 給「約但」的原文字義是「下降」。
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: 民數記26:3、63「與耶利哥相對」——耶利哥在約但河西岸。
  relation: 本章的耶利哥只是一個方位參照，但它出現在名單的頭尾兩處。BH 指出耶利哥是以色列人進迦南後遇上的第一座主要城市，這裡提到它預示了接下來的征戰。CT 給「耶利哥」的原文字義是「它的平原」。
- title: 可拉的背叛（預告）
  path: link_folder/人物/可拉的背叛（預告）.md
  summary: 民數記26:9-11 重述可拉一黨的事與結局；v58 可拉族仍列在利未各族中。
  relation: 本章在流便的名單裡停下來重述這件事，並用「他們就作了警戒」收尾——STEP 顯示「警戒」是 le./Nes（H5251H），字面是一個立起來的記號。更值得注意的是 v58：可拉族仍然列在利未的各族中，而 v11 說「可拉的眾子沒有死亡」。這個家族被審判了，也被保留了。
- title: 可拉大坍亞比蘭等領首聯合的大反亂
  path: link_folder/事件/可拉大坍亞比蘭等領首聯合的大反亂.md
  summary: 民數記26:9「這大坍、亞比蘭，就是從會中選召的，與可拉一黨同向耶和華爭鬧的時候也向摩西、亞倫爭鬧」。
  relation: 本章從族譜的角度重述這件事：大坍與亞比蘭是以利押的兒子，以利押是法路的兒子，法路是流便的兒子。KC 說經文在這裡再一次告訴我們這些背叛者的罪是什麼，以及神給他們的特別審判。CT 另注意到同為以利押之子的尼母利沒有參與，並在〔話中之光〕稱他是「大義滅親的好榜樣」。
- title: 地破裂吞吃可拉與大坍亞比蘭之家與其財物
  path: link_folder/事件/地破裂吞吃可拉與大坍亞比蘭之家與其財物.md
  summary: 民數記26:10「地便開口吞了他們，和可拉、可拉的黨類一同死亡。那時火燒滅了二百五十個人」。
  relation: 本章把地與火兩種審判寫在同一節。GT 丁良才指出這正是版本差異所在：「七十士所譯的希臘文舊約和撒瑪利亞人的摩西五經，將本節譯作那一黨人死的時候，地開口，把他們吞了。火也燒滅了可拉和那二百五十個人，他們就作了鑒戒。」他並說按民16 的記載，大坍亞比蘭是被地吞滅，可拉卻是被火燒滅。
- title: 數點民數
  path: link_folder/事件/數點民數.md
  summary: 民數記26:64「摩西和祭司亞倫從前在西乃的曠野所數的以色列人」——本章是對第一次數點的結算。
  relation: 本章讓第一次數點的名單有了結局：那六十多萬人中，除迦勒與約書亞外一個也沒有存留。GT《啟導本》整理了兩次的差別：第一次只記每一支派男丁總數，此次除總數外還把每一支派下的家族名稱列出。KC 則指出兩次的目的不同——民1 是為著將要展開的曠野旅程，本章是為著即將進入應許之地承受產業。
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 民數記26:57-62 利未人另行數點，一個月以外的男丁共二萬三千，比民3:39 的二萬二千多了一千。
  relation: 本章的利未人數點在範圍與目的上都與其他支派不同。GT 串珠說明理由：利未人也要被數點，「但目的不是分配地業，因為神已將祭物和什一奉獻賜給他們為業」。丁良才另提出一個推測：利未支派在偵探迦南地的事上無份，也就沒有受神的刑罰，「他們只增加一千名，似乎很少，或者他們在可拉黨爭鬧的事上，也染了手」。
- title: 哥轄子孫
  path: link_folder/人物/哥轄子孫.md
  summary: 民數記26:57-58「屬哥轄的，有哥轄族」；v58「哥轄生暗蘭」——祭司家族的族譜由此開始。
  relation: 本章把哥轄放在祭司系譜的起點：哥轄生暗蘭，暗蘭與約基別生了亞倫、摩西與米利暗。CT 指出 v58 起到 v61 交代的是祭司家庭的族譜。同節列出的利未各支族中，可拉族也屬哥轄——CT 說可拉是以斯哈的兒子，而以斯哈是哥轄的兒子。
- title: 利未三族分工
  path: link_folder/事件/利未三族分工.md
  summary: 民數記26:57「屬革順的，有革順族；屬哥轄的，有哥轄族；屬米拉利的，有米拉利族」。
  relation: 本章重列利未三大家族，但支族名單與民3 不完全一樣。CT 指出差異：「其中革順的兒子是立尼和示每(參三18；代上六17)，但此處沒有提起示每」，而「哥轄的兒子有暗蘭、以斯哈、希伯倫和烏薛(參閱三19；代上六18)，可拉是以斯哈的兒子(參出六21)，此處沒有提到烏薛」。丁良才據此推測示每族與烏薛族「或者幾乎滅絕，甚至餘剩的人歸於別族」。
- title: 流便
  path: link_folder/人物/流便.md
  summary: 民數記26:5-7 記下流便的各族與人數：共四萬三千七百三十名，對照民1:21 的四萬六千五百名，減少二千七百七十名。
  relation: 本章是流便第二次被數點。CT 說「可能是受可拉事件的影響，故在下面特別提到這事件（參10~11節）」；本章也只有流便支派的總數帶零數。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 西緬
  path: link_folder/人物/西緬.md
  summary: 民數記26:12-14 記下西緬的各族與人數：共二萬二千二百名，對照民1:23 的五萬九千三百名，減少三萬七千一百名。
  relation: 本章是西緬第二次被數點。四套來源都指向前一章的毘珥事件與族長心利；GT《精讀本》說減幅達 63%，這支派從第三大變成最小。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 迦得（萬幸）
  path: link_folder/人物/迦得（萬幸）.md
  summary: 民數記26:15-18 記下迦得的各族與人數：共四萬零五百名，對照民1:25 的四萬五千六百五十名，減少五千一百五十名。
  relation: 本章是迦得第二次被數點。CT 與丁良才都注意到流便、西緬、迦得都在會幕南邊安營、與可拉相鄰，因而推測受可拉黨牽連。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  summary: 民數記26:19-22 記下猶大支派的各族與人數：共七萬六千五百名，對照民1:27 的七萬四千六百名，增加一千九百名。
  relation: 本章是猶大支派第二次被數點。仍是十二支派中人數最多的。CT 指出五族中有兩族是孫輩，補的是珥和俄南留下的空缺，而希斯倫一線通向大衛與基督。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 以薩迦（價值）
  path: link_folder/人物/以薩迦（價值）.md
  summary: 民數記26:23-25 記下以薩迦的各族與人數：共六萬四千三百名，對照民1:29 的五萬四千四百名，增加九千九百名。
  relation: 本章是以薩迦第二次被數點。CT 說陀拉族非常興旺，到大衛年間達到二萬二千六百名（參代上七2）。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 西布倫（同住）
  path: link_folder/人物/西布倫（同住）.md
  summary: 民數記26:26-27 記下西布倫的各族與人數：共六萬零五百名，對照民1:31 的五萬七千四百名，增加三千一百名。
  relation: 本章是西布倫第二次被數點。CT 指出西布倫三個兒子的名字「一直都沒有更改（參創四十六14）」。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 瑪拿西
  path: link_folder/人物/瑪拿西.md
  summary: 民數記26:28-34 記下瑪拿西的各族與人數：共五萬二千七百名，對照民1:35 的三萬二千二百名，增加二萬零五百名。
  relation: 本章是瑪拿西第二次被數點。增幅最大的支派，本章也因此把它排在以法蓮之前。GT《精讀本》歸因於順服，KC 歸因於西羅非哈的女兒對產業的關切。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 以法蓮
  path: link_folder/人物/以法蓮.md
  summary: 民數記26:35-37 記下以法蓮的各族與人數：共三萬二千五百名，對照民1:33 的四萬零五百名，減少八千名。
  relation: 本章是以法蓮第二次被數點。丁良才把這個減少與雅各的預言並列：雅各曾預言以法蓮將來比瑪拿西還大（創四十八19），而摩西在申33:17 仍認可那預言。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 約瑟
  path: link_folder/人物/約瑟.md
  summary: 民數記26:28「按著家族，約瑟的兒子有瑪拿西、以法蓮」；v37「按著家族，這都是約瑟的子孫」。
  relation: 本章把約瑟家分成兩個支派來數，而兩支走向相反：瑪拿西增加兩萬零五百，以法蓮減少八千。GT《聖經精讀本》從總量看這件事：「雖然以法蓮支派的人數減少了,但是因瑪拿西支派人數的急增,整體上來講約瑟支派的人數增多了。」BH 指出雅各收納這兩個孫子，等於給了約瑟雙份產業。
- title: 便雅憫
  path: link_folder/人物/便雅憫.md
  summary: 民數記26:38-41 記下便雅憫的各族與人數：共四萬五千六百名，對照民1:37 的三萬五千四百名，增加一萬零二百名。
  relation: 本章是便雅憫第二次被數點。CT 指出創46:21 列了便雅憫十個兒子，本章只有五個是兒子、兩個是孫子，「可能其他的兒子們均無子嗣而辭世」。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 但支派
  path: link_folder/人物/但支派.md
  summary: 民數記26:42-43 記下但支派的各族與人數：共六萬四千四百名，對照民1:39 的六萬二千七百名，增加一千七百名。
  relation: 本章是但支派第二次被數點。但的眾子只有書含一族，人數卻是十二支派中第二多。GT 艾基斯專文處理這個支派後來守不住地業、北遷拉億的問題。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 亞設（有福）
  path: link_folder/人物/亞設（有福）.md
  summary: 民數記26:44-47 記下亞設的各族與人數：共五萬三千四百名，對照民1:41 的四萬一千五百名，增加一萬一千九百名。
  relation: 本章是亞設第二次被數點。本章在亞設的名單中插了一句「亞設的女兒名叫西拉」，CT 說她是唯一列名在整個譜系中的女性。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 拿弗他利
  path: link_folder/人物/拿弗他利.md
  summary: 民數記26:48-50 記下拿弗他利的各族與人數：共四萬五千四百名，對照民1:43 的五萬三千四百名，減少八千名。
  relation: 本章是拿弗他利第二次被數點。CT 在這裡直說「原因不明」；丁良才在論以法蓮時也說「我們現在不得知道這事的理由」。這次數點與民1 最大的差別是另列了各支派下的家族名稱，GT 串珠指出「這些家族的名稱大都見《創世記》四十六8～27所列雅各眾子孫的名單中」。
- title: 拿答
  path: link_folder/人物/拿答.md
  summary: 民數記26:60-61「亞倫生拿答、亞比戶、以利亞撒、以他瑪」；「拿答、亞比戶在耶和華面前獻凡火的時候就死了」。
  relation: 本章在祭司族譜裡沒有略過這件事。KC 說利未這個蒙特權支派的數點，同樣讓人想起他們作祭司歷史開頭那件黑暗的事——拿答與亞比戶的不忠並沒有被遮蓋。GT《聖經精讀本》從中讀出一個原則：即使作神工作的人，如果不是按神的旨意和話語，只追求自己的榮耀和利益，必招來神的震怒。
- title: 亞比戶
  path: link_folder/人物/亞比戶.md
  summary: 民數記26:60-61 與拿答一同被列在亞倫四子之中，也一同因獻凡火而死。
  relation: 本章把亞倫四個兒子並列，然後補上兩個人的下場。CT 給「亞比戶」的原文字義是「他是我父親」，並註明細節請詳閱利未記十1-5。GT《啟導本》在解釋以利亞撒的身分時也提到這件事：以利亞撒是亞倫第三子，他的兩個哥哥因為獻凡火而被天火燒死。
- title: 凡火
  path: link_folder/主題/凡火.md
  summary: 民數記26:61「拿答、亞比戶在耶和華面前獻凡火的時候就死了」——CT 給「凡」的原文字義是「疏離的，平常的」。
  relation: 本章是這件事在民數記裡被重提的地方，出現在祭司族譜的正中間。CT 在〔話中之光〕把它讀成事奉的原則：『聖火』代表我們獻上之事奉的火，乃是出於聖靈，就是聖潔的靈；我們為求工作有果效，以別的代替聖靈，不啻點燃凡火。它並說：凡火就是己的火，就是屬魂生命所發出來的火，就是血氣生命、天然生命的火。
- title: 約基別
  path: link_folder/人物/約基別.md
  summary: 民數記26:59「暗蘭的妻名叫約基別，是利未女子，生在埃及。他給暗蘭生了亞倫、摩西，並他們的姊姊米利暗」。
  relation: 本章是聖經中少數把約基別的名字、出身與三個孩子一次寫全的地方。BH 說她的名字意思是「耶和華是榮耀」，反映出她對神的信心與敬畏；生在埃及這一點則顯示以色列人在寄居之地仍保住了身分與信仰。GT《聖經精讀本》說經文特別提到這個家譜，是因為其中出了以色列民族的領袖摩西與利未支派的領袖亞倫。
- title: 暗蘭
  path: link_folder/人物/暗蘭.md
  summary: 民數記26:58「哥轄生暗蘭」；v59 他與約基別生了亞倫、摩西、米利暗。
  relation: 本章把暗蘭放在祭司系譜的關鍵一環：哥轄之下、亞倫與摩西之上。GT 丁良才記下一個註釋上的分歧：「有注釋家以為本節的暗蘭，是哥轄的兒子暗蘭的後裔」（58，出六20注）。CT 給「暗蘭」的原文字義是「高貴的人」。
- title: 米利暗
  path: link_folder/人物/米利暗.md
  summary: 民數記26:59「並他們的姊姊米利暗」——本章把她與亞倫、摩西並列為約基別所生。
  relation: 米利暗已於民20:1 去世，本章在族譜裡再次點她的名。CT 給「米利暗」的原文字義是「反抗」。GT《聖經精讀本》說經文特別提到這個家譜，是因為神永遠記住並紀念為神的榮耀流血流汗之人。
- title: 耶和華擊打百姓的瘟疫
  path: link_folder/事件/耶和華擊打百姓的瘟疫.md
  summary: 民數記26:1「瘟疫之後」——本章直接接在民25 那場死了二萬四千人的瘟疫之後。
  relation: 本章開頭這四個字把兩章接了起來，也解釋了為什麼有些支派人數減少。GT 丁良才說得最直接：「『瘟疫之後』——這一句顯明計算民數的事是接續二十五章，也顯明為何有些支派的人數減少。」KC 則把它讀成全書的界碑：這是擊打這百姓作為曠野時期的百姓的最後一場大瘟疫，曠野的旅程結束了。
- title: 耶和華是事奉者的業與分
  path: link_folder/神學/耶和華是事奉者的業與分.md
  summary: 民數記26:62「他們本來沒有數在以色列人中；因為在以色列人中，沒有分給他們產業」。
  relation: 本章給了利未人不列在總數中的理由，而 CT 直接把它接回民18:20：「利未人雖然沒有分得固定的地業，但神自己就是他們的產業（參十八20），這是最上好的福分。」GT《啟導本》補上實際安排：他們除了四十八座分散全地的小城之外（三十五1～8），沒有分得土地為業。BH 說他們的產業是耶和華自己與所作的事奉，這使他們必須倚靠神與群體的十一奉獻。
