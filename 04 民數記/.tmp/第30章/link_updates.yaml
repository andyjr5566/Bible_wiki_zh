book: 民數記
chapter: 30
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1 摩西曉諭以色列各支派的首領頒布許願條例，v16 收尾說這是耶和華所吩咐摩西的律例。
  relation: GT 丁良才說對首領說是因為「各支派的首領要判斷那些因許願而起爭論的」；KingComments 也說對首領說是因為這是家庭的事。
- title: 摩西立首領
  path: link_folder/事件/摩西立首領.md
  summary: v1 的受話者是各支派的首領，不是全會眾；本章的爭議判定要由他們執行。
  relation: BibleHub 回指出18 葉忒羅建議摩西設立千夫長、百夫長、五十夫長、十夫長的分層領導，說本章的傳達路徑正建立在那套結構上。
- title: 許願
  path: link_folder/文化/許願.md
  summary: 全章十六節都在講許願的效力：v2 男子的願一律為定，v3-15 女子的願要看父親或丈夫是否應承，v9 寡婦與被休婦人的願不需人應承。
  relation: STEP v2 顯示「許願」是同源的 H5087 yi.Dor 加 H5088 Ne.der，「起誓」是 H7650 hi.Sha.va' 加 H7621 she.vu.'Ah，「約束自己」是 H631 加 H632 再加 H5315I naf.Sh/o；GT 丁良才把兩類分開：「『許願』——就是立志要作什麼。『要約束自己』——就是立志不作什麼。」
- title: 冒失發誓
  path: link_folder/主題/冒失發誓.md
  summary: v6、8 的「冒失話」是 STEP H4008 miv.Ta' 加 H8193G se.fa.Tei/ha，lexicon 作 rash word；CT 解為輕率的發言。
  relation: GT 丁良才推測本章的條例可能就是為這一類話定的：「『冒失話』——本章的條例，或者是因這些冒失話定的。」BibleHub 也說冒失的許諾是未經充分考量後果的承諾，丈夫有權作廢正是一種保護。
- title: 刻苦己心（禁食悔改）
  path: link_folder/主題/刻苦己心（禁食悔改）.md
  summary: v13「刻苦約束自己所起的誓」是 STEP H6031B Piel 不定詞 le./'a.Not 加 H5315I Na.fesh，與民29:7 贖罪日的寫法同一結構。
  relation: GT 丁良才直接註明範圍：「『刻苦約束自己』——就是禁食等事（利十六29，民二十九7，參五十八5）」；CT 也說是禁食禱告以表達憂傷之情。本章顯示這類自我刻苦的誓同樣在丈夫可堅定或可廢去的範圍內。
- title: 赦免
  path: link_folder/神學/赦免.md
  summary: v5、8、12 三次說「耶和華也必赦免他」——願被父親或丈夫廢掉的女子，不因未能履行而有罪。
  relation: GT 丁良才解釋得很乾脆：「她既然沒有食言的罪，神也就不罰她。」KingComments 說這裡是耶和華恩典的顯明，因為她的好意並不合神的心意，卻仍蒙赦免。
- title: 拿細耳人（nazir）
  path: link_folder/原文/拿細耳人（nazir）.md
  summary: GT 串珠說摩西律法在本章之前已提過許願之例，「重點在許願的獻物（利27章）及拿細耳人的願（民6章）」。
  relation: GT《舊約聖經背景註釋》把拿細耳人的願列為「表示奉獻時期的開始」的一種願；本章不重述其內容，只定下一個願何時生效、何時作廢的通則。
- title: 許願獻人估價表（年齡性別分級）
  path: link_folder/主題/許願獻人估價表（年齡性別分級）.md
  summary: GT 啟導本說遇到實際環境不許可履行所許的願時，「《利未記》二十七章對此已有規定」；GT《舊約聖經背景註釋》也請讀者參看利27:2-13。
  relation: 利27 處理的是願的贖價與估價，本章處理的是願本身能不能成立；兩章合起來才是完整的許願制度。
- title: 平安祭的三類（感謝祭、還願祭、甘心祭）
  path: link_folder/主題/平安祭的三類（感謝祭、還願祭、甘心祭）.md
  summary: GT 串珠解釋本章為何插在此處時說：「還願者須獻感恩祭（利7:16），而在節期中（上兩章討論範圍）還願獻祭的適當的」。
  relation: 民29:39 剛把還願與甘心所獻列在節期祭以外，本章接著規定這些自願祭的效力條件——兩章是同一件事的兩面。
- title: 不可妄稱耶和華你神的名
  path: link_folder/神學/不可妄稱耶和華你神的名.md
  summary: GT《舊約聖經背景註釋》說起願是召喚神明與崇拜者建立契約的宗教性行動，「故此絕對不得違約，免得觸怒神明（見：出二十7不得「妄用」神名的命令）」。
  relation: BibleHub 也說起誓是以神的名為見證，「破壞這樣的誓被視為直接冒犯神自己」；本章 v2「不可食言」的原文 H2490H cha.lal 字面正是把分別為聖的東西弄髒。
- title: 甘心樂意的奉獻
  path: link_folder/神學/甘心樂意的奉獻.md
  summary: KingComments 說沒有人有義務許願——「我們必須仔細想清楚自己能不能守住這個願，不然就不要許」；GT《聖經精讀本》也說許願「是人自發的意志,不是強制的義務」。
  relation: 民28-29 的節期祭是全民義務，本章的願是個人自願；兩章相鄰正是要把義務與自願分開。
- title: 群體性獻祭
  path: link_folder/主題/群體性獻祭.md
  summary: KingComments 在導論裡明確對比：民28-29 的節期祭是全民的義務祭，本章的願則是個人自願的獻身。
  relation: 同一位神既要百姓按時獻上規定的祭物，也尋找他們自願獻上自己；本章補的正是後者的規則。
- title: 民29：40 在希伯來聖經屬民30：1
  path: link_folder/背景/民29：40 在希伯來聖經屬民30：1.md
  summary: GT 丁良才在本章 v1 直接註明「參二十九40」，把上一章的結語與本章的開場當成同一處來讀。
  relation: 這正是 CT 在民29:40 指出的分章差異：希伯來文聖經把「摩西照耶和華所吩咐他的一切話告訴以色列人」放在民30 的第一節作序言，因此本章的 v1 在希伯來文聖經裡是第二節。
- title: 以弗所書5章基督與教會的婚姻奧祕
  path: link_folder/互文/以弗所書5章基督與教會的婚姻奧祕.md
  summary: GT 串珠說本章條例「與新約的教訓原則上是一致的（參弗5:22; 6:1; 西3:18-20）」。
  relation: BibleHub 在 v6、7、10、12、13、15、16 反覆回指弗5:23 丈夫是妻子的頭如同基督是教會的頭；KingComments 則引林前11:3 說神期待作女人之頭的男人知道自己的責任。
- title: 擔當干犯聖所與祭司職任的罪孽
  path: link_folder/神學/擔當干犯聖所與祭司職任的罪孽.md
  summary: v15「就要擔當婦人的罪孽」是 STEP H5375J ve./na.Sa' 加 H5771G 'a.vo.Na/h，與祭司代眾人擔責的用語同一結構。
  relation: 本章把這個責任放在丈夫身上：他若在聽見的日子之後才廢願，妻子的罪咎就轉到他身上，CT 說他因此須在神面前獻祭贖罪。
- title: 大贖罪日（Yom Kippur）條例
  path: link_folder/歷史/大贖罪日（Yom Kippur）條例.md
  summary: GT 丁良才在 v13 把「刻苦約束自己」直接連到贖罪日的禁食：「就是禁食等事（利十六29，民二十九7，參五十八5）」。
  relation: 贖罪日是全民一年一次的刻苦，本章的則是個人自願立下的刻苦之誓；兩者用同一個字根，但一個是律法規定、一個由丈夫決定是否堅定。
- title: 女兒承受產業的條例
  path: link_folder/主題/女兒承受產業的條例.md
  summary: GT《舊約聖經背景註釋》說本章 v3-5 的少女「受父親的監護，因此不擁有財產，也不得未經許可，妨礙父親為她安排婚事，或使家庭藉她得益」。
  relation: 民27 西羅非哈的女兒爭取產業，是同一套制度下女子權利被明文擴張的一次；本章則顯示在宗教承諾上，未婚女子仍受父親的權柄約束。
- title: 褻瀆（cha.lal）
  path: link_folder/原文/褻瀆（cha.lal）.md
  summary: v2「不可食言」的原文是 STEP H2490H ya.Chel 加 H1697G de.va.R/o，本節譯義 he will violate his word；同一個字根在利21 被譯作褻瀆、辱沒、從俗。
  relation: CT 引《呂振中譯本》正是照字根譯的：「不可褻瀆自己的話」，並說食言「不僅是對神不負責任，而且也是對自己不負責任」。人自己說出口的話，在本章與聖所、神的名一樣是可以被弄髒的東西。
- title: 贖愆祭（asham）
  path: link_folder/原文/贖愆祭（asham）.md
  summary: v15 丈夫擔當婦人的罪孽之後要獻的祭：CT 說「在神面前獻祭贖罪(參利五17~19)」，GT 丁良才指明是「利五14-19節上所定的祭」。
  relation: GT《聖經精讀本》另引利5:1-6，說丈夫沒有履行「神和妻子之間證人的義務」，所以要為妻子廢願的罪孽負責。
- title: 撒上1（Shmuel Aleph 1）
  path: link_folder/原文/撒上1（Shmuel Aleph 1）.md
  summary: GT《舊約聖經背景註釋》在本章點名：「哈拿是聖經之中，惟一妻子自行許願，將兒子終身奉獻在示羅會幕之中事奉的案例（撒上一）。」
  relation: BibleHub 也兩次引撒上1:11 說明許願的性質。GT《背景註釋》是在解釋女子順服的角色時點出這一例的——在本章的制度下，妻子自行許願本來就是需要被特別記下來的事。
