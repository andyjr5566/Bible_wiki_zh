book: 04 民數記
chapter: 17
updates:
- title: 杖
  path: link_folder/神學/杖.md
  summary: 本章整章圍繞十二根杖。STEP 原文資料顯示本章的杖是 מַטֶּה（ma.Teh，H4294G），詞典義同時涵蓋「杖」與「支派」；第2節後半用的是同一個字的另一個編碼（H4294H），詞典義就寫作「支派」。GT《民數記串珠聖經註釋》：「「杖」：原與「支派」一字相同；杖上刻有名字便名符其實的代表各支派了。」
  relation: GT 丁良才《民數記註釋》在本章把舊約的杖分成三種：約二尺、一端有木球的牧人用杖，兼作掌權者的標號；約五六尺、用來責打羊或登山行路的；約三尺、類似拐棍的行路杖。他明確指出「本章上的杖字就是這個字」，也就是第三種。CT 的分辨相同：本章的杖與詩23:4 牧羊的竿與杖不同字，也與創32:10 雅各所用過的杖不同字。出4 的杖是摩西手裡行神蹟的杖，民17 的杖是十二個族長手裡代表身分的杖——GT《舊約聖經背景註釋》指出杖在長老或族長手中就是他權柄的象徵（見創38:18），而且各人的杖大概有獨特的雕刻，一看就知道是誰的。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 本章是神第三次、也是最後一次印證亞倫的祭司職分。第3節他的名字被寫在利未的杖上；第8節「利未族亞倫的杖已經發了芽，生了花苞，開了花，結了熟杏」。GT《民數記串珠聖經註釋》把三次排在一起：可拉黨被活埋、亞倫獻香止瘟疫，本章是第三個方法。
  relation: 民16 的印證方式是審判，民17 的印證方式是生命。GT 丁良才《民數記註釋》讀出其中的恩典：「亞倫和眾首領的杖一樣的不能開花，不能結果，但這杖因神的大能，結了果子。亞倫也是因神的恩典結了果子，顯明本來無用的人，既被神揀選賜福，就必有用處，有能力」GT《聖經精讀本──民數記註解》的結論相同：「亞倫的祭司職分並不是因著人的條件得到的,乃是神主權的揀選」KC 則指出這根杖的意思：亞倫的杖發芽表示這個祭司職分是憑著不能毀壞的生命（來7:16）。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 本章的摩西幾乎只做一件事：照著吩咐行。第7節把十二根杖存在法櫃的帳幕內；第8節進帳幕去看；第9節把所有的杖拿出來給眾人看；第11節「摩西就這樣行。耶和華怎樣吩咐他，他就怎樣行了」。
  relation: 本章他的位置很特別：他是唯一能進至聖所的人。CT 指出平時至聖所誰也不能進去，連大祭司亞倫也僅能一年一度進去，當時只有摩西例外，所以是他把杖放進去的；GT 丁良才《民數記註釋》也說「平常摩西不敢進去，但這一次有耶和華特別的命令」。民16 他為百姓兩次代求、與人爭辯到底；民17 他一句話也沒有多說，只把十二根杖抱進去、再抱出來——裁決本來就不是他做的。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: 本章的主題就是祭司職分歸誰，而這一次是用生命證明的。GT《民數記串珠聖經註釋》總結：神證實亞倫職事的第三個方法，「證明神惟獨賜給亞倫一家這尊貴的祭司職事」。
  relation: GT《啟導本聖經註釋》比較了三次印證的差別：前兩次是百姓抱怨、神要消滅他們，然後才證明亞倫乃神所揀選；「這次則是神先提出一個方法，測驗誰是祂所揀選供祭司職位的支派，然後是百姓呼求神的憐憫」。而這一章的效果不只是止住爭議。GT《啟導本聖經註釋》指出百姓由此走到下一步：他們這才認識到需要有一位能親近神的人為他們的罪代求，明白設立祭司的必要性，也才願意奉獻什一和初熟的出產來供應祭司生活所需（民18章）。
- title: 利未支派
  path: link_folder/人物/利未支派.md
  summary: 第3節「並要將亞倫的名字寫在利未的杖上，因為各族長必有一根杖」；第8節「利未族亞倫的杖」。CT 由此推論：「亞倫實際上就是利未支派的首領，雖然他的祖父哥轄是利未的次子」GT 丁良才《民數記註釋》也指出亞倫本來不是利未族的首領。
  relation: 民16 是利未人越界爭祭司職分，民17 是利未支派的代表權被定在一個人身上。STEP 原文資料顯示這裡的「杖」מַטֶּה（ma.Teh，H4294G）同時也是「支派」的意思，GT《舊約聖經背景註釋》指出這是刻意的雙關——所以在利未的杖上寫亞倫的名字，不是加上一個人名，是把一整個支派的代表權定在一個人身上。第13節百姓的恐懼也與這條界線有關：CT 指出只准利未人在會幕中辦事，凡挨近聖所的必遭懲罰（參民8:19）。
- title: 約櫃
  path: link_folder/主題/約櫃.md
  summary: 第4、7、10節三次指定十二根杖要放在「法櫃前」，最後亞倫的杖留在那裡作記號。CT 指出原文的用字值得注意：原文只有「見證」而無「櫃」字，『見證』而無『櫃』字，故此，不少解經家認為亞倫的杖是與盛嗎哪的金罐放在兩塊法版的前面，而這三樣都放在法櫃的裡面（參來九4）
  relation: GT 丁良才《民數記註釋》加了一個實務判斷支持這個讀法：「這杖長約三尺，約櫃裡能容得下（參2注）。」GT《啟導本聖經註釋》也引來9:4，指盛嗎哪的金罐、約版和亞倫的杖都放在約櫃中。至於後來的下落，CT 說得很坦白：「可惜這三樣連同法櫃後來都失蹤，無跡可查」GT 丁良才推測是在所羅門的時候已經失落（王上8:9），可能是非利士人擄去約櫃的時候遺失的。
- title: 至聖所
  path: link_folder/地點/至聖所.md
  summary: 第4、7節十二根杖存放的位置，第8節摩西進去看杖。CT 說明這裡指的是至聖所的裡面：「平時誰也不能進去，連大祭司亞倫也僅能一年一度進去。當時只有摩西例外，所以是摩西把這些杖放進去的」GT 丁良才《民數記註釋》也說「平常摩西不敢進去，但這一次有耶和華特別的命令」。
  relation: 本章讓至聖所擔任了一個新角色：裁決的場所。KC 指出這正是重點——神要這些杖放在祂的聖所裡、靠近一切權柄的源頭、離開人的面前，由神自己顯明祂揀選了誰；這件事是在聖所裡定的。利16 的至聖所是一年一次贖罪的地方，民17 的至聖所是一夜之間長出果子的地方。
- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  summary: 第4節「你要把這些杖存在會幕內法櫃前，就是我與你們相會之處」；第13節百姓的哀嘆「凡挨近耶和華帳幕的是必死的。我們都要死亡嗎？」
  relation: 本章給會幕加上了第二件紀念物。GT《民數記串珠聖經註釋》把兩件並列：亞倫的杖從此成了記號，「像包香壇的銅一樣（16:38），警戒任何反叛祭司的行為」——一件在會幕外的壇上，一件在會幕內的法櫃前。GT 丁良才《民數記註釋》在民16 也數過同一組：因可拉的背逆，給會幕加上了兩樣東西。而第13節顯示百姓對「挨近會幕」這件事已經完全不敢再試。
- title: 嗎哪
  path: link_folder/主題/嗎哪.md
  summary: 第10節亞倫的杖放回法櫃前。CT 與 GT 丁良才《民數記註釋》都把它與盛嗎哪的金罐並列（來9:4）；GT 丁良才並指出「當所羅門的時候，大概這杖和盛嗎哪的金罐」已經失落了（王上八9）。
  relation: KC 把約櫃裡這兩樣東西讀成曠野路上的兩樣需要：嗎哪代表主耶穌的生命，我們以祂為糧、思想祂，就有力量走路；杖代表那位曾經死過、如今活著作大祭司為我們祈求的主。出16 的嗎哪是每天要撿的糧，民11 的嗎哪是被厭棄的糧，民17 的嗎哪則是收在櫃裡的紀念物——與一根發過芽的杖放在一起。
- title: 以色列人的怨言
  path: link_folder/歷史/以色列人的怨言.md
  summary: 本章兩次說明這個神蹟的目的就是止住怨言：第5節「我必使以色列人向你們所發的怨言止息，不再達到我耳中」；第10節「你就使他們向我發的怨言止息，免得他們死亡」。GT《民數記串珠聖經註釋》指出這兩節其實是同一件事——向祭司所發的怨言，就是向神發的怨言。
  relation: 民11 到民16 的怨言都是被審判止住的，民17 的怨言是被一根長出果子的枯枝止住的。但止住不等於悔改：第12-13節百姓的反應是「我們死啦！我們滅亡啦！都滅亡啦！」GT《民數記串珠聖經註釋》讀成一種進步——他們真正學到敬畏神的功課；GT《聖經精讀本──民數記註解》則保留得多：「他們的懼怕在性質上與悔改是不一樣的」。KC 站在後者：百姓不明白那根杖發生了什麼事，他們害怕——這正是不明白神恩典的人的樣子。
