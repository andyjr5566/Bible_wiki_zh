name: "凡擅進靠近耶和華會棚與祭事場者必定蒙誅死亡"
type: "神學"
secondary_types:
  - "事件"
  - "文化"
status: formal
definition: |
  以色列全民在一輪震人心志的浩力神蹟（如可拉狂夥陷地、五百熏爐化作燒壇鎮幕、以及枯斷長仗忽吐花芬成熟白杏）重擊之後，心中積鬱已久的挑戰貪傲隨之崩解為難堪的生死悚極與絕命大叫；這重喊叫明確證示並銘定：聖殿天棚的獻主真奉牽涉天道極度潔清至崇法則，任何心懷傲念、手操染污罪志之人妄企硬探、挨傍親惹或強搶親近上帝神位之事，都必難倖免遭受吞天巨譴之即刻橫亡報殃。
accumulations:
  - book: "民數記"
    chapter: 17
    summary: "會眾親歷連鎖護斷反徒神火與發芽榮牌，轉爆深深絕倒死叫：怕凡冒越挨進天朝棚堂便吞火遭夷死亡。"
    relation: "由舊人傲橫極度震向懼命哀吼，深告世間凡胎不可私懷才貌狂奔，唯靠大祭中保始免蹈火受罪。"
    content: |
      在見識上帝把亞倫一根花杖永遠奠為聖堂見證與不移之官爵定鎖之後，百姓自得之狂氣化生作了空極無著的新悲涼鳴歎與死罪痛畏。「以色列人對摩西說：我們死啦！我們滅亡啦！都滅亡啦！凡挨近耶和華帳幕的是必死的。我們都要死亡嗎？」（民十七12-13）。黃迦勒深厚勾勒這幕心性極向反撲與罪民畏聖悲惶：「民心昔日搶言喊鬧自己莫不潔神能近王（十六3），今時親窺那凌虛而發的長熟活木神力以及對冒越罪惡的零容極火，他們大叫大慟不敢上跨至堂門；『凡親附擅至之背者盡同亡盡』這句自喊正是為舊造驕情鳴葬之警鐘，說明在毫無真正代罪生命依託之情形下硬討恩臨是一樁極可懼怕的自覆危機！」（CT）。
      
      丁良才與《聖經精讀本》雙層揭探這種恐懼的深意和未完成的真信仰轉進：「前刻驕心放肆挑釁上帝，而此朝看徹浩嚴大劫與大王榮耀才轉至真切敬畏戰慄（賽六5）；這大嘆雖然暴露人間缺愛乏知的軟苦懦心，卻同時將聖與凡之間萬仞絕地徹亮向世眼揭開，驅叫愚眾俯伏承認亟借親主祭主替身保佑！」（GT）。BibleHub 深掘了聖恩得至和冒撞而亡的永恆經道：「這群呼聲顯出沒有上帝呼定和聖中保贖罪覆罩時，人類對見純道熱神的心魂大潰絕；幸賴後世中保至兄耶穌，以他至真流血打開平安布帷，挽贖天下投他懷抱不懼灰灰遭撲之福！」（BH）。
      
      KingComments 又自靈命痛傷語點這場嚎恐之實質：「盲眾未能通透這出死之綠仗本是寬恩憫憐和滿載得贖生命的美好宣恩，卻一知性驚死嚎絕！這刻畫極明那些對恩道心存暗閉自負者，永遠把上意至善解成嚴冷催魂。幸耶穌基督身成祭帥不變神慰，領我們無恐走進金聖帳門！」（KC）。此教義立起千重界欄與呼救中保的必然。
