name: "十二支派首領之杖按著名冊交付驗證"
type: "事件"
secondary_types:
  - "文化"
  - "神學"
status: formal
definition: |
  耶和華神指示摩西從以色列十二支派的所有領班首領手中，依循宗長代表各收取手杖一根（共計十二根），並且要求將各人的真實名號清晰寫作在專用杖柄上面。藉由公開無二的手杖收納，把一場因狂妄挑戰權力與流血大變促生而成的人心質疑，鄭重帶領進入永恆至真公眾法座之前，聽候上帝定旨無誤的核心試判與挑選確認。
accumulations:
  - book: "民數記"
    chapter: 17
    summary: "十二支派代表按氏族各持一枝木杖寫入代表宗祖人名，以平定事宰官職的橫論與猜嫉。"
    relation: "此為平定神權爭執的和平實物見證儀式起點，象徵人欲放棄口端兵亂，恭將榮衰生息恭敬奉上天君判斷。"
    content: |
      民數記第十七章開篇迎面記載了至高真主對於亞倫祭司統任合法性的第三輪堅決實證——神不僅撲滅暴力造反、止消漫談大怒，更在這裡以高度文明有力的實體證據設立和平試驗。神指示摩西宣示全境：「你曉諭以色列人，從他們手下取杖，每支派一根...共取十二根。你要將各人的名字寫在各人的杖上」（民十七2）。黃迦勒在此深刻說明，這杖絶非打羊竹鞭或是長行拄腿仗拐，而是手信權儀：「此杖按希伯來原意為民團慣佩權杖，即摩西面神或是去臨大野及出面對見埃及傲君法老時手中把持的那一棒；既為族榮標榜與行政身份徵牌，在此全數奉往領使摩西指面交提，不分親疏一併匯聚」（CT）。
      
      丁良才進一步補充希伯來古代歷史文化背景：「舊約聖言上記錄杖名三品，唯獨此字象徵至尊重尊之領將王杖；每杖代表著家族命定歸所；原與『支派』一字希伯來根意互涉通理；寫上姓名意為真真實實代表部落群山！」（GT）。BibleHub 深耕品義指陳：「在此時局一棒配簽一身姓名字，正是為著在全民面前打死私相猜忌、免避人事掉換的空口流譭；將權名雕立，更寓表上主意願洞徹個體生命、親手判辨世間領綱職定之絕對誠敬關係」（BH）。
      
      KingComments 同步呼籲深切領悟此番手杖交付的生命靈訓：「可拉大變中上帝手用審判大工宣了自己主位，此地主不再施殺火劍，而轉拿眾首權棒收去施打豐盈生性！杖，即掌管強杖也（創四十九10）；主定意取名存奉不留爭喧，昭告教團與天下世人：一己榮祿豈肯用唇槍豪言誇功硬奪？惟仰俯首將職掌生命繳付父家裁斷！」（KC）。這項舉動不僅破除了狂言自大，也教導萬代信者當坦為真性付諸主前。
