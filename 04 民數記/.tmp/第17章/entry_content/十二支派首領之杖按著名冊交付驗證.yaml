name: "十二支派首領之杖按著名冊交付驗證"
type: "事件"
status: "formal"
definition: "記載於民數記第17章1至2節的神聖驗證程序：在處理經歷可拉黨反叛與社會怨言災疫的善後之際，耶和華主動設立一項不經干戈的客觀證明方式：吩咐摩西從以色列十二支派的所有首領，依其宗族門第分別取一把木杖，合為十二把；且要在每支枯死手杖之木體表面清楚寫上所屬支派宗主的個人真名。此舉旨在將事奉事工與民心紛爭從情緒喧囂與血肉權力結構中移出，直接仰對法櫃與無上神意辦理平靜清明的聖契確認。"
accumulations:
  - book: "民數記"
    chapter: 17
    summary: "上帝敕告摩西徵召十二族首各端交一根刻記主姓的人用木杖，送往會台內驗見真道揀領權歸誰屬。"
    relation: "創闢「離於人力兵戈與群宣、轉倚聖潔超然顯證」的排難裁判機制：人爭強弱唯賴言力，上天解怨則令人人放下爭端憑據，全數投於恩座跟前恭等公裁。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT17.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT17.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/17)"
