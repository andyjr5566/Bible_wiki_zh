name: "亞倫發芽熟杏之杖表徵經歷死地步入復活生命力"
type: "神學"
secondary_types:
  - "事件"
  - "文化"
status: formal
definition: |
  原本自枝葉盛怒枯竭死斷的手把殘木，在經歷了一夜安放於天主聖顏見證之前後，能於次朝奇異般迸露青青新兆、綻破芬白英姿並垂成圓滿的甜密豐實杏仁果粒；這一壯大奇想與無匹真像深厚表意著：事得造物上天真正奉持跟蒙認權祿之原貌，決不可妄賴屬血肉自然的才能思才強攻奪權，必須真實自降扎下虛空世亡黑谷，始在復活至高聖恩大能與長存新生聖榮下展發無法攻奪的真純侍者天工。
accumulations:
  - book: "民數記"
    chapter: 17
    summary: "老舊乾竭權杖經過一宵暗谷長安而迎光發動三代繁茂生息（出芽結杏），展發復活豐盛生命大跡。"
    relation: "向萬世昭宣上帝國度底裡之榮貴職掌決不可依恃血氣鬥勇豪語搶佔，純憑陷於苦營經歷死與復活後天恩所灌溉成全之生命偉力。"
    content: |
      亞倫手中那枝曾飽享日炙雨濯而退散風光久的乾斷老枝，在此成就一項驚爍萬年信團思想的核心聖訓——神聖權威唯生從「歷死重生」無窮生機裡面發顯。「我所揀選的那人，他的杖必發芽...亞倫的杖已經發了芽，生了花苞，開了花，結了熟杏」（民十七5，8）。黃迦勒在此直擊基督教會和祭祀歷史的核心權柄奧祕：「凡是不曾經受死亡的皆乏真福！枯本，指為無價、無益於萬千乾曠江界的大廢散木；你萬不可帶著天然心思才明闖進天棚自傲辦事。若唯諳鮮血掩護卻不懂木架釘休，你極難侍從大仁上僕。一根老柴留在至尊靜顏深幽裡面捱經整晚黑沉長休，次宵天現居然發透出生命繁昌三春好節（出芽生秀掛盛杏），此正寫明死與復活成道極美秘印！」（CT）。
      
      丁良才與《聖經精讀本》重扣這神學要意：「死在他界犯罪網底的人類（弗二1），因依靠至聖大功者耶穌生光浩恩，直湧浩妙震人生命豐神；杏仁屬王宮至貴甘物，表明我們靈工服職若賴聖靈浩力，方堪開揚榮香不墜之豐秀果林！」（GT）。BibleHub 同起稱揚此生與死的聖愛象喻：「枯死舊木重生開榮神花，正早歲精寫大王基督的奇復活果證與初熟榮冠（林前十五20）；主在黑土戰退永世大鎖，向信群發授超越腐朽、生之無限的新永天召！」（BH；來七16）。
      
      KingComments 同起宣告這震耳發聵的金玉誥歌：「神沒有要求拿著摩西懲過刑刀和斷雷執杖來判證祭心，反而搬至這領垂憐憐弱相存、經歷長夜甦生的祭道花杖。人間妄靠言戰與位階稱雄；但天王神國度唯一經久權根，端在那出於空無與黑淵後自天上滿注無限榮活浩命！」（KC）。這表徵洗清世心，催勵群黎扎在無聲之敬愛自空地裡。
