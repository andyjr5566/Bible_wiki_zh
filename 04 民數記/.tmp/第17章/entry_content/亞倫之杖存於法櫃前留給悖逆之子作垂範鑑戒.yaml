name: "亞倫之杖存於法櫃前留給悖逆之子作垂範鑑戒"
type: "文化"
secondary_types:
  - "事件"
  - "神學"
status: formal
definition: |
  神指示把開出聖潔白英並繁結著濃郁美熱杏樹果仁的亞倫天選權枝，永遠從常道生活中提收隔離，直接送返藏蓄放置在見證神櫃的最聖居野之內。此等重器永置並非賣好珍遊，而是一份莊重肅穆、永世警打凡欲挑戰上天任命和擅權背神的頑傲人心之金甲警鐸與垂訓明證；它的留蓄能終歇無理囂囂非難和妄作之口，解救愚民免受冒犯天罰之慘死劫數。
accumulations:
  - book: "民數記"
    chapter: 17
    summary: "至聖天旨宣告將吐豔生實之神異權枝收安見證寶篋側畔殿前，終止民眾逆言且施救存免受橫禍打死。"
    relation: "奠定事主疆土上對悖冒野望的一面永久實物面碑，告白天人界限並以果愛慈顧警息一切人間猜言抗聲。"
    content: |
      在眾位首領紛紛提認回沒得動止枯寒自己故名舊條之後，那本已飽懷天地奇異果芳和發芽榮力的亞倫名仗並沒發往塵世奔誇，乃在永主浩宣之下踏至永遠存真法殿神宮。「耶和華吩咐摩西說：把亞倫的杖還放在法櫃前，給這些背叛之子留作記號。這樣，你就使他們向我發的怨言止息，免得他們死亡」（民十七10）。黃迦勒深致陳點把權棒守入法匣的久遠至高深意：「此實物經證被永收在見證（櫃）堂側，與天授法石書版和一小壇盛納晨天精白珍粒了嗎哪的寶奩成鄰（來九4）；它永豎在那黑野聖堂中作鐵血戒旗與醒警符言，提醒每一世後輩皆莫生犯凶謀挑戰天上浩召，斬絕悖逆世兒那私長妄發之毒舌埋聲！」（CT）。
      
      丁良才與《舊約背景註釋》深度刻析這一存留之永久警示性：「古聖山邦愛以器儀傳史；這永在花發成杏之手奉正向後世宣唱：自尊大王既施其至純分界，便毫無退回或是依言妄喬的餘途；把老木奉存祭宇就是護救愚昧黎苗不用莽闖碰觸炎罰之禍！」（GT）。BibleHub 更加挑揚其對止絕反動和庇持蒼生的厚義：「當百姓因不明主選天天呼痛成恨，此枝就是一座永銘不落神憐真柱，告知爭喧乃直逼上帝威嚴的背亂；把長發美熟花仗安前，是為息怒平心，把平安常還大地」（BH）。
      
      KingComments 同起唱鳴這天糧與天杖雙齊鎮存之永輝和合與儆道：「信群漫跨淒冷荒土征涯，極不可忽除櫃底二天寶：一天賜豐飽純柔生力的嗎哪糧、另則表以出死入生活大中保祭主常候看恩的大靈樹枝！但百姓若未解恩榮必深感懼死畏悚；主手留下神杖，是要千載臣靈學好敬尊聖訓、斬草剷消不滿橫聲！」（KC）。這留證直入骨血化作安息與慎守信銘。
