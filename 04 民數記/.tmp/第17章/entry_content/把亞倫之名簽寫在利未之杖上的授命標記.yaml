name: "把亞倫之名簽寫在利未之杖上的授命標記"
type: "神學"
secondary_types:
  - "事件"
  - "文化"
status: formal
definition: |
  神命令於收取以色列部落十二枝領導名杖之外，明文指派把祭司元帥亞倫這兩字名跡獨力刻題、簽字在歸屬利未宗脈的手杖正面。這般嚴肅之名狀佈令明確彰揚：儘管亞倫為次子哥轄世系，他在耶和華選命法理下代表並兼管著正統利未事主天殿全部主權，奠立了不可僭奪、拒絕人意橫向爭搶的專精大祭司天召職根。
accumulations:
  - book: "民數記"
    chapter: 17
    summary: "上帝特旨交代摩西將大祭司亞倫之稱銜獨署明載於總辦全利未家統的神名大杖之下。"
    relation: "這不僅昭白大祭司領地超越屬血長幼定規，並揭演一切事神顯爵非依世俗才智自圖，唯仰賴造主恩賜獨召任命。"
    content: |
      在神策畫手杖檢測公堂之策進時，上帝下發了震動舊有長子與輩序常態的一句特別律語：「並要將亞倫的名字寫在利未的杖上，因為各族長必有一根杖」（民十七3）。這一簽名手詔承載了超卓光亮、深長難言的釋世要義！黃迦勒深層引導人看到這裡破壞習俗的一面：「依稀看尋早歲宗籍，亞倫只是祖先利未次子哥轄的長系世孫（代上六1-3），理說哥轄甚至非屬首大子長門，但耶和華在此特別挑名下令，在總代全利未宗派的大手仗簽刻亞倫名聲；足顯上帝破定舊格，真把大祭司亞倫提拔升立作整個領奉族派真金的首要統領！」（CT）。
      
      丁良才與精讀本指出：「這裡簽宣神名並重把世襲官位洗清：前事可拉反徒質疑為何單憑亞倫一身獲當高爵祭禮大位？現在上帝正是以親旨寫真，告曉愚頑天下：神選非由眾口決言、也非屬世俗權才較量，而是神權親封，揀選弱愚顯威震辱世才傲狂！」（GT）。BibleHub 同步高揚這項題寫手牌之深長靈啟：「將亞倫二字永隨印烙進那條象徵利未心志之枝一側，更是替日後即至、作榮愛神人和平使者的偉主耶穌預描大象；正如新約引道：祭手爵名絕無憑己妄攬獲封，唯遭王皇選定親詔如同時上帝指立亞倫」（BH；參來五4）。
      
      KingComments 更痛心針砭今日世界自誇競走的迷愚：「大群百姓妄圖借血性武力自抬聲威；神將亞倫簽名一事告申人間：凡是事主官職必倚重賜選與順心低俯。人愛用競爭權鬥索妄事主地位，而在至高者國度底裡，能立定萬丈榮美大功的，皆唯仰順那主定不翻的大王愛旨！」（KC）。此符記深深宣導人心恭默領受分派之恩。
