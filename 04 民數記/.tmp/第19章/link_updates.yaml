book: "04 民數記"
chapter: 19
updates:
  - title: "營外焚燒（machutz la-machaneh saraf）"
    path: "link_folder/主題/營外焚燒（machutz la-machaneh saraf）.md"
    summary: "民數記19:3-8將整場紅母牛贖罰大儀徹底移往前線熱鬧帳地極遠處的「營外」去執行殺害與烈燒，以利亞撒步出靜界瞻觀；牛身無渣地連血同皮骨於荒原火爐間悉數直焚化為寶灰。縱然執行遠在塞野極凶境，仍得向主所坐會棚揮彈血證七回。"
    relation: "加添並落實舊約大極代贖者非能容於潔淨城內受樂、乃須身自越離安適居中挑擔無數暴孽赴至荒涼營表承受苦火的心核教理。"

  - title: "牛膝草"
    path: "link_folder/原文/牛膝草.md"
    summary: "民數記19章把極微草木「牛膝草」分別派充雙軸工差：首於第6節同偉林香柏木、緋厚朱紅線並倒高燒牛焰間混鍛作贖赦之灰；復於18節明命必得由聖淨無禍安人捉持一束鮮濃牛膝草、吸滿牛灰活露灑進病人家牆與心身。"
    relation: "深邃扣聯自從初越埃及逾越血門、利未長篇潔大麻瘋直至終焉挑死贖世裡，仰靠低順小木手揚全盤救主成義寶露的神命長貫。"

  - title: "香柏木（潔淨儀式用）"
    path: "link_folder/文化/香柏木（潔淨儀式用）.md"
    summary: "民數記19:6在宣令全口無斑紅牛受任高燒將結心期，要求將象征天世間至尊永堅耐朽頂端良樹的「香柏木」一把擒置薪火狂炎裡同灰，把林相皇頂跟苦弱牛膝、濃緋血過一道投散往替過犧牲體中熔解。"
    relation: "再次拓展古東非與中亞王朝裡把香柏奇尊充為驅病拒爛王號的神禮傳統，使至端良材順同無欠羔牛在神壇火化成了長世灑洗的本源。"

  - title: "活水（潔淨儀式用）"
    path: "link_folder/原文/活水（潔淨儀式用）.md"
    summary: "民數記19:17闡述何以及如何使乾沉在遙谷帳外的燒灰重臨神蹟效益：不容乾弄散飄，務得捧掏定克灰燼收落良潔器缸，其後長浪直注暢美喜樂的不腐生林奔泉「活水」，二者深相合融而成超強解禍贖污之水。"
    relation: "強力實證死亡所牽延之冰枯惡垢，必定賴靠靈界連奔未止、代表全神豐盛喜樂跟不衰新命之澎湃生水沖沐融化方臻無殃安樂。"

  - title: "死屍不潔"
    path: "link_folder/神學/死屍不潔.md"
    summary: "民數記19:11-16詳細鋪寫凡間民眾因為面對喪逝而落墮死亡污染之種種嚴厲實況：既觸人屍即落「七日不潔淨」大禁；無論親踏長征被刺鋒割死者、郊路倒骨乃至枯古墓山，或踏居同留於告垂之內帳，其房家杯皿人影同罹一席凶污禁限。"
    relation: "徹底把死亡是世人離斷上上帝命河後罪孽最沉苦果的概念予以法定烙字：宣告主聖決無法安然目視未除死煞狂搖，須仰活水雙度贖滌。"

  - title: "第三日"
    path: "link_folder/神學/第三日.md"
    summary: "民數記19:12、19揭明從長天七夕沾死穢孽裡步往全康之門的核心開局點：身罹觸死殃愆之人必不可緩推慢懶，勒令「他要在第三日和第七日用這水潔淨自己」，未於第三日領洗彈露即無法登門解救抵邁第七天的休泰泰運。"
    relation: "強化古經裡數字「三」往往乘載拯救啟始與突破早喪晦暗的神學紀綠：宣昭復甦決非憑空突現，必立關於第三日先獲洗愆大證的主旨。"

  - title: "剪除（kareth）"
    path: "link_folder/原文/剪除（kareth）.md"
    summary: "民數記19:13及20兩輪深發威霆刑論：如遇百姓無知觸及死去亡靈、身纏死禍之際，仍驕揚傲放、堅持拒不跪赴活水牛灰求赦自灑除悔者，上帝指斷其愚乃直接玷辱冒犯造者榮妙御帳，「這人必從以色列中剪除」。"
    relation: "證實「剪除」重典不僅只落罰向拜邪大妖、犯血違主之奸徒，對那把上神既備代獻活洗當作閒輕不顧、頑攜腐污踞身榮營者，同一刃拔斷。"
