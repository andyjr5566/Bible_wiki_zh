book: 04 民數記
chapter: 19
updates:
- title: 營外焚燒
  path: link_folder/主題/營外焚燒.md
  summary: 第3、5節：紅母牛「必牽到營外，人就把牛宰在他面前」，接著「人要在他眼前把這母牛焚燒；牛的皮、肉、血、糞都要焚燒」。第9節連灰也存在營外潔淨的地方。
  relation: 本章的營外焚燒與利4、利16 的贖罪祭牲不同：那些是先在壇上獻血、再把餘體搬到營外；紅母牛從頭到尾都在營外，連血也不上壇。GT《民數記串珠聖經註釋》指出理由：牛要在營外宰殺，「因為它代替一切不潔淨的人，而他們都要在營外住一段時間」；而血向會幕彈了七次之後，「其餘的血則要燒掉，這與一般處理祭牲之血的方法不同」。GT 丁良才《民數記註釋》把「到營外」讀成預表：「預表主耶穌在耶路撒冷城門外受苦（來十三11-12）。」CT 對此加了一層很重的解釋：營外是神不與人同在的範圍，「就是神的兒子擔當人的罪的時候，神也掩面不看祂」。
- title: 牛膝草
  path: link_folder/原文/牛膝草.md
  summary: 牛膝草在本章出現兩次，角色完全不同。第6節它與香柏木、朱紅色線一同被丟進燒牛的火中，成為灰的一部分；第18節它變成工具：「必當有一個潔淨的人拿牛膝草蘸在這水中，把水灑在帳棚上，和一切器皿並帳棚內的眾人身上」。
  relation: GT《舊約聖經背景註釋》解釋為什麼是它：「用牛膝草的原因，是因為其枝條多毛，能夠吸收水分。」CT 的說明相同，並指出牛膝草是一種生長在牆上石縫中的草本植物。GT 丁良才《民數記註釋》把它列為潔淨的標幟。KC 則從灑水的人身上讀這根草：他必須用溫柔謙卑的心對待不潔淨的人，倚靠的是神的話與那證明祭已獻完的灰，不是自己的知識或見識。STEP 原文資料顯示第6與第18節用的是同一個字 אֵזוֹב（e.Zov，H231，詞典義 hyssop）。
- title: 香柏木（潔淨儀式用）
  path: link_folder/文化/香柏木（潔淨儀式用）.md
  summary: 第6節：「祭司要把香柏木、牛膝草、朱紅色線都丟在燒牛的火中。」這三樣東西與利未記14:4 潔淨大痲瘋者所用的完全相同。STEP 原文資料顯示本節的「香柏木」是 עֵץ（etz，H6086G，wood）加 אֶרֶז（E.rez，H730，cedar），與利14:4 的組合一致。
  relation: GT 丁良才《民數記註釋》給它的定位是：「香柏木，就是有馨香和不朽壞的標幟」。GT《聖經精讀本──民數記註解》說明它為何象徵永生：香柏木是不易腐爛、有光澤和香氣的樹，能長時間保存。KC 與 CT 走的則是另一條線：香柏木代表人天然的偉大，牛膝草代表人天然的渺小，兩者一同投入火中，表示無論人的好或人的壞，只要與罪發生關係都不能存留。CT 的〔話中之光〕引王上四33 說明這個對照的來源：所羅門的智慧從香柏木一直講到牛膝草，意思就是包括整個世界。
- title: 活水（潔淨儀式用）
  path: link_folder/原文/活水（潔淨儀式用）.md
  summary: 第17節：「要為這不潔淨的人拿些燒成的除罪灰放在器皿裡，倒上活水。」STEP 原文資料顯示這裡的組合與利14:5 完全相同——מַיִם（Ma.yim，H4325G，water）加 חַיִּים（chai.Yim，H2416A，詞典義 alive），字面就是「活的水」。
  relation: CT 的〔原文字義〕註「活」是活、流動的，並說明「活水」指流動的水，調製的方法是把除罪灰和活水放進器皿裡。這正是該條目定義中 GT 丁良才《民數記註釋》所提的另一個用途——用紅母牛的灰調除污穢水時也必須用活水。本章因此成了利14 之外，活水在潔淨儀式中的第二個正式出處：一邊是死透了的灰，一邊是流動不止的水，兩樣調在同一個器皿裡才成為除污穢的水。
- title: 死屍不潔
  path: link_folder/神學/死屍不潔.md
  summary: 本章是這條規定的完整條文。第11節定下期限：「摸了人死屍的，就必七天不潔淨」；第14至16節列出範圍：人死在帳棚裡的、進那帳棚的、帳棚裡的所有人、在田野摸了被刀殺的、屍首、人的骨頭、墳墓的，都是七天。第22節再補一層傳染性。
  relation: 'GT 丁良才《民數記註釋》把輕重分了出來：「唯獨摸人死屍的不潔七日，摸別樣走獸的死體不潔到晚（22，利十一28）。人的死乃是罪的工價，所以摸人的死屍，比摸別樣動物之死屍，所染的不潔更大。」GT《舊約聖經背景註釋》另提供跨文化的對照：「美索不達米亞和古以色列雖然沒有清楚的來生觀念，卻依然有死者的靈能夠影響活人的信念」，而美索不達米亞的南布爾比儀式顯出他們對屍體所導致的不潔相當畏懼。STEP 原文資料顯示第11節的「人死屍」是 נֶפֶשׁ（Ne.fesh，H5315M，詞典義 soul: dead）加 אָדָם（a.Dam，H120G）；同一個 נֶפֶשׁ 在第13、20節指的卻是活人（H5315J，詞典義 soul: person）——死的是它，被剪除的也是它。'
- title: 第三日
  path: link_folder/神學/第三日.md
  summary: 第12節：「那人到第三天要用這除污穢的水潔淨自己，第七天就潔淨了。他若在第三天不潔淨自己，第七天就不潔淨了。」第19節重複同一個時程，並加上第七天洗衣、洗澡、到晚上才潔淨。
  relation: CT 把兩個日子都讀成預表：「『第三天』是主復活的日子，此處表徵承認主復活是為使我們稱義(參羅四25)；『第七天』七是完全的數目字，表徵從不潔淨中得著完全的釋放。」BH 指出第三天在聖經的類型學裡常與復活和新的開始相連，並舉何西阿書6:2 為例。不過各家並非一致：GT《民數記串珠聖經註釋》直說「這裡沒說明選擇這些數字的原因」，GT 丁良才《民數記註釋》也只給功能上的理由：「特要表明這污穢是何等大，甚不容易除掉。」創22 的第三日是亞伯拉罕舉目看見那地方，本章的第三日則是一個不能錯過的期限——錯過它，第七天就不算數。
- title: 剪除
  path: link_folder/原文/剪除.md
  summary: 本章兩次使用剪除，範圍用詞不同。第13節：「這人必從以色列中剪除」；第20節：「要將他從會中剪除，因為他玷污了耶和華的聖所。」
  relation: 'STEP 原文資料顯示兩處都是 וְנִכְרְתָה（ve.nikh.re.Tah，H3772I，詞典形 כָּרַת，詞典義 to cut: eliminate）的被動形，與利7、民9、民15 是同一個形式；差別在後綴的範圍：第13節是從以色列，第20節是從 קָהָל（ka.Hal，H6951，詞典義 assembly）當中。本章的違例對象與前面各處都不同——不是吃錯東西、不是拜偶像、也不是擅敢行事，而是沾了死屍卻不肯用神已經預備好的水潔淨自己。CT 因此對刑度留了餘地：「這不是永遠沉淪，因為在埃及逾越節羔羊血的效力尚在；這不過將他從神之聖民的會中剪除。」'
- title: 彈血七次
  path: link_folder/主題/彈血七次.md
  summary: 第4節：「祭司以利亞撒要用指頭蘸這牛的血，向會幕前面彈七次。」STEP 原文資料顯示動詞正是 הִזָּה（hi.Zah，H5137A，詞典形 נָזָה，詞典義 to sprinkle），與利4:6、17 同字。
  relation: 這是彈血七次唯一一次不在聖所之內、而是在營外朝著會幕的方向進行。GT《民數記串珠聖經註釋》說明它的作用：「將血向會幕彈七次，表示這血能恢復神人的溝通」；GT 丁良才《民數記註釋》則從獻祭的定位說：這樣彈血是表明完全獻與神的意思，「這樣母牛就成了祭物」。CT 註「彈七次」表徵完全贖罪。另一個與利4 不同的地方是剩血的處理：利4 的餘血倒在壇腳，本章的餘血卻連皮、肉、糞一起燒掉。STEP 另顯示本章第13、20節說「沒有灑在他身上」時用的是 זָרַק（zo.Rak，H2236，詞典義 to scatter），與這裡的 נָזָה 不是同一個字。
- title: 藍色、紫色、朱紅色線
  path: link_folder/主題/藍色、紫色、朱紅色線.md
  summary: 第6節：「祭司要把香柏木、牛膝草、朱紅色線都丟在燒牛的火中。」這是三色線中的朱紅色線單獨出現在潔淨儀式裡的又一處，與利14:4 用法相同。
  relation: STEP 原文資料為該條目定義裡的說法提供了直接印證：本節的「朱紅色線」是 שָׁנִי（she.Ni，H8144，詞典義 scarlet）加 תוֹלָעַת（to.La.at，H8438B），而後者的詞典形 תּוֹלֵעָה 的詞典義正是 worm（蟲）——也就是 GT《丁道爾》在出埃及記所說「朱紅色」直譯作紅蟲、所指的是胭脂蟲。至於它在本章的象徵，GT 丁良才《民數記註釋》給了雙重解讀：「朱紅色線，就是罪惡的標幟（賽一18），也是贖罪血的標幟（利十七11）」；KC 的讀法不同，他把朱紅色理解為地上的榮耀，而那榮耀在神面前同樣站立不住。
- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  summary: 第3至4節：「交給祭司以利亞撒；他必牽到營外，人就把牛宰在他面前。祭司以利亞撒要用指頭蘸這牛的血，向會幕前面彈七次。」這是以利亞撒第一次獨立主持一項全國性的禮儀，而不是在亞倫手下辦事。
  relation: 為什麼不是亞倫，兩份 GT 材料給了同一個答案的兩面。GT 丁良才《民數記註釋》說：「神吩咐以利亞撒，不吩咐亞倫，是因為亞倫不敢污穢自己」；GT《民數記串珠聖經註釋》說明制度上的根據：「大祭司亞倫有聖職在身，不可接觸死屍及出聖所」。CT 補上實務上的顧慮：由以利亞撒代表亞倫監督宰殺紅母牛，「以免大祭司暫時不潔淨(參7節)而危及職務」。KC 從預表讀這個安排：神救贖計畫裡具體執行的都是作兒子的。值得對照的是，民16 他才剛奉命把二百五十個香爐錘成壇的包片；到民20:26 他就要在何珥山接受亞倫的聖衣。
- title: 永遠的定例
  path: link_folder/神學/永遠的定例.md
  summary: '本章兩次使用這個立法用語。第10節：「這要給以色列人和寄居在他們中間的外人作為永遠的定例」；第21節：「這要給你們作為永遠的定例。」STEP 原文資料顯示第21節正是該條目定義所列的那兩個字：חֻקָּה（chu.Kat，H2708，詞典義 statute）加 עוֹלָם（o.Lam，H5769G，詞典義 forever: enduring）。'
  relation: 本章的用法有一個利未記各處沒有的特點：第10節把寄居的外人與以色列人並列在同一條定例之下。GT 丁良才《民數記註釋》讀出它的射程：「這樣看來，神所賜借著耶穌基督贖罪的應許，不但是為猶太人和他們的子孫，也是為一切在遠方的人（參徒二39）。」KC 的說法相同：除去不潔的可能不只給以色列人，也給寄居的，主耶穌獻祭的價值與應用不限於一個國族。CT 對第21節的註解則強調不可更改：本章的律例是永遠不可更改的。
- title: 潔淨之地
  path: link_folder/地點/潔淨之地.md
  summary: 第9節：「必有一個潔淨的人收起母牛的灰，存在營外潔淨的地方，為以色列會眾調做除污穢的水。」CT 指出經文的「地方」原文是單數詞，因此解經家推定就是利4:12 的營外倒灰之所。
  relation: CT 另記下一個猶太傳統：「根據猶太人的傳說，被分存在三個地方：(1)一份存在聖所之內；(2)一份存在橄欖山上；(3)第三份則分別存在利未人的儲物室內」——但他把這則傳說與經文的單數用詞並列，沒有採信。本章的用法與利4、利6 同中有異：利未記的倒灰之所承接的是壇上祭物燒剩的灰，本章存放的卻是一整隻在營外燒盡的紅母牛的灰，而且不是廢棄物，是要長期保存備用的材料。STEP 原文資料顯示第9節的「存」是 מִשְׁמֶרֶת（mish.Me.ret，H4931），字面是留下來看守的東西——這塊地在本章是倉庫，不是垃圾場。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: '第9節末句「這本是除罪的」與第17節的「除罪灰」，在原文用的都是 חַטָּאת（cha.Tat，H2403H，詞典義 sin: sin offering）——也就是贖罪祭那個字。第17節字面是贖罪祭燒剩之物的塵。'
  relation: 這造成一個有意思的張力：紅母牛不上壇、血不倒在壇腳、也不由大祭司主持，GT《啟導本聖經註釋》因此說它「卻不是作獻祭用」；KC 更直接主張紅母牛不是在對付罪，而是在對付死亡的接觸所帶來的玷污。但經文本身仍用贖罪祭的名稱稱呼它，GT《民數記串珠聖經註釋》也指出除污水潔淨的儀式含有贖罪祭所需要的一切成分，並把它稱作「快速贖罪祭」。GT《SDA聖經注釋》為這個字寫了整段，指出它意為走錯、滑腳，也可以指罪責，並判定本章所達到的是儀文性質的潔淨。
- title: 不潔之人出到營外
  path: link_folder/主題/不潔之人出到營外.md
  summary: 該條目定義的對照表已經引用本章：因死屍不潔淨的人，不潔期是七天（民19:11）。本章給的正是那條規定的完整條文，以及民5 沒有寫的部分——怎樣才能結束那七天。
  relation: 民5:2-3 只說要把因死屍不潔淨的人送出營外，理由是「免得污穢他們的營；這營是我所住的」；本章第13節把後果講得更重：不潔淨自己的人「就玷污了耶和華的帳幕」。兩章合起來才是完整的制度：民5 是隔離，民19 是復原。GT《啟導本聖經註釋》說明本章要解決的實際問題：過去不潔的人是趕出營外，但接觸死人的不潔「且能傳染他人」，若營中有人死了全營都可能染上，因此必須設計一種方法可以去除因死亡招來的不潔。
- title: 意外沾染死屍與重新潔淨條例
  path: link_folder/事件/意外沾染死屍與重新潔淨條例.md
  summary: 民6:9 拿細耳人身旁忽然有人死了，先前的日子要歸徒然——那條特例所依據的通則就在本章：「摸了人死屍的，就必七天不潔淨」（v11），而且「那人到第三天要用這除污穢的水潔淨自己，第七天就潔淨了」（v12）。
  relation: 兩章的程序可以並排看：民6 的拿細耳人在第七日剃頭、第八日獻兩隻斑鳩或雛鴿，外加一隻一歲公羊羔作贖愆祭，並要重新起算離俗的日子；本章的一般百姓只需在第三天與第七天各灑一次除污穢的水，第七天洗衣洗澡，到晚上就潔淨了，不必獻祭。差別正好量出拿細耳人的誓願有多重——同一件無法預防的意外，在一般人身上是七天，在拿細耳人身上是整段誓願重來。
- title: 不可挨近死屍（拿細耳人的潔淨）
  path: link_folder/主題/不可挨近死屍（拿細耳人的潔淨）.md
  summary: 該條目提到 BH 在民6 指出摸死屍使人在禮儀上不潔（利21:1-3、民19:11-13），本章就是那條引註的出處：第11節定七天的期限，第13節說明不潔淨自己的後果是玷污帳幕、被剪除。
  relation: 把兩章並排，拿細耳人的嚴格程度就量得出來。本章的通則允許一般人沾染之後照程序潔淨，第七天日落就恢復；民6:7 卻規定拿細耳人「他的父母或是弟兄姊妹死了的時候，他不可因他們使自己不潔淨」——不是沾染之後怎麼辦，而是根本不許沾染。GT 丁良才《民數記註釋》在本章另記下一個實務上的效果：這幾節「吩咐以色列人速速地埋葬他們的死人」——因為不潔會傳染，屍體留在營中的時間越長，受影響的人越多。
- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: 本章 22 節之內反覆使用這組分類：不潔淨到晚上、七天不潔淨、潔淨的人、污穢還在他身上、就潔淨了。STEP 原文資料顯示這是同一批字根的正反兩面——動詞 טָמֵא（ta.Me，H2930A，詞典義 to defile）在本章出現 12 次，形容詞 טָמֵא（H2931，詞典義 unclean）6 次，而正面的一側是 טָהוֹר（ta.Hor，H2889，詞典義 pure）與動詞 טָהֵר（ta.Her，H2891，詞典義 be pure）。
  relation: 本章把該條目的核心區分推到極處：不潔淨不等於犯罪。摸到死屍是難以避免的事，經文從未責備沾染的人；真正被責備的是不肯潔淨的人（v13、20）。GT《啟導本聖經註釋》還替整套分類的合理性說了一句話：「也許有人認為這種儀式屬原始社會所為，跡近迷信。現代人類學家已知道，儀式所反映的，是一個社會對生命最深刻的認識，並非源於無知。」GT《聖經精讀本──民數記註解》則歸出兩個目的：教育人神是絕對聖潔的，以及屬神的百姓也應該聖潔。
- title: 潔淨痲瘋者的兩鳥儀式
  path: link_folder/主題/潔淨痲瘋者的兩鳥儀式.md
  summary: 第6節丟進火中的香柏木、牛膝草、朱紅色線，正是利14:4 兩鳥儀式所用的同一組材料；第17節調水用的「活水」也與利14:5 相同。
  relation: GT《啟導本聖經註釋》直接把兩者連起來：除污水潔淨的儀式含有贖罪祭所需要的一切成分，而香柏木、牛膝草、朱紅色線「是潔淨皮膚病用的東西（利十四4），也都燒在灰中（6節）」。KC 的說法相同：這三樣東西也見於痲瘋病人的潔淨（利14:4）。兩套儀式的形狀也相似——都在營外進行、都要灑七次或分兩階段、都以洗衣沐浴收尾，但材料的用法剛好相反：利14 是把三樣東西蘸在鳥血與活水中灑出去，本章是把它們燒成灰再調成水。
- title: 古代近東的替罪與潔淨儀式
  path: link_folder/背景/古代近東的替罪與潔淨儀式.md
  summary: GT《舊約聖經背景註釋》在本章給了三段跨文化材料：因屍體致不潔的觀念、赫人與美索不達米亞的淨化儀式，以及以水消除不潔的作法。
  relation: 第一段講屍體。同一份註釋說：「美索不達米亞和古以色列雖然沒有清楚的來生觀念，卻依然有死者的靈能夠影響活人的信念」，赫人怕的是在死者的靈面前不潔，而美索不達米亞的南布爾比儀式顯出他們對屍體所導致的不潔相當畏懼。第二段講儀式本身：赫人儀式也證實了使祭司暫時不潔的，「包括了儀式本身，以及用來淨化人之調劑的原料」——正好對應本章第7至10節與第21節那個奇特的規定。第三段是同一份註釋畫出的分界：「赫人的儀式雖然也包括洗身、獻祭、隔離，但古代近東淨化儀式細節最為詳盡的，大概還是首推聖經。」與利16 記載的替罪羊平行資料合看，同一份來源在兩章都採取相同的取態：形式上有平行，動機與範圍卻不同。
- title: 紅母牛預表基督城外受苦（來13：11-12）
  path: link_folder/互文/紅母牛預表基督城外受苦（來13：11-12）.md
  summary: 該條目的定義寫的就是本章第3、5節——紅母牛被牽到營外宰殺焚燒。本章是這段預表的舊約出處本身。
  relation: GT 丁良才《民數記註釋》在第3節直接點名：「到營外」「預表主耶穌在耶路撒冷城門外受苦（來十三11-12）」。CT 的說法相同，並補上一層：營外是神不與人同在的範圍，「就是神的兒子擔當人的罪的時候，神也掩面不看祂」。KC 引來9:13-14 把兩者接在一起：公牛山羊的血與母牛的灰若能叫人的身體潔淨，何況基督的血。BH 在第3節也指出，把祭牲帶到營外預示了耶穌在耶路撒冷城外被釘。利16 的贖罪日祭牲是血帶進聖所、身體燒在營外，本章的紅母牛則是從頭到尾都在營外——來13:11-12 的兩個要素在本章合成一個畫面。
- title: 不潔淨被剪除預表拒絕恩典滅亡（來10：26-29）
  path: link_folder/互文/不潔淨被剪除預表拒絕恩典滅亡（來10：26-29）.md
  summary: 該條目的定義寫的就是本章第13、20節。本章是這段預表的舊約出處本身：「凡摸了人死屍、不潔淨自己的，就玷污了耶和華的帳幕，這人必從以色列中剪除」（v13）；「但那污穢而不潔淨自己的，要將他從會中剪除，因為他玷污了耶和華的聖所」（v20）。
  relation: 兩處經文的對應點在於明明有辦法卻不肯用。CT 說本章被剪除的人「若他本人不肯配合潔淨自己，仍然無效」；KC 把同一件事講成一句話：叫我們致命的不是罪，而是不肯使用神所賜下的潔淨方法，並引林前5:13 說明不肯悔改的人必須從教會中被除去。GT《SDA聖經注釋》的判定與此一致：在神吩咐需要使用的時候沒有按規定用除污穢的水，就是犯了使人與神的憐憫隔絕的嚴重罪行。不過 CT 對刑度留了餘地：「這不是永遠沉淪，因為在埃及逾越節羔羊血的效力尚在」。
- title: 玷污耶和華的聖所與帳幕
  path: link_folder/神學/玷污耶和華的聖所與帳幕.md
  summary: 第13節說不潔淨自己的人「就玷污了耶和華的帳幕」，第20節說「他玷污了耶和華的聖所」。STEP 原文資料顯示兩節用的不是同一個詞：第13節是 מִשְׁכַּן（mish.Kan，H4908，詞典義 tabernacle），第20節是 מִקְדַּשׁ（mik.Dash，H4720，詞典義 sanctuary）；剪除的範圍也分別是「從以色列」與「從會眾當中」。
  relation: 本章的玷污來自屍體，是接觸性的；利20:3 的玷污來自把兒女獻給摩洛，不必發生在聖所之內。兩種來源合起來說明同一件事：神既住在百姓中間，發生在百姓中間的事就碰得到祂。CT 在本章指出這是連帶責任：「表示一個人的不潔淨，不僅關係到他自己，甚至會影響到全會眾，乃至神的居所(參利十五31)。」GT 丁良才《民數記註釋》說同一件事並拉到今天：「人的不潔，不但關係自己，也是與神和神的百姓有連帶的關係，到如今罪的影響還是這樣。」
