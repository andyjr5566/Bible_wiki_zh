name: "純紅沒有殘疾且未曾負軛母牛為除罪救贖表徵"
type: "神學"
secondary_types:
  - "文化"
  - "主題"
status: formal
definition: |
  在中東獻祭傳承中，耶和華向摩西與亞倫頒布了一條極其特殊而至尊的除污穢律例，命定百姓奉獻一隻「毫無殘疾、毫無瑕疵、從不曾肩扛世事負上重軛的純紅母牛」。這隻被千裏千挑而出的紅土妙物在救贖架構下承擔著生命與洗禮的重任：純紅象徵充盈血液與犧牲聖火的深色，表徵祂完全純全無疵的品德；未負重軛證實祂不受世界常道操役拘禁；其選定為母牛而非公牛，更彰顯出主在基督信民心懷之中深厚慈柔、生育活潑並洗浴每一滴過往現在未來的生命力量。
accumulations:
  - book: "民數記"
    chapter: 19
    summary: "神宣告調製潔淨罪染灰水的第一定則，勒令以色列人領往宰場一頭全然聖美未曾經受塵界牽制擔軛的純紅雌牛。"
    relation: "向干犯死靈罪染的人類世態敞開救恩大源，明證惟得一體毫無玷瑕、獨具純粹順命品德的新造真聖，方有資格替大黎民頂擔死污。"
    content: |
      當全以色列正為自己動輒冒撞至聖天地即須面臨浩大疫殛的駭命悲局苦喊於野時，創造王長宣解救迷徒的頂禮密訣：「耶和華命定律法中的一條律例乃是這樣說：你要吩咐以色列人，把一隻沒有殘疾、未曾負軛、純紅的母牛牽到你這裡來，交給祭司以利亞撒...」（民十九2-3）。黃迦勒在詳深解經中痛表這靈恩救賜的核心厚深：「聖道慣以公畜擔表外面剛毅雄健的見證法度，唯此一回特以雌牛領場！蓋世人間受沾死塵與自暴之愆者，所需並非定罪烈光，而是深深深入心思血靈大處、日夜替換活水新生能力的救靈慈性！且牛背決不動借一尺凡世枯木軛犁，證明神救主的受差本為屬天至美的大樂喜心，世間權謀毫無權勢凌越打擾！」（CT）。

      丁良才與舊約文化背景註解把古近東獻神極珍動物的信仰嚴整化作靈光：「希伯來禮學講究全體一式；紅色表顯寶血溫厚和火燔長香。古邦群生往往視神祀為殘餘餽留，唯全能宰神大斥這貪吝幽心：替你背起絕禍的救主決非傷寒劣木，必定是毫點無玷、純一甘貞的最聖供品！」（GT）。BibleHub 亦徹言頌讚基督替罪的大工：「此母牛被拉往孤荒野鄙之地斷命，繪製了主真王身陷城垣境外、受難苦擔千重災恥的宏愛喜歌！」（BH）。

      KingComments 更有力申論斯血牛之誓如何平定驚走奔避的會徒心痛：「眾民每自嗟身遭咒詛常墜暗途；真主指示：那永遠的喜福不是你們天天追捕不犯錯，而是早已有一首極鮮美純愛的神之羔共伴犧性付出所有血香，將其長春真道灑遍你罪痕盡平的地方！」（KC）。此筆垂輝奠立神恩代刑的至善根基。
