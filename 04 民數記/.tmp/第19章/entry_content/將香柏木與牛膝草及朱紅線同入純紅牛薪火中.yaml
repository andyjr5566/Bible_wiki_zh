name: "將香柏木與牛膝草及朱紅線同入純紅牛薪火中"
type: "文化"
secondary_types:
  - "神學"
  - "主題"
status: formal
definition: |
  在中東焚燒除罪母牛的祭典流程裡，祭司當於紅牛炎火起燎之夜將三項意涵深重而迥異的古聖逸品同步丟送置底：象徵千載雄姿與浩偉名木的大神山香柏、表徵孤卑極微、貼縫生崖的小牛膝草，與直指凡間深重血心難洗瑕累的丹赤朱紅絲線；這般一視同仁地全數傾倒入替身火焚沉淵的大舉，標定出無論人間極偉極良亦或愚愚小民、並世境浩瀚無窮深長舊惡，皆隨同被死身全倒付火化盡，昇發基督得勝同死徹底洗清浩蕩恩華。
accumulations:
  - book: "民數記"
    chapter: 19
    summary: "當紅木狂烈升煙將牛軀銷盡時，神宰諭知主司須執長美之香柏木、山陰微小之牛膝草及表徵塵愆血誓的朱紅綿縷同歸入火焰狂灰之深域。"
    relation: "藉由香草紅絲跟隨著犧牛化焰成燼，宣白基督十字重苦擔付全球頂天下界乃至浩無遺免的一切血孽污情。"
    content: |
      在營外孤境焚祭的火焰轟起際遇，一幅超凡脫俗、匯聚古老希伯來文化智慧與未來神意同死的深宏畫面震動神徒眼界：「人要在他眼前把這母牛焚燒；牛的皮、肉、血、糞都要焚燒。祭司要把香柏木、牛膝草、朱紅色線都丟在燒牛的火中。」（民十九5-6）。黃迦勒以超時光神旨大徹妙經：「讀索羅門王睿智傳道即曉，香柏與牛膝分踞世界林本兩隅──一是干霄淩極的最尊巨擘，另一則是卑小貼泥、尋常崖壁叢草，兩者環繞融和正繪築整個自然世界萬有的始與終！至於那殷殷烈烈難拔消去的朱紅色線，豈不是先知宣告我眾斑爛染血罪污的明訓？這全投火坑一回同滅共燼的悲歡長劇，乃向蒼穹宣布：天地各行傲功劣情，皆跟隨著主羔全拋舊途，共遭重薪化作毫無自豪的純平細灰！」（CT）。

      丁良才與拾穗則把這禮典溯本求源剖至內心：「人當常抱守傲慢與保留之心，偶謂良才智秀如香柏得居自驕，又常泣苦賤孤身成草芥莫自救；上帝在此昭昭揚智：若未經神恩薪火除妄成淚，極名豪門亦如微塵無救！朱紅線表出生命牽綿不斷的俗累，一併拋下那母牛滾滾煙霞室中，便成了千回洗滌永不可渝的除穢寶灰！」（GT）。BibleHub 亦直呼這段神話乃解圍人間苦鬥的至勝鑰匙：「世態常常依依眷憐自尊名爵，或悲歡墜苦死途；此香柏草紅一火而無餘留遺威的好證，直將人類自為傲負徹底剪滅於十字救靈的勝歌之中！」（BH）。

      KingComments 再推此灰工向天國百姓顯出的和平無私親力：「人何苦怨嗟自身位卑身微不足當神僕，又怪傲權名將遠揚絕岸？這香柏巨木與牛膝芳草共赴牛灰一體成潔的奇功，令全宇宙在主死復活榮安之前同享至美和融；只要倒上甘美天降的一滴生命流蘇活水，極深重罪的朱紅即被沖散還甘，成一片光華晶麗的好家山！」（KC）。此筆大讚上帝公義平視與宏悲莫測的大恩愛。
