name: "向會幕前彈紅母牛的血七次"
type: "文化"
secondary_types:
  - "神學"
  - "主題"
aliases: []
status: "formal"
source_scope: "collected_only"
definition: |
  在民數記第十九章所規定的紅母牛潔淨大儀上，除了將整體牛身上的精血豪灰一并直化薪山之外，在殺斷牛喉、母牛將仆之關門時刻，聖傳指定之代任高官大司祭以利亞撒必須專程履行一趟震驚鬼神而含括嚴謹古敘的血契宣揚：「以利亞撒要用手指蘸這母牛的血，向耶和華會幕的前面彈了七次。」這一串沉凝且深具象徵的儀式動作，將這個破例被安置於荒野「營外」執行的代贖工場，同榮嚴偉麗的天上帝都大殿建立了最根本、不可撼斷的主導維繫。
  丁良才《拾穗》、黃迦勒之《文摘》及相關文獻（包含《舊約聖經背景註釋》）皆著力辨註這樁特異神務的心要結構：一般而言，常態之平罪禮品皆拉抬入聖堂內院銅座或是直抹幕角與金香長床；惟獨紅母牛必須依背負眾衰死染之極凶寓意全被放遣逐至於喧嘩世民大營邊線之極處宰殺。若乏神明主權的公然驗契，此宰難與常俗荒野割牲或凡殺取肉作分；是故以利亞撒不單要遠赴城表見證血刃，尤緊欲用正齊的手指深深黏攜未乾良血，毅然轉頭定格於億方民眾營心最浩之那方神榮所鎮——主耶和華會幕的前面，長身一氣綿連連撒狂彈七輪純美血雨。 KingComments 與 BibleHub 精闢斷析：數字「七」在出埃及與西乃經紀間一連出任天平圓滿及徹底稱聖的核心密鑰；面對天廷向空彈七度好血，不啻是在眾仙千靈與上帝金榻直臨的大面目底，宣布該紅牛犧牲的生命血價已經徹底付帳成實、蒙上帝歡樂直悅並予以悉封登賬。如此一來，日後這份被燒殘所收下的百斤除殃神灰與長生溪活水相聚化洗之際，便永遠帶有那一連七次在殿面宣告全赦好血的絕世強贖法威。
