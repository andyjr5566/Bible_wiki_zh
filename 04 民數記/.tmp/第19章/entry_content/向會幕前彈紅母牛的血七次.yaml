    summary: "規定在大宗親授祭長以利亞撒長出營外監斬無玷紅牛之後，要用血脂深濃之右足手指，朝向遠方中央榮耀上帝安居的大會幕門宇前緣一氣長貫彈灑整七輪鮮血大雨，作代除罪負全赦見證。"
    relation: "解釋與連接為何本屬驅往「營外」鄙野的焚殘工役，經能以神權第一的法庭大格與上主會所中核心慈杯建立深密同慶；闡明洗罪血印與天地主心誓還無缺的完美勾勒。"
