name: "玷污造主帳棚怠隳潔淨典例者得自大聚會剪除"
type: "神學"
secondary_types:
  - "文化"
  - "主題"
status: formal
definition: |
  在古希伯來神學與禮俗法網內，死亡一氣不但屬罪厄沉霜之盡頭，且屬極嚴重干擾耶和華純愛光盛聚止地的污染危禍；若有人於凡途無心或遇故觸摸死骸沾納屍穢，卻在日後狂然自傲、怠於追求紅牛甘水於三日七日的解罪灌注，其嚴重後果定不上算簡單私人遺忘，而係被控立下毀滅至新榮耀神帳、冒瀆上帝聖所的大妄逆愆；如此抗法傲妄不順之奴，必獲受神權鐵斧揮判、自榮富萬代熱戀成大社群中全然斬絕並予以無情剪除。
accumulations:
  - book: "民數記"
    chapter: 19
    summary: "神宰兩番厲厲出死命令，決心驅懲敢於抱守屍臭死風卻不求除穢活水遍滌的頑逆者，嚴判彼犯天條侵墮居幕必獲連邦剔盡之災。"
    relation: "向干犯聖地潔和秩序的傲然黑徒宣告永遠刑判，彰表神權嚴守無疵聖域以及必拒死亡染臭進抵永享美泉之地。"
    content: |
      除穢草水之所以貴為以色列群族性命攸關之至重憑藉，並不但緣於除災求安之微願，而在於防阻浩瀚無敵的新榮神權面臨人意腐氣沾凌：「凡摸了人死屍、不潔淨自己的，就玷污了耶和華的帳幕，這人必從以色列中剪除；因為那除污穢的水沒有灑在他身上，他就為不潔淨，污穢還在他身上... 但那污穢而不潔淨自己的，要將他從會中剪除，因為他玷污了耶和華的聖所...」（民十九13, 20）。黃迦勒探入經髓、直戳神怒最深切的痛關：「神是至高賜生命的浩活本源！死亡則是仇叛撒但在地上狂步落淚的苦腥印記，上帝豈看得慣這股冷沉氣團在你心殿打坐稱主？一日不出營求活水分靈、一日便算輕慢無赦主工，更是放蹤自己變成阻隔天地安交的危性仇魁！自取被逐自邦中永遠剪除！」（CT）。

      丁良才與拾穗隨往古中近東盟群法律申析剪除大令的雷嗔：「猶太古德咸認剪除雖未盡言頓斷今世長齡，亦指絕其千孫萬支與天家祈祐的樂緣；蓋個人一時疏縱無悔，竟致死雲漫漫隨行進居神王近幄的榮屋中！這等傲玩狂姿比原罪本身越加密惡、絕不容忍留留於潔陣內！」（GT）。BibleHub 把這道嚴威看作捍衛靈海新境的主樑鋼索：「世人多以為偶帶老死情習步進教堂並非要厄；此篇兩翻鐵指『玷辱聖境必被除剪』，昭示造王決心揚淨群邦，不借片瓦留與死陰藏慝！」（BH）。

      KingComments 更痛烈警示每一世受洗稱奴的信民要緊擁悔心自謙：「看顧自己腳步極其危切！並不用你力鬥萬丈魔城，只消你坐默驕盈不背身拜請那母牛之紅灰並生命靈流將你刷淨，便成了一塊惹怒主權、毀害兄弟同儕與全地光彩的絆足劣石！永不可驕棄這求罪洗罪得活新生的大幸好恩！」（KC）。此筆立定千百年聖地不可褻玩的凜然威風。
