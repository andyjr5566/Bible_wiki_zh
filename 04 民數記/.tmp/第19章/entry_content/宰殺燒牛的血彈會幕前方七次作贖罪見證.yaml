name: "宰殺燒牛的血彈會幕前方七次作贖罪見證"
type: "文化"
secondary_types:
  - "神學"
  - "主題"
status: formal
definition: |
  在以色列神聖祀典裡，當純紅母牛被引率往孤涼寂遙的會營境外進行宰滅當時，上帝特意委由亞伦的大兒子繼承祭司以利亞撒出征執行祭職，要用鮮淨指尖蘸取溫厚滿生命活威的大血，回面遙看天主聖顏臨在的見證帳房前方，揚臂連續揮彈七次紅雨；這儀程不僅奠下無上完全的贖罪恩義，更證實一切潔除生活沾惹死靈污黑的力量皆直接溯源於神前羔羊全死長流之得勝功德。
accumulations:
  - book: "民數記"
    chapter: 19
    summary: "以利亞撒奔赴營外監領宰斃紅牛，又舉蘸著溫盛愛血的手指向會堂中廷神所定止的大堂處灑彈長連七道紅光血印。"
    relation: "向干犯死靈不潔的前路鋪墊全備有餘的潔救聖恩，確表惟借向天主七遍見證的寶血宏代，方得挽滅一切遭逐客魂。"
    content: |
      紅母牛之成辦，決計不能等同民間一般的灶火屠殺，它必須深沐在舊約血贖神權大見證的隆重祭典以內：「交給祭司以利亞撒；他必牽到營外，人就把牛宰在他面前。祭司以利亞撒要用指頭蘸這牛的血，向會幕前面彈七次。」（民十九3-4）。黃迦勒探賾這深妙之經點醒眾心：「何以由以利亞撒非亞倫本君親行？正為保護至貴大君神袍勿於觸染死牛屍氣時陷暫留夕默，亦象徵未來代父盡死行事皆賴子耶穌聖心所踐履！且指尖飛揚血露向會堂致灑正巧七輪，『七』為神心歡呼毫沒減折的豐甜完整！既灑足七席，便是指罪途死局已經徹斷，天君與孤苦迷民於焉再度相契喜容！」（CT）。

      丁良才與拾穗隨及揭起深秋禮俗對照神道奧隱：「野外象徵離絕祝福的受棄死林；血飛揚灑向幕埕卻是一段接連孤域罪魂轉往喜顏深聖所的好光之曲！那牛之血肉皮糞毫不藏省一同火投，印刻著為百姓平除明日後世任何無端罪垢的預支救願，恩光直達悠遠終生！」（GT）。BibleHub 把這段深恩灑彈看作血聖交契的中繼強樑：「即便遙站山邊、相隔帳籬無數，以利亞撒深摯灑打血露定志面向耶和華真所，告慰天下千代苦奴：罪雖把你扔向苦野深絕之地，這殷紅如泉的贖情血注必定追逐引奔回神最熱燙的父堂深抱！」（BH）。

      KingComments 再度痛陳斯儀於日常行走信仰的安適靠顧：「常有信士感懷昨日雖然已沐蒙救贖，今日又踩喪谷不免驚悚沉淪；這向幕揚彈七度鮮血的一筆即告天民：早先之血成蔭無縫，足以掩映你走遍風霜塵埃的一切不順，憑著不改血工的千秋長念，永遠得勝立足光明安居！」（KC）。此恩旨徹底將舊地孤墳的寒意變造為春日重生的無邊歡欣。
