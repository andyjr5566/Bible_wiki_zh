name: "誤碰屍毒致七日不潔與第三及第七天除穢程序"
type: "文化"
secondary_types:
  - "神學"
  - "主題"
status: formal
definition: |
  在古以色列防禦世俗罪染與死亡陰霾的法律體系內，凡人民無論於自家居住帳棚室中偶然歷見親友告終，或步於長廣田埂林間誤遭兵燹暴骨、沉土孤碑與荒草遺棺之碰觸，必立即招惹律例所判定之嚴重「七日的完全不潔」；唯有仰仗良友中行持純白洗潔之人執持長春牛膝微草、吸含除罪母牛苦灰混調而生的神水聖漿，抓準關涉超生起死秘意之第三日、並定盡一夕安詳新興的第七日二度歡揚遍灌身肩，方得破消沉厄死黑之禍，自沐衣衫歸入光彩新殿。
accumulations:
  - book: "民數記"
    chapter: 19
    summary: "上帝嚴明判定凡碰遇終歿枯骨墳塋的七個晝夜深居黑霧與喪垢期間，勒定必定於第三與第七兩時重節仰求灑取活泉之樂救，進而滌去風霾迎領自心重安。"
    relation: "明定沉重死氛絕不容縱於真光民屬之中，闡釋基督於第三日自死穴浩瀚興勝、又直引人向第七天休明勝界的好捷之步。"
    content: |
      以色列百姓正處蠻荒悠久遷徙途程，生離死隔實乃日復一夜無法規避之沉難重憂，神宰卻以嚴直法威敲響自省驚鐘：「摸了人死屍的，就必七天不潔淨。那人到第三天要用這除污穢的水潔淨自己，第七天就潔淨了... 無論何人在田野裡摸了被刀殺的，或是屍首，或是人的骨頭，或是墳墓，就要七天不潔淨。」（民十九11-16）。黃迦勒探賾這觸魂駭令道出神旨喜怒的根本原由：「死亡堪稱百愆結成、比初發放肆罪行更加令人心驚的神之長仇！天主看守聖潔疆土，怎肯准許荒臭幽黑在帳底久稽？故定下足滿『七日』警世痛省；幸賴上帝巧施仁策：第『三』天非僅是一則時令，此乃基督粉碎深崖地府、大張光芒復活的高光喜節！你在這一天接受靈灰灑水，即是以永恆復活大力斬斷沾污死源！」（CT）。

      丁良才與拾穗則剖入猶太民俗與生活實態的深度警勉：「不光生民血軀沾苦必算不潔，甚且隨堂散落無防密紮其蓋的敞口壺皿皆必棄用，蓋死霧蔓竄無情、輕率放曠即墮毒潭！非仗潔者相依撒佈這芳草聖甘灰水一連三與七夕齊整，終久沉抑冤辱沒可抬身！」（GT）。BibleHub 把這段關卡指明為人路過犯得釋放安歸的主要大道：「世態縱非本心招禍，但踏入社群塵海總免不了遭遇道德或靈魂層面的『碰屍與撫墓』；幸無數愛民皆懂即席奔仗第三日的起活榮輝、並期許第七日的洗禮完畢長安！」（BH）。

      KingComments 更痛心呼喚現時追隨著天主的萬邦神旅深明守戒自保的智德：「切不可因慣踩冷泥便藐視屬靈氣團的沉暮暗流；人一退落無恩淵谷極易互染病氣；你要仗著活話甘泉不分晝夕地勤洗不懈，直至那第三天心靈甦活成風、第七夕脫胎向日為人，穩步走出一望無休的前光明安域！」（KC）。此語厚厚把遠古喪例提振成現今信仰心海的清滌勝歌。
