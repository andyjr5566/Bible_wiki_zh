definition: |
  在民數記第十九章開卷鋪闢完那壯美宏奧、隨奉隨灑的「紅母牛與除污穢水」廣寬救濟良道之後，全節最深厲肅敬的一道公格警戒隨波降抵全軍平庶心中，那就是宣告若有自傲慢侮、怠棄洗過定程而膽敢任留垢靈於身上的罪過，絕非止步於小己不乾等常過，實乃構成最嚴肅之「玷污耶和華的聖所與帳幕」這一終極大叛；「凡摸了人死屍、不潔淨自己的，就玷污了耶和華的帳幕，這人必從以色列中剪除；因為那除污穢的水沒有灑在他身上……他的不潔淨還在他身上。」這番再三在第十三與第二十兩節重音錘擊的宣告，直指以色列作為聖上中宰同住為鄰的崇聖陣營裡，個人不潔與公共聖所之間不變的生死連繫。
  黃迦勒在其著作中揭引此事之核心警告與信仰落實：荒郊常宿或是征戰行走之間，一人接觸病骨死去之悲雖為不可盡避的紅塵事變，但真正激惹到耶和華高焰殺戮乃至決斷割席的主要過往，完全端視自甘驕抗不顧求向洗冤妙泉的神態；上帝安歇於以色列兆民營伍當前，其白白為眾備好的強烈清溪與紅牛至貴淨灰已長在，若遇民流明知蒙穢染靈，竟毫無敬畏求憐之赤誠，依恃放浪舊臭強留人世共席，便同遭天父直接審入為把臭腐凶靈硬倒向祂的居庭法榻；丁良才之《拾穗》、《舊約聖經背景註釋》亦嚴密點析：中東君候與古地祭司律例極端忌憚未消邪的觸死活體於御地四周竄晃；而在永一至尊的高天神家眼中，任何未承沾活水滌灑而厚顏踞立陣內者，不但其咎長釘難消，更是主動破害全族與主神間那條榮美共枕的神權結信！ 故KingComments與BibleHub直批此妄必定得面對「從大會中一刀盡斷剪除」的神怒，成全唯聖方有久棲、杜絕輕忽天憐的威明公義。
accumulations:
  - book: "民數記"
    chapter: 19
    summary: "經上強音警告凡蒙死禍觸屍卻傲不俯首尋討除污穢之水灑浴、聽憑凶殘臭穢積居胸次自走者，其狂謬大錯便受定是極端猖狂的「玷污耶和華的帳幕與聖所」，面臨被拔出以色列會眾誓必剪除之大刑。"
    relation: "深刻明釋荒野帳堂聖潔法度的界碑防衛根基；重白指明遭過觸骸本可因投奔紅牛活泉獲釋自歡，唯因傲忽厭從神恩妙治，才使一身私染自躍成侵奪玷敗君王神宮的大極逆端。"
