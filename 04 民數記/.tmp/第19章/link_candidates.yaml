candidates:
  - name: "無殘疾與未曾負軛的紅母牛"
    type: "神學"
    source: "民數記第十九章第二至三節：耶和華律法中的一條定例，要求以色列人將一隻「沒有殘疾、未曾負軛、純紅的母牛」牽來交給祭司以利亞撒，於營外牽宰。"
    justification: "舊約禮儀中最為奇妙的救贖與潔淨預表：純紅表徵血色與豐盛的生命，毫無殘疾表示品格的完全聖潔，未曾負軛說明超越屬塵俗世的操役；作為替代罪民除去死亡污穢的無瑕祭品。"

  - name: "除污穢的水"
    type: "神學"
    source: "民數記第十九章第九至十節：由潔淨人收取紅母牛身受火化後的灰燼，存放在營外潔淨之處，與活水調和為「除污穢的水」（其本質即為贖罪祭）。"
    justification: "解決神的子民在曠野天旅過程中因日常意外觸摸死屍而墮入的儀式性致死不潔；指明藉著牛灰與活水相調，見證 Christ 一次成就之犧牲擁有為選民終身隨時洗滌的不渝宏效。"

  - name: "向會幕前彈紅母牛的血七次"
    type: "文化"
    source: "民數記第十九章第四節：祭司以利亞撒在營外面對母牛被宰殺後，要用手指蘸這紅母牛的血，向耶和華會幕的前面彈了七次。"
    justification: "說明雖此宰殺儀式在營外荒野執行，祭司仍須定睛正向直面耶和華安居的會幕前，連續七次彈灑贖除血水；代表潔淨罪愆的合法權力全然源出於主旨的大威與恩赦。"

  - name: "香柏木、牛膝草與朱紅線"
    type: "文化"
    source: "民數記第十九章第六節：在母牛一體皮、肉、血、糞化為大火猛烈燃燒時，祭司需把香柏木、牛膝草和朱紅線一同抓取並丟入牛火狂焰中合灰。"
    justification: "串聯了舊約經典潔淨大典中三大表徵（香柏木為極其貴榮高偉的林冠，牛膝草象徵卑微至底的小苗，朱紅線表彰世俗重罪或生命之血），統統與代贖犧牲同歸烈火，洗盡天下萬般污弊。"

  - name: "第三日與第七日的除污穢禮儀"
    type: "文化"
    source: "民數記第十九章第十一至十九節：凡接觸或死屋同居者即告不潔淨七天；務要依靠一潔淨朋友持拿牛膝草蘸紅牛除污活水，於第三及第七天彈灑洗淨，末了清洗衣服與沐浴。"
    justification: "指明自死亡污穢過渡返歸康壯聖體所需的明確法定禮程；第三日的赦罪宣告與第七日的完全得勝缺一不可，顯揚生命復歸不僅是外表滌新，實屬漫長且周全的神靈重建。"

  - name: "玷污耶和華的聖所與帳幕"
    type: "神學"
    source: "民數記第十九章第十三與二十節：兩度嚴肅發出至高警訊：誰身染死骸除舊之垢，若頑悖不肯求用除污穢之水灑滌，必遭斥為「玷污耶和華的聖所與帳幕」。"
    justification: "闡釋何為引致絕望神罰的核心所在：遭遇沾穢雖是曠野世途常事，然而蓄意抗免順從潔罪妙儀的驕狠態度，便為向永恆神之公義與所築靈棚作挑釁侵犯，理遭徹底剪除。"

  - name: "營外焚燒"
    type: "主題"
    source: "民數記第十九章第三至八節：紅母牛並非如傳統燔祭那般牽赴殿心銅壇，而是一整批原班移駕至荒野深境「營外」，在其外無情殺斬直至灰飛燃熄。"
    justification: "為《希伯來書》記載基督隨身攜十字架重命而出至於「營外受苦」的解讀奠基；突顯背負天下罪晦無可同列在清潔安堂的律例實事。"

  - name: "牛膝草"
    type: "原文"
    source: "民數記第十九章第六與十八節：香柏與牛膝合拋火中；隨後更勒令由一合格清乾潔仕親持這一扎細柔長毛的「牛膝草」將牛灰活水大力彈灑於房舍與人的前身。"
    justification: "彰示牛膝草於聖堂法禮史上肩護著由微極草束執持生命洗恩的神權橋樑意義，亦對應大衛《詩篇》第五十一篇中祈請牛膝草潔除大戾的高貴誓吟。"

  - name: "香柏木（潔淨儀式用）"
    type: "文化"
    source: "民數記第十九章第六節：古黎民潔淨之祭，必要採用象徵生氣傲揚、材質上上尊厚而芳鬱耐變的香柏長枝伴牛投焚。"
    justification: "充實並延伸了從大麻瘋洗愈至於死去觸屍滌過大成中，香柏木充作解壞反腐及永榮生命的古中東王公法儀意義。"

  - name: "活水（潔淨儀式用）"
    type: "原文"
    source: "民數記第十九章第十七節：為要救贖那落入不潔沾染的災黎，當將燒燬過除罪紅母牛之淨骨香灰舀至器皿內部，並倒注滿盆的「活水」（流動生泉水）。"
    justification: "明確詮解死的灰殘必仰依靠無止活水共同融解的大工；死亡所惹之災惡必被生命靈流澆覆，也成耶穌隨誓暢言靈江浩溢自肚胸噴揚的濫殤。"

  - name: "死屍不潔"
    type: "神學"
    source: "民數記第十九章第十一至十六節：凡民於境內摸見人的屍首、或荒地間觸撞死人、被刀刃殺者、乃至枯骨墳堆，立刻遭禁戒為「七日沾滿致死不潔淨」。"
    justification: "是全經最具權益分明的死屍不潔指南大憲：揭明人類敗逃墮落地界的最端凶兆與上帝極致生命相隔如寇仇，死亡即為萬罪最高結局的教導語境。"

  - name: "第三日"
    type: "神學"
    source: "民數記第十九章第十二與十九節：禮儀規範一連宣敕「他要在第三日和第七日用這水潔淨自己」，且不容忽離第三天第一度灑罪大禮。"
    justification: "為新舊約全庫之中關乎復興與生息起死回生至大數字「第三日」之神學光暈大加背信印註；無第三日的大罪開赦即打不通往向第七的休喜康樂。"

  - name: "剪除（kareth）"
    type: "原文"
    source: "民數記第十九章第十三與二十節：未循章以活水彈灑自新、仍留狂垢觸忤神安居宇之驕逆狂徒，「這人必從以色列中剪除」。"
    justification: "將「剪除」之懲不獨降於公開挑弄鬼怪邪神之重戾，同樣森然落予對神已為民開創白白贖冤妙泉抱持輕薄不管的大傲傲漢身上。"
