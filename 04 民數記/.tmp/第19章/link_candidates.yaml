candidates:
- name: 無殘疾與未曾負軛的紅母牛
  type: 神學
  source: 民19:2：「把一隻沒有殘疾、未曾負軛、純紅的母牛牽到你這裡來。」
  justification: 本章的核心祭牲；三個條件各有來源解讀，且是全律法中唯一指定母牛、唯一指定顏色的祭牲。
- name: 除污穢的水
  type: 神學
  source: 民19:9、17：紅母牛的灰存在營外潔淨的地方，用時取灰入器皿、倒上活水調成。
  justification: 本章的產物與目的；一次焚燒供全曠野期使用，是舊約唯一「不必重複獻祭」的潔淨機制。
- name: 第三日與第七日的除污穢禮儀
  type: 文化
  source: 民19:12、19：第三天與第七天各灑一次，第七天洗衣洗澡，到晚上才潔淨。
  justification: 兩段式潔淨的時程規定；民31:19 再次沿用，具跨章累積價值。
- name: 玷污耶和華的聖所與帳幕
  type: 神學
  source: 民19:13、20：不潔淨自己的人「玷污了耶和華的帳幕」「他玷污了耶和華的聖所」。
  justification: 個人不潔為何構成對聖所的侵犯；兩節分別用了帳幕與聖所兩個不同的詞。
- name: 敞口的器皿
  type: 文化
  source: 民19:15：「凡敞口的器皿，就是沒有紮上蓋的，也是不潔淨。」
  justification: 帳棚內死亡使器皿受污的具體判準；四套來源都有註解（CT 釋「紮上蓋」為蓋得嚴密、KC 有整段應用），目前無節點。
- name: 營外焚燒
  type: 主題
  source: 民19:3、5：紅母牛牽到營外宰殺焚燒。
  justification: 出29、利4/8/9/16 已累積；本章是這條規定用在非壇上祭牲的一次。
- name: 牛膝草
  type: 原文
  source: 民19:6、18：牛膝草丟在燒牛的火中；潔淨的人拿牛膝草蘸水灑。
  justification: 出12、利14 已累積；本章是牛膝草唯一同時作為焚燒材料與灑水工具的一章。
- name: 香柏木（潔淨儀式用）
  type: 文化
  source: 民19:6：祭司要把香柏木丟在燒牛的火中。
  justification: 利14 已累積；本章是香柏木用於死屍不潔潔淨禮的唯一出處。
- name: 活水（潔淨儀式用）
  type: 原文
  source: 民19:17：拿些燒成的除罪灰放在器皿裡，倒上活水。
  justification: 利14 已累積；該條目的定義已提及民19:17，卻沒有本章累積。
- name: 死屍不潔
  type: 神學
  source: 民19:11-16：摸死屍、進死人帳棚、摸骨頭墳墓，都七天不潔淨。
  justification: 民9 已累積；本章是這條規定的完整條文本身。
- name: 第三日
  type: 神學
  source: 民19:12、19：第三天要用這除污穢的水潔淨自己。
  justification: 創22 已累積；本章是「第三日」用在潔淨禮上的出處。
- name: 剪除
  type: 原文
  source: 民19:13、20：這人必從以色列中剪除／要將他從會中剪除。
  justification: 出23/30/31、利7-22、民9/15 已累積；本章兩次剪除的範圍用詞不同。
- name: 彈血七次
  type: 主題
  source: 民19:4：以利亞撒用指頭蘸這牛的血，向會幕前面彈七次。
  justification: 利4 已累積；本章是彈血七次唯一在營外、朝向會幕的一次。
- name: 藍色、紫色、朱紅色線
  type: 主題
  source: 民19:6：祭司要把朱紅色線丟在燒牛的火中。
  justification: 出25-39、利14、民4 已累積；本章是朱紅色線用在紅母牛禮的出處。
- name: 以利亞撒
  type: 人物
  source: 民19:3-4：交給祭司以利亞撒；他必牽到營外……要用指頭蘸這牛的血。
  justification: 出6、利10、民3/4/16 已累積；本章是他第一次獨立主持一項全國性禮儀。
- name: 永遠的定例
  type: 神學
  source: 民19:10、21：這要給以色列人和寄居在他們中間的外人作為永遠的定例。
  justification: 利3、利6 已累積；本章兩次使用，且第一次把外人一併納入。
- name: 潔淨之地
  type: 地點
  source: 民19:9：收起母牛的灰，存在營外潔淨的地方。
  justification: 利4、利6 已累積；本章是同一塊地用來存放紅母牛灰的出處。
- name: 贖罪祭
  type: 神學
  source: 民19:9、17：「這本是除罪的」「燒成的除罪灰」。
  justification: 利4 等已累積；本章的「除罪」在原文與贖罪祭同字，GT《SDA聖經注釋》為此寫了整段。
- name: 不潔之人出到營外
  type: 主題
  source: 民19:11：摸了人死屍的，就必七天不潔淨。
  justification: 民5 已累積；該條目定義的對照表已引民19:11，卻沒有本章累積。
- name: 意外沾染死屍與重新潔淨條例
  type: 事件
  source: 民19:11-19：因死屍不潔者的完整潔淨程序。
  justification: 民6 已累積；民6:9 的拿細耳人條例正是本章通則的特例。
- name: 不可挨近死屍（拿細耳人的潔淨）
  type: 主題
  source: 民19:11-16：摸死屍七天不潔淨的通則。
  justification: 民6 已累積；拿細耳人的禁令是在本章通則之上再加嚴。
- name: 潔淨與不潔淨
  type: 神學
  source: 民19:7-22：本章 22 節內反覆使用潔淨與不潔淨兩組字。
  justification: 創8、利11-15 已累積；本章是這組分類密度最高的一章。
- name: 潔淨痲瘋者的兩鳥儀式
  type: 主題
  source: 民19:6：香柏木、牛膝草、朱紅色線與利14:4 完全相同的三樣材料。
  justification: 利14 已累積；GT 與 KC 都明白指出兩處用的是同一組材料。
- name: 古代近東的替罪與潔淨儀式
  type: 背景
  source: 民19:11、19:2-10、19:20-21 的 GT《舊約聖經背景註釋》：赫人祭儀、美索不達米亞南布爾比儀式、以水消除不潔。
  justification: 利16 已累積；本章的背景材料密度更高，且提供了屍體不潔的跨文化對照。
- name: 紅母牛預表基督城外受苦（來13：11-12）
  type: 互文
  source: 民19:3、5：牽到營外、在營外焚燒。
  justification: 該條目定義寫的就是民19:3、5，卻只累積了利16 與來13，沒有民19。
- name: 不潔淨被剪除預表拒絕恩典滅亡（來10：26-29）
  type: 互文
  source: 民19:13、20：不潔淨自己的必被剪除。
  justification: 該條目定義寫的就是民19:13、20，卻只累積了來10，沒有民19。
