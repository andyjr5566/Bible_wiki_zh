candidates:
  - name: "純紅沒有殘疾且未曾負軛母牛為除罪救贖表徵"
    type: "神學"
    status: "formal"
    summary: "神諭勒令以色列群聚獻至大的一隻純紅毫無斑點、絕不沾缺殘疾、更未嘗挑奔沉苦世界軛木的強健良善母牛，表徵無玷耶穌作為人世中保承受死地殺罰，背載百罪使兆民享純新生命洗滌之聖道。"
    occurrences:
      - "民19:2"
    source_refs:
      - "ccbiblestudy CT: 民19:2 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT19.htm）"
      - "ccbiblestudy GT: 民19:2 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT19.htm）"
      - "KingComments: Num 19:2 the red heifer（https://www.kingcomments.com/en/bible-studies/Num/19）"
      - "BibleHub: Num 19:2 red heifer without spot（https://biblehub.com/study/numbers/19.htm）"
    cross_references:
      - "調製除污穢之活水為以色列無期限永遠贖愆法規"

  - name: "宰殺燒牛的血彈會幕前方七次作贖罪見證"
    type: "文化"
    status: "formal"
    summary: "大司祭以利亞撒出至於荒涼營地之外，於其面宰斷該母牛，隨後執起染上鮮重好血的手指，面對至高神所居的見證帳房連揚灑出整七回合深血大證，示現天人成和平和神愛至純免擔的宏聖定旨。"
    occurrences:
      - "民19:3-4"
    source_refs:
      - "ccbiblestudy CT: 民19:3-4 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT19.htm）"
      - "ccbiblestudy GT: 民19:3-4 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT19.htm）"
      - "KingComments: Num 19:3-4 sprinkling of the blood seven times（https://www.kingcomments.com/en/bible-studies/Num/19）"
      - "BibleHub: Num 19:4 seven times before the tabernacle（https://biblehub.com/study/numbers/19.htm）"
    cross_references:
      - "純紅沒有殘疾且未曾負軛母牛為除罪救贖表徵"

  - name: "將香柏木與牛膝草及朱紅線同入純紅牛薪火中"
    type: "文化"
    status: "formal"
    summary: "當紅木狂火起燎將母牛一體皮血宿食燒燼當時，祀匠嚴肅抓抱代表天下宏建尖材的大林香柏、隱處牆底極微末小的山石草毛、乃至標指人界極血頑惡斑漬的丹紅絲串同時拋置焚爐化為沉燼，彰示基督同死勝過宇宙各情罪重。"
    occurrences:
      - "民19:6"
    source_refs:
      - "ccbiblestudy CT: 民19:6 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT19.htm）"
      - "ccbiblestudy GT: 民19:6 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT19.htm）"
      - "KingComments: Num 19:6 cedar wood hyssop and scarlet（https://www.kingcomments.com/en/bible-studies/Num/19）"
      - "BibleHub: Num 19:6 cast into the midst of the burning（https://biblehub.com/study/numbers/19.htm）"
    cross_references:
      - "調製除污穢之活水為以色列無期限永遠贖愆法規"

  - name: "調製除污穢之活水為以色列無期限永遠贖愆法規"
    type: "神學"
    status: "formal"
    summary: "一眾成神所愛、常保自尊乾爽無患潔客將燼燼神火成下的好灰封納遠區潔園，於何時人行遭禍染死，及自器內把好水清溪共拌灑身； 此非一時臨救，更是立下萬乘絕不改解的天下永遠洗過妙則。"
    occurrences:
      - "民19:9-10"
    source_refs:
      - "ccbiblestudy CT: 民19:9-10 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT19.htm）"
      - "ccbiblestudy GT: 民19:9-10 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT19.htm）"
      - "KingComments: Num 19:9-10 water of purification（https://www.kingcomments.com/en/bible-studies/Num/19）"
      - "BibleHub: Num 19:9 for a water of purification（https://biblehub.com/study/numbers/19.htm）"
    cross_references:
      - "純紅沒有殘疾且未曾負軛母牛為除罪救贖表徵"

  - name: "誤碰屍毒致七日不潔與第三及第七天除穢程序"
    type: "文化"
    status: "formal"
    summary: "天下諸民不問是處屋遇喪或是踏郊觸墓惹及枯殘碎骸，即刻招引上帝看作最大隔絕之七日沾穢沉愆；惟倚靠潔友執草揚揮，於至關鍵之第三和第七日雙齊灌浴除邪靈淚，再自沐舊袍乃重歸光明社眾。"
    occurrences:
      - "民19:11-19"
    source_refs:
      - "ccbiblestudy CT: 民19:11-19 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT19.htm）"
      - "ccbiblestudy GT: 民19:11-19 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT19.htm）"
      - "KingComments: Num 19:11-19 laws concerning touching the dead（https://www.kingcomments.com/en/bible-studies/Num/19）"
      - "BibleHub: Num 19:11 unclean seven days（https://biblehub.com/study/numbers/19.htm）"
    cross_references:
      - "玷污造主帳棚怠隳潔淨典例者得自大聚會剪除"

  - name: "玷污造主帳棚怠隳潔淨典例者得自大聚會剪除"
    type: "神學"
    status: "formal"
    summary: "凡既已受落屍邪而傲居不思奔向神座接受潔罪灑洗及自滌衣裳之道者，其過非僅自滅，實則化身毒禍重犯耶穌和華榮美居區與聖安之所；天主昭明，遇此悖道無贖狂客一定全體連根揮棄並拔出列邦聖民總會之中。"
    occurrences:
      - "民19:13"
      - "民19:20"
    source_refs:
      - "ccbiblestudy CT: 民19:13, 20 註解與靈訓（https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT19.htm）"
      - "ccbiblestudy GT: 民19:13, 20 丁良才與《背景註釋》（https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT19.htm）"
      - "KingComments: Num 19:13, 20 cut off from Israel（https://www.kingcomments.com/en/bible-studies/Num/19）"
      - "BibleHub: Num 19:13 defileth the tabernacle of the LORD（https://biblehub.com/study/numbers/19.htm）"
    cross_references:
      - "誤碰屍毒致七日不潔與第三及第七天除穢程序"
