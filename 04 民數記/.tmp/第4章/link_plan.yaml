B_needs_update:
- name: 洗濯盆（銅盆）
  suggested_type: 主題
  evidence: 民數記第四章逐一交代每件聖器怎麼包、誰來抬，卻獨獨沒有提到洗濯盆。CT 特別加了一則備註指出這件事，並列出洗濯盆在聖經中的三樣特點：聖經未曾提到洗濯盆的尺寸（出30:17-21）；會幕器具中唯有洗濯盆提到材料的來源（出38:8）；會幕器具中唯有洗濯盆未曾提到由哪一個家族搬運。GT 丁良才在 v15 給出版本證據：「撒瑪利亞人的摩西五經，並七十士所譯的希臘文舊約，在本節末後有下列四句：『他們又用紫色的毯子，蓋洗濯的盆和盆座，又蒙上海狗皮；放在抬架上。』」他隨即補上自己的判斷：「但神或者故意不叫他們遮蓋洗濯盆和盆座。」
  match_type: exact
  existing_title: 洗濯盆（銅盆）
  existing_path: link_folder/主題/洗濯盆（銅盆）.md
