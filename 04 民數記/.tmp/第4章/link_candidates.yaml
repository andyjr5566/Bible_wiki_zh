  - 朱紅色的毯子
  - 紫色毯子
- name: 三十歲直到五十歲（利未人任職年齡）
  type: 主題
  evidence: v3, 23, 30, 35, 39, 43, 47，利未人正式在會幕辦事與負重任的成熟壯年時期
- name: 按名指定
  type: 主題
  evidence: v32，米拉利子孫所抬的骨架與器具按名指定分派，提高效率與明確職責
- name: 抬架（會幕器具搬運）
  type: 主題
  evidence: v10, 12, 15，無槓聖所器具包紮後放在抬架（carrying frame）上抬運
- name: 不可摸聖物
  type: 神學
  evidence: v15，哥轄子孫只可抬不可觸摸聖物，違者治死；表徵事奉邊界與聖潔敬畏
- name: 不可觀看聖所
  type: 神學
  evidence: v20，哥轄子孫連片時不可進去觀看聖所，免得死亡；保護人免受神聖榮耀擊殺
- name: 祭司統轄事奉
  type: 神學
  evidence: v28, 33，革順與米拉利子孫在祭司以他瑪手下分派看守，哥轄由以利亞撒監督，展現層層負責的事奉秩序
- name: 不可摸約櫃（撒下6：6-7）
  type: 互文
- name: 利未人任職年齡的差異
  type: 解經爭議
  evidence: v3（30歲）、民8:24（25歲）、拉3:8/代上23:24（20歲）之年齡規定調和與歷史發展
- name: 抬約櫃的槓是否可抽出來
  type: 解經爭議
  evidence: 出25:15（槓不可抽出來）與民4:6（把槓穿上/調整系緊）之難題解釋
- name: 辦事（melakah）
  type: 原文
  evidence: v3 GT難解經文記載 melakah 專指會幕正式任職辦事
- name: 工作（baabodath）
  type: 原文
  evidence: v3 GT難解經文記載 baabodath 指會幕勞作或學徒時期工作
- name: 洗濯盆（銅盆）
  type: 主題
  section: 器具
  evidence: 民數記第四章逐一交代每件聖器怎麼包、誰來抬，卻獨獨沒有提到洗濯盆。CT 特別加了一則備註指出這件事，並列出洗濯盆在聖經中的三樣特點：聖經未曾提到洗濯盆的尺寸（出30:17-21）；會幕器具中唯有洗濯盆提到材料的來源（出38:8）；會幕器具中唯有洗濯盆未曾提到由哪一個家族搬運。GT 丁良才在 v15 給出版本證據：「撒瑪利亞人的摩西五經，並七十士所譯的希臘文舊約，在本節末後有下列四句：『他們又用紫色的毯子，蓋洗濯的盆和盆座，又蒙上海狗皮；放在抬架上。』」他隨即補上自己的判斷：「但神或者故意不叫他們遮蓋洗濯盆和盆座。」
