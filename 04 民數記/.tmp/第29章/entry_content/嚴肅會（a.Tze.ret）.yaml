name: 嚴肅會（a.Tze.ret）
type: 原文
aliases:
- a.Tze.ret
definition: '民29:35 說住棚節七日之後「第八日你們當有嚴肅會」。STEP 標這個字為 H6116 ''a.Tze.ret，陰性單數名詞，本節譯義 an assembly，brief lexicon 作 עֲצָרָה (a.tsa.rah): assembly。**它在整卷民數記只出現這一次。**


  **它和本章前面三次的「聖會」不是同一個詞。** v1、7、12 的「聖會」是兩個字的組合 H4744 mik.ra''（召集）加 H6944G ko.desh（聖潔），字面是聖潔的召集；v35 的「嚴肅會」則是單獨一個名詞 ''a.Tze.ret。中文用兩個不同的詞來譯，正對應原文的兩種寫法。


  CT 的原文字義欄只給「嚴肅會，聚會」，並在文意註解裡說明它指的日子：「『嚴肅會』指住棚節後次日，七月二十二日，繼續慶祝一天，稱為嚴肅會。這日視同安息日，不可作工，百姓要到會幕前聚集(參利二十三36)。」'
accumulations:
- book: 民數記
  chapter: 29
  summary: v35 的「嚴肅會」是 H6116 'a.Tze.ret，全卷民數記僅此一次；與 v1、7、12 的「聖會」（mik.ra' ko.desh）是兩個不同的詞。
  relation: 住棚節第八日在原文層面就被標成另一種聚集，不是七日節期的延長。
