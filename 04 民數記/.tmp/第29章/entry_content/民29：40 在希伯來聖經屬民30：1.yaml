name: 民29：40 在希伯來聖經屬民30：1
type: 背景
aliases: []
definition: '民29:40「於是，摩西照耶和華所吩咐他的一切話告訴以色列人」這一節，在中文與希伯來文聖經裡不屬於同一章。CT 在此註明：「本節可作為民二十八、二十九兩章的結語，但希伯來文聖經則將本節放在民三十章的第一節，作為三十章的序言。」


  **這個差異會改變這句話往哪邊讀。** 放在民29 的末尾，它是民28-29 整套節期獻祭條例的收束——摩西把神所吩咐的都轉達了；放在民30 的開頭，它就成了下一章許願條例的引言。


  '
