name: 所定的節期（mo.'ed）
type: 原文
aliases:
- mo.'ed
definition: '民29:39 收尾說「這些祭要在你們的節期獻給耶和華」。STEP 顯示「你們的節期」是 H4150H be./mo.''a.dei./Khem（介系詞＋陽性複數構造式＋第二人稱複數後綴），本節譯義「at/ appointed feasts/ your」，brief lexicon 作 מוֹעֵד (mo.ed): meeting: festival。


  CT 的原文字義欄給的正是這個範圍：「節期」指定的時間，聚會。


  **民29:39 一整節都由 STEP 標得很清楚**：「所許的願」是 H5088 nid.rei/Khem（ne.der，誓願），「甘心所獻」是 H5071 nid.vo.tei/Khem（ne.da.vah，出於自願），「以外」是 H905J le./Vad，後面接的四種祭依序是 H5930A 燔祭、H4503G 素祭、H5262 奠祭、H8002 平安祭。整節的結構是：在所約定的時候要獻的（義務），與人自己心裡定的（自願），分屬兩層。


  BibleHub 也照這兩層讀：還願祭是為履行向神許下的承諾而獻，甘心祭則是出於感恩或愛慕自願獻上的。'
accumulations:
- book: 民數記
  chapter: 29
  summary: v39「你們的節期」是 H4150H mo.'a.dei/Khem，字面是所約定的時候；同一節用 le./Vad（以外）把節期義務祭與所許的願、甘心所獻兩類自願祭分開。
  relation: 本章與民28 兩章所列的都是所定的節期該獻的祭，v39 明說個人自願獻的不算在內。
