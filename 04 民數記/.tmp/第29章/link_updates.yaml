book: 民數記
chapter: 29
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v40 於是摩西照耶和華所吩咐他的一切話告訴以色列人，為民28-29 兩章的節期獻祭條例收尾。
  relation: CT 指出這一節在希伯來文聖經裡被放在民30:1，作為許願條例的序言；因此它同時是本套條例的收束與下一章的開場。
- title: 以獻祭安排時間
  path: link_folder/主題/以獻祭安排時間.md
  summary: v1、7、12 依七月初一、初十、十五的日期次序排列祭物，第八日（v35）另立一段；全章的骨架就是一份七月的行事曆。
  relation: 民28 排的是每日、每週、每月與春季節期，本章接著排七月的三個秋季節期，兩章合起來覆蓋一整年。
- title: 群體性獻祭
  path: link_folder/主題/群體性獻祭.md
  summary: v39 明說這些祭是「在你們的節期」為全體獻上的，個人所許的願與甘心所獻另計。
  relation: GT《民數記串珠聖經註釋》說「以上兩章主要記述節日當獻的祭物，這些是神清楚指明的（39），是必須獻上的。至於自願或許願獻的祭則是額外的，不在此列」。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: v2、8、13、36 每個節期日的主祭都是燔祭；STEP 一律標 H5930A 'o.Lah。
  relation: CT 說燔祭「指整個祭物須在祭壇上經過火燒，使馨香之氣上升，全部獻給神」；本章的燔祭全部是加在每日常獻的燔祭之上的。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: v3、9、14、18 起每隻祭牲都配同獻的素祭，分量按祭牲大小分三、二、一份；STEP 標 H4503G min.chah，細麵是 H5560 So.let、調油是 H1101A be.lu.Lah。
  relation: CT 說「『調油的細麵』將磨細的生麵粉調和橄欖油，揉成生麵團(不可有酵)」；本章的素祭一律附屬於燔祭，沒有獨立獻上的情形。
- title: 奠酒
  path: link_folder/文化/奠酒.md
  summary: v6、11、16 起每段都以「同獻的奠祭」收尾，v39 用複數形列在四種可獻的祭之中；STEP 標 H5262 ne.sekh。
  relation: CT 的原文字義欄把「奠祭」解作奠酒，並說「『奠祭』指澆酒為祭」；本章不再重述分量，v18 以下一律寫「按數照例」。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: 本章每一個節期日都加獻一隻公山羊為贖罪祭（v5、11、16、19、22、25、28、31、34、38）；STEP 標 H2403H cha.Tat，v5 另有 H3722A Piel 不定詞 le./kha.Per「為你們贖罪」。
  relation: KingComments 注意到即使在祭物最豐盛的住棚節，贖罪祭也一次都沒有缺席，說這表示無論蒙多大的福，人始終不會忘記自己的罪曾需要對付。
- title: 火祭（isheh）
  path: link_folder/主題/火祭（isheh）.md
  summary: v6、13、36 稱這些祭為火祭；STEP 標 H801 'i.Sheh，v13 是 'i.Sheh Rei.ach ni.Cho.ach 的三重構造鏈，直譯是舒暢香氣的火祭。
  relation: CT 說「『火祭』指經過火燒的一種獻祭；在任何的獻祭中，凡把全部或一部分供物燒在壇上的，都稱為火祭」。
- title: 馨香之氣
  path: link_folder/神學/馨香之氣.md
  summary: v2、6、8、13、36 反覆用「馨香」；STEP 是 H7381 Rei.ach（氣味）加 H5207 ni.Cho.ach（舒坦）兩個字。
  relation: CT 也註明這是原文雙字，並說「『馨香』指聞起來會覺得心曠神怡、心平氣和的氣味」；BibleHub 則把它與弗5:2 基督的馨香之祭相連。
- title: 每日獻祭（常獻燔祭）
  path: link_folder/神學/每日獻祭（常獻燔祭）.md
  summary: v6、11、16、19、22、25、28、31、34、38 每段結尾都說這些祭是在「常獻的燔祭」以外；STEP 標 H8548 ha./ta.Mid，本節譯義 continuity。
  relation: 節期不停掉日常：CT 在 v6 說這表徵「一面過節，一面仍須每日過討神喜悅的生活」，BibleHub 也說常獻的燔祭是每早晚不間斷的。
- title: 沒有殘疾的祭牲
  path: link_folder/神學/沒有殘疾的祭牲.md
  summary: v2、8、13、17、20、23、26、29、32、36 都要求祭牲沒有殘疾；STEP 標 H8549G te.mi.Mim，本節譯義 unblemished。
  relation: CT 的原文字義欄解作「完全的，健全的」；BibleHub 把這個要求與彼前1:19「無瑕疵、無玷污的羔羊」相連。
- title: 伊法
  path: link_folder/原文/伊法.md
  summary: v3-4、9-10、14-15 用伊法十分之三、二、一計量細麵，共十二處。
  relation: STEP 顯示這十二處原文都只有 H6241 'es.ro.Nim（十分之一），本章從頭到尾沒有出現 H374 伊法本字；伊法是譯本補出的基準單位。CT 給的換算是十分之三約六點六公升、十分之二約四點四公升、十分之一約二點二公升。
- title: 聖會
  path: link_folder/文化/聖會.md
  summary: v1、7、12 三個節期日都要有聖會；STEP 是 H4744 mik.ra' 構造式加 H6944G ko.desh，字面是聖潔的召集。
  relation: 本章的第四個聖日 v35 用的卻是另一個字 'a.Tze.ret（嚴肅會），不是 mik.ra' ko.desh；中文的「聖會」與「嚴肅會」正對應原文的兩種寫法。
- title: 勞碌的工（a.vo.dah）
  path: link_folder/原文/勞碌的工（a.vo.dah）.md
  summary: v1、12、35 禁止「勞碌的工」；STEP 是 H4399 me.Le.khet 加 H5656I 'a.vo.Dah，本節譯義 work of servitude。
  relation: 同一章的 v7（贖罪日）少掉 'a.vo.Dah，只寫 kol- me.la.Khah（任何工作）——贖罪日禁工的範圍在原文層面就比其他三個節期日寬。
- title: 月朔
  path: link_folder/歷史/月朔.md
  summary: v6 說吹角節的祭是在「月朔的燔祭」以外；STEP 在此用 H2320H ha./Cho.desh，本節譯義 the new moon。
  relation: 七月初一同時是月朔與吹角節，所以當日的祭要三份相加。GT 丁良才記下「每月朔祭司就吹銀號筒（十10）」；GT《民數記串珠聖經註釋》算出「當日獻上的祭牲總共是公牛三隻、公綿羊兩隻、公羊羔十六隻，另以一隻公山羊作贖罪祭」。
- title: 節期祭物層層累加
  path: link_folder/主題/節期祭物層層累加.md
  summary: v6、11、16、19、22、25、28、31、34、38 十次以「以外」收尾；STEP 一律是 H905J le./Vad。
  relation: BibleHub 用層層相疊解釋這個結構：節期的祭從不取代日常的祭，只往上加。v11 甚至同時列出「贖罪祭」與「常獻的燔祭」兩層——那一天連贖罪祭都有兩份。
- title: 節期祭物詳情另見民數記28-29章
  path: link_folder/背景/節期祭物詳情另見民數記28-29章.md
  summary: 本章補上七月三個節期的祭物明細，與民28 的每日、每週、每月與春季節期合成完整清單。
  relation: GT 串珠說「以上兩章主要記述節日當獻的祭物」；KingComments 把兩章視為上下半年兩組節期，說第一組主要應用在教會身上，第二組對以色列有特別的意義。
- title: 吹角節（七月初一）
  path: link_folder/歷史/吹角節（七月初一）.md
  summary: v1-6 列出吹角節當日的祭：公牛犢一隻、公綿羊一隻、一歲公羊羔七隻為燔祭，另加公山羊一隻為贖罪祭，並在月朔與常獻的祭以外。
  relation: 本章補上利23:23-25 沒給的祭物數目。原文只稱這天為 Yom te.ru.'Ah（大聲呼喊的日子），沒有指名樂器；GT 丁良才記下當日祭司吹銀號筒、百姓從日出到日落吹角，GT《舊約聖經背景註釋》則說是公綿羊的角。
- title: 大贖罪日（Yom Kippur）條例
  path: link_folder/歷史/大贖罪日（Yom Kippur）條例.md
  summary: v7-11 列出贖罪日的節期祭：刻苦己心、什麼工都不可做，並獻公牛犢一隻、公綿羊一隻、一歲公羊羔七隻為燔祭，另加一隻公山羊為贖罪祭。
  relation: GT 丁良才說「七月初十日」就是大贖罪日，「本日的禮節記在利十六1-34、二十三26-32」。v11 明說這隻公山羊是在那贖罪的贖罪祭以外，也就是利16 大祭司在至聖所所獻的那一份之外；當天因此有兩份贖罪祭。
- title: 住棚節（利23節期規定）
  path: link_folder/歷史/住棚節（利23節期規定）.md
  summary: v12-38 列出住棚節八天的祭物：第一日十三隻公牛，逐日遞減至第七日七隻，公綿羊每日兩隻、一歲公羊羔每日十四隻，每日另加一隻公山羊；第八日另有嚴肅會與較少的祭牲。
  relation: GT 丁良才說「在本節期中為會眾所獻的祭牲，比一切別的節期都多，或者是因為本節是一年之莊稼的感恩節」；GT《舊約聖經背景註釋》算出全節期共七十一隻公牛、十五隻公羊、一百零五隻羊羔、八隻山羊。
- title: 贖罪日的節期獻祭（民29：7-11）
  path: link_folder/互文/贖罪日的節期獻祭（民29：7-11）.md
  summary: 本章 v7-11 正是這個條目所指的經文本身：贖罪日要刻苦己心、什麼工都不可做，並獻燔祭與一隻公山羊贖罪祭。
  relation: STEP 為條目補上一項原文事實：v11「以外」所指的那份贖罪祭是 cha.Tat ha./ki.pu.Rim（H2403H＋H3725），直譯是那贖罪的贖罪祭，正是利16 至聖所裡的那一份；GT 丁良才說它「表明牛羊的血不能完全贖罪」。
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: v39 把平安祭與燔祭、素祭、奠祭並列為節期以外可獻的四種祭；STEP 標 H8002 shal.mei/Khem。
  relation: CT 說這個名詞在希伯來文表示和好或福祉，並說它是私人的獻祭，所獻的可為感謝、還願或甘心獻的，藉此顯明神與人及人與鄰舍的和諧關係。
- title: 細麵
  path: link_folder/主題/細麵.md
  summary: v3、9、14 的素祭一律用「調油的細麵」；STEP 標 H5560 So.let，調油是 H1101A be.lu.Lah。
  relation: CT 說是把磨細的生麵粉調和橄欖油、揉成不可有酵的麵團；本章的細麵分量嚴格跟著祭牲大小走，公牛三份、公羊兩份、羊羔一份。
- title: 公牛犢
  path: link_folder/主題/公牛犢.md
  summary: v2、8 吹角節與贖罪日各獻公牛犢一隻，v13 起住棚節第一日獻十三隻並逐日遞減至七隻，v36 第八日回到一隻。
  relation: STEP 顯示原文是 H6499 par 加 H1121H be.nei- 與 H1241 ba.Kar，字面是牛群中的幼公牛；公牛是本章唯一逐日變動的祭牲，七天合計七十隻。
- title: 公綿羊
  path: link_folder/主題/公綿羊.md
  summary: v2、8 吹角節與贖罪日各一隻，v13 起住棚節每日兩隻，v36 第八日一隻；STEP 標 H352A 'A.yil。
  relation: GT 丁良才比較各節期的數目：「在大贖罪日，也是一隻（8）。在月朔（二十八11），無酵節（二十八17），卻是兩隻。在吹角節所獻的，和大贖罪日（8），並住棚節第八日（36）所獻一樣。」
- title: 許願
  path: link_folder/文化/許願.md
  summary: v39 說節期祭是在「所許的願」以外；STEP 標 H5088 nid.rei/Khem，lexicon 作 ne.der（誓願）。
  relation: CT 說「所許的願並甘心所獻的」是「個別的人為著還願、感謝等不同的理由而自願獻上的祭物和祭牲」；BibleHub 也說還願祭是為履行向神許下的承諾而獻。本章的節期祭與這一類分屬義務與自願兩層。
- title: 甘心樂意的奉獻
  path: link_folder/神學/甘心樂意的奉獻.md
  summary: v39 的「甘心所獻」是 STEP H5071 nid.vo.tei/Khem，lexicon 作 ne.da.vah（自願）；它與所許的願一同被排除在節期義務祭之外。
  relation: KingComments 從神那一面說同一件事：神有權得敬拜，祂也尋找那些以甘心的敬拜親近祂的心。
- title: 耶和華的節期年曆總覽（利未記23章七大節期架構）
  path: link_folder/主題/耶和華的節期年曆總覽（利未記23章七大節期架構）.md
  summary: v1、7、12 的三個節期正是利23 節期表中七月的三個；本章給的是它們的祭物明細。
  relation: GT《聖經精讀本》說把這三個重要節期集中在一個月裡，「是為了振作以色列百姓屬靈的士氣,使他們盡情享受從神得到的一切祝福和恩典」。
- title: 七是節期中最要緊的數目
  path: link_folder/主題/七是節期中最要緊的數目.md
  summary: 本章的七月、每次七隻公羊羔、守節七日、第七日的七隻公牛、第八日的七隻羊羔都以七計。
  relation: GT《舊約聖經背景註釋》指出吹角日「發生在全年新月第七次出現的七月（參較安息日的循環），可能是它這麼重要的原因之一」；KingComments 也說住棚節七日意思是一段完全的、已成全的時期。
- title: 刻苦己心（禁食悔改）
  path: link_folder/主題/刻苦己心（禁食悔改）.md
  summary: v7 命令贖罪日要刻苦己心；STEP 是 H6031B Piel 動詞 ve./'i.ni.Tem 加 H5315I naf.sho.tei/Khem（你們的魂）。
  relation: GT 丁良才說「這吩咐，大概也包括禁食的意思。雖然摩西五經上沒有提到這事，以色列人當大贖罪日也禁食（徒二十七9）」；BibleHub 也說這句傳統上理解為禁食、苦待自己的魂。CT 則解作為罪憂傷痛悔，往往伴隨禁食禱告。
- title: 銀號
  path: link_folder/文化/銀號.md
  summary: GT 丁良才在 v6 指出「每月朔祭司就吹銀號筒（十10）」，並記下猶太注釋家說吹角節當日除祭司的銀號外，百姓從日出到日落也吹角。
  relation: 本章 v1 的原文只寫 te.ru.'Ah（大聲呼喊），沒有指名樂器；銀號與公綿羊角哪一種才是當日所吹的，各家說法不同，經文本身不作判定。
- title: 銀號與主再來天使吹號（太24：31）
  path: link_folder/互文/銀號與主再來天使吹號（太24：31）.md
  summary: GT《聖經精讀本》說吹角節的角聲「象徵著告知耶穌基督的初臨和再臨的信息(太24:31;林前15:52;帖前4:16)」。
  relation: BibleHub 也把 v1 的號聲與帖前4:16 相連；CT 則說吹角是「號召四散的以色列人聚集，迎接彌賽亞的來臨」；KingComments 也把吹角節讀成神重新對待以色列的起點。
- title: 三大節期
  path: link_folder/神學/三大節期.md
  summary: BibleHub 在 v12 說住棚節是以色列三大朝聖節期之一，男丁都要上耶路撒冷朝見耶和華（申16:16）。
  relation: GT《舊約聖經背景註釋》補上實務面：秋收之後「尚有餘暇前往耶路撒冷朝聖」，而住棚節大量的祭牲也反映了為眾多朝聖者提供食物的需要。
- title: 住棚裡是棚或帳的難題
  path: link_folder/解經爭議/住棚裡是棚或帳的難題.md
  summary: GT 串珠說住棚節期間「百姓在帳棚居住七天」，紀念祖先出埃及後在帳棚中居住（利23:42-43）；GT《舊約聖經背景註釋》則說這節期的象徵是「建築以綠葉為裝飾的棚，讓收割者可以休息」。
  relation: 同一個節期，兩個子來源分別用帳棚與綠葉棚描述；本章只列祭物，不描述住的形式，因此不替任何一種說法作結。
- title: 鬼魔（seirim，公山羊）
  path: link_folder/原文/鬼魔（seirim，公山羊）.md
  summary: 本章十次贖罪祭全部用公山羊；STEP 標 H8163B se.'ir- 加 H5795 'i.Zim，字面是山羊中的一隻公山羊。
  relation: 同一個 se.ir 在利17:7 被用來指百姓所獻祭的「鬼魔」；本章的用法是純粹的祭牲名，兩處共用同一個字。
- title: 安息日
  path: link_folder/神學/安息日.md
  summary: CT 在 v35 說第八日的嚴肅會「這日視同安息日，不可作工，百姓要到會幕前聚集(參利二十三36)」。
  relation: KingComments 也把住棚節七日與安息日並比，說這節期像安息日一樣，指向和平的國度；本章四個聖日的禁工命令都建立在同一個原則上。
- title: 宗教曆與民事曆兩種曆法
  path: link_folder/背景/宗教曆與民事曆兩種曆法.md
  summary: v1 的「七月初一日」同時落在兩套曆法上：GT《啟導本聖經註釋》說它「乃民事曆的年首」，GT 丁良才說它是「聖年七月初一號，就是常年的正月初一」。
  relation: BibleHub 補上月名與換算：希伯來曆的七月是提斯利月，通常落在九月或十月。GT《舊約聖經背景註釋》另指出吹角日成為新年慶典「是被擄歸回以後的事」。
- title: 七十的屬靈意義
  path: link_folder/原文/七十的屬靈意義.md
  summary: 住棚節七日的公牛從十三隻逐日遞減到七隻，GT 丁良才算出「每天減去一隻，到七天有七隻，共有七十只」，GT《聖經精讀本》也列出算式 13＋12＋11＋10＋9＋8＋7。
  relation: GT《聖經精讀本》把這個總數讀成「表示對神完全的奉獻和忠心」；這是七十作為完全數目在節期獻祭上的一次出現。
- title: 守節
  path: link_folder/原文/守節.md
  summary: v12「要向耶和華守節七日」用的是同源動詞加名詞：H2287 ve./cha.go.Tem 加 H2282 chag。
  relation: CT 的原文字義欄也標明「守節(原文雙字)」，首字是過節、次字是節慶集會、筵席；GT 丁良才說本節期為會眾所獻的祭牲比一切別的節期都多，「或者是因為本節是一年之莊稼的感恩節」。
