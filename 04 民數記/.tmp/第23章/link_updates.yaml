book: 民數記
chapter: 23
updates:
- title: 巴勒
  path: link_folder/人物/巴勒.md
  summary: 民數記23:1-30：巴勒三次照巴蘭的話築七座壇、獻七牛七羊，三次換地方，最後說「你一點不要咒詛他們，也不要為他們祝福」。
  relation: 本章把巴勒的挫敗一步步寫出來。CT 指出第11節「不料」原文是「看哪！」，而「『你竟…』原文是加重語氣的強調」；第25節他退到寧可兩樣都不要；第27節又想再試一次。GT 丁良才《民數記註釋》說他「因發怒，先要哄巴蘭全然住口（25）。後來卻想，不如再試一次，或者能使神改變心意」。CT 在第27節的〔話中之光〕給的評語最重：「人的想法就是這樣無知，以為地方轉換了，神也就會改變了」。
- title: 巴蘭（比珥的兒子）
  path: link_folder/人物/巴蘭（比珥的兒子）.md
  summary: 民數記23:1-30：巴蘭三次要求築七座壇，兩次題起詩歌祝福以色列，並兩次告訴巴勒他只能說神放在他口中的話。
  relation: 本章讓巴蘭的兩面同時運作：他用的是術士的排場（七壇、淨光的高處、往前去求兆頭），說出來的卻是祝福。CT 從第1節就下判斷——築七座壇「顯然不是按照向耶和華真神獻祭的條例，因此他不是真先知」；GT 丁良才卻在第3節指出「這一句顯明巴蘭不是專意靠法術」。他在第10節說出「我願如義人之死而死」，丁良才的評語是：「有許多人如同巴蘭一樣，願意如義人之終而終，卻不肯做義人」。
- title: 摩押人
  path: link_folder/人物/摩押人.md
  summary: 民數記23:6、17：巴勒同摩押的使臣都站在燔祭旁邊，等巴蘭帶話回來。
  relation: 摩押的達官貴人在本章全程在場。CT 說第6節的「摩押的使臣」包括摩押的達官貴人；第17節他們又和巴勒一同站在燔祭旁邊。BH 指出這群首領的出現說明事情的政治份量——這不是巴勒個人的請託，而是一國面對威脅時的集體行動。他們親耳聽見的，卻是一篇又一篇祝福以色列的詩歌。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 民數記23:3、6、15、17：巴勒四次被寫成站在燔祭旁邊等候巴蘭的答覆。
  relation: 這是本章最反覆出現的畫面，也是最大的諷刺：獻祭的人一直站在祭壇旁邊，等一個永遠不會來的咒詛。KC 從燔祭的意義解釋為什麼不會來——巴勒也許聽說過以色列向他們神所獻的祭，想照樣做來換取咒詛的許可，卻完全不明白燔祭代表什麼；燔祭說的是主耶穌完全獻上自己歸榮耀給神，神因此不看信徒的失敗，乃是在主耶穌裡看他們。CT 在第4節的〔話中之光〕也說，獻上完全的祭而心裡卻盼望能咒詛以色列，這樣的敬拜必然歸空。
- title: 公羊
  path: link_folder/神學/公羊.md
  summary: 民數記23:1-2、14、29-30：三次都是每座壇上獻一隻公牛、一隻公羊，合計七牛七羊。
  relation: GT《舊約聖經背景註釋》說明這個組合的份量：公牛與公羊「這兩樣是古代近東最珍貴、最高價的牲口。獻之為祭就是表示崇拜者盡了最大的努力來取悅神明，以求得其幫助」，並舉約伯為三友所獻的贖罪祭作對照——同樣是這兩種動物每樣七隻。本章的用法卻與獻祭條例相反：不是求神赦免，而是想買一個咒詛。
- title: 亞蘭
  path: link_folder/地點/亞蘭.md
  summary: 民數記23:7：「巴勒引我出亞蘭，摩押王引我出東山」
  relation: 這是巴蘭自己交代來歷。CT 說「『亞蘭』指米所波大米，巴蘭的故鄉(參二十二5)」，並說「『東山』亞蘭位於東方」。GT《民數記串珠聖經註釋》補上一句：「「東山」：指巴蘭的故鄉（亞蘭是在東方）。」BH 另指出一層反諷——亞蘭是列祖如亞伯拉罕的故土，而巴勒卻從那裡請人來咒詛亞伯拉罕的後裔。
- title: 咒詛（a.rar 與 qa.vav）
  path: link_folder/原文/咒詛（a.rar 與 qa.vav）.md
  summary: 民數記23:7-8：巴勒的請求用 a.rar（H779），巴蘭的回答改用 qa.vav（H6895）；「怒罵」兩處都是 za.am（H2194）。
  relation: 本章延續了民22 的兩動詞分佈，而且分工更清楚。STEP 原文資料顯示，第7節巴蘭轉述巴勒的話「來啊，為我咒詛雅各」用 H779，第8節他自己的回答「神沒有咒詛的，我焉能咒詛」則兩次都用 H6895。同一節的「怒罵」前後都是 H2194（za.am，簡要義域 be indignant）。CT 指出「『咒詛…怒駡』也是同義詞，均指但願神使以色列人衰敗」，而 STEP 顯示原文其實不只用了一個字。
- title: 卦金（qe.sem）
  path: link_folder/原文/卦金（qe.sem）.md
  summary: 民數記23:23：「也沒有占卜可以害以色列」——這裡的「占卜」原文是 Ke.sem（H7081）。
  relation: 這是本卷最直接的一個原文對照：民22:7 摩押與米甸的長老帶著卦金去見巴蘭，那個「卦金」在 STEP 原文資料裡是 ke.sa.Mim（H7081）；民23:23 宣告沒有占卜可以害以色列的「占卜」是同一個字的單數 Ke.sem（H7081）。付出去的東西與被宣告無效的東西，在原文裡是同一個詞。GT《啟導本聖經註釋》因此說：「巴蘭承認他的法術、占卜都無用，不能阻止神的祝福。」
- title: 祝福與咒詛
  path: link_folder/主題/祝福與咒詛.md
  summary: 民數記23:8、11、20、25：「神沒有咒詛的，我焉能咒詛」「我奉命祝福；神也曾賜福，此事我不能翻轉」；巴勒最後要他兩樣都別做。
  relation: 本章是這個主題最集中的一次展開。CT 在第20節列出「此事我不能翻轉」的四個意思：神不會改變、神不記念他們的罪、神和他們同在、神曾為他們施展大能；GT 丁良才在同節也列出以色列穩妥的四種緣故，並各附平行經文。CT 在第20節的〔話中之光〕另說：「神沒有咒詛的，他不能咒詛(參8節)。神要賜福，他不能翻轉。讓我們將這個原則，深深的銘刻在我們心中。」
- title: 巴蘭是先知還是術士
  path: link_folder/解經爭議/巴蘭是先知還是術士.md
  summary: 民數記23:1、3：CT 從七座壇判定他不是真先知；GT 丁良才卻從第3節下半判斷他不是專意靠法術。
  relation: 本章給這場爭議添了兩組相反的證據。指向術士的：七座壇不合獻祭條例（CT）、上淨光的高處求兆頭（GT《舊約聖經背景註釋》推測是藉雀鳥飛行的途徑來求得兆頭）、GT《聖經精讀本》說他「錯誤地認為神已經悅納了自己所獻的外邦宗教的祭物」。指向先知的：神兩次主動迎見他、兩次把話放在他口中，而 KC 說巴蘭的這些宣告是聖經中第一批偉大的先知性話語——雖然 KC 同時堅持說這話的是一個假先知，只是被迫宣告真預言。
- title: 神的後悔與憂傷
  path: link_folder/神學/神的後悔與憂傷.md
  summary: 民數記23:19：「神非人，必不致說謊，也非人子，必不致後悔。」
  relation: 這一節是舊約談神後悔時最常被引用的反面陳述。STEP 原文資料顯示「後悔」是 ve./yit.ne.Cham（H5162H），形態是反身，本節譯義作 so he may change his mind；GT《民數記串珠聖經註釋》一句話解完：「即改變主意」。CT 說「『後悔』指改變心意」。丁良才在此列出撒上15:29、瑪3:6、羅11:29、多1:2、來13:8、雅1:17 一串平行經文。本章的處境使這句話特別有力——巴勒正是靠神也許會改主意這個假設在行動。
- title: 神的主權
  path: link_folder/神學/神的主權.md
  summary: 民數記23:5、12、16、20、26：耶和華兩次將話放在巴蘭口中；巴蘭兩次說他只能說神所說的。
  relation: CT 在第5節指出關鍵：「『耶和華將話傳給巴蘭』按照原文意指神將祂的話放在巴蘭的口裡，表示要利用巴蘭的口為祂傳話」；第12節則說「『傳給我的話』原文是「放在我口中的話」」。GT《聖經精讀本──民數記註解》說神「已經知道巴蘭的內心充滿了貪婪,所以只使用他的口為工具,去祝福以色列百姓」，並說神「掌管自己的計畫和歷史,在他沒有後悔」。也就是說，本章的主權不只表現在攔阻上，更表現在徵用上——神用一個為錢而來的人，說出祂自己要說的話。
- title: 因信稱義
  path: link_folder/神學/因信稱義.md
  summary: 民數記23:21：「他未見雅各中有罪孽，也未見以色列中有奸惡。」
  relation: KC 用整段把這一節讀成稱義的舊約寫照：巴蘭的預言裡完全沒有出現罪或罪咎的問題，而這之所以可能，是因為主耶穌所成就的工作；他並指出稱義超過赦免——被稱為義的人，是神宣告他從未犯過罪的人。KC 兩次引羅8:33-34 與羅8:1。GT 丁良才的說法方向相同：「神在耶穌裡也看信徒為無罪的（羅四5-8）。」CT 則從舊約自身的機制解釋：祭壇上的祭牲與會幕中的榮耀遮蓋了他們的殘缺。
- title: 分別為聖
  path: link_folder/神學/分別為聖.md
  summary: 民數記23:9：「這是獨居的民，不列在萬民中。」
  relation: CT 說這句話「表徵他們是分別出來歸神為聖的」。KC 把分別為聖的積極面講得最完整：分別不是消極地與某些事物分開，而是為了一個目的被分別出來——為神而活；他並引約17:16 說基督徒在世界裡卻不屬世界。GT《聖經精讀本》提醒這是特權不是孤立：「這句話暗示著以色列百姓與列邦不同,是擁有榮耀和特權的民族」。STEP 原文資料另顯示「不列在萬民中」的動詞是反身形（H2803H），本節譯義作 it reckons itself。
- title: 亞伯拉罕之約
  path: link_folder/神學/亞伯拉罕之約.md
  summary: 民數記23:10：「誰能數點雅各的塵土？誰能計算以色列的四分之一？」
  relation: GT 丁良才《民數記註釋》直接指出這句話「是應驗創十三16節、二十八14節的話」；GT《啟導本聖經註釋》說法相同並補上創15:5-6。也就是說，巴勒站在山頂上看見的那片營帳，正是幾百年前給亞伯拉罕的應許的實物。BH 也把這一節讀成神向亞伯拉罕所立之約的應驗。這也解釋了為什麼咒詛在本章完全無效——要動搖的不是一個民族的運氣，而是一個已經在兌現中的應許。
- title: 先知
  path: link_folder/主題/先知.md
  summary: 民數記23:5、16：耶和華兩次把話放在巴蘭口中；巴蘭兩次題起詩歌宣告。
  relation: 'KC 說巴蘭的這些宣告是聖經中第一批偉大的先知性話語，並補上一個關於記載的說明：這些話不是對以色列說的，摩西也沒有在場聽見，然而摩西受聖靈感動把它們寫了下來。GT《啟導本聖經註釋》從體裁上說明這些宣告的形式——對句法，第一句與第二句相對。而 STEP 原文資料顯示「詩歌」在原文是 me.sha.L/o（H4912，簡要義域 ma.shal: proverb），是箴言體而非歌謠。'
- title: 巴力的高處（Bamoth-baal）
  path: link_folder/地點/巴力的高處（Bamoth-baal）.md
  summary: GT《民數記串珠聖經註釋》把本章的三個地點與民22:41 的巴力的高處串成一組：巴力的高處、毘斯迦山與毘珥山。
  relation: 本章雖然沒有再提這個地名，但它是三次嘗試的第一站。GT《民數記串珠聖經註釋》說巴勒領巴蘭到三個地方，「三處都可看到以色列營的一部分，以為只要選擇到適合的地點，巴蘭便會成全他的願望。這種想法實在是愚昧的迷信」。也就是說，民22 結尾的那座高處不是孤立的一次，而是一套方法的開頭——而這套方法在本章連試三次都失敗。
- title: 曠野
  path: link_folder/地點/曠野.md
  summary: 民數記23:28：「巴勒就領巴蘭到那下望曠野的毘珥山頂上。」
  relation: 本章最後一個觀察點是俯視曠野的。CT 指出「『曠野』原文是Jeshimon，可能指一處荒野山谷」。KC 讀出巴勒挑這裡的用意：他要巴蘭在曠野的處境中看這民，因為人在日常景況中的樣子，往往和主日不一樣。BH 也說曠野的荒涼與應許之地的豐饒成對比，同時提醒讀者以色列正是在這片曠野裡經歷神四十年的供養。
- title: 摩押地
  path: link_folder/地點/摩押地.md
  summary: 民數記23:14、28：瑣腓田與毘斯迦山頂、下望曠野的毘珥山頂，都在摩押境內。
  relation: 本章把摩押北疆的幾個制高點一一走過。GT《啟導本聖經註釋》說「毗斯迦山在死海東北部」；CT 說毘珥山「是毗斯迦西南的一個山峰，正與以色列人安營的谷相對(參申三29；四46)，離摩西安葬的地方不遠(參申三十四6)」。GT《舊約聖經背景註釋》說瑣腓用來形容毘斯迦時，指的是「摩押高原可以西眺望迦南（參二十一20）的山岬」。這片高地同時是巴勒的主場，也是摩西日後眺望應許之地的地方。
- title: 後裔如地上的塵沙
  path: link_folder/原文/後裔如地上的塵沙.md
  summary: 民數記23:10：「誰能數點雅各的塵土？」
  relation: 創13:16 的應許在這一節被一個外邦術士當面確認。GT 丁良才《民數記註釋》說這句話「是應驗創十三16節、二十八14節的話」；KC 指出其中的反諷——巴勒費盡力氣要讓巴蘭只看到一小部分，巴蘭卻連這四分之一都說數不清，那全民該有多大。CT 解釋「四分之一」的來歷：以色列營地分成東、西、南、北四個營盤，指的是其中一個營盤。
- title: 古代近東立約
  path: link_folder/背景/古代近東立約.md
  summary: GT《舊約聖經背景註釋》在民數記23:1 用條約召請神明的作法解釋七座壇的來歷。
  relation: 這一則背景把本章的七座壇放進條約文化裡：「可以想像得到，國際條約簽署時或會召請神明作為協議的見證（* 亞述王以撒哈頓與推羅之巴力簽署條約時，召請「七神」），並且為每一神祇築壇獻祭（見：創三十一44～54）。」它並補充美索不達米亞與條約無關的文獻，也證實了用七個祭壇同時向高位之神獻祭的習慣。換句話說，巴蘭要的可能不是一座壇的七倍，而是七位神明各一座。
