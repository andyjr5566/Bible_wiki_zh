book: 民數記
chapter: 23
candidates:
- name: 巴勒
  type: 人物
  evidence: v1-30 巴勒三次築壇、三次換地方，最後說「你一點不要咒詛他們，也不要為他們祝福」
  surfaces:
  - phrase: 巴勒
- name: 巴蘭（比珥的兒子）
  type: 人物
  evidence: v1-30 巴蘭三次要求築七座壇、兩次題起詩歌祝福以色列
  surfaces:
  - phrase: 巴蘭
- name: 摩押人
  type: 人物
  evidence: v6、v17「摩押的使臣」都站在燔祭旁邊；v7「摩押王引我出東山」
  surfaces:
  - phrase: 摩押的使臣
- name: 燔祭
  type: 神學
  evidence: v3、6、15、17 巴勒站在燔祭旁邊；KC 說燔祭表明神不看信徒的失敗、乃在基督裡看他們
  surfaces:
  - phrase: 燔祭
- name: 公羊
  type: 神學
  evidence: v1、2、14、29、30 每座壇上獻一隻公羊
  surfaces:
  - phrase: 公羊
- name: 亞蘭
  type: 地點
  evidence: v7「巴勒引我出亞蘭」；CT 說亞蘭指米所波大米、是巴蘭的故鄉
  surfaces:
  - phrase: 亞蘭
    verses:
    - 7
- name: 咒詛（a.rar 與 qa.vav）
  type: 原文
  evidence: v7 巴勒的話用 a.rar（H779），v8 巴蘭的回答改用 qa.vav（H6895）；本章延續民22 的兩動詞分佈
  surfaces:
  - phrase: 咒詛
- name: 卦金（qe.sem）
  type: 原文
  evidence: v23「也沒有占卜可以害以色列」的「占卜」是 qe.sem（H7081），與民22:7 長老手裡拿的「卦金」同一個字
  surfaces:
  - phrase: 占卜
    verses:
    - 23
- name: 祝福與咒詛
  type: 主題
  evidence: v8「神沒有咒詛的，我焉能咒詛」、v20「我奉命祝福；神也曾賜福，此事我不能翻轉」、v25 巴勒要他兩樣都別做
  surfaces:
  - phrase: 祝福
- name: 巴蘭是先知還是術士
  type: 解經爭議
  evidence: v1 CT 說築七座壇「顯然不是按照向耶和華真神獻祭的條例，因此他不是真先知」；v3 丁良才卻說「這一句顯明巴蘭不是專意靠法術」
- name: 神的後悔與憂傷
  type: 神學
  evidence: v19「神非人，必不致說謊，也非人子，必不致後悔」；STEP 顯示「後悔」是 na.cham（H5162H）反身形
- name: 神的主權
  type: 神學
  evidence: v5、16 耶和華將話傳給巴蘭；v20「此事我不能翻轉」；GT《聖經精讀本》說神掌管自己的計畫和歷史
- name: 因信稱義
  type: 神學
  evidence: v21「他未見雅各中有罪孽，也未見以色列中有奸惡」；KC 用整段講稱義並引羅8:1、8:33-34
- name: 分別為聖
  type: 神學
  evidence: v9「這是獨居的民，不列在萬民中」；CT 說表徵他們是分別出來歸神為聖的
- name: 亞伯拉罕之約
  type: 神學
  evidence: v10「誰能數點雅各的塵土」；丁良才說這是應驗創13:16、28:14 的話
- name: 先知
  type: 主題
  evidence: v5、16 神將話放在巴蘭口裡；KC 說巴蘭這些詩歌是聖經中第一批偉大的先知性宣告
- name: 巴力的高處（Bamoth-baal）
  type: 地點
  evidence: GT《民數記串珠聖經註釋》說巴勒領巴蘭到三個地方——巴力的高處（22:41）、毘斯迦山與毘珥山
- name: 曠野
  type: 地點
  evidence: v28「巴勒就領巴蘭到那下望曠野的毘珥山頂上」
  surfaces:
  - phrase: 曠野
    verses:
    - 28
- name: 摩押地
  type: 地點
  evidence: v14、28 瑣腓田、毘斯迦山頂與毘珥山頂都在摩押境內
- name: 七座壇與七牛七羊
  type: 文化
  evidence: v1-2、14、29-30 三次都築七座壇、每座獻一牛一羊；GT《背景註釋》舉亞述王以撒哈頓與推羅之巴力的條約召請「七神」為例
  surfaces:
  - phrase: 七座壇
- name: 詩歌（ma.shal）
  type: 原文
  evidence: v7、18「巴蘭便題起詩歌說」；STEP 顯示原文是 me.sha.L/o（H4912），簡要義域 proverb；CT 給的原文字義是「箴言，比喻」
  surfaces:
  - phrase: 詩歌
- name: 淨光的高處（she.phi）
  type: 原文
  evidence: v3「於是巴蘭上一淨光的高處」；STEP 顯示原文是 She.fi（H8205），簡要義域 bareness
  surfaces:
  - phrase: 淨光的高處
    verses:
    - 3
- name: 瑣腓田與毘斯迦山頂
  type: 地點
  evidence: v14「於是領巴蘭到了瑣腓田，上了毘斯迦山頂」；GT《背景註釋》說「瑣腓」的意思是「守更者」、「守望者」
  surfaces:
  - phrase: 瑣腓田
    verses:
    - 14
  - phrase: 毘斯迦山頂
    verses:
    - 14
