- name: 斷沒有法術可以害雅各
  type: 神學
  evidence: v23；STEP 顯示「法術」是 na.chash（H5173）、「占卜」是 qe.sem（H7081）；CT 說任何邪術都不能使神與他們有隔閡
- name: 巴蘭的七篇詩歌
  type: 主題
  evidence: GT《啟導本》說自民23:7 至民24:25 一共載有巴蘭的七首詩歌、用的是對句法；KC 另分成四篇並列出四個遞進的神名
