  type: 解經爭議
  evidence: v13、27 巴勒兩次要巴蘭換地方；CT 話中之光說人以為地方轉換了神也就會改變了；GT《串珠》說這種想法實在是愚昧的迷信
- name: 後裔如地上的塵沙
  type: 原文
  evidence: v10 丁良才說「誰能數點雅各的塵土」是應驗創13:16、28:14 的話；KC 與 BH 也都引創13:16
- name: 誰能控告神所揀選的人（羅8：33-34）
  type: 互文
  evidence: KC 在 v23 引羅8:33-34；BH 在 v8 也引同一段說明真正的審判只屬於神
- name: 神必不致說謊也不後悔（撒上15：29）
  type: 互文
  evidence: v19 丁良才引撒上15:29 兩次；KC 也引撒上15:29 與羅11:29
- name: 猶大是小獅子（創49：9）
  type: 互文
  evidence: v24 GT《啟導本聖經註釋》說「本節暗合《創世記》四十九9的話」
- name: 古代近東立約
  type: 背景
  evidence: GT《舊約聖經背景註釋》說國際條約簽署時或會召請神明作為協議的見證，亞述王以撒哈頓與推羅之巴力簽署條約時召請「七神」，並為每一神祇築壇獻祭
