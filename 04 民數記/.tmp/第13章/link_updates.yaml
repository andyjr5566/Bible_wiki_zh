book: 04 民數記
chapter: 13
updates:
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第8節他以本名「何西阿」列在以法蓮支派的探子名單中，第16節「摩西就稱嫩的兒子何西阿為約書亞」。GT《民數記串珠聖經註釋》：「約書亞原名為何西阿（16），起初是摩西的助手（出24:13），後來被神立為摩西的接班人（27:18）。」CT 補上他此前的資歷：他曾率領軍隊殺敗亞瑪力人（出十七9），又當過摩西的幫手（出二十四13）。
  relation: 本章是約書亞在民數記第一次以探子身分出現，也是他改名的落點。改名的時間點另有爭議（見同章「何西阿與約書亞改名時機與字意之解經爭議」）。KC 從這個舉動讀出兩人的關係：改名「也顯出摩西與約書亞之間存在的特別聯繫，一位年老的神人與一位年輕的神人之間的聯繫」。本章他沒有說話——GT 丁良才解釋原因：「因為約書亞既是摩西的幫手，他若說話，百姓必想他有偏心」，所以出頭的是迦勒；他要到下一章才與迦勒一同開口（民14:6）。
- title: 流奶與蜜之地
  path: link_folder/神學/流奶與蜜之地.md
  summary: 第27節探子回報：「我們到了你所打發我們去的那地，果然是流奶與蜜之地；這就是那地的果子。」GT 丁良才指出這正應了神先前的話：「照著神所應許的（出三8）。」這是十二個人一致同意的一句話——不信的十個人也否認不了。
  relation: 本章讓這個形容從應許變成當場的證物：那一掛要兩人抬的葡萄、石榴與無花果就擺在會眾眼前。GT《舊約聖經背景註釋》說明這句話在當時的實際內容：「對以畜牧維生的人而言，這話是描繪土產的豐盛；但對農夫來說卻不盡然。奶來自羊群，蜜──大概是指棗的果漿，不是指蜂蜜──是自然的出產。」它並指出烏加列史詩《巴力與摩特》有類似的話，「描述大地回復豐饒時，河谷流滿了蜜」。KC 從關係的角度讀這兩樣：奶是嬰孩從母親得的健康食物，蜜「是神百姓之間自然關係的寫照，說到弟兄相愛的甘甜」——「我們在奶與蜜裡找到縱向與橫向兩種關係的祝福」。同一份報告接著就用「然而」把這一切推開了（v28）。
- title: 迦南地
  path: link_folder/地點/迦南地.md
  summary: 第2節神稱它為「我所賜給以色列人的迦南地」，全章則是聖經中對它第一次系統性的實地描述：南北疆界（v21 從尋的曠野到利合、直到哈馬口）、地形分區（v29 南地、山地、海邊與約但河旁）、土產（v23、27）、居民（v28-29、33）。GT《啟導本聖經註釋》：「迦南的四界見三十四1～12，約等於今天的以色列、黎巴嫩和敘利亞南部大半。」
  relation: 從創世記到出埃及記，迦南地一直是應許裡的名字；本章第一次有人真的走進去、帶東西回來。GT《舊約聖經背景註釋》根據幾個地名算出探查的範圍：「這幾個參照點顯示探子探查了約但河和地中海之間，整個南北全長三百五十哩的地區。」GT《民數記串珠聖經註釋》注意到探子的用詞在這一章變了：「他們稱它為『你所打發我們去的那地』，但聖經通常描述這地為『耶和華向他們起誓應許之地』……他們改變了用詞反映他們心裡已忘了這是神應許之地。」STEP 原文資料顯示第2節神說的是 'a.Ni no.Ten（H5414G，詞典形 na.tan，詞典義 to give）——分詞形，字面是「我正在給」。
- title: 四十的屬靈意義
  path: link_folder/原文/四十的屬靈意義.md
  summary: 第25節：「過了四十天，他們窺探那地才回來。」KC 把這個數字的用法整理成一條線：「四十這個數字是試驗的數字（創7:17；出24:18；撒上17:16；王上19:8；拿3:4；可1:13；徒1:3）。對信心的試驗顯出信心的實況。」
  relation: 本章給了這個數字一個新的用法：它不是神施行的試驗期限，而是人自己走完的路程長度——CT：「遠路行走，總共花了四十天，表示他們調查得很詳盡。」GT《民數記串珠聖經註釋》從距離驗算：利合到哈馬口「兩地相隔二百五十英里之遙，來回用四十天時間也相當合理」。GT《聖經精讀本》另列出三個對照：挪亞時代洪水四十天（創7:17）、摩西在西乃山四十天（出24:18）、耶穌在曠野受試探四十天（路4:1,2），並下了一句評語：「事實上想要仔細窺探以色列百姓將永遠居住的迦南地，這個時間也許是不夠的。」這四十天之後緊接著的，是四十年——同一個數字在民14:34 從天數變成年數。
- title: 迦勒
  path: link_folder/人物/迦勒.md
  summary: 第6節他被列為猶大支派的探子；第30節在眾人惶恐時「在摩西面前安撫百姓」，說出全章唯一的信心宣告：「我們立刻上去得那地吧！我們足能得勝。」STEP 原文資料顯示這句話在原文是兩重加強語氣：「立刻上去」是 'a.Loh na.'a.Leh（H5927G，不定詞絕對式配未完成式），「足能得勝」是 ya.Khol nu.Khal（H3201，同樣結構），正對得上 CT 所註的兩個「原文雙同字」。
  relation: 十二個人看見的完全相同，說法卻分成兩派——CT 把差別歸到比較的對象：「十個人將偉人與他們自己比，但那兩人將偉人與神來較量。」GT 丁良才解釋為什麼出頭的是他而不是約書亞：「因為約書亞既是摩西的幫手，他若說話，百姓必想他有偏心。」KC 指出迦勒的信心不是無視危險：「他沒有把事情說成另一個樣子，也沒有輕看危險。他不是對危險無感，而是一個相信神所說的話的人。」這一章的立場決定了他四十年後的結局——GT《啟導本聖經註釋》：「雖然同代的人都死在巴蘭的曠野，他們卻得進入神所允許的迦南地。」
- title: 何西阿與約書亞改名時機與字意之解經爭議
  path: link_folder/解經爭議/何西阿與約書亞改名時機與字意之解經爭議.md
  summary: 第16節：「摩西就稱嫩的兒子何西阿為約書亞。」但出17:9 與出24:13 早就用了「約書亞」這個名字。GT 丁良才、艾基斯認為改名就在本章、出埃及記是回頭補用新名；GT 賈斯樂郝威命題15 認為「就是」不代表此前沒有這個名字；GT《民數記串珠聖經註釋》則說「按文法16節並沒有說明改名的時間，可能早在亞瑪力戰役之時已改了」。
  relation: 這個爭議在本章有它的位置：改名發生在名單的結尾、任務出發之前。GT《啟導本聖經註釋》讀出用意：「預示此人乃明日的領袖。」KC 也說摩西「必定是大聲清楚地宣告這個改名，作為對百姓的鼓勵」。名字的意思本身沒有爭議——GT《聖經精讀本》：約書亞是在「何西阿」（拯救）前面加上耶和華的簡寫；GT 艾基斯指出兩名「均源於字根yasa'」。
