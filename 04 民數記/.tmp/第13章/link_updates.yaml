book: "04 民數記"
chapter: 13
updates:
  - title: "約書亞"
    path: "link_folder/人物/約書亞.md"
    summary: "於出揚窺探前途之列中，身為以法蓮支派年輕代表與嫩之子何西阿，於本章首重獲領袖摩西加稱聖封為「約書亞」（意為「耶和華是拯救」），並出征四十載長日，為唯一與迦勒聯手堅信宣示得勝而反對不信群眾的一代偉略前鋒。"
    relation: "將救恩引召前衛者於浩大考驗前途上的榮銜宣誓與不搖忠純緊緊扣合，見證青年將帥蒙升屬天得勝之契與獨挑神命戰局的信實初典。"
  - title: "流奶與蜜之地"
    path: "link_folder/神學/流奶與蜜之地.md"
    summary: "全體探團返加低斯回覆考察時一致歡賀神旨無虛：「我們到了你所打發我們去的那地，果然是流奶與蜜之地；這就是那地的果子。」以手高抬的以實各重掛葡萄為無可撼動的甘榮鐵證。"
    relation: "展現在世人間具象物產如何親為天地至高主基督豐碩應許的確實先烈作保；那使人心神嚮的奶蜜美原不應為懼威所滅，而要激越全軍毫無遲拒地上趨進承！"
