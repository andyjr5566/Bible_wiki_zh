updates:
  - title: "約書亞"
    path: "link_folder/人物/約書亞.md"
    summary: "於各支派派出代表前往迦南地偵察的行動中，身為以法蓮支派代表、嫩的兒子何西阿，在此章明確獲摩西更名為「約書亞」（意即耶和華是拯救）；經過四十日考察，他與迦勒同為堅持對神不變依賴並給予正向結論、未陷於恐懼退卻之唯二前鋒與信心代言人。"
    relation: "經由探測前緣之重大關鍵，建立起使命領導者之核心標準：真切之信心是在全面洞察挑戰與難關後，不因外界物質與身量差距退卻，而是倚重拯救者的應許前行。"
  - title: "流奶與蜜之地"
    path: "link_folder/神學/流奶與蜜之地.md"
    summary: "全體十二名探子返回加低斯回覆考察結果時，一致證明神關於這座應許之地豐盈質地的宣言並非非真，並提出以實各谷攜至的手持一掛沉重飽實葡萄為證，直接宣示：「我們到了你所打發我們去的那地，果然是流奶與蜜之地；這就是那地的果子。」"
    relation: "神聖應許之真實與豐美可獲得客觀經驗與事實見證的映識；雖然客觀困境同在，地土的豐饒本身即驗明了立約者的信實與全意保守，並為信仰群體前進承領注入信心理據。"
