- name: 四十的屬靈意義
  suggested_type: 原文
  evidence: 第25節：「過了四十天，他們窺探那地才回來。」KC 指出這個數字的用法：「四十這個數字是試驗的數字（創7:17；出24:18；撒上17:16；王上19:8；拿3:4；可1:13；徒1:3）。對信心的試驗顯出信心的實況。」GT《聖經精讀本》另列出挪亞洪水四十天、摩西在西乃山四十天、耶穌在曠野受試探四十天三個對照。此條目目前只累積創7。
