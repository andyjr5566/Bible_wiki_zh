- name: 吞吃居民之地是什麼意思
  suggested_type: 解經爭議
  evidence: 第32節探子說迦南是「吞吃居民之地」，但第27節同一批人才說它「流奶與蜜」。GT 艾基斯《舊約聖經難題彙編》與賈斯樂郝威《聖經難解經文詮釋手冊》命題16 都專門處理這個矛盾，結論一致：不是指土地貧瘠，而是指這地太肥沃、引來各國爭奪而流人血。GT《民數記串珠聖經註釋》：「他們的意思是迦南人乃像食人的民族。」GT 丁良才：「意思說，那地的居民是常常彼此打仗。」四種讀法並不完全相同。
  target_path: link_folder/解經爭議/吞吃居民之地是什麼意思.md
