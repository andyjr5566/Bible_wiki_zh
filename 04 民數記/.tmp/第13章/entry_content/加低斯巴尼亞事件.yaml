name: "加低斯巴尼亞事件"
type: "歷史"
status: "formal"
definition: "指古代以色列民在長途逃離埃及並組構誓約體系後，駐紮於曠野加低斯（即加低斯巴尼亞）聆聽十二探子窺地報告時發生的關鍵轉向大變；此事件是整個進入迦南進程中的決定性分水嶺，直接導致群體於曠野浪遊延遲四十年。"
accumulations:
  - book: "民數記"
    chapter: 13
    summary: "探察成員全數於第26節歸返巴蘭曠野的加低斯，並向摩西、亞倫及全聚群體展示考察成果。但除迦勒與約書亞外的十個代表極度著墨於敵人強大及防線不可踰越之警報，催逼大局瞬間朝向失望氣衰、輕蔑誓約進程的歷史危機滑落。"
    relation: "示明歷史轉折上信仰共同體面對客觀障礙與心理恐慌時的群眾結構挑戰；加低斯即代表關鍵交點：在此地抉擇信隨則克得領土，屈從外界懼念則即轉墜長期自我流亡與審判之絕境。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT13.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT13.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/13)"
