name: "十二探子自巴蘭或加低斯巴尼亞出發之解經爭議"
type: "解經爭議"
status: "formal"
definition: "關於以色列十二探子窺探迦南美地的起點，民數記十三章明確引書自「巴蘭的曠野」發行與折回，而同期續篇和申命記卻指記為「加低斯（加低斯巴尼亞）或尋的曠野」，所誘致之歷史地理方位歸屬的研經統合討論。"
accumulations:
  - book: "民數記"
    chapter: 13
    summary: "第3節與26節記載探子「從巴蘭的曠野打發他們去」並「歸返到了巴蘭曠野的加低斯」。針對與他卷或他章提述起點為加低斯巴尼亞（民二十1；申一19-19等）是否產生衝突，《舊約聖經難題彙編》（艾基斯）與《丁道爾》釋曉說：巴蘭為龐大浩越、直申依拉夫港的南陲野原大系，加低斯即坐落在該廣漠中的關鍵駐地堡壘，兩者一屬整體行政巨域、一為具體宿地中心。"
    relation: "展露經本記載多層級地貌時極為精密真實的包融視度：上帝的話語同時包舉大區地理背景與小地名宿點，使曠野中的行止地標無論放大了看或聚焦於前哨綠洲皆準確嚴密不移。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT13.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT13.htm)"
  - "BibleHub Study: 研經註解 (https://biblehub.com/study/numbers/13.htm)"
