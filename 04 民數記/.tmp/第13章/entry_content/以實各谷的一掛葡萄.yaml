name: "以實各谷的一掛葡萄"
type: "主題"
status: "formal"
definition: "迦南南部希伯崙鄰邊極享盛譽的富碩農業山谷以實各（字義為「串、束或一挂葡萄」），因以色列十二探子入彼採斬出須仰雙男挑木合扛的碩烈雄長葡萄大串而成預表迦南物力無限與基督榮豐密甘之經世典籍代表。"
accumulations:
  - book: "民數記"
    chapter: 13
    summary: "正當仲春七月葡萄果初熱發秀時（第20節下），探隊親行履涉第23至24節名地：「他們到了以實各谷，從那裡砍了葡萄樹的一枝，上頭有一掛葡萄，兩個人用杠抬著，又帶了些石榴和無花果來。」隨後高扛帶赴加低斯民幕之前，作為實物鐵證證明那野土純是一派流暢豐饒奶蜜之壯富聖園。"
    relation: "構成天國基業恩潤極富與豐美深長的神聖具象徵兆：一掛葡萄需二人槓舉、石榴無花果香碩醉靈，揭出真信仰往目標非冷苦貧乏之地，而是象徵基督榮耀生命和教會團契全豐全美無上果園之先嘗體驗。"
sources:
  - "ccbiblestudy CT: 逐節註解 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04CT13.htm)"
  - "ccbiblestudy GT: 拾穗 (https://www.ccbiblestudy.org/Old%20Testament/04Num/04GT13.htm)"
  - "KingComments: 研經註解 (https://www.kingcomments.com/en/bible-studies/Num/13)"
