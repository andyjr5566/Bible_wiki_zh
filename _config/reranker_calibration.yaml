# Reranker 模型校準表
# 僅經實測 gold dataset 校準之模型（calibrated: true）方可依門檻自動給出 ✅ 建議使用既有條目 / 🆕 建議建立新條目。
# 未校準之模型（calibrated: false）只輸出排序與評分供參考，⚠ 由 semantic_lookup.py 的
# 檢索相似度規則（REPORT_FLAG_FLOOR，已跨 5 卷 151 候選實測）決定。
#
# 2026-08-20 申命記 smoke test（15 組跨卷 gold pair：申命記措詞的候選 → 創/出/利/民 既有條目，
# 模擬新章開發）量到的分佈，取代先前只有 3 個樣本的推論：
#
#   重排分數｜正確目標：中位數 0.957，區間 0.321–0.999；奪冠時最低 0.714
#   重排分數｜確實沒有正確目標的候選（利19/利20 實跑）：0.011–0.442
#   檢索相似度｜正確目標：中位數 0.599（0.497–0.705）；非目標近鄰中位數 0.493
#   Top1-Top2 margin：中位數 0.312，區間 0.000–0.952
#
# 兩個要點：
# (1) 先前「本語料重排分數只有 0.03–0.06、翻 calibrated 會一律輸出建新條目」是抽樣偏誤。
#     那批低分是因為那些候選**確實沒有對應條目**——低分才是正確答案。
#     真有對應時分數高得多（中位數 0.957），score_low 大致分得開兩者。
# (2) 但 0.321（正確目標最低）與 0.442（無對應候選最高）重疊，所以低分區不能給 🆕 太寬，
#     下面把 score_low 從 0.40 降到 0.30：低於 0.30 才敢說「沒有對應條目」。
#
# 仍維持 calibrated: false——15 筆是 smoke test 不是 gold dataset，
# 而且分數高不等於實體正確（本次有 5 筆重排把別的條目排到 0.99 以上而壓過正確目標）。
# 要翻 true 之前，需要在新章開發時累積更大的樣本並驗證「高分＝同實體」。

models:
  nvidia/llama-nemotron-rerank-vl-1b-v2:free:
    calibrated: false
    provisional_thresholds:
      score_high: 0.90        # smoke test：正確目標中位數 0.957、奪冠時最低 0.714
      score_low: 0.30         # smoke test：正確目標最低 0.321，低於此才敢判「沒有對應條目」
      margin_high: 0.20       # smoke test：margin 中位數 0.312
      margin_ambiguous: 0.10  # margin 分佈很散（0.000–0.952），模糊帶放寬

  nvidia/llama-nemotron-rerank-vl-1b-v2:
    calibrated: false
    provisional_thresholds:
      score_high: 0.90
      score_low: 0.30
      margin_high: 0.20
      margin_ambiguous: 0.10
