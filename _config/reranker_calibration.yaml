# Reranker 模型校準表
# 僅經實測 gold dataset 校準之模型（calibrated: true）方可依門檻自動給出
# ✅ 建議使用既有條目 / 🆕 建議建立新條目。未校準之模型（calibrated: false）
# 只輸出排序與評分供參考，⚠ 由 semantic_lookup.py 的檢索規則
# （REPORT_FLAG_FLOOR / REPORT_CONFIDENT_FLOOR）決定。
#
# ── 2026-08-20 量測（util/tests/smoke_reranker_calibration.py）────────────────
# 96 組跨卷 gold pair（申命記措詞的候選 → 創/出/利/民 既有條目，模擬新章開發時
# 每個候選都沒有字面對應），外加 4 個天然負例（全庫確實沒有對應概念）。
#
# 關鍵在於這一輪補上了**負控制**：同一個查詢把正確目標從候選集遮掉再重排，
# 模擬「這個概念其實還沒有條目」。先前 15 筆版本只量正例，等於只看了一半。
#
#   重排分數｜正例（正確目標，90 筆）：中位數 0.879｜0.015–1.000｜下四分位 0.441
#   重排分數｜遮罩負例（100 筆）　　：中位數 0.610｜0.022–0.999｜下四分位 0.231
#   Top1-Top2 margin：中位數 0.178｜0.000–0.968｜下四分位 0.049
#   重排把正確目標拉到 top-1：63/90（檢索階段 57/96）
#
#   score_high 掃描      正例命中        負例誤判（不該說有卻說有）
#     0.70               58/90 (64%)     44/100 (44%)
#     0.90               43/90 (48%)     22/100 (22%)
#     0.95               35/90 (39%)     15/100 (15%)
#     0.99               19/90 (21%)      5/100 ( 5%)
#   score_low 掃描       負例命中        正例誤判（該說有卻說沒有）
#     0.20               24/100 (24%)    15/90 (17%)
#     0.30               28/100 (28%)    19/90 (21%)
#     0.50               46/100 (46%)    24/90 (27%)
#
# ── 結論：calibrated 維持 false，而且這次是有證據的 false ────────────────────
# (1) 先前「本語料重排分數只有 0.03–0.06、翻 calibrated 會一律輸出建新條目」是
#     抽樣偏誤——那批低分是因為那些候選確實沒有對應條目，低分才是正確答案。
# (2) 但補上負控制後，反方向的推論也不成立：分數高**不代表**有對應條目。
#     負例中位數 0.610、最高 0.999，與正例分佈嚴重重疊。任何 score_high 都得在
#     「漏掉一半真對應」和「兩成無對應被誤判成有」之間二選一，兩邊都不能自動化。
# (3) 重排的實際貢獻是排序（top-1 57/96 → 63/90），不是「有沒有對應」這個判斷。
#     所以它該做的是把近鄰排好給人看，不是代替人下結論。
#
# 要翻 true 之前需要的不是更多樣本，而是先證明分數與「同實體」相關——
# 目前資料顯示它主要相關於「主題相近」，那是另一回事。
#
# 下列 provisional_thresholds 只在有人手動翻 calibrated 時生效，
# 取值是上表中各自方向最保守的一格（✅ 要最不容易錯、🆕 要最不容易漏）。

models:
  nvidia/llama-nemotron-rerank-vl-1b-v2:free:
    calibrated: false
    provisional_thresholds:
      score_high: 0.99        # 負例誤判 5%；再低就開始把無對應者說成有
      score_low: 0.20         # 正例誤判 17%；再高會製造重複條目
      margin_high: 0.20       # margin 中位數 0.178
      margin_ambiguous: 0.05  # margin 下四分位 0.049

  nvidia/llama-nemotron-rerank-vl-1b-v2:
    calibrated: false
    provisional_thresholds:
      score_high: 0.99
      score_low: 0.20
      margin_high: 0.20
      margin_ambiguous: 0.05
