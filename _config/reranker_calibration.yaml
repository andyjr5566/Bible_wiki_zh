# Reranker 模型校準表
# 僅經實測 gold dataset 校準之模型（calibrated: true）方可依門檻自動給出
# ✅ 建議使用既有條目 / 🆕 建議建立新條目。未校準之模型（calibrated: false）
# 只輸出排序與評分供參考，⚠ 由 semantic_lookup.py 的檢索規則
# （REPORT_FLAG_FLOOR / REPORT_CONFIDENT_FLOOR）決定。
#
# ── 2026-08-20 量測（util/tests/smoke_reranker_calibration.py）────────────────
# 96 組跨卷 gold pair（申命記措詞的候選 → 創/出/利/民 既有條目，模擬新章開發時
# 每個候選都沒有字面對應），外加 4 個天然負例（全庫確實沒有對應概念）。
#
# 關鍵在於這一輪補上了**負控制**：同一個查詢把正確目標從候選集遮掉再重排，
# 模擬「這個概念其實還沒有條目」。先前 15 筆版本只量正例，等於只看了一半。
#
#   重排分數｜正例（正確目標，90 筆）：中位數 0.879｜0.015–1.000｜下四分位 0.441
#   重排分數｜遮罩負例（100 筆）　　：中位數 0.610｜0.022–0.999｜下四分位 0.231
#   Top1-Top2 margin：中位數 0.178｜0.000–0.968｜下四分位 0.049
#   重排把正確目標拉到 top-1：63/90（檢索階段 57/96）
#
#   score_high 掃描      正例命中        負例誤判（不該說有卻說有）
#     0.70               58/90 (64%)     44/100 (44%)
#     0.90               43/90 (48%)     22/100 (22%)
#     0.95               35/90 (39%)     15/100 (15%)
#     0.99               19/90 (21%)      5/100 ( 5%)
#   score_low 掃描       負例命中        正例誤判（該說有卻說沒有）
#     0.20               24/100 (24%)    15/90 (17%)
#     0.30               28/100 (28%)    19/90 (21%)
#     0.50               46/100 (46%)    24/90 (27%)
#
# 結論：calibrated 維持 false，而且這次是有證據的 false。
# (1) 先前「本語料重排分數只有 0.03–0.06、翻 calibrated 會一律輸出建新條目」是
#     抽樣偏誤——那批低分是因為那些候選確實沒有對應條目，低分才是正確答案。
# (2) 但補上負控制後，反方向的推論也不成立：分數高**不代表**有對應條目。
#     負例中位數 0.610、最高 0.999，與正例分佈嚴重重疊。
# (3) 重排的實際貢獻是排序（top-1 57/96 → 63/90），不是「有沒有對應」這個判斷。
#
# ── 2026-08-26 生產線回溯（全庫 127 份 candidate_similarity.md）──────────────
# 這一輪不是造出來的 gold set，是把倉庫裡所有既有報告掃過一遍，看重排在真正
# 開章時到底做了什麼。方法：util 掃 */.tmp/*/candidate_similarity.md 的
# meta 與表格，再逐一回查那些候選今天是否成為條目。
#
# (A) 重排幾乎不開火：候選合計 3929，實際送重排的只有 14 個（0.36%）。
#     原因是 resolver 的字面比對先接手了絕大多數候選（同名／裸名／alias 命中
#     就直接歸 A/B 類，一次 API 都不打）。全庫只有四章曾觸發重排：
#       出26（1）、出28（1）、民21（7）、民35/36 這一輪的民36（5）；
#       民35 候選 32 個 → rerankable 0、status: not_needed。
#     ※ 報告在 render 之後重跑會從 success 變成 not_needed——新條目那時已經
#       進了索引、變成字面命中。要看重排數字必須看 render 前那一版報告。
#
# (B) 這 14 個的事後真值（回查條目今天存在與否）分得很開：
#
#   真陽性（候選該改用既有條目，2 個——該候選名今天都不存在，目標條目存在）
#     出26 法櫃（約櫃）              → [[約櫃]]          檢索 0.676  重排 0.865  margin 0.527
#     出28 亞倫的兒子（拿答、亞比戶…） → [[亞倫的祭司譜系]] 檢索 0.719  重排 0.781  margin 0.060
#
#   真陰性（確實該新建，12 個——今天都以該名存在）
#     民21 七個（那份報告是 adc8b420「勘誤(民21)：6 個章摘句條目改名重建」
#          當時跑的，候選就是改好的新名字）：重排 0.002 / 0.004 / 0.008 /
#          0.011 / 0.013 / 0.015 / 0.026，margin 0.000–0.013
#     民36 五個：重排 0.030 / 0.067 / 0.132 / 0.142 / 0.148，margin 0.013–0.079
#
#     正例下限 0.781｜負例上限 0.148——中間空了 0.63，比 gold set 乾淨得多。
#
# (C) 為什麼兩份資料看起來相反：gold set 的負例是「把正確目標遮掉之後剩下的
#     最佳鄰居」，那是人造的難負例；生產線的負例是「這概念全庫真的沒有對應」，
#     本來就好認。兩邊都對，只是量的不是同一件事。真正要防的是生產線那一型，
#     但 n=14（正例只有 2 個、還都出自出埃及記）遠不足以翻 calibrated。
#
# (D) 兩章新章實測另一件事：這一輪真正攔下「別建分岔」的不是重排，是**檢索**
#     相似度落在 REPORT_FLAG_FLOOR 0.50 與 REPORT_CONFIDENT_FLOOR 0.70 之間的
#     那條「需人工判斷」帶——
#       民35「誤殺人的與故殺人的（ra.tsach）」→ 既有 [[殺人（ratsach）]]（0.635）
#       民35「不可收贖價（ko.pher）」        → 既有 [[贖命的價銀]]（0.642）
#     那條帶目前是唯一在防重複條目的機制，維持現值。
#     同期跨分類 ⚠（候選=解經爭議 vs 條目=主題 這一型）民35 六個、民36 三個、
#     民21 六個，真陽性 0——跨分類 ⚠ 幾乎都是雜訊，看過否決即可。
#
# ── provisional_thresholds 的定位：保險絲，不是建議值 ──────────────────────
# 只在有人手動把 calibrated 翻成 true 時才生效。取值原則是「就算被翻開，
# 對我們實際看過的 14 個生產線案例也不要判錯」。
#
# 注意 semantic_lookup.py 是用 rerank_model 字串當 dict key 精確查表
# （calib_entry = models_calib.get(rerank_model, {})）。查不到不會報錯，
# 而是靜靜套用程式內建的寬鬆預設 0.70 / 0.40 / 0.20 / 0.15——比下面的保險絲
# 鬆得多，尤其 score_low 0.40 會把生產線全部 12 個真陰性連同任何低分真陽性
# 一起蓋成「建新條目」。model_endpoints.yaml 換成不帶 :free 的同一顆模型時
# 就會踩到這個坑，所以兩個 key 都要留著，值保持一致。

models:
  # 目前 model_endpoints.yaml 的 rerank 端點用的就是這個 :free 變體
  nvidia/llama-nemotron-rerank-vl-1b-v2:free:
    calibrated: false
    provisional_thresholds:
      score_high: 0.75        # 生產線正例下限 0.781、負例上限 0.148，取其間
      score_low: 0.0          # 停用「重排說沒有」這一支，理由見下
      margin_high: 0.20       # 出26（0.527）過、出28（0.060）不過；gold 中位 0.178
      margin_ambiguous: 0.05  # gold 下四分位 0.049；民36 實測中位 0.044，兩份一致

  # 不帶 :free 的同一顆模型；查表是精確比對，缺這個 key 會靜默降級成程式預設值
  nvidia/llama-nemotron-rerank-vl-1b-v2:
    calibrated: false
    provisional_thresholds:
      score_high: 0.75
      score_low: 0.0
      margin_high: 0.20
      margin_ambiguous: 0.05

# ── score_low 為什麼設成 0.0（等於關掉那一支）──────────────────────────────
# score_low 是「低於此分就敢說沒有對應條目、直接輸出 🆕 建新條目」的線。
# 兩種錯的代價差很多：說「🆕」而其實有 → 產生重複條目，事後要人工
# merge_entries，是本庫最貴的錯；說「⚠ 請確認 X」而其實不是 → 人看一眼否決。
#
# 生產線 14 筆看起來 0.148–0.781 之間任何值都「答對」，但那是拿 14 個點
# （其中正例只有 2 個）去配一條線，而配錯的方向正好是最貴的那一邊。
# 舊值 0.20 更糟：民36 五個候選重排上限 0.148，5/5 會被自動蓋成「建新條目」，
# 那道門等於完全不設防。
#
# 設成 0.0 之後 `top1_r < score_low` 恆為假，🆕 與「兩階段判定不一致」兩支
# 都不會由重排觸發，判斷交還給 (D) 那條 0.50–0.70 檢索帶與人工。代價是
# 失去「重排說沒有、檢索說有」的不一致警告——用不到的自動判定換掉一個提示，
# 在這個代價結構下划算。
#
# 換 rerank 模型或換 embedding 模型後，兩份資料都要重測：
#   gold set  → python -m pytest util/tests/smoke_reranker_calibration.py
#   生產線回溯 → 掃 */.tmp/*/candidate_similarity.md 的 rerank 欄與 meta，
#                並回查那些候選今天是否成為條目（真值只能這樣拿）
