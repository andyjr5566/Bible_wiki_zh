mini_intro: 下圖把南北兩國的王照年代排在一起，顏色是經文對他們的評語；最右邊一欄是同時期的先知。北國的王幾乎都是紅色；猶大有好有壞，好王當中也有許多帶著但書或後來轉變。
summary:
  - 北國以色列前後有 {north_total} 位王（連和暗利爭位的提比尼在內），出自 {north_dynasties} 個家族，其中 {north_usurped} 位是殺了前王篡位的。經文說他行正的只有{north_good_phrase}，而且後面接著但書。
  - 猶大的王除了亞他利雅都出自大衛家。經文說他行正的 {judah_good} 位王裡，有 {judah_high_places} 位的評語後面跟著「只是邱壇還沒有廢去」。
  - 經文寫明和哪位王同時的先知有 {prophets_dated} 位，以利亞、以利沙、以賽亞、耶利米都在其中。
