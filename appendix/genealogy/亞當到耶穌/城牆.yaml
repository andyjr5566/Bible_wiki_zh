# 畫面是一個示意的圈（不照真實比例、不畫地形），照經文出現的次序繞一圈，從羊門出發、回到羊門。
# ring 的每一項照經文次序排：
#   gate：城門；tower：城樓；place：牆上別的地方（寬牆、挖成的池子）。名字必須在 at 那一節逐字出現。
