# 帶你讀經：網站讀經模式逐節標記的裁決（唯一來源；由 ../reading.py 套用並檢查）
#
# 程式依人物資料自動標出每一節的人名；以下只寫程式判斷不了或判斷錯的地方。
#   decide：某一節的某個名字是誰。at 寫「名字@第幾次出現」；id 寫人物；
#           經文沒交代是哪一位的，寫 skip 和理由（只在經文裡亮，不連到任何人）。
#   title_of：某一節的職稱屬於誰（「-」表示不屬於特定的人）。
#   places：地點條目以外，另外要標成地名的詞。
book: 代上
book_full: 歷代志上
chapters: [1, 9]
verse_count: 407
genealogy: ../歷代志上/genealogy.yaml
# 地點條目以外的城名（多半是利未人的城邑，只出現在這幾節）
places: [雅提珥, 以實提莫, 希崙, 阿勒篾, 約緬, 亞乃, 比連, 大比拉, 亞年, 瑪沙, 押頓, 戶割, 利合, 哈們, 臨摩挪, 他泊, 雅哈撒, 阿挪, 羅德, 尼他應, 基低拉, 巴力黑們, 示尼珥, 哈臘, 哈博, 哈拉, 歌散河]
# 經文裡的名字，但不是人物資料裡的人（多半是只出現一次、沒有獨立條目的妻子或外邦人）
names:
  代上2:18: [阿蘇巴, 耶略]
  代上2:19: [阿蘇巴, 以法他]
  代上2:24: [亞比雅]
  代上2:26: [亞他拉]
  代上2:34: [耶哈]
  代上2:35: [耶哈]
  代上2:50: [以法他]
  代上4:4: [以法他]
  代上4:5: [希拉, 拿拉]
  代上4:6: [拿拉]
  代上4:7: [希拉]
  代上4:17: [比提雅]
  代上4:19: [拿含]
  代上5:6: [提革拉毘尼色]
  代上5:26: [普勒, 提革拉毘尼色]
  代上6:15: [尼布甲尼撒]
  代上8:8: [戶伸, 巴拉]
  代上8:9: [賀得]
  代上8:11: [戶伸]
  代上8:29: [瑪迦]
  代上9:35: [瑪迦]
decide:
  代上4:31:
    - {at: 大衛@1, id: 大衛}
  代上6:10:
    - {at: 亞撒利雅@1, id: 亞撒利雅#約哈難}
    - {at: 亞撒利雅@2, id: 亞撒利雅#約哈難}
    - {at: 所羅門@1, id: 所羅門}
  代上6:31:
    - {at: 大衛@1, id: 大衛}
  代上6:32:
    - {at: 所羅門@1, id: 所羅門}
  代上6:49:
    - {at: 摩西@1, id: 摩西}
  代上6:54:
    - {at: 亞倫@1, id: 亞倫}
  代上6:56:
    - {at: 耶孚尼@1, id: 耶孚尼}
    - {at: 迦勒@1, id: 迦勒#耶孚尼}
  代上6:57:
    - {at: 亞倫@1, id: 亞倫}
  代上7:2:
    - {at: 大衛@1, id: 大衛}
  # 「建築上伯和崙、下伯和崙與烏羨舍伊拉的」：第二個舍伊拉是城名的一部分
  代上7:24:
    - {at: 舍伊拉@2, place: true}
  代上7:29:
    - {at: 以色列@1, id: 以色列}
    - {at: 約瑟@1, id: 約瑟}
  代上8:6:
    - {at: 瑪拿轄@1, place: true}
  代上9:4:
    - {at: 猶大@1, id: 猶大}
    - {at: 法勒斯@1, id: 法勒斯}
  # 「示羅的子孫」：經文沒交代示羅是人還是地
  代上9:5:
    - {at: 示羅@1, skip: 經文沒有交代示羅是人還是地}
  代上9:6:
    - {at: 謝拉@1, id: 謝拉}
  代上9:20:
    - {at: 以利亞撒@1, id: 以利亞撒}
    - {at: 非尼哈@1, id: 非尼哈}
  代上9:22:
    - {at: 大衛@1, id: 大衛}
    - {at: 撒母耳@1, id: 撒母耳}
  代上9:32:
    - {at: 哥轄@1, id: 哥轄}  # 「提幔地的人戶珊」：這裡的提幔是地
  代上1:45:
    - {at: 提幔@1, place: true}
  # 以東的王一個接一個：1:47 死的是上一節的哈達，1:51 死的是 1:50 的哈達
  代上1:47:
    - {at: 哈達@1, id: 哈達#比達}
  代上1:51:
    - {at: 哈達@1, id: 哈達#巴伊}
  代上2:3:
    - {at: 書亞@1, id: 書亞#迦南人}
  # 「基列父親瑪吉」：瑪吉是基列的父親（民26:29）
  代上2:21:
    - {at: 基列@1, id: 基列}
    - {at: 瑪吉@1, id: 瑪吉}
    - {at: 瑪吉@2, id: 瑪吉}
  代上2:23:
    - {at: 基列@1, id: 基列}
    - {at: 瑪吉@1, id: 瑪吉}
  # 「迦勒以法他」是地名
  代上2:24:
    - {at: 迦勒@1, place: true}
  # 「基列耶琳之祖」的基列耶琳是城
  代上2:50:
    - {at: 基列耶琳@1, place: true}
  代上2:52:
    - {at: 基列耶琳@1, place: true}
  # 「亞瑪謝的兒子是亞撒利雅；亞撒利雅的兒子是約坦」：都是猶大王亞撒利雅
  代上3:12:
    - {at: 亞撒利雅@1, id: 亞撒利雅#猶大王}
    - {at: 亞撒利雅@2, id: 亞撒利雅#猶大王}
  # 4:1 的「兒子」泛指後代；法勒斯、希斯崙照第 2 章，迦米是哪一位經文沒交代
  代上4:1:
    - {at: 法勒斯@1, id: 法勒斯}
    - {at: 希斯崙@1, id: 希斯崙}
    - {at: 迦米@1, skip: 經文沒有交代是哪一位迦米}
  代上4:33:
    - {at: 巴力@1, place: true}
  代上4:41:
    - {at: 希西家@1, id: 希西家}
  代上5:2:
    - {at: 猶大@1, id: 猶大}
    - {at: 約瑟@1, id: 約瑟}
  代上5:11:
    - {at: 迦得@1, id: 迦得}
    - {at: 流便@1, id: 流便}
  # 「直到基列與巴珊」：這裡的基列是地
  代上5:16:
    - {at: 基列@1, place: true}
  # 「猶大王約坦並以色列王耶羅波安年間」：耶羅波安是約阿施的兒子（王下14:23）
  代上5:17:
    - {at: 約坦@1, id: 約坦}
    - {at: 耶羅波安@1, id: 耶羅波安#約阿施}
  # 「以法蓮的兒子是書提拉；……比列的兒子是他哈；他哈的兒子是以拉大；以拉大的兒子是他哈」
  代上7:20:
    - {at: 書提拉@1, id: 書提拉}
    - {at: 書提拉@2, id: 書提拉}
    - {at: 他哈@1, id: 他哈#比列}
    - {at: 他哈@2, id: 他哈#比列}
    - {at: 他哈@3, id: 他哈#以拉大}
  # 比拉的兒子名單裡有兩個基拉：先列的在 8:3，後列的在 8:5
  代上8:3:
    - {at: 基拉@1, id: 基拉#甲}
  代上8:5:
    - {at: 基拉@1, id: 基拉#乙}
title_of:
  代上2:44: {約干之祖: 拉含}
  代上3:4: {王: 大衛}
  代上4:4: {基多之祖: 毘努伊勒, 戶沙之祖: 以謝珥, 伯利恆之祖: 戶珥}
  代上5:6: {首領: 備拉}
  代上5:12: {族長@1: 約珥#迦得, 族長@2: 沙番}
  代上6:10: {祭司: 亞撒利雅#約哈難}
  代上4:31: {王: 大衛}
  # 「都是某人的族長」「都是大能的勇士」指的是前面列的那幾個人，不是單一的人
  代上7:2: {族長: '-', 大能的勇士: '-'}
  代上7:5: {大能的勇士: '-'}
  代上8:6: {族長: '-'}
  代上8:13: {族長: '-'}
  代上8:40: {大能的勇士: '-'}
  代上9:22: {先見: 撒母耳}
