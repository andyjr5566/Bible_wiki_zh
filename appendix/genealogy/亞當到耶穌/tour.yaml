# 網站開場導覽（Opus 撰寫）。text 的「」引句必須逐字出現在 refs。
# sequence：導覽到這一站時依序高亮的主線人物（照 text 提到的次序）。
- id: t1
  title: 亞當
  focus: [亞當, 塞特]
  sequence: [亞當, 塞特]
  refs: 創5:1-3, 路3:38
  text: 聖經的第一份家譜從亞當寫起：「亞當的後代記在下面」。亞當一百三十歲生了塞特，經文說這個兒子「形像樣式和自己相似」。路加從耶穌往上數，最後一句就停在「亞當是神的兒子」。

- id: t2
  title: 十代到挪亞
  focus: [以諾, 挪亞]
  sequence: [亞當, 塞特, 以挪士, 該南, 瑪勒列, 雅列, 以諾, 瑪土撒拉, 拉麥, 挪亞]
  refs: 創5:24, 創5:29, 創6:9
  text: 從亞當到挪亞共十代，創世記第5章每一代都記了幾歲生子、活到幾歲。中間的以諾不一樣，經文說他「與神同行，神將他取去」。第十代是挪亞，他父親給他起名時說：「這個兒子必為我們的操作和手中的勞苦安慰我們」。

- id: t3
  title: 洪水以後
  focus: [閃, 亞法撒, 該南#亞法撒]
  sequence: [挪亞, 閃, 亞法撒, 該南#亞法撒, 沙拉, 希伯, 法勒, 拉吳, 西鹿, 拿鶴, 他拉, 亞伯拉罕]
  refs: 創11:10, 創11:12, 路3:36
  text: 洪水以後，家譜從挪亞的兒子閃接下去：「洪水以後二年，閃一百歲生了亞法撒」。從閃到亞伯蘭又是十代。這裡有一處記載不同：創世記說「亞法撒活到三十五歲，生了沙拉」，路加卻在兩人中間多了一位該南。

- id: t4
  title: 亞伯拉罕
  focus: [亞伯拉罕, 以撒, 以色列]
  sequence: [亞伯拉罕, 以撒, 以色列]
  refs: 創12:1-3, 太1:1-2
  text: 神呼召亞伯蘭離開本地、本族、父家，應許他：「地上的萬族都要因你得福」。馬太福音的家譜就從他開始：「亞伯拉罕生以撒；以撒生雅各」。

- id: t5
  title: 猶大與他瑪
  focus: [猶大, 他瑪#猶大的兒婦, 法勒斯]
  sequence: [以色列, 猶大, 法勒斯]
  refs: 創38:26-29, 太1:3
  text: 雅各有十二個兒子，主線走猶大。猶大的兒子法勒斯，是他和兒婦他瑪所生的，事情記在創世記第38章，猶大自己承認：「他比我更有義」。馬太的家譜特別寫出這位母親：「猶大從他瑪氏生法勒斯和謝拉」。

- id: t6
  title: 從法勒斯到大衛
  focus: [波阿斯, 路得, 俄備得, 耶西, 大衛]
  sequence: [法勒斯, 希斯崙, 蘭, 亞米拿達, 拿順, 撒門, 波阿斯, 俄備得, 耶西, 大衛]
  refs: 得4:10, 得4:13, 得4:17-22, 太1:5
  text: 從法勒斯到大衛共十代，路得記結尾把這十代整串列出來。波阿斯娶了摩押女子路得，生了俄備得：「這俄備得是耶西的父，耶西是大衛的父」。馬太的家譜也寫出這兩位母親：「撒門從喇合氏生波阿斯；波阿斯從路得氏生俄備得」。

- id: t7
  title: 大衛：兩條線分開
  focus: [大衛, 所羅門, 拿單]
  sequence: [大衛, 所羅門, 拿單]
  refs: 撒下7:12, 太1:6, 路3:31, 代上3:5
  text: 神應許大衛：「我必使你的後裔接續你的位」。從大衛開始，兩份家譜走不同的兒子。馬太寫「大衛從烏利亞的妻子生所羅門」，接著沿猶大的王往下；路加寫「拿單是大衛的兒子」。歷代志上記載，拿單和所羅門的母親都是拔書亞。

- id: t8
  title: 猶大的王
  focus: [約蘭, 亞撒利雅#猶大王]
  sequence: [約蘭, 亞哈謝, 約阿施, 亞瑪謝, 亞撒利雅#猶大王]
  refs: 太1:8, 代上3:11-12
  text: 馬太這一段走的是猶大列王。經文寫「約蘭生烏西雅」，歷代志上卻是約蘭、亞哈謝、約阿施、亞瑪謝、亞撒利雅一代一代接下去。中間這三位王馬太沒有列出，圖上用標記註明。烏西雅就是歷代志上的亞撒利雅。

- id: t9
  title: 被擄
  focus: [約西亞, 約雅敬, 耶哥尼雅]
  sequence: [約西亞, 約雅敬, 耶哥尼雅, 撒拉鐵]
  refs: 太1:11-12, 代上3:15-16
  text: 「百姓被遷到巴比倫的時候，約西亞生耶哥尼雅和他的弟兄」。歷代志上在兩人中間還有一代約雅敬：「約雅敬的兒子是耶哥尼雅和西底家」。遷到巴比倫之後，「耶哥尼雅生撒拉鐵」。

- id: t10
  title: 撒拉鐵和所羅巴伯
  focus: [撒拉鐵, 所羅巴伯, 尼利]
  sequence: [耶哥尼雅, 尼利, 撒拉鐵, 所羅巴伯]
  refs: 太1:12, 路3:27, 代上3:19, 拉3:2
  text: 兩份家譜在這裡走到同樣的名字。馬太寫「耶哥尼雅生撒拉鐵；撒拉鐵生所羅巴伯」，路加寫的卻是「撒拉鐵是尼利的兒子」。所羅巴伯就是歸回以後和耶書亞一同築壇的那一位。歷代志上另有一種記載：「毘大雅的兒子是所羅巴伯」。這幾種記載是什麼關係，經文沒有交代。

- id: t11
  title: 再分開，到約瑟
  focus: [亞比玉, 利撒, 雅各#馬但, 希里, 約瑟#馬利亞的丈夫]
  sequence: [所羅巴伯, 亞比玉, 利撒, 雅各#馬但, 希里, 約瑟#馬利亞的丈夫]
  refs: 太1:13, 太1:16, 路3:23, 路3:27
  text: 所羅巴伯以後，兩份家譜又分開：馬太寫「所羅巴伯生亞比玉」，路加寫「利撒是所羅巴伯的兒子」。兩條線最後都到約瑟，但約瑟的父親，馬太寫「雅各生約瑟」，路加寫「約瑟是希里的兒子」。

- id: t12
  title: 耶穌
  focus: [約瑟#馬利亞的丈夫, 馬利亞#耶穌的母親, 耶穌]
  sequence: [約瑟#馬利亞的丈夫, 耶穌]
  refs: 太1:16, 路3:23, 路3:38
  text: 馬太寫到最後一代，句子和前面不一樣：「雅各生約瑟，就是馬利亞的丈夫。那稱為基督的耶穌是從馬利亞生的」。路加說耶穌「依人看來，他是約瑟的兒子」。馬太從亞伯拉罕往下寫，路加從耶穌往上寫，一直寫到「亞當是神的兒子」。
