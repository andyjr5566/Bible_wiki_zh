# 平行經文差異小卡（唯一來源；由 ../reading.py 檢查）：同一份名單在兩處寫法或人數不同時，讀到那一節旁邊出一小張。
# 只寫兩處各自的寫法和經節，不解釋原因。text 必須逐字出現在 ref 的經文裡；at 是小卡出現的經節（後讀到的那一處）。
# 和合本經文自己已經在括號裡註明的（例如代上 1:6「創十章三節作利法」），不再做小卡。

