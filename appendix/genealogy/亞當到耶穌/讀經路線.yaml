# 帶你讀經的路線（唯一來源；由 ../reading.py 讀取）
#
# 讀者按一次「帶你讀經」，從創 4:17 一路讀到路 3:38。每一段：
#   id：段落代號（網址、選單用，不給讀者看）
#   title：讀者看得到的段落名（不加「」，除非是逐字經文）
#   intro：目錄裡這一段的一句介紹（照經文寫、白話、不加評論；不可含「」、60 字以內）
#   group：段落選單的分組
#   ranges：經文範圍（可多段）
#   stage：預設畫面（tree 家譜樹／roles 大衛立的職位／roster 歸回的名冊／wall 修城牆的人）
#   stages：段內換畫面的地方（經節範圍 → 畫面），依「這幾節在講什麼」切
#   parallel：平行經文（同一份名單的另一處記載）；那裡記的人也算這一段的候選人
#   chronicles：代上 1–9，沿用附錄的章名、小段、讀經提醒、名單牌子
start: 創4:17
segments:
  - {id: gen4, title: 該隱和塞特的後代, intro: 該隱一支有人建城、牧養牲畜、彈琴吹簫、打造銅鐵；塞特生了以挪士，那時人才求告耶和華的名。, group: 創世記, ranges: 創4:17-26, stage: tree}
  - {id: gen5, title: 亞當到挪亞, intro: 從亞當到挪亞共十代，每一代都記下幾歲生子、一生活了多少歲。, group: 創世記, ranges: 創5:1-32, stage: tree, parallel: 代上1:1-4}
  - {id: gen10, title: 挪亞三個兒子的後代, intro: 挪亞的兒子閃、含、雅弗的後代，在洪水以後分散各地，成了各邦國。, group: 創世記, ranges: 創10:1-32, stage: tree, parallel: 代上1:4-23}
  - {id: gen11, title: 閃到亞伯蘭, intro: 從閃一路記到他拉，他拉生了亞伯蘭、拿鶴、哈蘭。, group: 創世記, ranges: 創11:10-32, stage: tree, parallel: 代上1:17-27}
  - {id: gen22, title: 拿鶴的兒子, intro: 亞伯拉罕的兄弟拿鶴生了八個兒子，其中彼土利生了利百加。, group: 創世記, ranges: 創22:20-24, stage: tree}
  - {id: gen25a, title: 基土拉的兒子, intro: 亞伯拉罕又娶了基土拉，生了心蘭、約珊等六個兒子。, group: 創世記, ranges: 創25:1-4, stage: tree, parallel: 代上1:32-33}
  - {id: gen25b, title: 以實瑪利的兒子, intro: 以實瑪利的十二個兒子，各作一族的族長。, group: 創世記, ranges: 創25:12-18, stage: tree, parallel: 代上1:28-31}
  - {id: gen29, title: 雅各的兒子出生, intro: 利亞、拉結和兩個使女先後為雅各生下兒女，每個孩子的名字都說明了由來。, group: 創世記, ranges: "創29:31-30:24, 創35:16-18", stage: tree}
  - {id: gen35, title: 雅各的十二個兒子, intro: 照母親分組，列出雅各的十二個兒子。, group: 創世記, ranges: 創35:22-26, stage: tree}
  - {id: gen36, title: 以掃的後代, intro: 以掃的妻子、兒子和族長，還有以東地的列王。, group: 創世記, ranges: 創36:1-43, stage: tree, parallel: 代上1:35-54}
  - {id: gen46, title: 下埃及的雅各家, intro: 雅各全家下埃及時，照母親分組列出的子孫，共七十人。, group: 創世記, ranges: 創46:8-27, stage: tree}
  - {id: exo6, title: 流便、西緬、利未的家長, intro: 從流便、西緬講到利未的家，一路記到摩西、亞倫和非尼哈。, group: 出埃及記到撒母耳記, ranges: 出6:14-25, stage: tree}
  - {id: ruth4, title: 法勒斯到大衛, intro: 路得記的結尾，從法勒斯十代記到大衛。, group: 出埃及記到撒母耳記, ranges: 得4:18-22, stage: tree, parallel: 代上2:4-15}
  - {id: sam14, title: 掃羅的家, intro: 掃羅的兒子、女兒、妻子和元帥押尼珥。, group: 出埃及記到撒母耳記, ranges: 撒上14:49-51, stage: tree}
  - {id: sam3, title: 大衛在希伯崙生的兒子, intro: 大衛在希伯崙作王時，六位妻子各生了一個兒子。, group: 出埃及記到撒母耳記, ranges: 撒下3:2-5, stage: tree, parallel: 代上3:1-4}
