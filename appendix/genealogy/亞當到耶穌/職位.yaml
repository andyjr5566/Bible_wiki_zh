# 大衛立的職位（唯一來源；由 ../build_genealogy.py 檢查並匯出 roles.json，讀經模式由 ../reading.py 讀取）
#
# 四類：王的身邊（court）、軍隊（army）、聖殿與利未人（temple）、支派與產業（tribes）。
# 每類底下是職位方塊（box）：
#   id／title／ref（讀者看的經文範圍）／verses（讀經時這幾節的鏡頭停在這個方塊）
#   kind：list 一般名單、ring24 二十四格環、wheel12 十二月輪盤、groups 依支派分組
#   seal：蓋在家譜樹人物卡旁的職位印（兩三個字）
#   note：方塊底下一句說明；figures：照經文寫的人數（不畫比例）
# 成員（members）三種寫法：
#   {id: 家譜樹人物, d: 細節, ref: 經節, basis: [...]}   樹上已有的人：一定要寫根據
#   {rid: 只在職位圖的人, d: 細節, ref: 經節}            在 people 定義過、出現在好幾個方塊的人
#   {n: 名字, q: 哪裡人／誰的兒子, d: 細節, ref: 經節}   只出現一次的人（rid 自動取「名字#限定」）
#   order：二十四班、十二月的序號；key：方塊內的代號（預設是 id／rid）
# 名字必須逐字出現在 ref 的經文裡（建置時檢查）。
# 同名的人分開：經文寫的父親、出身不同就是不同人；拼法不同的不硬併成一人。

people:
  比拿雅#耶何耶大之子:
    name: 比拿雅
    q: 耶何耶大的兒子
    basis:
