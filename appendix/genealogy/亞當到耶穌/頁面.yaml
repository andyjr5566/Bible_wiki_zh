# 從亞當到耶穌的家譜：頁面設定（說明文字由 Opus 撰寫；頁面由 ../build_genealogy.py 產生）
type: lineage
title: 從亞當到耶穌的家譜
output: appendix/亞當到耶穌的家譜.md
site: appendix/website/全聖經/亞當到耶穌/dist/index.html
intro: |
  這一頁把聖經裡從亞當到耶穌的家譜接成一條不斷的線。每一代都附上經節。經文之間記載不同的地方，照經文原樣標出來，不替經文調和。註釋家和其他資料的說法，放在經文後面，各家並陳。
reading: |
  - **一條線，再分成兩條。** 大衛以前只有一條線。大衛以後，馬太福音經所羅門往下，路加福音經拿單往下，圖上用兩種顏色分開。兩條線在撒拉鐵、所羅巴伯走到同樣的名字，最後都到約瑟。
  - **標記。** 「馬太未列」表示這一代舊約有記載，馬太的家譜沒有列出；「只見路加」表示這一代只有路加記載。
  - **※** 表示這裡有經文記載不同的地方，說明在「經文記載不同的地方」一節。
  - **旁支。** 這一頁只列主線和旁支的索引。每個人的父母、兒女、經文全文，可以在互動網站上搜尋、展開。歷代志上第 1–9 章的人，也可以連到族譜頁。
imports:
  - file: ../歷代志上/genealogy.yaml
    page: 歷代志上的完整人物支線圖
    # 代上的母親是字串；只有這裡明列的才接到人物 id（同名的人很多，例如「他瑪」「瑪迦」）
    mothers: {他瑪: 他瑪#猶大的兒婦, 拔書亞: 拔示巴, 基土拉: 基土拉, 亞希暖: 亞希暖, 亞比該: 亞比該#拿八的妻, 哈及: 哈及, 亞比他: 亞比他, 以格拉: 以格拉}
families:
  - {id: cain, title: 該隱的後代, roots: [該隱], intro: 創4:17-24。該隱一族一直寫到拉麥和他的三個兒子雅八、猶八、土八該隱。}
  - {id: japheth, title: 雅弗的後代, roots: [雅弗], intro: 創10:2-5、代上1:5-7。挪亞的兒子雅弗一族。}
  - {id: ham, title: 含的後代, roots: [含], intro: 創10:6-20、代上1:8-16。含的四個兒子古實、麥西、弗、迦南，名下有不少是民族名。}
  - {id: shem, title: 閃的其他兒子, roots: [以攔, 亞述, 路德, 亞蘭, 烏斯, 戶勒, 基帖, 米設#閃], intro: 創10:22-23、代上1:17。主線走亞法撒，閃的其他兒子列在這裡。}
  - {id: joktan, title: 約坍的後代, roots: [約坍], intro: 創10:25-30、代上1:19-23。希伯的兒子法勒在主線上，他的兄弟約坍生了十三個兒子。}
  - {id: nahor, title: 他拉的另外兩個兒子, roots: [拿鶴#他拉, 哈蘭#他拉], intro: 創11:26-29、創22:20-24。利百加是拿鶴的孫女，羅得是哈蘭的兒子。}
  - {id: ishmael, title: 以實瑪利的後代, roots: [以實瑪利], intro: 創25:12-16、代上1:29-31。夏甲為亞伯拉罕生的兒子以實瑪利，有十二個兒子。}
  - {id: keturah, title: 基土拉生的兒子, roots: [心蘭, 約珊, 米但, 米甸, 伊施巴, 書亞], intro: 創25:1-4、代上1:32-33。}
  - {id: esau, title: 以掃與以東, roots: [以掃], intro: 創36、代上1:35-54。以撒的另一個兒子以掃，就是以東。以東的諸王和族長多半另有記載，接不上以掃的一一列在網站上。}
  - {id: reuben, title: 流便, roots: [流便], intro: 創46:9、民26:5-11、代上5:1-10。}
  - {id: simeon, title: 西緬, roots: [西緬], intro: 創46:10、民26:12-14、代上4:24-43。}
  - {id: levi, title: 利未, roots: [利未], intro: 出6:16-25、民3、代上6。亞倫、摩西和歷代的大祭司都在這一支。}
  - {id: issachar, title: 以薩迦, roots: [以薩迦], intro: 創46:13、民26:23-25、代上7:1-5。}
  - {id: zebulun, title: 西布倫, roots: [西布倫], intro: 創46:14、民26:26-27。}
  - {id: dan, title: 但, roots: [但], intro: 創46:23、民26:42-43。}
  - {id: naphtali, title: 拿弗他利, roots: [拿弗他利], intro: 創46:24、民26:48-50、代上7:13。}
  - {id: gad, title: 迦得, roots: [迦得], intro: 創46:16、民26:15-18、代上5:11-17。}
  - {id: asher, title: 亞設, roots: [亞設], intro: 創46:17、民26:44-47、代上7:30-40。}
  - {id: joseph, title: 約瑟（瑪拿西、以法蓮）, roots: [約瑟], intro: 創41:50-52、民26:28-37、代上7:14-29。}
  - {id: benjamin, title: 便雅憫, roots: [便雅憫], intro: 創46:21、民26:38-41、代上7:6-12、代上8。掃羅家另有幾段記載接不上便雅憫，網站上另外列出。}
  - {id: judah, title: 猶大的其他兒子, roots: [珥, 俄南, 示拉, 謝拉], intro: 創38、代上2:3-8、代上4:21-23。主線走法勒斯。}
  - {id: hezron, title: 希斯崙的其他兒子, roots: [耶拉篾, 基路拜, 亞施戶, 西割], intro: 代上2:9-55、代上4:1-20。主線走蘭。}
  - {id: david, title: 大衛的其他兒女, roots: [暗嫩, 但以利, 押沙龍, 亞多尼雅, 示法提雅, 以特念, 示米亞#大衛, 朔罷, 益轄, 以利沙瑪#大衛甲, 以利法列#大衛甲, 挪迦, 尼斐, 雅非亞, 以利沙瑪#大衛乙, 以利雅大, 以利法列#大衛乙, 以利書亞, 他瑪, 耶利摩#大衛之子], intro: 撒下3:2-5、撒下5:13-16、代上3:1-9。主線走所羅門和拿單。}
  - {id: zerubbabel, title: 所羅巴伯的其他兒女, roots: [米書蘭#所羅巴伯, 哈拿尼雅#所羅巴伯, 示羅密], intro: 代上3:19-24。歷代志上的這一支寫到被擄歸回以後好幾代，人名都和馬太、路加不同。}
