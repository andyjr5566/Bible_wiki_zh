# 帶你讀經：代上 23–26（利未人的班次與職務）的裁決（格式同 ../讀經.yaml）
# 新加進家譜樹的利未人在 ../people/06_大衛立的職位.yaml；只在職位圖上的人在 ../職位.yaml。
names:
  # 23:9 的示每原文編號（H8096V）和 23:7、23:10 的示每不同，經文沒交代他是誰；他的兒子只在經文裡亮
  代上23:9: [示羅密, 哈薛]
  代上24:6: [拿坦業]
  # 俄別以東、何薩的兒子：父親只在職位圖上，兒子們只在經文裡亮
  代上26:4: [示瑪雅, 約薩拔, 約亞, 沙甲, 拿坦業]
  代上26:5: [亞米利, 以薩迦, 毘烏利太]
  代上26:6: [示瑪雅]
  代上26:7: [示瑪雅, 俄得尼, 利法益, 俄備得, 以利薩巴, 以利戶, 西瑪迦]
  代上26:10: [申利]
  代上26:11: [希勒家, 底巴利雅, 撒迦利亞]
decide:
  代上23:9:
    - {at: 示每@1, skip: 經文沒有交代是哪一位示每}
    - {at: 哈蘭@1, skip: 經文沒有交代這位哈蘭是誰}
  # 「以利亞撒死了，沒有兒子……他們本族基士的兒子娶了他們」：抹利的兒子以利亞撒、基士（23:21）
  代上23:22:
    - {at: 以利亞撒@1, id: 以利亞撒#抹利}
    - {at: 基士@1, id: 基士#抹利}
  代上24:6:
    - {at: 亞比亞他@1, rid: 亞比亞他#祭司}
  # 「可拉族亞薩的子孫」：這裡的亞薩是可拉族的祖先，不是歌唱的亞薩（歌唱的亞薩是革順的子孫，代上 6:39–43）
  代上26:1:
    - {at: 亞薩@1, skip: 可拉族的祖先亞薩，不是歌唱的亞薩}
  代上26:11:
    - {at: 何薩@1, rid: 何薩}
  # 「基士的兒子掃羅」
  代上26:28:
    - {at: 基士@1, id: 基士}
title_of:
  代上23:2: {首領: '-', 祭司: '-'}
  # 「以利亞撒的子孫中有十六個族長」：指一群人
  代上24:4: {族長: '-'}
  代上24:6: {首領: '-', 祭司@2: '-', 族長: '-'}
  代上24:31: {祭司: '-', 族長: '-'}
  代上25:1: {首領: '-'}
  # 「希幔奉神之命作王的先見」：王是大衛
  代上25:5: {王: 大衛}
  代上26:26: {族長: '-', 千夫長: '-', 百夫長: '-'}
