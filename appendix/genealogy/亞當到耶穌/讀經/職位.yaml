decide:
  # 11:22–24 講的都是「耶何耶大的兒子比拿雅」
  代上11:23:
    - {at: 比拿雅@1, rid: 比拿雅#耶何耶大之子}
  代上11:24:
    - {at: 比拿雅@1, rid: 比拿雅#耶何耶大之子}
  # 「千夫長押拿、約撒拔、耶疊、米迦勒、約撒拔……」：兩個約撒拔照經文先後
  代上12:20:
    - {at: 約撒拔@1, rid: 約撒拔#瑪拿西人#1}
    - {at: 約撒拔@2, rid: 約撒拔#瑪拿西人#2}
  # 「約珥的兒子希幔」「比利家的兒子亞薩」：歌唱的希幔、亞薩的父親（代上 6:33、6:39），
  # 不是 15:7 的族長約珥、15:23 守門的比利家
  代上15:17:
    - {at: 約珥@1, id: 約珥#希幔之父}
    - {at: 比利家@1, id: 比利家#示米亞}
  # 「派俄別以東和他的弟兄六十八人，與耶杜頓的兒子俄別以東，並何薩作守門的」
  代上16:38:
    - {at: 俄別以東@1, rid: 俄別以東}
    - {at: 俄別以東@2, id: 俄別以東#耶杜頓}
  # 「他是法勒斯的子孫」：猶大的兒子法勒斯
  代上27:3:
    - {at: 法勒斯@1, id: 法勒斯}
  # 「祭司耶何耶大的兒子比拿雅」：這位耶何耶大是誰，經文沒有交代更多（不是 27:34 比拿雅的兒子耶何耶大）
  代上27:5:
    - {at: 耶何耶大@1, skip: 經文沒有交代是哪一位耶何耶大}
  # 「俄陀聶族尼陀法人黑玳」
  代上27:15:
    - {at: 俄陀聶@1, id: 俄陀聶}
  # 「亞比亞他的兒子亞希米勒」：這位亞比亞他是不是 15:11 的祭司亞比亞他，經文沒有直接說，只在經文裡亮
  代上18:16:
    - {at: 亞比亞他@1, skip: 經文沒有直接交代是哪一位亞比亞他}
  撒下8:17:
    - {at: 亞比亞他@1, skip: 經文沒有直接交代是哪一位亞比亞他}
title_of:
  代上27:5: {祭司: '-'}
  # 「約押作王的元帥」：王是大衛
  代上27:34: {王: 大衛}
  # 「耶杜頓的子孫作守門的」：說的是他的子孫，不是耶杜頓本人
  代上16:42: {守門的: '-'}
