# 帶你讀經：創世記各段的裁決（格式同 ../讀經.yaml）
# 城名、地名只在經文裡亮，不連到人。
places: [以力, 亞甲, 甲尼, 迦拉, 利鮮, 拉沙, 米沙, 西發, 亭哈巴, 亞未得, 巴烏]
decide:
  # 「就按著他兒子的名將那城叫做以諾」：第二個以諾是城名
  創4:17:
    - {at: 以諾@2, place: true}
  # 單字的名字程式不自動配，逐一寫明
  創10:1:
    - {at: 閃@1, id: 閃}
    - {at: 含@1, id: 含}
  # 「他從那地出來往亞述去」：這裡的亞述是地
  創10:11:
    - {at: 亞述@1, place: true}
  # 「迦南的境界是從西頓……」：講的是地界，迦南、西頓都是地
  創10:19:
    - {at: 迦南@1, place: true}
    - {at: 西頓@1, place: true}
  創10:20:
    - {at: 含@1, id: 含}
  創10:21:
    - {at: 閃@1, id: 閃}
  創10:31:
    - {at: 閃@1, id: 閃}
  創11:11:
    - {at: 閃@1, id: 閃}
  # 西鹿的兒子拿鶴（他拉的父親），不是他拉的兒子拿鶴
  創11:25:
    - {at: 拿鶴@1, id: 拿鶴}
  創11:27:
    - {at: 拿鶴@1, id: 拿鶴#他拉}
  # 「他們走到哈蘭，就住在那裡」「死在哈蘭」：這兩處的哈蘭是城
  創11:31:
    - {at: 哈蘭@2, place: true}
  創11:32:
    - {at: 哈蘭@1, place: true}
  創22:20:
    - {at: 亞伯拉罕@1, id: 亞伯拉罕}
  創22:23:
    - {at: 亞伯拉罕@1, id: 亞伯拉罕}
  創30:21:
    - {at: 底拿@1, id: 底拿}
  創36:6:
    - {at: 雅各@1, id: 以色列}
  # 「在以東地」「在以東作王」：這幾處的以東是地
  創36:16:
    - {at: 以東@1, place: true}
  創36:17:
    - {at: 以東@1, place: true}
  創36:21:
    - {at: 以東@1, place: true}
  創36:31:
    - {at: 以東@1, place: true}
  創36:32:
    - {at: 以東@1, place: true}
  # 「亞拿的女兒是阿何利巴瑪」：以掃的妻子（36:2）；36:41 當族長的是另一位
  創36:25:
    - {at: 亞拿@1, id: 亞拿#祭便}
    - {at: 亞拿@2, id: 亞拿#祭便}
    - {at: 阿何利巴瑪@1, id: 阿何利巴瑪#亞拿}
  # 「哈達死了」：上一節的比達的兒子哈達
  創36:36:
    - {at: 哈達@1, id: 哈達#比達}
  # 36:40–43 是以東的族長，和代上 1:51–54 同一份名單；族長阿何利巴瑪不是以掃的妻子，提幔、基納斯也是族長
  創36:40:
    - {at: 亭納@1, id: 亭納#族長}
  創36:41:
    - {at: 阿何利巴瑪@1, id: 亞何利巴瑪}
  創36:42:
    - {at: 基納斯@1, id: 基納斯#族長}
    - {at: 提幔@1, id: 提幔#族長}
title_of:
  # 「是希伯子孫之祖」說的是閃
  創10:21: {子孫之祖: 閃}
  創25:16: {族長: '-'}
  # 「以掃子孫中作族長的記在下面」「從某某所出的族長」：指整份名單，不是單一的人
  創36:15: {族長@1: '-'}
  創36:16: {族長@4: '-'}
  創36:17: {族長@5: '-'}
  創36:18: {族長@4: '-'}
  創36:21: {族長: '-'}
  創36:29: {族長@1: '-'}
  創36:30: {族長@4: '-', 族長@5: '-'}
  創36:31: {君王: '-', 王: '-'}
  創36:40: {族長@1: '-'}
  創36:43: {族長: '-'}
