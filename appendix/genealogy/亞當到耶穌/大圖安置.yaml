# 網站大圖上，經文沒有直接接到主線的人掛在哪裡（唯一來源；由 ../build_genealogy.py 匯出時套用並檢查）
#
# 依序選第一個有經文根據的接法：
#   1. 經文寫明的家人：這一家有人是圖上某人的父母、子女、妻子、兄弟姊妹或親屬，
#      程式自動把這一家放在那人旁邊，畫出那條關係線（不用寫在這裡）。
#   2. 經文寫明是某人的後代，沒寫隔幾代：程式自動用虛線接到那人（不用寫在這裡）。
#   3. 只列在某段名單裡：lists。一段名單一塊牌子，用點線掛在 under 底下。
#      anchor 是歷代志上族譜頁的段落標題；basis 是「這段名單屬於 under」的經文根據。
#      同一段名單要拆給不同的人時，用 roots 寫明各塊牌子收哪幾家。
#   4. 經文沒有寫家譜：regions。放在同時代的主線人物（near）旁邊一塊區域，不畫連到主線的線。
#      新約家族（頁面.yaml 的 nt_families）各一塊牌子，放在「新約時代的家庭」。
#
# 匯出時，每個人都必須落在圖上；有人沒處放，建置就失敗並列出名單。

lists:
  - anchor: 以東的王和族長
    title: 以東的王和族長
    ref: 代上1:43-54
    under: 以掃
    basis: 創36:43
  - anchor: 迦勒的其他後代
    title: 迦勒的其他後代
    ref: 代上2:42-55
    under: 基路拜
    basis: 代上2:42
  - anchor: 猶大的其他家族
    title: 猶大的其他家族
    ref: 代上4:1-23
    under: 猶大
    basis: 代上4:1
  - anchor: 西緬
    title: 西緬的族長
    ref: 代上4:34-43
    under: 西緬
    basis: 代上4:24, 代上4:38
  - anchor: 流便
    title: 流便的家譜
    ref: 代上5:1-10
    under: 流便
    basis: 代上5:3
  - anchor: 迦得
    title: 迦得的家譜
    ref: 代上5:11-17
    under: 迦得
    basis: 代上5:11
  - anchor: 河東的瑪拿西半支派，以及被擄
    title: 河東的瑪拿西半支派
    ref: 代上5:23-26
    under: 瑪拿西#支派
    basis: 代上5:23
  - anchor: 便雅憫（第一份名單）
    title: 便雅憫的家譜（第一份）
    ref: 代上7:6-12
    under: 便雅憫
    basis: 代上7:6
  - anchor: 河西的瑪拿西
    title: 瑪拿西的家譜
    ref: 代上7:14-19
    under: 瑪拿西#支派
    basis: 代上7:14
  - anchor: 亞設
    title: 亞設的家譜
    ref: 代上7:30-40
    under: 亞設
    basis: 代上7:30
  - anchor: 便雅憫（第二份名單）
    title: 便雅憫的家譜（第二份）
    ref: 代上8:1-12
    under: 便雅憫
    basis: 代上8:1
  - anchor: 住在耶路撒冷的便雅憫族長
    title: 住在耶路撒冷的便雅憫族長
    ref: 代上8:13-28
    under: 便雅憫
    basis: 代上8:1, 代上8:28
  - anchor: 歸回以後住在耶路撒冷的人
    title: 歸回後住在耶路撒冷的猶大人
    ref: 代上9:3-6
    under: 猶大
    basis: 代上9:3-4
    roots: [巴尼#9:4, 亞帥雅#示羅, 耶烏利]
  - anchor: 歸回以後住在耶路撒冷的人
    title: 歸回後住在耶路撒冷的便雅憫人
    ref: 代上9:7-9
    under: 便雅憫
    basis: 代上9:7
    roots: [哈西努, 耶羅罕#9:8, 米基立, 伊比尼雅#流珥之祖]
  - anchor: 祭司
    title: 歸回後住在耶路撒冷的祭司
    ref: 代上9:10-13
    under: 亞倫
    basis: 代上6:49, 代上24:1
  - anchor: 利未人和守門的
    title: 歸回後的利未人和守門的
    ref: 代上9:14-34
    under: 利未
    basis: 代上9:14

regions:
  - id: nt
    title: 新約時代的家庭
    near: 耶穌
    nt_families: true
    # 牌子上改用讀者看得懂的標題
    family_titles:
      others: 其他記有家人的人
    # 新約家族以外，另外收進來的家（經文沒有說是同一家，所以不併進拉撒路一家）
    plaques:
      - {title: 馬大和馬利亞, ref: 路10:38-39, roots: [馬大#路10:38, 馬利亞#路10:39]}
    # 併進既有的新約家族牌子
    family_roots:
      others: [雅各#路6:16]
  - id: north
    title: 北國以色列的王
    near: 羅波安
    roots: [亞希雅#巴沙之父, 基納, 約沙法#耶戶之父, 雅比, 迦底, 利瑪利, 以拉#何細亞之父]
  - id: prophets
    title: 猶大亡國前的先知
    near: 約西亞
    roots: [古示, 希勒家#亞拿突]
  - id: exile
    title: 被擄和歸回時期的人
    near: 所羅巴伯
    # 代上3:21「還有利法雅的眾子，亞珥難的眾子……」：經文沒說這四家接在誰底下，不掛在所羅巴伯下面
    roots: [布西, 比利家#撒迦利亞之父, 約薩達#耶書亞之父, 睚珥#末底改之父, 亞比孩#以斯帖之父, 利法雅#3:21, 亞珥難, 俄巴底亞#3:21, 示迦尼]
