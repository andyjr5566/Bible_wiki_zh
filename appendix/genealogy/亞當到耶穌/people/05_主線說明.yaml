# 主線人物的一句說明（Opus 撰寫；顯示在網站的人物資訊卡）。只寫經文明說的事，附經節。
- {id: 亞當, desc: 神照著自己的形像造的第一個人（創1:27、創2:7）。}
- {id: 塞特, desc: 亞伯被殺以後，亞當和夏娃生的兒子（創4:25）。}
- {id: 以挪士, desc: 他出生以後，「人才求告耶和華的名」（創4:26）。}
- {id: 以諾, desc: 與神同行三百年，神將他取去（創5:22-24）。}
- {id: 瑪土撒拉, desc: 活了九百六十九歲，是創世記家譜裡壽數最長的人（創5:27）。}
- {id: 挪亞, desc: 照神的吩咐造方舟；洪水氾濫在地上的時候，他六百歲（創6:22、創7:6）。}
- {id: 閃, desc: 挪亞的兒子，和家人一同進入方舟；洪水以後二年生亞法撒（創7:13、創11:10）。}
- {id: 法勒, desc: 他出生的時候，「那時人就分地居住」（代上1:19、創10:25）。}
- {id: 他拉, desc: 帶著亞伯蘭、羅得、撒萊離開迦勒底的吾珥，到哈蘭住下，後來死在哈蘭（創11:31-32）。}
- {id: 亞伯拉罕, desc: 原名亞伯蘭。神呼召他離開本地、本族、父家，應許地上的萬族都要因他得福（創12:1-3、創17:5）。}
- {id: 以撒, desc: 亞伯拉罕一百歲的時候，撒拉給他生的兒子（創21:2-5）。}
- {id: 以色列, desc: 原名雅各，神給他改名叫以色列；他的十二個兒子是以色列十二支派的祖先（創32:28、創35:22-26）。}
- {id: 猶大, desc: 雅各和利亞的第四個兒子；雅各臨終時為他祝福（創29:35、創49:8-12）。}
- {id: 法勒斯, desc: 猶大和兒婦他瑪所生的雙生子之一，出生時搶在兄弟謝拉前面（創38:27-29）。}
- {id: 拿順, desc: 曠野時作猶大支派的首領（民2:3、代上2:10）。}
- {id: 波阿斯, desc: 娶了摩押女子路得，生了俄備得（得4:10、得4:13）。}
- {id: 俄備得, desc: 波阿斯和路得的兒子；拿俄米把他抱在懷中，作他的養母（得4:16-17）。}
- {id: 耶西, desc: 伯利恆人，有八個兒子，大衛是最小的（撒上16:1、撒上17:12-14）。}
- {id: 大衛, desc: 以色列的王；神應許他的後裔接續他的位，國位堅定直到永遠（撒下7:12-16）。}
- {id: 所羅門, desc: 大衛和拔示巴的兒子，接續大衛作王，建造聖殿（撒下12:24、王上1:39、王上6:1）。}
- {id: 拿單, desc: 大衛在耶路撒冷所生的兒子，和所羅門同母；路加的家譜經過他（代上3:5、路3:31）。}
- {id: 羅波安, desc: 所羅門的兒子；他在位時，以色列眾人立耶羅波安作王，只有猶大支派仍順從大衛家（王上12:16-20）。}
- {id: 亞撒利雅#猶大王, desc: 又名烏西雅，十六歲登基；後來長了大痲瘋，住在別的宮裡（王下14:21、王下15:5、王下15:13）。}
- {id: 希西家, desc: 猶大王，經文說他行耶和華眼中看為正的事，倚靠耶和華（王下18:3-5）。}
- {id: 瑪拿西#猶大王, desc: 十二歲登基，在耶路撒冷作王五十五年，經文說他行耶和華眼中看為惡的事（王下21:1-2）。}
- {id: 約西亞, desc: 八歲登基；在位時大祭司希勒家在殿裡得了律法書，他吩咐眾民照約書上所寫的守逾越節（王下22:1、王下22:8、王下23:21-23）。}
- {id: 約雅敬, desc: 約西亞的兒子，原名以利亞敬；埃及王法老尼哥立他作王，給他改名（王下23:34）。}
- {id: 耶哥尼雅, desc: 又名約雅斤、哥尼雅；作王三個月，就被巴比倫王擄到巴比倫（王下24:8、王下24:15）。}
- {id: 撒拉鐵, desc: 馬太和歷代志上說他是耶哥尼雅的兒子，路加說他是尼利的兒子（太1:12、代上3:17、路3:27）。}
- {id: 所羅巴伯, desc: 被擄歸回以後作猶大省長，和大祭司耶書亞一同築壇、建殿（拉3:2、拉5:2、該1:1）。}
- {id: 該南#亞法撒, desc: 只出現在路加的家譜；創世記和歷代志上都是亞法撒直接生沙拉（路3:36、創11:12、代上1:18）。}
- {id: 尼利, desc: 路加說撒拉鐵是尼利的兒子；經文沒有別的記載（路3:27）。}
- {id: 希里, desc: 路加說約瑟是希里的兒子；經文沒有別的記載（路3:23）。}
- {id: 雅各#馬但, desc: 馬太說約瑟是雅各的兒子；經文沒有別的記載（太1:16）。}
- {id: 約瑟#馬利亞的丈夫, desc: 馬利亞的丈夫，大衛的子孫；是個義人，照主的使者在夢中的吩咐娶了馬利亞（太1:19-24）。}
- {id: 馬利亞#耶穌的母親, desc: 已經許配了約瑟，從聖靈懷了孕，生了耶穌（太1:18、路1:27-31）。}
- {id: 耶穌, desc: 馬太從亞伯拉罕寫到他，說他是大衛的子孫；路加從他一路寫到亞當（太1:1、路3:23-38）。}
