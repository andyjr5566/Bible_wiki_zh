# 07 平行經文的別寫：同一份名單在另一處經文寫法不同，照名單位置是同一人；只補 names（附出處）
# 讀經裁決只能指定「名字對得上」的人，所以別寫要先記在這裡。

# 創 36:40–43 和代上 1:51–54 是同一份以東族長名單
- id: 亞何利巴瑪
  names:
    - {as: 阿何利巴瑪, ref: 創36:41}
