# 經文自己交代的名字來由。每條 quote 必須逐字出現在 ref 的和合本（含和合本自己的【…】注）。
# 這裡只引經文，不加解釋；詞典字義另由 名字字義.yaml（STEP Bible）提供。
夏娃:
  - {ref: 創3:20, quote: 亞當給他妻子起名叫夏娃，因為他是眾生之母}
該隱:
  - {ref: 創4:1, quote: 生了該隱【就是得的意思】，便說：耶和華使我得了一個男子}
塞特:
  - {ref: 創4:25, quote: 起名叫塞特，意思說：神另給我立了一個兒子代替亞伯}
挪亞:
  - {ref: 創5:29, quote: 給他起名叫挪亞，說：這個兒子必為我們的操作和手中的勞苦安慰我們}
法勒:
  - {ref: 創10:25, quote: 一個名叫法勒【法勒就是分的意思】，因為那時人就分地居住}
法勒斯:
  - {ref: 創38:29, quote: 因此給他起名叫法勒斯}
亞伯拉罕:
  - {ref: 創17:5, quote: 你的名不再叫亞伯蘭，要叫亞伯拉罕，因為我已立你作多國的父}
以實瑪利:
  - {ref: 創16:11, quote: 可以給他起名叫以實瑪利，因為耶和華聽見了你的苦情。【以實瑪利就是神聽見的意思】}
以撒:
  - {ref: 創21:3, quote: 亞伯拉罕給撒拉所生的兒子起名叫以撒}
  - {ref: 創21:6, quote: 撒拉說：神使我喜笑，凡聽見的必與我一同喜笑}
以掃:
  - {ref: 創25:25, quote: 給他起名叫以掃【就是有毛的意思】}
以色列:
  - {ref: 創25:26, quote: 因此給他起名叫雅各【就是抓住的意思】}
  - {ref: 創32:28, quote: 你的名不要再叫雅各，要叫以色列；因為你與神與人較力，都得了勝}
流便:
  - {ref: 創29:32, quote: 就給他起名叫流便【就是有兒子的意思】，因而說：耶和華看見我的苦情}
西緬:
  - {ref: 創29:33, quote: 於是給他起名叫西緬【就是聽見的意思】}
利未:
  - {ref: 創29:34, quote: 起名叫利未【就是聯合的意思】，說：我給丈夫生了三個兒子，他必與我聯合}
猶大:
  - {ref: 創29:35, quote: 這回我要讚美耶和華，因此給他起名叫猶大【就是讚美的意思】}
但:
  - {ref: 創30:6, quote: 因此給他起名叫但【就是伸冤的意思】}
拿弗他利:
  - {ref: 創30:8, quote: 於是給他起名叫拿弗他利【就是相爭的意思】}
迦得:
  - {ref: 創30:11, quote: 利亞說：萬幸！於是給他起名叫迦得【就是萬幸的意思】}
亞設:
  - {ref: 創30:13, quote: 於是給他起名叫亞設【就是有福的意思】}
以薩迦:
  - {ref: 創30:18, quote: 於是給他起名叫以薩迦【就是價值的意思】}
西布倫:
  - {ref: 創30:20, quote: 於是給他起名西布倫【就是同住的意思】}
約瑟:
  - {ref: 創30:24, quote: 就給他起名叫約瑟【就是增添的意思】，意思說：願耶和華再增添我一個兒子}
便雅憫:
  - {ref: 創35:18, quote: 就給他兒子起名叫便俄尼；他父親卻給他起名叫便雅憫}
以法蓮:
  - {ref: 創41:52, quote: 他給次子起名叫以法蓮【就是使之昌盛的意思】，因為他說：神使我在受苦的地方昌盛}
瑪拿西#支派:
  - {ref: 創41:51, quote: 約瑟給長子起名叫瑪拿西【就是使之忘了的意思】，因為他說：神使我忘了一切的困苦和我父的全家}
摩西:
  - {ref: 出2:10, quote: 他給孩子起名叫摩西，意思說：因我把他從水裡拉出來}
革舜:
  - {ref: 出2:22, quote: 摩西給他起名叫革舜，意思說：因我在外邦作了寄居的}
撒母耳:
  - {ref: 撒上1:20, quote: 給他起名叫撒母耳，說：這是我從耶和華那裡求來的}
雅比斯:
  - {ref: 代上4:9, quote: 他母親給他起名叫雅比斯，意思說：我生他甚是痛苦}
耶穌:
  - {ref: 太1:21, quote: 你要給他起名叫耶穌，因他要將自己的百姓從罪惡裡救出來}
巴拿巴:
  - {ref: 徒4:36, quote: 使徒稱他為巴拿巴（巴拿巴翻出來就是勸慰子）}
