# 歸回的名冊（拉 2、尼 7）：讀經時第三個畫面「名冊」的內容（唯一來源；由 ../roster.py 讀取並檢查）
#
# 每一份名冊對應讀經路線上的一段（segment）。名冊照經文本身的分段排（sections），每一段有很多行（rows）：
#   at：經節。一節可以有好幾行（拉 2:65 僕婢、歌唱的男女）。
#   label：顯示的字，必須在那一節經文裡逐字出現。
#   count：人數（或件數），必須等於 label 後面那個中文數字；unit 是數字後面的量詞（沒寫就是「名」）。
#   names：只列名字、沒有各自人數的節（尼提寧、守門的），每個名字都必須在那一節逐字出現；
#          同一行的 count 是經文給的總數（拉 2:42「共一百三十九名」）。
#   total：這一行是前面幾行合起來的總數（經文自己寫的「共……名」），不畫長條。
#   big：會眾的總數，畫大字。
#   who：誰捐的（尼 7:70–72），必須在那一節逐字出現。
#   quote：這一節要在名冊上原句引出的經文（必須是那一節的逐字片段）。
#   par：尼 7 這一行在拉 2 的對應節；建置時比較兩邊的 label 與 count，不同的標出來。
# 段落屬性：
#   bars: false 的段不畫人數條（牲畜、捐獻，單位不同）；lost: true 的段畫虛線框（不能指明、尋不著譜系的）。
# narrative：敘述節，名冊不加行。名冊段裡的每一節不是有行，就是寫在 narrative。
# 只寫經文給的數字；不寫任何累計或自己加總的數字。

