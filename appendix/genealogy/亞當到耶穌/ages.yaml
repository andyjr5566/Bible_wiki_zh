notes:
  - id: shem
    refs: 創5:32, 創7:6, 創11:10
    text: 閃的出生照創5:32「挪亞五百歲生了閃、含、雅弗」來畫；亞法撒的出生照創11:10「洪水以後二年，閃一百歲生了亞法撒」來畫。洪水那年挪亞六百歲，照這兩節算，閃生亞法撒時是一百零二歲，和「閃一百歲」差兩年。創5:32 把三個兒子寫在同一個年歲下，經文沒有說誰先出生。
  - id: terah
    refs: 創11:26, 創11:32, 創12:4
    text: 他拉的兒子照創11:26「他拉活到七十歲，生了亞伯蘭、拿鶴、哈蘭」，以七十歲生亞伯蘭來畫。這樣算，亞伯蘭出哈蘭時他拉還活著，和司提反的說法不同，見「他拉幾歲生亞伯蘭」。
  - id: joseph
    refs: 創41:46, 創41:53, 創45:6, 創47:9
    text: 約瑟的出生是推算的：他見法老時三十歲，七個豐年過去、饑荒又過了二年，雅各下埃及見法老時一百三十歲，所以約瑟出生時雅各九十一歲。
