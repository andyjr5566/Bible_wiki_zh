# 家族軌跡：同一個家族（或同一個人）在歸回後的幾份名單都出現（唯一來源；由 ../family.py 讀取並檢查）
#
# 名冊、城牆畫面上，那一行（或那個名字）底下一排小籤「也在：……」，點了跳到那一節讀。
# 連結規則（使用者定案：有根據且沒人反對才連）：
#   每一處 STEP 原文編號（含字母）都和 strong 相同，而且 TIPNR 是同一條；四套註釋沒有人說不是。
#   原文編號不同的那一處，必須有註釋明說是同一家、而且沒有人反對，寫在那一處的 basis（建置會擋）。
# 照規則不連的（原文編號或 TIPNR 分開）：
#   拉 8:3、尼 3:25、尼 10:14 的巴錄（H6551H／I／J，TIPNR 各自一條，和 H6551G 分開）；
#   尼 3:4、3:21 哈哥斯（H6976J）和拉 2:61、尼 7:63 的哈哥斯（H6976I）；
#   尼 3:11 巴哈摩押、哈琳，尼 3:29 音麥，尼 10:14–27 民的首領裡的家族名（各自一條）；
#   拉 2:31、尼 7:34「別的以攔」：經文自己寫「別的」，CT 也說和 2:7 的以攔有別。
#   尼 3:20「薩拜」：STEP 寫 H2140（和拉 2:9 薩改同號），TIPNR 在這一節卻列 H2079H，兩邊不一致。
#   只在拉 2、尼 7 兩份平行名單出現的家族不列（兩份已逐行對照）。
# forms：這個家族在經文裡的中文寫法；tipnr：TIPNR 的那一條（每一處的原文編號都必須屬於這一條）。
# places：at 經節；word「名字@第幾次出現」。
families:
  - name: 巴錄的子孫
    forms: [巴錄]
    strong: H6551G
    tipnr: Parosh@Ezr.2.3-Neh
    places:
      - {at: 拉2:3, word: 巴錄@1}
      - {at: 拉10:25, word: 巴錄@1}
      - {at: 尼7:8, word: 巴錄@1}
    basis:
      - {source: stepbible_ezra_2.txt, quote: H6551G}
      - {source: stepbible_ezra_10.txt, quote: H6551G}
      - {source: stepbible_nehemiah_7.txt, quote: H6551G}
      - {external: STEPBible TIPNR, version: commit bd09545, entry: Parosh@Ezr.2.3-Neh}
