# 南北國列王對照頁（頁面由 ../build_genealogy.py 產生；君王資料在 kings.yaml）
type: compare
book: 歷代志下
output: appendix/南北國列王對照.md
title: 南北國列王對照
check_intro_quotes: true
kings_registry: kings.yaml
intro: |
  從掃羅到猶大亡國，以色列和猶大一共有四十多位王。列王紀和歷代志在寫每位王的時候，常用一句固定的話評斷他，例如「行耶和華眼中看為正的事」或「行耶和華眼中看為惡的事」。下面把南北兩國的王並排比較：每位王經文怎麼評斷他、評語後面有沒有『只是……』的但書、後來有沒有轉變，以及他在位時做了哪些事。
howto:
  - 記號照經文評語的原句分類：● 行正、●但 行正另有但書、◐ 好轉壞、◑ 壞轉好、○ 行惡、— 沒有評語。
  - ※ 表示列王紀（或撒母耳記）和歷代志對這位王的評語寫法不同，例如一卷有評語、另一卷沒有，或一卷多寫了他後來的轉變。北國的王歷代志幾乎沒寫，所以不標。
  - 評語原句和但書都逐字照和合本；事蹟段落裡「」內的話也是原句，經節寫在段落後面。
  - 年代照 Thiele 年表，只是幫助看先後和長短，經文本身沒有公元年份。
summary:
  - 北國以色列前後有 {north_total} 位王（連和暗利爭位的提比尼在內），出自 {north_dynasties} 個不同的家族。其中 {north_usurped} 位是殺了前王篡位的，被人殺死的王有 {north_killed} 位。
  - 北國的王當中，經文說他行正的只有{north_good_phrase}，而且後面接著但書；評為行惡的有 {north_bad} 位。
  - 猶大 {judah_total} 位王（連篡位的亞他利雅）當中，經文說他行正的有 {judah_good} 位。這 {judah_good} 位裡有 {judah_high_places} 位的評語後面跟著「只是邱壇還沒有廢去」，沒有這句話的只有{judah_no_high_places_names}。
  - 猶大有 {judah_killed} 位王死在刀箭之下（被臣僕、篡位的人或仇敵所殺），{judah_captive} 位最後被擄或死在外邦。
  - 經文寫明和哪位王同時的先知有 {prophets_dated} 位；{prophets_undated_names}這 {prophets_undated} 卷先知書，開頭沒有寫在哪位王的時候。
prophets_intro: |
  列王紀和歷代志常寫先知去見王、傳話給王；先知書的開頭也常寫『當某某作王的時候』。下表照年代排列，『同時期的王』只列經文明寫的，年代是從這些王的年代推出來的約數。書卷開頭沒有寫在哪位王時候的幾卷，年代是學者的推估，出處附在表後；約珥書各家的推估差距太大，年代圖上不畫。
dynasty_intro: |
  北國的王位常是殺了前王奪來的，有幾次新王一登基就殺盡前王全家（王上 15:29、王上 16:11、王下 10:11）。下表照先後列出北國的家族；年代圖上以色列欄的橫線，就是換了一個家族的地方。
appendix:
  intro: 下面幾張表預設收起，點標題可以展開。
  synchronism: 列王紀常用『某國的王某某第幾年，某某登基』把兩國的王接起來。下表照年代排列，原句照和合本。
  aliases: 同一位王在不同經卷有不同的名字，也有被外國的王改了名字的。
  foreign: 經文明寫和以色列或猶大的王有往來的外國君王，照年代排列。
  prophets: 上面『列王時代的先知』表裡，每一筆所根據的經文。
  years: 年代圖上每位王的年代，根據的是下面這些註釋的原句。Thiele 的王年常寫成跨年（例如 641/640），所以有些註釋寫的年份和圖上差一年。
  years_none: 經文沒有寫提比尼爭位多久；圖上依王上 16:15、16:23 的對照紀年，畫在心利和暗利登基之間。
groups:
  - kingdom: 統一
    heading: 統一王國
    intro: 掃羅、大衛、所羅門統治全以色列。所羅門死後，北方的支派立耶羅波安作王，王國分成南北兩國。
  - kingdom: 猶大
    heading: 南國猶大
    intro: 猶大的王都出自大衛家，只有亞他利雅例外；京城一直在耶路撒冷，直到巴比倫攻破聖城、把百姓擄去。
  - kingdom: 以色列
    heading: 北國以色列
    intro: 北國換了好幾個家族作王，許多王是殺了前王篡位的。列王紀評斷北國的王時，常說他們不離開耶羅波安的罪。北國最後被亞述攻取，百姓被擄到亞述。
