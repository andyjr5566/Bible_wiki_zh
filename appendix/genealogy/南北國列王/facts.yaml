# 君王卡片的固定欄位（由 kings.yaml 的 facts_file 載入，依王的 id 合併）。
#
# 每一格的 quote 必須逐字出現在 ref；text 是卡片上顯示的短句，只能寫 quote 裡有的事。
# mother／age：母親、登基年歲。兩卷寫法不同時，另一卷寫在 also。
# accession.kind：受膏／繼位／被立／篡位。end.kind：去世／病死／被殺／戰死／自盡／自焚／被擄／死在外邦。
# dynasty：只有北國的王有，同一家族用同一個名稱。
# foreign：和這位王有往來的外國君王（經文原句）。
# aliases：別名或改名。

掃羅:
  age: {text: 四十歲, quote: 掃羅登基年四十歲, ref: "撒上 13:1"}
  accession: {kind: 受膏, text: 撒母耳膏他作君, quote: 撒母耳拿瓶膏油倒在掃羅的頭上, ref: "撒上 10:1"}
  end: {kind: 自盡, text: 在基利波山被弓箭手射傷，伏在刀上死了, quote: 掃羅就自己伏在刀上死了, ref: "撒上 31:1-4"}
  foreign:
    - {who: 亞捫人的王拿轄, quote: 亞捫人的王拿轄上來, ref: "撒上 11:1"}
    - {who: 亞瑪力王亞甲, quote: 生擒了亞瑪力王亞甲, ref: "撒上 15:8"}

