# 列王時代的先知（由 kings.yaml 的 prophets_file 載入）。
#
# 每位先知的 times 是經文把他和哪位王放在同一個時候：
#   king：kings.yaml 的王 id，或下面 rulers 的外邦君王 id；quote 逐字在 ref，ref 的經文也必須出現這位王的名字。
#   nth：「某王第幾年」。exile：「約雅斤被擄第幾年」（不必有 king）。
#   at：start／end 取這位王登基或去世那一年，不取整段在位期間。
#   link_only：true 表示只記他和這位王同時（卡片上會列出），不拿來推年代（例如以利沙見約沙法是在以色列王約蘭的時候）。
#   bound：start／end 表示這一條只用來定先知年代的起點或終點（例如以賽亞在「烏西雅王崩的那年」蒙召）。
# 先知的約年代由程式從這些王的 Thiele 年代推出來：整段在位取 start–end，第幾年取 start 減年數。
# span: intersect 表示經文只記一次同時見兩位王，取兩段在位年代重疊的部分。
# 書卷開頭沒寫在哪位王時候的先知，用 estimate（附 source）；說法差太多的只寫 views，不畫在年代圖上。
# where：自動依同時期的王所屬的國；寫了 where 就用它，並附 where_quote／where_ref。

rulers_source: 'Nebuchadnezzar II（https://en.wikipedia.org/wiki/Nebuchadnezzar_II ）、Amel-Marduk（https://en.wikipedia.org/wiki/Amel-Marduk ）、Cyrus the Great（https://en.wikipedia.org/wiki/Cyrus_the_Great ）、Darius the Great（https://en.wikipedia.org/wiki/Darius_the_Great ）各條目的在位年代。古列只取他作巴比倫王以後（約主前 539 起），也就是經文說的「波斯王古列元年」那段時間。'
exile:
  label: 被擄巴比倫
  anchor: 約雅斤
  ref: "王下 24:15"
  quote: 並將約雅斤和王母、后妃、太監，與國中的大官，都從耶路撒冷擄到巴比倫去了
  end_ruler: 古列
  end_quote: 波斯王古列元年
  end_ref: "代下 36:22"

rulers:
  - {id: 尼布甲尼撒, name: 巴比倫王尼布甲尼撒, short: 尼布甲尼撒, empire: 巴比倫, years: {start: 605, end: 562}, quote: 巴比倫王尼布甲尼撒上到猶大, ref: "王下 24:1"}
  - {id: 以未米羅達, name: 巴比倫王以未米羅達, short: 以未米羅達, empire: 巴比倫, years: {start: 562, end: 560}, quote: 巴比倫王以未米羅達元年, ref: "王下 25:27"}
  - {id: 古列, name: 波斯王古列, short: 古列, empire: 波斯, years: {start: 539, end: 530}, quote: 波斯王古列元年, ref: "代下 36:22"}
  - {id: 大利烏, name: 波斯王大利烏, short: 大利烏, empire: 波斯, years: {start: 522, end: 486}, quote: 大利烏王第二年, ref: "該 1:1"}

estimate_sources:
  wiki_nahum: 'Book of Nahum（https://en.wikipedia.org/wiki/Book_of_Nahum ）：多數學者認為寫在埃及的挪亞們（底比斯）陷落（約主前 663）之後、尼尼微陷落（約主前 612）之前。'
  wiki_habakkuk: 'Book of Habakkuk（https://en.wikipedia.org/wiki/Book_of_Habakkuk ）：多數學者認為內容最合約雅敬作王的時候（約主前 609–597）。'
  wiki_obadiah: 'Book of Obadiah（https://en.wikipedia.org/wiki/Book_of_Obadiah ）：多數學者定在耶路撒冷陷落（約主前 587）之後不久；也有人主張主前 853–841 或主前五、四世紀。'
  wiki_malachi: 'Book of Malachi（https://en.wikipedia.org/wiki/Book_of_Malachi ）：寫在第二聖殿完工（約主前 515）以後，接近以斯拉、尼希米到耶路撒冷的時候（約主前 445）。'
  wiki_joel: 'Book of Joel（https://en.wikipedia.org/wiki/Book_of_Joel ）：學者的推估從主前九世紀約阿施作王的時候，到主前八世紀烏西雅的時候、約主前 630–587、約主前 520–500，以及主前 400 或 350 前後，沒有多數意見。'

