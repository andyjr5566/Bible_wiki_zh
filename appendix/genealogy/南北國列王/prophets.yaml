# 列王時代的先知（由 kings.yaml 的 prophets_file 載入）。
#
# 每位先知的 times 是經文把他和哪位王放在同一個時候：
#   king：kings.yaml 的王 id，或下面 rulers 的外邦君王 id；quote 逐字在 ref，ref 的經文也必須出現這位王的名字。
#   year＋source：經文寫「某王第幾年」「被擄第幾年」時，直接用註釋換算好的年份，source 寫註釋的出處（要能在 raw_data 找到原句）。
#   nth：「某王第幾年」，沒有 year 時才用王的年代推算。exile：「約雅斤被擄第幾年」（不必有 king）。
#   at：start／end 取這位王登基或去世那一年，不取整段在位期間。
#   link_only：true 表示只記他和這位王同時（卡片上會列出），不拿來推年代（例如以利沙見約沙法是在以色列王約蘭的時候）。
#   bound：start／end 表示這一條只用來定先知年代的起點或終點（例如以賽亞在「烏西雅王崩的那年」蒙召）。
# 先知的約年代由程式從這些王的 Thiele 年代推出來：整段在位取 start–end，第幾年取 start 減年數。
# span: intersect 表示經文只記一次同時見兩位王，取兩段在位年代重疊的部分。
# 書卷開頭沒寫在哪位王時候的先知，用 estimate（附 source）；說法差太多的只寫 views，不畫在年代圖上。
# where：自動依同時期的王所屬的國；寫了 where 就用它，並附 where_quote／where_ref。

exile:
  label: 被擄巴比倫
  anchor: 約雅斤
  ref: "王下 24:15"
  quote: 並將約雅斤和王母、后妃、太監，與國中的大官，都從耶路撒冷擄到巴比倫去了
  end_ruler: 古列
  end_quote: 波斯王古列元年
  end_ref: "代下 36:22"

rulers:
  - {id: 尼布甲尼撒, name: 巴比倫王尼布甲尼撒, short: 尼布甲尼撒, empire: 巴比倫, years: {start: 605, end: 562}, quote: 巴比倫王尼布甲尼撒上到猶大, ref: "王下 24:1", source: 《舊約聖經背景注釋》但 1:1 注釋：「尼布甲尼撒二世（主前605～562年在位）」}
  - {id: 以未米羅達, name: 巴比倫王以未米羅達, short: 以未米羅達, empire: 巴比倫, years: {start: 562, end: 560}, quote: 巴比倫王以未米羅達元年, ref: "王下 25:27", source: '《聖經精讀本》但 5 章注釋：「以未米羅達( 耶51:31,B.C.562-560)」'}
  - {id: 古列, name: 波斯王古列, short: 古列, empire: 波斯, years: {start: 539, end: 530}, quote: 波斯王古列元年, ref: "代下 36:22", source: 《串珠聖經註釋》但 11 章注釋：「古列（主前五三九至五三○，參拉1:1）」}
  - {id: 大利烏, name: 波斯王大利烏, short: 大利烏, empire: 波斯, years: {start: 521, end: 486}, quote: 大利烏王第二年, ref: "該 1:1", source: 《串珠聖經註釋》但 11 章注釋：「大利烏（主前五二一至四八六，參拉5:6）」}

estimate_sources:
  nahum: 《舊約聖經背景注釋》鴻 1:1 注釋：「極可能是主前六六三年（埃及城市底比斯被亞述攻佔的時期──鴻三8）以及主前六一二年，尼尼微陷落於巴比倫與瑪代聯軍的這段時期」。
  habakkuk: 《啟導本註釋》哈 1:2 注釋：「哈巴谷說預言的時候正值約雅敬王在位（主前609～597年）」；《舊約聖經背景注釋》哈 1:6 年代小注：「本書的寫作日期一定是在主前六○五年迦基米施戰役之前」。
  obadiah: 《舊約聖經背景注釋》俄 1 注釋：「最可能和它參與耶路撒冷最後的破壞、人民於主前五八七至五八六年被巴比倫王尼布甲尼撒所擄有關」。《靈修版聖經注釋》另列一說：寫於西元前853至841年，約蘭任猶大王期間。
  malachi: 《舊約聖經背景注釋》瑪 2:14–16 注釋的標題是「主前第五世紀的婚姻與離婚狀況」；《啟導本註釋》瑪 1:8 注釋：「猶大此時在波斯治下」。
  joel: 《舊約聖經背景注釋》珥 1:2 注釋：有些學者把寫作時間定在主前第九世紀中葉，也有可能是在被擄之後的時期所寫，「此書的寫作年代頗具爭議性而複雜」。

