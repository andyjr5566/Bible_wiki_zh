      - id: deut15-s2
        title: 第七年讓人走出去
        verses: 12-18
        laws:
          - id: deut15-12
            title: 釋放希伯來弟兄不可空手
            refs: ["12-18"]
            topics: [slavery]
            summary: 被賣的希伯來男人或女人服事你六年，第七年要任他自由出去，而且要從羊群、禾場、酒醡之中多多地給他，不可使他空手而去。
            basis: [12, 13, 14]
            why: [15]
