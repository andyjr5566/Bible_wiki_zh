        laws:
          - id: deut5-12
            title: 照神的吩咐守安息日
            refs: ["12-15"]
            topics: [sabbath]
            summary: 要照神的吩咐守安息日：六日做工，第七日連僕婢、牛驢和寄居的客旅都不可做工，使僕婢可以和你一樣安息；也要記念你在埃及地作過奴僕。
            basis: [12, 13, 14, 15]
            why: [15]
