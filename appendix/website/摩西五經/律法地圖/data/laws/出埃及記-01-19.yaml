    sections:
      - id: ex19-s1
        title: 在西乃山下預備
        verses: 10-15
        laws:
          - id: ex19-10
            title: 百姓要自潔，洗衣服，不可上山，不可親近女人
            refs: ["10-15"]
            topics: [corpse, one-god]
            summary: 叫百姓今天明天自潔，洗衣服，到第三天預備好了，因為第三天耶和華要降臨在西乃山；要在山的四圍給百姓定界限，不可上山，也不可摸山腳，凡摸山的必治死，不可用手摸他；也不可親近女人。
            basis: [10, 11, 12, 13, 14, 15]
