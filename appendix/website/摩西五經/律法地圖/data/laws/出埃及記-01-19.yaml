    sections:
      - id: ex16-s1
        title: 安息日與嗎哪
        verses: 23-30
        laws:
          - id: ex16-23
            title: 第六天收雙倍的食物，第七天是聖安息日，不可出去收
            refs: ["23-30"]
            topics: [sabbath]
            summary: 明天是聖安息日，是向耶和華守的；要烤的就烤了，要煮的就煮了，所剩下的留到早晨；六天可以收取，第七天乃是安息日，那一天必沒有了；耶和華既將安息日賜給你們，所以第六天賜給兩天的食物。
            basis: [23, 25, 26, 29]
            why: [29]
