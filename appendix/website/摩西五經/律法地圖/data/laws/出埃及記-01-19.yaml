    sections:
      - id: ex12-s1
        title: 逾越節
        verses: 2-27
        laws:
          - id: ex12-02
            title: 以本月為正月，為一年之首
            refs: ["2"]
            topics: [passover]
            summary: 你們要以本月為正月，為一年之首。
            basis: [2]
          - id: ex12-03
            title: 初十日取羊羔，十四日黃昏宰了，塗血在門框上，當夜烤了吃
            refs: ["3-13"]
            topics: [passover, offerings]
            summary: 本月初十日，各家按父家取一隻無殘疾、一歲的公羊羔，留到十四日黃昏宰了，把血塗在房屋的門框和門楣上；當夜用火烤了，與無酵餅和苦菜同吃，不可剩下留到早晨；吃的時候腰間束帶，趕緊地吃。
            basis: [3, 5, 6, 7, 8, 10, 11]
            why: [13]
          - id: ex12-14
            title: 記念這日，吃無酵餅七日，除去家中的酵
            refs: ["14-20"]
            topics: [passover]
            summary: 你們要記念這日，守為耶和華的節，作為世世代代永遠的定例；要吃無酵餅七日，頭一日要把酵從各家中除去；頭一日和第七日當有聖會；凡吃有酵之物的，無論是寄居的是本地人，必從以色列會中剪除。
            basis: [14, 15, 16, 19, 20]
            why: [17]
          - id: ex12-21
            title: 長老按家口取羊羔宰逾越節的祭，兒女問時要講給他們聽
            refs: ["21-27"]
            topics: [passover, parents]
            summary: 摩西召眾長老，吩咐他們按家口取出羊羔，宰了逾越節的羊羔，用牛膝草蘸血打在門楣和門框上，誰也不可出門，直到早晨；這例要作為永遠的定例；兒女問這禮是什麼意思，就告訴他們。
            basis: [21, 22, 24, 26, 27]
      - id: ex12-s2
        title: 逾越節的例
        verses: 43-49
        laws:
          - id: ex12-43
            title: 逾越節的例：外人不可吃，在一個房子裡吃，骨頭不可折斷
            refs: ["43-49"]
            topics: [passover, sojourner]
            summary: 外邦人不可吃這羊羔；用銀子買的奴僕受了割禮就可以吃；寄居的和雇工人不可吃；要在一個房子裡吃，不可把肉帶到外頭；外人願守逾越節，男子務要受割禮；本地人和寄居的同歸一例。
            basis: [43, 44, 45, 46, 48, 49]
  - chapter: 13
    excluded:
      - { verses: "1", reason: 耶和華曉諭摩西的引言 }
      - { verses: "17-22", reason: 以色列人離開埃及，神用雲柱火柱引導的敘事 }
    sections:
      - id: ex13-s1
        title: 頭生的與無酵節
        verses: 2-16
        laws:
          - id: ex13-02
            title: 以色列中凡頭生的，無論人或牲畜，都歸耶和華
            refs: ["2"]
            topics: [firstborn]
            summary: 以色列中凡頭生的，無論是人是牲畜，都是耶和華的，要分別為聖歸他。
            basis: [2]
          - id: ex13-03
            title: 記念出埃及的日子，吃無酵餅七日，要告訴兒子
            refs: ["3-10"]
            topics: [passover, parents]
            summary: 你們要記念從埃及出來的這日，吃無酵餅七日，到第七日要向耶和華守節，在你四境之內不可見有酵的餅；當那日要告訴兒子，這是因耶和華在我出埃及的時候為我所行的；每年要按著日期守這例。
            basis: [3, 6, 7, 8, 10]
          - id: ex13-11
            title: 頭生的牲畜歸耶和華；頭生的驢用羊羔代贖；頭生的兒子都要贖出來
            refs: ["11-16"]
            topics: [firstborn, offerings]
            summary: 到了迦南地，要將一切頭生的和牲畜中頭生的公的歸給耶和華；頭生的驢要用羊羔代贖，若不代贖就要打折牠的頸項；凡兒子中頭生的都要贖出來；兒子問起，就告訴他耶和華用大能的手領我們出埃及。
            basis: [11, 12, 13, 14]
            why: [15]
