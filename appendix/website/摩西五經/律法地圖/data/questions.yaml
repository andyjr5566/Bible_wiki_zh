# 首頁的生活問題卡（手寫）。
# - q：問題，≤30 字、以「？」結尾。只問經文本身回答得了的事，不問經文沒處理的現代情境。
# - laws：回答這個問題的條文 id（1–3 條）。卡片翻開時顯示的是這些條文自己的白話說明，問題卡本身不另寫答案。
# 問句一樣過白話說明的 lint，另外禁口號式寫法（見 scripts/build-data.mjs 的 COPY_BANNED）。
- q: 買來的希伯來奴僕，要服事幾年？
  laws: [ex21-02]
- q: 被賣作婢女的女子，主人不供給他，可以離開嗎？
  laws: [ex21-07]
- q: 弟兄窮到賣身給你，可以叫他做奴僕的工嗎？
  laws: [lev25-39]
- q: 放奴僕走的時候，可以讓他空手走嗎？
  laws: [deut15-12]
- q: 安息日那天，家裡誰都不可做工嗎？
  laws: [ex20-08]
- q: 十誡裡守安息日的理由，兩卷說的一樣嗎？
  laws: [ex20-08, deut5-12]
- q: 借錢給窮人，可以收利息嗎？
  laws: [ex22-25]
- q: 拿人的外衣作當頭，什麼時候要還他？
  laws: [ex22-26]
- q: 偷了牛羊，要賠多少？
  laws: [ex22-01]
- q: 誤殺了人，可以逃到哪裡？
  laws: [ex21-12]
- q: 第七年，田地要怎麼辦？
  laws: [ex23-10]
- q: 寄居的外地人，可以欺壓他嗎？
  laws: [ex22-21, ex23-09]
