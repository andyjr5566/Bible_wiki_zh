# 節日的骨架：日期、場景、配色、經文出處、知識庫條目。這裡不寫解說文字（解說在 story.yaml）。
# 經文出處用「書卷簡稱＋章:節」，例如「出12:1-14」；建置腳本會從 raw_scripture 抽出全文。
# 配色：paper 紙色、ink 主墨、accent 第二色墨、glow 光。暗色模式由渲染器把紙和主墨對調明暗，accent 不變。

title: 耶和華的節期
motto: 利23:2

# 條目的一句簡介（40 字內）：依該條目「## 定義」改寫成給一般讀者的一句話。
# 沒寫的條目才退回自動截取「## 定義」第一句。完整內容一律連回知識庫，網站不搬。
entry_gists:
  亞筆月: 以色列宗教曆的正月，名字意思是「初熟之穀」；被擄後改稱尼散月。
  以本月為正月: 出12:2 把出埃及的那個月定為一年之首，重訂了整套年曆的起算點。
  逾越節: 正月十四日黃昏宰羊、塗血、吃羊羔的節期，記念耶和華越過以色列人的家。
  逾越節羔羊: 正月初十挑選、十四日宰殺的無殘疾一歲公羊羔，綿羊山羊都可以。
  牛膝草: 拿來蘸血、打在門楣和門框上的小草；後來也用在潔淨的儀式裡。
  滅命的: 出12:23 擊殺埃及長子的那一位；是天使還是神自己，解法不一。
  苦菜: 逾越節當夜和羊羔、無酵餅同吃的苦味菜，記念在埃及為奴的苦。
  無酵餅: 沒有發酵的餅；逾越節當夜同吃，無酵節七日都要吃。
  第十災（殺長子之災）: 十災的最後一災：半夜擊殺埃及地所有的長子和頭生的牲畜。
  三大節期: 一年三次朝見神的節期：除酵節、收割節、收藏節（出23:14-17）。
  基督預表（逾越節羔羊）: 新約把基督稱為「我們逾越節的羔羊」（林前5:7）。

