book: "利未記"
chapter: 3
candidates:
  - name: "平安祭"
    type: "神學"
    evidence: "利3:1-17 全章核心主題；CT: 平安祭此名詞在希伯來文表示「和好」或「福祉」，所獻的可為感謝、還願或甘心獻的；GT 丁良才: 平安祭有三樣——感恩、還願、樂獻，都有酬恩的意思；KC: 平安祭是五祭的中央，是獻祭者能分享的惟一一種祭；BH: 又稱相交之祭，象徵獻祭者與神的復和與相交"
    surfaces:
      - "平安祭"
      - "酬恩"
  - name: "平安祭的三類（感謝祭、還願祭、甘心祭）"
    type: "主題"
    evidence: "利3:1 小字「平安：或作酬恩」；CT: 所獻的可為感謝、還願或甘心獻的(七15~16)；GT 丁良才: 「平安祭有三樣：（一）感恩，（二）還願，（三）樂獻（七11-18），這三樣都有酬恩的意思」；GT《精讀本》: 分為感謝祭(7:15)、還願祭(7:16)、甘心祭(7:16)；GT《舊約聖經背景註釋》: 「平安祭共分甘心祭、還願祭、感謝祭三類。三者共通之處是獻祭者可以藉此與親朋共享筵宴」；BH: 用以表達感恩、還願或尋求與神相交。跨章價值：利7:11-18 食用期限依類別而異、利19:5-8、利22:21,29-30、民6"
    surfaces: []
  - name: "平安祭的聚餐（神人同席）"
    type: "主題"
    evidence: "利3:1,6,12 不能以鳥類為供物；CT: 「獻平安祭不能以鳥類代替家畜乃由於該祭的禮儀包括聚餐，獻祭者與他的親朋(特別是貧窮的)共用供物」；CT 3:16: 焚燒脂油「象徵神參與獻祭者的宴會」；GT 丁良才: 為感謝獻的平安祭須當日吃、須在主面前吃、坐席的人必須潔淨，並引申十二6-7、17-18 三個吩咐；GT《舊約聖經背景註釋》: 這祭在分享立約筵席時往往同時獻上（出二十四5；書八31），「板油燒在壇上，肉類則全在筵宴中吃用」；KC: 對應主的桌子與主的晚餐（林前10:16-21）；BH: 「食物之祭」意指與神共享的一餐"
    surfaces: []
  - name: "按手"
    type: "原文"
    evidence: "利3:2,8,13 獻祭者按手在供物頭上；CT: 按手表示獻祭的人與所獻的祭牲合而為一；KC: 按手是認同的記號；GT 丁良才: 燔祭與平安祭相同的儀式有四——奉獻、按手、宰牲、灑血"
    surfaces:
      - "按手"
  - name: "灑血"
    type: "主題"
    evidence: "利3:2,8,13 亞倫子孫把血灑在壇周圍；CT: 宰殺祭牲是獻祭之人的工作，奉上血和灑血則是祭司的工作；GT 丁良才: 「灑」字按原文有擲或拌、或扔的意思，七十士譯本譯作「把血倒在壇的周圍」；GT 賈斯樂郝威: 灑與倒的難題並無衝突；BH: 灑血象徵潔淨與成聖"
    surfaces:
      - "把血灑在壇的周圍"
  - name: "脂油"
    type: "原文"
    evidence: "利3:3-5,9-11,14-16 列舉獻給耶和華的脂油；CT: 脂油即指肥肉，是牲畜體內最肥美上好的部分；GT 丁良才: 脂油就是祭牲上最佳美的，但肥肉神並不禁止以色列人吃；GT《舊約聖經背景註釋》: 板油是內臟周圍的脂肪層，很容易整片剝下，與血同屬歸耶和華的分；KC: 脂油代表主耶穌完成那工作所用的能力"
    surfaces:
      - "脂油"
      - "蓋臟的脂油"
      - "臟上所有的脂油"
  - name: "內臟"
    type: "原文"
    evidence: "利3:3,9,14 三次「蓋臟的脂油和臟上所有的脂油」；CT 原文字義: 「蓋」遮蓋、隱藏，「臟」內臟、內部；GT《舊約聖經背景註釋》: 板油是內臟──主要是腸、肝、腎──周圍的脂肪層；KC: 內臟說到主耶穌的情感"
    surfaces: []
  - name: "腰子"
    type: "原文"
    evidence: "利3:4,10,15 兩個腰子和腰子上的脂油；CT: 希伯來人認為腰子、肝上的網子代表人感情的中樞，取下腰子表示承認神完全掌管人的生命；GT《舊約聖經背景註釋》引米格倫: 腎周圍、肌腱之上的板油；KC: 腰子是智慧的圖畫，能分辨善惡"
    surfaces:
      - "兩個腰子"
      - "腰子上的脂油"
  - name: "肝上的網子"
    type: "原文"
    evidence: "利3:4,10,15 肝上的網子和腰子一概取下；CT／GT《串珠》: 或作「肝葉」，乃指肝上的脂油，其狀似網；GT《舊約聖經背景註釋》引米格倫: 肝臟的尾狀葉（caudate lobe）；BH: 古代近東文化中肝常與占卜相連；KC: 肝在聖經獻祭以外三次出現都帶方向感失落的意味"
    surfaces:
      - "肝上的網子"
  - name: "肥尾巴"
    type: "原文"
    evidence: "利3:9 綿羊的整肥尾巴都要在靠近脊骨處取下；CT: 尾巴特別肥大，可重七公斤或以上；GT 丁良才: 猶太國的綿羊是寬尾巴的，重十幾斤；GT《啟導本》: 有的尾巴重達30公斤；GT《舊約聖經背景註釋》: 長達四至五呎，重達五十磅；GT 雷氏: 可重達四十八至七十三磅；BH: 古代近東珍貴的部位"
    surfaces:
      - "整肥尾巴"
  - name: "馨香之氣"
    type: "神學"
    evidence: "利3:5,16 獻與耶和華為馨香的火祭；CT: 罪沒有香氣可言，惟有預表奉獻、事奉與交通的祭物，火才使之發出馨香；GT《啟導本》: 「馨香」原文作「取悅的香氣」，不可誤解為以祭物香氣供養神；KC: 這是神所欣悅的奉獻；BH: 基督的犧牲被描述為馨香的供獻（弗5:2）"
    surfaces:
      - "馨香的火祭"
      - "馨香火祭的食物"
  - name: "無殘疾（tamim）"
    type: "主題"
    evidence: "利3:1,6 必用沒有殘疾的；CT 原文字義: 「沒有殘疾的」完全的、健全的；KC: 無論我們對主耶穌所知多少，祂裡面沒有瑕疵；BH: 供物要反映神完全的本質，預表無瑕疵無玷污的羔羊（彼前1:19）"
    surfaces:
      - "沒有殘疾的"
  - name: "火祭（isheh）"
    type: "主題"
    evidence: "利3:3,5,9,11,14,16 將脂油作為火祭獻給耶和華；CT: 凡把全部或一部分供物燒在壇上的都稱為火祭；CT 原文字義: 「食物」食物、麵包；GT 丁良才: 「食物」是借用人聞味吃飯的話，並非神有什麼缺乏；GT《舊約聖經背景註釋》: 這術語只限於形容這一種祭，意思可能是神與他們分享祭筵，不是需要祭物維生"
    surfaces:
      - "火祭"
      - "獻給耶和華為火祭"
  - name: "會幕門口"
    type: "地點"
    evidence: "利3:2,8,13 宰於會幕門口／會幕前；CT: 壇指燔祭壇，放置在會幕近門口之處；GT《靈修版》: 這祭壇是在帳幕的裡面、會幕的外面；GT 丁良才: 聖書上沒有說明平安祭牲在壇那邊宰，因平安祭的祭牲有時很多，神也不嚴定一個宰牲的地方"
    surfaces:
      - "會幕門口"
      - "會幕前"
  - name: "亞倫和他兒子（祭司）"
    type: "人物"
    evidence: "利3:2,5,8,11,13,16 亞倫子孫作祭司的要把血灑在壇的周圍／把這些燒在壇上；CT: 宰殺祭牲是獻祭之人的工作，奉上血和灑血則是祭司的工作；GT《精讀本》: 百姓只能把祭牲牽來按手，祭司負責焚燒與灑血"
    surfaces:
      - "亞倫子孫"
      - "亞倫的子孫"
      - "祭司"
  - name: "燔祭"
    type: "神學"
    evidence: "利3:5 亞倫的子孫要把這些燒在壇的燔祭上；CT: 祭司每天早晨先獻燔祭，然後獻平安祭等其他的祭；GT 丁良才: 平安祭燒在燔祭上，特要表明平安是本著贖罪及將自己全然獻與神而來的"
    surfaces:
      - "壇的燔祭上"
  - name: "素祭（minchah）"
    type: "原文"
    evidence: "利3 經文未提素祭；GT 丁良才在本章總論列出為感謝獻平安祭的手續，其中獻祭之人要行的第五件事是「獻三種餅（七11-13）」——那三種餅即素祭的形式（利2:4）"
    surfaces: []
  - name: "搖祭"
    type: "原文"
    evidence: "利3 經文未提搖祭；GT 丁良才在本章總論列出平安祭手續，獻祭之人第六件事是「將脂油和胸奉給祭司作搖祭（七30）」，祭司第五件事是「把胸在耶和華面前搖一搖（七30）」"
    surfaces: []
  - name: "舉祭"
    type: "原文"
    evidence: "利3 經文未提舉祭；GT 丁良才在本章總論列出平安祭手續，祭司第四件事是「從三種餅內各取一個獻給耶和華為舉祭（七14）」、「又把右腿作舉祭（七32）」；CT: 平安祭僅燒脂油和肥尾巴，右腿歸給祭司"
    surfaces: []
  - name: "牛群"
    type: "文化"
    evidence: "利3:1-5 若是從牛群中獻；GT 丁良才: 平安祭的祭牲不論生年的大小、公母都可；KC: 神總是從最大的開始，但也給百姓機會獻上較小的祭；BH: 牛是貴重資產，在古代以色列牲畜是衡量財富的主要標準"
    surfaces:
      - "牛群"
  - name: "綿羊"
    type: "主題"
    evidence: "利3:7 若獻一隻羊羔為供物；GT 丁良才: 「羊羔」兩個字的原文在別處譯作「綿羊」，本節用這字大概是因為獻這祭所用之羊的生年是不定的；KC: 羊羔說到溫柔、順服與甘願忍受苦待"
    surfaces:
      - "羊羔"
  - name: "山羊"
    type: "文化"
    evidence: "利3:12-16 人的供物若是山羊；CT: 平安祭將綿羊和山羊分別記述，是因為綿羊有肥尾巴，山羊則無；CT 原文字義: 「山羊」母山羊；KC: 山羊本是贖罪祭的牲畜，用牠獻平安祭想到的是罪被除去；BH: 山羊比牛便宜，反映獻祭者的經濟狀況"
    surfaces:
      - "山羊"
  - name: "永遠的定例"
    type: "神學"
    evidence: "利3:17 這要成為你們世世代代永遠的定例；CT: 「永遠的定例」在利未記出現十三次之多並列出全部出處；GT《串珠》: 這在利未記出現十七次之多；BH: 這是一條超越時間的條例，跨世代、跨地域"
    surfaces:
      - "世世代代永遠的定例"
  - name: "脂油和血都不可吃"
    type: "神學"
    evidence: "利3:17 脂油和血都不可吃；CT: 脂油是為焚燒獻給神的，血是為贖罪，故兩者都不可吃；GT 丁良才: 無論是獻上的或不獻之牛羊的脂油和血都不可吃；GT《啟導本》: 申十二15-16 禁止吃血但沒有禁止吃脂油，所講的事完全不同不可混淆；GT《精讀本》: 脂油被視為維持生命的力量根源，血被視為生命本身；KC: 神保留脂油與血的權利"
    surfaces:
      - "脂油和血都不可吃"
