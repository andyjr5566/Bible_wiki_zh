book: 利未記
chapter: 15
updates:
- title: 禮儀不潔與道德罪的分別
  path: link_folder/神學/禮儀不潔與道德罪的分別.md
  summary: 本章是這條界線在利未記裡最清楚的一章。KC 在導言把它與痲瘋擺在一起對照：「痲瘋是罪，因此也是玷污，是出於一個人自己的意志。漏症卻是不由自主發生的，沒有意圖。」他並指出處理方式的輕重不同——本章沒有祭司察看的程序，也不必遷出營外，「這顯明這些不潔的案例並不像痲瘋那樣被重重追究。神在罪的性質上作了分別。」BH 從頭到尾用同一句話說明：這裡的不潔「是禮儀性的，不是道德性的」，並說利未記律法裡的「不潔」不等同於有罪，而是一種需要潔淨的禮儀狀態。GT《聖經精讀本》的說法一致：舊約時代的不潔觀念不是倫理道德方面的可恥行為。
  relation: 利12 的產婦、利13 的皮膚病都要靠註釋家把兩件事分開，本章卻是經文自己把它們分開的——v16-18 的夢遺與夫妻同房完全沒有規定獻祭，GT《利未記雷氏研讀本》兩次點明這是正常的分泌「因而不需要為此而獻祭」。KC 說得最直接：這跟生孩子一樣，不是一件有罪的行為，沒有罪咎。與此同時本章又不否認事情的嚴重性：v31 說不隔絕就會「因自己的污穢死亡」——不潔不等於犯罪，卻仍然不能帶到神的帳幕面前。
- title: 血
  path: link_folder/主題/血.md
  summary: v19「女人行經，必污穢七天」與 v25「經期以外患多日的血漏」，是本卷把血本身當作不潔來源的第二處（第一處是利12 的產血）。GT《聖經精讀本》說把行經的人定為不潔是因流血的緣故，這血因身體的破壞而流出；GT《啟導本》另從分泌物的組成解釋為什麼連正常的性事也算不潔：「分泌物中包含了人體中已死亡的細胞，而死乃不潔的表徵。」
  relation: 同一卷書裡，血在利17:11 是贖罪的憑藉，在本章卻是玷污的來源——這正是利12《串珠》思想問題所指出的那個張力，本章把它推到最大：不但產血如此，月經與血漏也如此。GT《舊約聖經背景註釋》補上古代近東的對照：「古代世界到處都視經血令人不潔，幾個文化更以為有被鬼魔影響的危險」，而以色列的處理只是洗身，沒有避邪的儀式。
- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: 本章是利11-15 這組條例的最後一章。GT 丁良才在 v32-33 把整組收攏：利未記11章1節到15章33節論的是禮儀上的四種不潔——動物之不潔（利11）、產婦之不潔（利12）、大痲瘋之不潔（利13-14）、漏症等疾之不潔（本章）。STEP 語言資料顯示本章仍是同一組字：v2 的「不潔淨」是形容詞 טָמֵא（H2931），v13 的「痊癒了」與「就潔淨了」則都是動詞 טָהֵר（H2891）。
  relation: 這一章補上了前幾章沒有的一個層次：不潔會經由物件與接觸一層層傳出去（床、座位、鞍子、被吐到、拿過他身下之物），而且分等級——GT 丁良才注意到 v23 只說不潔到晚上、不必洗衣洗澡，「因為他所染的不潔淨比21、22節所提的輕些」。全章的理由寫在 v31：使以色列人與污穢隔絕，免得玷污神的帳幕。
- title: 瓦器打碎銅器擦淨
  path: link_folder/主題/瓦器打碎銅器擦淨.md
  summary: v12「患漏症人所摸的瓦器就必打破；所摸的一切木器也必用水涮洗」。CT 給的理由很實際：古時的瓦器沒有塗上一層磁釉，污穢會滲透進去，所以必須打破；BH 的說法相同——陶器多孔會吸收，木頭不吸收、洗過就乾淨。GT 丁良才指出患漏症的人「雖是只摸了瓦器的外面，那瓦器也就成為不潔」，並記下猶太人的解釋：這裡的「木器」也包括瓦器以外的一切器具。
  relation: 丁良才明確參照利6:28（贖罪祭肉的瓦器要打破）與利11:33（爬物掉進瓦器要打破）兩處註解，本章是同一原則第三度出現，這次適用的對象換成漏症患者所摸的器物。三處合起來看，判準始終是材質而不是用途：能洗乾淨的洗，洗不乾淨的打破。
- title: 斑鳩
  path: link_folder/主題/斑鳩.md
  summary: v14、v29 漏症痊癒者（無論男女）第八天要取兩隻斑鳩或兩隻雛鴿，帶到會幕門口交給祭司，一隻作贖罪祭、一隻作燔祭。
  relation: 這裡的用法與利5、利12 不同。GT 丁良才點出關鍵：「在平常獻祭的時候，只有貧窮人可以獻班鳩或雛鴿（五7，十二8，十四22），但為行這潔淨的禮，不論是貧的是富的都需獻這些鳥。」CT 的說法相同。也就是說，在別處鳥是窮人的替代品，在本章卻是所有人的規定供物。
- title: 雛鴿
  path: link_folder/主題/雛鴿.md
  summary: v14、v29 與斑鳩並列，為漏症痊癒者第八天的供物：兩隻雛鴿，一隻作贖罪祭、一隻作燔祭，男女同例。
  relation: 與斑鳩同一個特點——本章的鳥不是貧窮條款。GT 丁良才指出平常只有貧窮人可以用鳥代替羊羔，但行這潔淨禮則不論貧富都要用鳥。與利14 的大痲瘋潔淨禮相比也有差別：那裡貧窮人才改用鳥，而且贖愆祭的公羊羔不可減；本章沒有贖愆祭，也沒有貧富之分。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1「耶和華對摩西、亞倫說」：本章的漏症條例由摩西與亞倫一同領受，與利13:1、利14:33 相同（利14:1 則只對摩西說）。v31 的「你們」指的正是這兩人——CT 註明「『你們』指摩西和亞倫」。
  relation: 利11 到利15 這組潔淨條例的受命模式並不一致：利11、利13、利15 與利14:33 對摩西、亞倫兩人說，利12 與利14:1 只對摩西說。凡是條例的執行落在祭司身上的段落，亞倫都在受命之列，本章也不例外——第八天的獻祭要由祭司在會幕門口辦。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: v1 與亞倫同領本章條例；v14-15、v29-30 祭司在會幕門口收下兩隻鳥，獻一隻為贖罪祭、一隻為燔祭，在耶和華面前為患者贖罪。
  relation: 與利13-14 相比，祭司在本章的角色明顯輕。KC 指出本章沒有祭司察看的程序，「這不是公開的惡」——不像痲瘋要由祭司判定潔淨或不潔淨、要出營、要行兩鳥禮，本章的患者自己數七天、自己洗，祭司只在最後一步出現，負責獻祭贖罪。
- title: 會幕門口
  path: link_folder/地點/會幕門口.md
  summary: v14、v29 漏症痊癒者（男女皆同）第八天要把兩隻斑鳩或雛鴿帶到「會幕門口、耶和華面前」交給祭司。
  relation: 本章的立法理由正好說明為什麼終點是這裡：v31 說這些條例是要使以色列人與污穢隔絕，「免得他們玷污我的帳幕」。不潔的人不能靠近帳幕，而潔淨程序的最後一步就是重新站到帳幕門口——會幕門口在本章既是被排除的界線，也是恢復的地點。
