book: 利未記
chapter: 12
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1「耶和華對摩西說」：本章產婦生產潔淨條例由摩西單獨領受，未提亞倫，與利未記11章向摩西、亞倫兩人頒布的食物條例不同。BH 指出這句開場強調神與摩西之間的直接交通，也標明後面這些律法的權威與神聖來源。
  relation: BH 把摩西在本章的位置說成兩重：一方面他是神聖約的中保，本身就是神人之間終極中保基督的預表（提前2:5）；另一方面本章的場景是出埃及後的曠野行程，神正在建立祂的聖約群體、用律法把他們分別為聖，產婦潔淨條例就是其中一項。
- title: 割禮之約
  path: link_folder/神學/割禮之約.md
  summary: v3「第八天，要給嬰孩行割禮」。STEP 顯示這一節原文沒有「嬰孩」這個字（CT〔原文字義〕也註「原文無此字」），字面是「第八天，他包皮的肉要受割禮」，動詞 מוּל（H4135A）是被動語態。GT 丁良才指出嬰孩受割禮是「顯明這嬰孩在神與亞伯拉罕所立的約上有份」（創17:13，羅4:11），也表示這約的成功在乎脫去肉體的情慾（西2:10-11）；第八天若逢安息日仍要行割禮（約7:22-23），施洗約翰（路1:59）與主耶穌（路2:21）都在第八天受割禮。
  relation: 本章把創世記17章的約落實成日常生活裡反覆執行的條例，並給了第八天一個很實際的理由——丁良才說到第八天產婦的特別不潔淨剛好過去，「有人摟她，就不至於沾染不潔」，這是全家能夠聚在一起辦這件事的第一天。神學的一層落在「八」這個數字：GT《聖經精讀本》說「八是復活的數字(創17:12)」，象徵孩子重新生出來成為屬神的百姓（西2:11-13）；CT 說第八天表徵藉基督復活的生命、行割禮表徵靠十字架除去肉體的情慾（西2:11）；KC 說給男孩行割禮在屬靈上正是承認這孩子不潔，孩子是憑基督的死被帶到神面前的；BH 則指出新約把它轉成「心裡的割禮」（羅2:29）。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: v6,8 產婦潔淨期滿獻一歲羊羔為燔祭，力量不夠時以一隻鳥代替；本章燔祭排在贖罪祭之前，與利未記別處的次序相反。STEP 顯示 v6 的「羊羔」是 כֶּבֶשׂ（H3532）、「一歲的」字面是「牠年歲之子」，v8 換成 שֶׂה（H7716，簡要辭典作 sheep），GT 丁良才註這裡「無論是綿羊羔，是山羊羔」都可以。
  relation: 燔祭為何排在前面，四份來源給了四個不同的理由。GT 丁良才：「因為這贖罪祭不是為什麼指定的罪獻的，乃是禮節上的贖罪祭……這潔淨產婦的禮節，是多注重燔祭，少注重贖罪祭，表示那婦人，因神的慈悲，將自己獻給神。」CT：「人的不潔，因未完全為神活著，所以先獻燔祭後獻贖罪祭」，並說「燔祭表明新生命要成聖歸主，為主而活；贖罪祭是為產婦得成潔淨」。KC：燔祭排在前面因此帶有重點，惟有這樣才能明白一點贖罪祭的意思。GT《聖經精讀本》：「燔祭是對順利生產表示感謝和奉獻,贖罪祭是為除去伴隨生產的不潔。」
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: v6-8 產婦潔淨期滿獻一隻雛鴿或斑鳩為贖罪祭，力量不夠時兩隻鳥中的一隻作贖罪祭。STEP 顯示祭名是 חַטָּאת（H2403H），簡要辭典同時列出「罪」與「贖罪祭」兩義；「贖罪」的動詞是 כִּפֶּר（H3722A），BH 指出這個字（kaphar）帶有遮蓋或清除的意思。GT《舊約聖經背景註釋》據此主張，本章這一類案例證明舊譯的「贖罪祭」其實應該作「潔淨祭」：「這裡並沒有需『贖』之『罪』，只有在壇上被清除的不潔。」
  relation: 本章的贖罪祭與利8、利9 一樣屬禮節性，GT 丁良才在本章再次寫下同樣的判斷：「這贖罪祭不是為什麼指定的罪獻的，乃是禮節上的贖罪祭」；他並解釋本章為何只用一隻鳥作贖罪祭、與利5:7-10 的兩隻鳥不同——本章常規已經有羊羔作燔祭。不過來源在這祭「贖的是什麼」上並未一致：CT 在 v8 明說這裡的「贖罪」不是贖她的罪行，「乃是指贖她與生俱來的罪性」，與《舊約聖經背景註釋》的潔淨祭讀法方向不同。
- title: 斑鳩
  path: link_folder/主題/斑鳩.md
  summary: v6,8 產婦潔淨期滿的祭物之一：常規是一隻羊羔加一隻鳥，力量不夠時改用兩隻斑鳩或兩隻雛鴿，一隻作燔祭、一隻作贖罪祭。GT《啟導本》說明本章為何可以二者擇一：「雛鴿與班鳩屬同類，但班鳩為候鳥，在非洲過冬，四至十月分才飛來巴勒斯坦（歌二12）；鴿子則一年四季都有。條例中規定獻祭的人可在二者中選一，是有實際必要的。」
  relation: 這是條例裡少見的、把季節因素考慮進去的地方——斑鳩一年只有半年在巴勒斯坦，若只准獻斑鳩，冬天生產的婦人就無祭可獻。新約留下一個實例：GT 丁良才指出主耶穌的母親馬利亞只獻了兩隻鳥，暗示她的貧窮、無力獻羊為燔祭（路2:24）；GT《啟導本》從約瑟這一邊說同一件事——「說明約瑟當時家貧，無力獻羊只為祭」；KC 則說他們帶的是窮人的祭物，顯出主耶穌父母的貧窮。
- title: 雛鴿
  path: link_folder/主題/雛鴿.md
  summary: v6,8 與斑鳩並列為產婦潔淨的祭物：常規是一隻羊羔加一隻雛鴿或斑鳩，力量不夠時改為兩隻雛鴿。GT《啟導本》指出雛鴿與斑鳩雖屬同類，鴿子卻一年四季都有，斑鳩則是四至十月才飛來巴勒斯坦的候鳥，所以條例讓獻祭的人二者擇一，「是有實際必要的」。
  relation: 本章與利未記5章的差別在於贖罪祭只用一隻鳥。GT 丁良才給的理由是本章常規已經有羊羔作燔祭：利5:7-10 沒有羊羔，兩隻鳥要分擔燔祭與贖罪祭；本章有羊羔在前，贖罪祭一隻鳥就夠了。到了 v8 的貧窮條款羊羔被拿掉，才又回到兩隻鳥一燔一贖的組合。
- title: 燔祭祭牲的貧富分級
  path: link_folder/神學/燔祭祭牲的貧富分級.md
  summary: v8「她的力量若不夠獻一隻羊羔，她就要取兩隻斑鳩或是兩隻雛鴿」——與利未記1、5章相同的按力量分級原則，應用在產婦潔淨禮上。原文說得更具體：STEP 顯示這句字面是「她的手若找不到夠一隻羊的」，CT〔原文字義〕也註「力量」是手、所擁有的。
  relation: CT 話中之光把這條原則講得最清楚：「斑鳩只是表明些微的奉獻，似乎無足輕重，但是救恩的享受方面並未減少，不比龐大的公牛差。可見信心的表現不在量一方面，而是其物件。」他在靈意註解裡也說這「表徵人若有願作的心，必蒙神悅納」（參林後8:12）。BH 的說法是這條款顯出神體恤人的處境，使敬拜與贖罪不因財力而受限，並把它與耶穌稱讚投兩個小錢的寡婦相連（可12:41-44）。新約的實例是馬利亞獻兩隻鳥（路2:24）：GT 丁良才由此說她貧窮、無力獻羊為燔祭，GT《啟導本》則說明約瑟當時家貧。
- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: 本章全篇以「不潔淨」到「潔淨」的往返為骨架。STEP 顯示 v2、v5 的「不潔淨」是動詞 טָמֵא（H2930A），v4、v6「潔淨的日子」是名詞 טֹהַר（H2892A），v7、v8「就潔淨了」是動詞 טָהֵר（H2891）。不潔還分兩段：頭七天（生女孩十四天）是特別不潔，GT 丁良才記這幾天「凡摸她和摸她所躺或所坐之物件的人參不潔淨到晚上，並要洗衣服，用水洗澡」，GT《串珠》補上「期間她的丈夫也不可接近她」；其後的潔淨期則「只是不許接觸聖物而已」。
  relation: 利未記11章分辨的是食物的潔淨與不潔淨，本章把同一組字用到人身上——KC 把兩章的差別說成：十一章講的是人從外面沾來的污穢，本章講的是人自己身上的不潔。本章也替「不潔」畫出一條界線：GT《舊約聖經背景註釋》說「不潔的理由往往與犯罪毫無關係」，BH 說這是需要潔淨的禮儀狀態而非道德判決，CT 話中之光同樣寫「不潔淨並不是指有罪或污穢」。
- title: 血
  path: link_folder/主題/血.md
  summary: v4、v5 說婦人「在產血不潔之中」，v7 說祭司贖罪後「她的血源就潔淨了」。STEP 顯示「產血不潔」的原文是「血」（דָּם，H1818）加上 טֹהַר（H2892A，逐字解作「潔淨」），和合本把整個片語意譯成產血不潔的日子；v7 的「血源」則是 מָקוֹר（H4726，簡要義域 fountain）加「她的血」。CT〔原文字義〕註「源」是泉源，並讀出婦人生產流血受苦的根源在於違背神的命令（創3:16）。
  relation: 血在利未記別處是贖罪與潔淨的憑藉，本章卻成了不潔的來源。GT《串珠聖經註釋》在思想問題裡特地把這個對比提出來：「雖然在別的場合血有贖罪與潔淨之用（17:11），在此只會成為玷污的源頭。」本章的解法正是用另一種血——祭牲的血——去潔淨產婦的血源。BH 從同一角度說明：血雖是生命的象徵，卻使人在禮儀上不潔（參利15:19-30），潔淨之後婦人才能重返群體與宗教生活。
- title: 產婦不潔原因之爭（原罪說與血液不潔說）
  path: link_folder/解經爭議/產婦不潔原因之爭（原罪說與血液不潔說）.md
  summary: 本章沒有說明產婦為何不潔，來源因此分成兩個方向。指向人生來不潔的一方：CT 靈意註解說「婦人產後不潔，表徵全人類一出生就是不潔的」並引詩51:5；KC 說人生來不潔、只能生出不潔的孩子；GT《利未記雷氏研讀本》說生孩子雖是喜事，也「讓人記得，罪會遺傳到每個人身上」。指向禮儀狀態的一方：GT《啟導本》說不潔「不是因為生育，而是因為分娩時排出的不潔產血」，並反駁前一說「不能解釋何以獻贖罪祭的為產婦，而非新嬰」；GT《舊約聖經背景註釋》說「不潔的理由往往與犯罪毫無關係」；BH 說這「不是道德判決，而是需要潔淨的禮儀狀態」。
  relation: 值得注意的是 CT 兩種說法都寫了——靈意註解讀出人一出生就不潔，話中之光卻明說「不潔淨並不是指有罪或污穢」，並提醒神造男造女、吩咐人生養眾多，並沒有改變心意說性與生育是不潔淨的。GT 賈斯樂郝威《聖經難解經文詮釋手冊》把這兩層分得最清楚：他區分「母親的職責」與「人墮落後母道的情形」，前者是神所造、純潔無瑕的，後者則與其他人一樣落在罪的權勢之下，因此仍需潔淨。
- title: 產婦生產潔淨條例（男四十女八十天）
  path: link_folder/主題/產婦生產潔淨條例（男四十女八十天）.md
  summary: 本章條例的完整內容：生男孩不潔七天、第八天行割禮、再家居三十三天，共四十天；生女孩不潔十四天、再家居六十六天，共八十天。潔淨期滿要獻一歲羊羔為燔祭、一隻雛鴿或斑鳩為贖罪祭，力量不夠者以兩隻鳥代替。GT 丁良才回到原文說明兩段日子要相加：v4「原文作仍要家居三十三天，顯明頭七天不在那三十三天之內」，舊文理譯本作「必更待三十三日」。他並指出本章把產後不潔比作月經污穢，而月經的條例要到利15:19-30 才頒布，「可見傳律法以前以色列人就已經這樣行了」。
  relation: 生女孩為何加倍，經文沒說，來源給的答案彼此不合：丁良才說「大概是叫他們紀念，罪惡是借著女人入了世界」（提前2:14）；GT《聖經精讀本》說可能因為「在原罪上女人的責任比男人重」；GT《啟導本》先否定「女胎比男胎更不潔」的講法——「但獻祭贖罪的方式完全一樣，可見此說不能成立」——再提出族長社會中男女地位不同（參利27:2-7）或與女嬰長大後的月經有關；GT《串珠》與 BH 都提到讓母親休息康復的實際考量；GT《舊約聖經背景註釋》則直說「至於淨化期為何因嬰孩性別而有分別，卻沒有肯定的理由」。
