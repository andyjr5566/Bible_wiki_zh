book: 利未記
chapter: 8
updates:
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: 本章是出29章承接聖職禮的歷史實行：摩西按耶和華吩咐將亞倫和他兒子帶到會幕門口，在全會眾見證下用水洗身、穿聖衣、受膏油與血的三重潔淨，並獻贖罪祭、燔祭、承接聖職之祭（平安祭），歷時七天不可出會幕門（v1-36）。
  relation: 出29、40章確立承接聖職禮的規格與正式受膏，利8章是其歷史落實——祭司體系從「神所吩咐的條例」正式轉為「歷史上完成的事件」，為利9章亞倫首次獨立獻祭鋪路。
- title: 亞倫
  path: link_folder/人物/亞倫.md
  summary: 亞倫在本章正式受膏就任大祭司：穿上內袍、腰帶、外袍、以弗得、胸牌（內置烏陵土明）、冠冕與金牌後，摩西將膏油倒在他頭上使他成聖（v7-12）；隨後在贖罪祭、燔祭、承接聖職祭中按手、受血抹右耳右手右腳（v14-30）。
  relation: 承接出28-29章對亞倫大祭司職分的呼召與聖衣規格，本章是亞倫個人生命史的關鍵轉折——從「被揀選者」正式成為「就職的大祭司」，為利9章他首次以大祭司身分獨立獻祭、利10章拿答亞比戶事件鋪陳背景。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 摩西在本章全程主持承接聖職禮，親自擔任臨時祭司：宰殺祭牲、灑血抹血、焚燒脂油、行搖祭，並取羊胸歸自己的分（v6-30）。
  relation: GT 丁良才說明摩西為何能這樣做：神既認他為立約的中保、使他分派祭司，也就使他擔任祭司的職分，「因此亞倫和他兒子為自己獻這些祭的時候，摩西就作了臨時的祭司」，直到承接聖職的禮行完為止。KC 講的是同一件事：這裡所有的祭都由摩西獻上，因為祭司還沒有被按立、還不能獻，而摩西不需要按立。丁良才另指出 v29 羊的胸這一次歸摩西而非眾祭司，正因為他充任臨時祭司的職分。這是摩西在利未記中最後一次親自執行完整獻祭儀式的記載——禮成之後，祭司職分正式移交亞倫父子。
- title: 全會眾
  path: link_folder/人物/全會眾.md
  summary: 本章v3-4記載摩西招聚全會眾到會幕門口見證亞倫父子承接聖職，CT指出「為要觀禮以見證他們的任職出於神」；GT補充會幕門口場地有限，實際到場者可能為長老與百姓代表，其餘百姓或輪流觀禮。
  relation: 全會眾在此章的角色是祭司職分正式性的公開見證者——祭司體系不是私相授受，而是在全體百姓眼前、依神所吩咐的程序建立，呼應利4章全會眾作為贖罪祭對象的集體性身分。
- title: 受膏的祭司
  path: link_folder/人物/受膏的祭司.md
  summary: 利未記8:12「又把膏油倒在亞倫的頭上膏他，使他成聖」——亞倫是承接聖職禮中唯一被把膏油「倒」在頭上的人；他的兒子則在 v30 與他一同被「彈」上膏油與壇上的血。
  relation: 利4 章已預告「受膏的祭司」若犯罪需獻公牛犢贖罪祭，本章補上他受膏就職的具體儀式。GT 丁良才特別要讀者注意這兩個動詞的差別——「亞倫所受的聖油比他兒子所受的更多（注意本節的倒字參30節的彈字）」，理由是他的職分尊貴。原文確實是兩個不同的字：v12 的「倒」是 יָצַק（H3332G，STEP 逐字解「he poured」），v30 的「彈」是 נָזָה（H5137A，「he spattered」）。丁良才並由此讀出三層預表：聖油澆在亞倫頭上、亞倫在獻祭之先受膏而他兒子在獻祭之後才受膏、亞倫所受的比兒子多。
- title: 承接聖職（分別為聖）
  path: link_folder/神學/承接聖職（分別為聖）.md
  summary: 本章是出29 章承接聖職條例的歷史實行全程：水洗（v6）、穿聖衣（v7-9、13）、膏抹（v10-12）、獻贖罪祭燔祭與承接聖職祭（v14-30）、七日守在會幕門口（v31-36）。v33、v35 兩次確認「主叫你們七天承接聖職」。
  relation: 出29 章訂立規格，本章是這套規格第一次真實執行的記載。原文把這個詞的字面意思擺得很明白：v22、v28、v29、v31、v33 的「承接聖職」是名詞 מִלֻּאִים（H4394，STEP 逐字解「installation offering」），而 v33 同一節還配上動詞 יְמַלֵּא（מָלֵא，H4390）與受詞「你們的手」（יָד，H3027R），字面就是「他要充滿你們的手」——這正是 CT 的〔原文字義〕把「承接聖職」拆成「設立，裝置」＋「手」兩個字的根據，也是他所引「在希伯來文裏，奉獻應當繙作 to fill the hand」那句話的來源。GT《串珠聖經註釋》說「希伯來文原意是『充填物』」，GT《利未記雷氏研讀本》說「其希伯來名字的直譯作：『充滿』」，三處說的是同一件事。
- title: 膏抹成聖
  path: link_folder/神學/膏抹成聖.md
  summary: 本章「使他成聖」一詞三次緊扣膏抹動作：v10膏帳幕使其成聖、v11膏壇及器具使其成聖、v12倒膏油在亞倫頭上使他成聖；v30再取膏油與壇上血一同彈在亞倫父子及其衣服上，使人與衣一同成聖。
  relation: 出40章記載膏抹成聖是會幕啟用與祭司就職的必要程序，本章是此程序在利未記中的具體重演——膏抹的對象從器物（帳幕、壇、洗濯盆）擴及人（亞倫）與衣服，顯示成聖範圍由物及人的遞進。
- title: 山上的樣式
  path: link_folder/神學/山上的樣式.md
  summary: 「都是照耶和華所吩咐摩西的」這句話在本章反覆出現，涵蓋聖衣穿戴（v9、v13）、贖罪祭營外焚燒（v17）、燔祭（v21）、承接聖職祭與摩西的分（v29），顯示承接聖職禮的每一細節皆嚴格遵照神在山上所指示、記於出29章的樣式執行。
  relation: 出25-40 章確立「照山上樣式」建造會幕、製作聖衣、訂立承接聖職禮的原則，本章是這原則進入利未記後的首次歷史執行。原文可以把這個公式數得很精確：完全相同的片語 כַּאֲשֶׁר צִוָּה יְהוָה 之後接受詞「摩西」（「正如耶和華所吩咐摩西的」）在本章出現五次，就是 v9、v13、v17、v21、v29；另有幾處中文同樣譯作「吩咐」，原文結構卻不同——v4 的受詞是「他」而非「摩西」，v34 是「像今天所行的……耶和華吩咐行的」，v36 則是「耶和華藉摩西的手所吩咐的」。五次同形加上幾處變體，構成全章的節奏。
- title: 洗身（水洗）
  path: link_folder/神學/洗身（水洗）.md
  summary: 利8:6「摩西帶了亞倫和他兒子來，用水洗了他們」，是承接聖職禮的第一步；v21燔祭牲的臟腑和腿也須先用水洗過才獻上壇。
  relation: 出29章訂立水洗為祭司就職前的潔淨儀式，本章是其歷史實行——水洗與穿聖衣、受膏共同構成祭司分別為聖的三重預備，先潔淨己身，才能承受聖職。
- title: 聖衣（祭司聖服）
  path: link_folder/主題/聖衣（祭司聖服）.md
  summary: 本章詳記亞倫穿戴聖衣全過程：內袍、腰帶、外袍、以弗得、胸牌（內置烏陵土明）、冠冕與金牌共七件（v7-9）；亞倫兒子則穿內袍、腰帶、裹頭巾三件（v13）。GT《聖經精讀本》將各件對應基督屬性：內袍表人性、外袍表神性、以弗得表榮耀、胸牌表恩典公義、冠冕表順服權柄。
  relation: 出29、39章確立聖衣的規格與製作，本章是聖衣首次被實際穿在亞倫父子身上、正式投入使用的歷史記載，聖衣的靈意預表在此章從「已造之物」轉為「正在穿戴、正在事奉」的活生生表號。
- title: 以弗得
  path: link_folder/原文/以弗得.md
  summary: 利8:7「又加上以弗得，用其上巧工織的帶子把以弗得繫在他身上」，是亞倫聖衣穿戴次序中的第四件，穿在外袍之外。
  relation: 出28章詳述以弗得的製作規格與屬靈意義（表徵掛心教會的事），本章是以弗得首次被實際繫在大祭司身上的歷史時刻。
- title: 胸牌（決斷胸牌）
  path: link_folder/原文/胸牌（決斷胸牌）.md
  summary: 利8:8「又給他戴上胸牌，把烏陵和土明放在胸牌內」，胸牌是亞倫聖衣中安放烏陵土明、用以求問神旨意的器物，戴於以弗得之上。
  relation: 出28章規定胸牌須內置烏陵土明並繫於以弗得，本章是這規定的歷史實行——大祭司自此章起正式配戴胸牌，承擔為百姓求問神旨意的職責。
- title: 烏陵和土明
  path: link_folder/原文/烏陵和土明.md
  summary: 利未記8:8「又給他戴上胸牌，把烏陵和土明放在胸牌內」——這是烏陵土明第一次被實際放進大祭司的胸牌，成為日後為以色列人求問神旨意的器物。
  relation: 出28 章首次規定烏陵土明須置於胸牌內，本章是這規定的執行。它們究竟是什麼，各家都承認無法確定：CT 說「可能是兩塊小玉石，用來顯示神的旨意」，並指出「它們在被擄時便已失蹤」；GT《啟導本》說「因無法找出二字的來源，一切的解釋都不外乎推測，難作定論」，並提醒聖經最後提到它們是在尼希米記7:65。名稱的字義倒是清楚——GT《串珠聖經註釋》：「希伯來文字義是『光明與完全』。」GT《舊約聖經背景註釋》給了最具體的近東旁證：以是非題方式求問神明在古代近東廣為人知，巴比倫的塔米圖文獻保存了大量神諭問題的答案；美索不達米亞另有石子占卜，「廣泛使用肯定和否定的石頭（大概是鮮明和烏黑的石塊）」，亞述一份文獻更具體提及條紋大理岩和赤血石，同一顏色的石塊要連續抽出三次才算確定。它並指出烏陵在希伯來語是「光」的意思，理當與鮮明或白色的石頭有關。原文的兩個名字 STEP 都標為專名：אוּרִים（H224）與 תֻּמִּים（H8550）。
- title: 冠冕（裹頭巾）
  path: link_folder/原文/冠冕（裹頭巾）.md
  summary: 利8:9「把冠冕戴在他頭上，在冠冕的前面釘上金牌，就是聖冠」，是亞倫聖衣的最後一件；v13亞倫兒子則只包裹頭巾，前面沒有金牌，以此區別大祭司與眾祭司的身分。
  relation: 出28、39章規定冠冕（大祭司）與裹頭巾（眾祭司）的差異，本章是這差異首次在歷史場景中具體呈現——同樣的頭部覆蓋物，因是否釘金牌而區分出大祭司與眾祭司的職分等級。
- title: 內袍（雜色內袍）
  path: link_folder/主題/內袍（雜色內袍）.md
  summary: 利8:7「給亞倫穿上內袍」；v13「給他們（亞倫兒子）穿上內袍」，內袍是大祭司與眾祭司共同的第一件貼身聖衣。
  relation: 出28、39章規定內袍為祭司共同的基本聖衣，本章顯示無論大祭司或眾祭司，就職禮都以穿內袍為起始步驟，象徵祭司職分內在生命的純潔為先。
- title: 外袍（以弗得的外袍）
  path: link_folder/主題/外袍（以弗得的外袍）.md
  summary: 利8:7「穿上外袍，又加上以弗得」，外袍是大祭司獨有的聖衣，穿在內袍之外、以弗得之下，亞倫兒子的聖衣清單中並無外袍。
  relation: 出28、39章規定外袍為大祭司專屬服飾，本章的穿戴次序（內袍→腰帶→外袍→以弗得）確認外袍在整套聖衣中的位置與獨屬大祭司的地位。
- title: 腰帶（繡花腰帶）
  path: link_folder/主題/腰帶（繡花腰帶）.md
  summary: 利8:7「束上腰帶」；v13「束上腰帶」，腰帶是大祭司與眾祭司共同穿戴的聖衣之一，用以束緊內袍。
  relation: 出28、39章規定腰帶為祭司共同聖衣，本章顯示腰帶與內袍一同構成祭司聖衣的基礎組合，不分大祭司或眾祭司皆須束上。
- title: 牌子（冠冕牌）
  path: link_folder/原文/牌子（冠冕牌）.md
  summary: 利未記8:9「在冠冕的前面釘上金牌，就是聖冠」，是唯獨大祭司冠冕上才有的飾物；亞倫兒子的裹頭巾則沒有（v13）。
  relation: '出28、39 章規定金牌須刻「歸耶和華為聖」並繫於冠冕前，本章確認它是區分大祭司與眾祭司頭飾的關鍵標記。這個「牌」字在原文相當耐人尋味：CT 的〔原文字義〕註為「花卉」，並說「按原文字義，應當是指花朵狀冠冕上的飾物」；GT《舊約聖經背景註釋》也說「由於譯作『牌』字的原文字眼又可解作『花』，這徽記可能也是花狀的」。STEP 給出同一個答案——צִיץ（H6731A）的詞典義正是「flower」（花）。同一節的「聖冠」則是 נֵזֶר（H5145H，詞典義「consecration: crown」），與拿細耳人的「離俗」同一字根。GT《舊約聖經背景註釋》另舉出近東的對照：法老王冠前方那條稱為烏拉厄斯的蛇像是最有名的例子，學者相信它有護身作用。'
- title: 聖膏油
  path: link_folder/原文/聖膏油.md
  summary: 利未記8:2 摩西奉命把膏油與聖衣、祭牲一同帶來；v10-12 他用膏油抹帳幕和其中所有的、在壇上彈了七次並抹壇與器皿、洗濯盆和盆座，最後把膏油倒在亞倫的頭上膏他，使他成聖；v30 又取膏油和壇上的血一同彈在亞倫父子與他們的衣服上。
  relation: 出30 章給了膏油的配方與用途，本章是它第一次被實際使用的完整記載，而且用法分成三種：抹（器物）、彈七次（燔祭壇）、倒（亞倫的頭）。GT《舊約聖經背景註釋》為這個動作補上古代近東的處境：作膏抹用的香料是沒藥、肉桂、香蔗、桂皮；「油象徵神給百姓的恩賜，以及如今藉這典禮加諸其領袖身上的責任」。它並指出膏抹在鄰邦有另一層意義——「埃及和赫人相信膏抹能夠保護人不受冥界神祇勢力之害，君王和祭司都受膏抹」，亞馬拿文獻提到努哈瑟一位君王受法老所膏、一位巴力的女祭司在埃瑪爾受膏；「此外在整個古代世界，膏抹都是一個人法律地位得到提升的象徵」。同一份註釋也劃出一條界線：按以色列的慣例膏抹是揀選的象徵、常與聖靈的賞賜有關，「然而在關乎祭司的經文中，卻從來沒有暗示這一點」。原文的膏油是 שֶׁמֶן הַמִּשְׁחָה（H8081＋H4888A）。
- title: 洗濯盆（銅盆）
  path: link_folder/主題/洗濯盆（銅盆）.md
  summary: 利8:11「並洗濯盆和盆座，使他成聖」，洗濯盆與盆座僅需抹膏油便可成聖，不同於燔祭壇需另外彈油七次。
  relation: 出30章規定洗濯盆供祭司洗手洗腳之用，本章記載洗濯盆與其他會幕器具一同受膏成聖，正式進入使用狀態，供日後祭司供職前潔淨之用。
- title: 銅壇（燔祭壇）
  path: link_folder/主題/銅壇（燔祭壇）.md
  summary: 本章燔祭壇是全部獻祭儀式的中心：v11膏油彈壇七次並抹壇成聖，v15抹血於壇角使壇潔淨成聖，其後三獻祭的脂油、腰子、肝網、全羊皆焚燒於壇上（v16-28）。
  relation: 出27章規定燔祭壇的建造規格，出29章訂立膏壇彈油七次的條例，本章是壇首次在歷史場景中受膏成聖、並開始承接獻祭的記載，確立壇作為承接聖職禮唯一焚祭之處的地位。
- title: 按手
  path: link_folder/原文/按手.md
  summary: 利未記8:14、18、22 三次記載「亞倫和他兒子按手在……頭上」，分別在贖罪祭的公牛、燔祭的公綿羊、承接聖職的公綿羊頭上。
  relation: 利1-4 章已確立按手為獻祭者與祭牲聯合的儀式，本章特別之處在於按手的是亞倫父子自己——為自身贖罪與奉獻，不是替別人代獻。KC 由此讀出一項要求：按手意味著與所按的那一位認同，「你若要作祭司，就必須把自己與主耶穌的工作認同」。原文的動詞是 סָמַךְ（H5564，STEP 詞典義「to support」，倚靠、按住）；有一個細節值得注意——v14 的動詞是單數（雖然主詞是亞倫和他兒子兩方），v18 與 v22 則是複數。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: 利未記8:14-17 亞倫父子按手在贖罪祭公牛頭上，摩西宰牛、用指頭把血抹在壇的四角、把其餘的血倒在壇腳，使壇潔淨成聖；脂油、腰子、肝上的網子焚燒在壇上，皮、肉、糞則燒在營外——這是為祭司自身所獻的贖罪祭，不是為某一件已犯的罪。
  relation: 利4 章確立贖罪祭條例，本章是首次為「承接聖職」而非「已犯之罪」所獻的贖罪祭：GT 丁良才指出摩西沒有照為大祭司和會眾獻贖罪祭時的作法行，「因為這祭不是為亞倫有什麼一定的罪獻的」。原文在 v15 用了一個值得留意的動詞：「使壇潔淨」是 וַיְחַטֵּא——出自 חָטָא（H2398，詞典義「to sin」，犯罪），這裡是 Piel，STEP 的逐字解作「he cleansed from sin」（他除去了罪）。同一個詞根、同一種語態，在利6:26 也用來稱呼「為贖罪獻這祭的祭司」。丁良才另指出祭壇與祭司在被潔淨和受膏上是相連的。
- title: 脂油
  path: link_folder/原文/脂油.md
  summary: 本章脂油三次上壇：v16 贖罪祭公牛的脂油、肝上的網子、兩個腰子與腰子上的脂油；v20 燔祭公綿羊的脂油；v25-28 承接聖職公綿羊的脂油與肥尾巴，連同肝網、腰子、右腿及三樣無酵餅一同作搖祭後焚燒。
  relation: 利3-4 章確立脂油為祭牲中歸神的上好部分，本章在三種獻祭中一體適用，顯示這條規則不因獻祭場合（就職禮或日常獻祭）而改變。原文另有一處中文看不出的分別：v16、v25、v26 的「脂油」都是 חֵלֶב（H2459），但 v20「把頭和肉塊並脂油都燒了」用的卻是另一個字 פֶּדֶר（H6309，STEP 逐字解「the suet」）——同一章裡，和合本把兩個不同的原文字都譯成了「脂油」。
- title: 肝上的網子
  path: link_folder/原文/肝上的網子.md
  summary: 利8:16,25「肝上的網子」兩次出現，分別於贖罪祭公牛（v16）與承接聖職公綿羊（v25）中，與脂油、腰子一同焚燒於壇上。
  relation: 利3-4章確立肝上的網子為獻祭時焚壇脂油的一部分，本章重申此細節在祭司承接聖職所獻的贖罪祭與承接聖職祭中同樣適用。
- title: 腰子
  path: link_folder/原文/腰子.md
  summary: 利8:16,25「兩個腰子與腰子上的脂油」兩次出現，分別於贖罪祭與承接聖職祭中，與脂油、肝網一同焚燒於壇上，雖非脂油本身，仍歸神享用。
  relation: 利3-4章確立腰子隨脂油一同焚壇的條例，本章顯示這規則同樣適用於祭司自身承接聖職所獻的祭，不因獻祭對象是祭司本人而有例外。
- title: 皮肉頭腿臟腑糞
  path: link_folder/主題/皮肉頭腿臟腑糞.md
  summary: 利8:17「惟有公牛，連皮帶肉並糞，用火燒在營外」，因這贖罪祭是為祭司自身所獻，祭司不能像替百姓獻贖罪祭那樣吃祭牲的肉，故連皮帶肉並糞都須用火燒在營外。
  relation: 利4:11-12確立為受膏祭司或全會眾所獻贖罪祭的祭牲須連皮帶肉並糞全數燒在營外，本章亞倫父子自身的贖罪祭同樣適用此例，顯示祭司自己所獻的贖罪祭與利4章條例完全一致。
- title: 營外焚燒
  path: link_folder/主題/營外焚燒.md
  summary: 利8:17「用火燒在營外」，贖罪祭公牛的皮、肉、糞因祭司不得食用自己所獻的贖罪祭肉，須燒在潔淨的營外之地，而非壇上。
  relation: 利4章確立贖罪祭牲部分部位須營外焚燒以徹底除去罪污，本章是這規則首次應用於祭司自身承接聖職所獻的祭，象徵祭司自己的罪也須被徹底除淨方能承接聖職。
- title: 灑血
  path: link_folder/主題/灑血.md
  summary: 利未記8:19、24「摩西把血灑在壇的周圍」兩次出現，分別在燔祭的公綿羊與承接聖職公綿羊的餘血上。
  relation: 利1、3 章確立燔祭與平安祭牲的血須灑在壇周圍，本章確認同一規則適用於承接聖職所獻的祭。值得一提的是，本章的血一共用了四個不同的原文動詞，中文卻只看得出「抹／倒／灑／彈」的差別：v15 抹在壇角是 נָתַן（H5414H，放上去）、倒在壇腳是 יָצַק（H3332G，傾倒）；v19、v24 灑在壇周圍是 זָרַק（H2236，撒開）；v11 在壇上彈七次、v30 把膏油與血彈在人與衣服上，用的則是 נָזָה（H5137A，噴灑）。同一章裡四個動作、四個字，各有各的對象與目的。
- title: 火祭（isheh）
  path: link_folder/主題/火祭（isheh）.md
  summary: 利8:21,28「是獻給耶和華的火祭」「都是為承接聖職獻給耶和華馨香的火祭」，凡在獻祭中把全部或一部分供物燒在壇上的，皆稱為火祭。
  relation: 利1、3章界定凡經火焚燒獻上的祭物皆稱火祭，本章的燔祭與承接聖職祭同樣冠以「火祭」之名，確認此術語適用範圍及於祭司承接聖職所獻的各祭。
- title: 馨香之氣
  path: link_folder/神學/馨香之氣.md
  summary: 利8:21,28「為馨香的燔祭」「馨香的火祭」，燔祭與承接聖職祭焚燒後所發出的香氣蒙神悅納，令神心滿意足。
  relation: 利1章確立馨香之氣表徵神人相安、蒙神悅納的核心意象，本章亞倫父子承接聖職所獻的祭同樣以馨香之氣蒙神悅納作結，顯示這不僅是日常獻祭的果效，也是祭司就職蒙神接納的印證。
- title: 肥尾巴
  path: link_folder/原文/肥尾巴.md
  summary: 利8:25「取脂油和肥尾巴」，肥尾巴與臟上一切脂油、肝網、腰子、右腿一同構成承接聖職祭中歸神焚壇的上好部分。
  relation: 利3、7章確立肥尾巴屬平安祭牲上好部分、須焚於壇上，本章承接聖職祭（平安祭之特殊形式）同樣列入肥尾巴，確認此條例的一貫適用。
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: 利8:22-29第二隻公綿羊稱為「承接聖職之禮的羊」，屬平安祭的特殊形式：按手、宰殺、血抹亞倫父子右耳右手右腳並灑壇周圍、脂油與三樣無酵餅作搖祭後焚壇、羊胸作搖祭歸摩西。
  relation: 利3、7章確立平安祭一般條例（血灑壇周圍、脂油焚壇、胸歸祭司），本章的承接聖職祭是平安祭的特殊變體——血額外抹於祭司身體三處、胸不歸眾祭司而歸主持禮儀的摩西，顯示同一祭類可因場合而有特殊細節調整。
- title: 搖祭
  path: link_folder/原文/搖祭.md
  summary: 利8:27,29「把這一切放在亞倫的手上和他兒子的手上作搖祭」「摩西拿羊的胸作為搖祭」，搖祭是將祭物按水平方向前後擺動於耶和華面前的儀式動作。
  relation: 利7章確立搖祭為平安祭中胸的處理方式，本章承接聖職祭的搖祭範圍更廣——不僅胸，連同脂油、右腿、三樣無酵餅都一同放在亞倫父子手中作搖祭，象徵充滿雙手、全然獻上的授職語意。
- title: 至聖的供物（聖與至聖之分）
  path: link_folder/主題/至聖的供物（聖與至聖之分）.md
  summary: 利未記8:31-32 摩西吩咐亞倫父子把肉煮在會幕門口、只在該處吃，又吃承接聖職筐子裡的餅，剩下的肉和餅必須用火焚燒。
  relation: 利2、6、7 章確立至聖供物只限祭司在會幕院內食用、剩餘須焚燒的條例，本章的承接聖職祭同樣依此規格處理。GT 丁良才把這祭與尋常平安祭的三點差別列了出來：這祭所搖的餅是全燒的，尋常平安祭所舉的餅則歸獻祭的祭司；所剩的餅唯獨亞倫和他的兒子可以吃，尋常平安祭凡被請的人都可以吃；他們必須在會幕門口吃，平安祭則可以在任何潔淨之處吃。GT《串珠聖經註釋》另指出一項時效上的差異：平安祭牲的肉可以留到第二天的條例（利7:15-18）在這裡不適用，肉和餅要當天吃完，剩下的要燒掉。
- title: 出29：20
  path: link_folder/互文/出29：20.md
  summary: 利8:23-24「摩西把些血抹在亞倫的右耳垂上和右手的大拇指上，並右腳的大拇指上」，是出29:20命令的歷史實行——血抹三處表徵祭司今後專一聽從神的話、作神的工、行神的道。
  relation: 出29:20首次頒佈血抹右耳右手右腳的命令，並與出21:6穿耳儀式呼應（皆以身體部位表歸屬）；利8:23-24是這命令第一次被實際執行的歷史記載，完成從「條例」到「事件」的閉環。
- title: 會幕門口
  path: link_folder/地點/會幕門口.md
  summary: 本章會幕門口是整個承接聖職禮的場景中心：v3招聚會眾、v4會眾聚集、v31亞倫父子在此煮肉吃祭物、v33,35七天晝夜住在此處不可離開，直到承接聖職的日子滿了。
  relation: 利1章起會幕門口已是獻祭者奉上供物之處，本章擴大其功能——不僅是獻祭地點，更成為祭司七日禁足、與神百姓共同見證就職禮的核心場域，顯示會幕門口在祭司體系建立過程中承載的雙重意義。
- title: 無酵餅
  path: link_folder/原文/無酵餅.md
  summary: 利未記8:2 摩西奉命帶來「一筐無酵餅」；v26 從這筐子裡取出一個無酵餅、一個油餅、一個薄餅，放在脂油和右腿上作搖祭；v31 亞倫父子要吃「承接聖職筐子裡的餅」。
  relation: 出12、13 章的無酵餅屬逾越節與除酵節，出29 章把它編進承接聖職的條例，本章則是它第一次真的被裝在筐子裡、放進祭司手中、燒在壇上。GT 丁良才點出一項與平安祭的差別：「這承接聖職之禮的祭沒有同獻之有酵的餅」——利7:13 感謝祭要配有酵的餅，這裡不配。原文的三樣是 חַלָּה（H2471，STEP 逐字解「a round perforated bread」，打過孔的圓餅）、לֶחֶם שֶׁמֶן（油餅）與 רָקִיק（H7550，薄餅），與利7:12 感謝祭所配的三種餅是同一組詞；筐子則是 סַל（H5536）。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 利8:18-21亞倫父子按手於燔祭公綿羊頭上，摩西宰羊、灑血於壇周圍，全羊（連頭帶脂油，洗淨臟腑腿）焚燒於壇上為馨香的燔祭，是獻給耶和華的火祭。
  relation: 利1章確立燔祭全然焚燒、表徵完全奉獻的條例，本章亞倫父子親身經歷此祭——按手於燔祭牲頭上，等於將自己全然奉獻歸神，是承接聖職三祭中表明「成聖」意義的一環。原文在 v21 把這祭的三個名稱一次擺齊：עֹלָה（H5930A，燔祭）、רֵיחַ נִיחֹחַ（H7381＋H5207，馨香之氣）與 אִשֶּׁה（H801，火祭）；而 v20「把羊切成塊子」是 נָתַח（H5408）配同源名詞 נֵתַח（H5409，塊），CT 由此讀出「切成塊子表徵破碎自己」。
