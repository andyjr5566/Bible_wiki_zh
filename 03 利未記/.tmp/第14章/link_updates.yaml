book: 利未記
chapter: 14
updates:
- title: 古代近東的皮膚病與黴斑觀念
  path: link_folder/背景/古代近東的皮膚病與黴斑觀念.md
  summary: GT《舊約聖經背景註釋》在本章有四段材料。v2 潔淨禮：「用的必須是野生的雀鳥，因為放生（已沾染不潔）的雀鳥絕不可以誤獻為祭」，並說「美索不達米亞和 * 赫人的淨化儀式使用雀鳥的原因，是因為雀鳥能夠將 * 不潔帶回天上的本源」；使用香柏木「顯然因為它與線和血一樣，都是紅色的」，而「很多解經家都相信紅色代表生命」。v15：古代近東用油作為保護劑，埃及在整日活動前準備偶像的儀式包括類似 v18 的步驟。v34：「他們相信發霉的牆壁表示家中有人將要死亡。黴菌是鬼魔及附同之災難將臨的先兆。」v48：「胡利人的儀式使用雀鳥（兩隻獻祭，一隻放生），又焚燒香柏木，和以色列人一樣。* 巴比倫人則使用烏鴉和鷹隼，後者到野外釋放。」
  relation: 本章的對照比利13 更貼身——鄰邦不只觀念相近，連做法都幾乎一樣：一樣用鳥、一樣放生、一樣燒香柏木。分別落在兩處。第一是理由：鄰邦相信雀鳥能把不潔帶回天上的本源，背景註釋卻說「對以色列人來說，這儀式是象徵性的，不是法術（因為人已經痊癒）」——人是先痊癒才行禮，禮不是用來治病的。第二是對象：談到房屋的黴，註釋指出美索不達米亞把它看成家中有人將死的凶兆、是鬼魔的先兆，「然而本段並沒有這些成分，需要執行儀式的是房屋，不是在其中居住的人」。
- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: v57 用一句話收束利13-14 兩章：「指明何時為潔淨，何時為不潔淨。這是大痲瘋的條例。」GT《串珠聖經註釋》說明這幾節的用意是「使祭司自己能分辨又能教導人如何分別潔淨和不潔淨的事物（參10:10-11）」；GT 丁良才另加一句限制：「祭司不可隨自己的意思定人（或衣服，或房屋）為潔淨或不潔淨，乃是要照神所曉諭的條例定這些事。」
  relation: 利13 只能判到「不潔淨」為止，本章補上了回頭的路——同一組判定語彙，這次用在恢復的方向。全章的動作都朝這裡收：營外的兩鳥禮之後「就定他為潔淨」（v7），第八天獻完祭「他就潔淨了」（v20），房屋重墁之後「就要定房子為潔淨」（v48）。GT《啟導本》指出祭司要為痊癒者做兩件事：一是宣佈他的病已經痊癒，二是宣告這人可重享作神選民應有的權利。
- title: 禮儀不潔與道德罪的分別
  path: link_folder/神學/禮儀不潔與道德罪的分別.md
  summary: 房屋這一段把界線逼到最清楚的地方——房子不會犯罪。GT《聖經精讀本》在 v34 直說「並不是神對罪審判,使房屋發生麻風病」，並指出「當時巴勒斯坦地區經常發生黴變的腐蝕,是當地的流行病」。GT 丁良才也說：猶太人以為房屋有大痲瘋的災病是出於神特別的刑罰，「但是未必這樣」；他給的實際理由是那些房屋原是迦南七族人所住、身體衣服房屋多不潔淨，而且那地方天氣炎熱。
  relation: 但同一章裡 CT 的靈意註解仍逐項把房屋的災病讀成教會裡的罪惡——房屋表徵教會、騰空表徵與犯罪者隔絕、封鎖表徵不接納有問題的新人、挖石表徵革除；KC 的方向相同，把石頭讀成信徒（彼前2:5）。所以本章的分歧不在「有沒有屬靈教訓」，而在「這件事本身是不是神的審判」。GT《串珠》另提供一個結構上的證據：房屋的潔淨完全不必獻祭，「因為房子不會與神相交」——與人的潔淨禮非走到第八天獻祭不可，明顯不同。
- title: 贖愆祭（asham）
  path: link_folder/原文/贖愆祭（asham）.md
  summary: 12-32節；第八天要獻公羊羔為贖愆祭，祭司取其血抹在求潔淨人的右耳垂、右手大拇指、右腳大拇指上，再抹油在同樣三處；貧窮人的贖罪祭與燔祭可以用鳥代替，贖愆祭的公羊羔卻不能減。STEP 語言資料顯示 v12 的「贖愆祭」是 אָשָׁם（H817），與它同獻的「搖祭」是 תְּנוּפָה（H8573）。
  relation: GT 丁良才把本章的贖愆祭與利5:14-6:8 的常例逐條對照，列出九點不同：(一)是公羊羔、不必是長成的；(二)不按祭司所估定的價值；(三)有同獻的素祭；(四)與一羅革油同獻；(五)須在耶和華面前作搖祭；(六)由祭司自己搖，不是祭司同獻祭的人一起搖；(七)搖的是全祭牲而且是活搖，不是宰了以後只搖一部分；(八)血有特別的用法；(九)沒有罰金。至於這祭為什麼要獻，GT《串珠》與《舊約聖經背景註釋》都提到兩種可能：一是補償病人被隔離期間無法在聖所獻上的祭，二是萬一他先前患病確實與犯罪有關、以此補過。GT《聖經精讀本》說得更正面：贖愆祭是他作為選民、為恢復與神所立之約的特權而獻上的。
- title: 大痲瘋條例總結（利13-14）
  path: link_folder/主題/大痲瘋條例總結（利13-14）.md
  summary: v54-57 用四節收束整整兩章：各類大痲瘋的災病、頭疥、衣服與房子的大痲瘋，以及癤子、癬、火斑，最後一句是「指明何時為潔淨，何時為不潔淨」。GT《串珠聖經註釋》說這幾節的用意是「使祭司自己能分辨又能教導人如何分別潔淨和不潔淨的事物（參10:10-11）」；GT 丁良才加上限制：祭司不可隨自己的意思定人、衣服或房屋為潔淨或不潔淨，要照神所曉諭的條例定。
  relation: 兩章合起來才是一個完整的循環：利13 只走到判定，本章補上恢復。KC 由此把整段的功用歸在「教導」上，並引提後3:16——聖經都是神所默示的、於教訓是有益的；照他的說法，讀神的話就是受這種訓練，學會看出什麼是不潔淨、什麼是潔淨。GT《啟導本》則從內容的性質作結：這些條例「十分切合以色列民的生活環境，具體且實際，不帶任何異教邪魔的神秘顏色」。
- title: 房屋大痲瘋的診斷與潔淨條例
  path: link_folder/主題/房屋大痲瘋的診斷與潔淨條例.md
  summary: 33-53節。房主先報告（v35），祭司進去之前先叫人把房子騰空（v36），察看牆上有沒有發綠或發紅的凹斑紋、現象是否窪於牆（v37），有就封鎖七天（v38）；第七天若發散，就挖出病石扔在城外不潔淨之處、刮掉四圍的灰泥、換新石重新墁牆（v39-42）；若再發現就拆毀整棟，石頭木頭灰泥都搬到城外（v43-45）；封鎖期間進去的人不潔淨到晚上，在裡面躺著或吃飯的還要洗衣服（v46-47）；若沒有再發散，就用與人相同的兩鳥禮潔淨房子（v48-53）。
  relation: 這一段有兩處與人的條例不同。第一，它是預告而不是現行法——GT 丁良才指出本卷有四處條例要等到了迦南才遵守（本節與利19:23、23:10、25:2），以色列人此時還住在帳棚裡。第二，它不必獻祭：GT《串珠》說「這裡不須要向神獻祭，因為房子不會與神相交」。至於這災病究竟是什麼，丁良才列出三種解法：猶太人以為是神特別的刑罰、有人以為是發硝或起毒黴、有人以為是生黴菌或一種寄生動物；他自己傾向後者，並舉當時科學家已查出有六十種微生物能在硬石上生長，一個月內就能在最硬的大理石上蝕出看得見的痕跡。
