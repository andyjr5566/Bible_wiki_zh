book: 利未記
chapter: 7
updates:
- title: 贖愆祭（asham）
  path: link_folder/原文/贖愆祭（asham）.md
  summary: 利未記7:1-10 補足利5:14-6:7 未詳述的贖愆祭祭司程序：宰殺地點同燔祭（壇的北邊），血灑在壇的周圍（不是抹在壇角），脂油（肥尾巴、蓋臟的脂油、腰子、肝上的網子）焚燒在壇上，祭司中的男丁在聖處吃這至聖的祭物。v7 明訂「贖罪祭怎樣，贖愆祭也是怎樣，兩個祭是一個條例」。
  relation: 補齊利5 章「觸發情境與賠償」之外「祭司如何操作」的空白。GT 丁良才在本章列出贖愆祭與贖罪祭的五點不同（表意、性質、用血、祭牲、條例），其中第三點在原文裡看得最清楚：本章 v2 的「灑」是 זָרַק（H2236，STEP 詞典義「to scatter」，指從盆裡潑灑），與利4 贖罪祭抹壇角、彈幔子所用的 נָזָה 不是同一個動詞——用血方式的差異因此不只是位置不同，連動作的字都換了。丁良才也點出這個灑法「像燔祭、和平安祭的血一樣」。KC 另指出本章才是贖愆祭的實際描述，利6 的重點在賠償，這裡的重點則在祭司的分。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: v7「贖罪祭怎樣，贖愆祭也是怎樣，兩個祭是一個條例」，v37總結五祭時再度並列。CT：唯獨為祭司和全會眾所獻的贖罪祭牲因須全部焚燒（參四1-21），故為例外情形。
  relation: 本章不重複贖罪祭條例本身（已見利4、6章），只在v7以「一個條例」明確宣告贖罪祭與贖愆祭祭司分例相同，是利4、6章贖罪祭祭司規則向贖愆祭延伸適用的關鍵樞紐節點。
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: 利未記7:11-21 首次明確區分感謝祭、還願祭、甘心祭三種子類型與各自的食用期限——感謝祭當日吃完，還願祭與甘心祭可留到次日，第三天必須焚燒，吃的人要「擔當罪孽」。v28-34 規定祭司的分：搖祭的胸與舉祭的右腿，「作他們從以色列人中所永得的分」。GT《串珠聖經註釋》總結三方的分配：「平安祭是在各祭中唯一准許獻祭者分享的（11-21）。耶和華的分是燒在壇上的脂油（22-25），祭司的分（30-34）包括搖的胸和舉的腿，其餘所有的肉則歸獻祭者。」
  relation: 利3 只寫怎麼獻，本章補上怎麼吃、誰拿哪一份，兩章合起來才是完整的平安祭條例。原文在本章給的是完整說法「זֶבַח הַשְּׁלָמִים」——זֶבַח（H2077，STEP 逐字解「the sacrifice of」）加 שֶׁלֶם（H8002，「peace offering」），是「平安祭的祭牲」而非單一個字。另有一個容易讀過去的細節：v30 說「他親手獻給耶和華的火祭」，原文作 יָדָיו תְּבִיאֶינָה——動詞是第三人稱複數陰性，主詞正是他那雙手，字面就是「他的兩隻手要帶來」。CT 解為「獻平安祭的人，親自帶到祭壇前交給祭司」；KC 由此讀出一項要求：平安祭不能託人代獻，「神要從每一個人心裡領受」。
- title: 搖祭
  path: link_folder/原文/搖祭.md
  summary: 利未記7:30「好把胸在耶和華面前作搖祭，搖一搖」；v34「我從以色列人的平安祭中，取了這搖的胸和舉的腿給祭司亞倫和他子孫」——搖祭的胸歸亞倫和他的子孫。
  relation: 本章是搖祭在五祭條例中的定點。丁良才列出聖經裡被搖之祭物共七樣，平安祭的胸排第一，其餘六樣是承接聖職的祭物、初熟的莊稼一捆、疑妻行淫的素祭、離俗歸主之人的祭、被潔淨之長大痲瘋者的公羊羔和油、五旬節初熟麥子作的餅與同獻的祭牲。動作怎麼做，各家說法不一：CT 說是前後擺動；GT《利未記雷氏研讀本》說祭司把胸「搖一搖，或來回移動，向祭壇，又離開祭壇，象徵把祭物獻給神，神又把它交回給祭司」；丁良才另記下一種讀法，認為是祭司托著獻祭者的手一同搖。GT《舊約聖經背景註釋》則對「搖」這個動作本身存疑：「對經文詳細的研究，證明這些祭並沒有搖什麼東西；然而把祭在神面前抬起作為奉獻，卻是有可能的」，並指出這祭與舉祭的分別在於它一定是在神面前、即聖所獻上的。原文的名詞是 תְּנוּפָה（H8573，STEP 詞典義「wave offering」），動詞則是 נוּף（H5130B，「to wave」）。
- title: 舉祭
  path: link_folder/原文/舉祭.md
  summary: 利未記7:14「他要把一個餅獻給耶和華為舉祭，是要歸給灑平安祭牲血的祭司」；v32「你們要從平安祭中把右腿作舉祭，奉給祭司」；v34 再以「舉的腿」與「搖的胸」並稱。
  relation: 本章讓舉祭的兩種形態同時出現：一是配平安祭的餅（v14），二是祭牲的右腿（v32）。丁良才描述動作是「將所舉的祭物拿在手中，在耶和華面前舉起一次，表示這祭物是歸與耶和華的」，並指出一切舉祭都歸祭司。GT《舊約聖經背景註釋》對這個譯名提出修正：傳統譯作「舉祭」的字，新國際本作「捐獻」，指捐贈的禮物，「亞喀得語／巴比倫語和烏加列語的同源字，都證實了這個用法」；它並指出這類物件的擁有權經非正式的步驟從私人轉屬神明，捐獻地點通常不限於聖所——這正是它與搖祭的分野。原文是 תְּרוּמָה（H8641），STEP 的詞典義正是「contribution」（捐獻），與該註釋的判斷一致。
- title: 剪除
  path: link_folder/原文/剪除.md
  summary: 利未記7:20、21、25、27 四次使用同一個公式「必從民中剪除」，分別針對身上不潔淨而吃平安祭肉的人、摸了不潔之物後吃祭肉的人、吃火祭牲脂油的人、以及吃血的人。
  relation: '本章是這個公式在利未記中最密集的一段。原文作 וְנִכְרְתָה（כָּרַת，H3772I，STEP 詞典義「to cut: eliminate」）的 Niphal 被動式，字面是「那人要被剪除」——動作的執行者沒有寫出來。GT《舊約聖經背景註釋》正是據此指出：「本節所提的不是要人執行的刑罰，而是神的作為。這種懲罰的對象通常是限於侵犯聖物的人。」被剪除的對象在原文是 נֶפֶשׁ（生命、人），剪除的來源是 מֵעַמֶּיהָ（「從她的族人中」，עַם H5971B，STEP 詞典義「kinsman」），字面強調的是與親族的關係被切斷。'
- title: 從民中剪除的含義
  path: link_folder/解經爭議/從民中剪除的含義.md
  summary: 本章四次密集使用「必從民中剪除」公式（v20,21,25,27），適用於不潔淨吃祭肉、吃脂油、吃血。CT傾向「逐出說」；GT《利未記雷氏研讀本》同傾向「逐出說」；BH與GT《啟導本》則並陳「逐出」與「死亡」兩說，未有定論。
  relation: 既有條目原僅錨定創17:14拒受割禮一例；本章是「剪除」公式在摩西五經中最密集重複出現的段落，證實這是貫穿全律法書、持續存在的解經爭議，不因情境不同（背約 vs. 違反潔淨/獻祭條例）而有更明確答案。
- title: 脂油
  path: link_folder/原文/脂油.md
  summary: v23「牛的脂油、綿羊的脂油、山羊的脂油，你們都不可吃」；v24「自死的和被野獸撕裂的，那脂油可以做別的使用，只是你們萬不可吃」；v25吃火祭牲脂油者必從民中剪除。啟導本：脂油是祭物最好的部分，應屬耶和華；並補充保健理由（脂肪致血管硬化、膽固醇過高）。
  relation: 利3-6章的脂油禁令限於「被獻為祭之牲畜」的脂油，本章23-25節將禁令擴大到一切牛羊脂油（不限被獻者），並補充自死/被野獸撕裂脂油可作他用（如燈油）的例外規定。
- title: 血的尊重
  path: link_folder/神學/血的尊重.md
  summary: v26-27禁食一切雀鳥野獸之血，違者剪除。啟導本：「動物與鳥類的血都不可吃，因為血是活物的生命所寄（十七11）。生命既為神所給，只可以歸還給祂，人不可以佔有」。
  relation: 本章上承創9:4挪亞條例「肉帶著血、那就是他的生命，不可吃」，下接利17:10-14「活物的生命是在血中」的完整神學闡述，是「血代表生命、歸神主權」發展線在利未記中段的關鍵重申，並首度將此原則具體立法化（明訂剪除刑罰）。
- title: 脂油和血都不可吃
  path: link_folder/神學/脂油和血都不可吃.md
  summary: 利未記7:22-27 把利3:17 的總則展開成可執行的條文：牛、綿羊、山羊的脂油都不可吃（v23）；自死的與被野獸撕裂的，那脂油可以作別的用途、只是不可吃（v24）；吃了火祭牲畜脂油的必從民中剪除（v25）；一切住處、無論雀鳥或野獸的血都不可吃，吃血的同樣剪除（v26-27）。
  relation: 血的禁令比脂油的更寬——CT 指出，神雖准人吃羚羊、鹿等野獸的脂油，血卻是連雀鳥和野獸的都絕對不可吃。GT《啟導本》給了兩層理由：「動物與鳥類的血都不可吃，因為血是活物的生命所寄。生命既為神所給，只可以歸還給祂，人不可以佔有」，並補上保健的一面——血可能帶病菌、脂油可致血管硬化與膽固醇過高。GT《舊約聖經背景註釋》則把兩樣並列：「板油和血同列為歸耶和華所有。血怎樣是祭牲生命的表徵，板油亦同樣是祭肉的表徵。非祭牲的板油可吃，但任何動物的血都不可吃。」KC 說得最短：這兩樣是神保留給自己的——生命（血）與內在的力量（脂油）。原文的兩個字分別是 חֵלֶב（H2459）與 דָּם（H1818），「剪除」則是 כָּרַת（H3772I，STEP 逐字解「it will be cut off」）。
- title: 至聖的供物（聖與至聖之分）
  path: link_folder/主題/至聖的供物（聖與至聖之分）.md
  summary: v1「這祭是至聖的」（贖愆祭）；v6「祭司中的男丁都可以吃這祭物；要在聖處吃，是至聖的」。CT：「『這祭是至聖的』：意指贖愆祭和贖罪祭一樣，乃是至聖的」。
  relation: 本章1、6節將利2、6章已確立的「至聖供物」分類原則套用於贖愆祭；本章11-21節平安祭屬「聖」而非「至聖」（獻祭者可在潔淨處與家人分享），恰好在同一章內並列呈現兩種等級供物的對比，是全書對「聖」「至聖」區分最清楚的示範章節。
- title: 供物（qorban）
  path: link_folder/原文/供物（qorban）.md
  summary: v13-14「與供物一同獻上」「從各樣的供物中，他要把一個餅獻給耶和華為舉祭」；v29「要從平安祭中取些來奉給耶和華」；v38「就是他在西乃曠野吩咐以色列人獻供物給耶和華之日所說的」。
  relation: 本章末（v38）以「供物」一詞總結全部五祭，呼應利1章供物首次出現時「凡獻給神、使人得以親近祂的，皆稱供物」的定義，是利1-7章供物條例的收束用法，證實qorban貫穿五祭、不限某一祭別。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: 利未記7:9-10 補上利2、6 章之外「祭司如何分配不同做法的素祭」：在爐中烤的、煎盤中做的、鐵鏊上做的，都歸那位主祭的祭司；用油調和的與乾的細麵，則歸亞倫的子孫大家均分。v12-14 另說明素祭的三種餅如何伴隨平安祭的感謝祭獻上。
  relation: 利2 確立素祭的材料與五種形式，利6 訂立祭司處理素祭的操作條例，本章再補上「不同做法歸屬對象不同」（獨得或均分）這一層。原文把三種做法用三個不同的器具名分開：爐是 תַּנּוּר（H8574H，oven）、煎盤是 מַרְחֶשֶׁת（H4802，pan）、鐵鏊是 מַחֲבַת（H4227，griddle），正對上 CT 所說的爐烤、煎盤做、鐵鏊烙三種。v10「大家均分」在原文其實沒有「均分」這個詞——CT 的〔原文字義〕早就註明「（原文無此字）」，STEP 顯示那句話字面是 אִישׁ כְּאָחִיו，「各人像他的弟兄一樣」。丁良才並指出獻素祭時三樣餅可任選其一，但獻平安祭時三樣都要獻。
- title: 素祭不可有酵與蜜
  path: link_folder/主題/素祭不可有酵與蜜.md
  summary: v13「要用有酵的餅和為感謝獻的平安祭，與供物一同獻上」——是利2:11-12「素祭都不可有酵」規定唯一的例外情境。GT丁良才：「這裏用有酵餅乃是表示獻祭的人自己是有罪的，不配蒙神的恩典……不能因為感謝祭中獻上有酵餅，就認為酵是好的。這有酵餅只限用於平安祭」。
  relation: 利2章確立素祭不可有酵與蜜的核心禁例（僅初熟供物可用有酵餅為例外），本章13節補上第二個例外情境：感謝祭伴隨的有酵餅並非燒在壇上的素祭本身，而是與供物一同獻上、供人食用的部分，不違反「不可燒一點酵當作火祭」的核心禁令。
- title: 承接聖職（分別為聖）
  path: link_folder/神學/承接聖職（分別為聖）.md
  summary: 利未記7:35-36「這是從耶和華火祭中，作亞倫受膏的分和他子孫受膏的分，正在摩西叫他們前來給耶和華供祭司職分的日子……這是他們世世代代永得的分」；v37 的總結把「承接聖職的禮」與五祭條例並列。
  relation: 出29 章確立承接聖職禮本身，本章 35-37 節把它與祭司之分的規定接在一起：搖祭的胸與舉祭的腿，是摩西膏立亞倫父子當日起就設立的永久供給。v37 的「承接聖職」在原文是 מִלּוּאִים（H4394，STEP 逐字解「installation offering」，詞典義「setting」），與 CT 的〔原文字義〕「設立（祭司），安置」相合；v35「供祭司職分」則是動詞 כָּהַן（H3547，「to minister」）的 Piel。丁良才指出神在出29 已把承接聖職的禮曉諭摩西，利6:19-23 又加了些條例，本章則是把祭司的分正式錨定在膏立那一天。
- title: 火祭（isheh）
  path: link_folder/主題/火祭（isheh）.md
  summary: v5「祭司要在壇上焚燒，為獻給耶和華的火祭，是贖愆祭」；v25「無論何人吃了獻給耶和華當火祭牲畜的脂油」；v30「他親手獻給耶和華的火祭，就是脂油和胸」；v35「這是從耶和華火祭中，作亞倫受膏的分」。
  relation: 本章火祭一詞四次出現，涵蓋贖愆祭焚脂（v5）、被禁食的火祭牲畜脂油（v25）、平安祭焚脂與搖祭（v30）、祭司永得的分之總稱（v35），是串連五祭「焚燒歸神」共同本質的關鍵詞，補充利1、3-6章已列的火祭段落。
- title: 灑血
  path: link_folder/主題/灑血.md
  summary: v2「人在哪裡宰燔祭牲，也要在那裡宰贖愆祭牲；其血，祭司要灑在壇的周圍」。GT丁良才：「贖愆祭牲的血卻只灑在壇的周圍（本節），像燔祭、和平安祭的血一樣」，不同於贖罪祭抹壇角、倒壇腳的用法。
  relation: 確認贖愆祭灑血方式與燔祭、平安祭相同（灑壇周圍），有別於贖罪祭抹壇角、倒壇腳的儀式，補充利4章已建立的「灑血儀式因祭別而異」體系，是灑血法在五祭中的第三次（燔祭、平安祭、贖愆祭）確認。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: 本章1-38節通篇規定祭司（亞倫和他子孫）在五祭中應得的份——皮（v8）、烤製素祭餅（v9）、生素祭均分（v10）、搖祭胸（v31）、舉祭腿（v32-34），並在v35-36確認這些是「摩西膏立亞倫及子孫」當日起永久供給。
  relation: 利1、2、5章確立祭司在各祭中的贖罪與代理職責，本章補上「祭司具體從各祭實得什麼份額」的完整清單，是祭司供給制度最集中的一章。
- title: 污穢
  path: link_folder/主題/污穢.md
  summary: v19「挨了污穢物的肉就不可吃，要用火焚燒」；v21「有人摸了什麼不潔淨的物，或是人的不潔淨，或是不潔淨的牲畜，或是不潔可憎之物，吃了獻與耶和華平安祭的肉，這人必從民中剪除」。CT：「『不潔淨的物』指器物或衣服的不潔淨，如碰觸到動物屍體；『人的不潔淨』指人碰觸到不潔淨之物」。
  relation: 利5:2-3規定誤犯者（摸不潔之物、摸別人的污穢）須獻贖愆祭補贖；本章21節則是「明知不潔仍吃祭肉」的故意情境，規定剪除刑罰，是同一污穢概念在不同祭別、不同故意程度下的延伸適用。
- title: 摸聖物成聖
  path: link_folder/神學/摸聖物成聖.md
  summary: v19-21規定祭肉沾污穢物不可吃須焚燒、不潔之人或摸了不潔之物後吃平安祭肉者必被剪除。CT：「吃平安祭的人必須潔淨，正如平安祭的肉必須潔淨一樣」。
  relation: 利6:18,27確立「潔淨的人／物觸聖物即成聖」的正面原則，本章19-21節提供其鏡像規定——「不潔的人／物觸聖物（吃祭肉）即玷污並招致剪除」，兩者互為聖潔傳染性原則的正反兩面。
- title: 永遠當祭司的職任
  path: link_folder/神學/永遠當祭司的職任.md
  summary: 利未記7:34「作他們從以色列人中所永得的分」；v35「這是從耶和華火祭中，作亞倫受膏的分和他子孫受膏的分」；v36「這是他們世世代代永得的分」。CT：「『永得的分』意指劃分出來指定給祭司做他們永遠該得的分。」
  relation: 出40 章確立「世世代代凡受膏的，就永遠當祭司的職任」的應許，本章 34-36 節把這應許落在具體的祭物分配上——搖祭的胸與舉祭的腿，是永久職任的物質形式。原文在這三節用了三個不同的字來說中文都譯作「分」的東西：v33「為分」是 מָנָה（H4490，一份）、v34「永得的分」是 חֹק（H2706H）接 עוֹלָם（H5769G）、v35「受膏的分」則是 מִשְׁחָה（H4888A，字面是「受膏」，STEP 本節逐字解作「the share of」）；v36 又換回 חֻקָּה（H2708）。GT《聖經精讀本》說明「分」的性質：「意為『指定』、『份』。指定給祭司的份額，只要祭司制度存在，這規定就會繼續。」
- title: 皮衣與血祭
  path: link_folder/神學/皮衣與血祭.md
  summary: v8「獻燔祭的祭司，無論為誰奉獻，要親自得他所獻那燔祭牲的皮」。GT丁良才：「神在伊甸園給亞當夏娃作衣服所用的皮子，大概是被獻之祭牲的皮子（創三21注），獻燔祭的祭司要得他所獻之祭牲的皮，或者是從此傳起的」；並指出「以色列人用牲畜的皮作褥子、鞋、和衣服等（創三21，來十一37）」。
  relation: 既有條目錨定創3:21神為亞當夏娃用皮子作衣服的恩典行動；本章8節祭司得燔祭牲之皮的規定，GT明確將其溯源至這一創世記傳統，是「必須有牲畜流血才能遮蓋」神學在利未記祭司實務中的延續呼應。
- title: 腰子
  path: link_folder/原文/腰子.md
  summary: v4「兩個腰子和腰子上的脂油，就是靠腰兩旁的脂油，並肝上的網子和腰子，一概取下」——屬贖愆祭條例（1-10節）。
  relation: 重複利3、4章已確立之脂油清單，將腰子及其脂油列入贖愆祭須焚燒獻神的部位，與平安祭（利3章）、贖罪祭（利4章）採用同一清單，是此部位第三次（利3、4、7章）出現於祭牲脂油清單。
- title: 肝上的網子
  path: link_folder/原文/肝上的網子.md
  summary: v4「並肝上的網子和腰子，一概取下」——屬贖愆祭條例。CT：「『肝上的網子』或作『肝葉』，乃指肝上的脂油，其狀似網」。
  relation: 確認肝上的網子在贖愆祭中同樣須取下焚燒，與平安祭、贖罪祭一致，是利未記中此部位第三次（利3、4、7章）出現於祭牲脂油清單。
- title: 肥尾巴
  path: link_folder/原文/肥尾巴.md
  summary: v3「又要將肥尾巴和蓋臟的脂油」——本節屬贖愆祭條例（1-10節），肥尾巴列在贖愆祭要焚燒的部位之中。
  relation: 利3:9 的肥尾巴只出現在綿羊平安祭，本章則顯示贖愆祭同樣要獻上肥尾巴。兩章合看，肥尾巴不是平安祭專有的部位，而是凡用綿羊為祭牲時都隨脂油一同上壇的部分。
- title: 贖價（基督作贖價）（來9：22）
  path: link_folder/互文/贖價（基督作贖價）（來9：22）.md
  summary: v2「其血，祭司要灑在壇的周圍」。CT：「按著律法，凡物差不多都是用血潔淨的；若不流血，罪就不得赦免了（來九22）」。
  relation: 本章2節祭司灑贖愆祭血於壇周圍，CT直接引來9:22申明血祭赦罪的新約原理，與既有條目（出29章承接聖職贖罪祭血）同一互文脈絡的延伸引用。
- title: 常以頌讚為祭（來13：15）
  path: link_folder/互文/常以頌讚為祭（來13：15）.md
  summary: 平安祭中的感謝祭須當日吃完，象徵新鮮的讚美，被新約希伯來書13:15引用為「常以頌讚為祭」的預表。
  relation: 本章感謝祭的條例（15節）為新約「頌讚為祭」提供舊約背景與預表意義。
- title: 近東泥版跋語格式
  path: link_folder/背景/近東泥版跋語格式.md
  summary: 第37-38節採用近東泥版跋語格式，總結第1-7章五種祭的條例，包含題目、作者、日期、內容綜述。
  relation: 本章結尾以古近東文獻慣用的跋語形式，為獻祭條例作正式收尾與認證。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 利未記7:8「獻燔祭的祭司，無論為誰奉獻，要親自得他所獻那燔祭牲的皮」；v37 的總結跋語把燔祭列在五祭之首：「這就是燔祭、素祭、贖罪祭、贖愆祭和平安祭的條例。」CT 說明皮的歸屬：「獻為燔祭的祭牲，除皮以外全被燒在壇上，這皮要歸與獻這祭的祭司。」
  relation: 利1 章確立燔祭全然焚燒歸神的條例，卻沒交代那張皮的下落——本章 v8 補上：除皮以外全燒，皮歸獻祭的祭司。這是利1「全燒」原則的唯一例外。GT 丁良才把這件事一路追到伊甸園：「神在伊甸園給亞當夏娃作衣服所用的皮子，大概是被獻之祭牲的皮子，獻燔祭的祭司要得他所獻之祭牲的皮，或者是從此傳起的」；他並指出以色列人確實用牲畜的皮作褥子、鞋與衣服。GT《舊約聖經背景註釋》另給了近東旁證：祭牲的皮歸祭司這個慣例，「從巴比倫至整個地中海地區，都找得著這習慣的例證」。原文的「皮」是 עוֹר（H5785，STEP 逐字解「the hide of」）。
- title: 祭司的分（靠祭物養生）
  path: link_folder/主題/祭司的分（靠祭物養生）.md
  summary: 利未記第七章把祭司在五祭中各拿哪一份逐項寫清楚：贖愆祭的肉歸辦這祭的祭司（v7）、燔祭牲的皮歸獻祭的祭司（v8）、爐烤煎盤鐵鏊做的素祭歸主祭的祭司、生的細麵眾祭司均分（v9-10）、平安祭配的舉祭餅歸灑血的祭司（v14）、搖祭的胸歸亞倫和他子孫、舉祭的右腿歸主祭的那位（v31-34）。
  relation: 利6 第一次把「祭司靠什麼生活」寫成制度，本章則把它列成一份可以逐條清點的清單，而且分出「獨得」與「均分」兩種規則。GT《聖經精讀本》點明制度理由：「祭物中規定祭司的份，因為祭司在以色列百姓中沒有分得基業，在聖所專心事奉神。」GT《舊約聖經背景註釋》另給近東旁證：祭牲的皮歸祭司這個慣例「從巴比倫至整個地中海地區，都找得著這習慣的例證」。BH 講的是同一件事——祭司沒有像其他支派那樣的地業，這些份額就是他們的生計（民18:20-24；林前9:13-14）。原文在本章用了三個不同的字來說「分」：מָנָה（H4490，v33）、חֹק（H2706H，v34）、מִשְׁחָה（H4888A，v35）。
- title: 平安祭的三類（感謝祭、還願祭、甘心祭）
  path: link_folder/主題/平安祭的三類（感謝祭、還願祭、甘心祭）.md
  summary: 利未記7:12「他若為感謝獻上」、v16「若所獻的是為還願，或是甘心獻的」——本章第一次把平安祭正式分成三類，並給各自不同的吃法期限：感謝祭當日吃完、一點不可留到早晨（v15），還願祭與甘心祭可以留到第二天，第三天則必須用火焚燒（v16-17）。
  relation: 利3 只規定怎麼獻，沒有分類；三分法是本章立的。丁良才把三類各自的場合說得很具體：為感謝的多半是病得痊癒、行路平安這類事，有時也為求恩而獻；為許願的是還願；甘心獻的則不因什麼特別緣故。GT《利未記雷氏研讀本》歸納出吃法的差別，GT《舊約聖經背景註釋》另補上感謝祭期限較嚴的可能理由：「感謝祭與其他平安祭不同，經常是在聖所以外的地方獻上的。所以有較嚴格規定的需要，必須在獻祭當天吃。理由可能是避免有沾染不潔的情形。」KC 從動機讀這個分別：感謝祭比較自發，還願祭與甘心祭則「經過考慮」，效力也比較持久。原文的三個名詞各自獨立：תּוֹדָה（H8426，感謝）、נֶדֶר（H5088，所許的願）、נְדָבָה（H5071，STEP 詞典義「voluntariness」）。
- title: 平安祭的聚餐（神人同席）
  path: link_folder/主題/平安祭的聚餐（神人同席）.md
  summary: 利未記7:15-21 規定這場聚餐的三件事：什麼時候吃（感謝祭當日、還願祭與甘心祭可到次日）、誰能吃（凡潔淨的人都可以吃，v19）、什麼情況不能吃（祭肉沾了污穢要燒掉；人身上不潔淨而吃的必從民中剪除，v20-21）。
  relation: 利3 立的是獻的規矩，本章立的是吃的規矩——而吃才是平安祭與其他四祭最大的分別。GT《串珠聖經註釋》指出時限還有一層社會作用：「17節的要求也可鼓勵獻祭者與親友，特別是貧窮的，分享美食。」丁良才給「一點不可留到早晨」列了三個理由：免得把這祭所預表的意思廢去、叫獻祭的人請朋友同吃或幫助窮人而不生吝嗇的心、免得效法外邦人存留祭肉避邪。CT 把這場聚餐的兩個目的並列：「第一，享受與神的和睦、交通；第二，尋求鄰舍之間的和睦、愛。」KC 則把它接到主的桌子——平安祭是相交之祭，同席的條件是潔淨。丁良才另補一個很日常的畫面：除了所搖的胸和所舉的腿以外，其餘的肉和剩下的餅都歸獻祭的人與兒女、僕婢、朋友同吃。
- title: 細麵
  path: link_folder/主題/細麵.md
  summary: 利未記7:12「並用油調勻細麵做的餅」——平安祭的感謝祭要配三種餅，其中一種正是用細麵調油做成的。
  relation: 利2、5、6 章的細麵都出現在素祭本身，本章的細麵則是配著平安祭一起獻上。丁良才點出一個容易被忽略的差別：獻素祭時，爐烤、煎盤、鐵鏊這三樣餅可以任選其一，「但在獻平安祭的時候，這三樣餅是都須獻的」。原文與利6:15、6:20 同字，都是 סֹלֶת（H5560，STEP 逐字解「fine flour」）。
- title: 會幕院子
  path: link_folder/主題/會幕院子.md
  summary: 利未記7:6「祭司中的男丁都可以吃這祭物；要在聖處吃，是至聖的」——本章講贖愆祭的祭肉要在「聖處」吃，而這個聖處指的就是會幕的院子。
  relation: 利6:16、26 兩次把「聖處」直接寫成「會幕的院子」，本章 v6 則只寫「聖處」；GT 丁良才因此在本節註明：「這聖處就是指著會幕的院子說的（六26）。」GT《舊約聖經背景註釋》補上一句實務描述：「聖幕院內設有供此用的地方。」兩章合看可以確定：利未記所說的「在聖處吃」，場地始終是同一個——會幕外院。
