book: 利未記
chapter: 5
updates:
- title: 賠償
  path: link_folder/原文/賠償.md
  summary: "利5:14-19 引入贖愆祭，它與贖罪祭最實質的分別就在賠償。CT 說得最短：「『贖愆祭』與『贖罪祭』的基本不同處，是犯罪的人有償還的機會。」做法是：按祭司的估價如數償還虧欠的，另加五分之一給祭司，再獻無殘疾的公綿羊（v15-16）。\n\n  **加的五分之一是什麼性質？** GT《串珠》分成兩面：「一方面是補償合法物主的損失，另一方面則作為犯罪者的刑罰。」BH 的說法相同，並補上它的作用——這筆額外的錢也是對再犯的一種嚇阻。丁良才則把它接到利27\
    \ 的贖回制度：人許願獻上的東西後來要贖回，同樣要在估價之外加五分之一，「這無非是叫人小心，不可冒失許願」。\n\n  **次序不可顛倒。** 丁良才寫得很明白：「人若在聖物上有差錯，或虧損了別人，就要先償還所虧損的，然後祭司才可以獻他所牽來的贖愆祭牲，為他贖罪。」"
  relation: 出22 的賠償處理的是人與人之間的財產（牛羊、田產、受託之物），賠幾倍看情節；本章處理的是人虧欠神的聖物，比例固定為五分之一。兩者合看，賠償在律法裡不是可有可無的補充——它是赦免的前置條件。這條線在利6:1-7 回到人與人（虧負鄰舍的同樣加五分之一），民5:7 再重申一次，太5:23-24 則把它放進獻祭的順序裡：先去和弟兄和好，然後來獻禮物。
- title: 紀念份
  path: link_folder/原文/紀念份.md
  summary: 利未記第5章12節規定，極貧窮者獻細麵為贖罪祭時，祭司要「取出自己的一把來作為紀念，按獻給耶和華火祭的條例燒在壇上」。CT 解釋這一把是為獻祭之用、完全焚燒成為馨香之氣獻給神，其餘細麵歸祭司享用（v13「剩下的麵都歸與祭司，和素祭一樣」）。GT 丁良才指出原文無「自己的」三字，所取出的一把燒在壇上作為紀念。此處的紀念份與素祭的紀念份（利2:2）功能相同——取一部分焚燒代表整體獻上，餘下歸祭司。
  relation: 本章將紀念份制度延伸至贖罪祭的細麵供物（v11-13），顯示即使無血祭物，只要與壇上火祭同焚，仍具贖罪效力。紀念份作為「代表整體獻上」的象徵，預表基督將自己完全獻上、蒙神紀念。
- title: 供物（qorban）
  path: link_folder/原文/供物（qorban）.md
  summary: 利未記第5章11節為極度貧窮者設立第三級供物：力量不夠獻兩隻斑鳩或雛鴿者，「就要因所犯的罪帶供物來，就是細麵伊法十分之一為贖罪祭；不可加上油，也不可加上乳香，因為是贖罪祭」。CT 指出伊法十分之一約2.2公升細麵，價值低於兩隻鳥，是神特別優待最貧窮人的辦法。KC 強調這非血祭卻能贖罪是特例，代表對基督工作認識極淺的人——只看見耶穌是完全人、未犯他犯的罪，卻未意識到必須流血受死才能赦罪。GT
    丁良才說明神特要體恤最貧窮的人，獻細麵為贖罪祭是特別優待。
  relation: 本章將供物（qorban）概念從素祭延伸至贖罪祭，顯示供物的核心不在物質價值、而在獻祭者誠實認罪的心。細麵供物不可加油和乳香，與素祭（利2:1）明確區分，強調贖罪祭的憂痛性質而非喜慶。
- title: 舍客勒
  path: link_folder/原文/舍客勒.md
  summary: 利未記第5章15節規定贖愆祭牲的估價標準為「聖所的舍客勒」：犯罪者須「照你所估的，按聖所的舍客勒拿銀子，將贖愆祭牲——就是羊群中一隻沒有殘疾的公綿羊——牽到耶和華面前為贖愆祭」。CT 解釋聖所的舍客勒是當時在聖所內使用的砝碼，作為收取奉獻物、贖罪銀時的度量標準，每一舍客勒約折合11.5公克。GT 丁良才引猶太傳統解釋一隻羊羔價值至少兩舍客勒，有注釋家以為贖愆祭的公綿羊至少須值二舍客勒銀子。KC
    則將舍客勒估價連結到基督十字架所付的代價：「用舍客勒銀子作的估價，說到主耶穌在十字架上所付的代價。」
  relation: 本章引入「聖所的舍客勒」作為贖愆祭估價的專用標準（v15, 18），與利27章的估價制度一致。舍客勒估價確保贖愆祭的公綿羊具備足夠價值，預表基督贖價的完全充足。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: "利未記第5章祭司角色貫穿全章：獻贖罪祭（v6, 8-10）、獻贖愆祭（v15-16, 18）、為犯罪者贖罪使其蒙赦免（v6, 10, 13, 16, 18）、估定贖愆祭牲價值（v15, 18）、取一把細麵作紀念份焚燒（v12）、吃剩餘的細麵（v13「剩下的麵都歸與祭司，和素祭一樣」）。CT 指出祭司是「代表人獻祭給神的聖職人物」，並在 v18 說明「你」與「祭司」的分工：「『你』指代表神的先知或官長；『祭司』指代表人獻祭給神的聖職人物。」BH\
    \ 同樣把祭司讀為神與人之間的中保。\n\n  **本章有一處看似矛盾的措辭，GT 專門處理過。** v15 說公綿羊「牽到耶和華面前為贖愆祭」，v18 卻說「給祭司作贖愆祭」。賈斯樂郝威《聖經難解經文詮釋手冊》的解答是：這段經文的意思是把公綿羊交給祭司、由祭司獻給耶和華——「在以色列，祭司是代表人向著神，而先知是神對人的代表」。丁良才用一個比方說同一件事：「人納稅給稅務處，也可說是給了國家。」"
  relation: 本章展示祭司在贖罪祭與贖愆祭中的多重職能——不僅獻祭，更擔任估價者（按聖所舍客勒定公綿羊價值）、紀念份焚燒者、餘物領受者。祭司作為神人之間的中保，預表基督是「永遠活著的大祭司，替我們代求」（來7:25）。
- title: 脂油
  path: link_folder/原文/脂油.md
  summary: 利未記第5章7-10節規定窮人獻兩隻鳥為贖罪祭時，一隻作贖罪祭、一隻作燔祭。KC 解釋此安排的原因：「贖罪祭對神而言是可憎的，脂油卻不是。但鳥身上沒有脂油。這就是為什麼第二隻鳥被定為燔祭。」鳥類脂油極少無法分離焚燒，故以第二隻全燒的燔祭代替脂油——脂油在贖罪祭中是獻給耶和華為馨香之氣的部分（利4:8-10, 31, 35），代表基督使神滿足的方面。GT 丁良才亦指出：獻公牛犢或山羊綿羊為贖罪祭時，壇上所燒的脂油表示獻祭者將自己獻給神（即燔祭所表之意），因鳥無脂油，故以一整隻鳥作燔祭替代。
  relation: 本章從反面（鳥無脂油故需另獻燔祭）印證脂油在贖罪祭中的關鍵地位——脂油是贖罪祭中「使神滿足、蒙神悅納」的部分，預表基督完全奉獻自己、使神心滿意足。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 利5:7、10 規定獻不起羊羔的人帶兩隻鳥，「一隻作贖罪祭，一隻作燔祭」；v10 說第二隻要「照例」獻為燔祭，CT 註明「照例」指利1:14-17 獻鳥為燔祭的條例。丁良才說明這隻燔祭的作用：獻牛羊為贖罪祭時，壇上所燒的脂油就表示獻祭的人把自己獻給神——那正是燔祭所表示的意思，但因鳥沒有多少脂油，所以拆成兩隻。KC 的說法相同：第二隻鳥的燔祭是「較大贖罪祭中脂油的替代」。
  relation: 利1 立下燔祭的條例（包括獻鳥的第三級），本章把它嵌進贖罪祭裡當作補位——鳥身上缺的那份脂油，用一整隻燔祭補上。這是燔祭在利未記第一次不是獨立獻上，而是作為另一種祭的組成部分出現。獻的次序也定了下來：CT 與丁良才都特別點出 v8 的「先」字——先獻贖罪祭，然後才獻燔祭。
- title: 誤犯
  path: link_folder/神學/誤犯.md
  summary: 利5:15、18 兩次用「誤犯」與「誤行」描述在聖物上的過犯；v17 則把範圍推到底：「他雖然不知道，還是有了罪。」CT 的原文字義給 v15 的「誤」為無心的過失、疏忽造成的罪。丁良才在 v17 特別處理「不知道能不能推辭」的問題，並回應了提前1:13 與民15:25 兩處看似相反的經文——他指出保羅那句不是要減輕自己的罪過，而是解釋自己為何還能蒙憐憫。
  relation: 利4 的「誤犯」是四段條例共同的前提，本章則把它具體化成可指認的情形：三件過犯（v1-4）與兩類干犯（v15、17）。本章也把「不知道」的效力講得最硬——利4 說一知道就要獻祭，本章 v17 直接說「他雖然不知道，還是有了罪」。CT 的話中之光下了同樣的結論：「世人所謂的『不知者無罪』不能適用於此。」
- title: 赦免
  path: link_folder/神學/赦免.md
  summary: 利5:10、13、16、18 四次以「他必蒙赦免」作結，四級供物（兩隻鳥、細麵、聖物贖愆祭、誤行贖愆祭）得到的是同一句應許。丁良才在 v13 指出舊約與新約在這件事上的分別：「在舊約的時代，人的罪蒙赦免是憑著所獻的贖罪祭，到新約的時代，罪得赦免是靠著基督的寶血；在舊約的時代是因祭司獻祭，現今是因出於信心的祈禱。」
  relation: 利4 的四次「必蒙赦免」按犯罪者的身分分級，本章的四次按獻祭者的財力分級——連只獻得起一把細麵的人，得到的也是同一句話。兩章合看，赦免的應許在利未記從不因人而異：變的是祭物，不變的是結果。
- title: 銅壇（燔祭壇）
  path: link_folder/主題/銅壇（燔祭壇）.md
  summary: 利5:9 規定獻鳥為贖罪祭時，血「彈在壇的旁邊，剩下的血要流在壇的腳那裡」；v12 則規定細麵的紀念份「按獻給耶和華火祭的條例燒在壇上」。丁良才解釋血為何不像牛羊那樣灑在壇的四周：「贖罪祭之鳥的血是不多的，因此難以灑在壇的周圍，只須彈在壇的旁邊。」
  relation: 利1 定下這座壇的方位分區，利4 讓四個階層的血都回到它，本章再往下一級——連最小的祭牲與最便宜的供物都在這裡處理。GT《啟導本》與《精讀本》都指出細麵之所以能贖罪，正是因為它要燒在這座燔祭壇上、與壇上的火祭同焚，因此仍在「若不流血罪就不得赦免」的原則之下。
- title: 火祭（isheh）
  path: link_folder/主題/火祭（isheh）.md
  summary: 利5:12 規定祭司要把細麵的紀念份「按獻給耶和華火祭的條例燒在壇上」。CT 說明「火祭的條例」指完全用火燒化、成為馨香之氣獻給神。GT《精讀本》在 v35 的對照裡把這裡的火祭理解為常獻在耶和華面前的燔祭。
  relation: 利1 給出火祭的定義（凡把全部或一部分供物燒在壇上的都稱火祭），利3 示範只燒一部分的情形，本章示範的是最小的一份——一把細麵。這也是火祭第一次用在完全不流血的供物上，而各家一致指出它之所以仍有贖罪的效力，是因為它與壇上的火祭同焚。
- title: 馨香之氣
  path: link_folder/神學/馨香之氣.md
  summary: 利5:12 的紀念份要「按獻給耶和華火祭的條例燒在壇上」，CT 解釋這是指完全用火燒化、成為馨香之氣獻給神。但本章有一處對照值得注意：v11 明令這供物「不可加上油，也不可加上乳香」——GT《利未記背景注釋》給的理由是「油和乳香與喜慶有關，這不是慶典，所以不當獻」；CT 的話中之光讀作「表明為罪刻苦憂痛，與獻祭榮耀神不同」；KC 說得最直接：這看起來像素祭，卻不是——「這是贖罪祭，對神並不是喜悅的」。
  relation: 利1-3 的馨香是燔祭、素祭、平安祭共有的結尾語，利2:12 已經指出攙了酵蜜的初熟供物不可獻為馨香。本章把這條界線畫得更清楚：同樣是細麵，加了油與乳香是素祭、是馨香的火祭；去掉油與乳香就是贖罪祭，為罪憂痛而非為榮耀神。CT 在利3 給的判準在這裡得到印證——為罪獻的祭沒有香氣可言。
- title: 無殘疾（tamim）
  path: link_folder/主題/無殘疾（tamim）.md
  summary: 利5:15、18 兩次要求贖愆祭的公綿羊必須「沒有殘疾」。CT 在 v15 註明這不是特例：「所有的祭牲都不可有殘疾。」
  relation: 本章的分級一路往下——母羊、兩隻鳥、細麵，能力不足的可以獻少一點；但到了贖愆祭這一段，祭牲不但不分級（只有公綿羊一種），還要按聖所的舍客勒估價，並且仍然必須無殘疾。兩相對照可見這項要求的位置：它不隨財力調整，也不隨祭別調整。
