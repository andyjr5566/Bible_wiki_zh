book: 利未記
chapter: 6
updates:
- title: 虧負鄰舍即干犯耶和華
  path: link_folder/神學/虧負鄰舍即干犯耶和華.md
  summary: 本章 1-7 節列出六項虧負鄰舍的行為（侵吞託付物、交易詭詐、搶奪、欺壓、拾遺不報、假誓），一律定性為「干犯耶和華」，處理程序是先如數歸還加五分之一交還本主，再獻無殘疾的公綿羊為贖愆祭。
  relation: 這是贖愆祭三類觸發情境中的第三類，把「得罪人即得罪神」寫成立法前提；原文以 מָעַל（背信）一詞把它與利5 聖物上的過犯歸為同類，並確立「先向人賠償、再向神獻祭」的次序。
- title: 壇火常燒不熄滅
  path: link_folder/主題/壇火常燒不熄滅.md
  summary: 規定壇上的火不可熄滅（v12、v13），祭司晚上把燔祭燒到天亮、早晨清灰添柴再擺上燔祭並燒平安祭牲的脂油（v9、v12），火由人維持而不得中斷。
  relation: 這是燔祭條例轉入祭司視角後的核心要求，也是本章其餘規定（清灰、換衣、聖俗分別）的起點——因為火不能斷，清灰與添柴才成為每日必辦的事。
- title: 聖衣（祭司聖服）
  path: link_folder/主題/聖衣（祭司聖服）.md
  summary: 利未記6:10-11 規定祭司收拾燔祭壇灰時「要穿上細麻布衣服，又要把細麻布褲子穿在身上」；把灰拿到營外之前則要「脫去這衣服，穿上別的衣服」。GT 丁良才列出這套供職聖衣共四件：細麻褲子、細麻袍子、細麻帶子、細麻裹頭巾。
  relation: 這是聖衣第一次出現在日常職事（而非受膏典禮）中的穿脫規定：在聖所內穿聖衣，出到營外運灰前必須換穿常服。丁良才給的理由值得注意——換衣不是為了怕弄髒，而是「免得因聖衣使人成聖」（結44:19），與本章 v18、v27「摸聖物成聖」是同一個顧慮。原文的「細麻」是 בַּד（H906），與「褲子」מִכְנָס（H4370）連用，STEP 逐字解作「undergarments of linen」。
- title: 褲子（細麻布褲子）
  path: link_folder/主題/褲子（細麻布褲子）.md
  summary: 利未記6:10「祭司要穿上細麻布衣服，又要把細麻布褲子穿在身上」，重申出28:42細麻布褲子的規定，於清理壇灰的日常職事中再次出現。
  relation: 與出28章的規定一致，確認細麻布褲子是祭司供職（不限受膏大典）時的常設要求，非僅限於承接聖職七日。
- title: 摸聖物成聖
  path: link_folder/神學/摸聖物成聖.md
  summary: 本章兩次宣告聖潔的傳遞——素祭「摸這些祭物的，都要成為聖」（v18），贖罪祭「凡摸這祭肉的要成為聖」（v27）；原文兩處都用 Qal 未完成式 יִקְדָּשׁ，兼容敘述與命令兩種讀法，丁良才因此並列兩解並傾向命令式。
  relation: 這條原則是本章器物條例的立法理由：正因為聖潔會傳過去，沾血的衣服才要在聖處洗、瓦器才要打碎、銅器才要擦磨涮淨。
- title: 瓦器打碎銅器擦淨
  path: link_folder/主題/瓦器打碎銅器擦淨.md
  summary: 規定煮贖罪祭肉的瓦器必須打碎，銅器則擦磨並在水中涮淨（v28）；理由是陶器多孔會吸收肉汁無法潔淨，銅器不吸收因而可以清洗再用。
  relation: 這是「摸聖物成聖」原則落到器物上的具體處置，與 v27 血濺衣服須在聖處洗淨並列，構成贖罪祭條例對「接觸過聖物的載體」的完整交代。
- title: 大祭司受膏日常獻的素祭
  path: link_folder/主題/大祭司受膏日常獻的素祭.md
  summary: 規定大祭司自受膏之日起獻細麵伊法十分之一為常獻的素祭，早晚各半，在鐵鏊上用油調勻烤成塊子（v20-21），並且要全燒給耶和華、一點不可吃（v22-23）。
  relation: 這是素祭條例的第二部分，與 v14-18 的一般素祭形成對照——同一種祭，因獻的人是祭司自己，處置就從「祭司可吃」翻轉成「全燒不留」。
- title: 贖愆祭（asham）
  path: link_folder/原文/贖愆祭（asham）.md
  summary: 利未記6:1-7為贖愆祭增添第三類觸發情境——虧負鄰舍（侵吞託付物、交易詭詐、搶奪、欺壓、拾遺不報、假誓），須先如數歸還並加五分之一，再牽無殘疾公綿羊獻為贖愆祭，祭司贖罪後蒙赦免。
  relation: 補齊利5章「聖物誤犯」「不可行之事誤犯」之外的第三種贖愆祭觸發類別，確立「先向人賠償、再向神獻祭」的雙軌處理程序。
- title: 公綿羊
  path: link_folder/主題/公綿羊.md
  summary: 利未記6:6 再次確認公綿羊為贖愆祭的指定祭牲，須「沒有殘疾」，並照所估定的價牽到耶和華面前交給祭司。
  relation: 與利5:15、18 的規定一致，本章補上一個新的前置條件——公綿羊獻上之前，必須先完成「如數歸還、另加五分之一」的賠償。原文作 אַיִל תָּמִים（H352A 公綿羊＋H8549G 無殘疾），是兩個各自獨立的字：אַיִל 指公綿羊，תָּמִים 是形容詞，STEP 逐字解「unblemished」。
- title: 賠償
  path: link_folder/原文/賠償.md
  summary: 利未記6:4-5 規定虧負鄰舍者「就要歸還他所搶奪的……就要如數歸還，另外加上五分之一，在查出他有罪的日子要交還本主」，賠償須在獻贖愆祭之前完成。
  relation: 本章是賠償原則在利未記中的核心應用：不僅足額歸還，還要加罰五分之一，並明訂交還對象是「本主」，先人後神的次序清楚可見。原文用字很具體——v4「歸還」是 שׁוּב 的 Hiphil（H7725H，STEP 逐字解「he will restore」，使之歸回）；v5「如數」是 בְּרֹאשׁוֹ（רֹאשׁ H7218J，本節逐字解「in sum its」，按其總數），「五分之一」是 חֲמִשִׁתָיו（H2549）。CT 由此把贖愆祭讀成兩面的動作：「一面在神面前要『挽』，一面在人面前要『還』。」
- title: 供物（qorban）
  path: link_folder/原文/供物（qorban）.md
  summary: 利未記6:20「他和他子孫所要獻給耶和華的供物，就是細麵伊法十分之一」，指大祭司受膏日起每日獻上的素祭。
  relation: 延續利1-5章「供物」作為五祭通用詞的用法，本章將此詞用於大祭司自身的常獻素祭，顯示供物一詞也涵蓋祭司自己的獻祭義務，不限獻祭者向神所獻。
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: 利未記6:9-13規定燔祭的祭司條例：燔祭整夜留在壇上直到天亮，壇上的火要常常燒著、不可熄滅，祭司每日早晨添柴並將燔祭擺在壇上。
  relation: 承接利1章燔祭獻祭規則，本章補上「祭司如何維持燔祭運作」的操作細節——晝夜不熄的壇火、灰燼處理、聖俗衣物分別，是燔祭條例從獻祭者視角轉向祭司視角的具體示範。
- title: 每日獻祭（常獻燔祭）
  path: link_folder/神學/每日獻祭（常獻燔祭）.md
  summary: 利未記6:9「燔祭要放在壇的柴上，從晚上到天亮」、6:12「祭司要每日早晨在上面燒柴，並要把燔祭擺在壇上」——這是常獻燔祭在利未記中的操作補述，補上「誰、如何」維持壇火晝夜不滅。
  relation: 與出29:38-42 的「獻什麼、何時獻」互為表裡。值得注意的是，本章的「常獻」一詞（תָּמִיד，H8548，STEP 詞典義「continually」）在原文只出現兩次，而且都不是修飾燔祭：一次在 v13 修飾壇上的火，一次在 v20 修飾大祭司的素祭。GT《舊約聖經背景註釋》在出29 稱那兩隻羊羔為「塔米德〔tamid〕，即『常獻』的祭」，本章則把同一個字用在維持這套常獻節律的火與素祭上。
- title: 銅壇（燔祭壇）
  path: link_folder/主題/銅壇（燔祭壇）.md
  summary: 利未記6:9-13「壇」貫穿全段——燔祭放在壇的柴上、壇上的火常燒不滅、灰倒在壇的旁邊；6:25「宰燔祭牲的地方宰贖罪祭牲」同指此壇。
  relation: 本章壇的角色從利1-5章「獻祭發生地點」擴展為「祭司晝夜維護的聖所核心設施」，灰燼處理、添柴等日常操作都圍繞此壇展開。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: 利未記6:9,14,16,18,20,25多次稱「亞倫和他的子孫」／「亞倫子孫」為燔祭、素祭、贖罪祭條例的執行者與領受祭司分者，18節更明訂「亞倫子孫中的男丁都要吃這一分，直到萬代」。
  relation: 本章確立亞倫子孫作為祭司體系日常運作的主體，不僅執行獻祭儀式，更是至聖供物的合法領受者，其男性後裔世代承接此職分與供應。
- title: 脂油
  path: link_folder/原文/脂油.md
  summary: 利未記6:12「並要把燔祭擺在壇上，在其上燒平安祭牲的脂油」，指出祭司每日早晨添柴時，也一併焚燒前一日平安祭所留的脂油。
  relation: 本章顯示脂油的焚燒與燔祭的晝夜燃燒程序整合為同一套祭司日常職責，不是獨立於燔祭之外的動作。
- title: 素祭（minchah）
  path: link_folder/原文/素祭（minchah）.md
  summary: 利未記6:14-23 為素祭訂立祭司條例：一般素祭（v14-18）由祭司取一把細麵、油與所有乳香燒在壇上作紀念，餘分在聖處不帶酵吃；大祭司自受膏日起常獻的素祭（v19-23）則全燒不可吃。
  relation: 這是利2 素祭規則之後補上的「祭司怎麼處理」，並新增大祭司自獻素祭全燒不留的特例，形成同一種祭兩種相反結局的對照。原文另有一處中文看不出的分別：v16「不帶酵而吃」用的是名詞 מַצּוֹת（H4682，無酵餅，複數），v17「烤的時候不可攙酵」用的才是 חָמֵץ（H2557A，酵）——兩節分別從正面（要吃無酵餅）與反面（不可攙酵）說同一件事。
- title: 紀念份
  path: link_folder/原文/紀念份.md
  summary: 利未記6:15「祭司要從其中，就是從素祭的細麵中，取出自己的一把，又要取些油和素祭上所有的乳香，燒在壇上，奉給耶和華為馨香素祭的紀念」。
  relation: 與利2章的規定一致，本章重申紀念份是素祭中唯一焚燒歸神的部分，其餘歸祭司在聖處食用。
- title: 馨香之氣
  path: link_folder/神學/馨香之氣.md
  summary: 利未記6:15「奉給耶和華為馨香素祭的紀念」、6:21「獻給耶和華為馨香的素祭」，兩次以馨香形容素祭焚燒紀念份與大祭司常獻素祭的蒙悅納。
  relation: 本章將馨香之氣的用法從利1-5章的燔祭、平安祭等延伸到素祭的兩種形式（一般與大祭司常獻），確認馨香是五祭焚燒部分的共同蒙悅納記號。
- title: 至聖的供物（聖與至聖之分）
  path: link_folder/主題/至聖的供物（聖與至聖之分）.md
  summary: 本章三次確認至聖等級：v17「是至聖的，和贖罪祭並贖愆祭一樣」、v25「這是至聖的」、v29「這是至聖的」——素祭、贖罪祭、贖愆祭同屬一級，只限祭司在會幕的院子裡吃。
  relation: 原文提供了一個中文看不見的分辨：v17、v25、v29 的「至聖的」都是 קֹדֶשׁ קָדָשִׁים（同字疊用，兩詞皆 H6944G，字面「聖中之聖」）；但 v30「在聖所贖罪」的「聖所」，STEP 標的是 H6944J——同樣的子音，STEP 以不同的 Extended Strong 區分出它在這裡是聖所這個地方的專稱，而非抽象的「聖」。本章因此同時出現了「至聖的等級」與「聖所這個空間」兩種用法。
- title: 永遠的定例
  path: link_folder/神學/永遠的定例.md
  summary: 本章兩處和合本譯法不同，原文卻是同一個詞組：v18「直到萬代，作他們永得的分」與 v22「這是永遠的定例」，原文都作 חָק־עוֹלָם（חֹק H2706G，STEP 本節逐字解「a prescribed portion of」＋עוֹלָם H5769G「perpetuity」）。前者定的是亞倫子孫世世代代可吃素祭餘分，後者定的是大祭司自獻的素祭必須全燒。
  relation: 與利3:17 的「永遠的定例」用字並不相同——利3 用的是陰性的 חֻקָּה（H2708，STEP 逐字解「a statute of」），本章兩處用的是陽性的 חֹק。也就是說，中文同樣譯作「定例」的地方，原文至少有兩種寫法；而本章更進一步，把同一個詞組譯成「永得的分」與「永遠的定例」兩種說法，只讀中文很難看出 v18 與 v22 其實是同一句話。CT 列出這個詞在利未記的十三處出處，其中就包括本章 v22。
- title: 受膏的祭司
  path: link_folder/人物/受膏的祭司.md
  summary: 利未記6:20「當亞倫受膏的日子」、6:22「亞倫的子孫中，接續他為受膏的祭司，要把這素祭獻上」，規定受膏的大祭司（及其世代繼任者）須自受膏之日起每日獻上素祭，全燒不可吃。
  relation: 本章補充利4章受膏祭司的贖罪祭條例之外，受膏祭司自身須終身每日獻素祭的義務，顯示其職分伴隨的持續性責任，而非僅限於就職當日的儀式。
- title: 伊法
  path: link_folder/原文/伊法.md
  summary: 利未記6:20「就是細麵伊法十分之一，為常獻的素祭：早晨一半，晚上一半」，指大祭司常獻素祭所用細麵的計量單位。
  relation: 本章三份來源給的換算不完全一致，可以並看：CT 說伊法十分之一約 2.2 公升；GT《啟導本》說約 2.3 公升；GT《舊約聖經背景註釋》則換成廚房裡的說法——「兩個祭的用量約是五杯麵粉。每次調製一個直徑八至十吋的扁麵包。」丁良才另引文理譯本作「必以粉六升」。原文為 עֲשִׂירִת הָאֵפָה（H6224 十分之一＋H374 伊法）。
- title: 贖罪祭
  path: link_folder/神學/贖罪祭.md
  summary: 利未記6:24-30 是贖罪祭的祭司條例：在宰燔祭牲的地方宰贖罪祭牲、屬至聖；辦這祭的祭司要在聖處吃祭肉；但 v30 劃出例外——血若帶進會幕在聖所贖罪（即大祭司、全會眾、大贖罪日三種情形），那肉都不可吃，必用火焚燒。
  relation: 承接利4章的獻祭規則，補上祭肉的去向，並把「可吃／不可吃」的界線畫在血有沒有進聖所。原文有一個容易錯過的細節：v26「為贖罪獻這祭的祭司」是 הַכֹּהֵן הַמְחַטֵּא，其中的動詞出自 חָטָא（H2398，詞典義「to sin」），這裡是 Piel 分詞，STEP 逐字解作「who makes a sin offering」——同一個詞根，換一個語態，指向的動作方向剛好相反。
- title: 血
  path: link_folder/主題/血.md
  summary: 利未記6:27「這祭牲的血若彈在什麼衣服上，所彈的那一件要在聖處洗淨」；6:30「若將血帶進會幕在聖所贖罪，那肉都不可吃」。
  relation: 本章把血的規範從祭壇延伸到衣物與空間：沾到的衣服要在聖處洗，血有沒有進聖所則決定祭肉能不能吃。v27 的「彈」原文是 נָזָה（H5137A，STEP 詞典義「to sprinkle」，本節逐字解「he will spatter」），與利4:6、4:17 大祭司對著幔子彈血七次用的是同一個動詞；GT 丁良才在本節把它讀成無意的濺灑——「這『彈』字的原文和王下九33、賽六十三3 節的『濺』字同，不是有意彈的，乃是無意濺的」。同一個字在利未記裡既用於刻意的儀式，也用於意外的沾染。
- title: 潔淨之地
  path: link_folder/地點/潔淨之地.md
  summary: 利未記6:11「把灰拿到營外潔淨之處」，指燔祭灰燼最終傾倒之處，與利4:12「營外潔淨之地、倒灰之所」同一地點。
  relation: 本章確認此地點不僅是利4章贖罪祭牲餘體的焚燒處，也是燔祭壇日常清灰的固定去處，是祭司每日職事的例行終點站。
- title: 全會眾
  path: link_folder/人物/全會眾.md
  summary: 利未記6:30「凡贖罪祭，若將血帶進會幕在聖所贖罪，那肉都不可吃，必用火焚燒」，此規定適用的三種情形之一即利4:13-21全會眾的贖罪祭。
  relation: 本章從祭司操作角度總結利4章全會眾贖罪祭「血帶入會幕」的後果——祭肉不可食用，須全數焚燒，呼應並補足利4章當時未直接說明的祭肉去向規則。
- title: 會幕院子
  path: link_folder/主題/會幕院子.md
  summary: 利未記6:16「要在會幕的院子裡吃」、6:26「要在聖處，就是在會幕的院子裡吃」——本章兩次把「聖處」直接等同於會幕的院子，這是院子第一次以「祭司吃祭物的地點」身分出現。
  relation: 出27、38-40 給的是院子的規格與建造，本章給的是它的日常用途。GT 丁良才說明它為何稱聖：「就是會幕院內有燔祭壇和洗濯盆的地方……這院子稱聖，是因為會幕是神的住處。」GT《舊約聖經背景註釋》補上考古上的參照：「在亞拉得發現的以色列廟宇，其院子分為兩個部分，接近聖所的部分較為隱蔽。以西結形容與聖殿相連，有些小室供祭司吃他們的分」，因此本節的「院子」始終是個隱蔽的地點。KC 則指出院中立著燔祭的銅壇，是主的桌子的圖像。原文作 בַּחֲצַר אֹהֶל־מוֹעֵד（חָצֵר H2691A，STEP 逐字解「court」）。
- title: 細麵
  path: link_folder/主題/細麵.md
  summary: 利未記6:15「就是從素祭的細麵中取出自己的一把」、6:20「細麵伊法十分之一，為常獻的素祭」——細麵在本章同時出現在一般素祭與大祭司自獻的素祭裡。
  relation: 利2、利5 的細麵是獻祭者帶來的供物，本章的細麵則進入祭司這一端：一把燒作紀念、餘下歸祭司在聖處吃，而大祭司自己那一份卻要全燒。CT 說明它怎麼做出來：「『細麵』是將麥子去皮、軋碎、磨末而成的」；BH 指出細麵是精製、不含雜質的產品，代表出產中最好的部分。GT《舊約聖經背景註釋》給了很具體的份量感：伊法十分之一「約是五杯麵粉。每次調製一個直徑八至十吋的扁麵包」。原文兩處都作 סֹלֶת（H5560，STEP 逐字解「fine flour」）。
- title: 素祭不可有酵與蜜
  path: link_folder/主題/素祭不可有酵與蜜.md
  summary: 利未記6:16「必在聖處不帶酵而吃」、6:17「烤的時候不可攙酵」——同一條禁令在本章分別落在「吃」與「烤」兩個動作上。
  relation: 利2:11-12 立的是「不可獻」的規矩，本章把它延伸到祭司這一端：連祭司自己吃的那一份、連烘烤的過程都不可有酵。CT 點出這個雙重性：「前句是不可帶酵而『吃』，本句是不可攙酵而『烤』」；GT 丁良才的推論相同——素祭既然不可有酵，祭司用素祭的細麵烤餅時自然也不可攙酵；GT《聖經精讀本》給的理由是「酵象徵罪的傳染性」。原文在這兩節用了兩個不同的字：v16 是名詞 מַצּוֹת（H4682，無酵餅，複數），v17 才是 חָמֵץ（H2557A，酵）——與利2 分辨 חָמֵץ（已發起的狀態）和 שְׂאֹר（老麵引子）合看，這個字群在利未記至少有三種寫法。
- title: 聖俗潔淨不潔淨的分別
  path: link_folder/神學/聖俗潔淨不潔淨的分別.md
  summary: 利未記6:10-11 祭司穿細麻聖衣收壇灰，但把灰拿到營外之前「隨後要脫去這衣服，穿上別的衣服」——一次換衣把聖與俗的界線畫在場合上。
  relation: 利10:10 把「將聖的、俗的，潔淨的、不潔淨的分別出來」定為祭司的核心職能，本章則是這條原則最早、也最日常的一次示範。GT《串珠聖經註釋》直接點名：祭司在會幕內穿祭服，將灰運往營外時應穿回平常衣服，「因為聖的俗的應該分別出來（參10:10）」。丁良才給的理由更具體：換衣是「免得因聖衣使人成聖」；GT《聖經精讀本》說得更白——祭司服是聖潔的，不能與他人接觸。BH 也把這個動作讀成聖與俗之間的分隔。值得注意的是，分別的依據不是衣服髒不髒，而是人走到哪裡：同一個人、同一天、同一件差事，跨出營就得換裝。
