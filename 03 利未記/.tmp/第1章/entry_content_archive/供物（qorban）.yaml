name: 供物（qorban）
type: 原文
secondary_types: []
aliases:
- 各耳板
status: formal
definition: '「供物」的原文是 qorban（GT《精讀本》音譯作「各耳板」），指一切獻給神、使人得以親近神的禮物、奉獻、祭物與犧牲。


  **這個字的字根意思是「靠近」。** 四份來源說法一致：

  - GT《啟導本》：原文為 qorban，意思是「攜近」聖壇的東西，包括一切獻給神的禮物；獻祭因此是人就近神的途徑。

  - GT《雷氏研讀本》：「『供物』是人藉以靠近神的東西（其字根意思是『靠近』）。」

  - GT《精讀本》：源於「拿到近處」、「奉獻」之意。

  - CT：「『獻供物(動詞)』原文的意思是就近，指就近祭壇。」


  CT 並把名詞和動詞分開：「『供物(名詞)』就是供給神的禮物」，而「獻」是動詞。**這兩個字在原文確實出自同一個字根**——名詞是 qorban（Strong 編號 H7133A），動詞「獻」「奉上」則是同字根的動詞形式（H7126H），本章用的是使役語態，字面就是「使之靠近」。所以 qorban 指的是「被帶到近處的那樣東西」，不是「靠近」這個動作本身。


  CT 由此讀出一層人與神的距離：「自從亞當犯罪以後，人不能直接就近神，只能就近祭壇。」他也指出，經文說「若有人獻供物」，表示獻祭是自願而非強迫，是個人而非群體的行為。


  **供物涵蓋哪些祭？** GT《雷氏研讀本》劃了一條界線：利未記第一至七章提到五種供物，但「第七章32節的舉祭和第二十三章13節的奠祭不算在內」。這五種祭由 GT《精讀本》與《串珠》列出：燔祭、素祭、平安祭、贖罪祭、贖愆祭。'
accumulations:
- book: 利未記
  chapter: 1
  summary: 1:2「若有人獻供物給耶和華」；1:3「他的供物若以牛為燔祭」；1:10「人的供物若以綿羊或山羊為燔祭」；1:14「人奉給耶和華的供物，若以鳥為燔祭」。「供物」一詞貫穿全章，涵蓋牛、羊、鳥三級祭牲，是本章及利未記獻祭條例的核心原文詞彙。
  relation: 供物（qorban）界定了利未記五祭的共同本質——凡獻給神、使人得以親近祂的，皆稱供物；本章燔祭是「供物」底下的第一種具體祭別，此原文詞奠定後續素祭、平安祭、贖罪祭、贖愆祭的用詞基礎。
