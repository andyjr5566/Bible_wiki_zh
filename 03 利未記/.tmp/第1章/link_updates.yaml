updates:
- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: "利1章是燔祭條例的正式立法，分三級祭牲（牛v3-9、羊v10-13、鳥v14-17），每級都走同一套程序：按手、宰殺、灑血、剝皮切塊（鳥則撕開）、水洗臟腑與腿、全燒在壇上、獻與耶和華為馨香的火祭。\n\n  「燔」字的本義是「上升」。GT《串珠》說它「本指『上升之物』，它的特點就是整只祭牲都要燒在壇上作為馨香之祭上升給神」，《雷氏研讀本》也直譯作「上升」——祭牲燒成煙往上走，就是這個祭的名字由來。（原文 עֹלָה，STEP 編號 H5930A，全章十處同字。）\n\n  「宰」這個字在原文很具體，就是割喉。KC 因此強調：這動作要緊的不只是牲畜死了，而是**血必須流出來**。（原文 שָׁחַט，H7819A，STEP 的逐字解釋作「割斷牠的喉」。）\n\n  丁良才點出燔祭在以色列諸祭中的地位：它「是以色列人所獻之最要緊的祭，銅祭壇因這祭又稱為燔祭壇」。"
  relation: "利未記首次把燔祭列為五祭之首、正式制度化。創8、創22、出20、出29的燔祭是零星先例，本章才是完整的操作規範，確立獻祭者與祭司的分工，並為後續各祭定下程序範式。\n\n  **但本章不是獻祭的起點，而是既有做法的整編。** 丁良才說「這不是神初次把獻祭的條例指示人」——從始祖犯罪起就有贖罪祭（創三21）、燔祭（創八20-21）、素祭（創四3）與平安祭，「神此時不過是把這些獻祭的條例重新修正罷了」。《啟導本》說得更概括：亞伯、該隱、挪亞、亞伯拉罕、以撒、雅各「都知道應向神獻供物；現在的條例只是歷代沿用的崇拜方式的擴充和確立」。\n\n  **祭牲為何只限牛、羊、鳥？** KC 給了一個別家沒有的判準：這三類同時是「潔淨的」和「馴服的」。他舉反例——「鹿是潔淨的動物，也可以吃，卻不適合作祭物，因為牠不馴服，必須去獵捕」；而主耶穌「不需要被獵捕，祂是自願前來服事人的」。\n\n  **壇上的火是不是從不熄滅？兩家講法相反：**\n  - BH：依利6:13，這火「要常常燒著」，象徵神永在的同在與持續的贖罪需要。\n  - GT《啟導本》：本章v7說每獻一次要重新點火，「應是以色列人在曠野漂泊，會幕隨時遷移的結果」；要等到加低斯等地停留較久，「才有壇上的火永不熄滅的規例（六12～13）」。\n\n  **火和柴各代表什麼，兩家的角度不同：**\n  - 丁良才：聖經裡的火有三層意思——表示神並祂所喜悅的、表示神的威嚴、表示神熬煉的工作。他另記下柴的規矩：柴「以潔淨為美，是百姓特為會幕中獻祭預備的」（尼十34，十三31），朽爛、蟲蛀或從房子上拆下的木頭都不能用。\n  - CT 靈訓：火和柴是兩個方向的熬煉——「表徵耶穌受到從神(火放在壇上)和從人(柴擺在火上)來的熬煉」。\n\n  **祭牲各部位對應什麼，三家的清單重疊卻不相同：**\n\n  | 部位 | CT 靈訓 | GT 丁良才 | KC |\n  |---|---|---|---|\n  | 頭 | 智慧 | 靈明和思想 | 主耶穌的思想 |\n  | 脂油 | 上好的部位，就是靈 | 精神和佳美 | 成就工作的能力 |\n  | 臟腑 | 魂的各部 | 意念和愛情 | 裡面的情感（多次記載祂「動了慈心」） |\n  | 腿 | 行動 | 行為和榜樣 | 祂的行走 |\n\n  兩個容易被略過的操作細節，丁良才都記了：擺肉塊是「在撒鹽以後」（參利二13）；擺放時「須按祭牲各塊原來的部位」——GT《精讀本》引猶太拉比的說法相同：「祭物的各個部分要按活的樣子擺放。」\n\n  丁良才為全章下的結語，是把燔祭和贖罪祭分工說清楚：「贖罪祭預表耶穌贖人的罪過，燔祭預表耶穌補人的不及。」人單單不作惡是不夠的，還要盡力行善才算盡本分；而我們做不到的那部分，須基督補足。"
- title: 按手
  path: link_folder/原文/按手.md
  summary: "1:4「他要按手在燔祭牲的頭上，燔祭便蒙悅納，為他贖罪」——這是利未記全書首次說明按手怎麼做。CT：按手表示獻祭的人與所獻的祭牲合而為一，認同這祭牲就是自己。\n\n  **這個動作不是輕輕碰一下，而是用力壓上去。** 丁良才指出，同一個原文動詞在詩篇八十八7譯作「重壓」。STEP 的逐字解釋也是「他要倚壓上去」，詞典義是「倚靠、支撐」。（原文 סָמַךְ，H5564。）\n\n  丁良才進一步說，按手在聖經裡代表「歸給」，並舉三個例子：\n  - 摩西藉按手把責任歸給約書亞（民二十七18-20）\n  - 聽見人咒詛聖名的人藉按手卸責（利二十四14-15）\n  - 亞倫在大贖罪日藉按手把會眾的罪歸在羊頭上（利十六21-22）\n\n  BH 舉的平行例子則偏向授職：祭司受職（民8:10）、領袖承接（申34:9）。"
  relation: "出29章記的是亞倫按手在三隻祭牲上（贖罪祭、燔祭、承接聖職之祭）。利1:4補上另一半場景——**一般百姓獻燔祭時的按手**。丁良才說得很硬：「獻祭的人必須親自按手，別人不能替他行這事，正如各人得救必須自己靠主，別人不能替他相信。」\n\n  **按手到底在做什麼？本章四份來源分成三種講法：**\n  - **把罪轉到祭牲身上。** CT、丁良才、GT《精讀本》（「人的罪轉移到動物身上」）、BH（象徵「認同與轉移」）都持此說，是最主流的讀法。\n  - **不是轉移罪。** GT《舊約聖經背景註釋》明確反對：「其用意不是把罪轉歸給祭牲，因為非贖罪的祭也需要按手。」它認為較可能是獻祭者與祭牲認同、或當作替身、或宣告這祭牲屬他所有；聖經用例雖多含「轉歸或指認」的意思，「但是所轉歸或指認的是什麼卻不一定清楚，並且會隨環境而改變」。\n  - **價值反過來流向人。** KC 的方向相反：藉這動作獻祭者與祭牲認同，於是「燔祭一切的價值就彷彿轉到了他這獻祭的人身上，神在這祭裡看見他」。\n\n  另有一個本章限定的例外：三級祭牲中只有牛和羊要按手。丁良才解釋：「人獻鳥為祭的時候就不行按手的禮，這或者是因獻祭之人的鳥原是用手帶來奉上的，已經表示了按手的意思。」"
- title: 馨香之氣
  path: link_folder/神學/馨香之氣.md
  summary: "v9,13,17三次重複「獻與耶和華為馨香的火祭」，是本章三段燔祭條例固定的結尾語。\n\n  **「馨香」在原文是兩個字，不是一個。** CT 分開註解：「馨」是安靜、舒坦，「香」是氣味、香氣——合起來就是「令人安舒的氣味」。GT《精讀本》給的中文對應相同：「馨香的：『平安、安息』的意思，指祭物被神悅納、因罪而有的震怒止息、充滿安定平和的氣氛。」（原文 רֵיחַ 氣味 H7381＋נִיחֹחַ 安舒 H5207。）\n\n  **這裡的「燒」也不是一般的燒。** 丁良才指出，本章的「燒」字原文意思是「使之上升」，和營外焚燒（燒毀）用的字不同。STEP 的逐字解釋正是「使它冒煙」。GT《精讀本》音譯作「卡他日」，並說明「焚燒不是指完全焚毀，而是為了把香氣獻給神而精心的焚燒」。（原文 קָטַר，H6999A。）"
  relation: "創8:21挪亞獻燔祭後神「聞那馨香之氣」，是一次性的敘事事件。利1章則把「馨香的火祭」變成制度——成為燔祭蒙悅納的固定判準語，三級祭牲不論貧富都同稱馨香，顯明神看重的是獻祭者甘心的心，不是祭物大小。\n\n  **神是不是真的喜歡那股氣味？GT 內部四家分成兩邊：**\n  - **丁良才：是借喻，不是真的氣味。** 他給兩個證據：一是「被燒的肉和脂油本來沒有什麼香氣」；二是「在營外所燒之贖罪祭的氣味與馨香祭也是一樣的，卻不稱為馨香祭」。他讀出三層意思：獻祭的人甘心承認全體屬神、神悅納樂意獻祭之人的供物、神喜愛這祭所預表的主耶穌。\n  - **《啟導本》：同意是借喻。** 「不是說神喜歡聞到祭物燒出的氣味，象偶像那樣食人間煙火。」\n  - **《串珠》：擬人的說法**，「描寫神接納子民奉獻的滿足」。\n  - **《雷氏研讀本》：取字面。** 「即神喜歡祭物的香味，這香味叫祂喜悅。」\n\n  GT《舊約聖經背景註釋》換了個角度看這件事：神因某種形像或聲音而喜悅，與因氣味而喜悅並無分別；真正的差別在四圍列國——「他們的神明需要食物維生，香氣能夠勾起他們的食慾」。也就是說，關鍵不在有沒有擬人化的說法，而在以色列的神並不靠這氣味維生。"
- title: 銅壇（燔祭壇）
  path: link_folder/主題/銅壇（燔祭壇）.md
  summary: "本章首次記載銅壇在實際獻祭時的方位分工：北邊宰殺（v11）、東邊倒灰（v16），血灑「壇的周圍」（v5,11），肉塊擺在「壇上火的柴上」（v8,12）。GT《串珠》把四面一次列全：「上壇的方向是在壇的南面，殺牲的地方是在壇的北面，倒灰的地方是在壇的東面，壇的西面對著會幕。」\n\n  | 方位 | 用途 |\n  |---|---|\n  | 南面 | 上壇的斜坡 |\n  | 北面 | 宰殺祭牲（v11） |\n  | 東面 | 倒灰之處（v16） |\n  | 西面 | 對著會幕 |\n\n  **為什麼宰殺定在北邊？四家給了四種理由：**\n  - **丁良才：其他三面都被佔用了。** 東邊倒灰、西邊有洗濯盆、南邊是上壇的斜坡，只剩北邊。\n  - **GT《舊約聖經背景註釋》：那裡空間最大。** 「大概是那裡有最多空間可供此用。」\n  - **CT：只描述位置，不給理由。** 「意指進外院門口，面向燔祭壇，是在壇的右邊。」\n  - **BH：帶有象徵。** 北面是獻祭之處，或許象徵神的審判與拯救所來的方向（舉賽14:13為旁證）。\n\n  **倒灰為什麼在東邊？三種說法彼此不合：**\n  - **GT《舊約聖經背景註釋》：因為離聖所最遠**——這是早期猶太教拉比的解釋，該註釋並補一句保留：「但經文並無說明理由。」\n  - **CT：正好相反，是因為離門口最近。** 「就是祭壇的正前方，離外院門口最近的地方，大概方便清理。」\n  - **BH：象徵意義。** 會幕入口朝東，東邊是人親近神時所來的方向；把污穢丟在東邊，等於在走向神的時候把不潔拋在身後，而東方日出也連著更新與盼望。\n\n  兩個原文細節：「壇的北邊」的「邊」字，本義是「大腿」，用來指器物的側邊（יֶרֶךְ，H3409）。而「灰」這個字兼有「灰燼」和「肥美」兩義（דֶּשֶׁן，H1880），STEP 逐字解釋作「帶脂的灰」，CT 註為「灰燼，肥沃」正對應這個雙義；丁良才並由此連到詩二十3的「悅納」二字「按原文有燒成灰的意思」。"
  relation: 出27、出38記載的是銅壇的材質與尺寸（建造規格）；利未記1章補上這座壇在實際獻祭儀式中「怎麼用」——四面各有固定功能分區，銅壇作為十字架預表的意義，在本章的操作細節中具體落實為宰殺、灑血、放火、全燒的獻祭現場。
- title: 會幕門口
  path: link_folder/地點/會幕門口.md
  summary: "v3「就要在會幕門口獻一隻沒有殘疾的公牛」、v5「把血灑在會幕門口、壇的周圍」——會幕門口在本章是牽牲獻祭、灑血的地點。\n\n  **三家從不同角度解這個位置：**\n  - **CT：預表十字架。** 「『在會幕門口』有祭壇，是預表主的十字架。」要注意他說預表十字架的是門口那座壇，不是門口本身。\n  - **GT 丁良才：獻祭必須公開、甘心。** 神不准以色列人在別處獻祭（利十七4-9），所以「獻祭的人牽祭牲到會幕門口，是表示目己甘心樂意的獻這祭，也是在眾人面前承認神為主」。\n  - **BH：先贖罪才能進去。** 壇設在入口，表示人必須先經過贖罪，才能進到神面前。\n\n  原文這裡用的是「入口」一詞（פֶּתַח，H6607），v3 與 v5 兩次都是「會幕的入口」。"
  relation: 出29章的會幕門口是祭司承接聖職、洗身、吃聖肉之處；利1章補上會幕門口作為「一般百姓獻燔祭」的地點功能——不只是祭司職事的場所，也是全體百姓親近神、獻上供物的入口。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: "本章清楚劃分獻祭者與祭司的職責。v5,7,8,11「亞倫子孫作祭司的」／「祭司亞倫的子孫」負責奉血、灑血、放火、擺柴、擺放肉塊；v9,12,13,15,17泛稱「祭司」負責把祭物全燒在壇上。CT 在v5下說得最清楚：「本節明確指出宰殺祭牲是獻祭之人的工作，而奉上血和灑血則是祭司的工作。」\n\n  丁良才把這套分工數成兩張清單：\n\n  | 獻祭的人（六件事） | 祭司（七件事） |\n  |---|---|\n  | 到會幕門口獻供物 | 把血接在盆裡 |\n  | 按手在祭牲頭上 | 把血灑在壇的周圍 |\n  | 宰祭牲 | 整理壇上的火 |\n  | 剝去皮 | 把祭肉放在火上 |\n  | 切成塊子 | 把素祭燒在祭肉上 |\n  | 用水洗臟腑與腿 | 次日早晨把壇上的灰倒在壇的東邊 |\n  | | 脫去聖衣換裝，把灰拿到營外潔淨之處 |\n\n  值得注意的是，祭司清單的後三件本章都沒寫——要到民十五與利六才交代。**利1章只寫了祭司職責的前半。**\n\n  獻鳥時分工不同。CT 指出因為鳥的體型小，「故幾乎全程由祭司處理，獻祭的人僅擔任除掉內臟和羽毛的工作」。\n\n  原文另有一個小細節：v5 裡「亞倫的兒子」和「公牛」（原文作「牛群之子」）用的是同一個字「子」，STEP 用不同編號把兩者分開——指人的是 H1121A，指幼畜的是 H1121H。"
  relation: 出29章記亞倫和他兒子承接聖職、正式就任祭司的整個禮儀過程；利1章是他們就任後、在日常燔祭事奉中的具體職責展示——奉血灑血、司理壇火、擺放祭物、全燒馨香，是祭司中保職分的例行實踐。
- title: 血的尊重
  path: link_folder/神學/血的尊重.md
  summary: "v5,11,15記載燔祭中血的處理方式：公牛與羊的血「灑在壇的周圍」，鳥的血則「流在壇的旁邊」。\n\n  為什麼鳥血的做法不同？CT 給的是很實際的理由：「鳥的血很少，故直接流在壇旁，而不用盆盛血。」\n\n  血能贖罪的原因，CT 和 GT《串珠》都引利十七11作解。CT：「『奉上血』血中有生命，故能夠贖罪。」串珠：「『血』：代表生命，因而能夠贖罪。」\n\n  另外，「灑」這個動作在原文比中文看起來更用力——本義是「投、扔、擲」，CT 就是這樣註的，原文詞典也作「拋灑」（זָרַק，H2236）。"
  relation: "創9:4的重點是「生命在血中」，所以禁止吃帶血的肉。利1章則是同一個道理的另一面：**正因為生命在血中，血才能用來灑壇贖罪。** 禁食血是消極面，灑血贖罪是積極面，兩者出自同一個神學。\n\n  **不過，血洗淨的到底是什麼，三家的落點不同：**\n  - **CT：讓祭牲被接納。** 「把血潑在祭壇周圍，是為叫神接納燒在壇上的祭牲。」\n  - **BH：讓壇被潔淨。** 灑血象徵祭壇的潔淨與分別為聖，使它成為聖潔、可以承接祭物。\n  - **GT《舊約背景註釋》：洗掉會妨礙祈求的污穢。** 灑血象徵「用祭牲的死亡，洗淨對獻祭時所作祈求有不良影響的一切污穢」。\n\n  該註釋並指出，用血來潔淨這個觀念是以色列獨有的：「對以色列來說，血是在儀式上潔淨的途徑──然而古代近東的鄰邦並沒有類似的概念。」丁良才另記下一則猶太傳說：祭司把血灑在祭壇的東北和西南兩角，這樣壇的四面就都沾到血了。"
- title: 火祭（isheh）
  path: link_folder/主題/火祭（isheh）.md
  summary: 'v9,13,17三次以「獻與耶和華為馨香的火祭」作結，這是「火祭」一詞在利未記首次出現。


    **「火祭」不是某一種祭，而是一種獻法。** GT《精讀本》說得最直接：「火祭：用火焚燒祭物，不是祭的種類，是獻祭的方法。」CT 的定義相同：「『火祭』指經過火燒的一種獻祭；在任何的獻祭中，凡把全部或一部分供物燒在壇上的，都稱為火祭。」GT《串珠》也說，凡把一部分供物燒在壇上的都叫火祭。


    丁良才據此列出三種都稱為馨香火祭的祭：燔祭（利一9）、素祭（利二2）、平安祭（利三5）。


    **這個字還有另一層意思：食物。** 和合本譯作「火祭」，是把原文連到「火」；但原文詞典給的是「食物之祭」，BH 也譯作 a food offering，並解釋雖然這祭不由祭司或敬拜者食用，卻仍是獻給神的禮物與貢物。GT《串珠》在總論裡的說法正好呼應：五種祭中，燔祭、素祭、平安祭「都是獻與耶和華作為馨香火祭的食物」。（原文 אִשֶּׁה，H801。）'
  relation: '本條目原已累積利3（平安祭）、利7（贖愆祭與祭司的分）、利8（承接聖職），卻獨缺利1——而利1正是「火祭」在利未記首次出現之處。本次補上這一章，把這個詞的定義來源接回它最早的出處。


    利1 給的是這個詞的基本定義（凡燒在壇上的都稱火祭），利3、利7 則展示它如何延伸到只燒一部分的祭：平安祭只燒脂油、腰子、肝上網子，同樣稱為火祭。也就是說，利1 的「全燒」是火祭的一種，不是火祭的全部——這個區分要到後面幾章才顯出來。'
