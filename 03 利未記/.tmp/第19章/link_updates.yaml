book: 利未記
chapter: 19
updates:
- title: 當孝敬父母
  path: link_folder/神學/當孝敬父母.md
  summary: v3「你們各人都當孝敬父母，也要守我的安息日」，將第五誡與第四誡並列為本章「向著神的聖潔生活」段落的起點。CT：父母是子女的源頭，正如神是人的源頭，孝敬父母就是尊敬神。《雷氏研讀本》指出「孝敬」原文作「懼怕」，並注明「第30節的『敬』原文也相同」；GT 丁良才進一步說本節的「孝敬」與出20:12 的「孝敬」不是同一個字，反倒與申6:2、13 的「敬畏」相同。KC 另注意到原文先提母親、後提父親。
  relation: 本章將孝敬父母置於聖潔生活總綱之後的第一條具體誡命，與守安息日並列，顯示對神的敬畏首先落實於對父母的尊敬。
- title: 安息日
  path: link_folder/神學/安息日.md
  summary: v3「也要守我的安息日」與v30「你們要守我的安息日，敬我的聖所」，本章兩次重申守安息日的命令，分別置於「向著神」段落之首與「分別為聖」段落末段。
  relation: 本章守安息日的命令與孝敬父母（v3）、敬重聖所（v30）並列，強調安息日既是對神的責任，也是聖潔生活不可或缺的節奏。
- title: 不可為自己雕刻偶像
  path: link_folder/神學/不可為自己雕刻偶像.md
  summary: v4「你們不可偏向虛無的神，也不可為自己鑄造神像」，直接對應十誡第二誡。CT：偶像被稱為「虛無的神」，因為有神之名卻無神之實。
  relation: 本章重申第二誡作為「向著神的聖潔生活」的具體條例之一，與孝敬父母、守安息日並列於v3-4。
- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: v5-8 規定獻平安祭必須「獻得可蒙悅納」，祭肉只能在獻祭當天和第二天吃，留到第三天必須焚燒，否則為可憎惡的、不蒙悅納，吃的人必擔當罪孽、從民中剪除。這句「獻得可蒙悅納」各家讀法不同：CT 解為務必遵守平安祭的條例，GT 丁良才說「就是要按神所定的條例而獻」，《雷氏研讀本》則給另一個譯法——「更作：『要按自己的意願來獻』」。STEP 顯示原文帶第二人稱複數的「你們的」，兩種讀法都有字面上的立足點。
  relation: 本章強調平安祭的時效性，教導與神的交通必須保持新鮮；同時保留了「蒙悅納」一語的兩種譯法分歧。
- title: 不可偷盜
  path: link_folder/神學/不可偷盜.md
  summary: v11「你們不可偷盜，不可欺騙，也不可彼此說謊」，第八誡的重申，與欺騙、說謊並列於「向著人的聖潔生活」段落。
  relation: GT 丁良才在 v12 描出一條罪的連鎖，本章的不可偷盜正在其中：為己或吝嗇的心（v9-10）→ 貪圖別人的東西或欺騙人（v11 前半）→ 撒謊遮蓋（v11 後半）→ 起假誓（v12），「這樣，從一樣的罪往往生出許多的罪來」。
- title: 不可妄稱耶和華你神的名
  path: link_folder/神學/不可妄稱耶和華你神的名.md
  summary: v12「不可指著我的名起假誓，褻瀆你神的名」，第三誡的延伸應用。GT丁良才：本節不禁止起誓，只禁止起假誓；撒謊是罪，起假誓是更大的罪。
  relation: 本章將此誡列為v9-12罪的連鎖效應的終點：從貪心到偷竊欺騙，最終以起假誓遮蓋收場。
- title: 利19：18
  path: link_folder/互文/利19：18.md
  summary: 本章即此節的出處章節：v18「不可報仇，也不可埋怨你本國的子民，卻要愛人如己」。GT啟導本：「愛人如己」是舊約中最特出且高超的一條律法，主耶穌引此為人倫關係的總綱（太19:19；22:39；可12:31；路10:27）。
  relation: 本章補全此互文條目的舊約源頭脈絡，v18是「愛人如己」誡命在聖經中首次出現之處，後為主耶穌與保羅多次引用（太22:39；羅13:9；加5:14；雅2:8）。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1「耶和華對摩西說」，摩西是本章聖潔生活總綱與各項倫理條例的唯一傳達者（v2「你曉諭以色列全會眾說」）。
  relation: 本章延續摩西向以色列全會眾（而非僅祭司）傳達耶和華律例的角色，對象範圍是利未記中最廣的一次。
- title: 血的尊重
  path: link_folder/神學/血的尊重.md
  summary: v26「你們不可吃帶血的物」，本章把這條禁令置於法術觀兆等外邦風俗禁令之首。四份來源對它在禁什麼並不一致：CT 解為飲食與贖罪的規定（血中有生命，是為著贖罪之用，參申12:23）；BH 上承創9:4 與利17:10-14，強調血代表生命的神聖性；KC 認為從上下文看，帶血而吃像是一種外邦人的作法；GT《舊約聖經背景註釋》講得最直接——「這句話不是飲食律法」，它關乎的是把祭牲的血倒在地上或「聖坑」之中以吸引亡魂或冥府神祇、向他們求問未來的作法（參撒上28:7-19）。GT 丁良才也提到「有人以為本句在此處是指著關係古時行邪術或拜偶像的風俗說的（參結33:25）」。
  relation: 本章重申禁血條例，但與利17章的脈絡不同——這裡與行法術、觀兆並列，因此各家在「飲食律法」與「反交鬼律法」之間分歧。STEP 顯示原文的介系詞是「在……之上」，直譯為「不可在血上吃」，這正是後一種讀法的立足點。
- title: 剪除
  path: link_folder/原文/剪除.md
  summary: v8「凡吃的人必擔當他的罪孽；因為他褻瀆了耶和華的聖物，那人必從民中剪除」。CT：凡褻瀆聖物的，必被治死。GT 丁良才把本節與七20-21、25、27 及二十三29 並列為同一組剪除條例。BH 說明這個刑罰的分量：它常被理解為逐出會眾甚至死刑，因為群體的聖潔是共同的責任。STEP 顯示本節被剪除的主詞是「那人」，動詞為被動語態。
  relation: 本章的剪除不是因為道德罪或拜偶像，而是因為逾時吃平安祭的祭肉——把「褻瀆聖物」與利7、17、18、22 章的其他剪除案例並列，剪除的適用面在利未記內部又擴一格。
- title: 敬畏神
  path: link_folder/神學/敬畏神.md
  summary: v14「只要敬畏你的神」與 v32「又要敬畏你的神」，本章兩次把敬畏神當成對待弱者與長者的動機。CT：神對弱勢的人以憐憫為懷，對仗勢欺人者卻是公義可畏的；敬畏神是智慧的開端（箴9:10）。BH 說明這裡的敬畏不是恐懼，而是敬服與尊崇，並且直接影響人怎麼待人。STEP 顯示 v3「孝敬父母」、v30「敬我的聖所」、v32「敬畏你的神」用的是同一個動詞（H3372H）——《雷氏研讀本》所說「第30節的『敬』原文也相同」，在字形上可以核對。
  relation: 本章把敬畏神從敬拜場合搬進日常關係：沒有人看見的時候（咒罵聾子、絆倒瞎子）與沒有利害關係的時候（尊敬老人），敬畏神就是唯一的約束。
- title: 贖愆祭（asham）
  path: link_folder/原文/贖愆祭（asham）.md
  summary: v21-22；與尚未得自由的許配婢女行淫的人，要把一隻公綿羊牽到會幕門口作贖愆祭，祭司為他贖罪，他的罪就必蒙赦免。GT 丁良才：除了所受的處置以外，那人還要獻贖愆祭，因為他與那婢女行淫也是得罪神（參五14至六7）。GT《精讀本》：贖愆祭是作為對神或對人賠償獻上的祭物。BH 指出贖愆祭專用於須賠償的過犯，兼顧對神的冒犯與對人的損害。
  relation: 本章補上一個利5-6 章條例沒有列舉的具體案例：受害的一方是沒有法律自由的婢女，刑度因此與自由人不同（不治死），但對神的冒犯仍須以贖愆祭處理。
- title: 寄居的
  path: link_folder/原文/寄居的.md
  summary: v10「要留給窮人和寄居的」、v33-34「若有外人在你們國中和你同居，就不可欺負他……並要愛他如己，因為你們在埃及地也作過寄居的」。GT 丁良才指出這比出22:21、23:9 又進一步——從「不可欺負」推到「看他如本地人一樣」並「愛他如己」，並認為 v33-34 是指受過割禮進了猶太教的外人。BH 指出把外人納入這條供應，顯示神的看顧不以族裔為界。STEP 顯示 v34「愛他如己」與 v18「愛人如己」在原文是完全相同的說法。
  relation: 本章是「寄居的」在律法書中待遇最高的一處：不只受保護，而且是「愛人如己」這條誡命的對象。
- title: 古代近東法典
  path: link_folder/背景/古代近東法典.md
  summary: 本章是 GT《舊約聖經背景註釋》點名古代近東法典最密集的一章，共四處：v19 赫人法律禁止同一塊地種兩樣種子，違者處死；v20-22 吾珥南模的新蘇美法律與埃施嫩納的巴比倫法律（約主前2000年）都規定強姦婢女須付罰款，埃施嫩納並指出女子仍是原主的財產、強姦不能用作獲取奴隸的手段；v27 漢摩拉比法典對作假見證之人的刑罰是剃去他一半的頭髮，中亞述法典容許債奴的主人以拔髮為懲戒；v31 漢摩拉比法典和中亞述法律都禁止行邪術和在施法中使用藥物；v35-36 漢摩拉比法典規定還債買酒都要用標準的量和衡，違者輕則財物充公重則處死。
  relation: 與出20、21 章的對照不同：那裡比的是法律形式（定言式對判例式），本章比的是具體條目，顯示以色列的律法在題材上與鄰邦高度重疊，差別在立約的一方是神自己。
