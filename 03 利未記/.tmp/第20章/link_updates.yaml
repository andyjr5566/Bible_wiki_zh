  relation: 本章為利18:22的禁令補上具體死刑，完整呈現此罪從道德禁令到刑罰執行的體系。
- title: 不可與獸淫合逆性的事
  path: link_folder/主題/不可與獸淫合逆性的事.md
  summary: v15-16「人若與獸淫合，總要治死他，也要殺那獸。女人若與獸親近，與牠淫合...總要把他們治死」，與利18:23同一禁令，本章增補：人與獸皆治死。
  relation: 本章補上利18:23禁令的死刑執行，並增列連涉事的獸類也一併治死的細節。
- title: 不可與經期婦人親近
  path: link_folder/主題/不可與經期婦人親近.md
  summary: v18「婦人有月經，若與他同房，露了他的下體...二人必從民中剪除」，與利18:19同一禁令，本章增補剪除刑罰。GT丁良才：本節是論明知故犯的，利15:24是論無意犯了的。
  relation: 本章區分明知故犯（本章，剪除）與無意誤犯（利15:24，僅不潔七天）兩種情況的不同刑罰。
- title: 你們要聖潔因為我是聖潔的
  path: link_folder/神學/你們要聖潔因為我是聖潔的.md
  summary: v7-8,26 三度重現「你們要自潔成聖」「我是叫你們成聖的耶和華」「你們要歸我為聖，因為我耶和華是聖的」，與利19:2、11:44-45同一refrain。
  relation: 本章此refrain三度出現於首尾（v7-8開篇勸勉、v26結尾總結），框住全章的刑罰體系，顯明刑罰的根本目的是維持聖潔。
- title: 玷污自己也玷污地
  path: link_folder/神學/玷污自己也玷污地.md
  summary: v22「你們要謹守遵行我一切的律例典章，免得我領你們去住的那地把你們吐出」，與利18:24-28同一神學主題，本章重申此為22-26節的總勸勉。
  relation: 本章將此神學主題置於刑罰體系之後的總結勸勉，把個別死刑條例與「地吐出居民」的集體審判意象相連。
- title: 潔淨與不潔淨的早期區分
  path: link_folder/主題/潔淨與不潔淨的早期區分.md
  summary: v25「你們要把潔淨和不潔淨的禽獸分別出來；不可因我給你們分為不潔淨的禽獸...使自己成為可憎惡的」。GT串珠：明顯是指利11章關於飲食的律例，其主要目的乃是在以色列人和迦南人中間劃出清楚的分界線。
  relation: 本章將飲食潔淨條例（利11章）與分別為聖的呼召並列，作為「你們要聖潔」總綱在日常生活中的具體實踐之一。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1「耶和華對摩西說」，摩西是本章死刑刑罰體系的唯一傳達者。
  relation: 本章延續摩西向以色列人傳達耶和華律例典章之刑罰內容的一貫角色，緊接利18、19章的道德與倫理條例之後。
- title: 摩洛（Molech）身分之爭
  path: link_folder/解經爭議/摩洛（Molech）身分之爭.md
  summary: v2-5。GT 丁良才在本章給出最完整的身分鑑定：摩洛「這兩個字的原文是王的意思」，又名米勒公（王上11:5）或瑪勒堪（番1:5），西法瓦音人稱亞得米勒（王下17:31），是亞捫人所拜的神（王上11:7）；也有人以為摩洛是火神，與摩押人所拜的基抹相仿，因此基抹有時也稱為亞捫人的神（士11:24）；摩洛與腓尼基人的巴力也有些相仿，所以耶利米說以色列人在欣嫩子谷建築巴力的邱壇、好使兒女經火歸摩洛（耶32:35）。GT《串珠》指出「摩洛」常附有冠詞而成為總稱，泛指迦南的偶像，申12:31 暗示這種行動不限於對某一個神的崇拜。BH：迦太基的 Tophet 等考古發現為這類獻祭提供了實物證據。
  relation: 利18:21 只出現名字，本章才展開身分問題：本章同時給出「特定神明」與「迦南偶像總稱」兩種讀法，並第一次把它與米勒公、瑪勒堪、亞得米勒、基抹、巴力放在同一張比對表上。
- title: 不可使兒女經火歸摩洛
  path: link_folder/主題/不可使兒女經火歸摩洛.md
  summary: v2-5 是利18:21 同一禁令的刑罰條款：獻兒女者必被治死，本地人要用石頭把他打死。GT 丁良才記下崇拜的實況（猶太傳說：摩洛的像用鋼鑄成、人身牛首、腹中生火，將孩子投在偶像懷裡，「眾人嗚鑼、擊鼓、為要淹沒這孩子悲慘的哭聲」），並記下一個較緩和的說法——有注釋家以為起初只叫兒女經火作潔淨之禮，不是燒死，後來才有燒死孩子的惡俗。GT《精讀本》列出三種獻法：放在燃燒的胳膊上、殺死獻上、從兩條胳膊中間通過用火淨化。CT 從神的性情反駁：祂不是需要人祭安撫的假神，是賜生命的神，也是對孩童特別關懷的神。
  relation: 利18 只下禁令，本章補上刑罰、執行方式與知情連坐；崇拜實況的描述也集中在本章，是理解刑度為何如此重的關鍵。
- title: 石刑
  path: link_folder/背景/石刑.md
  summary: v2「本地人要用石頭把他打死」、v27「人必用石頭把他們打死」。GT《啟導本》：用石頭打死是以色列社會中最普通的死刑（申17:5），聖經記載受此刑的罪有褻瀆神（利24:16）、拜偶像（申13:6-10）、不守安息日（民15:32-36）與交鬼（v27）。GT 丁良才補上程序：處決時把犯人帶到營外，見證人先下手，然後眾民也下手（申17:7），「這樣，神叫眾民在除罪的事上有份，為要叫他們受警誡」。GT《舊約聖經背景註釋》：這是團體性的死刑，每個人都要參與為淨化禮。KC：每個成員都丟一塊石頭，等於全民一同執行耶和華的旨意。
  relation: 出21 講的是牛觸人時牛要被石頭打死；本章第一次把石刑用在人身上，並說明它為什麼必須由全體執行——除罪是群體的事，不是行刑者一個人的事。
- title: 剪除
  path: link_folder/原文/剪除.md
  summary: 本章五次用「剪除」：v3、v5（獻摩洛者及其隨從）、v6（偏向交鬼者）、v17（與姊妹）、v18（與經期婦人）。GT 丁良才在 v3 記下一個未定的問題：有人以為「把他從民中剪除」與第2節「用石頭把他打死」是同一件事，也有人以為即使沒有人作見證定他的罪，神還是不能容讓、仍要刑罰他。v17「他們必在本民的眼前被剪除」，丁良才說「既是說在本民的眼前，或者是有一種特別的罰法，為要作眾人鑒戒的」。STEP 顯示這兩種讀法在文法上分得開：v3、v5 的剪除是神的第一人稱使役形（我必剪除），v17 則是被動形（他們必被剪除）。
  relation: 本章是「剪除」在利未記出現最密集的一章，也是唯一一章讓「群體行刑」與「神親自剪除」在同一段裡並存——第2節百姓用石頭打死，第3節神說「我必剪除」。
- title: 玷污耶和華的聖所與帳幕
  path: link_folder/神學/玷污耶和華的聖所與帳幕.md
  summary: v3「因為他把兒女獻給摩洛，玷污我的聖所，褻瀆我的聖名」。GT 丁良才解釋這條因果：以色列人犯罪不只玷污自己，也污穢了在他們中間的會幕，因為他們一面把兒女獻給摩洛、一面又到會幕那裡敬拜神（耶7:9-10；結23:37-39）；到耶利米的時候更把偶像設立在聖殿中（耶32:34-35），瑪拿西王也曾使他的兒子經火並在聖殿院中為天上萬象築壇（王下21:4-6）。KC 說明機制：這不表示這些罪是在聖所裡犯的，而是因為聖所在百姓中間，每一件罪都與它相連。
  relation: 民19 講的是屍體不潔怎樣玷污帳幕；本章把玷污的來源換成拜偶像，並指出玷污不必發生在聖所之內——罪只要發生在百姓中間，就已經碰到那位住在他們中間的神。
- title: 流奶與蜜之地
  path: link_folder/神學/流奶與蜜之地.md
  summary: v24「但我對你們說過，你們要承受他們的地，就是我要賜給你們為業、流奶與蜜之地」。CT：奶代表動物的豐富，蜜代表植物的豐富，合起來形容迦南地物產豐富。GT《啟導本》從地理上說明：迦南和四周乾旱的曠野相比，水源充足、物產豐富，確為綠洲。GT 丁良才把應許的來歷接回族長時代：自從亞伯拉罕、以撒、雅各的時候，神就屢次說要逐出迦南人、將他們的地賜給以色列人為業（創15:18-21；出3:17；23:28、31）。
  relation: 本章把這句應許放在刑罰條例的正後方，並緊接「使你們與萬民有分別的」——得地與分別為聖在本章是同一句話的兩半，而 v22 已先警告：不謹守律例，那地會把他們吐出。
- title: 古代近東法典
  path: link_folder/背景/古代近東法典.md
  summary: GT《舊約聖經背景註釋》在本章兩處引古代近東法典作對照。v9 咒罵父母：蘇美法律准許將不認父母的兒子賣為奴隸，漢摩拉比法典規定切除毆打父親之兒子的手，烏加列文獻中一份遺囑用本節所用的動詞形容一個兒子的行為以剝奪其繼承權。v10-16 判死刑的性罪行：漢摩拉比法典第129、132條規定姦淫必須接受「神明裁判」，第130條定強姦為死罪，第154條定亂倫的懲罰為放逐；中亞述法律第20條對同性性行為的懲罰是宮刑；赫人法律第199條定與豬狗性交為死罪；舒皮盧柳瑪與胡卡納所簽署的赫人條約規定後者不得與姊妹或堂表姊妹發生性行為，因為赫人處死這樣做的人。該書並指出這些禁忌不具普世約束力——波斯時代反而鼓勵人與自己的姊妹、女兒、母親結婚，以表示虔誠。
  relation: 出20、21 的對照重點在法律形式，利19 比的是條目分佈；本章比的是刑度本身，而且第一次出現反向證據——波斯時代的近親婚俗顯示這些禁忌並非各地共有，本章的規定不能只用「當時大家都這樣」來解釋。
