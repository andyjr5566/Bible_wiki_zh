- name: 以色列刑罰的節制與程序保障
  type: 背景
  evidence: v9。GT丁良才在本節之後用整段回答「本章所定的刑罰似乎很重」這個質疑，並列出律法本身的節制：審判官必須公義（19:15）、不可受賄賂（出23:8；申16:19）、不可憑一個人的見證、總要有兩三個人作見證才可定案（申19:15）、作假見證的要反坐（申19:16-19）、無論男女貧富都要一樣看待、不可因子殺父也不可因父殺子（申24:16）、不准用刑訊、責打以四十下為限（申25:2-3）、處決時要趕快治死、不准用淩遲木籠或釘十字架等殘忍的刑罰。他給的理由是：神既召以色列人作祭司的國度（出19:5-6），他們犯罪的關係就更大，「正如守望的兵丁睡覺，按軍律是死罪，這刑罰雖然很重，卻是合宜的」
- name: 分別為聖
  type: 神學
  evidence: v24「我是耶和華你們的神，使你們與萬民有分別的」、v26「並叫你們與萬民有分別，使你們作我的民」、v25「你們要把潔淨和不潔淨的禽獸分別出來」。GT《串珠》指出勸勉的重點在於神已將他們分別出來，「分別」一詞在本段出現了三次（24、25、26）。CT：神主動以祂的大能將以色列民從萬民中分別出來，目的有二——分別為聖歸給神，並做萬民的榜樣使萬民也歸向神。GT《精讀本》：「使你們作我的民」字面意思為「要成為我的」，指特別分別出來的貴重寶石。STEP 顯示這三次用的是同一個動詞（H914），v24、v26 是神的第一人稱「我已把你們分別出來」，v25 則轉成對百姓的命令「你們要分別」
