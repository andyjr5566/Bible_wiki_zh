- name: 古代近東法典
  type: 背景
  evidence: 本章是 GT《舊約聖經背景註釋》引古代近東法典作對照最密集的一章之一，集中在兩處。v9 咒罵父母：蘇美法律准許將不認父母的兒子賣為奴隸，漢摩拉比法典規定切除毆打父親之兒子的手，烏加列文獻中一個遺囑用本節所用的動詞形容一個兒子的行為以剝奪其繼承權。v10-16 判死刑的性罪行：漢摩拉比法典第129、132條規定姦淫必須接受「神明裁判」，第130條定強姦為死罪，第154條定亂倫的懲罰為放逐；中亞述法律第20條對同性性行為的懲罰是宮刑；赫人法律第199條定與豬狗性交為死罪；舒皮盧柳瑪與胡卡納所簽署的赫人條約規定後者不得與姊妹或堂表姊妹發生性行為，因為赫人處死這樣做的人。該書並指出這些禁忌不具普世約束力——例如波斯時代鼓勵人與自己的姊妹、女兒、母親結婚，以表示虔誠
