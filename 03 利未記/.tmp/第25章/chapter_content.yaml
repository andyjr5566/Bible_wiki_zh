organization: "### 地也要守安息（v1-7）\n\n利未記25章一開頭就標了地點：「耶和華在西乃山對摩西說」。KC 認為這個細節有意思——前面幾章神多半是從會幕裡說話，而安息年與禧年這一套是在西乃山說的，「就是祂向摩西顯明會幕的同一座山」，因為「百姓與地是連在一起的」。\n\
  \n[[安息年律例|六年耕種，第七年地要守聖安息]]。CT 把人與地的關係講反過來：「安息日是為人，安息年是為地，但仍舊是為人，只有地得安息，人才能得安息；若是地還長東西，人就汗流滿面，地安息才是人真正的安息。」\n\
  \n**這一年不是荒廢，而是共享。** 丁良才：地在安息年所出的，地主和僕婢、雇工、寄居的外人「大家都可食用，卻不可出賣，不可積攢，這樣行是要叫大家發生友誼，有彼此相顧的精神」。串珠指出這裡的規格比平常更寬——不像平常的餘穗只規定給寡婦和孤兒，而是「足夠供應每一個人實際的需要」。連牲畜和走獸都在名單上。\n\
  \n**丁良才另外澄清了一個容易誤解的地方**：原文沒有「耕」字。「神雖禁止以色列人種地，卻未必禁止他們耕地，恐怕野草亂長使地荒蕪」；而逢安息年和禧年，「眾人還是隨意養牲畜，修房屋，耍手藝，做買賣」。他並記下另一件事：安息年的住棚節，男女老幼並寄居的都要到會幕那裡聽祭司念律法（申31:10-12），「就顯明神不是要他們當安息年遊手好閒」。\n\
  \nGT《舊約聖經背景註釋》從農學角度補上實效：讓土地休息可以減低鹽漬化速度，而「土壤養分耗盡和鹽量高而成災，是美索不達米亞田地大幅丟空的原因」；[[古代近東安息年|烏加列文獻也提到七年的耕作循環]]。\n\
  \n### 第五十年：宣告自由（v8-17）\n\n七個安息年之後是[[禧年（第五十年）|禧年]]。==STEP語言資料顯示這個字是 יוֹבֵל（yo.vel，詞典義\
  \ jubilee／horn）——同一個字既指這個年份，也指那支角==，而它在本章出現 14 次。BH 說明字源：「『Jubilee』這個詞來自希伯來文 yobel，意思是公羊角。」CT\
  \ 的說法相同。\n\n宣告的日子不是元旦，是七月初十的贖罪日。丁良才點出這個安排的分量：「禧年從大贖罪日起，是要顯明真實的豁免和自由必須本著贖罪。」GT 精讀本說法一致——先贖罪，恩典才臨到。\n\
  \n==v10 的「自由」在原文也是一個專門的字==：STEP語言資料顯示是 דְּרוֹר（de.ror，詞典義 liberty）。KC 指出這個觀念被以賽亞書61:1\
  \ 直接引用，下一節就是「耶和華的恩年」。GT 啟導本因此把禧年的三個別名並列：「自由之年」（結46:17）、「救贖之年」（賽63:4）、「耶和華的恩年」（賽61:2）。\n\
  \n丁良才記下猶太人的傳說，讓這一天有了畫面：七月初一到初十這十天，「奴僕不供主人役使，只在主人家中身上帶著花圈吃喝快樂，到宣告禧年的時候，他們就各歸各家」；宣告時各人把角吹九下，宣告自己已經歸還了別人的產業、釋放了奴僕、豁免了一切的債、讓所有的地歇著了。\n\
  \n第五十年到底是哪一年，其實有兩派算法。丁良才並陳：一派認為第四十九年是安息年、第五十年才是禧年，兩年連著不能種地（「猶太人的傳說和約瑟夫的史記都以這解法為是」）；另一派認為第七個安息年本身就算禧年。他判定後者與\
  \ v18-22 的意思不合。\n\n[[禧年土地贖回計算法（按距禧年年數定價）|土地買賣按距禧年的年數定價]]——年數多價高，年數少價低。丁良才點破這件事的實質：「賣地的人原非賣地，乃是賣這地到禧年之年數的出產。」KC\
  \ 給了一個現代讀者好抓的角度：這套結算方式「防止了資本主義（財產越積越多）與共產主義（沒有財產，一切屬於所有人）」。\n\n### 不撒種要吃什麼（v18-22）\n\
  \n神先把百姓心裡的話講了出來：「這第七年我們不耕種，也不收藏土產，吃什麼呢？」然後應許[[第六年三倍出產的應許（信心試驗）|第六年地生三年的土產]]。丁良才算清楚了那「三年」是第七年、第八年、第九年。\n\
  \n串珠說這是一場信心的試驗；KC 講得更直接：「一年不撒種看起來像冒險。理智會盤算：我們要吃什麼呢？信心卻倚靠神的應許。」丁良才把它連回嗎哪——神從前每逢安息日不降嗎哪，卻吩咐第六天加倍收取。\n\
  \n==丁良才另有一段話，把這條律例本身當成它出於神的證據==：「除非神吩咐，沒有首領或君王敢為自己的百姓定這出奇的律法……自古至今除了以色列人以外，再沒有一國有這樣的條例，叫百姓每七年停止務農一年，每五十年就一連停止兩年。這是顯明這條例不是出於摩西，乃是出於神。」\n\
  \n但這條律例並沒有被守住。丁良才：以色列人「將這條例廢棄了（利26:34-35、43），故此神就刑罰他們（代下36:20-21）」。KC 說得更白：「以色列從未慶祝過那些安息年，正如他們從未遵守過神的任何誡命。於是神藉著把百姓擄去，確保祂的地得著安息。」\n\
  \n### 地是我的（v23-38）\n\n全章的地基是一句話：[[地不可永賣（地權屬神）|「地不可永賣，因為地是我的」]]。丁良才把關係說得最白：「神是地主，他們是佃戶。」他並指出這是禧年的第一個要訓，第二個是「以色列人都是耶和華的僕人」。\n\
  \nGT《舊約聖經背景註釋》把它放進古代近東的兩邊對照：一邊與埃及相仿——「擁有土地的『神聖』法老，把地授給子民」；另一邊卻與美索不達米亞的廟宇經濟相對立，那裡「個別公民、君王、各神的廟宇都擁有土地」，漢摩拉比法典中賞賜的土地在臣屬死後歸回君王。同一份註釋的結論是那種制度「與聖經背後的統一觀念並不相符」。這條律法連君王也不能違背——GT\
  \ 啟導本與 KC 都舉拿伯的葡萄園（王上21:3-4）為例。\n\n贖回有三條路：[[救贖goel|至近的親屬代贖]]、本人自贖、或等到禧年自動歸回。GT 啟導本說明「贖」字希伯來文是\
  \ goel，指一個人盡至近親屬本分時的幾種義務——替親屬贖身或贖田、娶無子嗣親屬的遺孀、為受害的親人報仇。丁良才在此處列出這位近親預表基督的四個要件：救主必須是至近的親屬、必須有救贖的能力、必須拿出滿足的贖價，而且贖的不只是人的身體也包括人的基業。KC\
  \ 舉波阿斯與路得為實例，並指出波阿斯的名字意思是「在他裡面有力量」。\n\n房屋則分兩類：[[城內住宅與鄉間房屋贖回條例的差異|有城牆的城內住宅只有一年贖回期]]，過期永歸買主、禧年也不歸還；無城牆村莊的房屋視同鄉下田地。串珠說明分野在於是否與土地耕耘相連；GT《舊約聖經背景註釋》給出埃施嫩納法律的平行條文——賣掉房屋的欠債者在房屋再次出售時有優先買回權。[[利未人城邑房屋隨時贖回|利未人另有例外]]，因為城中的房屋是他們唯一可居住的產業。\n\
  \n借貸的規矩是[[取利|不可向弟兄取利]]。==STEP語言資料顯示 v36 用了兩個不同的字==：נֶשֶׁךְ（ne.shekh，逐字解 interest）與\
  \ תַּרְבִּית（tar.bit，逐字解 profit），和合本以「取利」與「多要」對應，CT 的原文字義欄則作「利息」與「高利貸」。丁良才提醒適用範圍：「這條例是論對待窮人的道理，不是關係借款經商等一切的事」，並舉尼希米斥責官長貴胄（尼5:7-8）為違例的實例。GT《舊約聖經背景註釋》另指出埃施嫩納與漢摩拉比法典都定有利率（20～33.3%\
  \ 算是常見且合理），但遇氾濫等天災時，不成文的規定是必須免除利息。\n\n### 因為他們是我的僕人（v39-55）\n\n最後一段處理人。KC 把本章四層貧窮排成一條下降線：v25\
  \ 賣掉一部分產業、v35 手中缺乏需要扶持、v39 把自己賣了、v47 賣給了外人——「本章中貧窮的情況一層比一層難堪」。\n\n[[弟兄賣身為奴不可像奴僕看待|以色列弟兄自賣不可當奴僕看待]]，要像雇工人和寄居的一樣。丁良才特別要人注意「將自己賣給你」這幾個字：「強迫人做奴僕或強取人的兒女做奴婢是不合律法的。」理由寫在\
  \ v42——「因為他們是我的僕人。」\n\n[[以色列人賣給外人的贖回條例|賣給外人的情況]]反而有最寬的贖回權。丁良才做了對照：以色列人買的外邦奴僕要終身為奴、律法上沒有贖回的條例；但以色列人被賣與外人，「他本家的弟兄或別的近親都可以隨時將他贖回」。他並由\
  \ v51 讀出一個差別——賣給外人的期限不以六年為滿，要到禧年才自由，這是「警誡以色列人，叫他們知道，寧可將自己賣與同族的人，也不將自己賣與外人為奴僕」。\n\
  \nv53 還藏著一個中文沒譯出來的細節。丁良才：原文在「不可」後有「在你們眼前」幾個字——旁觀的以色列人若見弟兄被外邦主人虐待，「就要報與官長，聽官長辦理」。這條規定的對象不只是買主。\n\
  \n| 情況 | 期限 | 贖回權 | 到禧年 |\n|---|---|---|---|\n| 賣地 | —— | 近親代贖或自贖 | 無償歸回原主 |\n|\
  \ 城內有牆住宅 | 一年 | 僅一年內 | 不歸還 |\n| 無牆村莊房屋 | —— | 隨時 | 歸回原主 |\n| 利未人城邑房屋 | —— | 隨時 |\
  \ 歸回原主 |\n| 賣身給以色列同胞 | 六年或到禧年 | 可贖 | 全家自由 |\n| 賣身給外人 | 到禧年 | 近親隨時可贖 | 全家自由 |\n|\
  \ 外邦奴僕 | 終身 | 律法未定 | 不釋放 |\n\n```mermaid\nflowchart TD\n    A[\"利未記25章的兩個週期\"] -->\
  \ B[\"每 7 年：安息年\"]\n    A --> C[\"7×7+1 = 第 50 年：禧年\"]\n    B --> B1[\"地不可耕種\"]\n\
  \    B --> B2[\"自長的出產全民共享\"]\n    C --> C1[\"贖罪日吹角宣告自由\"]\n    C1 --> C2[\"地業歸回原主\"\
  ]\n    C1 --> C3[\"賣身的人歸回本家\"]\n    C1 --> C4[\"債務豁免\"]\n    B -.第六年三倍出產.-> D[\"\
  信心的試驗\"]\n    C -.同一應許涵蓋.-> D\n```\n\n> [!note] 一句話貫串全章\n> 本章兩次給出理由，兩次都是所有權的宣告：「地不可永賣，因為地是我的」（v23），以及「因為以色列人都是我的僕人，是我從埃及地領出來的」（v55）。地屬於神，人也屬於神——丁良才稱這兩句為禧年的兩個要訓。BH\
  \ 指出 v55 的「僕人」不是暴君之下的奴役，而是立約關係中的歸屬。KC 則把安息年與禧年的分工收成一句：「安息年說到安息（來4:9），禧年說到復興（徒3:21）與自由（羅8:21）。」"
