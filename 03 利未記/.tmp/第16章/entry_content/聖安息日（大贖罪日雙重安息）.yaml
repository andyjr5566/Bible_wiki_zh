name: 聖安息日（大贖罪日雙重安息）
type: 主題
secondary_types: []
aliases:
- 聖安息日
- 安息的安息日
- 大贖罪日安息
status: formal
definition: '利未記16:31 稱大贖罪日為「聖安息日」。這個稱呼在原文裡是兩個不同的字疊起來：STEP Bible 顯示這是 שַׁבַּת שַׁבָּתוֹן，前一個字（Strong H7676）就是一般的「安息日」，後一個字（Strong
  H7677）簡要義域作「sabbath observance」，逐字譯義是「安息的安息」。因此中文各家都把它還原成「安息的安息日」——GT《串珠》：「原作『安息的安息日』，表示這安息日比其他安息日更神聖」；GT《聖經精讀本》同樣譯為「安息的安息日」；GT《啟導本》說得最白：「這日可以稱為『安息日中的安息日』。」


  嚴格的程度也不同。丁良才逐級比對：吹角節和住棚節的聖會日，神只禁止一切勞碌的工作；尋常節期的聖會日，以色列人也不可作什麼勞碌的工；但大贖罪日「他們無論什麼工都不得作」，而且在安息日故意做工的按律法用石頭打死，在贖罪日做工的則「要從民中剪除」（利23:30）。


  丁良才另指出「聖」這個字的用法：按原文，除了安息日以外，只有大贖罪日稱為聖日，安息年也稱為聖安息；他並附帶提醒，利23:24、39 兩節中「聖安息日」四個字的原文，和上列幾處的原文有些不同。'
development: 贖罪日的「安息」在正典裡越走越大。利23:32 把時間界定為從初九日晚上到初十日晚上，KC 則從新約回看這一天的停工：「那日不可作工。主耶穌的工作排除了一切人的活動；對每一個這工作已為他成就的人，結果就是：平安。」BH
  進一步把它接到希伯來書4:9-10——安息日的安息預表在基督裡的最終安息，信徒因信進入神的安息。
accumulations:
- book: 利未記
  chapter: 16
  summary: 第31節「這日你們要守為聖安息日，要刻苦己心；這為永遠的定例」。第29節同樣規定「什麼工都不可做」。第30-31節將贖罪、潔淨、安息、刻苦己心四者連結。
  relation: 定義大贖罪日的安息屬性，與刻苦己心並列為百姓當盡本分。
