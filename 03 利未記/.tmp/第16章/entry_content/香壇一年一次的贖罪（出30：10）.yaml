name: 香壇一年一次的贖罪（出30：10）
type: 互文
secondary_types: []
aliases:
- 出30：10
- 香壇贖罪
status: formal
definition: >-
  出埃及記30:10「亞倫一年一次要在壇的角上行贖罪之禮。他一年一次要用贖罪祭牲的血在壇上行贖罪之禮，作為世世代代的定例。」這節先於利未記16章交代了「一年一次」的贖罪動作，因此成為判讀本章v18「壇」字所指的關鍵。CT
  在v18 記下兩讀：本文的「壇」指祭壇，「備註：猶太人認為是指香壇，因為神曾吩咐亞倫一年－次在香壇的角上行贖罪之禮(參出三十10)，不過，16節已經暗示聖所的一切器具包括香壇，已經行過贖罪之禮」。GT丁良才同樣並陳：「猶太人以為本節的『壇』字是指著香壇說的……但本節大概是指著燔祭壇說的」，理由是16節已經暗含抹香壇的事，17節又顯明v18
  首句是大祭司出到會院的意思。GT《啟導本》則於v2 引出三十10 指出，神早已曉諭摩西使亞倫一年一次進至聖所為會眾贖罪。
accumulations:
- book: 利未記
  chapter: 16
  summary: >-
    本章v18「他出來，要到耶和華面前的壇那裡，在壇上行贖罪之禮」，CT 與 GT丁良才都指出猶太人依出30:10 把這個「壇」讀成香壇，兩家自己則判為燔祭壇；v33「至聖所和會幕與壇」的三段式，也因此被理解為至聖所、聖所（含香壇）、會幕院的燔祭壇都各自行過贖罪之禮。
  relation: >-
    出30:10 是贖罪日在利未記之外唯一的舊約線索，既提供「一年一次」的用語，也造成本章v18 壇的歸屬分歧；兩家註釋都以16節「聖所一切器具已行過贖罪之禮」化解，而非否定香壇需要抹血。
