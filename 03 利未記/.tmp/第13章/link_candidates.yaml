book: 利未記
chapter: 13
candidates:
  - name: 摩西
    type: 人物
    evidence: v1「耶和華曉諭摩西、亞倫說」，本章皮膚病診斷條例由摩西與亞倫同時領受
  - name: 亞倫和他兒子（祭司）
    type: 人物
    evidence: v2「就要將他帶到祭司亞倫或亞倫作祭司的一個子孫面前」，全章由祭司負責察看、隔離、判定潔淨或不潔淨；GT 丁良才指出祭司判錯的兩種後果都嚴重——留下該出營的與神的聖潔不合，趕走不該出去的與神的公義和恩典不合
  - name: 手長大痲瘋的神蹟
    type: 神學
    evidence: 出4:6-8 摩西的手瞬間長痲瘋又復原；本章是同一種災病在以色列日常生活中的成文診斷條例
  - name: 米利暗
    type: 人物
    evidence: GT 丁良才註舉「他既是不潔淨，就要獨居營外」的歷史例證時點名米利暗（民十二15；民十9-10；申二十四9）
  - name: 大痲瘋（sara'at）
    type: 原文
    evidence: 全章核心術語。STEP 顯示 v2 的「大痲瘋」是 צָרָעַת（H6883），逐字解作 a serious skin disease；GT 艾基斯《舊約聖經難題彙編》用 sara'at、賈斯樂郝威《聖經難解經文詮釋手冊》用 tsaraath，兩家都指出它是統稱、不等同現代漢森氏病
    surfaces:
      - phrase: 大痲瘋
        verses: [2, 3, 8, 9, 11, 12, 13, 15, 20, 25, 27, 30, 42, 43, 44, 45, 47, 49, 51, 52, 59]
  - name: 大痲瘋是否等同於罪的懲罰之爭
    type: 解經爭議
    evidence: CT／KC 將本章逐一症狀詮釋為信徒裡面某種罪性的顯露；GT《聖經精讀本》在章首說「聖經並沒有說大麻風是犯罪的結果」，同一份精讀本在 v3 又說「判定大麻風不潔，因為大麻風破壞神創造人的原樣，是對罪審判的結果」；BH 則說本章的「不潔」是禮儀狀態而非道德罪
  - name: 患痲瘋者的哀悼記號（獨居營外）
    type: 主題
    evidence: v45-46「他的衣服要撕裂，也要蓬頭散髮，蒙著上唇，喊叫說：不潔淨了！不潔淨了！……就要獨居營外」；STEP 顯示 v45 的「撕裂」與「蓬頭散髮」用的是 פָּרַם（H6533）與 פָּרַע（H6544B），與利10:6 禁止亞倫父子做的是同兩個字
    surfaces:
      - phrase: 獨居營外
        verses: [46]
  - name: 衣服皮子的黴斑條例
    type: 主題
    evidence: v47-59 全段另立一套條例，處理羊毛、麻布、皮子上發綠發紅的黴斑，判準與處理方式（洗滌、撕去、焚燒）與人身皮膚病不同；GT 丁良才指出神沒有為染災病的衣物定任何潔淨禮儀
    surfaces:
      - phrase: 染了大痲瘋災病的衣服
        verses: [47]
  - name: 潔淨與不潔淨
    type: 神學
    evidence: 全章的判定語彙。STEP 顯示 v40-41「還是潔淨」是形容詞 טָהוֹר（H2889），v46 同時用動詞 טָמֵא（H2930A，他便是不潔淨）與形容詞 טָמֵא（H2931，他既是不潔淨）；祭司的全部職責就是在這兩者之間作判定
  - name: 禮儀不潔與道德罪的分別
    type: 神學
    evidence: BH 在 v46 說「本章的『不潔』指禮儀上的不潔狀態，不必然是道德上的罪」；GT《聖經精讀本》說「聖經並沒有說大麻風是犯罪的結果」；GT 丁良才也警告「不可說一切長大麻風的人都是受了神的刑罰」
  - name: 古代近東的皮膚病與黴斑觀念
    type: 背景
    evidence: GT《舊約聖經背景註釋》四處提供對照——亞喀得語用語同樣廣泛、巴比倫人視之為不潔又看為神明的懲罰；臨床痲瘋病要到亞歷山大大帝時代才有記錄；某個舊巴比倫兆頭以皮膚白斑為「這人遭受他的神摒棄」的表示；巴比倫文學也強逼皮膚病患者隔離居住、可能住在墳墓附近；美索不達米亞文學認為布料黴菌與邪惡或鬼魔有關，但經文卻沒有把它擬人化
