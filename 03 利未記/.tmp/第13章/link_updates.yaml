book: 利未記
chapter: 13
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1「耶和華曉諭摩西、亞倫說」：本章的皮膚病條例由摩西與亞倫一同領受，與上一章只對摩西說的產婦條例不同。BH 指出這個組合本身有意義——摩西是領受律法的先知與立法者，亞倫是負責執行的大祭司，而本章接下來的條例正好落在祭司的職責上：診斷與處理皮膚病。
  relation: 利未記到這裡出現了三種受命模式：利11 的食物條例對摩西、亞倫兩人說，利12 的產婦條例只對摩西說，本章又回到兩人。BH 把這種搭配讀成先知職分與祭司職分在引導百姓上的並用。就本章而言，摩西在 v1 之後幾乎不再出現，五十九節裡反覆出現的是「祭司要察看」。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: v2-59 全章反覆出現「祭司要察看」（3、30、50節等），亞倫及其祭司子孫是皮膚病與衣物黴斑唯一的判定權柄。GT 丁良才指出這是專屬的：「別人雖然認識大麻風病，卻沒有定人為潔與不潔的權柄，因為只有祭司可以負這審察災病的責任（申二十四8）」，主耶穌醫好長大痲瘋者之後也吩咐他們去把身體給祭司察看（太8:4，路17:14）。BH 補上一句實情：以色列的祭司不只是宗教領袖，同時擔任衛生檢查的角色。
  relation: 這份權柄的分量在於它可能出兩種錯，而且兩種都嚴重。丁良才寫道：若讓該趕到營外的人仍與會眾同住，「就與神的聖潔不合」；從會眾中若趕出不該出去的人，「就與神的公義和恩典不合」——所以祭司不可急速斷定，要用智慧、忍耐、慈悲、等候，察看又察看。KC 從另一頭說同一件事：如果那人其實沒有痲瘋，把他趕出營外是一件大罪。條例裡兩次七天的關鎖，正是為了讓判定慢下來。
- title: 手長大痲瘋的神蹟
  path: link_folder/神學/手長大痲瘋的神蹟.md
  summary: 出4:6-8 摩西的手瞬間長大痲瘋又瞬間復原，是這種災病在聖經裡的第一次出現；利未記13章則是同一種災病的成文條例——什麼算、什麼不算、誰來判、判了以後怎麼辦，五十九節逐項寫明。
  relation: 兩處的對比落在「誰能改變它」。本章的祭司從頭到尾只能察看與宣告，KC 說得很直白：「祭司不能醫治，他只能宣告潔淨。唯有神能醫治人。」而出4 的神蹟正是神在摩西自己手上示範了那個祭司做不到的動作——使痲瘋來，也使痲瘋去。GT 丁良才從歷史面指出這有多罕見：除了藉神蹟得痊癒的以外，舊約再沒有一次記載長大痲瘋的人得了痊癒。
- title: 米利暗
  path: link_folder/人物/米利暗.md
  summary: GT 丁良才在解釋 v46「獨居營外」時，把後來真的照這條例被隔離的人列了出來，米利暗是第一個（民12:15）；他在同一段另舉基哈西（王下5:7、27）與烏西雅王（王下15:5），說這三人「都是因受神的刑罰忽然長了大痲瘋」。KC 列的是同樣三個名字（民12:5-10；王下5:20-27；代下26:16-21）。
  relation: 本章只寫條例、不寫人，米利暗是這條例第一次落在一個有名有姓的人身上。但丁良才在同一段就加了但書：不可說一切長大痲瘋的人都是受了神的刑罰——米利暗屬於他所說「有時確是這樣」的那一類個案，不能反過來當作通則。
- title: 大痲瘋（sara'at）
  path: link_folder/原文/大痲瘋（sara'at）.md
  summary: 本章是這個字的立法章。STEP 語言資料顯示 v2 的「大痲瘋」是 צָרָעַת（H6883，逐字解作 a serious skin disease），「災病」是另一個字 נֶגַע（H5061），v45 講患者本人時改用動詞形式 צָרוּעַ（H6879）；起始的三個症狀分別是 שְׂאֵת（H7613，a swelling）、סַפַּחַת（H5597，flaking skin）、בַהֶרֶת（H934，a bright spot），和合本譯作癤子、癬、火斑；「關鎖」則是 סָגַר（H5462）的使役形。
  relation: 這個字的範圍是本章最大的解經爭點。GT 艾基斯與賈斯樂郝威都說它是統稱，GT《舊約聖經背景註釋》更說「漢森氏病最主要的病癥一個也沒有在經文中出現，反之所列的症狀卻顯示與漢森氏病無關」；CT 卻在 v2 註明它「狹義指皮膚像鱗片那樣剝落或無知覺，類似現代所謂的『漢森氏病(Hansen)』」。範圍之所以要緊，是因為同一個字在 v47 之後被用在衣服上——若它只指人的一種疾病，那一段就講不通。
- title: 大痲瘋是否等同於罪的懲罰之爭
  path: link_folder/解經爭議/大痲瘋是否等同於罪的懲罰之爭.md
  summary: 本章是這個爭議的核心經文。CT 的靈意註解把癤子、癬、火斑分別讀作高傲、不受約束、自滿，KC 把整章讀成罪在信徒身上爆發的圖畫；GT《聖經精讀本》卻在章首說「聖經並沒有說大麻風是犯罪的結果」，BH 在 v46 說本章的「不潔」是禮儀狀態而非道德上的罪。分歧甚至出現在同一份來源內部：精讀本在 v3 又寫「判定大麻風不潔,因為大麻風破壞神創造人的原樣,是對罪審判的結果」；KC 也留了退路，說信徒所犯的每一件罪並不都是痲瘋。
  relation: 條例本身沒有替這個問題作答——五十九節從頭到尾只判「潔淨」與「不潔淨」，沒有一節說患者犯了什麼罪。GT 丁良才把兩面都說了：他舉米利暗、基哈西、烏西雅為神刑罰的實例，又緊接著警告不可說一切長大痲瘋的人都是受了神的刑罰。GT《舊約聖經背景註釋》記下的古巴比倫兆頭（皮膚白斑是「這人遭受他的神摒棄的表示」）顯示這種等式在以色列之外早已通行，而本章訂出好幾種可以判為潔淨的情形，反倒是對它的節制。
- title: 患痲瘋者的哀悼記號（獨居營外）
  path: link_folder/主題/患痲瘋者的哀悼記號（獨居營外）.md
  summary: v45-46 規定確診者撕裂衣服、蓬頭散髮、蒙著上唇、喊叫「不潔淨了！不潔淨了！」，並獨居營外。STEP 語言資料顯示 v45 的「撕裂」是 פָּרַם（H6533）、「蓬頭散髮」是 פָּרַע（H6544B），與利10:6 神禁止亞倫父子做的是同樣兩個字；「上唇」是 שָׂפָם（H8222，逐字解作 a moustache）；v46 的「獨居」是 בָּדָד（H910）加上「他要住」。
  relation: GT 丁良才說這一整套是弔喪的標號，並記下猶太俗語稱長大痲瘋的人為「行走的墳墓」；他另註「按猶太人的風俗，長大麻風的婦女，不必撕裂衣服」。GT《舊約聖經背景註釋》把它放回當時的信念：這身打扮「能夠保護他免受盤旋於死人之上的邪惡力量所影響」，喊叫則因為「普遍信念以為他口中的氣也能玷污人」。GT《串珠》說明營外是什麼地方——遠離神、放逐罪人與不潔淨的人，也是罪犯被處決的地方。BH 由此接到來13:12-13：耶穌在城門外受苦。
- title: 衣服皮子的黴斑條例
  path: link_folder/主題/衣服皮子的黴斑條例.md
  summary: v47-59 把同一個字用在羊毛、麻布、經緯線與皮製品上。STEP 語言資料顯示 v51-52 的「蠶食的」是 מַמְאֶרֶת（H3992，詞條原形 מָאַר，逐字解作 malignant），v55 的「透重的」是另一個字 פְּחֶתֶת（H6356，簡要辭典作 eating）。GT《啟導本》說這是羊毛或麻布衣服的惡性發黴，「因為經線與緯線上出現綠色或紅色的黴」；GT 賈斯樂郝威與艾基斯都指出，衣物上的是損害紡織品的真菌黴菌，與人的皮膚病不是同一回事，只是共用同一個希伯來字。
  relation: 這套程序有兩點與人的條例不同。第一，它處處留餘地：GT《串珠》指出先洗、再撕去患處、最後才焚燒的分段設計，「顯然是為了保全百姓所擁有的財產，如果整件衣服都要毀滅，對窮苦百姓來說，就會產生經濟上嚴重的困難」。第二，它沒有潔淨禮——GT 丁良才指出人與房屋都有潔淨的禮儀（利14:1-32、48-53），衣物卻沒有，「乃是只憑祭司將那衣服或對像定為潔淨或不潔淨就是了」。GT《舊約聖經背景註釋》另點出一個對照：美索不達米亞文學把這種黴與邪惡或鬼魔連在一起，「但經文卻沒有把它擬人化」。
- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: 本章是這組字最密集的一章——五十九節裡，祭司的每一次察看都以「定他為潔淨」或「定他為不潔淨」作結。STEP 語言資料顯示 v40-41 說禿頭「還是潔淨」用的是形容詞 טָהוֹר（H2889）；v46 一節之內同時出現動詞 טָמֵא（H2930A，他便是不潔淨）與形容詞 טָמֵא（H2931，他既是不潔淨）。
  relation: 利11 判的是食物，利12 判的是產婦，本章判的是人的身體與人的衣物，並且第一次出現「判錯」的風險——GT 丁良才指出兩個方向的錯都嚴重：留下該出營的與神的聖潔不合，趕走不該出去的與神的公義和恩典不合。本章也第一次出現一種違反直覺的判定：大痲瘋若擴散到全身、從頭到腳無處不有，祭司反倒要定他為潔淨（v12-13）。
- title: 禮儀不潔與道德罪的分別
  path: link_folder/神學/禮儀不潔與道德罪的分別.md
  summary: BH 在 v46 說本章的「不潔」指的是禮儀上的不潔狀態，不必然是道德上的罪；GT《聖經精讀本》在章首說「聖經並沒有說大麻風是犯罪的結果」，並在 v2 補上「但並非所有的病都是罪的結果,耶穌對門徒說得非常清楚(約9:1-7)」；GT 丁良才在舉出米利暗、基哈西、烏西雅三個實例之後，緊接著警告不可說一切長大痲瘋的人都是受了神的刑罰。
  relation: 利12 的產婦是「不潔卻無罪」最清楚的例子，本章則是這條界線最難守的地方——因為這裡確實有神用痲瘋懲罰罪的實例。三份來源的作法是把兩件事分開：條例判的是禮儀狀態，個別案例的因果要另外判斷。GT《舊約聖經背景註釋》還指出，把皮膚病直接讀成神的棄絕正是古巴比倫兆頭的作法，而本章反倒訂出好幾種可以判為潔淨的情形。
