book: 利未記
chapter: 11
updates:
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1「耶和華對摩西、亞倫說」：本章食物潔淨條例神同時對摩西與亞倫兩人說話，摩西是頒布這套「潔淨與不潔淨」律例的中介者。
  relation: GT 丁良才註：本處並提摩西亞倫兩人名字（十三1，十四33），因為下列條例與二人都有關係（參民九6）。
- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  summary: v1 神首次在亞倫正式就任大祭司後（參利9:22-24），同時對摩西和亞倫兩人說話頒布食物潔淨條例。
  relation: 串珠聖經註釋：通常神是單獨與摩西說話，較少與摩西及亞倫二人一同說話；這裡卻是二人一起的，可能是因亞倫及祭司們須要分別潔淨的與不潔淨的，並且要教導以色列人遵守（參10:10）。
- title: 潔淨與不潔淨的早期區分
  path: link_folder/主題/潔淨與不潔淨的早期區分.md
  summary: 利未記11章將創世記早已存在、卻只用於獻祭的潔淨/不潔淨分類，系統化為涵蓋走獸、水族、飛鳥、爬物的完整飲食律例。
  relation: 利未記雷氏研讀本：潔淨與不潔淨之食物的區分，可追溯到挪亞的時代（創七2）；本章（v3-31）首次將這早期僅用於獻祭的分類，具體訂定為可吃與不可吃的飲食標準。
- title: 聖潔生活
  path: link_folder/主題/聖潔生活.md
  summary: v44-45「你們要成為聖潔，因為我是聖潔的」是本章全部飲食條例的神學根據——聖潔生活從飲食延伸到日常行為的分別為聖。
  relation: CT 靈訓要義：神規定潔淨和不潔淨的食物，旨在讓人通過視覺直接分辨，用以操練生活的聖潔，用外在潔淨表明內在的聖潔（v44-45）。
- title: 聖潔飲食
  path: link_folder/主題/聖潔飲食.md
  summary: 利未記11章是「聖潔飲食」條例最完整的具體展開：分蹄倒嚼的走獸、有翅有鱗的水族、二十種不潔飛鳥、蹦跳可吃的昆蟲，逐一分別可吃與不可吃的活物。
  relation: 出22章已提及「聖潔的人不吃不潔之物」的原則性宣告；利未記11章（v2-23）則是這原則首次具體逐類立法的篇章。
- title: 污穢
  path: link_folder/主題/污穢.md
  summary: v24-40 詳細規定摸了不潔死物（死獸、死畜、死蟲）必不潔淨到晚上，是利5:2-3「摸不潔之死物」條例的具體展開與操作細則。
  relation: 利5:2-3 規定誤犯者須獻贖愆祭補贖，但未細說「不潔淨到晚上」的具體機制；利未記11:24-40 補上這套摸屍、拿屍、器皿沾染的完整潔淨程序，是同一污穢概念的操作性延伸。
- title: 瓦器打碎銅器擦淨
  path: link_folder/主題/瓦器打碎銅器擦淨.md
  summary: v33「你們要把這瓦器打破了」、v35「不拘是爐子，是鍋臺，就要打碎」：不潔爬物屍體掉入瓦器、爐灶時，適用與利6:28贖罪祭肉相同的「瓦器打碎」原則。
  relation: 利6:28 是贖罪祭肉煮熟後瓦器多孔吸附祭肉汁液須打碎的條例；利未記11:33,35 將同一「瓦器多孔無法淨化、須打碎」的原理，擴大適用到爬物屍體污染食具的情境，證明這是貫穿全書的一致原則，不限於祭肉處理。
- title: 潔淨與不潔淨
  path: link_folder/神學/潔淨與不潔淨.md
  summary: 利未記11章是全書「潔淨／不潔淨」這組概念最完整的一次展開：走獸看分蹄倒嚼（v3-8）、水族看有翅有鱗（v9-12）、飛鳥直接列出二十種不可吃的（v13-19）、昆蟲以能否蹦跳分界（v20-23），後半章再處理接觸屍體的污穢傳遞（v24-40），末了以v47「要把潔淨的和不潔淨的，可吃的與不可吃的活物，都分別出來」收束。經文並且分了兩個等級：STEP語言資料顯示走獸段用 טָמֵא（H2931，「unclean」），水族、飛鳥與爬物段另用 שֶׁקֶץ（H8263，詞典義「detestation」）——GT 引丁良才早已數出這個分別。
  relation: 這一章不是憑空出現的條例，而是利10:10 的執行版。GT《串珠聖經註釋》指出關於潔淨與不潔的律例「是回應10:10，以及作為16章有關贖罪日的背景」；STEP語言資料可以把這個接點看得更實：利10:10「分別出來」與利11:47「分別出來」用的是同一個動詞 בָּדַל（H914）。第十章吩咐祭司要會分辨，第十一章給的就是那份分辨清單，而十二至十五章接著處理人身體的不潔，十六章的贖罪日則是總潔淨。
- title: 你們要聖潔因為我是聖潔的
  path: link_folder/神學/你們要聖潔因為我是聖潔的.md
  summary: 利11:44-45 是這個公式在利未記的第一次出現，而且連說兩次：「我是耶和華你們的神；所以你們要成為聖潔，因為我是聖潔的」（v44）、「我是把你們從埃及地領出來的耶和華，要作你們的神；所以你們要聖潔，因為我是聖潔的」（v45）。兩次的理由不同——前一次立在「我是你們的神」，後一次立在「我把你們從埃及領出來」。STEP語言資料顯示v44「你們要成為聖潔」的 וְהִתְקַדִּשְׁתֶּם 是 קָדַשׁ（H6942G）的 Hithpael（反身），與前一節「不可使自己不潔淨」的 תִטַּמְּאוּ（טָמֵא，H2930A，同為 Hithpael）構成一對。
  relation: 這個公式在利19:2、20:7、26 再三重複，但它第一次出現的位置很值得注意：不是在道德條例裡，而是在一章講吃什麼的條例末尾。GT《聖經精讀本》說明「聖潔」原意就是「分離」；GT《利未記雷氏研讀本》分開兩面來講——用在以色列人身上是「分別為聖歸給神，而且遠離一切不潔淨的東西」，用在神身上則是「不但指祂從一切邪惡分別出來，而且祂是全然純潔」。也就是說，本章把最抽象的要求接在最日常的事情上：桌上放什麼，就是聖潔這回事的第一課。
- title: 古代近東飲食潔淨
  path: link_folder/背景/古代近東飲食潔淨.md
  summary: GT《舊約聖經背景註釋》為本章提供多則古代近東對照。【利十一2 飲食的規限】指出「美索不達米亞有很多某些食物短期遭禁的例子」，巴比倫也有證據顯示「有些神祇只肯接受某種牲畜為祭物」，但「卻沒有好像本段一般，凌駕一切之上的系統」，並補充可吃的動物名單「大致符合古代近東人飲食的慣例」。【利十一3～7 動物分類的準則】則評估幾種理論的強弱，並提出「一個新近提出的理論可信性頗高：神的『飲食』是以色列飲食的模式。換言之，不能獻給神為祭，就不宜給人作為食物。」【利十一7 豬】整理了亞述、赫人、埃及與希臘羅馬的豬祭資料。
  relation: 出22 的角度是「不可吃田間被野獸撕裂牲畜的肉」這類單條規定，本章則是整套系統。對照之下差別不在有沒有飲食禁忌——鄰近民族也有——而在規模與依據：別人是零星的、與特定神祇綁定的短期禁令，以色列的是一套涵蓋走獸、水族、飛鳥、爬物並貫穿日常的分類。同一則註釋也提醒不要把差異說得太滿：講到「與異教儀式切割」這個常見解釋時，它自己反駁「其實以色列鄰邦的獻祭習慣和以色列極為相似」。
