book: 利未記
chapter: 26
updates:
- title: 柱像
  path: link_folder/原文/柱像.md
  summary: v1「不可立雕刻的偶像或是柱像，也不可在你們的地上安什麼鏨成的石像，向他跪拜」。STEP 語言資料：本節「柱像」是 מַצֵּבָה（ma.tze.Vah，Extended Strong H4676，陰性單數絕對式），詞典所列的詞條形式是 mats.tse.vah，本節 context gloss 是 a sacred pillar；同節「鏨成的石像」原文其實是兩個字——אֶבֶן（e.ven，石頭）加 מַשְׂכִּית（H4906，context gloss 作 a carved image），與 CT〔原文字義〕給的「石像(原文雙字)」石頭(首字)；形像(次字) 完全對得上。GT《舊約聖經背景註釋》：「立起來的聖石和神像，都同樣是遭禁的異教祭儀聖物。這些柱像可能是代表神明的單塊巨石，也可能是圍繞祭壇或神廟的一套柱子。在基色和夏瑣出土的柱子刻有裝飾，如高舉之手，或與某位神明有關的記號等。」
  relation: 本章以禁立柱像開場、以 v30 神親手打碎偶像收場，柱像是這個首尾結構的起點。至於同節那個只在此處出現的「鏨成的石像」，GT《舊約聖經背景註釋》另有一則專論：「這用語只在聖經此處出現，意思非常的隱晦。胡羅維茨（A. Hurowitz）根據一處亞述碑文，提出所指的可能是廟宇門檻上有裝飾或刻字的版子，君王祈求吉兆時俯伏於其上。」
- title: 安息日
  path: link_folder/神學/安息日.md
  summary: v2「你們要守我的安息日，敬我的聖所。我是耶和華」。GT《聖經精讀本》：「以色列百姓要遵守安息日制度，遵守唯一聖所的制度，堅持以神為中心的信仰生活。」同一段並指出「敬我的聖所」所指的是「唯一的中央聖所（申12:5）」。KC：「在禁止製造偶像的消極禁令之後，接著是守『我的安息日』與敬畏『我的聖所』的積極吩咐。守安息日的誡命顯出他們在社會生活中對耶和華的尊重；敬畏聖所則顯出他們願意在宗教生活中按神的旨意而活。」
  relation: 本章把守安息日與敬聖所並列，當作全章祝福咒詛宣告的兩項前提。GT《聖經精讀本》指整段緒論「是十誡中第2、4誡命的概要」；GT《串珠聖經註釋》補上這兩項並列的用意：「守安息日和尊敬聖所不單可幫助他們遠離偶像，更是有諸內而形於外的愛神表現。」而 v34-35 又反過來說明：安息日制度一旦被長期忽略，地要在被擄期間替百姓把安息補回來。
- title: 祝福與咒詛
  path: link_folder/主題/祝福與咒詛.md
  summary: 全章 v3-45 的結構。GT《聖經精讀本》：「本書的結論部分，由順服的祝福（3-13節）和不順服的咒詛（14-39節）；或許因墮落遭到刑罰，只要悔改就隨時給予恢復的應許（40-46節）組成。與出23:20-33西乃山之約結論、申28章摩西摩押平原講道結論一脈相承。」GT《串珠聖經註釋》指出咒詛遠比祝福詳盡是有用意的：「這做法含有很濃的教育作用，讓人清楚知道若沒有神祝福，人會如何受苦，也反映出人類本是罪人，容易傾向邪惡，故此『畏懼』常常比『愛心』更能激發人行善的意志。」
  relation: 利未記全書以本章的祝福咒詛作結。GT 丁良才點出這不是孤例：神在出二十22至二十三19 的律法之後也有警誡的話（出二十三20-33），摩西臨終時同樣忠告以色列人順命與逆命的結果（申二十八1至三十20）。他並提醒讀者不要把它讀成單向的預言：「這不是將來必成的預言，乃是令以色列人懼怕的警誡，後來以色列人有時雖是遠背神的命令，有時卻也遵行神的旨意，所以享福和遭禍是輪流迴圈的。」
- title: 亞伯拉罕之約
  path: link_folder/神學/亞伯拉罕之約.md
  summary: v42「我就要記念我與雅各所立的約，與以撒所立的約，與亞伯拉罕所立的約，並要記念這地」；v45「我卻要為他們的緣故記念我與他們先祖所立的約」。STEP 語言資料：v42 一節之內「記念」出現三次，都是 זָכַר（za.khar，H2142）——記念雅各的約、記念亞伯拉罕、記念這地。GT 丁良才注意到列祖的次序被倒過來寫：「在此處神是自下而上說的（就是從雅各到亞伯拉罕）。在聖書別處都是亞伯拉罕在先，雅各在後。」他並說明「記念」在這裡的用法：「這是借用的話，就是留意實行的意思，顯明神沒有忘記祂與他們的列祖所立的約。」
  relation: 本章走到最深的懲罰之後，翻轉的根據不是百姓的功勞，而是這份與列祖所立的約。GT《聖經精讀本》說明它的性質：「神與亞伯拉罕、以撒、雅各所立的約是慈愛、恩典的約……這個約不會因為人的行為而被廢止或消失。」KC 則指出神守約的理由在神自己：「祂持守祂的約，不是因為祂的百姓，而是因為祂自己，並且基於祂兒子在十字架上所成就的工作。」丁良才另外提醒 v42 的「並要記念這地」不可略過：「神的應許不但關係以色列人，也是關係他們所住的猶太地。」
- title: 安息年律例
  path: link_folder/事件/安息年律例.md
  summary: v34-35、43「你們在仇敵之地居住的時候，你們的地荒涼，要享受眾安息……地多時為荒場，就要多時歇息；地這樣歇息，是你們住在其上的安息年所不能得的」。STEP 語言資料：「享受安息」的動詞是 רָצָה（H7521，詞典義 to accept），而 v43 一節之內用了兩次——地「接受」它的安息，百姓「接受」他們的罪孽，同一個動詞把兩件事扣在一起。GT 丁良才記下一種計算：「有注釋家計算從以色列人分地起到猶太人被據到巴比倫的時候共有九百六十九年，若減去十九個禧年，還有九百五十年，這樣，以色列人通共當守－百三十六個安息年。」但他自己並不採信：「這樣演算法未必可靠」，並認為七十年「也許是囫圇數，用以代替以色列人所未曾守之一切的安息年數，不是確指未守之安息年數的多寡」。
  relation: 本章把安息年從一條農業條例變成一筆會被清算的帳：地在被擄期間補回它沒能得到的歇息（代下三十六21）。GT《聖經精讀本》把這件事放進更大的圖畫：「人的墮落也影響到自然界，宇宙萬物也落在人所犯的罪惡痛苦中。自然也盼望著安息和恢復的日子。」KC 的說法一致：百姓被趕出去之後，「這地將得安息，並且為著它在百姓居住期間被剝奪的安息年得著補償」。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v46「這些律例、典章，和法度是耶和華與以色列人在西乃山藉著摩西立的」。STEP 語言資料：「藉著摩西」在原文是介系詞加上「手」（יָד，H3027J）再接摩西的名字，字面是「藉摩西的手」。GT 丁良才用這一節歸納出利未記的五個要點：「（－）是出於誰（出於耶和華），（二）是借著誰（借著摩西），（三）是與誰（達與以色列人），（四）寫於何處（在西奈山），（五）有何內容（有律例，典章和法度）。」KC：「摩西是神所賜的中保。百姓安營在西乃山時，是透過他的職事領受神的啟示。」
  relation: 本節是利未記全書的結語，把整卷書的權威來源與傳達鏈一次交代清楚。GT 丁良才並指出這一節在全書結構上的意義：「有好些注釋家以本節為利未記全書的總結，這樣，第二十七1至34節就可說是附篇，正如約二十一章是約翰福音的附篇一樣。」GT《聖經精讀本》給出時間定位：全書條例是出埃及第二年正月初一（出40:17）至二月二十日（民10:11）之間，摩西在西乃山所領受的啟示。
- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: v11-12「我要在你們中間立我的帳幕；我的心也不厭惡你們。我要在你們中間行走；我要作你們的神，你們要作我的子民」。STEP 語言資料：v11「帳幕」是 מִשְׁכָּן（H4908，字面「我的居所」）；v12「行走」是 הָלַךְ（H1980I）的 Hithpael 詞形（Hc/Vtq1cs），context gloss 作 I will walk about，語態帶有「來回走動」的意思，與 v11 的「住下來」剛好構成一組。CT 也是這樣分的：「『行走』含有看顧保護之意；上節是同住，本節是同行。」KC：「除了這物質的祝福之外，還有屬靈的祝福。那就是祂住在他們中間、要作他們的神、他們要作祂子民的特權。」
  relation: 這是本章七重應許的最高一層，也是全章結構的頂點：祝福從雨水、糧食、安全一路往上，最後落在神自己搬進來住。GT《串珠聖經註釋》特別注意到 v11 後半那句突兀的話：「『我的心也不厭惡你們』：這句來得似乎有點突然，卻反映出以色列人原是犯罪的子民，應受神厭惡，若不是神的恩典，他們的遭遇便很淒慘的了。」而同一個動詞在 v30 反過來出現——「我的心也必厭惡你們」——這一層祝福因此也是後半咒詛最直接的反面。
- title: 宗主條約
  path: link_folder/背景/宗主條約.md
  summary: 全章 v3-45 的祝福咒詛結構。GT《舊約聖經背景註釋》【利二十六3～45 條約程式的祝福和咒詛】：「典型的古代近東法典和條約，都在結尾附有神明祝咒的段落（見：申二十八；漢摩拉比的法典〔主前十八世紀〕；以撒哈頓條約〔主前680～669〕；主前十三世紀埃及法老蘭塞二世和赫人君王哈圖西利斯三世之間的條約）。咒詛照例遠比祝福為多，並且如同本段，其嚴重性逐步遞增。」BH 也把本章的賞罰結構歸到同一個源頭：「這個概念植根於古代近東的宗主—藩屬條約，宗主會在其中列出效忠的祝福與背叛的咒詛。」GT《串珠聖經註釋》一句話帶過同一件事：「古時近東的條約通常都以祝福守約者及咒詛破壞條約者作結束的。」
  relation: 既有累積收的是出19-20 的條約形式（自我宣告、歷史敘述、義務條款），本章補上的是條約的最後一段——祝咒條款本身。GT《舊約聖經背景註釋》並說明這種條款存在的理由：「這些句子背後的原則，是必須引進神明的善意和處分，才能保證法律和條約得到遵守。如此與單獨倚靠百姓和鄰舍自動自覺地守約相比，雙方才會感受到必須遵行約定的迫切性。」本章有兩個咒詛可以直接對到具體文獻：v19「天如鐵地如銅」也見於以撒哈頓條約，v29 食人的咒詛則見於主前七世紀的亞述條約。
- title: 典章
  path: link_folder/神學/典章.md
  summary: v15「厭棄我的律例，厭惡我的典章，不遵行我一切的誡命」；v46「這些律例、典章，和法度是耶和華與以色列人在西乃山藉著摩西立的」。GT 丁良才在 v15 下分辨摩西五經的三種律法用語：「誡命」原是指十條誡說的，但也常作包括神一切命令的普通名詞；「典章」的原文「是指著古審判官累集的判語，這些判語漸漸地成了－種普通法，神也選擇了這些判語為自已的典章」；「律例」的原文「是指著律法上的定例，譬如獻祭和潔淨的條例」。他並給出區分的判準：「典章關係顯然逆理之行動，就是人人看為惡的事；律例關係因律法禁止才顯為惡的事；典章和誡命的文法多是簡勁的，助人記憶；律例的文法多是描摹的，助人明白。」
  relation: STEP 語言資料確認本章兩處的用字：v15 依序是 חֻקֹּתַי（H2708，statutes）、מִשְׁפָּטַי（H4941G，judgments）、מִצְוֺתַי（H4687，commandments）；v46 則是 חֻקִּים（H2706G）、מִשְׁפָּטִים（H4941G）、תּוֹרֹת（H8451，context gloss 作 legal procedures）。「典章」兩處都是 מִשְׁפָּט 的複數，與出二十一1 那個作為整段律例標題的字同源。本章的用法讓這個字第一次出現在被違背的一側——百姓「厭惡我的典章」（v15）、「厭棄了我的典章」（v43）——而 v46 又把它收回到全卷律法的總稱裡。
