book: 利未記
chapter: 26
links:
- verse: 1
  phrase: 不可立雕刻的偶像或是柱像
  target: 柱像
- verse: 2
  phrase: 你們要守我的安息日，敬我的聖所
  target: 安息日
- verse: 3
  phrase: 你們若遵行我的律例，謹守我的誡命
  target: 祝福與咒詛
- verse: 4
  phrase: 我就給你們降下時雨，叫地生出土產，田野的樹木結果子
  target: 遵行誡命必蒙福的七重應許（利26：3-13）
- verse: 8
  phrase: 你們五個人要追趕一百人，一百人要追趕一萬人
  target: 五個人追趕一百人（蒙福的軍事應許）
- verse: 11
  phrase: 我要在你們中間立我的帳幕；我的心也不厭惡你們
  target: 神的同在
- verse: 12
  phrase: 我要在你們中間行走；我要作你們的神，你們要作我的子民
  target: 神的同在
- verse: 14
  phrase: 你們若不聽從我，不遵行我的誡命
  target: 祝福與咒詛
- verse: 15
  phrase: 厭棄我的律例，厭惡我的典章
  target: 典章
- verse: 18
  phrase: 你們因這些事若還不聽從我，我就要為你們的罪加七倍懲罰你們
  target: 不聽從神的五層漸進懲罰（利26：14-39）
- verse: 19
  phrase: 又要使覆你們的天如鐵，載你們的地如銅
  target: 天如鐵地如銅（乾旱咒詛的意象）
- verse: 21
  phrase: 你們行事若與我反對，不肯聽從我
  target: 行事與我反對（qe.ri）
- verse: 21
  phrase: 加七倍降災
  target: 加七倍懲罰
- verse: 23
  phrase: 你們因這些事若仍不改正歸我，行事與我反對
  target: 行事與我反對（qe.ri）
- verse: 24
  phrase: 因你們的罪擊打你們七次
  target: 加七倍懲罰
- verse: 27
  phrase: 你們因這一切的事若不聽從我，卻行事與我反對
  target: 不聽從神的五層漸進懲罰（利26：14-39）
- verse: 29
  phrase: 你們要吃兒子的肉，也要吃女兒的肉
  target: 吃兒女的肉（極端饑荒的咒詛）
- verse: 30
  phrase: 我又要毀壞你們的邱壇，砍下你們的日像
  target: 邱壇與日像被毀（拜偶像的終極審判）
- verse: 30
  phrase: 我的心也必厭惡你們
  target: 神厭惡以色列的難題（利26：30與26：44的張力）
- verse: 34
  phrase: 你們在仇敵之地居住的時候，你們的地荒涼，要享受眾安息
  target: 安息年律例
- verse: 35
  phrase: 地這樣歇息，是你們住在其上的安息年所不能得的
  target: 安息年律例
- verse: 40
  phrase: 行事與我反對
  target: 行事與我反對（qe.ri）
- verse: 41
  phrase: 他們未受割禮的心若謙卑了，他們也服了罪孽的刑罰
  target: 未受割禮的心若謙卑（認罪悔改的條件）
- verse: 42
  phrase: 我就要記念我與雅各所立的約，與以撒所立的約，與亞伯拉罕所立的約
  target: 亞伯拉罕之約
- verse: 43
  phrase: 典章
  target: 典章
- verse: 44
  phrase: 我卻不厭棄他們，也不厭惡他們
  target: 神厭惡以色列的難題（利26：30與26：44的張力）
- verse: 45
  phrase: 我卻要為他們的緣故記念我與他們先祖所立的約
  target: 亞伯拉罕之約
- verse: 46
  phrase: 這些律例、典章，和法度
  target: 典章
- verse: 46
  phrase: 是耶和華與以色列人在西乃山藉著摩西立的
  target: 摩西
