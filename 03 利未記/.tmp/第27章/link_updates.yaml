book: 利未記
chapter: 27
updates:
- title: 許願
  path: link_folder/文化/許願.md
  summary: v2「人還特許的願，被許的人要按你所估的價值歸給耶和華」，以下全章都是這句話的細則。GT《串珠聖經註釋》點出本章與上章的關係：「上章論及神向子民的『許願』，本章則論及以色列民向神許願的律例」，並說明立法的理由——「人通常比較容易在危急或困難時候向神許願，而事後卻後悔甚至不願還願」。GT《聖經精讀本》把制度的分寸講清楚：「不許願並不是罪。一旦許願，就應該誠實地按良心履行。」STEP 語言資料：v2「特許的願」的動詞是 פָּלָא 的 Hiphil（H6381，詞典義 to wonder），名詞「願」是 נֶדֶר（H5088），與 CT〔原文字義〕給的「奇妙的，卓越的，超凡的」方向一致。
  relation: 本章是利未記全卷許願條例最完整的一次頒布，涵蓋人、牲畜、房屋、田地四類許願對象，以及頭生、永獻、十分之一三類不可許之物。GT《舊約聖經背景註釋》把它放回時代背景：「古代近東大部分文化，都有關乎許願的資料。這些文化包括了赫人、烏加列、美索不達米亞，和埃及。願是自動與神明建立的協定……願通常是有條件的，並同時向神明祈求。」它並算出這種願有多罕見：贖價最高的五十舍客勒「達僱工年薪的多倍。由此可見許下這種願的人不多，因為願一旦許下，就不可不還」。
- title: 十分之一
  path: link_folder/原文/十分之一.md
  summary: 'v30-33「地上所有的，無論是地上的種子是樹上的果子，十分之一是耶和華的……凡牛群羊群中，一切從杖下經過的，每第十隻要歸給耶和華為聖」。STEP 語言資料：v30 與 v32 用的都是 מַעֲשֵׂר（H4643，詞典義 tithe），一次指地的出產、一次指牛群羊群；v32「杖」是 שֵׁבֶט（H7626G，詞典義 tribe: staff）。GT 丁良才指出這條例入律法很晚、實踐卻很早：「在摩西的律法上，本處以前沒有提到十分之一的條例，但自古以來，敬畏神的人就已經按十分之一捐給神（創十四20，二十八22）。」GT《啟導本聖經利未記註釋》列出舊約的三種什一奉獻：每年出產的十分之一給利未人、節期慶典中奉獻者自己享用的、以及每三年一次周濟窮人的。'
  relation: 本章把十分之一列為三類「不可再許」之物的最後一項——它本來就是神的，不能當成自己的奉獻再許一次。第32節「一切從杖下經過的」有實際做法可考，GT 丁良才記下猶太人的遺俗：「牧人要在放出的時候用杖點數，每數到第十只就用紅色點印，凡被點印的就是應歸耶和華的。」BH 讀出這個做法的用意：牲畜是在經過杖下的那一刻被選中的、不是由主人挑的，因此無法動手腳。至於十分之一該不該原封搬進新約，丁良才留下一段明確的保留：「新約上雖常提到信徒捐輸的本分，卻沒有一次規定十分之－為信徒捐輸的額數」，但他的結論不是少捐——「現在的信徒既然得了更高的名分，蒙了更大的恩典，也就應當在捐輸的事上比以色列人更熱心」。
- title: 舍客勒
  path: link_folder/原文/舍客勒.md
  summary: v3-7、16、25 全章的估價都以舍客勒計；v25「凡你所估定的價銀都要按著聖所的平：二十季拉為一舍客勒」。STEP 語言資料：「聖所的平」原文是 שֶׁקֶל הַקֹּדֶשׁ（H8255＋H6944G），「季拉」是 גֵּרָה（H1626）。GT《聖經精讀本》指出當時通行的舍客勒不只一種：「有三種：①只在聖所通用的舍客勒；②一般人通用的舍客勒；③王室使用的舍客勒。所以在希伯來社會，進行買賣時首先應商定用什麼樣的測量方法。」GT 丁良才另記下「季拉」的來歷：「『季拉』兩個字的原文，本是豆子的意思，後來卻成了一個法碼的名字。」
  relation: 本章是舍客勒作為估價基準最集中的一次使用，貫穿人、牲畜、房屋、田地四類奉獻對象，並在 v25 把基準一次訂死。KC 把這一節讀成全章的準則：「一切據以判斷的標準，就是聖潔的舍客勒，聖所的舍客勒，就是神居住之處的舍客勒。」至於聖所舍客勒與常用舍客勒的輕重之別，GT《舊約聖經背景註釋》明說沒有定論：「學者大致認為秤銀子所用的聖所舍客勒比常用的舍客勒為輕，但卻沒有確實的證據。考古學家挖掘到的舍客勒法碼，重量在九又十分之三至十又二分之一克之間。」
- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  summary: v28-29「但一切永獻的……都不可賣，也不可贖。凡永獻的是歸給耶和華為至聖。凡從人中當滅的都不可贖，必被治死」。CT〔話中之光〕：「『永獻』與『當滅』在希伯來文均用herem一字，指歸與神不能取回之物，與人奉獻給神的有別。」GT《啟導本聖經利未記註釋》說法相同，並舉出實例：「在以色列人歷史上，神指定某些戰利品或俘虜要完全歸祂，人不可佔有（書六17）。亞干的罪招神烈怒，正是因為取了永獻之物。」STEP 語言資料確認兩節用的是同一組字——名詞 חֵרֶם（H2764A）與動詞 חָרַם（H2763A），差別在語態：v28 是 Hiphil יַחֲרִם（人主動獻上毀滅），v29 是 Hophal יָחֳרַם（人被獻上毀滅）。
  relation: 本章是 herem 條例在利未記中的正式頒布，並被列為三類不可再作許願對象的「已屬神之物」之一。STEP 顯示的語態差別，正好對上 GT 丁良才對兩節的分工：「在28節是論各人隨意行的，在本節是論官長所可以行的。」同樣值得留意的是「不可贖」在兩節用了不同的字：v28 是 גָּאַל（H1350A，與本章房屋田地的贖回同字），v29 是 פָּדָה（H6299，詞典義 to ransom）。GT《舊約聖經背景註釋》列出落在 v29 範圍內的罪：「被判犯了拜假神（出二十二19）、違犯當滅之物的禁令（書七13～26）、謀殺（民三十五31～34），或故意觸犯潔淨禮儀（如赫人文獻）的人，不可贖回。」KC 則把它接到十字架：主耶穌「在祂於十字架上成為罪的那幾個小時裡，是在咒詛之下」。
- title: 頭生歸神
  path: link_folder/神學/頭生歸神.md
  summary: v26「惟獨牲畜中頭生的，無論是牛是羊，既歸耶和華，誰也不可再分別為聖，因為這是耶和華的」。GT 丁良才：「頭生的公牛、公羊原是屬耶和華的（出十三2，二十二29-30），所以不得再將這頭生的牲畜分別為聖。」他並交代這些牲畜的去向：沒有殘疾的獻為祭物、血灑壇的周圍、脂油燒在壇上；有殘疾的不得作祭牲，「乃要在自己家裡宰了吃，如同吃鹿，羚羊等獸的肉－般（申十五21-23）」，而且既是屬耶和華的，「也就不可再作俗用，如用牛耕地或剪羊毛等事」。
  relation: 本章把頭生的牲畜列為三類不可再許之物之首，理由只有一句——它本來就是耶和華的。KC 由此推出一個原則：「奉獻同時也是一種義務。我們不是自己的人，我們是『重價買來的』，因此有責任榮耀神。」BH 也指出這條規定的性質：「這種分別為聖不是自願的行為，而是神的命令」，並把它連到基督——「首生的、在一切被造的以先」（西1:15）。本章 v27 接著處理不潔淨牲畜所生的頭生，那一半見[[頭生歸神為聖]]。
- title: 頭生歸神為聖
  path: link_folder/歷史/頭生歸神為聖.md
  summary: v27「若是不潔淨的牲畜生的，就要按你所估定的價值加上五分之一贖回；若不贖回，就要按你所估定的價值賣了」。GT 丁良才指出本章的規定比舊例寬鬆：從前是「用羊羔贖驢，若不代贖，就要打折他的頸項（出十三13，三十四20）」，本章則「將這條例略加更改推廣，使這條例包括一切不潔淨之頭生的牲畜，神准物主用銀贖回，也准祭司賣與別人」，並推測原因是「因以色列人需要這些頭生的牲畜，也是因為當時已經有了會幕和祭司（先前沒有）的緣故」。GT《聖經精讀本》列出哪些算不潔淨的頭生：驢、駱駝、沙番、兔子、豬，並說把不潔的牲畜賣掉「是從自己的家中除去不潔」。
  relation: 出埃及記十三章定下頭生歸神的總則，本章補的是它最後一塊缺角——不潔淨牲畜所生的頭生該怎麼處理。STEP 語言資料：v27 的「贖回」用的是 פָּדָה（H6299，詞典義 to ransom），與本章房屋、田地、十分之一贖回所用的 גָּאַל（H1350A）不同，卻與出埃及記十三章贖頭生的用語同一系。本章 v26 談潔淨牲畜的頭生，那一半見[[頭生歸神]]。
- title: 三十舍客勒
  path: link_folder/互文/三十舍客勒.md
  summary: v4「若是女人，你要估定三十舍客勒」。GT 丁良才把這個數字的三處出現串起來：「女人的工價，不如男人的工價高，所以祭司所估定的贖價也不一樣，三十舍客勒本是奴婢的代價（出二十一32），也是猶大賣耶穌所得之價銀的數目（太二十七9）。」BH 也提到同一組數字：「在聖經歷史中，三十舍客勒同樣意義重大，因為那是猶大出賣耶穌的價錢（太二十六15），凸顯了估價與背叛之間的關聯。」
  relation: 本章把三十舍客勒放進一張估價表裡，使它從一個孤立的數字變成一套制度中的一格。KC 把這一格接到基督身上：「按祂的年齡，主耶穌本當被估價五十舍客勒。然而祂被估定的價銀只有三十舍客勒（亞十一12-13）。但那是人的估價。神卻按祂真實的價值估定了祂，並把祂放在自己右邊榮耀的位置上。」
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1「耶和華對摩西說」；v34「這就是耶和華在西乃山為以色列人所吩咐摩西的命令」——本章首尾都以摩西為中介。GT 丁良才指出 v34 的「這」字管的範圍比本章大得多：「本節的『這』字是指著利未記全書說的，顯明本書所記的－切命令和祭司承接聖職的事，以及諸節期的條例，都是神當以色列人住在西奈曠野的時候吩咐摩西的。」他並在 v3 下說明本章估價責任的移轉：「這『你』字，是指著摩西說的，因為這律例是曉諭摩西的，神也把實行這些律例的責任託付了他，摩西又將這事托與祭司。」
  relation: 這是利未記全書最後一次提到摩西，也是全卷的落款。KC 把本章讀成全書問題的答案：「這卷關於聖所的書，以我們個人和團體生活的奉獻作為結束……這是對本書一路提出的那個問題的回答——主啊，祢要我們如何與祢相交、如何事奉祢？」GT《啟導本聖經利未記註釋》則指出這一節的另一層作用：「本節也證明《利未記》的作者為摩西。」
- title: 禧年（第五十年）
  path: link_folder/原文/禧年（第五十年）.md
  summary: v17、18、21、23、24 五次出現禧年——本章 v16-24 整段田地估價都以禧年為時間座標。GT 丁良才指出一賀梅珥地的五十舍客勒「按猶太人的解法，這五十舍客勒是從禧年到禧年的價值」，並由此算出地價之低：攤到五十年，每年只合一舍客勒。BH 說明這個年份的性質：「禧年每五十年一次，是以色列得釋放與復原的時候。那一年債務得免、奴僕得釋、地業歸回原主。」
  relation: 這是禧年制度在利未記中最後一次出現，也是它唯一一次被用作奉獻估價的計時基準。禧年在本章決定的是兩件相反的事：承受為業的地若沒贖回，禧年一到就永久歸祭司（v21）；買來的地則在禧年歸回原賣主（v24）。GT《舊約聖經背景註釋》把這個分野說明白：「物業估價和支配時又需顧慮到的因素，還有禧年的問題。惟有屬於業主但沒有贖回的地，才會至終成為祭司的永久產業。」
- title: 禧年土地贖回計算法（按距禧年年數定價）
  path: link_folder/主題/禧年土地贖回計算法（按距禧年年數定價）.md
  summary: v18「祭司就要按著未到禧年所剩的年數推算價值，也要從你所估的減去價值」；v23「祭司就要將你所估的價值給他推算到禧年」。GT 丁良才把算法寫成通則：「通以能種一賀梅珥種子，從禧年到禧年的定價，五十舍客勒的比例為準則估定價值，倘若在禧年以後將地分別為聖，祭司就須按已過的年數計算減價。」BH 的說法一致：「田地的估價與下一個禧年前剩餘的年數直接相關。年數越少，估價越低。」
  relation: 利未記二十五章這套算法原本管的是土地買賣，本章把它整套搬到奉獻估價上——同一個公式，換了用途。差別在於買賣的價格付給賣主，奉獻的估價付給聖所；而 v23 另有一條買賣沒有的規定，丁良才指出所買之地必須「當日」付清估價銀，理由是原主從賣地起到禧年都有隨意贖回的權利，「倘若許願的人未曾交齊祭司所估的價銀，就于原主贖地的權利有礙」。
- title: 古代近東法典
  path: link_folder/背景/古代近東法典.md
  summary: v2-8 的年齡性別估價表。GT《舊約聖經背景註釋》指出這種按條件定額的做法在鄰邦法典裡是常見體例：「吾珥南模法典，以及埃施嫩納和漢摩拉比法律中，按照被害人所受的傷害、年齡、社會地位和性別規定罰款的人身傷害條例，都與之相近。」
  relation: 本章有四處可以對到古代近東的法律與宗教文獻，GT《舊約聖經背景註釋》逐項給出：許願制度本身「古代近東大部分文化，都有關乎許願的資料。這些文化包括了赫人、烏加列、美索不達米亞，和埃及」；祭牲潔淨與否的檢定「在赫人和美索不達米亞的儀式中也很常見」；祭司持有地產「赫人、埃及和美索不達米亞的文獻，證明了廟宇團體擁有土地，並且藉其出產得利」；以及不可贖之罪的清單，其中「故意觸犯潔淨禮儀」一項它明白註明對照的是赫人文獻。值得留意的是同一則註釋在祭司地產一項上點出以色列的不同：「在聖經裡，惟有在業主未能贖回土地的情況下，這種事才會發生。」
