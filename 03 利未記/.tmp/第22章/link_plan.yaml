- name: 聖物
  suggested_type: 主題
  evidence: STEP語言資料顯示 קֹדֶשׁ（qo.desh，詞典義 holiness）在本章前半出現 10 次——v2 兩次、v3、v4、v6、v7、v10
    兩次、v12、v14，是 1-16 節的核心名詞。CT：「『聖物』指用來獻給神的祭物，其中不須用火焚燒的則可歸祭司享用。」丁良才：「以色列人所獻的祭物中雖有歸祭司的份，祭司究竟不能隨意取吃，他們身上有污穢的時候就當遠離這些聖物，直等到他們潔淨了。」BH
    於 v7 指出這些祭物同時是祭司的口糧，因為祭司在以色列諸支派中沒有地業。丁良才另列出吃至聖物與吃聖物各自的三重限制。
  match_type: exact
  existing_title: 聖物
  existing_path: link_folder/主題/聖物.md
- name: 獻祭不蒙悅納
  suggested_type: 神學
  evidence: STEP語言資料顯示 רָצוֹן（ra.tzon，詞典義 acceptance）在 v19、v20、v21、v29 共出現 4 次；其中
    v19 與 v29 帶第二人稱複數字尾（li/r.tzo.ne./Khem，逐字解 for your acceptance），也就是蒙悅納的是獻祭的人而不是祭物本身。CT
    在 v25 註中留下同一個觀察：「『不蒙悅納』的原文作『不為你們蒙悅納』」，丁良才並就這個「你們」指以色列人或指祭司列出兩種讀法。GT《舊約聖經背景註釋》指出不同的祭對合格祭物有不同等級的要求；KC：「一份出於純潔之心的殘缺祭物，神看重它過於因懼怕而完全不獻。」
  match_type: exact
