book: 利未記
chapter: 21
updates:
- title: 祭司不可為死人哀哭（居喪條例）
  path: link_folder/主題/祭司不可為死人哀哭（居喪條例）.md
  summary: v1-6,10-12 祭司不可為民中的死人沾染自己，除非為骨肉之親的父母兒女弟兄和未出嫁的處女姊妹；大祭司則更嚴格，連父母之死也不可沾染，不可蓬頭散髮、不可撕裂衣服、不可出聖所。與利10:6-7亞倫、以利亞撒、以他瑪不可為拿答亞比戶之死蓬頭散髮撕裂衣服同一原則，本章訂為祭司世世代代的定例。
  relation: 本章是此居喪條例最完整的陳述，區分一般祭司（可為至親沾染）與大祭司（連父母也不可）兩個等級。STEP語言資料顯示 v10「不可蓬頭散髮」用 פָּרַע（pa.ra，he will let loose）、「不可撕裂衣服」用 פָּרַם（pa.ram，he will tear），正是利10:6 禁止亞倫父子做的那兩個動作，本章把當時的一次性吩咐訂成世世代代的定例。例外名單裡沒有妻子，丁良才留下兩條線索：迦勒底譯本把「骨肉之親的」譯作「妻子，就是骨肉之親」，且「神特特地禁止祭司以西結為妻子弔喪，或者是因為在尋常的時候，祭司可以為妻子弔喪（結二十四16-18）」；GT 串珠則認為「妻子的地位特殊，她已與丈夫同為一體，故毋須提出」。
- title: 受膏的祭司
  path: link_folder/人物/受膏的祭司.md
  summary: v10「在弟兄中作大祭司、頭上倒了膏油、又承接聖職，穿了聖衣的」。GT丁良才：在大祭司的頭上倒了膏油，就是膏大祭司和膏眾祭司的特別不同處，神膏油的冠冕在大祭司頭上（v12）。
  relation: 本章詳列受膏大祭司比一般祭司更嚴格的居喪與婚姻要求。STEP語言資料顯示 v10「承接聖職」的原文直譯是「他填滿了他的手」（מָלֵא ma.le ＋ יָד yad）。KC 指出大祭司的聖潔標準對應拿細耳人的條例（民6:1-7），並把「在弟兄中作大祭司」連到主耶穌「在許多弟兄中作長子」（羅8:29）與「從死裡首先復生的」（西1:18）。丁良才澄清「不可出聖所」不是要他常住聖所，而是「不可因骨肉之親去世或出殯，停止供大祭司的職任」。
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: v1,16「耶和華對摩西說」，摩西是本章祭司聖潔條例（居喪、婚姻、殘疾限制）的唯一傳達者。
  relation: 本章延續摩西向亞倫和他兒子（祭司）傳達耶和華祭司專屬條例的角色，緊接利18-20章對全體以色列人的條例之後。
- title: 聖潔
  path: link_folder/神學/聖潔.md
  summary: 本章是祭司專屬的聖潔法典。STEP語言資料顯示「使成聖」的 קָדַשׁ（qa.dash）Piel 分詞在 v8 出現兩次（「你要使他成聖」、「我使你們成聖的耶和華」）、v15 與 v23 各一次，主詞每一次都是神；CT 也數過：「經文中曾三次提及使人成聖的神(參8，15，23節)。」
  relation: 本章把聖潔要求分成三層。GT 丁良才：「以色列眾人都要歸耶和華為聖（十八1至十九37），祭司更是如此（1-9），大祭司卻還要比眾祭司更聖（10-15）」；GT 串珠把21至22章合看為「祭司及祭物的聖潔」，並指出「他們是要歸神為聖的（6），百姓也要以他們為聖（8）」。BH 於 v8 補上這份聖潔的來源——祭司的聖潔不是他自身固有的，而是出於神的任命與分別。
- title: 沒有殘疾的祭牲
  path: link_folder/神學/沒有殘疾的祭牲.md
  summary: STEP語言資料顯示本章 v17、v18、v21（兩次）、v23 共 5 次使用 מוּם（mum，詞典義 blemish），正是祭牲條例所用的「殘疾」一詞——本章把同一個標準用在獻祭的人身上。
  relation: GT 啟導本直接把兩者並列：「進入聖所侍奉的祭司，應象所獻的祭牲一樣，在身體上沒有殘疾。」GT 丁良才給的第二個緣故是同一條原則：「神的祭司必須完全，因為一切歸給神的必須純全無疵（二十二17-25）。」獻上的與獻祭的受同一個標準檢驗。
