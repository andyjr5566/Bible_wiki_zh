  path: link_folder/人物/摩西.md
  summary: 本章一再說河東的產業是摩西所分：第8節稱「耶和華的僕人摩西在約但河東所賜給他們的」，第15、24節說「摩西按著流便支派的宗族分給他們產業」「摩西按著迦得支派的宗族分給他們產業」，第29節說「摩西把產業分給瑪拿西半支派」，第32節總結是摩西在摩押平原所分；第33節則說利未的產業不是摩西給的。
  relation: GT《聖經精讀本》說稱摩西為「耶和華的僕人」暗示分配河東之地合乎神旨意；KC 說第13節沒有趕逐基述人、瑪迦人，不是因為摩西，而是因為百姓不忠。
