- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第1節「約書亞年紀老邁」，耶和華說還有許多未得之地，吩咐他照著吩咐拈鬮分給九個半支派。CT 用迦勒的年紀推算，說他當時至少八十五歲至九十歲之間；GT《啟導本》說年近百歲；GT《研經資料》說他距離死亡還有二十年以上。
  relation: 本章把約書亞的任務從征服轉到分地。CT 與 GT《綜合解讀》都說留下未得之地不是因為他年老不能打仗，而是神定意漸漸趕出；KC 則反問他是否也沉進了安歇。
