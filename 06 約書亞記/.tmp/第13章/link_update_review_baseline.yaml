- title: 米甸的五王
  path: link_folder/歷史/米甸的五王.md
  definition: '民31:8 列出五個被殺的米甸王：以未、利金、蘇珥、戶珥、利巴。


    **他們其實是首領，不是獨立王國的君王。** CT：「『米甸的五王』指原屬亞摩利王西宏轄下的米甸首領(參書十三21)」。GT 丁良才說得一樣：「這些王不過是首領，按書十三21節，是屬亞摩利王西宏所管。」GT《聖經精讀本》補上一句：「他們各自在自己的領土上擁有獨立的行政體系。」KingComments
    也指出民25:15 稱蘇珥為「首領」，書13:21 用的則是酋長一類的字。


    **其中一個名字在民數記出現過。** 蘇珥就是哥斯比的父親——CT 在此註明「『蘇珥』他的女兒哥斯比曾引誘以色列人心利犯姦淫，結果被非尼哈刺死(參二十五14~15)」。換句話說，非尼哈在民25
    刺死的女子的父親，在民31 由非尼哈帶領的軍隊殺了。


