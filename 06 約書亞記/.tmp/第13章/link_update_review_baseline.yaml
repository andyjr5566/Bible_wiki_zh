- title: 亞實突
  path: link_folder/地點/亞實突.md
  definition: '亞實突與迦薩、迦特一起出現在書11:22，是亞衲族人得以存留的三座城之一。


    CT 的原文字義給「亞實突」強而有力的，並把它與迦薩、迦特並列為地中海沿岸屬於非利士人的地方；CT 並說當時神沒有命令以色列人攻打非利士人，到大衛王的時代才被以色列人征服。GT《約書亞記研經資料》說「亞實突」字義是「強而有力的」，是非利士人的一個主要城市，位於地中海沿岸、耶路撒冷西邊，即現在的
    Esdud。GT《啟導本》說這裡所舉迦薩等城為當日非利士人所居，非利士人到大衛時代才被以色列人控制。


    BH 說 These coastal cities remained in Philistine territory and lay beyond the
    areas secured during Joshua''s campaigns（這些沿海城市留在非利士人的境內，位於約書亞戰役所鞏固的範圍之外），並說以色列的產業雖由神所賜，餘下的仇敵仍需要持續的信心、順服與倚靠。'
