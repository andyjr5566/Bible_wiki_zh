- title: 拈鬮分地（go.ral）
  path: link_folder/主題/拈鬮分地（go.ral）.md
  definition: '民數記26:52-56 交代分地的原則：人數多的多分、人數少的少分，但地點由拈鬮決定。


    **兩個原則並用。** GT《民數記串珠聖經註釋》整理得最清楚：「分配地業是根據兩個原則：１ 按以上統計的人數，人數多的支派便多分地業；２ 地點的選擇卻用拈鬮作出決定，以免支派間因地理環境、土質不同而產生爭執。」CT
    說得更實務：「意指按照拈鬮決定地點，然後視人數多寡而調整大小。」GT 丁良才《民數記註釋》一句話概括：「分地的時候，一按人數定多少，二按拈鬮定方向。」


    **「拈鬮」在原文是什麼。** STEP 顯示民26:55 是 be./go.Ral（H1486，簡要義域 go.ral: allotted），本節譯義是
    by lot。CT〔原文字義〕給的答案很具體：「拈鬮」小鵝卵石。同段的「產業」是 be./na.cha.Lah（H5159，簡要義域 na.cha.lah:
    inheritance），「支派」則是 ma.tot-（H4294H，簡要義域 mat.teh: tribe）。


    **為什麼用拈鬮。** GT 串珠：「拈鬮在當時是尋求神旨意的一個方法（箴16:33）。」GT《聖經精讀本》列了兩個理由：「①認識到自己所得的地是神預備的;②避免因土地的好壞而有什麼不滿或爭鬥。」它並補上一句限定：這個制度是神暫時使用的方法之一，特別是在聖經完成之後已經失去了功效。GT
    丁良才則記下以色列人的實際態度：他們認為拈鬮所定的就是耶和華所定的，並引箴16 與徒1:26 為據。


    **古代近東也這樣分地。** GT《舊約聖經背景註釋》給了一條外部平行：「用拈鬮的方式分配土地，作決定的權利就歸於神。在美索不達米亞，* 馬里的君王也是用這方法將封地分配給藩屬和退伍者。」BH
    說在古代近東拈鬮是常見的決策方式，並引撒上10:20-24 選掃羅、徒1:26 選馬提亞作平行。


    **CT 的一句話。** CT〔話中之光〕：「『拈鬮分地』表示神的主權。神作事的原則，一面視各人配合的情況，一面卻又在乎祂主權的安排。」'
