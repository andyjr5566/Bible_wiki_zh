- title: 巴力的高處（Bamoth-baal）
  path: link_folder/地點/巴力的高處（Bamoth-baal）.md
  definition: '民數記22:41：「到了早晨，巴勒領巴蘭到巴力的高處；巴蘭從那裡觀看以色列營的邊界。」


    **原文是一個地名。** STEP 原文資料顯示，民22:41 的「巴力的高處」在原文是兩個詞（ba.Mot，H1120H）與（Ba.''al，H1168I），STEP
    的形態碼把兩者都標為專有地名（HNpl），簡要義域分別是 Bamoth 與 (Bamoth)-baal。BH 也直接把它當地名處理，譯作 Bamoth-baal，並說它字面指的是巴力的眾高處。


    **它在哪裡。** GT《啟導本聖經註釋》說「巴力的高處」可能就是民21:19～20 所說的巴末，位於底本附近（書13:17）；GT《民數記串珠聖經註釋》說是尼波山附近的山丘。GT《舊約聖經背景註釋》則保留：所在不明，部分學者認為在王道上的亞珥北面二十五至三十哩處，也有學者認為還要更北、更接近以色列人安營的地點。


    **巴勒為什麼挑這裡。** BH 說高處被認為離神明更近，是古代常見的敬拜地點。KC 讀出另一層用意：從這個位置巴蘭看不到全民，只看得到一部分，這必定給他一種印象，以為自己面對的只是一支小小的民族。CT
    則列出兩種解法：一是從山丘上可以觀看到以色列營最遠處的營盤，二是僅能觀看到最近處的營盤。'
