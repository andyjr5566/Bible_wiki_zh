- title: 伯耶西末
  path: link_folder/地點/伯耶西末.md
  definition: '書12:3 描述西宏地界的西南一段：「又到亞拉巴的海，就是鹽海，通伯耶西末的路，以及南方，直到毘斯迦的山根。」STEP 原文資料顯示這個地名是
    beit ha/y.shi.Mot（H1020，簡要詞典義 bet hay.shi.mot: Beth-jeshimoth），在原文裡由兩個字組成。


    **位置。** CT 說伯耶西末位於死海的東北端，原文字義是「荒蕪之家」。GT《串珠聖經注釋》說伯耶西末近死海東北岸，並指出本節應譯作「就是鹽海，東邊通伯耶西末……」。GT《約書亞記研經資料》說它位於耶利哥對面不到二十公里處。


