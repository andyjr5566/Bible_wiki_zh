- title: 瑪吉
  path: link_folder/人物/瑪吉.md
  definition: '瑪吉是瑪拿西的兒子。民數記32:39-40 說他的子孫往基列去，佔了那地，趕出那裡的亞摩利人，摩西就把基列賜給他，他的子孫從此住在那裡。


    **他在家譜裡的位置決定了整個支派的規模。** CT 把瑪拿西一族算了一遍：「『瑪吉』是瑪拿西唯一的兒子，瑪吉又僅有一個兒子基列，而基列生了六個兒子，這樣，瑪拿西的子孫共有八個家族，由一個兒子、一個孫子、六個曾孫組成(參二十六29~32)，這裡是指瑪吉家族，不同於其他七個家族。」CT
    給的名字字義是「賣出」。


    GT 丁良才《民數記註釋》把名字寫作「瑪姬」，並補上本章沒交代的兩件事：「這人早已去世，他的兒子被養在約瑟的膝上（創五十23），他的子孫很有名聲。瑪拿西只有一個兒子，名叫瑪姬，所以一切的瑪拿西人，原是瑪姬的後裔。」他也給了一個性格上的判斷：「瑪姬人最有勇敢、好冒險。」


    BH 的說法是：瑪吉是瑪拿西的長子，瑪吉的後裔以力量與英勇著稱，這反映在他們奪取領土的能力上。


    **原文層。** STEP 顯示民32:39 的「瑪吉」是 ma.Khir（H4353G）。同一節有兩個動詞：「佔了」是 la.khad（H3920，簡要詞典義
    to capture），「趕出」是 ya.rash（H3423H，簡要詞典義 to possess），後者是 Hiphil，也就是使那裡的人失去產業。'
