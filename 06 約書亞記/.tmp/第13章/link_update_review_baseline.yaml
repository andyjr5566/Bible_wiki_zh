- title: 蘇珥（米甸首領）
  path: link_folder/人物/蘇珥（米甸首領）.md
  definition: '民數記25:15：「這蘇珥是米甸一個宗族的首領。」


    **STEP 給的資料。** 原文是 Tzur（H6698G），morphology 是 HNpm（專有名詞．陽性）。同節描述他身分的是 rosh ''u.Mot
    beit-''av（H7218H＋H523＋H1004M＋H1G），本節譯義是 a leader of tribes, a house of a father。CT〔原文字義〕給名字的字義是：「蘇珥」磐石。


    **他是米甸五王之一。** CT〔文意註解〕說：「蘇珥是米甸五王中的一位（參三十一8）」；GT 丁良才《民數記註釋》說的是同一件事：「按三十一8節，蘇弭為米甸五王中的一位。」


    **為什麼要記他。** BH 說蘇珥被指為米甸人中的領袖，這顯示以色列與米甸之間的結合帶著政治與社會層面的意涵，也顯示米甸人並非事件中的偶然角色，而是主動把以色列引入罪中。它並說領袖一詞顯示米甸有組織的社會結構與區域影響力：他們不只是遊牧群體，而是有既定領導與影響力的一方。


    **這條線接到民31。** 兩套來源都指向同一處：CT 與丁良才都引民31:8，那裡記載米甸五王被擊殺。民25:17 神吩咐擾害米甸人，正是這件事的開端。'
