- title: 逐漸趕出
  path: link_folder/神學/逐漸趕出.md
  definition: 出二十三29-30：神不在一年之內將迦南人攆出去，「恐怕地成為荒涼，野地的獸多起來害你」，而要漸漸攆出，「等到你的人數加多，承受那地為業」。CT
