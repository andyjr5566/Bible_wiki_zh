- title: 瑪哈念
  path: link_folder/地點/瑪哈念.md
  definition: 希伯來文「瑪哈念」意為「二軍兵」、「兩隊」、「兩個軍營」。位於雅博河北、基列地區、迦得支派境內（書13:26, 21:38），後成為利未人城、伊施波設立國之所（撒下2:8-9）。
  development: '### 它在哪裡：四家四說


    第2節雅各給那地方起名叫瑪哈念。至於這地在哪裡，來源之間並不一致——GT 丁良才《創世紀註釋》說「這城在雅博河北，迦得人之地的境內，離瑪拿西人之地的交界不遠，後來成了利未人的城」；GT《啟導本聖經創世記註釋》說「地在基列北部，雅博渡口以北」；GT《聖經精讀本──創世記註解》說「這個地方位於迦累得和雅博河之間」；而
    GT 華爾頓《創世記背景註釋》最保留——「此地的位置雖然未能確定，卻是迦得支派屬地中頗為重要的城市（見書十三26、二十一38；撒下二8-9）」。


    前三家都在雅博河一帶找它，只是南北不同；華爾頓則直接說位置不確定。可以確定的是它的重要性——BH 指出瑪哈念後來成為大衛逃避押沙龍時的避難所（撒下十七24）。


    ### 「兩隊」指哪兩隊


    名字的意思四家一致（兩個軍營／兩隊軍兵），指涉卻有兩說。CT 列出兩種可能：一是兩隊或兩營都是指神的使者；二是一隊是雅各自己的妻兒僕婢，另一隊是神的使者，而通常這一隊是眼睛所看不見的（比較王下六15-17）。


    GT《創世記雷氏研讀本》採第二說：「瑪哈念」的意思是「兩倍軍兵」，指使者的軍兵和雅各的同行者。GT《串珠聖經註釋》採第一說的變體：就是兩個軍團或二營士兵，故雅各可能看見一大群神的使者，多如大軍。GT《聖經精讀本──創世記註解》給的是第三種：神的使者分成兩支隊伍，左右圍繞雅各一行、護衛他們。KC
    兩說並存——雅各看見一隊天使在前、一隊在後，或是左右各一隊；無論哪一種，他都被神的保護環繞。


    ### 一個容易錯過的呼應


    第7節雅各把家人「分做兩隊」，用的正是「瑪哈念」的字義（CT）。他剛看見神的兩隊軍兵，轉頭就用自己的兩隊來自保。CT 的判語是：肉眼不再看見天使，他就懼怕起來，想用自己的計謀來保護自己。


    第10節的禱告裡他自己說出了同一個詞：「我先前只拿著我的杖過這約旦河，如今我卻成了兩隊了。」KC 指出這句話是在暗指第1-2節所見的兩隊天使——雅各把自己的家業歸給神。同一個「兩隊」在本章出現三次，分別是神的、他自保的、和他歸給神的。


    ### 給地方起名這件事


    GT 華爾頓《創世記背景註釋》指出，在列祖時代的記述中，給發生特別事件的地點冠以名字是頗為常見的作法，若牽涉到神之顯現尤然（見創十六14、二十一31、二十六20、33、二十八19）——「它是這地點有神之臨在的憑證」。伯特利就是例證：亞伯拉罕曾經在此築壇，雅各亦在此經歷神之顯現，它後來成為重要的崇拜地點。本章的瑪哈念與毗努伊勒（30節）是同一套作法在同一章裡的兩次施行。'
