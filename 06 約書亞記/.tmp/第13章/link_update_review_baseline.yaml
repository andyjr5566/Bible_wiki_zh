- title: 迦南四境
  path: link_folder/主題/迦南四境.md
  definition: '民數記34:2-12 把應許之地的四面邊界一次畫完。神說「你們到了迦南地，就是歸你們為業的迦南四境之地」，接著逐段給出南、西、北、東四界。


    | 方向 | 節次 | 界線上的地標 |

    |---|---|---|

    | 南界 | 3-5 | 尋的曠野、以東的邊界、鹽海東頭、亞克拉濱坡、尋、加低斯巴尼亞、哈薩亞達、押們、埃及小河，直到海 |

    | 西界 | 6 | 大海（地中海）一線 |

    | 北界 | 7-9 | 大海、何珥山、哈馬口、西達達、西斐崙、哈薩以難 |

    | 東界 | 10-12 | 哈薩以難、示番、亞延東邊的利比拉、基尼烈湖東邊、約但河，通到鹽海為止 |


    **南界與東界都收在鹽海。** 民34:3 的南界從「鹽海東頭起」，民34:12 的東界「通到鹽海為止」——同一片水既是起點也是終點。KingComments
    注意到這個首尾呼應，並指出鹽海是所多瑪、蛾摩拉被毀的長久提醒。


    **原文的兩個「邊界」是不同的詞。** STEP 顯示民34:2 的「四境」是 li/g.vu.lo.Tei./ha（H1367，詞典形 ge.vu.lah，簡要詞典義
    border），而第3、6節逐段說「南界」「西界」時用的是 ge.Vul（H1366G，簡要詞典義 border: boundary）——一個是整體的四圍，一個是逐段的界線。


    **方位詞也有原文的味道。** STEP 顯示民34:6「西邊」是 Yam（H3220H，簡要詞典義 sea: west）——希伯來文的「西」就是「海」；民34:3「南角」是
    pe.''at Ne.gev（H6285 詞典形 pe.ah，簡要詞典義 side ＋ H5045H 詞典形 ne.gev，簡要詞典義 south）。KingComments
    則把南界讀作「右邊的那一區」，並由此接到主耶穌坐在高天至大者的右邊（來1:3）。


    **這一段接在行程表後面是有理由的。** GT《民數記串珠聖經註釋》說得直接：「迦南地是出埃及旅程之目的地；繼上一章的旅途紀錄之後，本章將注意力放在迦南地，是最適合不過的了。」


    CT 在靈訓要義裡把四界讀成基督之愛的四個度量——南界的曠野是「闊」、西界的海岸是「長」、北界的高山是「高」、東界的深谷與死海是「深」（弗3:18）。這是
    CT 獨有的讀法。'
