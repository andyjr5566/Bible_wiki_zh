- title: 黑門山
  path: link_folder/地點/黑門山.md
  definition: '黑門山是以色列從兩個亞摩利王手中奪來之地的北界（申3:8）。


    **基本資料。** CT：「『黑門山』位於利巴嫩之南，南北蜿蜒約達八十公里山脈中的最高峰，約有三千公尺高，長年積雪，峰頂現仍有巴力廟的遺址。」GT《雷氏研讀本》：「“
    黑門山”。高約九千二百英尺（2,800米）。這冰封的山峰形成以色列人從亞摩利人奪取之地的北界。」GT《啟導本》：「黑門山位於巴勒斯坦東北，山脈連綿30公里，山頂終年積雪。」


    **三個名字。** 第9節是一句插敘：「這黑門山，西頓人稱為西連，亞摩利人稱為示尼珥」。


    | 稱呼的一方 | 名字 | 原文（STEP） | CT 原文字義 |

    |---|---|---|---|

    | 經文正文 | 黑門 | cher.Mon（H2768） | 聖所 |

    | 西頓人 | 西連 | sir.Yon（H8303） | 護胸甲 |

    | 亞摩利人 | 示尼珥 | se.Nir（H8149） | 雪山 |


    三處的動詞都是 yik.re.''U（H7121H，qa.ra，稱呼）。GT《啟導本》另提第四個名字：「黑門山、西連、示尼珥和西雲山（四48），可能都是同一山脈的著名山嶺（參代上五23）。」


    **這座山原本的宗教身分。** GT 李道生《舊約聖經問題總解》：「以色列人未得迦南以先，黑門山為敬拜巴力之聖山，至今最高峰頂，尚有巴力廟之基址遺留。這座廟或為以色列人進入迦南時所毀。古時山腳四圍有廟，門都開向峰頂，拜巴力的人每年來朝，與佛教朝山無異。」


    **它在後來聖經裡的角色。** 李道生同一段：「約但河發源於此山，約書亞戰勝迦南人時，以此山為北界（書十一17，十二5，十三5，士三3，代上五23）。山頂夜露極多，與別地降下小雨相似，詩人嘗以這山的甘露為甘美、豐足的稱喻（詩百卅三3），也豫言黑門山必因耶和華的名歡呼（詩八九12）。」BH
    的方向相同：「In biblical literature, Mount Hermon is often associated with fertility
    and abundance, symbolizing the richness of the land God provided to Israel.」（在聖經文獻裡，黑門山常與豐饒富足連在一起，象徵神賜給以色列之地的豐美。）BH
    並指出它與新約登山變像的傳統有關；李道生寫得更直接：「主耶穌基督曾在這山頂上變了形像，臉面明亮如日頭，衣裳潔白如光（太十七1－8）。所以這山雖曾是拜偶像的所在，後來卻變成了信徒與主相聚的地方。」'
  development: '黑門山在申命記裡是名字的問題，到約書亞記變成界線的問題。


    申3:8 用「亞嫩谷直到黑門山」總結以色列在約但河東實際控制的南北兩端，申3:9 接著插一句括號：西頓人稱這山為西連，亞摩利人稱它為示尼珥。申4:48 又加一個——西雲山，CT
    指出這個名字全聖經只出現這一次。同一座山有四個名字，本身就說明它同時被幾個民族看在眼裡。


    書11 是它第一次落在約但河西的敘事裡，而且落了兩次。書11:3「黑門山根米斯巴地的希未人」加入北方聯軍，書11:17「黑門山下利巴嫩平原的巴力迦得」是約書亞所奪之地的北端。也就是說，申3
    用黑門山標出河東征服的北界，書11 用同一座山標出河西征服的北界——兩次都是終點，只是換了一邊。


    各家給的數字並不一致。CT 說它位於利巴嫩之南、是南北蜿蜒約達八十公里山脈中的最高峰，約有三千公尺高；GT《啟導本》在書11 給的是海拔2813公尺、山脈全長33公里；GT《聖經精讀本》在申4
    說希伯來人據其高度（海拔2850米）稱為西雲。高度大致相近，山脈長度差距頗大，但方位的認定一致：它是北方的極點。'
