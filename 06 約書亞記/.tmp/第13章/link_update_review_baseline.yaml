- title: 利巴嫩
  path: link_folder/地點/利巴嫩.md
  definition: '第25節摩西求神容他過去看的，是「約但河那邊的美地，就是那佳美的山地和利巴嫩」。


    **名字與原文。** CT 原文字義：「利巴嫩」潔白。STEP 顯示是 ve./ha./le.va.Non（H3844G）。


    **它在哪個方向。** BH：「Lebanon, known for its majestic cedar trees, was located to the
    north of Israel.」（利巴嫩以壯麗的香柏樹著稱，位於以色列以北。）CT 在第8節說黑門山「位於利巴嫩之南」；GT《啟導本》在同一節說黑門山「為黎巴嫩境內最壯觀的一座大山」——兩家用不同方式把這兩個地名扣在一起。


    **它象徵什麼。** BH：「It was renowned for its natural beauty and resources, often symbolizing
    strength and majesty in biblical literature (Psalm 92:12).」（它以自然美景與資源聞名，在聖經文獻裡常象徵力量與威嚴（詩92:12）。）


    **它不在原本要分的地界內。** BH：「Although not part of the initial territory given to Israel,
    Lebanon''s mention here reflects the broader vision of the land''s beauty and
    potential. It also foreshadows the future expansion and influence of Israel under
    kings like David and Solomon.」（雖然利巴嫩不屬於最初分給以色列的地界，摩西在這裡提到它，反映的是對這塊地之美與潛力的更大視野，也預示了以色列日後在大衛、所羅門等王之下的擴張與影響力。）摩西想看的，比他被分派要帶百姓進去的還多。'
  development: '利巴嫩在前面幾章一直是一條沒有走到的線，到書11 才第一次有人站在它下面。


    申3:25 摩西求神容他過去看「那佳美的山地和利巴嫩」——BH 指出它並不在最初分給以色列的地界之內，摩西提到它反映的是對這地之美與潛力的更大視野。申11:24
    與書1:4 把它排進四界清單，功能只剩北邊的一條線；書1 那一次還帶出一個異文問題，GT《研經資料》指出七十士譯本和武加大譯本等都沒有這個字。書9:1「並對著利巴嫩山沿大海一帶的諸王」是第一次寫到住在那個方向的人採取行動。


    書11:17 是這條線被走到的一刻：約書亞所奪之地的北端是「黑門山下利巴嫩平原的巴力迦得」。BH 說從哈拉山到巴力迦得的距離顯出這片地的幅員，神讓祂的百姓在極不相同的地形上得勝，從乾旱的南方一直到利巴嫩肥沃的谷地。


    但兩層意義並沒有合而為一。摩西求看的那片佳美山地本來就在分地界外，書11 到達的是它的南緣入口，而不是它的全部。'
