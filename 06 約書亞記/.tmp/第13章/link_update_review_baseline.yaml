- title: 疏割
  path: link_folder/地點/疏割.md
  definition: 希伯來文「疏割」（Succoth）意為「棚」、「帳棚」、「窩」（創33:17）。位於約但河東、雅博河北約16公里的山谷地帶（書13:27；士8:4-16），後屬迦得支派。考古學家依埃及示撒石碑及銅石器時代至鐵器時代II期文物，將其遺址比定為代爾阿拉遺址。雅各與以掃和好後未隨以掃往西珥，改往北至疏割，蓋房搭棚、長住數年（女兒底拿從6-7歲長到亭亭玉立，暗示住了十年左右），乃雅各回迦南後首個長期停留地。
  development: '### 它在哪裡


    各家給的位置一致：約但河以東、雅博河口附近。GT 丁良才《創世紀註釋》說「這地在約但河東（書十三27-28；士八4-5），後來屬於迦得支派」；GT《啟導本聖經創世記註釋》與
    GT《創世記雷氏研讀本》都說在雅博渡口以北；GT《串珠聖經註釋》較保留——「正確地點不詳，大概是在雅博河南邊」；GT《聖經精讀本──創世記註解》給了距離：「位於雅博渡口北16km，約旦河東邊的山谷地帶（書十三27；士八4-16）。」


    串珠的「雅博河南邊」與其餘各家的「雅博渡口以北」方向相反，這是本條目要並陳的一處分歧。


    ### 考古上的落點


    GT 華爾頓《創世記背景註釋》給了本條目唯一的實地考證：疏割是約但河東鄰近雅博河注入約但河之處的城鎮（士八5）；好幾位考古學家根據埃及的記錄（示撒石碑〔Stele
    of Shishak〕），以及源自銅石器時代（Chalcolithic Age）至鐵器時代第二期（Iron Age II）的文物，考證其遺址在代爾阿拉遺址（Tell
    Deir ''Alla）。


    他並把地名與當地生活形態接了起來：疏割名字的意思是「棚」，「用來形容這地區遊牧民族和礦工（在鐵器時代第一期的文化層，找到金屬提煉的證據）混合組成之人口所用的臨時住處，很是合適」。


    ### 一個名字裡的矛盾


    第17節：「雅各就往疏割去，在那裏為自己蓋造房屋，又為牲畜搭棚；因此那地方名叫疏割（就是棚的意思）。」


    地名取自「棚」——臨時住處；但同一節說雅各在那裡「蓋造房屋」。CT 抓住這個落差：蓋房屋「是表明他要在那裏長住」；他並推算住了多久——雅各可能在疏割住了不少年，因為女兒底拿那時可能只有六、七歲（參創三十21），但是到了示劍時已是一個亭亭玉立的少女了（參創三四1-2）。GT《創世記雷氏研讀本》給的數字是「可能在疏割停留了十年才前往示劍去」。


    一個叫「棚」的地方，他卻蓋了房子住了十年。這是本節文字層面最值得留意的一點（見[[疏割居住是否屬靈倒退]]）。


    ### 他為什麼停在這裡


    CT 判得最重：疏割明顯不是神呼召他回去的目的地——「神並未說祂是『疏割的神』，而說祂是『伯特利的神』（參創三一13），故此，雅各往疏割可說是向後倒退一步」；而且他在疏割「僅為自己蓋造房屋並為牲畜搭棚，他並沒有為神蓋造甚麼」。KC
    說法相同：這不是耶和華對他說的，這不是伯特利。


    GT《聖經精讀本──創世記註解》是唯一給出同情解釋的一家：雅各臨時居住此地，是由於①二十年奴僕生活所受的壓迫；②從拉班家匆匆逃亡；③雅博渡口事件帶來身體上的不便；④與以掃戲劇性的相聚——這些使他身體、精神都疲憊不堪，「因此雅各急需一個安靜的地方休息」。


    GT 丁良才《創世紀註釋》另補一條實際的線索：大概雅各從疏割到希伯崙去，為要看望他父親；聖經卻沒有提到他母親還在世與否，或者已經死了，因為雅各把他母親的乳母底波拉帶回自己家裡（創三五8）。'
