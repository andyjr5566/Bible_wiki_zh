- title: 基尼烈湖
  path: link_folder/地點/基尼烈湖.md
  definition: '民數記34:11 的東界「要達到基尼烈湖的東邊」。這是新約讀者熟悉的那片水，在舊約還叫這個名字。


    **它後來的幾個名字。** CT 一次列全：「『基尼烈湖』在新約稱革尼撒勒湖(參路五1)，又名提比哩亞海(參約二十一1)，即今加利利海。」GT 丁良才給的是同一件事的簡版：「『基尼烈湖』——就是新約上的革尼撒勒湖」；GT《啟導本聖經註釋》一句話收尾：「『基尼烈湖』即加利利海。」CT
    給的名字字義是「豎琴」。


    **它在四界裡的位置。** 東界從哈薩以難往南到示番，再下到亞延東邊的利比拉，然後沿基尼烈湖的東岸走，最後下到約但河、通到鹽海為止。GT《舊約聖經背景註釋》把這一段描述為「向南延伸的邊界穿越加利利海直到雅穆克河谷」。


    **BH 補的是新約的分量。** 它指出基尼烈海是耶穌許多神蹟與教導發生的地方，並說湖東的斜坡地帶土地肥沃、位置具戰略價值，是天然的分界。'
  development: '基尼烈在目前累積到的三章裡一直是一個座標，只是每一次畫的線不同。


    民34:11 把它放在迦南全地的東界上：邊界沿基尼烈湖的東岸往南走，再下到約但河、通到鹽海為止。申3:17 換成約但河東支派地業的範圍，這次它是北端——從基尼烈直到亞拉巴海，也就是鹽海。兩處的共同點是，這片水標的都是約但裂谷北段的起點。


    書11:2 是它第一次落在戰場上。夏瑣王耶賓召集的名單裡，有「基尼烈南邊的亞拉巴」的諸王——先前兩章用來畫界的那一段河谷，這時是敵方的徵召範圍。到同一章結束，約書亞已經按支派宗族把地分了下去（書11:23）；民34
    所畫的那條東界，從此不再只是將來的地圖。'
