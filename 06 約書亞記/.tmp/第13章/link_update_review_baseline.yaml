- title: 伯毘珥
  path: link_folder/地點/伯毘珥.md
  definition: '第29節是申命記第一篇講章的結語：「於是我們住在伯毘珥對面的谷中。」


    **名字。** CT 原文字義：「伯毗珥」毗珥之家，開口之家。GT《啟導本》：「“伯毗珥”的意思是“毗珥的居所”」；GT《串珠》：「「伯毗珥」：即毗珥的殿」。


    **它屬誰。** CT：「『伯毗珥』原為摩押人城鎮，在分配應許之地時，分給了流便支派(參書十三20)。」


    **這裡發生過的事。** GT《啟導本》：「可能就是以色列人曾拜過巴力毗珥的地方（參民二十三28；二十五3）。以色列人曾在這裡和迦南偶像首次接觸而犯罪受罰」；GT《串珠》：「以色列民曾在這裡崇拜巴力偶像、行淫亂，陷入極大的罪中（參民25章）」；BH：「It
    is significant in Israel''s history as the site where the Israelites fell into
    idolatry and immorality with the Moabite women, as recorded in Numbers 25. This
    event led to God''s judgment and a plague among the people.」（在以色列歷史裡這是個重要地點——民數記25章記載以色列人在這裡與摩押女子行淫、陷入拜偶像，招來神的審判與瘟疫。）


    **同一個地方，三件事。**


    | 事件 | 來源 |

    |---|---|

    | 摩西講完申命記全部的話 | CT：「以色列人未進入迦南地之前，曾在伯毘珥對面的谷中安營，並聚集聆聽摩西在毘斯迦山頂觀望該地之後，留給他們的最後囑咐(參四46)」；KC：「In
    the place where the people dwell, "opposite Beth-peor", Moses makes his speech
    (Deu 4:45-46).」 |

    | 摩西死後埋葬之地 | GT《聖經精讀本》：「伯毗珥對面的谷中: 是摩西作告別佈道的地點,也是死後被葬之地(34:5,6)」；KC：「There he is
    also buried (Deu 34:6).」 |

    | 過去拜巴力毘珥的地方 | GT《啟導本》、GT《串珠》、BH（見上） |


    **GT 讀出的轉折。** GT《啟導本》：「現在，伯毗珥“對面的谷中”成了以民走向光明新生活的起點。」


    **「谷」這個位置。** BH：「Valleys in Scripture can represent times of trial or waiting,
    contrasting with the mountains, which often symbolize closeness to God. This setting
    underscores the Israelites'' dependence on God as they prepare to enter a new
    phase of their journey.」（聖經裡的谷可以代表試煉或等候的時候，與常象徵親近神的山成對照。這個地點凸顯以色列人在準備進入新階段時對神的倚靠。）'
