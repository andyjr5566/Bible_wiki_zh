- title: 迦特
  path: link_folder/地點/迦特.md
  definition: '迦特出現在書11:22：亞衲族人在以色列人的地沒有留下一個，只在迦薩、迦特和亞實突有留下的。


    CT 的原文字義給「迦特」酒醡，並說迦薩、迦特和亞實突是地中海沿岸屬於非利士人的地方，當時神沒有命令以色列人攻打非利士人，到大衛王的時代才被以色列人征服。GT《串珠聖經注釋》說迦特在迦薩之東北約卅二公里（二十英里）；GT《約書亞記研經資料》說「迦特」字義是「酒醡」，是非利士的五個主要城巿之一。


    ### 為什麼這一節重要


    剩下的巨人後來有了名字。GT《綜合解讀》說大衛殺死的迦特巨人歌利亞（撒上十七4）可能就是剩餘亞衲族人的後裔。KC 說 One of their descendants
    will be Goliath（他們的後裔之一將是歌利亞），並說 If we leave anything of the enemy behind, it
    will put us in the greatest trouble（我們若把仇敵的任何殘餘留下來，日後必帶來最大的麻煩）。BH 說 The surviving
    giants in Gath especially anticipate later conflicts, including David''s defeat
    of Goliath, a giant from Gath（存留在迦特的巨人尤其預示了後來的衝突，包括大衛擊敗那位來自迦特的巨人歌利亞），並提到大衛在位時對抗其他非利士巨人的戰役（撒下21:15-22）。'
