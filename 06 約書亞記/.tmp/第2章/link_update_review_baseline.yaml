- title: 海（紅海）
  path: link_folder/地點/海（紅海）.md
  definition: 出埃及記中的「紅海」，GT《啟導本聖經腳註》指出原文可直譯為「蘆葦海」（賈斯樂郝威給的音譯是 Yam Suph）。它究竟是哪一片水域，各家沒有共識：《啟導本》說古代「紅海」包括印度洋、波斯灣等水域，「以色列人所過的海當非今天的紅海」，並推測可能就是曼薩拉湖（Lake
    Menzaleh）；賈斯樂郝威傾向蘇彝士灣以北，並提到可能是開鑿蘇彝士運河時消失的 Lake Ballah；《舊約聖經背景註釋》按巴力洗分的位置推算最近的湖泊是巴拉湖；出十三另有苦湖（Bitter
    Lakes）一說。無論確切位置為何，第14章的核心事件——神使海水分開、以色列人走乾地過海、埃及全軍覆沒——發生在此。
