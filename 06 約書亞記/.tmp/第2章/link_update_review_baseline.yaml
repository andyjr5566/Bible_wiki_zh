- title: 使天下萬民驚恐懼怕
  path: link_folder/原文/使天下萬民驚恐懼怕.md
  definition: '申命記2:25 神說：「從今日起，我要使天下萬民聽見你的名聲都驚恐懼怕，且因你發顫傷慟。」這一節用四個不同的字描寫同一種反應。


    **CT 的原文字義與 STEP 的逐字資料完全對得上。**


    | 和合本 | CT 原文字義 | 原文 | Extended Strong | 簡要詞典義 |

    |---|---|---|---|---|

    | 驚恐 | 恐懼 | pach.de./Kha | H6343 | pa.chad: dread |

    | 懼怕 | 害怕，不安 | ve./yir.''A.te./kha | H3374 | yir.ah: fear |

    | 發顫 | 發抖，震動 | ve./ra.ge.Zu | H7264 | ra.gaz: to tremble |

    | 傷慟 | 扭曲，扭動 | ve./cha.Lu | H2342I | chul: to twist: writh in pain |


    「傷慟」這個中文詞今天讀起來像悲傷，原文其實是身體扭動的意思——STEP 給的本節譯義是 they will be in anguish。


    **「天下萬民」也是兩個字。** CT 註明：「萬民（原文雙字）」＝面，臉（首字）；國家，百姓（次字）。STEP 顯示是 ''al- pe.Nei ha./''a.Mim（H6440H
    panim＋H5971A am），字面是「在眾民的面上」；後面接 Ta.chat kol- ha./sha.Ma.yim（H8478G＋H8064），「在諸天之下」。


    **這句話的處境。** CT：「指以色列人因戰勝亞摩利王西宏而聲名遠播，聞者喪膽。」GT《聖經精讀本》把它放進整場戰役的意義裡：「此次爭戰是以色列在開展迦南征服戰之前的序幕戰，以色列得勝的消息傳遍了迦南全地，以色列成為周邊國家一致顫驚恐懼的對象（11:25;出23:27;書2:9-11）。」


    **BH 讀出這是神的作為而非軍力。** 它指出這種懼怕是神放進列國心裡的，並把它接到出23:27 神差遣驚駭在前頭的應許，以及書2:9-11 喇合說的那番話。'
  development: '**同一個應許說了兩次，配對的詞換了一個。** 申2:25 是「我要使天下萬民聽見你的名聲都驚恐懼怕」，STEP 顯示用的是 pach.de./Kha（H6343，pa.chad）與
    ve./yir.A.te./kha（H3374，yir.ah）。申11:25 再說一次：「耶和華─你們的神必照他所說的，使懼怕驚恐臨到你們所踏之地的居民」，STEP
    顯示第一個字仍是 pach.de./Khem（H6343），第二個字卻換成 u./mo.ra.a./Khem（H4172A，mo.ra）。


    **範圍也不一樣。** 申2:25 說的是「天下萬民」，申11:25 收在「你們所踏之地的居民」——從普天下縮到腳掌踩得到的地方，正好接上同一節前面那句「凡你們腳掌所踏之地都必歸你們」。應許的對象因此變得具體：不是全世界都怕以色列，是他們走到哪裡，那裡的人就怕。


    **兩處的解讀方向一致。** CT 說懼怕驚恐指被震懾住、無心抵抗；BH 指出這種懼怕是神放進列國心裡的，不是以色列軍力造成的，並舉喇合在耶利哥對探子說的那番話為例（書2:9-11）。'
