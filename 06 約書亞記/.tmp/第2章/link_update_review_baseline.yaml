  path: link_folder/事件/十二探子窺探迦南地.md
  definition: '民13 全章：摩西從十二支派各選一人，去窺探迦南地，四十天後回來報告。


    **這十二人不是民1、民2、民7 的那批首領。** GT《民數記串珠聖經註釋》：「擔任探子的十二個首領，名字有別於1章; 2章; 7章所記的首領。可能上文作統計及行奉獻禮的，是一些年長德高望重的領袖；本文選派作探子的，則是一些年輕有為的青年領袖。」GT《啟導本聖經註釋》也說「可能打探迦南的事需要年輕力壯的人。以前幾章所記的都屬較年長的領袖」。CT
    的說法略有不同：他們是「各支派統領的輔佐官」。名單中沒有利未人——GT 丁良才：「利未支派也不在其中，因為他們將來不分地。」


    **排名次序沒有規律。** GT《民數記串珠聖經註釋》直說「此處十二支派的排名次序並無任何原則」；GT 丁良才注意到其中一處差異：「便雅憫、西布倫支派在此處所占的位置，和第一章的次序不同。」


    **十二個人裡，只有兩個名字後來還被提起。** GT 丁良才：「除了迦南（6），並何西阿以外（8、16），聖書上在別處沒有提到這些探子的名字。」


    **分別出現在第四十天。** KC：「十二個探子出發時，彼此還看不出有什麼分別。分別要到他們『過了四十天』回來時才顯出來……他們都看見了同樣的東西，卻只有兩個人用神的眼睛看。」'
