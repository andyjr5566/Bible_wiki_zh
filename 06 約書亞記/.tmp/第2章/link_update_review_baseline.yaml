- title: 賜給（na.tan）
  path: link_folder/原文/賜給（na.tan）.md
  definition: '約書亞記第一章反覆出現同一個動詞：神把迦南地「賜給」以色列。GT《約書亞記綜合解讀》數過次數：「動詞「賜給 נָתַן」在本章中出現了七次(2、3、6、11、13、14、15節)。」STEP
    在這七節裡共標出八個字形，全部歸在 H5414G 底下，簡要詞典義是 na.tan: to give。


    ### 同一個字，好幾種形態


    真正值得注意的是這些字形不是同一種形態。


    | 節次 | 原文 | morphology | STEP 本節譯義 |

    |---|---|---|---|

    | 書1:2 | no.Ten | HVqrmsa（分詞） | [am] about to give |

    | 書1:3 | ne.ta.Ti/v | HVqp1cs（完成式）＋第三人稱陽性單數後綴 | I have given/ it |

    | 書1:6 | la./Tet | HR/Vqcc（不定詞） | to/ give |

    | 書1:11 | no.Ten | HVqrmsa（分詞） | [is] about to give |

    | 書1:13 | ve./na.Tan | Hc/Vqq3ms | and/ he will give |

    | 書1:14 | na.Tan | HVqp3ms（完成式） | he gave |

    | 書1:15 | no.Ten／na.Tan | HVqrmsa／HVqp3ms | [is] about to give／he gave |


    表上七節共八個字形，形態並不一致：書1:2、11、15 是分詞，本節譯義作 about to give；書1:3 是完成式加受詞後綴，本節譯義是 I have
    given it；書1:6 是不定詞；書1:13 是接續式（Hc/Vqq3ms），本節譯義作 and he will give；書1:14 與書1:15 另有一個完成式
    na.Tan，講的是摩西把河東的地給了兩支派半。註釋家取來討論的主要是分詞與書1:3 的完成式這兩處。


    ### 各家怎麼讀這個時態


    GT《約書亞記綜合解讀》從書1:3 的完成式讀出神已經先動了工：「第3節的「賜給」原文是完成式，表明雖然以色列人還沒有過河」——它接著說神已經照著所應許摩西的話把迦南賜給了他們，所以迦南人的心都消化了（書2:9）。GT《約書亞記研經資料》講得更直接：「這裏
    1:3 神所說的「賜給」卻是完成式。表示「已經給了(have already given)」，強調行動的確定性。」


    CT 注意的是另一節。他在書1:2 的話中之光說：「這裡神所說的「賜給」是現在式。並不是神將要做的事，乃是神就在此刻要做的。信心求神現在，神就現在賜給。」書1:2
    在 STEP 裡正是分詞形態，本節譯義作 about to give，與 CT 讀出的「此刻」語感相合。兩家看的是不同節次，也就各自對上不同的形態。


    KC 把重點放在這是誰的決定：「He gives it to them, or rather ''have given it to you'' (verse
    3), for it is a counsel of God, and then it is certain.」（祂把地賜給他們，或者照第3節的說法更該說是已經賜給了他們，因為這是神的定旨，所以是確定的。）他接著說，這樣一來要問的就不再是神將要給什麼，而是祂已經給了什麼。


    BH 從同一個形態讀出計畫的不可失敗：「The completed form of the promise emphasizes that God''s purpose
    cannot fail.」（這個完成的形態強調神的計畫不會落空。）BH 同時提醒，以色列當時面對的仍是堅固的城與強敵。


    ### 給了以後還要去拿


    四家都沒有把「已經賜給」讀成不必動手。GT《綜合解讀》接著說神「也要求百姓憑信心「過這約旦河」(2節)，用「腳掌」(3節)跟上神的帶領」。KC 用遺產作比方：一個人可以確知自己因繼承而富有，但若不去承接、不去享用，那份產業對他毫無用處。BH
    也說以色列要進去、要走過、要奪取，這個動作不是賺取產業，而是對賜產業的那一位表達順服的信心。'
