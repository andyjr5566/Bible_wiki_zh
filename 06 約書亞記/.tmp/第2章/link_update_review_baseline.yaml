- title: 慈愛誠實
  path: link_folder/原文/慈愛誠實.md
  definition: '創世記二十四27 僕人稱頌神「不斷地以慈愛誠實待我主人」，第49節他又請利百加的家人「以慈愛誠實待我主人」。


    STEP 資料顯示，此處希伯來原文為 `חַסְדּוֹ וַאֲמִתּוֹ`（chasdo va''amitto；H2617A、H571），詞根分別為名詞
    `חֶסֶד`（chesed，指慈愛、堅定不移的愛）與 `אֱמֶת`（emet，指信實、真理、可靠性）。


    BH 指出這兩個字在希伯來文是 chesed 與 emet：chesed 常譯作慈愛、憐憫或堅定不移的愛，是舊約描述神守約之愛的關鍵神學詞彙；emet 則是可靠、信實。兩字並用是立約用語，形容的是「守約者所應有的忠誠」，出埃及記三十四6
    神自我宣告時用的正是同一組字。'
  development: '### 同一組字出現兩次，方向相反

    GT《串珠聖經註釋》點出第49節與第27節的呼應關係：第27節說的是**神**以慈愛誠實待亞伯拉罕，第49節僕人求的是**人**以慈愛誠實待他的主人。同一個詞先描述神的守約，再被用來要求人的守約——僕人的措辭因此不只是客套，而是把這樁婚事放進了盟約的語言裡。

    BH 也從這個角度讀第49節：僕人訴諸的是這兩項美德，而它們「在關係與盟約中是根本的」，反映的正是神與祂子民之間的盟約關係。

    ### 這兩個字為什麼難譯

    中文譯本作「慈愛誠實」，是把兩個字分別對譯。BH 提醒 chesed 一字在英文裡沒有單一對應詞，常見的譯法包括 lovingkindness、mercy、steadfast
    love，因為它同時包含了「愛」與「守信」兩面——它不是情緒上的好意，而是盟約關係中該有的忠誠。emet 則指真實、可靠。兩字合起來，講的是「說了就算數的愛」。

    第27節的中譯「不斷地」也值得留意：呂振中譯本作「他不放棄他的慈愛和忠信而不施于我主人」——原文的重點在於「沒有撤回」，而不只是「一直有」。

    ### 僕人的用法

    這組字在僕人口中出現的位置很講究。CT 指出第27節「老僕人的話顯示他已在路上對神有了深刻的認識」，而且順序是先神、其次主人、最後才提到自己。KC 讀第27節為感恩的次序：他為所求得的稱謝神，「我們得著禱告的答覆時，第一個反應應當是感謝」。

    到了第49節，同一組字被拿來當作請求的根據——僕人沒有說「請你們成全這門親事」，而是說「你們若願以慈愛誠實待我主人，就告訴我」。GT《聖經精讀本──創世記註解》注意到他隨後那句「使我可以或向左，或向右」表明的是立志堅守使命的意志：即使彼土利家族拒絕，他也不會丟棄與主人所立的約，會馬上去別處尋找。'
