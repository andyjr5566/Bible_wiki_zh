- title: 三日之內與差派探子的先後之爭
  path: link_folder/解經爭議/三日之內與差派探子的先後之爭.md
  definition: '書1:11 約書亞宣告「三日之內你們要過這約但河」。書2:1 記他打發兩個探子去窺探耶利哥，探子在山上藏了三天（書2:22）；書3:2
    又說「過了三天，官長走遍營中」。這幾個「三」該怎麼排先後，四套註釋沒有一致的答案。


    ### 各家的說法


    | 來源 | 說法 |

    |---|---|

    | CT | 書1:11 說三日之內，顯然約書亞已經接到探子的消息（參書二22~23；三2）——也就是探子先去，這道命令在後 |

    | GT《約書亞記雷氏研讀本》 | 探子的差遣顯然在約書亞發出這準備的命令之前；書3:2 所描述的，可能跟書1:11 相同，也可能在書1:11 之後 |

    | GT《啟導本聖經約書亞記註釋》 | 三日之內或指書3:2 所說的三天，這時百姓還在什亭（書2:1；3:1） |

    | GT《串珠聖經注釋》 | 三日之內只是約數，並且很可能要從本章第12節以下所記的事發生以後才起算 |

    | GT《約書亞記綜合解讀》 | 三日之內原文是「再三日」，意思是三日以後，表明約書亞立即行動，絕不耽延 |


    CT 與《雷氏研讀本》都把探子的行程排在這道命令之前，兩家的用字也都是「顯然」。《啟導本》不談探子的先後，只提出書1:11 的三天「或指」書3:2 所說的三天。《串珠》對這個數字本身保留，認為只是約數，並把起算點往後推。


    ### 原文能確認的部分


    STEP 顯示書1:11 的說法是 be./''od she.Lo.shet ya.Mim：be./''od（H5750，簡要詞典義 od: still）加
    she.Lo.shet（H7969，three）加 ya.Mim（H3117G，days）。這三個詞的字形與詞義是 STEP 能直接確認的部分。GT《約書亞記綜合解讀》與《約書亞記研經資料》在這個基礎上把它讀成「再三日」，也就是三日以後，並由此說約書亞立即行動、絕不耽延。


    ### 為什麼這個排序有分量


    KC 沒有處理與探子的先後，而是從三這個數字讀出另一層意思：他說預備要花三天，「三日」這段時間常常可以連到主耶穌的復活，渡河發生在第三天，前面兩天是預備的日子。KC
    另外指出約書亞並沒有交代百姓要怎樣過約但河——四十年前他看過耶和華怎樣分開紅海，就相信約但河也會如此，因此他滿有信心地說三日之內他們必要過河。


    BH 在書1:11 的交叉引註裡同時列出書3:2 與書3:17，並說渡河標誌著一代人的審判結束、新一代進入神所應許的安息。'
