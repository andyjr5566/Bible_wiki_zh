- title: 約但河
  path: link_folder/地點/約但河.md
  summary: 第7節「那些人就往約但河的渡口追趕他們去了」，第23節探子「過了河」回到約書亞那裡。GT《啟導本》說渡口在城的東面，水淺處不過一公尺，可以涉水而過；GT《串珠》說渡口在城以東，喇合家可能在城西近山之處，因此王的手下與探子向著相反的方向而去；GT《舊約背景註釋》的華爾頓詳述約但河沿線各處涉渡點，說耶利哥附近有幾個渡口。GT《綜合解讀》說渡口是探子最有可能逃跑的方向。
  relation: 本章的約但河出現在兩個對立的用途上：追兵往渡口去，探子卻往相反的山上走；等追兵回城，探子才從容過河。
  overview_review:
    signals:
    - many_accumulations
    accumulation_count:
