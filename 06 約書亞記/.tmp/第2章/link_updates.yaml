- title: 心消化（ma.sas）
  path: link_folder/原文/心消化（ma.sas）.md
  summary: '第9節與第24節「心都消化了」STEP 為 na.Mo.gu（H4127，簡要詞典義 mug: to melt，Niphal 完成式）；第11節「心就消化了」則是 va/i.yi.Mas（H4549，簡要詞典義 ma.sas: to melt，Niphal），與申1:28、申20:8 同一個字。CT 說『心都消化』形容失去膽量、陷入絕望的狀態，並指出第24節是第三次提到相同的話；GT《研經資料》說「消化了」是「溶解了」；GT《聖經精讀本》說這是希伯來人特有的表達方式，表明陷入絕望的狀態。'
  relation: 申命記兩處都是以色列人自己的心消化，本章三次全部指迦南居民。中文三次一樣，原文在第11節換過一次字——第9、24節是 mug，第11節才是條目原本追的 ma.sas。
