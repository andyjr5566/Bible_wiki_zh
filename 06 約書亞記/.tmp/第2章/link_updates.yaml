- title: 他的血要歸到他身上
  path: link_folder/原文/他的血要歸到他身上.md
  summary: '第19節「凡出了你家門往街上去的，他的罪（原文是血）必歸到自己的頭上，與我們無干了。凡在你家裡的，若有人下手害他，流他血的罪就歸到我們的頭上」。STEP 為 da.M/o ve./ro.Sh/o（H1818 dam 加 H7218A rosh），「與我們無干」是 ne.ki.Yim（H5355A，簡要詞典義 na.qi: innocent）。CT 原文字義給「罪」血、「無干」乾淨的，免除義務，並說無論何人出了房門就無法保證他們的安全，躲在房子裡面探子便以性命擔保。BH 把它接到結33:4-5 守望者示警後的責任歸屬。'
  relation: 利20 用這句話界定死刑執行者的清白，本章用它界定一份救命誓約的邊界：同一個句型，一次劃出刑罰的責任，一次劃出保護的範圍——而範圍就是那扇繫著朱紅線繩的房子。
  overview_review:
