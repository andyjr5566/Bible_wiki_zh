      - 約書亞記:2
- title: 慈愛誠實
  path: link_folder/原文/慈愛誠實.md
  summary: 第12節喇合說「我既是恩待你們，求你們指著耶和華向我起誓，也要恩待我父家，並給我一個實在的證據」，第14節探子回答「我們必以慈愛誠實待你」。STEP 顯示第12節出現兩次 Cha.sed／Che.sed（H2617A），第14節是 Che.sed ve./'e.Met（H2617A 加 H571G）；第12節求的「實在的證據」是 'ot 'e.Met（H226H 加 H571I）。GT《雷氏研讀本》說「恩待」希伯來文是 hesed，這裡指人與人之間堅定的忠貞，但這詞通常指神與以色列之間的忠貞；GT《啟導本》說 hesed 願意為信實或恩慈，多用以表示神對人永不間斷的慈愛或神的子女對他人應有的愛心；GT《研經資料》說這個詞彙由動詞「作」和一個被譯為「履約的忠誠」或「委身」的名詞構成。
  relation: 創24 這組字用在神與亞伯拉罕、僕人與主人之間，本章換成一個迦南妓女與兩個以色列探子。第12節她先用這個字描述自己已經做的，第14節探子用同一個字承諾將要做的——這組字在本章是雙向的。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
