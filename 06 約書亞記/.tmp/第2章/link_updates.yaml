- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  summary: 第10節「你們怎樣待約但河東的兩個亞摩利王西宏和噩，將他們盡行毀滅」。GT《研經資料》說「西宏」字義是「勇士」、「噩」字義是「長頸的」，「盡行毀滅」是「完全地毀壞」；GT《丁道爾聖經注釋》說這裡出現的動詞是希伯來文的滅絕令用字，指以色列人如何將西宏和噩盡行毀滅。BH 說西宏拒絕以色列平安經過而攻擊他們，噩統治的巴珊有堅固的城，兩者的軍力與防禦都擋不住為以色列爭戰的神。
  relation: 此前十三章都是以色列這一方在記述與亞摩利人的往來，本章把同一場戰役放進迦南人的口中：河東二王的下場成了河西居民恐懼的理由。
  overview_review:
