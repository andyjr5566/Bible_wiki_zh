- title: 三日之內與差派探子的先後之爭
  path: link_folder/解經爭議/三日之內與差派探子的先後之爭.md
  summary: 第16節喇合叫探子「要在那裡隱藏三天，等追趕的人回來」，第22節「二人到山上，在那裡住了三天」。GT《研經資料》指出這使時序更難排：喇合的建議是要探子不可以直接過河，因為耶利哥人一定在那裡等著，要先躲起來等大家都認為探子離開了才過河，不過這樣約書亞的過河時間應該會拖過三天；它另外提出一種可能，就是約書亞領受神過河的命令後先派出探子，等探子回來才下令三天過河。GT《聖經精讀本》從搜捕的時間讀出耶利哥王的恐懼：從耶利哥城到約但河不過13公里，走路約用3個小時，經過三天仔細搜索路口的事實表明他們竭盡全力搜捕。KC 說三這個數字常常可以連到主耶穌的復活。
  relation: 書1 的爭議是「三日之內」怎麼算，本章提供了實際的三天：探子在山上藏了三天。兩處合起來，先後順序的問題才真正成形。
  overview_review:
    signals:
