- title: 賜給（na.tan）
  path: link_folder/原文/賜給（na.tan）.md
  summary: GT《綜合解讀》說在第一章中出現了七次的動詞「賜給 נָתַן」，在本章中又重複了四次（9、12、14、24節）。STEP 顯示第9節與第24節都是完成式 na.Tan（本節譯義 he has given），第12節是 u./ne.ta.Tem（and you will give，指探子要給她一個實在的證據），第14節是不定詞 be./tet-（when gives）。GT《研經資料》另說第9節「已經把這地賜給你們」動詞用完成式，表示喇合確信。
  relation: 書1:3 的完成式是神自己說的，本章第9節同一種形態換成迦南女子說，第24節再由探子覆述一次。這個動詞在兩章之間走完了從應許到敵方承認的一段路。
  overview_review:
