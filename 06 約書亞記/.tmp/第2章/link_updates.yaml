- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: 第1節「你們去窺探那地和耶利哥」，第2、3節耶利哥王在城中搜捕探子。GT《綜合解讀》說「窺探那地和耶利哥」原文是「窺探那地，特別是耶利哥」，並說耶利哥是人類最早的城鎮，扼守約旦河谷和中央山地之間的東西戰略要道，因有泉水灌溉，自古就是兵家必爭之地。GT《串珠》說它位於約但河注入死海的河口之西北十六公里，當地氣候和土質適宜農耕，是人類最早築有城牆的城市之一；GT《研經資料》說它位於死海北方九公里、約旦河西七公里，是一個綠洲，高度在海平面以下250公尺，是全世界最低的城市。GT《啟導本》說它有「月城」之意，又稱為「棕樹城」。
  relation: 此前九章都只是隔著約但河遠遠標定它的位置，本章是以色列人第一次真的進到城裡——雖然只有兩個人，而且是偷偷進去的。
  overview_review:
    signals:
    - first_in_book
