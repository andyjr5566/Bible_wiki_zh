- title: 十二探子窺探迦南地
  path: link_folder/事件/十二探子窺探迦南地.md
  summary: 四套來源都把本章與民13-14 對比。CT 說這兩個探子的眼光與三十八年前的十個探子完全不同，他們看到的不只是耶利哥高大的城牆和追趕他們的敵人，更看到神的應許已經應驗。GT《啟導本》說三十八年前摩西派出探子十二人、每支派一人，上次探子走遍迦南地東西南北，這次只窺探即將攻打的耶利哥城。GT《綜合解讀》說三十八年前從加低斯打發十二探子是大張旗鼓的公開行為，這次卻是暗暗打發。GT《聖經精讀本》說十名探子回來報惡信使征服迦南的計畫遭到挫折，並說本章兩個探子把迦南居民的失意與恐懼報告給約書亞，鼓舞了以色列的士氣，與十個探子報惡信使百姓消沉的情形形成鮮明對比。KC 說四十年前十二個以色列人窺探全地，其中十人帶著不信回來報惡信。
  relation: 本章沒有提到民13 一個字，四套來源卻不約而同用它作背景。差別不在探子的能力，在於他們看見什麼、以及回來怎麼說。
  overview_review:
