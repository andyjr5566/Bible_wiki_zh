- title: 紅海分開
  path: link_folder/歷史/紅海分開.md
  summary: 第10節「耶和華怎樣在你們前面使紅海的水乾了」。GT《丁道爾聖經注釋》指出，描述耶和華如何使紅海的水乾了之字，在聖經中是頭一次出現，並說它在書5 再度出現，意味過約但河與過紅海有關聯。BH 說紅海的拯救顯明耶和華掌管受造與掌管埃及的權能，並說那位在海中開路的神後來也止住約但河，使以色列進入應許之地。
  relation: 本章讓這件四十年前的神蹟以傳聞的形式回到敘事裡：迦南人聽見了，心就消化了。它同時預告下一章的渡河——同一位神，同一種作為。
