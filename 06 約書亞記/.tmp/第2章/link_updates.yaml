  summary: 第1節「從什亭暗暗打發兩個人作探子」。CT 說什亭位於死海東北，與約但河西的耶利哥遙遙相對，這是以色列人曠野旅程的最後一站（參民二十五1）；GT《研經資料》說字義是「洋槐」，大約在耶利哥城對面，可能是克夫雷因乾河畔的漢曼遺址；GT《啟導本》說什亭在摩押地，地理上和約但河對岸的耶利哥遙遙相對；GT《聖經精讀本》說它位於約但河西約12公里，有兩條河，易於駐營紮陣。
  relation: 民25 記的是百姓在這裡與摩押女子行起淫亂，本章記的是探子從這裡出發。同一個營地，一次是失敗的現場，一次是進地行動的起點。
