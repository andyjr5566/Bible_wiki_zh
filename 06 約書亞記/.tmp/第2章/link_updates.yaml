- title: 以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）
  path: link_folder/互文/以色列戰勝亞摩利王西宏互文（申2：24-37；3：1-7；詩135：10-12；136：17-22）.md
  summary: 第10節喇合舉出的第二件聽聞就是河東二王之役：「你們怎樣待約但河東的兩個亞摩利王西宏和噩，將他們盡行毀滅」。GT《丁道爾聖經注釋》指出這裡與紅海並列的兩件事，正是以色列在曠野飄流的開頭與結尾。BH 說這兩場勝利使迦南各族認出耶和華已經開始成就祂的應許。
  relation: 這條互文此前收的是歷史記載、律法回顧與詩篇詠唱三層，本章加上第四種說話的人：被征服一方的鄰居。同一件事在敵方口中被複述，成了他們喪膽的原因。
