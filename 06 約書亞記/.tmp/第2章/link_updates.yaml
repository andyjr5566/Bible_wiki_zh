- title: 使天下萬民驚恐懼怕
  path: link_folder/原文/使天下萬民驚恐懼怕.md
  summary: 第9節「因你們的緣故我們都驚慌了。這地的一切居民在你們面前心都消化了」，第11節「並無一人有膽氣」，第24節探子回報同樣的話。STEP 顯示第9節的「驚慌」是 na.fe.Lah 'ei.mat./Khem（H5307 na.phal 加 H367 e.mah），第11節的「並無一人有膽氣」是 ve./lo'- Ka.mah od Ru.ach be./'Ish（H7307G ru.ach）。CT 原文字義給「驚慌(原文雙字)」恐怖，害怕(首字)；仆倒，下沉(次字)、「膽氣」勇氣；GT 收錄的約書亞記研經資料（蔡哲民等）直譯為「對你們的驚駭落在我們身上」與「人裡面的心靈不再立得住」。GT《雷氏研讀本》要讀者參看申2:25 的應許；BH 說神曾應許在以色列前面打發驚駭（出23:27），喇合的話證明這話已經應驗。
  relation: 申2:25 與申11:25 是應許，本章是驗收：說話的人不是以色列人，是應許所指的那一方。而且她用的字與申命記那兩處不同，是另一組描寫同一種反應的詞。
