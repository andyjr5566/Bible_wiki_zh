    - 22
    definition: keep
    development:
      decision: keep
      basis: standing_debt
- title: 海（紅海）
  path: link_folder/地點/海（紅海）.md
  summary: 第10節喇合說「我們聽見你們出埃及的時候，耶和華怎樣在你們前面使紅海的水乾了」。GT《研經資料》說「紅海」原文是「蘆葦海」。這是她列出的兩件聽聞中的第一件，也是她認識耶和華的來源之一。
  relation: 此前的累積都是以色列人自己的經歷或回顧，本章是這件事第一次由迦南人口中說出來——而且是當作已經證實的消息。
