- book: 約書亞記
  chapter: 2
  summary: '第15節「因他的房子是在城牆邊上，他也住在城牆上」，STEP 為 be./Kir ha./cho.Mah（H7023 qir: wall 加 H2346G cho.mah: wall），原文用了兩個不同的「牆」字。CT 說考古學家的考據證實當時的確有民房建築在城牆內緣邊上，一面增加城牆的厚度和支撐，一面房屋的牆壁有牢固城牆的依靠；GT《啟導本》說有的城牆中空、裡頭且有間隔；GT《聖經精讀本》引英國考古學家賈斯湯1930-1936年的發掘，說耶利哥城被相距4-5米的兩層城牆所環繞，有些人在兩道城牆之間放置大樑而建造房屋；GT《綜合解讀》說1900年代德國考古學家在北端內外牆之間挖掘到了房屋；GT《舊約背景註釋》的華爾頓說房屋建於內外牆之間墁了灰泥的護堤上面；GT《靈修版聖經註釋》說兩道城牆相隔約3.5至4.5公尺。BH 說這個位置使人能不經守衛的城門逃出城外。GT《研經資料》記下書2:15 這段敘述在七十士譯本並沒有此附註。'
  relation: 第7節城門一關，探子按常法就出不去了；本節說明他們為什麼還走得掉。這棟房子同時是藏身處、逃生口，也是後來朱紅線繩要繫的那扇窗戶的所在。
