- name: 上天下地的神是否一神信仰之爭
  suggested_type: 解經爭議
  evidence: 第11節喇合說「耶和華─你們的神本是上天下地的神」。GT《聖經精讀本》說喇合的神觀大大超越了迦南人，她承認以色列的神是廣大無邊的最高之神；KC
    說她相信耶和華不只是某一族的神，而是天地的神；BH 說這是決定性地離開迦南的偶像轉向永生神。GT《舊約背景註釋》的華爾頓卻說她的話雖反映耶和華的權柄和能力令他們畏懼，卻遠非一神信仰的表示，她沒有宣稱放棄舊神，只是向祂求助。
  surfaces:
  - phrase: 上天下地的神
  target_path: link_folder/解經爭議/上天下地的神是否一神信仰之爭.md
