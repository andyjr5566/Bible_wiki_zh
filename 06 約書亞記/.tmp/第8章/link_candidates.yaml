- name: 以巴路山立約段落的位置之爭
  type: 解經爭議
  section: 解經爭議
  evidence: |-
    第30至35節緊接艾城之役，記約書亞在以巴路山築壇、抄寫律法、宣讀祝福咒詛，但以巴路山遠在北方的示劍。GT《研經資料》說一般認為這一段應該是錯置到此處的，因為此時才剛剛打下艾城，不可能跑到北邊的示劍去築壇，七十士譯本將此段放置在 9:2 之後，死海古卷的一殘篇中這段是在 5:2 之前；GT《綜合解讀》說「以巴路山」在艾城北方大約33公里，位於示劍城北，聖經沒有提到示劍的爭戰，可能當地的迦南人已經聞風而逃；GT《雷氏研讀本》說這個守衛以巴路山與基利心山中間之山谷的示劍堅固城此時可能已經投降，或被攻取，或表示友善；GT《啟導本》說示劍為迦南中部大城、乃以色列人古代宗教聖地（創十二6~7；三十三18~19），摩西死前曾吩咐眾民過約但河進迦南地後須在示劍立壇獻祭並重申前約。CT 則不提位置問題，直接說以色列人進入中央山地的第一件事不是趁熱打鐵、擴大戰果，而是照著摩西的吩咐到以巴路山為神築壇、重申聖約。
  surfaces:
  - phrase: 那時，約書亞在以巴路山上
    verses:
    - 30
- name: 古代近東的戰場傳訊方式
  type: 背景
  section: 背景
  evidence: |-
    第8節約書亞吩咐「你們奪了城以後，就放火燒城」，第19節伏兵「跑進城去，放火焚燒」，第20節「城中煙氣沖天」，第21節「城中煙氣飛騰」——濃煙是本章雙方都在讀的戰場訊號。CT 說第8節『放火燒城』發出信號（參21節），第19節同樣註明放火焚燒是發出信號，並說第20節的『煙氣』對艾城的人來說是噩耗，而第21節的『煙氣』對以色列人來說乃是喜訊。GT《研經資料》說放火燒城主要是用來讓城外的敵軍一面想要抵抗敵人、一面也想回去拯救城池，造成軍心與陣勢的混亂；GT《聖經精讀本》說這場火向以色列與艾城的軍隊通報了城已被攻陷，以這場火為信號，逃跑的以色列轉換方向開始反攻。GT《啟導本》另說約書亞用矛頭反射日光通知埋伏城後的以軍攻城。BH 說從艾城升起的煙成了把它軍隊困在以色列兩軍之間的信號。既有條目「古代近東的戰場傳訊方式」收錄 GT《舊約聖經背景註釋》所列當代軍隊的傳訊法，其中明說烽火得到廣泛使用、高舉的杖和標槍有時亦能傳遞簡單的訊息——本章正好同時用上這兩種，屬跨章累積。
  surfaces:
  - phrase: 城中煙氣沖天
    verses:
    - 20
  - phrase: 城中煙氣飛騰
    verses:
    - 21
- name: 築壇
  type: 主題
  section: 主題
  evidence: |-
    第30節「那時，約書亞在以巴路山上為耶和華─以色列的神築一座壇」。STEP 為 yiv.Neh ... miz.Be.ach（H1129，簡要詞典義 ba.nah: to build，加 H4196，miz.be.ach: altar）。CT 說以色列人進入中央山地的第一件事不是趁熱打鐵、擴大戰果，而是照著摩西的吩咐到以巴路山為神築壇，重申聖約，因為耶利哥和艾城的經歷已經告訴他們：有了神就必有得勝，沒有神，到手的得勝也不能長久。GT《丁道爾聖經注釋》說約書亞記八30~32應驗了申命記二十七4~8；GT《華爾頓約書亞記背景注釋》說這壇似乎是特別為這一次的慶典築造、不是作為永久性建築，在此所獻的祭只有燔祭和平安祭，沒有贖罪祭、贖愆祭。KC 說 By building the altar Joshua claims the land for the LORD。BH 說這座壇宣告以色列的得勝出於耶和華，也宣告與祂相交需要贖罪與分別為聖。既有條目「築壇」已收創26 以撒在別是巴築壇與申27:5-6 的命令，本章是命令的執行，屬跨章累積。
  surfaces:
  - phrase: 築一座壇
    verses:
    - 30
