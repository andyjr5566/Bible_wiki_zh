  section: 解經爭議
  evidence: |-
    第3節「約書亞選了三萬大能的勇士，夜間打發他們前往」與第12節「他挑了約有五千人，使他們埋伏在伯特利和艾城的中間」。GT《串珠》說3節與12節記載的伏兵數目大有出入，學者對此有兩種解釋：一是文士手抄之誤，三萬這數字太大，伏兵的數目應是五千；二是這是指兩隊兵士，分別在艾城之西南及西面埋伏，後者幫助攔截從伯特利而來的救兵。GT《雷氏研讀本》說「三萬」若是進行埋伏這人數似乎太多了，有人認為「三十千」應作「三十個首領」，若是這樣約書亞就是差遣了三十個首領進行一種突擊埋伏；GT《丁道爾聖經注釋》說他選了三十個三千（意即三十隊人馬）；GT《研經資料》說「三萬」原文是「三十千」，並列出兵分兩路與兵分三路兩種學者說法；GT《啟導本》說他派出軍隊兩批，一批三萬人（或為三千人之誤）。CT 則採兩批伏兵的讀法，說第12節是第二批伏兵，目的在阻擋從伯特利來的援軍；GT《綜合解讀》也說「三萬大能的勇士」是第一支伏兵負責奪城放火，「五千人」可能是第二支伏兵負責阻擊來自伯特利的敵人援軍。
