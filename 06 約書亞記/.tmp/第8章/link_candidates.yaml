- name: 土壇
  type: 神學
  section: 神學
  evidence: |-
    第31節「是用沒有動過鐵器的整石頭築的，照著耶和華僕人摩西所吩咐以色列人的話，正如摩西律法書上所寫的」。STEP 為 miz.Bach 'a.va.Nim she.le.Mot（H4196 加 H68G 加 H8003，簡要詞典義 sha.lem: complete）與 lo'- he.Nif 'a.lei./Hen bar.Zel（H5130B，簡要詞典義 nuph: to wave，加 H1270 bar.zel: iron）。CT 原文字義給「動過」來回搖動、攪動，並說『沒有動過鐵器』即指不可切割、研磨和鑿劈，用意在保持渾然天成，避免人工的玷污（參出二十25）；CT 又說我們可以想像得到這壇的外貌一定是很不美觀，但神在出埃及記二十章25節中向以色列人說過這話，說出人與神中間並不需要人的手加添什麼。GT《聖經精讀本》說用未曾經過人為雕琢的而以自然狀態的石頭築壇的事實，告訴我們坦誠而真實的敬拜的重要性；GT《華爾頓約書亞記背景注釋》說這壇似乎是特別為這一次的慶典築造、不是作為永久性建築，這是使用未加工粗石的另一個理由，並說在此所獻的祭只有燔祭和平安祭，沒有贖罪祭、贖愆祭。KC 說這壇也是主耶穌的圖畫，它未經加工、全然完美。BH 說未經人手工具的石頭見證人的技巧、驕傲或發明無法改良到神面前的通路。GT 所收艾基斯《舊約聖經難題彙編》回答「約書亞于以巴路山上築壇（書八3O），但後來神裁定于『高處』拜偶像者的罪；約書亞此舉是否與神的命令互相衝突」，說拜偶像者設壇祭祠假神的地方稱為「高處」（bamot），而在所羅門建立耶路撒冷聖殿之前以色列人設壇來敬拜耶和華神，神定「高處」拜偶像者的罪這項命令顯然不能追溯至所羅門王以前對於耶和華神的敬拜行動；他並說約書亞在以巴路山築壇是為要使全體以色列人參與莊嚴的重申與神立約的儀式，而這與出埃及記頒佈的築壇律法完全吻合：「凡記下我名的地方，我必到那裡賜福給你。」（出二十24）既有條目「土壇」（alias 石壇）已收出20:24-26 的規定與申27:5-6 的重申，本章是它在迦南地的第一次實際執行，屬跨章累積。
