book: 約書亞記
chapter: 8
candidates:
- name: 約書亞
  type: 人物
  section: 人物
  evidence: |-
    全章的行動主體。第1節神對他說「不要懼怕，也不要驚惶」；第3至8節他下達伏兵指示；第9、13節兩夜分別住在民中與山谷；第10節清早點齊百姓；第15節帶頭裝敗逃跑；第18、26節伸出短鎗直到殺滅艾城全民；第29節吩咐把艾城王屍首取下；第30至35節築壇、抄寫律法、宣讀祝福咒詛。CT 說第1節的「起來」是神第三次告訴約書亞起來，前兩次（書七10、13）是要他停止哀傷、對付敗因，這一次是要他積極進取；CT 又說第35節可看出約書亞不是祭司、算不上專業傳道人，事奉卻多麼徹底認真，將祝福和咒詛的話全部宣讀。GT《研經資料》說比較書7:5，第二次攻打艾城約書亞不再自作主張，而是先求問神。KC 說約書亞讓自己與百姓一同被打敗、一同逃跑，這些羞辱的經歷由「神站在他們那一邊」補足。BH 說約書亞留在百姓中間而不是遠離危險，顯出領袖與所託付之人同擔重擔。
- name: 艾
  type: 地點
  section: 地點
  evidence: |-
    本章的戰場，第1至29節反覆出現。STEP 為 ha./'Ai（H5857G，簡要詞典義 ay: Ai）。CT 第1節原文字義給「艾」荒場；第28節說約書亞將艾城焚燒、使城永為高堆荒場，意指艾城成為廢墟。GT《聖經精讀本》說「艾城」是巴勒斯坦中部的城邑，位於伯特利東南約3公里處，具有「廢墟」、「堆」之意，被擄巴比倫歸來之後便雅憫支派生活在此地；GT《綜合解讀》說艾城位於中央山地的丘陵地帶，西邊有一條比較深的旱溪（Wadi Sheban）可以埋伏軍隊。KC 說 Ai means ‘ruin’，而神的百姓正是把它變成廢墟。BH 說艾在耶利哥以西的山地，是以色列在迦南第一次軍事挫敗的地點，回到同一個地方順服，表明神的子民不因失敗而永久撤退。
  surfaces:
  - 艾城
- name: 艾城王
  type: 人物
  section: 人物
  evidence: |-
    第1節神說已把艾城的王交在約書亞手裡；第14節他看見以色列的陣容就清早急忙起來出戰，卻不知道城後有伏兵；第23節被生擒解到約書亞那裡；第29節被掛在樹上直到晚上，日落取下丟在城門口，上面堆成一大堆石頭。STEP 第14節為 Me.lekh- ha./'Ai（H4428G 加 H5857G），第29節「掛」是 ta.Lah（H8518，簡要詞典義 ta.lah: to hang）。CT 說『生擒』是留他活命、交由約書亞親自處置。GT《聖經精讀本》說艾城的王察看以色列軍隊的陣容之後便立即判斷他們是烏合之眾，因過於相信上一次的勝利經驗而輕易斷定；GT《綜合解讀》說亞干被埋在石堆下「直存到今日」（七26），現在艾城王也被埋在石堆下「直存到今日」。BH 說艾城的王能看見面前的以色列、卻看不見背後的危險，他的被擒顯明軍事謀略與王權都擋不住耶和華的審判。庫內已有「耶利哥王」條目可作平行，但艾城王本身尚無條目。
  surfaces:
  - 艾城王
  - 艾城的王
- name: 伯特利
  type: 地點
  section: 地點
  evidence: |-
    第9、12節兩批伏兵都埋伏在「伯特利和艾城的中間」；第17節「艾城和伯特利城沒有一人不出來追趕以色列人的」。STEP 為 beit-（H1008）。GT《啟導本》說此處提到艾城和伯特利二城聯手作戰，可能艾城為伯特利的前線基地，二城距離甚近，並說從考古資料獲知伯特利在主前14世紀末和13世紀初被毀；GT《聖經精讀本》說伯特利是位於艾城西部約3公里處的小城邑，居民對以色列入侵迦南感到威脅而與艾城聯手；GT《研經資料》說七十士譯本第17節僅有「艾城」，並說本書除12:16 外沒有再提到伯特利被以色列人攻取的事情。BH 說伯特利意為 “house of God”，是與亞伯拉罕和雅各相連的地方，提醒以色列這場征服正在應驗神古時關於這地的約。
- name: 耶利哥
  type: 地點
  section: 地點
  evidence: |-
    第2節「你怎樣待耶利哥和耶利哥的王，也當照樣待艾城和艾城的王。只是城內所奪的財物和牲畜，你們可以取為自己的掠物」——耶利哥在本章是對照組。CT 說耶利哥是神在迦南地賜給百姓的第一個得勝，所以一切財物都必須當作初熟的果子獻給神（書六17），艾城也是神賜下的得勝，但神卻允許百姓將財物和牲畜留作戰利品。GT《聖經精讀本》說只因耶利哥城是第一個征服的城邑，所以特意分別為聖歸給了神。KC 說 At Jericho everything is for the Lord, at Ai everything is for the people。BH 說耶利哥的財富作為征服的初熟果子全然歸耶和華，亞干的偷竊招來審判，而在艾城耶和華允許百姓取得掠物，供應接下來戰役所需。
- name: 亞拉巴
  type: 地點
  section: 地點
  evidence: |-
    第14節「出到亞拉巴前，要與以色列人交戰」。STEP 為 ha./'a.ra.Vah（H6160G，簡要詞典義 a.ra.vah: Arabah）。CT 原文字義給「亞拉巴」沙漠曠野，並說按原文可譯作「出到面向亞拉巴的路」，即面向約但河谷、亦即面向東邊。GT《啟導本》與《串珠》都說「亞拉巴」指約但河谷；GT《聖經精讀本》說亞拉巴常指死海南部地區（申2:8）、約但河東（申4:49）、約但河西（11:16）或加利利湖下端的整個約但河谷（撒下4:7），在這裡指約但山谷周邊的草原地區或曠野；GT《研經資料》說此處的亞拉巴有冠詞，比較可能是專有地名。BH 說 The Arabah refers to the great Jordan Rift Valley, visible from the highlands near Ai。
- name: 曠野
  type: 地點
  section: 地點
  evidence: |-
    第15節「往那通曠野的路逃跑」，第20節「那往曠野逃跑的百姓便轉身攻擊追趕他們的人」，第24節「以色列人在田間和曠野殺盡所追趕一切艾城的居民」。STEP 第15節為 De.rekh ha./mid.Bar（H1870J 加 H4057B，簡要詞典義 mid.bar: wilderness）。CT 說『通曠野的路』是迦南地的東西大道，沿著下坡向東通往約但河谷。GT《研經資料》說通「曠野」的路也就是前述的「亞拉巴」；GT《綜合解讀》說「通曠野的路」是迦南地的東西大道，向東沿下坡通往約旦河谷。BH 說以色列往艾城以東空曠荒涼的地帶奔逃，使佯裝的敗退顯得可信。
- name: 摩西
  type: 人物
  section: 人物
  evidence: |-
    第31節「照著耶和華僕人摩西所吩咐以色列人的話，正如摩西律法書上所寫的」；第32節「將摩西所寫的律法抄寫在石頭上」；第33節「正如耶和華僕人摩西先前所吩咐的」；第35節「摩西所吩咐的一切話……沒有一句不宣讀的」。STEP 第31節為 mo.Sheh 'e.ved- Yah.weh（H4872 加 H5650，簡要詞典義 e.ved: servant/slave）。CT 說第31節『摩西律法書上所寫的』請參閱申二十七5，第33節請參閱申二十七12~13。GT《丁道爾聖經注釋》說摩西的律法（希伯來：to^ra^）源自於耶和華神、透過耶和華的僕人摩西之手傳給以色列人，書八30~32應驗了申命記二十七4~8。KC 說約書亞照著神在律法中所說的行，顯出他認識神的話。BH 說約書亞遵行摩西所領受的立約指示，表明以色列的新領袖是在神所寫的律法之下治理，而不是憑個人權柄。
- name: 以色列的長老
  type: 文化
  section: 文化
  evidence: |-
    第10節「他和以色列的長老在百姓前面上艾城去」，第33節長老與官長、審判官一同站在約櫃兩旁。GT《研經資料》說在這次的戰役中約書亞和以色列的長老都是身先士卒，在百姓主力部隊前行動，可能是為了平撫上次失敗的恐懼，領導人用身先士卒的方式來安定軍心。GT《丁道爾聖經注釋》說第33至35節帶領的人中有長老、官長並審判官，還有祭司和利未人。BH 說長老作為全國公認的代表隨同約書亞，他們的在場確認這場戰役牽涉整個立約群體。
- name: 以色列人的官長
  type: 人物
  section: 人物
  evidence: |-
    第33節「和長老、官長，並審判官，都站在約櫃兩旁」。GT《丁道爾聖經注釋》說這裡列出各式各樣的人，清楚說明了參與者是誰，帶領的人中有長老、官長並審判官，還有祭司和利未人。BH 說長老、官長與審判官同站，使立約典禮具有公開與司法上的分量，因為他們在以色列各城負責施行神的律法（申16:18）。
  surfaces:
  - phrase: 官長
    verses:
    - 33
- name: 審判官
  type: 原文
  section: 原文
  evidence: |-
    第33節「和長老、官長，並審判官」。GT《丁道爾聖經注釋》把審判官與長老、官長並列為帶領的人；BH 說這些人受託在以色列各城施行神的律法（申16:18），他們的在場給立約典禮公開與司法的分量。這是本章唯一一次提到審判官，屬既有條目的跨章累積。
  surfaces:
  - phrase: 審判官
    verses:
    - 33
- name: 利未支派
  type: 人物
  section: 人物
  evidence: |-
    第33節「在抬耶和華約櫃的祭司利未人面前」。CT 說全民一致、抬約櫃的祭司在場作證。GT《丁道爾聖經注釋》說帶領的人中有長老、官長並審判官，還有祭司和利未人。BH 說祭司照耶和華的命令抬約櫃、擔任利未支派所領受的聖職，他們站在百姓面前提醒以色列，來到神面前需要神所設立的中保與聖潔。
  surfaces:
  - phrase: 利未人
    verses:
    - 33
- name: 約櫃
  type: 主題
  section: 主題
  evidence: |-
    第33節「都站在約櫃兩旁，在抬耶和華約櫃的祭司利未人面前」。CT 說全民一致，抬約櫃的祭司在場作證。KC 說 The ark takes the central place，神把祂的話與約櫃、祭壇和祝福連在一起。BH 說約櫃立在會眾中央，因為它代表耶和華的寶座與祂在百姓中間的立約同在；以色列重新委身的中心不是約書亞、不是兩座山、也不是軍事上的成功，而是那位領他們進入這地的神。
- name: 燔祭
  type: 神學
  section: 神學
  evidence: |-
    第31節「眾人在這壇上給耶和華奉獻燔祭和平安祭」。STEP 為 'o.lOt（H5930A，簡要詞典義 o.lah: burnt offering）配動詞 va/i.ya.'a.Lu（H5927I，a.lah: to ascend: offer up）。CT 說『燔祭』指整個祭物須在祭壇上經過火燒，使馨香之氣上升，全部獻給神；CT 又說燔祭是尋求神喜悅的祭，這祭也包括了赦罪的恩典。GT《聖經精讀本》說燔祭是為了全然的奉獻與贖罪而獻的祭。KC 說這壇上沒有獻贖罪祭，只有燔祭和平安祭，說出主耶穌的獻上是神所喜悅的。BH 說燔祭全然歸給神，表示為罪贖罪與完全的奉獻。
- name: 平安祭
  type: 神學
  section: 神學
  evidence: |-
    第31節「奉獻燔祭和平安祭」。STEP 為 she.la.Mim（H8002，簡要詞典義 she.lem: peace offering）配動詞 va/i.yiz.be.Chu（H2076，za.vach: to sacrifice）。CT 說『平安祭』表明獻祭者對神的感恩、虔敬與奉獻，又說平安祭是為了感恩而獻上的祭，為享用了恩典而獻，也為了認識賜恩的主而獻。GT《聖經精讀本》說平安祭是為了與神密切深交而獻的祭。KC 說平安祭對神的百姓來說是與神、與彼此相交的根據。BH 說平安祭慶祝與神恢復的相交，也是立約群體彼此的共享。
- name: 滅絕（herem）
  type: 神學
  section: 神學
  evidence: |-
    第26節「約書亞沒有收回手裡所伸出來的短鎗，直到把艾城的一切居民盡行殺滅」。STEP 為 he.che.Rim（H2763A，簡要詞典義 cha.ram: to devote/destroy）。CT 原文字義給「殺滅」滅絕、完全地毀壞，並說第2節「你怎樣待耶利哥和耶利哥的王」意指殺滅所有的人口。CT 在第24節說又在城中殺死了艾城所有的老幼婦孺，情況相當悽慘，都是因為他們敬拜偶像假神，惹動神的忌恨；GT《聖經精讀本》說第24節的光景極其淒慘，似乎與神慈愛的屬性背道而馳，表明了神是何等厭惡罪與拜偶像。BH 說艾城與先前的耶利哥一樣落在神所命定的全然毀滅之下，這見證神的聖潔與祂對迦南根深柢固之惡的審判。
  surfaces:
  - phrase: 盡行殺滅
    verses:
    - 26
- name: 荒堆（tel）
  type: 原文
  section: 原文
  evidence: |-
    第28節「約書亞將艾城焚燒，使城永為高堆、荒場，直到今日」。STEP 為 tel-（H8510，簡要詞典義 tel: mound，本節逐字解 a mound of）＋o.Lam（H5769G）＋she.ma.Mah（H8077A，簡要詞典義 she.ma.mah: devastation）。CT 原文字義給「高堆」土堆，並說意指艾城成為廢墟。GT《綜合解讀》說「高堆」（28節）、「荒堆」（申十三16）、「山岡」（耶三十18）和「亂堆」（耶四十九2）都是指中東常見的一些山丘狀廢墟，希伯來文是「Tel」，這些廢墟原來是古代居民點，歷經天災人禍幾經摧毀、夷平、重建，逐漸堆高，最後被放棄成為無人居住的土堆；GT《丁道爾聖經注釋》說「永為高堆」這個詞只在申命記十三16 出現過。BH 說艾城不只是被打敗，而是被化為神審判的紀念，這片可見的廢墟成了後代的警戒。
  surfaces:
  - phrase: 高堆
    verses:
    - 28
- name: 寄居的
  type: 原文
  section: 原文
  evidence: |-
    第33節「無論是本地人、是寄居的」，第35節「並他們中間寄居的外人」。STEP 第35節為 ha./Ger（H1616，簡要詞典義 ger: sojourner）。GT《研經資料》說「無論是本地人、是寄居的」是慣用語，是摩西五經中常出現的詞彙，指所有住在以色列當中的人，指兩者得到同等待遇；GT《丁道爾聖經注釋》說第35節最後提到了最無力保護自己權益的婦女、孩子並寄居的外人；GT《聖經精讀本》說不僅是以色列百姓參加了祝福與咒詛的宣言，連寄居其中的外邦人也參加了。BH 說神的律法對本地人與寄居者只有一個標準（出12:49）。
- name: 兩山宣告祝福與咒詛的儀式
  type: 主題
  section: 主題
  evidence: |-
    第33節「一半對著基利心山，一半對著以巴路山，為以色列民祝福，正如耶和華僕人摩西先前所吩咐的」。CT 說請參閱申二十七12~13，並說這個動作向眾人表明神的祝福是建基在律法的實行上。GT《串珠》說根據摩西的吩咐（申27:12~13），西緬、利未、猶大、以薩迦、約瑟、便雅憫這六個支派的人要站在基利心山上為百姓祝福，而流便、迦得、亞設、西布倫、但、拿弗他利六個支派則要在以巴路山上宣佈咒詛；GT《聖經精讀本》說「一半……一半」強調了神公義與慈愛的屬性。這是既有條目在約書亞記的實際執行現場。
  surfaces:
  - phrase: 為以色列民祝福
    verses:
    - 33
- name: 基利心山與以巴路山
  type: 地點
  section: 地點
  evidence: |-
