- title: 古代近東的戰場傳訊方式
  path: link_folder/背景/古代近東的戰場傳訊方式.md
  definition: '民數記十章的號聲制度不是憑空發明的，它有一整套當時通行的戰場通訊背景。


    GT《舊約聖經背景註釋》在第3～7節列出當代軍隊實際用過的幾種傳訊法：「作戰時傳達訊息，有好幾種方法。無論是戍防陣線還是空曠地區，烽火都得到廣泛使用。高舉的杖和標槍，有時亦能傳遞簡單的訊息。晚銅器時代（亦即本處經文的當代）的埃及，已經有在軍事和宗教上使用號角訊息的例證了。號角可以混合長短的角聲，傳達預定的信號。」BH
    在第2節也說，在古代近東，號角在軍事與宗教兩種場合都是常見器物。


    號角勝過其他方法的地方，在於它能同時傳到很遠又能分辨內容。GT《民數記串珠聖經註釋》點出關鍵：「吹號是要全會眾聽見，所以必須是大聲的，只藉節奏的快慢表達不同的信息。」也就是說，音量固定，靠節奏編碼——這正是本章第3至7節那套「長聲召集、短促起行」的規則。


    STEP 原文資料顯示經文用兩組不同的字把這件事分開：第3、4、7、8節「吹」是動詞 ta.qa（תָּקַע，H8628，詞典義 to blow）；第5、6節「吹出大聲」是名詞
    te.ru.''Ah（תְּרוּעָה，H8643，詞典義 shout，本節譯義為 an alarm）；到第9節進戰場時，用的又換成同一字根的動詞 ru.a（H7321，詞典義
    to shout，Hiphil 使役形）。動作是同一件事，訊號的種類卻由不同的字承擔。'
