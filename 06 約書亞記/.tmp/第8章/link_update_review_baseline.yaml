  definition: 以色列十二支派之一，源自雅各第三子利未。民數記 1 章上帝明令「不可數點」，也不計入以色列軍隊總數（民 1:47-49）。改派利未人管理法櫃帳幕及其器具，負責拆卸、搬運、豎立帳幕，並在帳幕四圍安營，謹守帳幕職務，免得忿怒臨到會眾（民
    1:50-53）。他們代替以色列頭生子歸耶和華（民 3:12, 41, 45），專司屬靈事奉，不分地業。
  development: '利未人被分別出來的起點，GT 丁良才追到金牛犢事件：利未人早已在那些敬拜金牛犢之人受罰的事上「為耶和華熱心」（出32:26-29；申33:8-9），也曾幫助祭司（出38:21），「他們到這時候方被分派襄辦帳幕的事」。


    GT《啟導本》補上這個支派的內部結構與後續發展：利未有三子革順、哥轄和米拉利（創46:11），摩西和亞倫都是哥轄的子孫；以色列人的祭司必須是亞倫的後裔；利未人沒有分得迦南的地業，分住在各支派的城邑中（書21章）；早期利未人侍奉的年歲為三十至五十歲，後來將開始服務的年齡降到二十歲（代下31:7）。


    民數記接下來幾章把這個職分逐步鋪開：民3-4 章記三大家族的具體分工，民8 章記利未人的潔淨與奉獻，民18 章劃定祭司與利未人的權責。KC 則把三種身分並列，說新約信徒按著他當下所做的事，時而是祭司、時而是利未人、時而是精兵——在聖所讚美神時是祭司，服事教會時是利未人，真理受攻擊而起來站住時是精兵；BH
    也用彼得前書二章9節的「有君尊的祭司」講同一件事。


    申命記十七章給了這個支派兩個先前沒有寫明的位置。第9節把祭司利未人放進最高法庭：難斷的案件上去以後，要見的是他們與當時的審判官。第18節則把律法書的正本放在他們那裡——王登了國位要從祭司利未人面前抄錄一本。STEP
    顯示兩處都是 ha./ko.ha.Nim ha/l.vi.Yim（H3548＋H3881）。


    GT《啟導本聖經申命記註釋》從第18節推出一件事：從本節可知在聖所中保存有一部律法書；他並說祭司、利未人負有保存律法和教導律法的責任（利十11）。民數記幾章鋪開的是帳幕的搬運與職務分工，這一章加上的是保存文本與參與判案。


    申命記十八章把這個支派的收入結構一次寫齊。第1至2節說他們在以色列中無分無業，改以獻給耶和華的火祭和一切所捐的為食；第3至5節列出祭司從獻牛羊的人手中該得的三個部位，再加上初收的五穀、新酒、油與初剪的羊毛。CT
    說他們是被分別出來事奉神，所以沒有分得土地。


    第6至8節則處理支派內部的公平：住在外地的利未人若一心願意上到中央聖所，就可以照樣事奉並領同等的一分。GT《聖經精讀本》說這條規定「防止了因獨佔中央聖所而有可能派生的特權意識」。==十七章給了這個支派兩個先前沒有寫明的位置，十八章給的則是一份帳單和一條防壟斷條款。==


    申命記二十一5 用一句話把這個支派的職分並成三項：「因為耶和華─你的神揀選了他們事奉他，奉耶和華的名祝福，所有爭訟毆打的事都要憑他們判斷。」STEP 顯示三項各有其字——事奉是
