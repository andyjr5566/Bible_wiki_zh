- title: 祝福與咒詛
  path: link_folder/主題/祝福與咒詛.md
  definition: '「祝福與咒詛」在聖經裡有兩種很不一樣的用法，這個條目兩種都收。


    一種是**族長口中對個人的宣告**。創世記二十七29 以撒給雅各的祝福裡有一組對稱句：「凡咒詛你的，願他受咒詛；為你祝福的，願他蒙福」，直接呼應神對亞伯拉罕的應許（創十二3：「為你祝福的，我必賜福與他；那咒詛你的，我必咒詛他」）。CT
    指出這是承接亞伯拉罕在神面前地位的祝福；BH 也把它讀成同一條原則的延續——人與神所揀選之人的關係，決定他所領受的是福是禍。同一章給以掃的宣告（創二十七39-40）是否也算祝福，各家有爭議，見[[以掃所得的是福還是禍]]。


    另一種是**立約文件結尾的賞罰條款**。利未記第26章用整章的篇幅，把順服的祝福（3-13節）與悖逆的咒詛（14-39節）並列，最後留下悔改復原的餘地（40-46節）。GT《串珠聖經註釋》指出這是當時的通行格式：「古時近東的條約通常都以祝福守約者及咒詛破壞條約者作結束的。」這一層的祝福咒詛不是給某一個人的，而是給整個立約群體的，並且附有條件。'
  development: '### 創27：咒詛可以代人承擔嗎


    第12至13節出現一個罕見的問題：雅各怕招咒詛，利百加說「你招的咒詛歸到我身上」。GT《舊約背景註釋》正面處理了這句話能不能成立：「本章證明祝福是不能授給他人的，宣告的若是咒詛也沒有不同。然而利百加這話的意思，大概是咒詛的惡果，而非咒詛本身。神明既是咒詛的實行者，她坦承強逼雅各欺騙父親，咒詛若是要臨到，是針對她而來。」


    換句話說，她能承擔的是後果，不是那句話本身。GT《聖經精讀本──創世記註解》從動機面補充：她敢說這種話，似乎不單出於母愛，而是帶著要成就神預言（創二五23）的使命感。


    而事情的結局兩面都應驗了：CT 指出雖然利百加願意承擔一切後果，「但結果雅各仍因此而離家在外漂泊，二十年在拉班手中受盡風霜之苦」；她自己則被迫與愛子離散，很可能再未見面。


    ### 祝福與咒詛的對等公式


    第29節末「凡咒詛你的，願他受咒詛；為你祝福的，願他蒙福」，CT 指出這是承接亞伯拉罕在神面前地位的祝福（創十二3）。BH 也把它讀成同一條原則的延續：人與神所揀選之人的關係，決定他所領受的是福是禍。


    ### 沒有提到神的祝福


    GT《聖經精讀本──創世記註解》提出一個可以核對的差別：給雅各的祝福（27-29節）提到神的名，給以掃的（39-40節）卻沒有——「沒有提神的名的祝福不能說是祝福，而是咒詛」。GT《舊約背景註釋》的判斷正好相反：關於以掃未來的宣告「不可視之為咒詛，因為它預期以掃一系繼續存在，並且至終得自由」。這兩句話直接相衝，見[[以掃所得的是福還是禍]]。


    ### 從個人的祝福到整卷書的賞罰條款


    創世記第27章的祝福是一次性的、對個人的，而且各家都強調它一旦說出就收不回去。利未記第26章的祝福咒詛則換了層級：對象是整個民族，內容是條件式的，而且被放在全卷律法的最後當作結語。GT
    丁良才點出這種收尾方式不是孤例——神在出二十22至二十三19 的律法之後也有警誡的話（出二十三20-33），摩西臨終時同樣忠告以色列人順命與逆命的結果（申二十八1至三十20）。


    他同時提醒不要把利未記第26章讀成單向的預言：「這不是將來必成的預言，乃是令以色列人懼怕的警誡，後來以色列人有時雖是遠背神的命令，有時卻也遵行神的旨意，所以享福和遭禍是輪流迴圈的」。這一點正好與族長祝福的不可更改性形成對照：族長的祝福說出去就定了，立約的賞罰卻始終掛在「你們若」這個條件上。


    ### 民6：由神制定、祭司宣讀、神親自兌現


    族長的祝福是個人一次性的宣告，立約的賞罰是整個群體有條件的條款，民數記第6章提供第三種型態：一段由神親自寫定的祝福詞，交給祭司照本宣讀（「你們要這樣為以色列人祝福，說……」，民6:23），並由神親口保證兌現（「他們要如此奉我的名為以色列人祝福；我也要賜福給他們」，民6:27）。


    GT《舊約聖經背景註釋》為它補上古代近東的認知背景：「初民相信祝福咒詛本身具有能力，能使之自行實現」；而在本段，效力的來源被明確歸給神自己而不是話語本身。CT
    在該章末尾另加了一條用詞上的分辨，正好界定這兩端：「請注意聖經的用詞，人對人是『祝福』，神對人是『賜福』。」


    ### 從文件到地形：賞罰被指定了宣告的地點


    創27 的祝福出自一個人的口，利26 與民6 的賞罰寫在文件與禮儀裡；申命記第11章多加了一樣東西——地點。第26節先把兩條路擺出來：「看哪，我今日將祝福與咒詛的話都陳明在你們面前」，第29節接著指定宣告的位置：「你就要將祝福的話陳明在基利心山上，將咒詛的話陳明在以巴路山上。」


    GT《申命記串珠聖經註釋》描述後來實際執行的場面：「以色列十二個支派要分成兩組」，六個支派站一座山，利未人宣告，百姓同聲回應阿們（書8:30-35）。抽象的賞罰條款因此有了可以站人的地形——同一片山谷，兩邊各站一半的人。


    GT《靈修版聖經註釋》在這一章也把咒詛的性質講得比前面幾處清楚：那不是術士的符咒，而是立約雙方同意的條件，「只有在背約的時候，咒詛才會臨到」。這與利26 那種「你們若」的條件句是同一個邏輯，只是申11
    把它濃縮成兩句話、兩座山。


    ### 從兩座山上的儀式到條款的全文


    申命記第十一章把祝福與咒詛分派到兩座山上，第二十七章讓利未人把咒詛一句一句宣告出來；到了第二十八章，這一組概念不再是被安排的儀式，而是條款的全文。


    GT 指出二十七至二十八章是從十二章開始的重申律法的總結，並把它與更早的一次並排：神在西奈山頒佈律法時，最後是向舊世代的百姓宣告祝福（利二十六3至13）與咒詛（利二十六14至45）；摩西在摩押平原重申律法，最後也是向新世代的百姓做同一件事。這使得利未記第二十六章與申命記第二十八章成為五經裡僅有的兩份完整賞罰條款。


    兩者的比重不同。利未記那一章的咒詛約是祝福的三倍，申命記這一章更懸殊——CT 算過：本章宣告了十二個祝福（3至14節），但咒詛（15至68節）的篇幅卻是祝福的四倍之多。


    GT 在申命記第二十八章末尾另補上一個容易被忽略的分辨，正好回答「這是不是一份交易」的疑問：在世俗的條約中，是人靠著自己的行為來賺得祝福的獎勵，但神的祝福並不是根據人的好行為，而是根據他自己的恩典和應許；人還沒有開始做任何事情，神就預先賜下「這以下的福」。==條件句管的是人能不能留在祝福裡，不是人能不能換到祝福。=='
