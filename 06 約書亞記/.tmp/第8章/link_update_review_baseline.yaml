- title: 艾
  path: link_folder/地點/艾.md
  definition: 艾是創世記十三3與伯特利並提的迦南地名。亞伯蘭初入迦南時在「伯特利和艾的中間」支搭帳棚並築壇（BH 指這座壇初建於創十二7-8），從埃及回來後又回到同一地點。BH
    指出艾的字義是「廢墟」，與伯特利「神的家」（House of God）形成對照，兩地並提本身就把「跟隨神」與「面對毀滅」兩種去向擺進同一句話，凸顯忠信與悖逆的主題；BH
    並指這一帶在日後約書亞征服迦南的敘事中再度成為要地。在本章，艾的功能是定位——標明亞伯蘭所回去的，正是他起初立壇的舊址。
  development: '創世記13章的艾沒有任何事件發生在其中，它的份量全來自伯特利與艾這組固定搭配。BH 對這組地名的讀法有兩層：地理上它標定亞伯蘭第一座祭壇的位置，敘事上它把「神的家」與「廢墟」並列。引用時要保留分寸——字義對照是
    BH 提出的解讀，創13:3 本身只記錄方位。那一章真正被強調的是「回到」這個動作：創13:3 連用「就是從前支搭帳棚的地方」、創13:4 再補「也是他起先築壇的地方」，兩句同指一地。BH
    從這個重複讀出回到最初與神相遇之處的主題，與 KC 在同段的話互相呼應——KC 說我們若偏離了、主又讓我們看清楚，就必須回到最後與主同在的那個地方（“we
    must always return to the place where we last were with the Lord”）。


    到了書7:2，同一組座標整個翻轉過來。艾不再是別人帳棚旁邊的地標，它自己成了目的地——而且是進迦南之後第一個攻不下來的目的地。BH 在書7:2 說艾的意思是
    “ruin”，看起來遠不如耶利哥難攻；CT 在書7:3 用書8:25 校正探子的判斷——那座「人少」的城實際上有一萬二千人。創13 的伯特利與艾是一個人走回起點的路標，書7:2
    的同一句話卻多出了第三個地名伯亞文，CT 給它的原文字義是虛華之家、罪孽之家。


    書7 也第一次把這座城放進地形裡。CT 說艾城的海拔約800公尺、耶利哥僅約300公尺，故書7:5 的地勢呈下坡；GT《約書亞記綜合解讀》給的數字是艾城海拔890米、耶利哥在海平面以下250米，艾城守軍居高臨下追擊以色列人。創13
    只說亞伯蘭「漸漸往伯特利去」，書7 讓讀者看見同一片山地是怎麼被人往低處逃著離開的。'
  signals: []
  accumulation_count:
  - 2
  - 3
- title: 伯特利
  path: link_folder/地點/伯特利.md
  definition: 原文意為「神的家、神的殿、神的居所」。亞伯蘭在伯特利東邊的山支搭帳棚並築壇求告耶和華的名。
  development: '### 創28：一個地方怎麼改名的


    第19節說「他就給那地方起名叫伯特利……但那地方起先名叫路斯」。CT 註「伯特利」意為神的家、神的殿，「路斯」意為避難所、剛愎的、杏樹；並指出伯特利是雅各作夢的地方，路斯原為鄰近的城名，後來才改名叫伯特利（比較士一23）。


    GT《舊約背景註釋》給了一個更細的假設：「有學者臆測路斯是城邑的本名，伯特利（直譯『神的殿』）是城外獨立的祭儀場所」；以色列人在當地定居之後，因這地與亞伯拉罕（創十二8）和雅各的關係，舊名才被淘汰。按這個讀法，兩個名字起初指的可能是兩個相鄰但不同的地點。


    ### 位置


    GT 丁良才《創世紀註釋》記它在耶路撒冷以北約三十六里，正在往示劍去的路上，亞伯拉罕曾在此築壇（創十二8；十三3-4）。GT《舊約背景註釋》說它是山地中部的重鎮，「一條東西要道就在南面經過，是客旅交會之處，也是設立祭儀場所的理想地方」。GT
    華爾頓另指出雅各走的是縱貫山地的山脊大道，由別是巴經希伯崙、伯特利、示劍——從別是巴到伯特利大約兩日路程（約60哩）。


    ### 「那地方」


    CT 注意到第11節的一個原文細節：本節按原文三次提到「那地方」都有定冠詞，表示那裡是一個特別的地方。BH 則從相反方向讀同一件事——這地方起初是無名的，正凸顯神顯現的出乎意料：祂可以在任何地方向人顯明自己。


    雅各自己的話把兩者連起來：「耶和華真在這裏，我竟不知道」（16節）。GT《聖經精讀本──創世記註解》的歸納是：神降臨不是因為人築的壇聖潔，而是神降臨的地方將變成聖潔之地。


    ### 屬靈意義


    - 伯特利=神的家（教會），艾=天然生命/世界（廢墟）

    - 亞伯蘭在伯特利與艾之間：**必須對付天然己生命（背向艾），才能進入基督身體的生命（面向伯特利）**'
  signals: []
  accumulation_count:
