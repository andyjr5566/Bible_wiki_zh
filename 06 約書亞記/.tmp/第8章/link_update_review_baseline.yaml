- title: 燔祭
  path: link_folder/神學/燔祭.md
  definition: 把祭牲完全焚燒、使煙氣上升獻給神的祭（BH 作 olah），是舊約最古老也最基本的一種獻祭。它與贖罪祭的差別在方向：GT《中文聖經註釋》指出「獻贖罪祭時，奉獻祭牲的人按手，是為認罪。但在此獻感恩的燔祭時，按手是舒誠，是向神感恩。因此祭牲的肉並不為罪所污染」。GT《舊約背景註釋》從牧民的處境說明它的份量：「牧民十分珍惜牲口的肉，然而作為豐饒象徵的牛羊都必須完全燒滅，這個對神的犧牲才算全面。向神的能力致敬的祭，必須獻得毫無保留。」至於伴隨燔祭的「馨香」，GT《串珠》給的是本義：「本描述燒烤祭肉時所產生的撲鼻香味，後用來形容祭物為神所悅納」；GT《舊約背景註釋》則把它放進古代近東的對照裡：祭物的香氣也能吸引美索不達米亞的神祇（如洪水故事《吉加墨斯史詩》），「然而這些神祇卻必須倚賴這些食物維生。按照以色列的傳統，『馨香的火祭』一語表示祭物獻得合宜，能夠討神喜歡（見：創八21）……足以蒙神悅納，並且得蒙悅納──但不是作為祂的食物──的犧牲。」
  development: '### 從一個人的舉動，到一整套制度


    燔祭在聖經裡走過的路，大致可分成四段。


    **第一段：律法之前的零星先例（創8、創22）。** 挪亞出方舟後築壇獻燔祭，亞伯拉罕帶以撒上山也是要獻燔祭。這兩次都早於西奈律法，不能把後來每項禮儀細節倒讀進去；但潔淨祭牲、祭壇、全然獻上與代替這幾個主題，在這裡已經齊備。


    **第二段：立約與會幕（出20、出24、出29）。** 出20:24 是神在頒布十誡後首次指示築壇獻祭；出24:5 的燔祭是立約儀式的一部分，先獻燔祭表示百姓接納此約；出29
    則把燔祭編進祭司承接聖職的程序，並定下每日晨昏「世世代代常獻的燔祭」。


    **第三段：正式立法與日常運作（利1-12）。** 利1 才是完整的操作規範——三級祭牲、七個步驟、獻祭者與祭司的分工。其後各章逐項補齊：利2 素祭排在燔祭之後、利3
    平安祭的脂油燒在燔祭上、利6 祭司如何維持不熄的壇火、利7 燔祭牲的皮歸祭司（全燒原則的唯一例外）、利8-9 祭司就職與首次實際獻上、利12 產婦潔淨禮把燔祭排在贖罪祭之前的特例。


    **第四段：帶著走的祭（民6）。** 拿細耳人沾染潔淨後與還俗期滿時都要獻燔祭；獻祭不再繫於一個定點，而是隨百姓的行程與身分變動延續下去。


    新約收束在來10:5-10：基督來到世上說「獻祭和祭物你不願意，但你曾給我預備了身體」——祂的自我獻上成就了燔祭的終極意義，這也是利未記把燔祭列為五祭之首的理由（KC）。


    ### 創22：字義與這一章的用法


    CT 註「燔祭」的原文字義是「上升的祭」，「獻」的字義是「舉起」，並解釋其性質：用火把祭物全燒，產生馨香之氣獻給神，故表示完全歸屬於神。它同時劃出一條界線——神在此要亞伯拉罕獻以撒為燔祭，「並不表明我們所信的神像摩洛那樣要人獻自己的兒女為祭（利二十1-5），祂的目的並不是真要殺死以撒（參12節），乃是要證實亞伯拉罕對神的信心」。


    GT 艾基斯《舊約聖經難題彙編》從用字上處理同一個問題：本章與士師記十一章耶弗他之女的記載用的是同一個「燔祭」字，他據此主張該處的意思不是在燔祭中殺死人，而是把女兒終身奉獻歸神。這是他的推論，本章的情形則由第12節的攔阻直接界定。


    GT《聖經精讀本──創世記註解》把本章與後來的制度接起來：本文與四百年後摩西的獻祭制度（利一1-9）、二千年後的十字架事件（約十九17-18）同出一脈，三者的共同點是祭物須無殘疾、須主動獻上、須犧牲並灑血（來九18-22）。'
