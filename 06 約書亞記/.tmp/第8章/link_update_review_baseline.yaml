- title: 築壇
  path: link_folder/主題/築壇.md
  definition: 築壇是創世記中族長們與神交通、敬拜神的行動。以撒在別是巴築壇求告耶和華的名。
  development: '### 創26：築壇不只是敬拜


    GT《舊約背景註釋》把第25節的三個動作放在一起讀，給了一個容易被略過的解釋：築壇、支搭帳棚、挖井「都與得地為業有關，因此是第24節立約應許的正確回應」——祭壇認定神對他說話之地的神聖，而支搭帳棚和挖井「都是大致公認，在無主之地確立所有權的方法」。換句話說，這一節同時是敬拜，也是法律行為。


    CT 從回應的角度讀同一節：以撒築壇並求告耶和華的名，是對神向他顯現和應許的回應（比較創十二7-8）。GT《聖經精讀本──創世記註解》指出「築了一座壇，求告耶和華的名」是指正式、嚴肅的敬拜（比較創四26），體現以撒無論走到哪裡都以神為中心。BH
    也把它接回亞伯拉罕的慣例（創十二7、十三18）。


    KC 把這三個動作讀成三種身分的恢復：顯現與神的話使以撒成為敬拜者（壇）、自覺的寄居者（帳棚）、以及尋求更多真理的人（挖井）——「在他偏離之後，這是何等特別的復原」。'
