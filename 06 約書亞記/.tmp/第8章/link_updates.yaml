- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  summary: '第2節神吩咐照樣待艾城和艾城的王；第22節「沒有留下一個，也沒有一個逃脫的」；第24至25節連男帶女共一萬二千，就是艾城所有的人；第26節「約書亞沒有收回手裡所伸出來的短鎗，直到把艾城的一切居民盡行殺滅」。STEP 第26節為 he.che.Rim（H2763A，簡要詞典義 cha.ram: to devote/destroy）。CT 原文字義給「殺滅」滅絕、完全地毀壞，並說第2節意指殺滅所有的人口；CT 在第24節說又在城中殺死了艾城所有的老幼婦孺，情況相當悽慘，都是因為他們敬拜偶像假神，惹動神的忌恨。GT《聖經精讀本》說第24節的光景極其淒慘，似乎與神慈愛的屬性背道而馳，表明了神是何等厭惡罪與拜偶像。BH 說艾城與先前的耶利哥一樣落在神所命定的全然毀滅之下，這見證神的聖潔與祂對迦南根深柢固之惡的審判。'
  relation: 本章的 herem 只落在人身上，財物和牲畜被第2節明文排除在外。CT 說這是從艾城開始的作法——同一道命令，在耶利哥涵蓋一切，在這裡被切成兩半。
