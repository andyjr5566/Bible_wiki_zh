- title: 掛在木頭上_懸屍示眾
  path: link_folder/歷史/掛在木頭上_懸屍示眾.md
  summary: '第29節「又將艾城王掛在樹上，直到晚上。日落的時候，約書亞吩咐人把屍首從樹上取下來，丟在城門口」。STEP 為 ta.Lah（H8518，簡要詞典義 ta.lah: to hang）加 ha./''Etz（H6086H，簡要詞典義 ets: tree），「屍首」是 niv.la.T/o（H5038，簡要詞典義 ne.ve.lah: carcass）。CT 說殺死後屍首懸掛示眾（參申二十一21~22），並說屍首不留在樹上過夜，乃遵照摩西律例的規定（參申二十一23）。GT《丁道爾聖經注釋》說將艾城的王掛在樹上，與約書亞記十26~27所記亞摩利人的五王類似，這與古代近東其他的征服記錄很接近，並說這裡提到將戰敗者的屍首懸掛示眾，也可以視為在描述戰爭行為，和一種宣傳伎倆，並不是直接根據申命記第二十一章，因為那裡乃是指對犯罪者的刑罰，不過展示屍首不過夜的原則，對罪犯和以色列的戰爭行為都適用；GT《聖經精讀本》說將死者掛在樹上，是為了使其蒙羞，並且使看的人引以為戒；GT《綜合解讀》說將戰敗者的屍首懸掛示眾，是古代中東戰爭的慣例。BH 說被打敗的王被公開示眾，作為以色列的神已審判艾城、把它的統治者交在約書亞手中的憑據。'
  relation: 這個條目先前收的例子多半是對犯罪者的刑罰，本章是戰爭場合的用法。GT《丁道爾聖經注釋》正好在這裡把兩者分開：本節不是直接根據申21:22-23，但屍首不過夜的原則兩邊都適用。
