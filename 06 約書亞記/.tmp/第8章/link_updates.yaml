- title: 基利心山與以巴路山
  path: link_folder/地點/基利心山與以巴路山.md
  summary: '第30節「那時，約書亞在以巴路山上為耶和華─以色列的神築一座壇」；第33節百姓一半對著基利心山、一半對著以巴路山。STEP 第30節為 be./Har（H2022G）加 ''ei.Val（H5858C，簡要詞典義 e.val: (Mount) Ebal）。CT 原文字義給「以巴路」石頭、禿山，「基利心」割除，並說以巴路山是陳明咒詛的山（參申十一29）。GT《聖經精讀本》說「以巴路」山位於撒瑪利亞，海拔約900米，基利心山位於以巴路山南部對面，之間有重要的東西向道路，基利心山樹木茂盛，而以巴路山則是光禿禿的荒山；GT《綜合解讀》說「以巴路山」在艾城北方大約33公里，位於示劍城北；GT《研經資料》說以巴路山高於海平面1000公尺左右，並說考古學家於以巴路山上挖掘到一座可能是這個祭壇的遺跡，祭壇位於一個山峰上，以石頭製成，寬7.6公尺，長10.6公尺，厚1.5公尺，高2.7公尺，裡面有動物的骨頭，此處出土的陶器時間大約是西元前一千兩百年。KC 說 Joshua builds the altar in Mount Ebal, the mountain of the curse。BH 說以巴路山靠近示劍、與基利心山相對，位於應許之地的中心。'
  relation: 兩座山在申命記是命令裡的地名，本章是它們成為現場的一章。壇立在宣告咒詛的那一座，與申27:4-7 的指定一致；而本章距離艾城的33公里，也讓這一段的時序成為各家討論的問題。
