- title: 寄居的
  path: link_folder/原文/寄居的.md
  summary: '第33節「以色列眾人，無論是本地人、是寄居的」；第35節「並他們中間寄居的外人」。STEP 第35節為 ha./Ger（H1616，簡要詞典義 ger: sojourner）。GT《研經資料》說「無論是本地人、是寄居的」是慣用語，是摩西五經中常出現的詞彙，指所有住在以色列當中的人，指兩者得到同等待遇。GT《丁道爾聖經注釋》說第35節最後，提到了最無力保護自己權益的婦女、孩子，並寄居的外人；GT《聖經精讀本》說不僅是以色列百姓參加了祝福與咒詛的宣言，連寄居其中的外邦人也參加了。BH 說神的律法對本地人與寄居者只有一個標準（出12:49）。'
