- title: 兩山宣告祝福與咒詛的儀式
  path: link_folder/主題/兩山宣告祝福與咒詛的儀式.md
  summary: 第33節「一半對著基利心山，一半對著以巴路山，為以色列民祝福，正如耶和華僕人摩西先前所吩咐的」，第34至35節接著宣讀祝福與咒詛。CT 說請參閱申二十七12~13，並在話中之光說這個動作向眾人表明神的祝福是建基在律法的實行上，人照著律法行，祝福就要顯在人中間。GT《串珠》說根據摩西的吩咐（申27:12~13），西緬、利未，猶大、以薩迦、約瑟、便雅憫這六個支派的人要站在基利心山上（面對以巴路山）為百姓祝福，而流便、迦得、亞設、西布倫、但、拿弗他利六個支派，則要在以巴路山上宣佈咒詛；GT《聖經精讀本》說「一半……一半」強調了神公義與慈愛的屬性，並說站在基利心山上的人象徵順服律法的人，站在以巴路山上的人則象徵不順服律法的人。KC 說我們必須學會對咒詛說「阿們」，然後才會經歷基利心山的祝福。
  relation: 申27:11-13 排的隊形在本章實際站了出來。經文的寫法值得注意：它沒有重述哪六個支派站哪一座山，只說「一半……一半」，卻把在場的每一種身分都點名了一遍。
