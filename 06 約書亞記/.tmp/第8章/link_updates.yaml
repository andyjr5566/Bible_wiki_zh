  path: link_folder/主題/祝福與咒詛.md
  summary: 第34節「隨後，約書亞將律法上祝福、咒詛的話，照著律法書上一切所寫的，都宣讀了一遍」；第35節說摩西所吩咐的一切話沒有一句不宣讀。CT 說『祝福咒詛的話』請參閱申二十七14~26；二十八1~68，並說約書亞不像那些討人歡喜的人，只講天堂不提地獄，他將祝福和咒詛的話全部宣讀。GT《聖經精讀本》說站在基利心山上的人象徵順服律法的人，站在以巴路山上的人則象徵不順服律法的人，並宣告了神將以祝福報應順服的人，以咒詛報應不順服的人。KC 說我們必須學會對咒詛說「阿們」，然後才會經歷基利心山的祝福。BH 說申27至28章的立約條款把順服與悖逆的後果擺在以色列面前，因此以色列擁有迦南與持續的信靠順服不可分割。
