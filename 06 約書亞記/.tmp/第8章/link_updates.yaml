- title: 平安祭
  path: link_folder/神學/平安祭.md
  summary: '第31節「眾人在這壇上給耶和華奉獻燔祭和平安祭」。STEP 為 she.la.Mim（H8002，簡要詞典義 she.lem: peace offering）配動詞 va/i.yiz.be.Chu（H2076，簡要詞典義 za.vach: to sacrifice）。CT 說『平安祭』表明獻祭者對神的感恩，虔敬與奉獻，又說平安祭是為了感恩而獻上的祭，為享用了恩典而獻，也為了認識賜恩的主而獻，並說兩城爭戰的經歷使以色列人明白了，他們在神面前是何等的不配。GT《聖經精讀本》說平安祭則是為了與神密切深交而獻的祭，並說當時以色列百姓暫時休戰而向神獻祭。KC 說平安祭對神的百姓來說是與神、與彼此相交的根據。BH 說平安祭慶祝與神恢復的相交，也是立約群體彼此的共享。'
  relation: 平安祭在本章與燔祭一同獻上，而中間隔著第七章的破口。CT 把這一點講得很直接：兩城爭戰的經歷讓以色列人認識了自己的不配，因此不敢隨己意而行。
