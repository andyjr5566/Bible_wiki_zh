- title: 荒堆（tel）
  path: link_folder/原文/荒堆（tel）.md
  summary: '第28節「約書亞將艾城焚燒，使城永為高堆、荒場，直到今日」。STEP 為 tel-（H8510，簡要詞典義 tel: mound，本節逐字解 a mound of）接 o.Lam（H5769G）與 she.ma.Mah（H8077A，簡要詞典義 she.ma.mah: devastation）。CT 原文字義給「高堆」土堆，並說意指艾城成為廢墟。GT《綜合解讀》說「高堆」（28節）、「荒堆」（申十三16）、「山岡」（耶三十18）和「亂堆」（耶四十九2），都是指中東常見的一些山丘狀廢墟，希伯來文是「Tel」，這些廢墟原來是古代居民點，歷經天災人禍，幾經摧毀、夷平、重建，逐漸堆高，最後被放棄，成為無人居住的土堆，而今天以色列有很多 Tel 開頭的地名；GT《丁道爾聖經注釋》說「永為高堆」這個詞只在申命記十三16 出現過；GT《聖經精讀本》說有些譯本將「高堆」譯成「廢墟」，並說被約書亞攻陷之後艾城很久以來一直處於荒廢的狀態。BH 說艾城不只是被打敗，而是被化為神審判的紀念，這片可見的廢墟成了後代的警戒。'
  relation: 申13:16 是寫給以色列人自己的規定，本章是同一個詞落在一座迦南城上。GT《丁道爾聖經注釋》指出這個詞只在那一處出現過，兩處因此互為對照。
