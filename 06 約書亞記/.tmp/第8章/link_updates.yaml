- title: 被掛在木頭上與基督被掛在樹上_徒5_30_加3_13
  path: link_folder/互文/被掛在木頭上與基督被掛在樹上_徒5_30_加3_13.md
  summary: 第29節「日落的時候，約書亞吩咐人把屍首從樹上取下來」。CT 說屍首不留在樹上過夜，乃遵照摩西律例的規定（參申二十一23）。GT《聖經精讀本》說禁止使屍體被掛在樹上過夜（申21:23），這是為了不玷污神所賜的聖地，並說耶穌卻代替罪人被掛在十字架上（加3:13）；GT《串珠》說將艾城王的屍首掛在樹上，是要進一步的羞辱他，並象徵神的咒詛，日落時取下屍首，是要避免玷污地。KC 引了申21:22-23 全文，說艾城的地界是產業的一部分、不可被玷污，被掛的人是神所咒詛的，而被掛的艾城王顯明主耶穌為每一個信祂的人取了那個位置、成了那被咒詛的一位，並引加3:13：Christ redeemed us from the curse of the Law, having become a curse for us。
