- title: 以色列人的官長
  path: link_folder/人物/以色列人的官長.md
  summary: 第33節「以色列眾人，無論是本地人、是寄居的，和長老、官長，並審判官，都站在約櫃兩旁」。GT《丁道爾聖經注釋》說這裡列出各式各樣的人，清楚說明了參與者是誰，帶領的人中有長老、官長並審判官，還有祭司和利未人。BH 說長老、官長與審判官同站，使立約典禮具有公開與司法上的分量，因為他們在以色列各城負責施行神的律法（申16:18）。
  relation: 官長在本章沒有被派任何任務，只是被點名站在那裡。這場典禮要的正是這種在場——負責執行律法的人，先站著把律法聽完。
