book: 約書亞記
chapter: 8
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。正確形狀：從前幾章講起、把本章當這條線的終點或轉折點，只寫跨章之間怎麼推進；本章的細節與引句留在本章 summary，主題發展不再重述一遍。定義與主題發展裡的經文引註一律寫「書卷簡稱＋章:節」（申32:15、民35:33），不可只寫「第15節」——條目是跨書卷跨章的，裸節號無從判斷是哪一卷哪一章；逐章累積在條目裡有章號標題涵蓋，可續用「第15節」。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第1節神對他說「不要懼怕，也不要驚惶」，並吩咐他率領一切兵丁上艾城去；第3至8節他把伏兵、詐敗、奪城、放火的次序一次交代完；第9節這夜他在民中住宿，第13節這夜他進入山谷之中；第10節清早起來點齊百姓，和以色列的長老在百姓前面上去；第15節帶頭裝敗逃跑；第18節照耶和華的吩咐伸出手裡的短鎗，第26節直到把艾城的一切居民盡行殺滅都沒有收回；第29節吩咐人把艾城王的屍首從樹上取下來；第30至35節築壇、抄寫律法、宣讀祝福與咒詛。CT 說第1節的「起來」是神第三次告訴約書亞起來，前兩次（書七10，13）是要他停止哀傷、對付敗因，這一次是要他積極進取；CT 又說第35節看得出約書亞不是祭司、照今天的看法算不上專業傳道人，事奉卻多麼徹底、認真，把祝福和咒詛的話全部宣讀。GT《研經資料》說比較書7:5，這一次攻打艾城約書亞不再自作主張，而是先求問神、尋求神的幫助；GT《研經資料》另說第10節他和長老身先士卒，可能是為了平撫上次失敗的恐懼。KC 說他讓自己與百姓一同被打敗、一同逃跑，這些羞辱的經歷由神站在他們那一邊補足。BH 說他留在百姓中間而不是遠離危險，顯出領袖與所託付之人同擔重擔。
  relation: 第7章他撕裂衣服、伏在約櫃前哀求到晚上；本章他從第一節到最後一節都在行動，而全章唯一一次停下軍事推進，是為了在以巴路山把整部律法宣讀一遍。
  overview_review:
    signals: []
    accumulation_count:
    - 24
    - 25
    definition: keep
    development: keep
- title: 艾
  path: link_folder/地點/艾.md
  summary: '本章從第1節到第29節都在寫這座城。STEP 為 ha./''Ai（H5857G，簡要詞典義 ay: Ai）。第28節「約書亞將艾城焚燒，使城永為高堆、荒場，直到今日」。CT 第1節原文字義給「艾」荒場，並說第28節意指艾城成為廢墟。GT《聖經精讀本》說「艾城」是巴勒斯坦中部的城邑，位於伯特利東南約3公里處，具有「廢墟」、「堆」之意，被擄巴比倫歸來之後便雅憫支派生活在此地，並說被約書亞攻陷之後艾城很久以來一直處於荒廢的狀態；GT《綜合解讀》說艾城位於中央山地的丘陵地帶，西邊有一條比較深的旱溪（Wadi Sheban）可以埋伏軍隊。KC 說 Ai means ‘ruin’，而神的百姓正是把它變成了廢墟。BH 說艾在耶利哥以西的山地，是以色列在迦南第一次軍事挫敗的地點，回到同一個地方順服，表明神的子民不因失敗而永久撤退。'
  relation: 第7章艾城是一個敗仗的地名，本章它成了一堆廢墟——這座城的名字本來就有「荒場」的意思，而第28節讓字義變成了實際的地貌。
  overview_review:
    signals: []
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 伯特利
  path: link_folder/地點/伯特利.md
  summary: 第9、12節兩批伏兵都埋伏在「伯特利和艾城的中間，就是在艾城的西邊」；第17節「艾城和伯特利城沒有一人不出來追趕以色列人的」。GT《啟導本》說此處提到艾城和伯特利二城聯手作戰，可能艾城為伯特利的前線基地，二城距離甚近，並說從考古資料獲知伯特利在主前14世紀末和13世紀初被毀，適在以軍進攻迦南的時期；GT《聖經精讀本》說伯特利是位於艾城西部約3公里處的小城邑，居民對以色列入侵迦南感到威脅而與艾城聯手，並在艾城被攻陷之時一起被以色列殲滅（12:16）；GT《研經資料》說七十士譯本第17節僅有「艾城」，當時可能也沒有伯特利城的居民加入，並說聖經除了在12:16 提到伯特利是以色列人攻陷的城邑之一以外，沒有再提到伯特利被以色列人攻取的事情。BH 說伯特利意為 “house of God”，是與亞伯拉罕和雅各相連的地方，提醒以色列這場征服正在應驗神古時關於這地的約。
  relation: 本章是伯特利第一次以軍事角色出現：它不是被攻打的對象，而是被牽連的鄰城。第二支伏兵之所以擺在兩城之間，正是因為這條援軍路線的存在。
  overview_review:
    signals: []
    accumulation_count:
    - 8
    - 9
    definition: keep
    development: keep
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: 第2節「你怎樣待耶利哥和耶利哥的王，也當照樣待艾城和艾城的王。只是城內所奪的財物和牲畜，你們可以取為自己的掠物」——耶利哥在本章是被拿來對照的那一座城。CT 說耶利哥是神在迦南地賜給百姓的第一個得勝，所以一切財物都必須當作初熟的果子獻給神（書六17），艾城也是神賜下的得勝，但神卻允許百姓把財物和牲畜留作戰利品；CT 在第4節的話中之光另把兩城的得勝方式並排：在耶利哥百姓只需要「繞城、呼喊」，在艾城百姓卻需要「埋伏、誘敵」。GT《聖經精讀本》說只因耶利哥城是第一個征服的城邑，所以特意分別為聖歸給了神。KC 說 At Jericho everything is for the Lord, at Ai everything is for the people。BH 說耶利哥的財富作為征服的初熟果子全然歸耶和華，亞干的偷竊招來審判，而在艾城耶和華允許百姓取得掠物，供應接下來戰役所需。
  relation: 耶利哥在本章不是地點而是尺規：人口的處置照它辦，財物的處置刻意不照它辦，連得勝的方式也沒有重複它。
  overview_review:
    signals: []
    accumulation_count:
    - 15
    - 16
    definition: keep
    development: keep
- title: 亞拉巴
  path: link_folder/地點/亞拉巴.md
  summary: '第14節「艾城的王看見這景況，就和全城的人，清早急忙起來，按所定的時候，出到亞拉巴前，要與以色列人交戰」。STEP 為 ha./''a.ra.Vah（H6160G，簡要詞典義 a.ra.vah: Arabah）。CT 原文字義給「亞拉巴」沙漠曠野，並說按原文可譯作「出到面向亞拉巴的路」，即面向約但河谷、亦即面向東邊。GT《啟導本》與《串珠》都說「亞拉巴」指約但河谷；GT《聖經精讀本》說亞拉巴常指死海南部地區（申2:8）、約但河東（申4:49）、約但河西（11:16）或加利利湖下端的整個約但河谷（撒下4:7），在這裡指約但山谷周邊的草原地區或曠野；GT《研經資料》說此處的亞拉巴有冠詞，比較可能是專有地名，並說亞拉巴在艾城東邊。BH 說 The Arabah refers to the great Jordan Rift Valley, visible from the highlands near Ai。'
  relation: 本章用亞拉巴標的是方向：它說明艾城王面朝哪一邊列陣，也說明以色列往哪一邊詐敗奔逃。整章只出現這一次，功能是把戰場的座向定下來。
  overview_review:
    signals:
    - development_blank
    - many_accumulations
    accumulation_count:
    - 6
    - 7
    definition: keep
    development:
      decision: keep
      basis: standing_debt
- title: 曠野
  path: link_folder/地點/曠野.md
  summary: '第15節「往那通曠野的路逃跑」，第20節「那往曠野逃跑的百姓便轉身攻擊追趕他們的人」，第24節「以色列人在田間和曠野殺盡所追趕一切艾城的居民」。STEP 第15節為 De.rekh ha./mid.Bar（H1870J 加 H4057B，簡要詞典義 mid.bar: wilderness）。CT 說『通曠野的路』是迦南地的東西大道，沿著下坡向東通往約但河谷。GT《研經資料》說通「曠野」的路也就是前述的「亞拉巴」；GT《綜合解讀》說「通曠野的路」是迦南地的東西大道，向東沿下坡通往約旦河谷。BH 說以色列往艾城以東空曠荒涼的地帶奔逃，使佯裝的敗退顯得可信。'
  relation: 本章的曠野不是居住地，是一條路。它的方向與坡度正好讓詐敗看起來合理，也讓追兵離城越來越遠。
  overview_review:
    signals: []
    accumulation_count:
    - 8
    - 9
    definition: keep
    development: keep
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: '第31節「照著耶和華僕人摩西所吩咐以色列人的話，正如摩西律法書上所寫的」；第32節「將摩西所寫的律法抄寫在石頭上」；第33節「正如耶和華僕人摩西先前所吩咐的」；第35節「摩西所吩咐的一切話」沒有一句不宣讀。STEP 第31節為 mo.Sheh（H4872）加 ''e.ved-（H5650，簡要詞典義 e.ved: servant/slave）與 Yah.weh（H3068G）。CT 說第31節『摩西律法書上所寫的』請參閱申二十七5，第33節請參閱申二十七12~13。GT《丁道爾聖經注釋》說摩西的律法源自於耶和華神、透過耶和華的僕人摩西之手傳給以色列人，而書八30~32應驗了申命記二十七4~8。KC 說約書亞照著神在律法中所說的行，顯出他認識神的話。BH 說約書亞遵行摩西所領受的立約指示，表明以色列的新領袖是在神所寫的律法之下治理，而不是憑個人權柄。'
  relation: 摩西在本章已經去世，卻是後六節每一個動作的來源：壇怎麼築、字寫在哪裡、誰站哪一座山、要念多少，全都回到他所吩咐的。「耶和華僕人摩西」這個稱呼在這一段裡出現了兩次。
  overview_review:
    signals: []
    accumulation_count:
    - 78
    - 79
    definition: keep
    development: keep
- title: 以色列的長老
  path: link_folder/文化/以色列的長老.md
  summary: 第10節「約書亞清早起來，點齊百姓，他和以色列的長老在百姓前面上艾城去」；第33節長老與官長、審判官一同站在約櫃兩旁。GT《研經資料》說在這次的戰役中，約書亞和以色列的長老都是身先士卒，在百姓主力部隊前行動，可能是為了平撫上次失敗的恐懼，領導人用身先士卒的方式來安定軍心。GT《丁道爾聖經注釋》說第33至35節帶領的人中有長老、官長並審判官，還有祭司和利未人。BH 說長老作為全國公認的代表隨同約書亞，他們的在場確認這場戰役牽涉整個立約群體。
  relation: 長老在本章出現兩次，位置很不一樣：一次在陣前帶頭上去，一次在約櫃旁站著聽律法。同一批人既負責打仗，也負責見證立約。
  overview_review:
