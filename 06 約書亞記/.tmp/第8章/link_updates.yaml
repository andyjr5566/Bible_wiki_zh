- title: 燔祭
  path: link_folder/神學/燔祭.md
  summary: '第31節「眾人在這壇上給耶和華奉獻燔祭和平安祭」。STEP 為 ''o.lOt（H5930A，簡要詞典義 o.lah: burnt offering）配動詞 va/i.ya.''a.Lu（H5927I，簡要詞典義 a.lah: to ascend: offer up）。CT 說『燔祭』指整個祭物須在祭壇上經過火燒，使馨香之氣上升，全部獻給神，又說燔祭是尋求神喜悅的祭，這祭也包括了赦罪的恩典。GT《聖經精讀本》說燔祭是為了全然的奉獻與贖罪而獻的祭。KC 說這壇上沒有獻贖罪祭，只有燔祭和平安祭，說出主耶穌的獻上是神所喜悅的。BH 說燔祭全然歸給神，表示為罪贖罪與完全的奉獻。'
  relation: 本章的燔祭獻在一座剛築好的壇上，而那座壇立在宣告咒詛的以巴路山。GT《華爾頓約書亞記背景注釋》特別指出這裡所獻的祭只有燔祭和平安祭，沒有贖罪祭、贖愆祭。
