- title: 土壇
  path: link_folder/神學/土壇.md
  summary: '第31節「是用沒有動過鐵器的整石頭築的，照著耶和華僕人摩西所吩咐以色列人的話，正如摩西律法書上所寫的」。STEP 為 miz.Bach（H4196）加 ''a.va.Nim（H68G）與 she.le.Mot（H8003，簡要詞典義 sha.lem: complete），「沒有動過鐵器」是 lo''- he.Nif（H5130B，簡要詞典義 nuph: to wave）加 bar.Zel（H1270，簡要詞典義 bar.zel: iron）。CT 原文字義給「動過」來回搖動，攪動，並說『沒有動過鐵器』即指不可切割、研磨和鑿劈，用意在保持渾然天成，避免人工的玷污（參出二十25）；CT 又說我們可以想像得到這壇的外貌一定是很不美觀，但他們認定這是神的定意，就不管事情的大小，都無條件的遵行。GT《聖經精讀本》說用未曾經過人為雕琢的而以自然狀態的石頭築壇的事實，告訴我們坦誠而真實的敬拜的重要性；GT《華爾頓約書亞記背景注釋》說這壇似乎是特別為這一次的慶典築造，不是作為永久性建築，這是使用未加工粗石的另一個理由，並說在此所獻的祭只有燔祭和平安祭，沒有贖罪祭、贖愆祭。KC 說這壇也是主耶穌的圖畫，它未經加工、全然完美。BH 說未經人手工具的石頭見證人的技巧、驕傲或發明無法改良到神面前的通路。'
  relation: 出20:24-26 給規定、申27:5-6 重申，本章是這條規定在迦南地的執行。GT 所收艾基斯《舊約聖經難題彙編》也在這一節處理了約書亞在山上築壇與後來神責難「高處」之間的張力，他的答案正是訴諸出20:24「凡記下我名的地方，我必到那裡賜福給你」，並指出神對「高處」的責難乃向耶羅波安第一所設立的祭壇而發。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
    - 4
    definition: keep
    development: keep
- title: 立石寫律法的儀式
  path: link_folder/主題/立石寫律法的儀式.md
  summary: '第32節「約書亞在那裡，當著以色列人面前，將摩西所寫的律法抄寫在石頭上」。STEP 為 va/i.yikh.tov（H3789，簡要詞典義 ka.tav: to write）加 mish.Neh（H4932H，簡要詞典義 mish.neh: second，本節逐字解 <the> copy of）與 to.Rat（H8451，簡要詞典義 to.rah: instruction）mo.Sheh（H4872）。CT 原文字義指出「寫」與「抄寫」在原文是同一個字，並說請參閱申二十七8。GT《啟導本》說抄寫在石頭上的當為律法的精髓，寫的方法是先在石頭上油石灰，再刻字（申二十七2~3），由於時間有限，在這次儀式中宣讀的律法不會太長；GT《雷氏研讀本》說這裡的「石頭」不是壇的石頭，而是一根大柱子的石頭；GT《綜合解讀》說「石頭」指「墁上石灰」（申二十七2）的幾塊大石頭，上面可以寫字；GT《華爾頓約書亞記背景注釋》比較刻著漢摩拉比法典的石碑，說它是用閃長岩造成，高達八呎，公開展示以便查閱，王室的碑文通常都是安放在顯眼之處，反之古代近東的條約則經常安置在聖處，一般人無法得見。BH 說這可見的刻文把神的話立在以色列在迦南生活的中心。'
  relation: 申27:2-8 的命令在本章執行，經文只用一節寫完。各家對抄寫的究竟是律法的哪一部分仍沒有定論，GT《啟導本聖經約書亞記註釋》從時間限制推測，那當為律法的精髓。
