- title: 古代近東的戰場傳訊方式
  path: link_folder/背景/古代近東的戰場傳訊方式.md
  summary: 第8節約書亞吩咐伏兵「你們奪了城以後，就放火燒城」，第19節伏兵「跑進城去，放火焚燒」，第20節「城中煙氣沖天」，第21節「城中煙氣飛騰」；另有第18、26節約書亞高舉的短鎗。CT 說第8節『放火燒城』是發出信號，第19節同樣註明放火焚燒是發出信號，並說第20節的『煙氣』對艾城的人來說是噩耗，而第21節的『煙氣』對以色列人來說乃是喜訊。GT《研經資料》說放火燒城，主要是用來讓城外的敵軍一面想要抵抗敵人，一面也想回去拯救城池，造成軍心與陣勢的混亂；GT《聖經精讀本》說這場火向以色列與艾城的軍隊通報了城已被攻陷，以這場火為信號，逃跑的以色列轉換方向開始反攻；GT《啟導本》另說約書亞用矛頭反射日光通知埋伏城後的以軍攻城。BH 說從艾城升起的煙成了把它軍隊困在以色列兩軍之間的信號。
  relation: 民10 記的是號角制度，本章記的是同一份清單上另外兩項的實戰用法：燒城的煙，以及高舉的兵器。值得注意的是短鎗算不算訊號，各家並沒有共識。
