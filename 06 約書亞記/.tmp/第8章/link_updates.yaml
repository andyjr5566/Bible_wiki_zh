- title: 築壇
  path: link_folder/主題/築壇.md
  summary: '第30節「那時，約書亞在以巴路山上為耶和華─以色列的神築一座壇」。STEP 為 yiv.Neh（H1129，簡要詞典義 ba.nah: to build）加 miz.Be.ach（H4196，簡要詞典義 miz.be.ach: altar）。CT 在話中之光說以色列人進入中央山地的第一件事，不是趁熱打鐵、擴大戰果，而是照著摩西的吩咐到以巴路山為神築壇，重申聖約，因為耶利哥和艾城的經歷已經告訴他們：有了神，就必有得勝；沒有神，到手的得勝也不能長久。GT《丁道爾聖經注釋》說書八30~32應驗了申命記二十七4~8；GT《華爾頓約書亞記背景注釋》說這壇似乎是特別為這一次的慶典築造，不是作為永久性建築。KC 說 By building the altar Joshua claims the land for the LORD。BH 說這座壇宣告以色列的得勝出於耶和華，也宣告與祂相交需要贖罪與分別為聖。'
  relation: 這個條目先前收的築壇多半是列祖在神向他們顯現的地方立的，本章的壇是照命令立在指定的山上，而且緊接在一場戰役之後。
