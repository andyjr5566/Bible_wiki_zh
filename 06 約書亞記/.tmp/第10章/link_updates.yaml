- title: 掛在木頭上_懸屍示眾
  path: link_folder/歷史/掛在木頭上_懸屍示眾.md
  summary: '第26節「隨後約書亞將這五王殺死，掛在五棵樹上。他們就在樹上直掛到晚上」；第27節日頭要落的時候把屍首從樹上取下來。STEP 顯示第26節是 va/i.yit.Le/m（H8518，簡要詞典義 ta.lah: to hang）''al cha.mi.Shah ''e.Tzim（H2568 加 H6086H）。CT 說『直掛到晚上』是以色列人的慣例，不將屍首掛在樹上過夜（申21:23）。GT《研經資料》說第26節強調五王是首先被殺、然後才掛在樹上，可見這與處死無關而是對待屍首的方法，屍首被丟在這些王曾躲藏的洞內表示沒有被安葬、算是能給敵人最高的羞辱；GT《華爾頓約書亞記背景注釋》說很多學者相信它所指的是將屍體插在刑架上，類似後世亞述和波斯的作法，埃及偶爾亦有曝屍的作法，而曝屍代表最後一次的侮辱和褻瀆；GT《綜合解讀》說即使是在歡慶得勝的時候，約書亞也沒有忘記順服神的命令。BH 說屍體掛在木頭上帶著神咒詛的記號（申21:22-23），最終指向基督為祂的百姓擔當了咒詛（加3:13）。'
  relation: 本章一次掛了五個王，是這個作法在約書亞記裡規模最大的一次；也是唯一一次經文明寫「日頭要落的時候」就取下來，把申21:23 的規定與延長了的那一天接在一起。
