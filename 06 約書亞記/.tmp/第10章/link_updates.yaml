- title: 勉勵他使他膽壯（cha.zaq、a.mats）
  path: link_folder/原文/勉勵他使他膽壯（cha.zaq、a.mats）.md
  summary: '第25節「約書亞對他們說：你們不要懼怕，也不要驚惶。應當剛強壯膽，因為耶和華必這樣待你們所要攻打的一切仇敵」。STEP 顯示「剛強壯膽」是兩個並列的命令式 chiz.Ku（H2388G，簡要詞典義 cha.zaq: to strengthen: strengthen）與 ve./''im.Tzu（H553，簡要詞典義 a.mats: to strengthen），前半的「不要懼怕」是 ''al- ti.re.''U（H408 加 H3372G），「不要驚惶」是 ve./''al- te.Cha.tu（H408 加 H2865，簡要詞典義 cha.tat: to to be dismayed）。CT 說這意指以此次軍事行動為例，顯示今後征服迦南全土之事不足為懼。GT《綜合解讀》說神勉勵約書亞「不要懼怕」（8節；一9；八1），約書亞也勉勵部下「不要懼怕」（25節），一個屬靈的領袖應該借一切機會把從神而來的信心傳遞出去；GT《研經資料》說第25節這段約書亞對大家講的話讓人不禁想起書1:7、9 神激勵約書亞所講的話。BH 說爭戰有真實的危險、仇敵頑強、順服要持久，所以需要勇氣，而耶和華已經在耶利哥、艾城和基遍顯明祂的能力，過去的信實給了將來順服的保證。'
  relation: 這是本章唯一一次由約書亞說出這組命令，而且對象是軍長。神在第8節對他說的話，他在第25節原封不動轉出去——同一組動詞從書1 到這裡換了說話的人。
