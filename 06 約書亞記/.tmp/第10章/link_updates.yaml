book: 約書亞記
chapter: 10
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。正確形狀：從前幾章講起、把本章當這條線的終點或轉折點，只寫跨章之間怎麼推進；本章的細節與引句留在本章 summary，主題發展不再重述一遍。定義與主題發展裡的經文引註一律寫「書卷簡稱＋章:節」（申32:15、民35:33），不可只寫「第15節」——條目是跨書卷跨章的，裸節號無從判斷是哪一卷哪一章；逐章累積在條目裡有章號標題涵蓋，可續用「第15節」。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第7節他率一切兵丁與大能的勇士從吉甲上去；第9節終夜行軍猛然臨到；第12節在以色列人眼前禱告求日月停住；第18至19節下令封洞並繼續追擊；第24至25節召軍長來把腳踏在五王頸項上並勉勵他們不要懼怕；第26至27節處死五王並在日落前取下屍首；第28至39節連續攻取南方六城。CT 在第7節話中之光說約書亞和首領受基遍人欺騙以後本可以慢慢地前往援救，但是他們仍立刻趕去施援，顯出他的正直；CT 又說第8節「不要怕他們」是因亞摩利人身材高大、以色列人素來害怕巨人族（民13:32~33）。GT《綜合解讀》說神勉勵約書亞「不要懼怕」（8節；一9；八1），約書亞也勉勵部下「不要懼怕」（25節），一個屬靈的領袖應該借一切機會把從神而來的信心傳遞出去；GT《聖經精讀本》說約書亞不愧是卓越的戰略家，使用襲擊戰術令敵人魂飛魄散。KC 說本章的約書亞與前幾章那個失敗的約書亞不同，他在這裡顯出那使他如此像主耶穌的神聖能力。BH 說約書亞毫不遲延地回應立約盟友的求告。
  relation: 本章是他第一次同時做三件事：守約出兵、當眾禱告、公開審判被擒的王。第12節的禱告尤其特別——CT 說那是用眾人能聽見的聲音大聲禱告，而第14節說耶和華聽人的禱告沒有像這日的。
  overview_review:
    signals:
    - many_accumulations
    accumulation_count:
    - 26
    - 27
    definition: keep
    development:
      decision: keep
      basis: standing_debt
- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  summary: '第6節基遍人求援時說「因為住山地亞摩利人的諸王都聚集攻擊我們」；第12節「當耶和華將亞摩利人交付以色列人的日子」。STEP 第12節為 ha./''e.mo.Ri（H567，簡要詞典義 e.mo.ri: Amorite）。CT 說『山地亞摩利人』指亞摩利人多住在山區，又說第5節『五個亞摩利王』可能是山地諸城之統治者的泛稱，因耶路撒冷居民多為耶布斯人、希伯崙居民為赫人（創23:2~3）。GT《綜合解讀》說「亞摩利」有時指亞摩利人、有時是迦南人的統稱，這五個城可能都是亞摩利人，而基遍人是「希未人」、屬於不同的民族；GT《聖經精讀本》說居住在山地的亞摩利人與居住在海岸線的迦南人有著明顯的區別；GT《研經資料》說基遍人口中的「諸王」應該是誇大用語。BH 說 Amorite 這個稱謂廣泛涵蓋在山地與周邊地區抵擋以色列的迦南勢力。'
  relation: 本章把「亞摩利人」用成一個勢力範圍的稱呼而不是族譜分類——同一批王，第5節叫五個亞摩利王，第6節叫住山地亞摩利人的諸王，而其中耶路撒冷王其實屬耶布斯族。
  overview_review:
    signals: []
    accumulation_count:
    - 18
    - 19
    definition: keep
    development: keep
- title: 耶路撒冷
  path: link_folder/地點/耶路撒冷.md
  summary: 第1、3節耶路撒冷王亞多尼洗德聽見消息、發起聯軍；第5節五王名單以它為首；第23節它的王被從洞裡帶出來。CT 原文字義給「耶路撒冷」平安的訓誨，並說耶路撒冷又名耶布斯（書15:8），位於基遍東南方約十公里，城內居民多為耶布斯人。GT《研經資料》說當時的名字應該叫「耶布斯」（撒下5:6~8），此處可能是後來的文士為了讀者加以修訂的，而書15:8、18:28 的「耶布斯就是耶路撒冷」也顯出這個地名的演變傳統，並記下西元前十四世紀亞馬拿書信中耶路撒冷王至少寫過五封信給埃及法老；GT《綜合解讀》說在這五城中耶路撒冷地勢最高，其他各城位於較低的示非拉丘陵，所以耶路撒冷王說「上來幫助我」；GT《啟導本》說耶路撒冷最近基遍，以色列人南下該城首當其衝。KC 說除了創世記14章提到撒冷王麥基洗德之外，這裡是耶路撒冷第一次被提及，並說本章沒有攻取耶路撒冷。BH 說耶路撒冷當時是設防的耶布斯城，後來才成為大衛的京城與以色列敬拜的中心。
  relation: 這是耶路撒冷以本名進入敘事的第一次，而它出場的身分是敵方盟主。本章殺了它的王，卻沒有攻下它的城。
  overview_review:
    signals:
    - first_in_book
    - development_blank
    accumulation_count:
    - 2
    - 3
    definition:
      decision: keep
      basis: already_covered
      covered_by: 耶路撒冷（Jerusalem），古稱撒冷（Salem），意為「平安/和平之城」
    development:
      decision: update
      synthesis_scope:
      - 創世記:14
      - 申命記:12
      - 約書亞記:10
- title: 希伯崙
  path: link_folder/地點/希伯崙.md
  summary: 第3、5、23節希伯崙王何咸列於五王；第36至37節以色列人從伊磯倫上希伯崙去，奪了希伯崙和屬希伯崙的諸城邑。CT 原文字義給「希伯崙」聯合，說它位於耶路撒冷西南方三十公里、伊磯倫的東方，並說第37節的「與王」大概是指繼任的王，因原來的希伯崙王何咸已經被殺。GT《研經資料》說字義是「聯合」、「同盟」，是目前的 Tell er~Ruemideh，亞伯拉罕曾在此築壇（創13:18），大衛作王的前七年以該城為猶大國首都（撒下5:5），並說書15:13~14 說是迦勒趕出當地的亞納族人；GT《華爾頓約書亞記背景注釋》說由於晚銅器時代的文化層尚未在希伯崙發現，考古學不能提供什麼約書亞和以色列人滅城的資料，因為現代希伯崙市建於古城原址之上；GT《綜合解讀》與 GT《啟導本》都說南方戰役中被殺的希伯崙王可能是繼任者。BH 說希伯崙是與亞伯拉罕、以撒、雅各相連的古老要城，後來成為迦勒的產業，再後來成為大衛第一個王都。
  relation: 本章的希伯崙出現兩次而且身分不同：第3至23節是五王聯軍的成員，第36至39節是南征清單裡的一座城，兩處的王還可能不是同一個人。它也是南征路線由低地折回山地的那一站。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 4
    - 5
    definition: keep
    development: keep
- title: 加低斯
  path: link_folder/地點/加低斯.md
  summary: '第41節「約書亞從加低斯巴尼亞攻擊到迦薩」。STEP 為 mi./ka.Desh bar.Ne.a''（H6947，簡要詞典義 qa.desh bar.ne.a: Kadesh-barnea）。CT 原文字義給「加低斯巴尼亞」神聖的，說它位於尋的曠野，並說本句的意思是從南到北、代表此次戰役的西界。GT《研經資料》說在尋的曠野（民20:1；33:36），距別是巴83公里，代表應許地尼革地區和西乃曠野的邊界，它是以色列人最初想進入迦南的地點但他們卻在那裡遭逐回（申9:23）；GT《丁道爾聖經注釋》說加低斯巴尼亞是和西乃曠野交界之處；GT《華爾頓約書亞記背景注釋》說它代表應許地尼革地區和西乃曠野的邊界；GT《串珠》說在別是巴以南約八十九公里。BH 說加低斯巴尼亞標誌著以色列從南邊進入迦南的入口，也讓人想起那使全國滯留曠野的不信（民13-14），而進入這地的一代領受了上一代不肯信靠神而拒絕的產業。'
  relation: 在本章它是一個界標，不是一個事件現場。但它的位置本身帶著記憶——同一個地方，上一代從那裡被逐回，這一代從那裡打進來。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 10
    - 11
    definition:
      decision: keep
      basis: already_covered
      covered_by: 位於南地，是以色列人出埃及後最重要的曠野駐紮地，也是探子出發窺探迦南的地方
    development: keep
- title: 迦薩
  path: link_folder/地點/迦薩.md
  summary: '第41節「約書亞從加低斯巴尼亞攻擊到迦薩」。STEP 為 ''a.Zah（H5804，簡要詞典義 az.zah: Gaza）。CT 原文字義給「迦薩」強壯，並說迦薩位於希伯崙以西約五十公里的地中海岸邊一條狹長平地、又在加低斯巴尼亞的正北方。GT《串珠》說迦薩在希伯崙以西約五十公里（卅七英里）；GT《丁道爾聖經注釋》說迦薩代表和埃及在西邊的交界，在歷史上一離開埃及之後頭一個碰到的迦南人之城就是迦薩；GT《華爾頓約書亞記背景注釋》說迦薩在加低斯巴尼亞正北面約六十哩外，代表地中海沿岸、巴勒斯坦和西乃半島埃及屬地之間的邊界，這兩個地點形成應許之地西南方的疆界。BH 說迦薩位於西南方的沿海平原，後來成為非利士人的主要城市。'
  relation: 迦薩在本章與加低斯巴尼亞成對，一南一北標出南方戰役的西界。經文說「攻擊到」而不是「奪了」——它是範圍的端點，不是被攻下的城。
  overview_review:
    signals:
    - first_in_book
    - development_blank
    accumulation_count:
    - 1
    - 2
    definition: update
    development:
      decision: update
      synthesis_scope:
      - 申命記:2
      - 約書亞記:10
- title: 基遍
  path: link_folder/地點/基遍.md
  summary: 第1至5節五王因基遍與以色列立和約而聯合來攻；第6節基遍人打發人往吉甲求援；第10節「約書亞在基遍大大的殺敗他們」；第12節「日頭啊，你要停在基遍」；第41節基遍是南方戰役東界最北的一點。CT 說第2節『如都城一般』意指好像有王治理的城一般，暗示基遍並沒有王、是由長老治理的。GT《丁道爾聖經注釋》說以色列人控制了便雅憫高地，再通過伯和崙隘口可達沿海的平原和西邊的低地，南方諸王深恐失去這個險要的中心；GT《綜合解讀》說基遍離耶路撒冷只有13公里，扼守從約旦河谷經中央山地向西到沿海平原的東西大道，不但控制著迦南地的東西要道而且直接威脅到耶路撒冷；GT《華爾頓約書亞記背景注釋》說山地和平原之間的主要通道之一是伯和崙和亞雅崙谷之間的山隘，這是基遍所控制的地區；GT《聖經精讀本》說基遍不僅比伯特利或艾城大而且離耶路撒冷更近。KC 說基遍人透過友誼使以色列人如今也有義務為他們動員。BH 說基遍雖由長老治理而非以王為首，卻具有王城等級的地位、力量與影響力。
  relation: 上一章基遍靠詭計換來一紙和約，本章那紙和約立刻要以色列人付代價——也立刻替以色列人打開了南方的戰局。同一座城，前一章是被審問的一方，這一章是被拯救的一方。
  overview_review:
    signals:
    - development_blank
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 約書亞記:9
      - 約書亞記:10
- title: 吉甲
  path: link_folder/地點/吉甲.md
  summary: 第6節基遍人打發人往吉甲的營中去見約書亞；第7、9節約書亞從吉甲上去、終夜行軍；第15、43節「約書亞和以色列眾人回到吉甲的營中」。CT 原文字義給「吉甲」滾動、滾去，並在第43節話中之光說吉甲是以色列人過約但河以後全體在那裡行割禮的地方，每一次屬靈爭戰的開始和結束都應該像約書亞那樣回到吉甲的營中。GT《綜合解讀》說9至15節是概述南方戰役、16至43節是詳述南方戰役，兩者都是以回到吉甲為結束，每次爭戰結束他們都是全體回到吉甲的約櫃面前；GT《研經資料》說耶利哥到基遍直線距離大約25公里、走山路大約30公里，吉甲位於耶利哥附近，並說七十士譯本沒有10:15；GT《丁道爾聖經注釋》說以色列人是從吉甲出發的，現在他們返回聖所所在之地。KC 說軍隊總是留在吉甲，在那裡他們總是被提醒割禮這件事，而這是為下一場爭戰得力所必需的。BH 說吉甲是以色列過約但河後的中央營地，他們在那裡藉割禮重新立約、守逾越節。
  relation: 本章兩次寫「回到吉甲的營中」（第15、43節），一次收束概述、一次收束詳述。南征打到迦南最南端，大本營始終沒有前移。
  overview_review:
    signals: []
    accumulation_count:
    - 4
    - 5
    definition: keep
    development: keep
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: 第1節亞多尼洗德聽見以色列人「怎樣待耶利哥和耶利哥的王，也照樣待艾城和艾城的王」；第28、30節瑪基大王與立拿王的處置都是「像從前待耶利哥王一樣」。CT 說第28節這是根據神的命令，迦南地各城均不留活口，以免以色列人被誘惑去敬拜偶像假神。GT《丁道爾聖經注釋》說亞多尼洗德聽見的消息是以色列人不但勝過了艾城和耶利哥並且將其盡行毀滅。BH 說耶利哥是藉神蹟式的介入而傾覆、艾城則是藉神所賜的策略，兩場得勝都顯明結果不在於以色列的人數或軍事技巧。
  relation: 耶利哥在本章沒有再發生任何事，卻被引用了三次——一次作為敵人恐懼的理由，兩次作為處置的標準。它已經從一座城變成一個量度別的城的尺。
  overview_review:
    signals: []
    accumulation_count:
    - 17
    - 18
    definition: keep
    development: keep
- title: 艾
  path: link_folder/地點/艾.md
  summary: 第1節「耶路撒冷王亞多尼洗德聽見約書亞奪了艾城，盡行毀滅」；第2節「因為基遍是一座大城，如都城一般，比艾城更大」。CT 原文字義給「盡行毀滅」完全地毀壞。GT《聖經精讀本》說以色列藉著佔領伯特利、艾並與基遍締結同盟，將迦南劃分為兩半、確保了重要中央根據地。BH 說艾城的傾覆顯明恢復與神的相交帶來重新的得勝，並說基遍在規模與重要性上都超過艾城。
  relation: 本章兩次提到艾城都是拿它當比例尺：第1節用它說明以色列人怎麼處置攻下的城，第2節用它說明基遍有多大。
