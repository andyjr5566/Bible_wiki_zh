- title: 耶和華是戰士
  path: link_folder/神學/耶和華是戰士.md
  summary: 第10節耶和華使他們潰亂；第11節耶和華從天上降大冰雹；第14節「在這日以前，這日以後，耶和華聽人的禱告，沒有像這日的，是因耶和華為以色列爭戰」；第42節「因為耶和華─以色列的神為以色列爭戰」。CT 說第11節「被冰雹打死的，比以色列人用刀殺死的還多」意指戰爭的勝利歸於神，並在話中之光說表明決定爭戰勝敗的是神而不是人；CT 又說第14節「是因耶和華為以色列爭戰」只因神視這一次的爭戰全然屬於祂。GT《聖經精讀本》說本章再一次證明神「為以色列而爭戰」（14節；出14:14；申1:30），降冰雹擊殺仇敵並使太陽停住；GT《丁道爾聖經注釋》說這場戰役的得勝，神和約書亞都有份。KC 說耶和華一同爭戰，祂使敵人混亂好讓百姓得勝，並說祂在冰雹裡有祂自己的兵器。BH 說耶和華是為祂百姓爭戰的勇士，忠實地保護那些藉約與祂相連的人。
  relation: 本章把這句話用兩次收尾：第14節收束日月停住那一段，第42節收束整場南征。中間夾著潰亂、冰雹、延長的白日三件事，全部沒有一件是以色列人做的。
