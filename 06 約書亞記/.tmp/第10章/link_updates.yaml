- title: 堆石頭作記號
  path: link_folder/主題/堆石頭作記號.md
  summary: 第18節約書亞吩咐「你們把幾塊大石頭滾到洞口，派人看守」；第27節屍首丟進洞裡之後「把幾塊大石頭放在洞口，直存到今日」。STEP 顯示第27節是 'a.va.Nim ge.do.lOt（H68G 加 H1419A）——與第11節從天上降下的「大石頭」是同一個詞組。CT 說第18節是防備他們逃脫，第27節意指將五王的屍首丟在山洞裡作為紀念。GT《丁道爾聖經注釋》說在約書亞的指揮之下以色列人仿效神的作為、也用到圓形大石，而洞口的大石頭在第27節又再度提及，以大石封住的洞先成了這些首領的監牢、後來又成了他們的墳墓；GT《研經資料》說當時有些傳統故事的內容是把大石頭滾到仇敵躲藏的洞口、目的是要把仇敵餓死。BH 說封住的石頭立起了一個可見的紀念，宣告人的力量無法推翻神的旨意。
  relation: 本章的石頭一次做了三件事：先當門閂（第18節）、再當墓封（第27節）、最後當記號（直存到今日）。而丁道爾指出的那層對照更值得記——神從天上扔下的和人滾到洞口的，原文是同一個詞。
