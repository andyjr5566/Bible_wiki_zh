- title: 直到今日
  path: link_folder/主題/直到今日.md
  summary: '第27節「把幾塊大石頭放在洞口，直存到今日」。STEP 顯示這一句是 ''ad- ''E.tzem hai./Yom ha./Zeh（H5704 加 H6106H，簡要詞典義 e.tsem: bone: same，加 H3117G 與 H2088）。CT 說這意指將五王的屍首丟在山洞裡作為紀念。BH 說封住的洞口成為耶和華勝過迦南諸王聯盟的可見紀念，那些石頭宣告人的力量不能推翻神的旨意，而這個持續存在的紀念向後代作見證：耶和華曾照祂所應許的為以色列爭戰。'
  relation: 這一次「直到今日」指的是一個墳墓的封口。前面幾次指向的是紀念神做了什麼（書4:9）或人做了什麼（書7:26），這一次兩者合在一起：石頭底下是敵人的屍首，石頭本身是神得勝的記號。
