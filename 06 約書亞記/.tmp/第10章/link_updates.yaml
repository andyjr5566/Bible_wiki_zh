- title: 啟示錄 16-21（末世大冰雹）
  path: link_folder/互文/啟示錄 16-21（末世大冰雹）.md
  summary: 第11節耶和華從天上降大冰雹打死亞摩利聯軍。KC 在這一段之後直接接上末世的應用：The prophetic application is obvious when we think of the book of Revelation, where we also see hailstones coming as judgment from heaven (Rev 16:21)，並說 The events in Joshua indicate the final victory（約書亞記裡的事件指向最終的得勝），又說若我們因主耶穌的顯現而歡喜，也會樂見神潔淨全地一切的惡、我們的爭戰在最終的得勝裡結束。GT《聖經精讀本》也說在聖經中冰雹是神的審判工具（出9:13~34；賽28:2，17；結38:22）。
  relation: KC 把本章的冰雹讀成一個預告：同樣是從天而降的雹，一次落在亞摩利聯軍身上，一次要落在末世的世界上。本條目在本章沒有對應的經文字面詞，只出現在本章整理的知識節點。
  overview_review:
    signals:
