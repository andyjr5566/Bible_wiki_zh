- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  summary: 第1節「約書亞奪了艾城，盡行毀滅」；第28、35、37、39、40節反覆出現「盡行殺滅」。CT 原文字義給「盡行殺滅」完全地毀壞，並說第28節這是根據神的命令，迦南地各城均不留活口，以免以色列人被誘惑去敬拜偶像假神。GT《研經資料》說「盡行毀滅」原意是「滅絕」、「完全毀壞」，此字在第10章總共出現六次（10:1，28，35，37，39，40）；GT《綜合解讀》說在28~39節的戰役清單裡一次又一次地重複了「盡行殺滅」，表明約書亞和百姓不折不扣地遵行了神的命令；GT《華爾頓約書亞記背景注釋》說在征服的敘述中用誇張的字眼形容毀滅的徹底是很平常的事，並舉書15:13~16 提到希伯崙和底璧仍有居民為證，說本節具有誇飾成分，法老梅雷他的碑文與米沙碑文用的也是這種渲染手法，而這並不表示記述有失准、欺騙、誤導的意思；GT《研經資料》另說神容忍約但河西的亞摩利人已達四百多年之久（創15:16），目的是要他們悔改。BH 說這是神命定的判決，是嚴肅的神聖審判、不是後世列國或戰爭的樣板。
  relation: 同一個字在本章出現六次，密度是全卷最高的一段。也因為密集，本章成了「誇飾修辭」與「神聖審判」兩種讀法正面碰上的地方——華爾頓談的是這句話在古代戰報裡怎麼說，BH 談的是這件事的性質，兩者不互相取消。
