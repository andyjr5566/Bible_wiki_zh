- title: 祭司站定與河水停住（a.mad）
  path: link_folder/原文/祭司站定與河水停住（a.mad）.md
  summary: '第13節「於是日頭停留，月亮止住」。STEP 顯示「日頭停留」是 va/i.yi.Dom（H1826A，簡要詞典義 da.mam: to silence: stationary），而「月亮止住」是 ''a.Mad（H5975G，簡要詞典義 a.mad: to stand: stand）——中文一個「停」一個「止」，原文卻是兩個不同的動詞。H5975G 在本章一共出現四次：第8節神應許「無一人能在你面前站立得住」、第13節兩次、第19節「你們卻不可耽延」。GT《研經資料》說「停在」、「止在」、「停留」原文都是同一個字（SH 1826），而「止住」原文只有「站立」、「停留」的意思（SH 5975），並在第19節指出「不可耽延」與第8節的「站立」是同一個字。GT《丁道爾聖經注釋》說第19節的動詞與神在第8節給約書亞的應許相同，這個字也與日頭和月亮在空中停住有關，而描述日頭不急速下落的同一個動詞在第19節則指以色列人不容仇敵進自己的城邑——天上的星體、地上的軍隊，都聽從了約書亞的命令。'
  relation: 這個條目原本記的是約但河：河水停住、祭司站定，用的是同一個字。本章把同一個動詞放到天上——月亮止住，用的也是它。
