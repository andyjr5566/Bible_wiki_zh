- title: 高原（Shephelah）
  path: link_folder/地點/高原（Shephelah）.md
  summary: 第40節「就是山地、南地、高原、山坡的人」。CT 說『高原』或翻作「低原」、「丘陵」。GT《串珠》說「高原」應作「低地」，即山地與沿海之間的山麓；GT《綜合解讀》說「高原」原文是「低地」，特指猶大山地和沿海平原之間的丘陵地帶「示非拉 Shephelah」，是後來以色列人與非利士人長期爭戰的地方；GT《研經資料》說原文作「雪非拉」（Shephelah），指「猶大山區之西的地帶」；GT《華爾頓約書亞記背景注釋》說本段所述的全部都是山地南部和薩非拉南部的城市。BH 說示非拉是山地與沿海平原之間的西部低地，控制這一帶就打斷了南方迦南城邦的軍事力量。
  relation: 本章是示非拉第一次成為實際戰場：立拿、拉吉、伊磯倫、亞西加、瑪基大都在這一帶，第40節再把它列進總結的地形清單裡。
