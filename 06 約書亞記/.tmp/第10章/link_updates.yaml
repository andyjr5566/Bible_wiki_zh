- title: 南地
  path: link_folder/地點/南地.md
  summary: 第40節「約書亞擊殺全地的人，就是山地、南地、高原、山坡的人」。CT 說『南地』指山地以南、直至與尋的曠野接壤的一片貧瘠乾地。GT《綜合解讀》說「南地」指猶大山地南邊的乾旱曠野；GT《研經資料》說原意是「乾旱」、「燒焦」，指耶路撒冷以南、死海西南方的曠野。BH 說以色列的征服橫跨迦南的中央山區、南方曠野、西部低地與相鄰的坡地。
