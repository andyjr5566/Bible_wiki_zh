    he routed them）。CT 原文字義給「潰亂」困惑、打亂。GT《研經資料》說這個動詞舊約總共出現13次，多數用來記載神使仇敵混亂，並舉出14:2、申2:15
    為例，又說古代近東的戰爭記錄中也常用到這個字、描述敵軍陷於驚恐害怕中；GT《丁道爾聖經注釋》說舊約另外還有地方記載神使仇敵混亂、所用的動詞亦相同，古代近東的戰爭記錄中常用到這個字，並說這裡成為本段的結語並預告了第11節；GT《綜合解讀》說雖然以色列人一夜急行軍已經非常疲憊，但由於他們在夜間突然出現，神就使迦南人潰亂，讓疲憊的以色列人仍然能大大地殺敗他們。BH
