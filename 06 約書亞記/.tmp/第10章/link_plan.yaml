- name: 瑪基大洞裡的五王
  suggested_type: 事件
  evidence: 第16至27節：五王逃跑藏在瑪基大洞裡，約書亞下令用大石頭滾到洞口並派人看守、自己繼續追擊；等追剿完畢才打開洞口把五王帶出來，讓軍長把腳踏在他們頸項上，然後殺死、掛在五棵樹上，日落取下丟回他們藏過的洞裡，用大石頭封住。CT
    說第22節約書亞命將巨石滾開、提人出來候審。GT《研經資料》說五王藏身之處是瑪基大附近的一個洞穴，並說 10:16 的「畫面」與前一幅一樣、此處不是講所有的敵軍軍隊而是指他們的五個首領，而「瑪基大」是第10節提到三個主要戰場之一、如今再度出現把整個故事框住；GT《聖經精讀本》說巴勒斯坦的地表多由石灰岩形成、自然會有很多洞穴，這些洞穴常用來作墳墓、避難所、谷倉或飼養家畜的房子，而五王作為避難所躲藏的洞穴竟成了他們的墳墓；GT《丁道爾聖經注釋》說以大石封住的洞先成了這些首領的監牢、後來又成了他們的墳墓，這些本來領先全軍的王如今躲了起來。KC
    說 Because the sun continues to shine, the kings flee from the light and seek the
    darkness of a cave to hide，並說 Their self-sought safety becomes first their prison
    and then their grave，他們先被關在那裡等候審判的時刻，時候到了就被按名叫出黑暗、帶到光中處死。BH 說這些王選擇藏匿而不是投降，那看似避難所的洞成了他們的敗亡被揭露之處，也成了他們公開受審的地方。
