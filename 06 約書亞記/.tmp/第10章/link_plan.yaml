- name: 伯和崙
  suggested_type: 地點
  evidence: '第10節「追趕他們，在伯和崙的上坡路擊殺他們」，第11節「正在伯和崙下坡的時候」。STEP 第10節為 ma.''a.Leh（H4608，簡要詞典義
    ma.a.leh: ascent）加 veit- cho.Ron（H1032G，簡要詞典義 bet cho.ron: Beth-horon），第11節為 be./mo.Rad（H4174，簡要詞典義
    mo.rad: descent）加同一個地名。CT 原文字義給「伯和崙」空虛之家，並說伯和崙有上下兩個地點（參書十六3，5），它們之間為一山路，上伯和崙地勢較高、距耶路撒冷之西北十八公里，下伯和崙地勢較低、距上伯和崙西北約三公里。GT《研經資料》說字義是「空虛之家」，有上、下伯和崙兩座城、兩城相隔約三公里，下伯和崙比較大比較重要，並說「伯和崙上坡」指由基遍到亞雅崙平原的一條谷道；GT《綜合解讀》說從海拔250米的亞雅崙平原沿著山脊上到海拔770米的基遍被稱為「伯·和崙的上坡路」，「伯·和崙」隘口扼守在這條古道中間，這是當時從沿海平原通往中央山地的必經之路，又說「正在伯·和崙下坡的時候」原文是「正在伯·和崙斜坡的時候」，意思是五王聯軍沿著上坡路往下逃跑的時候；GT《華爾頓約書亞記背景注釋》說山地和平原之間的主要通道之一是伯和崙和亞雅崙谷之間的山隘，這是基遍所控制的地區。BH
    說潰逃的軍隊被向西趕過伯和崙那條難走的隘口，那是山地與沿海平原之間的主要通道。'
  target_path: link_folder/地點/伯和崙.md
