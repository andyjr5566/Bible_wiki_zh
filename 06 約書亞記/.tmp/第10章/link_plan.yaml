- name: 日頭停住月亮止住的解釋之爭
  suggested_type: 解經爭議
  evidence: '第12至14節：約書亞禱告求「日頭啊，你要停在基遍；月亮啊，你要止在亞雅崙谷」，「於是日頭停留，月亮止住……日頭在天當中停住，不急速下落，約有一日之久」。STEP
    顯示第12節的「停」是命令式 Dom（H1826A，簡要詞典義 da.mam: to silence: stationary），第13節「停留」是同字的 va/i.yi.Dom，而「止住」是
    ''a.Mad（H5975G，簡要詞典義 a.mad: to stand: stand）；同節「不急速」是 ''atz（H213，簡要詞典義 uts: to
    hasten），「下落」是 la./Vo''（H935K，本節逐字解 (sun)set），「約有一日之久」是 ke./Yom ta.Mim（H3117G 加
    H8549I，簡要詞典義 ta.mim: unblemished: complete）。CT 說各種解釋都不能令人滿意，只能說這是出於神的神蹟奇事，並在備註列出專家學者的六種解釋：只可當作比喻看的詩句；地球暫停正常自轉達24小時；不尋常的雲層光線屈折現象；太陽光停止直接照射使氣溫下降；當時是滿月而雲層遮住日月光照；以及有些天文學家認為天文曆發現少算了一整天。GT《研經資料》另列
    a 至 e 五種可能並判斷 b（天體真的運轉緩慢多了一天）比較可能，並說「停在」、「止在」、「停留」原文都是同一個字（SH 1826），而「止住」原文只有「站立」、「停留」的意思（SH
    5975）；GT《雷氏研讀本》把觀點分成兩類——假設地球自轉緩慢或停頓，以及認為地球沒有不規則轉動的各種看法；GT《聖經精讀本》列出四種解釋並說我們無法知曉哪一個正確，只能確信用話語造天地萬物的神只要祂願意就能成就一切；GT《串珠》說13節之「下落」原文也可解作「上升」，因此這禱告可解為祈求日間延長或夜間延長；GT
    所收艾基斯《舊約聖經難題彙編》詳論「不急速」可能指地球自轉速度減慢，並引嚴夏利、白加榮、托頓的說法，另引莫達斯與威羅拔把 dom 解為求太陽不要散發熱力、白曉則主張這是「長夜」而非「長日」，但艾基斯本人說參看第13節就知道那些解釋無多大真確性；GT《靈修版聖經注釋》說這段的重點不在於神使用什麼特別的方法而是這一天白天的時間確實延長了；GT《李道生舊約聖經問題總解》引哈佛與耶魯的天文計算。KC
    說 When Joshua says “sun, stand still”, it is not scientific language, but what
    is said in everyday language，並說巴力是太陽神、亞斯她錄是月神，透過約書亞的信心它們被定在原處，證明以色列的神才是獨一的真神。BH
    說日月同時停住這個記號排除了單純自然事件的說法，被周圍民族當作神明敬奉的天體在此顯明是耶和華的僕役。'
