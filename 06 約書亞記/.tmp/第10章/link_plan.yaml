- name: 雅煞珥書
  suggested_type: 背景
  evidence: '第13節「這事豈不是寫在雅煞珥書上嗎？」。STEP 為 Se.fer hai./ya.Shar（H5612H，簡要詞典義 se.pher:
    scroll: book，加 H3477H，簡要詞典義 ya.shar: Jashar）。CT 原文字義給「雅煞珥」筆直的、正確的，並說『雅煞珥書』直譯是「正義之書」，是一本歌頌以色列人英雄和戰蹟的詩歌集（參撒下一18），現已散佚。GT《聖經精讀本》說雅煞珥書字面意義是「義人之書」，並不是正典、未能傳到今天，這本書用詩的形式記錄了偉大人物或事件，收錄了以色列的戰爭史或古代英雄故事；GT《研經資料》說原文是「正直人之書」、「正義者之書」，並指出照撒下1:18
    記載這本書紀錄了大衛的「弓歌」，因此不可能是大衛時代之前就寫成，而相對的這一段約書亞記經文也不可能在大衛時代前寫成；GT《馬唐納約書亞記》說雅煞珥書可指「正直的書」，聖經在撒下一18
    也提到這卷書，可能是以詩體記載的歷史文集，聖經有許多地方引用以前的經卷、也引過詩歌、口述和筆錄的資料，而肯定這不是默示的書卷；GT《靈修版聖經註釋》說因為神引導作者選用這些資料，其信息就具有神的權威性；GT《啟導本》說雅煞珥書為以色列人歌頌英雄和戰跡的史詩集，現已散佚。KC
    說 “the book of Jashar” or “the book of the upright” is a history book in which
    certain acts are recorded, possibly in poetic form，並比較民21:14 與王上14:19、29，說它是已經失傳的古希伯來文獻，聖經作者若合乎神的計畫就從中引用。BH
    說雅煞珥書顯然是一部公認的以色列英雄詩歌或歷史詩集，撒下1:18 也引用過它，雖然這書沒有保存下來，但這處引用記下了這神蹟被存在以色列的民族記憶裡。'
