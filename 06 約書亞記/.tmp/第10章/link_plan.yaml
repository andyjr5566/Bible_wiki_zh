- name: 大冰雹原文作大石頭（ba.rad）
  suggested_type: 原文
  evidence: '第11節「耶和華從天上降大冰雹在他們身上（冰雹原文作石頭），直降到亞西加，打死他們」。STEP 顯示這一節先寫 hish.Likh（H7993，簡要詞典義
    sha.lakh: to throw）''a.va.Nim ge.do.Lot（H68G 加 H1419A，字面「大石頭」）min- ha./sha.Ma.yim（H8064，簡要詞典義
    sha.ma.yim: heaven），後半才用 be./''av.Nei ha./ba.Rad（H68G 加 H1259，簡要詞典義 ba.rad: hail），也就是「冰雹的石頭」。CT
    原文字義給「冰雹」石頭，並說『大冰雹』是能夠致人於死程度的大小，又在話中之光說冰雹似是長了眼睛一樣、單單降擊在以色列的敵人身上。GT《研經資料》說「大冰雹」原文是「大的石頭」、七十士譯本翻譯為「冰雹」，並說「從天上」是「諸天」或「天空」；GT《丁道爾聖經注釋》說主前二千年左右的赫人文獻和主前一千年左右的亞述人文獻中都曾提及神祇用「天上的石頭」來與敵軍作戰，敵軍陣腳大亂也常以此為解釋的理由，並說冰雹可能出現在春天，而冰雹也預示了後來用來封住盟軍首領洞口的大石頭（18節，希伯來文為同一個字）；GT《聖經精讀本》說巴勒斯坦地區不常下冰雹，然而一旦下起來便會極其嚴重地損壞農作物，而在聖經中冰雹是神的審判工具。KC
    說耶和華在冰雹裡有祂自己的兵器，並引伯38:22b-23 與出9:24-25，另把它連到啟16:21 末世從天而降的大雹。BH 說耶和華以創造主與審判者的身分公開介入，如同降在埃及的雹災一樣用祂的受造物顯明祂在列國與軍隊之上的權柄（出9:22-26）。'
