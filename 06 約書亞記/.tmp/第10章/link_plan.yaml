- name: 腳踏在王的頸項上
  suggested_type: 文化
  evidence: 第24節「約書亞就召了以色列眾人來，對那些和他同去的軍長說：你們近前來，把腳踏在這些王的頸項上。他們就近前來，把腳踏在這些王的頸項上」。CT
    原文字義給「軍長(原文三字)」人、戰爭、官長，並說『和他同去的軍長』暗示此次救援行動並非出動全軍，『腳踏在這些王的頸項上』表示使敵人完全降伏，以行動宣告完全的勝利。GT《啟導本》說考古學在埃及、亞述發現很多古代浮雕，證明古時確有此風俗；GT《研經資料》說「軍長」是「戰爭指揮官」，這是聖經中第一次提到以色列人中有「戰場指揮官」這個職務，又說「腳踏」的舉動對以色列人來說有雙重意義，一方面象徵征服這幾個王的完全成功、另外也激勵他們要進一步在迦南地取得更多的勝利；GT《聖經精讀本》說用腳踏頸項就是使之成為腳凳、意味著完全的勝利（王上5:3；詩110:1），目睹此番情形的以色列百姓會大震士氣，並說使迦南列族依次屈服在以色列面前的神日子一滿必會使所有生命屈膝在耶穌面前（腓2:10）；GT《綜合解讀》說這是古代中東的戰爭慣例，表示得勝者制伏了俘虜；GT《靈修版聖經註釋》說這些驕傲的王曾經誇耀武力，現在全以色列人都看出神遠超乎世上一切的軍隊。KC
    說 The putting of the foot on the neck is a proof of the complete victory and for
    the conquered a proof of complete humiliation，並引羅16:20「賜平安的神快要將撒但踐踏在你們腳下」與林前15:25、來1:13。BH
    說把腳放在戰敗統治者的頸項上是古代表示完全征服與降服的記號，這一幕預表彌賽亞的統治，祂的仇敵要成為祂的腳凳（詩110:1）。
