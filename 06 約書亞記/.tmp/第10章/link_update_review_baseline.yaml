- title: 祭司站定與河水停住（a.mad）
  path: link_folder/原文/祭司站定與河水停住（a.mad）.md
  definition: '書3:16 說河水「停住」，書3:17 說抬約櫃的祭司「站定」。中文用了兩個不同的詞，原文是同一個字。


    ### 兩組對應


    STEP 顯示書3:16 的「停住」是 va/i.ya.''am.Du，書3:17 的「站定」也是 va/i.ya.''am.Du，兩處都是 H5975G（簡要詞典義
    a.mad: to stand）。書3:17 的「站定」後面還跟著 ha.Khen（H3559H，簡要詞典義 kun: to establish），本節譯義作
    firmly。


    第二組是「全然」與「盡都」。書3:17 的「盡都」STEP 為 ta.mu（H8552，簡要詞典義 ta.mam: to finish）。


    GT《約書亞記綜合解讀》把兩組並列說明：祭司們的「站定」與河水在亞當城的「停住」原文是同一個字；國民的「盡都」過河與河水的「全然」斷絕，原文也是同一個字。它接著解讀這個對應：祭司的站定帶出了河水的停住，而河水的全然斷絕確保了百姓盡都過河。GT《約書亞記研經資料》記下同樣兩組對應。


    ### 丁道爾怎麼看這組重複


    GT《丁道爾聖經注釋》把它稱為一連串文字遊戲：祭司站定在河當中，與水在亞當城停住一樣；祭司們站在乾地上，與百姓從乾地上過去一樣，又與摩西將紅海變成乾地一樣（出14:21）；河水全然斷絕直到國民盡都過了約但河。它的結論是，這些文字遊戲顯示所有的動作都相關聯，而抬約櫃的祭司首先帶動整個行動，因此在過約但河頭一景的三組人中最受矚目。


    ### 站著這件事持續了多久


    CT 說祭司在乾地上站定的用意在擋住約但河上游的水流，並說他們不單要用信心開路，也要用持久的順服來維持一條暢通的道路；它另外指出一刻的順服比較容易，持久的順服就不容易。KC
    說祭司帶著約櫃一動不動地站在約但河中間的乾地上，這種不動顯示整個局面完全由約櫃掌控，水也同樣不動。BH 說祭司留在崗位上直到每一支派都過去了。'
