  path: link_folder/互文/啟示錄 16-21（末世大冰雹）.md
  definition: 啟16:21：「又有大雹子從天落在人身上，每一個約重一他連得。」KC 把它與出9 的第七災接在一起：「世界將被許多審判擊打，包括大冰雹的審判」（啟16:21）——第七災與第七碗都以冰雹收場。
  development: KC 指出「世界將被許多審判擊打，包括大冰雹的審判（啟16:21）」，但信徒必蒙保守脫離那試煉的時候（啟3:10）。GT《聖經精讀本》也把啟16:21
    列在「冰雹作為神刑罰的標記」這條線上（書10:11；該2:17；啟8:7；16:21）。BH 在本章只泛指這場雹災「預示了將來的神聖審判，如啟示錄所描述的」，沒有指名哪一節。
