- title: 堆石頭作記號
  path: link_folder/主題/堆石頭作記號.md
  definition: '書7:26 說：「眾人在亞干身上堆成一大堆石頭，直存到今日。」行刑之後還要再做一件事——把石頭堆起來，讓後來的人看得見。


    STEP 顯示這一句是 va/i.ya.Ki.mu ''a.La/v gal- ''a.va.Nim ga.Dol（H6965H qum 加 H1530G，簡要詞典義
    gal: heap，加 H68G e.ven 與 H1419A ga.dol）——動詞是立起，受詞是一大堆石頭。


    ### 這是一種標記方式，不只是掩埋


    CT 說這是堆石作記號，並指向創31:51-52 那一處堆石。也就是說，重點不在把屍體蓋住，在於留下一個看得見、認得出的標記。


    BH 說石堆的持續存在表示這件事已經進入以色列被記住的歷史，經過那谷的人都要面對背逆的代價與忠心順服的必要（申6:12）。BH 同時給了兩個平行：一是撒下18:17
    押沙龍被扔在坑裡、上面堆起一大堆石頭；二是書4:9 約書亞在約但河中所立的十二塊石頭。


    ### 與書4 的石頭是兩件事


    書4:9 的十二塊石頭是渡河的紀念碑，用來給後代解釋神做過什麼；書7 的石堆立在一個人身上，紀念的是一樁罪。兩處都用「直到今日」收尾（見 [[直到今日]]），也都預設有人會走過來、看見、然後問。'
