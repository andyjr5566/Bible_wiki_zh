  evidence: "第13節「就使迦南人做苦工」；STEP la./Mas（H4522，forced labor）；CT：作苦工原文是「進貢」；GT《研經資料》：奴工隊、勞工隊；GT《雷氏研讀本》：要求他們進貢；GT 書16:10 所引丁道爾說書17:13 的作苦工是 mas；BH：保留迦南人作勞力來源"
  surfaces:
  - phrase: "做苦工"
    verses: [13]
- name: "未得之地"
  type: "主題"
  evidence: "第12-13節瑪拿西不能趕出伯善、他納、米吉多等城的居民；GT 啟導本、《研經資料》：分給瑪拿西的這些鎮市這時尚未取得；GT《研經資料》：參士1:27-29；GT《綜合解讀》：約書亞說神把產業分給我們的同時也把未得之地分給了我們"
- name: "比利洗人"
  type: "人物"
  evidence: "第15節「就可以上比利洗人、利乏音人之地」；CT：居住在迦南中部山地的一族；GT《研經資料》：原意屬於某一村莊的人，是住城市的迦南人之外的另一民族；GT《串珠》：居河西"
  surfaces:
  - phrase: "比利洗人"
    verses: [15]
- name: "利乏音人"
  type: "人物"
  evidence: "第15節「比利洗人、利乏音人之地」；CT：不屬迦南七族，居住在約但河兩岸山地，身軀高大；GT《串珠》：在河東，但這名也出現在河西（書15:8）；BH：以身量出名的戰士"
  surfaces:
  - phrase: "利乏音人"
    verses: [15]
- name: "砍斷馬的蹄筋與焚燒車輛"
  type: "主題"
  evidence: "第16、18節鐵車；GT《綜合解讀》：雖然迦南人有鐵車，以色列人只要照著神所吩咐的去行，照樣能「砍斷他們馬的蹄筋，用火焚燒他們的車輛」（書11:9）；BH 引書11:4-6"
- name: "迦勒求得希伯崙"
  type: "事件"
  evidence: "第14-18節；GT《綜合解讀》《研經資料》：八十五歲的迦勒憑信心爭取最危險的希伯崙（書14:6-15），約瑟的子孫卻只想坐享其成"
