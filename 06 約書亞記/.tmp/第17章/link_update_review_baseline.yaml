- title: 約瑟
  path: link_folder/人物/約瑟.md
  definition: 雅各與拉結的長子（創30:22-24），名字意為「增添」或「願神再加」。創世記37-50章的主角。創世記三十三章記雅各見以掃時，將拉結與約瑟安排在隊伍最後（最受保護的位置，33:2），並記約瑟與母親一同向以掃下拜（33:7）。
  development: '### 創33：他只出現三次，位置都關鍵


    第2節：拉結和約瑟在儘後頭。第7節：隨後約瑟和拉結也前來下拜。這是約瑟在創世記中第一次以行動者的身分出現——在此之前他只被記為出生（創三十24）。


    CT 抓住第7節那個用字上的顛倒：其他人都是先提母親、後提孩子，「但本節後半段先提孩子約瑟，後提母親拉結，這是暗示約瑟將會繼雅各之後，成為創世記的主角（參創三七章至五十章）」。BH
    的說法方向相同：約瑟在此的位置預示了他日後的地位。


    ### 他當時多大


    GT《聖經精讀本──創世記註解》在第13節下給了一個可核對的數字：當時大兒子流便十三歲，小兒子約瑟才六歲。這個年齡與第13節雅各說的「孩子們年幼嬌嫩」相合，也解釋了他為何以「催趕一天群畜都必死」為由婉拒以掃同行。


    ### 兩處與他有關的後續


    第19節雅各買下的那塊地，CT 指出「後來成了安置約瑟骸骨的地方（參書廿四32）」；GT《串珠聖經註釋》、GT《啟導本聖經創世記註釋》與 GT《聖經精讀本──創世記註解》都記下同一條線索——精讀本並說示劍城是「日後埋葬約瑟遺骨之地（書二四32；徒七16）」。


    因此創世記三十三章與約瑟有兩處連結：一處是敘事上的（第7節的用字預告他將成為主角），一處是地理上的（第19節買下的地將成為他的葬地）。兩處都在他六歲的時候埋下。


    ### 被放在最後的那個位置


    第2節的排序把拉結和約瑟放在隊伍最末。多數來源讀成保護——GT 丁良才《創世紀註釋》、GT《啟導本聖經創世記註釋》、GT《串珠聖經註釋》與 KC 都認為雅各是為了讓他們在緊急關頭能逃走；GT《聖經精讀本──創世記註解》則讀成「根深蒂固的偏愛心理」（創二九30）。


    無論哪一種讀法，這個安排都是同一件事的開端：雅各對拉結所生之子的偏愛，正是創世記三十七章那件事的起因（見[[雅各安排家人順序是否偏愛]]）。


    ### 六歲時埋下的伏筆，四百年後才兌現


    創33章那兩處連結——敘事上的（他將成為主角）與地理上的（買下的地將成為他的葬地）——要到出埃及記才真正兌現。出1章他早已在埃及、與弟兄同代人相繼去世，新王卻「不認識約瑟」（v8）：GT《聖經精讀本》認為這是新王有意否定「有閃族血統並與喜克索斯王朝有密切聯繫」的約瑟業績，KC
    則說那使全埃及得活命的人「竟被全然忘記」（徒7:18）。約瑟臨終前的遺言在出13:19 才兌現——摩西把他的骸骨一同帶去，GT《聖經精讀本》把時間跨度說了出來：這是「350多年前，堅信出埃及和征服迦南事件的約瑟臨終前對子孫們的遺言」，最終在約書亞記才真正入土（書24:32）。丁良才說這個起誓本身就是信心的表示：「顯明他深信神必將迦南地賜給亞伯拉罕的後裔」（來11:13-22）。'
