- title: 苦工（mas）
  path: link_folder/原文/苦工（mas）.md
  definition: '書16:10 以法蓮沒有趕出住基色的迦南人，「迦南人卻住在以法蓮人中間，成為做苦工的僕人，直到今日」。「苦工」是一種強迫勞動的編制，被征服的人被編成工隊替主人做工。


    **原文。** STEP 把「成為做苦工的僕人」標作 le./mas-（H4522，簡要詞典義 mas: taskworker；本節語境譯義 a slave
    gang of）接 ''o.Ved（H5647I，簡要詞典義 to serve: labour），形態上是介系詞加名詞的附屬形，再接一個分詞。CT 的原文字義給「苦工」奴工，並說「成為作苦工的僕人」就是作以色列人的奴僕。GT《約書亞記研經資料》說這是「奴工隊」「勞工隊」，可參王上4:6、王上9:21。


    **古代的背景。** GT 所引《丁道爾聖經注釋》說，書17:13 的作苦工是 mas，這個字出現在主前十四世紀一封亞馬拿書信中，是米吉多的首領寫的；信裡提到一名被強迫勞動的人，在舒嫩一帶為法老耕種。丁道爾說在耶斯列谷的迦南城邑中用奴工是眾所周知的作法，此處所指的苦工便是以這類作法為背景，後來所羅門也同樣使用（王上4:6、王上9:21）。


    **註釋怎麼看這件事。** CT 說以法蓮人「只求偏安一時，甚至可能著眼當前經濟上的好處」，結果卻為日後埋下敬拜偶像假神的根源。GT《綜合解讀》說，從世人的角度看，讓迦南人作苦工不但寬容、多元，而且在經濟上大有利益，但以法蓮人貪圖安逸，沒有徹底執行神的命令（申7:1-26）。KC
    也說以法蓮人或許看到了使用迦南人作苦工的好處，能替自己多添財富，但到了士師時代，這件事會反過來害到他們。BH 說，奴役迦南人帶來經濟利益，卻沒有成全神的命令，而且預示了後世大量使用強迫勞役（王上9:20-21）。'
