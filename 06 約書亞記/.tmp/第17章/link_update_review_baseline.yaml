- title: 亞設（有福）
  path: link_folder/人物/亞設（有福）.md
  definition: 利亞使女悉帕所生的次子（雅各第八子），名字意為「有福/歡樂」。利亞說「我有福啊，眾女子都要稱我是有福的」，故以此命名。
  development: '### 創30：字義與利亞的話


    CT 註「亞設」的原文字義為「有福的，歡樂」；GT《啟導本聖經創世記註釋》取「歡樂」，GT《創世記雷氏研讀本》與 KC 取「有福」。利亞的話是「我有福啊，眾女子都要稱我是有福的」（13節）。BH
    注意到這句話裡的社群面：「眾女子」的稱讚說明這是一種公開的認可——在古代近東，生子是可以公開慶賀的事，而利亞長期活在不被丈夫看重的處境裡，鄰里的承認因此格外有份量。


    ### 這是第幾層的喜樂


    亞設不是利亞親生的，而是她的使女悉帕所生（12節）。KC 指出利亞是看見拉結用了這個辦法之後才跟著做的，只是這一次她確實嘗到局勢翻轉的滋味。


    因此「我有福啊」與創二十九35「這回我要讚美耶和華」性質不同：後者是單單轉向神，這一句帶著與姊妹相較的意味。GT《聖經精讀本──創世記註解》對整段的評語是：為了得到丈夫寵愛，兩姊妹利用子女競爭，「表明破壞神一夫一妻婚姻的家庭，矛盾和紛爭、嫉妒和爭競不會停止」。


    BH 補上後續：亞設支派日後以豐饒著稱，申三三24-25 對它的祝福正與「有福」之義相合。'
