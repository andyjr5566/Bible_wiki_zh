- title: 家室與宗族
  path: link_folder/主題/家室與宗族.md
  definition: '民數記第一章點名造冊用的兩層單位。神吩咐摩西「按以色列全會眾的家室、宗族、人名的數目」計算男丁（民1:2），實際執行時會眾也「照他們的家室、宗族、人名的數目……都述說自己的家譜」（民1:18）。


    原文層面，STEP 原文資料把這兩個詞拆得很清楚。「家室」的原形是 מִשְׁפָּחָה（mish.pa.chah，H4940），詞典義 family。「宗族」在原文不是一個字而是兩個字組成的片語，原形分別是
    בַּ֫יִת（ba.yit，H1004M，house／household）與 אָב（av，H1G，father），STEP 的 context gloss
    逐字譯作「house of」＋「ancestors/ their」。「人名的數目」則是 מִסְפָּר（mis.par，H4557，number）配 שֵׁם（shem，H8034，name）。CT
    的原文字義與這組詞形相合：「家室」作家族、部族，「宗族」作房屋、家庭。


    但幾家對這兩個中文詞誰大誰小說法不同。GT《啟導本》說「宗族」是社會的主要組成單位，「大小介乎『支派』與『家室』之間」，而「家室」可譯為「家族」，比今天的「家庭」為大。GT《聖經精讀本》則說「家室」指親屬，「宗族」是「父親」、「族長」和「家」的組合詞，「是指很多家族的聚集，就是指各支派」。CT
    的說法又不一樣：「家室」指略大於家庭的家族，「宗族」意指介於支派和家族之間的部族。三家排出來的層級並不一致。


    至於為什麼要這樣登記，GT《丁良才註釋》列了四層益處：「好修成可靠的家譜」、「得詳知各支派的人數」、「能分佈各支派應占的位置」、「可規定出發的次序」。BH
    從社會結構解釋：按宗族家室編組維繫了支派身分與產業繼承權，也讓每一支派的兵力與地業都算得清楚。'
  development: '這套登記制度在後面的經文一再被引用。民數記二十六章第二次普查同樣「照他們的宗族」點算，而那一次的目的已經轉成分地業（民26:52-56）。


    KC 從第18節「述說自己的家譜」讀出一層人的責任：申報家譜不只是內心相信，而是要向別人講明自己的出身。他指出這道手續之所以必要，是因為出埃及時有「閒雜人」跟著上來（出12:38；民11:4）——這些人不是以色列人，沒辦法在神面前申報自己屬於這個群體，也就不能為神爭戰。


    STEP 原文資料在這一節給出一個少見的詞形：「述說自己的家譜」的原形是 יָלַד（ya.lad，H3205，詞典義 to beget），而 STEP 標的
    morphology 是 Hithpael——反身形，context gloss 作「they recorded their ancestry」。同一個「生」的字用反身形，講的就是各人把自己登記回自己的出身。'
