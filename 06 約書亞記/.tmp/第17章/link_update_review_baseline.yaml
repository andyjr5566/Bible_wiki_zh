- title: 他納
  path: link_folder/地點/他納.md
  definition: '書12:21「一個是他納王，一個是米吉多王」。


    **位置：兩家的方位相反。** CT 說他納位於米吉多東南面約8公里；原文字義是「多沙的」。GT《華爾頓約書亞記背景注釋》與《約書亞記研經資料》說他納是主前2700年創建於米吉多西北約四哩（GT《研經資料》換算為約六公里）、俯瞰耶斯列谷之山頂上，今名蒂因尼克遺址（Tell
    Ti''innik）。GT《研經資料》自己也註明另有學者認為他納是位於米吉多東南方，並補一句：不論如何，這城是在地中海幹道上，是重要的保衛城。


    **它什麼時候進入史料。** GT《華爾頓約書亞記背景注釋》說他納直到主前十五世紀法老杜得模斯三世在年表中記錄米吉多之役（約主前1486年）時，才首次在經外史料中出現。GT《串珠聖經注釋》說「他納」與「米吉多」在耶斯列谷西南，控制進入沙侖平原之通路，故深具戰略地位。


    **它後來還會再出現。** BH 說他納位於耶斯列谷南緣，靠近連接沿海平原與約但河谷的要道；它後來出現在底波拉之歌裡、在米吉多水旁（士5:19），而瑪拿西未能把迦南人從他納趕出去（士1:27）——先前的得勝見證了神的信實，後來的失敗則顯出順服不徹底的代價。'
