- title: 利乏音人
  path: link_folder/人物/利乏音人.md
  definition: 利乏音人（Rephaim），古代迦南地的巨人族。名字意為「落下者」或「衰弱者」，但與其身材高大的記載構成反諷。申命記二10-11稱他們為「以米人」，身高如亞衲人，為利乏音人的一支。
  development: '這一族在目前累積到的幾章裡，是從一個古老的族名，一路縮到一個人。


    創14:5 是最早的一次：基大老瑪一行人在亞特律加寧殺敗了利乏音人，那時他們還與蘇西人、以米人並列，是同一批被掃過的族群。創15:20 把利乏音人列進神應許亞伯拉罕之地的居民名單，與赫人、比利洗人排在一起——那時他們還是「這地上住著誰」的答案之一。


    到民21:33-35 與申3，名字已經只掛在一個人身上。申3:11 說得最直接：利乏音人所剩下的只有巴珊王噩。申2:10-11 則從側面說明這個名字的涵蓋面有多大——以米人身量高大像亞衲人，摩押人稱他們為以米人，而聖經說他們也算為利乏音人。


    書12:4 是這條線的收尾。「他是利乏音人所剩下的」被寫進戰績總表，而他的地已經分給了瑪拿西半支派。GT《華爾頓約書亞記背景注釋》說擁有巨大鐵床的噩王被稱為這民族的最後一人，這是他們在以色列人入侵時衰亡的另一個證據。一個橫跨創世記到申命記的名字，在名單上只剩一行註記。'
