- title: 砍斷馬的蹄筋與焚燒車輛
  path: link_folder/主題/砍斷馬的蹄筋與焚燒車輛.md
  definition: '書11:6 神吩咐約書亞「你要砍斷他們馬的蹄筋，用火焚燒他們的車輛」，書11:9 逐字記下他照做了。這是一道關於戰利品的命令：不是收編最好的裝備，而是把它毀掉。


    ### 原文


    STEP 顯示書11:6 的「砍斷……蹄筋」是 te.''a.Ker（H6131B，簡要詞典義 iq.qer: to hamstring），「車輛」是 mar.ke.vo.tei./Hem（H4818，簡要詞典義
    mer.ka.vah: chariot），「焚燒」是 tis.Rof（H8313，簡要詞典義 sa.raph: to burn）。CT 的原文字義給「砍斷」切斷腿筋。GT《約書亞記研經資料》把動作講白：「砍斷馬的蹄筋」是「割斷馬的小腿韌帶」，這樣會讓戰馬殘廢。


    ### 為什麼要毀掉


    CT 說即指不能再使用它們，並說有人認為這樣作的結果是叫以色列人不靠車馬而單純倚靠神。GT《雷氏研讀本》說神吩咐約書亞砍斷敵人馬的蹄筋使之癱瘓、並焚燒他們的戰車而不是把他們捉回來，這樣以色列人便不會把信心放在馬匹和戰車上。GT《串珠聖經注釋》說免得百姓倚靠這些而不倚靠神。GT《聖經精讀本》說意指以色列不可像外邦人一樣想靠著馬匹與車輛之力爭戰，乃要依靠神的大能。


    GT《綜合解讀》把這條命令的長期效果算出來：約書亞忠實地執行了神的命令，因此以色列人一直到大衛王的時候都沒有使用「馬匹車輛」，並引詩20:7。GT《研經資料》補上兩端的歷史：撒下8:3~8
    記載大衛打敗瑣巴王和亞蘭人時也是這樣對付戰車馬，表示到了大衛時期以色列人還是無法駕馭這種先進的戰爭工具，只能用消極的「損毀戰馬」的方式處理擄獲的戰車隊；而所羅門王以後以色列人就有自己的戰車部隊了，但耶和華曾警告君王不可依靠馬匹（申17:16）。


    ### 兩家把它推到原則


    CT 在話中之光說他們不是倚靠人的所有去獲取得勝，乃是倚靠他們的元帥作他們的得勝，並說保留人以為可靠的事物常會把人的眼睛從神的身上轉移到人以為可靠的事物上，而這一個轉移的結果乃是把得勝的把握丟掉了。KC
    說 The enemy''s means of combat must be disabled and destroyed. That makes reuse
    impossible, both for the enemy and for Israel（仇敵的戰具必須被癱瘓、被毀掉，這樣無論是仇敵還是以色列都不能再用），並說
    God does not want His people to use the means of the world to achieve victories
    through which the world can claim the honor of victory（神不要祂的百姓用世界的手段去得勝，免得世界可以宣稱得勝的榮耀）。


    BH 說毀掉戰車除去了迦南人最令人畏懼的兵器，也顯明以色列不可保存神已審判的東西，並把它接到紅海：那位淹沒法老戰車的耶和華再一次顯明人的力量在祂的旨意面前站立不住。'
  development: ''
  signals:
  - development_blank
  accumulation_count:
  - 1
  - 2
- title: 迦勒求得希伯崙
  path: link_folder/事件/迦勒求得希伯崙.md
  definition: '書14:6-15 記八十五歲的迦勒到吉甲見約書亞，提起四十五年前在加低斯巴尼亞得的應許，求約書亞把「這山地」給他；約書亞為他祝福，把希伯崙給他為業。這是約書亞記河西分地的第一筆。


    **他憑什麼求。** 迦勒先提神在加低斯巴尼亞對摩西說的話（書14:6），再提摩西當日起誓：「你腳所踏之地定要歸你和你的子孫永遠為業，因為你專心跟從耶和華─我的神」（書14:9）。GT《綜合解讀》說「你腳所踏之地」指希伯侖，是迦勒四十年前作探子到過的地方；GT《聖經精讀本》說他要求分得這地「並不是為滿足自己的欲望，乃是為了忠於從神僕人摩西所得的應許」。KC
    說迦勒等這一刻已經等了四十五年，盼望應許成就，給了他力量走完曠野而不發怨言。


    **他求的是最難的一塊。** 迦勒自己說：「那裡有亞衲族人，並寬大堅固的城」（書14:12）。CT 說「這山地」指猶大山地，附近一帶的山地居住著亞衲族人，被以色列人視為難以克服的地區，迦勒自動請纓前去討伐；GT《約書亞記研經資料》說：「迦勒求的不是容易攻打的肥沃平原」。CT
    的話中之光說，希伯侖是最不容易攻取的地方，迦勒的要求是為了見證神的信實。


    **「或者」兩個字。** 迦勒說「或者耶和華照他所應許的與我同在，我就把他們趕出去」。KC 說他是出於謙卑才說「或者」，他不靠自己的力量，而是靠耶和華；BH
    說這是謙卑的倚靠，不是自以為是；CT 也說他並不是有片刻絲毫的懷疑。


    **「給他為業」是什麼意思。** CT 說，約書亞「將希伯崙給他」意指將征服希伯崙的任務交給他，相當於拈鬮分給希伯崙，理由有二：神的應許和拈鬮兩者都是神的旨意；其他各支派可能都畏懼亞衲族人，所以樂觀其成。


    **這段在時間上放在哪裡，有兩種讀法。** CT 備註說：「有人認為6~15節是書十一21~23的詳細解釋」，兩段都以「國中太平，沒有爭戰了」作結，所以故事應發生在爭戰結束之前、分配土地之際。GT《丁道爾》也說迦勒的故事是要詳述書11
    的戰役，屬於征服南方之役的一部分。GT《約書亞記研經資料》則說「於是國中太平，沒有爭戰了」可能是作者由其他文獻抄錄希伯崙古名時同時抄錄下來的文字，在這裡為爭戰暫時畫下句點，可以開始分地。'
  development: 這件事的根在民14:24：神說迦勒「另有一個心志，專一跟從我，我就把他領進他所去過的那地」，申1:36 再提一次。書14:6-15 是迦勒在四十五年後把這個應許拿出來兌現。GT《綜合解讀》說以色列人分配地業正是從迦勒開始（書14:6-15），到約書亞結束（書19:49-50），這兩位專心跟從神的人首尾呼應。GT《啟導本》與《雷氏研讀本》預告了後續：希伯崙後來成為利未人城邑與六座逃城之一，迦勒自己住在城的郊區（書21:11-12）。
