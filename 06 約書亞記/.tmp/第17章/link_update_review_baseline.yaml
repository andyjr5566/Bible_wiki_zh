- title: 多珥
  path: link_folder/地點/多珥.md
  definition: '多珥是書11:2「西邊多珥山岡」的那個地名，代表北方聯盟裡最靠地中海的一段。


    CT 的原文字義給「多珥」世代，並說『多珥山崗』位於地中海岸、靠近迦密山。GT《雷氏研讀本》說多珥位於地中海沿岸、在該撒利亞和迦密山中間；GT《啟導本》說多珥山岡在地中海旁迦密山以南，包括該撒利亞以北的地區；GT《串珠聖經注釋》說多珥位於地中海岸、靠近迦密山，故被描述為多珥山崗；GT《約書亞記研經資料》說「多珥」字義是「世代」，位於地中海旁、迦密山以南。


    BH 說 Naphoth-dor included the coastal region around Dor, a Canaanite city with
    access to the Mediterranean and its trade routes（多珥山崗包括多珥周邊的沿海地區，那是一座能通往地中海及其貿易路線的迦南城），並說從山地、河谷、低地到海岸都有王加入，顯出敵對以色列的範圍之廣，也為耶和華顯明祂在這地一切勢力之上的至高預備了場合。'
