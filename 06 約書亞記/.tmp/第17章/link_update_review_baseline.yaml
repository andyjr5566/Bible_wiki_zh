- title: 示劍（城）
  path: link_folder/地點/示劍（城）.md
  definition: 示劍位於迦南地中部中央山區、以巴路山與基利心山之間的山口（今拿布勒斯附近），戰略地位極高、控制南北幹道。亞伯蘭進迦南首站在此築壇（創12:6-7）；雅各買地、築壇、住帳棚（創33:18-20）；約書亞在此與以色列立約（書24）；約瑟骸骨葬於此（書24:32；徒7:16）。名稱「示劍」意為「肩」、「脊背」，因地處兩山之間如肩膀。
  development: '### 位置與地位


    GT 華爾頓《創世記背景註釋》給的考證最完整：示劍據考證是位於耶路撒冷以北三十五哩、中央高地的巴拉塔遺址；提及這地方的古籍很多，其中包括森烏瑟特三世（Sen-Usert
    III）的埃及記錄（主前十九世紀）和亞馬拿泥版（主前十四世紀）。


    他並指出這座城為何重要：主前第二至第一千年紀的證據顯示不斷有人在此地居住，「足見這個處於從埃及經別是巴、耶路撒冷，北上大馬色之幹線網上的城市，在戰略上的地位是何等重要」；這地區土地肥沃，耕作放牧皆宜。


    GT《聖經精讀本──創世記註解》給的是另一組座標：希未人族長哈抹所建之城，用兒子示劍的名給城命名；位於耶路撒冷以北55km，在以巴路山和基利心山之間。GT《創世記雷氏研讀本》說在今天的拿布勒斯附近。BH
    補上字義：城名意為「肩」，可能與它位於以巴路山和基利心山之間的地理位置有關。


    ### 亞伯拉罕也在這裡


    三家都指出這不是雅各第一次有族長到示劍。GT 華爾頓說「它也是亞伯蘭到達迦南地的第一站（見創十二6）」；GT《串珠聖經註釋》說亞伯拉罕曾在此地居住，日後約書亞也曾在示劍和以色列人立約（書二四章）；GT
    丁良才《創世紀註釋》註第20節：「亞伯拉罕也曾在那裡築了一座壇（創十二7）。」


    雅各在第20節築壇，因此是踩在祖父的腳印上（見[[亞伯拉罕在示劍築壇]]）。


    ### 一個「平平安安」


    第18節：「雅各從巴旦亞蘭回來的時候，平平安安地到了迦南地的示劍城。」CT 註「平平安安」原文與『撒冷』或『沙龍』（Salem）同字；GT 丁良才把它接回創二八15（神在伯特利應許「保佑你」）。


    這一句是本章敘事上的收束：二十年前他從這片地逃出去，如今平安地回來了。


    ### 但他停在了這裡


    問題也在同一節。GT 丁良才判得最直接：「雅各沒有聽從神的吩咐（創三一13），因而受到三十四章裡所記的苦害；後來因神又有吩咐，他才回到伯特利（創三五1）。」他並推測動機：「雅各到示劍大概是因那地方的草多。」


    GT《聖經精讀本──創世記註解》說得更重：雅各不該忘記在哈蘭的逃亡路上自己在伯特利許下的諾言（創二八21-22），應該馬上回到伯特利為神築壇，「但他卻沒有這麼做，雅各的失誤在示劍城釀成了悲慘的『底拿被汙事件』（創三四章）」。GT《啟導本聖經創世記註釋》：「他逗留在示劍，沒有依諾言去到西珥（14節），不久禍生肘腋（創三四章）。」


    啟導本另給了雅各此後的路線：渡河進入迦南後第一個停留的地方是示劍，後來移居伯特利（創三五1）、以法他（創三五16）、希伯崙（創三五27），最後定居希伯崙（創三七1、14）——希伯崙是以撒居住的地方，一帶為山區、人口稀少、適合遊牧。


    示劍因此在本章是雙面的：它是平安歸回的終點，也是下一章災禍的起點（見[[雅各未去西珥卻往疏割示劍是否違背神旨意]]）。


    示劍在族長敘事中是神顯現、築壇與承受應許的重要地點：亞伯蘭初入迦南時在此蒙神顯現並築壇；雅各歸回迦南後也在此買地、築壇。其後示劍又成為約書亞召聚以色列眾支派立約之地，延續了回應神應許與委身的地理意義。'
