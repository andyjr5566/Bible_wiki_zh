- title: 曠野
  path: link_folder/地點/曠野.md
  definition: 「曠野」在出埃及記第5章中首次被提出作為以色列人祭祀神的去處。摩西向法老請求「容我們往曠野去，走三天的路程，祭祀耶和華我們的神」（v3）。曠野代表埃及勢力範圍之外，是以色列人可在不被埃及宗教禁忌限制下自由敬拜神的空間。
  development: '曠野在出埃及記後續發展為以色列人從紅海到西奈、再到加低斯巴尼亞長達四十年的旅程背景（出15:22-19:2; 民數記全卷）。曠野在聖經中有雙重象徵：(1)
    神同在與試煉之地（出19章西奈立約；申8:2 說神在曠野引導以色列這四十年，「是要苦煉你，試驗你」）；(2) 與世界分離的空間──KC指出曠野不是救恩的目標（那是迦南），而是必經的路程。


    申命記第8章把這個地方的功能講得最完整。第2節說四十年的目的是「是要苦煉你，試驗你，要知道你心內如何」，第5節把它讀成父親對兒子的管教，第16節則收在叫人終久享福。第15節同時寫出這地方的樣子：「那大而可怕的曠野，那裡有火蛇、蠍子、乾旱無水之地」——CT
    把它讀成一幅全景，說那是「空曠遼闊、幾無水源、天候酷熱、時有塵暴、常遇毒物、人煙稀少的曠野之地」。


    把出5 與申8 擺在一起，這個詞走過一段不短的路。出5:3 摩西向法老求的是「容我們往曠野去，走三天的路程，祭祀耶和華我們的神」，那時曠野的意義是埃及管不到的地方，一個可以自由敬拜的空間。到了申8，同一個地方已經住了四十年，它的意義從離開埃及的出口變成進美地之前的課堂；而申8:7-10
    描寫的美地，正是用曠野的缺乏當底色——乾旱無水之地對著有河、有泉、有源，飢餓與嗎哪對著吃得飽足、一無所缺。


    申命記11:24 給了這個詞第三種用法：「從曠野和利巴嫩，並伯拉大河，直到西海，都要作你們的境界。」曠野在這裡既不是敬拜的空間，也不是受試驗的課堂，而是一條邊界線——它從走過的路變成了地圖上的一個端點。


    不過它指哪一面，各家並不一致。CT 說「指巴蘭的曠野為南界」，GT《啟導本聖經申命記註釋》說「指巴勒斯坦南端的界限，包括南地和西奈半島」，GT《聖經精讀本──申命記註解》讀為南面的阿拉伯沙漠地帶，BH
    讀為南邊的尼革夫曠野；GT《申命記串珠聖經註釋》則單獨把它列為「東北的邊界」。這個分歧本身就值得記下來。'
