- title: 收納以法蓮與瑪拿西
  path: link_folder/歷史/收納以法蓮與瑪拿西.md
  definition: 雅各把孫兒以法蓮和瑪拿西視同自己的兒子，給予與流便、西緬同等的支派和產業地位。古代近東文獻亦有祖父收納孫兒的例子；在以色列歷史中，結果是約瑟透過兩個兒子取得雙份支派產業。
  development: '### 這是一次法定的收養


    GT《舊約背景註釋》把它放進古代近東的法制裡：「這個收養的習俗和方式，與漢摩拉比法典中的例證相似。此外烏加列文獻中，也有祖父收養孫兒的例子。」它並說明效果：「是次收養在一定程度上，可說是約瑟得到了長子所當得的雙分產業，因為他兩個兒子都分受了雅各的遺產。」BH
    同樣指出這是一次合法而正式的收養，是古代近東文化中公認的作法。GT《串珠聖經註釋》從動機說：雅各這樣做，乃是紀念他的愛妻拉結，而拉結是在伯利恆附近死去的（7節）。


    CT 注意到收養的儀式性動作：第12節「約瑟把兩個兒子從以色列兩膝中領出來」，原文也可譯作「從以色列兩膝上抱下來」，置幼兒於兩膝上含有「視同己出」的認養意味。GT《串珠聖經註釋》說得更直接：「一個人把小孩放在膝上，就表示把那孩子算為自己的兒子。」不過
    CT 也算過年紀：以法蓮和瑪拿西是在七個豐年期中出生的（41:50），雅各是在荒年第二年以後才下埃及、至今已住了十七年（47:28），所以這時他們至少已是二十來歲的人——「難怪中文和合譯本不譯『兩膝上』，而譯作『兩膝中』」。


    ### 收養改變了什麼，沒有改變什麼


    改變的是支派數目與產業分法。GT 丁良才：「因此以法蓮和瑪拿西也列在以色列支派中。這樣，約瑟就承受了雙份的產業。」GT《啟導本聖經創世記註釋》補上前因：流便雖是長子，因犯過罪失去長子名分（49:3-4），這名分賜給約瑟，然後傳給他的二子（代上5:1）。GT《聖經精讀本》強調收養的徹底：雅各「不顧約瑟兩個兒子的出生環境和血統，將他們納入救贖史的成員」，而不是讓他們作約瑟支派的兩個支系；日後兩人各自作為一個支派參與分配迦南地（民1:1-16）。


    沒有改變的是長子名分的其餘部分。CT 與 GT 丁良才都指出：約瑟並沒有全然得著長子的名分，他只得著雙份地土的部分；作王掌權的部分歸給了猶大（49:8-12；代上5:2），作祭司的部分歸給了利未（申33:8-10）。


    第6節則界定了範圍：約瑟日後若還有兒子，就歸在以法蓮和瑪拿西的名下得產業，不另立支派。GT《啟導本》從支派總數解釋這個安排：約瑟應得的土地將來分給二子，但利未不給土地（書14:4），因此分土地的支派仍是十二。'
  signals: []
  accumulation_count:
  - 2
