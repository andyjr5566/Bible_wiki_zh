- title: 以法蓮在瑪拿西以上
  path: link_folder/神學/以法蓮在瑪拿西以上.md
  definition: 雅各有意交叉雙手，以右手祝福次子以法蓮，立他在長子瑪拿西以上。他明說瑪拿西也要成為大族，但以法蓮後來更大。此事延續創世記中自然長幼次序多次被神揀選反轉的主題。
  development: '### 交叉的手是有意的


    CT 抓住原文的用字：「剪搭」指一種有意識的動作，可譯作「故意把左手交叉過來」。GT《聖經精讀本》同說這是「有意地交叉雙臂，與約瑟所期待的不同」，雅各「正確履行了神的旨意」。而雅各兩次說「我知道，我兒，我知道」——CT：「這句話表明他外面的眼睛雖然昏花了（10節），但他裏面的眼睛並沒有昏花。」KC
    說雅各是憑信心祝福的，他信心的眼睛看見神的心意，正如神在他和以掃身上所行的一樣。


    GT《聖經精讀本》另指出一個對照：雅各對長子權有著慘痛的教訓，因此沒有重蹈父親以撒的覆轍——以撒曾因偏愛和大意，差點破壞神的旨意（25:23；27:33）。


    ### 這是創世記反覆出現的樣式


    GT《舊約背景註釋》把它放在整卷書的主題裡：「在族長敘述中，每代都是幼子得到優待。得到產業的是以撒，不是以實瑪利；是雅各，不是以掃；得寵的是約瑟，而非眾兄長；如今以法蓮又比瑪拿西更得眷愛。」GT《創世記雷氏研讀本》同列這一串。CT
    則注意到雅各自己一生的三重反轉：他身為弟弟，卻與哥哥以掃爭長子的名分和祝福（27:36）；他又愛妹妹拉結過於姊姊利亞（29:30）；如今又將約瑟次子立在長子之上。


    ### 預言如何應驗


    雅各說「他的兄弟將來比他還大，他兄弟的後裔要成為多族」。CT 指出應驗的時間與範圍：以色列分裂成南北兩國時期（主前930-722），以法蓮支派是北邊以色列國最強大的支派，「以法蓮」也成了以色列國的別稱（賽7:2、5、8-9；何9:13；12:1、8）。GT《聖經精讀本》從士師時代算起：經士師時代到王國分裂時代，從數量及指揮能力方面，以法蓮支派超越瑪拿西支派的預言如實成就。KC
    補一筆對照：瑪拿西沒有像以法蓮那樣強大，並且被分成兩半——半個支派住在河西，另半個住在約旦河東。


    至於「願神使你如以法蓮、瑪拿西一樣」這句祝福詞，CT 說「後來這句話成為以色列人的諺語」；GT《聖經精讀本》說今天在希伯來社會，這句話成為表示「祝福」的格言。'
  signals:
  - first_in_book
  accumulation_count:
  - 1
