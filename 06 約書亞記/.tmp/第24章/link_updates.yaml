  path: link_folder/地點/示劍（城）.md
  summary: 第1節約書亞將眾支派聚集在示劍，第25節在示劍立約，第32節約瑟的骸骨葬在示劍。CT 與 GT《綜合解讀》說示劍是南北大道與東西大道的交叉口，亞伯拉罕首先在這裡築壇，雅各在這裡清除偶像，以色列人在這裡宣告祝福和咒詛；GT《研經資料》說約書亞記中以色列人通常在吉甲、示羅集會，這裡卻在示劍；GT 華爾頓說示劍是巴拉塔遺址，有二十四個文化層，攻取名單裡沒有示劍，以色列人可能沒有經過重大爭戰就取得這城；GT《聖經精讀本》說自族長時代以來示劍一直被視為聖地；KC 說這裡可視為一處聖所。
