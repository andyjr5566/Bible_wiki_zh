- title: 敬畏神
  path: link_folder/神學/敬畏神.md
  definition: '創世記二十二章12節，耶和華使者對亞伯拉罕說：「現在我知道你是敬畏神的了。」原文「敬畏神」＝極其怕神，指對神有極深的尊崇和順服，怕得罪神。


    神試驗亞伯拉罕的目的，是要證明他是否真的敬畏神。亞伯拉罕通過了考驗——沒有將獨生子留下不給神。敬畏神的最高表現：讓神在生活中享有絕對優先權，不愛惜自己的所有物過於愛神。'
  development: '### 「敬畏」是怕，還是遵行？兩份來源的重心不同


    CT 註創22:12「現在我知道你是敬畏神的了」，說這裡「敬畏神」的原文意思是「極其怕神」，並把應用寫在同一方向：信徒在世生活的態度應當是「深怕得罪神」。


    GT《串珠聖經註釋》則明說這個字不止於此：「敬畏在原文有較廣泛的意思，不是單單形容戰兢害怕，敬畏神就是遵守神的誡命」，並引主耶穌的話為註腳——「你們若愛我，就必遵守我的命令」（約十四15）。BH
    的說法與串珠同向：他說這裡的敬畏不是恐懼，而是深切的尊崇與順服。


    ### 從創世記的試驗，到利未記的日常


    這個詞在敘事書裡先出現在極端處境。創22 的「現在我知道你是敬畏神的」是在獻以撒的山上說的；出1 的收生婆因為敬畏神而違抗法老的命令；出20 的西奈山下，摩西說神降臨是「要叫你們時常敬畏他」。


    到了利未記19章，場景完全換了。敬畏神不再出現在山上或生死關頭，而出現在兩件小事旁邊：不可咒罵聾子、不可絆倒瞎子（v14），以及在白髮的人面前站起來（v32）。兩處的共同點是——受害的一方沒有能力反抗，旁邊也沒有人看見。CT
    在這裡點出理由：窮人雖抵不住、聾子雖聽不見、瞎子雖看不見，神卻能抵住、能聽見、也能看見。敬畏神在本章的功能，就是在沒有外部約束的時候仍然構成約束。


    STEP 顯示利19 這個動詞（H3372H）在本章出現三次：v3「孝敬父母」、v30「敬我的聖所」、v32「敬畏你的神」——《雷氏研讀本》所說「第30節的『敬』原文也相同」，字形上可以直接核對。敬父母、敬聖所、敬神在原文是同一個動作。


    ### 到了申命記，敬畏成了整篇講章的骨架


    創世記到利未記那條線是把敬畏從極端處境挪進日常；申命記做的是另一件事——把它變成可教、可傳、貫穿全篇的要求。


    申4:10 已經指出這東西是學來的：神招聚百姓、讓他們親耳聽見，目的就是「可以學習敬畏我，又可以教訓兒女這樣行」。申5:29 則從神自己口中說出祂要的是哪一種——「惟願他們存這樣的心敬畏我，常遵守我的一切誡命」，敬畏與遵守誡命在那裡被寫成同一件事。


    申6 把它擺到了三個結構位置上。第2節是律法頒布的目的（好叫你和你子子孫孫一生敬畏耶和華），第13節是進地之後的首要要求（你要敬畏耶和華─你的神，事奉他），第24節則是父親對兒子的解釋（要敬畏耶和華─我們的神，使我們常得好處）。這三處分別落在講章的開頭、中段與結尾，等於用同一個動作把整章框住，而第5節那條「盡心、盡性、盡力愛」就夾在第2節與第13節之間。


    KC 在申6 補上一個分辨，正好回答本條目開頭那場「敬畏是怕還是遵行」的爭論：在神面前，敬畏祂與愛祂是連在一起的，而敬畏神就是對祂存敬重。申命記沒有在怕與愛之間二選一，而是把兩者放進同一段命令裡。


    ### 敬畏被接到寫下來的那本律法書上


    申命記前面幾處講的是敬畏怎麼學、由誰教、擺在講章的哪個位置。第二十八58 換了一個接點：「這書上所寫律法的一切話是叫你敬畏耶和華─你神可榮可畏的名。」敬畏在這裡不是聽來的，也不是父親講的，而是一整本寫定的文件所要達成的目的。


    CT 說得很直接：本章中可怕的咒詛之言，是為讓讀這些話的人生發敬畏神的心，知道神正如其名是當受尊榮且可畏懼的，因為祂說到就必做到。KC 的說法把兩件事綁在一起——持守這書上的話與敬畏這名，總括了享受這些祝福所需要的一切。


    這一節的位置也值得注意：它不在祝福那一段，而是在五十多節咒詛講完之後、還要再加上「奇災」與「至重至久的病」之前。==申4 到申6 的敬畏是從聽見和教導來的，申28
    的敬畏是從讀到後果來的。==兩者指向同一個動作，理由卻分別落在恩典與畏懼上。'
