- title: 埃及
  path: link_folder/地點/埃及.md
  definition: 尼羅河流域的古國，創世記中反覆出現的鄰邦。CT 給的是水文理由：埃及「因為尼羅河的水源供應較為可靠，通常在別地發生饑荒時，在埃及地仍有豐富的糧食」——所以迦南一鬧饑荒，族長們就往埃及去：亞伯蘭如此（創12:10），雅各全家也如此（創42-47）。
  development: '### 為什麼一鬧饑荒就往埃及去


    CT 給的是水文理由：「埃及因為尼羅河的水源供應較為可靠，通常在別地發生饑荒時，在埃及地仍有豐富的糧食（參創四十一54）。」GT《舊約背景註釋》補上制度面：埃及「為古代近東其他地方無數因戰亂或饑荒而至的難民，提供了市場、食物，和短期工作」——它不只是糧倉，也是接納外來者的經濟體。


    ### 亞伯蘭一家在埃及人眼中是什麼樣子


    背景註釋〈創十二10～20 便尼哈桑的古墓壁畫〉提供了一幅可以對照的圖像：位於便尼哈桑（今日中埃及明亞市附近）的第十二王朝（主前十九世紀）克農霍特普三世古墓壁畫，「描繪了將原料和新奇貨物（乳香、天青石等）運到埃及的無數『亞洲人』商隊之一」。畫中人「是身穿彩衣，攜眷同行的武裝商人，帶來的驢子載滿了『牛革』和青銅錠子等眾多商品」。


    背景註釋對這幅畫下的判斷用語很克制：「他們的服飾和到達埃及之便利，**可能**正反映了亞伯蘭一家的外貌。」這是可資對照的同期圖像，不是亞伯蘭本人的紀錄。


    ### 埃及在創世記中的雙重面貌


    GT《聖經精讀本──創世記註解》把它讀成負面象徵：「在整篇聖經中埃及被描寫為世俗的象徵，或是脫離神的人的幫助或手段（賽31:1）」，因此亞伯蘭往埃及的遷移是「暗淡的前奏曲，暗示信神之人的失足」。CT
    與 KC 同採此讀。但同章的敘事也記下埃及確實供給了糧食，並在法老遣返時使亞伯蘭「帶著所有的」離開——精讀本自己也指出，這一連串（因饑荒下埃及、在埃及受艱辛、經神審判的災難得拯救、攜帶豐富財物出埃及）正預表日後的出埃及事件。


    ### 從避難所到為奴之家：出埃及記接著這條線走


    出埃及記接手的正是創世記留下的那個「雙重面貌」。出1章記新王「不再尊重約瑟」，把約瑟時代的糧倉翻轉成苦役之地——GT《中文聖經註釋》指出「法老」原是尊稱不是人名，CT〔靈意註解〕則直接把它讀成一個屬靈記號：法老預表這世界的王撒但（約12:31；弗2:2）。往後十災的敘事，每一災打的都是埃及自己的神——GT《啟導本》說「埃及拜偶像之風甚盛，大小神像遍地，牛、羊、蛇與青蛙，都在敬拜之列」，十災「是對埃及的大小菩薩來一次大掃除」。到出13、20兩章，埃及完成了它在全卷書裡的轉型：從一個地理名詞變成「為奴之家」這個屬靈記號本身——十誡的引言（出20:2）與利未記的祝福咒詛（利26:13）都以「將你們從埃及地領出來」作神權柄與立約信實的根基。



    ### 申命記：埃及從地名變成論證


    到申命記，埃及已經不是一個要去或要離開的地方。申4:20 用一個冶金的比喻回頭指它：「耶和華將你們從埃及領出來，脫離鐵爐」——出埃及記把它從糧倉翻成為奴之家，這裡再把那段日子整個壓縮成一座熔爐。


    第32-34節摩西一連丟出三個反問，核心都是同一件事：有沒有別的神在埃及做過這種事。第34節說的「像耶和華─你們的神在埃及，在你們眼前為你們所行的一切事呢」就是全部憑據，而答案落在第35節：「惟有耶和華他是神，除他以外，再無別神。」GT《啟導本》說摩西「向新一代以色列人多次講述神當日領他們祖先出埃及的歷史，要百姓認識自己的身分早非奴隸，而是自由人，是神特殊的子民」。


    創世記與出埃及記寫的是以色列人在埃及遭遇了什麼；申命記不再描述埃及，而是拿它當論據。'
