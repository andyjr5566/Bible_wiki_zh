- title: 非尼哈
  path: link_folder/人物/非尼哈.md
  definition: 出埃及記6:25「亞倫的兒子以利亞撒娶了普鐵的一個女兒為妻，她給他生了非尼哈。」非尼哈是亞倫的孫子、以利亞撒的兒子，後來成為大祭司。他的名字來歷各家說法不一：CT
    的原文字義作「銅管樂器的口」，GT《中文聖經註釋》作「銅嘴或蛇嘴」，但同一份注釋補一句更可能的來源——「此名可能出自埃及文的 Pe-nehasi，若然，其原義就為黑人」；GT《丁道爾聖經註釋》也說非尼哈這個埃及語名字「最是明顯」，意思是「古實人、黑人」，並指出利未支派用埃及語名字的還有米拉利、摩西與普鐵，「從前異族通婚可能十分普遍」（創41:45）。
  development: 非尼哈後來在什亭以熱心對付淫行止息瘟疫（民二十五6-9），得著「非尼哈之約」——永恆祭司的應許（民二十五10-13），最終接續以利亞撒為大祭司（士二十28）。CT和GT都指出這是繼亞倫之後祭司譜系的重要確認。
