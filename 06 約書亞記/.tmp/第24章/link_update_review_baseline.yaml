- title: 他拉
  path: link_folder/人物/他拉.md
  definition: 亞伯蘭的父親，拿鶴的兒子。CT 註其原文字義為「飄流，遲誤，落後者，回轉」，四義並列（靈訓多取「遲誤」一義）。帶家人從吾珥往迦南去，但停留在哈蘭就定居在那裏，活到205歲死在哈蘭。書二十四2
    記他在吾珥事奉別神。
  development: '### 他拉的屬靈狀態


    - 他拉在吾珥事奉別神（書廿四2）

    - 是他（而非亞伯蘭）主動帶家人離開吾珥（創十一31）

    - 但他只走到[[哈蘭]]就定居下來，沒有到達迦南


    ### 屬靈意義


    - 「他拉」意為「遲延」，「哈蘭」意為「枯乾」

    - 遲延的人住在枯乾之地

    - 他拉代表**屬肉體的信徒**：有起頭卻沒有結局

    - 屬地的人際關係（父子關係）攔阻了亞伯蘭屬天的呼召

    - 直到肉體的關係被死亡切斷，亞伯蘭才能繼續前行'
