- title: 哈抹
  path: link_folder/人物/哈抹.md
  definition: 希未人族長，示劍城的建立者/統治者，示劍（人）的父親（創33:19；34:2,6,8,13,20）。名字意為「驢子」或「騾子」。雅各以一百客西達銀子向哈抹子孫買下支帳棚的地（創33:19）。後來其子示劍汙辱底拿（創34），引發西緬利未報復屠城。
  development: '### 他是誰


    第19節「示劍的父親、哈抹的子孫」，第18節說示劍城在迦南地。GT《聖經精讀本──創世記註解》給的身分最完整：哈抹是希未人族長，示劍城是他所建，用兒子示劍的名給城命名。GT《啟導本聖經創世記註釋》說他是「管治示劍的大富戶」。


    ### 「哈抹」是名字還是尊號


    CT 與 GT 丁良才《創世紀註釋》都記下同一項保留：「有人以為『哈抹』兩字是尊號而不是名字，因為哈抹是那地的王」——理由是創三四2 稱他為「主」，那個字與創二三6
    的「王」原文相同。


    這個說法沒有被任何一家判定為定論，兩家都用「有人以為」的措辭。經文本身只寫「示劍的父親、哈抹」。


    ### 一個要分清楚的同名


    GT 丁良才另指出一項容易混淆的事：「然而這哈抹與徒七16節的哈抹不是一人，乃是他的後裔。」


    使徒行傳七16 說雅各及列祖葬在亞伯拉罕「用銀子從示劍哈抹子孫買來」的墳墓裡，而創世記二十三章買麥比拉洞的是亞伯拉罕、創世記三十三19 買示劍地的是雅各。倪柝聲《聖經問答》（GT
    收錄）為此另給了一個解法：亞伯拉罕買地（創二三）和雅各買地中間約隔八十年，此八十年中當日地主又來掌權，雅各不與之爭論、重新再買其祖所已買的；雅各所買的地和亞伯拉罕同是一個地方，示劍的父親和以弗崙同是哈抹的子孫。


    兩種解法都在處理同一個難題（徒七16 把買主寫成亞伯拉罕），一個訴諸世代，一個訴諸重複購買。經文本身沒有裁決。


    ### 他在下一章的位置


    本章的哈抹只出現在一場乾淨的土地交易裡：雅各用一百塊銀子向他的子孫買地（19節）。他真正的份量在創世記三十四章——底拿的事件之後，是他出面來與雅各商議（創三四6-10）。


    因此本章的哈抹是一個尚未展開的名字：這裡他是賣地的人，下一章他是求親的人（見[[示劍（哈抹之子）]]）。'
