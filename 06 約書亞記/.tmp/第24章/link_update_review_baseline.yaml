- title: 亭拿西拉
  path: link_folder/地點/亭拿西拉.md
  definition: '亭拿西拉是約書亞自己的產業。書19:50 說以色列人「是照耶和華的吩咐，將約書亞所求的城，就是以法蓮山地的亭拿西拉城，給了他。他就修那城，住在其中」。


    **名字。** STEP 把它標作 tim.nat- Se.rach（H8556B，簡要詞典義 Timnath-serah）。CT 給的字義是「太陽的一部分，豐盛的一部分」，GT《約書亞記研經資料》同樣給「太陽的一部分」或「豐盛的一部分」；KC
    說它的意思是「abundant portion」（豐盛的分）。GT《啟導本》說它又名亭拿希烈（士2:9），BH 也指出士2:9 稱它為 Timnath-heres。GT
    所引華爾頓《約書亞記背景注釋》說地名上的差異可能與地業分配有關，因為「西拉」是「剩餘」的意思，這個通俗詞源可能改變了原有的地名。


    **在哪裡。** 各家給的座標不同。CT 說它在伯特利西北方約15公里、示羅西南方約19公里；GT《約書亞記雷氏研讀本》說在呂大（羅德）東北約十二英里（19公里）以外；GT《聖經精讀本》說一般認為它就是示劍西南約11.2公里處的毗勒貝他那；華爾頓與《研經資料》則說它被考證為示劍西南約十二哩的蒂布納廢墟（Khirbet
    Tibnah），當地的挖掘證明鐵器時代第一期曾有人在此大事定居重建。


    **約書亞求的是什麼樣的城。** CT 說他不是求好的城，而是求別的家族沒有看中的城，而「他就修那城」暗示那城當時相當荒廢。STEP 顯示「修」是 va/i.yiv.Neh（H1129，簡要詞典義
    to build）；GT《聖經精讀本》說「修」的原文與「重新建築」相近，暗示那城已極其荒廢；GT《約書亞記綜合解讀》說「修」原文是「建造、重建」。KC 說它在山地，正是他同時代的人不願意住的地方（書17:15-16）。


    **約書亞家族的地。** 華爾頓說亭拿西拉雖在以法蓮境內，卻是約書亞家族專有的政治飛地（即獨立地區）。GT《啟導本》說它是約書亞的私人地業，以志其功績，約書亞住在這裡直到死日，而且葬在此地（書24:30；士2:9）；BH
    也說這裡後來成了這位僕人領袖的家與葬地。'
