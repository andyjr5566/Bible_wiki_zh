  definition: 「曠野」在出埃及記第5章中首次被提出作為以色列人祭祀神的去處。摩西向法老請求「容我們往曠野去，走三天的路程，祭祀耶和華我們的神」（v3）。曠野代表埃及勢力範圍之外，是以色列人可在不被埃及宗教禁忌限制下自由敬拜神的空間。
  development: '曠野在出埃及記後續發展為以色列人從紅海到西奈、再到加低斯巴尼亞長達四十年的旅程背景（出15:22-19:2; 民數記全卷）。曠野在聖經中有雙重象徵：(1)
