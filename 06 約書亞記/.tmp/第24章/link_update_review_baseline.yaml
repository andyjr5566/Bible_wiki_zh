    申11:24 之後，曠野在約書亞記裡換了好幾個角色。書1:4 它和申11:24 一樣是應許之地的一個界標，「從曠野和這利巴嫩」；書8 它是艾城東邊的方向，以色列人假裝往「通曠野的路」逃跑，CT
