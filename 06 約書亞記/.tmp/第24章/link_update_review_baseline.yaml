- title: 西乃之約
  path: link_folder/神學/西乃之約.md
  definition: '西乃之約又稱摩西之約，是神在西乃山藉摩西與以色列人所立的約。出19:3-6記載神的話——「如今你們若實在聽從我的話，遵守我的約，就要在萬民中作屬我的子民……你們要歸我作祭司的國度，為聖潔的國民。」CT指出4-6節可視為律法的前言或簡介，聖經學者稱之為「摩西之約」或「西乃之約」。CT指出以色列人享受此約之福的先決條件是：(1)聽從神的話；(2)遵守神的約。


    KC指出神將所有與約相關的祝福都建立在順服的條件上——祂不能將自己與人的私意相連。只有當神的百姓遵行祂的話，他們才能享受祂的約。BH 指出這約是以色列身分的根基，並把
    v5「你們若實在聽從我的話」與創17:1-2 亞伯拉罕之約的順服要求相提並論。'
  development: '西乃之約在出24章透過立約儀式正式確立——摩西將約書念給百姓聽，百姓說「耶和華所吩咐的，我們都必遵行」（出24:7），摩西將血灑在百姓身上說「這是立約的血」（出24:8）。GT《啟導本聖經腳註》從
    v5 的「若」字讀出整套律法的性質：「5節的那個『若』字是律法的基本精神，是神作工的方法，也是『律法原來一無所成』的主要原因」（來7:18-19；羅8:3），並指出「我們若把『西奈之約』與《彼前》二9、《啟示錄》一6；五10比較，便可發現律法對人的要求，在神的恩典中都白白的賞賜給了信徒」。西乃之約與新約的對比在
    [[來12：18-24 西乃山與錫安山|來12:18-24]] 最為明顯。


    申命記二十九1 給了這個約一個新的參照點，也給了一個沒有定論的問題：「這是耶和華在摩押地吩咐摩西與以色列人立約的話，是在他和他們於何烈山所立的約之外。」


    各家對「之外」的讀法分成兩路。CT 讀成重申：意指以西乃之約為基礎，加以重申和擴充。GT《啟導本聖經申命記註釋》同向，並列出後續的例子——神歷代與以色列人所立之約都以西奈之約為基礎（書二十四25；王下十一17；二十三2至3）。GT《聖經精讀本──申命記註解》說得最完整：這句話並不是指並非在何烈山所立的約，而是指除了在何烈山所立的約之外再次；它意味著聖約的重申與更新，這並非指聖約的內容有所更新，而是指立約的物件有所改變，追根究底，何烈山之約與摩押平地之約是本質上相同的約。


    KC 的判斷相反：這裡有一個新的約，不是舊約的更新，而是一個額外的約，並不廢掉何烈山的約。他並把西乃之約的性質定得比其他三家嚴：這個約本質上是建立在恩典之上、根據神已經做成的事；但當百姓拒絕靠恩典而活、把自己放在責任之下時，神就把律法給了他們，使這約變成繫於他們的順服——照這個基礎，百姓不可能進入那地。


    ==出二十四是這個約立成的一天，申五是它被重講給新一代的一天，申二十九則是它第一次被拿來與另一個約並排的一天。==而那個問題經文沒有回答：摩押平原的約究竟是它的第二次，還是另外一次。'
