- title: 巴蘭（比珥的兒子）
  path: link_folder/人物/巴蘭（比珥的兒子）.md
  definition: '比珥的兒子巴蘭，來自幼發拉底河邊毘奪的異邦術士兼先見，民數記22-24 章的核心人物。


    **他的名聲。** CT 說他「是米所波大米人，一位出名的異教術士，摩押王巴勒慕名差人去邀請他」。GT《啟導本聖經註釋》說他「能用觀兆解夢、妖術等等來預卜吉凶休咎」。GT《舊約聖經背景註釋》給的評價明顯不同：他「具有國際性的真先知信譽」，而且「他不獨是個占卜者而已」——「巴蘭每次都似乎是直接與神溝通」。


    **他和耶和華的關係。** 民22:18 他自稱「耶和華─我神」。GT《舊約聖經背景註釋》對此保留：「巴蘭很可能只是認識以色列之神的名聲（見：書二9～11喇合的話），又或對每個神都是如此稱呼，來誇耀自己先知的威信而已」，並說「我們沒有必要堅持巴蘭所事奉的，惟獨是耶和華」。KC
    說得更重：壞人也能用非常敬虔的言語；巴蘭把這幾個字當成一個公式在用，這裡談不上任何關係。


    **聖經如何評價他。** KC 統計得很完整：他的名字出現在八卷聖經書卷裡，而且一律是負面的——民22-24、民31:8、31:16、申23:3-5、書13:22、24:9-10、尼13:1-2、彌6:5、彼後2:15-16、猶11、啟2:14。新約三處引用各給了一個詞：「巴蘭的道路」（彼後2:15）、「巴蘭的錯謬」（猶11）、「巴蘭的教訓」（啟2:14）。


    **他的結局。** GT 李道生《舊約聖經問題總解》指出，巴蘭後來主動教導巴勒把絆腳石放在以色列人面前，使以色列人與摩押女子行姦淫、向假神獻祭，「而陷眾民於險惡的罪中，使二萬四千人遭受瘟疫死亡之禍」，而他自己「最後的結局，竟然死於刀下」。'
  development: '民數記記的是事情的經過，申命記記的是這件事後來被怎麼算。


    民數記二十二至二十四章讓巴蘭一次又一次開口，每次要咒詛卻說出祝福；二十五章與三十一章再把他與毘珥的事和他的死接上。整條敘事線裡，主詞常常是巴蘭自己——他去或不去、他說或不說。


    申命記二十三章第4至5節把同一件事濃縮成兩句話，主詞卻換了。第4節記帳：亞捫人和摩押人「雇了米所波大米的毘奪人比珥的兒子巴蘭來咒詛你們」。第5節立刻翻面：「然而耶和華─你的神不肯聽從巴蘭，卻使那咒詛的言語變為祝福的話，因為耶和華─你的神愛你。」


    CT 註得很簡：「神禁止巴蘭咒詛以色列人，又使巴蘭不自覺地說出祝福以色列人的話(參民二十三7~8，11等)。」GT《申命記串珠聖經註釋》則指出這裡提巴蘭的用意：「這裡提及巴蘭，藉此強調摩押人的罪行。」KC
    讀出的是另一面——神提醒百姓的不只是這些國家所行的惡，也提醒他們祂把咒詛翻轉成了祝福；他們並沒有因為被拒絕和被恨惡而少得什麼，反倒讓神有機會向他們保證祂的愛。


    ==在民數記裡，巴蘭是一個人；到了申命記，他成了一件證據。==而這件證據要證明的不是他的失敗，是神的愛。


    ### 約書亞記裡的一句註記


    書13:22 在河東分地的段落裡插進一句：「以色列人在所殺的人中，也用刀殺了比珥的兒子術士巴蘭」。這是民31:8 那件事的重述，放在流便所得之地的名單中間；STEP
    顯示「術士」是 ha./ko.Sem（H7080，簡要詞典義 qa.sam: to divine）。


    CT 在這裡把他被殺的原因接回民31:16：他因貪財被巴勒雇用去咒詛以色列人，後來又獻策用異教婦女迷惑以色列人。KC 說這似乎是摩西死前最後一次爭戰，記在這裡要成為流便人的警告。民數記讓他開口，申命記把他當作神愛以色列的證據，到書13
    他只剩一個稱號：術士。'
