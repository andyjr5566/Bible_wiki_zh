    丁良才《民數記註釋》從這裡看見整個制度的限制：「亞倫既死了，就顯明他為祭司的職分不完全（參來七23-25）。」但同一位註釋者也記下神的體恤：「這樣看來，神在亞倫活著（參十七章）和臨終的時候，都使他有大尊榮。」KC
    補上最後一筆：他死前親眼看見兒子穿上了他的衣服，是在尊嚴與平安中離世，不是被從百姓中剪除。'
