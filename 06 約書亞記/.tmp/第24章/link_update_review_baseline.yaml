- title: 以掃
  path: link_folder/人物/以掃.md
  definition: 以撒與利百加的長子，孿生兄弟中的哥哥。名字意為「有毛的」（創25:25），因出生時身體發紅、渾身有毛而得名。又名「以東」（創25:30，意為「紅」）。
  development: '### 創26：他自己娶妻


    第34-35節是以掃在本卷中第一次以「自己作決定的人」出現。KC 的對照很直接：以掃像該隱——兩人的記載都是他們**自己**娶妻，而亞當與以撒的妻子都是從耶和華那裡領受的；以掃所選的，正出自耶和華說要除滅、趕出的那些民族（出二三23、28）。


    GT《聖經精讀本──創世記註解》把這件事與前一章接起來：他曾輕看長子的名分，如今對待婚姻也一樣輕率。GT《啟導本聖經創世記註釋》則把它讀成對約的無知——他「不看重也不明白神賜給亞伯拉罕和以撒的約」。第35節說這兩個媳婦「常使以撒和利百加心裡愁煩」，丁良才指出這兩節是第二十七章的小引：利百加下一章的行動，動機在此已先鋪好（詳見[[以掃娶外邦女子]]）。


    至於他到底娶了幾個妻子、名字何以在創二十六、二十八、三十六章互不相同，四來源給了不同的整理方式，見[[以掃有幾個妻子]]。


    以掃在聖經中代表「屬肉體」的生命（與雅各的「屬靈」對比）：

    - 出生在先、憑血氣行事、野性未馴

    - 喜歡在世界活動（田野）

    - 看重眼見之物（紅湯），輕視屬天福分（長子名分）

    - 被希伯來書作者稱為「貪戀世俗」的代表（來12:16-17）

    - 豫表人天然的生命'
