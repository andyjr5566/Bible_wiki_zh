- title: 亞伯拉罕在示劍築壇
  path: link_folder/歷史/亞伯拉罕在示劍築壇.md
  definition: 創世記12:6-7記載亞伯蘭進迦南地，直到示劍摩利橡樹，耶和華向他顯現說「我要把這地賜給你的後裔」，亞伯蘭就在那裡為向他顯現的耶和華築壇。這是聖經記載在迦南地首座祭壇，確立示劍為「約的起點地」。雅各在創33:18-20同地買地、築壇、命名「伊利伊羅伊以色列」，呼應祖父亞伯拉罕的信心行動，宣示約在雅各身上延續。
  development: '### 同一個地方，隔了三代


    創十二6-7：亞伯蘭進入迦南地，經過示劍地方摩利橡樹那裡，耶和華向他顯現說「我要把這地賜給你的後裔」，「亞伯蘭就在那裏為向他顯現的耶和華築了一座壇」。


    本章第20節：雅各「在那裏築了一座壇，起名叫伊利伊羅伊以色列」。


    GT 丁良才《創世紀註釋》直接把兩處並列：「『築了一座壇』——亞伯拉罕也曾在那裡築了一座壇（創十二7）。」GT 華爾頓《創世記背景註釋》也指出示劍「是亞伯蘭到達迦南地的第一站」。GT《聖經精讀本──創世記註解》說得最完整：雅各「在祖父亞伯拉罕進入迦南地後築壇的地方，也照樣築了一座壇，把新買的地分別為聖獻給神」。


    ### 這是族長的一項共通動作


    GT 華爾頓《創世記背景註釋》把它提升成一條規律：「代與代之間的立約領袖之間共通的一點，是他們都在應許之地築壇，好敬拜耶和華（創十二7-8，十三18，二十六25）。」


    三處分別是亞伯蘭在示劍與伯特利之間、亞伯蘭在幔利、以撒在別是巴。加上本章雅各在示劍，三代族長都做了同一件事。


    華爾頓並說明築壇在當時的雙重意義：壇的功用是作為獻祭的地點，而「在新的地方築壇，也有表示在當地引進一位神祇來崇拜的意思」。CT 說的是同一件事的另一面：「築壇是為敬拜神；但亦有佔領的含義，表示這是屬神的人所在的地方。」


    ### 一個差別


    亞伯蘭在示劍築壇是因為「耶和華向他顯現」（創十二7）——壇是對顯現的回應。雅各在示劍築壇時，經文沒有記載神在示劍向他顯現；他所回應的是二十年前在伯特利的顯現。


    這正是各家對第20節評價分歧的來由：CT 與司可福讀成他終於實踐了伯特利的諾言，KC 讀成他在錯的地方築了對的壇（見[[示劍築壇意義：紀念神還是佔領地土]]）。


    ### 示劍在正典裡的第三次


    GT《串珠聖經註釋》補上這條線的後續：「日後約書亞也曾在示劍和以色列人立約（書二四章）。」


    亞伯蘭築壇、雅各築壇、約書亞立約——同一個地方在正典裡承接了三次立約性的動作，而雅各買下的那塊地就在其中（見[[約瑟骸骨葬於示劍]]）。


    - 祭壇作為約的地理標記、代代相傳

    - 同地點重複築壇 = 約的續接與深化'
