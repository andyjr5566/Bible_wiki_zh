- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  definition: 出埃及記6:23「亞倫娶了亞米拿達的女兒……給他生了拿答、亞比戶、以利亞撒、以他瑪。」以利亞撒是亞倫的第三個兒子，後來接續亞倫為大祭司。CT
    的原文字義說「以利亞撒」意即「神已幫助」，GT《中文聖經註釋》作「神幫助了或神所造的」。他所娶的是普鐵的女兒——CT 說「聖經中普鐵之名僅在此處出現一次，故不知其出身族系」，GT《中文聖經註釋》也說這名字可能源自埃及文，意義不甚明確。
  development: 'CT 指出以利亞撒接任的緣由：亞倫的兒子拿答和亞比戶因獻凡火被火燒死（利10:1-2），而他們沒有兒子（民3:4），所以以利亞撒接續作了大祭司，成為利未人眾首領的領袖（民3:32；民20:23-26）。他兒子非尼哈後來以熱心止息瘟疫，得著永恆祭司之約（民二十五10-13）。


    ### 約書亞記：和約書亞一起分地


    民數記裡以利亞撒接續亞倫作大祭司；到約書亞記，他出現在分地的頭尾。書14:1 他和約書亞、各支派的族長一同主持分地，GT《約書亞記綜合解讀》推測他可能負責主持拈鬮；書17:4
    西羅非哈的女兒來到他和約書亞面前，求摩西所吩咐的那一份；書19:51 分地結束，經文又把同一組人列一次：「祭司以利亞撒和嫩的兒子約書亞，並以色列各支派的族長」。GT《啟導本》在書19
    說主持分地的人是摩西預先指定的（民34:17-19）。


    KC 數過這組名字在約書亞記並提四次（書14:1、17:4、19:51、21:1），以利亞撒總是排在前面；它在書19 說領導要帶著祭司的心才是好的領導，所以祭司排在前面。'
