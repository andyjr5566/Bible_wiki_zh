- title: 約書亞的告別辭
  path: link_folder/事件/約書亞的告別辭.md
  definition: '約書亞臨終前對以色列眾首領說的最後一番話，記在書23。書23:1-2「耶和華使以色列人安靜，不與四圍的一切仇敵爭戰，已經多日。約書亞年紀老邁，就把以色列眾人的長老、族長、審判官，並官長都召了來，對他們說：我年紀已經老邁。」書23:14
    他說：「我現在要走世人必走的路。」


    **時間與場合。** 經文只說「已經多日」。GT《約書亞記研經資料》說原文直譯是「已經過了很久」，暗示分完地之後到這段遺言之間有一段相當長的時間；CT 說「多日」可能長達十年以上，GT《約書亞記綜合解讀》說是二十多年。CT、GT《綜合解讀》與《約書亞記雷氏研讀本》都說約書亞這時大約一百一十歲（書24:29）。GT
    所引華爾頓說，經文沒有表示這番話是緊接在書22 之後，還是引出書24 的更新盟約，本段也絕口不提演說的地點；GT《研經資料》說有學者認為可能在示羅，也有學者不這樣認為。GT《聖經精讀本》說約書亞分完產業之後，似乎退到以法蓮山地的亭拿西拉安度晚年（書19:50）。


    **對象。** 召來的是長老、族長、審判官與官長。GT《雷氏》說這裡說話的對象是以色列的眾首領，書24 的對象是整個民族；GT《研經資料》說這四種人等於代表所有以色列人。GT《聖經精讀本》則說這四種稱呼不代表四種不同身分：長老是百姓代表的一般名稱，族長、審判官、官長是指導百姓的身分。


    **內容。** GT《聖經精讀本》把它分成三個焦點：回顧神為以色列所行的偉大工作（書23:1-5），告知百姓當遵行的事（書23:6-11），預言順服帶來的祝福與不順服招來的咒詛（書23:12-16）；CT
    的綱要也是這三段。GT《丁道爾聖經注釋》說「剩下的各國」在書23:4、7、12 三次出現，是演說的主題之一。GT《綜合解讀》說約書亞三次強調悖逆違約的結果是在神所賜的這美地上滅亡（書23:13、15、16）。


    **和其他人的臨別相比。** GT《啟導本》與《研經資料》都說，約書亞最後的話可與申命記所記摩西的遺言先後輝映（申31-33）；GT《聖經精讀本》說聖經所記錄的多數遺言都是神的預言（創49；申32）。KC
    說書23 與書24 是一體的，並把它和摩西（申31:14-30；32:45-47）、撒母耳（撒上12:1-25）、保羅（徒20:17-38）的臨別並列：「Leaders
    may pass away; the words of God they have spoken remain.」（領袖會離去，他們說過的神的話仍然存留。）BH
    說約書亞公開承認自己的帶領將到盡頭，就像摩西在他之前那樣（申31:2）。GT《啟導本》另說，從這番諄諄訓誨可知百姓或已有背道的趨向；眾民雖都熱烈響應，到約書亞和那一代的長老謝世後，承諾就忘得一乾二淨（士2:7-10）。


    **世人必走的路。** GT《研經資料》說就是死亡。KC 說約書亞藉死離開世界，以諾與以利亞是例外（創5:24；王下2:11），他這樣強調自己的死，話就更令人印象深刻。BH
    把這句話連到王上2:2，大衛臨終說的也是同一句話。'
