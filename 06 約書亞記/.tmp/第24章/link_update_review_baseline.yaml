- title: 巴勒
  path: link_folder/人物/巴勒.md
  definition: '西撥的兒子巴勒，民數記22-24 章的摩押王，也是雇巴蘭咒詛以色列的人。


    **名字。** GT《民數記串珠聖經註釋》說「巴勒」意即「毀滅者」；GT《聖經精讀本──民數記註解》說他的名字擁有「擄掠者」的意思（士11:25）；CT 給的原文字義是「破壞者」；BH
    說其名意為 devastator 或 waster。四套來源給的方向一致。


    **他是誰。** CT 提出一個值得注意的說法：巴勒「他是米甸人，顯示摩押已經改朝換代，自從摩押人敗給亞摩利人，喪失了亞嫩河以北的國土之後，亞摩利王西宏分派米甸的族長掌管摩押地(參書十三21)」。GT
    丁良才《民數記註釋》引古時猶太人的說法，方向相同。GT《舊約聖經背景註釋》則提醒：「王這個稱號除了可以用來形容龐大帝國的統治者之外，更可以像本段一樣，用來形容小國的領袖或部落的酋長。」它並指出，除了米沙碑文提供一些主前九世紀的資料，巴勒本人並沒有在其他歷史典籍中被提及。


    **他怕的是什麼。** GT《聖經精讀本》點出一個諷刺：「摩押並不是以色列百姓要剿滅的物件(申7:1),所以沒有必要害怕以色列百姓經過」。KC 說得更直白：神已禁止以色列奪取摩押的地（申2:9），所以這份恐懼沒有根據，而惡人總是在沒有危險的地方看見危險，因為他們良心有虧。


    **他錯在哪裡。** KC 指出巴勒根本誤判了對手：他把以色列的神看成一位民族性的偶像，就像每個國家都有自己的神一樣；他只知道神是聖潔的神，卻完全不知道神的恩典。'
