- title: 事奉與作奴僕同一字根（a.vad）
  path: link_folder/原文/事奉與作奴僕同一字根（a.vad）.md
  definition: '申命記第五章裡有五個位置，中文分別譯成「為奴」「事奉」「勞碌」「僕婢」「作過奴僕」，看起來像五件不相干的事，在原文卻共用一個字根。


    STEP 逐字資料把這五處排出來：


    | 節 | 和合本 | STEP 音譯 | Strong | 簡要詞典義 |

    |---|---|---|---|---|

    | 6 | 為奴之家 | ''a.va.Dim | H5650 | servant/slave |

    | 9 | 也不可事奉他 | ta.''a.ve.De/m | H5647H | to serve: minister |

    | 13 | 六日要勞碌 | ta.''a.Vod | H5647I | to serve: labour |

    | 14 | 你的僕婢 | ''av.de./kha | H5650 | servant/slave |

    | 15 | 在埃及地作過奴僕 | ''E.ved | H5650 | servant/slave |


    H5647 是動詞 a.vad，H5650 是由它來的名詞 e.ved；簡要詞典把動詞的兩個編號分別記成 to serve: minister 與 to serve:
    labour，同一個動作按上下文落在宗教服事或日常勞動兩邊。


    CT 的原文字義在兩個相隔六節的地方給了完全相同的中文：第9節「事奉」工作，服事；第13節「勞碌」工作，服事。中文譯本把它們分開譯，是為了讀起來順，不是因為原文換了字。


    CT 對這幾處的解釋各自貼著上下文：第9節的『事奉』指侍候那些形像，並為其從事宗教性的工作；第13節說一周第一至第六日，為著維持家庭的生活，每天都要作所該作的工；第15節則要人回想從前那種日以繼夜，不得休息的苦工。


    這條線也解釋了第14至15節那個看似繞路的理由。KC 指出，除了創造之外，救恩也是我們順服的理由，而這份救贖同樣會帶著人去憐憫別人。GT《啟導本聖經申命記註釋》講得直接：在神面前人人平等，從祂規定僕婢也應休息看出。曾經是
    e.ved 的人，如今家裡有 e.ved，安息日就是這件事的具體安排。'
  development: '**兩章都用這個字根把誡命釘回埃及。** 申5 有五個位置共用它——第6節為奴之家、第9節事奉別神、第13節六日勞碌、第14節僕婢、第15節在埃及地作過奴僕；申6
    則有三個——第12節為奴之家、第13節事奉他、第21節在埃及作過法老的奴僕。


    兩章的用法方向不同。申5 把這個字根用在安息日上：因為你曾是 e.ved，所以你家裡的 e.ved 也要歇息，理由是救贖而不是創造。申6 把同一個字根用在效忠上：因為神把你從為奴之家領出來（第12節），所以你要事奉他（第13節）；而當兒子日後發問，父親的回答仍舊從「我們在埃及作過法老的奴僕」開始（第21節）。


    合起來看，這個字根在申命記裡承擔同一件工作：它讓「服事」這個動作永遠帶著埃及的記憶。中文把它拆成為奴、事奉、勞碌、僕婢四個詞，讀者因此看不出第13節要人去做的事，和第12節提醒他們曾被迫做的事，在原文是同一個動作——差別只在對象換了。


    ### 同一個字根，兩種相反的規定


    申命記十五章把 a.vad 用在兩種對象上，而規定正好相反。


    第12節與第18節說奴僕「服事你六年」，STEP 是 H5647G；第19節說頭生的牛「不可用他耕地」，STEP 是 H5647I——同一個字根的另一個編號，簡要詞典義
    to serve: labour。中文一個譯成服事、一個譯成耕地，原文是同一個動作。


    規定卻是兩個極端：用在弟兄身上，六年之後必須停止；用在頭生的牲畜身上，一次也不可以。分別在歸屬——弟兄是神從埃及救贖出來的人，所以他的 a.vad 有期限；頭生的牲畜是已經分別為聖歸神的，所以牠的
    a.vad 完全不許可。CT 對第19節的解釋正是這個意思：耕地即將屬神的挪來私用，故予禁止。


    ==這個字根在申命記裡因此拉出一條完整的光譜：對神的事奉沒有上限，對人的服事有期限，對已歸神之物的取用是零。=='
