- title: 忌邪的神
  path: link_folder/神學/忌邪的神.md
  definition: 「我耶和華你的神是忌邪的神」（出二十5b）是十誡第二條誡命附帶的自我宣告，表明神對祂百姓的專一要求。原文「忌邪」（qanna）亦可譯為「嫉妒」，但並非人類罪性的嫉妒（羨慕他人所擁有的），而是神對祂與百姓之間排他性盟約關係的熱心維護。神的「忌邪」與祂的聖潔極有關係（書二十四19），祂不能容忍百姓把祂應得的尊榮歸給偶像，也不能容忍人對祂的不忠實。神與人立約的關係有同婚約，要求對方完全的奉獻。
  development: '神的「嫉妒」是祂對百姓的愛和對他們忠誠的要求。保羅曾提到「神那樣的嫉妒」（林後十一2），是與拜偶像有關的。人類的嫉妒感是由於對未擁有的妄圖垂涎造成的；然而神的嫉妒是保護祂所屬的，也就是祂的至高無上。神要求祂的受造物對祂絕對的忠誠，因為只有對最真實終極的神作出最重要的奉獻才能滿足人的心。



    ### 從誡命裡的自我宣告，到歌裡的反向嫉妒


    這個屬性在正典裡是一路加碼的。出埃及記20章是它第一次被說出來，位置就在第二條誡命的附註裡，等於一開始就把它綁在不可敬拜別神這件事上；出埃及記34章重申立約時再說一次。民數記25章換成敘事，非尼哈在什亭的舉動被神算為與他同一種熱心。申命記4、5、6章則把它接進勸勉：摩西一再提醒新一代，這位神不會在忠誠這件事上讓步。


    申命記32章走到最後一步，也是最出人意料的一步。申32:16 說百姓敬拜別神觸動了神的憤恨，申32:21 接著把同一個動作反過來用——他們用不算為神的觸動我的憤恨，我也要用不成子民的觸動他們的憤恨。神的回應不是單純的刑罰，而是讓外邦人得著本該屬於他們的位置，好把他們激回來。


    從誡命到敘事、從勸勉到詩歌，這個屬性的內容始終沒變，用法卻愈來愈深：一開始是禁令的理由，最後成了挽回的手段。'
