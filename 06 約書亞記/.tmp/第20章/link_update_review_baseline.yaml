- title: 逃城
  path: link_folder/互文/逃城.md
  definition: 逃城與出埃及記第二十一章的關聯：出21:13首次提及誤殺人者可「逃往神所指定的地方」，為後來逃城制度的雛形。逃城是為誤殺者設立的庇護所，使誤殺人者免於報血仇者的追殺，直到受審判為止。民數記35:9-34
    訂出完整的六座逃城制度，申命記4:41-43 是摩西實際點名河東三座（比悉、拉末、哥蘭）的地方，申命記19:1-13 交代河西那三座，約書亞記20:1-9
    記載六座城全部設立。
  development: '出埃及記首立逃城雛形，民數記35章訂出完整的六座逃城制度，申命記4章由摩西實際指定河東三座，申命記19章交代河西那三座，約書亞記20章記載約書亞設立逃城。逃城體現神對公義與憐憫的平衡——既懲罰蓄意殺人，又保護誤殺者。


    申命記十九章把這條線上最實際的一段補齊了。前面幾處講的是「有沒有」——出21:13 給了一個地方，民35 定出六座，申4:41-43 點名河東三座；十九章講的是「到不到得了」。


    第3節要求把地分為三段、預備道路，STEP 顯示「分為三段」是 ve./shi.lash.Ta（H8027，簡要詞典義 sha.lash: to do three）。GT《聖經精讀本》說明用意：在每個區域的中心部設立逃城，使逃亡者無論身處何方都不為報血仇者所追趕上。第6節給出理由——報血仇的「因路遠就追上」。


    第11至12節另補上一道程序：蓄意殺人的就算進了城，本城的長老也要打發人把他帶出來，交在報血仇的手中。==逃城因此不是一個進去就安全的地方，而是一個先受審查的地方。=='
