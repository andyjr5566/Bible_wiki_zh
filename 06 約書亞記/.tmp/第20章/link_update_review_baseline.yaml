- title: 謀殺與誤殺的區分
  path: link_folder/神學/謀殺與誤殺的區分.md
  definition: 出埃及記二十一12 先立通則「打人以致打死的，必要把他治死」，13-14 兩節隨即為它劃出例外與加重。CT 把兩節對舉：13 節「意指不是蓄意謀殺對方，而是碰巧意外死在他的手中」，14
    節則「意指蓄意設下計謀殺害人命」，即使「他尋求神的庇護，也不能如願，必要治死他」。GT《丁道爾聖經註釋》認為這個區分在古代法律裡格外可貴：「這麼早就將蓄意殺人和誤殺分別處理，極是可圈可點：因為原始的血債血償，是不管兇手是否故意的。」BH
    也指出在古代以色列的律法裡，意圖是判定罪責的關鍵。
  development: '本章只給原則，民數記三十五章與申命記十九章補上程序、地點與判準。GT《丁道爾聖經註釋》指出這種立法方式在五經中反覆出現：「這條律法和五經很多地方一樣，為當時苛刻而迅速的制裁，定下嚴格的規限」。


    申命記十九章把這個區分寫成可以操作的樣子。


    出21:12-14 給原則，民35:16-23 給判準（凶器與宿怨），申19:4-6、11-12 補上兩件事：一個判定用的公式，和一個實際的例子。


    公式在第4節：「凡素無仇恨，無心殺了人的」。STEP 顯示「無心」是 bi/v.li- Da.''at（H1097 加 H1847，簡要詞典義 da.at:
    knowledge），「素無仇恨」是 lo''- so.Ne''（H8130，sa.ne: to hate）接 mi./te.Mol shil.Shom（H8543
    加 H8032），字面是從昨日、前日以來沒有恨他——==判的不是那一刻，而是那之前的關係。==


    例子在第5節：兩人同進樹林砍柴，斧頭脫了把飛落在鄰舍身上。KC 說這個例子把界線畫得很清楚——樹林是誰都可以進的，砍柴是誰都可以做的，事情不是出於預謀，純粹是意外；有了它，任何類似的案件都可以拿來比對評估。


    反面寫在第11節：恨他的鄰舍、埋伏著起來擊殺他（STEP：ve./''A.rav，H693，a.rav: to ambush）。判定的人也第一次被指名——本城的長老。'
