    ba./mid.Bar（H4057B，wilderness）加 ha./mi.Shor（H4334，簡要詞典義 plain）。


    **位置。** CT 指出「流便人所得地業在河東的最南邊」，並在文意註解裡把比悉的細節指向約書亞記21:36。


    BH 給的描述是：「Bezer was designated as one of the cities of refuge, a place where someone
    who had accidentally killed another could flee for safety until a fair trial could
    be conducted. The location in the wilderness on the plateau indicates a region
    that was somewhat isolated, providing a natural barrier and protection.」（比悉被指定為逃城之一，是誤殺人者可以逃去避難、等候公正審判的地方。它位在高原曠野，這個位置說明那是一片相對孤立的區域，本身就構成天然屏障與保護。）


    三座逃城由南到北排開時，比悉是最南的一座——這與 CT 說流便人地業在河東最南邊是同一件事。'
