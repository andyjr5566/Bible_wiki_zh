- title: 寄居的與本地人同歸一例
  path: link_folder/主題/寄居的與本地人同歸一例.md
  definition: '利未記24:22：「不管是寄居的是本地人，同歸一例。我是耶和華你們的神。」同一句話在 v16 已經先講過一次。


    **原文直譯是「一個判決」。** STEP語言資料顯示這句話是 מִשְׁפַּט אֶחָד（mish.Pat 一個判決／''e.Chad 一），後面接
    כַּגֵּר כָּאֶזְרָח（ka./Ger 如同寄居的／ka./''ez.Rach 如同本地人）。CT 的原文字義欄拆法相同：「同歸一例（原文雙字）」一、一個（首字）；判決、公平、律例（次字）。


    **這在古代近東是罕見的。** BH 說得最直接：一體適用的法律標準「在古代近東的處境裡是革命性的」，因為周圍多數文化對不同階層適用不同的法律。GT《舊約聖經背景註釋》給出具體對照：漢摩拉比法典（主前十八世紀巴比倫）「刑罰隨犯人和被害者的社會地位（貴族、公民、奴隸）有所不同」。


    **適用的兩個方向。** 一方面是保護：外邦寄居者受同樣的法律保障。另一方面是責任：丁良才指出「寄居的雖是不信靠耶和華，但他們也不得褻瀆聖名」。GT 精讀本另界定了「寄居的」在本章的具體所指：「與一般意義上的外邦人不同，是指與以色列人生活在一起、雖不是本地人，但被以色列的風俗、文化同化」的人。


    **這條原則是本章事件催生的。** KC 指出，關於傷害與殺人的報復規定在出埃及記21:12-36 已經存在，「這位埃及人之子的案件，正是把這些報復規則同樣宣告適用於外人的緣由」。丁良才也引出埃及記12:49
    與民數記15:16 說明這是既有原則的重申。CT 的總結是一句話：「在神的律法之前，人人平等。」'
