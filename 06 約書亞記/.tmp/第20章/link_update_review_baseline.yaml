- title: 摩西分定河東三座逃城（ba.dal）
  path: link_folder/事件/摩西分定河東三座逃城（ba.dal）.md
  definition: '申命記4:41-43 是插在兩篇講章之間的一段行動記載：「那時，摩西在約但河東，向日出之地，分定三座城」，「使那素無仇恨、無心殺了人的，可以逃到這三城之中的一座城，就得存活」。


    **「分定」原文是「分別出來」。** STEP 原文資料顯示是 yav.Dil（H914），形態 Hiphil 未完成式三人稱陽性單數，本節譯義 he set
    apart；簡要詞典義 ba.dal: to separate。CT〔原文字義〕給的是「分定」分開，隔開。


    **三座城與三個支派一一對應。**


    | 城 | 支派 | 位置（CT） |

    |---|---|---|

    | 曠野平原的比悉 | 流便人 | 河東的最南邊 |

    | 基列的拉末 | 迦得人 | 河東的中部 |

    | 巴珊的哥蘭 | 瑪拿西人 | 河東的最北邊 |


    **這是六座逃城的前一半。** GT《啟導本》：「逃城共有六座，河東三座，河西三座（十九2～3）。」GT《聖經精讀本》補上分工：逃城「原定要在約但河東與河西各立三座（民35:14）」。


    **受保護的對象有明確界線。** CT 文意註解：「『素無仇恨、無心殺了人』指非蓄意謀殺，而是因事故誤殺。」〔原文字義〕另拆出兩組雙字：「素（原文雙字）」早先（首字）；前天（次字）；「無心（原文雙字）」缺少，沒有（首字）；知識，理解（次字）。GT《聖經精讀本》說這是「為了防止進一步流無辜之血的社會仲裁制度」。


    **CT 把逃城讀成恩典的預表。** 〔話中之光〕：「逃城是恩典的小影，說明了神對人的體貼。神追討罪是肯定的，但對被罪的權勢捆綁，身不由己的犯了罪，但對罪又有悔意的人，神是為他們留下憐恤的路。」


    **KC 注意到這段插得很突然。** 「Suddenly Moses'' speech is interrupted by an action: the designation
    of three cities of refuge in the area of the wilderness side of the Jordan for
    the manslayer.」（摩西的講論突然被一個行動打斷：在約但河曠野那一側為誤殺者指定三座逃城。）他並指出：「These are the cities
    of refuge in the area of the wilderness side of the Jordan, so not yet in the
    land.」（這些逃城在約但河曠野那一側，所以還不在那地之內。）'
  development: '同一個動詞在申命記出現兩次，分別指河東與河西。


    申4:41-43 記的是已經做完的事：摩西在約但河東分定三座城。申19:2、7 記的是還沒做的事——過了約但河、住進迦南人的城邑之後，「就要在耶和華─你神所賜你為業的地上分定三座城」。STEP
    顯示兩處都是 ba.dal 這個字（申19 作 tav.Dil，H914，簡要詞典義 ba.dal: to separate）。


    GT《啟導本聖經申命記註釋》把兩批接起來：「這之前，摩西已在約但河東為兩個半支派設立了三座」，六座逃城平均分配在約但河東西兩岸的北、中與南三部分。==申4
    是一段敘事，申19 是一道命令；同一個動作，一次已經完成，一次還在將來式。=='
  signals:
  - first_in_book
  accumulation_count:
  - 2
