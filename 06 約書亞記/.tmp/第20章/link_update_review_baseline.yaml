- title: 報血仇的（ga.al）
  path: link_folder/原文/報血仇的（ga.al）.md
  definition: '申命記第十九章兩次提到「報血仇的」（第6、12節）。他是逃城條例裡的另一個主角——不是罪犯，也不是法官，而是死者那一邊的人。


    ### 原文是兩個字


    STEP 顯示原文是 go.''El ha./Dam（H1350H 加 H1818）。前一個字的簡要詞典義是 ga.al: to redeem: avenge，後一個是
    dam，血。GT《聖經精讀本》把這個字的商業色彩點了出來：它含有償還、賠償之意，可翻譯為償還者、報仇者。


    ### 他是誰


    四套註釋在這一點上完全一致，都指向血緣。CT 說『報血仇的』指死者的至近親屬；GT《申命記雷氏研讀本》註「報血仇的」。死者的近親；GT《申命記串珠聖經註釋》說是被害者至近的親屬。GT《靈修版聖經註釋》講得最具體——報血仇的人是與被殺之人最近的男性親屬，是家族的保護者（參民35:19）。BH
    也說這個角色屬於以親屬關係為基礎的司法制度，家族榮譽與報復在古代近東的法律裡份量很重。


    ### 他有權利，也有義務


    這不是個人情緒的問題。GT《聖經精讀本》指出，與死者最親近的親戚具有作為報仇者的權利和義務，根據是挪亞時代以來關於血的律法（創9:6）。


    ### 逃城正是為了限制他而設


    第6節把他追人的樣子寫了出來：心中火熱追趕，因路遠就追上，將他殺死。STEP 顯示「心中火熱」是 ye.Cham le.va.V/o（H2552，簡要詞典義
    cha.mam: to warm，加 H3824 le.vav 心）。CT 說『心中火熱』指熱切地追趕，唯恐慢了一步；GT《申命記串珠聖經註釋》說是逼切追趕，在烈怒下把犯人殺死，並指出死者親屬本應把犯人帶回凶案發生的城市，交由當地的長老辦理。


    GT《聖經精讀本》把整套制度的用意講得最清楚：逃城制度保護了在流人血者中誤殺人者的生命，禁止了盲目性的復仇；此制度在殺人者與報仇者之間起仲裁作用，目的在於防止個人情感的介入，控制流無辜血的報仇行為。


    ### 但他沒有被取消


    第12節顯示這個角色仍然有效：蓄意殺人的人就算逃進了逃城，本城的長老也要打發人把他帶出來，「交在報血仇的手中，將他治死」。STEP 顯示「交在報血仇的手中」用的是
    be./Yad（H3027K）。==制度沒有廢掉他，只是在他動手之前加了一道審查。== KC 說得更直接：不逃的人最終會落在報血仇的手裡。'
  development: '這個角色在律法裡的位置，是一路被收窄的。


    起點是創世記九6 那條關於血的律法——凡流人血的，他的血也必被人所流。GT《聖經精讀本》在申19:6 指出，報血仇的權利與義務正是從挪亞時代這條律法來的。民數記三十五章把它寫進制度：報血仇的仍可親自處死故殺人的，但罪名要先由會眾判定、並且不能只憑一個見證人。


    申命記十九章再收一次。第4至6節把「不該死」的人明確劃出來——素無仇恨、無心殺人的，逃城要保護他不被追上；第11至12節則把「該死」的人明確交回去——蓄意的，長老要把他從逃城帶出來，交在報血仇的手中。==同一個人，在同一章裡先被攔住，再被授權。=='
  signals:
  - first_in_book
  accumulation_count:
  - 1
  - 2
- title: 大祭司死了誤殺者才得釋放
  path: link_folder/神學/大祭司死了誤殺者才得釋放.md
  definition: '誤殺人的躲進逃城，什麼時候可以回家？民數記35章給的答案不是刑期，而是一個人的死：「他要住在其中，直等到受聖膏的大祭司死了」（民35:25）、「大祭司死了以後，誤殺人的才可以回到他所得為業之地」（民35:28）。民35:32
    再堵死一條後路：不可收贖價讓他在大祭司未死以先回本地。


    **原文把大祭司的身分講得很完整。** STEP 原文資料顯示民35:25 末尾是 ''ad- mOt ha./ko.Hen ha./ga.Dol ''a.Sher-
    ma.Shach ''o.T/o be./She.men ha./Ko.desh（H4194 死亡、H3548 祭司、H1419A 大、H4886 膏抹、H8081
    油、H6944G 聖），字面是：直到那用聖別的油被膏的大祭司死。CT 註「受聖膏的大祭司」指大祭司在上任供職時須先受膏（參出四十15）。


    **關鍵不是流放的時間，是那個死。** GT《舊約聖經背景註釋》講得最清楚：「解除誤殺人者之罪的，不是這人在逃城流放的日子（見：書二十2～6）。任何人被殺都會構成流人血的罪，惟有另一人的死亡，才能把它消除。」它並指出這使大祭司的職分延續到最後一刻——大祭司「就在死時，依然在祭儀上服事百姓，消除流人之血所構成的罪咎」。GT《聖經精讀本》說法一致：根據流人血的只有通過血才能得到赦免的原則，大祭司的死「被視為是代替躲在逃城之人流血」。


    **流放期間他並不是沒有損失。** GT 丁良才《民數記註釋》列出誤殺者住在逃城裡不能做的三件事：住在自己的家裡、耕種自己的田地、經理自己的事務——「顯明誤殺的仍要受罰」。


    **四套註釋都把這一段讀成指向基督。**


    | 來源 | 說法 |

    |---|---|

    | CT | 「大祭司之死乃預表基督救贖之死」；大祭司一天不死，罪案就一天沒有了結 |

    | GT 丁良才 | 大祭司受聖膏是預表基督，所以他的死預表基督的死，有兩種功效：「1使罪惡得塗抹；2使罪人被釋放」 |

    | GT《聖經精讀本》 | 「這預表著我們因著耶穌基督的代死而得救(約1:29;啟1:18)」 |

    | BibleHub Study | 大祭司的死象徵一個新的開始，並預表那位終極的大祭司基督（來9:11-14） |


    **KingComments 特別指出這一條只出現在民數記。** 他說大祭司之死在圖像上代表主耶穌現今這一段大祭司職任的結束——現今的大祭司職任是在天上、能體恤我們的軟弱（來4:15），而它同時也是以色列仍被撇下的一個見證；等到主把教會接走，他就要照麥基洗德的等次向以色列顯現，使他的百姓重新得回產業。CT
    從另一面看同一件事：「大祭司一代過一代的死了，唯有我們的主長遠活著」。


    CT 並在民35:28 指出釋放的兩層內容：不但不再被定罪，而且「可以回到他所得為業之地」——失去的產業也一併還回來。'
