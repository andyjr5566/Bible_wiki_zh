- title: 預備往逃城的道路
  path: link_folder/主題/預備往逃城的道路.md
  definition: '申命記第十九章第3節在「分定三座城」之外，另外交代了一件事：「又要預備道路，使誤殺人的，都可以逃到那裡去。」逃城設得再好，路不通也沒有用。


    ### 經文自己給的兩項要求


    第一項是分區。STEP 顯示「分為三段」是 ve./shi.lash.Ta（H8027，簡要詞典義 sha.lash: to do three）。GT《聖經精讀本》解釋這個動作：指將迦南地平均分為三個區域，在每個區域的中心部設立逃城，為的是使逃亡者無論身處何方都不為報血仇者所追趕上，而得以逃到距離最近的逃城。GT《啟導本聖經申命記註釋》說得更短：將迦南地分為三區，每區設一逃城。


    第二項是修路。STEP 顯示「預備道路」是 ta.Khin（H3559K，簡要詞典義 kun: to establish）加 ha./de.reKh（H1870K，de.rekh:
    way: road）。CT 說『預備道路』即指引往逃城的道路；GT《申命記雷氏研讀本》註「道路」。引往逃城的路；GT《申命記串珠聖經註釋》說明用意：逃城位置要適中，方便區內各鎮的人進入逃城，避免因路程太遠而產生問題。


    ### 為什麼距離是關鍵


    理由寫在第6節：報血仇的心中火熱追趕他，「因路遠就追上」。STEP 顯示這裡的「路遠」是 yir.Beh ha./De.rekh（H7235A 加 H1870L）——同一個「道路」在第3節與第6節分屬兩個不同的延伸編號，第3節是修出來的那條路，第6節是他實際要跑的那段距離。BH
    也把重點放在同一處：這些城要分布得使人可及，路要維持得使求庇護的人能盡快抵達。


    ### 猶太傳統記下的規格


    三份來源各自記了一些細節，內容互相吻合。


    GT《聖經精讀本》說據猶太人的傳承，道寬當約14米左右，路邊則立一個用大字寫「逃城」的標誌牌。


    CT 記的版本更細：根據猶太傳統，一般大路的標準寬度是16肘，但通往逃城的道路必須寬兩倍，並要修直、修平，在每個岔路口重複標上「逃城，逃城」；他並註明出處是《他勒目
    Talmud》Bava Batra 100b 與《密西拿 Mishnah》Sefer HaChinukh 520:1。


    KC 記的是維護制度：非聖經史料提到，每年檢查通往逃城之路是本屬議會的職責——破損的路要修好，障礙要清除，河上不能沒有橋，路不可太窄，岔路口要用寫著「逃城，逃城」的牌子指出方向。他並認為以賽亞書40:3-4
    那段修直大道的話，正是借用了這套修路的規矩。


    ### 各家從這一條讀出來的意思


    CT 的話中之光把它讀成救恩的可及性：神在距離不遠的地方設立逃城，並且預備道路，使誤殺人的都可以逃到那裡，可以很快就得著庇護。他另記下一項猶太傳統的算法——兩個「逃城」的希伯來字母數值合計是
    179 加 179 等於 358，與「彌賽亞」的希伯來字母數值相同，他由此說逃城正預表彌賽亞基督的救恩。


    BH 注意到經文說的是為你自己預備：這個說法點出責任是集體的，維持公義需要全體行動。KC 把這一點翻到今天，說如果通往避難所的路被障礙塞滿，而人們不但不清除、反而添加更多障礙，需要逃的人就進不來。'
