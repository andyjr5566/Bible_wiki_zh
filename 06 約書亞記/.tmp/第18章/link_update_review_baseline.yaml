- title: 趕出（ya.rash）
  path: link_folder/原文/趕出（ya.rash）.md
  definition: '書13 有四處經文，和合本分別譯作「未得」「趕出」「趕逐」三種說法，STEP 原文資料顯示用的是同一個動詞 ya.rash（H3423H，簡要詞典義
    to possess: take）：


    | 經文 | 和合本 | STEP 字形 | 形態碼 | 本節逐字譯義 |

    |---|---|---|---|---|

    | 書13:1 | 還有許多「未得」之地 | le./rish.Ta/h | HR/Vqcc/Sp3fs | to/ take possession of/
    it |

    | 書13:6 | 我必在以色列人面前「趕出」他們去 | ''o.ri.She/m | HVhi1cs/Sp3mp | I will dispossess/
    them |

    | 書13:12 | 這些地的人都是摩西所擊殺、所「趕逐」的 | va/i.yo.ri.She/m | Hc/Vhw3ms/Sp3mp | and/ he
    had dispossessed/ them |

    | 書13:13 | 以色列人卻沒有「趕逐」基述人、瑪迦人 | ho.Ri.shu | HVhp3cp | they dispossessed |


