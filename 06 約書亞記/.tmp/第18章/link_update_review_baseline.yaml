    華爾頓《約書亞記背景注釋》說它大概是耶利哥東南三哩、克珥特幹河北岸的加拉貝泉（''Ain el~Gharabeh），並說曠野六城中有把握知道其位置的只有伯亞拉巴和隱基底；GT《約書亞記研經資料》的說法相同（寫作耶利哥東南5公里）。


    **它屬誰。** GT《串珠聖經注釋》說伯曷拉和伯亞拉巴是猶大與便雅憫邊界上的小鎮，後來列入便雅憫境（參書18:19、21-22），顯示支派間在分地上互有調整。BH
    說它在荒涼的約但河谷一帶，屬於猶大與便雅憫之間的邊界地帶（書15:6、書18:18），環境嚴酷，卻仍在神有秩序分配的產業之內。'
