- title: 亞他綠亞達
  path: link_folder/地點/亞他綠亞達.md
  definition: '書16:5 以法蓮地業的東界「是亞他綠亞達到上伯和崙」；書18:13 便雅憫的北界同樣「下到亞他綠亞達，靠近下伯和崙南邊的山」。這是以法蓮與便雅憫交界上的一個點。


    **書16:2 的「亞他綠」就是這裡。** 書16:2 約瑟子孫的南界「接連到亞基人的境界，至亞他綠」。GT《約書亞記研經資料》說這個亞他綠「在下文 16：5
    與 18：13 又被稱為『亞他綠‧亞達』」。CT 說書16:2 的亞他綠位於耶路撒冷北方約12公里、伯特利南方約4公里，「其實際位置與亞他綠亞達相同」，所以有人認為亞基人的境界、亞他綠、亞他綠亞達三者同指一地，合稱亞基亞他綠（Archiataroth）或亞他綠亞達（Atarothaddar）。GT《串珠聖經注釋》說這個亞他綠在耶路撒冷以北十三公里，並且特別說明它與書16:7
    的亞他綠不同。


    **名字。** CT 給「亞他綠」的字義是「王冠」，GT《研經資料》給「亞他綠亞達」的字義是「榮耀之冠」；BH 說 Ataroth-addar 的意思是「crowns
    of Addar」（亞達的冠冕），位置靠近便雅憫的邊界。STEP 對這兩處標了不同的 Strong 編號：書16:2 是 a.ta.Rot（H5852H），書16:5
    是 at.Rot ''a.Dar（H5853，簡要詞典義 Ataroth-addar）。


    **別處的同名地。** GT《研經資料》說它和民32:3 的「亞大錄」是同一個原文字，但地點不同，這裡指約但河西。民32:3 的亞大錄是迦得、流便向摩西求取的河東之地裡的城；BH
    在參照經文裡也列了民32:34-35 迦得人建造的亞他錄。'
