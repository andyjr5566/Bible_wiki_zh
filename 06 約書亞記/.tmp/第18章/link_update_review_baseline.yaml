- title: 欣嫩子谷
  path: link_folder/地點/欣嫩子谷.md
  definition: '書15:8 猶大的北界「上到欣嫩子谷，貼近耶布斯的南界（耶布斯就是耶路撒冷）；又上到欣嫩谷西邊的山頂」。這條山谷標出猶大的地界從耶路撒冷城南邊繞過去。


