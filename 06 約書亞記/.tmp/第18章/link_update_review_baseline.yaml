- title: 伯亞文
  path: link_folder/地點/伯亞文.md
  definition: '書7:2 說約書亞打發人「往伯特利東邊、靠近伯亞文的艾城去」。伯亞文在這一節只是個定位用的地標，卻是四套註釋都停下來解釋的名字，因為它的意思和它旁邊的「伯特利」正好相反。


    ### 名字的意思


    伯特利是「神的家」，伯亞文則被各家譯成一串意思相近的說法：CT 給的原文字義是「虛華之家，罪孽之家」；GT《啟導本聖經約書亞記註釋》說「伯亞文」義為「罪惡居所」；GT《串珠聖經注釋》說意即「虛空之屋」；GT《約書亞記研經資料》說字義是「邪惡之家」。KC
    也說 Ai 就在伯亞文那裡，而伯亞文的意思是 “house of evil”。


    ### 它在哪裡


    CT 說伯亞文位於伯特利東面、在曠野的邊緣。位置至今沒有定論——GT《研經資料》說這城的地址目前未有確切的考證，瑪爾揚遺址（Tell Maryam）是經常被提出的可能地點，但考古學家至今仍未在此挖掘，只有初步勘測到鐵器時代的文物；GT《華爾頓約書亞記背景注釋》給的說明一樣，並補上一個判斷的線索：經文提及這城時的語氣顯示它比艾城著名。


    ### 它是不是伯特利的別名


    後來的先知書用「伯亞文」稱呼伯特利。GT《串珠》說日後先知也以此稱呼伯特利，並引何4:15、何10:5、摩5:5；GT《研經資料》說另有學者認為何西阿以「伯亞文」為伯特利的別名（何4:15；何5:8；何10:5），也說它有可能是指伯特利或附近的邱壇（撒上13:5）；GT《華爾頓》同樣說有人相信何西阿以伯亞文為伯特利的別名。書7:2
    本身把伯特利與伯亞文並列為兩個不同的地標，所以這裡先按兩地處理，別名之說留給先知書的用法。'
