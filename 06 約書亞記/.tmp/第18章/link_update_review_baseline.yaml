- title: 基非拉
  path: link_folder/地點/基非拉.md
  definition: '基非拉是基遍聯盟四座城之一。書9:17 說以色列人起行、第三天到了他們的城邑，「就是基遍、基非拉、比錄、基列耶琳」。


    CT 的原文字義給「基非拉」雌獅，並說以基遍為中心，其他都在方圓十公里以內的衛星城市。GT《約書亞記研經資料》給的字義相同，位置說在基遍西南西方8公里；GT《串珠聖經注釋》說基非拉在基遍以西約八公里（五英里）；GT《丁道爾聖經注釋》把它定在
    Khirbet il~Kefireh，在基遍西南西方5哩，並說這些遺址都在便雅憫境內。


    族屬與歸屬有明確記載。GT《聖經精讀本──約書亞記註解》說基非拉是希未族的城，分配給了便雅憫子孫。BH 說基非拉、比錄與基列耶琳屬於基遍周邊的領土，這四座希未城都在耶路撒冷西北的山地。


    它在本章的功能是證據：以色列人走三天就到得了，這件事本身就拆穿了「我們是從遠方來的」（書9:6）。'
