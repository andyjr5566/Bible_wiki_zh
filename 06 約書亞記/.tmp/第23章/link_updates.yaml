- title: 網羅
  path: link_folder/原文/網羅.md
  summary: '第13節「他們卻要成為你們的網羅、機檻」。STEP 為 le./Fach（H6341A，pach: snare）與 u./le./mo.Kesh（H4170，mo.qesh: snare）；CT 說「網羅」陷阱、「機檻」誘餌，指誘捕器；GT《聖經精讀本》說這警告根據出23:33、民33:55、申7:16 的律法，網羅與機檻是為強調同樣含意的重複手法；GT《研經資料》說「機檻」在摩3:5 指捕抓雀鳥的機器，兩個詞表示以色列會落入偶像崇拜的陷阱；KC 說網羅使人跌倒，機檻使人動彈不得。'
  relation: 出23、申7 說迦南人的神會成為網羅，本章約書亞說剩下的國民自己會成為網羅。
