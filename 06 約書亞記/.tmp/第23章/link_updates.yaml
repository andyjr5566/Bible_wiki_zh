- title: 進入約中（a.var）
  path: link_folder/原文/進入約中（a.var）.md
  summary: '第16節「你們若違背耶和華─你們神吩咐你們所守的約」。STEP 為 Be./''a.ve.re./khem（H5674D，a.var: to pass: trespass）be.Rit（H1285，be.rit: covenant）；GT《研經資料》說 SH 5674 有經過、穿越、違犯、廢除等意思，正好也是約書亞記提到他們怎樣過約旦河所使用的動詞；GT《丁道爾》說約書亞記頭幾章的鑰字講到全國怎樣過到應許之地來，如今同一個動詞警告以色列不要違背神的約；CT 給「違背」的字義是疏離、廢除。'
