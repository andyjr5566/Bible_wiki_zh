- title: 眼中的刺與肋下的荊棘
  path: link_folder/原文/眼中的刺與肋下的荊棘.md
  summary: '第13節「肋上的鞭、眼中的刺」。STEP 為 u./le./sho.Tet（H7850，sho.tet: scourge）be./tzi.dei./Khem（H6654，side）ve./li/tz.ni.Nim（H6796，tsa.nin: thorn）be./''ei.nei./Khem（H5869A）；民33:55 的「肋下的荊棘」也是 tsa.nin，本章用在「眼中的刺」；GT《綜合解讀》說是重申摩西的警告（民33:55；申7:16）；GT《聖經精讀本》說「肋上的鞭」意指將要落到用鞭子受治理的悲慘地步（王上12:11），「眼中的刺」比喻將因仇敵大受痛苦，士2:3 重複了這兩句話；GT《研經資料》說「肋上的鞭」有學者認為是奴隸販子的鞭子，「眼中的刺」可以導致失明；KC 說它會殘酷地使人瞎眼，再也看不見神的福分。'
  relation: 民33:55 摩西說留下的居民會作眼中的刺、肋下的荊棘；本章約書亞說的是肋上的鞭、眼中的刺，用字與民33:55 不完全相同。
