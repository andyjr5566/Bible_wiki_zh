- title: 申命記7_3-4 禁止與迦南人通婚
  path: link_folder/互文/申命記7_3-4 禁止與迦南人通婚.md
  summary: '第12節「彼此結親，互相往來」。STEP 為 ve./hit.cha.tan.Tem（H2859B，cha.tan: be related）；GT《研經資料》說第7節的「攙雜」更可能是指申7:3-4 所記與他們通婚，第12節原文可能是「藉著彼此聯姻進入他們中間」；GT《聖經精讀本》說禁止聯姻是為了防止藉著通婚而興起的偶像崇拜；GT《綜合解讀》說只有不愛神的人才會與不信者攙雜通婚；BH 說所羅門娶外邦女子是這警告的悲劇性應驗（王上11:1-4）。'
  relation: 申7:3-4 禁止與迦南人結親，本章約書亞臨終重申這條禁令。
