- title: 美地
  path: link_folder/主題/美地.md
  summary: 第13、15、16節三次說「耶和華─你們神所賜的這美地」。STEP 第13、15節為 H127G（a.da.mah）加 H2896A（tov），第16節為 H776G（e.rets）加 H2896A；GT《綜合解讀》說約書亞三次強調悖逆違約的結果是在這美地上滅亡；BH 說這地是神慷慨的賞賜，聖經處處說它美好多產，但百姓享受它要靠順服。
