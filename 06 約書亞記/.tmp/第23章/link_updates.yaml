- title: 神的應許應驗
  path: link_folder/神學/神的應許應驗.md
  summary: '第14-15節「耶和華─你們神所應許賜福與你們的話沒有一句落空，都應驗在你們身上了」「所應許的一切福氣怎樣臨到你們身上，耶和華也必照樣使各樣禍患臨到你們身上」。STEP「落空」是 na.Fal（H5307L，to fall: fail），兩次；第15節「福氣」是 ha./da.Var ha./Tov（H1697I＋H2896A），「禍患」是 ha./da.Var ha./Ra''（H1697I＋H7451H）；CT 說一切福氣原文是好的話語，各樣禍患是壞的話語；CT 與 GT《綜合解讀》說賜福根據神的應許（申28:1-14），降禍根據祂的咒詛（申28:15-68），兩樣都必沒有一句落空；KC 說已經應驗的應許是尚待應驗之應許的保證；BH 連到書21:45、王上8:56。'
  relation: 書21:45 說應許賜福的話一句也沒有落空，本章約書亞重述這句話，又說警告的話也同樣會應驗。
