  summary: 第11節「你們要分外謹慎，愛耶和華─你們的神」。GT《研經資料》說「分外謹慎」是「極其謹守你們的心」，對神用「愛」這個字舊約不常見，主要出現在申命記，此處的確是用 SH 157；CT 說愛神才不會去追求神以外的一切人事物；KC 說愛帶出遵守神的誡命（約壹5:3）；BH 連到申6:5。
  relation: 書22:5 約書亞要河東的人愛耶和華，本章他對全體首領再說一次。
