- title: 膽壯與大能同一字根（cha.zaq）
  path: link_folder/原文/膽壯與大能同一字根（cha.zaq）.md
  definition: '申11 有兩個地方用到同一個希伯來字根，中文一個譯成神的屬性，一個譯成人的狀態。


    第2節說兒女沒有看見耶和華的「大能的手」，STEP 顯示那是 יָדוֹ הַחֲזָקָה（ya.D/o ha./cha.za.Kah，H3027H 加
    H2389，cha.zaq 簡要詞典義 strong）。第8節說守誡命的目的之一是「使你們膽壯」，STEP 顯示那是 תֶּחֶזְקוּ（te.chez.Ku，H2388G，cha.zaq
    簡要詞典義 to strengthen: strengthen）。==同一個字根，一次形容神的手，一次形容人的膽量。==


    CT 的〔原文字義〕在兩處分別給了中文：第2節「大能」是強壯，堅固；第8節「膽壯」是堅定、奮勇。它在第2節說大能的手重在指克服難處和敵人，在第8節說膽壯意指剛強勇敢、一往直前。


    **本章把兩者接成因果。** 第8節開頭是「所以」，CT 直接點出這個結構：3 至7 節所述的乃是「因」，下面所述的乃是「果」。也就是說，人之所以能夠膽壯，來源是前面幾節所回顧的那隻手。KC
    講的是同一個方向：守住神的話會給人屬靈的力量，讓人有能力去承受那地。


    BH 在第8節補上一層界定：這裡的力量不只是體力，也包括屬靈與道德上的力量；聖經處境裡的力量通常指倚靠神的能力而不是人自己的本事，並舉賽40:31 為例。'
