- title: 大海（地中海）
  path: link_folder/地點/大海（地中海）.md
  definition: '民數記34:6 只用一句話定完西界：「西邊要以大海為界；這就是你們的西界。」民34:7 的北界又從大海起算。


    **大海就是地中海。** CT 與 GT 丁良才都直接註明這一點；GT《民數記串珠聖經註釋》說「迦南地西面以地中海沿岸為邊界」。


    **原文的「西」就是「海」。** STEP 顯示民34:6 出現三次相關的詞：「西邊」與句末的「西界」都是 Yam（H3220H，簡要詞典義 sea: west），中間的「大海」則是
    hai./Yam ha./ga.Dol（H3220G 加 H1419J，簡要詞典義 Great (Sea)）。也就是說，希伯來文用同一個字既指海，也指西方——迦南人的西邊本來就只有海。


    **它是四界裡最省事的一段。** 南界用了三節、北界三節、東界三節，西界只有一節。GT《舊約聖經背景註釋》的判斷是：「最明顯的界線是東界和西界──約但河和地中海。」


    **BH 補的是它的功能。** 地中海是古代近東的貿易與文化交流命脈，把它劃為西界既給了以色列天然的防線，也給了通向列國的出口；BH 並引王上10:22 所羅門的船隊為例。


    KingComments 讀的是另一面：聖經裡的海通常是萬民之海的圖畫，是以色列之外、神之外的世界；住在這條界線之內，意思是在主的力量裡勝過每一次試煉與難處。'
  development: '大海在摩西五經裡是國界，到約書亞記成了各支派的界。民34:6 西界只用一句話：「西邊要以大海為界」，STEP 顯示句中的「西邊」與「西界」都是
    Yam，也就是「海」；申11:24 改叫「西海」，書1:4 又叫「大海日落之處」，三處指的是同一片水。


    書9:1「沿大海一帶的諸王」用它標出迦南諸王分佈的西端。到了分地的幾章，它一個支派一個支派地出現：書15 是猶大的西界，書16 是約瑟子孫與以法蓮地界的西端，書17
