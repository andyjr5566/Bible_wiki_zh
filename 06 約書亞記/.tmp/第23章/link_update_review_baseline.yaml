- title: 約書亞
  path: link_folder/人物/約書亞.md
  definition: 約書亞，原名何西阿（民十三16），是嫩的兒子，隸屬以法蓮支派。約書亞在出埃及記第17章首次出現——摩西命他選出人來與亞瑪力人爭戰（v9），他照辦並用刀殺害亞瑪力王及其百姓（v13）。約書亞為摩西長期的幫手與未來的繼任領袖，日後帶領以色列人進入迦南地。KC
    等釋經學者指出，「約書亞」為希伯來名字，字義為「耶和華是拯救」或「拯救」，在希臘文中與「耶穌」相通；在表徵與預表神學上，約書亞象徵在屬靈引導下戰勝肉體阻礙並進入應許安息的歷程。
  development: '約書亞在出24:13作為摩西的助手隨摩西上神的山，出33:11記載他不離開會幕。丁良才指出他「同十一個探子窺探了迦南；唯獨他和迦勒忠心報告」（民14:1-9），「神後來也揀選他做以色列人的首領」（民27:18-23）；GT《啟導本聖經腳註》補上結局：「摩西死前將領導以色列人進迦南地的責任交給了約書亞」（書1:1-2）。GT《中文聖經註釋》指出摩西曾按手在他頭上（申34:9），「要藉他領以色列人進入迦南」（申1:38）。GT《聖經精讀本》對他在本章的形象下了判斷：從摩西把選兵與戰爭全權交給他一事可知，「他是一位具有誠實的信仰，而且是英勇無比的出色的領袖」。


    ### 從接棒的人，到自己俯伏的人


    這條線在約書亞記前四章走到高點：書3:7 神應許要使他在以色列眾人眼前尊大，書4:14 說這事成了，百姓敬畏他像從前敬畏摩西一樣。到書5:13-15，方向忽然反轉——他靠近耶利哥，遇見一個手裡拿著拔出來的刀的人，問對方站哪一邊，得到的回答是「不是的」。接著俯伏在地下拜的，是那位剛被神高舉的領袖；他自稱的身分是「僕人」。


    書5 給他的兩個動作也可以並排來看。第2至3節他親手製造火石刀、給全國行割禮，那是把百姓交回立約關係裡；第14節他俯伏下拜、問「我主有什麼話吩咐僕人」，那是把自己交回神的權下。GT《約書亞記雷氏研讀本》讀出的正是這一點：約書亞承認這是耶和華的戰役，而以色列人只是耶和華軍隊裡的成員。


    ### 從打仗的人，到分地的人


    書6 到書12 是他帶兵的年日，各章刻畫的面向不同。書6 他沒有自己定戰術，只把神的安排傳給百姓，什麼時候不可出聲、什麼時候呼喊都由他吩咐（書6:10、16），書6:27
    的總結是「耶和華與約書亞同在」；書7 艾城之敗，他事前沒有求問神，事後撕裂衣服伏在約櫃前，KC 說他的禱告帶著一點責備；書8 神第三次對他說「起來」，CT
    說這次是要他積極進取，全章唯一停下軍事推進的事，是在以巴路山宣讀律法；書9 他被基遍人騙了，CT 與 GT 幾家都指出他沒有求問神，但最後救基遍人脫離以色列人之手的也是他；書10
    他守約出兵、當眾禱告求日月停住；書11:15 經文給他的總評是「凡耶和華所吩咐摩西的，約書亞沒有一件懈怠不行的」；書12 只記總數，河西三十一王。


    書13:1「約書亞年紀老邁」，神把他的任務從征服轉到分地。CT 與 GT《綜合解讀》說留下未得之地不是因為他老了，KC 卻反問他是否也沉進了安歇。書14 他和以利亞撒主持分地，第一個來求地的是當年和他同去窺探的迦勒；書17
    他把產業照摩西的吩咐分給西羅非哈的女兒，又拒絕多給同族的約瑟子孫地，GT《綜合解讀》與 BH 都說他雖屬以法蓮，卻沒有偏袒；書18 他把會幕遷到示羅，責備七個支派「耽延不去得，要到幾時呢」，派人勘地，在耶和華面前拈鬮。KC
    在這裡提醒，約書亞沒有接班人，祭司以利亞撒卻有。


    分地到書19 結束，他自己最後一個得地業。書19:49-50 以色列人分完了地，才照耶和華的吩咐把他所求的亭拿西拉城給他，他修那城、住在其中。GT《聖經精讀本》說分地以迦勒為始（書14:6-15）、以約書亞為終，這兩人正是當年十二個探子裡僅有可以進入應許之地的兩位；CT
    說他沒有利用職務的便利以權謀私；KC 說他出於謙虛，等到眾人都得了，並把這一點讀成主耶穌的圖畫。從書1 接棒到書19 得地，他一直是替別人取地、替別人分地的人，最後才輪到自己（見[[約書亞最後分得地業]]）。'
