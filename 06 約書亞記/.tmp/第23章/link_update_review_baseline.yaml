- title: 神的應許應驗
  path: link_folder/神學/神的應許應驗.md
  definition: 創世記33章多處見證神對雅各應許的實現：創28:15「我必保佑你，領你歸回這地」——雅各平安回到迦南示劍（18節「平平安安」）；創28:13-15賜地、後裔如塵沙、萬族因他得福——雅各擁有完整家庭（四妻十二子女）、買地立業、築壇敬拜；創31:3「你要回你祖、你父之地，到你親族那裡去，我必與你同在」——雅各離開拉班、過雅博、見以掃和好、進迦南全程蒙保守。雅各自承「神恩待我，使我充足」（11節），見證神賜福能力（申8:18）。
  development: '### 本章應驗了哪一句


    創33:18：「雅各從巴旦亞蘭回來的時候，平平安安地到了迦南地的示劍城，在城東支搭帳棚」。


    CT 指出「平平安安」原文與『撒冷』或『沙龍』（Salem）同字。GT 丁良才《創世紀註釋》直接把它接回應許，在「平平安安」下註明參創28:15。創二八15
    是雅各在伯特利所領受的話：「我也與你同在。你無論往哪裡去，我必保佑你，領你歸回這地」


    二十年後的第18節，就是那句話的兌現句。


    ### 應許裡的另外兩項


    GT 丁良才在第20節列出雅各稱神為自己的神的四個理由，其中三項都是應許的兌現：「（一）賜恩悅納他；（二）給他改名；（三）使他回迦南；（四）使他承受神的應許。」


    第三項是本章的事，第二項是上一章的事（創三二28），第一項在本章第4節（以掃的擁抱）。四項合起來看，雅各在第20節築壇，是在為一組已經到手的應許還願。


    ### 未兌現的那一半


    丁良才在同一段緊接著補了一句：「雅各雖然承認神的恩典，卻沒有還了所許的願」（創28:18-22）。


    創二八20-22 雅各許的願是：神若與他同在、保守他、給他食物衣服、使他平平安安回到父家，「我就必以耶和華為我的神。我所立為柱子的石頭也必作神的殿」。第18節「平平安安」四個字，正是那個條件句的達成；但雅各沒有回伯特利那根柱子那裡，他在示劍另築了一座壇。


    GT《聖經精讀本──創世記註解》說得最重：雅各不該忘記自己在伯特利許下的諾言，應該馬上回到伯特利為神築壇，「但他卻沒有這麼做」。CT 的判語相同：神並未說祂是「疏割的神」，而說祂是「伯特利的神」（創三一13）。


    ### 因此本章是半個應驗


    應許的部分神已經全數做到（平安、歸回、改名、以掃的和解）；許願的部分雅各只做了一半（他築了壇，卻不在伯特利）。


    KC 把這個落差說得最刺：他在此築的壇說的是雅各多過說神——他還不是單單以神為念，而是以「以色列的神」為念；KC 又說，我們也很會用敬虔的話語來掩飾自己錯誤的道路。


    要並陳的另一面在 CT：築壇這件事本身是「實踐他的諾言，『以耶和華為我的神』」（創28:21），並使他「更認識神，也更認識自己」。同一個祭壇，一家讀成還願，一家讀成掩飾（見[[示劍築壇意義：紀念神還是佔領地土]]）。


    ### 一條要留到創三五的線


    創35:1 神再對雅各說：「起來！上伯特利去，住在那裡；要在那裡築一座壇給神，就是你逃避你哥哥以掃的時候向你顯現的那位。」GT 丁良才在第18節就先指出這條線：「雅各沒有聽從神的吩咐」（創31:13），「因而受到三十四章裡所記的苦害；後來因神又有吩咐，他才回到伯特利」（創35:1）。


    本章的應驗因此是真的，只是不完整——完整的還願要再等兩章。


    - 神的應許不落空、雖延遲必成就

    - 應許應驗常超越人為計謀（雅各分隊、禮物、謙稱皆非關鍵）

    - 「平平安安」（Shalom）作為約福總和的體現


    ### 約書亞記：一句也沒有落空


    雅各在創33、35 經歷的是個人的應許一件一件應驗；書21:43-45 寫的是全族的應許。「耶和華將從前向他們列祖起誓所應許的全地賜給以色列人」，「耶和華應許賜福給以色列家的話一句也沒有落空，都應驗了」。STEP
    顯示「落空」是 na.Fal（H5307L，to fall: fail），「應驗」是 Ba''（H935G，to come）。CT 說這不僅是全般概略地應驗，每一細節也都照著神所說的話正確地應驗；KC
    說這些美好的應許是從創12:7 神對亞伯拉罕說「我要把這地賜給你的後裔」開始的。


    這一次的應驗也不是沒有缺口。CT、GT《約書亞記雷氏研讀本》與《啟導本》都說，以色列人雖還沒有完全征服迦南，神早已告訴他們要漸漸佔據（申7:22）。GT《約書亞記綜合解讀》把第45節和利未人連在一起：神就是利未人的產業，利未人得著居所，以色列人才得了神全部的祝福。'
  signals: []
  accumulation_count:
  - 3
  - 4
- title: 進入約中（a.var）
  path: link_folder/原文/進入約中（a.var）.md
  definition: '申命記第二十九章12節，和合本作「為要你順從耶和華─你神今日與你所立的約」。


    原文的動作不是順從，是走進去。STEP 顯示這裡是 le./''a.ve.re./Kha（H5674A，簡要詞典義 a.var: to pass）bi/v.Rit（H1285，簡要詞典義
    be.rit: covenant），字面是為要你走進他的約裡。CT 在話中之光直接把這件事點出來：「為要你順從」原文是「為要你進入」。


    ### 走進哪裡


    CT 的原文字義給「順從」的是逾越、通過，並解釋這個字指通過劈開的祭物當中，表示誓約的成立（參創十五17）。


    GT《聖經精讀本──申命記註解》把這個習俗說得更完整：「順從」具有「進入」或「通過」的意思，此詞源於在古代社會，立約的雙方作為約的擔保，將牲畜劈成兩半，兩個人一起從被劈開的牲畜之間走過的習慣。它並在第25節下面解釋這個習俗背後的意思——立約當事人為了履行契約義務、防止違約，為象徵若違約必像這犧牲祭物一樣免不了一死，而將牲畜劈成兩半之後一半對著一半地擺列，並走過那中間莊嚴地起誓。


    同一段也說明了為什麼「誓」與「約」在本章反覆並列（第12、14節）：「誓」與「約」的用法幾乎相同，這是因為約常伴著誓。STEP 顯示第12節的誓是 u./ve./''a.la.T/o（H423，簡要詞典義
    a.lah: oath），而第20節那句「將這書上所寫的一切咒詛都加在他身上」用的正是同一個 H423——同一個字，一次是人走進去的誓，一次是壓在背約者身上的誓。


    ### 進去才有份


    CT 在話中之光把這個動作的分量說清楚：雖然神的應許是白白的恩典，但人若不肯「進入」神與人所立的約，就沒有條件承受這應許。BH 讀這一節時說，這場聚集的目的就是進入與神所立的約，而「今日」兩個字強調的是這件事此刻就要做。'
