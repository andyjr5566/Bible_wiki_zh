- title: 審判官
  path: link_folder/原文/審判官.md
  definition: '出埃及記二十一6「他的主人就要帶他到審判官（或作：神；下同）那裡」。STEP 語言證據顯示，原文使用的詞是 הָאֱלֹהִים（ha-Elohim，H430），字面就是「神」；和合本在正文譯為「審判官」，並在小字保留「或作：神」的直譯。CT
    的原文字義列出「審判官，統治者，神」，文意註解也給出兩種理解：「（1）指神，到神面前發願立誓，永不反悔；（2）指公證人，證明雙方今後的身份關係乃出於甘心樂意，不再改變」；各家註釋進一步討論此處指聖所裁判或神所設立的審判官。


    各家在這裡明顯分歧。GT《中文聖經註釋》主張原文本來就是神：「原文的審判官是神。而這神的原文伊羅興，亦可繙成為其他的神（gods）。因此，原意是帶他到神壇那裏去起誓」。GT《丁道爾聖經註釋》說得更直接：「帶他到神那裡，即帶他到聖所（將『神』譯作『審判官』是解經，不是譯經；和合本作『審判官』）。」GT
    丁良才則走另一條路，認為譯作審判官並無不妥，因為「審判官代表神判斷是非（二十二8-9）」、「審判官是神的代表（參詩八十二1、6，約十34的神字）」。BH 也採人間法庭的讀法，指這裡的「審判官」是受委任的領袖或長老，負責在群體中維持公義與秩序，而他們是神律法的代表。'
  development: '「審判官」與「神」在原文是同一個字，這使以色列的審判制度在語言層面就帶著代表性：判斷是非的權柄不是人自有的，而是受託的。GT 丁良才把二十二8-9
    與本節並讀，正是循這條線索。


    ### 從按人數分層到按城設立


    出十八25 記摩西在曠野照葉忒羅的建議設立審判官，分法是按人數——千夫長、百夫長、五十夫長、十夫長；申1:15 記的是同一件事。那時全民住在一個營裡，分層就夠了。


    申命記十六18 換了分法：「你要在耶和華─你神所賜的各城裡，按著各支派設立審判官和官長。」不再按人數分層，改按地點設立。KC 點出這個轉換的原因與後果：在曠野時審判官是按人數設立的，這裡則連於他們將要散居的各城；他並指摩西在這裡規定的是下級法庭怎麼設立——不是每一件事都要送到最高的那一級。


    GT《啟導本聖經申命記註釋》把這一節放進更大的架構裡：本節至十八22 是有關以色列人行政體制設立的規定，包括審判官、王、祭司及先知。


    ==定居改變了司法的形狀。== 一個營可以靠分層管理，許多座城只能靠在每一座城裡都設一個。


    申命記十六章第18節命令在各城設立審判官與官長，申命記十七章補上這套制度的頂端。第9節說難斷的案子要上到耶和華所選擇的地方，去見祭司利未人與當時的審判官；STEP
    顯示十七章兩次的審判官都是 ha./sho.Fet（H8199），與十六章同一個字。


    值得注意的是這一次審判官不是單獨出現。GT《申命記串珠聖經註釋》說在神治的體制裡，祭司與審判官同是神的代表；祭司的責任是教導律法，審判官則是律法的執行者。地方的審判官各自坐在自己的城門口，中央這一組則是祭司與審判官並列。


    ### 申19 給審判官加了一個動詞


    申16:18 要求按城設立審判官，申17:8-13 讓他們與祭司一起組成終審，申19:17-18 則寫出他們實際要做的動作：兩造站在耶和華面前、在祭司與審判官面前，「審判官要細細地查究」。


    STEP 顯示這個動作是 ve./da.re.Shu（H1875，簡要詞典義 da.rash: to seek）加 hei.Tev（H3190，ya.tav:
    be good）。CT 說『細細地查究』指殷勤地追查線索，辨明真偽。==審判官在這一節不是宣判者，而是查證者；判決要等查究之後才出現。==


    GT《聖經精讀本》另指出本章這一段的層級：關於偽證罪或誣告罪的案件是由中央聖所的大法庭來審理（17:8,9）。也就是說，這不是地方城門口那一級的審判官，而是申17
    那個上訴機構。'
