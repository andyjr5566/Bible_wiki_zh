- title: 除了我以外你不可有別的神
  path: link_folder/神學/除了我以外你不可有別的神.md
  definition: 「除了我以外，你不可有別的神」（出二十3）是十誡的第一條誡命（基督教傳統條分法），確立了獨一敬拜的原則。此誡命要求以色列人（以及所有信徒）在心思意念和生活中，除了真神以外，不可有別的神——包括實存的和想像的敵對真神的一切神祇。原文「除了我以外」（`al-pa{na{y）直譯是「在我面前」或「跟我對立」，含有「敵對」或「以上」的意思，表明神不容許任何其他存在與祂競爭或分享敬拜。
  development: 第一誡排斥了多神論和泛神論思想。在所有律法之先的原因是：在人的生活中正確的神觀是最重要的，且其也將成為所有行為的標準。新約中耶穌重申此原則為最大的誡命：「你要盡心、盡性、盡意愛主你的神」（太二十二37-38）。約壹五21提醒信徒遠避偶像，顯明偶像不全是有形的（結十四1-8）。
