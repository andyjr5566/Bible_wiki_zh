- title: 眼中的刺與肋下的荊棘
  path: link_folder/原文/眼中的刺與肋下的荊棘.md
  definition: '民數記33:55 是一句警告：「倘若你們不趕出那地的居民，所容留的居民就必作你們眼中的刺，肋下的荊棘，也必在你們所住的地上擾害你們。」


    **兩個「刺」在原文不是同一個字。** STEP 顯示「眼中的刺」是 si.Kim（H7899，詞典形 sekh，簡要詞典義 thorn），「肋下的荊棘」是
    tz.ni.Nim（H6796，詞典形 tsa.nin，簡要詞典義 thorn）——兩個不同的名詞，都是陽性複數。GT《聖經精讀本》也注意到複數這件事：「『刺』的希伯來原文是複數,指很多的刺。」它並說「荊棘」源於「鋒利」「冰涼」之意，含有「許多刺」「許多鉤子」的意思。


    **兩個位置各有各的難受法。** CT 的解釋很具體：「『眼中的刺』形容令人難受；『肋下的荊棘』形容無法動彈，寢食難安；『擾害你們』形容必成為你們的仇敵。」STEP
    顯示「擾害」是 tza.ra.Ru（H6887D，詞典形 tsa.rar，簡要詞典義 to vex）。


    GT《聖經精讀本》把它推到身體感受上：如果身體最敏感的部位眼睛或軟肋上紮滿了刺，肯定會感到無比的疼痛。


    **這句警告後來應驗了。** GT 丁良才在民33:55 註：「『倘若你們不趕出那地的居民』——以色列人後來沒有趕出那些居民（書十三13十五63十六10，士一19、21、28、30-36三1-5）。」GT《啟導本聖經註釋》一句話收尾：「以色列人後來果然未能完全消滅迦南人（士1～2章）。」


    BH 指出同樣的措辭在書23:13 與士2:3 再度出現，並說這個比喻講的不只是身體上的、也是屬靈與道德上的困擾——迦南人的存在會帶來試探，最終導致背道。


    丁良才另外用了一個比方：「一個農夫冬日出行，見了一條小蛇，凍得半死，他就可憐那蛇，把蛇搋在懷裡暖著，等到蛇得了暖氣復蘇過來，卻把農夫的胸膛咬了一口（箴六27-28）。」'
