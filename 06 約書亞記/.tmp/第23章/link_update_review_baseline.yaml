- title: 安息
  path: link_folder/神學/安息.md
  definition: 神在第七日歇下創造的工作，因為工作已經完成。創世記2章2-3節使用希伯來動詞 שָׁבַת（*sha.vat*，H7673A），意思是停止、歇下；後來表示「安息日」的名詞
    *shabbat* 與這個動詞相關。註釋由第七日蒙福、被分別為聖的整體敘事，進一步發展安息日與救恩安息的神學。
  development: '### 神學意義／研讀意義


    - 神歇下的是**創造之工**，非管理宇宙的工作（約五17）

    - 安息日豫表基督的福音——惟有主耶穌十字架的工作，給人帶來真正的安息

    - 人接受主耶穌救恩 = 滿意神的工作，安息在神的安息裡

    - 千年國度時，安息日將恢復為全受造物的實際（來四9）


    ### 從安息地到四境平安


    申12:9-10 摩西說以色列人還沒有到耶和華所賜的安息地，那安息的內容是不被四圍的一切仇敵擾亂、安然居住。到書21:44，經文說「耶和華照著向他們列祖起誓所應許的一切話，使他們四境平安」，STEP
    顯示動詞是 va/i.Ya.nach（H5117，nu.ach: to rest）；GT《約書亞記綜合解讀》說這裡的「平安」原文是「安息」，定居迦南就是進入安息，但安息不是沒有仇敵，並引來4:8
    說約書亞並沒有叫他們享真正的安息。KC 在書21 排出約書亞記的三次安息：書11:23 爭戰之後，書14:15 迦勒忠心得地之後，書21:44 利未人得了城、敬拜從百姓中升起之後，最後這一次是在神的同在裡。'
  signals: []
  accumulation_count:
  - 4
