- title: 你要盡心盡性盡力愛耶和華（a.hav）
  path: link_folder/原文/你要盡心盡性盡力愛耶和華（a.hav）.md
  definition: '第5節是主耶穌口中那條「第一且是最大的誡命」的出處：「你要盡心、盡性、盡力愛耶和華─你的神。」


    **四個關鍵字的原文。** STEP 逐字資料把它們排開：


    | 和合本 | STEP 音譯 | Strong | 簡要詞典義 |

    |---|---|---|---|

    | 愛 | ve./''A.hav.ta | H157G | a.hav: to love: lover |

    | 心 | le.va.ve./Kha | H3824 | le.vav: heart |

    | 性 | naf.she./Kha | H5315G | ne.phesh: soul |

    | 力 | me.''o.De./kha | H3966 | me.od: much |


    CT 的原文字義給的中文對得上這一排：「心」內心，自我；「性」魂，本性；「力」力量，活力。


    **「力」這個字在本章出現兩次。** 第3節「人數極其增多」的「極其」，STEP 也是 H3966（me.''Od），本節譯義 exceedingly；第5節同一個字帶了人稱字尾，中文才譯成「力」。簡要詞典義
    much 正落在兩處中間——這個字本身表示的是「多」。


    **第5節的「心」和第6節的「心上」是同一個字。** STEP 顯示第6節「都要記在心上」是 le.va.Ve./kha，同樣 H3824。要人盡心去愛的那個心，就是下一節要把話放進去的地方；兩節在中文讀起來是兩件事，在原文是同一個位置。


    **三個「盡」各家怎麼講。** CT 說『盡心、盡性、盡力』意指靈、魂、體全人投入。GT《聖經精讀本》說「“心、性、力”用重複手法表現了一個人的全人格」，意思是要以知、情、意的全人格只愛神。GT《串珠聖經註釋》說得最短：「盡心，盡性，盡力」：即整個人完全投入之意；它並指出這裡的「愛」：尤指順從。


    **主耶穌引用時加了一個字。** GT《雷氏研讀本》記下「耶穌基督稱這命令為首先和最大的誡命，並在句中加上了“盡意”」（可12:30）。GT《啟導本》解釋為什麼加得上去：「“心”在希伯來人思想中是行為之本」，「也是智慧的主體」。KC
    同樣提到主加上了 mind 這一項，並說要拿這樣的愛去回應神，需要有基督的心思。


    **KC 注意到一件別家沒說的事。** 他指出，命令人去愛，這種事地上的統治者從來不會做；而在神面前，敬畏祂與愛祂是連在一起的，敬畏神就是對祂存敬重。這正好接上第2節的敬畏與第13節的敬畏。


    **BH 逐個詞解釋這份要求的份量。** 在希伯來人的想法裡，心是一個人存在的中心，含括思想、意志與情感；魂代表一個人的生命本體，因此盡性去愛指的是整個生命的投入；力則指一個人的資源、能力與努力，所以這份愛必然要帶出行動與付出。


    **「愛」是全卷申命記的主題詞。** GT《啟導本》指出本書先宣告神對祂子民的愛，然後才吩咐神的子民應該全心全意愛神，同時對本地的寄居者也要「憐愛」。GT《聖經精讀本》也說本章是摩西第二篇講章的序言，主題正是愛耶和華。'
  development: '同一條要求在申命記反覆出現，項目數卻不一樣。


    申6:5 是三項：盡心、盡性、盡力。申10:12 只有兩項——盡心盡性事奉他，STEP 顯示原文只有 be./khol le.va.ve./Kha（H3824
    心）與 u./ve./khol naf.She./kha（H5315G 性），沒有第三個。


    各家在解說申10:12 時仍然把「盡力」一併帶進來：CT 把這一項寫成盡心、盡性、盡力、盡意愛神，GT《啟導本聖經申命記註釋》也列成要盡心、盡性、盡力愛神（六5）。註釋家把申6:5
    當成這條要求的完整形式，申10:12 則是它的簡稱。


    ==申6:5 與申10:12 還有一個位置上的差別。== 申6:5 是誡命的正面總綱，前面是「以色列啊，你要聽」。申10:12 是一個問句的答案，前面是十一節的歷史回顧——先講神怎麼重立那個被毀掉的約，才問你這一邊要做什麼。第15節接著說神先愛了列祖，用的是同一個動詞
    a.hav；愛在本章因此是雙向的。


    申命記第11章把這條要求連說三次，而且分得很開：第1節「你要愛耶和華─你的神，常守他的吩咐、律例、典章、誡命」，第13節「愛耶和華─你們的神，盡心盡性事奉他」，第22節「愛耶和華─你們的神，行他的道，專靠他」。STEP
    顯示第1節是 ve./A.hav.ta，第13與22節是不定詞 le./a.ha.Vah，同屬 H157G。KC 注意到這三次剛好落在他所分三段的開頭，等於全章每一段都由「愛」起頭。


