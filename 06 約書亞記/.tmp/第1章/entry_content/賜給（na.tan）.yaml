  chapter: 1
  summary: '「賜給」貫穿全章。GT《約書亞記綜合解讀》數出動詞「賜給 נָתַן」在本章出現七次（第2、3、6、11、13、14、15節）；STEP 在這七節共標出八個字形，全部是 H5414G（簡要詞典義 na.tan: to give）。形態並不一致：第2、11、15節是分詞 no.Ten，本節譯義作 about to give；第3節是完成式 ne.ta.Ti/v 加第三人稱後綴，本節譯義是 I have given it；第6節是不定詞 la./Tet；第13節是接續式 ve./na.Tan（Hc/Vqq3ms，本節譯義 and he will give）；第14、15節說河東地是摩西 na.Tan（完成式）給兩支派半的。GT《綜合解讀》說第3節的完成式表明雖然以色列人還沒有過河，但神已經把迦南賜給了他們；GT《約書亞記研經資料》說完成式表示「已經給了(have already given)」，強調行動的確定性。CT 在第2節的話中之光讀作現在式，說「並不是神將要做的事，乃是神就在此刻要做的」。KC 說這是神的定旨，所以是確定的，剩下的問題不再是神將要給什麼、而是祂已經給了什麼。BH 說完成的形態強調神的計畫不會落空。'
  relation: '本章的命令是起來過河，而各家都注意到第3節的動詞形態：要去打的那片地，在神口中已經是給出去的。同一章第14、15節另用完成式描述河東那片摩西已經分出去的地。'
