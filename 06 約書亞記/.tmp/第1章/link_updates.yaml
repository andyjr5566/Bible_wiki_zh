- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: 第5節「我怎樣與摩西同在，也必照樣與你同在」，第9節「耶和華─你的神必與你同在」，第17節百姓說「惟願耶和華─你的神與你同在，像與摩西同在一樣」。STEP 顯示這幾處都用介系詞 'im（H5973A）加人稱後綴。CT 說神的同在是成功的保證。GT《綜合解讀》說神的「同在」是「剛強壯膽」的力量，並說約書亞並不是憑著自己的順服而得勝，而是神的同在讓他能夠順服而得勝。BH 說約書亞不需要成為另一個摩西，他需要的是那位曾扶持摩西的同一位信實的神。
  relation: 條目此前多在會幕、聖所與節期的脈絡裡累積，本章把同在放進領袖交接：神用「像與摩西一樣」作新領袖權柄的憑據，百姓也用同一句話作祝福。
