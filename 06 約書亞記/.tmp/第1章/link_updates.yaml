book: 約書亞記
chapter: 1
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。定義與主題發展裡的經文引註一律寫「書卷簡稱＋章:節」（申32:15、民35:33），不可只寫「第15節」——條目是跨書卷跨章的，裸節號無從判斷是哪一卷哪一章；逐章累積在條目裡有章號標題涵蓋，可續用「第15節」。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第1節神直接對「摩西的幫手，嫩的兒子約書亞」說話，全章的命令、發令與百姓回應都圍著他。第2節命他起來過約但河，第6、7、9節三次要他剛強壯膽，第8節要他晝夜思想律法書。第10、12節他隨即吩咐官長並對河東二支派半說話，第16至18節百姓應允聽從他，如同從前聽從摩西。GT《綜合解讀》說約書亞原來的名字是「何希阿」，被摩西改名為「約書亞」，意思是「耶和華是拯救」；GT《啟導本》說他雖已八十多歲、身經百戰，但初承偉大領袖摩西肩負的大任，面對強敵，難免膽怯。
  relation: 條目此前記的是他作助手、探子與被按立的階段，申31:23 神也已經親自囑咐過他；本章是他實際承擔全國領導的第一章，命令、發令與百姓的效忠都落在他身上。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 17
    - 18
    definition: keep
    development: keep
- title: 摩西
  path: link_folder/人物/摩西.md
  summary: 第1節「耶和華的僕人摩西死了以後」是全卷的起點；STEP 顯示本章共11次出現摩西（H4872）。第2節神說「我的僕人摩西死了」，第3、7節以摩西為應許與律法的依據，第13、14、15節以摩西為河東分地與約定的依據，第17節百姓以聽從摩西為聽從約書亞的標準。KC 說摩西的名字在約書亞記出現約六十次；照他的說法，摩西保有他的位置，但保有的方式從活著的中保換成了成文的神的話。
  relation: 條目記到申34 摩西之死為止，本章是他死後的第一章：他本人退場，他的名字卻成為新領袖權柄與百姓順服的共同依據。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 75
    - 76
    definition: keep
    development: keep
- title: 約書亞承接摩西
  path: link_folder/事件/約書亞承接摩西.md
  summary: 第1節摩西一死，神就直接對約書亞說話；第5節「我怎樣與摩西同在，也必照樣與你同在」；第17節百姓說「我們從前在一切事上怎樣聽從摩西，現在也必照樣聽從你」。GT《研經資料》說約書亞在此謙和的把領導權的根源追溯到摩西（第13至15節要兩支派半追念摩西的吩咐），而兩支派半帶頭絕對服從約書亞，也讓其他可能的競爭者很難取的比約書亞優渥的地位。BH 說百姓的順服誓言在以色列預備過河、承受神所應許之地時是必要的。
  relation: 民27 是按手立他，申31 是當眾交託，本章是實際生效：神親自發令、約書亞立即下令全營預備過河、百姓公開承認。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
    - 4
    definition: keep
    development: keep
- title: 耶和華的僕人摩西（e.ved 與 al pi）
  path: link_folder/原文/耶和華的僕人摩西（e.ved 與 al pi）.md
  summary: 第1、13、15節三次稱摩西為「耶和華的僕人」，STEP 為 'E.ved（H5650）；第2、7節神自己說「我的僕人摩西」（'av.D/i）。CT 說『耶和華的僕人』指轉達並監督遵行神命令的人。GT《聖經精讀本》說「耶和華的僕人」這個稱號曾用於亞伯拉罕、以撒、雅各、大衛與眾先知，以及全體以色列百姓。BH 說這個稱號尊崇摩西是神忠心的立約領袖、先知與代求者。同一節裡約書亞的身分則是另一個字：摩西的「幫手」me.sha.Ret（H8334）。
  relation: 申34 用這個稱號送摩西下場，本章用它作為新命令的依據：第13、15節要兩支派半追念的，正是「耶和華的僕人摩西」所吩咐的話。
  overview_review:
    signals:
    - first_in_book
    - development_blank
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:34
      - 約書亞記:1
- title: 侍立事奉（a.mad、sha.rat）
  path: link_folder/原文/侍立事奉（a.mad、sha.rat）.md
  summary: 第1節「摩西的幫手」，STEP 為 me.sha.Ret（H8334，Piel 分詞），與申10:8 利未人的「事奉」同一個字。CT 原文字義給「幫手」伺候，服事；GT《研經資料》說摩西的「幫手」原文是「伺候」、「服事」的分詞型態，是「助手」的意思。GT《綜合解讀》說約書亞自從出埃及以來，一直是「摩西的幫手」，並列出出24:13、出33:11、民11:28。BH 說多年在摩西身邊的謙卑服事預備了他，使他能以順服、勇氣與倚靠神來帶領以色列。
  relation: 條目此前三章都用這個字描述利未人與祭司的職分，本章是它第一次用在一個非祭司的個人身上——而這個人正要從幫手變成領袖。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
    - 4
    definition: keep
    development: keep
- title: 約但河
  path: link_folder/地點/約但河.md
  summary: 第2節「和眾百姓過這約但河」是全章的中心命令，第11、14、15節共四次出現（STEP 均為 hai./yar.Den，H3383）。CT 說約但河源於黑門山西北部，經加利利海，流入死海，平時河寬不足二百公尺，春季洪泛時超過一千公尺，水流湍急，很難過渡。GT《啟導本》說以色列人過約但河時值「收割的日子」，為陽曆四、五月間。KC 通篇把約但河讀成死亡之河，說它表明主耶穌的死與復活，並說以色列必須過約但河才能進入那地。
  relation: 條目此前累積的多是安營、畫界與河東河西的位置描述，本章把這條河變成一道帶期限的動員令：約書亞就任後第一件事，就是命全營三日之內過這約但河。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 20
    - 21
    definition: keep
    development: keep
- title: 曠野
  path: link_folder/地點/曠野.md
  summary: 第4節「從曠野和這利巴嫩」把曠野列為應許之地的一個界標。GT《啟導本》說「曠野」包括南地與西奈半島，為南邊的界限；GT《串珠》說也許是指東南的阿拉伯曠野；GT《研經資料》說是應許之地南部雨量較少的旱漠區域。GT《舊約背景註釋》的華爾頓另說「曠野」包圍了這地南面和東面的疆界。KC 把它讀成邊界之外世界的一種特質，說曠野代表乾旱。
  relation: 條目此前記的是以色列在曠野裡的四十年，本章的曠野換了功能：它從走過的路變成新家園的一條邊。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 7
    - 8
    definition:
      decision: keep
      basis: no_identity_change
    development: keep
- title: 利巴嫩
  path: link_folder/地點/利巴嫩.md
  summary: 第4節「從曠野和這利巴嫩」，各家同指北界。GT《串珠》說「利巴嫩」為以色列領土的北界；GT《啟導本》說「黎巴嫩」即今黎巴嫩境，為北界；GT《研經資料》說字義是「潔白」，是位於以色列北方的一座多樹木的山，並指出七十士譯本和武加大譯本等都沒有這個字。CT 原文字義同樣給「利巴嫩」潔白。GT《舊約背景註釋》則把黎巴嫩與幼發拉底河一起讀成北界的東西兩端。
  relation: 申3:25 摩西求神容他過去看利巴嫩，申11:24 用它畫界；本章是同一個界標在約書亞名下重述一次，並帶出七十士譯本沒有這個字的異文問題。
  overview_review:
    signals:
    - first_in_book
    - development_blank
    accumulation_count:
    - 2
    - 3
    definition: keep
    development:
      decision: keep
      basis: standing_debt
- title: 伯拉大河
  path: link_folder/地點/伯拉大河.md
  summary: 第4節「直到伯拉大河」，STEP 為 ne.har- pe.Rat（H5104H＋H6578）。GT《串珠》說「伯拉大河」即今日的幼發拉底河，為東界；GT《啟導本》說「伯拉大河」就是幼發拉底河，乃東界。CT 原文字義給「伯拉」豐收。GT《舊約背景註釋》另說在其他有關應許地疆界的討論中，幼發拉底河是指這河在艾瑪爾一帶轉北的地區。KC 把它列為東邊的界標，並說江河象徵豐裕。
  relation: 條目此前記創2、創15、創31 與申1、申11 的用法，本章是它作為應許地界標在約書亞任內第一次被重述。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 5
    - 6
    definition: keep
    development: keep
- title: 大海（地中海）
  path: link_folder/地點/大海（地中海）.md
  summary: 第4節「又到大海日落之處，都要作你們的境界」，STEP 為 hai./Yam ha./ga.Dol me.Vo' ha./Sha.mesh（H3220G、H1419J、H3996、H8121）。CT 說『大海日落之處』指西界地中海（參民三十四6）。GT《串珠》說「大海」指地中海，為西界；GT《綜合解讀》說「大海日落之處」指迦南地西邊的地中海。KC 把海讀成動盪與患難的象徵。
  relation: 民34 用大海定西界、申11 重述，本章把同一條界線放進神給約書亞的應許裡，並用「日落之處」多給了一個方位說法。
  overview_review:
