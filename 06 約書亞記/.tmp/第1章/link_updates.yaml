- title: 必不撇下你，也不丟棄你（ra.phah 與 a.zav）
  path: link_folder/原文/必不撇下你，也不丟棄你（ra.phah 與 a.zav）.md
  summary: 第5節「我必不撇下你，也不丟棄你」，STEP 為 'ar.pe./Kha（H7503 ra.phah）與 'e.'ez.Ve./ka（H5800A a.zav），與申31:6、8 是同一對動詞。CT 原文字義給「撇下」下沉，放鬆；「丟棄」離去，棄絕，並說「不撇下你」和「不丟棄你」是同義的，並列是為了強調。KC 說不撇下的意思是祂不會失信、永不叫我們失望，不丟棄的意思是祂永不撇下我們獨自一人，並把它接到來13:5。BH 說摩西死前已經把同樣的保證給了以色列與約書亞，希伯來書則把它用在活在神看顧下的信徒身上。
  relation: 申31 是摩西替神說這句話（第6節對眾人、第8節對約書亞），本章是神親口對約書亞說同一句話——條目此前只有轉述的一層，這裡多了直說的一層。
