- title: 兩支派半求河東之地為業
  path: link_folder/事件/兩支派半求河東之地為業.md
  summary: 第12至15節約書亞要流便人、迦得人和瑪拿西半支派「追念耶和華的僕人摩西所吩咐你們的話」，並重申三項內容：妻子、孩子和牲畜可以留在河東摩西所給的地；一切大能的勇士要帶著兵器在弟兄前面過去；等到弟兄也得享平安並得著地業，才可以回自己所得之地承受為業。第16至18節他們全部應允，還加上違背者處死的話。GT《綜合解讀》說新上任的領袖約書亞並沒有為了討好他們而改變計畫，反倒提醒他們要「追念耶和華的僕人摩西」所吩咐的話。KC 說他們得以住在約但河曠野那一邊的條件，就是一同去攻取那地，而這是他們答應過的。BH 說安頓好的家園與牲畜並沒有免除他們的立約責任。
