- title: 律法書放在約櫃旁
  path: link_folder/主題/律法書放在約櫃旁.md
  summary: 第8節「這律法書不可離開你的口」，STEP 為 se.Fer ha./to.Rah（H5612H＋H8451）。GT《啟導本》說「這律法書」指神藉摩西所傳的一切律法，包括《出埃及記》、《利未記》和《民數記》中所記載的律法，以及《申命記》中摩西作的講解。GT《雷氏研讀本》說留意律法在這時已經寫成，而且被奉為權威。BH 說律法書就是藉摩西所傳的五卷書，啟示神的約、命令、應許與作為。KC 說約書亞能治理百姓的前提，是他自己先讓上頭的權柄治理他，所以他必須聽神的話。
  relation: 申31:9-13 吩咐每七年向全會眾宣讀這律法，申31:26 把它放在約櫃旁作見證；本章則把同一卷書交到領袖個人身上：不離開你的口、晝夜思想、謹守遵行。
