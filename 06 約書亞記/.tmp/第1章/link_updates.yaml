- title: 以色列人的官長
  path: link_folder/人物/以色列人的官長.md
  summary: 第10節「於是，約書亞吩咐百姓的官長說」，第11節官長要走遍營中傳令。CT 原文字義給「官長」官長，官員，並說這表示約書亞負起全責，開始發號司令。GT《啟導本》說「百姓的官長」當為摩西在各支派中所立的千夫長、百夫長等管理百姓的人。GT《聖經精讀本》說在曠野生活中，官長是特定血緣團契的頭目，其作用是將領袖的指示傳達給百姓或召集戰鬥人員。BH 說官長把命令帶遍以色列有秩序的營盤，觸及每一個支派與家庭。
  relation: 條目此前記的是官長在出埃及、獻祭與戰爭條例中的角色，本章是他們第一次在新領袖手下運作，成為約書亞第一道命令的傳遞管道。
