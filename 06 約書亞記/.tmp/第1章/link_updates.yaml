- title: 赫人
  path: link_folder/人物/赫人.md
  summary: 第4節「赫人的全地」，STEP 為 ha./chi.Tim（H2850）。各家說法不一：CT 說『赫人的全地』指今敘利亞的北面，神曾應許亞伯拉罕賜給他的後裔；GT《綜合解讀》說「赫人的全地」代稱整個迦南地；GT《啟導本》說赫人退居北疆一隅已數百年，迦南仍稱為「赫人之地」；GT《雷氏研讀本》指出學者常認為是敘利亞北面，但這句子在七十士譯本和申命記十一章24節都沒有出現；GT《舊約背景註釋》說赫人的全地最有可能是指敘利亞，赫人帝國在主前一二○○年左右滅亡之後，很多赫人社群都在附近地區定居。KC 說赫人是迦南七族之一，這裡單提他們，可能因為他們是最可怕的敵人。
  relation: 條目此前記的是族群本身與他們在創世記、出埃及記的出現，本章把「赫人的全地」當成疆界描述的一部分，也因此帶出這句話究竟指多大範圍的分歧。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 7
    - 8
    definition: keep
    development: keep
- title: 應許之地的四至
  path: link_folder/主題/應許之地的四至.md
  summary: 第4節一口氣列出曠野、利巴嫩、伯拉大河、赫人的全地與大海日落之處，末句「都要作你們的境界」，STEP 的「境界」是 ge.vu.le./Khem（H1366H）。GT《串珠》與《啟導本》都把它讀成南、北、東、西四界；GT《舊約背景註釋》的華爾頓另說「曠野」包圍了這地南面和東面的疆界，黎巴嫩和幼發拉底河是北界的東西兩端。各家對這片地何時到手也不一致：GT《啟導本》說以色列人要到所羅門王時代，才得到此廣大土地；GT《雷氏研讀本》說這應許要到千禧年的時候才能完全實現；GT《聖經精讀本》說以色列百姓卻未曾確保這一切地界；KC 說按第4節所呈現的樣子，以色列從來沒有擁有過。
  relation: 申1:7 與申11:24 兩次畫過同一片地，本章是第三次，也是第一次對約書亞說。申命記的註釋早已討論過這片疆域何時到手，本章的新東西是四家在同一節底下並排給出不同判斷，以及 GT《舊約背景註釋》那種不照四方切的畫法。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 2
    - 3
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:1
      - 申命記:11
      - 約書亞記:1
- title: 腳掌可踏之處
  path: link_folder/原文/腳掌可踏之處.md
  summary: 第3節「凡你們腳掌所踏之地，我都照著我所應許摩西的話賜給你們了」，STEP 為 tid.Rokh kaf- rag.le./Khem（H1869 da.rakh、H3709H kaph、H7272 re.gel），與申11:24 是相同的組合；GT《研經資料》明說申11:24-25 是這一段的平行經文。CT 說『腳掌所踏之地』意指征服佔領的地面。GT《啟導本》說「腳」是權力的象徵，被踏在腳下表示征服（參詩一一〇1），以色列人腳掌踏過之地，便取得所有權。KC 用遺產作比方：知道自己因繼承而富有是一回事，去承接並享用又是另一回事，所以必須把腳踏上去。
  relation: 申2:5 用這個量詞說以東的地連一個腳掌可踏之處都不給以色列，申11:24 用它說以色列腳掌所踏之地都必歸他們；本章是同一句話在真要過河的時刻對新領袖說出來，而且「賜給」在原文是完成式。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 2
    - 3
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 申命記:2
      - 申命記:11
      - 約書亞記:1
- title: 勉勵他使他膽壯（cha.zaq、a.mats）
  path: link_folder/原文/勉勵他使他膽壯（cha.zaq、a.mats）.md
  summary: 「剛強壯膽」在本章出現四次：第6、7、9節是耶和華對約書亞說，第18節是河東二支派半對他說。STEP 顯示四次都是 cha.Zak（H2388G）加 ve./'e.Matz（H553），第7節在這兩個動詞之後另有一個 me.'Od（H3966，exceedingly）。CT 說『剛強』重在指在信心上信靠神，『壯膽』重在指在心志上勇敢。GT《聖經精讀本》說「剛強」意味著手臂充滿了力量，「壯膽」指膝蓋有力量而站得穩。GT《綜合解讀》說神的「應許」是「剛強壯膽」的根據，神的「律法」是「剛強壯膽」的指引，神的「同在」是「剛強壯膽」的力量。KC 說約書亞雖然是勇敢的人，仍然被鼓勵。
  relation: 申3:28 是摩西去使他膽壯，申31 是摩西與耶和華先後叫他自己剛強；本章第一次由百姓對領袖說這句話，四次裡有一次是由下往上的。
