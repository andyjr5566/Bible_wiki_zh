- title: 得享平安（nu.ach）
  path: link_folder/原文/得享平安（nu.ach）.md
  summary: 第13節「耶和華─你們的神使你們得享平安」與第15節「等到耶和華使你們的弟兄像你們一樣得享平安」。STEP 顯示第13節是 me.Ni.ach（H5117，Hiphil 分詞）。CT 說『得享平安』指終止飄流，得到定居之地，可以安息下來。GT《研經資料》說「平安」原文作「休息」，型態是單數陽性分詞；GT《綜合解讀》說「得享平安」原文是「得享安息」，並說百姓爭戰的目的是要進入安息，爭戰的結果是要得著安息。BH 說神所應許的安息是在祂所賜的地業裡安穩定居。
  relation: 申3:20 用這個字定下兩支派半回家的時間點，本章由約書亞把同一個條件再說一次，而且分成兩層：河東的人已經得享平安，河西的弟兄還沒有。
