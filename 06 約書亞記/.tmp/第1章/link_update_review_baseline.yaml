- title: 勇士（cha.yil）
  path: link_folder/原文/勇士（cha.yil）.md
  definition: '第18節摩西對兩支派半下的命令：「你們所有的勇士都要帶著兵器，在你們的弟兄以色列人前面過去。」


    **「勇士」在原文是兩個字。** STEP 顯示是 be.nei- Cha.yil（H1121G，ben「兒子」，加 H2428G，cha.yil，簡要詞典義
    strength）。CT 原文字義的拆法一樣：「『勇士(原文雙字)』有能力的，武力(首字)；兒子，少壯的(次字)」。


    **指的是誰。** CT 說得很平實：「『你們』意指流便和迦得兩個支派加上瑪拿西的半個支派；『所有的勇士』指可以上戰場的男人。」BH：「The phrase
    "men of valor" indicates the need for courage and readiness in fulfilling God''s
    commands.」（「勇士」這個詞指出，遵行神的命令既需要勇氣，也需要預備好。）


    **同一節的「帶著兵器」是另一個字。** STEP 顯示是 cha.lu.Tzim（H2502B，cha.lats，to arm），被動分詞，本節 context
