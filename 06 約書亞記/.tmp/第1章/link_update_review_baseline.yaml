- title: 得享平安（nu.ach）
  path: link_folder/原文/得享平安（nu.ach）.md
  definition: '第20節說明兩支派半什麼時候可以回家：「等到你們弟兄在約但河那邊，也得耶和華你們神所賜給他們的地，又使他們得享平安，與你們一樣，你們才可以回到我所賜給你們為業之地。」


    **這裡的「平安」原文不是 shalom。** STEP 顯示是 ya.Ni.ach（H5117，nu.ach，簡要詞典義 to rest），使役語態，本節
    context gloss 作「he will give rest」——動作的發出者是耶和華。CT 原文字義給的也是「平安」休息，安歇。


    **它具體指什麼狀態。** CT：「『得享平安』意指消滅境內任何有組織的敵人。」GT《啟導本》列得更細：「以色列人到了迦南之後，在新土上安頓，無仇敵擾害、沒有強國的壓迫與內亂，也免於流浪、饑饉和瘟疫，“得享平安”（參十二9～10；二十五19）。」


    **先得的人要等後得的人。** KC：「We can learn from this that we should not only look for our
    own interests, but also for those of others (Phil 2:4). If we ourselves have rest,
    we will seek it for our brothers. We are members of each other and in the blessing
    of our fellow believer is also our blessing.」（我們可以從這裡學到，不要只顧自己的事，也要顧別人的事（腓2:4）。我們自己若已經得了安息，就會為弟兄去尋求安息。我們彼此互為肢體，同作信徒的人得福，也就是我們得福。）


    **這個主題往後怎麼走。** BH 把它接到兩端：往前接創世記2:2-3 神在第七日的安息，往後接新約——「The idea of rest is further
    developed in the New Testament, where it is fulfilled in Jesus Christ, who offers
    spiritual rest to believers (Matthew 11:28-30, Hebrews 4:1-11).」（安息這個觀念在新約進一步發展，在耶穌基督裡得著成全——祂賜給信徒屬靈的安息（太11:28-30、來4:1-11）。）'
