- title: 侍立事奉（a.mad、sha.rat）
  path: link_folder/原文/侍立事奉（a.mad、sha.rat）.md
  definition: '申10:8 用一句話交代利未支派被分別出來要做什麼：抬耶和華的約櫃、侍立在耶和華面前事奉他、奉他的名祝福。中文讀起來像三件事，STEP
    顯示原文是四個動詞。


    「抬」是 לָשֵׂאת（la./Set，H5375H，簡要詞典義 to lift: bear）；「侍立」是 לַעֲמֹד לִפְנֵי（la./''a.Mod
    li/f.Nei，H5975G，a.mad 簡要詞典義 to stand）；「事奉」是 לְשָׁרְתוֹ（le./sha.re.T/o，H8334，sha.rat
    簡要詞典義 to minister，Piel 不定詞加第三人稱陽性單數詞尾）；「祝福」是 וּלְבָרֵךְ（u./le./va.Rekh，H1288，ba.rakh）。CT
    的〔原文字義〕給的方向一致：「侍立」侍立，站立；「祝福」祝福，屈膝。


    **同樣譯成「事奉」，本章用了兩個不同的字。** 第8 節利未人的事奉是 sha.rat，第12 節與第20 節全民的事奉則是 עָבַד（''a.Vod、ta.''a.Vod，H5647G，a.vad）。兩個字在中文裡沒有分別，在原文裡是兩個詞：a.vad
    的詞典義是 to serve，也是聖經裡「作奴僕」用的那個字；sha.rat 的詞典義是 to minister，偏向在職位上供職。這是語言事實，本章沒有進一步說明兩者的分工。


    **「侍立」與摩西「住了」是同一個字。** 第10 節摩西說「我又像從前在山上住了四十晝夜」，STEP 顯示那是 עָמַדְתִּי（''a.Mad.ti，H5975G），與第8
    節利未人「侍立」的 a.mad 同一個動詞。摩西在山上站著的那四十晝夜，和利未人在會幕裡站著的日常，用的是同一個動作。


    **職責的內容各家分工說明。** CT 逐項列出：抬約櫃由三個家族分別搬運會幕和各種聖器物（民4:1-33）；侍立事奉由祭司擔任獻祭、點燈、燒香、更換陳列餅等事工；奉名祝福可能屬於大祭司的職責（民6:23-27）。GT《申命記串珠聖經註釋》把中間一項解作統籌崇拜和獻祭的事。GT《聖經精讀本──申命記註解》強調抬約櫃是利未支派的義務與特權，只有被分別為聖的利未支派能獨擔此任。


    **KC 把三項職責讀成三個層次。** 他先把它們列出來——carry the ark、serve the LORD、bless in His Name——再說：「Knowing
    our blessings is one thing, but bearing those blessings on our hands through the
    wilderness is another.」（知道我們的福分是一回事，一路把這些福分捧在手上走過曠野是另一回事。）他把第二項連到進入聖所的敬拜，把第三項連到從聖所出來祝福周圍的人。BH
    則指出侍立事奉包括會幕與後來聖殿裡的職事，是神與人之間需要中保的持續提醒。'
  development: '申命記第十章用這一對字交代利未支派的職分：抬約櫃、侍立在耶和華面前事奉他、奉他的名祝福。申命記十七章第12節把同一對字放進了法庭。STEP
    顯示這裡是 ha./''o.Med（H5975G，簡要詞典義 a.mad: to stand: stand）加 le./Sha.ret（H8334，簡要詞典義
    sha.rat: to minister），與申10:8 的那一對相同。


    進了法庭以後，這對字就不只是描述職分，而是成了判決有效力的根據。CT 的文意註解從這句話讀出理由：侍立在耶和華你神面前這個說法暗示他們在判斷之前求問神，因此他們的斷案也就是神的斷案。KC
    說祭司最知道神的心意，因為他們習慣於在神面前。


    第三次出現時，這一對字回到它最基本的位置。申十8 用它交代利未支派的職分，申十七12 用它作為判決有效力的根據，申十八5 則把它寫成揀選的目的本身——「使他和他子孫永遠奉耶和華的名侍立事奉」。STEP
    顯示是 la./''a.Mod（H5975G）與 le./sha.Ret（H8334），與前兩處同一對字。


    第7節還把這對字拆開用了一次：外地來的利未人「就要奉耶和華─他神的名事奉」（ve./she.Ret），像他眾弟兄利未人「侍立在耶和華面前」（ha./''o.me.Dim）一樣。CT〔原文字義〕給的分工是「侍立指等候差遣，事奉指投入工作」。==三章合起來，這對字先描述職分，再支撐判決，最後成為神揀選這個支派的理由。=='
