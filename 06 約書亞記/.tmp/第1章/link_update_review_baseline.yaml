- title: 勉勵他使他膽壯（cha.zaq、a.mats）
  path: link_folder/原文/勉勵他使他膽壯（cha.zaq、a.mats）.md
  definition: '第28節是神交代摩西的最後一件事：「你卻要囑咐約書亞，勉勵他，使他膽壯」。


    **三個動詞。**


    | 中文 | 原文（STEP） | Strong | 簡要詞典義 |

    |---|---|---|---|

    | 囑咐 | ve./Tzav | H6680 | tsa.vah：to command |

    | 勉勵 | ve./cha.ze.Ke./hu | H2388G | cha.zaq：to strengthen |

    | 膽壯 | ve./''a.me.Tze./hu | H553 | a.mats：to strengthen |


    CT 把三個動作的分工寫出來：「神命令摩西作好交棒：(1)『囑咐(charge)』指交代任務；(2)『勉勵(encourage)』指免除畏懼；(3)『膽壯』(strengthen)指加強勇氣。」CT
    原文字義另給：「勉勵」加強，堅定；「膽壯」勇敢，大膽。


    **誰對誰做。** STEP 標的形態是第二人稱單數命令式加第三人稱單數受詞後綴（Vpv2ms/Sp3ms）——發出動作的是摩西，承受的是約書亞。這不是要約書亞自己剛強起來，是要摩西去使他剛強。


    **為什麼由摩西來做。** KC：「Moses knew what he was talking about when he handed over the
    leadership to Joshua and pointed out to him what to do. It must also have been
    an encouragement for Moses knowing that the work the LORD started with him would
    be completed by Joshua.」（摩西把領導權交給約書亞、指點他該做什麼的時候，是知道自己在說什麼的。而且這對摩西自己也是一種鼓勵——他知道耶和華藉他開始的工作，會由約書亞完成。）CT
    從交棒的角度說同一件事：「優秀的領導人會為百姓預備，找到有領袖潛能的人，多加訓練並鼓勵他們，這樣舊的領袖不在時，一應事務仍可照常，不受影響。」


    **這種鼓勵在聖經裡不是孤例。** BH：「The call to strengthen Joshua echoes the biblical theme
    of God empowering His chosen leaders, as seen with figures like Gideon (Judges
    6:14) and David (1 Samuel 30:6).」（勉勵約書亞的這個呼召，呼應聖經裡神使祂所揀選的領袖得力的主題，如基甸（士6:14）與大衛（撒上30:6）。）BH
    並指出約書亞記1:9 又把同樣的鼓勵說了一次。'
  development: '### 從摩西去使他剛強，到神叫他自己剛強


    這一組動詞在申命記出現在兩個相隔很遠的地方，語法不同，說的事也不同。


    申3:28 是神交代摩西的：你卻要囑咐約書亞，勉勵他，使他膽壯。STEP 標的形態是第二人稱單數命令式加第三人稱單數受詞後綴——發出動作的是摩西，承受的是約書亞。那裡的重點是交棒的人要出力。


    申31 換了語法。第6、7、23節三次都是不及物的祈使：chiz.Ku ve./''im.Tzu（第6節，複數，對眾百姓）與 cha.Zak ve./''e.Matz（第7、23節，單數，對約書亞）。==命令的對象自己就是動作的主詞。==


    ==更值得注意的是第23節說話的人。==第7節是摩西對約書亞說剛強壯膽，第23節同一句話換成耶和華親口說。CT 在話中之光的解釋正是這個：凡神自己呼召的僕人，神不會讓他們靠著自己在各種難處中剛強壯膽，而是會清清楚楚地向他們啟示自己的同在和心意。


    兩章合起來，這組動詞走完了一條線：先由前一任領袖去使新人剛強，再由新人自己剛強，最後由神親自對他說同一句話。'
  signals:
  - first_in_book
  accumulation_count:
  - 2
  - 3
- title: 神的同在
  path: link_folder/神學/神的同在.md
  definition: 神的同在（Presence of God）是聖經一條貫穿的主題——神與祂所揀選的人同在，是他們蒙福、外邦人也都看得見的事實。在創世記裡它以「神與某人同在」的敘述出現；到了出埃及記，它取得了具體的形式：神吩咐造聖所，「使我可以住在他們中間」（出25:8），而會幕的每一層結構都成為這個同在的外殼與界線。
  development: '「神的同在」橫跨三卷書、十七章累積下來，走的是一條從「對個人的口頭應許」到「一座蓋起來的居所」、再到「日常同行的規範」的線。


    **第一段是族長時期的口頭應許。** 創世記第26章神兩次對以撒說「我必與你同在」，連外人亞比米勒都看得出來：「我們明明的看見耶和華與你同在」。創世記第28章的時機更值得注意——雅各因欺騙父親被迫離家、以石為枕的那一夜，神說「我也與你同在」，而雅各醒來才發覺：「耶和華真在這裏，我竟不知道！」神的同在先於人的察覺，這一點在這兩章就定了調。出埃及記第3章把同樣一句話用在差遣上：摩西問自己憑什麼去見法老，神沒有回答他的資格問題，只應許「我必與你同在」。


    **第二段是出埃及記後半的核心工程：把同在蓋成一座房子。** 出埃及記第26章給的是外殼規格，四層遮蓋由內而外越來越樸素，而內幔把聖所與至聖所隔開——同在因此是可親近卻有界限的。第27章的燈在幔外常常點著，院子的門開在東邊；KC
    說院子入口「It represents the invitation to man to approach God.」（它代表對人的邀請，要人親近神。）。第29章45-46節把整段的目的講白：「我要住在以色列人中間，作他們的神」，GT《丁道爾》稱這兩節「就是以上經文的總綱和巔峰」。第30章的香壇與洗濯盆是進入同在前的預備；第37章的施恩座是神應許相會的具體座標。


    中間出過一次大事故。出埃及記第33章神宣告「我自己不同你們上去」，摩西力爭「你若不親自和我同去，就不要把我們從這裡領上去」，並指出神的同去正是「使我和你的百姓與地上的萬民有分別」的唯一記號。第34章這件懸案以立約的形式落定，第35章重啟建造——KC
    指出這顯明人的罪並未取消神的恩典，會幕如今臨到一個跌倒過的百姓中間。第36至39章是實體建造與清點，第40章雲彩遮蓋會幕、榮光充滿帳幕，應許正式成為事實。


    **第三段是同在住下來之後的日常。** 利未記第26章11-12節用兩個動作把它說完：「我要在你們中間立我的帳幕」，然後「我要在你們中間行走」。CT 分得很清楚：「上節是同住，本節是同行。」而這一次同在被寫成有條件的——它是七重蒙福應許的最高一層，前提是遵行律例、謹守誡命；同一章第30節又用同一個動詞說出反面：「我的心也必厭惡你們。」民數記第2章則把同在變成營地的空間秩序：會幕居中、四營環繞，無論安營或起行都不改變。GT
    丁良才從這個佈局讀出三樣教訓——神與人同在、都當倚靠神、都可親近神。


    **第四段把同在帶進了戰場。** 申命記二十三章14節說：「因為耶和華─你的神常在你營中行走，要救護你，將仇敵交給你，所以你的營理當聖潔，免得他見你那裡有污穢，就離開你。」利未記二十六章講的是同在住進帳幕之後在百姓中間行走，申命記二十三章講的則是同一位神走在行軍的營裡。


    STEP語言資料顯示這裡的「行走」是 mit.ha.Lekh（H1980I，本節譯義 [is] walking back and forth）。CT 說「『在你營中行走』形容神的同在和保守」。


    條件也跟著改變了形狀。利未記二十六章的條件是遵行律例，申命記二十三章的條件卻落在最日常的細節上——夢遺的人要出營一夜，便溺要挖坑掩埋。KC 說得直接：這一段講的不是打仗本身，而是預備與裝備，任何一點對惡的容讓都會削減爭戰的力量，而力量的來源正是耶和華在他們中間。==同在到了這一段，已經不再是一個應許或一座建築，而是一項每天都要維護的條件。=='
  signals:
  - first_in_book
  accumulation_count:
  - 19
  - 20
- title: 必不撇下你，也不丟棄你（ra.phah 與 a.zav）
  path: link_folder/原文/必不撇下你，也不丟棄你（ra.phah 與 a.zav）.md
  definition: '這句話在申命記第三十一章說了兩次，對象不同。第6節是對全體百姓說的，第8節是對約書亞一個人說的，話卻一字不改：「他必不撇下你，也不丟棄你。」


    ### 兩個動詞


    STEP 顯示這是兩個不同的字。「撇下」是 lo yar.pe./Kha（H7503，Hiphil，簡要詞典義 ra.phah: to slacken，本節譯義
    he will abandon you），字根的方向是鬆手。「丟棄」是 ve./lo ya.''az.Ve./ka（H5800A，簡要詞典義 a.zav:
    to leave: forsake）。


    CT 的文意註解把兩個中文詞分開講：不撇下重在指必要成就他的應許，不丟棄重在指始終堅定他的同在。


    KC 的分法很接近：不撇下的意思是我們隨時可以指望他給忠告與引導、給力量與勇氣；不丟棄的意思是他總與他的百姓同在，一路走到爭戰中、走到得地為業。他並把這句話接到馬太福音28章20節與希伯來書13章5節。


    ### 同一個字，本章後面掉了頭


    第二個動詞 a.zav 在這一章還出現兩次，方向卻反了過來。


    | 節次 | 和合本 | STEP 字形 | 誰對誰 |

    | --- | --- | --- | --- |

    | 6、8 | 也不丟棄你 | ya.''az.Ve./ka | 神不丟棄人 |

    | 16 | 離棄我 | va./''a.za.Va./ni | 人離棄神 |

    | 17 | 我也必離棄他們 | va./''a.zav.Ti/m | 神離棄人 |


    ==同一個 H5800A，在一章之內走完了三步。==前面兩節是應許，第16節是神預告百姓要做的事，第17節是神說到那時他要怎麼回應。經文自己沒有替這個轉折下註解，但三處用的確實是同一個字。


    BH 說這個應許後來在約書亞記1章5節被重述，並說這種不離開、不撇棄的措辭本身就是立約的語言。'
