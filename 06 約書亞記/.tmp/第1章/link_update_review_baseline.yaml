- title: 產業（na.cha.lah）
  path: link_folder/原文/產業（na.cha.lah）.md
  definition: '「產業」na.cha.lah 是民數記27:7-11 繼承次序反覆使用的核心詞，STEP 的 exact Strong 是 H5159，簡要詞典義為
    inheritance（承受的產業）。本章共出現六次：民27:7 兩次，民27:8-11 各一次。


    | 節次 | 詞形資料 | 本節作用 |

    |---|---|---|

    | 27:7 前一處 | na.cha.Lah，HNcfsa | 陰性名詞單數絕對形：「一份產業」 |

    | 27:7 後一處 | na.cha.Lat，HNcfsc | 陰性名詞單數附屬形：「父親的產業」 |

    | 27:8-11 | na.cha.Lat 加第三人稱陽性單數後綴，HNcfsc/Sp3ms | 逐級說明「他的產業」交給誰 |


    這六次重複把法律問題鎖定在「誰承受死者原有的那一份」。CT 在民27:7 把這個詞解作基業、地業之意，並說女兒可取回父親的產業、傳給後代；GT、KingComments
    與 BibleHub 都從土地、家名和支派延續來解釋它。


    **中文同譯「產業」時仍要分詞。** 民27:4 女兒求「分給我們產業」用的是 H272 a.chuz.zah，偏向可持有的地業；民27:7-11 的 H5159
    則是法律次序中被傳遞的繼承份。民27:7 同時出現兩者：先把地給她們「為業」（H272），再把父親的「產業」（H5159）轉給她們。兩個詞在本段互相補充，不能只看中文表面就合併成一個原文字。'
  development: 'STEP 在已完成 machine validation 的民數記26-27章中，各找到 H5159 六次：26章處理支派按人數分得地業，27章處理一個家庭內地業如何傳遞。這個相鄰章的安排讓「分地」從全國尺度縮小到家族尺度；此
    occurrence 結論只涵蓋已驗證的查詢範圍。


    申命記十八章用這個字說明的是「沒有」。第1至2節四次出現 na.cha.lah 與 Che.lek 這一對字（H5159 與 H2506A），全部落在否定句裡——祭司利未人和利未全支派在以色列中無分無業，在弟兄中必沒有產業。


    民數記二十七章用這個字處理誰承受死者原有的那一份，民數記三十二至三十六章用它處理支派與城邑的分配；申命記十八章則用同一個字指出有一個支派被刻意排除在分配之外，理由寫在第2節下半句——耶和華是他們的產業。==同一個名詞在這一段裡同時是被拿走的東西，也是被賜下的東西。==


    申命記十九14 用這個字保護的是別人的那一份。


    民數記那幾章處理的是分配——誰承受死者原有的那一份、哪一支派得哪一塊；申命記十八章用它說明利未支派刻意沒有分到。本章第14節則出現第三種用法：「在耶和華─你神所賜你承受為業之地，不可挪移你鄰舍的地界」。STEP
    顯示名詞與同源動詞在同一節連用——be./na.cha.la.te./Kha（H5159）加 tin.Chal（H5157）。


    ==前面幾處問的是這一份歸誰，這一節問的是你有沒有動到別人那一份。== KC 也是這樣讀的：這一節講的不是照顧自己的產業，而是照顧鄰舍的產業。'
