- name: 會眾的首領
  type: 人物
  section: 人物
  evidence: |-
    第15節「會眾的首領也向他們起誓」，第18節「因為會眾的首領已經指著耶和華─以色列的神向他們起誓……全會眾就向首領發怨言」，第19、21節眾首領向全會眾說話。STEP 為 ne.si.'Ei ha./'e.Dah（H5387A，簡要詞典義 na.si: leader，加 H5712，簡要詞典義 e.dah: congregation）。CT 說『會眾的首領』指十二支派的首領，並說第21節「要容他們活著」是下達最後的決論。GT《丁道爾聖經注釋》說「會眾的首領」一詞在出埃及記、民數記和約書亞記中共出現八次，他們與摩西、約書亞和大祭司一同負治理之責，作出報告，並決定全國大事；GT《聖經精讀本》說因領袖的失策，群體內部甚至出現了混亂的徵兆，這令我們看到領袖的責任是何等重大。KC 說 The most responsible take the lead in the error。BH 說眾首領以一個聲音回應，他們的合一回應承認這個代表以色列所立的約不能被當作私下或隨便的協議。
