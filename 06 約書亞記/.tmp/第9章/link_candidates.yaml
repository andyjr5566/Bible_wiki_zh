- name: 劈柴挑水的人
  type: 主題
  section: 主題
  evidence: |-
    第21節「於是他們為全會眾作了劈柴挑水的人」，第23節「為我神的殿作劈柴挑水的人」，第27節「為會眾和耶和華的壇作劈柴挑水的人，直到今日」。STEP 為 cho.te.Vei 'e.Tzim（H2404，簡要詞典義 cha.tav: to chop，加 H6086G）與 sho.'a.vei- Ma.yim（H7579，簡要詞典義 sha.av: to draw，加 H4325G）；第23節「神的殿」是 le./Veit 'e.lo.Ha/i（H1004Q，簡要詞典義 ba.yit: house: temple）。CT 原文字義給「劈」砍伐、收集，「挑」汲取，並說『劈柴挑水』即指提供燃料柴和飲用水，又說約書亞把基遍人從「為全會眾作了劈柴挑水的人」具體變成了「為我神的殿作劈柴挑水的人」，用代替會眾為祭壇劈柴挑水的方式來服事全會眾。GT《丁道爾聖經注釋》說要基遍人作為聖所劈柴挑水的人這個意見顯示，凡住在該地的外邦人就必須作這些事（申二十九11），雖然劈柴的斧頭可以當作武器使用（耶四十六22），不過這裡的描述意思是作和平的用途，而挑水是為了生存而每天必須作的事，這對基遍的居民尤其適用，因為在當地找到山地最大的井之一；GT《聖經精讀本》說委任給基遍族類的任務就是劈聖所用來獻祭的柴並挑水，事奉聖所的利未人將又累又髒的活分給基遍人來做，他們當時居住在以色列百姓中間，被視為是最卑賤的人（申29:10，11）；GT《綜合解讀》說「神的殿」原文是「神的家」，指會幕，「耶和華的壇」指祭壇，需要大量用以獻祭的柴和用以潔淨的水。KC 說 The Gibeonites are as slaves in the house of God, not as sons，並說 They fetch wood for the altar, but are not offerors themselves. They fetch water, but not to become clean by it themselves。BH 說 wood supplied the altar, and water was used for washing and purification，並說他們雖領受卑微的勞役，工作卻把他們放在真神的敬拜近旁。
- name: 咒詛（a.rar 與 qa.vav）
  type: 原文
  section: 原文
  evidence: |-
    第23節「現在你們是被咒詛的！你們中間的人必斷不了作奴僕，為我神的殿作劈柴挑水的人」。STEP 為 'a.ru.Rim（H779，簡要詞典義 a.rar: to curse，Qal 被動分詞複數），同節「斷不了」是 yi.ka.Ret（H3772G，簡要詞典義 ka.rat: to cut: cut，Niphal），「奴僕」是 'E.ved（H5650，簡要詞典義 e.ved: servant/slave）。CT 原文字義給「斷」砍掉、剪除，並說『被咒詛的』指當年挪亞所說迦南當受咒詛給他弟兄作奴僕的話（參創九24~27）。GT《聖經精讀本》說從基遍人淪為以色列之奴隸的事件中可注意三個事實：很顯然他們所受的屈辱是神的咒詛（創9:25）；雖然如此，他們的生命得以保存是因為他們敬畏神並渴慕神的恩典；從末世論角度預表了外邦人也可以進入恩典的事實（賽66:21）；GT《綜合解讀》說「你們中間的人必斷不了作奴僕」就像利未人「散住在以色列地中」（創四十九7）一樣，都是以咒詛開始卻以祝福結局，「奴僕」既表明基遍人成為以色列的藩屬、仰賴以色列人施恩，也表明以色列人對基遍人負有責任、有義務保護他們（十6~7）。KC 說 Joshua curses them and condemns them to do the humblest work。BH 說約書亞宣告審判臨到基遍人，因為他們以蓄意的欺騙取得了以色列的誓言，而他們的處境令人想起臨到迦南的咒詛。既有條目「咒詛（a.rar 與 qa.vav）」已收民22-24、申27-28 的同一個 H779，本章是它落在迦南人身上的一次，屬跨卷累積。
