- name: 指著耶和華起誓的約束力
  type: 主題
  section: 主題
  evidence: |-
    第18至20節：「因為會眾的首領已經指著耶和華─以色列的神向他們起誓，所以以色列人不擊殺他們……我們要如此待他們，容他們活著，免得有忿怒因我們所起的誓臨到我們身上。」STEP 第18節為 nish.be.'U（H7650，簡要詞典義 sha.va: to swear）、第20節的「誓」是 ha./she.vu.'Ah（H7621，簡要詞典義 she.vu.ah: oath）。CT 說神前所立的神聖誓約不容廢棄，並在話中之光說雖然基遍人用詭計與百姓立約，但神的百姓卻不能用詭計毀約，因為這約是「指著耶和華——以色列的神向他們起誓」而立的，守約就是順服神，而敬畏神的人「發了誓，雖然自己吃虧也不更改」（詩十五4）。GT《華爾頓約書亞記背景注釋》說在一個視神明為活躍、有能、可懼的文化中，起誓是很認真的事，願可以廢除（利二十七；民三十），但立誓的人卻受神明復仇威脅的約束，誓言若遭違背，奉其名起誓的神祇就會被視為無用無能，主前十四世紀的赫人君王穆希利相信戰亂和瘟疫是立誓締結之條約被人違背的結果，而撒母耳記下二十一章描述違背本段所起之誓所導致的惡果；GT《丁道爾聖經注釋》說顯然以色列首領在起誓與基遍人立約時並沒有附帶條件，即基遍人必須要誠實，所以儘管他們的謊言被識破，誓言依然有效；GT 所收艾基斯《舊約聖經難題彙編》處理「基遍人用詭計與以色列人立約，為何以色列人需遵守這條約」，說在正常情況下任何法庭都會裁定以色列人沒有義務遵行協定，然而這個條約並非一般的協定，而是以色列人因著他們的神的名字而作出的莊嚴誓言，因此以色列人永遠受制於這約；GT《啟導本》說神的子民不可背約（民三十2），即令吃虧也不可失約於人。KC 引詩15:4「He swears to his own hurt and does not change」，並說一個錯誤的行為不可以因為不願承擔後果而變得更糟。BH 說起誓援引了以色列神的立約之名，把這協議置於祂的見證與權柄之下。
