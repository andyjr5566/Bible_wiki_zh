- name: 忿怒（qe.tseph）
  type: 原文
  section: 原文
  evidence: |-
    第20節「免得有忿怒因我們所起的誓臨到我們身上」。STEP 為 Ke.tzef（H7110A，簡要詞典義 qe.tseph: wrath）。CT 原文字義給「忿怒」暴怒、憤怒，並說『忿怒』指神的忿怒，因不忠於誓約而發。GT《丁道爾聖經注釋》說首領想要避免的忿怒在約書亞記另外只出現過一次，即二十二20，那裡乃是追憶因著亞幹的罪神將忿怒臨到以色列人，意思應當是指軍事上的失敗，而以色列的首領希望不再重蹈第七章的覆轍；GT《研經資料》說這個字聖經中多用來指「神的憤怒」，舊約中出現29次。BH 說背棄神聖的誓言會把罪責帶給全國，以色列明白耶和華會審判那些輕看祂的名與自己承諾的百姓。
