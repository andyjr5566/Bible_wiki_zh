- name: 詭計與謹慎（or.mah）
  type: 原文
  section: 原文
  evidence: |-
    第4節「就設詭計，假充使者」。STEP 為 be./'a.re.Mah（H6195，簡要詞典義 or.mah: craftiness，本節逐字解 with/ cunning），同節「假充使者」是 va/i.yitz.tai.Ya.ru（H6737，簡要詞典義 tsa.yar: to take provision，本節逐字解 they acted as ambassadors）。CT 原文字義給「詭計」機靈、狡猾，「假充使者」自備乾糧、整裝而去、使者，並說『詭計』字義「機靈」，有正反兩面的意思，正面即指「謹慎」，反面意指「陰謀」。GT《研經資料》說這個字聖經僅出現五次，用於正面有三次（箴1:4，箴8:5，箴8:12）可以指「謹慎」，用於負面有出21:14 便意味「背叛或陰謀」，在此9:4 有負面之意、不過並不像出埃及記到謀殺的地步，而就基遍人而言這可能是謹慎的一步，因為這是他們惟一自保的方式；GT《丁道爾聖經注釋》說詭計一詞的意思與「智慧、瞭解」接近，並指出這字與第12節「帶」有一個動詞的字根在形式上相仿，而 MT 第4節也用到這字根的形式（Hithpael 反身形式），可以譯為「他們以使者的身分出去」；GT《綜合解讀》說「假充使者」原文是「整裝而去」，並說他們的行為雖然詭詐，但卻也像那位「不義的管家做事聰明」（路十六8）。KC 說在屬靈爭戰中我們特別要面對的是 the schemes of the devil（弗6:11），並說 His schemes are more to fear than his strength。BH 說基遍人懼怕以色列在耶利哥與艾城施行的審判，選擇了欺瞞而不是公開抵抗。庫內既有的「詭計（ne.khel）」是另一個希伯來字（民25:18 的 H5231／H5230），不是本節這個；本條目用「詭計與謹慎」作裸名，正是因為 or.mah 的義域同時涵蓋兩端，也避免與那個條目的裸名相撞。
