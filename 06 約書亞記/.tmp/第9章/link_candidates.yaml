book: 約書亞記
chapter: 9
candidates:
- name: 約書亞
  type: 人物
  section: 人物
  evidence: |-
    第6節基遍使者到吉甲營中見他；第8節他問「你們是什麼人？是從哪裡來的？」；第15節他與他們講和、立約、容他們活著；第22節他召了他們來質問為什麼欺哄；第23節宣告他們被咒詛、作劈柴挑水的人；第26節救他們脫離以色列人的手；第27節使他們作會眾和耶和華的壇的劈柴挑水的人。CT 說第8節約書亞未求問神，而想當面查知真相。GT《聖經精讀本》說約書亞本當根據這種疑問調查出他們的真相；GT《丁道爾聖經注釋》說第14節的責備沒有特別怪罪約書亞、指責他沒有求問，但他參與了質詢的過程，因此不能完全免責；GT《綜合解讀》說正如約書亞名字的意思「耶和華是拯救」，約書亞不但救他們脫離以色列人的手，也救基遍人脫離了永遠的死亡。KC 說 Joshua is back in Gilgal, the right place. But he is not in the good mind to recognize the stratagem。BH 說約書亞沒有立刻接受他們的請求，而是要確認站在他面前的是誰、他們要什麼。
- name: 基遍
  type: 地點
  section: 地點
  evidence: |-
    全章的主角城邑，第3節「基遍的居民聽見約書亞向耶利哥和艾城所行的事」，第17節列在四座城之首。CT 原文字義給「基遍」丘陵城市，並說它位於耶路撒冷西北方約9公里，是一座大城（參書十2）。GT《啟導本》說「基遍」有「山城」的意思，位於艾城西南、在耶路撒冷西北約12公里，面積大過耶利哥和艾城（十2），城中居民為希未人、屬當滅的民族，並說自此以後基遍人在以色列人的社會中雖屬次等公民但受到保護，分地時基遍城劃歸便雅憫支派（十八25），後來成為利未人城邑（二十一17），也是歷史上一個重要的宗教中心（王上三4~5；代上十六39；代下一3）；GT《綜合解讀》說「基遍」的字義是「丘陵城市」，位於艾城西南約16公里的丘陵地帶，很可能就是以色列人的下一個目標；GT《研經資料》說基遍是現代的 el~Jib，距離耶路撒冷6.8公里；GT《丁道爾聖經注釋》說挑水這個工作尤其適合基遍人，因為當地找到山地最大的井之一，而在聯合王國時期有一個以色列的聖所相當出名，地點或在基遍或在它附近。BH 說基遍是「a great city, like one of the royal cities」，比艾城大，居民是有能力的戰士（書10:2）。
- name: 基非拉
  type: 地點
  section: 地點
  evidence: |-
    第17節「以色列人起行，第三天到了他們的城邑，就是基遍、基非拉、比錄、基列耶琳」。CT 原文字義給「基非拉」雌獅，並說以基遍為中心，其他都在方圓十公里以內的衛星城市。GT《串珠》說基非拉在基遍以西約八公里（五英里）；GT《丁道爾聖經注釋》說基非拉是 Khirbet il~Kefireh，在基遍西南西方5哩，這些遺址都在便雅憫境內；GT《聖經精讀本》說基非拉是希未族的城，分配給了便雅憫子孫；GT《研經資料》說字義是「雌獅」，在基遍西南西方8公里。BH 說基非拉、比錄與基列耶琳屬於基遍周邊的領土，四座希未城都在耶路撒冷西北的山地。
- name: 比錄
  type: 地點
  section: 地點
  evidence: |-
    第17節列為基遍聯盟四城之一。CT 原文字義給「比錄」水井。GT《研經資料》說字義是「水井」；GT《丁道爾聖經注釋》說比錄是 el~Bireh（在 Khirbet Raddana?），這些遺址都在便雅憫境內；GT《綜合解讀》說基遍人的城鎮位於耶路撒冷西北的丘陵地帶，後來被分給了便雅憫支派，掃羅的家鄉就在這一帶（代上八29~33）。BH 說比錄屬於基遍周邊的領土。
- name: 基列耶琳
  type: 地點
  section: 地點
  evidence: |-
    第17節列為基遍聯盟四城之一。CT 原文字義給「基列耶琳」森林之城，並說其中以基列耶琳比較出名（參書十八15）。GT《串珠》說基列耶琳在耶路撒冷以西約十四公里（九英里）；GT《丁道爾聖經注釋》說基列耶琳是 Tell el~Azhar，約在耶路撒冷西北8哩；GT《研經資料》說字義是「森林之城」，Tell el~Azhar，約在耶路撒冷西北13公里；GT《綜合解讀》說約櫃被非利士人歸還後，在「基列·耶琳」被保存了大約50年（撒上七1）。BH 說 Kiriath-jearim later received the ark of the covenant for many years before David brought it to Jerusalem。
- name: 希未人
  type: 歷史
  section: 歷史
  evidence: |-
    第1節列在迦南諸族之中，第7節「以色列人對這些希未人說」。CT 原文字義給「希未」村民，並說希未人相信也是含的兒子迦南的子孫中的一族（參創十17）。GT《研經資料》說「希未人」字義是「村民」，居住於迦南北方靠近黑門山之處，並說9:7 說基遍是希未人、9:1 也說希未人準備與以色列人爭戰，因此可知基遍應該是希未人的一支，而撒下21:2 說基遍是「亞摩利人」，應該是用「亞摩利人」泛指迦南人；GT《丁道爾聖經注釋》說由此或許可以推論希未人是好幾族人的泛稱、基遍人乃是其中之一，並說這個詞或許也暗示這族人的起源是在安納多利亞；GT《雷氏研讀本》說「希未人」明顯是相等於何利人（比較創三六2，20），而何利人就是在約書亞等人定居巴勒斯坦之前已經住在那裏的胡利人。BH 說基遍人是希未人，是住在迦南地的一族。
- name: 赫人
  type: 人物
  section: 人物
  evidence: |-
    第1節「就是赫人、亞摩利人、迦南人、比利洗人、希未人、耶布斯人的諸王」。CT 原文字義給「赫」恐懼、恐怖，並說赫人比亞伯拉罕較早定居於迦南地，故亞伯拉罕在他們中間算是寄居的（參創二十三3~4），他們人多勢大、擁有大片土地（參書一4）。GT《研經資料》說「赫人」是「赫的子孫」，「赫」是迦南的第二個兒子。BH 說這些民族佔據著神應許給以色列的地，他們的偶像崇拜威脅以色列的立約忠誠。
  surfaces:
  - phrase: 赫人
    verses:
    - 1
- name: 亞摩利人
  type: 人物
  section: 人物
  evidence: |-
    第1節列於迦南諸族，第10節「他向約但河東的兩個亞摩利王」。CT 原文字義給「亞摩利」山居者，並說亞摩利人是含子孫中很強大的一支（參創十16），多居住在山地。GT《研經資料》說字義是「山居者」，原居於幼發拉底河西部，後來遷徙至迦南地，並說撒下21:2 用「亞摩利人」泛指迦南人。BH 說神在約但河東擊敗西宏與噩，顯明祂在以色列進迦南之前就已賜下得勝。
- name: 迦南人
  type: 人物
  section: 人物
  evidence: |-
    第1節列於迦南諸族。CT 原文字義給「迦南」熱心的、商人，並說迦南人是以含的兒子迦南取名的一族（參創十二6），居住在迦南地西部谷地和沿海一帶。GT《研經資料》說「迦南人」指迦南地的原有居民，有時也特指佔據山谷和海岸平原的迦南地原有居民。BH 說神吩咐趕出這些民族不只是領土上的擴張，而是保護以色列不採納他們的敬拜。
- name: 比利洗人
  type: 人物
  section: 人物
  evidence: |-
    第1節列於迦南諸族。CT 原文字義給「比利洗」屬於某一村莊，並說比利洗人居住在迦南地中部，與迦南人相鄰（參創十三7）。GT《研經資料》說原意是「屬於某一村莊的人」、「鄉村人」，應該是居住城市的迦南人之外的另一個民族。
- name: 耶布斯人
  type: 人物
  section: 人物
  evidence: |-
    第1節列於迦南諸族。CT 原文字義給「耶布斯」被踐踏，並說耶布斯人也是迦南的子孫中的一族（參創十16），是耶路撒冷的原住民（參書十五63）。GT《研經資料》說耶布斯人曾經佔領耶路撒冷，原居於迦南山區，是迦南的第三個兒子的後代。BH 說耶布斯人持有耶路撒冷直到大衛攻取它。
- name: 利巴嫩
  type: 地點
  section: 地點
  evidence: |-
    第1節「並對著利巴嫩山沿大海一帶的諸王」。CT 原文字義給「利巴嫩」潔白，並說『利巴嫩山』指北部山區。GT《綜合解讀》說「對著黎巴嫩山沿大海」指地中海沿岸向北一直到黎巴嫩山區的海岸平原。BH 說 Lebanon marked the northern reaches of the land promised to Israel。
- name: 大海（地中海）
  type: 地點
  section: 地點
  evidence: |-
    第1節「沿大海一帶的諸王」。CT 說『沿大海一帶』指沿海平原。GT《研經資料》說「大海」是「偉大的」「海」（the Great Sea），這名稱通常用來專指地中海。BH 說 The Great Sea was the Mediterranean。
  surfaces:
  - phrase: 大海
    verses:
    - 1
- name: 高原（Shephelah）
  type: 地點
  section: 地點
  evidence: |-
    第1節「住山地、高原」。CT 說『高原』原文是「低地」，指介於中央山地和沿海平原之間的丘陵地帶。GT《綜合解讀》說「高原」原文是「低地」，特指中央山地和西面地中海沿岸平原之間的丘陵地帶「示非拉 Shephelah」，是後來以色列人與非利士人長期爭戰的地方；GT《研經資料》說字義是「低地」，或者是「猶大山區之西的地帶」的專有名詞。BH 說 the foothills, or Shephelah, formed the fertile transition between the mountains and the coastal plain。
  surfaces:
  - phrase: 高原
    verses:
    - 1
- name: 希實本
  type: 地點
  section: 地點
  evidence: |-
    第10節「就是希實本王西宏」。CT 原文字義給「希實本」堡壘。GT《研經資料》說字義是「堡壘」，這國位於亞嫩河與雅博河之間的約但河東，在現今約但國首都安曼之北偏西約二十公里之處。BH 說西宏拒絕以色列和平借道的請求，在雅雜與他們交戰，耶和華把得勝賜給以色列，他們奪了希實本與周圍的亞摩利城邑。
- name: 巴珊
  type: 地點
  section: 地點
  evidence: |-
    第10節「在亞斯她錄的巴珊王噩」。CT 原文字義給「巴珊」多結果實的、「噩」長頸的。GT《研經資料》說「巴珊」是「多結果實的」，位於約但河東的極北之處，涵蓋了目前的戈蘭高地，該地土壤肥沃，不但宜農也適於畜牧。BH 說噩統治強盛的北方王國，有堅固城，被列為利乏音人的餘種（申3:1-11）。
- name: 亞斯她錄
  type: 地點
  section: 地點
  evidence: |-
    第10節「在亞斯她錄的巴珊王噩」。CT 原文字義給「亞斯他錄」星辰。GT《研經資料》說字義是「星辰」，與迦南的女神同名，是約旦河東邊巴珊的一個城市，後來分給瑪拿西支派，此處指的是巴珊的首都；GT《華爾頓約書亞記背景注釋》說本節稱亞斯他錄為巴珊的首都，在同時代的埃及文獻、亞馬拿書函（提到它的統治者名叫艾亞布）和後期亞述文獻中這城都十分有名，部分學者相信烏加列某文獻提到神祇伊勒統治的所在也是這個地方，它今日稱為亞斯他拉遺址，位於雅穆克河畔、加利利海東面二十五哩左右之處。
- name: 吉甲
  type: 地點
  section: 地點
  evidence: |-
    第6節「他們到吉甲營中見約書亞」。CT 原文字義給「吉甲」滾去、滾動，並說『吉甲營』指約書亞的指揮總部所在地。GT《綜合解讀》說「他們到吉甲營中」，因為此時約櫃和約書亞的總部還在約旦河谷的吉甲；GT《研經資料》說這應該就是書5:9 約旦河旁的「吉甲」。KC 說 Joshua is back in Gilgal, the right place，但他當時的心態並不足以識破這個計謀。BH 說吉甲是以色列過約但河後的第一個營地，也是約書亞早期戰役的基地，以色列曾在那裡藉割禮與逾越節重新委身於約（書5:2-12）。
- name: 耶利哥
  type: 地點
  section: 地點
  evidence: |-
    第3節「基遍的居民聽見約書亞向耶利哥和艾城所行的事」。CT 原文字義給「耶利哥」它的月亮，並說『向耶利哥和艾城所行的事』即指殺滅全體居民、不留一個活口（參書六21；八24）。GT《綜合解讀》說基遍人「聽見」了神大能的作為，卻決定來求和；GT《研經資料》說基遍靠近耶利哥與艾城，在以色列軍隊的攻勢中必然首當其衝。BH 說耶利哥顯明耶和華有能力推倒堅固城，艾城則顯明以色列的得勝出於順服神的指示。
- name: 艾
  type: 地點
  section: 地點
  evidence: |-
    第3節「基遍的居民聽見約書亞向耶利哥和艾城所行的事」。CT 原文字義給「艾」荒場。GT《綜合解讀》說基遍位於艾城西南約16公里的丘陵地帶，比第1節那些諸王更靠近艾城，很可能就是以色列人的下一個目標；GT《雷氏研讀本》說基遍距離艾城西南面只有六英里半（10.5公里），所以它的特使必須裝作從遠方來；GT《研經資料》說當以色列人奪取中部山區的重要據點耶利哥和艾城，便將迦南一分為二，開始先南征後北戰。KC 說基遍人聽見約書亞向耶利哥和艾城所行的事，因此不尋求爭戰而訴諸欺瞞。
  surfaces:
  - 艾城
- name: 摩西
  type: 人物
  section: 人物
  evidence: |-
    第24節「耶和華─你的神曾吩咐他的僕人摩西，把這全地賜給你們，並在你們面前滅絕這地的一切居民」。CT 說神吩咐摩西的話，由摩西轉述給以色列人（參申七1~2），又傳到基遍人的耳中。BH 說基遍人承認以色列的推進是由以色列的神所指揮、根植於藉摩西所頒的命令，他們並沒有訴諸自己的神明。STEP 第24節「滅絕」是 u./le./hash.Mid（H8045，簡要詞典義 sha.mad: to destroy），與本書其他章的 cha.ram 不同字。
- name: 立約
  type: 主題
  section: 主題
  evidence: |-
    第6節「現在求你與我們立約」，第7節「怎能和你們立約呢」，第11節、第15節「與他們立約」，第16節「以色列人與他們立約之後」。STEP 第15節為 va/i.yikh.Rot ... be.Rit（H3772H，簡要詞典義 ka.rat: to cut: make(covenant)，加 H1285 be.rit: covenant）。CT 原文字義給「立約」契約、結盟，並說『立約』指訂立互不侵犯條約。GT《聖經精讀本》說「求……立約」直譯就是「切割」或「掰開」，這句話來自古代的風俗，當事者將牲畜的身體分成兩半、從中經過以示立約，這種儀式象徵若違背所立之約便就像這被掰開的牲畜一樣受死亡的懲罰，並說契約應該是立約雙方在彼此平等的條件下才得以成立，然而基遍人突然出現在以色列人面前提出單方面的要求；GT《啟導本》說依規定以色列人可以和迦南地以外民族立和約（參申二十11~15）。BH 說以誓言確認的條約在神面前有約束力，違背它就有罪責。
- name: 以色列人的怨言
  type: 歷史
  section: 歷史
  evidence: |-
    第18節「全會眾就向首領發怨言」。STEP 為 va/i.yi.Lo.nu（H3885B，簡要詞典義 lun: to grumble）。CT 原文字義給「發怨言」發牢騷、抱怨，並說『發怨言』表達不滿之心。GT《雷氏研讀本》說「發怨言」大概由於百姓不能佔領基遍人的城市和貨物；GT《研經資料》說會眾向首領發怨言的背後原因，應該不是為了他們沒詢問神導致放過迦南人，而是沒有殺迦南人就無法奪取戰利品；GT《啟導本》說以色列會眾發怨言，或為害怕未毀滅迦南人招來神的刑罰，也可能因為失去了取得掠物的機會；GT《綜合解讀》並陳兩種可能，並說百姓不應該繼續發怨言，而應當思想神允許這事發生的美意；GT《聖經精讀本》說因領袖的失策，群體內部甚至出現了混亂的徵兆。BH 說百姓的抱怨反映了以色列在曠野一再出現的不安，那時不滿常常挑戰神所設立的領導。
