- name: 迦南諸王結盟
  type: 事件
  section: 事件
  evidence: |-
    第1至2節「約但河西……諸王，聽見這事，就都聚集，同心合意的要與約書亞和以色列人爭戰」。STEP 第2節顯示「就都聚集」是 va/i.yit.ka.be.Tzu（H6908，簡要詞典義 qa.vats: to gather）加 yach.Dav（H3162B，yach.dav: together），「同心合意」則是 peh（H6310G，簡要詞典義 peh: lip，本節逐字解 mouth）加 'e.Chad（H259，e.chad: one）。CT 原文字義給「就都聚集(原文雙字)」聚集、召集（首字）；共同地、一起地（次字），給「同心合意(原文雙字)」一（首字）；口（次字），並說『同心合意』指商議後決定一致行動；CT 在話中之光說列國歷來都是爭鬥不休，只有對神的仇恨能使他們聯合起來。GT《研經資料》說「同心合意」原文是「同一個口」，並說 9:1~2 可以看作約書亞記第九章到第十一章的引言，9:1~10:43 描述南部的戰役，11:1~15 提到北部的戰役；GT《聖經精讀本》說這是迦南各族第一次締結同盟的場面，第二次同盟是以夏瑣王為中心在巴勒斯坦北部締結的（11:1~3），而他們的同盟因基遍之戰與米倫水邊之戰依次被瓦解；GT《綜合解讀》說九至十一章原文都以「聽見」（九1；十1；十一1）開始，形成一個完整的文學結構，並說迦南諸王最初「聽見」時是恐懼、心都消化了（二9；五1），現在恐懼卻變為仇恨；GT《串珠》說第1至2節是以下幾章的引言。KC 說這些彼此總是交戰的民族聚在一起「with one accord to fight with Joshua and with Israel」，並說對神與祂真理的恨意能使神一切的仇敵聯合、忘記他們的分歧與爭吵。BH 說迦南中部與南部的諸王在聽見耶利哥與艾城的消息後放下彼此的敵對。
