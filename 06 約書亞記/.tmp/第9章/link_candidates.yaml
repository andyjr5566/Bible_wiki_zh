- name: 沒有求問耶和華
  type: 主題
  section: 主題
  evidence: |-
    第14節「以色列人受了他們些食物，並沒有求問耶和華」。STEP 逐字是 ve./'Et pi Yah.weh lo' sha.'A.lu——「口」是 pi（H6310I，簡要詞典義 peh: lip: word），「求問」是 sha.'A.lu（H7592，簡要詞典義 sha.al: to ask）。CT 原文字義給「求問」詢問、要求，並說「以色列人受了他們些食物」表示願意立約，「並沒有求問耶和華」這是以色列人上當的原因，單看外表容易受騙；CT 在話中之光說人在神面前的罪有兩類，一是神發出的命令而人拒絕順服，一是神還未發令而我們就任意妄為。GT《聖經精讀本》說以色列之所以犯沒有先求問神的旨意而迅速同意立約的錯誤，是因為被艾城之戰的勝利沖昏了頭腦，並說在舊約時代尋問神旨意的方法有烏陵與土明的決斷法（出28:30；申33:8）、藉著先知求問（撒上23:2；王下8:8），以及直接向神發問（創25:22；代上14:14）；GT《丁道爾聖經注釋》說以色列人又與面對艾城時一樣，倚靠自己的看法、不尋求神的引導，因而受到欺騙，並說以色列的屬靈領袖中沒有一位想到求問神的重要性；GT《研經資料》說「受了」是「取」、「拿」，可能是嘗一嘗食物以證明是不新鮮的之意，並說作者特別提到此時以色列人沒有求問神，應該是有「責備」的意思。KC 說 The remark of the Holy Spirit “and did not ask for the counsel of the LORD” speaks volumes，並說耶利哥憑信心被攻取、艾城在除掉當滅之物後被攻取，第三座城基遍卻沒有被攻取，因為百姓沒有求問耶和華的旨意。BH 說神的百姓不會因為經驗、證據或善意就免於錯誤，除非倚靠祂的智慧。
