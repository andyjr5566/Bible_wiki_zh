- title: 摩西
  path: link_folder/人物/摩西.md
  summary: '第24節「耶和華─你的神曾吩咐他的僕人摩西，把這全地賜給你們，並在你們面前滅絕這地的一切居民，所以我們為你們的緣故甚怕喪命，就行了這事」。STEP 顯示這一節的「滅絕」是 u./le./hash.Mid（H8045，簡要詞典義 sha.mad: to destroy）。CT 說神吩咐摩西的話由摩西轉述給以色列人（參申七1~2），又傳到基遍人的耳中。BH 說基遍人承認以色列的推進是由以色列的神所指揮、根植於藉摩西所頒的命令，他們並沒有訴諸自己的神明。'
  relation: 本章只在基遍人口中提到摩西一次，但那一次很關鍵：他們害怕的不是以色列的軍隊，是摩西所領受的那道命令。摩西的話傳到了應當被滅絕的那一方耳中，而他們據此設計了保命的辦法。
  overview_review:
    signals: []
