- title: 亞斯她錄
  path: link_folder/地點/亞斯她錄.md
  summary: 第10節「在亞斯她錄的巴珊王噩」。CT 原文字義給「亞斯他錄」星辰。GT《研經資料》說字義是「星辰」，與迦南的女神同名，是約旦河東邊巴珊的一個城市、後來分給瑪拿西支派，此處指的是巴珊的首都；GT《華爾頓約書亞記背景注釋》說本節稱亞斯他錄為巴珊的首都，在同時代的埃及文獻、亞馬拿書函（提到它的統治者名叫艾亞布）和後期亞述文獻中這城都十分有名，部分學者相信烏加列某文獻提到神祇伊勒統治的所在也是這個地方，它今日稱為亞斯他拉遺址，位於雅穆克河畔、加利利海東面二十五哩左右之處。
  relation: 本章是這個城名第二次出現在本庫的累積裡，而且角色變了：先前是摩西擊殺巴珊王噩的地點，本章是基遍人引用來證明自己「從極遠之地而來」的舊聞。GT《華爾頓》在這裡補上了它在經外文獻中的知名度。
