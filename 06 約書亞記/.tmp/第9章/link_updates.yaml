- title: 耶布斯人
  path: link_folder/人物/耶布斯人.md
  summary: 第1節列於迦南諸族。CT 原文字義給「耶布斯」被踐踏，並說耶布斯人也是迦南的子孫中的一族（參創十16），是耶路撒冷的原住民（參書十五63）。GT《研經資料》說耶布斯人曾經佔領耶路撒冷，原居於迦南山區，是迦南的第三個兒子的後代。BH 說耶布斯人持有耶路撒冷直到大衛攻取它。
