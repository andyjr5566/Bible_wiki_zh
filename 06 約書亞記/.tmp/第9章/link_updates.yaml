- title: 高原（Shephelah）
  path: link_folder/地點/高原（Shephelah）.md
  summary: 第1節「約但河西，住山地、高原」。CT 說『高原』原文是「低地」，指介於中央山地和沿海平原之間的丘陵地帶。GT《綜合解讀》說「高原」原文是「低地」，特指中央山地和西面地中海沿岸平原之間的丘陵地帶「示非拉 Shephelah」，是後來以色列人與非利士人長期爭戰的地方；GT《研經資料》說字義是「低地」，或者是「猶大山區之西的地帶」的專有名詞。BH 說 the foothills, or Shephelah, formed the fertile transition between the mountains and the coastal plain。
