- title: 希實本
  path: link_folder/地點/希實本.md
  summary: 第10節「就是希實本王西宏」。CT 原文字義給「希實本」堡壘。GT《研經資料》說字義是「堡壘」，這國位於亞嫩河與雅博河之間的約但河東，在現今約但國首都安曼之北偏西約二十公里之處。BH 說西宏拒絕以色列和平借道的請求，在雅雜與他們交戰，耶和華把得勝賜給以色列，他們奪了希實本與周圍的亞摩利城邑（民21:21-31；申2:24-37）。
  relation: 本章第一次讓這個地名從戰史變成證詞：基遍人用它來說明自己「聽見」了什麼，而且刻意只提這一類舊事，不提耶利哥與艾城。
  overview_review:
