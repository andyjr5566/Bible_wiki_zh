- title: 巴珊
  path: link_folder/地點/巴珊.md
  summary: 第10節「在亞斯她錄的巴珊王噩」。CT 原文字義給「巴珊」多結果實的、「噩」長頸的。GT《研經資料》說「巴珊」是「多結果實的」，位於約但河東的極北之處，涵蓋了目前的戈蘭高地，該地土壤肥沃，不但宜農也適於畜牧。BH 說噩統治強盛的北方王國、有堅固城，被列為利乏音人的餘種（申3:1-11），以色列在以得來擊敗他並取得巴珊。
  relation: 本章只在基遍人的說詞裡出現一次。它與希實本並列，是迦南地居民口耳相傳的兩件大事——GT《串珠》說以色列人出埃及的事蹟以及他們對西宏和噩的待遇，在迦南地居民來說是耳熟能詳的事。
