- title: 咒詛（a.rar 與 qa.vav）
  path: link_folder/原文/咒詛（a.rar 與 qa.vav）.md
  summary: '第23節「現在你們是被咒詛的！你們中間的人必斷不了作奴僕，為我神的殿作劈柴挑水的人」。STEP 為 ''a.ru.Rim（H779，簡要詞典義 a.rar: to curse，Qal 被動分詞複數），同節「斷不了」是 yi.ka.Ret（H3772G，簡要詞典義 ka.rat: to cut: cut），「奴僕」是 ''E.ved（H5650，簡要詞典義 e.ved: servant/slave）。CT 原文字義給「斷」砍掉、剪除，並說『被咒詛的』指當年挪亞所說迦南當受咒詛給他弟兄作奴僕的話（參創九24~27）。GT《聖經精讀本》說從基遍人淪為以色列之奴隸的事件中可注意三個事實：他們所受的屈辱是神的咒詛（創9:25）；他們的生命得以保存是因為他們敬畏神並渴慕神的恩典；從末世論角度預表了外邦人也可以進入恩典的事實（賽66:21）；GT《綜合解讀》說「你們中間的人必斷不了作奴僕」就像利未人「散住在以色列地中」（創四十九7）一樣，都是以咒詛開始卻以祝福結局。KC 說 Joshua curses them and condemns them to do the humblest work。BH 說約書亞宣告審判臨到基遍人，因為他們以蓄意的欺騙取得了以色列的誓言，而他們的處境令人想起臨到迦南的咒詛。'
  relation: 這個字先前的累積分在民22-24（巴蘭受雇卻說不出口的咒詛）與申27-28（以色列自己站在山上領受的咒詛）。本章是第三種用法：由以色列的領袖對一群迦南人宣告，而宣告的同時也保住了他們的命。
  overview_review:
