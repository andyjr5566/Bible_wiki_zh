- title: 以色列人的怨言
  path: link_folder/歷史/以色列人的怨言.md
  summary: '第18節「因為會眾的首領已經指著耶和華─以色列的神向他們起誓，所以以色列人不擊殺他們；全會眾就向首領發怨言」。STEP 為 va/i.yi.Lo.nu（H3885B，簡要詞典義 lun: to grumble）。CT 原文字義給「發怨言」發牢騷、抱怨，並說『發怨言』表達不滿之心。GT《雷氏研讀本》說「發怨言」大概由於百姓不能佔領基遍人的城市和貨物；GT《研經資料》說背後原因應該不是為了他們沒詢問神導致放過迦南人，而是沒有殺迦南人就無法奪取戰利品；GT《啟導本》兩種都列——或為害怕未毀滅迦南人招來神的刑罰，也可能因為失去了取得掠物的機會；GT《綜合解讀》說百姓不應該繼續發怨言，而應當思想神允許這事發生的美意；GT《聖經精讀本》說因領袖的失策，群體內部甚至出現了混亂的徵兆。BH 說百姓的抱怨反映了以色列在曠野一再出現的不安，那時不滿常常挑戰神所設立的領導。'
  relation: 這是進迦南以後第一次記下的怨言，對象也換了：曠野裡的怨言多半衝著摩西與神，本章的怨言衝著會眾的首領，而且起因是首領守約而不是背約。
  overview_review:
