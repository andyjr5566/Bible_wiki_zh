- title: 立約
  path: link_folder/主題/立約.md
  summary: '第6節「現在求你與我們立約」，第7節「怎能和你們立約呢」，第11、15節「與他們立約」，第16節「以色列人與他們立約之後」。STEP 第15節為 va/i.yikh.Rot ... be.Rit（H3772H，簡要詞典義 ka.rat: to cut: make(covenant)，加 H1285 be.rit: covenant）。CT 原文字義給「立約」契約、結盟，並說『立約』指訂立互不侵犯條約。GT《聖經精讀本》說「求……立約」直譯就是「切割」或「掰開」，來自古代的風俗——當事者將牲畜的身體分成兩半、從中經過以示立約，象徵若違背所立之約便就像這被掰開的牲畜一樣受死亡的懲罰；他並說契約應該是立約雙方在彼此平等的條件下才得以成立，然而基遍人突然出現在以色列人面前提出單方面的要求；GT《啟導本》說依規定以色列人可以和迦南地以外民族立和約（參申二十11~15），但不可與迦南地的各城立約（申七1~2）。BH 說以誓言確認的條約在神面前有約束力，違背它就有罪責。'
  relation: 本章的約是被騙來的，卻仍然算數。這個條目先前收的多半是神與人立的約或人與人正當締結的約，本章給的是一個以欺騙取得、卻因為奉了耶和華的名而不能廢除的約。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
