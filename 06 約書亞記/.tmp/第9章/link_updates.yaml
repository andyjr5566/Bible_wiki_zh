    definition: keep
    development: keep
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: 第3節「基遍的居民聽見約書亞向耶利哥和艾城所行的事」。CT 原文字義給「耶利哥」它的月亮，並說『向耶利哥和艾城所行的事』即指殺滅全體居民、不留一個活口（參書六21；八24）。GT《綜合解讀》說基遍人「聽見」了神大能的作為，卻決定來求和；GT《研經資料》說基遍靠近耶利哥與艾城，在以色列軍隊的攻勢中必然首當其衝。BH 說耶利哥顯明耶和華有能力推倒堅固城，艾城則顯明以色列的得勝出於順服神的指示。KC 說基遍人聽見約書亞向耶利哥和艾城所行的事，因此不尋求爭戰而訴諸欺瞞。
  relation: 本章的耶利哥只是一個被引用的先例，而且是兩種人各自引用的先例：諸王聽見它就結盟，基遍人聽見它就求和。基遍人在自己的說詞裡卻刻意不提它——因為遠方來的人不該知道最近發生的事。
  overview_review:
    signals:
    - many_accumulations
    accumulation_count:
