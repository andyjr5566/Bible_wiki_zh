- title: 劈柴挑水的人
  path: link_folder/文化/劈柴挑水的人.md
  summary: '第21節「於是他們為全會眾作了劈柴挑水的人，正如首領對他們所說的話」，第23節「為我神的殿作劈柴挑水的人」，第27節「為會眾和耶和華的壇作劈柴挑水的人，直到今日」。STEP 為 cho.te.Vei ''e.Tzim（H2404，簡要詞典義 cha.tav: to chop，加 H6086G）與 sho.''a.vei- Ma.yim（H7579，簡要詞典義 sha.av: to draw，加 H4325G）；第23節「神的殿」是 le./Veit ''e.lo.Ha/i（H1004Q，簡要詞典義 ba.yit: house: temple）。CT 原文字義給「劈」砍伐、收集，「挑」汲取，並說『劈柴挑水』即指提供燃料柴和飲用水，又說約書亞把他們從「為全會眾作了劈柴挑水的人」具體變成了「為我神的殿作劈柴挑水的人」；CT 在話中之光說他們雖然是以色列人的僕役，但他們是屬於耶和華的自由民，因為在侍奉神中最低的職位也是自由的。GT《丁道爾聖經注釋》說這個意見顯示凡住在該地的外邦人就必須作這些事（申二十九11），雖然劈柴的斧頭可以當作武器使用（耶四十六22），不過這裡的描述意思是作和平的用途，而挑水這對基遍的居民尤其適用，因為在當地找到山地最大的井之一；GT《聖經精讀本》說事奉聖所的利未人將又累又髒的活分給基遍人來做，他們被視為是最卑賤的人（申29:10，11）；GT《綜合解讀》說「神的殿」原文是「神的家」，指會幕，「耶和華的壇」指祭壇，需要大量用以獻祭的柴和用以潔淨的水。KC 說 The Gibeonites are as slaves in the house of God, not as sons，並說他們為壇取柴、自己卻不是獻祭的人，他們打水、自己卻不是靠這水得潔淨的人。BH 說 wood supplied the altar, and water was used for washing and purification，並說他們雖領受卑微的勞役，工作卻把他們放在真神的敬拜近旁。'
  relation: 申29 的名單只寫了這個稱呼，本章寫的是這批人怎麼來的。經文在三節裡把服事對象往上推了一層：第21節「為全會眾」、第23節「為我神的殿」、第27節「為會眾和耶和華的壇」。
