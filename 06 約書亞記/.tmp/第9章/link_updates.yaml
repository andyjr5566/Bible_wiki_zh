      basis: standing_debt
- title: 艾
  path: link_folder/地點/艾.md
  summary: 第3節「基遍的居民聽見約書亞向耶利哥和艾城所行的事」。CT 原文字義給「艾」荒場。GT《綜合解讀》說基遍位於艾城西南約16公里的丘陵地帶，比第1節那些諸王更靠近艾城，很可能就是以色列人的下一個目標；GT《雷氏研讀本》說基遍距離艾城西南面只有六英里半（10.5公里），所以它的特使必須裝作從遠方來；GT《研經資料》說當以色列人奪取中部山區的重要據點耶利哥和艾城，便將迦南一分為二，開始先南征後北戰。KC 說在艾城看見的是倚靠自己的力量會有什麼結果，在基遍看見的是倚靠自己的智慧會有什麼結果。
  relation: 艾城在本章的功能是距離：因為基遍離它太近，所以基遍非得裝作從遠方來不可。KC 另把兩章接成一對——一次是力量的失敗，一次是智慧的失敗。
