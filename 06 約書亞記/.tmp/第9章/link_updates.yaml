book: 約書亞記
chapter: 9
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。正確形狀：從前幾章講起、把本章當這條線的終點或轉折點，只寫跨章之間怎麼推進；本章的細節與引句留在本章 summary，主題發展不再重述一遍。定義與主題發展裡的經文引註一律寫「書卷簡稱＋章:節」（申32:15、民35:33），不可只寫「第15節」——條目是跨書卷跨章的，裸節號無從判斷是哪一卷哪一章；逐章累積在條目裡有章號標題涵蓋，可續用「第15節」。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第6節基遍使者到吉甲營中見他；第8節他問「你們是什麼人？是從哪裡來的？」；第15節他與他們講和、立約、容他們活著；第22節召他們來質問為什麼欺哄；第23節宣告他們被咒詛、作劈柴挑水的人；第26節救他們脫離以色列人的手；第27節使他們作會眾和耶和華的壇的劈柴挑水的人。CT 說第8節約書亞未求問神，而想當面查知真相。GT《聖經精讀本》說約書亞本當根據這種疑問調查出他們的真相；GT《丁道爾聖經注釋》說第14節的責備沒有特別怪罪約書亞、指責他沒有求問，但他參與了質詢的過程，因此不能完全免責；GT《綜合解讀》說正如約書亞名字的意思「耶和華是拯救」，約書亞不但救他們脫離以色列人的手，也救基遍人脫離了永遠的死亡。KC 說 Joshua is back in Gilgal, the right place，但他當時的心態並不足以識破這個計謀。BH 說約書亞沒有立刻接受他們的請求，而是要確認站在他面前的是誰、他們要什麼。
  relation: 前兩章他是打仗的人，本章他是被騙的人，而最後救基遍人的也是他。全章他問了兩次話——第8節問來歷、第22節問為什麼欺哄，中間隔著那個沒有去求問神的決定。
  overview_review:
    signals: []
    accumulation_count:
    - 25
    - 26
    definition: keep
    development: keep
- title: 赫人
  path: link_folder/人物/赫人.md
  summary: 第1節「就是赫人、亞摩利人、迦南人、比利洗人、希未人、耶布斯人的諸王，聽見這事」。CT 原文字義給「赫」恐懼、恐怖，並說赫人比亞伯拉罕較早定居於迦南地，故亞伯拉罕在他們中間算是寄居的（參創二十三3~4），他們人多勢大、擁有大片土地（參書一4）。GT《研經資料》說「赫人」是「赫的子孫」，「赫」是迦南的第二個兒子。BH 說這些民族佔據著神應許給以色列的地，他們的偶像崇拜威脅以色列的立約忠誠，神吩咐趕出他們不只是領土上的擴張。
  relation: 本章只在第1節的名單裡出現一次，位置是聯合抵抗的一方。CT 指出這份名單少了革迦撒人，是迦南七族裡的六族。
  overview_review:
    signals: []
    accumulation_count:
    - 9
    - 10
    definition: keep
    development: keep
- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  summary: 第1節列於迦南諸族；第10節基遍人提到「他向約但河東的兩個亞摩利王，就是希實本王西宏和在亞斯她錄的巴珊王噩一切所行的事」。CT 原文字義給「亞摩利」山居者，並說亞摩利人是含子孫中很強大的一支（參創十16），多居住在山地。GT《研經資料》說字義是「山居者」，原居於幼發拉底河西部、後來遷徙至迦南地，並說撒下21:2 說基遍是「亞摩利人」，應該是用「亞摩利人」泛指迦南人。BH 說神在約但河東擊敗西宏與噩，顯明祂在以色列進迦南之前就已賜下得勝，那片被征服的地後來成了流便、迦得與瑪拿西半支派的產業。
  relation: 本章這個名字出現在兩個位置：第1節是要來打仗的一方，第10節卻是基遍人拿來當證據的舊聞。同一個民族，在同一章裡既是敵人，也是別人用來說服以色列的材料。
  overview_review:
    signals: []
    accumulation_count:
    - 17
    - 18
    definition:
      decision: keep
      basis: already_covered
      covered_by: 常作為迦南諸族的統稱
    development: keep
- title: 迦南人
  path: link_folder/人物/迦南人.md
  summary: 第1節列於迦南諸族。CT 原文字義給「迦南」熱心的、商人，並說迦南人是以含的兒子迦南取名的一族（參創十二6），居住在迦南地西部谷地和沿海一帶。GT《研經資料》說「迦南人」指迦南地的原有居民，有時也特指佔據山谷和海岸平原的迦南地原有居民。BH 說神吩咐趕出這些民族不只是領土上的擴張，而是保護以色列不採納他們的敬拜，並呼召這個民族在聖潔之神的治理下活出分別。
  relation: 本章第1節的名單是迦南諸族第一次以「聯合」的姿態出現。GT《聖經精讀本》說這是迦南各族第一次締結同盟的場面。
  overview_review:
    signals: []
    accumulation_count:
    - 14
    - 15
    definition: keep
    development: keep
