- title: 吉甲
  path: link_folder/地點/吉甲.md
  summary: 第6節「他們到吉甲營中見約書亞」。CT 原文字義給「吉甲」滾去、滾動，並說『吉甲營』指約書亞的指揮總部所在地。GT《綜合解讀》說「他們到吉甲營中」，因為此時約櫃和約書亞的總部還在約旦河谷的吉甲；GT《研經資料》說這應該就是書5:9 約旦河旁的「吉甲」。KC 說 Joshua is back in Gilgal, the right place，但他當時的心態並不足以識破這個計謀。BH 說吉甲是以色列過約但河後的第一個營地，也是約書亞早期戰役的基地，以色列曾在那裡藉割禮與逾越節重新委身於約（書5:2-12），使這地方成為全國領導與重大決定的適當中心。
  relation: 本章的談判就發生在這裡。KC 特別指出這個地點本身沒有問題——人在對的地方，判斷卻沒有跟上。
  overview_review:
    signals: []
    accumulation_count:
