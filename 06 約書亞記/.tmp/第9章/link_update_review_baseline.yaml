- title: 咒詛（a.rar 與 qa.vav）
  path: link_folder/原文/咒詛（a.rar 與 qa.vav）.md
  definition: '民數記22 章反覆出現的「咒詛」，和合本用同一個詞翻譯，原文其實是兩個不同的動詞。


    **兩個字分別在哪裡。** STEP 原文資料顯示：民22:6 巴勒託長老帶去的話「求你來為我咒詛他們」用的是 ''a.ra/h-（H779，命令式 HVqv2ms/Sh），同節「你咒詛誰，誰就受咒詛」的兩個字（ta.''Or／yu.''Ar）也都是
    H779；民22:12 神的禁令「也不可咒詛那民」同樣是 H779。而民22:11 巴蘭向神轉述時說「你來為我咒詛他們」，以及民22:17 第二批使臣帶來的話「只求你來為我咒詛這民」，用的卻是
    ka.va/h-（H6895）。STEP 給兩者的簡要義域相同：a.rar: to curse 與 qa.vav: to curse。


    **與祝福的對照。** 民22:6「你為誰祝福，誰就得福」用的是 te.va.reKh／me.vo.Rakh（H1288）；民22:12 神說「因為那民是蒙福的」也是
    H1288（va.Rukh）。也就是說，神在同一句話裡先禁止 H779 的咒詛，再宣告 H1288 的祝福，兩個對立的動作在原文裡各有其字。


    **各家怎麼理解咒詛的效力。** GT《舊約聖經背景註釋》有一整段〈民二十二6 咒詛的力量〉：「咒詛能夠將神明的怒氣召來，臨到個人、團體、城市，或地方上。」它指出咒詛有時伴隨儀式，也常與盟約條約並行；而「巴蘭記載中所反映的以色列傳統，是惟獨耶和華能夠施行咒詛，先知即使擅自行事，也不能生效」。BH
    也說，在古代近東，話語被認為有實際的力量。'
  development: '這個字在民數記與申命記走的是兩條完全相反的路線。


    **民數記：咒詛是外人買不動的東西。** 民22 到民24 的三章裡，a.rar 與 qa.vav 反覆出現在巴勒的委託與巴蘭的答覆之間，而巴蘭每一次開口都變成祝福。GT《舊約聖經背景註釋》歸納出這段記載所反映的以色列傳統：惟獨耶和華能夠施行咒詛，先知即使擅自行事，也不能生效。==在這三章裡，咒詛是一件錢請不動、人也做不到的事。==


    **申命記：咒詛變成一份要當眾念出來的清單。** 到了申27:15-26，a.rar 不再是誰想加在誰身上的話，而是十二個以它開頭的句子，由利未人高聲宣告，每一句念完，全體百姓要回答一次阿們。GT《申命記串珠聖經註釋》指出這些咒詛都是對個人的良心而發的，以色列民聚在一起，公開地裁定這些惡行的罪。


    兩處還有一個共同點：無論在民數記還是申命記，決定咒詛能不能生效的都不是說話的人。巴蘭說不出來，是因為神不許；以色列說得出口，是因為神要他們自己承認什麼是祂所不喜悅的。


    **申二十八：同一個字形，第二次全場宣告。** 申命記二十七章15至26節的十二句咒詛，每一句的第一個字都是 ''a.Rur（H779，Qal 被動分詞）；下一章的第16至19節又出現六次同樣的字形，而且這一次是與第3至6節的六次
    ba.Rukh（H1288，同樣是 Qal 被動分詞）一句對一句地並排。STEP 顯示連在句子裡的位置都相同。


    兩章的差別在誰開口、對誰說。二十七章是利未人向全體宣告、百姓逐句回答阿們，針對的是十二種具體行為；二十八章沒有應答，是摩西一口氣把福與禍都陳明，針對的是城裡、田間、身所生的、筐子、出入這些不涉及善惡判斷的生活範圍。==同一個被動分詞，在二十七章釘在人的行為上，在二十八章罩在人的處境上。==


    申命記另外還有兩個講咒詛的名詞，都出現在二十八章：第15、45節的 ha./ke.la.Lot（H7045）與第20節的 ha./me.''e.Rah（H3994）。三個字並存於同一章，而動詞形態的
    ''a.Rur 只用在那六句對稱的宣告裡。'
