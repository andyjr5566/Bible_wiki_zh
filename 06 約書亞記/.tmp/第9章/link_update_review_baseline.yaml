- title: 以色列人的怨言
  path: link_folder/歷史/以色列人的怨言.md
  definition: 出埃及記第14章 v11-12 記載以色列人在絕境中的怨言：「難道在埃及沒有墳地，你把我們帶來死在曠野嗎？你為什麼這樣待我們，將我們從埃及領出來呢？我們在埃及豈沒有對你說過，不要攪擾我們，容我們服事埃及人嗎？因為服事埃及人比死在曠野還好。」GT《中文聖經註釋》指出「這是出離埃及後，以色列人的首宗埋怨事件」——百姓忘記神在埃及所行的十災，只看眼前環境，寧願回去做奴隸也不願面對死亡。KC
    指出這是羅馬書7章的對應——信徒雖已重生，仍可能因罪的權勢而陷入絕望。
  development: '**曠野怨言的第一宗，也是往後四十年的模板。** GT《中文聖經註釋》把整條線列了出來：「這怨言，在曠野的傳統中是屢見的（參看出十五24，十六2～3，十七3等）。這些怨言，有時是出自他們中間的閒雜人（民十一4～6），有時卻是全會眾（民十四1～3，二十3～5等），有時也是個別的人（民十六12～14）。主要的埋怨，是在遇仇敵、缺飲食、道路難行和對領導人的不滿等。」它接著給出總判：「但一切的埋怨，都來自對神的缺乏信靠和太過看重環境和自身肉體的需要。」


    **「難道在埃及沒有墳地」為什麼特別刺人。** GT 丁良才《出埃及記註釋》一句話點破：「這是譏刺摩西的話，在埃及墳地本來很多。」GT《丁道爾聖經註釋》講得更完整：「反觀埃及人對陵墓異常注重，這話實在是很大的諷刺」——但它立刻補上一個保留：「鑑於當時情勢緊張，以色列人可能也不是故意語出譏諷。」丁良才另數出以色列人的三樣不善：「（一）沒有信心；（二）不知謝恩；（三）缺少膽量」，並附上一句作領袖的辛酸：「率領神的百姓，不是容易的事。」


    **他們真說過那句話嗎。** v12「我們在埃及豈沒有對你說過」查無明文。GT《中文聖經註釋》查證後說：「在整部出埃及記中，我們沒有查到有關這句話的記載。大概在五21……曾對摩西說過這樣的話。」CT
    直指言過其實：「他們雖曾因法老加重壓迫而稍埋怨過摩西（參五21），但是後來對摩西卻言聽計從（參十二27~28）。」GT《丁道爾聖經註釋》則從語言學上化解：「以色列人在埃及究竟有沒有對摩西說過這句話，並不值得辯論……在希伯來語中，『說』很多時候有『想』的意思。」


    **最扎心的平行。** GT《串珠聖經註釋》發現：「最叫人驚訝的就是百姓發怨言所用的字彙，竟與埃及人知道以色列人逃跑時所說的話（5下）極為相似；兩種人都作同一反應，皆因未能體會神的計畫。」——法老說「我們容以色列人去……這做的是什麼事呢」，百姓說「你為什麼這樣待我們，將我們從埃及領出來呢」。'
