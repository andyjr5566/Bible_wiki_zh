- title: 基利綠
  path: link_folder/地點/基利綠.md
  definition: '書18:17 便雅憫的南界「又往北通到隱示麥，達到亞都冥坡對面的基利綠；又下到流便之子波罕的磐石」。


    **名字。** STEP 把它標作 ge.li.Lot（H1553，簡要詞典義 Geliloth）。CT 和 GT《約書亞記研經資料》給的字義都是「圓圈」。CT
    說基利綠是一個地標，而不是一個城鎮，確實地點不詳。


    **和吉甲是同一處嗎。** GT《串珠聖經注釋》說基利綠可能是吉甲的別稱（參書15:7）。書15:7 猶大的北界寫的是「直向河南亞都冥坡對面的吉甲」，本節便雅憫的南界寫的是「亞都冥坡對面的基利綠」，兩段描述的是同一條界線、同一個參照點。'
