- title: 犯了罪（ma.al）
  path: link_folder/原文/犯了罪（ma.al）.md
  definition: '書7:1 的第一句話是「以色列人在當滅的物上犯了罪」。原文在這裡用了一組同字根的動詞加名詞。


    ### 原文層


    STEP 顯示這一句是 va/i.yim.''a.Lu ... Ma.''al——動詞是 H4603（簡要詞典義 ma.al: be unfaithful，本節譯義
    they acted unfaithfully），名詞是 H4604（簡要詞典義 ma.al: unfaithfulness）。


    GT《丁道爾聖經注釋》說這裡是用犯了罪的動詞字根，它的名詞總是描述對神的不忠。GT《約書亞記研經資料》和《約書亞記綜合解讀》都把它譯成「行為不忠」、「行為奸詐」；GT《約書亞記雷氏研讀本》說直譯作「破損信心」，並說亞干的行為是一種違背聖約律法的行為（書7:11）。


    ### 一個刻意的文字對比


    GT《丁道爾聖經注釋》指出：這三個希伯來字母也出現在前一節「他的聲名傳揚遍地」一語中，在那裡，希伯來文的 m、` 和 l，順序也相同，這是刻意的對比——雖然約書亞因為耶利哥而威名遠播，但以色列的不忠卻惹動了神的忿怒。GT《綜合解讀》給的說法一樣：一面是約書亞因著耶利哥的得勝聲名遠揚，一面是亞干貪戀耶利哥的戰利品惹動了神的怒氣，埋下了艾城失敗的破口。


    ### 神自己在第11節換了一組字


    書7:11 神列出五項罪：「以色列人犯了罪，違背了我所吩咐他們的約，取了當滅的物；又偷竊，又行詭詐，又把那當滅的放在他們的家具裡。」


    STEP 顯示這一節開頭改用 cha.Ta''（H2398，簡要詞典義 cha.ta: to sin），接下來連用五個 ve./Gam（H1571 gam）串起五個動作：''a.ve.Ru（H5674D，簡要詞典義
    a.var: to pass: trespass）、la.ke.Chu（H3947G la.qach）、ga.ne.Vu（H1589，簡要詞典義 ga.nav:
    to steal）、ki.cha.Shu（H3584，簡要詞典義 ka.chash: to deceive）、Sa.mu vi/kh.lei./Hem（H7760H
    加 H3627）。同一件事在神口中被拆成五層。


    ### 第15節的判詞


    書7:15 神給的定性是兩句：「因他違背了耶和華的約，又因他在以色列中行了愚妄的事。」STEP 顯示前一句是 ''a.Var ''et- be.Rit Yah.weh（H5674D，與第11節同字），後一句是
    ''a.Sah ne.va.Lah（H5039，簡要詞典義 ne.va.lah: folly，本節譯義作 disgraceful folly）。CT 的原文字義給「愚妄的事」羞恥、褻瀆的行為，並說指害己又害人的事；GT《綜合解讀》與《研經資料》都說「愚妄的事」原文是「令人感到丟臉的愚蠢」。'
