- title: 迦累得
  path: link_folder/原文/迦累得.md
  definition: '希伯來文「迦累得」（`גַּלְעֵד`，*Galeed*，H1567），為複合地名，由名詞 `גַּל`（*gal*，H1530，意為「石堆、堆」）與
    `עֵד`（*ed*，H5707，意為「見證人、見證」）組合而成，字面意為「見證的石堆」（Heap of Witness）。


    創世記 31:47-48 記載雅各與拉班在基列山立約時，雅各以希伯來語稱那石堆為「迦累得」，「因此這地方名叫迦累得」；拉班則以亞蘭語稱之為「伊迦爾撒哈杜他」（`יְגַר
    שָׂהֲדוּתָא`）。


    STEP 原文資料顯示兩種命名皆由「石堆」與「見證」複合而成。註釋家（如 GT《聖經精讀本》、《串珠》）指出，這反映了當時兩族所使用的亞蘭語與希伯來語雙語文化背景，雙方各以所使用的語言立石為證、劃定互不侵犯之邊界。'
