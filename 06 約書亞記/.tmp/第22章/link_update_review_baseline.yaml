- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  definition: BH 在出二十二20 指出「必要滅絕」背後的觀念是希伯來文的 herem——把某物分別出來歸神毀滅。GT《丁道爾聖經註釋》用同一個概念解釋本節：犯這罪的人被列為「稱聖當滅之物」，「迦南人要怎樣被以色列人殺盡，這人也要怎樣滅絕」，並在論這一組律法時說，獻祭給耶和華以外神祇的人都要「稱聖」歸作「當滅之物」，他和一切屬他的都須徹底摧毀。
  development: 'herem 在出埃及記、利未記與申命記中分別落在刑律、永獻條例和征服戰爭。出二十二20 把獻祭給別神的人列為必要滅絕；利二十七28-29
    則區分永獻之物與當滅之人，兩者都不可贖回。申二、三章記錄這個命令在西宏與噩之役中的執行，申七章再把它放進即將進入迦南、面對七族的命令中。


    申7:2 的 הַחֲרֵם／תַּחֲרִים 是動詞 H2763A，本節指徹底毀滅；申7:26 的 חֵרֶם 是名詞 H2764A，指當毀滅之物。第25至26節因此補足了物品的一面：偶像要焚燒，人也不可貪圖其上的金銀或把當毀滅之物帶進家中。動詞說明要施行的行動，名詞標明人不可據為己有的對象。


    申十三章與第二十章各補上一個新的面向。申13 第一次把 herem 用在以色列自己的一座城上——觸發條件不是族群，而是那城陷入拜偶像。申20 補的則是適用範圍的明文界線：申20:10-15
    先給「離你甚遠的各城」另一套規則，先宣告和睦的話，開城的服勞役，拒絕的才圍攻；申20:16 才用「但這些國民的城」把凡有氣息的一個不可存留限定在神賜為業的地界之內。GT《申命記背景注釋》在同一章指出，把俘虜與掠物全數奉獻給賜勝利之神祇的做法「軍事策略中十分罕見」，並列出聖經裡真正徹底摧毀一座城的少數例子——耶利哥、夏瑣、洗法與亞瑪力人。範圍與例外因此不是後人替經文加上的緩衝，而是條文自己排出來的次序。


    約書亞記把這條命令從條文變成一份執行紀錄，而紀錄本身留下了分寸。耶利哥（書6:17）、艾城（書8:26）與夏瑣（書11:12）三次都寫明有——GT《約書亞記研經資料》在書11
    把這三座城排成一張對照表，滅絕（SH 2763）那一列三城皆有，分別繫在這三處經文。但同一張表的「戰利品」一列並不一致：耶利哥是金屬器皿歸耶和華、不留牲畜（書6:19、21、24），艾城與夏瑣則都是財物、牲畜可歸己用（書8:2；書11:14）。落在人身上的處置一貫，落在物上的處置則由命令逐次指定。


    書11 另外補上一層理由。書11:20 說耶和華的意思是要使他們心裡剛硬，來與以色列人爭戰，好叫他們「盡被殺滅，不蒙憐憫」；CT 與 GT《綜合解讀》都把這一句接回創15:16——迦南人已罪惡滿盈。KC
    則列出神有權這樣審判的幾個理由，其中一個是神的寬容等候了四百年，直到亞摩利人的罪孽滿盈，並說神只在人先剛硬了自己的心之後才使他剛硬。這也使書11:19 的例外顯得格外清楚：基遍的希未人求和了，那一城就沒有落進這道命令裡。


    這幾卷共同保留了歸神與毀滅相連、當滅之物不可取回的核心；申七章同時限定其歷史處境，是以色列進入迦南時對七族、偶像崇拜與審判的命令。這項特殊命令不能被抽離處境，當成今日對異族使用暴力的常規。'
