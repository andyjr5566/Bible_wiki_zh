- title: 會幕（帳幕整體）
  path: link_folder/主題/會幕（帳幕整體）.md
  definition: 會幕是神吩咐以色列人在曠野建造、供祂住在百姓中間的可移動聖所。它由四層遮蓋（撚的細麻彩色幕幔、山羊毛罩棚、染紅的公羊皮蓋、海狗皮頂蓋）、皂莢木豎板與銀座構成的骨架、以及內幔與門簾組成；內幔把它分為聖所與至聖所兩層，外面另有露天的院子。GT《啟導本》概括了它在以色列生活中的位置：「以色列人在曠野的宗教生活是以會幕為中心的，它是耶和華的居所，是神在他們當中的象徵，摩西在這裡聽耶和華的教導，接受祂給以色列人的命令和訓誡。會幕的設計與構造反映以耶和華為唯一真神的基本信仰，以及分別為聖，以民為神子民等基本觀念。」
  development: '### 從樣式的啟示，到全營的中心


    會幕的故事分成三個階段。出26-30章是「山上樣式的啟示」——神先給藍圖；出35-40章是材料奉獻與實際建造，KC 指出金牛犢之罪並未使神收回或縮減祂的恩典，「會幕如今臨到一個跌倒的百姓中間，神照樣成就祂的旨意」；出40章立起帳幕，雲彩遮蓋、耶和華的榮光充滿，KC
    說這是「之前一切工作的最終目標——神來到祂的子民中間居住」。到民數記，會幕從「神的居所」進一步變成「全營的地理中心」：民1章開篇就是「耶和華在會幕中曉諭摩西」，GT
    丁良才列出立會幕後至數點民數之間發生的十一件事，把會幕定為神與人相會的樞紐；民2章十二支派按四方環繞會幕安營，GT《精讀本》說這象徵「神作為以色列真正的統治者，臨在於他們的生活中」；民3、4章利未三族分工看守與搬運會幕各部件，KC
    把革順、哥轄、米拉利三族的分工讀成教會事奉的圖畫——顯出基督、認識神的榮耀地位、抵禦仇敵。從一份藍圖，到全營行止的軸心，會幕沒有變，變的是以色列人的生活是不是繞著它轉。'
