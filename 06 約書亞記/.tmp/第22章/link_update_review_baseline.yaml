- title: 示羅
  path: link_folder/地點/示羅.md
  definition: '書18:1「以色列的全會眾都聚集在示羅，把會幕設立在那裡」。會幕從吉甲遷到這裡，約書亞也在這裡為其餘七個支派拈鬮分地（書18:8-10）。


    **名字。** STEP 把它標作 shi.Loh（H7887，簡要詞典義 Shiloh）。CT 與 GT《約書亞記綜合解讀》給的字義是「安歇之地」，GT《啟導本》說意為「安息」，KC
    說示羅的意思是「peace」（平安）。


    **位置。** CT 說示羅位於示劍南方約18公里、伯特利北方約15公里；GT《約書亞記雷氏研讀本》說在伯特利以北十英里（16公里）；GT《串珠聖經注釋》說在示劍以南十九公里，位於以法蓮境內。GT《綜合解讀》說它屬於以法蓮支派，位於伯特利以北、在示劍大路以東（士21:19），是迦南地的中心。GT《串珠》與《聖經精讀本》都說示羅被選中，可能因為它處於迦南地的中央，以色列百姓容易從全國各地聚集在此；GT《聖經精讀本》又說它在軍事上屬於安全地帶。


    **考古。** GT 所引《丁道爾聖經注釋》與《約書亞記研經資料》說，示羅被指認為克貝塞倫（Khirbet Seilun），挖掘者找到中銅時期的廟和晚銅時期遊牧民族的中心；根據它在鐵器時期的人口和大小，它很可以作為以色列眾支派的中心。GT《研經資料》又說考古發現此處於主前1050年被非利士人毀滅。


    **從吉甲搬到示羅。** GT《綜合解讀》說約書亞在吉甲給猶大、以法蓮和瑪拿西分了地之後，把會幕搬到示羅，在示羅繼續為其餘七個支派分地；GT《聖經精讀本》說這意味著把宗教、政治、軍事中心挪到了迦南的中心地帶。KC
    把這一步讀成從吉甲到示羅的屬靈進程：在吉甲認識肉體和對它的審判，在示羅分享神的安息。


    **神選擇立名的地方。** GT 所引《丁道爾》與《研經資料》說，會幕設立在示羅代表神應許的實現，祂要與以色列同住（利26:11-12；申12）。BH 說以色列人聚集在聖所所在的地方，是開始遵行申12:5-14
    尋求神選擇立名之處的吩咐。KC 也連到申12:5，並說示羅是要在耶路撒冷完全應驗之事的暫時應驗。


    **後來的命運。** GT《啟導本》與《綜合解讀》說，士師時代會幕一直設在示羅，到以利的時代約櫃被非利士人擄去，神「離棄示羅的帳幕」（詩78:60；耶7:12、14；26:6），會幕先後設在挪伯、基遍，直到所羅門建成聖殿。GT《啟導本》說示羅的命運說明犯罪所能招致的慘痛後果。KC
    說會幕在示羅約有三百年，神因以色列的惡離開了那裡，並引耶7:12。'
