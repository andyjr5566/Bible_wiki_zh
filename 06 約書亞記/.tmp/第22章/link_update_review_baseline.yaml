- title: 三大節期
  path: link_folder/神學/三大節期.md
  definition: 出二十三14-17 立下一年三次朝見神的規定，三個節期是除酵節、收割節、收藏節。GT《啟導本聖經腳註》指出這三個是七個節期的代表：摩西律法中所定以色列人的宗教節期共有七個（利二十三章），以其中三個為代表——除酵節和逾越節屬同一個節期，收割節包括了初熟節和七七節在內，收藏節也包括了吹角節和住棚節。
  development: 'CT 注意到守節的時間全落在收割期，因此本身就是信心的操練。GT《聖經精讀本》則說明制定節期的目的：「通過遵守節期來教訓人們，不僅過去被神救贖，而且至今仍是由於神而活著，以後還要與神同活。」KC
    也說節期使神成為他們生活的中心，別神便失去吸引力。


    ### 四卷書，四種角度


    同一組節期在摩西五經裡寫了四次，KC 把四次的角度分開比較：出埃及記二十三與三十四把節期連於約——一次是在律法之中，一次是在金牛犢之後的立約更新；利未記二十三稱它們為所定的日期，放在祭司的書裡，重點在獻祭與聖會；民數記二十八至二十九是在曠野對百姓說的，神在那裡主張自己的權利，稱這些祭物為「我的供物」；申命記十六則把節期連於神所揀選的那一個地方。按經文範圍看，出23:14-17與出34:18-24都記一年三次的節期；利23:1-44列出耶和華的節期和各日；申16:1-17則記述三個節期與朝見地點。


    申命記這一次補的是地點與態度。第16節說一年三次都要在耶和華所選擇的地方朝見他，第17節說各人要按自己的力量、照所賜的福分奉獻禮物——沒有定額。CT 在這裡另指出一個容易忽略的細節：第16節說的「除酵節」是包含逾越節在內的。


    ==四卷合起來，節期的四個面向才齊全：為什麼守（約）、怎麼守（祭司的規矩）、獻什麼（供物清單）、到哪裡守（那一個地方）。=='
