- title: 一人犯罪全營受累
  path: link_folder/神學/一人犯罪全營受累.md
  definition: '書7:1 用兩句話說同一件事：先說「以色列人在當滅的物上犯了罪」，再說「因為……亞干取了當滅的物」，最後說「耶和華的怒氣就向以色列人發作」。動手的是一個人，被追究的是整個民族。書7:11
    神再說一次：「以色列人犯了罪。」


    STEP 顯示書7:1 的末句是 va/i.yi.char- ''af Yah.weh bi/v.Nei Yis.ra.''El（H2734，簡要詞典義 cha.rah:
    to be incensed，加 H639G aph）。


    ### 各家怎麼解釋這個落差


    CT 說『向以色列人發作』是一人連累眾人，顯明屬神的人乃是一個共同體、禍福與共；它並把根據放在出19:6——在神的旨意裡，以色列是「祭司的國度、聖潔的國民」，要在地上成為神團體的見證，而亞干的犯罪使團體的見證出現了破口。


    GT《丁道爾聖經注釋》說儘管不忠的只是一人，所有以色列人卻同樣有責任，所以因著一個人的罪，所有以色列人都受到刑罰。GT《聖經精讀本──約書亞記註解》給的說法是：以色列不僅是血緣的共同體，還是共同侍奉一位神的立約共同體，因此他們全體百姓在神面前是一個整體存在，一個人便代表著整個民族。GT《約書亞記研經資料》說雖然只有亞干犯罪，但是以色列人被當成一個整體、集體承受神的憤怒，又說由這段記載可以看見罪是有牽連之力——原本艾城之得應易如反掌，可是因一人之罪竟至全軍失敗。


    KC 說原則就是我們其中一個人所做的事，對別人不會沒有後果——你不是只有自己一個人離開神的道路；它並指出這惡是在整個百姓都軟弱的時候顯出來的，哪裡有軟弱，惡就有機會，而惡一旦存在，能力就沒有了。


    BH 說雖然只有一個人犯罪，立約的百姓卻要以一個身體的身分被追究，因為以色列的得勝與安全繫於忠心的順服。


    ### 幾家同時給的界線


    講連帶責任的同時，好幾份來源都往新約接。CT 說新約信徒已經在基督裡成為一身、互相聯絡作肢體，所以對軟弱的肢體不應當指責輕視，而應當勸勉扶持，因為「若一個肢體受苦，所有的肢體就一同受苦；若一個肢體得榮耀，所有的肢體就一同快樂」（林前12:26）；GT《聖經精讀本》說所有聖徒在基督裡面是一個身體（西3:15），當與痛哭的人同哭、與喜樂的人同樂（羅12:15）；KC
    引林前5:13「Remove the wicked man from among yourselves」，說今天我們也只有照這個吩咐行，才能指望主耶穌在教會中的同在。


    另一方面，個人責任的原則沒有被取消。BH 在書7:24 下說以色列的律法同樣維持個人在神面前的責任——不可因父殺子、也不可因子殺父（申24:16）。這兩條線怎麼並存，見
    [[亞干的兒女為何同受刑罰]]。'
