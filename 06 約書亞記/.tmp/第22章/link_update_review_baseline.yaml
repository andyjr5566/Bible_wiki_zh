- title: 會眾的首領
  path: link_folder/人物/會眾的首領.md
  definition: '「會眾的首領」是約書亞記第九章裡與約書亞一同做決定、也一同承擔後果的一群人。書9:15 說「會眾的首領也向他們起誓」；書9:18 說「因為會眾的首領已經指著耶和華─以色列的神向他們起誓，所以以色列人不擊殺他們；全會眾就向首領發怨言」；書9:19、21
    都是他們對全會眾說話。


    **原文與職分。** STEP 顯示是 ne.si.''Ei ha./''e.Dah（H5387A，簡要詞典義 na.si: leader，加 H5712，簡要詞典義
    e.dah: congregation），本章共出現六次。CT 說『會眾的首領』指十二支派的首領。GT《丁道爾聖經注釋》把這個詞放回五經與約書亞記：「會眾的首領」一詞在出埃及記、民數記和約書亞記中共出現八次，他們與摩西、約書亞和大祭司一同負治理之責，作出報告，並決定全國大事。


    **他們在本章做了三件事。** 第一是起誓（書9:15），第二是承受怨言（書9:18），第三是做出最後裁決（書9:19-21）。CT 說書9:21「要容他們活著」是下達最後的決論。BH
    說眾首領以一個聲音回應，這個合一的回應承認了代表以色列所立的約不能被當作私下或隨便的協議。


    **領袖的失誤與領袖的責任。** GT《聖經精讀本──約書亞記註解》說因領袖的失策，群體內部甚至出現了混亂的徵兆，這令我們看到領袖的責任是何等重大，並說百姓在抱怨之前，當包容他們並非出自本意的過失、共同商量對付局面的對策。KC
    說得更直接：The most responsible take the lead in the error——最有責任的人帶頭犯了這個錯。BH 說他們早先未求問耶和華是不智的，但這個失誤不容許他們違背自己的話。'
