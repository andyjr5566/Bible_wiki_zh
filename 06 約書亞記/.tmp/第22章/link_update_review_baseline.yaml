- title: 巴力毘珥
  path: link_folder/背景/巴力毘珥.md
  definition: '民數記25:3、5：「以色列人與巴力毘珥連合」。這是以色列第一次直接接觸迦南的巴力崇拜。


    **這個名字怎麼構成。** GT《舊約聖經背景註釋》講得最直接：「『巴力毘珥』在原文是『毘珥之巴力』的意思」。GT《民數記串珠聖經註釋》同樣：「『巴力』意即主人，迦南各地均有自己的神」。CT
    說這是「在毗珥山上的巴力（參二十三28），巴力是迦南地居民所信奉的繁殖之神」。KC 說巴力毘珥就是毘珥山上受敬拜的地方神。


    **STEP 怎麼處理。** 第3、5節的「巴力毘珥」兩個字在 STEP 裡共用同一個 Extended Strong（H1187），簡要義域寫的就是 ba.al
    pe.or: Baal of Peor——也就是原文把它當一個完整的專有稱號。到了民25:18「毘珥的事」，「毘珥」單獨出現時換成另一個 Strong（H6465，簡要義域
    pe.or: Peor），指的是地方。


    **為什麼這一次特別嚴重。** GT《背景註釋》指出一個容易被略過的事實：「這次事件，顯然是他們第一次與迦南 * 豐饒和風雨的神祇巴力有所接觸，因為巴力一名並沒有在創世記之中出現。這次接觸以災難收場，成了神對拜偶像反應嚴厲的先例。」


    **別名與相關地名。** GT 丁良才《民數記註釋》整理過：「有時這神也稱為毗珥（18，三十一16，書二十二17），那地方也稱為伯毗珥（申三29，四46）。巴力毗珥或者也是基抹神。」GT
    收錄的李道生《舊約聖經問題總解》則簡短交代：「巴力毗珥Baalpeor系摩押人之假神，祀於毗珥山。」


    **BH 補的宗教背景。** BH 說巴力崇拜常包含豐饒儀式，與賜給以色列的律法直接對立；摩押人所拜的基抹與這類實踐往往連在一起。'
  development: '巴力毘珥在聖經裡出現三次，每一次的功能都不一樣。


    民數記25章是事件本身：「以色列人與巴力毘珥連合」，神的怒氣發作，二萬四千人死在瘟疫中。GT《背景註釋》指出這是他們第一次與迦南豐饒之神巴力接觸，也成了神對拜偶像反應嚴厲的先例。


    民數記31:16 是追究責任：摩西指出米甸婦女叫以色列人「在毘珥的事上得罪耶和華」，而這件事正是那一章出兵的原因。


    申命記4:3 則是四十年後的引用。摩西不再敘述經過，而是把它當成教材：「耶和華因巴力毘珥的事所行的，你們親眼看見了。」他要的不是資訊，是那一代人身上還在的記憶——緊接著第4節就用「專靠耶和華的今日全都存活」把生死兩邊擺明。


    一件事，三種用法：先是災難、再是判定責任、最後成了教一代新人的教材。'
