- title: 戰利品的分配辦法
  path: link_folder/主題/戰利品的分配辦法.md
  definition: '民31:25-47 是全章篇幅最長的一段，講的全是數字。分配規則只有三條：


    1. **對半分**（民31:27）：擄來的人口與牲畜分作兩半，一半歸出去打仗的一萬二千人，一半歸全會眾。

    2. **兵丁那一半，每五百取一**（民31:28-29）作貢物獻給耶和華，交給祭司以利亞撒。

    3. **會眾那一半，每五十取一**（民31:30、47）交給看守耶和華帳幕的利未人。


    | 項目 | 總數 | 兵丁一半 | 歸耶和華 | 會眾一半 | 歸利未人 |

    |---|---:|---:|---:|---:|---:|

    | 羊 | 675,000 | 337,500 | 675 | 337,500 | 6,750 |

    | 牛 | 72,000 | 36,000 | 72 | 36,000 | 720 |

    | 驢 | 61,000 | 30,500 | 61 | 30,500 | 610 |

    | 人 | 32,000 | 16,000 | 32 | 16,000 | 320 |


    （表中會眾那一半歸利未人的數字出自 GT《民數記串珠聖經註釋》與 KingComments 的整理，經文本身只在民31:47 說「無論是人口是牲畜，摩西每五十取一」。）


    **兩個比例合起來剛好對上民18。** GT 啟導本：「祭司從作戰者所得分中取五百分之一，利未人從會眾所得分中取五十分之一。祭司所得為利未人的十分之一，符合《民數記》十八26的規定。」


    **為什麼沒上戰場的也有分。** GT 丁良才：「出去打仗的，多得掠物，是應份的；在家看守的，得些掠物，也是該當的。」他並指出這成了後來的先例——約書亞吩咐河東兩支派半（書22:8），大衛也為上陣的和看守器具的定了平分的規則（撒上30:24-25）。KingComments
    說同一件事：耶和華讓每一個以色列人都能分享得勝的喜樂。


    **GT《舊約聖經背景註釋》補上古代近東的對照**：戰利品在當時是軍隊的糧餉，「古代近東視之為神聖的權利」，而神明通常也得一分，由隨軍祭司在戰場收取。'
  development: '戰利品條例在民數記與申命記處理的是兩個不同層次的問題。


    民31:25-47 回答的是分多少給誰：對半分，兵丁那一半每五百取一歸耶和華，會眾那一半每五十取一歸利未人。申20:14 回答的則是更前面一個問題——什麼情況下可以取。經文先給授權：「惟有婦女、孩子、牲畜，和城內一切的財物，你可以取為自己的掠物」，緊接著標明來源：「耶和華─你神把你仇敵的財物賜給你，你可以吃用」。


    這份授權是有範圍的。它寫在申20:10-15 那套只適用於「離你甚遠的各城」的規則裡，第16節之後的迦南城並不適用。申3:6-7 河東兩役的處置正是這種分級的實例：人盡都毀滅，牲畜與城中財物取為掠物。CT
    在申3 的話中之光把界線說得很清楚：「不是每一次爭戰得勝神都讓他們奪取財物，耶利哥的戰役，和掃羅擊打亞瑪力人，神都不許他們擄掠財物。」


    古代近東的背景在兩卷各出現一次，說法一致。GT《舊約聖經背景註釋》在民31 說戰利品是軍隊的糧餉，「古代近東視之為神聖的權利」，而神明通常也得一分，由隨軍祭司在戰場收取；GT《申命記背景注釋》在申20
    說得更細：「古代近東的標準慣例是不發給士兵糧餉，而從攻取村鎮的戰利品中分配一部分給他們。由於戰爭被視作神明所下達，有其輔助的使命，戰爭所有的掠物依法來說，都是神明分別為聖的財產。」放在這個背景裡，申20:14
    那句「耶和華─你神把你仇敵的財物賜給你」就不只是安慰的話，而是所有權的宣告——先確定財物是誰給的，民31 那套分配比例才有立足點。'
