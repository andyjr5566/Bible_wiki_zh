"book": "約書亞記"
"chapter": !!int "6"
"review_schema_version": !!int "2"
"review_baseline": "link_update_review_baseline.yaml"
"review_guidance":
  "review_input": "判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章\
    \ summary／relation 與既有內容一起判斷。"
  "review_evidence": "review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代\
    \ already_covered 的逐字舉證。"
  "definition": "定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。"
  "development": "主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation\
    \ 換句話說後貼進來。正確形狀：從前幾章講起、把本章當這條線的終點或轉折點，只寫跨章之間怎麼推進；本章的細節與引句留在本章 summary，主題發展不再重述一遍。定義與主題發展裡的經文引註一律寫「書卷簡稱＋章:節」（申32:15、民35:33），不可只寫「第15節」——條目是跨書卷跨章的，裸節號無從判斷是哪一卷哪一章；逐章累積在條目裡有章號標題涵蓋，可續用「第15節」。"
  "accumulation": "逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。"
  "decision_rule": "每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部\
    \ keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。"
  "keep_basis": "definition 可用 no_identity_change／already_covered／insufficient_evidence；development\
    \ 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有\
    \ challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是\
    \ already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json\
    \ 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。"
  "signals": "first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達\
    \ 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。"
"updates":
- "title": "直到今日"
  "path": "link_folder/主題/直到今日.md"
  "summary": "第25節「他就住在以色列中，直到今日」。STEP 為 'ad hai./Yom ha./Zeh（H5704 加 H3117L yom 加 H2088 zeh）。GT《研經資料》說這句話很有意思，因為它說明了在這事件發生之後不久，便開始紀錄約書亞記這卷書中的事蹟，所以作者還看到喇合活在以色列人當中；GT《串珠》說這表明喇合在以色列人中定居下來。GT《綜合解讀》說她全家先被安置在以色列的營外、可能是行潔淨禮（民31:19），然後被接納成為屬神的百姓。BH 說喇合後來「lived in Israel to this day」（直到今日住在以色列中），預表信主的外邦人被聚集進神的百姓。"
  "relation": "書4 的「直到今日」指向一堆石頭，本章指向一個人。被定為當滅之城的居民，到作者寫書的時候還活在以色列人中間，這句話替喇合得救作了見證。"
  "overview_review":
    "signals":
    - "many_accumulations"
    "accumulation_count":
    - !!int "6"
    - !!int "7"
    "definition": "keep"
    "development":
      "decision": "update"
      "synthesis_scope":
      - "約書亞記:4"
      - "約書亞記:6"
      - "約書亞記:7"
      - "約書亞記:10"
      - "約書亞記:14"
      - "約書亞記:15"
      - "約書亞記:16"
