- title: 帶兵器（cha.lats）
  path: link_folder/原文/帶兵器（cha.lats）.md
  summary: '第7節「帶兵器的要走在耶和華的約櫃前」，第9、13節重述隊形。STEP 為 ve./He./cha.Lutz（H2502B，簡要詞典義 cha.lats: to arm）——與書4:13「都準備打仗」同一個字根，而與書1:14、書4:12 的 cha.mush（H2571）不同。CT 說『帶兵器的』指戰士，前隊的戰士走在約櫃前、另有後隊隨在約櫃的後面，並說『後隊』指後衛部隊。GT《研經資料》說約書亞按神的吩咐作出部署：帶兵器的戰士走在最前面，七個拿羊角的祭司跟著，祭司後面是約櫃，最後是百姓的隊伍。BH 說以色列的兵丁各就各位，顯示順服並沒有取消人有紀律的行動，但軍隊是在神的命令之下行軍，不是照一般攻城戰法。'
  relation: 這是這個字第一次寫的不是承諾而是實況：他們真的列陣走在約櫃前面，而且整整六天沒有出手。
