- title: 神的同在
  path: link_folder/神學/神的同在.md
  summary: '第27節「耶和華與約書亞同在，約書亞的聲名傳揚遍地」，STEP 為 va/y.Hi Yah.weh ''et- ye.ho.Shu.a''（H854 et，簡要詞典義 with）加 sha.me.''/O be./khol ha./''A.retz（H8089，簡要詞典義 sho.ma: report）。CT 說『傳揚遍地』指傳遍迦南地。KC 說約書亞的成功不在於他傑出的軍事領導，而在於耶和華與他同在，正如聖經也這樣寫約瑟（創39:2、21），並說沒有什麼比「神與他同在」這個確據更能高舉一個人。BH 說耶和華成就了祂在書1:5 對約書亞的應許，而約書亞的名聲成為耶和華聖潔與大能的見證。'
  relation: 前面幾章的同在是應許與記號，本章它成了戰果——一座城倒了，然後外邦人開始傳說這個人的名字。
