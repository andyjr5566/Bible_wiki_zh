- title: 約櫃
  path: link_folder/主題/約櫃.md
  summary: 第4、6、7、8、9、11、12、13節。STEP 第4節為 li/f.Nei ha./'a.Ron（H727 a.ron），第7節為 li/f.Nei 'a.Ron Yah.weh。CT 說吹角的祭司和約櫃位於隊伍的中心，約櫃成了隊伍的中心（參民10:14-28）；GT《串珠》說「在耶和華面前」即在約櫃前，因約櫃象徵神的同在（民10:35-36；撒下6:14）；GT《綜合解讀》說遊行的隊伍以約櫃為中心、一半在約櫃之前一半在約櫃之後，就像他們在曠野中行軍的隊形一樣，並說自從百姓在西奈山與神立約之後，約櫃就開始帶領他們前行；GT《研經資料》說抬約櫃繞城是因為約櫃象徵神的同在，如同書3:6 過約旦河。KC 說重點不在百姓而在約櫃，百姓一切的力量只在約櫃那裡找得到。CT 在話中之光提醒：約櫃是死的，神才是活的，約櫃只不過是一件帶著預表作用的事物。
  relation: 本章的隊形把約櫃放在正中間，前後各有一半人。攻城的方法沒有任何攻擊動作，唯一持續在動的，是一個被抬著的櫃子。
