- title: 安息日
  path: link_folder/神學/安息日.md
  summary: 第15節「第七日清早，黎明的時候，他們起來，照樣繞城七次」。CT 說據推算這日是安息日，本來安息日不可作工（申16:8），出門遠行就是作工，但所謂「不作工」乃是指「不辦自己的私事，不隨自己的私意，不說自己的私話」（賽58:13），若遵照神的吩咐作工、例如祭司在安息日獻祭則是可以的（太12:5）；GT《綜合解讀》說以色列人繞城的第七日是無酵節的第七日，也就是安息日、嚴肅會、「不可做工」（申16:8），並給出與 CT 相同的分辨，又說耶利哥繞城一圈約600米、所以第七日一天就可以繞七次。
  relation: 這一天百姓走了七圈路，兩份來源都認為那是安息日，也都用同一個理由說明這不算違例：作的是神吩咐的事，不是自己的事。
