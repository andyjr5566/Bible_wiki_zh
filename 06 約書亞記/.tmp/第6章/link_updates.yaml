- title: 迦南滅絕命令的歷史範圍
  path: link_folder/解經爭議/迦南滅絕命令的歷史範圍.md
  summary: 第17至19節與第21節把滅絕命令實際執行在第一座城上，而各家在同一章裡討論了它的範圍。GT《啟導本》說在以後的迦南戰役中，神只禁止以色列人保存城中人口（書8:26-27；申7:1-3），牲畜和財物可當作戰利品取為己有；GT《綜合解讀》說在以後的迦南戰役中神只要求以色列消滅城中人口（書8:26；申7:2），而牲畜和財物可以作為戰利品留下（書8:27）；GT《研經資料》把這個不一致明白寫出來——「雖然我們不能明白為什麼神前後的要求不一致」——並列出神在毀滅耶利哥前曾容許以色列人掠奪後歸自己所有（申2:35）、在耶利哥之後也可以拿取財物（書8:27、書11:14）的例子，推測神要整個耶利哥全部獻給耶和華有可能是把這城當作初熟果子的記號。它另列出神滅絕命令的兩個可能用意：迦南人拜偶像的習俗會妨礙以色列對耶和華的信心（申20:17-18），以及仇敵的擄物有時是要獻給耶和華作祭祀用途而不是佔為己有（民18:14；結44:29）。
  relation: 本章是這道命令第一次落在一座具體的城上，而各家都注意到它與後來幾場戰役的規格並不相同——範圍的問題是從這個落差長出來的。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 2
