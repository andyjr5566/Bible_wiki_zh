- title: 禧年（第五十年）
  path: link_folder/原文/禧年（第五十年）.md
  summary: '第4、5節的「羊角」，STEP 為 shof.Rot hai./yov.Lim 與 be./Ke.ren hai./yo.Vel——H3104 的簡要詞典義正是 yo.vel: jubilee/horn，H7161A 是 qe.ren（horn）。KC 說這些號角是公羊角做的，而公羊角宣告禧年，禧年是第五十年、奴僕得釋放、地業歸回原主（利25:8-13），用這種角攻取耶利哥顯示這件事與其說是軍事的、不如說是宗教的，這一點也從祭司在此比戰士更重要看得出來。GT《啟導本》把第七日繞城七次、吹長號、大聲呼喊連到《利未記》第七個安息年的禧年，號角長鳴，宣告自由，土地贖回，各歸本家（利25:8-10）。BH 說公羊角標誌聖日、宣告禧年（利25:9），也在爭戰時召集以色列（士3:27）。'
  relation: 禧年的號角在利未記是宣告土地歸還的，在本章卻用來攻一座城——而以色列正是來取回神所應許的地。這個雙關是 KC 與 GT《啟導本》各自指出來的。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
