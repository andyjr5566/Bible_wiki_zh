- title: 古代近東的圍城戰與營壘
  path: link_folder/背景/古代近東的圍城戰與營壘.md
  summary: 第3至5節神給的攻城法完全不是當時的常規。GT《研經資料》列出耶利哥城難以攻下的原因——一般城堡的結構和修築方式會使敵人不容易採取直接攻擊的戰略，而合理攻佔耶利哥城的方式是圍城，但以色列人沒有時間採用這樣的方式；它據此說以色列人並不是藉著人的技巧攻佔城池，而是藉著神的大能才拿下耶利哥城。GT《啟導本》說以此城的防禦工事之堅固，只長於遊牧的以色列人是難攻破的。BH 說神吩咐以色列以順服的信心面對這座設防的城，而不是用一般的圍城戰法。KC 說本章沒有拔出一把刀，並引林後10:4 說我們爭戰的兵器本不是屬血氣的。
  relation: 這一章是把常規攻城法整套換掉的例子：沒有雲梯、沒有撞城錘、沒有斷糧圍困，而各家都是拿當時的常規來對照，才看出這方法有多不尋常。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 喇合
  path: link_folder/人物/喇合.md
  summary: '第17節「只有妓女喇合與他家中所有的可以存活，因為他隱藏了我們所打發的使者」，第22至25節記兩個探子把她全家帶出來、安置在以色列的營外，第25節說「他就住在以色列中，直到今日」。STEP 第17節為 ra.Chav ha./zo.Nah（H7343 加 H2181，簡要詞典義 za.nah: to fornicate）加 hech.be.''A.tah（H2244，簡要詞典義 cha.va: to hide，Hiphil）加 ha./mal.''a.Khim（H4397G，簡要詞典義 ma.le.akh: messenger）。CT 說『安置在以色列的營外』出於禮儀上不潔的理由、須在營外經過潔淨的手續，並說她後來成了探子之一撒門的妻子、有分於主耶穌的家譜（太1:5）；GT《丁道爾聖經注釋》說在喇合的故事中動詞「隱藏」只出現了一次、就是書2:16，而這裡卻用這個字描述她保護探子、誤導王的使者一事；GT《聖經精讀本》說她以這種方式徹底離棄外邦人的生活方式並成為以色列百姓的一員，這表明以色列並不是完全封閉的社會。KC 說喇合沒有與不信的人一同滅亡，因為她信了（來11:31），她的房子是唯一逃脫這城審判的安全地方。BH 說窗上的朱紅線繩標明了受保護的房子，讓人想起逾越節時塗血的以色列家。'
  relation: 書2 是她做的事，本章是那件事的結果：全城毀滅，只有她一家從裡面被帶出來，而經文說她就住在以色列中直到今日。
