- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  summary: '第17節「這城和其中所有的都要在耶和華面前毀滅」、第18節「不可取那當滅的物」、第21節「都用刀殺盡」。STEP 第17節為 Che.rem（H2764A，簡要詞典義 che.rem: devoted thing）。CT 原文字義給「毀滅」(要毀滅的)禁忌物、「當滅」完全毀壞，並說指必須毀滅或用來奉獻給神的人和物、嚴禁挪做私用；GT《雷氏研讀本》說希伯來文是 herem，指「取締、消滅、奉獻」，有歸屬於一位神的意思；GT《綜合解讀》說第17節的「毀滅」和第18節的「當滅」原文是同一個字，與申20:17 神命令的「滅絕淨盡」是同一個詞，並說第18節「使全營受咒詛」原文是「使以色列營成為當滅的物」；GT《串珠》說原文這字在民18:14 譯作「永獻的」；GT《研經資料》說第17節毀滅、第18節那當滅的物與咒詛都是同一個字，並說神要求以色列將所有耶利哥人與財物都毀滅、有如獻上祭物給神一樣。BH 說耶利哥被置於 herem 之下，作為完全屬神的獻上。'
  relation: 這是 herem 在約書亞記的第一次實際執行。前面幾卷它是條例，本章它是一整座城的處置方式，而第18節的警告也在同一段裡預告了艾城之敗的原因。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
