    definition: keep
    development: keep
- title: 建在城牆上的房子
  path: link_folder/文化/建在城牆上的房子.md
  summary: 第20節城牆塌陷，第22至23節兩個探子卻進得了喇合的家把她全家帶出來。GT《雷氏研讀本》說喇合房子所在的城牆並沒有倒塌；GT《啟導本》說耶利哥城牆高約9公尺，城牆應聲倒塌，但建在城牆上喇合的房子無恙，全家和「一切的親眷」都獲救；GT《串珠》說喇合的房子雖在城牆上，但由於神的保守，顯然並沒有像城牆其他部分那樣倒塌下來；GT《研經資料》說聖經並沒有特別說明或記載喇合的家如何得救，有學者認為這完全是神的保守，如同出9:26 神降冰雹在埃及人身上時、居住歌珊的以色列人那邊卻沒有下。CT 說耶利哥城牆約有十公尺高、且是雙重城牆，若非神的作為不容易多處塌陷，而妓女喇合的家所在的城牆卻完好無恙。KC 說喇合房子所在的那一段城牆被存留下來。
  relation: 書2 這個建築細節是探子的出路，本章它變成一個例外：整道城牆倒了，只有那一段沒有倒。
