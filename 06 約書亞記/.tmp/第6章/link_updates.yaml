    - 8
    definition: keep
    development: keep
- title: 初熟果子
  path: link_folder/神學/初熟果子.md
  summary: 第17、24節耶利哥全城要在耶和華面前毀滅、只有金銀銅鐵入庫。CT 說耶利哥是第一座攻占的迦南城邑，視同出熟的果子、全然奉獻給神；GT《聖經精讀本》說耶利哥城之所以在神面前毀滅，是因為它是迦南地的第一個被征服地（利27:26；民18:12）；GT《綜合解讀》說這表示耶利哥城作為迦南地初熟的果子必須完全奉獻給神（申26:10），並說在以後的迦南戰役中神只要求消滅城中人口而牲畜和財物可以作為戰利品留下（書8:27）；GT《研經資料》說神要整個耶利哥全部獻給耶和華，有可能是將這個城市當作初熟果子的記號；GT《雷氏研讀本》說耶利哥城完全奉獻給神作為迦南地初熟的果子，百姓不能從其中拿去任何戰利品。BH 說耶利哥作為以色列產業的初熟果子完全屬於耶和華。
  relation: 初熟的規矩本來收的是農產，本章第一次用在一座城上——而正因為第一份要全歸神，第18節才會有「不可取那當滅的物」這道警告。
