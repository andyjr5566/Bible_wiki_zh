  definition: 出二十二29「你要從你莊稼中的穀和酒醡中滴出來的酒拿來獻上，不可遲延」。CT 給「莊稼中的穀」的原文字義是「充滿，盛產」、「酒醡中滴出來的酒」是「汁（酒或油）」、「遲延」是「延遲，延緩，滯留」。GT《丁道爾聖經註釋》指出原文只有兩個名詞：直譯是「你的豐滿和你的湧流」，「因為『豐滿』通常用作形容酒，『湧流』（直譯是『流淚』）的大抵是橄欖油」。
