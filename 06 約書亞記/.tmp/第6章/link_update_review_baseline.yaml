- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  definition: '民數記22:1 以色列人在摩押平原安營，「對著耶利哥」。這是耶利哥在民數記裡第一次出現，此時它還隔著約但河，在河的西面。


    **位置關係。** CT 說得很清楚：「『耶利哥』耶利哥平原就在摩押平原的對面，中間隔著約但河，即約但河的西面。」


    **它有多老。** BH 指出耶利哥是世上最古老的有人居住城市之一，位置緊鄰約但河，具戰略地位。


    **它預示了什麼。** BH 說這裡提到耶利哥，是為接下來征服迦南預作伏筆——以色列繞城七日、城牆倒塌那一戰就從這裡開始；同時也點出以色列進入應許之地要面對的軍事難度。CT
    給的原文字義是「它的月亮」。'
  development: '### 從對岸的座標，到踏進去的第一座城


    民數記與申命記提到耶利哥，幾乎都是拿它當方位參照：民22:1 以色列人在摩押平原、約但河東「對著耶利哥」安營，民26:3、63 數點百姓的地點是「與耶利哥相對的約但河邊」，民33、34、35、36
    反覆用同一個座標定位；申34:1、3 摩西在尼波山觀看全地，看見的其中一段是「棕樹城耶利哥的平原」。這幾章的共同點是：它一直在河的另一邊。


    書2 是它第一次成為行動的目標。書2:1 約書亞吩咐探子「你們去窺探那地和耶利哥」，GT《約書亞記綜合解讀》說原文是「窺探那地，特別是耶利哥」。從這一節起，耶利哥不再只是標定以色列位置的參照物，而是必須先攻下的第一道門。


    各家對它為什麼重要說得一致。GT《綜合解讀》說它扼守約旦河谷和中央山地之間的東西戰略要道，因有泉水灌溉，自古就是兵家必爭之地；GT《串珠》說當地氣候和土質適宜農耕，它是人類最早築有城牆的城市之一，又位處東西南北大道的交匯點；GT《啟導本》說它築有堅固工事，易守難攻，兼之水泉豐富、物產茂盛。GT《研經資料》另給出高度：海平面以下250公尺，是全世界最低的城市。


    ==進到城裡的卻只有兩個人，而且他們什麼城防資料都沒帶回來。==書2:24 他們向約書亞報的只有一句話：那地的一切居民在我們面前心都消化了。


    書3 與書4 把這條線再推近一步。書3:16 百姓「在耶利哥的對面過去了」，書4:13 那批帶兵器的人「到耶利哥的平原，等候上陣」，書4:19 全營就在「耶利哥的東邊」紮下。從民數記那個「對著耶利哥」到這裡，方位詞沒有變，站的位置卻已經換到河的西岸。GT《約書亞記研經資料》在書4:19
    補上一個規模上的參考：當時的耶利哥城估計有1500到2000居民；而 BH 說它的堅固城牆是以色列進入迦南中部要面對的第一道大障礙。'
