- title: 禧年（第五十年）
  path: link_folder/原文/禧年（第五十年）.md
  definition: '利未記25章的「禧年」在原文是 יוֹבֵל（yo.vel）。STEP語言資料給的詞典義是 jubilee／horn——同一個字既指這個年份，也指那支角。


    **這個字在本章出現 14 次**，是全章密度最高的名詞。BH 說明字源：「『Jubilee』這個詞來自希伯來文 yobel，意思是公羊角，用來宣告這一年的開始。」CT
    的說法相同：「『禧年（Jubilee）』在希伯來文，原為『公羊角』，或『吹角』的意思，表示歡樂或節慶。」GT 精讀本也從詞源入手：「『禧年』意為『公羊角』。從吹公羊角宣告禧年的開始而得的名稱。」


    **第五十年到底是哪一年，有兩種算法。** 丁良才把兩派並陳：一派認為第四十九年是安息年、第五十年才是禧年，所以這兩年連著都不能種地——「猶太人的傳說和約瑟夫的史記都以這解法為是」；另一派認為第七個安息年本身就算禧年，即上一週期的末年同時是下一週期的第一年。丁良才判定後一種與
    v18-22 的意思不合。CT 的立場相同：「『第五十年』應當是指第七個安息年的次年，猶太歷史學家約瑟夫也同意這個解釋。」


    **KC 從「第五十」這個數字讀出新起頭**：禧年跟在第四十九年這個安息年之後，「第五十年因此也標示著一個新的開始，就像第八日跟在七天之後一樣」，而這個新開始同時關乎天上與永恆的事。


    **它在舊約其他地方幾乎不出現。** KC：「除了利未記這裡以外，『禧年』這個詞只在民數記出現過（民36:4）。」


    **禧年與安息年的分工，KC 分得最清楚**：「安息年說到安息（來4:9），禧年說到復興（徒3:21）與自由（羅8:21）。」'
  development: '禧年這個字後來成了先知語言的一部分。GT 啟導本列出它的三個別名及出處：「自由之年」（結46:17）、「救贖之年」（賽63:4）、「耶和華的恩年」（賽61:2）。


    KC 把整條線收在一句話裡：「神的話中一切關於以色列的、一切預言，最終都歸到禧年。神一切應許的最終成就就在那裡。」而路加福音4:19、21 記主耶穌在拿撒勒讀了以賽亞書61
    那一段並說「今天這經應驗在你們耳中了」——KC 由此指出對已經接受主耶穌的人，這「恩年」已經開始。


    丁良才的時間軸相同但分兩層：禧年預表「神悅納人的禧年」（從耶穌降世為人到二次再來），也預表「主耶穌二次再來，萬物復興的時候」。'
