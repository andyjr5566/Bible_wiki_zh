- title: 迦南滅絕命令的歷史範圍
  path: link_folder/解經爭議/迦南滅絕命令的歷史範圍.md
  definition: '本條目處理申命記七章的滅絕命令應按甚麼歷史範圍理解。經文明確設定了對象與場景：以色列將要進入應許之地，面對赫人等七族；命令包括不可立約、不可結親，並要拆毀祭壇、柱像、木偶和雕刻的偶像。三至五節說明信仰上的危險，迦南人的婚姻與宗教生活可能使以色列轉去事奉別神；十六節和二十五至二十六節又以網羅、神像及當毀滅之物重申同一危險。二十二節同時說列國要漸漸被趕出，以免土地荒置後野獸增多，因此全章把徹底毀滅的用語與實際進程中的逐步趕出一同保留下來。

    STEP 顯示，七章2節的 הַחֲרֵ֤ם 與 תַּחֲרִים֙ 屬 H2763A，context gloss 分別表達確實要完全毀滅，以及你要完全毀滅；詞元
    חָרַם（cha.ram）的詞典義域是 to devote/destroy。七章26節兩次出現 חֵ֖רֶם／חֵ֥רֶם，transliteration
    為 Che.rem，屬 H2764A，形態標記 HNcmsa，context gloss 是 an object for destruction；詞典把 חֵ֫רֶם（che.rem）說明為
    devoted thing。這些資料確認二節使用動詞命令，二十六節使用指向當毀滅之物的名詞，也提供奉獻歸於毀滅這一可能義域。詞形與詞典資料負責說明語言現象；命令的歷史對象、原因與適用範圍仍由整章經文及註釋脈絡判斷。

    逐節註解把命令放在清除偶像、使百姓分別歸神的脈絡中。拾穗說明這項禁令關乎迦南人的罪與信仰腐敗，也指出以色列若犯同樣的罪，同樣會受從地上除滅的刑罰；它對禁婚的說明也以宗教影響為理由。KingComments
    把以色列視為執行特定審判的一方，並明確區分今日教會的處境：信徒應向未信者施恩行善。BibleHub Study 也把這道嚴厲命令限定於迦南征服在救贖歷史中的特殊位置，沒有把它列為歷代普遍行為原則。這些來源共同要求讀者按申命記七章所指的土地、七族、偶像崇拜及審判場景理解命令；它不能成為今日對其他民族或未信者施暴的常規授權。'
  development: 拾穗、KingComments 與 BibleHub Study 都用創世記十五章16節的罪孽滿盈背景說明審判並非突然出現。申命記七章隨後把審判命令交給即將進入迦南的以色列，也警告百姓若轉向同樣的偶像崇拜，自己會落在神的審判下。這條跨章線索把長久容忍、迦南審判與以色列自身的約責任連起來，顯示神的公義標準不以民族優越為依據。
