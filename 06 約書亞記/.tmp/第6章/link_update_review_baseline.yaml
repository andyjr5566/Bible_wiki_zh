- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  definition: BH 在出二十二20 指出「必要滅絕」背後的觀念是希伯來文的 herem——把某物分別出來歸神毀滅。GT《丁道爾聖經註釋》用同一個概念解釋本節：犯這罪的人被列為「稱聖當滅之物」，「迦南人要怎樣被以色列人殺盡，這人也要怎樣滅絕」，並在論這一組律法時說，獻祭給耶和華以外神祇的人都要「稱聖」歸作「當滅之物」，他和一切屬他的都須徹底摧毀。
  development: 'herem 在出埃及記、利未記與申命記中分別落在刑律、永獻條例和征服戰爭。出二十二20 把獻祭給別神的人列為必要滅絕；利二十七28-29
    則區分永獻之物與當滅之人，兩者都不可贖回。申二、三章記錄這個命令在西宏與噩之役中的執行，申七章再把它放進即將進入迦南、面對七族的命令中。


    申7:2 的 הַחֲרֵם／תַּחֲרִים 是動詞 H2763A，本節指徹底毀滅；申7:26 的 חֵרֶם 是名詞 H2764A，指當毀滅之物。第25至26節因此補足了物品的一面：偶像要焚燒，人也不可貪圖其上的金銀或把當毀滅之物帶進家中。動詞說明要施行的行動，名詞標明人不可據為己有的對象。


    申十三章與第二十章各補上一個新的面向。申13 第一次把 herem 用在以色列自己的一座城上——觸發條件不是族群，而是那城陷入拜偶像。申20 補的則是適用範圍的明文界線：第10至15節先給「離你甚遠的各城」另一套規則，先宣告和睦的話，開城的服勞役，拒絕的才圍攻；第16節才用「但這些國民的城」把凡有氣息的一個不可存留限定在神賜為業的地界之內。GT《申命記背景注釋》在同一章指出，把俘虜與掠物全數奉獻給賜勝利之神祇的做法「軍事策略中十分罕見」，並列出聖經裡真正徹底摧毀一座城的少數例子——耶利哥、夏瑣、洗法與亞瑪力人。範圍與例外因此不是後人替經文加上的緩衝，而是條文自己排出來的次序。


    這幾卷共同保留了歸神與毀滅相連、當滅之物不可取回的核心；申七章同時限定其歷史處境，是以色列進入迦南時對七族、偶像崇拜與審判的命令。這項特殊命令不能被抽離處境，當成今日對異族使用暴力的常規。'
