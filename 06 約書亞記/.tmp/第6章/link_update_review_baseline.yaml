- title: 吹角的日子（te.ru.'Ah）
  path: link_folder/原文/吹角的日子（te.ru.'Ah）.md
  definition: '民29:1 給七月初一起的名字是「吹角的日子」。STEP 顯示這個名字在原文只有兩個字：H3117G Yom（日子）加 H8643 te.ru.''Ah（陰性單數名詞），本節譯義是「[the]
    sound of a loud blast」，brief lexicon 作 shout（呼喊、大聲）。本節的字表裡沒有任何樂器名稱，字面就是大聲呼喊的日子。


    **同一個字在民數記還出現三次，用途完全不同。** 民10:5-6 是拔營的號令，配動詞 H8628 ta.qa（吹）：「吹出大聲的時候，東邊安的營都要起行。」民23:21
    是巴蘭看見的營中歡呼：「有歡呼王的聲音在他們中間。」民31:6 是出戰的號令：非尼哈「手裡拿著聖所的器皿和吹大聲的號筒」。行軍、敬拜、爭戰、過節共用同一個
    te.ru.''Ah。


    **吹的到底是什麼，註釋家各有說法。** CT 說「吹角的用意是宣告喜樂的消息，號召四散的以色列人聚集」；GT《民數記串珠聖經註釋》說「此日吹角是宣告快樂的日子臨到（10:10），百姓當守聖會」；GT《舊約聖經背景註釋》直接說是公綿羊的角；GT
    丁良才則記下當日兩種聲音都有——「有猶太的注釋家說，當那一日，除了祭司所吹的銀號筒以外，有百姓從日出到日落吹角。」'
