- title: 耶利哥王
  path: link_folder/人物/耶利哥王.md
  definition: '書2:2 有人把探子的行蹤報給耶利哥王，書2:3 他隨即打發人去見喇合要人。他在本章只出場這一次，卻帶出迦南當時的政治結構。


    ### 他管的是一座城，不是一個國


    GT《約書亞記雷氏研讀本》講得最短：他只是耶利哥城邦的首領，而不是整個地區的領袖。GT《啟導本聖經約書亞記註釋》說迦南地分佈有許多大小城邦，每城有王統治，所以這裡稱「耶利哥王」。GT《約書亞記綜合解讀》補上細節：古代迦南並不是一個統一的國家，而是由許多自治的城邦組成，每個城邦包括一個設防城和周圍的農田、鄉村，擁有獨立的首領和軍隊，有時成為埃及法老的藩屬。GT《研經資料》說西元前十四世紀的亞馬拿泥版也證實當時的確是這樣的狀況。


    GT《聖經精讀本──約書亞記註解》從埃及那一面說明：在征服迦南時，西部巴勒斯坦處於埃及的統治之下，但埃及的王權未能對此地區行使實際上的權威，因此在迦南地形成了以民族為單位的諸城邦，各自具備著自律性的統治體制。CT
    則把他放進全書的名單裡：迦南地三十一王之一（參書12:9）。


    ### 他的反應


    書2:2 報信的話是「今夜有以色列人來到這裡窺探此地」，書2:3 他要喇合把人交出來，理由是「他們來窺探全地」。CT 由此推論探子的身分暴露，可能是因為他們的衣著和口音不同於當地人；他又從書2:5
    喇合的話推斷，從探子暴露身分到王派人捉拿，中間隔了一段不短的時間。


    GT《綜合解讀》說他們已經知道以色列人要來，所以嚴陣以待。BH 說他的迅速反應顯示耶利哥已經得知以色列臨近，並把這座城視為面對真正的威脅；BH 也指出這場追捕說明喇合的保護帶著實在的人身風險。


    ### KC 的預表讀法


    KC 把迦南諸王，包括耶利哥王，讀成鬼魔的圖畫：他們恨神也恨神的使者，耶利哥王要殺探子就顯出這一點。他同時說，住在迦南的人並不都是鬼魔的圖畫，許多人只是被鬼魔的權勢所奴役，喇合就是這樣的人——對她有盼望，對鬼魔沒有。這是
    KC 的解讀進路，本章經文只記下他派人搜捕。'
