- title: 亞倫和他兒子（祭司）
  path: link_folder/人物/亞倫和他兒子（祭司）.md
  definition: 亞倫是以色列首任大祭司，他的四個兒子亦被設立為祭司，形成世世代代繼承的祭司體系（出28:1）。出29 記載他們承接聖職的全禮——洗身、穿聖衣、受膏、獻贖罪祭與燔祭、獻承接聖職之祭，連續七天；出30
    記載他們每日早晚在金香壇上燒香、在銅洗濯盆洗手洗腳以免死亡；出40 與利8-9 則是這套禮儀的實際執行。GT《舊約背景註釋》說明父子之間的層級差別：「亞倫的兒子在父親手下作為次一等的祭司，祭服沒有亞倫的那麼華麗。他們責任的重要性不及大祭司，故此，服飾雖使他們有別於其他以色列人，分別為聖的典禮卻沒有這麼繁複。」GT
    引丁良才則從預表讀這對父子：「亞倫預表基督，他的兒子預表信徒（彼前2:9）。」
  development: '### 從一場就職禮，到一個橫跨三卷書的職分


    **出埃及記給的是任命與規格。** 出29 是承接聖職的全禮——洗身、穿聖衣、獻贖罪祭與燔祭、再獻承接聖職之祭，血抹右耳垂、右手大拇指、右腳大拇指，歷時七天。出30
    加上每日的職責：早晚在金香壇燒香點燈、進會幕或就近壇前必先在銅洗濯盆洗手洗腳「免得死亡」、受聖膏油膏抹。出40 是實際執行的吩咐。


    **利未記把他們放進日常運作。** 利1-3 先劃出一條分工線：宰殺祭牲是獻祭者的事，奉血、灑血、燒脂油是祭司的事。利5-7 補上祭司在五祭中該做什麼、該得什麼——估價、取紀念份、吃剩餘的細麵，以及本章（利6）與利7
    明訂的「分」：皮、烤製的素祭餅、搖祭的胸、舉祭的腿。利8-9 是出29 那套禮儀第一次真的舉行，亞倫的兒子在利9 首次以助手身分接血遞祭牲。


    **接著職分的內容從獻祭擴大到判斷。** 利11 起，神開始同時對摩西和亞倫說話：食物潔淨條例（利11）、皮膚病與衣物黴斑的診斷（利13-14）、漏症的潔淨（利15）、私宰祭牲的血（利17）、吃聖物的資格與祭牲的品質（利22）、初熟節與五旬節的搖祭（利23）、陳設餅（利24）。祭司不再只是「在壇前工作的人」，而是全民生活中辨別潔淨與不潔淨的權柄。


    **民數記則講代價。** 民18 把責任與供養並排：他們要擔當干犯聖所的罪孽，凡挨近的外人必被治死；作為交換，一切至聖之物歸他們，而且「你在以色列人的境內不可有產業……我就是你的分，是你的產業」。祭司這一族沒有地，祭壇就是他們的產業。


    GT 引丁良才把這對父子讀成預表：「亞倫預表基督，他的兒子預表信徒（彼前2:9）。」GT《舊約背景註釋》則指出父子之間確有層級——亞倫的兒子「在父親手下作為次一等的祭司，祭服沒有亞倫的那麼華麗……分別為聖的典禮卻沒有這麼繁複」。'
