- title: 基列亞巴
  path: link_folder/地點/基列亞巴.md
  definition: 基列亞巴是希伯崙的古稱，創世記23章稱撒拉死在迦南地的基列亞巴，就是希伯崙；創世記35章也說雅各到基列亞巴的幔利，基列亞巴就是希伯崙。字義各家說法相近而不完全相同：CT
    註為「四方城，偉人之城」，GT《舊約背景註釋》譯作「四之村」，BH 則說此名來自亞巴——「亞衲族中最偉大的人」。「同盟、友誼」是希伯崙的字義，不是基列亞巴的。
  development: '### 「四」與「偉人」


    三份來源的說法可以合起來看：CT 的「四方城，偉人之城」正好把兩個成分都收了進去；GT《舊約背景註釋》取「四」，並猜測它可能指四個村落聯合而成的城鎮，或是幾條大道在此交會；BH
    取「偉人」，說此名來自亞巴，是亞衲族中最偉大的人。


    背景註釋同時為兩名並存給了通則：地名會隨著新人種進入一個地區、或發生值得用新名紀念的事件而改變（如代上十一4 的耶布斯與耶路撒冷、創二十八19 的路斯與伯特利），而希伯崙與基列亞巴之間的關係「並不清楚」。


