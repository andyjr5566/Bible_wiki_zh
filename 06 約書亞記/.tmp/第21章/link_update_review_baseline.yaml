- title: 立拿
  path: link_folder/地點/立拿.md
  definition: '立拿是書10 南征清單的第二座城（書10:29-30），後來又成為書10:39 處置底璧時的參照點：約書亞待底璧和底璧王，像從前待希伯崙和立拿與立拿王一樣。


    ### 名字與位置


    CT 的原文字義給「立拿」鋪過的道路，並說立拿位於亞西加的西面約6公里。GT《串珠聖經注釋》說立拿在亞西加以西約六公里（四英里）。


    遺址有兩種說法。GT《約書亞記研經資料》說可能是 Tell es~SaFi，幾乎是拉吉正北、相距約11公里；這個地方接連猶大高地和非利士平原，十字軍給這地方的名字作
    Blanchegarde、顯示這處地方的獨特性，而在它與平原相距19公里的另一邊便是亞實突，可見其位置的重要性。GT《華爾頓約書亞記背景注釋》則說立拿通常被考證為位於澤塔幹河（Wadi
    Zeita）畔的博納特遺址（Tell Bornat），其位置是把守希伯崙前往海岸最佳路線的戰略性地點，這遺址雖未有挖掘、勘測卻發現了一些晚銅器時代和鐵器時代的文物；此外亦有其他學者認為東面五哩、拉吉東北九哩外的貝達丘廢墟（Khirbet
    Tell el~Beida）才是立拿的遺址。


    ### 後來的立拿


    BH 說立拿位於示非拉，也就是猶大山地與地中海平原之間的低地區域，攻下它有助於鞏固以色列在南迦南的位置；又說立拿後來成為猶大境內的利未人城邑（書21:13），把這地的軍事征服與日後的敬拜和律法教導連在一起。'
