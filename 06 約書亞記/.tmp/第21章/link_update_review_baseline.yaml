- title: 伯示麥（猶大）
  path: link_folder/地點/伯示麥（猶大）.md
  definition: '書15:10 猶大的北界從耶琳山「又下到伯示麥過亭納」。名字後面加上（猶大），是因為 GT《綜合解讀》指出以薩迦（書19:22）和拿弗他利（書19:38）也各有一座伯示麥。


    **名字與位置。** CT 與 GT《約書亞記研經資料》給的字義都是「太陽之家」，CT 說它位於耶路撒冷西方約24公里、希伯崙西北約27公里。GT《綜合解讀》說它位於耶路撒冷到沿海平原的路上，靠近非利士人之地；並說「伯示麥」的意思是「太陽神之家」，這個名字的城市之多，表明迦南地的太陽神崇拜很普遍。GT《串珠聖經注釋》說它在書19:41
