- title: 拉末
  path: link_folder/地點/拉末.md
  definition: '拉末是申命記4:43 分給迦得人的逃城：「為迦得人分定基列的拉末」。


    **名字與詞形。** CT〔原文字義〕：「拉末」高度。STEP 原文資料顯示是 ra.Mot（H7216H），簡要詞典義即專名 Ramoth；所在地「基列」是
    ba./gil.''Ad（H1568G）。


    **位置與地區特色。** CT 指出「迦得人所得地業在河東的中部」，並把拉末的細節指向約書亞記21:38。


    BH 補上這一帶的兩件事：「Gilead was a fertile region known for its balm, a healing ointment,
    which is referenced in Jeremiah 8:22.」（基列是一片肥沃的地區，以它的乳香著稱，那是一種療傷的膏，耶利米書8:22 有提到。）以及「The
    Gadites were known as fierce warriors, and their territory was often a site of
    conflict due to its strategic importance. The city of Ramoth is mentioned in several
    biblical battles, highlighting its significance.」（迦得人以驍勇著稱，他們的地界因位置關鍵而常成為衝突之地。拉末這座城在聖經數場戰役中被提到，可見其重要性。）


    **它在三城裡居中。** 比悉在最南、哥蘭在最北，拉末落在基列，正好是河東的中段。'
  development: '拉末在申4:43 和書20:8 都是「基列的拉末」，兩次都是迦得的逃城。CT 在申4 說迦得的地業在河東的中部，在書20 給了位置：以得來西南方約11公里、伯珊東方約51公里；GT《串珠》說在亞斯她錄以南約卅六公里，GT《約書亞記研經資料》說在雅穆河附近，但詳細地點並不確定。


    BH 在申4 說拉末在聖經數場戰役中被提到，到書20 它點明其中一場：拉末後來成為以色列與亞蘭爭戰的戰略城市（王上22:3-4）。一座逃城後來也是戰場。'
