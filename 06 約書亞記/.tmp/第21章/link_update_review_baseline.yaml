- title: 郊野（mig.rash）
  path: link_folder/原文/郊野（mig.rash）.md
  definition: '民數記35章給利未人的不只是城，還有城四圍的一圈地。和合本譯作「郊野」，本章出現五次（民35:2-5、7）。


    **這個字指的是牧草地，不是農田。** STEP 原文資料顯示原文是 mig.Rash（H4054，民35:4 作 u./mig.re.Shei），簡要詞典義是
    pasture（牧場）。CT 的原文字義給的是「空地」。KingComments 據此說明它的用途：這片地是給利未人的牲畜用的，不是給他們耕種的——他們不需要撒種收割，只需要有欄圈；神藉著別人勞碌所出的十分之一供養他們的生活，好讓他們能專心研讀律法並教導神的百姓。


    **尺寸有兩個數字，各家的讀法不同。** 民35:4 說「從城根起，四圍往外量一千肘」，民35:5 卻說東南西北各量二千肘。


    | 節次 | 數字 | 各家的解釋 |

    |---|---|---|

    | 民35:4 | 一千肘 | CT：大約折合450公尺，供建倉房和牲畜欄圈 |

    | 民35:5 | 二千肘 | CT：大約折合900公尺，供設墳地、花園、葡萄園、田園等其他用途 |


    GT《民數記串珠聖經註釋》則把兩個數字讀成同一張圖的兩種量法：城在正中，從城牆往外一千肘，因此整條邊長是二千肘，並附了一張示意圖，換算是一肘等於零點四五公尺（十八英寸）。GT《聖經精讀本》給的數字略有出入：「一肘是約45.6釐米,二千肘是912米」，並提醒不要因此覺得利未人的城太小——「像耶路撒冷一樣的大城在王國時代以前,不過有4046.8平方米的面積」。BibleHub
    Study 也採一肘約十八英寸／四十五公分、一千肘約四百五十公尺。


    **「城根」原文就是「牆」。** STEP 原文資料顯示民35:4「從城根起」是 mi./Kir（H7023），簡要詞典義是 wall；CT 的原文字義給「牆，邊」，文意註解說是「城牆的邊緣」。BibleHub
    Study 由此推論這些城是設防的城。


    **民35:3 的「財物」可能是譯文多出來的。** GT《民數記串珠聖經註釋》註明：民35:3 的「牛，羊，牲畜，財物」應作「牛群，羊群，牲畜」，原文並無「財物」。


    GT《舊約聖經背景註釋》補上一層習俗背景：按照美索不達米亞和敘利亞的慣例，指定的城市也附有屬於王室的草場；本章特別規定必須要有牧草，「可能表示儀式所用的祭牲，是在此飼養的」。KingComments
    另注意到這片地的大小其實也限定了利未人的家業規模——他們永遠不會成為擁有大群牲畜的大地主，神給祂僕人的是工作所需，不是財富。'
  development: 'mig.rash 在民35 和書14 各出現一次，兩次都和利未人的城連在一起。民35:2-5、7 五次說要把城四圍的郊野給利未人，STEP
    顯示簡要詞典義是 pasture，CT 把一千肘、二千肘換算成具體的範圍；書14:4 再說利未人得「城邑居住，並城邑的郊野，可以牧養他們的牲畜」，STEP
    標的是同一個字。


    BH 在書14 說，這些城周圍的草場為利未人的家庭和牲畜提供實際的供應。民35 給的是尺寸，書14 說的是用途：沒有地業的支派，靠城外這一圈牧草地養牲畜。'
