- title: 以法蓮山地
  path: link_folder/地點/以法蓮山地.md
  definition: '書17:15 約書亞對約瑟的子孫說：「你們如果族大人多，嫌以法蓮山地窄小，就可以上比利洗人、利乏音人之地，在樹林中砍伐樹木。」以法蓮山地是迦南中部的山區，約瑟的子孫就在迦南中部分得遼闊的土地。


    **範圍。** CT 說以法蓮山地是迦南地中部地區的通稱，東面從約但河，西面至地中海，南面從伯特利，北面至米吉多平原。STEP 把「以法蓮山地」標作 har-
    ''ef.Ra.yim（H2022H，簡要詞典義 mountain: hill country；H669G，Ephraim）。


    **有樹林的山地。** 書17:18 約書亞又說「山地也要歸你，雖是樹林，你也可以砍伐」。GT《約書亞記綜合解讀》說約瑟家的兩個支派都沒有記錄很多城邑，可能因為當時這裡大部分是森林，城市很少。GT《串珠聖經注釋》說約書亞鼓勵他們砍伐法蓮山西北的樹林區來擴張土地。BH
    說中央山地是以法蓮重要的家鄉；它地勢高，提供保護與戰略上的優勢，山谷與山坡也能養活日漸增多的人口。


    **嫌它窄小。** 書17:16 約瑟的子孫回答：「那山地容不下我們」。BH 說約書亞沒有否認他們的需要，而是要他們去得那些還沒開發、還有爭奪的地；KC 說他們嫌樹林讓那裡無法居住，約書亞卻指出，只要肯出力，就可以把樹砍掉。'
  development: '以法蓮山地在書17 是約瑟的子孫嫌窄小的地方，「那山地容不下我們」（書17:16），約書亞要他們砍伐樹林去得；到書19:50，約書亞自己所求的亭拿西拉城就在這片山地裡。


    KC 把兩章接在一起：約書亞求的城在山地，正是他同時代的人不願意住的地方（書17:15-16），他用自己的選擇給他們立了好榜樣。BH 在書19 說約書亞屬以法蓮支派，他的產業就在這片崎嶇的中部山地，靠近會幕所在的示羅。'
