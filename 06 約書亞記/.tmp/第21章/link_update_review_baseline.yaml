- title: 哥轄子孫
  path: link_folder/人物/哥轄子孫.md
  definition: 哥轄（Kohath，意為「集會」）為利未次子，其子孫在利未三大家族中處於首要與特出的地位（CT、GT）。哥轄子孫在會幕曠野行軍與搬運事工中，專責搬運至聖所與聖所內的「至聖之物」（包括約櫃、陳設餅桌子、金燈臺、金香壇、銅壇及其屬壇器具與聖所器皿）（v4-14）。摩西與亞倫亦出自哥轄家族，因而此族在事奉上享有最崇高與神聖的職責（GT）。然而，哥轄子孫在搬運至聖物時，嚴禁親自觸摸或觀看未包紮的聖物，違者必遭擊殺（v15,
    20）；必須等候亞倫及其兒子（祭司）先將聖物以幔子、海狗皮與各式顏色毯子完全包裹後，方能扛抬移動（CT、KC）。
