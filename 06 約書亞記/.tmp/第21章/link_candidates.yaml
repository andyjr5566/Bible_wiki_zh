- name: "利未人的四十八座城"
  type: "主題"
  evidence: "第1-42節利未人的眾族長在示羅求城，以色列人照耶和華藉摩西所吩咐的，從自己的地業中給了利未人四十八座城和郊野；CT：十二支派分成四組，各負責利未人的一組；GT《研經資料》《綜合解讀》《聖經精讀本》：散居全地，沒有人住在離利未人的城十六公里以外，把律法的教導帶到各處；GT《綜合解讀》：拿哈拉、他納、利合、基色後來沒有攻取，這個奉獻並不徹底；KC：四十八座中六座是逃城，其餘四十二是七乘六，最後的數目與代上6 不完全相符；BH：雅各說利未要分散在以色列中，神把分散轉為祝福"
- name: "郊野（mig.rash）"
  type: "原文"
  evidence: "第2-42節每座城都「和屬城的郊野」；STEP u./mig.re.shei./Hen（H4054，mig.rash: pasture）；CT：屬城的郊野指從城根起四圍往外量三千肘（民35:4-5），屬城的田地和村莊指三千肘以外；GT《研經資料》：原文是「共用土地」「空地」，1000肘大約445公尺；GT《聖經精讀本》：以各城為中心前後左右各加912米；BH：郊野供應利未人的牲畜與家用，卻不給他們大片農地"
