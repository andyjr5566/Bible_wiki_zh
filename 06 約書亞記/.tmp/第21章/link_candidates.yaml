  evidence: "第24節「迦特臨門和屬城的郊野」給了哥轄其餘的子孫，書19:45 列在但的城邑；STEP gat- ri.Mon（H1667G）；CT：字義「石榴的酒醡」，在約帕東北方約7公里半，原屬但支派（書19:45）；GT 華爾頓、《研經資料》：與阿布澤通遺址、哲裡舍遺址有關，在特拉維夫附近、接近雅康河，可能是杜得模斯三世名單的 knt 迦特或亞馬拿版片的吉蒂臨蒙尼；BH：字義 winepress of the pomegranate，位在面對非利士壓力的西邊"
