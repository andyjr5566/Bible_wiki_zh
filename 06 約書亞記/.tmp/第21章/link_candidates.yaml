- name: "神的應許應驗"
  type: "神學"
  evidence: "第43-45節耶和華將向列祖起誓所應許的全地賜給以色列人，應許賜福的話一句也沒有落空，都應驗了；STEP 第45節「落空」是 na.Fal（H5307L，to fall: fail），「應驗」是 Ba'（H935G，to come）；CT：不僅全般概略地應驗，每一細節也都照著神所說的話正確地應驗；GT《雷氏研讀本》《啟導本》、CT：以色列人雖未完全征服，神已告訴他們要逐漸佔據（申7:22）；GT《綜合解讀》：這句話是根據利未人也得了安居之地；GT《聖經精讀本》：為13-21章下了最終的結論；KC：這是神從創12:7 對亞伯拉罕開始的美好應許；BH：雖然經過數百年，神的話沒有落空"
  surfaces:
  - phrase: "都應驗了"
    verses: [45]
- name: "安息"
  type: "神學"
  evidence: "第44節「使他們四境平安」；STEP va/i.Ya.nach（H5117，nu.ach: to rest）；GT《綜合解讀》：「平安」原文是「安息」，定居迦南就是進入安息，但不是沒有仇敵（來4:8）；GT《聖經精讀本》：神曾應許要將平安賜給以色列（出33:14；申3:20；25:19），最終極的含義是進入基督裡的永恆天國；KC：書11:23、14:15、21:44 三次安息，本章最深，在神自己的同在中；來4:8 約書亞並沒有叫他們享安息；BH：指向來4:9-10 的安息"
  surfaces:
  - phrase: "四境平安"
    verses: [44]
- name: "未得之地"
  type: "主題"
  evidence: "第43-44節耶和華將全地賜給以色列人，一切仇敵都交在他們手中；CT、GT《雷氏研讀本》《啟導本》：以色列人雖未完全征服迦南全地，神已告訴他們要逐漸佔據（申7:22）；GT《綜合解讀》：雖然迦南人還佔著未得之地，土地的使用權已屬以色列人；GT《串珠》思想題：44節與13:13、15:63、16:10、17:12-13 有沒有矛盾；KC：百姓還沒勝過所有的敵人，但已經掌控全地；GT《綜合解讀》：拿哈拉、他納、利合、基色的奉獻並不徹底"
