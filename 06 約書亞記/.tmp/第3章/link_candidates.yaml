book: 約書亞記
chapter: 3
candidates:
- name: 約書亞
  type: 人物
  section: 人物
  evidence: 第1節「約書亞清早起來」，STEP 為 va/i.yash.Kem ba./Bo.ker（H7925 sha.kham 加 H1242 bo.qer）；第5、6、9、10節他先後吩咐百姓自潔、吩咐祭司抬約櫃、召百姓近前來聽神的話；第7節耶和華對他說「從今日起，我必使你在以色列眾人眼前尊大」。
- name: 摩西
  type: 人物
  section: 人物
  evidence: 第7節「使他們知道我怎樣與摩西同在，也必照樣與你同在」。本章只在這一節提到摩西，卻是全章的對照基準。
- name: 什亭（亞伯什亭）
  type: 地點
  section: 地點
  evidence: 第1節「和以色列眾人都離開什亭，來到約但河」。GT《綜合解讀》說以色列人自從在摩西的領導下擊敗西宏和噩之後，就一直紮營在摩押平原的什亭；GT《研經資料》說什亭距離約旦河還有8到9公里。
- name: 約但河
  type: 地點
  section: 地點
  evidence: '本章的主場景，第1、8、11、13、14、15、16、17節反覆出現。第15節「原來約但河水在收割的日子漲過兩岸」，STEP 為 ma.Le'' ''al- kol- ge.do.Ta/v（H4390 加 H1415 ga.dah: bank）加 kol ye.Mei ka.Tzir（H7105A qa.tsir: harvest）。'
- name: 以色列人的官長
  type: 人物
  section: 人物
  evidence: 第2節「過了三天，官長走遍營中」，第3節他們把跟隨約櫃的指示傳給百姓。BH 說官長把約書亞的指示帶遍各支派，確保每一家都知道約櫃移動時該怎麼反應。
- name: 約櫃
  type: 主題
  section: 主題
  evidence: 第3、6、8、11、13、14、15、17節。STEP 為 'a.Ron ha./be.Rit（H727 a.ron 加 H1285 be.rit）。KC 說約櫃在這裡佔中心位置，並說在書3-4 兩章裡約櫃被提到十六次。CT 說約櫃是神與百姓同住的記號；GT《啟導本》說約櫃是神的座位，約櫃先行表示神的同在與引導。
- name: 自潔
  type: 神學
  section: 神學
  evidence: 第5節「你們要自潔，因為明天耶和華必在你們中間行奇事」，STEP 為 hit.ka.Da.shu（H6942G qa.dash，Hithpael 命令式）加 nif.la.'ot（H6381 pa.la）。CT 說自潔包括沐浴、洗衣、不親近婦女等（參出十九10）；GT《丁道爾》把它連到西乃山的潔淨（出19:10-15）；GT《研經資料》說原文是「分別出來奉為神聖」。
- name: 耶和華永生神
  type: 神學
  section: 神學
  evidence: 第10節「因此你們就知道在你們中間有永生神」，STEP 為 'el chai（H410G el 加 H2416A chay）。CT 說『永生神』意指祂是又真又活的神，是生命的源頭；GT《聖經精讀本》說永生神指神是生命的源頭；BH 說永生神不像迦南無能的偶像，祂實際掌管受造、帶領祂的百姓。
- name: 迦南人
  type: 人物
  section: 人物
  evidence: 第10節七族名單之首，STEP 為 ha./ke.na.'a.Ni（H3669A）。CT 說迦南人是以含的兒子迦南取名的一族，居住在迦南地西部谷地和沿海一帶；GT《研經資料》說有時也特指佔據山谷和海岸平原的迦南地原有居民。
- name: 赫人
  type: 人物
  section: 人物
  evidence: 第10節七族名單，STEP 為 ha./chi.Ti（H2850）。CT 說他們比亞伯拉罕較早定居於迦南地，人多勢大，擁有大片土地（參書一4）。
- name: 希未人
  type: 歷史
  section: 歷史
  evidence: 第10節七族名單，STEP 為 ha./chi.Vi（H2340）。CT 說相信也是含的兒子迦南的子孫中的一族；GT《研經資料》說字義是「村民」，居住於迦南北方靠近黑門山之處。
- name: 比利洗人
  type: 人物
  section: 人物
  evidence: 第10節七族名單，STEP 為 ha./pe.ri.Zi（H6522）。CT 說是居住在迦南地中部的一族，與迦南人相鄰；GT《研經資料》說原意是「屬於某一村莊的人」、「鄉村人」。
- name: 革迦撒人
  type: 人物
  section: 人物
  evidence: 第10節七族名單，STEP 為 ha./gir.ga.Shi（H1622）。GT《研經資料》說目前學界對革迦撒人所知甚少，但烏加列文獻證實了他們的存在。
- name: 亞摩利人
  type: 人物
  section: 人物
  evidence: 第10節七族名單，STEP 為 ve./ha./'e.mo.Ri（H567）。GT《串珠》說亞摩利人有時候為迦南人之統稱，有時候指住山地的迦南人；GT《研經資料》說字義是「山居者」，原居於幼發拉底河西部，後來遷徙至迦南地。
- name: 耶布斯人
  type: 人物
  section: 人物
  evidence: 第10節七族名單之末，STEP 為 ve./ha/y.vu.Si（H2983G）。CT 說也是迦南的子孫中的一族，是耶路撒冷的原住民（參書十五63）。
- name: 迦南七族（迦南地原住民）
  type: 背景
  section: 背景
  evidence: 第10節一口氣列出迦南人、赫人、希未人、比利洗人、革迦撒人、亞摩利人、耶布斯人七族。GT《研經資料》說這份名單與摩西五經一再出現的名單相似，其中迦南、赫人、亞摩利人三個有相當多的文獻紀錄佐證，比利洗人、希未人、耶布斯人則沒有在聖經以外的文獻出現過。KC 說這七族代表惡的完全。
- name: 為業（ye.ru.shah）
  type: 原文
  section: 原文
  evidence: '第10節「他必在你們面前趕出迦南人」，STEP 為 ve./ho.Resh yo.Rish（H3423H，簡要詞典義 ya.rash: to possess: take，Hiphil 不定詞獨立式加未完成式）。同一個字根在書1:11、15 用來說以色列「得」那地，本節則用使役語態說神「趕出」原住民。'
  surfaces:
  - 趕出
- name: 鹽海
  type: 地點
  section: 地點
  evidence: 第16節「那往亞拉巴的海，就是鹽海，下流的水全然斷絕」。CT 說『那往亞拉巴的海，就是鹽海』亦即流往死海；GT《丁道爾》說亞拉巴的海（鹽海）乃是死海，在亞當城以南十八英哩。
- name: 亞拉巴
  type: 地點
  section: 地點
  evidence: 第16節「那往亞拉巴的海」。CT 原文字義給「亞拉巴」沙漠曠野；GT《研經資料》說字義是「荒野」，「亞拉巴的海」就是「死海」。
- name: 耶利哥
  type: 地點
  section: 地點
  evidence: 第16節「於是百姓在耶利哥的對面過去了」。GT《研經資料》說水立起成壘之處於亞當城距離耶利哥二十九公里，而約旦河終點死海距離耶利哥九公里，這三十八公里的河道都乾掉了。
- name: 紅海分開
  type: 歷史
  section: 歷史
  evidence: 第16節「立起成壘」與出15:8 大水直立如「壘」原文同一個字（GT《綜合解讀》），第17節「乾地」與出14:21 神使紅海成了「乾地」也是同一個字（STEP 為 be./cha.ra.Vah，H2724）。GT《綜合解讀》說約書亞特意把過約旦河與過紅海的神跡相提並論（書4:23）；BH 與 KC 也都把兩次分水並列。
- name: 雲柱火柱
  type: 歷史
  section: 歷史
  evidence: GT《約書亞記綜合解讀》說在曠野裡神「夜間在火柱裡，日間在雲柱裡」（申一33）指示百姓所當行的路，如今在即將過約旦河的時候，神卻讓百姓從跟隨雲柱、火柱變成「跟著約櫃去」（3節）；BH 也說約櫃走在以色列前面，正如雲柱火柱曾在曠野引導這個國家。
- name: 神的同在
  type: 神學
  section: 神學
  evidence: 第7節「使他們知道我怎樣與摩西同在，也必照樣與你同在」，STEP 為 ha.Yi.ti 'im- mo.Sheh / 'eh.Yeh 'i.Ma/kh（H5973A im）。BH 說約書亞的果效繫於耶和華的同在，而不是軍事才能或天賦；GT《綜合解讀》說神施行過約旦河神跡的目的之一，是要借著顯明神與約書亞的同在，建立他在神百姓中的權柄。
  surfaces:
  - 與你同在
- name: 三日之內與差派探子的先後之爭
  type: 解經爭議
  section: 解經爭議
  evidence: 第2節「過了三天，官長走遍營中」。GT《綜合解讀》說「過了三天」可能就是兩個探子窺探耶利哥的三天（書2:22）；BH 說以色列在約書亞吩咐預備食物之後在約但河邊安營，因為三日之內他們要過河（書1:10-11）。KC 說主耶穌的死與復活包含在「三」這個數字裡。
  surfaces:
  - 過了三天
- name: 普天下主（a.don kol ha.a.retz）
  type: 原文
  section: 原文
  evidence: 第11、13節兩次稱神為「普天下主」，STEP 為 'a.Don kol- ha./'A.retz（H136 a.do.nai 加 H3605 kol 加 H776G e.rets）。GT《綜合解讀》說「普天下主」原文是「全地的主」；GT《啟導本》說約書亞兩次這樣稱神，是要以色列人與迦南人都知道誰有權主張這片土地；GT《聖經精讀本》說約書亞藉著強調神是普天下的主，防止將神局限在某種有限的空間裡；KC 說第13節把先前分開使用的兩個名稱合在一起。
- name: 立起成壘（ned）
  type: 原文
  section: 原文
  evidence: '第13節「必然斷絕，立起成壘」與第16節「停住，立起成壘」，STEP 為 ned ''e.Chad（H5067，簡要詞典義 ned: heap，加 H259 e.chad: one），字面是「一堆」。GT《研經資料》說「立起成壘」原文是「立起一堆」，與出15:8 的用詞一致；GT《綜合解讀》說立起成「壘」與過紅海時的大水直立如「壘」原文是同一個字。CT 說『立起成壘』指違反水的性質，如同固態的冰一樣堆壘起來。'
- name: 祭司站定與河水停住（a.mad）
  type: 原文
  section: 原文
  evidence: '第16節河水「停住」與第17節祭司「站定」，STEP 都是 H5975G（a.mad: to stand）——第16節是 va/i.ya.''am.Du，第17節也是 va/i.ya.''am.Du。GT《綜合解讀》說祭司們的「站定」與河水在亞當城的「停住」原文是同一個字，並說國民的「盡都」過河與河水的「全然」斷絕原文也是同一個字；GT《丁道爾聖經注釋》說這裡用一連串文字遊戲來表達他們對水和對百姓的行動。第17節的「盡都」STEP 為 ta.mu（H8552 ta.mam: to finish）。'
  surfaces:
  - 站定
  - 停住
- name: 和約櫃相離二千肘
  type: 主題
  section: 主題
  evidence: '第4節「只是你們和約櫃相離要量二千肘，不可與約櫃相近」，STEP 為 ke./''al.Pa.yim ''a.Mah ba./mi.Dah（H505G e.leph 加 H520A am.mah 加 H4060A mid.dah: measure）。各家給的換算不一：CT 說約折合900公尺，GT《雷氏研讀本》說約三千英尺（914米），GT《啟導本》與《串珠》說約一千公尺，GT《綜合解讀》說大約900米，GT《研經資料》說約889公尺，BH 說 roughly 3,000 feet or 900 meters。理由各家也列了幾種。'
  surfaces:
  - 二千肘
- name: 腳一入水（ta.val）
  type: 原文
  section: 原文
  evidence: '第15節「他們到了約但河，腳一入水」，STEP 為 nit.be.Lu（H2881，簡要詞典義 ta.val: to dip，Niphal）加 bi/k.Tzeh ha./Ma.yim（H7097A qa.tseh: end）。CT 說『腳一入水』指抬約櫃祭司的腳一踏到水裡，並說百姓在水斷絕之前必須先舉足涉水；BH 說祭司必須在水停住之前先走進氾濫的河，這顯出信心在看見供應之前先順服命令。'
- name: 亞當城與撒拉但
  type: 地點
  section: 地點
  evidence: 第16節「便在極遠之地、撒拉但旁的亞當城那裡停住」，STEP 為 me./'a.dam ha./'Ir（H121H 加 H5892B）。CT 原文字義給「撒拉但」他們的悲傷、「亞當」屬土的，紅土，並說極遠之地距離耶利哥渡口約有三十公里。GT《丁道爾》《研經資料》《舊約背景註釋》各給出遺址考證與距離；BH 說亞當在渡口以北約十八英里，撒拉但是約但河谷的已知地點，後來與所羅門的行政區與聖殿銅器鑄造有關。
  surfaces:
  - 撒拉但旁的亞當城
- name: 約但河斷流的自然解釋之爭
  type: 解經爭議
  section: 解經爭議
  evidence: 第16節河水「全然斷絕」。GT《啟導本》說神可以藉山崩、泥塌等土壤的運動來暫時阻塞水流，並舉本世紀初該河曾發生山泥傾瀉入河、河水受阻逾20小時的事；GT《舊約背景註釋》的華爾頓說洪水沖刷兩岸山崖或地震所導致的山泥傾瀉不時會在此截斷約但河，最近一次發生於1927年；GT《李道生舊約聖經問題總解》說1927年因地震河岸崩潰、河水斷絕廿一小時。GT《雷氏研讀本》則反對：其它支流不可能同時被堵住，也不可能馬上就堵住其後又馬上暢通。GT《丁道爾》說約書亞記中並沒有講到地震，無論間接的原因是什麼，直接的目的總是高舉以色列的神與祂的子民。GT《研經資料》另列出五項把它視為神蹟的理由。
  surfaces:
  - 全然斷絕
- name: 使你尊大（ga.dal）
  type: 原文
  section: 原文
  evidence: '第7節「從今日起，我必使你在以色列眾人眼前尊大」，STEP 為 ''a.Chel（H2490C，簡要詞典義 cha.lal: to profane/begin: begin）加 ga.del./Kha（H1431，簡要詞典義 ga.dal: to magnify）加 be./''ei.Nei（H5869H a.yin）。CT 說『眼前尊大』指因所言所行顯出的超越常人效果，而被人視為神的僕人；GT《綜合解讀》說這表明神施行神跡的目的之一是建立約書亞在神百姓中的權柄；BH 說過約但河會在全國面前公開確立約書亞的職分。'
  surfaces:
  - 尊大
- name: 清早起來
  type: 主題
  section: 主題
  evidence: '第1節「約書亞清早起來，和以色列眾人都離開什亭」，STEP 為 va/i.yash.Kem ba./Bo.ker（H7925 sha.kham: to rise，Hiphil 加 H1242 bo.qer）。GT《約書亞記綜合解讀》說「清早起來」這句話在舊約中有特殊的意義，通常表示急切、堅決的態度（創十九3；出九13；民十四40；書七16）；GT《聖經精讀本》說聖經多處描寫清晨是藉著默想禱告在靈裡與神相交的時刻，並說本節表明約書亞是一位敏感於神的旨意且努力盡職的領袖。KC 說清早起來是約書亞的特點（書6:12；7:16；8:10），也是神百姓其他領袖的特點；BH 說他的殷勤讓人想起亞伯拉罕受命獻以撒時清早的順服。CT 在話中之光說清早是我們靈性生活的時間。'
- name: 約櫃前行尋安歇（書3：3-6）
  type: 互文
  section: 互文
  evidence: 第3至6節約櫃在百姓前頭過去、百姓看見約櫃就起行，與民10:33 約櫃在前行三天為百姓尋找安歇處同一個主題。GT《丁道爾聖經注釋》說以色列人還沒有離開西乃山之前就已經規定了行伍的秩序（民數記一至二章和第十章），民數記十33 說約櫃要走在百姓的前頭領他們到安歇之所，要過約但河的百姓可能也知道這個指示；GT《約書亞記研經資料》轉述同一段，並說此處的重複敘述或許是一種形式，也可能是過河大典的一部分。
  surfaces:
  - 在百姓前頭過去
