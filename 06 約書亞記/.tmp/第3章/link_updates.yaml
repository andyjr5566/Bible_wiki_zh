- title: 雲柱火柱
  path: link_folder/歷史/雲柱火柱.md
  summary: GT《約書亞記綜合解讀》指出一個轉換：在曠野裡，神「夜間在火柱裡，日間在雲柱裡」（申一33）指示百姓所當行的路，如今在即將過約旦河、進入應許的時候，神卻讓百姓從跟隨雲柱、火柱變成「跟著約櫃去」（3節）；它說約櫃和雲柱、火柱一樣都代表神的同在，但神從此不再讓他們跟隨眼見的雲柱、火柱。BH 在第4節也說約櫃走在以色列前面，正如雲柱和火柱曾在曠野引導這個國家。
