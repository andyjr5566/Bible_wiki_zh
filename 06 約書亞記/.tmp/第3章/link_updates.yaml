  path: link_folder/背景/迦南七族（迦南地原住民）.md
  summary: 第10節一口氣列出迦南人、赫人、希未人、比利洗人、革迦撒人、亞摩利人、耶布斯人，這是本章唯一的族群清單。GT《研經資料》說這份名單與摩西五經一再出現的名單相似，其中迦南、赫人、亞摩利人三個有相當多的文獻紀錄佐證，比利洗人、希未人、耶布斯人則沒有在聖經以外的文獻出現過；它另說目前學界對革迦撒人所知甚少，但烏加列文獻證實了他們的存在。GT《綜合解讀》說希未人、比利洗人、革迦撒人這三族的名字在聖經之外只出現在主前第二千年的文獻中。KC 說這七族代表惡的完全。BH 說這份完整的名單強調迦南沒有任何一國能攔阻神成就祂所應許的。
  relation: 這份名單在本章的位置很特別：它不是戰報，是過河之前的憑據。約書亞用神必趕出七族來證明「在你們中間有永生神」，名單因此成了信心的內容而不是戰果的統計。
