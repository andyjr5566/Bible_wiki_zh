- title: 自潔
  path: link_folder/神學/自潔.md
  summary: 第5節「你們要自潔，因為明天耶和華必在你們中間行奇事」，STEP 為 hit.ka.Da.shu（H6942G qa.dash，Hithpael 命令式）加 nif.la.'ot（H6381 pa.la）。CT 說自潔包括沐浴、洗衣、不親近婦女等（參出十九10）；GT《丁道爾聖經注釋》說這個指示讓人想起以色列在西乃山的情景，並推測百姓為何在約但河邊還等了一段時間；GT《研經資料》說「自潔」原文是「分別出來奉為神聖」，並列出它在出19:22、代下29:5 等處的用法，另指出約書亞記除本節外只有書7:13 再要百姓自潔。GT《聖經精讀本》說這種對聖潔的命令並不是行神跡的條件。
  relation: 出19 的自潔是為了神降臨在山上，本章的自潔是為了神在百姓中間行奇事。同一個動作，一次面向山，一次面向河。
