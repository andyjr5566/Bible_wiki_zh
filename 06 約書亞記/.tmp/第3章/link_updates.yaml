- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: 第1節「約書亞清早起來，和以色列眾人都離開什亭」，STEP 為 va/i.yash.Kem ba./Bo.ker（H7925 sha.kham 加 H1242 bo.qer）。第5節他吩咐百姓自潔，第6節吩咐祭司抬約櫃在百姓前頭過去，第9節召百姓「近前來，聽耶和華─你們神的話」，第10至13節宣告神必趕出七族並預告河水斷絕。第7節耶和華對他說「從今日起，我必使你在以色列眾人眼前尊大」。GT《聖經精讀本》說本節表明約書亞是一位敏感於神的旨意且努力盡職的領袖。
