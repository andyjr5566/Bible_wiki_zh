- title: 三日之內與差派探子的先後之爭
  path: link_folder/解經爭議/三日之內與差派探子的先後之爭.md
  summary: 第2節「過了三天，官長走遍營中」。GT《綜合解讀》說「過了三天」可能就是兩個探子窺探耶利哥的三天（書2:22）；BH 說以色列在約書亞吩咐預備食物之後在約但河邊安營，因為三日之內他們要過河（書1:10-11），這段等待讓百姓整頓事務、預備過河。CT 說這指出埃及後第四十一年正月初十日（參書四19）的前一天。KC 說預備要花三天，主耶穌的死與復活包含在「三」這個數字裡。
  relation: 書1 給的是期限，書2 給的是探子藏匿的三天，本章給的是官長真正出去傳令的那一天。三章的三個「三」到這裡才全部出現，時序問題也才完整。
