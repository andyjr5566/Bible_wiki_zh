  summary: 第1節「和以色列眾人都離開什亭，來到約但河，就住在那裡，等候過河」。GT《研經資料》說什亭距離約旦河還有8到9公里；GT《綜合解讀》說以色列人在新的領袖約書亞率領下走了大約10公里，開始走上他們「向來沒有走過」的路；GT《丁道爾聖經注釋》說一旦領受了詳細的指示，知道要如何過河之後，以色列人就必須遷移到河旁邊，這樣過河的那天才不會浪費時間。
  relation: 書2:1 探子從這裡出發，本章是全營從這裡拔營。什亭在約書亞記裡的功能到此結束——它是最後一個河東的營地。
