- title: 清早起來
  path: link_folder/主題/清早起來.md
  summary: '第1節「約書亞清早起來，和以色列眾人都離開什亭」，STEP 為 va/i.yash.Kem ba./Bo.ker（H7925 sha.kham: to rise，Hiphil，加 H1242 bo.qer）。GT《約書亞記綜合解讀》說「清早起來」這句話在舊約中有特殊的意義，通常表示急切、堅決的態度（創十九3；出九13；民十四40；書七16）；GT《聖經精讀本》說聖經多處描寫清晨是藉著默想禱告在靈裡與神相交的時刻，並說本節表明約書亞是一位敏感於神的旨意且努力盡職的領袖。KC 說清早起來是約書亞的特點（書6:12；7:16；8:10），也是摩西、大衛、希西家等神百姓領袖的特點。BH 說他的殷勤讓人想起亞伯拉罕受命獻以撒時清早的順服。'
  relation: 這是全章的第一個動作，而它與最後一節的祭司「站定」構成本章的兩端：一個人清早起身，一群人站到最後。
