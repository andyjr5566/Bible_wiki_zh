  summary: 第10節「因此你們就知道在你們中間有永生神」，STEP 為 'el chai（H410G el 加 H2416A chay）。CT 說『永生神』意指祂是又真又活的神，是生命的源頭；GT《聖經精讀本》說永生神指神是生命的源頭；BH 說永生神不像迦南無能的偶像，祂實際掌管受造、帶領祂的百姓、成就祂的話。這句話與同段的「普天下主」（第11、13節）並列。
