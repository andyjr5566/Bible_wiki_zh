- title: 約但河
  path: link_folder/地點/約但河.md
  summary: '本章的主場景，第1、8、11、13、14、15、16、17節反覆出現。第15節「原來約但河水在收割的日子漲過兩岸」，STEP 為 ma.Le'' ''al- kol- ge.do.Ta/v（H4390 加 H1415 ga.dah: bank）加 kol ye.Mei ka.Tzir（H7105A qa.tsir）。GT《綜合解讀》說約旦河平時大約只有30多米寬、3米多深，但春天上游融雪、河水氾濫，耶利哥附近的河面可以超過一公里、有7米多深；GT《聖經精讀本》說「約但河」有「永恆之河」或「急流之溪」之意。第16節河水在亞當城停住、往鹽海的下流全然斷絕，第17節以色列眾人從乾地上過去。'
