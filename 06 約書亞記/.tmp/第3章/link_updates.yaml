- title: 約櫃前行尋安歇（書3：3-6）
  path: link_folder/互文/約櫃前行尋安歇（書3：3-6）.md
  summary: 第3至6節：百姓看見約櫃就要離開所住的地方跟著去，第6節約書亞吩咐祭司「你們抬起約櫃，在百姓前頭過去」。GT《丁道爾聖經注釋》指出以色列人還沒有離開西乃山之前，就已經規定了行伍的秩序，記在民數記一至二章和第十章，而民數記十33 說約櫃要走在百姓的前頭、領他們到安歇之所，要過約但河的百姓可能也知道這個指示；它接著說這裡的重複或許是一種形式，也許是過河大典的一部分。GT《約書亞記研經資料》轉述同一段，並把它列為百姓與約櫃保持距離的三種可能理由之一。
  relation: 民10:33 的約櫃在前行是為百姓尋找安歇之處，本章的約櫃在前行是為百姓開出一條過河的路。同一個「在前頭」，一次找地方停，一次找路走。
