- title: 紅海分開
  path: link_folder/歷史/紅海分開.md
  summary: 本章與過紅海的對照由用字支撐。第13、16節「立起成壘」STEP 為 ned（H5067），GT《綜合解讀》與《研經資料》都說與出15:8 大水直立如「壘」是同一個字；第17節「乾地」STEP 為 be./cha.ra.Vah（H2724），GT《研經資料》說與出14:21 用詞一致。GT《丁道爾聖經注釋》另指出祭司站在乾地上與摩西將紅海變成乾地一樣。GT《綜合解讀》說約書亞特意把過約旦河與過紅海的神跡相提並論（書四23），並說過紅海的老一代以色列人大都去世了，現在神要新一代親身經歷過約旦河的神跡。
