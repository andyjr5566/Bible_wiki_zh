  summary: 第7節「使他們知道我怎樣與摩西同在，也必照樣與你同在」，STEP 為 ha.Yi.ti 'im- mo.Sheh 與 'eh.Yeh 'i.Ma/kh（H5973A im）。BH 說約書亞的果效繫於耶和華的同在，而不是軍事才能或天賦；GT《綜合解讀》說神施行過約旦河神跡的目的之一，是要借著顯明神與約書亞的同在，建立他在神百姓中的權柄。第10節另從另一個角度說同一件事：「在你們中間有永生神」。
