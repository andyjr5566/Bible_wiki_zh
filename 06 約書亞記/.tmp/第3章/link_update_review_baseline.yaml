- title: 清早起來
  path: link_folder/主題/清早起來.md
  definition: 亞伯拉罕領受吩咐後的固定反應：「亞伯拉罕清早起來，備上驢，帶著兩個僕人和他兒子以撒，也劈好了燔祭的柴，就起身往神所指示他的地方去」（創廿二3）。同樣的說法也出現在打發夏甲離開時（創廿一14）。註解一致把它讀作即時順服的記號——不質疑、不拖延、不討價還價：他沒有與神理論，沒有為以撒求情，也沒有與撒拉商量，天一亮就動身（CT／GT）。與詩篇一一九60「我急忙遵守你的命令，並不遲延」同一心志；獻以撒是這順服最沉重的一次試驗，因為所吩咐的不再只是可行之事，而是捨出獨生的愛子。
  development: '### 這個記號的份量在於它省略了什麼


    CT 用一組否定把它說得最清楚：亞伯拉罕不與神理論、不為自己辯護、不為以撒求情、不與撒拉商量，清早起來立即行動。它並指出時間點的暗示——他大概是在夜間得到這個呼召，因此「清早起來」形容的是立刻順從。


    要注意的是，這份平靜是敘事的表面，不是他的內心。GT《聖經精讀本──創世記註解》明說：若以為他是以喜悅的心接受這道命令，「這是無視父愛、無人情味的解釋」；那一夜他很可能整夜不眠，心裡至少有三重矛盾——神既早已向挪亞申明生命的尊嚴（創九4-6），為何要他行外邦人的野蠻風俗？為何收回應許多次、等候多年才得的繼承人？神給他改名「多國的父」（創十七5）又是什麼意思？經文只記他清早起來，沒有記這一夜。


    ### 準備得很周全


    CT 另注意到第3節的動詞串：「備上……帶著……劈好……」，表明他的準備真是周到齊全——順服不是衝動，而是把該辦的都辦妥。GT《創世記雷氏研讀本》註「劈好」等同「破開」，並說「清早」表示亞伯拉罕即時便順服神。GT
    丁良才《創世紀註釋》把應用寫在同一句下：亞伯拉罕雖然知道神所應許的福概要藉著以撒應驗，仍然願意聽命，因為他信神必叫以撒從死裡復活（來十一17-19）——「信徒也當趁早願從主命，不可遲延」。


    BH 則把它放進一個模式裡：清早起行在聖經敘事中常標誌立即的順服，摩西與約書亞都有同型的記載。


    ### 同一個說法的前一次


    創二十一14 打發夏甲時用的是同一句「亞伯拉罕清早起來」。兩處的差別在於所捨的是誰：前一次是使女和她的兒子，這一次是應許之子。順服的形式沒有變，代價變了。


    ### 書3:1：同一個說法，換了一個人


    創22:3 與創21:14 兩處都是亞伯拉罕清早起來。書3:1 把同一個說法交給了另一個人：「約書亞清早起來，和以色列眾人都離開什亭，來到約但河。」STEP
    顯示是 va/i.yash.Kem ba./Bo.ker（H7925 sha.kham，Hiphil，加 H1242 bo.qer）。


    GT《約書亞記綜合解讀》直接指出這是一種固定用法：「清早起來」這句話在舊約中有特殊的意義，通常表示急切、堅決的態度，並列出創19:3、出9:13、民14:40、書7:16
    幾處。BH 把兩人接在一起：約書亞的殷勤讓人想起亞伯拉罕受命獻以撒時清早的順服。


    KC 則說它是約書亞這個人的特點，並列出書6:12、書7:16、書8:10；他同時說這也是神百姓其他領袖的特點，並舉摩西、大衛、希西家為例。GT《聖經精讀本──約書亞記註解》從另一面說：聖經多處描寫清晨是藉著默想禱告在靈裡與神相交的時刻，本節表明約書亞是一位敏感於神的旨意且努力盡職的領袖。


    ==創22 那一次，清早起來之後是上山獻獨生子；書3 這一次，清早起來之後是全民下水過河。==兩處的共同點不是心情，是動作與命令之間沒有停頓。'
