- title: 亞拉巴
  path: link_folder/地點/亞拉巴.md
  definition: '亞拉巴是一條南北向的大裂谷，申命記第一章開場就把摩西講話的位置放在這裡。


    **範圍有多大。** CT 與 GT《啟導本》給的說法一致：「『亞拉巴』指約但河流域從北邊的加利利海到死海南端以迄阿卡巴灣的河谷地帶。今天死海南岸仍叫做亞拉巴（Wady
    el-Arabah）」。BH 的描述也相同：從死海延伸到阿卡巴灣的沙漠地帶。換算下來，這條裂谷縱貫了以色列人整趟行程的東側。


    **它同時是三個東西。** 第1節「疏弗對面的亞拉巴」是摩西講話的地點；第7節「就是亞拉巴、山地、高原、南地」則把它列為應許之地的一個地理分區；第5節說摩西講律法的地方在「約但河東的摩押地」，CT
    說明那就是「亞拉巴⋯的中南部」。同一個名字在同一章裡既指講話的現場，也指要去得的地。


    **死海也用這個名字。** CT 與 GT 都指出，聖經裡死海又名「亞拉巴海」（申四49；書三16；十二3；王下十四25）。所以讀到「亞拉巴」時要看上下文是指整條裂谷還是那片海。


    **原文。** STEP 原文資料顯示第1節與第7節都是 ba./''a.ra.Vah（H6160G），簡要詞典義 Arabah。CT 給的原文字義是「沙漠曠野，乾草原」。'
