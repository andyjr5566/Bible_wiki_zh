- title: 雲柱火柱
  path: link_folder/歷史/雲柱火柱.md
  definition: '出13:21-22「日間，耶和華在雲柱中領他們的路；夜間，在火柱中光照他們，使他們日夜都可以行走。日間雲柱，夜間火柱，總不離開百姓的面前。」CT
    說明兩者都是神臨在的表號：「雲柱」指柱狀雲層（參申31:15），「火柱」指柱狀火焰，「神自己就是烈火（參申四24）」。


    會幕立起之後，這同一根柱子成了以色列人行止的依據：雲彩收上去就起行，不收上去就不起行（出40:36-37）。CT 讀出其中的表徵：「表徵聖靈又感動、引導、幫助教會」，並下了一句結論——「沒有聖靈的印證，就沒有行動。」BH
    則指這雲即舍吉拿的榮光，是神同在的可見顯現，最早出現於出13:21-22。'
  development: '**是兩根柱子還是一根。** GT《聖經精讀本》說得很明白：「不是不同的兩根柱子，而是同一個柱子表現為兩種現象。」GT《舊約聖經背景註釋》也是這樣讀：「本節所述的柱子是只有一條的：白晝時看見煙雲，包在裡面的火光晚間照亮出來。」


    **「柱」這個字。** 丁道爾指出：「嚴格來說，『柱』的希伯來文是『站著之物』，意思比較接近『圓柱』而非一般英譯本的『支柱』。而『站著』的概念，亦可能暗示神的同在不會中斷。」


    **它是怎麼造成的，各家都說不準。** 丁道爾坦承這只能臆測，並列出幾種可能：它可能是「神在人腦海中造成的異象，即純粹超自然的效果」，也可能是神用自然事物代表祂的臨在——某種沙漠旋風，或是壇上升起的煙柱在清朗的沙漠空氣中反映火焰。但它立刻補上一句：「臆測雖然可能有錯，對信心的解釋卻沒有影響。」GT《串珠聖經註釋》也是同一態度：「至於神藉什麼自然界的現象去製造出這些柱子，我們無法確知。」


    **幾種被否掉的解釋。** GT《舊約聖經背景註釋》處理過兩個常見的說法：火山活動（帖拉島火山爆發「在時間上太早了」，也無法解釋柱子如何前行）與商隊的火盆（「聖經每次都是描述柱子是主動（降下、移動）而非被動的」）。GT《聖經精讀本》同樣否掉商隊煙火指路與「單純的象徵性想像」兩說。


    **雲柱的用處有四。** 丁良才數過：「（一）光照百姓；（二）遮蔽百姓（日頭不至於曬著他們）；（三）保護百姓；（四）引導百姓。」GT 李道生的答問也給同一組：光照、遮蔽、保護、引導。而丁良才另指出這柱子與人間軍旅的分別：「當時的元帥在軍前舉烽火，但這雲柱是神跡顯明神親自做百姓的首領。」


    **它從走在前面變成住在中間。** 出13:21 的柱子是「在他們前面行」，出33:9 降在營外會幕的門前，到出40:34-38 則停在立起來的帳幕上——位置從隊伍的前頭移到營的正中央，而引路的功能一點沒少：收上去就起行，不收上去就不起行。BH
    把這條線再拉長：同一朵雲先見於西乃山（出19:16），後來在所羅門獻殿時充滿聖殿（王上8:10-11），都是舍吉拿榮光的同一種顯現。CT 為出40:38 的雲與火另給一組對應：「『雲彩…火柱』象徵聖靈與聖經；教會的裡面有聖靈的引導，外面有聖經（神的話）的光照。」


    **它跟了多久。** CT 指出「此後以色列人在曠野四十年間，一直都有神的同在；就在快要渡約但河，摩西臨死前仍有雲柱的記載（參申三十一15）」。丁良才推算得更細：「大概過了四十年，在約旦河東耶利哥對面的亞伯什亭，雲柱才離開了百姓。」KC
    則把它接到今日：「今日神藉聖靈引導祂的百姓，而祂也不將聖靈取去。」


    民數記第9章15-23節是這朵雲最完整的一段紀錄，也是它第一次變成一套可以遵行的規則。出13:21-22 記它出現在出埃及的路上，出40:34-38 記它降在剛立起的會幕上；到民9，經文用九節的篇幅反覆說明同一件事——雲彩收上去就起行，停住就安營，無論停兩天、一月或一年（民9:22）。


    KC 數過一個細節：「遵耶和華的吩咐」在第18、20、23節共出現七次，而這吩咐「就表達在雲彩的移動裡」。GT 丁良才則把雲柱的功用列成三樣：護庇、光照、引導。CT
    在章末另歸出神引導的五個特徵：日夜引導、前後引導、隨神旨引導、適宜引導、目標引導。


    STEP 原文資料為民9:22 補上一層中譯看不見的呼應：「雲彩……停留」的第二個字是 sha.khan（H7931，to dwell），正是「帳幕」mish.kan（H4908）的同源字——雲停駐在那個以「停駐」命名的所在之上。


    ### 引導的形式換過三次


    出13:21 柱子走在隊伍前面；出40:34-38 它停在剛立起的帳幕上，位置從前頭移到營的正中央；民9 把它變成一套可以遵行的規則——收上去就起行，停住就安營。三個階段的共同點是：引導的記號一直掛在天上，全民抬頭就看得見。


    約書亞記第三章換掉了這個形式。從書3:3 起，百姓要看的不再是柱子，而是祭司肩上抬著的約櫃。丁良才推算過柱子跟隨的終點：大概過了四十年，在約旦河東耶利哥對面的亞伯什亭，雲柱才離開了百姓——而書3:1
    正好記以色列人離開什亭。


    ==看得見這一點沒有變，變的是誰扛著它。==柱子不需要人維持，約櫃要有人抬、有人站在水裡不動；書3:4 因此才需要一條二千肘的距離規定，好讓全營仍然看得見那個記號。天上懸著的東西不必規定看的距離，人扛著的東西才需要。'
