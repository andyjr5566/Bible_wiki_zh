- title: 摩西
  path: link_folder/人物/摩西.md
  definition: 摩西是利未人暗蘭與約基別之子、米利暗與亞倫的弟弟，也是神後來呼召帶領以色列人出埃及、領受律法的僕人。出埃及記2章記述他在殺嬰令下蒙保全，被法老女兒收養，在埃及王宮長大；他認同受苦的希伯來同胞，卻因殺死埃及人而逃到米甸，在那裡成家並接受曠野生活的預備。
  development: '摩西的軌跡橫跨四卷書，是一條從拒絕、到中保、再到被超越的預表的線。CT 把他在出埃及記裡的轉折分成三段：首四十年「自以為我能」（徒7:22），次四十年在何烈山前才承認「我不能」（出4:10），末四十年在曠野裡「認識神能」（申3:24）——出2-4章記的正是第一段到第二段的斷點。KC
    從出4:13 讀出這個斷點的性質：到那一步已經不能算是異議而是拒絕，而拒絕並不是謙卑；神的回應不是移除他的軟弱，而是以同在與話語賦權他。從出7章他「照樣行了」開始，摩西的角色定型為中保：出17、32
    兩次代求（來源屢次讀出這是主耶穌代求職分的預表，來7:25），出19、24 成為約的傳達者與立約者（KC：摩西為使徒、亞倫為大祭司，二人一同預表基督，來3:1），出34
    領受神性情的宣告後下山，面皮發光而不自知——GT《丁道爾》說這與施洗約翰、保羅一樣不自知其超卓，正是真屬靈偉人的記號（民12:3）。到利未記，他的角色收窄成純粹的傳達者：利8章他還以過渡期祭司的身分代行獻祭，利9章起祭司職分正式移交亞倫，此後利未記全書、直到民數記，都是「耶和華對摩西說」的授命模式反覆出現——CT
    指出這樣的模式在民數記裡至少記載了八十次以上。這條軌跡最後在出40章、被希伯來書明確定位為一個被超越的預表：摩西是神家中忠心的僕人（來3:5），基督卻是治理神家的兒子（來3:6）——KC
    說，摩西是主耶穌的圖畫，而主耶穌比摩西更大。



    ### 民數記後半：從中保到被判出局


    民數記16-20 這一段，摩西的中保角色被推到極處，也在同一段裡斷掉。可拉黨叛變時他與亞倫俯伏在地為全會眾求情（民16:22），瘟疫發作後又打發亞倫拿香爐跑進會眾中止住災殃（民16:47-48）；民17
    十二根杖的試驗、民18 祭司與利未人職分的重申，都是由他接令傳達。


    轉折在民20。神吩咐他向磐石說話，他卻斥責百姓為背叛的人、舉手用杖擊打磐石兩下，神因此宣告：「因為你們不信我，不在以色列人眼前尊我為聖，所以你們必不得領這會眾進我所賜給他們的地去。」CT
    的〔話中之光〕指出這次失敗的性質不在脾氣本身，而在它牽連了神：「摩西那一次的發脾氣影響到神的自己，把神也拖在裏面，叫以色列人分不清，以為流出水來給我們喝的是神，發脾氣罵我們的也是神。」GT《聖經精讀本──民數記註解》的判語更短：「他把自己的感情高舉在神公義的審判和神的話語之上,這就是摩西的過失。」


    值得注意的是這一章同時記下他的另一面。KC 把他在民20 遭遇的五件事列成一串——姊姊米利暗的死、百姓的暴動、自己的失敗與懲罰、以東的拒絕、哥哥亞倫的死——而他在這一連串打擊之後仍然照耶和華所吩咐的行（民20:27），親手為哥哥脫下聖衣。從出2
    的「自以為我能」到民20 的失去資格，這條線的收束並不是失敗，而是一個仍然順服、卻不能進去的僕人。


    ### 從被判不得進地，到把工作交出去


    民數記後半那一段結束於摩西被判不得進地。申命記三十一章接的正是那個判詞留下來的問題：既然進不去，他要留下什麼。


    這一章記的四件事全都指向同一個方向。他當眾任命約書亞，並且沒有留下一句抱怨——KC 注意到這一點，說他帶著愛把領導權交出去。他把律法寫出來交給祭司與長老，並且替這卷書定好每七年宣讀一次。他照神的吩咐寫一篇歌，教導百姓念誦。他最後把支派的眾長老和官長叫齊，呼天喚地為那首歌立下見證。


    ==四樣東西的共同點是它們都不依賴摩西還在。==接班人由神親自囑咐過，書放在約櫃旁，歌在百姓口中，證人是天和地。


    GT《聖經精讀本──申命記註解》把這一段稱作摩西的最後事工，說本文描繪了摩西知道自己的去日不遠、便竭盡全力完成神委任他之事的場面。GT《啟導本聖經申命記註釋》補上一句更貼近人的觀察：雖然摩西即將離世，但他所關心的卻不是個人的後事，而是盡完最後的責任。'
