  suggested_type: 互文
  evidence: 四套來源都把亞割谷接到何西阿書2:15。CT 說神允許這事發生、又讓「亞割谷」這個名字世代流傳下去，最終是要使人歸向祂，並引賽65:10「亞割谷必成為牛群躺臥之處，都為尋求我的民所得」與何2:15「又賜她亞割谷作為指望的門」；GT《啟導本》說亞割雖因此事名聲受損，但先知書一再預言此城會成為蒙福的地方（賽65:10；何2:15），或因耶和華神在此轉意、不發烈怒的緣故；GT《聖經精讀本》說此谷原用來象徵「審判」與「痛苦」，賽65:10
    和何2:15 則從末世論意義上指以色列的恢復。KC 說在何西阿書裡耶和華說到祂要把亞割谷賜為 “a door of hope”，百姓要在那裡歌唱 “as in
