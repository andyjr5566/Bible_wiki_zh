    ''al- te.kha.Ched（H3582，簡要詞典義 ka.chad: to hide）。CT 說『將榮耀歸與神』意指承認神是無所不知、無所不能的，在祂面前是不能掩蓋、隱藏的，所以要向祂認罪，而「將你所作的事告訴我」表示同時也要將事情向人有所交代。GT《丁道爾聖經注釋》說這時亞干惟一該做的事，就是把自己所犯的罪一五一十的講出來。KC
