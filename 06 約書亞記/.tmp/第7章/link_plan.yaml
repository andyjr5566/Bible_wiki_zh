- name: 亞干的兒女為何同受刑罰
  suggested_type: 解經爭議
  evidence: 第24節「並亞干的兒女、牛、驢、羊、帳棚，以及他所有的，都帶到亞割谷去」，而申24:16 明說不可因父殺子。CT 說本來按照律法條例父親犯罪不可懲罰子女，此案他們可能同謀掩蓋或知罪不揭發（第11節「他們的家具」），故須連帶處刑，並在話中之光說亞干的兒女一同受罰是因為他們共同參與藏匿了當滅的物，所以他們都成了當滅的物。GT《雷氏研讀本》說亞干的家人必定是他的同謀；GT《啟導本》說亞干的家人一定也參與其事並代隱瞞，否則不會一起判死刑；GT《串珠》說按申24:16
    亞干的家人原本不會受牽連，但他們明顯是知情不報甚至有分參與；GT《聖經精讀本》列出四種看法：家眷也一同犯了罪、只是為了警誡兒女而帶到刑場、被一些魯莽的以色列百姓帶到刑場而約書亞無法制止、以及加爾文認為亞干的家族與耶利哥居民受到了同樣的懲罰；GT《研經資料》說七十士譯本沒有第24節這些文字，並說到底亞干的兒女有沒有被殺我們不是很確定；GT《靈修版聖經注釋》說聖經雖然沒有說他們同謀犯罪，但是古時把家族當作一個整體。KC
    說因為他所有的家人都要與他一同死，他們必定知道這件事、因此成了共同有責的人。BH 說以色列的律法也維持個人在神面前的責任——不可因父殺子、也不可因子殺父（申24:16）。
