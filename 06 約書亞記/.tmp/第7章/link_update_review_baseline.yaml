- title: 貪戀
  path: link_folder/原文/貪戀.md
  definition: 第十誡「不可貪戀」（出二十17）所用的希伯來動詞是 חָמַד（chamad，H2530A；經文作 תַחְמֹד… לֹא־תַחְמֹד），STEP
    顯示其 context gloss 為「covet / desire」，指渴望、貪圖屬於他人的事物。第十誡在同一節中把這個詞連說兩次（先指房屋，再擴到妻子與一切所有），讓焦點直接落在人的內在佔有欲望上。CT
    給的原文字義是「渴望，貪圖」；GT《丁道爾聖經註釋》指出這個字本身是中性的：「『渴望』一詞，本身其實無善無惡。只有在對像屬於他人之時，這種誤導的『渴望』才成為惡事」。它並反對把這一誡簡化成「唯一規範內心的誡命」：「間中有人宣稱，十誡之中只有這條是禁制內心態度，而非外在行為。然而作出這種區別，恐怕是誤解希伯來人的思想方式了。『渴望』與『愛』、『恨』一樣都是行為，含義大致和『覓取』相當。」
  development: '申命記第5章讓這個字第一次出現了對照組。出20:17 的第十誡兩次都用 chamad（先房屋、後妻子），申5:21 把次序對調成先妻子、後房屋，並把第二個動詞換掉——STEP
    顯示「不可貪戀人的妻子」是 tach.Mod（H2530A），「也不可貪圖人的房屋」是 tit.''a.Veh（H183，簡要詞典義 to desire）。


    GT 引艾基斯《舊約聖經難題彙編》處理過這處差異，判斷「這兩個動詞的意思完全相同」，換字的原因只不過是作者希望使申命記的風格更和諧一致。GT《申命記雷氏研讀本》另指出申5:21
    在名單裡加了「田地」一項，理由是處境變了：摩西在第十誡加上禁止貪圖別人「田地」的命令，「因為百姓即將成為地主了」。


    兩章合看，這一誡的重心沒有移動，移動的是它所涵蓋的清單。出埃及記寫給一群剛出埃及、還沒有地的人，申命記寫給一群即將分地的人；至於這個字算行為還是心態，GT《丁道爾聖經註釋》在出20:17
    的判斷是「渴望」與「愛」、「恨」一樣都是行為，含義大致和「覓取」相當；那是針對 chamad 說的，申5 的 avah 在本章來源裡只有 to desire
    這一層簡要詞典義。'
  signals:
  - first_in_book
  accumulation_count:
  - 2
  - 3
- title: 烏陵和土明
  path: link_folder/原文/烏陵和土明.md
  definition: 放在大祭司決斷胸牌裡、用以求問神旨意的兩件聖物：אוּרִים（H224，「烏陵」）與 תֻּמִּים（H8550，「土明」；出28:30）。STEP
    在民27:21直接辨識「烏陵」H224；「土明」H8550 則由出28:30與利8:8的 STEP 詞形資料補證。相關詞典與註釋常進一步把名稱與「光／光明」及「完全／完整」聯繫起來。CT
    記其字義：「『烏陵』會發光的石頭；『土明』完美」，並坦言「它們在被擄時便已失蹤，至於如何藉烏陵和土明來明白神的旨意，聖經並沒有明確的記載，解經家們雖有各種推測，但不足採信」。GT《丁道爾》給了一個譯名上的更正：「土明英譯本多作
    Thummim，其實正確的音譯是 Tummim」，並指出兩字「意思是『光』和『完美』；按照字面，可能是指藉它啟示旨意之神的本性。但『阿拉法、俄梅戛』，即『始和終』的意思亦有可能（啟一8），因為兩字分別以希伯來文首末字母開始」。GT《串珠》也記下同一組解釋。GT《精讀本》說明其功用：「在舊約時代，表明神旨意的一種抽籤用具……一旦決定國家大事的時候，可能用其抽籤的形式解決問題。」
  development: '這兩件聖物在正典裡的出場，是從器物一路走到職分。


    出埃及記28章與39章先把它們安置進制度：它們放在大祭司的決斷胸牌裡，是聖服規格的一部分。利未記8章記亞倫受膏就職時把它們放進胸牌，制度從此開始運作。民數記27章給出實際用法——約書亞承接摩西之後，要站在祭司以利亞撒面前，由他憑烏陵求問耶和華。


    到了申命記33:8，位置換了。摩西給利未的祝福開頭就說「耶和華啊，你的土明和烏陵都在你的虔誠人那裡」——這一次它們不是胸牌上的配件，而是被當作這個支派身分的憑據。KC
    說這兩塊石頭正說明了利未是一群認識神旨意、又能把神旨意教導神百姓的祭司之民；BH 說這句話顯出利未人替全國求問神旨意的角色。


    從聖服規格上的一項配件，到一個支派身分的憑據，中間隔的是利未在金牛犢那件事上的選擇。申33:9 緊接著就講那件事，兩節連著讀，順序很清楚：先有忠心，才有這份託付。'
  signals:
  - first_in_book
  accumulation_count:
  - 5
  - 6
- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  definition: BH 在出二十二20 指出「必要滅絕」背後的觀念是希伯來文的 herem——把某物分別出來歸神毀滅。GT《丁道爾聖經註釋》用同一個概念解釋本節：犯這罪的人被列為「稱聖當滅之物」，「迦南人要怎樣被以色列人殺盡，這人也要怎樣滅絕」，並在論這一組律法時說，獻祭給耶和華以外神祇的人都要「稱聖」歸作「當滅之物」，他和一切屬他的都須徹底摧毀。
  development: 'herem 在出埃及記、利未記與申命記中分別落在刑律、永獻條例和征服戰爭。出二十二20 把獻祭給別神的人列為必要滅絕；利二十七28-29
    則區分永獻之物與當滅之人，兩者都不可贖回。申二、三章記錄這個命令在西宏與噩之役中的執行，申七章再把它放進即將進入迦南、面對七族的命令中。


    申7:2 的 הַחֲרֵם／תַּחֲרִים 是動詞 H2763A，本節指徹底毀滅；申7:26 的 חֵרֶם 是名詞 H2764A，指當毀滅之物。第25至26節因此補足了物品的一面：偶像要焚燒，人也不可貪圖其上的金銀或把當毀滅之物帶進家中。動詞說明要施行的行動，名詞標明人不可據為己有的對象。


    申十三章與第二十章各補上一個新的面向。申13 第一次把 herem 用在以色列自己的一座城上——觸發條件不是族群，而是那城陷入拜偶像。申20 補的則是適用範圍的明文界線：第10至15節先給「離你甚遠的各城」另一套規則，先宣告和睦的話，開城的服勞役，拒絕的才圍攻；第16節才用「但這些國民的城」把凡有氣息的一個不可存留限定在神賜為業的地界之內。GT《申命記背景注釋》在同一章指出，把俘虜與掠物全數奉獻給賜勝利之神祇的做法「軍事策略中十分罕見」，並列出聖經裡真正徹底摧毀一座城的少數例子——耶利哥、夏瑣、洗法與亞瑪力人。範圍與例外因此不是後人替經文加上的緩衝，而是條文自己排出來的次序。


    這幾卷共同保留了歸神與毀滅相連、當滅之物不可取回的核心；申七章同時限定其歷史處境，是以色列進入迦南時對七族、偶像崇拜與審判的命令。這項特殊命令不能被抽離處境，當成今日對異族使用暴力的常規。'
