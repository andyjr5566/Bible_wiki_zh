- title: 艾
  path: link_folder/地點/艾.md
  definition: 艾是創世記十三3與伯特利並提的迦南地名。亞伯蘭初入迦南時在「伯特利和艾的中間」支搭帳棚並築壇（BH 指這座壇初建於創十二7-8），從埃及回來後又回到同一地點。BH
    指出艾的字義是「廢墟」，與伯特利「神的家」（House of God）形成對照，兩地並提本身就把「跟隨神」與「面對毀滅」兩種去向擺進同一句話，凸顯忠信與悖逆的主題；BH
    並指這一帶在日後約書亞征服迦南的敘事中再度成為要地。在本章，艾的功能是定位——標明亞伯蘭所回去的，正是他起初立壇的舊址。
  development: 艾在本章沒有任何事件發生在其中，它的份量全來自「伯特利—艾」這組固定搭配。BH 對這組地名的讀法有兩層：地理上它標定亞伯蘭第一座祭壇的位置，敘事上它把「神的家」與「廢墟」並列。引用時要保留分寸——字義對照是
    BH 提出的解讀，經文本身只記錄方位，沒有評論艾的名稱含義。另一方面，「回到伯特利和艾的中間」這個動作本身是經文鄭重強調的重點：第3節連用「就是從前支搭帳棚的地方」、第4節再補「也是他起先築壇的地方」，兩句同指一地，把回歸舊址寫得極為明確。BH
    也是從這個重複讀出「回到最初與神相遇之處」的主題，與 KC 在同段所說「我們若偏離了主……就必須回到最後與主同在的那個地方」互相呼應。
  signals:
  - first_in_book
  accumulation_count:
  - 1
