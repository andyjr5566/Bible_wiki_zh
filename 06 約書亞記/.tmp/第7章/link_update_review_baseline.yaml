- title: 認罪
  path: link_folder/主題/認罪.md
  definition: '利未記 5:5 規定：「他有了罪的時候，就要承認所犯的罪。」CT 的〔原文字義〕給「承認」為認罪、告白。這是獻祭前的必要步驟——本章前四節列出三類過犯，第
    5 節先要求認罪，第 6 節才開始講獻什麼。


    **這一步是本章新加的。** GT《舊約聖經背景註釋》把它點成本章與第四章的分野：這祭「與第四章的祭不同之處，在於認罪是必經步驟」，相同之處則是結果同樣是聖所得潔淨、神人得和好。


    **認罪是在什麼時候？** 丁良才留了一個保留：「有罪的人大概在獻祭以前要先承認他的罪，所以本節之認罪的話與獻祭行按手禮時的認罪未必是一事。」他並給認罪下了一個定義：「認罪就是將榮耀歸與神，使祂顯為公義。」


    GT《精讀本》把它拆成三個動作：謙卑地承認自己的罪、承認神對自己罪的審判是正當的、祈求神的饒恕和憐憫。CT 的話中之光說得更直接：「獻祭的人若不肯悔改認罪，他獻甚麼祭物都不能除去罪。」KC
    補上認罪的具體要求——認罪意味著把罪指名道出（「承認所犯的罪」），不是籠統地說自己不好。'
