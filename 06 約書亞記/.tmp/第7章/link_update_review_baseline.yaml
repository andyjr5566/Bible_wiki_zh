  path: link_folder/背景/古代哀悼習俗.md
  definition: 指古代近東表達哀悼的一整套外在行為。GT 華爾頓《創世記背景註釋》在創三十七34～35 下 列出這些動作：撕裂自己的衣服、哭泣、在頭髮上加以灰與塵，以及穿「麻衣」。他並說明
    這種麻衣「是用山羊或駱駝毛織造，很是粗糙不適，並且往往只是一條腰巾」，又指出 「正式的服喪期是三十天，但可以隨服喪者的意思無限期延長」。
  development: '創世記37章一章之內出現兩次撕裂衣服，兩次的意思並不相同。第29節流便回到坑邊發現 約瑟不見了就撕裂衣服，第34節雅各認出血衣後撕裂衣服並腰間圍上麻布。CT
    在第29節下 說撕裂衣服可表示忿怒（民十四6）或悲哀（撒下一11-12），在第34節下則註「麻布是一種 粗布；披麻布表示悲慟（參結廿七31）」。GT《啟導本聖經創世記註釋》把它定位為
    「中東人極度悲憤的感情表達」，並列出一串平行經文（四十四13；利十6；撒下一11； 三31；十三31）；GT《串珠聖經註釋》補充腰間圍麻布同樣是悲傷的表示（王上21:27；
    王下6:30）；GT《創世記雷氏研讀本》則從材質說明：麻布是「一種粗糙、寬鬆的衣服 （象粗麻布），穿這種衣服為要表示悲傷和哀悼」。


    這些外在動作在本章有一層敘事上的反諷。雅各所服的喪是為一個並未死去的兒子， 而促成這場喪事的正是安慰他的那些人——經文說「他的兒女都起來安慰他；他卻不肯受安慰」
