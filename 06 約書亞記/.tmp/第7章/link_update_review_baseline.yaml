- title: 自潔
  path: link_folder/神學/自潔.md
  definition: 出19:10「叫他們今天明天自潔，又叫他們洗衣服」，v15「到第三天要預備好了。不可親近女人」。CT 給的原文字義是「使成聖，自己分別，保持聖潔」，並列出具體內容：「包括禁慾、沐浴身體等」；至於洗衣服，它給的理由很實際：「古人要朝見神時，需更換乾淨的衣裳，由於窮人沒有兩套外出的衣服可供更換，所以命令眾人洗衣服。」CT〔靈意註解〕把兩者分開讀：「『自潔』表徵心思意念分別為聖；『洗衣服』表徵舉止行為分別為聖。」GT《舊約聖經背景註釋》給的是禮儀上的定義：「自潔者進行一連串的步驟，使自己在禮儀上潔淨。它主要包括洗濯和避免觸摸使人不潔之物。」
  development: '**「第三天」本身可能就是完成的記號。** GT《丁道爾聖經註釋》說：「第三天，可能表示潔淨過程之完全。在禮儀上潔淨就是向神分別為聖，手續包括了洗衣服（民8:21）以及暫時不行房事。」BH
    也從數字入手：三在聖經中常表示完整或神聖的完全，並把它接到基督第三天復活。


    **外在潔淨指向內在。** GT《啟導本聖經腳註》一句話點明：「『洗衣服』是外在潔淨的表徵，神要求的是人裡頭的自潔。」GT《聖經精讀本》給的理由分兩層：「①為了教訓他們，罪惡滿盈的人類若不聖潔絕不可能與神有交通；②同時要通過外表的聖潔來達到內心的聖潔」；GT《串珠聖經註釋》另注意到一個敘事上的訊號：「『洗衣服』經常表示將有事情發生」（創35:2）。KC
    把這個要求推到信徒身上：「我們是否顧念祂再來時我們與祂的相會，而使自己的生活分別為聖呢」（約壹3:2-3）？


    ### 從被動被潔淨，到自己分別出來


    出19 的自潔是摩西奉命去做的一件事：叫他們今天明天自潔，又叫他們洗衣服，到第三天要預備好了。那裡的重點在第三天——山要冒煙、神要降臨，界限先劃好，人才不至於闖上去。潔淨在那一章是為了不被擊殺。


    書3:5 用的是同一個動作，處境卻整個翻過來。約書亞說的是明天耶和華要在他們中間行奇事，而奇事的內容是替他們把攔路的河挪開。==同一個命令，一次是為了不靠近，一次是為了走過去。==


    還有一點值得記下來：出19 的自潔由摩西轉達並執行監督，書3:5 的自潔由約書亞一句話交給百姓自己，經文沒有再交代任何檢查程序。GT《約書亞記研經資料》指出約書亞記全卷只有兩處要百姓自潔，另一處是書7:13——那一次是亞干犯罪之後，方向又回到出19
    那一邊。


    GT《聖經精讀本──約書亞記註解》替這條線加了一個限定：對聖潔的命令並不是行神跡的條件，神已定意引領以色列百姓進入迦南，是在神主權性的恩典與榮耀的臨在面前，百姓才有義務聖潔。這個說法同時適用於兩章——山下的潔淨與河邊的潔淨，都不是換取神行動的代價。'
