  summary: |-
    第21節「我就貪愛這些物件」，STEP 為 va./'ech.me.De/m（H2530A，簡要詞典義 cha.mad: to desire）。CT 原文字義給「貪愛」渴望、貪圖，並說這是引動心裡的貪婪，原文與十誡中的「貪戀」相同（出20:17；申5:21）。GT《丁道爾聖經注釋》說動詞「貪愛」和十誡中的第十誡用字完全相同，並指出亞干的罪起於他看見一件美好的東西，而在伊甸園女人犯罪時也是用同一個字描述（創3:6）。KC 把亞干的路數說成看見、貪愛、拿取的老故事（創3:6；約壹2:16；雅1:14-15）。
