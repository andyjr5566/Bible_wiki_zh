- title: 直到今日
  path: link_folder/主題/直到今日.md
  summary: |-
    第26節出現兩次：「眾人在亞干身上堆成一大堆石頭，直存到今日」與「因此那地方名叫亞割谷……直到今日」。CT 說堆石作記號（參創31:51-52），並說『轉意』意指不再紀念以色列人的過錯。BH 說石堆的持續存在表示這件事已經進入以色列被記住的歷史，經過那谷的人都要面對背逆的代價與忠心順服的必要（申6:12），並在同一段把它連回書4:9 約書亞在約但河中所立的十二塊石頭。GT《研經資料》另指出「直存到今日」這個片語在七十士譯本中沒有。
