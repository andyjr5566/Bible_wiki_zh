- title: 烏陵和土明
  path: link_folder/原文/烏陵和土明.md
  summary: |-
    第14至18節按支派、宗族、家室、人丁一層層「取」出亞干，經文沒有說明方法。STEP 第15節為 ha./nil.Kad（H3920，簡要詞典義 la.khad: to capture，context gloss 作 the one who is taken by lot）。GT《雷氏研讀本》說「取」的方法是抽籤；GT《啟導本》說取出亞干所用方法可能是抽籤，舊約時代常用此法尋求神旨（撒上10:20；14:41），所用工具或為掛在大祭司胸牌裡的烏陵和土明；GT《串珠》說這裡沒有說明用什麼方法取出，可能是用烏陵和土明（出28:30；撒上28:6）；GT《華爾頓約書亞記背景注釋》說經文並沒有說明辦法，部分譯本加上「拈鬮」字樣，但在以色列拈鬮通常是在答案有隨機成分之時才用得著，這時他們所尋求的是神諭，若所用步驟與烏陵土明相同，答案必定要超乎或然率的可能才升格為神的諭示，而鑒於事先的自潔程式，他們可能不是用任何方法而是直接領受神的訊息。BH 說很可能是藉著擲聖籤。
  relation: 這是條目第一次遇到疑似使用、但經文不說的情況。前面幾章寫的是烏陵土明放在哪裡、交給誰；本章寫的是一個需要神諭的場合，而各家只能推測用的是不是它。
