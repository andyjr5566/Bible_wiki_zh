- title: 石刑
  path: link_folder/背景/石刑.md
  summary: |-
    第25節「於是以色列眾人用石頭打死他，將石頭扔在其上，又用火焚燒他所有的」。STEP 顯示這一節用了兩個不同的動詞：va/i.yir.ge.Mu ... 'E.ven（H7275，簡要詞典義 ra.gam: to stone）在前，中間是 va/i.yis.re.Fu ... ba./'Esh（H8313 加 H784），然後是 va/i.yis.ke.Lu ... ba./'a.va.Nim（H5619，簡要詞典義 sa.qal: to stone）。CT 說兩次動用「石頭」，第一次是扔石打死，第二次是扔石掩蓋。GT《靈修版聖經注釋》說以色列人要把亞干全家用石頭打死，不讓罪的痕跡存留在他們中間，並說今天我們處於主張寬容、一人做事一人當的社會，很難理解那樣嚴格處罰的命令，但在古代習俗之中那是普通的刑罰。KC 提醒以色列的管教與基督徒的管教有分別，基督徒的管教一直以靈魂的挽回為念（林前5:5）。
  relation: 出21 到申17 都是條文——誰該被石打死、由誰先下手、在哪裡執行。本章是這套條文第一次在敘事裡被執行，而且執行的人是「以色列眾人」。
