- title: 滅絕（herem）
  path: link_folder/神學/滅絕（herem）.md
  summary: |-
    第1、11、12、13、15節反覆出現的「當滅的物」，STEP 都是 Che.rem（H2764A，簡要詞典義 che.rem: devoted thing）；第12節「成了被咒詛的」在原文也是同一個字。CT 原文字義給「當滅的物」禁忌、被咒詛的，並在第12節註明「被咒詛的」與「當滅的物」原文同字，意指他們自己成了當滅之物。GT《綜合解讀》說「當滅的物」原文是「被奉獻的東西、完全獻上」，特指必須被奉獻給神的東西，這是在本章反覆出現的關鍵字；GT《研經資料》說第12節「被咒詛的」原文就是「當滅之物」。KC 說本該歸耶和華的東西被亞干偷去歸了自己——東西在耶利哥人手上是放錯了地方，在亞干手上同樣是放錯了地方。BH 說亞干把神所歸己的當作私人戰利品，並把在審判之下的東西帶進以色列營中。
  relation: 上一章是命令，本章是命令被違反之後的結果——而結果不是罰款，是身分的翻轉：拿了當滅之物的人自己成了當滅之物。
