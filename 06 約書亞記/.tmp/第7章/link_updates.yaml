- title: 心消化（ma.sas）
  path: link_folder/原文/心消化（ma.sas）.md
  summary: |-
    第5節「眾民的心就消化如水」。STEP 為 va/i.yi.Mas le.vav- ha./'Am va/y.Hi le./Ma.yim（H4549，簡要詞典義 ma.sas: to melt，加 H3824 le.vav 與 H4325G ma.yim）。CT 原文字義給「消化」溶化、溶解，並說『消化如水』形容士氣渙散、失去勇氣。GT《研經資料》說以色列人本來以為自己有神的帶領、絕對不可能被打敗，事實上他們剛剛經過耶利哥神蹟式的勝利，但現在一個小小的艾城就殺了他們36人，當然導致他們信心崩潰。KC 注意到方向反了過來——這一次融化的是神百姓的心，不是仇敵的心（參書2:9、11；書5:1）。BH 說以軍事標準看這損失很小，但在耶利哥的大勝之後卻是毀滅性的。
