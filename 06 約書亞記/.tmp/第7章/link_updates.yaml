- title: 申24：16
  path: link_folder/互文/申24：16.md
  summary: |-
    第24節把亞干的兒女一併帶到亞割谷，而申24:16 明說不可因父殺子。CT 在文意註解與話中之光兩處都引這條律法，說本來按照律法條例父親犯罪不可懲罰子女，此案他們可能同謀掩蓋或知罪不揭發，故須連帶處刑；GT《串珠聖經注釋》說按申24:16 亞干的家人原本不會受牽連，但他們明顯是知情不報甚至有分參與；GT《啟導本》說亞干的家人一定也參與其事並代隱瞞，否則不會一起判死刑（申24:16；民26:11）；GT《聖經精讀本》以「據申24:16，父親的罪不能歸到子女身上」開場，然後列出四種解釋。BH 也在同一節下說以色列的律法維持個人在神面前的責任——不可因父殺子、也不可因子殺父。
  relation: 出20 引這條律法是為了解釋神追討罪自父及子的說法不等於株連，本章引它是因為經文本身看起來就像株連。同一條律法，一次用來排除誤解，一次用來標出難題。
