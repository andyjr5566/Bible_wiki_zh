book: 約書亞記
chapter: 7
review_schema_version: 2
review_baseline: link_update_review_baseline.yaml
review_guidance:
  review_input: 判斷前先讀同資料夾的 review_evidence.md：它逐條列出目標條目的定義全文、主題發展段落索引與已累積章清單；段落索引不足以判定時再開條目原檔。再把本章 summary／relation 與既有內容一起判斷。
  review_evidence: review_evidence.md 由 prepare 產生，是本章審查的證據檔；它取代逐一開啟每個條目的讀法，但不取代 already_covered 的逐字舉證。
  definition: 定義回答『這是誰／什麼、如何辨識、範圍與邊界是什麼』；只在本章資料改變或澄清條目的穩定身分時更新，不得寫成本章事件摘要。
  development: 主題發展是跨章綜合：至少使用兩個章節（可跨卷）的累積，說明推進、轉折、對照或整體意義；不是逐章累積的加長版，不得把本章 summary／relation 換句話說後貼進來。正確形狀：從前幾章講起、把本章當這條線的終點或轉折點，只寫跨章之間怎麼推進；本章的細節與引句留在本章 summary，主題發展不再重述一遍。定義與主題發展裡的經文引註一律寫「書卷簡稱＋章:節」（申32:15、民35:33），不可只寫「第15節」——條目是跨書卷跨章的，裸節號無從判斷是哪一卷哪一章；逐章累積在條目裡有章號標題涵蓋，可續用「第15節」。
  accumulation: 逐章累積只記本章明確資料：summary 是本章重點，relation 是本章與條目的關聯；每章各自成塊，不負責總體定義或跨章綜合。
  decision_rule: 每個 B 類條目只須分別填 definition／development 的 keep 或 update；這是審查義務，不是更新配額，全部 keep 也可通過。程式提出 challenge 而仍選 keep 時，才用受控 basis 代碼；update 則由實際區塊 diff 證明。
  keep_basis: definition 可用 no_identity_change／already_covered／insufficient_evidence；development 可用 already_covered／single_chapter_only／insufficient_evidence／standing_debt。沒有 challenge 時直接填 keep。填 already_covered 必須同時給 covered_by：從該區塊現有內容逐字節錄一句，程式會比對；引不出來就不是 already_covered。條目本身欠帳（累積過多或主題發展空白）而本章只給了一句帶過的提及時，填 standing_debt——它會被記進 util/output/development_debt.json 等維護回合處理，不是把問題抹掉；這種情況不可用 insufficient_evidence。
  signals: first_in_book=首次進入本卷；definition_blank／development_blank=總體區塊空白；many_accumulations=新增後達 7 筆或其後每隔 5 筆（7, 12, 17...）之提醒門檻。signals 只提高注意，不等於必須 update。
updates:
- title: 約書亞
  path: link_folder/人物/約書亞.md
  summary: |-
    第2節打發人去窺探艾城，第6節撕裂衣服、把灰撒在頭上、在約櫃前俯伏到晚上，第7至9節向神哀求，第16節清早起來執行掣籤，第19節稱亞干為「我兒」並勸他認罪，第22節打發人去帳棚取贓，第25節宣告刑罰。GT《丁道爾聖經注釋》說這場戰役的描述可謂獨一無二，只有這裡沒有提到約書亞在率領；GT《研經資料》說許多人提及這場戰役並沒有記載約書亞的領導，或者神的帶領。KC 說約書亞下令時沒有求問耶和華，而且是從耶利哥而不是從吉甲打發人出去，又說他掣籤取出亞干之後並沒有咒罵他、也沒有稱他為賊，稱他「我兒」正顯出約書亞把自己看得與亞干相連；但 KC 同時說，約書亞的禱告帶著一點責備，好像神要為這場敗仗負責，這不是出於信心。BH 說約書亞在約櫃前自卑，並訴諸耶和華在列國中的尊榮，正如摩西在西乃之後所做的（出32:11-14）。
  relation: 前六章的約書亞一直在領受命令、下達命令；本章是他第一次做完決定才發現沒有問過神，也是他第一次對神說出質問的話。他的名字在本章出現十二次，卻沒有一次是在戰場上。
  overview_review:
    signals: []
    accumulation_count:
    - 23
    - 24
    definition: keep
    development: keep
- title: 艾
  path: link_folder/地點/艾.md
  summary: |-
    第2至5節與全章的戰場。STEP 第5節為 'an.Shei ha./'Ai（H5857G，簡要詞典義 ay: Ai）。CT 說艾是一座小城，可能因其地理外貌奇特故取名艾，原文字義「荒場」；GT《雷氏研讀本》說艾城位於巴勒斯坦山區的中部、在伯特利以東、距離耶利哥約有十五英里；GT《啟導本》說「艾城」有「荒堆」的意思，一說位於伯特利東約1公里半；GT《研經資料》說一般認為這就是耶利哥西北15公里的特珥（et~Tell）遺址，艾城又名「亞雅」（尼11:31）和「亞葉」（賽10:28）；GT《綜合解讀》說艾城海拔890米、耶利哥在海平面以下250米，艾城守軍居高臨下追擊以色列人，CT 也說艾城的海拔約800公尺、耶利哥僅約300公尺。KC 說 Ai means ‘mess’。BH 說艾的意思是 “ruin”，看起來遠不如耶利哥難攻，但接下來的事顯明得勝不在乎以色列的力量或敵人的大小。
  relation: 這是艾第一次成為事件發生的地點。在創13 它只是伯特利與艾這組座標裡的一半，本章它變成一座打不下來的城，而且是打不下來的原因不在城本身。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development:
      decision: update
      synthesis_scope:
      - 創世記:13
      - 約書亞記:7
- title: 伯特利
  path: link_folder/地點/伯特利.md
  summary: |-
    第2節「往伯特利東邊、靠近伯亞文的艾城去」。CT 說伯特利是舊約中一個重要城市，位於耶路撒冷北面約十七公里，原文字義「神的家」；GT《綜合解讀》說伯特利字義是「神的殿」，位於耶利哥西面的中央山地，是神第一次向雅各顯現的地方（創28:19）；GT《研經資料》說位於耶路撒冷北方大約18公里，並說許多學者認為約書亞時代艾城並非一個城堡、反倒是附近的伯特利是一個大城。BH 說艾靠近伯特利，而伯特利意為「神的家」，是雅各領受神關於這地與後裔之應許的地方，所以這一帶帶著立約的分量——以色列不只是在取得領土，是在領受應許給亞伯拉罕、以撒、雅各的產業。
  relation: 本章只把伯特利當座標用，但它與同一節的「伯亞文」（罪孽之家）並列，讓這句定位讀起來像一組對照。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 7
    - 8
    definition: keep
    development: keep
- title: 耶利哥
  path: link_folder/地點/耶利哥.md
  summary: |-
    第2節「約書亞從耶利哥打發人往伯特利東邊、靠近伯亞文的艾城去」。CT 說『當下』指攻取耶利哥城之後，並說艾城的海拔約800公尺、耶利哥僅約300公尺，故第5節的地勢呈下坡；GT《綜合解讀》說耶利哥在海平面以下250米、艾城海拔890米。KC 注意到約書亞是從耶利哥而不是從吉甲打發人出去，並問這是不是已經透露了犯罪的緣由。BH 說耶利哥的財物歸神所有，亞干把神所歸己的當作平常的擄物；BH 又說在耶利哥的大勝之後，這場小敗把全營的自信變成了懼怕。
  relation: 上一章耶利哥是被攻下的城，本章它變成兩件事的出發點——出兵的起點，以及那三樣贓物的來處。
  overview_review:
    signals: []
    accumulation_count:
    - 14
    - 15
    definition: keep
    development: keep
- title: 約但河
  path: link_folder/地點/約但河.md
  summary: |-
    第7節「你為什麼竟領這百姓過約但河……我們不如住在約但河那邊倒好」。STEP 為 he.'a.Var.ta ha.'a.Vir（同一個 H5674C 連用不定詞絕對式與完成式）加 hai./yar.Den（H3383）與 be./'E.ver hai./yar.Den（H5676H，簡要詞典義 e.ver: side: beyond）。CT 說『約但河那邊』即指約但河東邊。GT《研經資料》把約書亞的質問還原出來——如果進入迦南是為了送死，那麼神何必領以色列人過約旦河呢？過約旦河的神蹟又有什麼價值呢。BH 說神已經藉著公開的神蹟領以色列過了約但河、印證了賜地的應許，而艾城之敗並沒有推翻應許，只是揭露營中隱藏的罪。
  relation: 過河在書3-4 是神蹟與紀念碑，本章卻成了約書亞質問神的理由。這是第一次有人把「過河」說成一件不如不做的事。
  overview_review:
    signals: []
    accumulation_count:
    - 25
    - 26
    definition: keep
    development: keep
- title: 示拿
  path: link_folder/地點/示拿.md
  summary: |-
    第21節「一件美好的示拿衣服」，STEP 為 'a.De.ret shin.'Ar（H155，簡要詞典義 ad.de.ret: clothing，加 H8152）。CT 原文字義給「示拿」吼獅之地、兩河，並說『示拿衣服』產自巴比倫的一種長袍，是以金線和絲線為材料、用精細手工編織成的，價款不貲；GT《啟導本》說示拿即巴比倫之地，故此袍乃舶來品、價值不菲，並推測這可能是禮拜偶像的衣飾；GT《串珠》說示拿為古巴比倫的別名，其文化對巴勒斯坦和敘利亞影響深遠；GT《綜合解讀》說這裡用「示拿」來稱呼巴比倫、用「條」來描述金子，只在主前第二千年的文獻中出現，表明本書的第一手資料很古老；GT《華爾頓約書亞記背景注釋》說這時代的巴比倫（示拿）衣服是有纓絡的，穿起來披在一邊肩膊上。KC 把示拿連到創11:4、9 的城與塔。BH 說這件昂貴的外袍來自與巴比倫相關的示拿地區。
  relation: 示拿在創世記是一個地名與一段建塔的往事，本章它縮小成一件衣服——一件在迦南出現、卻讓亞干賠上性命的舶來品。
  overview_review:
    signals:
    - first_in_book
    - development_blank
    accumulation_count:
    - 1
    - 2
    definition: update
    development:
      decision: update
      synthesis_scope:
      - 創世記:14
      - 約書亞記:7
- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  summary: |-
    第1、16、17、18節。掣籤第一輪取出來的就是猶大支派。GT《聖經精讀本》說猶大支派在12支派中處於領袖地位，在出埃及時人數最多（民1:27），勢力強大，在與外邦人的爭戰中經常充當先鋒。KC 說亞干屬於君尊的猶大支派，而這罪發生在他們中間，正可以救他們脫離自誇。BH 說猶大是雅各祝福中得王權的支派（創49:10），大衛與基督都從猶大出，而如今它因罪進入其中而受查驗，顯明尊貴的身世不能作為背逆神的藉口。
  relation: 前面幾卷寫的是猶大的領先地位——人數最多、行軍在前、承受王權的應許。本章第一次寫它被查驗，而且是四層掣籤裡第一個被取出來的。
  overview_review:
    signals:
    - first_in_book
    - many_accumulations
    accumulation_count:
    - 11
    - 12
    definition: keep
    development:
      decision: keep
      basis: standing_debt
- title: 謝拉
  path: link_folder/人物/謝拉.md
  summary: |-
    第1、17、18、24節「謝拉的曾孫」「謝拉的宗族」。STEP 為 Ze.rach（H2226I）。CT 原文字義給「謝拉」升起；GT《研經資料》說謝拉字義是「升起」，是猶大和他瑪的兒子、法勒斯的雙生兄弟。BH 說掣籤把範圍縮到謝拉的後裔，也就是猶大從他瑪所生的那一支（創38:29-30）。
  relation: 創38 的謝拉只是一個出生順序上的配角，本章他成了一個宗族的名字——而這個宗族是掣籤第二輪被取出來的那一支。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  summary: |-
    第7節「將我們交在亞摩利人的手中」。STEP 為 ha./'e.mo.Ri（H567，簡要詞典義 e.mo.ri: Amorite）。CT 說『亞摩利人』身材高大，居住在約但河兩岸高地；GT《研經資料》說「亞摩利人」是「山居者」之意，泛指迦南地的原住民。BH 說亞摩利人是迦南主要的民族之一，約書亞在這裡用這個名字泛稱那地的居民。
  relation: 條目已經記下這個名字時而指盟友、時而指被逐的對象、時而是迦南諸族的統稱。本章是統稱的用法，而且出自約書亞自己的口——他把敗仗說成「交在亞摩利人的手中」。
  overview_review:
    signals:
    - many_accumulations
    accumulation_count:
    - 16
    - 17
    definition:
      decision: keep
      basis: already_covered
      covered_by: 「亞摩利」意為「高處之人」或「西方人」。
    development:
      decision: keep
      basis: single_chapter_only
- title: 迦南人
  path: link_folder/人物/迦南人.md
  summary: |-
    第9節「迦南人和這地一切的居民聽見了就必圍困我們」。STEP 為 ha./ke.na.'a.Ni（H3669A）加 ve./na.Sa.bu（H5437H，簡要詞典義 sa.vav: to turn: surround）。CT 原文字義給「圍困」圍繞、環繞，並說這一戰會讓迦南人認為以色列的神並不是不可戰勝的，迦南人若傾巢而出圍困他們，以色列人退路已斷、必然會被除滅。GT《聖經精讀本》說迦南諸民族本因神的權能而大為懼怕，但他們一旦聽到以色列遭到慘敗的消息之後，便會重振士氣、猛烈地攻打以色列；GT《啟導本》說迦南人一旦發現以軍不堪一擊，必聯手傾巢而出、圍攻以民，後面為洪水氾濫之河流，退路已斷。BH 說艾城之敗有可能壯了迦南各族的膽。
  relation: 書2 與書5 寫的是迦南人聽見以色列的事就心裡消化，本章反過來——約書亞擔心他們聽見的下一個消息會讓他們重新站起來。
  overview_review:
    signals: []
    accumulation_count:
    - 13
    - 14
    definition: keep
    development: keep
- title: 以色列的長老
  path: link_folder/文化/以色列的長老.md
  summary: |-
    第6節「他和以色列的長老把灰撒在頭上」。STEP 為 ve./zik.Nei Yis.ra.'El（H2205G，簡要詞典義 za.qen: old: elder，形態是陽性複數附屬形）。GT《研經資料》說「以色列的長老」原文是複數型態，應該是指以色列各支派的領袖。BH 說眾長老與約書亞一同自卑，顯示這場失敗被當成全民的事、不是單一將領的挫折。
  relation: 條目已經收了長老作代表、作證人、作執法者與代全城認責的幾種角色。本章是他們與領袖一同哀慟——沒有開庭、沒有執法，只是陪著俯伏在約櫃前。
  overview_review:
    signals:
