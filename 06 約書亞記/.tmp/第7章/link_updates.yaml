- title: 古代哀悼習俗
  path: link_folder/背景/古代哀悼習俗.md
  summary: |-
    第6節「約書亞便撕裂衣服；他和以色列的長老把灰撒在頭上」。STEP 為 va/i.yik.Ra' ... sim.lo.Ta/v（H7167，簡要詞典義 qa.ra: to tear，加 H8071 sim.lah）與 va/i.ya.'a.Lu 'a.Far 'al- ro.Sha/m（H5927H 加 H6083，簡要詞典義 a.phar: dust）。CT 說『撕裂衣服……灰撒在頭上』是極其悲痛的表示（參士11:35；撒上4:12）。GT《啟導本》說「撕裂衣服」是極其悲痛的表示（參士11:35）；GT《串珠》說「撕裂衣服」、「把灰撒在頭上」是悲哀的記號；GT《聖經精讀本》說當希伯來人陷入極大的痛苦與苦惱時，他們便會撕裂衣服並把灰撒在頭上，以此表示內心的痛苦（創37:34；民14:6；撒下1:11），後來這種風俗漸漸流於形式，先知約珥以沉痛的心督促人們悔改（珥2:13）；GT《綜合解讀》說這是古代中東人表示痛苦的方式（創37:34；民14:6；伯2:12）；GT《研經資料》列出一串平行經文（創37:29、34；創44:13；民14:6；哀2:10；結27:30），並說「直到晚上」顯示約書亞的哀痛不是短時間的情緒表現。
  relation: 創37 的兩次撕裂衣服都是為著死人，本章這一次是為著一場敗仗——而哀悼的地點在約櫃前，動作因此同時是禮儀與祈求。
