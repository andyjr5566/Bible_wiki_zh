- title: 自潔
  path: link_folder/神學/自潔.md
  summary: |-
    第13節「你起來，叫百姓自潔，對他們說：你們要自潔，預備明天」。STEP 為 ka.Desh ... hit.ka.de.Shu（都是 H6942G，簡要詞典義 qa.dash: to consecrate，前者 Piel 命令式、後者 Hitpael 命令式）。CT 原文字義給「自潔」使成聖、分別，並說指沐浴洗身、洗衣服（出19:10）。GT《丁道爾聖經注釋》說這裡沒有詳述以色列人要怎樣自潔，但利未記17至26章說明了怎樣才是聖潔的子民，而按約書亞記的情境與以下幾節的戰爭用語來看，這裡應當是指為打仗而自潔；GT《雷氏研讀本》說是藉潔淨的行為自潔（參出19:10-15）。BH 說自潔包含離開污穢、把自己分別出來歸給耶和華的聖潔同在與旨意，這道吩咐讓人想起書3:5 過約但河之前的自潔。
  relation: 出19 與書3 的自潔是為了迎接神要做的事，本章的自潔是為了查出營中的罪。同一個動作，第一次被放在審查程序的開頭。
