    definition: keep
    development:
      decision: keep
      basis: single_chapter_only
- title: 約櫃
  path: link_folder/主題/約櫃.md
  summary: |-
    第6節「在耶和華的約櫃前俯伏在地，直到晚上」。STEP 為 li/f.Nei 'a.Ron Yah.weh（H727，簡要詞典義 a.ron: ark）。CT 說『約櫃前』意指在神面前。KC 注意到一個對比：攻取耶利哥時約櫃佔中心位置，攻打艾城時卻完全沒有提到約櫃，戰敗之後約書亞才回到約櫃前在耶和華面前自卑。BH 說約書亞在約櫃前自卑，約櫃是耶和華在以色列中間居所與立約同在的記號。
  relation: 書3、書4、書6 的約櫃都在隊伍中間被抬著走，本章它一次也沒有出營。它出現的唯一一次，是有人回到它前面趴下。
  overview_review:
    signals: []
    accumulation_count:
    - 14
    - 15
    definition: keep
    development: keep
- title: 認罪
  path: link_folder/主題/認罪.md
  summary: |-
    第19至21節。約書亞說「在他面前認罪，將你所做的事告訴我，不要向我隱瞞」，亞干回答「我實在得罪了耶和華─以色列的神。我所做的事如此如此」，然後把三樣贓物一一說出來。STEP 第19節為 ve./ten- l/o to.Dah（H8426，簡要詞典義 to.dah: thanksgiving，context gloss 作 confession）加 'al- te.kha.Ched（H3582，簡要詞典義 ka.chad: to hide）。CT 說『將榮耀歸與神』意指承認神是無所不知、無所不能的，在祂面前是不能掩蓋、隱藏的，所以要向祂認罪，而「將你所作的事告訴我」表示同時也要將事情向人有所交代。GT《丁道爾聖經注釋》說這時亞干惟一該做的事，就是把自己所犯的罪一五一十的講出來。KC 說神只說有人偷了東西（第11節），卻沒有說偷了什麼，祂要犯罪的人自己說出來——神不要籠統的認罪，祂要我們把罪指名道出；KC 同時指出，亞干雖然把贓物一一指名說出，卻沒有一處證據顯示他為自己的行為後悔。BH 說舊約的認罪常是公開的承認，並說認罪意味著同意神對自己行為的判斷。
  relation: 利未記與民數記的認罪是律法條文裡的一個步驟，本章是它第一次以敘事出現——有人真的被要求開口，而且真的開了口。也是第一次看見認罪與悔改可以分開。
