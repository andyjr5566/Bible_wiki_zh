- title: 舍客勒
  path: link_folder/原文/舍客勒.md
  summary: |-
    第21節「二百舍客勒銀子，一條金子重五十舍客勒」，STEP 為 she.ka.Lim（H8255，簡要詞典義 she.qel: shekel）加 mish.ka.L/o（H4948，簡要詞典義 mish.qal: weight）。CT 說『二百舍客勒』約折合二點三公斤、『五十舍客勒』約折合575公克；GT《聖經精讀本》說舍客勒是測量重量的基本單位，1舍客勒約有11.4克，後來成為貨幣單位；GT《綜合解讀》說二百舍客勒的銀子重2.28公斤、大約是當時一個雇工17年的工資，五十舍客勒的金子重0.57公斤；GT《雷氏研讀本》說二百舍客勒約重五磅（2.3千克）；GT《華爾頓約書亞記背景注釋》說亞干所藏的包括了五至六磅銀子、半條金子，這代表一般人工作一輩子的所得。
