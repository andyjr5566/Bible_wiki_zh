name: 隱示麥泉
type: 地點
secondary_types: []
aliases: []
status: formal
definition: |-
  書15:7 猶大的北界「又接連到隱示麥泉，直通到隱羅結」。

  **名字。** CT 與 GT《約書亞記研經資料》給的字義都是「太陽之泉」。GT《綜合解讀》說「隱」原文的意思是「泉水、眼睛」，凡是以「隱」開頭的地名，表明這裡有泉水。BH 也說它是乾燥山地裡的一處泉水，可靠的水源讓行路、定居與耕種成為可能。

  **在哪裡，兩家說法不同。** CT 說它位於耶路撒冷東方約3公里、橄欖山麓的一條小溪；GT《串珠聖經注釋》則說它近耶路撒冷，又稱「基訓泉」（王上1:33）。
accumulations:
- book: 約書亞記
  chapter: 15
  summary: |-
    第7節北界「接連到隱示麥泉」。字義「太陽之泉」；CT 說在耶路撒冷東方約3公里的橄欖山麓，GT《串珠》說它又稱基訓泉（王上1:33）。
  relation: |-
    本章它是猶大北界貼近耶路撒冷的一個水源標點，下一站就是隱羅結。書18:17 便雅憫的南界會再經過它。
