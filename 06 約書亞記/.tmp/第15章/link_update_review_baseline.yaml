- title: 歌珊（迦南南部）
  path: link_folder/地點/歌珊（迦南南部）.md
  definition: '書10:41 說約書亞「又攻擊歌珊全地，直到基遍」。這個歌珊不是以色列人住過的埃及歌珊，而是迦南南部的一個地區——四套註釋在這一點上完全一致，所以這個條目要與埃及的歌珊分開。


    ### 四家都先做同一個切割


    CT 說『歌珊』不是指埃及的歌珊，而是指死海東面、山地南面的一塊地區，代表此次戰役的東界最南面。GT《約書亞記研經資料》說字義是「拉近」，此處指的是「巴勒斯坦南部一區，介於迦薩與基遍之中」，但實際位置不明，和埃及的歌珊不同。GT《丁道爾聖經注釋》說歌珊並不是以色列人離開埃及之前所住的那片地，而是書11:16
    的歌珊、和書15:51 相關，如果這城是指邊界可能是指東南方朝向死海和南地的界線。GT《華爾頓約書亞記背景注釋》說如書11:16 和書15:51 所示，「歌珊」不是指埃及三角洲同名的地區，而是猶大山地的一個區域、山地盡南面的遺址都位於此。GT《雷氏研讀本》與
    GT《綜合解讀》同樣說這不是埃及的歌珊，而是迦南南部的地名。GT《串珠聖經注釋》說歌珊大概指南巴勒斯坦地。


    BH 說這裡的歌珊是南迦南境內的一個地區，與雅各家住過的埃及之地不同。


    ### 它在書10:41 的功能


