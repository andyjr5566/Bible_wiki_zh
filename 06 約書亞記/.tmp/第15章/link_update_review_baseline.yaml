- title: 以東
  path: link_folder/地點/以東.md
  definition: 以掃的別名（創25:30），也是以掃後裔所建立的國家名稱、及其居住之地。位於死海東南方，盛產紅色砂岩。名字意為「紅」。地理上包含西珥山區（創14:6;
    36:8-9），以掃住在西珥山（創36:8-9），即以東地（創32:3「西珥地，就是以東地」）。
  development: '### 一個名字，三種來源


    「以東」在創世記二十五章出現得很曲折。第25節以掃「身體發紅」——CT 註「紅」的原文與「以東」同音同字，而「毛」的原文與「西珥」（以東地的一座山名）同音同字。第30節他為了紅豆湯開口，「因此以掃又叫以東」。


    換句話說，這個名字同時扣住了他的外表與他的一次選擇。GT《聖經精讀本──創世記註解》把後者說得更直白：以掃的膚色本來就發紅，加上這次紅豆湯事件，「人們以譏笑的口吻叫他『以東』（紅）」。BH
    也指出這個名字後來成為他後裔的族名，而以東人定居在死海以南的地區。


    ### 兩國從出生就分開


    第23節的神諭把個人恩怨提升為國族史：「兩國在你腹內；兩族要從你身上出來。」CT 指雙胞胎在腹中相爭預示將來以色列人和以東人相爭（撒下八12-14；代下二十五11-24）。GT《聖經精讀本──創世記註解》說這預言在日後雅各子孫征服以掃子孫的歷史中如實成就（撒下八13-14；代下二十一8）。BH
    舉大衛制伏以東人（撒下八14）為例，並指以東的結局在俄巴底亞書中被宣告。


    GT 華爾頓《創世記背景註釋》在此加了一個要緊的界線：這個神諭「與其說是關於兒子本身，不如說神諭所討論的，是二人要建立之家系至終將會如何」，而「這種神諭不會對父母提供如何對待子女的細節」。以東與以色列的關係，是族系層面的事，不是兄弟性格的直接延伸。


    ### 分寸


    KC 提醒一個常被跨越的時間差：經文在這裡並沒有說神恨惡以掃。那句話寫在瑪拉基書一2-3，是一千四百年之後；照 KC 的說法，要等到以掃在他的後裔身上顯明了自己敗壞悖逆的真面目，那句話才說得出來。KC
    並說：若以掃安於神在他出生之前所給他的位置，他本可以從中得著完全的祝福。


    ### 律法給的是另一個方向


    創世記那條線走的是相爭：腹中相爭、名字的由來、族系至終的分別。申命記二十三章第7節卻給了一條相反方向的吩咐：「不可憎惡以東人，因為他是你的弟兄。」


    理由不是以東做了什麼好事，而是血緣本身。CT 說「『以東人』以東人是以掃的後代(參創三十六9)，和以色列人的祖先有血緣關係」；KC 讀得更近一步，說以東是與神百姓血緣最近的親屬，因為以掃是雅各的孿生兄弟，而亞捫和摩押那一支（羅得的後裔）還要遠一層。


    值得注意的是這條吩咐下在什麼背景上。GT《啟導本聖經申命記註釋》指出以東人曾在曠野中和以色列人作對（民二十10～21），神仍要以色列人以德報怨；而同一章前面幾節，亞捫人與摩押人才剛被判定永不可入耶和華的會。==同樣曾經為敵，判決卻不同：亞捫和摩押被記的是他們做過的事，以東被記的是他是誰。==第8節接著開門——他們第三代子孫可以入耶和華的會。'
  signals:
  - first_in_book
  accumulation_count:
