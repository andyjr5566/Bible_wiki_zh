- title: 趕出（ya.rash）
  path: link_folder/原文/趕出（ya.rash）.md
  definition: '書13 有四處經文，和合本分別譯作「未得」「趕出」「趕逐」三種說法，STEP 原文資料顯示用的是同一個動詞 ya.rash（H3423H，簡要詞典義
    to possess: take）：


    | 經文 | 和合本 | STEP 字形 | 形態碼 | 本節逐字譯義 |

    |---|---|---|---|---|

    | 書13:1 | 還有許多「未得」之地 | le./rish.Ta/h | HR/Vqcc/Sp3fs | to/ take possession of/
    it |

    | 書13:6 | 我必在以色列人面前「趕出」他們去 | ''o.ri.She/m | HVhi1cs/Sp3mp | I will dispossess/
    them |

    | 書13:12 | 這些地的人都是摩西所擊殺、所「趕逐」的 | va/i.yo.ri.She/m | Hc/Vhw3ms/Sp3mp | and/ he
    had dispossessed/ them |

    | 書13:13 | 以色列人卻沒有「趕逐」基述人、瑪迦人 | ho.Ri.shu | HVhp3cp | they dispossessed |


    書13:1 的形態碼是 Vq，譯義是 take possession（取得、佔有）；後三處的形態碼都是 Vh，譯義是 dispossess（使人失去產業、把人趕出）。一邊是自己得地，一邊是把原來住的人趕走，在原文裡用的是同一個動詞。這三個
    Vh 的主詞也不同：書13:6 是神自己以第一人稱說要趕出，書13:12 是摩西，書13:13 是以色列人，而且是否定句。


    **註釋怎麼讀這個字。** CT 的原文字義在書13:1 把「得」註為「佔有」，在書13:13 把「趕逐」註為「佔有，剝奪」，兩處註的正是同一組意思。GT《約書亞記研經資料》把書13:1
    直譯為「剩下要去得之地極多」。KC 從這一組意思講屬靈應用：征服那地，表示那地還在仇敵手裡；享受那地與取得那地連在一起，而取得只能靠把仇敵趕走。BH 在書13:13
    說，以色列各支派沒有完成在河東所分得之地的取得，基述與瑪迦繼續住在以色列的產業裡，使百姓暴露在外族的政治結盟與異教敬拜之下。'
