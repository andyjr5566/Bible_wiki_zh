- title: 亞巴（亞衲族）
  path: link_folder/人物/亞巴（亞衲族）.md
  definition: '書14:15：「希伯崙從前名叫基列亞巴；亞巴是亞衲族中最尊大的人。」基列亞巴的意思就是亞巴的城，這座城因他得名。名字後面加「亞衲族」，是為了和用作地名的「亞巴」分開。


    **名字。** CT 給的原文字義是「偉人，四，巴力的力量」；GT《約書亞記研經資料》說「亞巴」字義是「第四」，「基列亞巴」字義是「亞巴之城」。STEP 把「基列亞巴」整個標為一個地名
    kir.Yat ''ar.Ba''（H7153，簡要詞典義 qir.yat ar.ba: Kiriath-arba）；後面那句是 ha./''a.Dam（the
    man）ha./ga.Dol（great）ba./''a.na.Kim（among the Anakites），和合本譯作「亞衲族中最尊大的人」。


    **他是誰。** CT 說「基列亞巴」是亞衲族始祖亞巴佔據此城時所起的名字（參書15:13），迦勒取得後又改回叫希伯崙。KC 把亞巴讀作巨人：不論是怎樣的巨人，都在希伯崙這座與死亡相連的城走到盡頭。BH
    說亞巴的名聲代表亞衲族的強大，正是那股力量曾經嚇倒在加低斯巴尼亞不信的那一代；迦勒取得希伯崙，表明應許那地的神比佔據那地的仇敵更大。'
