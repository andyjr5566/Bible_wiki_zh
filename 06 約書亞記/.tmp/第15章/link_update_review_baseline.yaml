  development: '耶路撒冷在正典裡是慢慢浮出來的。創14:18 它叫撒冷，出場的是帶著餅和酒來祝福亞伯蘭的麥基洗德。申12 全章沒有點名它，只反覆說「耶和華所選擇的地方」，而註釋都把那個空著的位置指向它。書10:1
    是它第一次以耶路撒冷之名進入敘事——KC 就說除了創世記14章之外，這裡是耶路撒冷第一次被提及。


    它出場的身分卻是反面的。創14 的撒冷王祝福亞伯蘭，書10 的耶路撒冷王糾集四王去打亞伯蘭後裔的盟友；兩個王的名字都帶著公義，站的位置正好相反。KC 把這組對照講得最直接，BH
    也說亞多尼洗德的名字讓人想起麥基洗德，他自己卻站在敵對神旨意的位置。


    還有一件事書10 沒有做：它殺了耶路撒冷的王，卻沒有攻下耶路撒冷的城。申12 為它預留的那個制度位置，要到很久以後才真的落在這座城上。'
