- title: 迦勒
  path: link_folder/人物/迦勒.md
  definition: '迦勒是猶大支派耶孚尼的兒子（民13:6），十二探子之一，也是十二人中唯一在當場公開反對多數意見的人。


    **名字的意思，各家給的不完全一樣。** CT 的原文字義列出四個方向：「有才能的，勇敢，全心的，猛烈，狗」；GT《聖經精讀本》作「攻擊者」；KC 作「全心的」，並說「他配得這個名字。迦勒把自己毫無保留、完全獻上地交給耶和華和祂的事」。


    **他為什麼一個人出頭？** GT 丁良才給了一個很實際的理由：「大約是迦勒一人出頭說話。因為約書亞既是摩西的幫手，他若說話，百姓必想他有偏心。」


    **他的話在原文是兩重加強語氣。** STEP 原文資料顯示第30節「立刻上去」是 ''a.Loh na.''a.Leh（H5927G，詞典形 a.lah，不定詞絕對式配未完成式），「足能得勝」是
    ya.Khol nu.Khal（H3201，詞典形 ya.khol，同樣的結構）——正對得上 CT 所註的兩個「原文雙同字」。同節「安撫」是 va/i.Ya.has（H2013，詞典形
    ha.sah，詞典義 to silence），Hiphil 形。


    **他的信心不是無視危險。** KC：「迦勒完全清楚別人在講什麼。他沒有把事情說成另一個樣子，也沒有輕看危險。他不是對危險無感，而是一個相信神所說的話的人。這就是分別所在。」CT
    列出他能站得住的三個條件：「(1)有事實依據（迦勒親眼看見那地）；(2)有正確的態度（迦勒信靠神的應許）；(3)有足夠的信心。」'
  development: '迦勒在目前累積到的幾章裡，從一個探子一路走到領受產業的人，身上一直掛著同一句話。


