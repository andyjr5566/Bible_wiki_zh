- title: 瑪基大
  path: link_folder/地點/瑪基大.md
  definition: '瑪基大在書10 出現六次，是本章分量最重的地名之一：追擊的終點（書10:10）、五王藏身的洞所在（書10:16-17）、以色列人的前進營地（書10:21），最後是南征清單的第一座城（書10:28）。


    ### 位置與名字


    CT 的原文字義給「瑪基大」牧人之地，說它位於伯利恆西方約24公里、亞實突東方約26公里，又說它位於希伯崙和拉吉的中間，雖未參加五王的聯軍但關係不淺。GT《聖經精讀本》說瑪基大是位於耶路撒冷西南32公里處的城邑。GT《啟導本》說瑪基大在耶末城附近、不屬南方聯盟五城中，約書亞既擒了五王就乘勝攻襲此城。BH
    說瑪基大位於示非拉，也就是猶大的丘陵地帶。


    ### 它在敘事裡的位置


    GT《約書亞記研經資料》說「瑪基大」是書10:10 提到三個主要戰場（伯和崙、亞西加、瑪基大）之一，其中伯和崙和亞西加出現在書10:11-15，如今瑪基大在書10:16
    再度出現，將整個故事框住。GT《丁道爾聖經注釋》講同一件事：書10:16 的畫面和前一幅一樣，瑪基大讓人想到書10:10 那三個主要戰場，如今第三個地名出現了。


    GT《約書亞記研經資料》另外指出，瑪基大與亞西加相距甚遠，很可能是五王的軍隊被整個趕散掉；又說書10:21 的「回瑪基大營中」顯示此時瑪基大應該是前進基地，以色列人為了南征沒辦法回到吉甲營地。BH
    說瑪基大是以色列人擊敗亞摩利聯軍之後的臨時指揮部，約書亞從這個營地指揮追擊、處置被擒的諸王，並為接下來的征戰做準備。'
