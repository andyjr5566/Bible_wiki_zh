- title: 加低斯
  path: link_folder/地點/加低斯.md
  definition: 加低斯（Kadesh），全名加低斯巴尼亞，即創世記十四章的[[安密巴]]（意為「審判的泉」）。位於南地，是以色列人出埃及後最重要的曠野駐紮地，也是探子出發窺探迦南的地方。
  development: '### 背景註釋給的定位


    GT《舊約背景註釋》〈創二十1 加低斯和書珥〉把加低斯定為**西乃半島東北部的一個綠洲，在別是巴以南46哩**。創20:1 描述亞伯拉罕往南來到加低斯和書珥之間的直線上——這條線標出了他這次南遷所抵達的範圍：仍在迦南南緣，但已靠近埃及方向的邊界地帶。


    CT 給的原文字義是「聖，分開」，並以此發展出靈意：信徒必須背向世界（書珥＝牆）、過分別為聖（加低斯）的生活，不可走中間路線。這是靈意解讀，與地理資料屬不同層次。


    ### 同一地名在正典後續的份量


    加低斯（加低斯巴尼亞）在後來的敘事中遠比本章重要：以色列人出埃及後在此駐紮，十二探子由此出發窺探迦南並帶回報告（民13:26），會眾在此背逆而被判在曠野飄流。創20:1
    只是把它當作一個方位座標；它日後成為以色列曠野歷史的樞紐。丁良才在本節下即註明可參民13:26。'
  signals: []
