- title: 亞衲族與偉人拿非林
  path: link_folder/背景/亞衲族與偉人拿非林.md
  definition: '民13:22、13:28、13:33 三次提到亞衲族，最後一次把他們接到「拿非林」。


    **名字與身量。** CT 給的原文字義是「亞衲」頸；GT《民數記串珠聖經註釋》：「『亞衲』：意為『頸項』，可能與他們身材高大有關。」KC 從同一個字義讀出性格：“Anak”
    means “long neck”，「which indicates pride, haughty」（指的是驕傲、高傲）；他並逐一解釋亞衲三子的名字。


    **經文以外沒有史料。** GT《舊約聖經背景註釋》講得很直接：第22與28節「所列的都是」胡利人（即聖經中的何利人）的名字，亞衲的子孫通常被視為巨人，但「巨大」可能是更合適的形容，而「聖經以外的史料完全沒有提到過亞衲族人」。但同一份來源給了兩項旁證：阿納斯塔西第一蒲草紙（Papyrus
    Anastasi I；主前十三世紀）「中的一封埃及函件，卻形容迦南有些勇猛戰士，直立有七至九呎之高」，另有「兩副來自主前十二世紀，體高七呎左右的女性骸骨」在外約但的薩伊德葉遺址出土。


    **「拿非林」是什麼，古今都沒有定論。** GT《舊約聖經背景註釋》說，聖經惟一肯定提到內非林之處是創世記六4，「但該節經文並沒有提供什麼有關他們身分的資料」；至於後來的理解，「時代最早的釋經者（兩約之間時期）對這字之理解，可分為視其為巨人、英雄、墮落天使三派」。CT
    的說法是：「『偉人』原文是拿非林，一種身材魁偉的巨人，被懷疑是變種人類（參創六4）。」STEP 原文資料顯示民13:33 這個字是 ha./ne.fi.Lim（H5303，詞典義
    Nephilim），民13:22 的「亞衲」是 ''a.Nak（H6061）。


    **他們後來被趕出去了。** GT《啟導本聖經註釋》與《聖經精讀本》都指出：亞衲人雖高大，後來為迦勒擊敗逐走（書十五14）。GT 丁良才算了時間：「約過了五十年，迦勒就趕出這亞柄族的三個族長」（書十五14）。'
  development: '這一族在目前累積到的幾章裡，走完了一條從「不能上去」到「沒有留下一個」的路。


    民13 是起點。探子從希伯崙一帶回來，說在那裡看見了亞衲族的人，民13:33 又把他們接到「偉人的後裔」；那份報告成了一整代人不肯上去的理由。申1:28 把同一句話收在百姓自己口中複述一次——它是恐懼的內容，不是敘事的主體。申2:10、申2:21
    換了一個角度：以米人與散送冥都被形容成「像亞衲人一樣」，而摩押與亞捫已經把同型的族群趕走了。申9:2 則把那句流傳的話直接寫出來——「誰能在亞衲族人面前站立得住呢」——然後在申9:3
    說，在前面過去的是耶和華。


    書11:21 是這條線的終點，也是以色列第一次自己動手。約書亞把住山地、希伯崙、底璧、亞拿伯與猶大山地、以色列山地所有的亞衲族人剪除了。GT《約書亞記研經資料》說征服亞衲族人有重要的意義，因為四十年前民13:33
    的亞衲族人曾令摩西派出窺探迦南的探子們膽戰心驚，叫以色列人上一代談虎色變。


    不過書11:22 沒有把話說滿：迦薩、迦特和亞實突仍有留下的。這一族因此不是從聖經裡消失，而是退進以色列當時未奉命攻打的沿海城市——同一個名字在後面的年代還會再出現。'
