- title: 南地
  path: link_folder/地點/南地.md
  definition: 原文意為「南，乾燥，乾旱之地」。位於別是巴以南的荒蕪旱地。亞伯蘭從埃及返回後住在南地。
  development: '### 一條反覆出現的南下路線


    「南地」（Negev）在創世記多次作為族長遷徙的方向標記：亞伯蘭因饑荒下埃及前後都經過南地（創12:9；13:1、3），創20:1 亞伯拉罕又「從那裡向南地遷去」。CT
    對這個方向給了一句提醒：南地靠近埃及，換句話說是**逐漸靠近埃及地**——在創世記的敘事邏輯裡，往南移動通常意味著離應許之地的核心愈來愈遠。


    KC 讀創20:1 時作了同樣的連結：亞伯拉罕離開住了將近二十年的幔利往南走，令人想起創12 章他同樣南行、最後進了埃及；這一次他沒有走那麼遠，停在基拉耳這個邊界地帶。KC
    的評語是：那時不是信心的路，這時也不是。


    ### 地理條件


    BH 描述南地是古迦南南部的沙漠地區，氣候乾旱、植被稀疏，族長（亞伯拉罕、以撒、雅各）都曾在此遷徙居住；其嚴苛環境使人必須倚靠神的供應。CT 給的原文字義是「南，乾燥，乾旱之地」，位於別是巴以南。'
