- title: 亞割谷
  path: link_folder/地點/亞割谷.md
  definition: '書7:24、26 兩次提到亞割谷：亞干和他所有的被帶到那裡，行刑之後「那地方名叫亞割谷……直到今日」。經文自己在括號裡解釋了名字——「亞割就是連累的意思」。


    ### 名字就是那句判詞


    STEP 顯示書7:26 的地名是 ''E.mek a.Khor（H6010G 加 H5911），而書7:25 約書亞說的那兩句「你為什麼連累我們呢？今日耶和華必叫你受連累」用的是同一個字根的動詞——''a.khar.Ta./nu
    與 ya''.kor./Kha（都是 H5916，簡要詞典義 a.khar: to trouble）。


    CT 的原文字義給「亞割」連累、麻煩、攪亂，給「連累」帶來災禍、打擾、找麻煩，並在話中之光點出兩個詞的字根相同、是雙關語；GT《丁道爾聖經注釋》說得一樣：這裡有一個雙關語，字根「帶來災禍」和亞割谷的字根拼音完全相同。GT《約書亞記研經資料》說「亞割」是「麻煩」、「攪亂」；KC
    說 Achor means ‘misery’；BH 說亞割谷意為 “Valley of Trouble”，把亞干的罪與它給以色列帶來的災禍連在一起。


    CT 順著字義把「連累」的範圍列了出來：亞干一人犯罪，連累家人、三十六位士兵（書7:5）、以色列名聲（書7:9），甚至神的大名（書7:9），牽連重大。


    ### 位置沒有定論


    GT《約書亞記雷氏研讀本》說這山谷位於耶利哥以南約一英里；GT《啟導本聖經約書亞記註釋》說此谷在耶利哥城以南約1公里半。GT《華爾頓約書亞記背景注釋》說得保留得多：亞割谷的位置至今不明。一個看法認為它是耶路撒冷東南十哩外、昆蘭以西的布基亞（el~Buqeia），但這地點離耶利哥太遠、方向也不對；按照書15:7，此地位於猶大和便雅憫的邊界，而布基亞的位置太近南面，另一方面，位於耶利哥、艾城、吉甲一帶的努艾瑪幹河（Wadi
    Nu''eima）又太近北面了。


    ### 一個壞名字後來被改寫


    這個名字沒有停在災禍上。CT 說神允許這事發生、又讓「亞割谷」這個名字世代流傳下去，最終是要使人歸向祂，並引賽65:10 與何2:15；KC 說在施行審判的地方，通往有盼望之將來的門就開了；BH
    說神後來應許使亞割谷成為 “a door of hope”。這條線見 [[何2：15 亞割谷成為指望的門]]。'
