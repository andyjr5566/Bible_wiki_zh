- title: 耶末
  path: link_folder/地點/耶末.md
  definition: '耶末是南方五王聯軍中毘蘭所治的城，書10:3、5、23 都把它列在名單裡。它沒有被書10 記載攻取——KC 指出耶路撒冷與耶末這兩座城在本章尚未被拿下。


    CT 的原文字義給「耶末」高地，並說它位於耶路撒冷西二十六公里。GT《約書亞記研經資料》給的字義相同，並說應該是耶路撒冷西南約24公里的雅穆克廢墟（Khirbet
    el~Yarmuk）。GT《串珠聖經注釋》說耶末在耶路撒冷以西廿六公里（十六英里），可眺望沿海地區、佔有軍事優勢。GT《聖經精讀本》說耶末是位於迦南平原的城，就是今日的格木（Jarmuk）。


    BH 說耶末位於示非拉，也就是猶大西部的丘陵地帶，它的參與顯示抵擋以色列的勢力不只限於耶路撒冷、而是牽涉南迦南各處的設防城。'
