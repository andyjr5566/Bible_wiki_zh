  definition: 耶路撒冷（Jerusalem），古稱撒冷（Salem），意為「平安/和平之城」。麥基洗德為撒冷王（創十四18），即耶路撒冷古代的統治者。考古顯示早在青銅時代此城已有人居住（古名
