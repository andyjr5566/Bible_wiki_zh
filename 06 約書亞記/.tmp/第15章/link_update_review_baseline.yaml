- title: 未得之地
  path: link_folder/主題/未得之地.md
  definition: '書13:1 耶和華對約書亞說：「你年紀老邁了，還有許多未得之地」，接著在書13:2-6 從南到北把這些地方一區一區點出來。GT《約書亞記研經資料》說這句話直譯是「剩下要去得之地極多」。STEP
    顯示「未得」這裡是 le./rish.Ta/h（H3423H，簡要詞典義 ya.rash: to possess: take），本節逐字譯義是 to take
    possession of it。


    **清單包括哪幾塊地。** GT《約書亞記綜合解讀》說神是按著向摩西明確指示的迦南地四界（民34:2-12）來列舉，分成四個主要區域：「基述人的全地」（書13:2，就是「從書珥直到埃及」的曠野，撒上27:8）、非利士人五個城邦（書13:2-3）、包括推羅和西頓在內的腓尼基海岸（書13:4），以及從黑門山向北一直到哈馬口的「全黎巴嫩」（書13:5）。GT《約書亞記研經資料》的分法是三塊：非利士人的土地、腓尼基海岸與敘利亞東部。GT《串珠聖經注釋》一句話總括：以色列人仍未佔領地中海沿岸一帶地方。


    **為什麼還剩這麼多。** CT 與 GT《綜合解讀》都不把原因放在約書亞的年紀上，而是說神定意「將這些國的民從你面前漸漸趕出」（申7:22），吩咐百姓「不可把他們速速滅盡，恐怕野地的獸多起來害你」，所以留下了「許多未得之地」。GT《聖經精讀本》則從百姓的處境講：長期爭戰使百姓精疲力竭，需要恢復元氣；而且在富饒的迦南地定居之後，百姓稍不留心便會耽溺於安逸，所以神給他們留下尚未征服之地，是要使他們常常警醒。KC
    的語氣比較重：神必須提醒約書亞還有很多地要去得，KC 問：約書亞是不是也沉進安歇裡了？並說這裡已經嘗不到那股繼續征服的屬靈勁頭。


    **還沒得到，照樣分。** 神在書13:6-7 吩咐約書亞「只管照我所吩咐的，將這地拈鬮分給以色列人為業」。CT 說這表示書13:2-6 所列的地雖尚未實際佔領，但可視同領地給予拈鬮分配；GT《啟導本》說：「雖然未得，仍舊分配。」KC
    把這一點講成兩件事的分別：「Taking possession and dividing are two things.」（取得與分配是兩件事。）分地讓各支派看見神眼中那地有多大，但實際取得要各支派自己去做，因為那裡還住著仇敵。


    **之後由誰去得。** GT《綜合解讀》把進迦南分成三個階段：征服迦南、分配土地、攻取「未得之地」；神安排約書亞負責前兩個階段，卻沒有安排約書亞的接班人，而是讓各個支派自己負責攻取「未得之地」。GT《聖經精讀本》也說尚未征服之地留待日後由各支派相互協助而獲得。BH
    則預告了後果：以色列沒有完全順服，日後在士師時代成了一再出現的妥協、衝突與受壓制的根源（士1:27-36）。'
