    el~Qedah）發掘出夏瑣遺跡，城內包括高的建築物、高於路面50.3公尺、佔地10.12公頃，此城有三次被焚毀的痕跡分別是西元前1400、1300、1230年，一般認為西元前1300年那一次是埃及法老塞提一世的戰績，其餘兩次之一可能就是約書亞所為。KC
