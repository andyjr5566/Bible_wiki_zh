- name: 馬匹車輛
  suggested_type: 文化
  evidence: '第4節「這些王和他們的眾軍都出來，人數多如海邊的沙，並有許多馬匹車輛」。STEP 為 ve./Sus（H5483M，簡要詞典義 sus:
    horse）va./Re.khev（H7393G，簡要詞典義 re.khev: chariot），前面的「多如海邊的沙」是 ka./Chol（H2344，簡要詞典義
    chol: sand）加 se.fat- hai./Yam（H8193J 加 H3220G）。CT 說當時的以色列人尚無馬匹和戰車，並說根據猶太歷史學家約瑟夫稱步兵多達三十萬人、另有騎兵一萬、戰車二萬。GT《研經資料》說此時的迦南戰車是由兩匹馬拖拉的、幾乎沒有裝甲、輪子有四輻，後來稱為「鐵車」的則是有裝甲、輪子有六幅，給徒手戰鬥的以色列人帶來很大壓力，並說埃及、亞述的戰車每車有兩個馬兵、赫人的戰車每車有三個馬兵、亞述的戰車是由兩匹或四匹馬拉的；GT《丁道爾聖經注釋》說馬匹車輛這個說法在希伯來聖經還出現在八個地方，所描述的是當時最可怕的戰爭工具，例如埃及人追趕以色列人時馬匹車輛都進入海中（出十五1、21），而申命記二十1
    則提到以色列在面對這樣的狀況時神會保護他們；GT《聖經精讀本》說「如海邊的沙」聖經多處使用了這句話，在本節是指迦南聯軍的數量多得不計其數；GT《綜合解讀》說迦南人有強大的「馬匹車輛」而以色列人只有步兵。BH
    說 Horses and chariots represented the height of Canaanite military power and gave
    armies a major advantage on open ground，並指出這支龐大軍隊與神應許亞伯拉罕後裔如同海邊沙的話形成刻意的對照。'
