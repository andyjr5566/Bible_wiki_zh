- name: 國中太平（sha.qat）
  suggested_type: 原文
  evidence: 第23節「這樣，約書亞照著耶和華所吩咐摩西的一切話奪了那全地……於是國中太平，沒有爭戰了」。CT 原文字義給「國中」遍地、「太平」平靜，並說軍事的目的算是達到了、承受產業的安排正要開始。GT《綜合解讀》說「太平」原文的意思是「平靜、安靜，不受干擾」，這個詞在士師記中也不斷出現（士三11、30；五31；八28），又譯為「安息」（亞一11），並說約書亞讓百姓所享用的安息只是暫時的（來四8），這個暫時的安息到士師的時代將不斷因著百姓的不順服被破壞，因此「必另有一安息日的安息為神的子民存留」（來四9）；GT《研經資料》說「太平」是「平靜」、「不受干擾的」，又說其實征服迦南地的工作尚未完成，因此這裡的「太平」SH
    8252 只是暫時的（14:15 又出現一遍；士師記中每段暫時的太平也使用此字）。KC 說 This mention of rest in the land
    appears three times in the book——一次在此與約書亞相連，一次在書14 與迦勒相連（書14:15），一次在書21 與利未人在以色列中的產業相連（書21:44）；KC
    並說 Rest is good, but it should not lead to carelessness，又說 The biggest defeat
    is often suffered after the biggest victory。BH 說擊敗迦南主要勢力使以色列從持續的征戰中得著喘息，這安息見證了耶和華的得勝，也使各支派能安頓、建造、耕種並在祂的律法之下安排生活，而以色列在地上的安息指向神藉信心與順服所賜、最終在基督裡成全的更深安息。
