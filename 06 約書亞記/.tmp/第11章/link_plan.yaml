  suggested_type: 主題
  evidence: '第6節神吩咐約書亞「你要砍斷他們馬的蹄筋，用火焚燒他們的車輛」；第9節「約書亞就照耶和華所吩咐他的去行，砍斷他們馬的蹄筋，用火焚燒他們的車輛」。STEP
    顯示第6節「砍斷…蹄筋」是 te.''a.Ker（H6131B，簡要詞典義 iq.qer: to hamstring），「車輛」是 mar.ke.vo.tei./Hem（H4818，簡要詞典義
    mer.ka.vah: chariot），「焚燒」是 tis.Rof（H8313，簡要詞典義 sa.raph: to burn）。CT 原文字義給「砍斷」切斷腿筋，並說即指不能再使用它們，又說有人認為這樣作的結果是叫以色列人不靠車馬而單純倚靠神；CT
    在話中之光說他們不是倚靠人的所有去獲取得勝，乃是倚靠他們的元帥作他們的得勝，而保留人以為可靠的事物常會把人的眼睛從神的身上轉移到人以為可靠的事物上。GT《雷氏研讀本》說神吩咐約書亞砍斷敵人馬的蹄筋使之癱瘓、並焚燒他們的戰車而不是把他們捉回來，這樣以色列人便不會把信心放在馬匹和戰車上；GT《串珠》說免得百姓倚靠這些；GT《聖經精讀本》說意指以色列不可像外邦人一樣想靠著馬匹與車輛之力爭戰乃要依靠神的大能；GT《研經資料》說「砍斷馬的蹄筋」是「割斷馬的小腿韌帶」、這樣會讓戰馬殘廢，並說撒下8:3~8
    記載大衛打敗瑣巴王和亞蘭人時也是這樣對付戰車馬，表示到了大衛時期以色列人還是無法駕馭這種先進的戰爭工具，而所羅門王以後以色列人就有自己的戰車部隊了、但耶和華曾警告君王不可依靠馬匹（申17:16）；GT《綜合解讀》說約書亞忠實地執行了神的命令，因此以色列人一直到大衛王的時候都沒有使用「馬匹車輛」，並引詩20:7。KC
    說 The enemy''s means of combat must be disabled and destroyed. That makes reuse
    impossible, both for the enemy and for Israel，並說 God does not want His people
    to use the means of the world to achieve victories through which the world can
    claim the honor of victory。BH 說毀掉戰車除去了迦南人最令人畏懼的兵器，也顯明以色列不可保存神已審判的東西，那位在紅海淹沒法老戰車的耶和華再一次顯明人的力量站立不住。'
