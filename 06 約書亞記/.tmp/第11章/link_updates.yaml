  "path": "link_folder/神學/法老心剛硬.md"
  "summary": "第20節把迦南諸王的結局接到出埃及記的那條線上：「因為耶和華的意思是要使他們心裡剛硬，來與以色列人爭戰」。"
  "relation": "GT《綜合解讀》把兩者直接並排：如果迦南人願意，其它城市也可以效法基遍人與以色列人講和，但他們就像法老一樣（出七13）自己「心裡剛硬」，所以神就任憑他們繼續「心裡剛硬」（出十1）。KC 用一句話收住這個原則：「God hardens a heart only if someone has hardened his heart first」（神只在人先剛硬了自己的心之後才使他剛硬），並說剛硬是神的審判，發生在人拒絕順服神之後。CT 則把「使他們心裡剛硬」解為神容許他們心裡剛硬，為要達成神的旨意，不讓他們迷惑以色列人、跟他們去敬拜偶像假神。BH 說這裡的剛硬讓人想起法老在出埃及時對神的抵擋，同時顯出神的主權與人的責任。"
