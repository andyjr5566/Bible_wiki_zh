  summary: |-
    第17節「從上西珥的哈拉山，直到黑門山下利巴嫩平原的巴力迦得，並且擒獲那些地的諸王，將他們殺死」。CT 原文字義給「巴力迦得」財神，並說它在此代表迦南地的最北端。GT《串珠》說大概是位於黑門山西面之山谷；GT《聖經精讀本》說是位於黎巴嫩平原的城邑、是迦南地的北部邊境；GT《研經資料》說字義是「財神」、「財富之主」；GT《華爾頓約書亞記背景注釋》說它位於夏瑣以北、但／拉億一帶，部分學者認為它是但城東面不遠的班雅斯（Banias），並說利巴嫩平原即是米斯巴穀。BH 說第17節用兩個地標描述了所征服土地的南北兩端。
  relation: 與哈拉山成對，把征服的範圍一南一北框起來。這個地名本身帶著迦南神祇的名字，卻被用來標記以色列所得之地的北界。
