- title: 法老心剛硬
  path: link_folder/神學/法老心剛硬.md
  definition: 出埃及記中十次記載神使法老心剛硬（出四21, 七3, 九12, 十1,20,27, 十一10, 十四4,8,17）。「使」原文有「容」的意思（歌二14），含任憑之意。
  development: 'GT李道生詳解：頭兩次（出四21, 七3）出於神的預言，其餘是神任憑——法老自己先剛硬（出八15,32, 九34），神就任憑他（詩八十一12；羅一24,26,28；帖後二10-12）。CT指出「人的心剛硬絕非是一朝一夕的工夫，而是多次的悖逆與頂撞神所造成的」（來三13）。


    三個希伯來字描繪法老剛硬的漸進過程（GT中文聖經註釋）：

    1. 「沉重」（7:14「法老心裡固執」）——不易被搬動和改變

    2. 「堅定，強壯，加強」（7:13、22）——堅持己意、不肯改變態度

    3. 「剛硬」——完全不肯回轉


    BH指出法老剛硬是神主權與人自由意志的複雜交織——法老自己選擇抗拒，神預知並任憑（羅九17-18）。


    屬靈警告：CT「被神任憑是被神放棄，不再有聖靈的感動與禁止，沒有悔改的機會，這是人最大的不幸。」'
