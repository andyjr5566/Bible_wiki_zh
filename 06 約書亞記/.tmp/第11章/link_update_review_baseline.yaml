- title: 底璧（城）
  path: link_folder/地點/底璧（城）.md
  definition: '底璧是書10 南征清單的最後一座城（書10:38-39）。要留意同一章裡有兩個「底璧」：書10:3 的底璧是伊磯倫王的名字，書10:38-39
    的底璧才是這座城，所以這個條目在名字後面加上限定詞。


    ### 名字


    CT 的原文字義給「底璧」聖所。GT《約書亞記研經資料》給的字義相同。BH 說底璧又叫 Kiriath-Sepher（書10:39 作 Kirjath-sepher），它的名字意思是
    “sanctuary” 或 “oracle”，暗示它可能是宗教或文化上的重鎮，而考古證據顯示它是一座設防城。


    ### 遺址的兩種說法


    CT 說底璧位於希伯崙西南方15公里、別是巴東北方約26公里。GT《約書亞記研經資料》說有考古學家認為是 Tell Beit Mirsim，在希伯崙西南21公里、拉吉南11公里；但後來最新考古資料則傾向認為底璧是現代的拉布德廢墟（Khirbet
    Ra~bud），是晚銅器時代迦南人的設防城、居高臨下，位於希伯崙和別是巴之間的希伯崙幹河（Wadi Hebron）之上。GT《華爾頓約書亞記背景注釋》採後一種說法，說底璧是現代的拉布德廢墟（Khirbet
    Rabud）、占地十五英畝，位於希伯崙西南約八哩之處，並說當地挖掘只限於兩壕，因此不能提供什麼約書亞滅城的資料。


    ### 這座城後來又被打了一次


    GT《約書亞記研經資料》指出書15:16~19、士1:10~15 說是迦勒攻擊底璧的居民。這與書10:39「盡行殺滅，沒有留下一個」形成張力，也正是 GT《華爾頓約書亞記背景注釋》談誇飾修辭時舉的例子之一。'
