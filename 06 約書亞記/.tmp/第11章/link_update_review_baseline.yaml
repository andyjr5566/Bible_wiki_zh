- title: 剪除
  path: link_folder/原文/剪除.md
  definition: 「剪除」在律法中有兩種用法：一種是把人從以色列民中除去（利未記與民數記所記的違例情形），另一種是把整批外邦居民從那地除去。出埃及記二十三23
    屬於後者。CT 在該節給的原文字義是「消除，抹去，隱藏」，並指出實際的歷史與字面並不相符：「『剪除』意指殲滅淨盡，但實際上後來以色列人並沒有將他們趕盡殺絕，因此，這裡的意思是將他們『瓦解』，使他們不再擁有獨立的主權。」GT《丁道爾聖經註釋》也從經文內部的張力提出同樣的修正：本節需要一個較柔和的字眼，如「使他們冰消瓦解」。
  development: '### 從滅一國，到逐一人


    「剪除」在出23:23 指的是神要滅絕迦南全族；到利未記，同一個字轉向約群體內部——利7、17、18、22章反覆用「必從民中剪除」宣告個人因不潔而吃祭肉、拜鬼魔、性道德罪行、褻瀆等被逐出約群體，範圍最廣的是利18:29，涵蓋全章一切可憎之事。利22:3
    用了全書僅見的說法「在我面前剪除」——GT 丁良才指出這句話有注釋家理解為神親自介入的審判，不假手於人。利19:8 又補上一種：不是道德罪，也不是拜偶像，而是把平安祭的祭肉留到第三天再吃——GT
    丁良才把這一節與七20-21、25、27 及二十三29 並列為同一組條例，可見「褻瀆聖物」本身就足以構成剪除的理由。利20 則一章之內用了五次（v3、5、6、17、18），而且第一次讓兩種執行方式在同一段裡並存——第2節是百姓用石頭打死，第3節神說「我必剪除」；STEP
    顯示 v3、v5 是神的第一人稱使役形，v17「他們必在本民的眼前被剪除」則是被動形，GT 丁良才推測那「或者是有一種特別的罰法，為要作眾人鑒戒的」。到民數記，這個字繼續延伸到具體的潔淨儀式：民19章摸了死人卻不受潔淨的人，「必從以色列中剪除，因為他玷污了耶和華的聖所」。從滅族的審判到約群體的排除，「剪除」貫穿全部三卷書，指向同一件事——與神的聖潔不相容的，都要被隔離出去。'
