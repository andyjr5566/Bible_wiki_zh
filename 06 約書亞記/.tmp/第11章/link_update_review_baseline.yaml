- title: 米斯巴
  path: link_folder/原文/米斯巴.md
  definition: '希伯來文「米斯巴」（`מִצְפָּה`，*Mizpah*，H4709），專有名詞，字根源於動詞 `צָפָה`（*tsa.phah*，H6822，意為「守望、瞭望、鑒察」），名詞字面意為「瞭望台、守望所」（Watchtower）。


    創世記 31:49 記載拉班在基列山立約時，為石堆加上「米斯巴」之名，經文說明其意涵：「我們彼此離別以後，願耶和華在你我中間鑒察（`יִצֶף`，H6822）」。


    註釋家指出，拉班在此並非表達互信與祝福，而是因雙方互不信任，故呼求神在彼此看不見的時候作為超然的鑒察者與見證人。'
