- title: 荒堆（tel）
  path: link_folder/原文/荒堆（tel）.md
  definition: '申命記第十三章第16節規定拜偶像之城的最終狀態：「那城就永為荒堆，不可再建造。」


    STEP 顯示「荒堆」是 tel（H8510，簡要詞典義 tel: mound，本節逐字解 a mound of），後面接 o.Lam（H5769G，o.lam:
    forever: enduring），合起來是永遠的土丘；同節的「不可再建造」是 ti.ba.Neh（H1129，ba.nah: to build）加 od（H5750，still）。CT〔原文字義〕註「荒堆」土堆，文意註解說『荒堆』即指成為一堆廢墟。


    **這個字在考古上是有實體的。** BH 指出 tel 這個詞在考古學上很有份量，因為許多被毀的古城後來就層層堆疊成了土丘；他並說這種永久的荒涼是神審判的見證，也對後代起警戒作用。今天以色列與周邊地區許多遺址的名字仍以這個字開頭。


    **同一節裡還有兩個動作。** 第16節先要求把所奪的財物都堆積在街市上——STEP 顯示「堆積」是 tik.Botz（H6908，qa.vats: to
    gather），「街市」是 re.cho.Va/h（H7339，re.chov: street/plaza）；CT 說『街市』指開放的地方，如廣場、市集、城門口等。接著是「用火將城和其內所奪的財物都在耶和華─你神面前燒盡」，STEP
    的「燒盡」是 ka.Lil（H3632，ka.lil: entire，本節逐字解 a whole offering）。


    這裡有一個值得分辨的地方：BH 在這一節把「whole burnt offering」的原文寫成 ''olah，而 STEP 在本節給的字是 ka.lil（H3632）。兩者指的是同一件事——整座城被完全燒掉、當作獻給神的東西——但本節經文用的字，依
    STEP 的逐字資料是 ka.lil。


    **它與燒盡的關係。** CT 的話中之光把這條規定讀成一個原則：勾引人離棄神的那城，拆毀了就永不再建造；神的祝福與建造，永遠不與撒但有關連。GT《聖經精讀本》也把它放在同一個方向：在預表天國的應許之地迦南，決不容忍任何罪的因素得以存在。'
  development: '這個字在聖經裡先是判詞，後是紀錄。申13:16 用它下命令：勾引人離棄神的那城「就永為荒堆，不可再建造」；書8:28 則是敘事——約書亞把艾城焚燒，「使城永為高堆、荒場，直到今日」。GT《丁道爾聖經注釋》指出「永為高堆」這個詞只在申13:16
    出現過，兩處因此是同一句話的兩種語氣：一邊是還沒發生的規定，一邊是已經留在地上的結果。


    值得注意的是對象換了。申命記那一節管的是以色列人自己中間出現的城，書8 落下來的卻是一座迦南城；同一種處置，先寫給自己人，後施行在敵人身上。GT《約書亞記綜合解讀》把這個字放回地理裡：它指的是中東常見的山丘狀廢墟，古代居民點歷經摧毀、夷平、重建而逐漸堆高，最後被放棄，今天以色列很多以
    Tel 開頭的地名都是這樣來的。判詞因此不只是說法，它留下了看得見的形狀。'
