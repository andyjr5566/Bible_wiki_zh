- title: 高原（Shephelah）
  path: link_folder/地點/高原（Shephelah）.md
  definition: '申命記1:7 的「高原」是一個容易被中文譯名誤導的地理專名——它其實是低地。


    **位置。** GT《雷氏研讀本》：「『高原』。位於沿海平原與中央高地之間的低地。此地被稱為 Shephelah。」BH 的說法相同：Shephelah 是海岸平原與山地之間的低地。GT《串珠》：「『高原』：指猶大山丘和非利士平原中間的山麓地帶。」


    CT 說明中文譯名的問題：「『高原』或翻作『低原』、『丘陵』，指迦南地中部『山地』以南，西面與非利士地鄰接，南面與『南地』相接的丘陵地帶」。


    **為什麼重要。** BH 指出這一帶土地肥沃，也是各方勢力反覆爭奪的地方，既是緩衝區，也是貿易與防禦的關鍵。


    **原文。** STEP 原文資料顯示第7節是 u./va./she.fe.Lah（H8219），簡要詞典義 she.phe.lah: Shephelah。'
  development: '示非拉在目前累積到的三章裡，從一個詞變成一片戰場。申1:7 它只是應許之地分區清單裡的一項，夾在山地與南地之間；書9:1 它出現在諸王結盟的地理清單裡，用來說明有哪些地方的王聽見了消息；書10
    它終於成為敘事本身——立拿、拉吉、伊磯倫、亞西加、瑪基大都在這一帶，而書10:40 又把它列回總結的地形清單。


    它之所以值得爭，是位置。GT《約書亞記綜合解讀》說它特指猶大山地和沿海平原之間的丘陵地帶，是後來以色列人與非利士人長期爭戰的地方；BH 說這一帶土地肥沃，既是緩衝區也是貿易與防禦的關鍵。書10
    只是這場長期爭奪的開頭。


    中文譯名一直是這個條目的麻煩：「高原」其實是低地，各家在申1、書9、書10 都反覆說明這一點。要注意 CT 給的方位本身前後不一致——它在書9 說是介於中央山地和沿海平原之間的丘陵地帶，在書10:40
    卻說是耶路撒冷以北的迦南地中部丘陵地帶，而 GT 與 BH 一致把它定在猶大山地以西。'
