- title: 艾城准取掠物的轉變
  path: link_folder/主題/艾城准取掠物的轉變.md
  definition: '攻艾城之前，神先交代了戰利品怎麼處理，而這個交代與耶利哥那一次不同。書8:2 說「你怎樣待耶利哥和耶利哥的王，也當照樣待艾城和艾城的王。只是城內所奪的財物和牲畜，你們可以取為自己的掠物」；書8:27
    說事情確實照這句話辦了：「惟獨城中的牲畜和財物，以色列人都取為自己的掠物，是照耶和華所吩咐約書亞的話。」


    兩座城的人命處置一樣，財物處置相反。這個對比是各家都停下來解釋的地方。


    **為什麼耶利哥不行、艾城可以。** CT 說耶利哥是神在迦南地賜給百姓的第一個得勝，所以一切財物都必須當作初熟的果子獻給神（書6:17）；艾城也是神賜下的得勝，但神卻允許百姓把財物和牲畜留作戰利品，作為恩典的供應。GT《約書亞記研經資料》說法一致：耶利哥是進入迦南的第一個城，有如「初熟的果子」，所以全部應該獻給神，而艾城以後則考慮到以色列人也需要由迦南地中獲得補給，因此引用一般戰爭的規定。GT《聖經精讀本──約書亞記註解》從實務面補充：若要繼續爭戰，就需要重新使用擄掠之物；只因耶利哥城是第一個征服的城邑，所以特意分別為聖歸給了神。BH
    也提到申20:14 所給的一般戰爭規定。


    **另一種讀法：那是一次考試。** GT《丁道爾聖經注釋》提出第二個理由，說可由亞干的罪推想——第一座城的毀滅以及其中的掠物，成了神給以色列的測驗，看他們是否順服神；攻擊艾城的人通過了這項測驗，因此便不需要禁止他們得戰利品。它並注意到經文特別提到牲畜這件事：這讓人留意以色列人當時危急的景況，神已經不再像在曠野時一樣供應他們嗎哪，現在以色列人要自己找食物了，而神在這裡還是供應他們，將牲畜賜給他們，滿足他們的需要。


    **對亞干的回望。** GT《約書亞記雷氏研讀本》只用一句話：這次以色列人可以自己保存戰利品，亞干怎麼不多忍耐一點呢。GT《研經資料》講得更完整：書8:2
    提到可以拿取艾城戰役的果子，所以亞干如果願意等的話，神不是沒有給他們用正當手法拿取物質利益的機會。CT 在話中之光也走同一條線：神的恩典總是夠我們用的，若多一點專心信靠、多一點耐心等候，就不會像亞干一樣偷竊神的物。


    KC 把兩座城的次序寫成一句原則：在耶利哥一切都歸耶和華，在艾城一切都歸百姓；先是全歸主，然後我們才照主所定的領受自己的份。BH 則歸結為主權：神對審判與賜福都保有完全的權柄，決定什麼當毀滅、什麼當分別為聖、什麼可以由祂的百姓領受。'
