- title: 基遍
  path: link_folder/地點/基遍.md
  definition: '基遍是約書亞記第九章的主角城邑。書9:3 說「基遍的居民聽見約書亞向耶利哥和艾城所行的事」，接著就派出假裝從遠方來的使者求和；書9:17
    把它列在四座城之首。


    **名字與位置。** CT 的原文字義給「基遍」丘陵城市，並說它位於耶路撒冷西北方約9公里。GT《啟導本聖經約書亞記註釋》說「基遍」有「山城」的意思，位於艾城西南、在耶路撒冷西北約12公里；GT《約書亞記綜合解讀》說字義是「丘陵城市」，位於艾城西南約16公里的丘陵地帶；GT《約書亞記研經資料》說基遍是現代的
    el~Jib，距離耶路撒冷6.8公里。各家給的距離數字不完全一致，方位則一致：在艾城西南、耶路撒冷西北。


    **它不是小城。** CT 說基遍是一座大城（參書十2）；GT《啟導本》說它面積大過耶利哥和艾城，城中居民為希未人、屬當滅的民族。BH 說基遍是 “a great
    city, like one of the royal cities”，比艾城大，居民是有能力的戰士。


    **為什麼是它先來求和。** GT《綜合解讀》把兩種反應並排：迦南諸王「聽見」神大能的作為，決定同心合意地與神的百姓爭戰；基遍人「聽見」同一件事，卻決定來求和。GT《研經資料》說基遍靠近耶利哥與艾城，在以色列軍隊的攻勢中必然首當其衝，如果告以實情絕無可能立約講和；GT《綜合解讀》並說基遍很可能就是以色列人的下一個目標。


    **水是這座城的招牌。** GT《丁道爾聖經注釋》說挑水這個工作尤其適合基遍人，因為在當地找到山地最大的井之一，而聖經提到挑水（撒下二12~17；耶四十一12），這井很可能是附近一帶的重要水源；GT《綜合解讀》也說基遍一帶有許多大水池。


    **後來的基遍。** GT《啟導本》說自此以後基遍人在以色列人的社會中雖屬次等公民但受到保護，分地時基遍城劃歸便雅憫支派（書18:25），後來成為利未人城邑（書21:17），也是歷史上一個重要的宗教中心（王上3:4-5；代上16:39；代下1:3）。GT《丁道爾聖經注釋》說在聯合王國時期有一個以色列的聖所相當出名，地點或在基遍或在它附近。GT《綜合解讀》說摩西所造的會幕從掃羅時代開始搬到基遍，直到所羅門聖殿建成，並說八百多年後被擄回歸重建聖殿的殿役「尼提寧」（拉2:43；8:20）就是基遍人的後裔；CT
    也記下這個看法，說希伯來文 nethinim 意思是「奉獻的人」。KC 另舉大衛的勇士以實買雅是基遍人（代上12:4），以及與神的百姓一同從巴比倫歸回、幫助重建耶路撒冷城牆的基遍人米拉提（尼3:7）。


    **一個沒有守住的誓。** CT 說後來掃羅殺了一些基遍人，破壞了與基遍人的誓約，致令以色列人遭神懲罰，一連三年發生饑荒（參撒下21:1-14）；GT《綜合解讀》說以色列的眾首領和全會眾因為敬畏神所以不敢毀約，而掃羅卻為以色列人和猶大人大發熱心想要殺滅他們，結果反而被神追究了責任。'
  development: '基遍在約書亞記裡只出現兩章，而這兩章正好是同一件事的兩半。書9 它靠假裝從遠方來換到一紙和約，經文的重心全落在以色列人沒有求問耶和華這個失誤上；書10
    那紙和約立刻生效，五王聯軍出兵的理由就是它與以色列人立了和約。


    從基遍這一邊看，它的賭注得到了回報：換來的不只是不被滅絕，還是一支會為它連夜行軍三十公里的軍隊。從以色列這一邊看，被騙來的義務反而替他們打開了南方——CT
    在書10 的話中之光指出，南方五王聯軍離開了自己「堅固的城」，以色列人就可以在野外決戰，而不需要逐一攻打他們的堅固堡壘。GT《約書亞記綜合解讀》另指出基遍扼守從約旦河谷經中央山地向西到沿海平原的東西大道，這也是諸王非打它不可的原因。


    書9 的失誤沒有被抹去，書10 也沒有把它改寫成好事。經文只是把兩件事並排放著：一個沒有求問神就立的約，和一場神親自介入的爭戰。'
