- title: 摩西的祝福與雅各的祝福
  path: link_folder/主題/摩西的祝福與雅各的祝福.md
  definition: '聖經裡為十二支派逐一祝福的段落只有兩處：創世記49章雅各對十二個兒子說的話，和申命記33章摩西臨終前說的話。四套註釋都把兩者放在一起讀。


    ### 相似的形式


    GT《申命記串珠聖經註釋》說摩西臨終前為以色列各支派祝福、作出一些預言，正像雅各臨終的祝福一樣（參創49章）。GT《啟導本聖經申命記註釋》說這篇祝福的內容與雅各晚年所作的相似。BH
    說這是一份正式的宣告，與雅各在創世記49章給的那一類相同，是對以色列各支派帶著預言性與權柄的話。


    ### 一個關鍵的差別


    GT《啟導本聖經申命記註釋》把差別壓成一句：只是摩西的祝福中沒有斥責的話。


    KC 說得更完整：雅各講的是以色列歷史將如何一代一代展開，那份描述其實是這民族在信實上失敗的記錄，對應的是申命記32章的摩西之歌；但在申命記33章，摩西沒有講歷史，也沒有講失敗，他描述的是各支派在千年國度平安時期的光景。


    ### 個別支派的對照


    GT《聖經精讀本──申命記註解》說此祝福當與創49章的雅各祝福相比較理解，兩者相距450年，根據啟示的漸進性具有進一步發展的形態。它在幾個支派上指出實際的落差：雅各將但支派比作奸詐的蛇（創49:17），摩西則將但支派比作勇猛的小獅子；西緬受了雅各的咒詛（創49:5-7），在摩西這份名單上乾脆缺席。


    CT 在利未那一段點出最戲劇性的一組對照：雅各與摩西的祝福有很大的差別，在雅各的祝福語中利未是遭咒詛的、將來這族必分散在以色列各地，但是現在咒詛成為祝福，分散成為以色列聖工的特權。GT《聖經精讀本──申命記註解》在申33:10
    說的是同一件事：利未支派要分居以色列支派，這就將雅各的咒詛（創49:7）反而恢復成了祝福。


    | 支派 | 創49（雅各） | 申33（摩西） |

    |---|---|---|

    | 利未 | 遭咒詛、必分散在以色列各地 | 分散成為聖工的特權，教導律法、獻祭焚香 |

    | 但 | 比作蛇 | 比作小獅子 |

    | 西緬 | 受咒詛 | 名單上缺席 |

    | 流便 | 暗示不得居首、人數減少 | 求他存活、人數不致稀少 |'
