- title: 西布倫（同住）
  path: link_folder/人物/西布倫（同住）.md
  definition: 利亞所生的第六子（雅各第十子），名字意為「同住/居處」。利亞說「神賜我厚賞；我丈夫必與我同住，因我給他生了六個兒子」，故以此命名。
  development: '### 創30：字義與諧音


    CT 註「西布倫」的原文字義為「同住，居處，尊重」，並指出這名字與第20節「賜我厚賞」原文諧音。GT《啟導本聖經創世記註釋》取「居處」，GT《創世記雷氏研讀本》取「同住」，GT《串珠聖經註釋》兼取兩義——「不但可作『同住』，也有獎賞的意思」。


    一個名字同時牽著「厚賞」與「同住」兩條線，正對應利亞那句話的兩半：「神賜我厚賞；我丈夫必與我同住。」


    ### 第六個兒子，同一個盼望


    CT 的原文直譯是「這一次我丈夫必會高抬我」。這與創二十九34 生利未時的話幾乎同型——那一次她說「他必與我聯合」。KC 因此把西布倫讀成利亞盼望的重複：她期待雅各終於會讓步、與她同住；BH
    也指出這句話透露她仍覺得自己不被看重，儘管已生了六個兒子。


    要留意的是經文從未記雅各因此改變。她的盼望在名字裡，不在敘事裡。


    BH 補上支派的去向：西布倫在應許之地分得自己的境界（書十九10-16），而雅各在創四十九13 為他所祝的福與海濱、船隻相連，與「居處」之義接得上。'
  signals:
  - first_in_book
  accumulation_count:
  - 9
  - 10
- title: 以薩迦（價值）
  path: link_folder/人物/以薩迦（價值）.md
  definition: 利亞所生的第五子（雅各第九子），名字意為「價值/工價/報酬」。利亞說「神給了我價值，因為我把使女給了我丈夫」，故以此命名。
  development: '以薩迦在創世記裡只有出生和祝福。創30 利亞給他起名，意思是「價值」；創35 與出1 他列在雅各兒子的名單裡；創49:14-15 雅各說他是「強壯的驢」，「以安靜為佳，以肥地為美，便低肩背重，成為服苦的僕人」。CT
    在創49 說他的支派日後所得的地肥美，卻可能沒有設法趕出境內的迦南人；申33:18 摩西則說「以薩迦啊，在你帳棚裡可以快樂」，CT 與 GT 幾家都讀成農業上的成就。


    民數記裡他是一個人數不斷增加的支派：民1:29 有54,400名，民2 在東邊與猶大、西布倫同營、最先起行，民26:25 增到64,300名。民34:26
    他的分地首領是帕鐵，名單緊接西布倫，和日後兩個支派的地相鄰。


    到書17:10-11，以薩迦成了瑪拿西東邊的鄰居。BH 說他的地在肥沃的耶斯列谷一帶；伯善等城雖在以薩迦境內，卻分給了瑪拿西。GT《研經資料》算人數時提到，以薩迦有64,300人，擁有的地卻比約瑟的子孫少得多。'
