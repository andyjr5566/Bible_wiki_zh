- title: 猶大支派
  path: link_folder/人物/猶大支派.md
  definition: 猶大支派是雅各第四子猶大的後裔所成的支派。創49:8-12 雅各臨終祝福宣告猶大得弟兄讚美、勝敵與王權：「圭必不離猶大，杖必不離他兩腳之間，直等細羅來到，萬民都必歸順」——獅子象徵力量和統治，「細羅」傳統譯為賜平安者，來源多視為指向出於猶大的彌賽亞；大衛王朝與新約對猶大支派之基督的理解由此相連。
