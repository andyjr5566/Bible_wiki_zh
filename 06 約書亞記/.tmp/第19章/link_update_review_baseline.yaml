- title: 西緬
  path: link_folder/人物/西緬.md
  definition: 雅各與利亞所生的第二個兒子。創世記第二十九章中，利亞因耶和華聽見她失寵而又賜她兒子，給孩子起名西緬。
  development: '### 一個名字沒有轉化成祝福


    利未的咒詛後來因出32章的熱心轉為祝福，西緬卻沒有這樣的轉折。創34章他與利未同謀屠城，創49章雅各宣告同一句「分居……散住」的咒詛落在兩人身上；但這句話對西緬支派的應驗只朝一個方向走——GT
    丁良才指出他的後裔「後來成了最小的支派」（民26:14），而摩西為以色列人祝福時（申33章）根本沒有提到這支派。GT《聖經精讀本》說得更直接：曠野行軍中西緬支派的人數越來越少。出1章他仍列名下埃及的眾子之中；出6章的族譜留下一個異樣的註記——他六個兒子裡有一個「迦南女子的兒子」掃羅，BH
    指出這顯示以色列各支派中確有混合血統。同樣是雅各臨終的咒詛，利未的後裔走出了一條逆轉的路，西緬卻始終停在原地。'
