- title: 以利亞撒
  path: link_folder/人物/以利亞撒.md
  definition: 出埃及記6:23「亞倫娶了亞米拿達的女兒……給他生了拿答、亞比戶、以利亞撒、以他瑪。」以利亞撒是亞倫的第三個兒子，後來接續亞倫為大祭司。CT
    的原文字義說「以利亞撒」意即「神已幫助」，GT《中文聖經註釋》作「神幫助了或神所造的」。他所娶的是普鐵的女兒——CT 說「聖經中普鐵之名僅在此處出現一次，故不知其出身族系」，GT《中文聖經註釋》也說這名字可能源自埃及文，意義不甚明確。
