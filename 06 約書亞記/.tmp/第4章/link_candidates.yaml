- name: 瑪拿西
  type: 人物
  section: 人物
  evidence: |-
    第12節「瑪拿西半支派的人」，STEP 為 va./cha.Tzi She.vet ha/m.na.Sheh（H2677 che.tsi，簡要詞典義 half，加 H7626H she.vet，簡要詞典義 tribe，加 H4519G）。
  surfaces:
