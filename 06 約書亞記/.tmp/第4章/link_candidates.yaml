- name: 瑪拿西半支派為何留在河東
  type: 解經爭議
  section: 解經爭議
  evidence: |-
    第12至13節。CT 說這兩支派半二十歲以上能打仗的人數至少有十萬人（參民二十六7，18，34），可見泰半留在約但河東保護自己的土地和家人；GT《啟導本》說《民數記》二十六7，18，34所記二支派半20歲以外能打仗的總數為13萬餘，過河參加戰爭的只有三分之一；GT《研經資料》說看起來這兩支派半的人是派遣精銳部隊做整個以色列部隊的先鋒，但還留下大部分軍隊維持河東居住地區的安全，而約書亞也沒有對這樣的配置表示意見。
- name: 帶著兵器（cha.mush）
  type: 原文
  section: 原文
  evidence: |-
    第12節「帶著兵器在以色列人前頭過去」，STEP 為 cha.mu.Shim（H2571，簡要詞典義 cha.mush: armed）。GT《研經資料》說「帶著兵器」是「列以戰陣」，並說 4：12「帶著兵器」意味著這是他們在迦南地從事爭戰的開始。
  surfaces:
  - 帶著兵器
- name: 摩西與約書亞的權柄差異
  type: 主題
  section: 主題
  evidence: |-
    第14節「在他平生的日子，百姓敬畏他，像從前敬畏摩西一樣」。GT《丁道爾聖經注釋》說這裡應驗了神在三7的應許，所用的言辭也類似，以色列人承認他是摩西的接班人；GT《聖經精讀本》說神所賜的這種權威並不像許多屬世的權威為了個人的通達和利益，乃是為了成就神的旨意；BH 說約書亞的權柄不是出於個人野心或軍事成就，而是出於耶和華的同在與呼召。
  surfaces:
  - 像從前敬畏摩西一樣
- name: 使你尊大（ga.dal）
  type: 原文
  section: 原文
  evidence: |-
    第14節「耶和華使約書亞在以色列眾人眼前尊大」，STEP 為 gi.Dal（H1431，簡要詞典義 ga.dal: to magnify，Piel 完成式）。CT 原文字義給「尊大」尊崇，使尊大；GT《聖經精讀本》說「使……尊大」意為「提高名譽和人格」、「使之光榮」（3：7；代上29：12）。
  surfaces:
  - 尊大
- name: 敬畏神
  type: 神學
  section: 神學
  evidence: |-
    第14節「百姓敬畏他」與第24節「要使你們永遠敬畏耶和華─你們的神」，STEP 兩處都是 H3372H（ya.re，簡要詞典義 to fear: revere）——第14節是 va/i.yir.'U 與 ya.re.'U，第24節是 ye.ra.Tem。GT《研經資料》說這個字在利 19：3 用在「孝敬」父母，申 28：58 則用在「敬畏」神；BH 說敬畏耶和華包含在祂的聖潔面前存敬畏、信靠祂的信實，並讓生命順服祂的命令。
  surfaces:
  - 敬畏
- name: 耶和華的手
  type: 神學
  section: 神學
  evidence: |-
    第24節「要使地上萬民都知道，耶和華的手大有能力」，STEP 為 yad Yah.weh ki cha.za.Kah（H3027H yad，簡要詞典義 hand: power，加 H2389 cha.zaq，簡要詞典義 strong）。GT《聖經精讀本》說希伯來人常用「手」象徵神的權能，比如「大能的手」（出3：19）、「你手」（出15：17）、「父手」（約10：29）；GT《丁道爾聖經注釋》說在神責罰反叛者的經文中這個詞經常出現。
  surfaces:
  - 耶和華的手
- name: 紅海分開
  type: 歷史
  section: 歷史
  evidence: |-
    第23節「就如耶和華─你們的神從前在我們前面使紅海乾了，等著我們過來一樣」，STEP 為 le./yam- suf（H3220G yam 加 H5488G suph）。CT 說這裡將「使約但河的水乾了」和「使紅海乾了」相提並論，一個是使流水在上游「停住，立起成壘」，一個是「使水分開…水在他們的左右作了牆垣」；GT《丁道爾聖經注釋》說第23節特別將過約但河與過紅海相連；KC 說逾越節、紅海、約但河三者都代表基督在十字架上的工作。
  surfaces:
  - 紅海
- name: 逾越節
  type: 歷史
  section: 歷史
  evidence: |-
    第19節「正月初十日，百姓從約但河裡上來」。CT 說正月初十日即逾越節前的第四天，也是挑選逾越節羔羊的日子（參出十二3，6）；GT《丁道爾聖經注釋》說出埃及記十二2~3也提到這個日期，那裡講到逾越節的預備，而逾越節則是十四日，因此過約但河也成了在吉甲慶祝逾越節的開始；KC 說神安排他們在每年逾越節前四天、就是必須開始為逾越節作預備的那一天進入迦南。
- name: 希伯來人_過河的人
  type: 原文
  section: 原文
  evidence: |-
    第5節「你們下約但河中，過到耶和華─你們神的約櫃前頭」。CT 說「過到」原文與「希伯來人」同一字根，在書三、四兩章中共提到22次，正好是希伯來字母的數目，並說「希伯來人」原文字義是「過河的人」。STEP 顯示本章的「過」多處是 H5674A（a.var，簡要詞典義 to pass），如第13節 'a.ve.Ru、第22節 'a.Var、第23節 'a.ve.re./Khem 與 'a.ve.Re./nu。
  surfaces:
  - 過到
- name: 十二塊石頭
  type: 主題
  section: 主題
  evidence: |-
    第3、5、8、20節。第3節 STEP 為 se.'u- ... she.teim- 'es.Reh 'a.va.Nim（H5375G na.sa，簡要詞典義 to lift: raise，加 H8147 加 H6240 加 H68G e.ven，簡要詞典義 stone）。CT 說十二塊石頭表徵全體以色列人，記念他們走過約但河，又說「扛在肩上」表示石頭相當大，需要用肩扛；GT《研經資料》說 4：3、8 的「經過」是 Hiphil 型態，表示這些紀念用的石頭是被人帶過河，正如以色列人被神帶過約但河一樣；KC 說十二這個數字代表神全體的子民；BH 說每一支派在紀念碑中都有同等的地位。
- name: 約但河中的十二塊石頭是另一堆還是同一堆
  type: 解經爭議
  section: 解經爭議
  evidence: |-
    第9節「約書亞另把十二塊石頭立在約但河中」。GT《丁道爾聖經注釋》列出幾種看法後主張「把這些石頭視作與第一堆相同，是較佳的翻譯：約書亞將本來在約但河中的十二塊石頭立起來……」；GT《綜合解讀》給出同樣的英文NIV版譯法；GT《研經資料》說 4：1~3 和 4：9 記載的是兩件事，也有學者認為是同一堆，「不過大部分譯本不持這樣的看法」。CT 說聖經沒有說出另外這十二塊石頭是在那裡取來的；KC 說約書亞在這裡所做的看來並不是神吩咐他的。
  surfaces:
  - phrase: 另把十二塊石頭
    verses:
    - 9
- name: 永遠的紀念（zi.ka.ron）
  type: 原文
  section: 原文
  evidence: |-
    第7節「這些石頭要作以色列人永遠的紀念」，STEP 為 le./zi.ka.Ron（H2146，簡要詞典義 zikh.ron: memorial）加 'ad- o.Lam（H5704 加 H5769G o.lam，簡要詞典義 forever: enduring）。CT 原文字義給「永遠(原文雙字)」一直到(首字)；永遠，永久(次字)，給「紀念」紀念物，記憶；GT《研經資料》說「紀念」的意思是「紀念物，記憶」，這個希伯來字在約書亞記中只出現這一次，但希伯來聖經中這個字多次出現，尤其是在出埃及記、利未記和民數記；GT《聖經精讀本》說「永遠」一詞常見於舊約（9：23；出32：13；利10：9等）。
  surfaces:
  - 永遠的紀念
- name: 作為證據的記號（ot）
  type: 原文
  section: 原文
  evidence: |-
    第6節「這些石頭在你們中間可以作為證據」，STEP 為 tih.Yeh zot 'ot be./kir.be./Khem（H226H，簡要詞典義 ot: sign: indicator，加 H7130G qe.rev，簡要詞典義 among）。CT 原文字義給「證據」記號，並說指具有意義的記號；GT《研經資料》另舉聖經中其他作為後代的「記號」：民 17：10 亞倫的仗給背叛的人留作記號、賽 55：13、出 12：13 逾越節以「血」為記號。
  surfaces:
  - 證據
- name: 直到今日
  type: 主題
  section: 主題
  evidence: |-
    第9節「直到今日，那石頭還在那裡」，STEP 為 'ad hai./Yom ha./Zeh（H5704 加 H3117G yom 加 H2088 zeh）。CT 說表示那些石頭可以辨認出來；GT《聖經精讀本》說指直到記錄本書之時，本書成形於B.C.12世紀，這句話常見於本書（5：9；7：26；9：27；13：13；16：10），表明本書的內容符合歷史事實；GT《綜合解讀》說有時是為了解釋來歷（四9；六25；七26；八28；九27；十三13；十四14；十五63；十六10），有時是為了應用到當時的讀者身上（二十二3、17；二十三9）。
- name: 傳於後代
  type: 神學
  section: 神學
  evidence: |-
    第6節「日後，你們的子孫問你們說：這些石頭是什麼意思？」與第21至24節重複同一問答。GT《聖經精讀本》說在尚未具備系統教育體系的古代以色列社會中，家庭教育所占的比例是相當大的，因此家庭是傳承信仰的所在；KC 說這些真理屬於基督徒家庭，父親必須能解釋主耶穌的死與住在那地有什麼關係，不該把這件事丟給教會裡的教師；BH 說父母負有把神的作為與誡命教導下一代的主要責任（申6：6-9）；CT 說人的問題常是記憶力的失敗，不記得神的恩典。
  surfaces:
  - phrase: 你們的子孫問你們說
    verses:
    - 6
  - phrase: 你們的子孫問他們的父親說
    verses:
    - 21
- name: 正月初十日（過河日期）
  type: 背景
  section: 背景
  evidence: |-
    第19節「正月初十日，百姓從約但河裡上來」，STEP 為 be./'a.Sor la./Cho.desh ha./ri.Shon（H6218 a.s.vor，簡要詞典義 ten，加 H2320G cho.desh，簡要詞典義 month，加 H7223G ri.shon，簡要詞典義 first）。GT《綜合解讀》說摩西從「出埃及第四十年十一月初一日」開始在摩押平原重申律法（申一3），此時應該是摩西去世之後一個多月、出埃及第四十一年的「正月初十日」，大約是主前1407年陽曆三至四月間；GT《研經資料》補一句「當然，也有學者認為是摩西去世之後過一年兩個月才過約但河」；GT《雷氏研讀本》說那時距離上一代的人離開埃及的日子有四十年了；KC 說神在四十年滿足前五天把他們帶進迦南。
  surfaces:
  - 正月初十日
- name: 摩西吩咐約書亞的話出處不明
  type: 解經爭議
  section: 解經爭議
  evidence: |-
    第10節「是照摩西所吩咐約書亞的一切話」。CT 說聖經並未記載摩西曾吩咐約書亞如何渡過約但河之事，故本句話加插在此，可能是為了強調渡過約但河乃是摩西念茲在茲的大事，也可能是強調約書亞乃是繼承摩西的領袖；GT《研經資料》說「其實我們也找不到摩西到底吩咐約書亞關於過約但河要注意哪一些事情」，並指出七十士譯本中沒有這句話；GT《綜合解讀》說可能指摩西所教導的與神同工的原則（出十二28）。
  surfaces:
  - 是照摩西所吩咐約書亞的一切話
- name: 過河的四萬人與留守的七萬人
  type: 主題
  section: 主題
  evidence: |-
    第13節「約有四萬人都準備打仗」，STEP 為 ke./'ar.ba.'Im 'E.lef cha.lu.Tzei ha./tza.Va'（H705 加 H505G e.leph，簡要詞典義 thousand，加 H2502B cha.lats，簡要詞典義 to arm，加 H6635H tsa.va，簡要詞典義 army: war）。GT《研經資料》說「四萬人」字義是「四十千」，「千」是當時的部隊單位名稱，不一定是「一千人」，並說照民 26：2 所記這三支派能打仗的戰士共有十一萬零五百八十人；GT《綜合解讀》說「都準備打仗」原文是「裝備好的軍隊」，表明這些人是特選的精銳；GT《丁道爾聖經注釋》把和合本的「四萬人」讀為四十個「帶兵器的部隊」。
  surfaces:
  - 約有四萬人
- name: 迦南人未趁渡河攻擊的原因
  type: 背景
  section: 背景
  evidence: |-
    第13節「到耶利哥的平原，等候上陣」。GT《丁道爾聖經注釋》以問答列出三個可能原因：迦南人或許不確定以色列人會不會過河、或什麼時候會過河；過河的地點在亞當城以南，出人意外，那裡並不容易涉水而過；晚銅時期（主前1550~1200年）迦南只有幾個地方人口比較集中，耶利哥並不是一個主要的聚居之地。GT《研經資料》說迦南地的居民沒有出面伏擊以色列人，可能是因為以色列人的過河方式太過離奇。CT 說以色列人過河的時間、地點和方式都出人意外，迦南人沒有來得及阻擊他們。
  surfaces:
  - 等候上陣
- name: 使水乾了（ho.vish）
  type: 原文
  section: 原文
  evidence: |-
    第23節「使約但河的水乾了」與「使紅海乾了」兩處，STEP 都是 ho.Vish（H3001，簡要詞典義 ya.vesh: to wither，Hiphil 完成式）。第22節的「乾地」則是另一個字 ba/i.ya.ba.Shah（H3004 yab.ba.shah，簡要詞典義 dry land），第18節祭司腳掌落的「旱地」又是第三個字 he./cha.ra.Vah（H2724 cha.ra.vah，簡要詞典義 dry ground）。GT《丁道爾聖經注釋》說雖然在出埃及的記錄中並沒有用到乾了這動詞，但是喇合在提到過紅海的事時卻曾用到（二10）。
  surfaces:
  - 乾了
- name: 西2：11-12 與基督同死同復活
  type: 互文
  section: 互文
  evidence: |-
    KC 兩度引西2:11-12 解讀本章的兩堆石頭：河中的石頭在約櫃站過的地方，象徵百姓與約櫃在審判之地聯合，引「In Him you were also circumcised with a circumcision made without hands, in the removal of the body of the flesh by the circumcision of Christ」（西2:11）；岸上的十二塊石頭則提醒信徒與基督同死、同埋葬、同復活，引「Having been buried with Him in baptism, in which you were also raised up with Him through faith in the working of God, who raised Him from the dead」（西2:12）。CT 在第7節也把過約但河的紀念連到「表徵受割禮脫去肉體的情慾(參書五2~8；西二11)」。
