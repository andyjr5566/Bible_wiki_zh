book: 約書亞記
chapter: 4
candidates:
- name: 約書亞
  type: 人物
  section: 人物
  evidence: |-
    第4節召齊十二人、第5節吩咐他們下河取石、第9節親自把十二塊石頭立在河中、第17節吩咐祭司從河裡上來、第20節把石頭立在吉甲、第21節向以色列人解釋石頭的意義。第14節「當那日，耶和華使約書亞在以色列眾人眼前尊大」，STEP 為 gi.Dal（H1431 ga.dal）加 be./'ei.Nei（H5869H）。
- name: 摩西
  type: 人物
  section: 人物
  evidence: |-
    第10節「是照摩西所吩咐約書亞的一切話」、第12節兩個半支派「都照摩西所吩咐他們的」、第14節「百姓敬畏他，像從前敬畏摩西一樣」。GT《丁道爾聖經注釋》說這裡將摩西和約書亞作了平行比較：摩西怎樣順服神，約書亞也怎樣順服摩西。
- name: 約櫃
  type: 主題
  section: 主題
  evidence: |-
    第5、7、9、11、16、18節。第7節 STEP 為 'a.Ron be.rit- Yah.weh（H727 a.ron 加 H1285 be.rit）；第16節改稱「法櫃」，STEP 為 'a.Ron ha./'e.Dut（H5715 e.dut，簡要詞典義 testimony）。KC 說水能不能流回來取決於約櫃在哪裡：約櫃進去，水就讓路；約櫃離開，水就流回。
  surfaces:
  - 法櫃
- name: 約但河
  type: 地點
  section: 地點
  evidence: |-
    全章主場景，第1、3、5、7、8、9、10、16、17、18、19、20、22、23節。第18節「約但河的水就流到原處，仍舊漲過兩岸」，STEP 為 va/i.ya.Shu.vu（H7725G shuv）加 li/m.ko.Ma/m（H4725 ma.qom）加 'al- kol- ge.do.Ta/v（H1415 ga.dah，簡要詞典義 bank）。
- name: 吉甲
  type: 地點
  section: 地點
  evidence: |-
    第19節「就在吉甲，在耶利哥的東邊安營」、第20節「約書亞就立在吉甲」。STEP 為 ba./gil.Gal（H1537G gil.gal）。CT 說吉甲位於耶利哥城的東邊約二公里，是一片平原，適於紮營；GT《聖經精讀本》說這一名詞具有「滾」之意；GT《研經資料》說字義是「滾動」、「輪子」；BH 說 Gilgal, meaning “circle of stones,” became a lasting witness。
- name: 耶利哥
  type: 地點
  section: 地點
  evidence: |-
    第13節「到耶利哥的平原，等候上陣」、第19節「在耶利哥的東邊安營」。STEP 第13節為 ar.Vot ye.ri.Cho（H6160L a.ra.vah，簡要詞典義 plain，加 H3405G）。GT《研經資料》說當時的耶利哥城估計有1500到2000居民；BH 說耶利哥的堅固城牆是以色列進入迦南中部要面對的第一道大障礙。
- name: 流便
  type: 人物
  section: 人物
  evidence: |-
    第12節「流便人、迦得人、瑪拿西半支派的人，都照摩西所吩咐他們的，帶著兵器在以色列人前頭過去」。STEP 為 be.nei- re.'u.Ven（H7205）。
- name: 迦得（萬幸）
  type: 人物
  section: 人物
  evidence: |-
    第12節「迦得人」，STEP 為 u./ve.nei- gad（H1410G）。BH 說這幾個支派因牲畜的緣故求得約但河東之地，摩西以協助西岸征戰為條件應允（民32）。
  surfaces:
