- title: 耶和華的手
  path: link_folder/神學/耶和華的手.md
  summary: '第24節「要使地上萬民都知道，耶和華的手大有能力」，STEP 為 yad Yah.weh ki cha.za.Kah（H3027H yad，簡要詞典義 hand: power，加 H2389 cha.zaq，簡要詞典義 strong）。CT 說『地上萬民』指所有的外邦人，『手大有能力』指神手的作為顯示能力極大；GT《聖經精讀本》說希伯來人常用「手」象徵神的權能，比如「大能的手」（出3:19）、「你手」（出15:17）、「父手」（約10:29）；GT《丁道爾聖經注釋》說在神責罰反叛者的經文中這個詞經常出現；BH 說神照自己的旨意管理江河、列國、爭戰與歷史，沒有任何阻礙能攔住祂成就聖約的應許。'
  relation: 本章立石的兩個目的都寫在第24節，向外的那一個就用這個詞：要使地上萬民都知道。
