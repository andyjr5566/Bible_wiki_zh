- title: 過河的四萬人與留守的七萬人
  path: link_folder/主題/過河的四萬人與留守的七萬人.md
  summary: 第13節「約有四萬人都準備打仗，在耶和華面前過去，到耶利哥的平原，等候上陣」，STEP 為 ke./'ar.ba.'Im 'E.lef cha.lu.Tzei ha./tza.Va'（H705 加 H505G e.leph 加 H2502B cha.lats 加 H6635H tsa.va）。GT《研經資料》說「四萬人」字義是「四十千」，「千」是當時的部隊單位名稱、不一定是「一千人」，並說照民26:2 所記這三支派能打仗的戰士共有十一萬零五百八十人，真正派出去的大約只有三分之一；GT《綜合解讀》說「都準備打仗」原文是「裝備好的軍隊」，表明這些人是特選的精銳；GT《丁道爾聖經注釋》把和合本的「四萬人」讀為四十個「帶兵器的部隊」；CT 說這兩支派半二十歲以上能打仗的人數至少有十萬人（民26:7、18、34）。
  relation: 民32 只能靠兩份名冊推算出來的那個數字，在本章由經文直接寫了出來。
