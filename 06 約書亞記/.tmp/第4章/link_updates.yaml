- title: 摩西與約書亞的權柄差異
  path: link_folder/主題/摩西與約書亞的權柄差異.md
  summary: 第14節「當那日，耶和華使約書亞在以色列眾人眼前尊大。在他平生的日子，百姓敬畏他，像從前敬畏摩西一樣」。GT《丁道爾聖經注釋》說這裡應驗了神在書3:7 的應許，所用的言辭也類似，以色列人在此承認約書亞是摩西的接班人、是他們的領袖；GT《聖經精讀本》說神所賜的這種權威並不像許多屬世的權威為了個人的通達和利益，乃是為了成就神的旨意；BH 說約書亞的權柄不是出於個人野心或軍事成就，而是出於耶和華的同在與呼召。CT 說神當初用分開紅海的神跡建立了摩西的權柄（出14:31），現在也藉著過約但河的神蹟建立了約書亞的權柄。
  relation: 本章給的比較是對等的：像從前敬畏摩西一樣。而立這權柄的方式也一樣——一件百姓親眼看見、人做不到的事。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 2
    - 3
    definition: keep
    development: keep
- title: 使你尊大（ga.dal）
  path: link_folder/原文/使你尊大（ga.dal）.md
  summary: '第14節「耶和華使約書亞在以色列眾人眼前尊大」，STEP 為 gi.Dal（H1431，簡要詞典義 ga.dal: to magnify，Piel 完成式）加 be./''ei.Nei kol- Yis.ra.''El（H5869H）——與書3:7 的 ga.del./Kha 是同一個動詞。CT 原文字義給「尊大」尊崇、使尊大，並說『眼前尊大』指因所言所行顯出的超越常人效果，而被人視為神的僕人，給予特別的尊敬；GT《聖經精讀本》說「使……尊大」意為「提高名譽和人格」、「使之光榮」（書3:7；代上29:12），並說藉著渡約但河的神跡神鞏固了約書亞的領袖地位；GT《丁道爾聖經注釋》說這裡應驗了神在書3:7 的應許，也是過約但河事件的結語。'
  relation: 書3:7 是神說要做，本章第14節是做成了，兩節用同一個動詞。
  overview_review:
    signals:
    - development_blank
    accumulation_count:
