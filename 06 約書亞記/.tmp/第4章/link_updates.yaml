- title: 希伯來人_過河的人
  path: link_folder/原文/希伯來人_過河的人.md
  summary: 第5節「你們下約但河中，過到耶和華─你們神的約櫃前頭」。CT 說『過到』原文與「希伯來人」同一字根，在書3、書4 兩章中共提到22次，正好是希伯來字母的數目，並註明「希伯來人」原文字義是「過河的人」。STEP 顯示本章多處的「過」是 H5674A（a.var，簡要詞典義 to pass），如第13節 'a.ve.Ru、第22節 'a.Var、第23節 'a.ve.re./Khem 與 'a.ve.Re./nu；第3節石頭「帶過去」則換成使役型態的 ve./ha.'a.var.Tem（H5674C），GT《研經資料》說第3、8節的「經過」是 Hiphil，表示這些紀念用的石頭是被人帶過河，正如以色列人被神帶過約但河一樣。
  relation: 這個字根在本章密集出現，人過河與石頭被帶過河用的是同一個字，只差在語態。CT 統計的22次，正落在書3 與書4 這兩章。
