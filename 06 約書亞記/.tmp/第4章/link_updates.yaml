- title: 傳於後代
  path: link_folder/神學/傳於後代.md
  summary: 第6節「日後，你們的子孫問你們說：這些石頭是什麼意思？」與第21至24節重述同一問答。GT《聖經精讀本》說在尚未具備系統教育體系的古代以色列社會中，家庭教育所占的比例是相當大的，因此家庭是傳承信仰的所在；KC 說這些真理屬於基督徒家庭，父親必須能解釋主耶穌的死與住在那地有什麼關係，不該把這件事丟給教會裡的教師或帶查經的弟兄，而每個孩子也有責任按著聖經察驗；BH 說父母負有把神的作為與誡命教導下一代的主要責任（申6:6-9），孩子的提問正是父親宣告神作為的機會；CT 說人的問題常是記憶力的失敗，不記得神的恩典。
  relation: 本章的紀念碑不是為了立碑本身，是為了引出一個問題。第6節與第21節各問一次，第22至24節給出答案。
