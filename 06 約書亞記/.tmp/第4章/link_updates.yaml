  summary: 第19節「正月初十日，百姓從約但河裡上來，就在吉甲，在耶利哥的東邊安營」，第20節約書亞把從河中取來的十二塊石頭立在吉甲。STEP 為 ba./gil.Gal（H1537G）。CT 說吉甲位於耶利哥城的東邊約二公里，是一片平原，適於紮營；GT《聖經精讀本》說這一名詞具有「滾」之意，此地既是渡河後的第一個宿營地，也是平定迦南的根據地；GT《綜合解讀》列出後續在吉甲發生的事：立石紀念、為曠野出生的人行割禮（書5:2-9）、守逾越節（書5:10）、嗎哪停降（書5:11-12）、遇見耶和華軍隊的元帥（書5:13-15）、分地（書14:6）、約櫃留駐至搬往示羅（書18:1）。GT《啟導本》說此處的吉甲當指耶利哥東北三公里處的卡巴馬夫謝廢墟；GT《丁道爾聖經注釋》與《研經資料》都說確實地點目前並無確鑿的資料。
