- title: 紅海分開
  path: link_folder/歷史/紅海分開.md
  summary: 第23節「就如耶和華─你們的神從前在我們前面使紅海乾了，等著我們過來一樣」，STEP 為 le./yam- suf（H3220G 加 H5488G）加 ho.Vish（H3001，Hiphil 完成式）。CT 說這裡把「使約但河的水乾了」和「使紅海乾了」相提並論，一個是使流水在上游「停住，立起成壘」，一個是「使水分開…水在他們的左右作了牆垣」（出14:21-22）；GT《丁道爾聖經注釋》說第23節特別將過約但河與過紅海相連，並指出雖然出埃及的記錄中沒有用到「乾了」這動詞，但喇合提到過紅海時曾用到（書2:10），同時注意到本節人稱有變——過約但河用第二人稱複數「你們」、過紅海用第一人稱「我們」；KC 說逾越節、紅海、約但河三者都代表基督在十字架上的工作。
  relation: 這是約書亞自己作的比較，也是本章要父親們講給孩子聽的內容：兩次分水被說成同一位神的同一件事。
