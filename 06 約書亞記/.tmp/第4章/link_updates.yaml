- title: 瑪拿西半支派為何留在河東
  path: link_folder/解經爭議/瑪拿西半支派為何留在河東.md
  summary: 第12至13節。CT 說這兩支派半二十歲以上能打仗的人數至少有十萬人（民26:7、18、34），可見泰半留在約但河東保護自己的土地和家人；GT《啟導本》說民26 所記二支派半20歲以外能打仗的總數為13萬餘，可見過河參加戰爭的只有三分之一，其餘留在河東保護新建立的家園；GT《雷氏研讀本》說這裡的人數比這些支派能出去打仗之人的總數少了一半有多，而這四萬人在前面引路；GT《串珠》說這些支派的其餘壯丁可能為保衛家園而在河東留了下來；GT《研經資料》說看起來這兩支派半是派遣精銳部隊做整個以色列部隊的先鋒，但還留下大部分軍隊維持河東居住地區的安全，而約書亞也沒有對這樣的配置表示意見。
  relation: 本章是這件事第一次可以從人數上看見：他們確實過了河，但過河的只有一部分。經文沒有評價這個安排，各家的推測也都集中在留守的必要上。
