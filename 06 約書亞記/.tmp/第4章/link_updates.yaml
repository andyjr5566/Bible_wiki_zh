- title: 敬畏神
  path: link_folder/神學/敬畏神.md
  summary: '第14節「百姓敬畏他」與第24節「也要使你們永遠敬畏耶和華─你們的神」，STEP 兩處都是 H3372H（ya.re，簡要詞典義 to fear: revere）：第14節是 va/i.yir.''U 與 ya.re.''U，第24節是 ye.ra.Tem。GT《研經資料》說這個字在利19:3 用在「孝敬」父母、申28:58 用在「敬畏」神；GT《丁道爾聖經注釋》說這個神跡的成就是要以色列人一生敬畏神，而敬畏神便是要全心全意效忠祂；BH 說敬畏耶和華包含在祂的聖潔面前存敬畏、信靠祂的信實，並讓生命順服祂的命令。CT 說「永遠敬畏」指世世代代畏懼並尊崇神手的作為。'
  relation: 同一個字在本章用了兩次，一次對人、一次對神。百姓敬畏約書亞，是因為先看見了神的作為；而神立這座紀念碑的目的，是要他們永遠敬畏祂。
