- title: 約但河
  path: link_folder/地點/約但河.md
  summary: 全章的場景。第18節「抬耶和華約櫃的祭司從約但河裡上來，腳掌剛落旱地，約但河的水就流到原處，仍舊漲過兩岸」，STEP 為 va/i.ya.Shu.vu（H7725G shuv）加 li/m.ko.Ma/m（H4725 ma.qom）加 'al- kol- ge.do.Ta/v（H1415 ga.dah，簡要詞典義 bank）。CT 由此推斷停在上游亞當城附近的河水早已適時奔流而下，並說水位恢復到原先春季氾濫時的高度。GT《研經資料》說約但河平時寬度約30公尺、深度約1到3公尺，此時應該比平常寬深甚多。第9節有十二塊石頭立在河中，KC 說水一流回來這座紀念碑就再也看不見了。
  relation: 前一章記河水怎麼斷絕，本章記它怎麼流回來。河在這一章有兩個身分：一條走得過去的通道，以及一座沉在水底的紀念碑的所在。
