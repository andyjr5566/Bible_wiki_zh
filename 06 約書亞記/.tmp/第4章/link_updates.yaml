- title: 逾越節
  path: link_folder/歷史/逾越節.md
  summary: 第19節「正月初十日，百姓從約但河裡上來」。CT 說正月初十日即逾越節前的第四天，也是挑選逾越節羔羊的日子（出12:3、6）；GT《丁道爾聖經注釋》說出12:2-3 提到同一個日期，那裡講的是逾越節的預備而逾越節在十四日，因此這一段等於再次回顧了出埃及，也預備讀者去看書5 章的逾越節；GT《雷氏研讀本》說以色列人剛剛來得及揀選逾越節的羔羊；KC 說神安排他們在每年逾越節前四天、也就是必須開始為逾越節作預備的那一天進入迦南；BH 說以色列進入迦南的日子，正是出埃及前各家挑選逾越節羔羊的同一天。
  relation: 本章沒有記守節，只記了一個日期，而那個日期把整件事接回四十年前的埃及。書5:10 記的逾越節，就從這一天開始預備。
