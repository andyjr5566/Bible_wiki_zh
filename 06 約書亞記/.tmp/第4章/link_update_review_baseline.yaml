- title: 摩西與約書亞的權柄差異
  path: link_folder/主題/摩西與約書亞的權柄差異.md
  definition: '民數記27章既確認約書亞是真正的接班人，也保留他與摩西的權柄差異。約書亞獲得足以使全會眾聽從的尊榮，卻不像摩西那樣直接承接本章一再出現的「耶和華曉諭摩西」模式；民27:21
    規定他要站在大祭司以利亞撒面前，由祭司憑烏陵為他求問。


    | 比較面向 | 摩西 | 約書亞 |

    |---|---|---|

    | 任務 | 帶百姓出埃及、經過曠野，頒布神的律法 | 帶新一代進入並取得所賜之地 |

    | 領受指示 | GT 指出摩西可與神面對面說話 | 藉以利亞撒和烏陵求問神的旨意 |

    | 公開權柄 | 原有尊榮使百姓長期聽從 | 從摩西的 hod 中領受尊榮，使全會眾承認他 |

    | 職分關係 | 同亞倫配搭帶領出埃及 | 同以利亞撒配搭進入地業，軍政帶領與祭司求問彼此配合 |


    STEP 對民27:20 H1935 的資料是 me./hod./Kha，「從你的尊榮中」，前綴介系詞帶有取自其中的意思；民27:21「判斷」是 H4941G，「烏陵」是
    H224 複數名詞。語言資料確認經文的授權和求問結構。GT《啟導本》明說摩西直接與神說話，約書亞要藉大祭司；丁良才則把約書亞的政治、軍事領導與以利亞撒的祭司職分看作互助。KingComments
    把這個次序概括成領導要受祭司職分約束，BibleHub 也強調以利亞撒在決策中的中介角色。


    **連續性與差異同時存在。** KingComments 強調按手與公開站立讓約書亞具有摩西接班人的位置和權威；GT 與民27:21 則顯示他取得神旨意的方式仍有界線。讀者可以因此明白：「接班」不是複製前任的一切特權，而是在神設定的新角色分工中得到足以完成使命的權柄。'
  development: '### 民27 要透過祭司求問，申31 神直接說話


    這個差異在兩卷書裡被寫成兩種樣子。


    民數記27章把界線畫得很清楚：約書亞獲得足以使全會眾聽從的尊榮，是從摩西的尊榮中分出來的一份；而民27:21 規定他要站在大祭司以利亞撒面前，由祭司憑烏陵為他求問。他沒有承接「耶和華曉諭摩西」那個模式。


    申命記31章卻出現一個例外。第7節是摩西對約書亞說剛強壯膽，第23節是耶和華囑咐嫩的兒子約書亞說同一句話——中間沒有祭司，也沒有烏陵。GT《申命記雷氏研讀本》一句話點出來：約書亞直接受命於神。


    ==差異沒有被取消，只是在交接這一刻讓開了。==GT《聖經精讀本──申命記註解》讀出的重點在這裡：從神委任並激勵約書亞的話語中，可以認識到實際引領以色列進入應許之地的主體正是耶和華神。這一次神直接說話，說的也正是這件事——我必與你同在。'
