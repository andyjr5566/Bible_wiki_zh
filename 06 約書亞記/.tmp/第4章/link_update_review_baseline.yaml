- title: 帶著兵器（cha.mush）
  path: link_folder/原文/帶著兵器（cha.mush）.md
  definition: '書1:14 約書亞對河東二支派半的要求是：「但你們中間一切大能的勇士都要帶著兵器在你們的弟兄前面過去，幫助他們」


    ### 原文


    STEP 顯示「帶著兵器」是 cha.mu.Shim（H2571，形態 HVqsmpa），本節譯義是 arrayed for battle，簡要詞典義是 cha.mush:
    armed。同一節的「大能的勇士」是 gi.bo.Rei ha./Cha.yil（H1368 加 H2428G），「過去」是 ta.''av.Ru（H5674A，簡要詞典義
    a.var: to pass），「幫助」是 va./''a.zar.Tem（H5826，簡要詞典義 a.zar: to help）。


    ### 與數字五的關聯


    GT 兩份子來源都指向同一個字根。GT《約書亞記綜合解讀》說：「「帶著兵器 חָמַשׁ」原文的字根是「第五 חֹמֶשׁ」，可能當時的以色列軍隊採用五人一組的戰鬥隊形。」GT《聖經精讀本──約書亞記註解》說得更完整：帶著兵器的希伯來語派生於指數字五的詞根，含有準備參戰之意；據推測，兩個半支派軍隊可能是採用了五人為一組的戰鬥隊型。


    STEP 這一層能確認的是本節的字形、Extended Strong 與詞義（armed／arrayed for battle）；字根與「第五」的關聯以及五人隊形的推測，是上述兩份
    GT 子來源的說明，兩位作者自己也用了「可能」與「據推測」。


    ### 人數的估算


    GT《聖經精讀本──約書亞記註解》另外做了一組推算：根據書4:13，兩個半支派參加戰爭的人數約有四萬人；根據民26:7、18、34，他們中間可以拿兵器的約有十一萬人，其中約七萬名似乎是為了保護妻兒與家畜而留守在約但河東。


    ### 各家怎麼讀這道命令


    CT 說「大能的勇士」指戰鬥人員，也就是從二十歲以外能出去打仗的（參民26:2），而妻子孩子牲畜留守河東，正如摩西和他們的約定（參民32:26）。GT《啟導本聖經約書亞記註釋》給的定義相同：年滿二十歲，能使用兵器英勇作戰的人。


    BH 注意到位置：他們最強的戰士要與其餘以色列人一同過約但河，並在戰役中站在前列；BH 說這顯出合一、勇氣，以及對藉摩西所傳之命令的忠實。KC 則說這兩個半支派得以住在約但河東岸，條件就是一同去攻取那地，而這是他們答應過的（民32:31-33），如今他們果然同去，甚至走在前列。'
