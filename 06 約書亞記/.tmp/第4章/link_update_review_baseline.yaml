- title: 希伯來人_過河的人
  path: link_folder/原文/希伯來人_過河的人.md
  definition: 希伯來原文字面意「過河的人、渡河者」。源於亞伯拉罕渡過幼發拉底河進入迦南（創14:13首見「亞伯蘭希伯來人」）。後成為以色列人自稱與他稱：「以色列人向別族介紹自己時用『希伯來人』（創43:32；拿1:9）；別族稱呼以色列民族時用『希伯來人』（出2:6）」。約瑟創40:15自稱「從希伯來人之地被拐來」，GT《創世紀註釋》丁良才解釋：約瑟不說迦南地，「大概因為他輕看那些拜偶像的迦南人，不願意被人看作迦南人」。
  development: GT《聖經精讀本》歸納這個稱呼的兩種用法：①以色列人向別的民族介紹自己時（創43:32；拿1:9）；②別的民族稱呼以色列民族時（出2:6）。約瑟在埃及監獄裡自報「希伯來人之地」，正落在第一種——他沒有忘記自己是亞伯拉罕的後裔、立約的百姓。
