- title: 耶和華的手
  path: link_folder/神學/耶和華的手.md
  definition: 「耶和華的手」於出9:3作為第五災的施行者，是聖經以「手」表徵神大能施作的常見用法。本章首次「耶和華的手加在你田間的牲畜上」即畜疫之災；舊約全書有二百多次以「手」表達神的權能（GT中文聖經註釋）。
  development: BH 指出「耶和華的手」是聖經表達神能力與權柄的比喻，在此「強調即將來到的災是神的直接作為，不是一場自然災害」。GT《中文聖經註釋》從統計上說明這個說法的分量：「用手來代表神施行其作為，全舊約有二百多次用手來表達神的權能和力量。」它同時注意到本章敘事的人稱換了：「首先，這耶和華的說法是以第三人稱出現，而其他地方都用『我』」——因為這段話是由摩西的口說出來的。
