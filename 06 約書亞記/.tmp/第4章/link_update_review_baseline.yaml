- title: 紅海分開
  path: link_folder/歷史/紅海分開.md
  definition: 出埃及記第14章 v21-22 記載的神蹟：摩西向海伸杖，「耶和華便用大東風，使海水一夜退去，水便分開，海就成了乾地。以色列人下海中走乾地，水在他們的左右作了牆垣」。CT
    指出水豎立成牆不可用理性解釋——這是純粹的神蹟；KC 引用伯二十六12「他以能力攪動大海」；BH 引用詩一零六9「他斥責紅海，海便乾了」。一夜大東風是神使用的自然媒介，但海水豎立成牆是超自然作為。
  development: '**「分開」原文更像「劈開」。** GT《丁道爾聖經註釋》指出：「『分開』嚴格來說，是『劈開』或『在中間製造一個狹谷』的意思。本節和21、22節並沒有衝突，但我們也不該過分穿鑿，因為兩個隱喻形容的是同一件事實。」


    **這片水域不會只是淺沼澤。** GT 賈斯樂郝威《聖經難解經文詮釋手冊》給了兩個反證：「⑴出埃及記十四章22節提到，當海水分開是『水在他們的左右作了牆垣』，因此這個海如果只是一個沼澤，情形將不可能如此。⑵埃及人在追趕以色列人，一旦他們跟著下到海中……『那些跟著以色列人下海法老的全軍連一個也沒有剩下』。如果『蘆葦海』只是一個淺的沼澤，這裡所敘述的情形就不是如此。」GT《舊約聖經背景註釋》從物理上同意。但
    GT《丁道爾聖經註釋》持保留：「此地若是底部柔軟、長滿蘆葦，和海灣相連（作為海灣的延伸）的鹽澤，退潮和大風應該可以使湖床暫時乾涸，武裝輕便的軍隊可以迅速走過。」


    **兩百萬人一夜過得完嗎。** 賈斯樂郝威的回答分兩層：一是經文並沒有說渡海只花一夜——「在此沒有提到是什麼時候，因此也不能就下結論說以色列人在一大早就全部過了紅海」；二是就算真在二十四小時內完成也並非不可能——「經文並未說以色列人以單排行列（single
    file）進行，或經由某一段特定的乾地通過紅海。事實上，有可能神為他們準備幾哩寬的地段」，而即使按蘇彝士灣最寬處計，「它的平均寬度大約有40哩。如果一個人平均一小時走2哩，40哩的路程大約24
    小時內就可以走完」。GT《聖經精讀本──出埃及記註解》則從另一頭估算：「要使近200萬的男女老少和各種牲畜一夜渡過紅海，分開的通道寬度至少需要一海裡（1,609m）。」


    ### 書3：同一組動詞的第二次


    過約但河不是另一個神蹟的比喻，經文用的是同一批字。


    書3:13、16 說水「立起成壘」，STEP 為 ned（H5067）；GT《約書亞記綜合解讀》與《約書亞記研經資料》都指出這與出15:8 大水直立如「壘」是同一個字。書3:17
    說祭司與百姓走在「乾地」上，STEP 為 be./cha.ra.Vah（H2724）；GT《研經資料》說這與出14:21 神使紅海成了乾地用詞一致。GT《丁道爾聖經注釋》把第三組也列出來：祭司們站在乾地上，與百姓從乾地上過去一樣，又與摩西將紅海變成乾地一樣。


    差別在人。GT《綜合解讀》說過紅海的老一代以色列人大都去世了，現在神要新一代的以色列人親身經歷過約旦河的神跡，並指出約書亞特意把兩件事相提並論（書4:23）。喇合在書2:10
    提到的第一件聽聞也正是紅海——==同一件事，一代人親身經歷，下一代只是聽說，而迦南人也是聽說。==


    KC 從解讀的角度把兩次分開：紅海是出口，約但河是入口；紅海那次在夜間、有敵人追在後面，約但河這次在白天、是向著敵人從容前進。這是他的進路，經文本身只記下兩次都是水分開、都走乾地。'
