- title: 使你尊大（ga.dal）
  path: link_folder/原文/使你尊大（ga.dal）.md
  definition: '書3:7 神在過河之前先對約書亞說了一句與河無關的話：「從今日起，我必使你在以色列眾人眼前尊大」


    ### 原文


    STEP 顯示這一句由三部分組成：hai./Yom ha./Zeh（H3117L 加 H2088，今日這日）、''a.Chel（H2490C，簡要詞典義 cha.lal:
    to profane/begin: begin，本節譯義 I will begin）、ga.del./Kha（H1431，簡要詞典義 ga.dal: to
    magnify，本節譯義 to make great you）、be./''ei.Nei kol- Yis.ra.''El（H5869H，簡要詞典義 a.yin:
    eye: seeing）。動作的主詞是神，受詞是約書亞。


    CT 的原文字義給「尊大」為大，尊崇，並在文意註解說『眼前尊大』指因所言所行顯出的超越常人效果，而被人視為神的僕人，給予特別的尊敬。


    ### 為什麼這件事需要神親自做


    GT《約書亞記綜合解讀》把它接到權柄：神的百姓不認識權柄，就不可能在爭戰中得勝，而屬靈的權柄不是人自取的，是神親自顯出來的；它說神施行過約旦河神跡的目的之一，是要借著顯明神與約書亞的同在，建立他在神百姓中的權柄。CT
    在書3:7 的話中之光說同一件事：神要藉著約書亞發號施令，然後印證他所發的命令，就顯明他的屬靈權柄。


    GT《聖經精讀本──約書亞記註解》從約書亞的處境說：這時約書亞被立為摩西的繼承人（民27:18），他曾多次目睹以色列百姓悖逆摩西的場面，似乎對自己的領導能力沒有自信；在這種情況下，神向約書亞應許，使他更加大膽地引導以色列百姓。


    BH 說過約但河會在全國面前公開確立約書亞的職分：神要用一件沒有任何人類領袖能做到的事來尊榮他的職分，讓人清楚看見約書亞的權柄在於耶和華，而不在於個人的力量或野心；BH
    並指出每一支派都會親眼看見，這場公開的神蹟會使百姓在面對征服迦南時圍繞在神所立的領袖身邊。


    ### 這句話的另一半


    同一節後半是「使他們知道我怎樣與摩西同在，也必照樣與你同在」。BH 說與摩西的對比確認了神待以色列的作為前後不斷：紅海之於摩西，約但河之於約書亞。KC 的讀法不同，他把約書亞被高舉讀成主耶穌被高舉的圖畫，並說父神使祂在天上得榮耀就是父與祂同在的憑據。這是
    KC 的解讀進路，本節經文只記下神對約書亞說的話。'
