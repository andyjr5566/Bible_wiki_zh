- title: 迦得（萬幸）
  path: link_folder/人物/迦得（萬幸）.md
  definition: 利亞使女悉帕所生的長子（雅各第七子），名字意為「幸運/萬幸」。利亞說「萬幸！」，故以此命名。
  development: '### 一個名字裡的兩個意思


    迦得這個名字生在一場家庭競賽裡。創世記30章，[[利亞]]見自己停了生育，把使女[[悉帕]]給[[雅各]]為妾；悉帕生了兒子，利亞說「萬幸！」，於是給他起名叫迦得。名字記的是她在與[[拉結]]的競爭中的心情。


    但同一個字還有第二個意思——軍隊。CT 在民數記兩次數點的原文字義都註「迦得」是軍隊（申3 那處還多給一個「財富」），而這個意思才是這一支後來走的路。GT《中文聖經註釋》另指出一個容易被忽略的層面：「這也是一個幸運之神的名字，中文把它繙成『時運』」（賽65:11）。同一份註釋也提醒，五經對迦得本人的事跡幾乎沒有記載——這個名字後來承載的全是支派的事。


    轉折點在創49:19 雅各的臨終祝福：「迦得必被敵軍追逼，他卻要追逼他們的腳跟。」CT 讀成先敗後勝：迦得支派的地在約但河東（書13:24-28），經常受侵襲（士10:8），但強盛時就把敵人制伏（代上5:18-22）。GT《創世記雷氏研讀本》講得更直接：迦得定居約但河東後很容易受到攻擊，因此他們需要強壯的戰士。


    ### 數點：唯一那個沒有整數的數字


    民數記1章數到迦得時，得出四萬五千六百五十名——十二支派裡唯一不以「百」收尾的數字。GT 丁良才注意到了，也給了一個解釋：「除了迦得支派以外，十二支派都是記整數，沒有記零數，有人以為這一次的計算，是為預備打仗⋯所以只記五十個以上的整數」。


    安營的位置同樣把它放在軍事的脈絡裡。民2 迦得隸屬南邊的[[流便]]營，與流便、[[西緬]]同組。丁良才說明這樣編組的用意：流便、西緬是利亞長子與次子的後裔，迦得則是利亞婢女悉帕之長子的後裔，「這樣就使他們少生嫉妒猶大支派的心」。CT
    另注意到迦得與[[亞設（有福）|亞設]]同為悉帕所生，卻在軍隊編組中分列不同的組。


    三十八年後的第二次數點掉了下來：民26 只剩四萬零五百名，比第一次少了五千一百五十。CT 與丁良才都注意到流便、西緬、迦得都在會幕南邊安營、與[[可拉的背叛（預告）|可拉]]相鄰，因而推測受可拉黨牽連。


    ### 自己開口要來的前線


    民數記32章是迦得在五經裡最主動的一次。表面上提議的是流便和迦得兩支派，GT《串珠聖經註釋》卻指出真正的主導者是誰：「流便是長子，理應排名在先，但此事的主謀人實為迦得支派，所以下文多次以迦得排首（6,
    25, 29, 31, 33）。」他們承諾帶兵器行在以色列人前頭，然後在河東建造底本、亞他錄、亞羅珥等城並壘羊圈。


    代價在後面幾章慢慢顯出來。民34 分地時迦得整支不在名單裡，只出現在一句解釋中——他們已經在約但河東按著宗族受了產業。申命記3章給他們的地南界[[亞嫩河|亞嫩谷]]、北界雅博江，一律與流便並列，沒有單獨的敘述。到申4:43
    分定[[逃城]]時，迦得分到的是[[基列]]的[[拉末]]，CT 說「迦得人所得地業在河東的中部」。BH 在這一節指出迦得人以驍勇著稱，而他們的地界因位置關鍵，也常成為衝突之地。


    從創30 利亞喊的那一聲「萬幸」，到申4 河東中段的一座逃城，這個支派走的其實是名字的另一半。他們自己開口要的那片地，正是把他們永遠留在最前線的那片地——而創49
    早就把這件事講完了：先被追逼，然後追逼回去。'
