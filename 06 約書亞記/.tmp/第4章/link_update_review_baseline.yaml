- title: 傳於後代
  path: link_folder/神學/傳於後代.md
  definition: 聖經中「神要祂百姓將神作為傳於後代」的神學命令——出十2「並要叫你將我向埃及人所做的事，和在他們中間所行的神蹟，傳於你兒子和你孫子的耳中，好叫你們知道我是耶和華」為典範經文。神蹟的目的有三重：當代彰顯、後代教育、確立「我是耶和華」的知識累積。
  development: 'CT 指出本節是神蹟的受教育目的——不僅向當代埃及人彰顯神權，更向歷代以色列人建立「耶和華是神」的群體見證。神蹟沒有傳承就失去其教育意義。


    BH 強調古代近東以口傳為主要歷史保存方式，此命令對應申六6-7「要殷勤教訓你的兒女」——以色列人受命將神在埃及所行的大事成為家庭崇拜與教育的核心內容。GT
    丁良才補充：「傳」字原文使之之聽、使之明白、重述——是教育性的動詞，不只是資訊傳遞。


    BH 延伸：以色列出埃及事件在新約預表基督十字架的救贖（林前十1-4），故此神要信徒記念到後代——林前十一23-26 主餐設立時同樣用「傳」講這件事。教會守餐之「傳」直延續出埃及記的「傳於後代」神學。CT
    應用：每個家庭敬拜、每個教會記念（餐桌、洗禮、聖餐）都是出十2 的延續。


    預表與對應：

    - 出十二26-27 逾越節子女問「這禮是什麼意思？」——以色列人要回答傳承

    - 曫二16-17 揹示錄之「紀念石」為子孫之記號

    - 詩七十八3-7「我們將所要傳給子孫…使他們仰望神」

    - 林前十一2「我稱讚你們，因你們凡事記念我，又堅守我所傳給你們的」


    KC 從教會實踐角度：傳於後代之命令使以色列成為「教育性民族」——每個父親是信仰教師，每個家庭是神學教室。新約教會亦然——「教訓他們遵守」之主耶穌大使命（太二十八20）延續之。'
