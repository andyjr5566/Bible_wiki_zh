- title: 夏瑣
  path: link_folder/地點/夏瑣.md
  definition: '夏瑣是書11 的主角城，也是約書亞在迦南只焚燒過的三座城之一。它在本章出現四次：第1節它的王發起北方聯軍，第10節它被攻取、王被殺，第11節它被焚燒，第13節經文特別聲明只有它被燒。


    ### 名字與位置


    STEP 顯示第13節的地名是 cha.Tzor（H2674G，簡要詞典義 cha.tsor: Hazor）。CT 的原文字義給「夏瑣」城堡、圍牆，並說它是迦南北部一座防守堅固的大城，位於加利利海以北16公里，扼守從美索不達米亞到埃及的國際貿易路線「沿海大道
    Via Maris」，是古代迦南的政治、經濟中心，城內可住4萬人。


    各家給的座標略有出入：GT《雷氏研讀本》說它在今天已乾涸的戶勒湖西南面約五英里（8公里）、加利利海以北十英里（16公里）以外；GT《聖經精讀本》說位於呼勒湖西北8公里處；GT《研經資料》說位於呼勒湖西南6.4公里的戰略性位置。方向不一致，但都指向同一片胡拉湖周邊。


    ### 考古與文獻


    GT《約書亞記研經資料》說西元前18~17世紀的馬里文獻和西元前14世紀的亞馬拿文獻都提到此城；1955年有學者成功在「基達廢坵」（Tell el~Qedah）發掘出夏瑣遺跡，城內包括高的建築物、高於路面50.3公尺、佔地10.12公頃，並且城周圍有68.83公頃的平原。它並指出此城有三次被焚毀的痕跡，分別是西元前1400、1300、1230年，一般認為西元前1300年那一次是埃及法老塞提一世的戰績，其餘兩次之一可能就是約書亞所為。GT《啟導本》記下同樣的三次焚城年代。BH
    說夏瑣的挖掘發現了與這城暴力傾覆相符的大規模火焚層。


    ### 為什麼只燒這一座


    CT 把三座被燒的城並排解釋：在迦南諸城中，只有耶利哥、艾城和夏瑣被焚燒——耶利哥是獻給神的初熟果子；艾城是用徹底的得勝來恢復失敗的百姓；而夏瑣是『在這諸國中是為首的』，是迦南惡俗的象徵，必須被徹底清除。GT《綜合解讀》逐字記下同一段話。GT《靈修版聖經註釋》說它在過去既然是那地的京城，就是邪惡風俗的象徵，以色列人必須毀滅它，而它被佔領、被毀滅，就折斷了聯軍的支柱，也削弱當地百姓想頑抗的意志。


    KC 給的理由不同角度：Because it is a mighty city, the human mind might reason that it could
    be a suitable capital for Israel. But God does not allow the seat of worldly power
    and influence to become the seat of His people（因為這是一座強大的城，人的理性也許會推論它適合作以色列的京城；但神不容世上權勢與影響力的所在成為祂百姓的所在）。


    ### 它後來又回來了


    GT《啟導本》說夏瑣城被焚後不久，迦南人曾圖重建，士4:2 記有另一個夏瑣王耶賓起來壓迫以色列人、為女士師底波拉所殺；GT《聖經精讀本》說此城雖被約書亞所毀滅、後卻被重建成為外邦人的王都；GT《研經資料》說由於此處位居要津，所以約書亞征服以後可能又有迦南人進入此處重建。KC
    把這一點讀成百姓不忠的後果，並說當百姓呼求時神藉巴拉和底波拉拯救他們。'
