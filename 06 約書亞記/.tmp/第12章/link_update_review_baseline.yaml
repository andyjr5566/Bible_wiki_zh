- title: 亞斯她錄
  path: link_folder/地點/亞斯她錄.md
  definition: '亞斯她錄是巴珊王噩的首都。申命記1:4 提到摩西擊殺了「住以得來、亞斯她錄的巴珊王噩」。


    **這座城在經外文獻裡查得到。** GT《華爾頓申命記背景注釋》給了本節三個地名裡唯一有考古與文獻交叉佐證的一個：「本節所提的三個地點，只有希實本曾被挖掘，但這個遺址也有爭議之處⋯本節稱亞斯他錄為巴珊的首都。埃及、亞述文獻，和亞馬拿書函，都提到過這個城市。部分學者相信烏加列文獻提到神祇伊勒統治的所在，也是這個地方。它今日稱為亞斯他拉遺址（Tell
    ''Ashtarah），位於雅穆克河畔，加利利海東面二十五哩左右之處。」同一段還補了一句對照：「西宏和噩都沒有在任何經外文獻中出現。」——城市查得到，兩個王查不到。


    **城名與迦南女神同源。** BH 指出亞斯她錄是噩國中的主要城市之一，也是迦南女神 Astarte 的敬拜中心，城名本身就反映了當地的宗教。CT 給的原文字義是「星辰」。


    **和合本與註釋的寫法不同。** 經文作「亞斯她錄」，CT 與 GT 都寫「亞斯他錄」，指同一個地方。'
