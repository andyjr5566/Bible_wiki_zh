    CT 的原文字義給「伊磯倫」似小牛，並說伊磯倫位於拉吉西方十公里，又說伊磯倫的軍隊也早已傷亡殆盡，故輕易地被以色列人攻佔。GT《串珠聖經注釋》說伊磯倫接近拉吉、確實地點不詳。


    GT《約書亞記研經資料》說字義是「似小牛」，應該是目前的 Tell Aitun 或是 Tell~el~Hesi；並說如果是後者，那就位於迦薩通往耶路撒冷的大道上、控制了從撒非拉下來的山谷之地，是一個非常具有戰略性的城，尤其因為它很接近非利士平原的邊界。BH
