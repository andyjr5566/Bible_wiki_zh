- title: 艾城王
  path: link_folder/人物/艾城王.md
  definition: '艾城王是約書亞攻取艾城時該城的統治者。聖經沒有留下他的名字，STEP 顯示書8:14 用的就是 Me.lekh-（H4428G，簡要詞典義
    me.lekh: king）接 ha./''Ai（H5857G，簡要詞典義 ay: Ai），也就是「艾城的王」這個稱呼本身。


    **他在故事裡出現三次，一次比一次被動。** 第一次是神的宣告：書8:1 神對約書亞說已經把艾城的王和他的民、他的城並他的地都交在他手裡，書8:2 又說要照著待耶利哥王的方式待他。第二次是他自己的決定：書8:14
    他看見以色列的陣容，就和全城的人清早急忙起來出戰。第三次是結局：書8:23 他被生擒解到約書亞那裡，書8:29 被掛在樹上，日落取下丟在城門口，屍首上堆成一大堆石頭。


    **各家都注意到他為什麼會上當。** GT《聖經精讀本──約書亞記註解》說他察看以色列軍隊的陣容之後便立即判斷他們是烏合之眾，因為當時的以色列軍似乎想要打一場不及初級兵法的戰爭，而卓越的戰略家看到這種佈局會懷疑內中有詐，他卻因過於相信上一次的勝利經驗而輕易斷定。CT
    也說『這景況』即指以色列的陣容，可能因此判斷他們是烏合之眾。BH 把這一點寫成一句對照：他能看見面前的以色列，卻看不見背後的危險。


    **被生擒不是僥倖活命。** CT 說『生擒』是留他活命、交由約書亞親自處置。BH 說王被帶到約書亞面前，是以色列立約領袖與神審判的執行者面前，這顯明軍事謀略與王權都擋不住耶和華的審判。


    他最後的處置照的是摩西的規矩：屍首不留在樹上過夜（申21:22-23），日落就取下來。'
  development: '兩個石堆隔了一章遙遙相對。GT《約書亞記綜合解讀》把它們並排讀：亞干被埋在石堆下，「直存到今日」（書7:26）；現在艾城王也被埋在石堆下，「直存到今日」（書8:29），神用得勝給艾城的功課畫上了圓滿的句號。同一種紀念方式，一次用在營內犯罪的以色列人身上，一次用在營外抵擋神的迦南王身上。


