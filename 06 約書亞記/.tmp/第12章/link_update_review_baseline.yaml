- title: 戰勝亞拉得王
  path: link_folder/歷史/戰勝亞拉得王.md
  definition: '民數記21:1-3。住南地的迦南人亞拉得王聽說以色列人從亞他林路來，「就和以色列人爭戰，擄了他們幾個人」。以色列人向耶和華發願：「你若將這民交付我手，我就把他們的城邑盡行毀滅。」神應允了，那地方就名叫何珥瑪。


    **這一仗發生在舊傷口上。** CT 的〔話中之光〕點出地名的份量：「何珥瑪是以色列人從前失敗的地方(參民十四45)，如今就在那地反敗為勝，而且是大大的得勝。米利巴記錄了百姓的虧欠，何珥瑪記錄了百姓的信心恢復。」GT《民數記串珠聖經註釋》說得更直接：這是「一雪三十八年前的恥辱（14:45）」。


    **神為什麼容許他們先吃虧。** CT 的推測是教育性的：迦南人可能出其不意擄走了幾個掉隊的以色列人，「神容讓迦南人稍微得逞，以教訓以色列人不敢輕敵」。GT
    丁良才《民數記註釋》給了兩個並列的可能：亞拉得王或者忽然攻擊以色列人使他們防備不及，「或者要教訓以色列人，使他們全然靠主（詩四十四1-8）」。


    **這個願是好的還是不夠好，來源不一致。** KC 讀為信心不足但神仍不責備：百姓是在交換條件，而耶和華沒有為這種形式的不信責備他們，反倒幫助他們、給了大勝。GT《聖經精讀本──民數記註解》的判斷嚴厲得多：他們的要求並不是出於對耶和華的信仰，「只是因單純的民族優越感」。CT
    的讀法最正面：禱告表徵信靠神。'
