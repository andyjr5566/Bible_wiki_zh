- title: 鹽海
  path: link_folder/地點/鹽海.md
  definition: 鹽海就是今天的死海，又名亞拉巴海（申三17，四49；書三16）、東海（結四十七18）。CT 的背景註解說明它的成因與水質：原為一深陷之谷，聚約但河水成湖，水平面低於地中海的海平面約一千三百多英呎；此湖並無出口，累年聚積礦物質，水中含百分之二十五的氯化鹽及溴化鹽，是世上濃度最高的湖水，生物無法在此水中生存。GT
    丁良才因此說「植物動物不能在鹽海的水裡生活，所以又名死海」，並指出它「是地球上最低窪的地方」——四面的河水都流進來，卻只有進路沒有出路，全被太陽蒸發。海邊一帶盛產石漆（瀝青），谷中石漆坑甚多。聖經中[[西訂谷]]即為鹽海所在之地。
