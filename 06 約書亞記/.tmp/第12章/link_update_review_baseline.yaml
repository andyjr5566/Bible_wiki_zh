  - 3
- title: 為業（ye.ru.shah）
  path: link_folder/原文/為業（ye.ru.shah）.md
  definition: '申命記第二章講的是誰的地歸誰，用的名詞是 ye.ru.shah。同一個字在本章出現四次，其中三次講的不是以色列的地。


    | 節次 | 得地的一方 | 原文 | Extended Strong |

    |---|---|---|---|

    | 5 | 以掃 | ye.ru.Shah | H3425 |

    | 9 | 羅得的子孫（摩押） | ye.ru.Shah（本節出現兩次） | H3425 |

    | 19 | 羅得的子孫（亞捫） | ye.ru.Shah | H3425 |


    STEP 原文資料給的簡要詞典義是 ye.rush.shah: possession。


    **名詞與動詞是同一個字根。** 第24節神叫以色列人去得西宏的地時，用的是動詞形態：Rash（H3423H），簡要詞典義 ya.rash: to possess:
    take。也就是說，神給以東、摩押、亞捫的「業」，和祂叫以色列去「得」的地，在原文是同一個字根的兩種形態。


    **三次否定句的固定句型。** 第5、9、19節都用同一個結構：「我不賜給你們為業，因我已將⋯賜給⋯為業」。KC 據此指出神也把地分給了列國：「God also
    has His involvement with these other peoples. He also gave the nations land (verses
    9,19).」（神與這些別的民族也有關係，祂也把地賜給了列國）


    **CT 從這裡讀出界線的意思。** CT 在第5節的〔話中之光〕說：「神要以色列人知道，西珥是神給以掃子孫為業的，亞珥是神賜羅得子孫摩押人為業的，亞捫人也有他們的地業。神的兒女要知道自己的地界，不能羨慕別人，也不該妒忌別人為甚麼先得了地上的成就。」'
  development: '申命記用這個名詞的方式，在第二、三兩章正好相反。


    第二章的四次全部指別人的地：以掃的西珥（v5）、摩押（v9 兩次）、亞捫（v19），而且三次都嵌在同一個否定句型裡——我不賜給你們為業。那一章要講的是以色列不能動的東西。


    第三章把同一個名詞轉回以色列自己身上。第20節說兩支派半打完仗「才可以回到我所賜給你們為業之地」，原文是 li./ru.sha.T/o（H3425，帶第三人稱陽性單數字尾），指的是他們自己已經到手的地。同一章第18節則用同字根的動詞
    le./rish.Ta/h（H3423H，ya.rash），說神「已將這地賜給你們為業」：名詞講的是屬誰，動詞講的是還要去得。


    兩章合起來，這個字根劃出同一條界線的兩邊——神給列國的不可動，神給以色列的要去取。


    ### 約書亞記：同一個字根的兩個方向


    書1 把這個字根用在以色列身上。書1:11「進去得耶和華─你們神賜你們為業之地」與書1:15「承受為業」，STEP 顯示是 la./Re.shet、le./rish.Ta/h、ve./ya.re.Shu、vi./rish.Tem，全部是
    H3423H 的 Qal 形態——動作者是以色列，動作是取得。


    書3:10 換了語態，也換了主詞。約書亞說神「必在你們面前趕出迦南人」，STEP 為 ve./ho.Resh yo.Rish，同樣是 H3423H，但形態是
    Hiphil 的不定詞獨立式加未完成式，動作者是神，受詞是那地原本的住民。


    ==中文用了兩個完全不同的詞——「得為業」與「趕出」——原文卻是同一個字根的兩面。==一邊有人進來，另一邊就有人出去；經文用同一個動詞把這兩件事寫成一件事。申2
    的名詞用法（神給列國的產業不可動）在這裡因此有了更尖銳的位置：同一個字根既能保護以東、摩押的地界，也能執行對迦南七族的處置。'
