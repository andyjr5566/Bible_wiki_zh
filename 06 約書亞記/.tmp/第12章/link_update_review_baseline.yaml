- title: 基色
  path: link_folder/地點/基色.md
  definition: '基色不在五王聯軍裡，也不在約書亞的進軍路線上。它出現在書10:33，是因為基色王荷蘭主動上來幫助拉吉，結果連人帶軍被殺。經文只說王和他的民被擊殺，沒有說城被攻取。


    ### 位置


    CT 的原文字義給「基色」部分、「荷蘭」崇高的，並說基色位於耶路撒冷西北約二十九公里，而經文用『上來』表示基色的地勢比拉吉低。GT《約書亞記研經資料》說字義是「部分」，遺址為
    Tell el Jezer（耶塞廢邱），位於西方往耶路撒冷的要道、距離約30公里。GT《綜合解讀》說基色扼守亞雅崙谷西面的入口。


    ### 考古與文獻


    GT《華爾頓約書亞記背景注釋》說基色的遺址是哲色遺址（Tell Jezer），占地三十三英畝、位於亞雅崙谷西端，距離本段的軍隊集結地二十五至三十哩；並說其軍隊雖失敗、城卻未被攻取，法老梅雷他攻取諸城的名單中包括了基色，它也是亞馬拿書函中最重要的迦南城市之一、文獻中有十封信件是君王雅帕胡寫給法老的。


    ### 城還在


    GT《綜合解讀》說基色王前來幫助拉吉所以約書亞消滅了他們，但並沒有立刻前去攻佔他的城市。GT《啟導本》說基色是南部諸城中最強大的城邑，並提到後來這座城被埃及人攻取、當作所羅門王的婚禮之禮。BH
    說書10 並沒有說基色本身被攻取，基色有一段時間仍是迦南人的地。'
