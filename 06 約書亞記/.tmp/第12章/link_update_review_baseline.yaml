- title: 巴珊
  path: link_folder/地點/巴珊.md
  definition: '民數記21:33：「以色列人轉回，向巴珊去。巴珊王噩和他的眾民都出來，在以得來與他們交戰。」這是以色列人在約但河東最北的一場仗。


    **它在哪裡。** CT 指出巴珊「位於雅博河以北，黑門山以南的高原(即今戈蘭高原)，境內牧草繁茂，盛產牛羊」。GT《啟導本聖經註釋》的說法相同：「巴珊在加利利海東北，為黑門山南面的一大片土地
    （申三8）。」GT《民數記串珠聖經註釋》補上它在版圖上的意義：「加利利海東北一帶地方，北部黑門山是神應許之地的北界（書11:17）。」GT《舊約聖經背景註釋》把四至講得最完整：北界為黑門山、東界為得如瑟山、西臨加利利海，「巴珊是個廣大、富庶的高原，以牧草著稱（詩二十二12；摩四1～3）」。


    **打下它意味著什麼。** GT《民數記串珠聖經註釋》把本章的三場仗連起來看：以色列人的腳蹤由南部邊境跨越約但河東高原，由南至北到達北部的邊界，繞行迦南地一周，「無論是南部何珥瑪戰役、東部亞摩利人之役及北部巴珊之役均節節獲勝，神大能的引導逐步實現祂的應許」。


    **以得來這座城很不尋常。** GT 丁良才《民數記註釋》記下一個少見的細節：這城是巴珊王的一座大城，「在這城底下，另有一座很稀奇的城，是在石頭中鑿成的，無非是一所避難的保障」。GT《舊約聖經背景註釋》指出以得來就是今日敘利亞的戴爾阿，雖然從未有考古學者進行挖掘，卻曾在埃及和烏加列的古籍當中提及。'
