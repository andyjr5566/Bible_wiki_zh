- title: 拉吉
  path: link_folder/地點/拉吉.md
  definition: '拉吉是南方五王之一雅非亞所治的城，也是書10 南征清單裡唯一一座「第二天」才攻下的城。


    ### 位置與名字


    CT 的原文字義給「拉吉」難以攻克的，並說拉吉位於希伯崙西方二十三公里、立拿的南方。GT《串珠聖經注釋》說拉吉為一要塞，位於希伯崙以西廿三公里（十五英里）。GT《約書亞記研經資料》說字義是「難以攻克的」，是目前的
    Tell ed~Duweir，位於希伯崙西邊20多公里。


    ### 為什麼要打兩天


    GT《綜合解讀》說拉吉是迦南地南方的主要堡壘、最為堅固，所以「第二天」才攻取，其他各城大都是「當日」攻取的。CT 的看法不同，說拉吉的軍隊早已傷亡殆盡，故輕易地被以色列人攻佔。BH
    說拉吉能這麼快落城本身就很醒目，因為它的戰略地位與防禦都很強。


    ### 後世的拉吉


    BH 說拉吉是把守山地與沿海平原之間路線的重要軍事中心，它的重要性延續到後來亞述與巴比倫入侵的時期。這一點在書10 只是伏筆，卻說明了為什麼這座城值得聯軍與以色列都全力爭奪。'
