    | GT《啟導本》 | 「撒迦位置不詳，或在巴珊最北端（參書十三11）。以得來在巴珊的南部。」 |

    | BH | 「Salecah, located on the eastern edge of Bashan, served as a frontier city,
    marking the extent of Israel''s territory in that direction.」（撒迦位於巴珊東緣，是一座邊界城，標出以色列在那個方向的疆域盡頭。）
    |


    共同的一點是：它標的是巴珊的外緣，與以得來一起把噩的國圈起來。'
