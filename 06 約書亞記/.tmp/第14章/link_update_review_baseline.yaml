- title: 利未人的四十八座城
  path: link_folder/主題/利未人的四十八座城.md
  definition: '民數記35:6-8 定下利未人的居住安排：六座逃城，加上另外四十二座，一共四十八座城，連城帶郊野一起給。


    **分配的原則是按比例，不是按人頭平均。** 民35:8 說「人多的就多給，人少的就少給；各支派要按所承受為業之地把城邑給利未人」。STEP 原文資料顯示這一句用了兩組相對的動詞：ha./Rav
    tar.Bu（H7227A 加 H7235A，即多的加多）與 ha/m.''At tam.''I.tu（H4592 加 H4591，即少的減少），末了以 ''Ish
    ke./Fi na.cha.la.T/o（H376I、H6310K、H5159）收尾，字面是：各人照著他產業的口。


    **後來真的照這個原則分了。** CT 註明「後來果真照著這個原則分配給利未人三家族（參書二十一4～7）」。GT 丁良才《民數記註釋》給出實際數字：「猶大和西緬支派將九座城分給了利未人，拿弗他利給了三座城，其餘的支派，各給了四座城，共四十八座城（書二十一章）。」


    **四十八這個數字，兩家給了兩種讀法。**


    | 來源 | 讀法 |

    |---|---|

    | GT《民數記串珠聖經註釋》 | 「四乘十二等於四十八，四代表神的國，正如十二支派在帳幕四方安營」 |

    | KingComments | 四十八是六乘八：六是人的數字（人在第六日被造），八代表新的開始——利未曾因罪受審判，神卻把那審判轉成新的東西 |


    **這些城加起來其實很小。** GT《啟導本聖經註釋》算過：這四十八座城分散在河西和河東十二支派的境內，「這些城邑都很小，連四圍的效野在內，分給利未人的地加起來，只有四十平方公里，占迦南總面積不過千分之一。在靠農業為主的社會裡，這樣小的土地絕難維生；所以利未人仍可說是在以色列人中間沒有產業的支派」。GT
    丁良才也提醒，十分之一的供給並不穩定：「這十分之一是不一定的，因為他倆能得這供給輿否，全在乎百姓的虔誠」，歷史上利未人確實屢次因得不著而感受困難。


    **城不是利未人獨佔的。** GT《啟導本聖經註釋》指出「利未人的城邑可以容其他百姓居住」；GT《聖經精讀本》說得更直接：「嚴格地說賜給利未人的城邑並不是只有利未人才能居住,而是利未人與其他支派一起居住的地方。」


    KingComments 從奉獻的一面看這件事：每個交出一座城的支派，都是藉此向神表明對這項特權的感謝；教會能到處都有忠心的教師講解神的話，同樣是一項特權，而是否珍惜這項特權，就看肯不肯供給他們所需，使他們能把時間用在研讀與傳講上。'
