- title: 專心跟從主與另一個心志
  path: link_folder/神學/專心跟從主與另一個心志.md
  definition: '第24節：「惟獨我的僕人迦勒，因他另有一個心志，專一跟從我，我就把他領進他所去過的那地。」


    **兩個關鍵詞在原文都很具體。** CT 的〔原文字義〕：「『另有一個心志』原文是『另有一個靈』……『專一跟從我』字面的意思是『完全跟在我後面』。」STEP
    原文資料完全對得上：「另有一個心志」是 Ru.ach ''a.Che.ret（H7307G 詞典義 spirit ＋ H312 詞典義 another）；「專一跟從」是
    va/y.ma.Le'' ''a.cha.Ra/i（H4390，詞典形 ma.le，詞典義 to fill ＋ H310A，詞典義 after），字面是「他在我後面填滿了」。GT《聖經精讀本》同樣說：「字面上可以解釋為『完全跟在我後面』。」


    **「另一個靈」指的是什麼？** KC 說得最具體：「迦勒不讓自己的心思被他所看見的影響，而是被耶和華所說的話影響。」BH：「當多數人懼怕、懷疑神的應許時，迦勒的靈以信心、勇氣與對神的信任為特徵。」CT
    在〔話中之光〕拆成三點：「不看艱難、不看自己、專心跟從主。」


    **這句話後來一路跟著迦勒。** KC 列出它在聖經中的再現：民32:12、申1:35-36、書14:8-9、14。GT《啟導本聖經註釋》指出應驗的地方：「看《約書亞記》十四6～15，知道迦勒的後裔的確得著他們的先祖作探子時所看見的希伯侖地，也就是亞衲族人居住的地方。」


    **神為什麼特別提迦勒而不提約書亞？** GT 丁良才的解釋是兩人都在內：「『唯獨我的僕人迦勒』——約書亞（30、38），摩西，亞倫，和一切的利未人也在內。」CT
    的說法相同：「『他』應當包括迦勒和約書亞（參30節）。」'
