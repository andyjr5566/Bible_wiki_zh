- title: 國中太平（sha.qat）
  path: link_folder/原文/國中太平（sha.qat）.md
  definition: '書11:23 是約書亞記前半部的最後一句：「於是國中太平，沒有爭戰了。」


    ### 原文


    STEP 顯示這裡的動詞是 sha.ke.Tah（H8252，簡要詞典義 sha.qat: to quiet，本節逐字解 it was at peace），主詞是「地」。要注意這與書1:13、申3:20
    那個「得享平安」不是同一個字——那裡是 nu.ach（H5117）。中文一個「平安」一個「太平」，原文也確實分成兩個字。


    CT 的原文字義給「國中」遍地、「太平」平靜。GT《約書亞記綜合解讀》說「太平」原文的意思是「平靜、安靜，不受干擾」，這個詞在士師記中也不斷出現（士三11、30；五31；八28），又譯為「安息」（亞一11）。GT《約書亞記研經資料》說「太平」是「平靜」、「不受干擾的」，並指出這裡的太平
    SH 8252 只是暫時的——書14:15 又出現一遍，士師記中每段暫時的太平也使用此字。


    ### 這個太平有多完整


    GT《聖經精讀本》說以色列並沒有完全佔領所有迦南城邑與村落（十三2~6），他們只是征服了迦南地的主要城邑、獲得了支配迦南的實權。GT《串珠聖經注釋》說主要的敵對勢力雖然被攻破了，但以色列人還要繼續將迦南人克服，本節乃簡單的總結而已。GT《研經資料》說這應該不是指不再有戰爭，而是不再有重要的大戰役。BH
    說這段總結並不否認仍有迦南人的抵抗殘存、也不否認還需要進一步的佔領，它宣告的是約書亞完成了交付給他的征服、為以色列的產業取得了這地。


    ### 它在全卷出現三次


    KC 指出 This mention of rest in the land appears three times in the book：一次在此與約書亞相連，一次在書14
    與迦勒相連（書14:15），一次在書21 與利未人在以色列中的產業相連（書21:44）。他並提出一個警告：Rest is good, but it should
    not lead to carelessness（安息是好的，但不該導致鬆懈），又說 The biggest defeat is often suffered
    after the biggest victory（最大的失敗往往發生在最大的得勝之後）。


    ### 往後怎麼走


    GT《綜合解讀》說約書亞讓百姓所享用的安息只是暫時的（來四8），這個暫時的安息到士師的時代將不斷因著百姓的不順服被破壞，因此「必另有一安息日的安息為神的子民存留」（來四9）。BH
    說以色列在地上的安息指向神藉信心與順服所賜、最終在基督裡成全的更深安息。'
