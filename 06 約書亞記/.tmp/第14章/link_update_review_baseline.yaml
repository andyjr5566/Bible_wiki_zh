- title: 十二探子窺探迦南地
  path: link_folder/事件/十二探子窺探迦南地.md
  definition: '民13 全章：摩西從十二支派各選一人，去窺探迦南地，四十天後回來報告。


    **這十二人不是民1、民2、民7 的那批首領。** GT《民數記串珠聖經註釋》：「擔任探子的十二個首領，名字有別於1章; 2章; 7章所記的首領。可能上文作統計及行奉獻禮的，是一些年長德高望重的領袖；本文選派作探子的，則是一些年輕有為的青年領袖。」GT《啟導本聖經註釋》也說「可能打探迦南的事需要年輕力壯的人。以前幾章所記的都屬較年長的領袖」。CT
    的說法略有不同：他們是「各支派統領的輔佐官」。名單中沒有利未人——GT 丁良才：「利未支派也不在其中，因為他們將來不分地。」


    **排名次序沒有規律。** GT《民數記串珠聖經註釋》直說「此處十二支派的排名次序並無任何原則」；GT 丁良才注意到其中一處差異：「便雅憫、西布倫支派在此處所占的位置，和第一章的次序不同。」


    **十二個人裡，只有兩個名字後來還被提起。** GT 丁良才：「除了迦南（6），並何西阿以外（8、16），聖書上在別處沒有提到這些探子的名字。」


    **分別出現在第四十天。** KC：「When the twelve spies leave, there is no difference between
    them yet to be seen. The difference becomes only clear when they return “at the
    end of forty days”.」（十二個探子出發時，彼此還看不出有什麼分別；分別要到他們過了四十天回來時才顯出來。）他接著說信心受試驗就顯出信心的實況，並說：「They
    have all seen the same, but only two have looked with the eyes of God.」（他們都看見了同樣的東西，卻只有兩個人用神的眼睛看。）'
  development: '### 兩次窺探，差別不在人數


    民13 全章記的是第一次：摩西從十二支派各選一人，走遍迦南地東西南北，四十天後回來。民14 記結果——十人報惡信，全會眾哭號，神判這一代倒斃曠野。民32:8-13
    摩西自己複述這件事，用它來責備兩支派半；申1:22-28 再複述一次，並指出探子的話使百姓的心消化。


    書2 是第二次，四套來源都拿它與第一次對照。GT《啟導本》列出差別：三十八年前是十二人、每支派一人，走遍迦南地東西南北；這次只有兩人，只窺探即將攻打的耶利哥城。GT《綜合解讀》補上另一個差別：上次是大張旗鼓的公開行為，這次是「暗暗打發」。GT《雷氏研讀本》給了保密的理由：約書亞既從加低斯巴尼亞的事件吸取了重要的教訓，便向以色列人隱瞞派探子查探的實情，這樣即使得到不利的回報，也不會讓百姓氣餒。


    真正的差別出現在回報那一刻。GT《聖經精讀本》說本章兩個探子把迦南居民的失意與恐懼報告給約書亞，鼓舞了以色列的士氣，這與十個探子報惡信使百姓消沉的情形形成鮮明對比。CT
    說得更具體：這兩個探子的眼光與三十八年前的十個探子完全不同，他們看到的不只是耶利哥高大的城牆和追趕他們的敵人。


    ==兩次都是去看同一片地，帶回來的卻是兩種相反的結論。==KC 由此說，窺探要用對的方法，就是看神在人身上做了什麼。'
