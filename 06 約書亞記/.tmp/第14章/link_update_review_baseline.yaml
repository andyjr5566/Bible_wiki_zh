- title: 出入（領袖用語）
  path: link_folder/原文/出入（領袖用語）.md
  definition: '「出入」在民數記27:17、21 是一組領袖用語，涵蓋在百姓前面行動、辦理公共事務和帶領群體安全往返。BibleHub 把它稱為希伯來文的成對慣用語，可包括日常治理與軍事行動；GT
    丁良才也解作「行事為人，或辦理公事」。


    STEP 把「出」與「入」精確拆成兩個動詞，並顯示民27:17 由領袖自己的行動轉到他使全體行動：


    | 節次 | 「出」 | 「入」 | 句中角色 |

    |---|---|---|---|

    | 27:17 前半 | H3318G ye.Tze''，HVqi3ms，「他出去」 | H935G ya.Vo''，HVqi3ms，「他進來」 | 領袖在百姓前面出入
    |

    | 27:17 後半 | H3318H yo.tzi.''E/m，HVhi3ms/Sp3mp，「他領他們出去」 | H935P ye.vi.''E/m，HVhi3ms/Sp3mp，「他帶他們進來」
    | 使役形：領袖實際引導眾人 |

    | 27:21 | H3318G ye.tze.''u，HVqi3mp | H935G ya.Vo''u，HVqi3mp | 約書亞與全會眾依求問所得的命令出入
    |


    CT 據民27:17 歸納兩個要求：「出入」關乎領袖自己的生活與榜樣，「引導」關乎帶領方向。民27:21 又為這份行動加上界線：約書亞和會眾要依以利亞撒藉烏陵求得的命令出入。領袖要親自在前，也要受神的指引；能帶動群體不等於可以自行決定方向。'
  development: '這組詞在民數記與申命記各有一種用法，中間的差別是「誰在出入」。


    民數記二十七17 講的是一個人：摩西求神立一位領袖，可以在百姓面前出入、引導他們，免得耶和華的會眾如同沒有牧人的羊群。那裡的出入是帶隊的動作，講的是約書亞這個位置。


    申命記二十八6 與二十八19 講的是所有人：「你出也蒙福，入也蒙福」，以及十三節之後同一句話換成「你出也受咒詛，入也受咒詛」。CT 說出、入意指一切日常生活行動；GT
    說它代表一切日常事務，並列出申命記三十一2、約書亞記十四11 與列王紀上三7 三處平行用法——那三處講的又都是領袖的一生或一段任期。


    ==同一個成對的動詞，在民數記量的是一個人的職分，在申命記量的是每一個人的一天。==而申命記二十八把它擺在六句祝福與六句咒詛的最後一句，等於用它替整段作結：不論人往外走還是往回走，都在同一個判定之下。'
