- title: 脫鞋與聖地
  path: link_folder/文化/脫鞋與聖地.md
  definition: 神命靠近荊棘的摩西脫下腳上的鞋，因他所站之地是聖地。古代脫鞋可表達尊敬、謙卑及不把外界塵污帶入神聖空間；經文的關鍵不是鞋本身具有污穢力量，而是摩西須承認神的臨在與聖潔界線。
  development: 約書亞記5:15有相似命令，顯示聖地與神臨在相連。不同文化至今仍以脫鞋表達潔淨或尊敬，但本章不建立一項普世崇拜儀式，而是記述特定神顯現中的命令。
