- title: 嗎哪
  path: link_folder/主題/嗎哪.md
  definition: 嗎哪（希伯來文意源自「這是什麼呢？」）是神在曠野四十年間從天降下供應以色列人的超自然糧食。樣子像芫荽子、顏色是白的、滋味如同攙蜜的薄餅（出16:31）。每天早晨隨露水降下，以色列人各按飯量收取一俄梅珥；第六日降雙倍，第七日（安息日）則沒有。嗎哪預表耶穌基督為生命的糧（約6:31-35）。
  development: '嗎哪在舊約中被詩篇回顧為「天上的糧食」（詩78:24-25），在新約中被耶穌引用為自己的預表——「我是從天上降下來生命的糧」（約6:51）。啟示錄2:17應許得勝者得「隱藏的嗎哪」。來9:4記載盛嗎哪的金罐放在法櫃中。嗎哪從曠野食物發展為基督論的核心預表。


    申命記二十九6 提到嗎哪的方式很特別：它用的是否定句，而且沒有出現嗎哪這兩個字——「你們沒有吃餅，也沒有喝清酒濃酒。這要使你們知道，耶和華是你們的神。」


    出埃及記十六章記的是它怎麼降下、怎麼收取、怎麼安息日加倍；民數記十一章記的是百姓吃膩了它。這一節換了角度：不說他們吃了什麼，說他們沒有吃什麼。CT 說這意指沒有農耕生產、全賴神的供應，仍飲食無缺；GT《申命記串珠聖經註釋》補上那兩樣沒說出口的東西——因神為他們預備了嗎哪和活水。


    GT《聖經精讀本──申命記註解》給的理由把這件事往前推了一層：神之所以禁止以色列在四十年曠野生活當中從事耕種，是為了使他們吃天所賜的嗎哪與磐石所出的活水，使以色列百姓認識到神的權能，同時也認識到人活著並不是只靠糧食，乃是靠神口裡所說的一切話。KC
    說每日的嗎哪與磐石流出的水，是神的愛與憐憫的憑據。


    ==一段從沒有田、沒有麥子、沒有葡萄園的日子裡長出來的認識：耶和華是你們的神。==而這一節的目的句正是這樣寫的——「這要使你們知道」。'
