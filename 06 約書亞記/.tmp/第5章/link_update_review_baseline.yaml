- title: 曠野飄流四十年
  path: link_folder/歷史/曠野飄流四十年.md
  definition: '第33-34節的判決：「你們的兒女必在曠野飄流四十年，擔當你們淫行的罪⋯按你們窺探那地的四十日，一年頂一日，你們要擔當罪孽四十年」。


    **四十年怎麼算？** CT：「四十年是指從出埃及開始算起，直到進入迦南地」，並說「一年頂一日」的算法「把以前已經在曠野裡所渡的年日也算進去了」。GT《啟導本聖經註釋》給出精確數字：「「四十年」是約數，實際上是三十八年零十個月」。GT
    丁良才也說「後來神卻發了憐憫的心，將以色列人已經在曠野的工夫都算在這四十年之內了」。


    **「一年頂一日」的意義。** GT《民數記串珠聖經註釋》：「強調神對罪惡的嚴厲，正如成語所謂：『一失足成千古恨』。」GT《聖經精讀本》從兩個目的來讀：「①讓百姓們明白自己的罪,也讓他們經歷罪所帶來的悲慘的結果;
    ②為了讓新一代(二十歲以下)的人年齡達到能對神的事負責的成熟年齡」。


    **懲罰的形式正是他們自己說過的話。** 第2節他們說「巴不得我們早死在埃及地，或是死在這曠野」，第28-29節神說「我必要照你們達到我耳中的話待你們。你們的屍首必倒在這曠野」。GT《民數記串珠聖經註釋》指出這句話在本段重複四次（v29、32-33、35）。CT
    在〔話中之光〕：「神用百姓最懼怕的方式懲罰他們，他們害怕死在曠野，神就懲罰他們在曠野飄流直至死去。」


    **KC 用一個詞形容這四十年的性質改變了。** ==他說這群人本是客旅，是往應許之地去的行路人，如今卻成了流浪者，在曠野裡漫無目標地遊蕩。== 他並指出這四十年不是空白：神要用那四十年教導他們，他們是誰、祂又是誰。


    **STEP 原文資料**顯示第34節「擔當」是 tis.''U（H5375J，詞典形 na.sa，詞典義 to lift: guilt）——與第18節神「赦免」罪孽的
    no.Se''（H5375I）是同一個動詞。==神舉起他們的罪孽（赦免），他們也要舉起自己的罪孽（擔當）。== 同節「疏遠」是 te.nu.''a.T/i（H8569，詞典義
    opposition），正對得上 CT 所註的「反對」。'
  development: '七章讀下來，這四十年被三種不同的方式記過。


    **民數記記的是判決與行程。** 民14:33-34 是判詞下達的那一章，一年頂一日；民20 是刑期屆滿時的樣子；民21:12 的撒烈谷是應驗的地點；民32:13
    回頭把它定性為神的怒氣；民33 則把整段路排成一張完整的站名清單。這幾章加起來回答的是「發生了什麼」。


    **申命記前兩章記的是長度與結果。** 申1:2 用十一天的路程當對照尺度，申2:14 第一次把三十八年這個數字寫死，並指出它結束的方式與地點。


    **申命記第8章第一次正面說出為什麼。** 前面幾章都在算年數、記地點、追究責任，申8:2 卻直接給出目的：是要苦煉你，試驗你，要知道你心內如何；第5節再加上一個關係上的定位，說耶和華管教你就像人管教兒子一樣；第16節把整串話收在「叫你終久享福」。同一段年日，在民14
    是刑期，在申2 是代價，到申8 成了一個父親對兒子的教育。第4節那兩個細節——衣服沒有穿破、腳也沒有腫——則說明這段刑期裡神並沒有停止供應。


    這三種讀法並不互相取消。申8 沒有否認那是懲罰的年月，它談的是懲罰的年月裡神在做什麼。


    申命記二十九5至6 給這四十年加上第四種記法：不記路線，不記管教，也不記爭戰，只記兩件小事——衣服沒有穿破，鞋沒有穿壞；沒有吃餅，也沒有喝清酒濃酒。


    CT 說這是形容不缺衣受寒，也不赤腳受磨，表示神的看顧無微不至。GT 把它擺成一個可以自己驗算的對照：曠野的環境非常惡劣，衣服、鞋子幾年就會損壞，但百姓卻衣服沒有破、鞋沒有壞。GT《聖經精讀本──申命記註解》說以色列的四十年曠野史是神慈愛與恩典的歷史；同一份註釋另解釋了為什麼四十年裡不許耕種——是為了使他們吃天所賜的嗎哪與磐石所出的活水，認識到神的權能。


    值得注意的是這段回顧擺在哪裡。它夾在第4節那句「耶和華到今日沒有使你們心能明白」與第9節那句「所以你們要謹守遵行這約的話」之間。CT 在第4節下面把兩者接起來：在曠野的四十年中，百姓可能已經把這些當作日常生活中司空見慣的小事了，但摩西卻提醒他們，這是神超自然的保守和供應。


    ==前面幾章數的是這四十年發生了什麼，這一章數的是這四十年沒有發生什麼——沒有破、沒有壞、沒有缺。=='
