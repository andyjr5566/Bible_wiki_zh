- title: 心消化（ma.sas）
  path: link_folder/原文/心消化（ma.sas）.md
  definition: '申命記1:28 百姓引述探子的話：「我們的弟兄使我們的心消化」。「消化」這個中文詞今天已經不太用在這個意思上。


    **原文是融化。** STEP 原文資料顯示是 he.Ma.su ''et- le.va.Ve./nu（H4549 ＋ H3824）：


    | 和合本 | 原文 | Extended Strong | 形態 | STEP 本節譯義 | 簡要詞典義 |

    |---|---|---|---|---|---|

    | 使⋯消化 | he.Ma.su | H4549 | Hiphil 完成 3cp | they have made melt | ma.sas: to melt
    |

    | 心 | le.va.Ve./nu | H3824 | 陽性單數＋1cp | heart/ our | le.vav: heart |


    Hiphil 是使役語態——不是心自己化了，是有人使它化了。經文接著就指出是誰：「我們的弟兄」，也就是那十個探子。


    **三家的說明一致。** CT 原文字義給「消化」＝溶化，溶解，並說「『心消化』意指失去勇氣和膽量」。GT《聖經精讀本》給了更完整的字面：「使我們的心消化：原文的字面意義是『使心消融並淌流』」，並說其結果是百姓徹夜哭號、妄言不如早死、輕舉妄動要回埃及（民14:1-4）。BH：「hearts
    melt」是形容恐懼與失去勇氣的生動說法，舊約常用來描述壓倒性的驚懼（書2:11）。


    **同一節的誇大。** 「城邑又廣大又堅固，高得頂天」——STEP 顯示原文是 ''a.Rim ge.do.Lot u./ve.tzu.Rot ba./sha.Ma.yim（H5892B
    城＋H1419A 大＋H1219 ba.tsar 設防＋H8064 天），字面是「城又大又設防到天上」。CT 說這是「言過其實」；GT《啟導本》舉出考古：「所居地的城牆，據考古學家發現，只有10至15公尺高。探子說『高得頂天』的確過甚其詞」；BH
    也說這是誇飾。GT《聖經精讀本》把它歸納成一句：「不信的特徵之一就是為私欲所牽引，誇大消極面。」'
  development: '「心消化」在申命記出現兩次，語態不同，方向也相反。


    申1:28 是百姓引述探子的話：「我們的弟兄使我們的心消化」。STEP 顯示那裡是 he.Ma.su（H4549，Hiphil 完成 3cp，本節譯義 they
    have made melt）——使役語態，是有人使它化了，而說話的人正是用這個語態把責任推給探子。


    申20:8 是律法的預防措施：「恐怕他弟兄的心消化，和他一樣」。STEP 顯示這裡是 yi.Mas（H4549，Niphal 未完成，本節譯義 it will
    be melted），沒有指名施事者；經文擔心的是這件事會從一個人蔓延到弟兄身上，所以官長要在上陣前把懼怕膽怯的人放回家。


    兩處合起來，這個字在申命記裡走了一趟從事後到事前的路。加低斯巴尼亞已經付過代價，而第二十章的免役條例就是為了不讓同一件事重演。CT 在申20:8 的說明只有一句：「膽小者恐會影響士氣」；BH
    在同一節說心融化的比喻正好表達恐懼的傳染性，以及它瓦解群體力量的可能。


    ### 書2：換人消化了


    書2 三次講到心消化，主詞全部換成迦南居民。書2:9 喇合說「這地的一切居民在你們面前心都消化了」，書2:11 說「我們一聽見這些事，心就消化了」，書2:24
    探子把同一句話帶回去。


    ==中文三次一樣，原文只有一次是這個字。==STEP 顯示書2:11 是 va/i.yi.Mas（H4549，Niphal），與申命記兩處同一個字根；書2:9
    與書2:24 用的卻是另一個動詞 na.Mo.gu（H4127，簡要詞典義 mug: to melt，同樣是 Niphal）。


    申命記兩處記的是以色列自己心消化、以及律法怎樣防止它蔓延；書2 記的是同一件事發生在對面。CT 說書2:24 是第三次提到相同的話；GT《聖經精讀本》說這是希伯來人特有的表達方式，表明陷入絕望的狀態。'
  signals: []
  accumulation_count:
  - 3
  - 4
- title: 火石刀
  path: link_folder/文化/火石刀.md
  definition: 火石刀是古代近東行割禮的傳統用具。出埃及記4:25記西坡拉在路上「拿一塊火石，割下他兒子的陽皮」；約書亞記5:2以色列人第二次受割禮時，用的也是這種火石刀。GT《舊約背景註釋》說明它為何一直被沿用：「即使在金屬製造的工具和武器都普遍應用之後，以色列和埃及仍然使用火石碎片施行割禮。這些碎片十分鋒利，並且隨處可得，是這種古老儀式的傳統用具。」BH
    也說「火石在古代近東常被用來行割禮，因為它鋒利又容易取得」。
  development: '### 為什麼是石頭，不是刀


    各家給的理由不只一個。GT 丁良才《出埃及記註釋》從古代的器物條件解釋：「古時的人用火石當作刀子，以色列人用火石刀行割禮（書5:2），大概是因他們以為火石刀比別的刀更潔淨。」GT《啟導本聖經腳註》再加一層可能：火石刀「可能比當時用金屬制的刀更利，更可能是此時（主前十五世紀）尚無鐵器」。GT《聖經精讀本》則把兩種可能並列：拿火石「可能是由於情況火急，或者認為火石比鐵器或刀更潔淨」。


    GT《丁道爾聖經註釋》提出的理由最接近禮儀的邏輯：「這類石頭在沙漠很是常見。石刀可能因為是未受人手污染的天然物體，更合神的使用。基於同樣理由，耶和華的祭壇也必須用沒鑿過的粗石建成（出20:25）。」


    ### 一件細節成了年代的旁證


    GT《中文聖經註釋》從這個工具讀出敘事的年代感：西坡拉拿一塊火石，「可見這故事的古遠可靠，因為當時還沒有銅鐵的刀」；火石是一種極為堅硬的石塊，把小塊磨成刀狀作切割，是古代常用的利器。同一份注釋也指出，在那個生死關頭，火石是隨手可得的東西——西坡拉不是預備好器具才行割禮，而是在急智中就地取材。'
  signals:
  - first_in_book
  accumulation_count:
  - 1
  - 2
- title: 割禮之約
  path: link_folder/神學/割禮之約.md
  definition: 神與亞伯拉罕立約的記號（創17:9-14），要求亞伯拉罕家中所有男丁（包括僕人、外邦人）於生後第八天受割禮，作為「你們要守我的約、世世代代永遠的約」（創17:13）。割禮象徵：屬神、分別為聖、肉體情慾被剪除（申10:16；耶4:4），預表新約時代「心受割禮」（羅2:29；西2:11）。
  development: '**創17：約的記號。** 神吩咐亞伯拉罕全家男丁在生後第八天受割禮，作為世世代代永遠的約的記號；未受割禮的「必從民中剪除」（創17:14）。


    **創34：記號被當成工具。** 雅各的兒子把割禮降為外交詭計，要求示劍城男丁受割禮以便通婚同化；示劍人為貪圖財產而接受，第三日疼痛時被西緬、利未屠殺。割禮若沒有內心的信心順服，只剩外在儀式，反而成了欺騙與暴力的工具。


    **出4：連神所選的領袖也在這約之下。** 摩西往埃及的路上，因未給兒子行割禮，耶和華「遇見他，想要殺他」，西坡拉拿火石割下兒子的陽皮才止住。割禮在這裡不是儀式條規，而是生死攸關的盟約記號。


    **利12：從事件回到日常條例。** 到了利未記，割禮不再是某一次危機或某一段敘事，而是每個以色列家庭生了男孩之後第八天固定要做的事，並且和產婦的潔淨日子接在一起。GT
    丁良才指出第八天有一個很實際的理由：那天產婦的特別不潔淨剛好過去，「有人摟她，就不至於沾染不潔」。他並說明這記號的意義：嬰孩受割禮是「顯明這嬰孩在神與亞伯拉罕所立的約上有份」（創17:13，羅4:11），也表示這約的成功在乎脫去肉體的情慾（西2:10-11）；第八天若逢安息日，仍舊照行（約7:22-23）。GT《聖經精讀本》從數字讀出另一層：「八是復活的數字(創17:12)」，在這一天行割禮象徵孩子重新生出來、成為屬神的百姓（西2:11-13）。KC
    的角度又不同：給男孩行割禮，在屬靈的意義上正是承認這孩子是不潔的，而孩子是憑著基督的死被帶到神面前的。


    **新約：心裡的割禮。** 施洗約翰（路1:59）與主耶穌（路2:21）都在第八天受割禮；而保羅所講的真割禮是心靈受聖靈更新（羅2:28-29），BH 指出這預示新約之下不再要求肉身的割禮，而是信心與順服。'
  signals:
  - first_in_book
  accumulation_count:
  - 4
