- title: 迦南人
  path: link_folder/人物/迦南人.md
  definition: 迦南人一詞有寬窄兩種用法：可泛指迦南地的原住民族，也可特指其中一族。創10:15-19 的寬泛名單包括西頓人、赫人、耶布斯人、亞摩利人、革迦撒人、希未人、亞基人、西尼人、亞瓦底人、洗馬利人、哈馬人等；申7:1
    則把迦南人與赫人、革迦撒人等並列，所以該處是較窄的特指。「迦南」意為「紫紅色之地」，因盛產紫紅染料。申7:1-2 把迦南人列在進地時受審判的七族之中；相關背景包括罪孽滿盈（創15:16）及習俗可憎（利18:24-30）。
  development: '- 迦南人代表「世界體系」：偶像崇拜、道德敗壞、暴力殘害（利18:24-30）

    - 亞摩利人罪孽「還沒有滿盈」（創15:16），神寬容有時限

    - 聖約族群在應許之地生存，非靠軍事外交，單靠神主權保守（創35:5；出23:27-30）'
