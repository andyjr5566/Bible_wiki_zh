  summary: '第15節「把你腳上的鞋脫下來，因為你所站的地方是聖的。約書亞就照著行了」，STEP 為 shal- na.''al./Kha me./''Al rag.Le./kha（H5394，簡要詞典義 na.shal: to slip，加 H5275 na.al: sandal）。CT 說鞋沾滿地上的污穢塵埃，脫鞋意指對神表示尊敬與對所處聖地的體認（出3:5），並說凡是神臨在的地方都分別為聖而成為聖地；GT《啟導本》說並非其地有何特別不同，但有神的使者在那裡便成為聖地；GT《聖經精讀本》說值得注意的是並不是摩西與約書亞聽到此命令的地方是聖潔的，而是神所臨在之所皆為聖潔；GT《串珠》說約書亞這次經歷類似摩西在何烈山上的遭遇（出3:1-5）。BH 說地之所以成聖是因為耶和華在那裡。KC 說祂所站的每一處都成為聖地。'
