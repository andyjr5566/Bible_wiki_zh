- title: 心消化（ma.sas）
  path: link_folder/原文/心消化（ma.sas）.md
  summary: '第1節「他們的心因以色列人的緣故就消化了，不再有膽氣」，STEP 為 va/i.yi.Mas le.va.Va/m（H4549，簡要詞典義 ma.sas: to melt，加 H3824 le.vav: heart）；緊接的「不再有膽氣」是 ve./lo''- Ha.yah va/m ''Od Ru.ach（H7307G，簡要詞典義 ru.ach: spirit）。CT 原文字義給「消化」溶化、溶解，「膽氣」氣、風、靈，並說前者形容恐懼戰兢的心態、後者意指失去鬥志。GT《綜合解讀》說過紅海的神跡已經使迦南人的「心都消化了」（書2:9），現在過約旦河的神跡更使迦南諸王喪失了安全屏障和鬥志。'
  relation: 這個字在書2:9 由喇合說出，本章由敘事者說出來——喇合當時報告的事，如今寫成了諸王的實況。
  overview_review:
