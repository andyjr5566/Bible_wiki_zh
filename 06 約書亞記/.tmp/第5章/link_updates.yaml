    development: keep
- title: 迦南人
  path: link_folder/人物/迦南人.md
  summary: 第1節「靠海迦南人的諸王」，STEP 為 mal.Khei ha./ke.na.'a.Ni（H3669A）。CT 說迦南人以含的兒子迦南取名，居住在迦南地西部谷地和沿海一帶；GT《研經資料》說「靠海迦南人的諸王」指的應該是靠地中海邊的迦南君王；BH 說沿海的統治者控制著肥沃土地、貿易路線與通往地中海的門戶，而以色列到來的消息傳遍了迦南每一區。KC 說神的作為在外邦人身上生出的不是敬畏而是憎惡的戰慄，他們退回堅固城裡抵抗。
  relation: 迦南人在前面幾章一直是被描述的對象，本章第一次寫他們自己的反應，而反應是失去鬥志。
  overview_review:
    signals: []
