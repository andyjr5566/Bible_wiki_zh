- title: 火石刀
  path: link_folder/文化/火石刀.md
  summary: '第2、3節「你製造火石刀」「約書亞就製造了火石刀」，STEP 為 char.Vot tzu.Rim（H2719 che.rev 加 H6697H，簡要詞典義 tsur: rock）。CT 原文字義給「火石」岩石、磐石，說火石是一種堅硬的石頭（結3:9），經磨利後有如金屬刀，可用來割除陽皮（出4:25）；GT《啟導本》說火石刀用燧石作成、色灰黑，為尚未結晶成六角形體寶石的粗糙礦石，原始民族因其鋒利用作矛頭、箭矢和剝獸皮的刀，而以色列人此時已在銅器時代仍用火石刀，或亦含有忌金屬之意（出20:25），此外也比金屬刀鋒利且衛生；GT《綜合解讀》另提一個可能：用火石刀是因為可以大批製作。GT《丁道爾聖經注釋》說最佳的解釋是一種黑曜石，並引米拉德指出古代近東許多地方都用黑曜石刀、用途廣泛，這種刀的刀面平滑銳利，即使在金屬刀發明之後仍然通用。BH 說火石能造出極鋒利的刃口，適合這項神聖禮儀。KC 說火石是人手造不出來的材料，是神使它可得的。'
  relation: 這是這件工具在聖經敘事裡第二次用於割禮，而本章四套來源都在同一個問題上打轉：已經有金屬刀了，為什麼還用石頭。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 割禮之約
  path: link_folder/神學/割禮之約.md
  summary: 第2至9節。CT 說以色列人是亞伯拉罕的後裔，神曾與亞伯拉罕立約，他們世世代代的男子都要受割禮，作為立約的證據，否則必從民中剪除（創17:9-14）；GT《綜合解讀》說神把割禮作為與亞伯拉罕和他後裔立約的證據，表明人與犯罪的舊生命隔絕、單單信靠神，而不受割禮就沒有資格守逾越節（出12:48），也沒有資格承受應許；GT《聖經精讀本》說割禮儀式之所以在曠野中斷是因為以色列對神的不順服（民14:26-35），如今中止了40年的割禮重新實行，神與以色列的立約關係也重新得到了恢復；GT《研經資料》說此時行割禮更重要的原因是為了重申神與他們列祖所立的約。BH 說這一代人受割禮公開標明他們是承受應許之地的立約子民。
  relation: 約已經在那裡，斷掉的是記號。本章不是重新立約，是把中斷四十年的記號補回去，然後才有資格守下一段的逾越節。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 4
    - 5
    definition: keep
    development: keep
- title: 割禮的意義
  path: link_folder/神學/割禮的意義.md
  summary: KC 把本章的割禮讀成對肉體的審判（西2:11），說我們要把死應用在自己的肉體上、看自己向它是死的（羅6:11）；它說火石是人手造不出來的材料、刀是把東西割去的器具，火石刀指出神對人罪性的審判（羅8:3），而我們用刀是在審判自己裡面肉體的每一個表現（西3:5）。KC 又引腓3:3「我們才是受割禮的」與羅2:28-29 心裡的割禮，說對我們而言這是內在的割禮，並說吉甲的功課是他們在割禮中學到自己裡面沒有能力。CT 說吉甲的原文字義含有對付肉體的情慾之意（西2:11），並在話中之光說這正如我們得救以後只有經過十字架的對付、經過「基督使你們脫去肉體情欲的割禮」，神才能自由地在人身上做工。
  relation: 這一層是註釋家從新約讀回來的，本章經文只記下神吩咐、約書亞照做、百姓等到痊癒。四套來源裡以 KC 走得最遠，CT 在靈意註解裡同向。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 「割禮」原文意義
  path: link_folder/原文/「割禮」原文意義.md
  summary: '第2、3、8節的「行割禮」在 STEP 顯示為兩個 Extended Strong：第2節的命令 mol 是 H4135B（簡要詞典義 ma.lal: to circumcise），第3節約書亞實際施行的 va/i.Ya.mol 是 H4135A（簡要詞典義 mul: to circumcise），第8節「都受完了割禮」的 le./hi.Mol 同為 H4135A 的 Niphal。CT 原文字義給「割禮」割禮、切除，並在文意註解註明原文是割陽皮；GT《綜合解讀》說「割禮」是割除男性包皮的禮儀；GT《研經資料》說這是以色列人象徵和神立約的儀式（創17:9-14；利12:3），未受割禮也不能守逾越節（出12:48-49）。'
  relation: 同一件事在三節裡出現三種語態——命令、施行、被施行，而 STEP 顯示第2節與第3節連 Extended Strong 都不同。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 1
    - 2
    definition: keep
    development: keep
- title: 古代近東割禮背景
  path: link_folder/背景/古代近東割禮背景.md
  summary: GT《約書亞記綜合解讀》在第2節列出周邊民族的作法：埃及、以東、亞捫、摩押和阿拉伯人都行割禮，但不是出生後第八天，而非利士、迦南、亞述、巴比倫則不行割禮。GT《啟導本》說火石刀用燧石作成，原始民族因其鋒利用作矛頭、箭矢和剝獸皮的刀，以色列人此時已在銅器時代仍用火石刀，或亦含有忌金屬之意（出20:25）；GT《丁道爾聖經注釋》引米拉德說古代近東許多地方都用黑曜石刀，用途廣泛，無論是在儀式中或在日常生活中都為人所愛用，即使在金屬刀發明之後仍然通用，並說這並不意謂約書亞所行的不是儀式，只是表明火石刀並不能否定此事。
  relation: 本章讓割禮這個記號在迦南門口重新出現，而 GT 列的名單正好說明它為什麼是記號：以色列即將進去的那幾族，恰恰是不行割禮的。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
    - 3
    - 4
    definition: keep
    development: keep
- title: 曠野飄流四十年
  path: link_folder/歷史/曠野飄流四十年.md
  summary: 第6節「以色列人在曠野走了四十年，等到國民，就是出埃及的兵丁，都消滅了，因為他們沒有聽從耶和華的話」，STEP 為 'ar.ba.'Im sha.Nah ha.le.Khu ... ba./mid.Bar（H705 加 H8141 加 H1980I 加 H4057B）。CT 說『沒有聽從耶和華的話』指他們聚集在一起抵擋神的命令、不肯進取迦南地（民14:1-2），『不容他們看見』意指他們必要死在曠野（民14:29、33、35）；GT《丁道爾聖經注釋》說這句話讓人憶起神對那一代的審判是因為他們的不信（民14:33-34），民數記雖記了好些不順服的例子，但只有第14章同時提到不順服與四十年的飄流；GT《聖經精讀本》說在加低斯事件之前受割禮之兵丁的年齡是20歲，過了38年他們的年齡應是58歲，因不順服全部死在曠野，只剩下約書亞與迦勒。BH 說四十年對應探子窺探那地的四十天，一天算一年。
  relation: 四十年在本章是用來解釋另一件事的：為什麼要行割禮。經文先說一整代人怎麼結束，才說下一代身上少了什麼記號。
  overview_review:
    signals:
    - first_in_book
    accumulation_count:
