    definition: keep
    development: keep
- title: 流奶與蜜之地
  path: link_folder/神學/流奶與蜜之地.md
  summary: 第6節「耶和華向他們列祖起誓、應許賜給我們的地，就是流奶與蜜之地」，STEP 為 'E.retz za.Vat cha.Lav u./de.Vash（H776G 加 H2100G zuv 加 H2461 加 H1706）。CT 說『流奶與蜜之地』指迦南地，形容其物產豐富；GT《研經資料》說埃及的文獻、烏加列史詩都提到迦南地是一個自然資源豐富、農產豐盛的地方，這話描繪迦南地有許多放牧之區（盛產奶）和顯花植物（蜜蜂採花成蜜）；BH 說奶與蜜描繪神為以色列預備的豐富供應，與曠野的貧瘠成對比，這地同時顯出神的慷慨與活在祂約下的福分。
  relation: 這一節是把應許當作判詞來用的：神起誓不容那一代看見這地。同一個描述，前面幾卷是盼望，這裡是他們沒能得到的東西。
  overview_review:
    signals:
