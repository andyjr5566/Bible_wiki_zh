- title: 亞摩利人
  path: link_folder/人物/亞摩利人.md
  summary: 第1節「約但河西亞摩利人的諸王」，STEP 為 mal.Khei ha./'e.mo.Ri（H4428G 加 H567）。CT 說亞摩利人身材高大「如香柏樹」（摩2:9），佔據約但河兩岸山區，先前河東二王已被以色列人征服（申1:4），與迦南人同為迦南七族中最強大的二族；BH 說亞摩利人佔據大部分山地，是迦南最強的民族之一，他們的王統治著以色列奉命要得的堅固城。GT《聖經精讀本》說出埃及後差到加低斯巴尼亞的十二個探子也曾報告過這些人的情況（民13:28-29），當時百姓聽了就甚懼怕，如今這些曾令以色列懼怕的迦南居民反倒陷入巨大的恐懼。
  relation: 本章第一節就把攻守的心理形勢寫完了：曾經讓探子回來嚇壞全營的那群人，這回是他們的心先化了。
  overview_review:
