    definition: keep
    development: keep
- title: 吉甲
  path: link_folder/地點/吉甲.md
  summary: '第9節「因此，那地方名叫吉甲，直到今日」與第10節「以色列人在吉甲安營」，STEP 為 gil.Gal（H1537G），同節的「滾去」是 ga.Lo.ti（H1556，簡要詞典義 ga.lal: to roll）。CT 原文字義給「吉甲」滾動、輪子；GT《研經資料》說這名字與希伯來文動詞「滾開(roll away)」(galal)發音相近；GT《丁道爾聖經注釋》說至於吉甲，則可能只是一個暫時的營區。KC 列出吉甲的五個特徵：那裡有從約但河取來的十二塊石頭紀念碑、是行割禮之處、在那裡第一次於應許之地守逾越節、割禮之後神在那裡賜下全新的食物、也在那裡遇見耶和華軍隊的元帥。BH 說吉甲成為以色列在應許之地的第一個主要營地，也是約書亞展開征服的起點。'
  relation: 上一章這地方只是「安營的地方」，本章它得到名字，而名字是神自己給的解釋——羞辱在這裡被滾去。
  overview_review:
    signals: []
    accumulation_count:
    - 2
    - 3
    definition: keep
