- title: 耶和華的使者是否為神顯現
  path: link_folder/解經爭議/耶和華的使者是否為神顯現.md
  summary: 第13至15節「耶和華軍隊的元帥」的身分，各家答案不一。CT 在文意註解裡加了備註：以人形顯現的神大概就是子神基督。GT《啟導本》並列幾種看法：有的解經家根據第15節的話認為這是神藉人形親自顯現，甚至有人解釋為道成肉身前的基督，但神也常常差遣天使，有的是統率天軍的天使長（但10:13；12:1）。GT《李道生舊約聖經問題總解》主張約書亞所看見的就是耶和華神自己的顯現，理由是他讓約書亞俯伏拜他、稱他為我主，又命約書亞脫鞋分別為聖。GT《綜合解讀》給出三條理由主張他很可能是道成肉身之前的聖子：脫鞋的命令與出3:5 完全相同、只有神同在的地方才是聖的、他接受了約書亞的敬拜而按十誡只有神配得敬拜。BH 說他的權柄與接受敬拜的舉動指向道成肉身前的基督。
  relation: 這一次與前幾處不同的地方在於，經文自己沒有稱他為「耶和華的使者」，稱謂是「耶和華軍隊的元帥」；各家判斷身分靠的是他接受敬拜與那句脫鞋的命令。
