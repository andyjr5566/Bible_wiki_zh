  summary: '第12節「他們吃了那地的出產，第二日嗎哪就止住了，以色列人也不再有嗎哪了。那一年，他們卻吃迦南地的出產」，STEP 為 va/i.yish.Bot ha./Man（H7673A，簡要詞典義 sha.vat: to cease，加 H4478A man）。CT 原文字義給「嗎哪」那是甚麼、「止住」停止，說嗎哪是以色列人在曠野四十年間所吃的主食（出16:31；民11:6）、從天隨露水降下（民11:9）、不須人工栽培，並說它突然消失無蹤也是一項神蹟奇事。GT《綜合解讀》說從出埃及當年的二月十六日一直到出埃及第四十一年的一月十五日神每天降下嗎哪；GT《聖經精讀本》說以色列百姓在汛曠野開始吃嗎哪（出16:15），過了40年之後在正月17日終止；GT《研經資料》說止降的時間是逾越節之後的第二日、正月十七，並記下另有學者認為吃土產的那日就是嗎哪止降的那日（把兩個「次日」當成同一天）。KC 說神在祂的護理中供應嗎哪直到不再需要為止，有了正常的供應神蹟就停下來。'
