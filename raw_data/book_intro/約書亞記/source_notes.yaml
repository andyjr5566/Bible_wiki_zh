book: 約書亞記
retrieved_on: 2026-09-11
note: >-
  這份檔案保存供書卷導論使用的正規化來源筆記，不是網頁全文鏡像。
  原頁全文由 crawl_book_introduction.py 依 source_manifest.yaml 取得；本檔只保留可追溯的事實、觀點與分歧。

sources:
  CT00:
    url: https://www.ccbiblestudy.org/Old%20Testament/06Josh/06CT00.htm
    notes:
      - 希伯來書名取自主角「約書亞」，字義為「耶和華是救恩／救主」，與希臘文「耶穌」同義同源。
      - 傳統作者歸屬約書亞，末了24:29-33約書亞之死常被視為祭司以利亞撒或非尼哈所補寫的「跋」；15章部分記錄在約書亞死後發生，可能屬後人補充。
      - 內容跨度約二十六年（約主前1451-1426年），地點涵蓋摩押平原與迦南全境。
      - 主旨闡明「神的信實與公義」：信實使以色列承受應許美地，公義使百姓在艾城因罪受挫、也討伐迦南各族的罪。
      - 本書在五經與十二卷歷史書間居承先啟後樞紐：五經若是「救出」，約書亞記則是「進入」並承受基業；更是舊約前先知書／歷史書系列開端。
      - 與新約互文：結構對照使徒行傳（結束前段並開展新群體）；屬靈爭戰與產業對照以弗所書的天上福氣與屬靈爭戰。
      - 鑰字包括「賜給」（natan）、「起來」、「往…去」、「盡行滅絕／毀滅」（herem）；鑰節為1:2-3、11:23、21:44-45。
  GT00:
    url: https://www.ccbiblestudy.org/Old%20Testament/06Josh/06GT00.htm
    notes:
      - 屬多來源合輯（收錄倪柝聲《聖經提要》、張向晨《聖經查經綱要》等），使用個別觀點時必須註明子來源。
      - 倪柝聲《聖經提要》將全書分為四大段：進入（1-5章）、征服（6-12章）、分配（13-22章）、告別（23-24章）；強調「迦南不是指死後天堂，而是進入與基督同死同復活的屬天生活，充滿屬靈爭戰與得勝」。
      - 強調全書是「完成神救贖的一卷書」：神救贖第一步是領百姓出埃及脫離為奴，第二步是領他們進迦南享受產業。
      - 提醒艾城之戰中「一人犯罪、全體受連累」的合一與聖潔教訓；吉甲割禮「輥去埃及羞辱」的分別為聖意義；以及未能完全趕出迦南人所留下的破口。
  KC0:
    url: https://www.kingcomments.com/en/bible-studies/Jos/0
    notes:
      - 與《申命記》緊密銜接：申命記以摩西之死結束，本書首句即以「摩西死了，現在你要起來」銜接歷史。
      - 約書亞年約85歲接任領袖，生於埃及奴役，原名何西阿（拯救），摩西為他改名約書亞（耶和華拯救）。
      - 回顧約書亞在五經中的受訓：出埃及記17章戰勝亞瑪力人、西乃山腰忍耐守候、會幕門前忠心服事、加低斯巴尼亞報信專心跟從。
      - 預表基督：摩西代表律法，律法不能領百姓進入安息與得勝；約書亞代表基督在聖靈裡引導信徒進入屬天福氣（對照以弗所書1:3、6:10-20）。
      - 分段：過約旦河（1-5）、征服全地（6-12）、分地為業（13-21）、二支派半回河東（22）、告別講詞與去世（23-24）。
  BH:
    url: https://biblehub.com/joshua/
    notes:
      - 主題定為「征服與定居」（Conquest and Settlement）；以書1:9「剛強壯膽」為主題金句。
      - 希伯來正典中屬於「前先知書」（Former Prophets）的第一卷，銜接妥拉（Torah）與王國歷史。
      - 歷史背景設定在晚期青銅時代／主前十三世紀左右，標誌著以色列從曠野遊牧轉向應許之地定居農耕的轉捩點。
      - 「聖經首見與起源」：首次踏乾地過約旦河、首位記載的外邦信徒喇合、首見「耶和華軍隊的元帥」之稱、首建逃城制度、示劍立石起誓「我和我家必定事奉耶和華」。
      - 原文關鍵語彙：herem（滅絕令／聖別歸神）、nachalah（產業）、menuchah（安息）；希伯來書3-4章進一步發揮本書安息神學。
  BIBLEPROJECT:
    url: https://bibleproject.com/guides/book-of-joshua/
    notes:
      - 文學結構四部曲：1-5章進地、6-12章爭戰、13-22章分地、23-24章告別與忠心呼召。
      - 刻意將約書亞塑造為「新摩西」：重申律法、打發探子、過約旦河如過紅海、新世代受割禮守逾越節。
      - 5章遇見「耶和華軍隊的元帥」是關鍵轉折：當約書亞問「你是幫助我們還是仇敵」，元帥回答「不是」，表明不是神站在人這邊，而是人是否站在神那邊；這場戰爭本質上是神的爭戰。
      - 耶利哥與艾城形成鮮明對比：耶利哥是全然信靠神的奇蹟之勝，艾城是亞干私藏當滅之物而帶來的慘敗；表明得地不是靠軍力，乃在於對約的忠心。
      - 針對暴力與戰役提出古代近東文學脈絡：征服經文使用古代戰爭敘事的「修辭性誇張」（hyperbole，如「盡行殺滅、沒有留下一個」），並非現代定義的種族滅絕；迦南人仍有悔改跟從者（喇合、基遍人），且迦南宗教的極端道德腐敗（如獻兒女為祭）是神審判的主因。
  ENTER_THE_BIBLE:
    urls:
      - https://enterthebible.org/courses/joshua/
    notes:
      - 現代學術框架：將約書亞記視為「申命記歷史」（Deuteronomistic History, DH；約書亞記至列王紀下）的第一卷。
      - 成書研究模型：由申命史編輯者（Deuteronomist）收集早期戰事故事、土地邊界行政清單與病因學傳說（反覆出現「直到今日」）；常見學術模型主張約西亞王宗教改革時期（主前7世紀後期）形成初版，並在巴比倫被擄期（主前6世紀）完成最終編整。
      - 神學核心：以申命記的神學標準審視以色列歷史——獨尊耶和華、守約得福、背約受罰；得地純粹是神的恩典與信實成就，而非以色列人的功勞。
      - 詮釋反思：正視文本中的土地奪取與暴力敘事，指出被擄時期的讀者在失去土地的困境中，藉本書重溫神賜地之約與順服律法的重要性。
  YALE:
    urls:
      - https://yalebiblestudy.org/courses/joshua-and-judges/
    notes:
      - 由 Joel Baden 與 John Collins 主講；探討征服敘事的歷史與道德兩大問題。
      - 歷史與考古層面：迦南定居的歷史實況比聖經濃縮的全面閃電戰更複雜；考古學顯示許多城邑的毀滅層年代不一，學界提出和平滲透、農民起義或內部社會變遷等多種歷史重建模型。
      - 儀式性爭戰與滅絕令（herem）：耶利哥圍城圍繞約櫃、祭司與吹角，是高度儀式化的宗教行動；herem 是將戰利品與城邑全然奉獻歸給神，但也帶來尖銳的倫理張力。
      - 喇合的敘事功能：在全面毀滅的框架中，外邦妓女喇合因信得救並融入以色列，打破了絕對民族主義的界限，展現正典敘事內部的豐富張力。

cross_source_synthesis:
  strong_consensus:
    - 《約書亞記》是舊約前先知書／歷史書的第一卷，也是摩西五經應許成就（進入迦南、得地為業）的不可或缺關鍵。
    - 書名源自主角約書亞（希伯來名「耶和華是救主」，與「耶穌」同名），全書以他的領導、得地爭戰、分派產業與末了勸勉為主軸。
    - 宏觀結構一致清晰：1-5章渡河與預備、6-12章戰勝迦南諸王、13-21章分配土地與設立逃城、22-24章河東支派歸回、約書亞告別講詞與示劍立約更新。
    - 神的信實是全書最大基石：向列祖起誓賜地的應許「一句也沒有落空，都應驗了」（21:45）；得地不是以色列人的軍力成就，而是神的恩典與作為。
    - 耶利哥（信靠順服神蹟）與艾城（亞干犯罪受罰）的對照，確立了「得地在於忠於聖約」的核心神學命題。
  disputed_or_layered:
    - topic: 作者歸屬
      traditional: 傳統猶太與教會觀點視約書亞為主要作者，末了去世敘事（24:29-33）及部分死後地名補記由祭司以利亞撒或非尼哈補寫。
      academic: 現代學術多視為「申命記歷史」（DH）的組成部分，由編者匯整早期戰役故事、部族邊界名單與傳統資料，於王國晚期（約西亞時代）及被擄期歷經編修。
      writing_rule: 清楚分開傳統作者歸屬與現代成書模型，不將歷史背景與成書演變簡化為單一答案。
    - topic: 征服歷史與修辭風格
      traditional: 強調按經文記載的七年全面軍事征服。
      academic: 指出經文內部同時存在「奪了那全地」（11:23）與「還有許多未得之地」（13:1）的張力；古代近東軍事記敘常使用戰勝誇飾修辭（hyperbole）；考古研究對各城陷落年代存在多種歷史重建。
      writing_rule: 呈現聖經敘事本身的文學特性（以戰事總結與未得之地並陳），說明古代戰爭修辭，兼顧傳統讀法與學術洞察。
    - topic: 滅絕令（herem）與聖戰倫理
      traditional: 將滅絕視為神對迦南罪惡（淫亂、獻兒女為祭）的公義審判，並防範以色列人被引誘隨從偶像。
      academic: 探討古代近東「奉獻毀滅令」的宗教背景與現代道德倫理困境，強調喇合與基遍人的例外展現了信心與恩典超越民族界限。
      writing_rule: 正視讀者在面對暴力敘事時的真實困惑，結合聖約審判、古代文學修辭與恩典例外客觀陳述各家觀點。
