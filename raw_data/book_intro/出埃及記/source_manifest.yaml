  BH:
    family: biblehub
    role: commentary
    label: BibleHub Exodus Summary and Study Bible
    url: https://biblehub.com/exodus/
    expected_fields: [Theme, Summary, Title and Author, Historical Context, Audience and Purpose, Genre and Style, Structure and Content]
    family_rule: BibleHub 內部即使引用多個底層資源，仍只算一個 BH 來源維度。
  BIBLEPROJECT:
    family: bibleproject
    role: literary_design
    label: BibleProject Exodus Guide
    url: https://bibleproject.com/guides/book-of-exodus/
    expected_fields: [1–18 與 19–40 的大結構, 拯救與立約, 金牛犢危機, 會幕與神同住]
