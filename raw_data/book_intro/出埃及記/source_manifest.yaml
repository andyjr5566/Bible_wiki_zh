      - https://enterthebible.org/courses/exodus/lessons/introductory-issues-in-exodus
      - https://enterthebible.org/courses/exodus/lessons/theological-themes-in-exodus/
    expected_fields: [Summary, Outline, Background, 多階段成書研究, 法律類型, 神學主題]
  YALE:
    family: yale_bible_study
    role: academic_context
    label: Yale Bible Study — Exodus Introduction
    url: https://yalebiblestudy.org/courses/exodus/lessons/introduction-study-guide/
