book: 創世記
book_folder: 01 創世記
prototype: true
retrieved_on: 2026-09-06

principles:
  commentary_vote_sources: [CT00, GT00, KC0, BH]
  external_context_sources: [BIBLEPROJECT, ENTER_THE_BIBLE, YALE]
  note: >-
    CT00、GT00、KC0、BH 延續專案既有四套註釋來源的角色；BibleProject、
    Enter the Bible、Yale 用於文學結構、歷史背景與學術觀點補強，不加入「四家一致」票數。
    作者與年代若有分歧，分開記錄「傳統歸屬／成書模型／最終文本」而不強行裁決。

sources:
  CT00:
    family: ccbiblestudy
    role: commentary
    label: CCBibleStudy 創世記提要（CT00）
    url: https://www.ccbiblestudy.org/Old%20Testament/01Gen/01CT00.htm
    expected_fields:
      - 書名
      - 作者
      - 寫作時地
      - 主旨要義
      - 寫作動機
      - 本書重要性
      - 本書特點
      - 與其他書卷關係
      - 鑰節與鑰字
      - 內容大綱

  GT00:
    family: ccbiblestudy
    role: commentary
    label: CCBibleStudy 創世記導論拾穗（GT00）
    url: https://www.ccbiblestudy.org/Old%20Testament/01Gen/01GT00.htm
    expected_fields:
      - 書名與簡介
      - 作者與五經作者討論
      - 全書內容與十個 toledot 結構
      - 多家導論／研讀本意見
    provenance_rule: >-
      GT00 是多來源合輯；萃取時要保留內部分來源名稱，不能把合輯中的單一觀點寫成「GT 一致認為」。

  KC0:
    family: kingcomments
    role: commentary
    label: KingComments Genesis Introduction
    url: https://www.kingcomments.com/en/bible-studies/Gen/0
    expected_fields:
      - 傳統作者與年代
      - Bereshith / Genesis 書名
      - 「起源」主題
      - 全書神學與人物結構

  BH:
    family: biblehub
    role: commentary
    label: BibleHub Genesis Summary and Study Bible
    url: https://biblehub.com/genesis/
    expected_fields:
      - Theme / Summary
      - Title and Author
      - Historical Context
      - Audience and Purpose
      - Genre and Style
      - Structure and Content
      - book statistics
    family_rule: BibleHub 內部即使引用多個底層資源，仍只算一個 BH 來源維度。

  BIBLEPROJECT:
    family: bibleproject
    role: literary_design
    label: BibleProject Genesis Guide
    url: https://bibleproject.com/guides/book-of-genesis/
    expected_fields:
      - 1–11 / 12–50 兩大段
      - 12:1-3 作為轉折樞紐
      - 創造、人的失敗、神的信實與祝福萬國
      - 全書與聖經大故事的關係

  ENTER_THE_BIBLE:
    family: luther_seminary
    role: academic_context
    label: Enter the Bible — Genesis course
    urls:
      - https://enterthebible.org/courses/genesis/
      - https://enterthebible.org/courses/genesis/lessons/summary-of-genesis/
      - https://enterthebible.org/courses/genesis/lessons/outline-of-genesis/
      - https://enterthebible.org/courses/genesis/lessons/background-of-genesis/
      - https://enterthebible.org/courses/genesis/lessons/introductory-issues-in-genesis/
      - https://enterthebible.org/courses/genesis/lessons/theological-themes-in-genesis/
    expected_fields:
      - Summary / Outline / Background
      - 傳統摩西歸屬與現代多階段成書觀
      - 古代近東洪水材料
      - 歷史與文學閱讀問題
      - 祝福、約、揀選、創造、兄弟衝突等主題

  YALE:
    family: yale_bible_study
    role: academic_context
    label: Yale Bible Study — Genesis Introduction
    url: https://yalebiblestudy.org/courses/genesis/lessons/genesis-introduction-study-guide/
    expected_fields:
      - 1–11 / 12–36 / 37–50 三段文類差異
      - 古代近東平行材料
      - J/E/P 等來源模型作為學術史與文本形成觀點
      - 族長故事的歷史背景與閱讀限制
